  "afb5835fc164564e2ba2ce9d73362bfe":
    "id": "afb5835fc164564e2ba2ce9d73362bfe"
    "title": "Email threat landscape: Q3 2026 trends and insights"
    "link": "https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"
    "published": "2026-11-06 01:00:00"
    "fetched": "2026-11-06 05:51:32"
    "summary": "<p>Microsoft Threat Intelligence observed a sharp rise in email-based phishing activity at the end of Q3 2026 (July – September), even as QR code phishing declined, CAPTCHA-gated phishing recovered, and malicious messages spoofing familiar business-service sender domains exposed risks associated with security overrides.</p>\n<p>The post <a href=\"https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/\">Email threat landscape: Q3 2026 trends and insights</a> appeared first on <a href=\"https://www.microsoft.com/en-us/security/blog\">Microsoft Security Blog</a>.</p>"
  "e659926b8526392604a0e0ebc92a7272":
    "id": "e659926b8526392604a0e0ebc92a7272"
    "title": "Threat actors use agentic AI tooling to find and abuse exposed secrets"
    "link": "https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/"
    "published": "2026-11-06 08:46:50"
    "fetched": "2026-11-06 17:38:43"
    "summary": "<p>Microsoft Threat Intelligence has observed threat actors using the agentic offensive security framework ARTEX to search GitHub for OAuth application secrets, which can be used to compromise the associated OAuth application and perform authenticated actions in the application’s tenant. Agents operating on behalf of threat actors then used the compromised OAuth applications to perform a variety of subsequent actions within compromised organizations.</p>\n<p>The post <a href=\"https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/\">Threat actors use agentic AI tooling to find and abuse exposed secrets</a> appeared first on <a href=\"https://www.microsoft.com/en-us/security/blog\">Microsoft Security Blog</a>.</p>"
