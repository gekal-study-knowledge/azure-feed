    "title": "Sync Without Shared Secrets: Managed Identity for ACR Connected Registry"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/sync-without-shared-secrets-managed-identity-for-acr-connected/ba-p/4569415"
    "published": "2026-11-06 04:09:06"
    "fetched": "2026-11-06 10:14:02"
    "summary": "<p><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/intro-connected-registry\" rel=\"noopener\" target=\"_blank\">Connected Registry</a> is a feature of Azure Container Registry (ACR) that provides an on-premises or remote replica, synchronizing container images and other OCI artifacts with a cloud-based registry. It gives local workloads nearby access to those artifacts, including in environments with limited or intermittent cloud connectivity.</p>\n<p>With this private preview, Connected Registry deployments on <a href=\"https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/overview\" rel=\"noopener\" target=\"_blank\">Azure Arc-enabled Kubernetes</a> can use a <strong>user-assigned managed identity</strong> to authenticate synchronization through Microsoft Entra ID. Teams can manage repository access through Azure role-based access control (RBAC) with attribute-based access control (ABAC) conditions,&nbsp;<strong>without provisioning or rotating a shared synchronization password</strong>.</p>\n<p>Managed identity is an additional authentication option. Existing sync-token deployments, with repository access defined by scope maps, continue to work unchanged.</p>\n<h3 id=\"mcetoc_1k6da5apg_1\">Introducing managed identity for synchronization</h3>\n<p>The preview is available only for Connected Registry deployed on <strong>Azure Arc-enabled Kubernetes distributions that support Azure Workload Identity</strong>. With this option:</p>\n<ul>\n<li><strong>No shared synchronization password.</strong> The connection string carries the identity's client ID, an identifier rather than a secret, so there's no customer-managed sync password to provision, distribute, or rotate.</li>\n<li><strong>Automatic token management.</strong> Connected Registry obtains short-lived Microsoft Entra access tokens and handles registry token exchange and refresh for you.</li>\n<li><strong>Familiar access management.</strong> You grant synchronization access with Azure role assignments, the same model you use for other Azure resources.</li>\n<li><strong>Repository-level control.</strong> ABAC conditions can restrict access to individual repository names or prefixes. The identity's effective permissions determine which repositories are eligible for synchronization.</li>\n</ul>\n<p>For organizations that limit the use of long-lived shared secrets, this brings Connected Registry synchronization into the identity-based model they already use across Azure.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; height: 188px; border-width: 1px;\"><colgroup><col style=\"width: 33.3333%;\" /><col style=\"width: 33.3333%;\" /><col style=\"width: 33.3333%;\" /></colgroup><tbody><tr style=\"height: 59px;\"><td style=\"height: 59px;\">&nbsp;</td><td style=\"height: 59px;\"><strong>Sync token</strong></td><td style=\"height: 59px;\"><strong>Managed identity (preview)</strong></td></tr><tr style=\"height: 59px;\"><td style=\"height: 59px;\">\n<p>Authentication</p>\n</td><td style=\"height: 59px;\">\n<p>ACR sync token</p>\n</td><td style=\"height: 59px;\">\n<p>User-assigned managed identity through Microsoft Entra ID</p>\n</td></tr><tr style=\"height: 35px;\"><td style=\"height: 35px;\">\n<p>Connection string carries</p>\n</td><td style=\"height: 35px;\">\n<p>Sync token password</p>\n</td><td style=\"height: 35px;\">\n<p>Identity's client ID (not a secret)</p>\n</td></tr><tr style=\"height: 35px;\"><td style=\"height: 35px;\">\n<p>Repository permissions</p>\n</td><td style=\"height: 35px;\">Scope map</td><td style=\"height: 35px;\">\n<p>Azure RBAC role assignment with ABAC conditions</p>\n</td></tr></tbody></table></div>\n<p>Both options support repository scoping; they differ in how synchronization authenticates and where you manage its permissions. Only synchronization with the parent registry changes. TLS certificate requirements and local client access stay the same, and Docker, ORAS, and other OCI clients continue to use the Connected Registry's client tokens.</p>\n<h3 id=\"mcetoc_1k6da5apg_2\">How it works</h3>\n<p>Authentication relies on a federated trust between the Kubernetes workload and Microsoft Entra ID. You add a federated identity credential to a user-assigned managed identity, trusting your Arc cluster's OIDC issuer and the Kubernetes service account used by the Connected Registry extension.</p>\n<img />\n<p>At runtime, <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/conceptual-workload-identity\" rel=\"noopener\" target=\"_blank\">Azure Workload Identity</a> lets the Connected Registry workload exchange its Kubernetes service account token for a short-lived Microsoft Entra access token.&nbsp;Connected Registry uses that token to authenticate to its parent registry and obtain the registry tokens it needs for synchronization. Token acquisition and refresh happen automatically.</p>\n<h3 id=\"mcetoc_1k6da5apg_3\">Choose what each Connected Registry deployment synchronizes</h3>\n<p>Connected Registry deployments that share a parent registry often need different subsets of its repositories. For example, a deployment serving Team A's applications might need repositories whose names start with <em><span class=\"lia-text-color-15\">team-a/frontend/</span></em> or <em><span class=\"lia-text-color-15\">team-a/backend/</span></em>, while repositories under <em><span class=\"lia-text-color-15\">team-b/frontend/</span></em>&nbsp;stay outside its synchronization scope.</p>\n<p>For a ReadOnly Connected Registry, assign its managed identity the <strong>Container Registry Connected Registry Sync Reader</strong> role on the parent registry, with an ABAC condition that permits repository names starting with either <span class=\"lia-text-color-15\"><em>team-a/frontend/</em></span> or <span class=\"lia-text-color-15\"><em>team-a/backend/</em></span>. For a ReadWrite Connected Registry, use <strong>Container Registry Connected Registry Sync Contributor</strong> with the same repository-prefix restrictions. Include the trailing slash so a prefix such as&nbsp;<span class=\"lia-text-color-15\"><em>team-a/frontend/</em></span> doesn't also match a sibling namespace such as <span class=\"lia-text-color-15\"><em>team-a/frontend-legacy/</em></span>.</p>\n<img />\n<p><strong>The identity's effective permissions define the synchronization scope.</strong> Permissions are additive, so review every role assignment the identity holds, including inherited ones. A sync role assigned at the parent registry without an ABAC condition grants repository permissions for all of its repositories, and a restrictive condition on one assignment doesn't cancel broader access granted by another.</p>\n<p><strong>Configure permissions before deploying the extension. </strong>When role assignments and ABAC conditions are in place and have propagated before you install the Connected Registry extension on Arc, Connected Registry discovers its synchronization scope during initial synchronization. No additional manual resync is needed for that initial setup.</p>\n<p><strong>Resync after changing permissions on a running deployment.</strong> If you later update the managed identity's role assignments or ABAC conditions in a way that changes synchronization scope, run <span class=\"lia-text-color-15\"><em>az acr connected-registry resync</em></span> so the running Connected Registry rediscovers which repositories to synchronize. Repository operations remain subject to runtime authorization by the parent registry. Narrowing permissions alone doesn't remove artifacts that have already synchronized to the Connected Registry.</p>\n<h3 id=\"mcetoc_1k6da5apg_4\">Try the private preview</h3>\n<p>The private preview is intended for evaluation in non-production environments. To get started, you need:</p>\n<ul>\n<li>A Premium parent registry in ABAC-enabled repository permissions mode, with its dedicated data endpoint enabled.</li>\n<li>An Azure Arc-enabled Kubernetes distribution that supports Azure Workload Identity. Arc connectivity alone isn't sufficient.</li>\n<li>One user-assigned managed identity, with a federated identity credential and a Connected Registry sync role assignment.</li>\n<li>Preview approval for your subscription.</li>\n</ul>\n<p>The preview supports Connected Registries whose parent is the cloud registry and that have no child Connected Registries. The managed identity binding can't be changed after it's set, so choose the identity you intend to keep.</p>\n<p>You can deploy a new Connected Registry with managed identity or migrate an eligible sync-token deployment. <strong>Migration is one-way and requires an offline maintenance window.</strong></p>\n<p>&nbsp;</p>\n<p><strong>Ready to evaluate it?</strong> The <strong><a class=\"lia-external-url\" href=\"https://aka.ms/acr/connectedregistrymi\" rel=\"noopener\" target=\"_blank\">private preview setup guide</a></strong> walks through requesting access, configuring the resources, deploying or migrating, and validating synchronization. As you try it, share your feedback on the setup experience and the repository permission model through the channels listed in the guide.</p>\n<h3 id=\"mcetoc_1k6da5apg_5\">Resources</h3>\n<ul>\n<li>\n<p><a class=\"lia-external-url\" href=\"https://aka.ms/acr/connectedregistrymi\" rel=\"noopener\" target=\"_blank\">Managed identity for Connected Registry: private preview setup guide</a></p>\n</li>\n<li>\n<p><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/container-registry/intro-connected-registry\" rel=\"noopener\" target=\"_blank\">Connected Registry overview</a></p>\n</li>\n<li>\n<p><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/conceptual-workload-identity\" rel=\"noopener\" target=\"_blank\">Azure Workload identity federation in Azure Arc-enabled Kubernetes</a></p>\n</li>\n<li>\n<p><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/workload-identity\" rel=\"noopener\" target=\"_blank\">Deploy and configure workload identity federation in Azure Arc-enabled Kubernetes</a></p>\n</li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions\" rel=\"noopener\" target=\"_blank\">Azure Container Registry RBAC and ABAC repository permissions</a></li>\n</ul>"
