    "title": "Introducing Azure Durable Task for Pydantic AI agents"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/introducing-azure-durable-task-for-pydantic-ai-agents/ba-p/4571024"
    "published": "2026-11-16 22:00:00"
    "fetched": "2026-11-17 10:11:48"
    "summary": "<p>Pydantic AI agents can now use&nbsp;<strong>Azure Durable Task Scheduler</strong> to preserve progress across worker restarts, recover interrupted runs, and wait for human approval without keeping an activity running.</p>\n<p>The <a href=\"https://pydantic.dev/docs/ai/harness/azure-durable-task/\" rel=\"noopener\" target=\"_blank\">new Azure Durable Task integration</a> brings durable execution to your existing Pydantic AI agents. Add a capability to the agent, call it from a Durable Task orchestrator, and let the runtime handle recovery.</p>\n<p>That means a deployment or worker crash does not have to turn an almost-finished agent run into another full round of model requests. Your agent already did the work. It should not need a motivational speech to remember it.</p>\n<h2>What this means for your application</h2>\n<p><strong>Keep the progress you have paid for.</strong> Completed model responses and tool results are recorded durably. Recovery reuses those recorded results instead of repeating the same calls and spending tokens again. Work interrupted before its result is recorded can execute again.</p>\n<p><strong>Recover from transient failures.</strong> Configure retry policies for model requests and tool calls, and let the runtime perform those retries automatically. You choose the policy rather than building retry loops around every step.</p>\n<p><strong>Keep people in control.</strong> An agent can prepare a proposal, pause for hours or days for approval, and continue when the decision arrives. No activity execution is held open during the wait. Worker hosting and infrastructure charges still depend on your deployment.</p>\n<p><strong>Coordinate more than one agent.</strong> Use Durable Task workflows to combine specialist agents, sequence their work, and bring their results together. The integration makes their agent runs durable; you decide how they collaborate.</p>\n<p>For tools that change external systems, such as creating an order, keep those operations idempotent. Durable recovery does not guarantee exactly-once side effects.</p>\n<h2>Add durability without rewriting your agent</h2>\n<p>A Pydantic AI <a href=\"https://pydantic.dev/docs/ai/core-concepts/capabilities/\" rel=\"noopener\" target=\"_blank\">Capability</a> is a reusable extension that adds behavior to an agent, such as tools, instructions, or lifecycle hooks. <strong>Durability ships as a Capability, not a replacement agent framework.</strong></p>\n<p>Attach <code>AzureDurableTaskDurability</code> through <code>capabilities=[durability]</code>. By default, model requests, function-tool calls, and MCP calls become checkpointed Durable Task activities. You do not rewrite your prompts or existing tool functions as workflow steps.</p>\n<p>Here is the core change, adapted from the <a href=\"https://pydantic.dev/docs/ai/harness/azure-durable-task/#run-locally\" rel=\"noopener\" target=\"_blank\">Pydantic AI quickstart</a>:</p>\n<pre class=\"language-python\" contenteditable=\"false\" tabindex=\"0\"><code>import os\n\nfrom pydantic_ai import Agent\nfrom pydantic_ai_harness.azure_durable_task import (\n    AzureDurableTaskDurability,\n    run_durable,\n)\n\ndurability = AzureDurableTaskDurability()\nagent = Agent(\n    os.environ['PYDANTIC_AI_MODEL'],\n    name='support_agent',\n    capabilities=[durability],\n)\n\n\ndef support(ctx, prompt):\n    result = yield from run_durable(ctx, lambda: agent.run(prompt))\n    return result.output\n</code></pre>\n<p>Your model, instructions, and tools stay in Pydantic AI. The complete quickstart registers the agent's bound capability on a worker and adds a client to schedule this orchestrator. This uses the standalone Durable Task Python SDK, without needing an Azure Functions app.</p>\n<h2>Try it locally, then connect to Azure</h2>\n<p>Use Python 3.11 or later and install the integration. This example includes the OpenAI provider:</p>\n<pre class=\"language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>pip install \"pydantic-ai-harness[azure-durable-task]&gt;=0.66.0\" \"pydantic-ai-slim[openai]\"\n</code></pre>\n<p>With Docker running, start the Durable Task Scheduler emulator:</p>\n<pre class=\"language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>docker run --rm --pull=always --name dts-emulator -p 127.0.0.1:8080:8080 -p 127.0.0.1:8082:8082 mcr.microsoft.com/dts/dts-emulator:latest\n</code></pre>\n<p>Set <code>OPENAI_API_KEY</code> securely and set <code>PYDANTIC_AI_MODEL</code> to an accessible model in <code>openai:&lt;model-id&gt;</code> format. Follow the <a href=\"https://pydantic.dev/docs/ai/harness/azure-durable-task/#run-locally\" rel=\"noopener\" target=\"_blank\">complete local example</a> to start the worker and schedule a run.</p>\n<h2>See what your agent actually did</h2>\n<p>The emulator exposes the SDK on port <code>8080</code> and the <strong>DTS Dashboard</strong> at <code>http://localhost:8082</code>. Enable auto-refresh to watch orchestration instances move through statuses such as <code>Pending</code>, <code>Running</code>, <code>Completed</code>, or <code>Failed</code>.</p>\n<p>Open an instance's timeline to see the individual model, tool, and MCP activities created by the capability. Select a step to inspect its inputs and outputs, and use the timeline and history to examine duration and retry attempts. You can see which operation failed without reconstructing the conversation from logs.</p>\n<p>For these screenshots, I extended the quickstart with a <code>lookup_order</code> tool and ran it against a freshly pulled <code>latest</code> emulator with the redesigned dashboard. A deterministic <code>FunctionModel</code> supplies the model responses, and the order data is synthetic, so no external model API key is needed. The scheduler execution and dashboard captures are real.</p>\n<p><img alt=\"DTS Dashboard showing the completed support_workflow orchestration, two model request activities, and the tool activity with their durations.\" src=\"data:image/png;base64,\" /></p>\n<p><em>The completed <code>support_workflow</code>: two <code>support_agent__model.request</code> activities around a function-tool activity.</em></p>\n<p><img alt=\"DTS Dashboard tool activity details showing lookup_order receiving ORD-1042 and returning the order's shipping information.\" src=\"data:image/png;base64,\" /></p>\n<p><em>Open the tool step to see <code>lookup_order</code> receive <code>ORD-1042</code> and return its shipping details. This run completed normally; it does not demonstrate retries or crash recovery.</em></p>\n<p>When you are ready for Azure, use the Azure-managed worker and client with <code>DefaultAzureCredential</code>. Open the same <a href=\"https://learn.microsoft.com/en-us/azure/durable-task/scheduler/durable-task-scheduler-dashboard\" rel=\"noopener\" target=\"_blank\">DTS Dashboard experience</a> from your task hub in the Azure portal, with the required dashboard access. Your agent and orchestrator stay the same. The <a href=\"https://pydantic.dev/docs/ai/harness/azure-durable-task/#deploy-to-azure-durable-task-scheduler\" rel=\"noopener\" target=\"_blank\">deployment guide</a> covers scheduler setup and permissions; deploy your worker compute separately.</p>\n<p><strong>Start with the agent you already have.</strong> Add durable execution where a restart would otherwise lose useful work, then build in the retries, approvals, and specialist coordination your application needs.</p>\n<p>Get started with the <a href=\"https://pydantic.dev/docs/ai/harness/azure-durable-task/\" rel=\"noopener\" target=\"_blank\">Pydantic AI Azure Durable Task guide</a>.</p>"
