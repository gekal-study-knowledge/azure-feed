"entries":
  "98358baa3deea76bf42b9fb051352764":
    "id": "98358baa3deea76bf42b9fb051352764"
    "title": "Building Secure, Ephemeral GitHub Actions Runners\non Azure Container Apps"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/building-secure-ephemeral-github-actions-runners-on-azure/ba-p/4569209"
    "published": "2026-11-01 16:35:00"
    "fetched": "2026-11-01 22:56:41"
    "summary": "<p>&nbsp;</p>\n<p><strong>A practical architecture using KEDA autoscaling, GitHub App authentication, private Key Vault access, Microsoft Container Registry, and GitHub OIDC</strong></p>\n<p><em>Implementation guide and field learnings</em></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>What this architecture delivers</strong></p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>A repository-scoped runner that exists only for one workflow</strong></p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Automatic scale-from-zero with an Azure Container Apps Event Job and KEDA</strong></p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>GitHub App authentication instead of a personal access token</strong></p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Private secret retrieval using a managed identity, private endpoint and private DNS</strong></p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Secretless Azure deployment from workflows through GitHub OIDC</strong></p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>No customer-managed Azure Container Registry for the runner image</strong></p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p><strong>This article focuses on the final event-driven architecture and the implementation decisions that made it secure, repeatable and useful for real infrastructure workflows.</strong></p>\n<h1>Why this pattern?</h1>\n<p>GitHub-hosted runners are the simplest option for many teams, but some workflows need private network access, organization-approved tooling or tighter control over the execution boundary. Long-running self-hosted virtual machines solve those needs, but introduce patching, capacity planning and idle cost.</p>\n<p>Azure Container Apps Jobs provide a serverless execution boundary for finite tasks. With the KEDA GitHub runner scaler, an execution can start when a matching workflow is queued, register one ephemeral runner, process one job and terminate. Setting the minimum execution count to zero preserves scale-to-zero when the queue is empty.</p>\n<p>The important design work begins around that lifecycle: how the runner image is prepared, how GitHub is authenticated, where secrets are stored, how private access is enforced, and which identity is allowed to deploy Azure resources.</p>\n<h1>Reference architecture</h1>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Figure 1. End-to-end event-driven architecture and trust boundaries.</p>\n<p>A matching GitHub Actions workflow enters the queue. The KEDA github-runner scaler polls GitHub using GitHub App authentication and starts an Azure Container Apps Event Job when the queue length reaches the configured target.</p>\n<p>The event job pulls a Microsoft-maintained base image from Microsoft Container Registry. At startup, the container installs or verifies the required toolchain, obtains GitHub App material from a private Azure Key Vault, generates short-lived GitHub credentials and registers a repository-level ephemeral runner.</p>\n<p>The workflow executes on that runner. When Azure access is needed, the workflow obtains a GitHub OIDC token and exchanges it through a federated credential on a separate Microsoft Entra deployment identity. Azure RBAC limits that identity to the intended deployment scope.</p>\n<p>After one workflow, the runner exits and the Container Apps job completes. With no remaining matching work, the solution returns to zero executions.</p>\n<h1>Secure authentication flow</h1>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Figure 2. Private secret retrieval and short-lived GitHub token exchange.</p>\n<ol>\n<li><strong>Queue detection: </strong>KEDA queries GitHub for jobs matching the configured owner, repository and label.</li>\n<li><strong>Job startup: </strong>Azure Container Apps starts one event-job execution for eligible queue demand, subject to the configured maximum executions.</li>\n<li><strong>Private secret retrieval: </strong>The job authenticates with its user-assigned managed identity. Private DNS resolves the vault hostname to the private endpoint, and Key Vault returns only the permitted GitHub App secrets.</li>\n<li><strong>GitHub App JWT: </strong>The bootstrap signs a short-lived RS256 JWT with the GitHub App private key.</li>\n<li><strong>Installation token: </strong>The JWT is exchanged for an installation access token scoped to the installed GitHub App.</li>\n<li><strong>Runner registration token: </strong>The installation token requests a repository-level runner registration token.</li>\n<li><strong>Ephemeral registration: </strong>The runner is configured unattended, with updates disabled for that execution, an explicit custom label and ephemeral mode.</li>\n<li><strong>Credential cleanup: </strong>Temporary private-key files, JWTs and bootstrap tokens are removed before workflow code begins wherever possible.</li>\n<li><strong>One workflow: </strong>The runner accepts one matching job, reports the result, deregisters and exits.</li>\n<li><strong>Scale to zero: </strong>The Container Apps execution completes; no idle runner remains.</li>\n</ol>\n<h1>MCR runtime bootstrap versus a pre-baked image</h1>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Figure 3. Image strategy trade-offs. Both options are valid; choose by operating requirements.</p>\n<p>This implementation intentionally pulls a Microsoft base image from MCR and installs the required tools when the job starts. That removes Azure Container Registry, an image build pipeline and registry access configuration from the runner platform.</p>\n<p>The cost of that simplification is startup latency. A pre-baked image can begin runner registration almost immediately because Git, Terraform, PowerShell and the GitHub runner are already present. Runtime bootstrap must download and install missing components before the runner becomes available. The observed delay will vary with image-pull time, package endpoint latency, tool size and regional network conditions, so measure queue-to-ready time with representative workflows rather than relying on a generic estimate.</p>\n<p>Runtime bootstrap also introduces external dependencies. If a package repository, GitHub release endpoint or download source is unavailable, the runner cannot become ready. Pin versions, validate downloads, use bounded retries and record each bootstrap phase in logs.</p>\n<p>A pre-baked image is preferable when startup time is strict, workflows run frequently, software must be scanned before execution, or image promotion and rollback are required. The MCR-plus-bootstrap model is attractive when the goal is to avoid a dedicated registry and custom image lifecycle, while accepting additional cold-start time.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td>\n<p><strong>Decision factor</strong></p>\n</td><td>\n<p><strong>MCR + runtime bootstrap</strong></p>\n</td><td>\n<p><strong>Pre-baked image + ACR</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p><strong>Ready time</strong></p>\n</td><td>\n<p>Higher cold-start latency</p>\n</td><td>\n<p>Typically faster</p>\n</td></tr><tr><td>\n<p><strong>Artifact control</strong></p>\n</td><td>\n<p>Depends on base-image and bootstrap pinning</p>\n</td><td>\n<p>Immutable tag/digest and release promotion</p>\n</td></tr><tr><td>\n<p><strong>Platform footprint</strong></p>\n</td><td>\n<p>No dedicated ACR</p>\n</td><td>\n<p>Requires ACR and image-pull authorization</p>\n</td></tr><tr><td>\n<p><strong>Maintenance</strong></p>\n</td><td>\n<p>Bootstrap script and download endpoints</p>\n</td><td>\n<p>Dockerfile, build, scan, patch and publish</p>\n</td></tr><tr><td>\n<p><strong>Best fit</strong></p>\n</td><td>\n<p>Lower-frequency or simpler runner platform</p>\n</td><td>\n<p>High-frequency or controlled enterprise image supply chain</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h1>Step-by-step implementation guide</h1>\n<p>Replace the example values with approved environment-specific names and scopes. Run the PowerShell-oriented Azure CLI commands from Cloud Shell or a current Azure CLI workstation.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Security boundary before you begin</strong></p>\n<p><strong>Use a private GitHub repository. Do not place a GitHub App private key, installation token, runner registration token, Azure access token or client secret in source control. The only long-lived GitHub credential in this design is the GitHub App private key, which is stored in Azure Key Vault and used only to mint short-lived tokens.</strong></p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<h2>1. Prerequisites and permissions</h2>\n<ul>\n<li>An Azure subscription in which you can create resource groups, virtual networks, private endpoints, managed identities, Key Vault resources, Container Apps environments and event jobs.</li>\n<li>Permission to assign Azure RBAC roles at the Key Vault and workload deployment scopes. If you cannot create Entra applications or federated credentials, request those objects from the tenant identity team before the OIDC step.</li>\n<li>A private GitHub repository and permission to create and install a GitHub App for that repository.</li>\n<li>Azure CLI with the Container Apps extension, Git, and an editor. Docker and an Azure Container Registry are not required for this implementation.</li>\n<li>Outbound HTTPS connectivity from the Container Apps environment to GitHub APIs, GitHub Actions endpoints, Microsoft identity/Azure APIs, MCR and the package/download sources used by the bootstrap.</li>\n</ul>\naz login --tenant \"&lt;tenant-id&gt;\"\naz account set --subscription \"&lt;subscription-id&gt;\"\naz extension add --name containerapp --upgrade --allow-preview true\naz provider register --namespace Microsoft.App\naz provider register --namespace Microsoft.OperationalInsights\naz provider register --namespace Microsoft.KeyVault\n<p>&nbsp;</p>\n<h2>2. Define reusable variables</h2>\n<p>Use one naming block throughout the deployment. The values below are examples only.</p>\n$SubscriptionId = \"&lt;subscription-id&gt;\"\n$TenantId       = \"&lt;tenant-id&gt;\"\n$Location       = \"centralindia\"\n$ResourceGroup  = \"rg-aca-github-runner\"\n\n$VnetName       = \"vnet-aca-github-runner\"\n$VnetCidr       = \"10.50.0.0/16\"\n$AcaSubnetName  = \"snet-aca\"\n$AcaSubnetCidr  = \"10.50.1.0/27\"\n$PeSubnetName   = \"snet-private-endpoints\"\n$PeSubnetCidr   = \"10.50.2.0/27\"\n\n$EnvironmentName = \"cae-github-runner\"\n$JobName         = \"caj-github-runner-event\"\n$IdentityName    = \"id-github-runner\"\n$KeyVaultName    = \"&lt;globally-unique-key-vault-name&gt;\"\n$LogWorkspace    = \"law-aca-github-runner\"\n\n$GitHubOwner     = \"&lt;github-owner&gt;\"\n$GitHubRepo      = \"&lt;repository-name&gt;\"\n$RunnerLabel     = \"aca-linux\"\n$RunnerVersion   = \"&lt;tested-runner-version&gt;\"\n$TerraformVersion = \"&lt;tested-terraform-version&gt;\"\n$PowerShellVersion = \"&lt;tested-powershell-version&gt;\"\n\naz account set --subscription $SubscriptionId\naz group create --name $ResourceGroup --location $Location\n<p>&nbsp;</p>\n<h2>3. Create the network boundary</h2>\n<p>Use separate, non-overlapping subnets for the delegated Container Apps environment and the Key Vault private endpoint.</p>\naz network vnet create `\n  --resource-group $ResourceGroup `\n  --name $VnetName `\n  --location $Location `\n  --address-prefixes $VnetCidr\n\naz network vnet subnet create `\n  --resource-group $ResourceGroup `\n  --vnet-name $VnetName `\n  --name $AcaSubnetName `\n  --address-prefixes $AcaSubnetCidr `\n  --delegations Microsoft.App/environments\n\naz network vnet subnet create `\n  --resource-group $ResourceGroup `\n  --vnet-name $VnetName `\n  --name $PeSubnetName `\n  --address-prefixes $PeSubnetCidr `\n  --disable-private-endpoint-network-policies true\n\n$AcaSubnetId = az network vnet subnet show `\n  --resource-group $ResourceGroup `\n  --vnet-name $VnetName `\n  --name $AcaSubnetName `\n  --query id --output tsv\n<p>&nbsp;</p>\n<p><strong>Validation: </strong>Confirm that the ACA subnet shows delegation to Microsoft.App/environments and that the private-endpoint subnet has private endpoint network policies disabled.</p>\n<h2>4. Create the runtime managed identity</h2>\naz identity create `\n  --resource-group $ResourceGroup `\n  --name $IdentityName `\n  --location $Location\n\n$IdentityId = az identity show `\n  --resource-group $ResourceGroup `\n  --name $IdentityName `\n  --query id --output tsv\n\n$IdentityPrincipalId = az identity show `\n  --resource-group $ResourceGroup `\n  --name $IdentityName `\n  --query principalId --output tsv\n\n$IdentityClientId = az identity show `\n  --resource-group $ResourceGroup `\n  --name $IdentityName `\n  --query clientId --output tsv\n<p>This identity is the bootstrap identity. Its steady-state purpose is to read the GitHub App material from Key Vault. Do not use it as the Terraform deployment identity.</p>\n<h2>5. Create private Key Vault access</h2>\naz keyvault create `\n  --resource-group $ResourceGroup `\n  --name $KeyVaultName `\n  --location $Location `\n  --enable-rbac-authorization true `\n  --public-network-access Disabled\n\n$KeyVaultId = az keyvault show `\n  --resource-group $ResourceGroup `\n  --name $KeyVaultName `\n  --query id --output tsv\n\naz role assignment create `\n  --assignee-object-id $IdentityPrincipalId `\n  --assignee-principal-type ServicePrincipal `\n  --role \"Key Vault Secrets User\" `\n  --scope $KeyVaultId\n\naz network private-dns zone create `\n  --resource-group $ResourceGroup `\n  --name \"privatelink.vaultcore.azure.net\"\n\naz network private-dns link vnet create `\n  --resource-group $ResourceGroup `\n  --zone-name \"privatelink.vaultcore.azure.net\" `\n  --name \"link-$VnetName\" `\n  --virtual-network $VnetName `\n  --registration-enabled false\n\naz network private-endpoint create `\n  --resource-group $ResourceGroup `\n  --name \"pep-$KeyVaultName\" `\n  --location $Location `\n  --vnet-name $VnetName `\n  --subnet $PeSubnetName `\n  --private-connection-resource-id $KeyVaultId `\n  --group-id vault `\n  --connection-name \"peconn-$KeyVaultName\"\n\n$PrivateEndpointId = az network private-endpoint show `\n  --resource-group $ResourceGroup `\n  --name \"pep-$KeyVaultName\" `\n  --query id --output tsv\n\naz network private-endpoint dns-zone-group create `\n  --resource-group $ResourceGroup `\n  --endpoint-name \"pep-$KeyVaultName\" `\n  --name \"default\" `\n  --private-dns-zone \"privatelink.vaultcore.azure.net\" `\n  --zone-name \"privatelink.vaultcore.azure.net\"\n<p>&nbsp;</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Important</strong></p>\n<p><strong>Because public network access is disabled, secret creation must occur from an approved private network path or through an authorized automation process that can reach the vault privately. Adding a laptop public IP does not override PublicNetworkAccess=Disabled.</strong></p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<h2>6. Create and install the GitHub App</h2>\n<p>In GitHub, create a GitHub App owned by the account or organization that owns the target repository. Disable webhooks unless another use case requires them. Grant only the permissions required by the KEDA scaler and runner registration APIs.</p>\n<ul>\n<li>Repository permission Actions: Read-only.</li>\n<li>Repository permission Administration: Read and write.</li>\n<li>Repository permission Metadata: Read-only.</li>\n<li>For organization-scoped runners, Self-hosted runners: Read and write at organization level. This guide uses repository scope.</li>\n<li>Install the App only on the repositories that are allowed to use this runner platform.</li>\n</ul>\n<p>Record the <strong>App ID</strong> and <strong>installation ID</strong>. Generate a private key and protect the downloaded PEM file. The private key is the long-lived GitHub credential for this architecture.</p>\n<h2>7. Store GitHub App material in Key Vault</h2>\n<p>Run the following commands only from a trusted system that can reach the Key Vault private endpoint and has temporary secret-management permission. Use separate PEM and base64 forms because the KEDA trigger consumes PEM content while the runtime bootstrap can safely reconstruct the file from base64.</p>\n$GitHubAppId          = \"&lt;github-app-id&gt;\"\n$GitHubInstallationId = \"&lt;github-installation-id&gt;\"\n$GitHubPrivateKeyPath = \"&lt;local-path-to-private-key.pem&gt;\"\n\n$GitHubPrivateKeyPem = Get-Content `\n  -Path $GitHubPrivateKeyPath `\n  -Raw\n\n$GitHubPrivateKeyBase64 = [Convert]::ToBase64String(\n  [System.IO.File]::ReadAllBytes($GitHubPrivateKeyPath)\n)\n\naz keyvault secret set --vault-name $KeyVaultName `\n  --name \"github-app-id\" --value $GitHubAppId\n\naz keyvault secret set --vault-name $KeyVaultName `\n  --name \"github-installation-id\" --value $GitHubInstallationId\n\naz keyvault secret set --vault-name $KeyVaultName `\n  --name \"github-app-private-key-pem\" --value $GitHubPrivateKeyPem\n\naz keyvault secret set --vault-name $KeyVaultName `\n  --name \"github-app-private-key-b64\" --value $GitHubPrivateKeyBase64\n<p>&nbsp;</p>\n<p><strong>Validation: </strong>List secret names and versions, but never print secret values in logs. Remove any temporary Secrets Officer assignment after the secrets have been written.</p>\n<h2>8. Create Log Analytics and the Container Apps environment</h2>\naz monitor log-analytics workspace create `\n  --resource-group $ResourceGroup `\n  --workspace-name $LogWorkspace `\n  --location $Location\n\n$WorkspaceId = az monitor log-analytics workspace show `\n  --resource-group $ResourceGroup `\n  --workspace-name $LogWorkspace `\n  --query customerId --output tsv\n\n$WorkspaceKey = az monitor log-analytics workspace get-shared-keys `\n  --resource-group $ResourceGroup `\n  --workspace-name $LogWorkspace `\n  --query primarySharedKey --output tsv\n\naz containerapp env create `\n  --resource-group $ResourceGroup `\n  --name $EnvironmentName `\n  --location $Location `\n  --infrastructure-subnet-resource-id $AcaSubnetId `\n  --logs-workspace-id $WorkspaceId `\n  --logs-workspace-key $WorkspaceKey\n<p>&nbsp;</p>\n<p><strong>Validation: </strong>Confirm that the environment provisioning state is Succeeded and that the infrastructure subnet matches the delegated ACA subnet.</p>\n<h2>9. Build the runtime bootstrap</h2>\n<p>The MCR image is prepared at runtime. Add fail-fast behavior and phase markers for installation, Key Vault, GitHub authentication and runner registration.</p>\nset -euo pipefail\n\nlog() { printf '%s %s\\n' \"$(date -u +%FT%TZ)\" \"$*\"; }\n\nlog \"Installing base packages\"\n\ntdnf install -y git tar gzip unzip ca-certificates curl openssl\n\nlog \"Installing pinned Terraform and PowerShell versions\"\n\n# Download only approved versions. Validate checksums before installation.\n# Install Terraform to /usr/local/bin and PowerShell to an approved path.\n\nlog \"Retrieving GitHub App material from private Key Vault\"\n\naz login --identity --client-id \"${UAMI_CLIENT_ID}\" --allow-no-subscriptions &gt;/dev/null\nAPP_ID=$(az keyvault secret show --vault-name \"${KEY_VAULT_NAME}\" --name github-app-id --query value -o tsv)\nINSTALLATION_ID=$(az keyvault secret show --vault-name \"${KEY_VAULT_NAME}\" --name github-installation-id --query value -o tsv)\nPRIVATE_KEY_B64=$(az keyvault secret show --vault-name \"${KEY_VAULT_NAME}\" --name github-app-private-key-b64 --query value -o tsv)\n\numask 077\nprintf '%s' \"${PRIVATE_KEY_B64}\" | base64 -d &gt; /tmp/github-app-key.pem\n\nlog \"Generating a short-lived GitHub App JWT\"\n\n# Create an RS256 JWT with iat slightly in the past and exp within GitHub limits.\n# Do not echo the JWT or private key.\n\nlog \"Requesting installation and registration tokens\"\n\n# POST /app/installations/${INSTALLATION_ID}/access_tokens using the JWT.\n# POST /repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/runners/registration-token\n# using the installation token.\n\nlog \"Downloading and configuring the pinned GitHub Actions runner\"\n\nmkdir -p /actions-runner\n\ncd /actions-runner\n\n# Download the tested runner release and validate its checksum before extraction.\n\nexport RUNNER_ALLOW_RUNASROOT=1\n\n./config.sh \\\n\n  --url \"https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}\" \\\n  --token \"${REGISTRATION_TOKEN}\" \\\n  --name \"aca-${CONTAINER_APP_JOB_EXECUTION_NAME:-runner}\" \\\n  --labels \"${RUNNER_LABEL}\" \\\n  --ephemeral \\\n  --unattended \\\n  --disableupdate\n\nrm -f /tmp/github-app-key.pem\n\nunset PRIVATE_KEY_B64 JWT INSTALLATION_TOKEN REGISTRATION_TOKEN\n\nlog \"Starting ephemeral runner\"\n\nexec ./run.sh\n<p>&nbsp;</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Implementation note</strong></p>\n<p><strong>The abbreviated sections above should be implemented as tested functions in the deployment repository. Keep the JWT and API response parsing logic in source control, but never include private-key material or emitted tokens. Pin release URLs and validate checksums.</strong></p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<h2>10. Configure the ACA Event Job and KEDA scaler</h2>\n<p>Use an event-triggered job with minimum executions 0. The KEDA scale rule and runner registration must use the same repository and custom label. The following manifest fragment shows the required contract; property names can vary by the Container Apps API version, so generate the final resource through your approved Bicep, Terraform or ARM template and validate the deployed scale rule with Azure CLI.</p>\ntriggerType: Event\neventTriggerConfig:\n  replicaCompletionCount: 1\n  parallelism: 1\n  replicaRetryLimit: 0\n  replicaTimeout: 3600\n  scale:\n    pollingInterval: 30\n    minExecutions: 0\n    maxExecutions: 3\n    rules:\n      - name: github-runner\n        type: github-runner\n        metadata:\n          owner: \"&lt;github-owner&gt;\"\n          runnerScope: repo\n          repos: \"&lt;repository-name&gt;\"\n          labels: \"&lt;custom-runner-label&gt;\"\n          targetWorkflowQueueLength: \"1\"\n          enableEtags: \"true\"\n          applicationID: \"&lt;github-app-id&gt;\"\n          installationID: \"&lt;github-installation-id&gt;\"\n        authentication:\n          appKey: \"&lt;ACA secret containing the GitHub App PEM&gt;\"\n\ntemplate:\n  containers:\n    - name: github-runner\n      image: mcr.microsoft.com/deploymentenvironments/runners/core:&lt;tested-tag-or-digest&gt;\n      resources:\n        cpu: 1.0\n        memory: 2Gi\n      env:\n        - name: GITHUB_OWNER\n          value: \"&lt;github-owner&gt;\"\n        - name: GITHUB_REPO\n          value: \"&lt;repository-name&gt;\"\n        - name: RUNNER_LABEL\n          value: \"&lt;custom-runner-label&gt;\"\n        - name: KEY_VAULT_NAME\n          value: \"&lt;key-vault-name&gt;\"\n        - name: UAMI_CLIENT_ID\n          value: \"&lt;runtime-uami-client-id&gt;\"\n<p>&nbsp;</p>\n<p>The KEDA control plane needs the App ID, installation ID and PEM private key to inspect the queue. The runner container needs the App material independently to obtain its registration token. Treat these as two GitHub authentication consumers even when they use the same GitHub App.</p>\n<p><strong>Validation: </strong>Inspect properties.configuration.eventTriggerConfig.scale.rules and confirm owner, repository, scope, label, queue target, ETags, min/max executions and polling interval. Verify that the job has the UAMI attached.</p>\n<h2>11. Create the separate Azure deployment identity</h2>\n<p>This identity is used by workflow steps such as Terraform. It is intentionally separate from the runner UAMI.</p>\n$DeploymentAppName = \"app-gh-aca-deployment\"\n$DeploymentClientId = az ad app create `\n  --display-name $DeploymentAppName `\n  --query appId --output tsv\n\naz ad sp create --id $DeploymentClientId\n\n$DeploymentSpObjectId = az ad sp show `\n  --id $DeploymentClientId `\n  --query id --output tsv\n\n$DeploymentScope = az group show `\n  --name $ResourceGroup `\n  --query id --output tsv\n\naz role assignment create `\n  --assignee-object-id $DeploymentSpObjectId `\n  --assignee-principal-type ServicePrincipal `\n  --role Contributor `\n  --scope $DeploymentScope\n<p>&nbsp;</p>\n<p>Create the federated credential. Bind the subject to the exact branch or GitHub environment allowed to deploy.</p>\n@\"\n{\n  \"name\": \"github-main\",\n  \"issuer\": \"https://token.actions.githubusercontent.com\",\n  \"subject\": \"repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main\",\n  \"description\": \"GitHub Actions OIDC for the main branch\",\n  \"audiences\": [\"api://AzureADTokenExchange\"]\n}\n\n\"@ | Set-Content -Path .\\github-federated-credential.json\n\naz ad app federated-credential create `\n  --id $DeploymentClientId `\n  --parameters .\\github-federated-credential.json\n<p>&nbsp;</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Least privilege</strong></p>\n<p><strong>Contributor at resource-group scope is a practical implementation starting point, not a universal target. Replace it with a narrower built-in or custom role when the workflow’s required Azure operations are known. Do not grant this principal Key Vault secret-reading access unless the workflow genuinely needs it.</strong></p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<h2>12. Configure GitHub Actions variables and workflow</h2>\n<p>Store the identifiers as GitHub repository or environment variables/secrets according to your governance model. There is no AZURE_CLIENT_SECRET.</p>\n<ul>\n<li>AZURE_CLIENT_ID = deployment application client ID</li>\n<li>AZURE_TENANT_ID = Microsoft Entra tenant ID</li>\n<li>AZURE_SUBSCRIPTION_ID = target Azure subscription ID</li>\n</ul>\nname: Terraform through ACA ephemeral runner\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  id-token: write\n\njobs:\n  terraform:\n    runs-on: [self-hosted, aca-linux]\n    env:\n      ARM_USE_OIDC: true\n      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}\n      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}\n      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Sign in to Azure with OIDC\n        uses: azure/login@v2\n        with:\n          client-id: ${{ secrets.AZURE_CLIENT_ID }}\n          tenant-id: ${{ secrets.AZURE_TENANT_ID }}\n          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}\n\n      - name: Verify toolchain\n        shell: bash\n        run: |\n          git --version\n          az version\n          terraform version\n          pwsh --version\n\n      - name: Terraform init\n        working-directory: terraform\n        run: terraform init -input=false\n\n      - name: Terraform plan\n        working-directory: terraform\n        run: terraform plan -input=false -out=tfplan\n\n      - name: Terraform apply\n        working-directory: terraform\n        run: terraform apply -input=false -auto-approve tfplan\n<p>&nbsp;</p>\n<p>If production deployment requires approvals, target a protected GitHub environment and bind the federated credential subject to that environment instead of directly to a branch.</p>\n<h2>13. Validate the complete lifecycle</h2>\n<p><strong>Before triggering: </strong>Confirm that current event-job executions are zero and no repository runner is permanently online.</p>\n<p><strong>Queue detection: </strong>Trigger the workflow and verify that it waits for the custom label rather than running on another self-hosted runner.</p>\n<p><strong>KEDA scale-up: </strong>Within the configured polling and platform startup interval, confirm that Container Apps creates an event-job execution.</p>\n<p><strong>Private bootstrap: </strong>Verify logs show managed identity login, private Key Vault retrieval and successful GitHub token exchange without printing credentials.</p>\n<p><strong>Runner registration: </strong>Confirm the workflow displays the ACA runner name and matching custom label.</p>\n<p><strong>OIDC deployment: </strong>Confirm azure/login succeeds without a client secret and Terraform operates only within the assigned Azure scope.</p>\n<p><strong>Ephemeral cleanup: </strong>After the workflow finishes, confirm the runner deregisters, the Container Apps execution completes and execution count returns to zero.</p>\n<p><strong>Repeatability:&nbsp;</strong>Run the workflow again. A new execution and new ephemeral runner should perform the second run.</p>\naz containerapp job execution list `\n  --resource-group $ResourceGroup `\n  --name $JobName `\n  --query \"[].{Name:name,Status:properties.status,Start:properties.startTime,End:properties.endTime}\" `\n  --output table\n\naz containerapp job show `\n  --resource-group $ResourceGroup `\n  --name $JobName `\n  --query \"properties.configuration.eventTriggerConfig.scale.rules\" `\n  --output json\n<p>&nbsp;</p>\n<h2>14. Measure cold-start latency</h2>\n<p>Measure cold-start stages separately to identify where queue-to-ready latency is introduced.</p>\n<ul>\n<li>Workflow queued → KEDA detects demand.</li>\n<li>KEDA detects demand → Container Apps execution starts.</li>\n<li>Execution starts → image pull completes.</li>\n<li>Image is ready → base package installation completes.</li>\n<li>Package installation → Terraform/PowerShell/runner installation completes.</li>\n<li>Tool installation → runner registration completes.</li>\n<li>Runner registration → workflow begins.</li>\n</ul>\n<p>If runtime bootstrap repeatedly dominates the workflow duration, move the tested bootstrap into a versioned, scanned pre-baked image. That optimization changes the image supply chain and startup time, but it does not require changing the GitHub App, private Key Vault, KEDA, ephemeral-runner or OIDC trust model.</p>\n<h2>15. Production-readiness exit criteria</h2>\n<ul>\n<li>The MCR image and downloaded tools are pinned to tested versions or digests, and checksums/signatures are validated.</li>\n<li>The GitHub App installation is restricted and has an owned private-key rotation and recovery procedure.</li>\n<li>The runtime UAMI has only Key Vault Secrets User at the intended vault scope.</li>\n<li>Key Vault public network access is disabled and private DNS is validated from the workload network.</li>\n<li>The deployment identity is separate, federated through OIDC and scoped to the smallest practical Azure boundary.</li>\n<li>Workflow, KEDA and runner registration labels are centrally parameterized and tested together.</li>\n<li>ACA logs are retained outside the ephemeral execution, with alerts for bootstrap, registration, OIDC and repeated execution failures.</li>\n<li>Maximum executions have been tested against GitHub API rate limits, Azure quotas and downstream deployment concurrency.</li>\n<li>Cold-start measurements have been compared with workflow duration and the image strategy has been selected consciously.</li>\n</ul>\n<h1>What failed, and what those failures teach</h1>\n<p><strong>Assuming common tools existed</strong> — Minimal base images may not include Git, PowerShell, Terraform, Python, jq or even familiar diagnostic commands. Verify the image rather than assuming.</p>\n<p><strong>Root runner configuration</strong> — Runner configuration can reject root execution unless the supported override is set. Treat this as an explicit base-image decision.</p>\n<p><strong>Testing a private vault from a laptop</strong> — A client IP allow-list does not override disabled public network access. Test the private path from the workload network.</p>\n<p><strong>Storage account Terraform smoke test</strong> — A resource can be created successfully through ARM while later provider data-plane checks fail because shared-key authentication is prohibited. Separate control-plane success from data-plane authorization.</p>\n<p><strong>Trying to observe an ephemeral runner manually</strong> — A short workflow may register and disappear too quickly for the runner page to be useful. Use workflow logs and Container Apps execution history as authoritative evidence.</p>\n<p><strong>Conflating runner and deployment identity</strong> — Successful runner registration does not prove Azure deployment authentication. Test GitHub OIDC and Azure RBAC independently.</p>\n<h1>Observability and troubleshooting</h1>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td>\n<p><strong>Symptom</strong></p>\n</td><td>\n<p><strong>First checks</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p><strong>Workflow remains queued</strong></p>\n</td><td>\n<p>Check workflow labels, KEDA labels, owner, repo, runner scope, GitHub App permissions, installation ID and scaler logs.</p>\n</td></tr><tr><td>\n<p><strong>Job starts but no runner appears</strong></p>\n</td><td>\n<p>Check bootstrap logs, Key Vault DNS resolution, private endpoint connectivity, UAMI attachment, Key Vault RBAC and GitHub token exchange responses.</p>\n</td></tr><tr><td>\n<p><strong>Runner registers but workflow does not start</strong></p>\n</td><td>\n<p>Confirm the custom label and repository scope; verify no alternate self-hosted runner is matching the job.</p>\n</td></tr><tr><td>\n<p><strong>Azure login fails</strong></p>\n</td><td>\n<p>Check id-token: write, federated credential subject/audience/issuer, client ID, tenant ID and branch/environment conditions.</p>\n</td></tr><tr><td>\n<p><strong>Terraform authorization fails</strong></p>\n</td><td>\n<p>Inspect Azure role assignment principal, scope and propagation; distinguish ARM failures from resource data-plane failures.</p>\n</td></tr><tr><td>\n<p><strong>Cold start is too high</strong></p>\n</td><td>\n<p>Measure image pull, OS package installation, Terraform/PowerShell download and runner registration separately; consider a pre-baked image if startup dominates runtime.</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h1>Conclusion</h1>\n<p>Running GitHub Actions runners on Azure Container Apps is more than replacing a virtual machine with a container. The durable architecture comes from treating queue detection, runner registration, secret retrieval and Azure deployment as separate trust flows.</p>\n<p>The resulting pattern is straightforward: KEDA starts an event job only when matching work exists; a private managed identity path retrieves GitHub App material; short-lived credentials register an ephemeral repository runner; GitHub OIDC provides a separate, secretless path to Azure; and the entire execution disappears after one workflow.</p>\n<p>The MCR runtime-bootstrap strategy removes the need for a dedicated runner registry and custom image pipeline, but it increases cold-start latency and dependency on external download endpoints. That trade-off should be measured and revisited as usage grows. The architecture remains the same if a future requirement justifies moving the tested bootstrap into a pre-baked image.</p>\n<h1>Sources and implementation references</h1>\n<ul>\n<li>Microsoft Learn: Tutorial: Deploy self-hosted CI/CD runners and agents with Azure Container Apps jobs.</li>\n<li>KEDA documentation: GitHub Runner Scaler, including repository scope, labels, ETags and GitHub App authentication.</li>\n<li>GitHub REST API documentation: self-hosted runner registration-token endpoints and GitHub App installation authentication.</li>\n<li>Microsoft Learn: GitHub Actions authentication to Azure using OpenID Connect and federated identity credentials.</li>\n<li>Internal implementation record: Azure Container Apps GitHub Self-Hosted Runner Configuration &amp; Learnings.</li>\n<li>Visuals in this document were generated with Microsoft Copilot.</li>\n</ul>"
