  この日は 2 ソースから 4 本です。脅威インテリジェンスとして、AI を使ったペネトレーションテストフレームワーク ARTEX が、Storm-0940、Storm-3358、Onyx Sleet、Pearl Sleet、Crystal Typhoon、Salt Typhoon といった脅威アクターに悪用され、ネットワークの偵察、認証情報への攻撃、Web アプリケーションの脆弱性悪用といった既存の作業の高速化に使われていることと、防御側が知っておくべき点が解説されました。あわせて、Microsoft が 2026 年の Gartner Magic Quadrant for Email Security で 2 年連続のリーダーに選ばれたことが報告されています。 後から Azure Updates に 2 件が加わりました。Azure Functions での Java 8・11・17 のサポートが 2027 年 9 月 1 日に終了し、それ以降もアプリは動き続けますが、セキュリティ更新とカスタマーサービスは提供されなくなります。また Azure Virtual Network の等コストマルチパス (ECMP) ルーティングがパブリックプレビューとなり、1 つのユーザー定義ルート (UDR) で 2〜16 のネクストホップを指定して、複数のネットワークアプライアンスにトラフィックを分散できるようになりました。
