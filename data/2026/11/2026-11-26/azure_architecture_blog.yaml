  "a53ac78adbfff15b87851416f2bf479c":
    "id": "a53ac78adbfff15b87851416f2bf479c"
    "title": "Running green hydrogen export plants with AI agents on Azure"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/running-green-hydrogen-export-plants-with-ai-agents-on-azure/ba-p/4576731"
    "published": "2026-11-26 22:35:43"
    "fetched": "2026-11-27 23:28:17"
    "summary": "<p><span><span>Before you read.</span></span><span><span> I </span><span>wrote</span><span> this paper for my capstone in the Azure Master Architect Program. The design has not been built, and the test in section 9 is a simulation. The value figures come from the case and from that simulation, and the cost figures are my estimates at Azure list prices. All of them are illustrative, not guaranteed. The views are my own.</span></span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> Summary</span></strong></h5>\n<p><span>Most green hydrogen export plants will start life on fixed dispatch rules and spreadsheets. In the case study behind this paper, that costs a 500 MW solar, wind and electrolysis complex 8 to 10% of its ammonia output. The plant also earns a premium of EUR 200 a tonne under EU rules, but only on tonnes it can prove, and under the rules in force the proof must hold hour by hour from 2030.</span><span>&nbsp;</span></p>\n<p><span>This paper describes a way to run such a plant with AI agents on Microsoft Azure. An optimiser makes the plan, and five agents do the work around it. A policy layer checks every agent action, one gateway is the only write path to the plant, and the safety system stays hardwired. Every hour of production is sealed as certification evidence as it happens.</span><span>&nbsp;</span></p>\n<p><span>I have not built it. I tested the logic on a simulated plant over a year of real weather and priced it on Azure at about EUR 0.59 a tonne. The paper gives the pattern, the Azure architecture with the reason for each service, the test and the cost.</span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> The problem: one plant, four clocks</span></strong></h5>\n<p><span class=\"lia-text-color-15\"><span class=\"lia-text-color-21\">An export plant must keep four clocks in step, and they rarely agree (Table 1).</span>&nbsp;</span></p>\n<p><strong><span class=\"lia-text-color-15\">Table 1. The four clocks of a green hydrogen export plant&nbsp;</span></strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Clock&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">What it demands&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">What goes wrong on fixed rules&nbsp;</span></strong></p>\n</td></tr><tr><td>\n<p><strong><span><span>Sun and wind</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Power swings by the minute, and dust or calm can cut it for hours</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>The ammonia loop trips when the hydrogen buffer runs dry</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Electrolyser stacks</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Stacks age with every hard ramp and start-stop</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Every stack runs the same duty, whatever its health</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Tanks and ships</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Tank space and loading windows are fixed</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>A late ship is re-planned by phone and email</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>EU rules</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Every tonne </span><span>must</span><span> prove additionality and correlation in time and place</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Evidence is built by hand at month end</span></span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><span><br />Fixed rules are safe, but they cannot look ahead. They find out about a dust front when it arrives. The case puts the cost at 8 to 10% of output, and since those tonnes would come from assets that are already paid for, most of their value is margin.</span><span>&nbsp;</span></p>\n<p><span>The case plant is on Morocco’s Atlantic coast. The four clocks are the same for any plant that runs electrolysers on variable renewables and sells into the EU.</span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> Why the proof matters now</span></strong></h5>\n<p><span>The premium in the case is EUR 200 a tonne, or EUR 80M a year at 400,000 tonnes. The same hourly data also feeds the Carbon Border Adjustment Mechanism, which has applied to hydrogen and ammonia imports since January 2026.</span><span>&nbsp;</span></p>\n<p><span>Power is matched to production by calendar month until the end of 2029 and by the hour from 2030. The Commission also plans to postpone some of these requirements and has not said which dates will move. So, the evidence must be automatic from the first day, and the rule version has to change without a rebuild.</span><span>&nbsp;</span></p>\n<h5><span class=\"lia-text-color-11\"><strong> Four ways to run the plant</strong></span></h5>\n<p><span>I compared four ways to run the plant and chose the last one (Table 2).</span><span>&nbsp;</span></p>\n<p><strong><span class=\"lia-text-color-15\">Table 2. Four ways to run the plant&nbsp;</span></strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; height: 297.334px; border-width: 1px;\"><tbody><tr style=\"height: 30.6667px;\"><td class=\"lia-align-center lia-background-color-11\" style=\"height: 30.6667px;\">\n<p><strong><span class=\"lia-text-color-22\">Option&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\" style=\"height: 30.6667px;\">\n<p><strong><span class=\"lia-text-color-22\">What it is&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\" style=\"height: 30.6667px;\">\n<p><strong><span class=\"lia-text-color-22\">Verdict&nbsp;</span></strong></p>\n</td></tr><tr style=\"height: 66.6667px;\"><td style=\"height: 66.6667px;\">\n<p><strong><span><span>Fixed rules and spreadsheets</span></span><span>&nbsp;</span></strong></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>Dispatch rules, manual re-plans, evidence built at month end</span></span><span>&nbsp;</span></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>Safe, but blind to the next hour. Loses 8 to 10% of output</span></span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 66.6667px;\"><td style=\"height: 66.6667px;\">\n<p><strong><span><span>An optimiser alone</span></span><span>&nbsp;</span></strong></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>A planning model, with people doing the rest</span></span><span>&nbsp;</span></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>Recovers most of the output. People still explain each plan, deal with </span><span>shippers</span><span> and build the proof</span></span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 66.6667px;\"><td style=\"height: 66.6667px;\">\n<p><strong><span><span>One AI agent in charge</span></span><span>&nbsp;</span></strong></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>A single agent with every tool, setpoints included</span></span><span>&nbsp;</span></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>Quick to demo. No safety case accepts a language model in the control path</span></span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 66.6667px;\"><td style=\"height: 66.6667px;\">\n<p><strong><span><span>Agents around a deterministic core</span></span><span>&nbsp;</span></strong></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>An optimiser plans. Agents explain, negotiate, </span><span>recommend</span><span> and record, inside hard limits</span></span><span>&nbsp;</span></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span><span>Chosen. The maths stays deterministic, the safety case stays intact and every hour is proven</span></span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p><span>The optimiser does the arithmetic, and I expect most of the extra output to come from it. The agents are there for the work around the plan: a stack that starts to drift at 11:15 and needs someone to approve a derate, a ship that arrives six hours late, a verifier who wants the proof for a cargo before it sails. Today that work runs on phone calls, email and spreadsheets.</span><span>&nbsp;</span></p>\n<h5><span class=\"lia-text-color-11\"><strong> The pattern: agents around a deterministic core</strong></span></h5>\n<p><span>The study evolves around five agents and gives each an autonomy level.</span><span>&nbsp;</span></p>\n<p><span>The levels follow what a mistake can break, whatever the model is able to do. Certification is the only fully autonomous agent, because it records and never controls. Safety monitoring has the least autonomy: it briefs the operator, who decides on every alarm.</span><span>&nbsp;</span></p>\n<p><strong><span class=\"lia-text-color-15\">Table 3. Five agents and their autonomy levels&nbsp;</span></strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Agent&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Owns&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Autonomy&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">People keep&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Board measure&nbsp;</span></strong></p>\n</td></tr><tr><td>\n<p><strong><span><span>Renewable Dispatch</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Electrolyser load against sun, </span><span>wind</span><span> and price forecasts</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>L3, acts within the operating envelope</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>The envelope</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Output against plan</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Degradation Management</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Stack utilisation, to extend stack life</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>L2, recommends</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Approval of each derate</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Stack life</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Storage and Shipping</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Tanks and vessel loading, with shipper agents</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>L3, acts within contract terms</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Contracts and prices</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Cargoes on time</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Certification Evidence</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Hourly correlation and additionality proofs</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>L4, autonomous, records only</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>The independent audit</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Certified share, premium realised</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Safety Monitoring</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Hydrogen and ammonia safety telemetry</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>L1, </span><span>assists</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Every alarm decision</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Licence to operate</span></span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p><span>Under the agents sit four layers of control, and none of them is a language model (Figure 1).</span><span>&nbsp;</span></p>\n<ol>\n<li><span><span>A deterministic optimiser, a mixed-integer linear programme, makes the plan. Ramp rates, tank levels, berth </span><span>windows</span><span> and the matching rule are hard constraints, and the same inputs always give the same plan.</span></span><span>&nbsp;</span></li>\n</ol>\n<ol>\n<li><span><span>A policy layer checks every tool call before it runs and answers allow, needs human or deny. When it cannot decide, it denies. I would write it in the Agent Control Specification, which keeps the rules outside the model, as code.</span></span><span>&nbsp;</span></li>\n</ol>\n<ol>\n<li><span><span>A setpoint gateway on site is the only write path to the control system, and it checks the limits and interlocks again.</span></span><span>&nbsp;</span></li>\n</ol>\n<ol>\n<li><span><span>The safety instrumented system and the emergency shutdown stay hardwired, with no network path from any agent.</span></span><span>&nbsp;</span></li>\n</ol>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><span class=\"lia-text-color-15\"><strong>Figure 1. Five agents under one orchestrator. Policy checks every action, and one gateway is the only write path to the plant.&nbsp;</strong></span></p>\n<p class=\"lia-align-center\">&nbsp;</p>\n<p><span>The orchestrator is a fixed workflow on Microsoft Agent Framework, with a checkpoint at every step and a pause wherever a person decides. I rejected a group chat between agents, because after a fault nobody could replay it for a lender. An approval describes the plant as it was when the card was sent, and a dust front can arrive in ten minutes, so the policy check runs again after the operator approves.</span><span>&nbsp;</span></p>\n<h5><span class=\"lia-text-color-11\"><strong> The architecture on Azure</strong></span></h5>\n<p><span>Figure 2 shows the full design. It reads from the bottom up.</span><span>&nbsp;</span></p>\n<p><span>The control system and the safety system run the plant as they do today. Next to them, a three-node Azure Local cluster runs two things: Azure IoT Operations, which reads every tag over OPC UA and keeps working when the link drops, and the setpoint gateway, the only component allowed to write back. This layer stays on site because there is no Azure region in Morocco, and because no plant should depend on a cloud link to stay safe.</span><span>&nbsp;</span></p>\n<p><span>A private ExpressRoute circuit links the site to one EU region. In the reference design that is Sweden Central, for its three availability zones and its Foundry services, with North Europe for any service it does not offer. Microsoft Fabric holds the live twin and the full history. I preferred it to assembling separate ingestion, time-series and reporting services, because one capacity with one security model is simpler to run, and OneLake keeps the history in open Delta tables that a lender can read without the platform. The optimiser is a Container Apps job, since it is a deterministic solver that starts every 15 minutes and should cost nothing in between.</span><span>&nbsp;</span></p>\n<p><span>The agents run in Foundry Agent Service. They call models in the EU Data Zone through Azure API Management, which routes between a small and a reasoning model, caps the tokens of each agent and logs its cost. No language model computes a setpoint, so the small model can take about three calls in four. Each agent reaches the plant only through allow-listed MCP tools, under its own Entra Agent ID, so it can be audited and revoked alone. Table 4 gives the reason for each service.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><strong><span class=\"lia-text-color-15\">Figure 2. Reference architecture on Azure. The site keeps control, safety and raw plant data. One EU region holds the twin, the agents and the sealed evidence.&nbsp;</span></strong></p>\n<p class=\"lia-align-center\">&nbsp;</p>\n<p><strong><span class=\"lia-text-color-15\">Table 4. Azure products by layer, and why I chose them&nbsp;</span></strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Layer&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Products and standards&nbsp;</span></strong></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><strong><span class=\"lia-text-color-22\">Why these&nbsp;</span></strong></p>\n</td></tr><tr><td>\n<p><strong><span><span>Plant edge</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Azure Local with AKS, Azure IoT Operations, Azure Arc, Defender for IoT</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>The plant </span><span>has to</span><span> run, and keep recording, without the cloud. Arc manages the site with no inbound ports. Defender for IoT watches OT traffic passively</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Network</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>ExpressRoute, Azure Firewall Premium, Private Link</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Plant data never crosses the public internet, no service has a public endpoint, and all egress is inspected</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Data and twin</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Microsoft Fabric: </span><span>Eventstream</span><span>, </span><span>Eventhouse</span><span>, </span><span>OneLake</span><span>, digital twin builder, Power BI</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>One capacity and one security model for per-second telemetry, time-series </span><span>queries</span><span> and board views. History stays in open Delta tables</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Forecast and plan</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Aurora 1.5 in Foundry, Azure Machine Learning, Azure Container Apps</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Aurora forecasts radiation and 100 m wind by the hour, ten days ahead. Azure Machine Learning versions the stack-health models. Container Apps runs the optimiser as a job that scales to zero</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Agents and models</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Microsoft Agent Framework, Foundry Agent Service, models in the EU Data Zone, API Management, MCP tools, Azure AI Search</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Workflows with checkpoints and built-in pauses for people. Managed hosting with full tracing. Prompts stay in the EU. Search grounds answers in procedures, </span><span>contracts</span><span> and rule texts</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>People and partners</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Microsoft Teams, Azure Logic Apps, App Service, Entra B2B, A2A</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Approvals arrive where operators already work, with a timeout and an escalation. Verifiers and lenders sign in as guests to a read-only portal. Shipper agents are authenticated at the gateway</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Trust and evidence</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Agent Control Specification, Entra Agent ID, Confidential Ledger, Key Vault Managed HSM, immutable Blob Storage, Purview, Sentinel</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>Policy sits outside the model. The operator cannot rewrite the ledger. Signing keys never leave the HSM. Sentinel sees OT and IT alerts in one place</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Operations</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>Azure Monitor, GitHub Actions with Bicep, Azure Policy, Cost Management</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>One release path for prompts, tools, </span><span>policies</span><span> and infrastructure. Policy allows EU regions only. Cost is tagged by agent and reported per tonne</span></span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p><span>Two services are in preview, Aurora in Foundry and the digital twin builder in Fabric, and each has a fallback that changes nothing else.</span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> Proving every hour</span></strong></h5>\n<p><span>The certification agent produces what the premium is paid for. Every hour it measures, calculates, records, signs and seals (Figure 3).</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><strong><span class=\"lia-text-color-15\">Figure 3. The evidence chain. It runs every hour, which gives 8,760 sealed records a year.&nbsp;</span></strong></p>\n<p>&nbsp;</p>\n<p><span>Four choices make the proof hold up.</span><span>&nbsp;</span></p>\n<ol>\n<li><span><span>Rules as code, with the version in the record. When the rules change, both versions run side by side and sealed hours stay sealed.</span></span><span>&nbsp;</span></li>\n</ol>\n<ol>\n<li><span><span>One record per hour: the power by source, the matching in time and place, additionality, and the mass balance from hydrogen to ammonia, </span><span>tank</span><span> and ship.</span></span><span>&nbsp;</span></li>\n</ol>\n<ol>\n<li><span><span>A seal the plant cannot rewrite. Each record is hashed, signed with a key in Key Vault Managed HSM and written to Azure Confidential Ledger, which is append-only and protected from insiders, the cloud provider included.</span></span><span>&nbsp;</span></li>\n</ol>\n<ol>\n<li><span><span>Verifiers check each receipt against the identity of the ledger, without having to trust the plant.</span></span><span>&nbsp;</span></li>\n</ol>\n<p><span>I tested the third choice in my demo. I changed one number in a chain of 24-hourly records, and the chain caught it. When I also recomputed every later hash, the chain verified again, and only a copy of the last hash kept outside the plant showed the change. That is why a database table with an audit log would not do: the administrator who can change the table can change the log.</span><span>&nbsp;</span></p>\n<p><span>The target is 8,760 sealed hours a year, with the evidence pack for each cargo ready when loading starts, for a scheme such as CertifHy.</span><span>&nbsp;</span></p>\n<h5><span class=\"lia-text-color-11\"><strong>&nbsp;Evaluation, security and resiliency</strong></span></h5>\n<p><span>A change goes live, and an agent moves up a level, only after the same gates: zero agent actions outside the limits in a full-year replay, zero impermissible behaviours in ASSERT, 100% tool input accuracy on write tools in the Foundry evaluators, and a ledger receipt for every hour.</span><span>&nbsp;</span></p>\n<p><span>Agents bring two threats that a classic plant design does not have: instructions injected through a document or a partner’s agent, and an agent acting outside its job. So, Prompt Shields screen every input, partner text is treated as data, and no agent has a tool that changes a contract term or reaches the safety system. My reading of the EU AI Act is that the agents are not high-risk, because none is a safety component, and each plant should confirm that with counsel.</span><span>&nbsp;</span></p>\n<p><span>When something breaks, the plant carries on. If the link drops, the control system holds its setpoints and the edge replays every tag later. If an agent or a model fails, no policy answer means no action. If the region fails, the sealed records are already copied to a second EU region, and the agents redeploy from code.</span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> Testing it on a twin before you build</span></strong></h5>\n<p><span>Before anyone buys hardware, I would run two copies of the plant on the same weather for a full year, one on fixed rules and one with the pattern. I did this for the case plant on a simple twin, with 8,760 hours of real weather for a site on Morocco’s Atlantic coast. The plant is my assumption, and it makes about 275,000 tonnes a year against the 400,000 of the case (Table 5).</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p class=\"lia-align-left\"><strong><span class=\"lia-text-color-15\">Table 5. The simulated year, November 2025 to October 2026, same plant and same weather. The twin has 800 MWp of solar, 700 MW of wind, 500 MW of electrolysers and a 200 MWh battery.&nbsp;</span></strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-align-center lia-background-color-11\">\n<p><span class=\"lia-text-color-22\"><strong>Measure&nbsp;</strong></span></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><span class=\"lia-text-color-22\"><strong>Fixed rules&nbsp;</strong></span></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><span class=\"lia-text-color-22\"><strong>With the pattern&nbsp;</strong></span></p>\n</td><td class=\"lia-align-center lia-background-color-11\">\n<p><span class=\"lia-text-color-22\"><strong>Difference&nbsp;</strong></span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Ammonia produced</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>253,883 t</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>275,146 t</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>8.4% more</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Grid power bought</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>100,005 MWh</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>26,824 MWh</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>73% less</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Share of output that passes the hourly rule</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>92.2%</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>96.6%</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>4.4 points more</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Electrolyser starts and stops</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>7,292</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>4,828</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>34% fewer</span></span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><strong><span><span>Ammonia loop trips</span></span><span>&nbsp;</span></strong></p>\n</td><td>\n<p><span><span>1</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span><span>0</span></span><span>&nbsp;</span></p>\n</td><td>\n<p><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table>\n<p>&nbsp;</p>\n</div>\n<p><span>The twin is planning code with scripted events, and no language model runs in it. The forecast error is simulated. I also tuned the fixed rules run to the 8 to 10% gap in the case, so the extra ammonia is the brief’s own number coming back.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><strong><span class=\"lia-text-color-15\">Figure 4. Daily value of the pattern against fixed rules in the simulated year, at EUR 500 a tonne of ammonia, EUR 200 of premium and EUR 90 a MWh of grid power.&nbsp;</span></strong></p>\n<p class=\"lia-align-center\">&nbsp;</p>\n<p><span>What the replay adds is the shape of the result. The plan bought 73% less grid power, which is why more of the output passes the hourly rule. In October the plant with the pattern made slightly less ammonia than the plant on fixed rules and still finished EUR 1.4M ahead, because it bought a fifth of the grid power. It was also behind on 84 of the 365 days (Figure 4). On each of them the plan was holding hydrogen back for what came next. The value came back later, but a daily report shows a loss, so I would judge the year and put the losing days in the board report.</span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> What it costs</span></strong></h5>\n<p><span>I priced every Azure line of the design at list prices of November 2026, for the 400,000 tonnes a year of the case. It comes to about EUR 345k a year, and EUR 237k after five savings such as a reserved Fabric capacity, a small model first and test environments paused out of hours. That is EUR 0.59 a tonne, next to a premium of EUR 200 on the same tonne.</span><span>&nbsp;</span></p>\n<p><span>The agents and their models are 11% of that bill. Trust, security and data are 56%. Anyone who budgets an agent system by counting tokens will miss most of the cost.</span><span>&nbsp;</span></p>\n<p><span>With delivery and edge servers I estimate EUR 3.2 to 4.0M over the first three years, indicative until a partner quotes it. Proving 1% more tonnes is worth EUR 0.8M a year, 3.4 times the Azure run cost.</span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> Where the pattern does not fit</span></strong></h5>\n<p><span>I would not use this pattern where there is no reliable process model to optimise against, where telemetry is thin, or where someone wants AI inside the safety function. In the first two cases, start with data and a planning model. In the third, the answer is no.</span><span>&nbsp;</span></p>\n<p><span>My own work leaves two things open. The language-model agents and their evaluation are designed and have not been run. And a sealed record is not a certified tonne until a certification body accepts the method.</span><span>&nbsp;</span></p>\n<p><span>Within those limits I expect the pattern to carry to e-fuels, desalination, chemicals and mining, wherever AI sits next to process safety and a buyer or regulator wants proof.</span><span>&nbsp;</span></p>\n<h5><strong><span class=\"lia-text-color-11\"> Conclusion</span></strong></h5>\n<p><span>My recommendation is to let an optimiser plan, to give the agents the work around the plan, and to design the hourly proof as carefully as the plant itself. Start with ten weeks on the plant’s own data. If the gain does not show up there, the board will know before it has spent the build budget.</span><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span><span>References</span></span><span>&nbsp;</span></p>\n<p><span>Links checked in November 2026.</span><span>&nbsp;</span></p>\n<p><span><span>[</span><span>1]</span></span> <span><span>Microsoft, Azure Master Architect Program, FY27 cohort. Case Study 26: Agentic green-hydrogen export plant operations for a Moroccan energy developer. Program material, 2026.</span></span><span>&nbsp;</span></p>\n<p><span><span>[</span><span>2]</span></span> <span><span>Commission Delegated Regulation (EU) 2023/1184 of 10 February 2023, on the production of renewable fuels of non-biological origin.</span></span>&nbsp;<br /><a href=\"https://eur-lex.europa.eu/eli/reg_del/2023/1184/oj\" rel=\"noopener\" target=\"_blank\"><span><span>https://eur-lex.europa.eu/eli/reg_del/2023/1184/oj</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>3]</span></span> <span><span>European Commission. CBAM definitive regime, applying from 1 January 2026.</span></span>&nbsp;<br /><a href=\"https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-definitive-regime_en\" rel=\"noopener\" target=\"_blank\"><span><span>https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-definitive-regime_en</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[4]</span></span> <span><span>FuelCellsWorks</span><span>. EU confirms plans to delay green hydrogen production rules as market growth falls short. 29 October 2026.</span></span>&nbsp;<br /><a href=\"https://fuelcellsworks.com/2026/10/29/h2/eu-confirms-plans-to-delay-green-hydrogen-production-rules-as-market-growth-falls-short\" rel=\"noopener\" target=\"_blank\"><span><span>https://fuelcellsworks.com/2026/10/29/h2/eu-confirms-plans-to-delay-green-hydrogen-production-rules-as-market-growth-falls-short</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>5]</span></span> <span><span>Bird, S. Build agents you can trust across any framework with open evals and a control standard. Microsoft Foundry blog, 2 June 2026.</span></span>&nbsp;<br /><a href=\"https://devblogs.microsoft.com/foundry/build-2026-open-trust-stack-ai-agents/\" rel=\"noopener\" target=\"_blank\"><span><span>https://devblogs.microsoft.com/foundry/build-2026-open-trust-stack-ai-agents/</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>6]</span></span> <span><span>IEC 61511, functional safety for the process industry. IEC 62443, security for industrial automation and control systems.</span></span><span>&nbsp;</span></p>\n<p><span><span>[</span><span>7]</span></span> <span><span>Microsoft Learn. Microsoft Agent Framework workflows: checkpoints and human-in-the-loop.</span></span>&nbsp;<br /><a href=\"https://learn.microsoft.com/en-us/agent-framework/workflows/checkpoints\" rel=\"noopener\" target=\"_blank\"><span><span>https://learn.microsoft.com/en-us/agent-framework/workflows/checkpoints</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>8]</span></span> <span><span>Microsoft Learn. What is Azure IoT Operations?</span></span>&nbsp;<br /><a href=\"https://learn.microsoft.com/en-us/azure/iot-operations/overview-iot-operations\" rel=\"noopener\" target=\"_blank\"><span><span>https://learn.microsoft.com/en-us/azure/iot-operations/overview-iot-operations</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>9]</span></span> <span><span>Microsoft Foundry model </span><span>catalog</span><span>. Aurora-1.5, lifecycle: preview.</span></span>&nbsp;<br /><a href=\"https://ai.azure.com/catalog/models/Aurora-1.5\" rel=\"noopener\" target=\"_blank\"><span><span>https://ai.azure.com/</span><span>catalog</span><span>/models/Aurora-1.5</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>10]</span></span> <span><span>Microsoft Learn. What is digital twin builder (preview)? </span></span><span><span>Microsoft </span><span>Fabric</span><span>.</span></span>&nbsp;<br /><a href=\"https://learn.microsoft.com/en-us/fabric/real-time-intelligence/digital-twin-builder/overview\" rel=\"noopener\" target=\"_blank\"><span><span>https://learn.microsoft.com/en-us/fabric/real-time-intelligence/digital-twin-builder/overview</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>11]</span></span> <span><span>Microsoft Learn. About Azure confidential ledger.</span></span>&nbsp;<br /><a href=\"https://learn.microsoft.com/en-us/azure/confidential-ledger/overview\" rel=\"noopener\" target=\"_blank\"><span><span>https://learn.microsoft.com/en-us/azure/confidential-ledger/overview</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>12]</span></span> <span><span>Commission Implementing Decision (EU) 2024/3180 of 19 December 2024, recognising the </span><span>CertifHy</span><span> voluntary scheme.</span></span>&nbsp;<br /><a href=\"https://eur-lex.europa.eu/eli/dec_impl/2024/3180/oj\" rel=\"noopener\" target=\"_blank\"><span><span>https://eur-lex.europa.eu/eli/dec_impl/2024/3180/oj</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>13]</span></span> <span><span>Liu, C. One requirement, many failure paths: evaluate, control, and </span><span>optimize</span><span> with ASSERT and ACS. Microsoft, 24 August 2026.</span></span>&nbsp;<br /><a href=\"https://commandline.microsoft.com/safety-requirements-failure-paths-assert-acs/\" rel=\"noopener\" target=\"_blank\"><span><span>https://commandline.microsoft.com/safety-requirements-failure-paths-assert-acs/</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>14]</span></span> <span><span>Microsoft Learn. Agent evaluators for generative AI, Microsoft Foundry.</span></span>&nbsp;<br /><a href=\"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators\" rel=\"noopener\" target=\"_blank\"><span><span>https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>15]</span></span> <span><span>Regulation (EU) 2024/1689 (AI Act), Annex III, point 2. European Commission, guidelines on high-risk AI systems, updated 19 October 2026.</span></span>&nbsp;<br /><a href=\"https://digital-strategy.ec.europa.eu/en/policies/guidelines-ai-high-risk-systems\" rel=\"noopener\" target=\"_blank\"><span><span>https://digital-strategy.ec.europa.eu/en/policies/guidelines-ai-high-risk-systems</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[16]</span></span> <span><span>Open-Meteo</span><span>. Historical Weather API, based on the ERA5 reanalysis. Dust from NASA POWER and the Copernicus Atmosphere Monitoring Service.</span></span>&nbsp;<br /><a href=\"https://open-meteo.com/en/docs/historical-weather-api\" rel=\"noopener\" target=\"_blank\"><span><span>https://open-meteo.com/en/docs/historical-weather-api</span></span></a><span>&nbsp;</span></p>\n<p><span><span>[</span><span>17]</span></span> <span><span>Microsoft Azure. Pricing calculator. List prices of November 2026.</span></span>&nbsp;<br /><a href=\"https://azure.microsoft.com/en-us/pricing/calculator/\" rel=\"noopener\" target=\"_blank\"><span><span>https://azure.microsoft.com/en-us/pricing/calculator/</span></span></a><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>"
