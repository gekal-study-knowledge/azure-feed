    "id": "0980c732dc18d6ea63e603eb22b5ac6e"
    "title": "Introducing Brewlet: Manage Golden Images at Platform Speed"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/introducing-brewlet-manage-golden-images-at-platform-speed/ba-p/4576767"
    "published": "2026-11-26 05:14:07"
    "fetched": "2026-11-26 22:17:52"
    "summary": "<p>In October 2026, the PHP project released security updates for critical vulnerabilities that could allow unauthenticated remote code execution. For teams running PHP in Kubernetes, applying a runtime fix can mean more than updating PHP: it can mean rebuilding application images, waiting for application pipelines and approvals, and coordinating deployments across services, even when the application code itself has not changed. That delivery gap matters.</p>\n<p>AI is accelerating software development, but also vulnerability discovery and exploitation, increasing pressure on organizations to respond quickly. But asking every application team to rebuild and redeploy at once is not always practical. How can platform teams deliver a runtime update without making unrelated application releases a prerequisite?</p>\n<p>Today, we’re introducing&nbsp;<a class=\"lia-external-url\" href=\"https://brewlet.sh\" rel=\"noopener\" target=\"_blank\">Brewlet</a>, an experimental open-source project that treats approved runtimes as Kubernetes infrastructure. Application teams publish their application code and launch instructions as an OCI image. Platform teams approve golden runtime images and offer them to selected Kubernetes node pools. Compatible workloads can then use an updated runtime, with a security patch, without rebuilding their application image.</p>\n<h2>Golden images and independent runtime updates solve different problems</h2>\n<p>A golden image can help remove unnecessary components, attack surface and the amount of software teams need to assess. But it still bundles a language interpreter, system library or certificate bundle. When these components live in the final artifact of an application image, their security patches are still tied to the application’s build and release process.</p>\n<p>Brewlet explores a different boundary: separate the application workload from its execution environment so they can be managed on distinct lifecycles. Of course, not every runtime should be moved out of every application image. The right boundary depends on compatibility, operations and who should own the update. But the goal here is to make the separation available when it helps.</p>\n<h2>The application runtime shifts back to infrastructure.</h2>\n<p>With Brewlet, an application image contains the application and its dependencies under /app, along with an explicit launch.json describing how to start it. It does not bundle the selected runtime. A platform team approves a digest-pinned golden runtime image, including its non-root identity, and decides which node pools offer it.</p>\n<p>At container creation, Brewlet composes the application with the approved runtime available on the node. Applications remain ordinary Kubernetes workloads using OCI artifacts, containerd and runc. Sharing runtime files does not mean sharing a process, heap, writable filesystem or resource limits between applications.</p>\n<p>Ultimately, the platform team can curate the runtime environment for its workloads, optionally with a set of common platform-owned dependencies, while application teams keep ownership of application code and application-specific dependencies.</p>\n<h2>How Brewlet fits into Kubernetes</h2>\n<ol>\n<li><strong>Approve a runtime.</strong> The platform team defines a RuntimeImage that points to an approved runtime image by digest and declares its non-root identity.</li>\n<li><strong>Offer it on a pool.</strong> A NodeProfile determines which nodes provide the runtime and how it is provisioned.</li>\n<li><strong>Package the application.</strong> Developers use their existing build tools, then package the application files and launch metadata into an OCI image with the Brewlet CLI.</li>\n<li><strong>Select the runtime.</strong> The Kubernetes workload uses runtimeClassName: brewlet and selects a runtime ID for each managed container. Admission validates the selection and placement; the node provisioner installs the approved runtime, and the Brewlet shim prepares the container for runc.</li>\n</ol>\n<p>The following illustrative Deployment selects a platform-approved php-8.4 runtime for a separately packaged application:</p>\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: orders\n  annotations:\n    brewlet.sh/restart-on-rotation: \"true\"\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: orders\n  template:\n    metadata:\n      labels:\n        app: orders\n      annotations:\n        runtime-image.brewlet.sh/app: php-8.4\n    spec:\n      runtimeClassName: brewlet\n      containers:\n        - name: app\n          image: registry.example.com/apps/orders:v1\n<p>This example assumes the platform has approved and offered php-8.4, and the application has been packaged for that runtime. The restart annotation is on the Deployment metadata. For Brewlet to restart opted-in workloads during rotation, the operator’s rotation-restart feature must also be enabled.</p>\n<h2>Change the runtime, not the application artifact</h2>\n<p>The&nbsp;<a href=\"https://brewlet.sh/docs/php/\" rel=\"noopener\" target=\"_blank\">Brewlet PHP guide</a> demonstrates moving a PHP workload from PHP 8.4.26 to 8.4.27 by changing the approved runtime image while keeping the application digest the same. This example shows that a PHP security release can be qualified and distributed as a platform runtime update rather than requiring an application rebuild for every service.</p>\n<p>It is important to note that a runtime rotation is not an in-place patch to a running process. Existing containers continue using the generation they started with, while new containers use the new generation, and workloads that have opted-in to restart-on-rotation be rolled by their Kubernetes controller when the operator feature is enabled. Workload rollout strategies still apply; paused, partitioned or otherwise constrained workloads can remain on the older generation.</p>\n<p>The <a href=\"https://brewlet.sh/docs/demo/\" rel=\"noopener\" target=\"_blank\">Java demonstration</a> illustrates another kind of runtime change: rotating a JDK also changes the certificate roots in that JDK’s bundled trust store, while preserving the application artifact. It makes visible that a runtime can contain security-relevant material beyond the language executable.</p>\n<h2>What runtime separation does, and does not, solve</h2>\n<p>Brewlet can help platform teams govern and roll out common components supplied by the approved runtime image. It does not update vulnerable libraries packaged under /app, such as application-specific dependencies; those still need an application update. Nor does it eliminate shared risk: if many workloads use the same vulnerable runtime, they are still exposed until they are running a fixed generation. Brewlet changes how that runtime can be distributed and governed, not the need to qualify it, replace workloads and verify the outcome.</p>\n<p>Kubernetes <a href=\"https://kubernetes.io/docs/concepts/storage/volumes/#image\" rel=\"noopener\" target=\"_blank\">image volumes</a> can also separate an application from runtime files and may be the simpler choice for teams whose existing policies and tooling already cover their needs. Brewlet’s additional value is an integrated model for runtime approval, node-pool provisioning, start-time authorization, generation visibility and opt-in rotation.</p>\n<h2>Try Brewlet</h2>\n<p>Brewlet is an MIT-licensed open-source project. The current releases are experimental and intended for evaluation. Start with the&nbsp;<a href=\"https://brewlet.sh/docs/local-kubernetes/\" rel=\"noopener\" target=\"_blank\">local Kubernetes tutorial</a>, which deploys a Python application and demonstrates a runtime rotation in kind. Explore the <a href=\"https://brewlet.sh/docs/demo/\" rel=\"noopener\" target=\"_blank\">Java demonstration</a>, the <a href=\"https://brewlet.sh/docs/language-recipes/\" rel=\"noopener\" target=\"_blank\">language guides</a>, and <a href=\"https://brewlet.sh/docs/choosing-brewlet/\" rel=\"noopener\" target=\"_blank\">when to consider Brewlet</a> for a fuller description of the operational tradeoffs.</p>\n<p>Find Brewlet on&nbsp;<a href=\"https://github.com/microsoft/brewlet\" rel=\"noopener\" target=\"_blank\">GitHub</a>, and use the <a href=\"https://github.com/microsoft/brewlet/issues\" rel=\"noopener\" target=\"_blank\">issue tracker</a> to report problems or share feedback. We’d like to hear how runtime updates flow through your organization today, and whether separating runtime delivery from application releases would make those updates easier to govern.</p>"
  "f25d7fba5e51a4d65aab14ca78b19ca3":
    "id": "f25d7fba5e51a4d65aab14ca78b19ca3"
    "title": "Azure Functions and AWS Lambda: One Trigger vs. Multiple Triggers—What Changes in Your Design?"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-functions-and-aws-lambda-one-trigger-vs-multiple-triggers/ba-p/4574749"
    "published": "2026-11-26 11:28:19"
    "fetched": "2026-11-27 13:37:28"
    "summary": "<p>When moving between Azure Functions and AWS Lambda, one difference quickly stands out:</p>\n<ul>\n<li>An individual&nbsp;<strong>Azure function must have exactly one trigger</strong>.</li>\n<li>An&nbsp;<strong>AWS Lambda function can have multiple triggers</strong>.</li>\n</ul>\n<p>At first glance, Lambda appears more flexible. But what does this difference actually mean for code reuse, event handling, and application design?</p>\n<p>Let’s explore it using a practical example.</p>\n<h2>First, distinguish a function from a Function App</h2>\n<p>In Azure, a&nbsp;<strong>function</strong>&nbsp;and a&nbsp;<strong>Function App</strong>&nbsp;are different things.</p>\n<p>A function is an individual entry point with its own trigger. A Function App is the Azure resource that hosts one or more functions.</p>\n<p>Therefore:</p>\n<p>The one-trigger rule applies to each Azure function—not to the entire Function App.</p>\n<p>A single Function App can contain HTTP-triggered, queue-triggered, and timer-triggered functions.</p>\n<p>Microsoft’s&nbsp;<a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-triggers-bindings\" target=\"_blank\">triggers and bindings documentation</a>&nbsp;explicitly states that a function must have exactly one trigger.</p>\n<p>A Lambda function can have multiple triggers, each invoking it independently. It can also be deployed without any configured triggers and tested directly using a test event in the AWS Lambda console.</p>\n<h2>The scenario: one business operation, multiple entry points</h2>\n<p>Suppose an application processes orders through three channels:</p>\n<ol>\n<li>An HTTP request submits an order.</li>\n<li>A queue delivers an order for background processing.</li>\n<li>A scheduled job starts an order-reconciliation run.</li>\n</ol>\n<p>These entry points may reuse some of the same business logic, even though their payloads and execution requirements differ.</p>\n<h3>AWS Lambda: multiple sources, one handler</h3>\n<p>A possible AWS design is:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>The same Lambda function can be invoked through all three integrations.</p>\n<p>However,&nbsp;<strong>multiple triggers do not mean one invocation combines events from multiple sources</strong>. Each source invokes the function independently.</p>\n<p>The handler must understand the event it receives and apply the appropriate behavior.</p>\n<p>For example:</p>\n<ul>\n<li>API Gateway supplies an HTTP-oriented event.</li>\n<li>SQS supplies a batch-oriented message event.</li>\n<li>A scheduled invocation supplies its configured payload.</li>\n</ul>\n<p>If those payloads differ, the handler needs routing and normalization logic. Integrations that support payload transformation can sometimes reduce that work.</p>\n<p>There is also an important terminology distinction: not every Lambda integration uses the same mechanism. SQS uses a Lambda&nbsp;<strong>event source mapping</strong>, which polls the queue and invokes the function with batches.</p>\n<h3>Azure Functions: separate entry points, shared business logic</h3>\n<p>An equivalent Azure design could be:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Each function has one trigger, but all three can call the same application service.</p>\n<p>The important separation is:</p>\n<p>Multiple function entry points do not require multiple implementations of the business logic.</p>\n<p>The HTTP function handles HTTP concerns. The queue function handles message-processing concerns. The timer function handles scheduled execution. Shared order-processing logic remains in one place.</p>\n<p>&nbsp;</p>\n<h2>What actually changes?</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>Concern</th><th>Multiple triggers on one Lambda</th><th>Multiple Azure functions sharing logic</th></tr></thead><tbody><tr><td>Entry point</td><td>One configured handler receives events from multiple sources</td><td>Separate function entry points</td></tr><tr><td>Event interpretation</td><td>Handler must support the incoming event contracts</td><td>Each entry point handles its trigger-specific contract</td></tr><tr><td>Code reuse</td><td>Shared logic behind the handler</td><td>Shared logic called by multiple functions</td></tr><tr><td>Source-specific responses</td><td>Handler must return the appropriate response for each integration</td><td>Each function implements its own trigger contract</td></tr><tr><td>Deployment</td><td>One Lambda function deployment in this design</td><td>Functions can be deployed together in one Function App</td></tr><tr><td>Isolation</td><td>Sources share the target function’s configuration and concurrency constraints</td><td>Separate functions in one app still share app-level settings and resources</td></tr></tbody></table></div>\n<p>&nbsp;</p>\n<h2>Final takeaway</h2>\n<p>AWS Lambda allows several event sources to invoke one function. Azure Functions requires exactly one trigger per function, while allowing multiple functions within a Function App.</p>\n<p>The most useful comparison is not:</p>\n<p>“Which platform lets me attach more triggers?”</p>\n<p>It is:</p>\n<p>“Where should event-specific handling end, and shared business logic begin?”</p>\n<p>Both platforms support reusable business logic. Their trigger models give you different ways to organize the entry points around it.</p>"
