    "id": "1a4d7d03045ee3f48d7ce4e99a7a69f0"
    "title": "Azure Local: 10 anti-patterns that quietly break a running cluster"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/azure-local-10-anti-patterns-that-quietly-break-a-running/ba-p/4577143"
    "published": "2026-11-27 03:00:52"
    "fetched": "2026-11-27 13:37:26"
    "summary": "<div dir=\"ltr\" lang=\"en\">\n<h2>Part 2: Design and operations anti-patterns for Azure Local</h2>\n<p>An <strong>anti-pattern</strong> is a recurring design or operating choice that looks like a good solution to an immediate problem but creates a bigger problem elsewhere. A storage optimization can look good on a capacity report, for example, and still be the wrong choice if it pushes application latency up during the busiest part of the day.</p>\n<blockquote>\n<p><strong>A note on scope:</strong> These are architecture and operating choices that can quietly erode performance, security, capacity headroom, supportability or service reliability on Azure Local. They are not a list of product defects or a claim that every configuration described is unsupported. The examples use connected, multi-node deployments; apply each check to your topology, release and workload type. The Storage Spaces Direct (S2D) examples cover S2D-backed storage only. For disaggregated Azure Local with SAN-only storage, validate the host-to-array iSCSI or Fibre Channel (FC) paths instead of applying the S2D fabric checklist.</p>\n</blockquote>\n<p>In <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922\" rel=\"noopener\" target=\"_blank\">part one, I covered ten mistakes that can derail an Azure Local deployment before it starts</a>. This time the cluster is already running. In customer design and operations reviews, I keep seeing choices that made sense for one task but became hard to live with: a security policy with unclear ownership, a storage saving that was never measured under load, or an extra management tool introduced for one move. These are the checks I use to catch those patterns before they become the way the platform is run.</p>\n<p>The <a href=\"https://learn.microsoft.com/en-us/azure/well-architected/service-guides/azure-local\" rel=\"noopener\" target=\"_blank\">Azure Well-Architected Framework guide for Azure Local</a> is a useful starting point for reviewing both the platform and its workloads. Look across Reliability, Security, Cost Optimization, Operational Excellence and Performance Efficiency. Each anti-pattern below ends with a check you can bring to a design or Day&nbsp;2 review.</p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPatterns\"></a>\n<h3><span class=\"lia-text-color-10\"><strong>The 10 anti-patterns at a glance</strong></span></h3>\n<ol>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern1\" target=\"_self\">Treating cluster redundancy as workload resiliency</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern2\" target=\"_self\">Putting the backup and its recovery dependencies on the same cluster</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern3\" target=\"_self\">Layering a generic SMB signing policy over the Azure Local baseline</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern4\" target=\"_self\">Treating ReFS deduplication as a default</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern5\" target=\"_self\">Counting volume free space as room to repair</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern6\" target=\"_self\">Leaving S2D storage QoS unfinished on the top-of-rack switches</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern7\" target=\"_self\">Adding a second management plane to solve a mobility problem</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern8\" target=\"_self\">Rehearsing changes without a representative test environment</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern9\" target=\"_self\">Watching the update status instead of the workload</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern10\" target=\"_self\">Collecting telemetry without an owner or an incident timeline</a></li>\n</ol>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern1\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">1.</span> Treating cluster redundancy as workload resiliency</strong></h4>\n<p>Even when the cluster is designed to survive a node failure, that does not tell you whether users can still log in, whether SQL transactions are available, or how much data you would lose if you had to recover at another site. On a multi-node instance, an affected VM can restart on a surviving node if the required resources are available. A restart still interrupts a singleton application, and it does not fix a failed dependency.</p>\n<p>Check redundancy in <strong>both directions</strong>. Two logical paths can terminate on one physical switch, or two power supplies can plug into one power distribution unit. Conversely, two switches and independent power feeds do not help if the application still needs one DNS resolver, one nonredundant load balancer, or one database instance. Two VMs on separate nodes can also share a single cluster shared volume (CSV); separate volumes can reduce the impact of a volume outage, but do not protect against loss of a shared storage back end or the whole site. Trace the paths all the way to their dependencies before you count them as independent.</p>\n<h5><span class=\"lia-text-color-11\"><strong>Start with the business target, then design from the ground up</strong></span></h5>\n<p>Before a critical workload goes live, agree its <strong>recovery time objective (RTO)</strong>, the maximum acceptable time to restore service, and its <strong>recovery point objective (RPO)</strong>, the maximum acceptable data loss expressed as time. Agree with the workload owner on an availability objective and what healthy, degraded and recovered look like. The platform team can own the cluster targets; the application owner should define what users need from the service. For example, recovery means a user can sign in and finish a transaction, not just that the VM responds to a ping. Run a <strong>failure mode analysis (FMA)</strong> on critical flows. For each failure, record the impact, what must stay available, how you will detect it, how you will recover, and who owns the test. That is how you decide where you need high availability and where a restore or a disaster recovery failover is sufficient.</p>\n<div>\n<p style=\"margin-block: 0 0.15em; font-size: 1.14em;\"><strong><span class=\"lia-text-color-10\">Workload resiliency starts below the VM</span></strong></p>\n<p>Follow the dependencies from the application to the infrastructure.</p>\n<div style=\"display: flex;\">\n<div class=\"lia-background-color-3\">\n<p style=\"margin-block: 0 0.2em;\"><span>SERVICE</span><strong>Workload</strong></p>\n<p>Client flow, identity, routing and data.</p>\n</div>\n<div><span>→</span><br /><span style=\"font-size: 0.83em;\">Depends on</span></div>\n<div class=\"lia-background-color-4\">\n<p style=\"margin-block: 0 0.2em;\"><span>RECOVERY</span><strong>VMs and data</strong></p>\n<p>Placement, backup and replication.</p>\n</div>\n<div><span>→</span><br /><span style=\"font-size: 0.83em;\">Depends on</span></div>\n<div class=\"lia-background-color-5\">\n<p style=\"margin-block: 0 0.2em;\"><span>FOUNDATION</span><strong>Infrastructure</strong></p>\n<p>Compute, storage, quorum, and independent network and power.</p>\n</div>\n</div>\n<p class=\"lia-background-color-4\"><strong>Design and test in reverse:</strong> infrastructure first, then VM and data recovery, then the complete user flow. Measure the result against RTO and RPO.</p>\n</div>\n<p><em>Figure 1. Trace dependencies from the workload down. Design and rehearse recovery from the infrastructure up.</em></p>\n<ul>\n<li>At the <strong>infrastructure layer</strong>, match the design to the failure domains you need to survive. Verify power feeds, switches, uplinks, storage resiliency and quorum. Where a witness is required or selected, make sure its placement and network path do not depend on the cluster it arbitrates. Check that the surviving nodes can carry peak CPU and memory demand with a node unavailable (often called <strong>N+1</strong> sizing). Include any additional failure during maintenance if the business requires you to survive it. See <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/disaster-recovery-infrastructure-resiliency?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Infrastructure resiliency for Azure Local</a>.</li>\n<li>At the <strong>VM layer</strong>, place redundant instances across nodes and, where appropriate, separate storage paths. Pair point-in-time backups with continuous VM replication when the targets justify it and the protection method supports the VM. Replication can shorten a site failover, but it does not replace a known-good recovery point: bad writes can replicate too. Test backup restoration and replication failover separately. See <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/disaster-recovery-vm-resiliency?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Virtual machine resiliency for Azure Local</a>.</li>\n<li>At the <strong>workload layer</strong>, design for the service the user needs. For Azure Virtual Desktop on Azure Local, validate session-host capacity, image parity, user profiles (such as FSLogix), identity and routing at the recovery location. For Arc-enabled SQL Server, choose database-native protections appropriate to the recovery targets, such as Always On availability groups, and validate the client connection and the data after failover. Arc enablement does not provide application HA by itself. See <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/disaster-recovery-workloads-resiliency?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Workloads resiliency for Azure Local</a>.</li>\n</ul>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-6 lia-border-style-solid\" scope=\"col\" style=\"border-width: 1px; padding: 0.45em;\"><strong>Failure mode</strong></th><th class=\"lia-border-color-6 lia-border-style-solid\" scope=\"col\" style=\"border-width: 1px; padding: 0.45em;\"><strong>Design question</strong></th><th class=\"lia-border-color-6 lia-border-style-solid\" scope=\"col\" style=\"border-width: 1px; padding: 0.45em;\"><strong>Evidence to ask for</strong></th></tr></thead><tbody><tr><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">Node unavailable at peak load</td><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">Can surviving nodes run the critical workloads without starving storage and network traffic?</td><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">A drain rehearsal and a node-failure drill in a representative environment, with user-flow and capacity measurements.</td></tr><tr><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">Loss of a switch, uplink or resolver</td><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">Does the second path avoid the failed component, including upstream and logical dependencies?</td><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">Path tracing plus a controlled test of client access and the relevant platform traffic.</td></tr><tr><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">Data corruption or loss of the site</td><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">Can you recover clean data and the service without the original cluster?</td><td class=\"lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px; padding: 0.45em;\">An isolated restore and, where applicable, a separate failover test with measured data loss and time to working service.</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Ask for the agreed service targets, a map of the dependencies and shared failure domains, and the last drill result. Compare the actual time to a working user flow and the data lost with the RTO and RPO. A green cluster check does not answer either question.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/well-architected/service-guides/azure-local#reliability\" rel=\"noopener\" target=\"_blank\">Azure Local reliability design guidance</a> and <a href=\"https://learn.microsoft.com/en-us/azure/well-architected/reliability/failure-mode-analysis\" rel=\"noopener\" target=\"_blank\">how to perform failure mode analysis</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake10\" rel=\"noopener\" target=\"_blank\">Mistake 10: No Day-2 plan</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern2\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">2.</span> Putting the backup and its recovery dependencies on the same cluster</strong></h4>\n<p>A backup proxy or data mover on Azure Local is not automatically an anti-pattern. Some backup products use one by design. The anti-pattern is putting the backup repository or the only copy of the recovery tools, catalog, credentials or keys inside the failure boundary of the cluster they protect. A different CSV on the same S2D pool, or a different LUN on the same SAN array, does not by itself make the recovery copy independent.</p>\n<p>There is a performance cost before anything fails. During backup, the pool serves the source VM disk reads. If the repository is on that pool too, it also services the repository writes while production I/O continues. I call this <strong>double taxation of S2D</strong>: the same pool pays for both sides of the backup. Verification, synthetic full operations, or restores can add repository reads, depending on the backup engine. It is not a claim that every backup reads each block twice or that storage I/O always doubles.</p>\n<div>\n<p style=\"margin-block: 0 0.15em; font-size: 1.14em;\"><strong><span class=\"lia-text-color-10\">Where the backup I/O lands</span></strong></p>\n<p>Follow the read and write paths, not just the location of the data mover.</p>\n<div class=\"lia-background-color-2\">\n<p><strong>A. Source and only copy share the S2D pool</strong></p>\n<div style=\"display: flex;\">\n<div class=\"lia-background-color-2\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Production VM disks</strong></p>\n<p>S2D pool A</p>\n</div>\n<div><span>→</span><br /><span style=\"font-size: 0.83em;\">Source reads</span></div>\n<div>\n<p style=\"margin-block: 0 0.2em;\"><strong>Backup data mover</strong></p>\n<p>Transfers the data</p>\n</div>\n<div><span>→</span><br /><span style=\"font-size: 0.83em;\">Repository writes</span></div>\n<div class=\"lia-background-color-2\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Only backup copy</strong></p>\n<p>S2D pool A</p>\n</div>\n</div>\n<p><strong>One storage failure domain:</strong> the pool serves the source reads and repository writes while production is running. Losing the pool can take away both copies.</p>\n</div>\n<div class=\"lia-background-color-4\">\n<p><strong>B. Repository is outside the source failure domain</strong></p>\n<div style=\"display: flex;\">\n<div class=\"lia-background-color-5\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Production VM disks</strong></p>\n<p>S2D pool A</p>\n</div>\n<div><span>→</span><br /><span style=\"font-size: 0.83em;\">Source reads</span></div>\n<div>\n<p style=\"margin-block: 0 0.2em;\"><strong>Backup data mover</strong></p>\n<p>Transfers the data</p>\n</div>\n<div><span>→</span><br /><span style=\"font-size: 0.83em;\">Repository writes</span></div>\n<div class=\"lia-background-color-4\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Recoverable copy</strong></p>\n<p>Independent target</p>\n</div>\n</div>\n<p><strong>Separate the writes:</strong> the source still serves the reads. Keep a copy outside the cluster, and outside the site if site loss is in scope.</p>\n</div>\n</div>\n<p><em>Figure 2. The same-pool design puts production and the only backup copy in one storage failure domain. An independent target moves repository writes off the production pool, not the source reads.</em></p>\n<p>A successful backup job tells you it ran against the objects it found. It does not prove every critical VM was still in scope. After a VM moves between clusters, is restored, or changes protection groups, reconcile the current workload inventory with the recovery points in the catalog. Confirm each required VM has a recent usable point and test a representative full restore, not just a file restore.</p>\n<p><strong>Ignite 2026 — backup tool validation:</strong> The <a href=\"https://techcommunity.microsoft.com/blog/azurearcblog/building-a-trusted-ecosystem-for-sovereign-private-cloud-azure-local-validated-p/4567325\" rel=\"noopener\" target=\"_blank\">Azure Local Validated ISV Program</a> gives you a starting point for evaluating backup and recovery tools. Check the <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/azure-local-validated-isv-ecosystem?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">published validation scope</a> for the specific product, capability, and deployment configuration. Then prove your own restore with the source cluster unavailable; a listing does not replace that test.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Draw the paths for backup <em>and</em> restore. Can an operator reach the repository, recover or rebuild the catalog, authenticate, retrieve the necessary keys and restore to a supported target with the entire source cluster unavailable? Test that scenario in isolation. Keep backup data and the services needed to recover it outside the source Azure Local instance and its failure boundary. Maintain an isolated or immutable copy, and keep a copy at a different location if site loss is in scope. Measure production write latency during backup and verify that the recovery target and network can carry restores at the required rate.</p>\n<p><strong>Trusted Launch:</strong> Back up all VM files and the VM guest state protection key. A restored VM needs that key to boot. The Azure Local guidance does not support Azure Site Recovery for this VM type and describes a restore to a different Azure Local instance as locally managed, not managed through the Azure Local control plane. Test the supported recovery path for the VM you actually run.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/disaster-recovery-vm-resiliency?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Azure Local VM backup, replication and restore testing</a> and <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/trusted-launch-vm-overview?view=azloc-2610#backup-and-disaster-recovery-considerations\" rel=\"noopener\" target=\"_blank\">Trusted launch backup and recovery considerations</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake10\" rel=\"noopener\" target=\"_blank\">Mistake 10: No Day-2 plan</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern3\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">3.</span> Layering a generic SMB signing policy over the Azure Local baseline</strong></h4>\n<p>What sometimes gets called <strong>“double SMB signing”</strong> is a policy ownership problem, not two signatures on every packet. The Azure Local security baseline distinguishes signing for external Server Message Block (SMB) traffic from encryption for in-cluster SMB traffic. Applying a generic Windows Server Group Policy Object (GPO) on top, without checking its scope, can make a different requirement take effect on the hosts than the team intended. Changing baseline-managed settings by GPO or registry is not the supported customization path.</p>\n<p>The cluster can look fine at idle. Look at storage throughput, host CPU and SMB-based live migration under load, especially after a policy refresh or solution update. An adapter showing Remote Direct Memory Access (RDMA) enabled does not, by itself, prove that the intended SMB traffic uses the expected transport. Do not apply older Windows Server SMB Direct guidance wholesale: modern SMB Direct supports encryption before data placement. That is an encryption capability, not a claim about the performance of SMB signing. Measure the negotiated connection and workload before attributing a bottleneck to either control.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> On domain-joined hosts, compare resultant Group Policy with the Azure Local baseline and its documented customizations; check enforced links as well as what the OU is expected to inherit. Compare relevant SMB client/server settings and active SMB Multichannel connections under a representative load. If a baseline exception is required, have the security and platform owners agree on it and use the supported method for the installed release. For version 2610 and later, check the documented prerequisites for using <code>Get-AzsSecurityPolicyIntent</code> and <code>Set-AzsSecurity</code> with drift control enabled. Do not assume older releases support the same customization workflow. Record the exception owner, compensating control and expiry, and retest after an update. Do not disable signing or encryption as a generic performance fix.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/manage-secure-baseline?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Manage Azure Local security defaults</a> and <a href=\"https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-direct\" rel=\"noopener\" target=\"_blank\">SMB Direct and encryption behavior</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake6\" rel=\"noopener\" target=\"_blank\">Mistake 6: Leaving AD, firewall and proxy to Day 1</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern4\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">4.</span> Treating ReFS deduplication as a default</strong></h4>\n<p>ReFS deduplication is a supported optimization on applicable Azure Local configurations. It can be a good fit for active, read-heavy workloads with a lot of duplicate data, such as virtual desktop infrastructure (VDI). The anti-pattern is turning it on for every CSV, scheduling all jobs together, or counting expected savings as capacity you can promise. ReFS deduplication and Windows Data Deduplication are distinct features. Do not enable both on the same volume.</p>\n<p>What makes this hard to spot is the calendar. A volume can behave normally until deduplication jobs run alongside backup, peak application I/O or storage repair. Microsoft Learn documents that concurrent ReFS deduplication jobs on multiple CSVs can cause CSV moves and affect performance. Disabling the feature does not immediately undo existing deduplication; the footprint can grow again as normal volume activity continues. For a backup repository, follow the backup product's guidance rather than reusing settings from a VDI volume.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Pilot on one representative volume. Compare usable savings, CPU, storage latency, job duration and workload response before and during a run. Stagger schedules, including relative to backups and maintenance. Count the savings only if the workload still meets its performance target. Use measured physical growth for purchasing decisions, not an assumed savings ratio, and do not spend the space you need for repair.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/refs-deduplication-and-compression?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">ReFS deduplication in Azure Local, including prerequisites and known issues</a>. <strong>Related here:</strong> <a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern5\" target=\"_self\">Anti-pattern 5: Pool capacity and repair reserve</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern5\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">5.</span> Counting volume free space as room to repair</strong></h4>\n<p>On Azure Local with S2D, free space inside a cluster shared volume tells you how much more data that file system can hold. It does not tell you how much unallocated space S2D has to rebuild a missing copy. Thin provisioning can hide the gap because several volumes can grow into the same pool. Fixed provisioning is not a free pass either: a fixed volume can have lots of room for files while its allocation has already used up most of the pool.</p>\n<div>\n<p style=\"margin-block: 0 0.15em; font-size: 1.14em;\"><strong><span class=\"lia-text-color-10\">Volume free space is not repair space</span></strong></p>\n<p>These are two different views. The blocks are conceptual, not to scale.</p>\n<div class=\"lia-background-color-3\">\n<p><strong>Logical view · What the workloads see</strong></p>\n<div style=\"display: flex;\">\n<div class=\"lia-background-color-3\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Thin CSV A</strong></p>\n<p>Presented size</p>\n</div>\n<div class=\"lia-background-color-3\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Thin CSV B</strong></p>\n<p>Presented size</p>\n</div>\n<div class=\"lia-background-color-3\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Thin CSV C</strong></p>\n<p>Presented size</p>\n</div>\n</div>\n<p>Presented capacity is not reserved capacity.</p>\n</div>\n<div class=\"lia-background-color-5\">\n<p><strong>Physical view · What the S2D pool must fund</strong></p>\n<div style=\"display: flex;\">\n<div class=\"lia-background-color-5\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Allocated footprint</strong></p>\n<p>Includes resiliency copies.</p>\n</div>\n<div class=\"lia-background-color-4\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Growth headroom</strong></p>\n<p>Unallocated room for growth and bursts.</p>\n</div>\n<div class=\"lia-background-color-2\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Repair reserve</strong></p>\n<p>Keep unallocated for repairs.</p>\n</div>\n</div>\n<p>Watch the actual pool allocation and protect the reserve before committing more capacity.</p>\n</div>\n</div>\n<p><em>Figure 3. Logical volume sizes describe what can be addressed. Physical pool allocation, growth headroom and the unallocated repair reserve describe what the cluster can sustain.</em></p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Compare <code>Size</code> and <code>AllocatedSize</code> on the S2D pool, check committed volume capacity and growth, and keep repair reserve unallocated. The volume planning guide recommends leaving capacity equivalent to one capacity drive per server, up to four drives, for drive repair. That is not a guarantee that you can rebuild after losing a whole node; model that separately for the failures you are designing for. Check that capacity alerts are enabled and reach an owner. Keep the recommended default thin-provisioning alert at 70% pool utilization unless there is a documented reason to change it. Set a separate planning trigger early enough to buy, install and validate more capacity before growth reaches the reserve. For SAN-backed volumes, take the same question to the array team: compare actual allocation and thin commitments, and use the array vendor’s guidance for headroom and alerts rather than applying the S2D reserve rule.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/manage-thin-provisioning-23h2?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Storage thin provisioning in Azure Local</a> and <a href=\"https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/plan-volumes#reserve-capacity\" rel=\"noopener\" target=\"_blank\">volume planning and reserve capacity</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake7\" rel=\"noopener\" target=\"_blank\">Mistake 7: No headroom in storage or network</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern6\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">6.</span> Leaving S2D storage QoS unfinished on the top-of-rack switches</strong></h4>\n<p><strong>This anti-pattern applies to the switched S2D storage fabric on Azure Local.</strong> S2D pools drives across the nodes and provides the volumes that hold the VMs. When S2D traffic is switched, inter-node storage I/O, including replication and repair, depends on the top-of-rack (ToR) switches. If that path cannot keep up, fast drives and healthy hosts will not save a VM that is waiting for its disk.</p>\n<p>I have seen this one a few times: Network ATC shows a successful intent on every host, storage paths respond, and everything looks fine until a node rejoins and storage resynchronization competes with regular VM I/O. The storage VLAN might be present on both switches, but the switch side of the quality-of-service (QoS) policy was never finished. Connectivity proves the traffic can get through; it does not prove the fabric will handle it correctly when queues fill.</p>\n<div>\n<p style=\"margin-block: 0 0.15em; font-size: 1.14em;\"><strong><span class=\"lia-text-color-10\">Validate the path that backs the volume</span></strong></p>\n<p>Choose the check that matches the storage backing the virtual machine.</p>\n<div class=\"lia-background-color-5\">\n<p><strong>A. Azure Local with switched S2D</strong></p>\n<div style=\"display: flex;\">\n<div class=\"lia-background-color-5\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Azure Local node A</strong></p>\n<p>Storage adapter</p>\n</div>\n<div><span>↔</span></div>\n<div class=\"lia-background-color-4\">\n<p style=\"margin-block: 0 0.2em;\"><strong>ToR storage fabric</strong></p>\n<p>Inter-node S2D I/O, including replication and repair.</p>\n</div>\n<div><span>↔</span></div>\n<div class=\"lia-background-color-5\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Azure Local node B</strong></p>\n<p>Storage adapter</p>\n</div>\n</div>\n<p><strong>Prove the host and switch together:</strong> verify the host intent and switch QoS under load. Verify DCB and QoS against the documented switched S2D requirements for RoCEv2 or iWARP, as applicable.</p>\n</div>\n<div class=\"lia-background-color-4\">\n<p><strong>B. Disaggregated Azure Local (SAN-only)</strong></p>\n<div style=\"display: flex;\">\n<div class=\"lia-background-color-5\">\n<p style=\"margin-block: 0 0.2em;\"><strong>Azure Local hosts</strong></p>\n<p>Dedicated iSCSI adapters or FC host bus adapters.</p>\n</div>\n<div><span>↔</span></div>\n<div class=\"lia-background-color-3\">\n<p style=\"margin-block: 0 0.2em;\"><strong>iSCSI or Fibre Channel</strong></p>\n<p>iSCSI IP paths <strong>or</strong> Fibre Channel fabrics. Validate paths within the chosen design.</p>\n</div>\n<div><span>↔</span></div>\n<div class=\"lia-background-color-4\">\n<p style=\"margin-block: 0 0.2em;\"><strong>External SAN</strong></p>\n<p>Array LUNs provide the cluster volumes.</p>\n</div>\n</div>\n<p><strong>Prove host-to-array failover:</strong> verify MPIO and independent paths in the chosen protocol. The S2D inter-node storage fabric is not part of this design.</p>\n</div>\n</div>\n<p><em>Figure 4. Switched S2D depends on the inter-node storage fabric. Disaggregated SAN-only storage depends on the separate host-to-array iSCSI or Fibre Channel paths.</em></p>\n<h5><span class=\"lia-text-color-6\"><strong>Verify the queue, not just the port</strong></span></h5>\n<p>For S2D storage carried through switches, use the Azure Local physical network requirements and your switch vendor's guidance. Match the switch QoS policy to the host settings on every path carrying storage traffic. Azure Local lists Priority Flow Control (PFC) and Enhanced Transmission Selection (ETS) in its storage-switch requirements. For either switched S2D transport, verify the applicable Data Center Bridging (DCB) and QoS settings end to end:</p>\n<ul>\n<li><strong>Class of Service (CoS):</strong> verify the host's 802.1p priority maps to the intended storage traffic class and queue. An enabled feature on the port means little if storage frames land in the default queue.</li>\n<li><strong>Priority Flow Control (PFC):</strong> verify the intended storage priority is configured for lossless operation along the path. Turning on PFC on a port is not the same as enabling it for the right priority.</li>\n<li><strong>Enhanced Transmission Selection (ETS):</strong> verify the storage class gets its intended bandwidth share when it competes with other classes. Match the policy to the design instead of copying priorities or percentages from another cluster.</li>\n</ul>\n<p>For switched S2D storage, the documented Azure Local QoS policy applies to both RoCEv2 and iWARP. Use the documented settings for your RDMA transport, validated switch and topology rather than treating a sample configuration as universal. If storage traffic is switchless, the ToR steps here do not apply to those direct links. For the S2D design you use, verify VLANs, maximum transmission unit (MTU) and redundant paths as applicable.</p>\n<p>Under heavy storage activity, a mismatched policy can contribute to packet drops and higher storage latency. If the path becomes severely impaired, a CSV can temporarily pause and queue I/O while access is restored. VMs on that volume can stall and applications can time out even if their compute nodes are still up. A PFC pause frame is <em>not</em> a CSV pause, and a Failover Clustering event such as 5120 is <em>not</em> proof of a DCB problem. Check the event status and correlate it with the switch and host evidence before assigning a cause.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Put named platform and network owners on the same change plan, even if they sit in different buildings or time zones. Compare <code>Get-NetIntent</code> and <code>Get-NetIntentStatus</code> with the running switch configuration, verify the active SMB Direct paths, and have the network owner capture per-port and per-queue throughput, discards and PFC pause counters where applicable. Have the platform owner capture CSV latency and workload response on the same timeline. Prove both paths in a representative environment, including a controlled single-path test with storage and live-migration traffic. Record the port map, expected priorities and test evidence in one place. Change ATC-managed host settings through documented overrides, and repeat the check after a switch, adapter or firmware change.</p>\n<h5><span class=\"lia-text-color-6\"><strong>Disaggregated Azure Local: verify the iSCSI or Fibre Channel paths instead</strong></span></h5>\n<p>In a SAN-only deployment, the array supplies the cluster volumes. Those volumes do not depend on the S2D inter-node replication and repair fabric, so do not apply the S2D DCB checklist to the SAN connections. If iSCSI shares Ethernet with other traffic, assess the optional QoS and bandwidth reservation guidance for iSCSI separately. The storage availability check is now whether each Azure Local host can reach the array over independent paths:</p>\n<ul>\n<li><strong>iSCSI (TCP/IP):</strong> Verify the dedicated iSCSI adapters are outside Network ATC, that the intended IP paths reach the target portals, and that multipath sessions persist. Check VLAN and MTU settings end to end for the design you use.</li>\n<li><strong>Fibre Channel (FC):</strong> Verify the host bus adapters, independent FC fabrics and zoning to the intended array ports.</li>\n</ul>\n<p>For either protocol, confirm the same LUNs are presented to all cluster nodes and that Multipath I/O (MPIO) sees the expected paths. In an approved test, measure the workload impact of losing one path against the agreed service target. If the cluster uses both S2D and SAN, validate the paths separately: use the S2D checklist for the S2D fabric and the iSCSI or FC checklist for the SAN-backed volumes. See <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/deploy/enable-external-storage?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Microsoft Learn: Connect an external storage array to Azure Local</a>.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/concepts/physical-network-requirements?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Azure Local physical network and switched QoS requirements</a>, <a href=\"https://learn.microsoft.com/en-us/windows-server/networking/network-atc/manage-network-atc\" rel=\"noopener\" target=\"_blank\">Network ATC and documented overrides</a>, and <a href=\"https://learn.microsoft.com/en-us/troubleshoot/windows-server/high-availability/event-id-5120-cluster-shared-volume-troubleshooting-guidance\" rel=\"noopener\" target=\"_blank\">CSV event 5120 troubleshooting</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake7\" rel=\"noopener\" target=\"_blank\">Mistake 7: No headroom in storage or network</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern7\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">7.</span> Adding a second management plane to solve a mobility problem</strong></h4>\n<p>A script that works against a traditional Hyper-V VM is not automatically the right tool for an <strong>Azure Local VM enabled by Azure Arc</strong>. If Azure owns VM configuration and a local tool changes the same properties, the VM can keep running while its Azure representation and the underlying state diverge. The next automation run, update or recovery is often when the difference matters. Local tools are still appropriate for the operations listed in the supported VM operations matrix. A locally managed Hyper-V VM whose <em>guest OS</em> is Arc-enabled is a different management model.</p>\n<h5><span class=\"lia-text-color-6\"><strong>Field lesson: a successful move is not proof of a supportable design</strong></span></h5>\n<p>The pressure point is often cross-cluster mobility. The Arc-enabled Azure Local VM operations matrix supports live migration <em>within</em> the same cluster, not to another cluster. System Center Virtual Machine Manager (VMM, often called SCVMM) is a legitimate choice for eligible <em>VMM-managed</em> VMs: Microsoft documents live migration between Azure Local instances in that model. It does not make cross-cluster live migration supported for an Azure-managed VM, and dual management of the same VM from Azure and VMM is not supported. Check the VMM version and topology requirements before choosing it.</p>\n<p>The shortcut I watch for is adding VMM just to get a move done, then letting fabric tooling or host scripts change the live-migration or switch settings that Network ATC owns. Microsoft does not support using VMM to configure Azure Local host or cluster networking. A move that succeeds once can leave you with two sources of configuration. The next intent reconciliation, node replacement or solution update can expose that drift. Keep host networking under Network ATC and use its documented configuration path.</p>\n<h5><span class=\"lia-text-color-11\"><strong>Start with the outcome, not the tool</strong></span></h5>\n<ul>\n<li><strong>Planned mobility:</strong> Use the documented intra-cluster live migration for Arc-enabled Azure Local VMs. If routine live moves between Azure Local instances are a hard requirement, evaluate VMM as the deliberate, single management model for eligible workloads. For an occasional move where downtime is acceptable, design a supported cutover rather than adopting another management plane for one task.</li>\n<li><strong>On-premises recovery:</strong> Consider Hyper-V Replica between Azure Local clusters when the VM and topology are eligible and the workload can tolerate its measured RTO and RPO. It avoids adding a second VM lifecycle manager for recovery. Replication is asynchronous and failover is operator-initiated. Planned failover shuts down the source VM and sends pending changes before cutover; unplanned failover can lose changes that did not reach the replica. Neither is live migration or automatic high availability.</li>\n<li><strong>Application high availability:</strong> If the service must keep accepting requests through an instance failure, design application-level redundancy, data replication and traffic failover across the required failure domains. VM mobility and an asynchronously replicated copy do not guarantee that outcome. See <a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern1\" target=\"_self\">anti-pattern 1</a>.</li>\n</ul>\n<p><strong>Ignite 2026 — moving workloads into Azure Local:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/migrate/migrate-whats-new?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Azure Catalyst (formerly Azure Migrate)</a> now includes Azure Local migrations in its unified experience. Use it to evaluate and migrate eligible source VMs into Azure Local; Microsoft Learn still lists Hyper-V source migration in preview. This is an onboarding workflow, not live migration between Azure Local clusters, and it does not change the supported operations for Arc-enabled Azure Local VMs.</p>\n<p>For cluster-to-cluster Hyper-V Replica, plan for the Replica Broker roles, replication bandwidth and target capacity. Rehearse an isolated test failover, client connectivity, reverse replication and failback. An Arc-enabled Azure Local VM failed over to the other cluster runs as a locally managed VM; do not assume its Azure management state follows it. If it will stay there, plan the documented registration and reconnection steps where supported. Check recovery constraints separately for Trusted Launch and other specialized VM configurations.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> For each VM, name the lifecycle owner and the supported interface for each action. For a cross-cluster requirement, write down whether it is a live move, a planned cutover, recovery from a loss, or uninterrupted application service. In the destination test, check client access, time to service, data loss, backup enrollment, monitoring, and who can manage the VM. A successful move is not enough to pass.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/virtual-machine-operations?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Supported operations for Azure Local VMs enabled by Azure Arc</a>, <a href=\"https://learn.microsoft.com/en-us/system-center/vmm/manage-azure-stack-hci?view=sc-vmm-2025\" rel=\"noopener\" target=\"_blank\">manage Azure Local instances in VMM</a>, <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/disaster-recovery-vm-resiliency?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Azure Local VM resiliency and Hyper-V Replica</a>, and <a href=\"https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/replication-failover\" rel=\"noopener\" target=\"_blank\">Hyper-V Replica failover scenarios</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake1\" rel=\"noopener\" target=\"_blank\">Mistake 1: Selling a hypervisor, not a hybrid platform</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern8\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">8.</span> Rehearsing changes without a representative test environment</strong></h4>\n<p>A test VM on the production cluster can show that an application starts. It cannot give you a safe place to rehearse losing a storage path or replacing a node. A small lab is useful, but if all it proves is that an update installs on idle hosts, it does not tell you how a busy workload responds to a drain, a storage resync or a failover.</p>\n<p>Match the lab to the question. To prove a switch change, mirror the production host adapters, firmware, switch policies and storage paths that matter to the change. To prove workload continuity, bring a representative workload and exercise a client operation throughout the test. A lab can be smaller than production; what matters is that it reproduces the relevant dependency, failure mode and load. Use it to validate policy and automation changes, benchmark a storage setting, and rehearse node replacement and operating procedures, not just monthly updates.</p>\n<p><strong>Ignite 2026 — rehearse with the VM types you run:</strong> <a href=\"https://techcommunity.microsoft.com/blog/azurearcblog/whats-new-with-sovereign-private-cloud-at-microsoft-ignite-2026/4573886\" rel=\"noopener\" target=\"_blank\">AMD SEV-SNP confidential VMs reached general availability</a> on supported Azure Local hardware. The <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/manage/confidential-vm-overview?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">documented limitations</a> still rule out migrating a running confidential VM. If your maintenance plan assumes a live move, rehearse the supported shutdown and cutover on representative hardware and measure the impact on the application.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Pick one upcoming change and ask what the lab can actually prove. Record the result against an agreed workload target, the expected duration, and what would make you stop before expanding the rollout. If scale or workload behavior cannot be reproduced fully, a monitored, lower-criticality production ring can reduce exposure after lab validation. It is still production: use an approved maintenance window and keep the lab for tests you cannot safely run there.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/update/update-best-practices?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Azure Local test-cluster and phased update guidance</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake8\" rel=\"noopener\" target=\"_blank\">Mistake 8: Testing in production</a>. <strong>Related here:</strong> <a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern9\" target=\"_self\">Anti-pattern 9: Watch the workload during updates</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern9\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">9.</span> Watching the update status instead of the workload</strong></h4>\n<p>A supported Azure Local solution update is the starting point. Use the Azure Local experience in Azure Update Manager or the documented solution update workflow for your scenario. A generic server-patching job does not coordinate readiness, workload drains and component dependencies, including OEM Solution Builder Extension (SBE) content where applicable. But even when the right workflow completes successfully, the update status cannot tell you whether users could still do their work throughout the window.</p>\n<p>The test is what happens when events overlap: VMs are moving, storage work such as S2D resynchronization is in progress, and a backup or database maintenance job starts. Each can be fine on its own. Together, they can spend the headroom your critical applications need. Watch the application, not just the host or the update status.</p>\n<ul>\n<li><strong>Before:</strong> check update readiness, known issues, OEM requirements, active faults and repairs, and surviving-node headroom. Agree with workload owners which heavy jobs to move or throttle, the client operation you will test, and the limits that would stop the rollout from proceeding to the next cluster.</li>\n<li><strong>During:</strong> timestamp each drain, migration and any storage repair or resync alongside relevant network counters, volume latency and application health. Watch a real service signal, such as whether a database client can still connect and complete a transaction.</li>\n<li><strong>After:</strong> verify the workloads, storage health and pending repairs. Review any service-level objective (SLO) breach, unexpected failover or missing evidence before starting the next production batch. Use the documented troubleshooting path if an update is already in progress and encounters a problem.</li>\n</ul>\n<p><strong>November 2026 release example — SAN path checks:</strong> The <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/known-issues?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Azure Local 2611 release notes</a> document a fix for Multipath I/O (MPIO) registrations not always being preserved during OS composition. On SAN-backed deployments, capture the expected path count for each LUN before servicing and verify the actual paths afterward. A completed update is not evidence that storage path redundancy is intact.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Ask to see the workload evidence for the last maintenance window, not just the update history. If the change record cannot show what users experienced and for how long, add that measurement to the next monitored rollout.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/update/update-best-practices?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Best practices for Azure Local updates</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake9\" rel=\"noopener\" target=\"_blank\">Mistake 9: Updating without a readiness routine</a>. <strong>Related here:</strong> <a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern10\" target=\"_self\">Anti-pattern 10: Keep an incident timeline</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<a class=\"lia-anchor\" id=\"community--1-AntiPattern10\"></a>\n<h4 class=\"lia-linked-item\"><strong><span class=\"lia-text-color-8\">10.</span> Collecting telemetry without an owner or an incident timeline</strong></h4>\n<p>A dashboard shows what happened to whoever opens it. It does not tell the right team that a security signal stopped arriving, storage demand is outpacing the forecast, or a latency spike began before a node drained. Start with a passive baseline covering ordinary workload peaks and compare it with maintenance and repair windows. A daily average can hide a short-lived problem that users felt immediately.</p>\n<p>When a volume gets slow, use adapter, CSV and virtual disk measurements to work out where the delay surfaced and which workloads were using the volume. On S2D, cluster performance history is a useful starting point; its samples are rolled up over time. For SAN-backed storage, include the array and fabric telemetry relevant to that path. Capture short-interval evidence while it is available. Put that evidence alongside switch queue counters, cluster events, the job schedule and application response on a shared time base. A spike is a lead, not a root cause.</p>\n<p><strong>Ignite 2026 — connect telemetry to user impact:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/health-models/overview\" rel=\"noopener\" target=\"_blank\">Azure Monitor health models</a> reached general availability, as noted in the <a href=\"https://news.microsoft.com/events/ignite/2026/book-of-news/\" rel=\"noopener\" target=\"_blank\">Ignite Book of News</a>. In a connected environment already sending relevant signals to Azure Monitor, start with one critical user flow and map the signals and dependencies that tell you whether it works. This is an optional Azure Monitor capability, not a new Azure Local cluster feature or a substitute for an alert owner.</p>\n<p><strong><span class=\"lia-text-color-11\">Review check:</span></strong> Give each actionable alert a threshold, an owner and a first response. Test that a notification reaches the intended on-call team, and monitor for stale or missing signals. Name who preserves the short-interval data and who correlates it across teams. Set log collection and retention to meet the use case and give any metered ingestion an owner. Monitor a critical user flow rather than VM uptime alone, and use the recovery targets in <a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPattern1\" target=\"_self\">anti-pattern 1</a> for recovery-specific signals.</p>\n<p><strong>Microsoft Learn:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/concepts/monitoring-overview?view=azloc-2611\" rel=\"noopener\" target=\"_blank\">Azure Local monitoring overview</a>, <a href=\"https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/performance-history\" rel=\"noopener\" target=\"_blank\">Storage Spaces Direct performance history</a>, and <a href=\"https://learn.microsoft.com/en-us/azure/well-architected/reliability/monitoring\" rel=\"noopener\" target=\"_blank\">Well-Architected guidance for monitoring workload reliability</a>. <strong>From part one:</strong> <a href=\"https://techcommunity.microsoft.com/blog/AzureInfrastructureBlog/azure-local-10-mistakes-that-can-derail-your-deployment-before-it-starts/4569922#Mistake10\" rel=\"noopener\" target=\"_blank\">Mistake 10: No Day-2 plan</a>.</p>\n<p><a href=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureInfrastructureBlog#community--1-AntiPatterns\" target=\"_self\">Back to the ten anti-patterns</a></p>\n<h2><span class=\"lia-text-color-14\"><strong>What I would check first</strong></span></h2>\n<p>Pick one workload and one upcoming change. Ask three questions: <strong>Who owns each setting? What does the supported change path look like? What measurement tells us it worked?</strong> The answer might be stable latency during backup, an alert reaching the right team, or a cutover that meets the workload target. Record what you observed and give any gap an owner.</p>\n<h2><strong>Thank you for reading this far. </strong>If one of these made you think, “<strong>We’ve been there</strong>,” tell me in the comments which one it was and what you check differently now. What looked fine on day one but only became obvious after you’d been running Azure Local for a while? If I missed a pattern or you’d take a different approach, <strong>I’d love to hear that too</strong>. I’ll keep adding patterns as they emerge in the field, <strong>so the next team knows what to look for.</strong></h2>\n</div>"
