  "e6efff0b10389b09789d904ba8bf40d9":
    "id": "e6efff0b10389b09789d904ba8bf40d9"
    "title": "Designing GitHub Actions Runners on Private AKS with a Secured Azure Virtual WAN Hub"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/designing-github-actions-runners-on-private-aks-with-a-secured/ba-p/4574649"
    "published": "2026-11-19 14:09:10"
    "fetched": "2026-11-20 02:46:57"
    "summary": "<p>Self-hosted GitHub Actions runners can execute workflows close to private deployment targets without making those targets publicly reachable. That network access also makes the runner environment part of the security boundary. A workflow can use the connectivity and credentials available to its runner, so private connectivity needs to be considered alongside outbound access, repository permissions, and workload isolation.</p>\n<p>A private Azure Kubernetes Service (AKS) cluster protects access to the Kubernetes API through private networking. It does not, by itself, restrict all traffic leaving the nodes or runner pods. In this single-region design, the AKS virtual network connects to a secured Azure Virtual WAN hub. Azure Firewall applies destination-based policies to Internet-bound connections, while authorized administrators reach the private API from a management host with the required network access.</p>\n<p>Actions Runner Controller (ARC) manages ephemeral runners as Kubernetes pods and adjusts runner capacity to the jobs assigned by GitHub Actions. A dedicated user node pool separates runner execution from the pool selected for the controller and listener. Runner-pod scaling and AKS node scaling remain different mechanisms, with separate capacity and operational considerations.</p>\n<p>The design brings together private API access, controlled GitHub egress, runner authentication, and firewall logging. Network-isolated AKS with a managed bootstrap cache and GitHub App authentication are selected options, not universal requirements for every private runner deployment. The sections below explain those choices and link their commands and configuration settings to official Microsoft and GitHub sources.</p>\n<h2>Overall connectivity</h2>\n<img /><em>Figure 1. Overall connectivity for GitHub Actions runners on private AKS with a secured Azure Virtual WAN hub.</em>\n<p>The four numbered paths show how the environment is managed, reaches GitHub, retrieves bootstrap artifacts, and records firewall activity:</p>\n<ol>\n<li>Administrators reach the management VM through Azure Bastion or approved private access, then manage AKS through its private Kubernetes API.</li>\n<li>The ARC controller, listener, and runner pods initiate outbound HTTPS connections to GitHub through the secured hub and Azure Firewall. No inbound GitHub job webhook is configured.</li>\n<li>AKS nodes retrieve bootstrap artifacts through the private ACR endpoint. This cache does not replace GitHub Container Registry access for runner images.</li>\n<li>Azure Firewall sends diagnostic logs to Log Analytics so operators can investigate allowed and denied connections.</li>\n</ol>\n<p>The private API and bootstrap-cache paths do not traverse the hub firewall. Management-tool Internet access and connections to deployment targets are not shown.</p>\n<h2>Architecture scope and validation</h2>\n<p>The architecture and configuration examples cover:</p>\n<ul>\n<li>Private Kubernetes API access from an authorized management host, without a public API endpoint</li>\n<li>Internet-bound spoke traffic routed through the secured hub and GitHub-specific firewall application rules</li>\n<li>ARC configuration and a manually triggered workflow targeting a dedicated runner node pool</li>\n<li>Firewall evidence for allowed GitHub connections and controlled denied connections</li>\n<li>Ephemeral runner lifecycle and its distinction from AKS node autoscaling</li>\n</ul>\n<p>The baseline uses GitHub.com, Azure public cloud, Linux nodes, organization-scoped runner registration, and shell-only workflow steps. It does not configure container builds, production deployment credentials, or hostile multi-tenant isolation.</p>\n<p>The command blocks explain configuration rather than direct deployment. A documented command or setting does not establish that the complete combination has been validated in a particular subscription, region, or security environment. Expected results below are validation criteria, not results from an executed deployment.</p>\n<p>The command blocks explain configuration rather than direct deployment. A documented command or setting does not establish that the complete combination has been validated in a particular subscription, region, or security environment. Expected results below are validation criteria, not results from an executed deployment.</p>\n<h2>Prerequisites and assumptions</h2>\n<p>The configuration examples assume:</p>\n<ul>\n<li>An Azure subscription with the permissions required for the network, firewall, AKS cluster, managed identity, and scoped role assignments</li>\n<li>Sufficient regional VM quota and an approved budget for Azure Firewall, Virtual WAN, AKS nodes, the private bootstrap registry, monitoring, and management services</li>\n<li>A GitHub organization and private repository, with a plan that supports creating the additional restricted runner group used here, such as GitHub Team or GitHub Enterprise</li>\n<li>Permission to configure an approved ARC authentication method; the example chooses an organization-owned GitHub App</li>\n<li>An approved Linux management host with private access to the AKS spoke, Azure CLI 2.73.0 or later, Helm 3, a compatible&nbsp;kubectl,&nbsp;kubelogin, and Bash</li>\n<li>Outbound access from that management host to Azure sign-in and management services and GitHub's OCI chart distribution endpoints</li>\n</ul>\n<p>The host can be a VM in the spoke's management subnet, accessed through Azure Bastion or an existing approved private connection. A public SSH endpoint is not part of this design. A default, unconnected Cloud Shell session does not provide private cluster access. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/private-cluster-connect\" rel=\"noopener\" target=\"_blank\">private AKS connectivity guidance</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/bastion/tutorial-create-host-portal\" rel=\"noopener\" target=\"_blank\">Azure Bastion connectivity</a>, and&nbsp;<a href=\"https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/manage-access\" rel=\"noopener\" target=\"_blank\">runner-group availability and access</a>.</p>\n<p>Command blocks illustrate configuration from that Bash host. They are not intended for direct execution without environment-specific review. Private keys and tokens do not belong in repositories, terminal history, or published screenshots.</p>\n<p>[!WARNING] Setting runner capacity to zero does not stop firewall, hub, registry, monitoring, or system-node charges. These services have independent pricing and capacity requirements.</p>\n<h2>Step 1: Network and AKS egress model</h2>\n<p>Azure CNI Overlay separates node addressing from pod addressing. Nodes receive IP addresses from their VNet subnets, while pods use a separate CIDR range. Each additional runner pod therefore does not consume another VNet subnet address. This conserves spoke address space as runner capacity grows. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-ip-address-planning#overlay-networks\" rel=\"noopener\" target=\"_blank\">Microsoft's Overlay subnet-sizing guidance</a>.</p>\n<p>The address plan separates the hub, node pools, management access, pod network, and Kubernetes services:</p>\n<ul>\n<li>Secured virtual hub:&nbsp;10.60.x.x/22, for Virtual WAN hub services and Azure Firewall</li>\n<li>AKS spoke VNet:&nbsp;10.61.x.x/16, for nodes and private management</li>\n<li>System node subnet:&nbsp;10.61.x.x/24, for AKS services and the selected ARC controller and listener placement</li>\n<li>Runner node subnet:&nbsp;10.61.x.x/23, for the dedicated Linux user node pool</li>\n<li>Management subnet:&nbsp;10.61.x.x/24, for the approved private administration host</li>\n<li>AzureBastionSubnet, if used:&nbsp;10.61.x.x/26, separate from the management subnet</li>\n<li>Overlay pod address space:&nbsp;10.62.x.x/16</li>\n<li>Kubernetes service range:&nbsp;10.63.x.x/24, with a DNS service IP represented as&nbsp;10.63.x.x</li>\n</ul>\n<p>Size each node subnet for that pool's maximum node count, additional nodes used during surge upgrades, and any other resources consuming addresses from the subnet. Azure reserves five addresses in each subnet, leaving 251 usable addresses in a&nbsp;/24&nbsp;before resources are allocated. Sizing only for the initial nodes can leave insufficient addresses for scaling or upgrades. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-azure-cni-overlay#cluster-nodes\" rel=\"noopener\" target=\"_blank\">Overlay node-subnet planning</a>&nbsp;and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-ip-address-planning#upgrading-and-scaling-considerations\" rel=\"noopener\" target=\"_blank\">AKS upgrade and scaling considerations</a>.</p>\n<p>Size the pod CIDR for nodes across both the system and runner pools, including temporary surge nodes. Overlay allocates a fixed&nbsp;/24&nbsp;pod block to every node; lowering&nbsp;maxPods&nbsp;does not shrink that block. The networking model supports up to 250 pods per node, but that is not a recommendation to place 250 CI runners on one node. An ARC runner-pod limit does not replace node-level address planning. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-azure-cni-overlay#pods\" rel=\"noopener\" target=\"_blank\">Overlay pod allocation</a>.</p>\n<p>Choose a supported RFC 1918 or RFC 6598 pod range that does not overlap node subnets or connected networks. An overlap with a destination network can make that destination unreachable from pods even when the firewall allows it. Keep the Kubernetes service CIDR separate from the pod, node, and connected-network ranges. The DNS service IP must be inside the service CIDR and must not use its first service address. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-azure-cni-overlay#ip-address-planning\" rel=\"noopener\" target=\"_blank\">Overlay address-planning requirements</a>&nbsp;and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-cni-overview#aks-cni-networking-prerequisites\" rel=\"noopener\" target=\"_blank\">AKS reserved-range restrictions</a>.</p>\n<h3>Network-isolated AKS with outbound type none</h3>\n<p>The example selects a private, network-isolated AKS cluster with an AKS-managed bootstrap artifact cache and&nbsp;outboundType: none. Network isolation is an additional choice beyond a private API endpoint, not a prerequisite imposed by ARC or Virtual WAN.</p>\n<p>Microsoft documents that&nbsp;none&nbsp;does not create an AKS egress path or require a default route during validation, and supports bring-your-own VNets. Required egress is supplied explicitly through a firewall, proxy, gateway, or other network component. Here, that component is the secured Virtual WAN hub. The private cache supplies AKS bootstrap images; GitHub traffic still needs the firewall path described below.</p>\n<p>This is a different AKS outbound model from&nbsp;userDefinedRouting, not a claim that a vWAN-propagated default satisfies UDR validation. The&nbsp;userDefinedRouting&nbsp;model has its own node-subnet route-table requirements and is not an interchangeable option in the example.</p>\n<p>See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/egress-outboundtype\" rel=\"noopener\" target=\"_blank\">AKS outbound types</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-isolated\" rel=\"noopener\" target=\"_blank\">network-isolated AKS</a>, and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/network-isolated\" rel=\"noopener\" target=\"_blank\">the managed-cache creation guide</a>.</p>\n<p>A conventional private AKS cluster can instead use another documented outbound model and permit its required AKS dependencies through the chosen egress controls. Changing to that model requires a different configuration and endpoint review; removing the cache flags from this example is not an equivalent substitution.</p>\n<h2>Step 2: Secured hub and spoke connectivity</h2>\n<p>The example separates networking into&nbsp;rg-arc-network&nbsp;and the cluster and identity into&nbsp;rg-arc-aks. The resources use the same selected region.</p>\n<p>The configuration consists of:</p>\n<ol>\n<li>A&nbsp;<strong>Standard</strong>&nbsp;Virtual WAN with a secured virtual hub and&nbsp;<strong>Azure Firewall Standard</strong>. Azure Firewall Manager exposes the secured-hub creation flow. The&nbsp;/22&nbsp;address-space choice accommodates Microsoft's documented Azure Firewall scaling requirement in&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/hub-settings#virtual-hub-address-space\" rel=\"noopener\" target=\"_blank\">virtual hub address-space settings</a>. VPN and ExpressRoute gateways are separate requirements when the management design uses them.</li>\n<li>An associated Firewall Policy with default-deny behavior, rather than an unrestricted outbound allow.</li>\n<li>A spoke named&nbsp;vnet-arc-spoke, with system subnet&nbsp;snet-aks-system, runner subnet&nbsp;snet-aks-runners, and management subnet&nbsp;snet-management. The AKS node subnets are not delegated to another service.</li>\n<li>A&nbsp;<strong>Virtual WAN &gt; Virtual network connections</strong>&nbsp;connection between the hub and spoke. This is not VNet peering to a customer-managed hub VNet.</li>\n<li><strong>Azure-provided DNS</strong>&nbsp;for the baseline, with the management host in the same VNet as the AKS nodes.</li>\n<li>Intra-cluster connectivity consistent with&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/azure-cni-overlay\" rel=\"noopener\" target=\"_blank\">Azure CNI Overlay requirements</a>. NSGs must account for required communication between the system and runner subnets.</li>\n</ol>\n<p>The official&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/firewall-manager/secure-cloud-network\" rel=\"noopener\" target=\"_blank\">secured cloud network tutorial</a> documents the portal creation flow. Resource names and some blade labels can vary as the portal evolves.</p>\n<img /><em>Figure 2. Secured Virtual WAN foundation.</em>\n<h2>Step 3: GitHub egress policy and logging</h2>\n<p>The associated&nbsp;<strong>Firewall Policy &gt; Rule collection groups</strong>&nbsp;contains an&nbsp;<strong>Application</strong>&nbsp;rule collection with action&nbsp;<strong>Allow</strong>, for example at priority&nbsp;200. The rules use&nbsp;<strong>HTTPS:443</strong>&nbsp;and target FQDNs.</p>\n<p>Rule sources are the system and runner subnet CIDRs, represented here as&nbsp;10.61.x.x/24&nbsp;and&nbsp;10.61.x.x/23. The controller and listener need GitHub connectivity as well as the runner pods. With Azure CNI Overlay, traffic leaving the cluster is translated to node addresses, rather than using the overlay pod CIDR as the firewall source for these flows.</p>\n<p>The following destinations are a subset of GitHub's documented domains, grouped by function. Essential service traffic and the chart and image pulls used here need their corresponding rules. Action, artifact, package, and release functions need the relevant destinations when those functions are used; the table is not a claim that every job needs every row.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Rule purpose</th><th>GitHub-documented target FQDNs</th></tr></thead><tbody><tr><td>Actions service and API</td><td>github.com,&nbsp;api.github.com,&nbsp;*.actions.githubusercontent.com</td></tr><tr><td>Action downloads</td><td>codeload.github.com</td></tr><tr><td>Logs, artifacts, cache</td><td>results-receiver.actions.githubusercontent.com,&nbsp;*.blob.core.windows.net</td></tr><tr><td>Runner updates</td><td>objects.githubusercontent.com,&nbsp;objects-origin.githubusercontent.com,&nbsp;github-releases.githubusercontent.com,&nbsp;github-registry-files.githubusercontent.com</td></tr><tr><td>GitHub container assets</td><td>ghcr.io,&nbsp;*.pkg.github.com,&nbsp;pkg-containers.githubusercontent.com</td></tr><tr><td>Release downloads</td><td>release-assets.githubusercontent.com</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>GitHub lists the required domains by function in its&nbsp;<a href=\"https://docs.github.com/en/actions/reference/runners/self-hosted-runners#accessible-domains-by-function\" rel=\"noopener\" target=\"_blank\">accessible-domain reference</a>. Its documentation notes that some firewalls require recursive rules for CNAME records, whose targets can change while the listed domains remain constant. Workflows may also require access to other network resources. Git LFS and Dependabot have additional domain entries in that reference and are outside this baseline.</p>\n<p>The public Blob wildcard is broad. It is a documented GitHub dependency, not an exfiltration-prevention guarantee. It also does not replace private-endpoint DNS or storage authorization.</p>\n<p>Management-host rules are separately scoped to approved Azure and GitHub tooling needs. Management-host sign-in is not a reason to broaden node permissions. Adding a private endpoint's public hostname to an Internet allow rule does not establish private endpoint reachability.</p>\n<p>For this network-isolated baseline, public AKS bootstrap exceptions from a conventional firewall tutorial are not automatically applicable. Additional services and add-ons have their own&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-isolated\" rel=\"noopener\" target=\"_blank\">network-isolated feature dependencies</a>&nbsp;and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/outbound-rules-control-egress\" rel=\"noopener\" target=\"_blank\">AKS outbound requirements</a>.</p>\n<h3>Rule evaluation and inspection depth</h3>\n<p>Azure Firewall evaluates network rules before application rules. An&nbsp;<strong>Any destination / TCP 443</strong>&nbsp;network allow can therefore bypass the intended application FQDN restriction. Inherited policies also affect evaluation. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/firewall/rule-processing\" rel=\"noopener\" target=\"_blank\">rule processing</a>.</p>\n<p>Standard performs SNI-based HTTPS destination filtering. It does not decrypt HTTPS payloads. Premium TLS inspection is a separate design, including certificate trust in nodes, controller, listener, runners, and tools that make inspected connections. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/firewall/features-by-sku\" rel=\"noopener\" target=\"_blank\">features by SKU</a>.</p>\n<h3>Diagnostic configuration</h3>\n<p>Diagnostic settings belong to the&nbsp;<strong>Azure Firewall resource</strong>, not only the policy. The configuration includes:</p>\n<ol>\n<li>Application-rule and network-rule logs sent to an approved Log Analytics workspace</li>\n<li><strong>Resource specific</strong>&nbsp;destination tables for the query example below</li>\n<li>DNS-proxy logs when DNS proxy is enabled</li>\n<li>Appropriate retention and access controls for network and workflow-related evidence</li>\n</ol>\n<p>Resource logs are not retained for query until a diagnostic destination is configured. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/firewall/monitor-firewall\" rel=\"noopener\" target=\"_blank\">Azure Firewall monitoring</a>.</p>\n<h2>Step 4: Routing intent and the default path</h2>\n<p>The routing configuration includes:</p>\n<ol>\n<li><strong>Internet Traffic</strong>&nbsp;routing intent with the hub's&nbsp;<strong>Azure Firewall</strong>&nbsp;as next hop</li>\n<li>The applicable&nbsp;<strong>Internet security / default-route propagation</strong>&nbsp;setting enabled on the spoke connection</li>\n<li><strong>Private Traffic</strong>&nbsp;left unconfigured in this baseline; supported inter-spoke or hybrid private inspection is a separate policy decision</li>\n<li>Gateway-route propagation enabled on any relevant spoke subnet route table</li>\n<li>Effective routes showing the spoke's Internet default toward the virtual hub and the hub's Internet policy selecting Azure Firewall</li>\n</ol>\n<p>The NIC next-hop display need not show the firewall's private IP directly. The spoke-to-hub and hub-to-firewall parts need to be considered together. An unexplained manual default route to the secured-hub firewall is not part of this example.</p>\n<p>See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies\" rel=\"noopener\" target=\"_blank\">routing intent configuration and troubleshooting</a>&nbsp;and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem\" rel=\"noopener\" target=\"_blank\">NIC effective routes</a>.</p>\n<p>The evidence described in Step 10 includes matching firewall records. A configured policy or a successful HTTPS request alone does not prove that the request traversed the firewall.</p>\n<h2>Step 5: Private AKS and the managed bootstrap cache</h2>\n<p>The managed bootstrap cache is&nbsp;<strong>not mandatory for every private AKS cluster</strong>. It is the selected bootstrap option for the network-isolated&nbsp;Cache&nbsp;plus&nbsp;none&nbsp;model used here. Microsoft also documents a bring-your-own private ACR option. ARC itself requires a suitable Kubernetes cluster, not an AKS bootstrap cache. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/network-isolated\" rel=\"noopener\" target=\"_blank\">Microsoft's network-isolated cluster options</a>&nbsp;and&nbsp;<a href=\"https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/get-started#prerequisites\" rel=\"noopener\" target=\"_blank\">GitHub's ARC prerequisites</a>.</p>\n<p>An existing suitable cluster does not need to be recreated for ARC. The creation example below applies only when provisioning the selected cluster model; it is not a migration procedure for an existing cluster.</p>\n<p>The Bash examples adapt Microsoft's documented commands to the resource names and choices in this design. The resource groups, VNet, subnets, hub connection, and firewall configuration are assumed to exist. CIDRs and the DNS service IP remain placeholders. The combined sequence is not ready-to-run deployment instructions.</p>\n<p>The following block uses&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/authenticate-azure-cli-interactively\" rel=\"noopener\" target=\"_blank\">Azure sign-in</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/account#az-account-set\" rel=\"noopener\" target=\"_blank\">subscription selection</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/network/vnet#az-network-vnet-show\" rel=\"noopener\" target=\"_blank\">VNet lookup</a>, and Microsoft's&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access#how-to-configure-private-subnets\" rel=\"noopener\" target=\"_blank\">private-subnet configuration example</a>. The variable names and grouping are adaptations.</p>\nexport SUBSCRIPTION_ID=\"&lt;subscription-id&gt;\"\nexport LOCATION=\"&lt;azure-region&gt;\"\nexport NETWORK_RG=\"rg-arc-network\"\nexport WORKLOAD_RG=\"rg-arc-aks\"\nexport VNET_NAME=\"vnet-arc-spoke\"\nexport AKS_NAME=\"aks-arc\"\nexport POD_CIDR=\"&lt;pod-cidr&gt;\"\nexport SERVICE_CIDR=\"&lt;service-cidr&gt;\"\nexport DNS_SERVICE_IP=\"&lt;dns-service-ip&gt;\"\n\naz login\naz account set --subscription \"$SUBSCRIPTION_ID\"\n\nVNET_ID=$(az network vnet show \\\n  --resource-group \"$NETWORK_RG\" --name \"$VNET_NAME\" \\\n  --query id --output tsv)\n\nSYSTEM_SUBNET_ID=\"${VNET_ID}/subnets/snet-aks-system\"\nRUNNER_SUBNET_ID=\"${VNET_ID}/subnets/snet-aks-runners\"\n\naz network vnet subnet update \\\n  --resource-group \"$NETWORK_RG\" --vnet-name \"$VNET_NAME\" \\\n  --name snet-aks-system --default-outbound false\n\naz network vnet subnet update \\\n  --resource-group \"$NETWORK_RG\" --vnet-name \"$VNET_NAME\" \\\n  --name snet-aks-runners --default-outbound false\n<p>The private-subnet setting removes reliance on implicit default outbound access. It does not block explicit firewall egress and is separate from making the AKS API private. This example sets it before creating nodes. For existing VMs, Microsoft documents that a stop and deallocation is required for subnet changes to take effect on their interfaces; this is not guidance to modify AKS-managed VM instances directly. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access\" rel=\"noopener\" target=\"_blank\">default outbound access guidance</a>.</p>\n<h3>Control-plane identity</h3>\n<p>The user-assigned control-plane identity has&nbsp;<strong>Network Contributor on the example VNet</strong>. The VNet scope also supports the private DNS VNet-link operation; this is not a subscription-wide grant. Role-assignment and identity-use permissions are separate deployment prerequisites.</p>\n<p>The commands adapt&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/user-assigned-managed-identity\" rel=\"noopener\" target=\"_blank\">user-assigned managed identity creation</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-cni-overview#aks-cni-networking-prerequisites\" rel=\"noopener\" target=\"_blank\">AKS VNet permissions</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/role/assignment#az-role-assignment-create\" rel=\"noopener\" target=\"_blank\">role-assignment syntax</a>, and&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/aks#az-aks-get-versions\" rel=\"noopener\" target=\"_blank\">regional Kubernetes version lookup</a>.</p>\nAKS_IDENTITY_ID=$(az identity create \\\n  --resource-group \"$WORKLOAD_RG\" --name id-aks-arc \\\n  --location \"$LOCATION\" \\\n  --query id --output tsv)\n\nAKS_IDENTITY_PRINCIPAL_ID=$(az identity show \\\n  --ids \"$AKS_IDENTITY_ID\" --query principalId --output tsv)\n\naz role assignment create \\\n  --assignee-object-id \"$AKS_IDENTITY_PRINCIPAL_ID\" \\\n  --assignee-principal-type ServicePrincipal \\\n  --role \"Network Contributor\" --scope \"$VNET_ID\"\n\naz aks get-versions --location \"$LOCATION\" --output table\nexport KUBERNETES_VERSION=\"&lt;supported-regional-kubernetes-version&gt;\"\n<p>Role assignments have propagation delays. The Kubernetes version also needs to be a currently supported regional release, not an obsolete release merely because it exceeds the network-isolated minimum. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/managed-identity-overview\" rel=\"noopener\" target=\"_blank\">AKS managed identities</a>.</p>\n<h3>Cluster configuration example</h3>\n<p>Microsoft's&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/network-isolated?pivots=aks-managed-acr#deploy-a-network-isolated-cluster-with-aks-managed-acr\" rel=\"noopener\" target=\"_blank\">AKS-managed ACR creation example</a>&nbsp;explicitly includes&nbsp;--bootstrap-artifact-source Cache,&nbsp;--outbound-type none, and&nbsp;--enable-private-cluster. The longer command below combines that example with documented&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/private-clusters\" rel=\"noopener\" target=\"_blank\">private DNS and public-FQDN options</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/azure-cni-overlay\" rel=\"noopener\" target=\"_blank\">Overlay options</a>, and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/entra-id-authorization\" rel=\"noopener\" target=\"_blank\">Microsoft Entra authorization</a>.</p>\n<p>All remaining switches are described in the&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/aks#az-aks-create\" rel=\"noopener\" target=\"_blank\">official&nbsp;az aks create&nbsp;reference</a>. The selected node name, VM size, count, disk type, and maximum pods are example choices, not a Microsoft-prescribed ARC configuration.</p>\naz aks create \\\n  --resource-group \"$WORKLOAD_RG\" \\\n  --name \"$AKS_NAME\" \\\n  --location \"$LOCATION\" \\\n  --kubernetes-version \"$KUBERNETES_VERSION\" \\\n  --assign-identity \"$AKS_IDENTITY_ID\" \\\n  --enable-private-cluster \\\n  --disable-public-fqdn \\\n  --private-dns-zone system \\\n  --bootstrap-artifact-source Cache \\\n  --outbound-type none \\\n  --network-plugin azure \\\n  --network-plugin-mode overlay \\\n  --pod-cidr \"$POD_CIDR\" \\\n  --service-cidr \"$SERVICE_CIDR\" \\\n  --dns-service-ip \"$DNS_SERVICE_IP\" \\\n  --vnet-subnet-id \"$SYSTEM_SUBNET_ID\" \\\n  --vm-set-type VirtualMachineScaleSets \\\n  --load-balancer-sku standard \\\n  --nodepool-name systempool \\\n  --node-count 2 \\\n  --node-vm-size Standard_D4s_v5 \\\n  --node-osdisk-type Managed \\\n  --os-sku Ubuntu \\\n  --max-pods 30 \\\n  --node-os-upgrade-channel NodeImage \\\n  --enable-aad \\\n  --enable-azure-rbac \\\n  --disable-local-accounts \\\n  --generate-ssh-keys\n<p>Omitting a bootstrap registry resource ID selects the documented AKS-managed cache path. AKS manages its bootstrap registry, cache rules, and private connectivity. The default cache supplies Microsoft bootstrap images; it does not automatically mirror the GHCR controller and runner images. Those pulls need the GitHub egress rules from Step 3.</p>\n<p>The two-node system pool is an illustrative minimum, not a production availability recommendation. Capacity needs to account for AKS services, the ARC controller, and the listener. Microsoft recommends three system nodes for production. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/use-system-pools\" rel=\"noopener\" target=\"_blank\">system-pool requirements</a>, the&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/network-isolated\" rel=\"noopener\" target=\"_blank\">network-isolated creation guide</a>, and the&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/aks#az-aks-create\" rel=\"noopener\" target=\"_blank\">CLI parameter reference</a>.</p>\n<h3>Installer access and private DNS</h3>\n<p>The authorization and connectivity requirements are separate:</p>\n<ol>\n<li><strong>Azure Kubernetes Service RBAC Cluster Admin</strong>, scoped to the cluster, is one broad built-in role that permits the approved installer to install ARC CRDs and cluster-scoped RBAC. It is not a requirement to give every operator permanent cluster-admin access.</li>\n<li>Cluster-user credential retrieval requires the corresponding management permission, such as&nbsp;<strong>Azure Kubernetes Service Cluster User Role</strong>&nbsp;when not already covered.</li>\n<li>Assignment propagation affects access availability. These installer permissions are not workflow permissions.</li>\n<li>The management host needs private API resolution and network reachability independently of its credentials.</li>\n</ol>\n<p>The credential and connection commands adapt&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/private-cluster-connect#create-a-vm-in-the-same-virtual-network\" rel=\"noopener\" target=\"_blank\">private-cluster connectivity checks</a>&nbsp;and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/kubelogin-authentication?pivots=azure-cli\" rel=\"noopener\" target=\"_blank\">kubelogin's Azure CLI authentication example</a>. The DNS lookup uses the documented nslookup check.</p>\n<p>The expected state is private API resolution and nodes marked&nbsp;Ready. With Azure-provided DNS, AKS's default API private-zone link to the node VNet supplies API resolution. Registry resolution is a separate check: inspect the AKS-created bootstrap registry, its private endpoint, and the relevant private DNS records and VNet links. Both registry login and data-endpoint names must resolve to the intended private endpoints. Do not assume successful API resolution also verifies registry DNS.</p>\n<p>Private API or bootstrap-image failures are distinct from ARC installation failures. Relevant references are&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/private-clusters\" rel=\"noopener\" target=\"_blank\">private-cluster DNS</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/extensions/troubleshoot-network-isolated-cluster\" rel=\"noopener\" target=\"_blank\">network-isolated troubleshooting</a>, and&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/entra-id-authorization\" rel=\"noopener\" target=\"_blank\">Microsoft Entra authorization for AKS</a>.</p>\n<h2>Step 6: Dedicated runner user pool</h2>\n<p>The configuration separates runner execution from the pool selected for the controller and listener. The runner pool is a Linux&nbsp;<strong>User</strong>&nbsp;pool on its own subnet, with a taint and Cluster Autoscaler bounds. This pool separation is a design choice, not an ARC installation requirement.</p>\n<p>The command combines documented&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/azure-cni-overlay#add-a-new-node-pool-to-a-dedicated-subnet\" rel=\"noopener\" target=\"_blank\">dedicated-subnet Overlay configuration</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-advanced-scheduler\" rel=\"noopener\" target=\"_blank\">taints and tolerations</a>, and&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/aks/nodepool#az-aks-nodepool-add\" rel=\"noopener\" target=\"_blank\">node-pool parameters</a>. The node count, VM size, taint value, and autoscaler bounds are illustrative.</p>\n<p>The Helm values in Step 8 combine a runner-pool selector with the matching toleration. A toleration alone permits placement; it does not require that placement.</p>\n<p>ARC scales runner pods. Cluster Autoscaler supplies node capacity for unschedulable pods. Their limits are independent, and neither is a hard spending cap. See&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/cluster-autoscaler-overview\" rel=\"noopener\" target=\"_blank\">AKS Cluster Autoscaler</a>&nbsp;and&nbsp;<a href=\"https://learn.microsoft.com/en-us/cli/azure/aks/nodepool#az-aks-nodepool-add\" rel=\"noopener\" target=\"_blank\">node-pool commands</a>.</p>\n<h2>Step 7: GitHub authentication and repository access</h2>\n<p>A GitHub App is&nbsp;<strong>recommended, not mandatory</strong>, for repository- or organization-scoped ARC registration. GitHub also documents personal access token authentication, including classic and fine-grained tokens. Enterprise-level runner registration does not support GitHub App authentication; GitHub's ARC quickstart specifies a personal access token (classic) for that scope. See&nbsp;<a href=\"https://docs.github.com/en/actions/how-tos/manage-runners/use-actions-runner-controller/authenticate-to-the-api\" rel=\"noopener\" target=\"_blank\">ARC authentication methods</a>&nbsp;and the&nbsp;<a href=\"https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/get-started#installing-actions-runner-controller\" rel=\"noopener\" target=\"_blank\">ARC quickstart</a>.</p>\n<p>This example retains the recommended organization-owned GitHub App option. Its configuration includes:</p>\n<ol>\n<li><strong>Organization permissions &gt; Self-hosted runners: Read and write</strong>&nbsp;and&nbsp;<strong>Repository permissions &gt; Metadata: Read-only</strong>. The documented repository&nbsp;<strong>Administration: Read and write</strong>&nbsp;permission applies to repository-scoped registration, not the organization-scoped configuration used here.</li>\n<li>An App installation in the organization, with its&nbsp;<strong>App ID</strong>,&nbsp;<strong>installation ID</strong>, and private key held securely outside the repository.</li>\n<li>A runner group named&nbsp;arc-private, restricted to the intended private repository. App installation scope is not a substitute for runner-group access control.</li>\n<li>GitHub credentials held in a Kubernetes Secret in the runner scale-set namespace.</li>\n</ol>\n<p>ARC scale-set job delivery uses outbound HTTPS long polling. A public inbound job webhook is not required by this mechanism; a separate integration can have different requirements. This flow is described in&nbsp;<a href=\"https://docs.github.com/en/actions/concepts/runners/actions-runner-controller#about-actions-runner-controller\" rel=\"noopener\" target=\"_blank\">GitHub's ARC architecture</a>.</p>\n<p>The Secret command adapts GitHub's&nbsp;<a href=\"https://docs.github.com/en/actions/how-tos/manage-runners/use-actions-runner-controller/deploy-runner-scale-sets#option-1-create-a-kubernetes-secret-recommended\" rel=\"noopener\" target=\"_blank\">documented file-based private-key example</a>. The names and variable substitutions are the changes; the Secret keys follow the documented format.</p>\n<p>The example reads key contents from a file instead of putting the private key in a shell argument or Helm values. The file, Kubernetes Secret, Secret-reading permissions, and key rotation remain security responsibilities. See&nbsp;<a href=\"https://docs.github.com/en/actions/how-tos/manage-runners/use-actions-runner-controller/authenticate-to-the-api\" rel=\"noopener\" target=\"_blank\">ARC authentication</a>&nbsp;and&nbsp;<a href=\"https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/manage-access\" rel=\"noopener\" target=\"_blank\">runner-group access controls</a>.</p>\n<p>If an approved personal access token is used instead, the Secret uses the documented&nbsp;github_token&nbsp;key and the permissions required for the chosen registration scope. That is an alternative authentication configuration, not an additional credential required alongside the GitHub App.</p>\n<p>This credential authenticates ARC to GitHub. It does not authorize an Azure deployment. Deployment jobs need a separate, least-privilege identity relationship, such as&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect\" rel=\"noopener\" target=\"_blank\">GitHub-to-Azure OIDC</a>, rather than general access through the installer, cluster, or kubelet identity.</p>\n<h2>Step 8: ARC controller and runner scale-set configuration</h2>\n<p>The examples use released OCI charts rather than legacy&nbsp;RunnerDeployment&nbsp;resources or experimental charts. Both ARC charts are pinned to release&nbsp;0.15.1; version selection remains subject to review against the&nbsp;<a href=\"https://github.com/actions/actions-runner-controller/releases/tag/gha-runner-scale-set-0.15.1\" rel=\"noopener\" target=\"_blank\">official release</a>.</p>\n<img /><em>Figure 3. ARC autoscaling runner scale sets.</em>\n<h3>Controller configuration</h3>\n<p>These Helm values select the system pool and an explicit controller service-account name. They adapt fields from the&nbsp;<a href=\"https://github.com/actions/actions-runner-controller/blob/gha-runner-scale-set-0.15.1/charts/gha-runner-scale-set-controller/values.yaml\" rel=\"noopener\" target=\"_blank\">release-specific controller chart values</a>. The names, pool selector, and resource sizes are design-specific values, not the chart defaults or measured sizing recommendations. The values correspond to the controller configuration input referenced by --values in the example command.</p>\nfullnameOverride: arc-controller\nserviceAccount:\n  name: arc-controller\nnodeSelector:\n  kubernetes.azure.com/agentpool: systempool\nresources:\n  requests:\n    cpu: 100m\n    memory: 128Mi\n  limits:\n    memory: 256Mi\n<p>The installation command adapts the&nbsp;<a href=\"https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/get-started#installing-actions-runner-controller\" rel=\"noopener\" target=\"_blank\">official controller Helm installation</a>, adding the documented version and values-file options. The wait and timeout settings are operational choices, not ARC requirements.</p>\nexport ARC_CHART_VERSION=\"0.15.1\"\n\nhelm install arc \\\n  --namespace arc-systems \\\n  --create-namespace \\\n  --version \"$ARC_CHART_VERSION\" \\\n  --values ./controller-values.yaml \\\n  --wait --timeout 10m \\\n  oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller\n\nkubectl get deployments,pods --namespace arc-systems\n<h2>Step 9: Workflow targeting the private runner</h2>\n<p>The workflow follows the&nbsp;<a href=\"https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/get-started#using-runner-scale-sets\" rel=\"noopener\" target=\"_blank\">official ARC quickstart's verification workflow</a>, with a descriptive name, the example scale-set target, and an English output message. It uses&nbsp;workflow_dispatch&nbsp;and a&nbsp;runs-on&nbsp;value matching&nbsp;runnerScaleSetName. The empty permission set and five-minute job timeout are additional restrictions for this shell-only example, not ARC prerequisites.</p>\n<p>Manual dispatch requires the workflow to be available on the repository's default branch. See&nbsp;<a href=\"https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manually-run-a-workflow#configuring-a-workflow-to-run-manually\" rel=\"noopener\" target=\"_blank\">GitHub's manual workflow requirements</a>.</p>\nname: Private AKS runner verification\n\non:\n  workflow_dispatch:\n\npermissions: {}\n\njobs:\n  verify-runner:\n    runs-on: arc-private-aks\n    timeout-minutes: 5\n    steps:\n      - run: echo \"This job uses runner scale set runners.\"\n<p>The expected lifecycle includes a queued job, an ephemeral runner pod placed on the&nbsp;runners&nbsp;pool, workflow output, and automatic removal of the runner after completion. A pool that has scaled to zero adds node-provisioning time before the runner can start.</p>\n<p>This workflow verifies job execution only. It intentionally uses no checkout action, cloud login, package feed, artifact upload, or deployment target, and does not actively probe a separate Internet destination. It does not establish complete build-pipeline readiness or prove the firewall route. Those dependencies require separate evidence. See&nbsp;<a href=\"https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/use-arc-in-a-workflow\" rel=\"noopener\" target=\"_blank\">using ARC in a workflow</a>.</p>\n<h2>Documented limitations and design boundaries</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Area</th><th>Limitation and consequence</th><th>Official reference</th></tr></thead><tbody><tr><td>Network-isolated AKS</td><td>Requires Kubernetes 1.30 or later and the documented CLI minimum. A currently supported regional release is still required.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/aks/network-isolated\" rel=\"noopener\" target=\"_blank\">Creation prerequisites</a></td></tr><tr><td>Outbound mode</td><td>none&nbsp;is GA and does not configure or block egress.&nbsp;block&nbsp;is preview and restricted to managed-VNet scenarios.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/aks/egress-outboundtype\" rel=\"noopener\" target=\"_blank\">Outbound types</a></td></tr><tr><td>Nodes and networking</td><td>Network isolation does not support Windows pools or kubenet. The documented node-OS upgrade channels are NodeImage and None.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-isolated\" rel=\"noopener\" target=\"_blank\">Network-isolation limits</a></td></tr><tr><td>Bootstrap registry</td><td>The AKS cache does not make arbitrary application images or workflows offline-capable. BYO ACR adds Premium/private-DNS work.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/aks/network-isolated\" rel=\"noopener\" target=\"_blank\">Network-isolated AKS</a></td></tr><tr><td>Add-ons and explicit egress</td><td>Optional features can require additional endpoints. Node public IPs can permit outbound traffic and are not enabled here.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-isolated\" rel=\"noopener\" target=\"_blank\">Feature limitations</a></td></tr><tr><td>Virtual WAN default route</td><td>The default route is not propagated between hubs. This baseline uses local inspected Internet breakout.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies\" rel=\"noopener\" target=\"_blank\">Routing intent</a></td></tr><tr><td>Routing-intent compatibility</td><td>Custom hub route tables and specified static next-hop-VNet-connection routes have restrictions.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies\" rel=\"noopener\" target=\"_blank\">Routing prerequisites</a></td></tr><tr><td>Same-VNet traffic</td><td>Routing intent does not automatically attract traffic between subnets of the same VNet. Private API access here stays local.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/about-virtual-hub-routing#considerations\" rel=\"noopener\" target=\"_blank\">Hub routing considerations</a></td></tr><tr><td>Firewall inspection</td><td>Standard HTTPS filtering uses SNI, not decrypted payloads or full URL paths. Premium inspection needs certificate trust.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/firewall/features-by-sku\" rel=\"noopener\" target=\"_blank\">Firewall SKUs</a></td></tr><tr><td>Network-rule FQDNs</td><td>Require DNS proxy. Wildcard support is currently limited to the regions listed in the product documentation. This design uses application rules for GitHub HTTPS.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/firewall/fqdn-filtering-network-rules\" rel=\"noopener\" target=\"_blank\">FQDN filtering</a></td></tr><tr><td>Secured-hub SNAT design</td><td>NAT Gateway integration inside a secured virtual hub is unsupported. Conventional firewall-subnet NAT patterns do not apply.</td><td><a href=\"https://learn.microsoft.com/en-us/azure/firewall/integrate-with-nat-gateway\" rel=\"noopener\" target=\"_blank\">NAT Gateway integration</a></td></tr><tr><td>GitHub authentication scope</td><td>GitHub App authentication is not supported for enterprise-level runner registration. That scope needs a different setup.</td><td><a href=\"https://docs.github.com/en/actions/how-tos/manage-runners/use-actions-runner-controller/authenticate-to-the-api\" rel=\"noopener\" target=\"_blank\">ARC authentication</a></td></tr><tr><td>Container-based jobs</td><td>This shell-only configuration does not support Docker-dependent jobs as configured. Documented DinD needs privileged mode.</td><td><a href=\"https://docs.github.com/en/actions/how-tos/manage-runners/use-actions-runner-controller/deploy-runner-scale-sets\" rel=\"noopener\" target=\"_blank\">ARC container modes</a></td></tr><tr><td>Workload isolation</td><td>Ephemeral runners, namespaces, and node pools are not a sandbox for hostile code.</td><td><a href=\"https://docs.github.com/en/actions/reference/security/secure-use\" rel=\"noopener\" target=\"_blank\">GitHub secure use</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-cluster-isolation\" rel=\"noopener\" target=\"_blank\">AKS isolation</a></td></tr><tr><td>Support and customization</td><td>GitHub ARC support does not certify the underlying Azure network or every custom pod template, hook, or storage integration.</td><td><a href=\"https://docs.github.com/en/actions/concepts/runners/support-for-arc\" rel=\"noopener\" target=\"_blank\">ARC support boundaries</a></td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>"
  "747ef6092781b1feed4bacdcc4b59192":
    "id": "747ef6092781b1feed4bacdcc4b59192"
    "title": "From ChatOps to Agentic Ops: What MCP Changes—and What It Doesn’t"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/from-chatops-to-agentic-ops-what-mcp-changes-and-what-it-doesn-t/ba-p/4574810"
    "published": "2026-11-19 22:28:17"
    "fetched": "2026-11-20 14:18:12"
    "summary": "<p>Most teams already run a form of ChatOps today. During incidents or change windows, people jump into chat, run known commands, check dashboards, and coordinate in real time. It works because it centralizes communication and keeps operational actions visible.</p>\n<p>But the model has a ceiling. Modern outages are rarely solved by one command or one dashboard. Critical clues are distributed across alerts, deploy timelines, ownership records, tickets, runbooks, and cloud activity. The limitation isn’t access to tools—it’s the human effort required to gather, correlate, and interpret fragmented context quickly and safely.</p>\n<p>That’s the gap Agentic Ops aims to close. Instead of only executing prompts, an assistant can pull context from multiple systems, reason across it, and present decision-ready guidance. MCP is the key enabler here: a standard way for AI applications to connect to operational tools and data so workflows become more connected, conversational, and actionable—without replacing existing platforms or governance.</p>\n<h2>1. ChatOps Today: Strong for Execution, Evolving for Cross-System Reasoning</h2>\n<p>ChatOps is an operating model where teams use chat as the front door to operational work. Instead of switching tools for every step, engineers collaborate in a shared channel, invoke commands, review outputs, and coordinate response in real time. It combines communication and execution in one place, which is why it became central to incident response, change coordination, and on-call workflows.</p>\n<p>At its best, ChatOps creates a transparent operational rhythm: what was run, by whom, when, and why is visible to everyone in the thread. That visibility improves speed, reduces duplicate effort, and helps newer responders learn from live context.</p>\n<p><strong>Where ChatOps is strongest</strong></p>\n<ul>\n<li><strong>Shared visibility:</strong> actions and decisions are visible to the whole team.</li>\n<li><strong>Faster coordination:</strong> responders align quickly during incidents and change windows.</li>\n<li><strong>Operational consistency:</strong> common commands and runbooks reduce variation in execution.</li>\n<li><strong>Traceable activity:</strong> chat history creates a practical audit trail of response steps.</li>\n<li><strong>Lower tool friction:</strong> teams can execute and discuss from one collaboration surface.</li>\n</ul>\n<p>These strengths are real—and they are why ChatOps remains valuable. But as environments become more distributed, the model can strain when responders must synthesize context across many systems, not just run commands in one.</p>\n<p><strong>Where limitations begin to show</strong></p>\n<ul>\n<li><strong>Manual context stitching:</strong> signals still need to be correlated across multiple tools.</li>\n<li><strong>Tool-by-tool querying:</strong> responders must know where each data point lives.</li>\n<li><strong>High cognitive load under pressure:</strong> interpretation burden stays with humans.</li>\n<li><strong>Context latency:</strong> assembling a full picture can lag behind incident progression.</li>\n<li><strong>Variable outcomes by experience:</strong> stronger responders connect clues faster than others.</li>\n</ul>\n<p><strong>What this can lead to in practice</strong></p>\n<ul>\n<li>Slower triage for multi-system incidents</li>\n<li>Longer time to confident root-cause hypotheses</li>\n<li>More back-and-forth before safe remediation steps</li>\n<li>Increased risk of acting on incomplete context</li>\n<li>Harder handoffs when incident state lives across tools and people</li>\n</ul>\n<p>So ChatOps is not the problem—it is the foundation. The next shift is about augmenting that foundation with better cross-system context synthesis, not replacing its core strengths.</p>\n<h2>2. Agentic Ops Shift: From Commands to Context Synthesis</h2>\n<p>Agentic Ops is an operating model where an AI assistant does more than execute instructions—it helps assemble, interpret, and operationalize context across systems. In this model, chat is still the interface, but the interaction changes: instead of only asking <em>“run this command,”</em> teams can ask <em>“what changed, what is impacted, and what should we do next?”</em> The assistant then gathers evidence from relevant tools, reasons across it, and returns a structured, decision-ready view.</p>\n<p>This is a shift from <strong>command fulfillment</strong> to <strong>context synthesis</strong>.</p>\n<p><strong>Core strengths of Agentic Ops</strong></p>\n<ul>\n<li><strong>Cross-system correlation:</strong> combines signals across telemetry, deployments, ownership, runbooks, and change records.</li>\n<li><strong>Decision-ready summaries:</strong> returns prioritized findings, not just raw outputs.</li>\n<li><strong>Faster situational clarity:</strong> reduces time spent collecting and reconciling evidence.</li>\n<li><strong>Guided next steps:</strong> suggests actions aligned to runbooks and operational policy.</li>\n<li><strong>Scalable support quality:</strong> helps less-experienced responders work with stronger context.</li>\n</ul>\n<p>Agentic Ops does not remove human responsibility; it improves the quality and speed of the context humans use to decide.</p>\n<p><strong>How it addresses the limitations established in ChatOps</strong></p>\n<ul>\n<li><strong>Manual context stitching → automated correlation</strong><br />Instead of responders manually joining clues from multiple systems, the assistant assembles a coherent incident picture.</li>\n<li><strong>Tool-by-tool querying → unified operational conversation</strong><br />Teams ask once in chat; the assistant retrieves from the right sources behind the scenes.</li>\n<li><strong>High cognitive load under pressure → structured reasoning support</strong><br />The assistant can surface anomalies, dependencies, and likely impact paths in an ordered narrative.</li>\n<li><strong>Context latency → faster hypothesis formation</strong><br />With context pre-assembled, teams move sooner from detection to credible root-cause hypotheses.</li>\n<li><strong>Experience-driven variability → more consistent first response quality</strong><br />Standardized context synthesis narrows the gap between senior and junior responders during early triage.</li>\n</ul>\n<p><strong>What improves in practice</strong></p>\n<ul>\n<li>Faster triage on multi-system incidents</li>\n<li>Quicker alignment on probable cause and blast radius</li>\n<li>Cleaner handoffs across shifts and escalation tiers</li>\n<li>Fewer decisions made on partial context</li>\n<li>Better use of expert time on judgment, not data gathering</li>\n</ul>\n<p>Agentic Ops, therefore, is not a replacement for ChatOps. It is the next layer on top of it: preserving visibility and collaboration while upgrading how operational context is gathered and interpreted.</p>\n<h2>3. MCP Explained: A Standard Connection Layer</h2>\n<p>MCP (Model Context Protocol) is best understood as a <strong>common interface contract</strong> between AI assistants and operational systems. In practical terms, it defines a standard way for an assistant to discover tools, request context, and invoke capabilities across different platforms without requiring a custom, one-off integration for every system.</p>\n<p>Before this model, teams often had fragmented integrations: one script for monitoring, another for CI/CD metadata, another for ownership data, another for ticketing. Each integration worked, but the assistant experience was inconsistent and brittle. MCP addresses this by introducing a shared pattern for how tools expose context and actions to AI applications.</p>\n<p>That does not mean MCP replaces existing platforms. It does not replace your observability stack, cloud control plane, deployment engine, or ITSM system. Those remain the systems of record and execution. MCP sits between the assistant and those systems as a <strong>standardized connectivity layer</strong> that helps the assistant use them coherently.</p>\n<p><strong>Why MCP matters operationally</strong></p>\n<p>MCP improves three things that are hard in real-world operations:</p>\n<ul>\n<li><strong>Interoperability:</strong> one assistant can work across heterogeneous tools through a consistent protocol shape.</li>\n<li><strong>Context continuity:</strong> evidence from multiple systems can be assembled in one conversational flow.</li>\n<li><strong>Action consistency:</strong> tool use becomes more structured and governable than ad hoc plugin behavior.</li>\n</ul>\n<p>This is what enables a shift from “ask for one command output” to “assemble and reason over incident context.”</p>\n<h3>Why MCP matters across this transition</h3>\n<ul>\n<li><strong>ChatOps today:</strong> Chat remains the collaboration surface, but MCP expands what the assistant can pull into that surface.</li>\n<li><strong>Agentic Ops shift:</strong> MCP provides the connective tissue that allows assistants to synthesize cross-system context rather than return isolated outputs.</li>\n<li><strong>Boundaries and risks:</strong> MCP enables access, not correctness; governance, approvals, and human accountability remain mandatory.</li>\n<li><strong>Adoption blueprint:</strong> MCP supports progressive rollout by allowing read-only integrations first, then tightly scoped action paths.</li>\n</ul>\n<p><img /></p>\n<img />\n<p>&nbsp;</p>\n<h3>Example workflow: Incident triage with MCP-enabled assistant</h3>\n<ol>\n<li><strong>Trigger and framing</strong><br />An alert fires. The responder asks in chat: “What changed around service X in the last 30 minutes, and what else is impacted?”</li>\n<li><strong>Read-path context assembly</strong><br />The assistant retrieves:\n<ul>\n<li>recent deployments and config changes</li>\n<li>correlated error and latency signals</li>\n<li>dependency graph and service ownership</li>\n<li>relevant runbook references</li>\n<li>open incident/ticket context</li>\n</ul>\n</li>\n<li><strong>Synthesis and hypothesis</strong><br />The assistant returns:\n<ul>\n<li>a timeline of likely causal events</li>\n<li>probable blast radius</li>\n<li>top candidate root-cause hypotheses</li>\n<li>confidence notes and missing evidence</li>\n</ul>\n</li>\n<li><strong>Guided next steps</strong><br />It proposes ordered actions (for example: validate rollback guardrails, run diagnostic checks, notify owning team).</li>\n<li><strong>Controlled action path</strong><br />For any write/change action, approvals and policy gates are enforced. High-impact actions remain explicitly human-authorized.</li>\n<li><strong>Traceability and handoff</strong><br />The conversation captures evidence, decisions, and actions in sequence, improving auditability and shift handoffs.</li>\n</ol>\n<p>This is the practical value of MCP in operations: not replacing tools, but making them work together in a way that gives responders faster, clearer, and safer decision context.</p>\n<h2>4. Boundaries and Risks: What MCP Doesn’t Do</h2>\n<p>MCP does <strong>not</strong> replace observability stacks, cloud platforms, ITSM systems, or security tooling.<br />MCP does <strong>not</strong> guarantee correct AI reasoning.<br />MCP does <strong>not</strong> remove the need for human accountability.</p>\n<p>Safe usage still depends on established controls:</p>\n<ul>\n<li>Least-privilege access and role boundaries</li>\n<li>Approval gates for high-impact changes</li>\n<li>Auditability and traceability</li>\n<li>Blast-radius constraints and rollback readiness</li>\n<li>Human incident command for critical decisions</li>\n</ul>\n<p>Better connectivity should improve clarity, not bypass governance.</p>\n<h2>5. Adoption Blueprint: Phased Scale, Continuous Control</h2>\n<p>Adopting Agentic Ops is less about switching on a feature and more about building operating maturity. The most effective path is phased: start with low-risk value, prove reliability, and expand autonomy only when governance and trust keep pace.</p>\n<h3>Phase 1: Observe (Read-only foundation)</h3>\n<p>Enable assistants to retrieve and summarize context across systems without taking action.</p>\n<ul>\n<li>Cross-system incident context aggregation</li>\n<li>Timeline and change-correlation summaries</li>\n<li>Ownership/runbook discovery support</li>\n</ul>\n<p><strong>Objective:</strong> improve triage speed and clarity without operational risk.</p>\n<h3>Phase 2: Recommend (Decision support)</h3>\n<p>Move from context retrieval to structured guidance.</p>\n<ul>\n<li>Ranked hypotheses with supporting evidence</li>\n<li>Ordered, runbook-aligned next steps</li>\n<li>Explicit confidence and evidence gaps</li>\n</ul>\n<p><strong>Objective:</strong> improve decision quality and reduce cognitive load under pressure.</p>\n<h3>Phase 3: Execute with Guardrails (Constrained action)</h3>\n<p>Allow narrowly scoped actions where controls are explicit and auditable.</p>\n<ul>\n<li>Pre-approved low-risk actions only</li>\n<li>Human approval for high-impact changes</li>\n<li>Policy checks, role boundaries, and full traceability</li>\n</ul>\n<p><strong>Objective:</strong> accelerate response while preserving accountability.</p>\n<h3>Phase 4: Institutionalize (Operational hardening)</h3>\n<p>Embed the model into standard operations and governance cycles.</p>\n<ul>\n<li>Standard operating patterns and ownership model</li>\n<li>Periodic policy/risk reviews</li>\n<li>Post-incident learning loop to refine assistant behavior</li>\n</ul>\n<p><strong>Objective:</strong> make the capability dependable, repeatable, and governable at scale.</p>\n<h3>Control principles that apply in every phase</h3>\n<ul>\n<li><strong>Least privilege by default</strong></li>\n<li><strong>Human accountability for production outcomes</strong></li>\n<li><strong>Auditability for every decision and action</strong></li>\n<li><strong>Progressive expansion only after proven reliability</strong></li>\n</ul>\n<p>The core idea is simple: scale capability at the same pace as control. That is how organizations gain speed without trading away safety.</p>\n<h2>Closing Thought</h2>\n<p>Agentic Ops represents a practical evolution in how modern operations teams work: less time spent collecting fragmented signals, more time spent making high-quality decisions under pressure. Its value is not in removing humans from critical workflows, but in augmenting human judgment with faster, more structured operational context.</p>\n<p>MCP is what makes that evolution implementable at scale. By providing a standard way for assistants to connect to operational systems, MCP turns isolated tools into a connected decision environment. It doesn’t replace platforms or governance—but it does make Agentic Ops real, usable, and operationally meaningful.</p>"
