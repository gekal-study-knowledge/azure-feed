"overview": |
  この日は 4 ソースから 9 本と少なめで、マルチクラウド運用とモダナイゼーション、バックアップ、セキュリティの更新が中心でした。Azure SRE Agent は AWS と Google Cloud にネイティブ対応し、Azure Container Apps で動く API のエラーが Amazon DynamoDB 側に起因するかどうかのように、クラウドをまたいで証拠をたどる調査ができるようになったことが解説されました。モダナイゼーションでは、アプリケーションのアーキテクチャ・依存関係・クラウド対応状況を評価しつつ、アプリが依存するデータベースも検出して移行をつなげるエージェント型の Modernize CLI がパブリックプレビューとなりました。Azure Backup は同じテナント内の別サブスクリプションにある Recovery Services コンテナーで Azure Virtual Machines を保護できるサブスクリプション間バックアップを一般提供とし、米国政府機関とそのパートナー向けに Azure Government 上の新しい Azure Databricks 環境がベータで提供されました。セキュリティでは、Azure Front Door Premium の Web Application Firewall に、AI クローラーやエージェントを目的ごとに許可・拒否できる AI ボットルールセットがパブリックプレビューで加わっています。そのほか、Azure ポータルから Gateway API ベースのイングレスを有効化・管理できるようになったことと、認可・変更検出・イベント配信を肩代わりする Azure Functions のコネクタの内部アーキテクチャが紹介されました。Azure Infrastructure Blog では、セキュリティ保護された Azure Virtual WAN ハブとプライベート AKS の上にセルフホストの GitHub Actions ランナーを置き、プライベートなデプロイ先を公開せずにワークフローを実行する設計について、送信アクセスやリポジトリの権限とあわせてランナー環境をセキュリティ境界として扱う考え方が解説されました。後から追加された Azure Infrastructure Blog の記事では、インシデント対応や変更作業で既に使われている ChatOps は、手がかりがアラートやダッシュボードなどに分散する現代の障害では限界があるとして、MCP によってエージェント型の運用 (Agentic Ops) へ進むときに何が変わり、何が変わらないのかが解説されました。
