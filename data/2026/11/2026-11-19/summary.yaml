"overview": |
  この日は 3 ソースから 7 本と少なめで、マルチクラウド運用とモダナイゼーション、バックアップ、セキュリティの更新が中心でした。Azure SRE Agent は AWS と Google Cloud にネイティブ対応し、Azure Container Apps で動く API のエラーが Amazon DynamoDB 側に起因するかどうかのように、クラウドをまたいで証拠をたどる調査ができるようになったことが解説されました。モダナイゼーションでは、アプリケーションのアーキテクチャ・依存関係・クラウド対応状況を評価しつつ、アプリが依存するデータベースも検出して移行をつなげるエージェント型の Modernize CLI がパブリックプレビューとなりました。Azure Backup は同じテナント内の別サブスクリプションにある Recovery Services コンテナーで Azure Virtual Machines を保護できるサブスクリプション間バックアップを一般提供とし、米国政府機関とそのパートナー向けに Azure Government 上の新しい Azure Databricks 環境がベータで提供されました。セキュリティでは、Azure Front Door Premium の Web Application Firewall に、AI クローラーやエージェントを目的ごとに許可・拒否できる AI ボットルールセットがパブリックプレビューで加わっています。そのほか、Azure ポータルから Gateway API ベースのイングレスを有効化・管理できるようになったことと、認可・変更検出・イベント配信を肩代わりする Azure Functions のコネクタの内部アーキテクチャが紹介されました。
