    "title": "Inside the architecture: How connectors work with Azure Functions"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/inside-the-architecture-how-connectors-work-with-azure-functions/ba-p/4573939"
    "published": "2026-11-19 05:43:32"
    "fetched": "2026-11-19 17:04:34"
    "summary": "<p>Say you run a shared support inbox. Each time a customer writes in, you want a function to read the email, pick out the important parts, and post a summary in your team's Teams channel. The business logic might be twenty lines. The rest is authorization, change detection, event delivery, and a second set of permissions to post in Teams, and you rebuild most of it for every service you touch.</p>\n<p>Azure Connectors and the Connector SDKs take that work on. The platform manages connections and authorization. The same app can react to events in one service and call operations in another. Webhook and poll delivery give you push or pull, so you can pick what fits your app. One SDK per language covers the Connector catalog with typed operations and payloads, VS Code tooling handles setup, and SDKs are available for .NET, Python, and Node.js from day one.</p>\n<p>Underneath those promises are a handful of pieces we built and a few decisions about where each one stops. The support inbox runs through all of them.</p>\n<h4>Starting from what Azure already has</h4>\n<p>Azure already runs more than 1,000 managed Connectors, connecting to 1,600+ services. They power Azure Logic Apps and Power Automate, and API Hub hosts their connections, OAuth consent, and runtime. Logic Apps already knows how to run Connector triggers, whether the source sends notifications, accepts a webhook subscription, or has to be polled.</p>\n<p>So we didn't write a second integration for each service. We built a new front door to the existing Connector runtime, one that application code can use directly, and added the glue Azure Functions needs on top. Most of the new work falls into four areas:</p>\n<ul>\n<li>A control plane, the Connector Namespace, that exposes connections, access policies, and trigger configurations as Azure resources.</li>\n<li>A runtime layer that proxies SDK calls into API Hub and turns trigger configurations into system-managed workflows with a delivery step at the end.</li>\n<li>A Functions Connector extension, with host and worker pieces, that receives events by webhook or by polling and feeds the Functions scale controller.</li>\n<li>One code generator that emits typed SDKs for .NET, Python, and Node.js from live Connector metadata, plus tooling that sets everything up.</li>\n</ul>\n<img />\n<p>Azure Connectors and Azure Functions architecture: the Outlook mailbox, the connector platform, and the Function App, with every flow from the email arriving to the summary reaching Teams</p>\n\n<h4>The control plane: Connector Namespace</h4>\n<p>A Connector Namespace is an Azure Resource Manager resource of type <span class=\"lia-text-color-10\">`Microsoft.Web/connectorGateways`</span>. Under it sit three child resource types: connections, connection access policies, and trigger configurations. Because they're ARM resources, you can create them with Bicep, the CLI, or the VS Code tooling, and they get the usual Azure role-based access control and lifecycle.</p>\n<p>A connection is the application-facing name for a backing API Hub connection, the same kind Logic Apps uses. The consent you grant for Outlook lives there. An access policy lists the Microsoft Entra identities, such as a Function App's managed identity, that may use a connection. That split means the identity that calls the connection and the account that consented to the mailbox are separate, and you can change one without touching the other.</p>\n<img />\n<p>Authorize the connections: the Function App's managed identity presents a token to the access policies, and the Outlook and Teams connections hold OAuth consent for their accounts</p>\n\n<p>&nbsp;</p>\n<p>A trigger configuration describes an event source. Its properties include the connection, the connector operation (for the support inbox, <span class=\"lia-text-color-15\">`OnNewEmailV3`</span>), the operation's parameters, optional trigger conditions and settings, and a delivery mode. For webhook delivery it carries the callback details; for Poll delivery the service fills in the polling endpoints.</p>\n<p>Each namespace also gets a stable host name, and a background job repairs its DNS record if it drifts.</p>\n<h4>The action path: a proxy into API Hub</h4>\n<p>When your handler posts the summary to Teams, the generated SDK client sends an HTTPS request to the connection's runtime URL. On the platform side that URL maps to `<span class=\"lia-text-color-15\">api/connectorGateways/{gateway}/connections/{connection}/runtime`</span>, followed by the operation's own path.</p>\n<p>Behind that route, the runtime processor handles each request in four steps:</p>\n<ol>\n<li>It resolves the application-facing connection to its backing API Hub connection and environment, in the namespace's scale unit.</li>\n<li>It builds the API Hub runtime URL and checks that the requested path stays inside that connection, so a caller can't reach a different connection by rewriting the path.</li>\n<li>It strips identity headers supplied by the caller and attaches a platform service token, plus headers that pass the caller's managed identity through.</li>\n<li>It forwards the method, path, query, and body to API Hub, which runs the connector operation against Teams.</li>\n</ol>\n<p>The caller authenticates with a Microsoft Entra token for the API Hub audience. In the Node.js SDK the default scope is <span class=\"lia-text-color-15\">`https://apihub.azure.com/.default`</span>, and the token comes from any Azure Identity <span class=\"lia-text-color-15\">`TokenCredential`</span>, typically the Function App's managed identity.</p>\n<p>The SDK side is thin on purpose. Generated clients extend a shared base class that holds the runtime URL and credential. A shared HTTP pipeline built on Azure Core adds the token, a user agent, tracing, and retries. Retries apply by default only to safe methods such as <span class=\"lia-text-color-15\">`GET`</span> and <span class=\"lia-text-color-15\">`HEAD`</span>, because retrying a `POST` that sends a message could send it twice. Paged operations follow `nextLink` values. When a continuation link points at a different host, as some connector back ends return, the SDK reroutes its path and query through the connection's runtime URL, so paging stays behind the proxy. Failures surface as a `ConnectorError` that carries the connector name, the operation, the status code, and the response body.</p>\n<h4>The trigger path: system-managed workflows</h4>\n<p>When you create a trigger configuration, the trigger API validates the request, generates a Logic Apps workflow definition, creates the workflow directly in a platform-owned subscription under a generated name, and stores the workflow details alongside the trigger configuration. Updates rewrite the workflow, and deleting the trigger configuration removes the workflow, its Poll queue, and its message history.</p>\n<img />The trigger configuration generates the backing trigger workflow, which uses the Outlook connection\n<p>The workflow generator picks the right trigger shape for the operation's metadata: a notification subscription, a webhook subscription, or a recurring poll. It adds <span class=\"lia-text-color-15\">`splitOn` </span>for operations that return batches, so each item becomes its own run unless the configuration opts out, and it applies any trigger conditions you set. The workflow ends with a connector delivery action.</p>\n<p>We generate a workflow per trigger configuration because Logic Apps already has years of hardening around subscription renewal, polling state, and trigger history, and every connector trigger already runs on it. The workflow stays an implementation detail: customers work with the trigger configuration resource and never see or edit the workflow.</p>\n<h4>Two ways to deliver an event</h4>\n<p>How the platform notices a new email and how the event reaches your function are separate problems. The backing workflow handles the first. The delivery action at the end of the workflow handles the second, and it supports two transports.</p>\n<h5>Webhook delivery</h5>\n<p>For webhook delivery, which is the default, the delivery action makes an HTTPS call to the callback in the trigger configuration, using the workflow engine's HTTP retry policy. On the Function App side, the callback is the host's `/runtime/webhooks/connector` route, protected by a system key named `connector_extension`. A `functionName` query parameter selects the function. The host returns `202` when the invocation succeeds, `400` for a missing or invalid name, `404` for an unknown function, and `500` when the invocation fails.</p>\n<h5>Poll delivery</h5>\n<p>For Poll delivery, the delivery action writes the event to an Azure Storage queue owned by that trigger configuration and records it in a message history table. Storage queue messages are limited to 64 KiB, so when an event is larger the action queues a reference to the workflow run's output instead of the output itself.</p>\n<p>The Poll runtime API sits in front of the queue and has four operations: <span class=\"lia-text-color-15\">`receive`</span>, <span class=\"lia-text-color-15\">`acknowledge`</span>, <span class=\"lia-text-color-15\">`hasMessages`,</span> and <span class=\"lia-text-color-15\">`approximateQueueDepth`</span>. <span class=\"lia-text-color-15\">`receive` </span>hands out events under a temporary lease with an opaque lock token. `acknowledge` deletes an event only when the message ID and a still-valid lock token match. If the lease expires first, the event becomes visible again. The reported depth is approximate and excludes leased messages.</p>\n<img />\n<p>Deliver the event by Poll: the delivery action enqueues the event, and the Functions host receives and acknowledges it from the Poll queue</p>\n\n<p>Poll delivery means the Function App never exposes an inbound endpoint, and work can build up safely when the app is busy, scaled to zero, or running on a developer's laptop.</p>\n<h4>Inside Azure Functions: the connector extension</h4>\n<p>The Functions side has two layers. A host extension, written as a WebJobs extension, owns transport and scaling. A worker extension for each language turns payloads into typed objects for your handler.</p>\n<h5>The host extension</h5>\n<p>The host extension registers a `<span class=\"lia-text-color-15\">connectorTrigger` </span>binding. Each function picks webhook or Poll delivery, and the binding starts the matching listener.</p>\n<p>The Poll listener runs a receive loop. When the queue is empty it backs off with jitter, up to a configurable maximum interval, and receive failures get their own capped backoff. It authenticates to the polling endpoint with the connection's credential, usually the Function App's managed identity. A function that takes one event at a time can run several invocations in parallel, up to <span class=\"lia-text-color-15\">`MaxConcurrentCalls`.</span> A batched function processes one batch at a time per listener. An event is acknowledged only after its invocation succeeds; a failed invocation leaves the event unacknowledged so it comes back when the lease expires. When an event holds a link to a large output, the listener downloads it, with a 100 MiB default cap.</p>\n<p>Poll delivery also plugs into Azure Functions target-based scaling. The connector trigger reports how much work is waiting by reading the queue's approximate depth through the same Poll runtime API. Azure Functions does the scaling, aiming for <span class=\"lia-text-color-15\">`ceil(depth / target)`</span> instances. The target is the function's pending-event threshold, or the per-instance concurrency that the platform supplies when it has one. Batch size and concurrency don't change that calculation.</p>\n<p>&nbsp;</p>\n<p>Batching therefore happens in several places. The source trigger can return a collection, <span class=\"lia-text-color-15\">`splitOn` </span>can split it into separate runs, and the Poll listener can deliver several events to one invocation. The batch settings have the same meaning in every language:</p>\n<p>&nbsp;</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; height: 221.333px; border-width: 1px;\"><colgroup><col style=\"width: 25%;\" /><col style=\"width: 25%;\" /><col style=\"width: 25%;\" /><col style=\"width: 25%;\" /></colgroup><tbody><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\">Setting</td><td style=\"height: 34.6667px;\">.NET isolated</td><td style=\"height: 34.6667px;\">Python</td><td style=\"height: 34.6667px;\">Node.js</td></tr><tr style=\"height: 58.6667px;\"><td style=\"height: 58.6667px;\">Receive several events per invocation</td><td style=\"height: 58.6667px;\">`IsBatched = true`</td><td style=\"height: 58.6667px;\">`cardinality=func.Cardinality.MANY`</td><td style=\"height: 58.6667px;\">`cardinality: Cardinality.Many`</td></tr><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\">Maximum events per invocation</td><td style=\"height: 34.6667px;\">`MaxBatchSize`</td><td style=\"height: 34.6667px;\">`max_batch_size`</td><td style=\"height: 34.6667px;\">`maxBatchSize`</td></tr><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\">Concurrent single-event calls</td><td style=\"height: 34.6667px;\">`MaxConcurrentCalls`</td><td style=\"height: 34.6667px;\">`max_concurrent_calls`</td><td style=\"height: 34.6667px;\">`maxConcurrentCalls`</td></tr><tr style=\"height: 58.6667px;\"><td style=\"height: 58.6667px;\">Pending events per instance, for scaling</td><td style=\"height: 58.6667px;\">`TargetPendingEventThreshold`</td><td style=\"height: 58.6667px;\">`target_pending_event_threshold`</td><td style=\"height: 58.6667px;\">`targetPendingEventThreshold`</td></tr></tbody></table></div>\n<p>The batch size can be 1 through 32 and defaults to 1.</p>\n<h5>The worker extensions</h5>\n<p>Because the host extension does the transport work, each language worker only has to bind payloads. The .NET isolated worker extension deserializes the payload into the type your function declares, such as a generated <span class=\"lia-text-color-15\">`Office365OnNewEmailTriggerPayload`</span>, or into <span class=\"lia-text-color-15\">`ConnectorEvent[]`</span> when you also want each Poll message ID. Python functions use the <span class=\"lia-text-color-15\">`connector_trigger` </span>decorator from the <span class=\"lia-text-color-15\">`azure-functions`</span> library. Other workers reach the same host extension through the Functions extension bundle and the <span class=\"lia-text-color-15\">`connectorTrigger` </span>binding type.</p>\n<p>The Node.js extension shows how thin this layer is. One generic wrapper registers the trigger and flattens every payload shape (a single item, a collection in `<span class=\"lia-text-color-15\">body.value`</span>, or an array of Poll envelopes) into one list of items, keeping the original in <span class=\"lia-text-color-15\">`rawPayload`.</span> Each connector's helper is then a few lines that add a friendly alias and borrow the item type from the generated SDK. This is the whole OneDrive for Business file:</p>\n<pre>&nbsp;</pre>\nimport { BlobMetadata } from \"@azure/connectors/generated/OneDriveForBusinessExtensions\"; import { OneDriveFileTriggerContext } from \"../../types\"; import { createConnectorTrigger } from \"./createConnectorTrigger\"; const registerFileTrigger = createConnectorTrigger&lt;BlobMetadata, OneDriveFileTriggerContext&gt;( (context) =&gt; ({ ...context, files: context.items }), ); export const onNewFiles = registerFileTrigger; export const onUpdatedFiles = registerFileTrigger;\n<p><span class=\"lia-text-color-15\">`BlobMetadata`</span>&nbsp;comes from the same generated module that the OneDrive client uses for actions, so a trigger payload and an action response share one type, defined once from the connector's metadata.</p>\n<h5>Calling out from the handler</h5>\n<p>After reading the email, the handler posts a summary to Teams. That call leaves the Function App through the same connector platform, going the other way.</p>\n<p>The handler calls a generated Teams client with typed input. The client holds the Teams connection's runtime URL and an Azure Identity credential, gets a Microsoft Entra token, usually for the Function App's managed identity, and sends the request. The Function App never holds a Teams token or secret.</p>\n<p>The connection's access policies decide whether that identity may use the Teams connection, and the connection holds the OAuth consent for the account that posts. The connector runtime resolves the connection, replaces the caller's identity headers with a platform token, and runs the operation against Teams.</p>\n<img />Post the summary to Teams: the handler calls the Teams SDK client, the request goes through the connector runtime using the Function App's identity and the Teams connection's consent, and the runtime posts the message to Teams\n<p>This path doesn't depend on how the email arrived, so it works the same with webhook or Poll delivery and with any connector in the catalog. Idempotency is the handler's job. The SDK won't retry a failed post, but a redelivered event runs the whole invocation again, so the handler should check before posting the same summary twice.</p>\n<h4>One generator, three SDKs</h4>\n<p>The SDKs are generated. A shared generator in the Logic Apps codebase, <span class=\"lia-text-color-15\">`CodefulSdkGenerator`</span>, reads live connector Swagger definitions through Azure Resource Manager, cleans them up, and emits clients for C#, Python, and TypeScript. Each SDK repository records what produced it in a generation manifest: the generator commits, the metadata API version, and a hash of every connector's Swagger input. That makes each regeneration traceable to a specific generator revision and a specific set of connector definitions.</p>\n<p>Besides action methods, the generator emits models for request and response bodies, typed trigger payloads and trigger operation constants, catalog constants that list the available connectors, and support for paging and dynamic schemas. Each language then has a small handwritten runtime (the base client, the HTTP pipeline, errors, and paging) that the generated code builds on. Naming rules are kept consistent across languages, so the same connector and operation have recognizable names whether you write C#, Python, or TypeScript.</p>\n<p>For setup, the VS Code connection manager and the connection-setup skill create the namespace and connection through the ARM preview API, open the OAuth consent page and check that the connection reports `Connected`, add access policies for your developer identity or the Function App's managed identity, and write the runtime URLs into local or deployed app settings.</p>\n<h4>Recap</h4>\n<p>When a customer writes in, the backing workflow detects the email through API Hub's existing connector trigger. The delivery action then either calls the Function App's webhook or writes to a per-trigger Storage queue that the host extension polls and scales on. The language worker binds the payload to a type that came from the same generator as the SDK, and the handler uses a generated Teams client whose calls go through the namespace's runtime proxy into API Hub.</p>\n<p>Each piece reuses what was already there: the Logic Apps workflow engine for triggers, API Hub for connections and connector runtime, the Functions extension model and scale controller for hosting, and Azure Identity for credentials. The new parts are the namespace resources that tie them together, the delivery step, the Functions extension, and the generator that keeps every language's types in step with the connectors themselves.</p>\n<h4>References</h4>\n<h5>Connectors SDKs</h5>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>Language</td><td>Repository</td></tr><tr><td>.NET</td><td><a href=\"https://github.com/Azure/Connectors-NET-SDK\" rel=\"noopener\" target=\"_blank\">Azure/Connectors-NET-SDK</a></td></tr><tr><td>Python</td><td><a href=\"https://github.com/Azure/Connectors-Python-SDK\" rel=\"noopener\" target=\"_blank\">Azure/Connectors-Python-SDK</a></td></tr><tr><td>Node.js</td><td><a href=\"https://github.com/Azure/Connectors-NodeJS-SDK\" rel=\"noopener\" target=\"_blank\">Azure/Connectors-NodeJS-SDK</a></td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h5>Azure Functions connector extensions</h5>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>Component</td><td>Repository</td></tr><tr><td>Host extension and .NET isolated worker extension</td><td><a href=\"https://github.com/Azure/azure-functions-connector-extension\" rel=\"noopener\" target=\"_blank\">Azure/azure-functions-connector-extension</a></td></tr><tr><td>Python worker extension</td><td><a href=\"https://github.com/Azure/azure-functions-python-extensions/tree/dev/azurefunctions-extensions-connectors\" rel=\"noopener\" target=\"_blank\">azurefunctions-extensions-connectors</a></td></tr><tr><td>Node.js worker extension</td><td><a href=\"https://github.com/Azure/azure-functions-nodejs-extensions/tree/main/azure-functions-nodejs-extensions-connectors\" rel=\"noopener\" target=\"_blank\">azure-functions-nodejs-extensions-connectors</a></td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table>\n<h5>Samples</h5>\n</div>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>Sample</td><td>Repository</td></tr><tr><td>.NET email triage into Teams</td><td><a href=\"https://github.com/Azure-Samples/functions-connectors-net-e2e-email-users-teams\" rel=\"noopener\" target=\"_blank\">Azure-Samples/functions-connectors-net-e2e-email-users-teams</a></td></tr><tr><td>.NET connector samples</td><td><a href=\"https://github.com/Azure/Connectors-NET-samples\" rel=\"noopener\" target=\"_blank\">Azure/Connectors-NET-samples</a></td></tr><tr><td>Python connector samples</td><td><a href=\"https://github.com/Azure-Samples/functions-connectors-python\" rel=\"noopener\" target=\"_blank\">Azure-Samples/functions-connectors-python</a></td></tr><tr><td>TypeScript connector samples</td><td><a href=\"https://github.com/Azure-Samples/functions-connectors-typescript\" rel=\"noopener\" target=\"_blank\">Azure-Samples/functions-connectors-typescript</a></td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p>Note: The connector platform internals described in the post (the resource model, runtime proxy, trigger workflows, delivery action, and Poll runtime API) aren't in a public repository, so they have no links here.</p>"
