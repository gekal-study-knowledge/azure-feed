  "157389d81d4a2ea44d945c7d4a67b1d3":
    "id": "157389d81d4a2ea44d945c7d4a67b1d3"
    "title": "Enable and manage Gateway API on Azure Portal"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/enable-and-manage-gateway-api-on-azure-portal/ba-p/4574567"
    "published": "2026-11-19 05:32:19"
    "fetched": "2026-11-19 17:04:36"
    "summary": "<p>Gateway API is the long-term Kubernetes standard for ingress and L7 traffic management. Compared with the traditional Ingress resource, Gateway API separates infrastructure entry points from routing configuration, giving platform and application teams clearer ownership boundaries and a more extensible model for managing application traffic.</p>\n<p>&nbsp;Customers can now discover and configure Gateway API-based ingress solutions, view Gateway and HTTPRoute resources and better understand the ingress configuration of an AKS cluster without leaving the Portal.</p>\n<h2>A new Ingress profile for AKS</h2>\n<p>AKS offers two options for Gateway API implementations:</p>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/aks/app-routing-gateway-api?pivots=azure-portal\" target=\"_blank\"><strong>Application Routing with Gateway API</strong></a>, an AKS-native path for cluster-hosted routing.</li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/overview?toc=/azure/aks/toc.json&amp;bc=/azure/aks/breadcrumb/toc.json\" target=\"_blank\"><strong>Application Gateway for Containers</strong></a>, an Azure application-layer load balancing and traffic-management solution managed through the ALB Controller.</li>\n</ul>\n<p>To enable either Gateway controller, you can:</p>\n<ol>\n<li>Navigate to an AKS cluster in the Azure portal.</li>\n<li>Select <strong>Networking</strong>.</li>\n<li>Select <strong>Ingress profile</strong>.</li>\n<li>Select <strong>Manage </strong>under <strong>Application Routing with Gateway API </strong>or<strong> Application Gateway for Containers</strong></li>\n<li>Select <strong>Enable.</strong></li>\n</ol>\n<img />\n<p>The portal will install the Managed Gateway API add-on as a prerequisite to using either Gateway API implementation, if not already installed. Once enablement is complete, you can return to the <span style=\"color: rgb(30, 30, 30);\"><strong>Ingress profile</strong> on any cluster to easily understand which controller(s) are currently enabled and disable if desired.</span></p>\n<h2>Gateways and HTTPRoutes are now visible under Kubernetes resources</h2>\n<p>The AKS Kubernetes resources experience also now surfaces <strong>Gateways</strong> and <strong>HTTPRoutes</strong>, allowing customers to inspect the Gateway API resources running on their cluster directly from the Portal.</p>\n<p>You can view and manage Gateway and HTTPRoute resources directly from Portal and easily grasp additional details per-resource such as listeners and backends, respectively.</p>\n<img />\n<p>The following shows an overview of a sample Gateway resource in Portal.</p>\n<img />\n<p>This makes the Portal useful not just for enabling Gateway API, but for understanding interactions between the resulting Gateway and Route resources.</p>\n<h2>Get started</h2>\n<p>To try Application Routing with Gateway API, see Azure Kubernetes Service (AKS) Application Routing Add-On with the Kubernetes Gateway API. <a href=\"https://learn.microsoft.com/en-us/azure/aks/app-routing-gateway-api\" target=\"_blank\">[Azure Kube...soft Learn | Learn.Microsoft.com]</a></p>\n<p>To use Application Gateway for Containers, see Quickstart: Deploy Application Gateway for Containers ALB Controller - AKS Add-on. <a href=\"https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/quickstart-deploy-application-gateway-for-containers-alb-controller-addon\" target=\"_blank\">[Quickstart...soft Learn | Learn.Microsoft.com]</a></p>"
  "4608f988c2db8f074596f0c95ac0437b":
    "id": "4608f988c2db8f074596f0c95ac0437b"
    "title": "Azure SRE Agent now natively supports AWS and Google Cloud"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-sre-agent-now-natively-supports-aws-and-google-cloud/ba-p/4569556"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 17:04:36"
    "summary": "<p><strong><span>The alert is in Azure. The next clue may be in AWS.</span><span>&nbsp;</span></strong></p>\n<p><span>Imagine an inventory API running on Azure Container Apps starts returning errors. Azure telemetry shows requests failing, but the application reads its data from an Amazon DynamoDB table. Is the container app unhealthy, or is the database struggling? To find out, your team needs to follow the evidence across clouds.</span><span>&nbsp;</span></p>\n<p><span>Your infrastructure spans clouds. Your investigations should too.</span><span>&nbsp;</span></p>\n<p><span>Today, we're announcing the </span><strong><span>public preview of built-in AWS and Google Cloud connectors for Azure SRE Agent</span></strong><span><strong>.</strong> With native support for both clouds, the agent can investigate your connected AWS and Google Cloud environments alongside Azure, without moving your workloads or rebuilding the investigation in another console.</span><span> The AWS and Google Cloud connectors are part of a broader set of Azure SRE Agent announcements at Microsoft Ignite 2026, including new capabilities for Teams, agent identity and governance, and cross-agent collaboration, <a href=\"https://aka.ms/ignite2026/sreagent\" target=\"_blank\">see the full announcement</a>.</span></p>\n<h1>What's new</h1>\n<p><span>The AWS connector gives the agent tools from the AWS MCP Server, a managed Model Context Protocol (MCP) service from AWS. The Google Cloud connector uses the built-in Google Cloud CLI (</span><span>gcloud</span><span>). These tools become part of the agent's investigative capabilities alongside its Azure tools.</span><span>&nbsp;</span></p>\n<p><span>Both connectors use identity federation with an Azure managed identity. In AWS, SRE Agent assumes an IAM role; in Google Cloud, it uses Workload Identity Federation. That means </span><strong><span>no AWS access keys or Google Cloud service account keys to manage for these connections, and no custom connector or MCP server to build and host.</span><span>&nbsp;</span></strong></p>\n<p><span>The </span><span>Cloud providers</span><span> experience guides you through connecting your environment and lets you test the connection before saving it.</span><span>&nbsp;<br /></span></p>\n<img />\n<h2><span><span>Here's</span><span> what </span><span>it enables</span></span><span>&nbsp;</span></h2>\n<h3><span><span>One agent across accounts and projects</span></span><span>&nbsp;</span></h3>\n<p><span>Teams often organize AWS workloads into separate accounts and Google Cloud workloads into separate projects by application, team, or environment. </span><strong><span>One SRE Agent can investigate across these boundaries</span></strong><span>, without requiring you to consolidate them.</span><span>&nbsp;</span></p>\n<ul>\n<li><span><strong>AWS</strong>:</span><span> Add a separate named connection for each account. Each connection uses the IAM role and permissions configured in that account.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><strong><span>Google Cloud</span></strong><span>:<strong> </strong>One connection can access multiple projects when its federated identity has the required IAM roles in each project. Add separate connections when you need different managed identities or workload identity providers.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>Refer to connections by name, such as </span><span>aws-production</span><span> or </span><span>gcp-production</span><span>, and specify the project ID for Google Cloud.</span><span>&nbsp;</span></p>\n<h3><span><span>Investigate in conversation or automatically</span></span><span>&nbsp;</span></h3>\n<p><span>Ask in natural language, or set up incident response plans, scheduled tasks, and workflows to run investigations. The agent can choose the available tools, gather evidence across Azure and your connected AWS or Google Cloud environments, and bring it together in one investigation, subject to the access and approvals you configure.</span><span>&nbsp;</span></p>\n<h3><span><span>Access and approvals stay under your control</span></span><span>&nbsp;</span></h3>\n<p><span><strong>Trust determines which identity can authenticate; cloud IAM determines what it can access</strong>.</span><span> SRE Agent's run modes and tool approval policies add controls over what the agent can do and when it needs approval.</span><span>&nbsp;</span></p>\n<p><span>Google Cloud connections start with </span><strong><span>Read</span></strong><span><strong> </strong>access. Choosing </span><strong><span>Write</span></strong><span><strong> </strong>when needed does not grant additional Google Cloud IAM permissions. AWS tools and approvals are managed on the </span><strong><span>Tools</span></strong><span><strong> </strong>page and shared across AWS connections.</span><span>&nbsp;</span></p>\n<p><span>For AWS, the </span><em><span>aws:ViaAWSMCPService</span></em><span> condition key also lets you write policies that distinguish requests made through the AWS MCP Server from direct API calls. Learn more about the agent's security approach in </span><a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/stop-restricting-the-agent-start-restricting-its-environment-/4548726\" rel=\"noopener\" target=\"_blank\"><span><span>Stop restricting the agent. Start restricting its environment.</span></span></a><span>&nbsp;</span></p>\n<h3><span><span>See activity in your cloud's audit logs</span></span><span>&nbsp;</span></h3>\n<p><span>Your teams can use their existing cloud audit tools to review supported activity:</span><span>&nbsp;</span></p>\n<ul>\n<li><span><strong>AWS CloudTrail</strong>:</span><span> CloudTrail can record AWS MCP Server tool calls, including events from </span><span>aws-mcp.amazonaws.com</span><span>. SRE Agent uses </span><span>SREAgentRole</span><span> with a role session starting </span><span>AzureSREAgent-</span><span>, helping identify role-related activity. The session name is stable per agent, not per investigation.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><strong>Google Cloud Audit Logs</strong>:</span><span> Supported API activity can be associated with the agent's federated principal. Enable Data Access audit logs where needed to capture supported read activity.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>The events available depend on the cloud service and your audit-log settings.</span><span>&nbsp;</span></p>\n<h2><span><span>Follow an investigation from Azure to AWS</span></span><span>&nbsp;</span></h2>\n<p><span>Let's return to the inventory application. It runs on </span><strong><span>Azure Container Apps</span></strong><span> and reads inventory data from an </span><strong><span>Amazon DynamoDB</span></strong><span> table. The team sees rising HTTP 5xx errors and needs to understand whether the problem is in Azure, AWS, or the interaction between them.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p><span>With the right access, the agent can inspect the app's logs and revisions in Azure, then check the DynamoDB table and CloudWatch metrics in AWS.</span><span>&nbsp;</span></p>\n<img />\n<h2><span><span>Learn more</span></span></h2>\n<ul>\n<li><strong><span>Get started:</span> <a href=\"https://sre.azure.com/docs/capabilities/aws-connector\" rel=\"noopener\" target=\"_blank\"><span><span>AWS connector</span></span></a><span> and </span><a href=\"https://sre.azure.com/docs/capabilities/gcp-connector\" rel=\"noopener\" target=\"_blank\"><span><span>Google Cloud connector</span></span></a><span>&nbsp;</span></strong></li>\n</ul>\n<ul>\n<li><strong><span>Set up identity federation:</span> </strong><a href=\"https://github.com/microsoft/sre-agent/blob/main/sreagent-templates/identity-federation/aws/README.md\" rel=\"noopener\" target=\"_blank\"><span><span>AWS setup script</span></span></a><span> and </span><a href=\"https://github.com/microsoft/sre-agent/blob/main/sreagent-templates/identity-federation/gcp/README.md\" rel=\"noopener\" target=\"_blank\"><span><span>Google Cloud setup script</span></span></a><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><strong><span>Control what the agent can do:</span></strong> <a href=\"https://sre.azure.com/docs/concepts/tool-access-policies\" rel=\"noopener\" target=\"_blank\"><span><span>Tool access policies</span></span></a><span> and </span><a href=\"https://sre.azure.com/docs/concepts/run-modes\" rel=\"noopener\" target=\"_blank\"><span><span>Run modes</span></span></a><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><strong><span>Audit agent activity:</span></strong> <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/logging-using-cloudtrail.html\" rel=\"noopener\" target=\"_blank\"><span><span>AWS MCP Server CloudTrail logging</span></span></a><span> and </span><a href=\"https://cloud.google.com/iam/docs/audit-logging/examples-workload-identity\" rel=\"noopener\" target=\"_blank\"><span><span>Google Cloud Workload Identity Federation audit logs</span></span></a><span>&nbsp;</span></li>\n</ul>\n<p><strong><span>Want to try it?</span></strong><span><strong> </strong>Connect your AWS or Google Cloud environment to your agent and follow your next investigation across clouds.</span><span>&nbsp;</span></p>\n<p><strong><span>What does your app architecture look like?</span></strong><span> Tell us in the comments what runs in Azure, AWS, or Google Cloud and where your investigations cross cloud boundaries. We'd love to hear which multi-cloud scenarios you want SRE Agent to handle next.</span><span>&nbsp;</span></p>"
"last_updated": "2026-11-19 17:04:36 JST"
