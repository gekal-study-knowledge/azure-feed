"overview": |
  この日は 4 ソースから 9 本で、.NET 11 対応とネットワーク関連の発表が中心でした。Azure Functions が isolated worker モデルで .NET 11 に対応して一般提供となり、.NET 11 の関数アプリでは新しいプロジェクト SDK である Azure.Functions.Sdk が必須になります。これまでの Microsoft.NET.Sdk をプロジェクト SDK にして Microsoft.Azure.Functions.Worker.Sdk をパッケージ参照する形に代えて、ビルド統合がプロジェクト SDK の宣言にまとまるため、プロジェクトファイルが簡潔になります。現時点では C# のみの対応で、F# のサポートは一時的に利用できません。App Service では Premium v4 (Pv4) と Premium メモリ最適化 v4 (Pmv4) のプランで、プラン単位でのアプリの開始・停止がパブリックプレビューになりました。プランがホストするアプリとデプロイスロットをまとめて扱えるため、アプリごとにコマンドを発行する必要がなくなります。操作は非同期で、停止後の終了処理や開始後にアプリが要求を受けられるようになるまでには数分かかることがあります。ネットワークでは、Azure Front Door Standard / Premium がネイティブの gRPC に対応してパブリックプレビューとなり、特定のサービスやメソッドへの呼び出しのルーティングとトラフィックの分散ができるようになりました。あわせて Azure Front Door のエッジアクション (エッジでのサーバーレスコンピューティング) が一般提供となり、クライアントのリクエスト/レスポンス処理中に軽量な JavaScript 関数を実行してリアルタイムの判断ができます。Azure Route Server は IPv4/IPv6 デュアルスタックモードがパブリックプレビューとなり、対応するハイブリッドネットワーク接続で両方のアドレスファミリーの経路交換ができるようになりました (既存の IPv4 接続は変わりません)。AKS では、AI ワークロード向けの分散リードスルーキャッシュ Distributed accelerator for cloud storage (DACS) がパブリックプレビューになり、クラスター内で動作してノードのローカル NVMe ディスクを使います。 Azure Networking Blog では、AI やハイパフォーマンスコンピューティングのワークロード、複数クラスターにまたがるアプリケーションを背景に、AKS ネットワークの接続性・性能・可観測性に関する新機能がまとめて紹介されました。Microsoft Security Blog では、Microsoft Research が、10 個未満のニューロンを編集して短いペイロードを仕込むだけで高性能なエージェントモデルをスリーパーエージェント化できるという脅威研究を公開し、この異常な重みの編集はフロンティアエージェントで検出できることも示しています。
