    "title": "What’s new in AKS networking: Connectivity, performance, and observability"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/what-s-new-in-aks-networking-connectivity-performance-and/ba-p/4571806"
    "published": "2026-11-11 04:06:23"
    "fetched": "2026-11-11 10:32:21"
    "summary": "<p>As organizations scale their cloud-native applications, networking requirements continue to evolve. AI and high-performance computing workloads demand high-throughput, low-latency connectivity, applications increasingly span multiple Kubernetes clusters and enterprises need greater control over how workload traffic is routed and isolated. At the same time, platform teams need deeper network visibility that is customizable without the complexity and cost of collecting unnecessary data.<br /><br />At Microsoft, our focus is to simplify these AKS networking challenges, enabling customers to build and scale AI applications without having to manage increasingly complex networking infrastructure.<br /><br />This November, container networking in Azure is introducing four capabilities designed to help customers build, scale, and operate the next generation of applications on AKS. These advancements address three key customer scenarios:<br /><br />·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Connect distributed applications:</strong> Simplify connectivity and service discovery across Kubernetes clusters, making it easier to build and manage distributed applications.<br /><br />·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Enable AI and specialized workloads:</strong> Support high-performance networking for distributed AI training and HPC, along with flexible network configurations for data-intensive and specialized applications.<br /><br />·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Operate with customizable visibility and control:</strong> Gain deeper insights into application networking, troubleshoot issues faster, and manage observability costs through targeted telemetry collection.</p>\n<p>Together, these capabilities expand what customers can run on AKS while reducing the complexity of the underlying networking infrastructure.</p>\n<h2><strong>Connect distributed applications</strong></h2>\n<h4><strong>Cross-cluster networking for Azure Kubernetes Fleet Manager | Generally Available</strong></h4>\n<p>As enterprises scale their applications across multiple Kubernetes clusters, connecting services across cluster boundaries often requires additional networking infrastructure, complex configurations, and operational overhead.</p>\n<p>With the general availability of cross-cluster networking for Azure Kubernetes Fleet Manager, part of Advanced Container Networking Services, customers can connect workloads across AKS clusters without deploying and managing gateways or proxies.</p>\n<p>For example, an enterprise running applications across multiple AKS clusters can enable services to discover and communicate with each other as though they were running within a single cluster. Built on Cilium, this capability also extends network policy enforcement and observability across cluster boundaries.</p>\n<p>The result is simpler multi-cluster application architectures, reduced operational complexity, and greater visibility into application connectivity as environments scale. <br /><br /></p>\n<img />\n<p><strong>Learn more about cross-cluster networking at: </strong><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/kubernetes-fleet/concepts-cross-cluster-networking\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/kubernetes-fleet/concepts-cross-cluster-networking</a><a href=\"https://learn.microsoft.com/en-us/azure/kubernetes-fleet/concepts-cross-cluster-networking\" rel=\"noopener\" target=\"_blank\"><em> </em></a></p>\n<h2><strong>Enable AI and specialized workloads</strong></h2>\n<p><strong>Multi-NIC pods for AKS | Public Preview</strong></p>\n<p>Traditional Kubernetes networking provides a single primary network interface for application traffic. However, enterprises running specialized workloads often need to separate different types of network traffic to meet their performance, connectivity, and isolation requirements.</p>\n<p>With Multi-NIC pods support in AKS, customers can attach multiple network interfaces to Kubernetes nodes and workloads, enabling greater control over how traffic is routed.</p>\n<p>For example, an enterprise running data-intensive applications can use separate network interfaces for application communication and storage traffic, helping isolate workloads and optimize network resource utilization.</p>\n<p>&nbsp;</p>\n<img />\n<p>Multi-NIC pods give customers greater flexibility to design Kubernetes networking architectures around their application requirements, without having to manage additional networking components themselves.</p>\n<p><strong>Learn more about Multi-NIC pods at:</strong> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/aks/multiple-network-interfaces-for-pods-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/aks/multiple-network-interfaces-for-pods-overview</a><a href=\"https://learn.microsoft.com/en-us/azure/aks/multiple-network-interfaces-for-pods-overview\" rel=\"noopener\" target=\"_blank\"><em> </em></a></p>\n<p><strong>Managed support for DRANET for RDMA</strong><strong> | Generally Available</strong></p>\n<p>AI training, machine learning, and high-performance computing workloads require fast, efficient communication between GPUs and compute resources. Configuring and managing the specialized networking infrastructure needed for these workloads can introduce significant operational complexity.</p>\n<p>With Managed support for DRANET for RDMA NICs in AKS, we're simplifying access to high-throughput, low-latency networking through a managed experience that supports topology-aware resource allocation.</p>\n<p>For example, organizations running distributed AI training workloads can more easily provision RDMA networking resources to support accelerated communication between compute nodes, without taking on the complexity of managing the underlying networking configuration.</p>\n<p>This enables customers to focus on scaling their AI and HPC workloads while taking advantage of the performance capabilities of RDMA-enabled Azure infrastructure.</p>\n<p><strong>Learn more about managed support for DRANET for RDMA at:</strong> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-gb/azure/aks/managed-support-for-dranet?tabs=add-ubuntu-rdma-node-pool\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-gb/azure/aks/managed-support-for-dranet?tabs=add-ubuntu-rdma-node-pool</a><em>&nbsp;</em></p>\n<h2><strong>Operate with customizable visibility and control </strong></h2>\n<p><strong>Configurable dimensions in Advanced Container Networking Services observability | Public Preview</strong></p>\n<p>Performance and connectivity are only part of operating cloud-native applications at scale. Platform, security, and SRE teams also need the right level of network visibility to troubleshoot applications, investigate threats, and meet compliance requirements.</p>\n<p>With configurable dimensions for container network observability in Advanced Container Networking Services, customers can now scope the traffic they care about and choose the level of detail to retain. For example, a security team investigating suspicious outbound traffic can retain the DNS query, source pod IP, and destination IP for the affected workload. A security engineer can collect detailed records for a failing namespace, while a compliance team can retain FQDN information for selected egress-facing applications.</p>\n<p>Customers can now also select network observations by Cilium security identity to deeply investigate unexpected outbound activity and filter logs with external destination IPs and destination port-distribution metrics. These capabilities help platform engineers understand outbound communication patterns and give application teams more context when investigating changes in how a service communicates.</p>\n<p>The result is persistent, actionable network visibility for security, troubleshooting, and compliance, with control over the scope and cost of the data collected.</p>\n<p><strong><a href=\"https://aka.ms/acns/howtoenablecnl\" rel=\"noopener\" target=\"_blank\"><span class=\"lia-text-color-21\">Learn more about configuring Container Network Logs</span></a><span class=\"lia-text-color-21\"> at:</span></strong> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/aks/container-network-observability-logs\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/aks/container-network-observability-logs</a><a href=\"https://learn.microsoft.com/en-us/azure/aks/container-network-observability-logs\" rel=\"noopener\" target=\"_blank\"><em> </em></a><em> </em></p>\n<p>These announcements reflect our continued investment in making Azure Kubernetes networking simpler to consume while supporting an increasingly diverse set of workloads.</p>\n<p>Whether customers are connecting applications across clusters, isolating network traffic for specialized workloads, accelerating communication for AI and HPC applications, or building deeper observability, our focus remains the same: deliver the networking capabilities customers need, with less infrastructure to manage and greater flexibility to scale.</p>\n<p>We're excited to bring these capabilities to our customers and look forward to connecting with the cloud-native community at KubeCon and Ignite.</p>"
