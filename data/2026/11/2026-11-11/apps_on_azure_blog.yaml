"entries":
  "a3ce37fecaf30b34dc6853dded138ae6":
    "id": "a3ce37fecaf30b34dc6853dded138ae6"
    "title": ".NET 11 is now generally available in Azure Functions"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/net-11-is-now-generally-available-in-azure-functions/ba-p/4571176"
    "published": "2026-11-11 04:58:09"
    "fetched": "2026-11-11 06:30:20"
    "summary": "<p>Today, we're announcing general availability of .NET 11 support in Azure Functions through the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/dotnet-isolated-process-guide\" rel=\"noopener\" target=\"_blank\">isolated worker model</a>. You can build new serverless applications with .NET 11 or update your existing isolated worker apps to target the new release.</p>\n<p>This release also introduces a required project SDK for .NET 11 function apps: <a class=\"lia-external-url\" href=\"https://www.nuget.org/packages/Azure.Functions.Sdk\" rel=\"noopener\" target=\"_blank\">Azure.Functions.Sdk</a>. Updated Azure Functions tooling templates use the new SDK, giving new projects a simpler project file while preserving the isolated worker programming model.</p>\n<p>.NET 11 support in Azure Functions is currently available for C# apps. F# support is temporarily unavailable.</p>\n<h1>A simpler project SDK</h1>\n<p><strong>Azure.Functions.Sdk</strong> brings the Functions build integration into the project's SDK declaration. Instead of using <em>Microsoft.NET.Sdk</em> as the project SDK and adding<em> Microsoft.Azure.Functions.Worker.Sdk </em>as a package reference, use <em>Azure.Functions.Sdk</em> in the opening Project element and target net11.0.</p>\n<p>Keep an explicit package reference to <em>Microsoft.Azure.Functions.Worker</em>, which provides the worker runtime, along with the trigger and binding extensions your application uses. Azure.Functions.Sdk replaces the build SDK package; it does not replace the worker runtime package.</p>\n<p>The new SDK supplies the underlying .NET worker SDK, defaults AzureFunctionsVersion to v4, and includes the analyzers and source generators that prepare your functions for deployment. It also integrates with Azure Functions tooling so that dotnet run starts the Functions host when Azure Functions Core Tools is installed.</p>\n<p>Using a custom container? .NET 11 Functions base images are published as chiseled images. Use &nbsp;<strong>mcr.microsoft.com/azure-functions/dotnet-isolated:4-dotnet-isolated11.0-chiseled </strong>; the <em>4-dotnet-isolated11.0</em> and <em>4-dotnet-isolated11.0-appservice</em> tags aren’t published. Chiseled images don’t include a shell or SSH server. See <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/container-concepts#maintaining-custom-containers\" target=\"_blank\">Maintaining custom containers</a>.</p>\n<h1>Get started with .NET 11</h1>\n<ol>\n<li>Install the .NET 11 SDK and update your Azure Functions development tools and templates. Use your preferred <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/functions-develop-local\" rel=\"noopener\" target=\"_blank\">local development experience</a> to create a .NET 11 isolated worker project.</li>\n</ol>\n<p>With the updated Azure Functions Core Tools, run:</p>\nfunc init --worker-runtime dotnet-isolated --target-framework net11.0\n<p>For .NET 11, use&nbsp;<em>Azure.Functions.Sdk</em> version 1.0.1 or later. We also recommend&nbsp;<em>Microsoft.Azure.Functions.Worker</em> version 2.50.0 or later. The versions in the project example below reflect the current template and may differ from these minimum and recommended versions. The generated project file looks like this:</p>\n&lt;Project Sdk=\"Azure.Functions.Sdk/1.0.1\"&gt;\n  &lt;PropertyGroup&gt;\n    &lt;TargetFramework&gt;net11.0&lt;/TargetFramework&gt;\n    &lt;ImplicitUsings&gt;enable&lt;/ImplicitUsings&gt;\n    &lt;Nullable&gt;enable&lt;/Nullable&gt;\n  &lt;/PropertyGroup&gt;\n  &lt;ItemGroup&gt;\n    &lt;PackageReference Include=\"Microsoft.Azure.Functions.Worker\"\n      Version=\"2.52.0\" /&gt;\n    &lt;PackageReference\n      Include=\"Microsoft.Azure.Functions.Worker.OpenTelemetry\"\n      Version=\"1.2.0\" /&gt;\n    &lt;PackageReference Include=\"OpenTelemetry.Extensions.Hosting\"\n      Version=\"1.15.3\" /&gt;\n    &lt;PackageReference Include=\"Azure.Monitor.OpenTelemetry.Exporter\"\n      Version=\"1.7.0\" /&gt;\n    &lt;PackageReference\n      Include=\"Microsoft.Azure.Functions.Worker.Extensions.Http.AspNetCore\"\n      Version=\"2.1.1\" /&gt;\n  &lt;/ItemGroup&gt;\n&lt;/Project&gt;\n<p>These package versions reflect the current template example, not minimum requirements for every app. The template includes OpenTelemetry and ASP.NET Core HTTP integration packages; retain or adjust your app's dependencies to match the features and telemetry configuration you use.</p>\n<ol start=\"2\">\n<li>Check that the generated project uses Azure.Functions.Sdk and targets net11.0. Keep the template's Microsoft.Azure.Functions.Worker reference and add the binding extension packages your functions need.</li>\n<li>Build and run locally, then deploy to a function app configured for the .NET 11 isolated worker stack. Follow the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/dotnet-isolated-process-guide#deploy-to-azure-functions\" rel=\"noopener\" target=\"_blank\">deployment guidance</a> and check the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/dotnet-isolated-process-guide#supported-versions\" rel=\"noopener\" target=\"_blank\">supported versions</a> for hosting restrictions.</li>\n</ol>\n<p>.NET 11 is supported only in the isolated worker model, not the in-process model. Support for the in-process model ended on November 10, 2026. If your app still uses this model, follow the migration guide to move to isolated worker before adopting .NET 11.</p>\n<p>Linux Consumption does not support .NET 10 or later; if you're moving an app from Linux Consumption, review the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/migration/migrate-plan-consumption-to-flex\" rel=\"noopener\" target=\"_blank\">migration guidance for Flex Consumption</a> before upgrading.</p>\n<h1>Update an existing isolated worker app</h1>\n<p>For an app that already uses the isolated worker model, start by updating its dependencies and checking compatibility with .NET 11. Then update the project SDK and target framework, remove the Microsoft.Azure.Functions.Worker.Sdk package reference, and retain an explicit Microsoft.Azure.Functions.Worker reference.</p>\n<p>You can remove OutputType and AzureFunctionsVersion because the new SDK sets them automatically. Remove FunctionsEnableWorkerIndexing if present; worker indexing is always enabled with the new SDK.</p>\n<p>The build SDK migration itself doesn't require changes to Program.cs, function classes, or host.json when you're using a current worker package. Retargeting to .NET 11 is a separate framework upgrade: review dependency compatibility and test your application's triggers, bindings, and deployment before updating production. The <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/dotnet-isolated-process-guide#migrate-to-azurefunctionssdk\" rel=\"noopener\" target=\"_blank\">isolated worker guide</a> walks through the project SDK changes.</p>\n<p>If your app still uses the in-process model, follow the&nbsp;<a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/azure-functions/migrate-dotnet-to-isolated-model\" rel=\"noopener\" target=\"_blank\">migration guide</a> to move to isolated worker before adopting .NET 11. The isolated worker model gives you control over application startup, standard .NET dependency injection, and separation between your application's dependencies and the Functions host.</p>\n<h1>Keep building with us</h1>\n<p>Thank you to everyone who has shared feedback and helped improve .NET on Azure Functions. Explore the <a class=\"lia-external-url\" href=\"https://github.com/Azure/azure-functions-dotnet-worker/tree/main/samples\" rel=\"noopener\" target=\"_blank\">Azure Functions .NET worker samples</a> as you plan your next application, and share questions or feedback in <a class=\"lia-external-url\" href=\"https://github.com/Azure/azure-functions-dotnet-worker/discussions\" rel=\"noopener\" target=\"_blank\">GitHub discussions</a>. If you encounter a problem, <a class=\"lia-external-url\" href=\"https://github.com/Azure/azure-functions-dotnet-worker/issues\" rel=\"noopener\" target=\"_blank\">open an issue</a> so we can investigate.</p>"
  "08158f617a6ff5dda875bf8b83507d7f":
    "id": "08158f617a6ff5dda875bf8b83507d7f"
    "title": "Run on your schedule: App Service plan start/stop now in public preview"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/run-on-your-schedule-app-service-plan-start-stop-now-in-public/ba-p/4566184"
    "published": "2026-11-11 03:32:36"
    "fetched": "2026-11-11 06:30:20"
    "summary": "<h2>Start and stop your apps together</h2>\n<p>Managing an environment with multiple apps shouldn't mean stopping and starting each app individually. App Service plan start/stop brings that control to the plan level, letting you manage the apps and deployment slots it hosts together.</p>\n<p>Today, we're announcing the public preview for this feature for <strong>Premium v4 (Pv4) and Premium memory-optimized v4 (Pmv4) plans</strong>. Stop the plan to take its workloads offline, then start it again when you're ready, without issuing separate commands for each app.</p>\n<blockquote>\n<p><strong>NOTE: </strong></p>\n<p>Start and stop operations are asynchronous: the apps on your plan don’t all stop or become ready to serve requests immediately. After you stop a plan, app shutdown and cleanup can continue over the next few minutes. When you start it again, allow time for your applications to become ready before sending traffic.</p>\n</blockquote>\n<p>This is particularly useful for development, test, and demo environments that share an operating schedule. Because the operation affects the entire plan, make sure every hosted workload can tolerate the interruption. To bring workloads on a stopped plan back online, start the plan rather than an individual app.</p>\n<h2>Get started with Azure CLI</h2>\n<p>You can call the start and stop REST operations using <code>az rest</code>. Sign in to Azure, select the subscription containing your plan, and set its resource group and name:</p>\nresourceGroup=\"[RESOURCE-GROUP-NAME]\"\nplanName=\"[APP-SERVICE-PLAN-NAME]\"\n\nplanId=$(az appservice plan show \\\n  --resource-group \"$resourceGroup\" \\\n  --name \"$planName\" \\\n  --query id --output tsv) || exit 1\n\n# Stop the plan. All hosted apps and deployment slots will be unavailable.\naz rest --method post --url \"https://management.azure.com${planId}/stopSites?api-version=2026-07-15\"\n<p>When you're ready to run the workloads again, start the plan:</p>\naz rest --method post --url \"https://management.azure.com${planId}/startSites?api-version=2026-07-15\"\n<p>Plan for application startup time before sending traffic back to the environment. A successful API response isn't a substitute for checking that your applications are ready to serve requests.</p>\n<h2>Get started with the Azure portal</h2>\n<p>You can also use the Azure portal to start and stop your plans. On the App Service plan Overview page, select start and stop as you may have done for your individual apps. If you try to start an app when its App Service plan is stopped, you will get an error letting you know to start the App Service plan instead.</p>\n<blockquote>\n<p><strong>NOTE:</strong></p>\n<p>This feature is rolling out in the portal over the next few weeks. If you don't see the option in the portal yet, check back in a couple days and use the Azure CLI in the meantime.</p>\n</blockquote>\n<img />\n<h2>Billing considerations</h2>\n<p>Compute billing for an eligible plan pauses when the plan is stopped, even though app shutdown and cleanup can continue over the next few minutes. Compute billing resumes when the plan is started. Charges for other resources and services can continue.</p>\n<h2>Preview limitations and considerations</h2>\n<ul>\n<li><strong>Supported tiers:</strong> Premium v4 and Premium memory-optimized v4 only. Other App Service plan tiers aren't supported.</li>\n<li><strong>Availability:</strong> [Insert confirmed preview regions, cloud availability]</li>\n<li><strong>Plan-wide impact:</strong> All apps and deployment slots on the plan are affected. Don't stop a plan that also hosts workloads that must remain available.</li>\n<li><strong>Restart at the plan level:</strong> Attempting to start an individual app will not restart the plan. You must restart the plan to restart the apps.</li>\n<li><strong>Automatic scaling:</strong> Plans with App Service automatic scaling enabled aren't supported. This is distinct from Azure Monitor autoscale.</li>\n<li><strong>Scaling in progress:</strong> Wait for an in-progress asynchronous scale operation to finish before starting or stopping the plan.</li>\n<li>\n<p><strong>Start/stop throttling:</strong> Plan start and stop operations are subject to a five-minute throttle. Account for this when scheduling operations or testing repeated start/stop cycles.</p>\n</li>\n<li><strong>Changes while stopped:</strong> Start the plan before scaling it or making other plan updates.</li>\n</ul>\n<h2>Try the preview</h2>\n<p>Try start/stop on a development or test plan whose apps share an operating schedule. Review the apps and deployment slots it hosts, then use the plan-level commands to stop and start those workloads together instead of managing each app individually.</p>\n<p>For the API details, see <a href=\"https://learn.microsoft.com/en-us/rest/api/appservice/app-service-plans/stop-web-apps?view=rest-appservice-2026-07-15\" rel=\"noopener\" target=\"_blank\">Stop Web Apps</a> and <a href=\"https://learn.microsoft.com/en-us/rest/api/appservice/app-service-plans/start-web-apps?view=rest-appservice-2026-07-15\" rel=\"noopener\" target=\"_blank\">Start Web Apps</a>.</p>"
  "680bce0a7d0856e8a856c862bc0c8ea0":
    "id": "680bce0a7d0856e8a856c862bc0c8ea0"
    "title": "Introducing Azure Monitor dashboards with Grafana MCP: Telemetry for AI Agents, Signed In as You"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/introducing-azure-monitor-dashboards-with-grafana-mcp-telemetry/ba-p/4572228"
    "published": "2026-11-11 07:21:47"
    "fetched": "2026-11-12 08:10:21"
    "summary": "<p>We're introducing the <a href=\"https://learn.microsoft.com/azure/azure-monitor/visualize/visualize-use-grafana-dashboards\" rel=\"noopener\" target=\"_blank\">Azure Monitor dashboards with Grafana</a> remote MCP server, a global Model Context Protocol (MCP) endpoint at <code>https://mcp.dashboard.azure.com</code>. It lets AI agents such as GitHub Copilot query Azure Monitor metrics and logs, Azure Resource Graph, Prometheus in Azure Monitor workspaces, Azure Data Explorer and Azure Monitor health models, and find, read and update your dashboards. It needs no Azure Managed Grafana resource, no MCP server to deploy and no Grafana data source. Each tool call runs as the signed-in Microsoft Entra ID user, so what your agent can reach follows your own Azure access.</p>\n<h2>Set it up in one click</h2>\n<p><strong>Install in Visual Studio Code: <a href=\"https://aka.ms/join-dashboard-mcp\" rel=\"noopener\" target=\"_blank\">https://aka.ms/join-dashboard-mcp</a></strong></p>\n<p>The link opens Visual Studio Code and adds the server, <code>https://mcp.dashboard.azure.com</code>, to its MCP configuration. Confirm the installation, start the server, and sign in with your Microsoft Entra ID account when prompted, in the tenant that holds your Azure resources. Then open GitHub Copilot Chat in Agent mode and turn on the server's tools.</p>\n<p>The link holds only the server's name and URL, no credentials, and it doesn't create any Azure resource. For GitHub Copilot CLI and other MCP clients, see \"Connect\" below.</p>\n<h2>One prompt, one Kusto cluster</h2>\n<p>I copied the StormEvents sample from the public Azure Data Explorer help cluster (59,066 US storm events from 2007, plus the state population table that comes with it) into a new cluster in one of my dev subscriptions. Then I opened GitHub Copilot Chat in Visual Studio Code, in Agent mode, with one MCP server connected, and typed one prompt:</p>\n<blockquote>\n<p>use Azure Resource Graph to find the kusto clusters in my subscription <code>&lt;subscription-name&gt;</code>, see what data is in the running one, then tell me which states had the most storm damage per person and what drove the top one</p>\n</blockquote>\n<p>I didn't give it the cluster's URL, the database name, a table or a column, and I had never added the cluster to a Grafana instance. Copilot reported \"Completed 20 steps in 1m 25s\" and came back with this:</p>\n<img />\n<p>North Dakota comes first, at $447.05 per person. California had by far the most damage in total, $2.8 billion, and is seventh. Copilot also raised a caveat I hadn't asked for: the population table has no year field, so the per-person figures aren't a verified 2007 comparison. Then it explained the top of the list, partly from the events' own narratives:</p>\n<img />\n<p>That one MCP server is the new Azure Monitor dashboards with Grafana remote MCP server. Connecting it took a one-click install link and a sign-in. I hadn't created a Grafana instance or configured a data source.</p>\n<h2>What it is</h2>\n<p>The endpoint is the same for everyone:</p>\n<p><code>https://mcp.dashboard.azure.com</code></p>\n<p>For most MCP clients, that URL is the whole configuration: it names no Grafana instance, subscription or resource group. You sign in with your Microsoft Entra ID account, and each call runs in the tenant you signed in to. Your Azure role assignments decide which subscriptions, resources and data a call can see. Signing in to the MCP server doesn't grant any access of its own.</p>\n<p>It has 21 tools in five groups:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>Group</th><th>Tools</th><th>What they reach</th></tr></thead><tbody><tr><td>Azure monitoring</td><td>10</td><td>Log Analytics and Application Insights logs (KQL), Azure Monitor metrics and their definitions, distributed traces, Azure Resource Graph, subscriptions, the activity log, Resource Health and service health events</td></tr><tr><td>Dashboards</td><td>3</td><td>Your saved Azure Monitor dashboards and the built-in ones: search, inspect, update</td></tr><tr><td>Prometheus</td><td>4</td><td>Azure Monitor workspaces: discover them, list metric and label names, run PromQL</td></tr><tr><td>Azure Data Explorer</td><td>2</td><td>Azure Data Explorer clusters your account can query: list clusters, databases and schemas, run KQL</td></tr><tr><td>Health models</td><td>2</td><td>Azure Monitor health models: the entity graph and its states, now or at a past time, and their history</td></tr></tbody></table></div>\n<p>Twenty of the 21 only read. The one that writes, <code>amgmcp_dashboard_update</code>, changes a saved dashboard you already have write access to. It can validate a change without saving it, and when the agent passes the version it read, the tool refuses to save over an edit made since then.</p>\n<h2>What the agent did</h2>\n<p>Of the 20 steps, 12 were calls to the server, all to <code>azmon-mcp</code>, the name the one-click link gives it:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>Calls</th><th>Tool</th><th>What they did</th></tr></thead><tbody><tr><td>2</td><td><code>amgmcp_query_resource_graph</code></td><td>Looked up the subscription's ID by its name, then listed the Kusto clusters in it</td></tr><tr><td>2</td><td><code>amgmcp_kusto_get_metadata</code></td><td>Listed the cluster's databases, then read the schema of <code>Samples</code></td></tr><tr><td>8</td><td><code>amgmcp_kusto_query</code></td><td>Profiled both tables, checked the join and duplicate events, ranked the states, then broke North Dakota down by event type, by episode and by its costliest events</td></tr></tbody></table></div>\n<p>The second Resource Graph query found the cluster:</p>\nresources\n| where subscriptionId == '&lt;subscription-id&gt;'\n| where type =~ 'microsoft.kusto/clusters'\n| project name, resourceGroup, location, state = tostring(properties.state),\n    provisioningState = tostring(properties.provisioningState),\n    uri = tostring(properties.uri), sku, id\n| order by name asc{\n  \"name\": \"mcpdemo2611\",\n  \"location\": \"westus2\",\n  \"state\": \"Running\",\n  \"uri\": \"https://mcpdemo2611.westus2.kusto.windows.net\",\n  \"sku\": { \"name\": \"Dev(No SLA)_Standard_E2a_v4\", \"tier\": \"Basic\", \"capacity\": 1 }\n}\n<p>Two fields matter here. <code>uri</code> is the <code>clusterUrl</code> that both Kusto tools take, so Resource Graph hands the agent the next call's argument. <code>state</code> tells it whether the cluster can answer at all, which is what \"the running one\" in my prompt asked for.</p>\n<p>The first <code>amgmcp_kusto_get_metadata</code> call, with just that URL, listed one database, <code>Samples</code>. The second, with the database name, returned its schema: <code>StormEvents</code> with 22 columns (<code>StartTime</code>, <code>State</code>, <code>EventType</code>, <code>DamageProperty</code>, <code>DamageCrops</code> and so on) and <code>PopulationData</code> with two, <code>State</code> and <code>Population</code>. The tool description tells the agent to copy names exactly as returned, because Kusto names are case-sensitive.</p>\n<p>Before ranking anything, Copilot checked the data: row counts, date range and missing values, whether every state finds a population, and whether any event is counted twice. It sent those queries two or three at a time, and each came back in about a second or less. This is the ranking:</p>\nStormEvents\n| summarize Events = count(), PropertyDamage = sum(tolong(DamageProperty)),\n    CropDamage = sum(tolong(DamageCrops)) by State\n| join kind=inner (PopulationData) on State\n| where State !in ('DISTRICT OF COLUMBIA', 'PUERTO RICO')\n| extend TotalDamage = PropertyDamage + CropDamage\n| extend DamagePerPerson = todouble(TotalDamage) / todouble(Population)\n| project State, Events, Population, PropertyDamage, CropDamage, TotalDamage, DamagePerPerson\n| top 10 by DamagePerPerson desc\n<p>Nothing in my prompt says \"join\" or \"leave out DC and Puerto Rico\". The schema has a <code>State</code> column in both tables, \"per person\" needs the second one, and \"states\" rules out the two rows that aren't. The result comes back as a data frame with metadata alongside it:</p>\n{\n  \"executedQuery\": \"StormEvents | summarize … | top 10 by DamagePerPerson desc\\n| take 11\",\n  \"rowCount\": 10,\n  \"totalRowCount\": 10,\n  \"truncated\": false,\n  \"durationMs\": 37\n}\n<p>The agent asked for at most 10 rows, so the tool appended <code>| take 11</code>: one row past the cap is how it proves whether the result was cut off, and it reports that as <code>truncated</code>. The agent knows whether it has seen everything before it summarizes.</p>\n<p>One of the 20 steps wasn't an MCP call. The query for the eight costliest events in North Dakota returned their full narratives, 21.4 KB of text, more than Copilot reads in one go. It saved the result to a temporary file and asked to run a PowerShell command to parse it, and I allowed it.</p>\n<p>Every one of those calls ran as me, with my own Microsoft Entra ID token, and none of them needed a data source that I had configured. The second half of that sentence is the real change.</p>\n<h2>No data source, no default cluster</h2>\n<p>On the per-instance <a href=\"https://learn.microsoft.com/azure/managed-grafana/grafana-mcp-server\" rel=\"noopener\" target=\"_blank\">Azure Managed Grafana MCP endpoint</a>, an agent reaches a Kusto cluster through a Grafana data source: someone adds the cluster to the instance, chooses the credentials it connects with, and from then on queries go through that data source. That is the right shape for a team that shares one instance. It is the wrong shape for \"I have a cluster and a question.\"</p>\n<p>The global endpoint has no data sources to configure. Each Kusto call names its cluster in <code>clusterUrl</code> and runs with your token, so the cluster checks your own database permissions, as it would in the Azure Data Explorer web UI. A database you can't query there, the agent can't query here either.</p>\n<p>That also means there is no default cluster, so discovery has to come from somewhere. It comes from Azure. Resource Graph lists the clusters in your subscriptions, with their state and URI, and <code>amgmcp_kusto_get_metadata</code> called with no arguments lists the clusters you can read in Azure. A cluster you can query but that isn't in any of your subscriptions, such as the public <code>https://help.kusto.windows.net</code>, works too: pass its URL.</p>\n<p>The same pattern runs through the other groups. The Azure Monitor tools take a resource ID or a subscription, not a data source. Each Azure Monitor workspace is its own Prometheus source, found with <code>amgmcp_prometheus_list_workspaces</code>. Health models are found with Resource Graph and read with their own two tools.</p>\n<h2>The global endpoint or an instance endpoint?</h2>\n<p>The global endpoint doesn't replace the MCP endpoint built into each Azure Managed Grafana instance. They answer different questions.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>&nbsp;</th><th>Azure Monitor dashboards with Grafana MCP</th><th>Azure Managed Grafana MCP</th></tr></thead><tbody><tr><td>Endpoint</td><td><code>https://mcp.dashboard.azure.com</code></td><td><code>https://&lt;grafana-endpoint&gt;/api/azure-mcp</code></td></tr><tr><td>What you create first</td><td>Nothing</td><td>An Azure Managed Grafana instance</td></tr><tr><td>Sign-in</td><td>Microsoft Entra ID user only</td><td>Microsoft Entra ID user, service principal or managed identity, or a Grafana service account token</td></tr><tr><td>Whose access a query uses</td><td>The signed-in user's</td><td>The identity each Grafana data source is configured with</td></tr><tr><td>Data</td><td>Azure Monitor, Resource Graph, Prometheus in Azure Monitor workspaces, Azure Data Explorer clusters you can query, health models</td><td>The instance's data sources: Azure Monitor, Prometheus, Azure Data Explorer, Loki, SQL databases and ClickHouse</td></tr><tr><td>Dashboards</td><td>Find and read saved and built-in Azure Monitor dashboards; update saved ones</td><td>Find, read, create and update the instance's dashboards</td></tr><tr><td>Alerts</td><td>Not included</td><td>Grafana-managed alert rules</td></tr><tr><td>A good fit for</td><td>You, in your editor or terminal</td><td>Agents that run as a service, such as Microsoft Foundry agents and Azure SRE Agent</td></tr></tbody></table></div>\n<p>If you already run an Azure Managed Grafana instance with data sources your team curates, keep pointing your service agents at its endpoint. If you want your own agent to look at your own Azure resources right now, start with the global one.</p>\n<h2>Connect</h2>\n<p><strong>Visual Studio Code with GitHub Copilot.</strong> Use the one-click install link at the top of this post, <a href=\"https://aka.ms/join-dashboard-mcp\" rel=\"noopener\" target=\"_blank\">https://aka.ms/join-dashboard-mcp</a>, or add the server by hand in <code>.vscode/mcp.json</code>:</p>\n{\n  \"servers\": {\n    \"azure-monitor-dashboard-mcp\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.dashboard.azure.com\"\n    }\n  }\n}\n<p><strong>GitHub Copilot CLI.</strong> Start <code>copilot</code>, enter <code>/mcp add</code>, and fill in the form: server type HTTP, URL <code>https://mcp.dashboard.azure.com</code>, tools <code>*</code>. Press Ctrl+S to save and sign in when prompted. GitHub Copilot CLI keeps its own MCP configuration, so it doesn't read <code>.vscode/mcp.json</code>.</p>\n<p><strong>Other MCP clients</strong> that support the MCP authorization flow can sign in through OAuth: the server publishes its sign-in configuration at <code>https://mcp.dashboard.azure.com/.well-known/oauth-protected-resource</code>. For a client that only takes an <code>Authorization</code> header, <a href=\"https://learn.microsoft.com/azure/managed-grafana/azure-monitor-dashboards-mcp-server\" rel=\"noopener\" target=\"_blank\">the docs</a> show how to get a user access token with the Azure CLI. Treat that token as a secret, and expect to replace it when it expires.</p>\n<h2>What it doesn't do</h2>\n<ul>\n<li><strong>It accepts user sign-in only.</strong> Service principals, managed identities and Grafana service account tokens aren't supported. An agent that runs unattended, as a service, belongs on an Azure Managed Grafana instance's endpoint.</li>\n<li><strong>It can't create dashboards or change built-in ones.</strong> Create a dashboard in the Azure portal; after that, the agent can read it and update it.</li>\n<li><strong>It has no Grafana alerting, Loki, SQL or ClickHouse tools.</strong> Those live on the per-instance endpoint, which reaches whatever data sources the instance has.</li>\n</ul>\n<h2>Try it</h2>\n<p>Connect with <a href=\"https://aka.ms/join-dashboard-mcp\" rel=\"noopener\" target=\"_blank\">https://aka.ms/join-dashboard-mcp</a> or <code>/mcp add</code>, and try a few of these, with your own IDs:</p>\n<blockquote>\n<p>List the Azure subscriptions I can access.</p>\n</blockquote>\n<blockquote>\n<p>Use Azure Resource Graph to find the Kusto clusters in subscription <code>&lt;subscription-id&gt;</code>, then show me what data is in the running one.</p>\n</blockquote>\n<blockquote>\n<p>Show management-plane changes in subscription <code>&lt;subscription-id&gt;</code> over the last day.</p>\n</blockquote>\n<blockquote>\n<p>Find saved and built-in Kubernetes dashboards, then inspect the panels and queries of dashboard <code>&lt;dashboard-uid&gt;</code>.</p>\n</blockquote>\n<blockquote>\n<p>Find Azure Monitor health models in subscription <code>&lt;subscription-id&gt;</code> and explain which signals are making <code>&lt;health-model&gt;</code> unhealthy.</p>\n</blockquote>\n<p>The full tool list, the example prompts and the setup steps are in <a href=\"https://learn.microsoft.com/azure/managed-grafana/azure-monitor-dashboards-mcp-server\" rel=\"noopener\" target=\"_blank\">Connect to the Azure Monitor dashboards with Grafana remote MCP server</a>.</p>"
