"overview": |
  この日は 1 ソースから 16 本で、Microsoft Foundry と Foundry IQ 関連の更新が大半でした (Microsoft IQ の発表ブログに合わせたものです)。エージェントの安全性では、分類器・決定的なルール・LLM を使ったジャッジといった実行時の安全制御を設定する Guardrails の新しい体験がパブリックプレビューとなり、管理者のポリシーがプロジェクトに制御を求めている場合はその要件を画面上に示します。評価まわりでは、エージェントのトレースに評価者が点数・タグ・コメント・期待する出力を付けられる人手によるアノテーションがパブリックプレビュー、トレースを分析して繰り返し起きているパターンを見つけ関連する問題をまとめる agent insights が一般提供となり、見つけた問題は agent optimizer で修正案を試せます。Foundry IQ では、複雑な質問を絞り込んだ検索に分解し、結果を見て必要なら決められた予算の範囲で検索をやり直す反復検索モデル IQ Retriever Zero がパブリックプレビューとなり、ストレージアカウントやスケジュールされたインデクサーを用意せずにファイルを直接アップロードして索引させる Files ナレッジソースが一般提供になりました。model router は 4 件の更新があり、Responses API プロトコルのサポートがリソースとプロジェクトの両方のエンドポイントで一般提供、デプロイせずに model に auto を指定して呼び出すこと (既定は Balanced ルーティング)、Anthropic のリクエストとレスポンスの形式を保ったまま自動選択を使える Messages API への対応、既存のモデルデプロイでルーティングされたリクエストを処理することがいずれもパブリックプレビューです。AI Gateway でも model router を使って、モデルエイリアスの背後にあるモデルをリクエストごとにランク付けし、エイリアスの優先度と重みと組み合わせてバックエンドを選べるようになりました。音声では Azure Speech の HD V3 ボイスにスタイルと指示による制御がパブリックプレビューで加わり、音声エージェントやナレーションでの話し方を調整できます。Foundry Toolkit for Visual Studio Code は、Azure Container Registry 以外も含む顧客管理のコンテナーレジストリのビルド済みイメージからホスト型エージェントをデプロイできるようになりました (一般提供)。ネットワークでは Azure Firewall のネットワークルールでワイルドカードドメイン (*.contoso.com のような指定) が一般提供となり、Azure Front Door の WAF ではWAF ポリシーの中にログとメトリクスを対話的なダッシュボードとしてまとめる WAF Insights が一般提供となって、ブロックされたリクエストを追いやすくなりました。データベースでは Azure Database for PostgreSQL の強化版 Burstable 階層 (Basv2) がパブリックプレビューとなり、性能の予測しやすさとバースト利用の効率を上げてコストと性能のバランスを改善します。あわせて、Azure AI Content Safety の一部のプレビュー機能 (Analyze Multimodal、テキストと画像を含む Custom categories (rapid)、Text / Image / Prompt Shields の接続コンテナー、Text / Image の切断コンテナーなど) が 2027 年 4 月 30 日に廃止されることが告知されました。
