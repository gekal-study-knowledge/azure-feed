    "title": "Evidence before autonomy: Designing multi-agent battery passports on Azure"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/evidence-before-autonomy-designing-multi-agent-battery-passports/ba-p/4575061"
    "published": "2026-11-24 02:37:56"
    "fetched": "2026-11-25 01:35:31"
    "summary": "<p><strong>Author:</strong> Dominik Zemp, Microsoft Switzerland, Enterprise Cloud Solution Architect</p>\n<p><em>About this article.</em> This article is written from the author's perspective as an Enterprise Cloud Solution Architect contributing to the wider Microsoft community, and the views expressed are the author's own. It is not official Microsoft documentation, product guidance or a product announcement. For official guidance, see <a href=\"https://learn.microsoft.com/\" rel=\"noopener\" target=\"_blank\">Microsoft Learn</a> and the <a href=\"https://learn.microsoft.com/en-us/azure/architecture/\" rel=\"noopener\" target=\"_blank\">Azure Architecture Center</a>. The scenario is fictional and uses synthetic data only. The article proposes a design; it does not describe a customer engagement, a production deployment or measured results. The article provides general information, not legal, regulatory, security or other professional advice.</p>\n<p>The public GitHub repository [<a class=\"lia-external-url\" href=\"https://github.com/dzemp/multi-agent-digital-battery-passport\" rel=\"noopener\" target=\"_blank\">dzemp/multi-agent-digital-battery-passport</a>] contains the companion prototype for this article, including the passport application and its AI agents, the Bicep templates and the command-line tool that deploy the Azure infrastructure, and documentation such as the architecture, scenario walkthrough and threat model.</p>\n<img />\n<h2>Executive summary</h2>\n<p>From February 18, 2027, a digital passport becomes a market-access requirement for in-scope batteries first placed on the EU market or first put into service there [1]. For manufacturers, this is not simply a documentation deadline. Missing mandatory data can block a release on day one. As due-diligence and forced-labor obligations phase in during 2027, disputed sourcing evidence can block a release too, while outdated approvals can allow unsupported claims to reach customers. The challenge is to keep evidence current and make accountable decisions when the facts change.</p>\n<p>This article proposes an Azure reference architecture that connects supplier evidence, production records and review decisions to individual batteries. Microsoft Fabric prepares supplier and production data for analysis and reporting. Microsoft Foundry agents help interpret documents and prepare reviews. Accountable people resolve adverse findings and approve methods and policies. The passport application, not the AI, enforces publication controls and records decisions and passport versions in Azure SQL Database.</p>\n<p>The central design principle is to bind every decision to the evidence it judged. The article follows a conflict between a supplier certificate and a transport record. Two batteries use material from the affected lot and need review; a third uses a different lot and can proceed if its own checks pass. When the evidence changes, the earlier review can no longer authorize publication, and the affected decision must be made again.</p>\n<p>The immediate aim is dependable passport operations that support EU market access. This is a proposed design, not measured performance: its value must be demonstrated through reliable controls, reduced investigation effort and sustainable total operating cost.</p>\n<h2>1. Why battery passport evidence becomes a business issue</h2>\n<h3>The business problem behind the regulation</h3>\n<p>The EU battery passport makes battery data a condition of market access. From February 18, 2027, every in-scope battery needs a passport when it is first placed on the EU market or put into service there [1]. Batteries for electric vehicles and for light means of transport such as e-bikes are in scope, as are industrial batteries over 2 kWh. The passport is an electronic record linked to the battery by a unique identifier and a QR code, and access rights determine what each reader sees.</p>\n<p>The rules take effect in phases, and the design must cover all of them:</p>\n<ul>\n<li><strong>Since July 20, 2026:</strong> The EU registry for digital product passports is live, and battery passports are registered there [3], [32].</li>\n<li><strong>February 18, 2027:</strong> The battery passport becomes mandatory. Carbon footprint, recycled content and due-diligence information are not yet required in the passport on this date [32].</li>\n<li><strong>August 18, 2027:</strong> Battery due-diligence obligations apply [2].</li>\n<li><strong>December 14, 2027:</strong> The Forced Labor Regulation prohibits products made with forced labor from being placed or made available on the EU market [35].</li>\n</ul>\n<p>One company is accountable for each passport: the responsible economic operator. It must keep the passport accurate, complete and up to date, and it can delegate the work, but not the accountability [1], [32]. In this article, that is the battery manufacturer; Appendix C describes when an importer or a vehicle manufacturer holds the role instead [32].</p>\n<p>Passports also have to work across company boundaries. They must align with the EU's common Digital Product Passport (DPP) system and follow the data models in the Commission's semantic repository [3, Arts. 11 and 12]. European standards for identifiers, data carriers, APIs and data exchange support that alignment [36].</p>\n<p>Behind these rules lies the business problem that this article addresses: keeping evidence, battery genealogy and decisions aligned as facts change. Battery genealogy is the record of which material lots went into which battery. The regulation does not require AI or blockchain. The value lies in handling change in a controlled way and keeping a traceable account of each decision.</p>\n<h3>One supplier conflict, three batteries</h3>\n<p>Consider a manufacturer preparing three batteries for release. Batteries 1 and 2 contain material from supplier lot A; battery 3 uses lot B. The certificate for lot A has a valid digital signature, but its origin claim conflicts with the transport records. For this illustrative example, the manufacturer's sourcing policy requires a review before affected batteries can be released. In February 2027, this check is a company control rather than a passport field.</p>\n<p>The team needs to establish which batteries contain material from lot A, whether the conflict has a reasonable explanation and who is accountable for accepting that explanation.</p>\n<p>Success is not simply publishing three passports. It is identifying the two affected batteries, avoiding an unnecessary hold on the third and ensuring that an earlier review cannot approve evidence that has since changed.</p>\n<h3>Value beyond the first passport</h3>\n<p>Figure 1 shows how solving the lot A problem reaches beyond one release decision.</p>\n<img />\n<p><em>Figure 1. The same evidence foundation supports passport obligations and potential customer value.</em></p>\n<p>&nbsp;</p>\n<p><strong>Horizon 1</strong> is the business case this architecture is designed for: a correct passport for every battery in scope, without releasing batteries with unresolved issues or holding batteries that are unaffected.</p>\n<p><strong>Horizon 2</strong> is a credible extension: the same traceability could show vehicle manufacturers, often called original equipment manufacturers (OEMs), the carbon methods, sourcing evidence and review status behind a claim. Customer acceptance and commercial benefit remain unproven. <strong>Horizon 3</strong> is exploratory and outside the scope of this design: lifecycle history might later help qualified partners assess batteries for second-life uses such as stationary storage.</p>\n<h3>What the leadership team needs to see</h3>\n<p>The Chief Sustainability Officer (CSO) needs to distinguish well-supported claims from claims that are incomplete, disputed or awaiting assurance. A single green compliance indicator would hide too much.</p>\n<p>The Chief Technology Officer (CTO) needs that information to stay consistent across source systems, the passport application and reporting. That requires clear record ownership and controlled interfaces. Azure SQL holds current state and ledger history, Fabric prepares connected data for investigation and reporting, and Foundry supports bounded interpretation of documents. Other technologies could meet the same requirements; what matters is that the application remains the authority.</p>\n<p>For the Chief Financial Officer (CFO), the case depends on the time needed to identify affected products, the duration of avoidable holds and the total cost of resolving an exception, including human review and correction of agent output. No savings or return are established here; section 5 outlines a cost model for testing the case.</p>\n<h2>2. Where AI agents help and where people decide</h2>\n<p>AI agents help prepare decisions. Qualified people remain responsible for safety, legal interpretation and decisions on adverse findings. The passport application enforces approved rules and required human approvals. Routine work can proceed automatically when those rules permit it, but no agent can bypass them.</p>\n<h3>Helping people work through mixed evidence</h3>\n<p>Supplier evidence includes certificates, audit reports, transport documents and correspondence in different formats and languages. A data pipeline can move these files and check their structure, but it cannot always explain why two statements disagree. For lot A, an agent can identify the conflicting passages and explain which batteries may be affected. The reviewer receives a focused case rather than a folder of documents and still owns the decision.</p>\n<p>Not everything needs AI. The application performs the tasks that require a repeatable result: it verifies signatures, validates data types, calculates approved formulas and enforces access rules.</p>\n<h3>Five roles, described by what each may do</h3>\n<p>The architecture divides the work into five roles. Each role is described by what it is permitted to do, not by an autonomy score. Even the most automated role cannot override a failed check or a required human approval.</p>\n<ul>\n<li><strong>Regulatory watch: advisory.</strong> The agent summarizes relevant legal changes and identifies potentially affected rules or records. Legal and compliance owners decide what those changes mean and whether a production policy should change.</li>\n<li><strong>Supplier due diligence: bounded action with mandatory escalation.</strong> The agent gathers evidence, compares claims and prepares a cited review. It can request that the application place affected batteries on hold under an approved policy, but it cannot clear an adverse finding on its own. The same reviews later support the due-diligence report behind the passport's responsible-sourcing information [1, Annex XIII], [2], forced-labor inquiries and, where applicable, the Corporate Sustainability Due Diligence Directive [37].</li>\n<li><strong>Carbon footprint: automated workflow within a pinned method and verifier check.</strong> The agent prepares per-batch calculation inputs and calls a deterministic calculator with pinned versions of the approved method and emission factors. A run completes only when an independent check reproduces the result exactly and every input traces to approved evidence. Missing inputs stop the run, and gaps stay visible rather than being filled with plausible model-generated values. The method owner remains accountable for the calculation approach.</li>\n<li><strong>Passport issuance: automated workflow within deterministic publication gates.</strong> The agent assesses whether a candidate passport appears ready, requests publication and explains any gaps that block it. The application, not the agent, determines publication eligibility and commits the version. It does not write field values or access groups: a deterministic passport builder in the application maps the source records and applies the legal access groups and the rules for each battery category [1], [31]. No model-generated text appears in published passport fields. If every check passes, publication needs no separate manual step, but the agent has no write access to the passport database.</li>\n<li><strong>Lifecycle update: automated workflow within validation and duplicate checks.</strong> The agent interprets authorized submissions from OEMs, repairers and recyclers and requests the corresponding updates. The application validates each event, checks whether it has already been processed and preserves the version history. Partner systems, including partners' own agents, submit signed messages through the intake route or a data-space connector; they never call the passport agents directly.</li>\n</ul>\n<p>The passport application, not the agents, orchestrates the work. It runs Microsoft Agent Framework workflows inside the application itself [29]. Each run starts from a business event, such as changed evidence. Agents return typed proposals, and the application routes the next step by fixed rules, so agents never pass control to one another. Microsoft's orchestration guidance advises against agent-to-agent handoff when routing is deterministic and rule-based [30]; here, such a handoff could also bypass a required check or reviewer. Business state stays in Azure SQL Database, the system of record; Appendix C describes how runs start and resume [38].</p>\n<h3>Bind decisions to evidence</h3>\n<p>The certificate for lot A can pass every technical check while the sourcing concern remains unresolved. A design that stores a single \"approved\" flag would merge those outcomes and keep the flag after the facts change. This architecture therefore records three outcomes separately:</p>\n<ol>\n<li><strong>Evidence validity.</strong> A verifier checks the signature, issuer, expiry and revocation status against the organization's trust policy. Cryptographic validity does not establish that the supplier's origin claim is true.</li>\n<li><strong>Human judgment.</strong> An accountable reviewer investigates the conflict and records a disposition: the decision, the reasons for it and the information considered. The disposition names a specific decision context, which the application calculates from the evidence versions, material relationships and the applicable method and policy versions.</li>\n<li><strong>Publication eligibility.</strong> Before it commits a passport version, the application checks that the disposition still names the current decision context.</li>\n</ol>\n<p>When material evidence, a relationship, a method or a policy changes, the application calculates a new decision context. The earlier disposition still records what the reviewer judged, but it belongs to the old context and cannot authorize publication under the new one. Reassessment is required. Human approval also cannot waive a mandatory technical or legal requirement. Section 3 shows this sequence for lot A, where a corrected transport record turns context 7 into context 8.</p>\n<h3>Choosing language models for each role</h3>\n<p>An agent role consists of instructions, tools, permitted data and controls; it does not need its own model. Pretrained Foundry models [14] can do this work when governed retrieval supplies current evidence and legal sources with each request. Fine-tuning cannot add evidence the manufacturer does not hold or replace retrieval and the application's controls [23]. Consider it only if a role keeps failing in the same way after its prompts, tools and retrieval improve, and expert-reviewed examples exist.</p>\n<p>Supplier due diligence and regulatory watch reconcile ambiguous sources, so both are starting candidates for a more capable reasoning model. The carbon, issuance and lifecycle roles mainly prepare structured tool requests, so a smaller model may suffice.&nbsp;</p>\n<h3>Earn autonomy through evaluation</h3>\n<p>Agent quality has to be judged against the work people actually need done. For supplier due diligence, a useful evaluation asks whether the agent identifies conflicting evidence, cites the right passages and explains the issue without inventing facts. It must include cases where no conflict exists. Otherwise, an agent that raises a hold on everything could appear reliable while creating unnecessary work.</p>\n<p>Each candidate configuration, meaning a model version together with its prompts, tools and retrieval settings, runs against the same versioned cases. These include missing, contradictory, multilingual and maliciously instructed documents. Development and test cases come from different suppliers and document families. Deterministic checks score structured fields, tool calls and the resulting application state. Microsoft Foundry's built-in evaluators can add measures such as groundedness [22], which shows only that an answer agrees with its sources, not that those sources are true. Domain experts judge sourcing and legal quality, and an AI judge used to rate explanations should first be calibrated against human-scored examples.</p>\n<p>Candidates must first meet the required safety and quality checks. Compare those that pass on task quality, reviewer effort, response time and cost per correctly completed case. A role takes on more of the work only where these cases show that it stays reliable within its control boundaries. A replacement model or configuration is adopted only after it passes the same checks.</p>\n<h2>3. Following lot A through the Azure reference architecture</h2>\n<p>The proposed architecture connects existing product and production systems to supplier evidence, agent-assisted work and a maintained passport record, without replacing the factory's systems of record or assuming one exchange technology for every supplier.</p>\n<p>Figure 2 shows the pattern in one view. Evidence flows from sources and partners into evidence preparation. Inside the authority boundary, the passport API on Azure Container Apps applies deterministic publication controls and is the only writer of passport state in Azure SQL Database.</p>\n<img />\n<p><em>Figure 2. Simplified view of the proposed architecture. In the lot A walkthrough, context N is context 7 and context N+1 is context 8. Figure B1 in Appendix B shows the full reference architecture with numbered workflow steps.&nbsp;</em></p>\n<p>&nbsp;</p>\n<p>The rest of this section follows the lot A certificate through these stages. It is an illustrative design walkthrough, not a recorded implementation result.</p>\n<h3>Receiving the evidence and finding the affected batteries</h3>\n<p>Enterprise resource planning (ERP), manufacturing execution (MES) and quality management (QMS) systems supply the records that identify products, production activity and quality evidence. Fabric pipelines or supported mirroring bring permitted data into OneLake. Access controls must be configured for this analytical copy, because mirroring Azure SQL data does not transfer the source permissions or masking rules to Fabric [4].</p>\n<p>In this design, MES owns the as-built lot-to-battery genealogy, reconciled with ERP supplier-lot identities; manufacturing data owners approve corrections. At commit, the passport API asks MES to confirm that the genealogy behind the candidate has not changed; if it has, or MES cannot confirm in time, the API refuses the commit. If the affected population is uncertain, operations must hold the potentially affected scope rather than assume that unlinked batteries are safe.</p>\n<p>Partners submit evidence through a controlled file or API route or, where both organizations participate in Catena-X [24], through an agreed data-space connector (Appendix C). The regulation mandates neither route, and neither proves that a claim is true.</p>\n<p>A deterministic verifier then checks a credential's issuer, proof, validity and status against the agreed profile. For an ordinary document, it records the authenticated sender and any signature check instead. The application records that technical result separately from authorization and the later compliance disposition. It stores the file in Blob Storage and records its reference, hash and status in SQL.</p>\n<p>In Fabric, material genealogy links lot A to batteries 1 and 2, and the transport record is matched to the same lot. Battery 3 is linked to lot B, so the concern does not automatically apply to it.</p>\n<p>The application then routes a short, lot-specific task to the supplier due-diligence agent in Microsoft Foundry Agent Service [7], [29]. Through role-scoped tools, the agent can read the pinned supplier claim and transport record; it has no database credentials or permission to browse unrelated evidence. It compares the sources, cites the passages that disagree and returns a typed result asking for review. A shipping route that differs from a claimed origin may have a legitimate explanation, so the agent reports a concern rather than accusing the supplier. The application applies its sourcing rules and places batteries 1 and 2 on hold. Because a database hold cannot stop a shipment, the application sends each hold to ERP, MES or QMS, which alone releases physical stock.</p>\n<h3>Publishing the unaffected battery</h3>\n<p>While the compliance review of lot A continues, battery 3 moves toward publication. The carbon agent prepares inputs and requests the approved calculation, the passport builder assembles the candidate passport, and the issuance agent assesses its readiness and requests publication. The scoped hold contains the sourcing risk without turning one supplier investigation into a delay for unrelated products.</p>\n<p>Publication authority belongs to the passport application on Azure Container Apps [8]. It rechecks battery 3's accepted evidence versions, genealogy assurance, dispositions and policies in the same SQL transaction as the write. That transaction does not span MES, Fabric or Blob, so later source corrections still trigger reassessment. The application then commits the passport version, an audit record and an outbox entry together in Azure SQL Database. The outbox records work to deliver to other systems; because it is saved in the same transaction, no delivery request is silently lost [9].</p>\n<p>Two separate processes follow the commit. The passport's integrity status stays pending until ledger verification completes (section 4). A relay reads the outbox entry and passes the registration to the registry adapter, retrying if necessary; receiving systems must tolerate duplicates [9]. The adapter records the registry's answer as a separate status. A committed passport is not proof of registry acceptance, and a queued registration is not permission to release a product.</p>\n<p>Registry access is a production dependency: only verified economic operators can register passports, and their verification must be renewed periodically [3, Art. 4], [32]. Appendix C summarizes these registry mechanics.</p>\n<h3>Revisiting a decision when the facts change</h3>\n<p>Back on the lot A track, a compliance reviewer investigates the conflict:</p>\n<ol>\n<li>The application calculates context 7 for batteries 1 and 2. It contains the certificate, the original transport record, the lot-to-battery links and the applicable sourcing policy.</li>\n<li>The reviewer records a disposition against context 7.</li>\n<li>Before publication, a corrected transport record arrives.</li>\n<li>The application calculates context 8. Contexts 7 and 8 are versions of the decision basis, not passport versions.</li>\n<li>When the issuance agent requests publication for batteries 1 and 2, the application sees that the recorded disposition names context 7, not context 8, and rejects the request. The earlier review cannot approve facts the reviewer did not see, even when reusing it would be faster.</li>\n<li>The reviewer examines the corrected record and, in this example, records a new disposition against context 8. Publication can proceed only after the application reruns the remaining checks.</li>\n</ol>\n<p>Had the new evidence failed to resolve the concern, the hold would remain. The workflow supports either outcome without letting an agent decide which result the business would prefer.</p>\n<p>For readers who want every exchange, Figure 3 retraces the full lot A case from supplier submission to reporting; the steps above are its critical path.</p>\n<img />\n<p><em>Figure 3. The full lot A sequence, read from top to bottom. Rows E1 to E26 are numbered separately from the workflow steps in Figure B1.</em></p>\n<h3>Maintaining the record after release</h3>\n<p>The evidence remains relevant after the batteries leave the plant. OEMs, repairers and recyclers send authorized updates through the partner intake route, and the application records them only after the checks described in section 2. Routine updates, such as a new state-of-health value, keep the same passport [32]. Much of that data reaches the battery manufacturer through the vehicle manufacturer, so the data-sharing agreement with each OEM is part of the design. Appendix C describes how the design handles ownership changes, repurposing, remanufacturing and recycling, and keeps private owners' personal data out of the passport [1, Art. 77(7)].</p>\n<h3>Giving each reader the right view</h3>\n<p>Public QR readers receive the static public view; the authenticated API serves each access group its restricted view. An OEM using the restricted API can see the carbon method, supporting sources and sourcing-review status it is entitled to see. That entitlement rests on the regulation's legitimate-interest access [1, Art. 77(9)] or on a contract between the companies, and the application records the basis of each grant. This is the practical basis for Horizon 2: the OEM can inspect the basis of a claim instead of receiving an unexplained final number. Authorities and notified bodies receive the access that the regulation provides [1].</p>\n<p>Because detailed access rights still await an implementing act [32], the roles shown in this architecture are illustrative, not a statement of legal entitlements. Legal and compliance owners translate the applicable rules into approved, versioned access policies.</p>\n<p>For reporting, the application sends a minimized copy of committed status to OneLake, and Power BI combines it with evidence-readiness and supplier views. The CSO can see that the lot A concern affected two batteries, who reviewed it, whether it remains open and which passport versions reflect the outcome. Linking that view to retained evidence and decisions is intended to reduce the effort of reconstructing a case for a customer or auditor. Access to these reports remains governed: an executive dashboard does not justify copying all restricted evidence into an analytical dataset.</p>\n<p>Report coverage as the number of in-scope batteries with a current, valid passport divided by all in-scope batteries in the release scope. Held batteries, and batteries whose passports the manufacturer maintains for an OEM, stay in the total. If only battery 3 has a valid passport, coverage is 1 of 3, not 100%. Show when the report was refreshed; if it differs from the passport application, the application is authoritative, and a dashboard never authorizes release.</p>\n<h2>4. Data and trust: Fabric, Azure SQL and the blockchain question</h2>\n<h3>Why preparation and publication remain separate</h3>\n<p>Throughout the lot A journey, Fabric prepared and reported information, but only the passport application recorded decisions and passports. That division reflects two different needs. Investigators compare supplier documents with production and logistics data; later, an auditor needs a controlled, versioned record of the evidence and decision behind a published passport.</p>\n<p>Microsoft Fabric supports the first need by bringing information together, preparing reusable datasets and supporting reporting. Azure SQL Database supports the second by holding passport state, decisions and their relationships within transactions. A dashboard can tolerate a clearly disclosed refresh delay, but a publication decision cannot rely on a reporting copy that may be out of date. The product boundary matters too: SQL database in Fabric cannot create ledger tables under the documented limitations used for this design [6]. Azure SQL Database therefore holds the operational record, and Fabric remains valuable without becoming the authority for release.</p>\n<h3>Preserving the route from source to battery</h3>\n<p>Fabric's<strong> </strong>medallion pattern organizes data preparation into layers. Bronze retains what arrived, with its source and receipt time; Silver standardizes identifiers, units and relationships so that supplier lots match batteries; and Gold prepares candidate passport packages, evidence-readiness views and carbon inventories.</p>\n<p>For lot A, this processing must preserve both the certificate and the conflicting transport information. A transformation should not silently select whichever value looks more complete. Each candidate package carries the relevant evidence references and source versions, so the information seen by the application can be reconstructed later.</p>\n<p>Shared evidence requires careful treatment in analytics. If a production batch consumed 150 kg of a lithium compound and two batteries reference that batch, the material total remains 150 kg, not 300 kg. Battery counts use distinct identities, while per-battery values follow approved allocation rules.</p>\n<h3>Making decisions and changes traceable</h3>\n<p>Azure SQL Database is the working record for battery status, evidence references, review decisions and passport versions. SQL Ledger adds tamper evidence to selected tables [10].</p>\n<p>Evidence files, such as a supplier certificate, are kept in versioned Blob Storage [13]. SQL records each file's location, version and cryptographic hash, so the application can detect a changed file and retrieve the evidence behind a decision. SQL Ledger digests are retained in protected storage that database administrators cannot rewrite, and verification compares the database history with those digests [11], [12]. Because verification is asynchronous, the application reports whether it is pending, verified or failed. Appendix C covers the storage, digest and retention details.</p>\n<p>Together, file hashes, retained versions and ledger verification can reveal certain changes to stored evidence or database history. They cannot establish that a supplier's claim is true, prove a battery's physical identity or confirm legal compliance.</p>\n<h3>Why the baseline does not use a blockchain</h3>\n<p>A battery passport does not inherently require a blockchain; the regulation does not prescribe one [1]. This proposal has one accountable operator, so Azure SQL ledger tables and protected digests support its history without a jointly governed network.</p>\n<p>A permissioned blockchain is relevant when independent organizations need shared control of a common history, but it would not resolve conflicting evidence. Consider Azure confidential ledger if the threat model in section 5 must cover collusion between database and storage administrators, or if partners need receipts they can verify independently [17]. Public hash anchoring adds privacy, cost and governance trade-offs.</p>\n<h2>5. Operating the architecture reliably</h2>\n<p>The lot A workflow must remain dependable when services fail or evidence changes. The following sections cover the qualities this workload depends on most and map them to the pillars of the Azure Well-Architected Framework (WAF) [20]. Its AI guidance makes ongoing evaluation part of operating the workload, rather than a one-time model-selection exercise [21].</p>\n<h3>Reliability: keep records available and failures visible</h3>\n<p>Passports must outlive the system, and even the company that issued them. The regulation requires open, interoperable formats without vendor lock-in, and the passport must remain available even if the operator ceases to exist or ceases its activity in the EU [1, Arts. 77(5) and 78(e)]. Published passports should therefore remain readable when AI, Fabric or partner connections fail. Static public views served through Azure Front Door depend on neither SQL nor AI, and restricted views are precomputed for each access group. Keep a tested export in the Commission's data models [3, Arts. 11 and 12] and a backup copy with an independent operator authorized in writing [1, Arts. 77(4) and 78(c)].</p>\n<p>Set separate recovery objectives for reading and publishing, because publishing can pause but reading should not. Run the restricted read API, the passport API and the workflow worker as separate container apps, so that each can fail, scale and recover on its own. Work awaiting evidence or verification must wait rather than bypass checks. Restores must reconcile SQL records, Blob evidence, protected digests and registry work, while retries must not create duplicate effects.</p>\n<h3>Security: enforce authority outside the model</h3>\n<p>Managed identities, Key Vault and private data-service connectivity support the permission boundaries. Give each agent role its own least-privilege identity, scoped retrieval and allowlisted tools, so that a misled agent can reach only its role's data and cannot approve its own finding. APIs enforce field and action entitlements before returning data or calling tools. Supplier documents may contain prompt-injection instructions [15], so model warnings are insufficient. Turn on Prompt Shields document attack detection, which is off by default, for every model deployment or agent that reads partner content [39]. Scan uploads with Microsoft Defender for Storage on-upload malware scanning before an agent or reviewer opens them [40].</p>\n<p>Public QR reads need an internet-reachable HTTPS entry point with abuse protection, such as Azure Front Door with Azure Web Application Firewall rate limiting and bot protection. Restricted partner and tool APIs require authenticated, scoped access. Choose processing regions for Fabric and models deliberately; private endpoints do not by themselves establish residency or partner entitlement. Use Microsoft Purview to classify restricted data and label the Fabric items that hold it.</p>\n<p>The companion prototype publishes a STRIDE threat model with seven trust boundaries and fifteen threats [41]. Table C1 in Appendix C summarizes the threats that shape this architecture most. It covers a prototype with synthetic data, not a production assessment; a production threat model must also address registry credentials [3, Arts. 4 and 19], partner connectors and credential issuers, isolation between OEMs and tested disaster recovery.</p>\n<h3>Cost optimization: count the whole process</h3>\n<p>Measure cloud consumption and human review together. A cheaper model may cost more overall if its output creates rework. A simple cost model separates three drivers: platform cost, which changes little with volume; per-battery cost, including public reads that must be free of charge [1, Art. 78(b)]; and per-exception cost for model tokens, reviewer time and rework. Divide the total by the number of correctly completed cases, not by the number of agent runs, and estimate each driver with the Azure pricing calculator [42]. Appendix C lists what each driver covers.</p>\n<h3>Operational excellence and performance: make changes explainable and evidence timely</h3>\n<p>Version prompts, tools, methods and policies, and re-evaluate representative cases when they change. Azure Monitor and Application Insights should trace the submission through review, publication and registry response without unnecessarily logging confidential content. Named owners handle holds and failures; people, not agents, activate policy changes. Microsoft Agent 365 can optionally add agent inventory and governance, but not publication authority [33]; see Appendix A.</p>\n<p>Legal owners must also assess applicable AI Act obligations for the intended uses, including transparency and AI literacy [34]. Human review and the authority descriptions used in this article do not establish compliance or determine a system's legal risk classification.</p>\n<p>For performance, prepare evidence in batches unless freshness requirements justify streaming. Container Apps can scale with demand [8], but database, model and partner limits still matter. For lot A, the priority is getting corrected evidence to the release process in time.</p>\n<h2>6. Conclusion: three principles to carry forward</h2>\n<p>The lot A conflict began as a disagreement between two documents. It became a business issue because it affected the release of batteries 1 and 2. The architecture keeps that connection visible: it holds the two affected batteries, lets battery 3 proceed and refuses to let an outdated review authorize changed evidence.</p>\n<p>Three principles carry beyond battery passports:</p>\n<ol>\n<li><strong>Keep authority outside the model.</strong> Agents interpret evidence and prepare actions; deterministic systems enforce release and publication.</li>\n<li><strong>Bind decisions to evidence.</strong> A decision applies only to the evidence, relationships, methods and policy against which it was made.</li>\n<li><strong>Earn autonomy through evaluation.</strong> Extend an agent's autonomy only where evaluation shows that it stays reliable within its control boundaries.</li>\n</ol>\n<p><strong>Evidence before autonomy.</strong></p>\n<h2>References</h2>\n<p>All links were last accessed on November 18, 2026. EU acts, harmonized standards, Commission guidance and Azure capabilities change, so confirm the current versions before you rely on them. Consolidated texts of EU law are documentation tools; only the texts published in the Official Journal of the European Union are authentic.</p>\n<ol>\n<li><a href=\"https://eur-lex.europa.eu/eli/reg/2023/1542/2026-08-13/eng\" rel=\"noopener\" target=\"_blank\">Regulation (EU) 2023/1542 concerning batteries and waste batteries</a>, consolidated version of August 13, 2026, particularly Articles 7, 13, 14, 47, 48, 77, 78 and 79 to 84. Also available as an <a href=\"https://publications.europa.eu/resource/cellar/d86c4599-ac88-11f1-b9e5-01aa75ed71a1.0007.02/DOC_1\" rel=\"noopener\" target=\"_blank\">EU Publications Office consolidated text</a>.</li>\n<li><a href=\"https://eur-lex.europa.eu/eli/reg/2025/1561/oj/eng\" rel=\"noopener\" target=\"_blank\">Regulation (EU) 2025/1561 amending Regulation (EU) 2023/1542 as regards obligations of economic operators concerning battery due diligence policies</a>, particularly Article 1. Also available as an <a href=\"https://publications.europa.eu/resource/cellar/fe1163e4-6cdd-11f0-bf4e-01aa75ed71a1.0006.03/DOC_1\" rel=\"noopener\" target=\"_blank\">EU Publications Office text</a>.</li>\n<li><a href=\"https://eur-lex.europa.eu/eli/reg_impl/2026/1778/oj/eng\" rel=\"noopener\" target=\"_blank\">Commission Implementing Regulation (EU) 2026/1778 laying down the implementation arrangements for the digital product passport registry set up under Regulation (EU) 2024/1781</a>, particularly Articles 4 to 12 and 19. Also available as an <a href=\"https://publications.europa.eu/resource/cellar/56aaf918-8178-11f1-bf5e-01aa75ed71a1.0006.03/DOC_1\" rel=\"noopener\" target=\"_blank\">EU Publications Office text</a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-limitations\" rel=\"noopener\" target=\"_blank\"><em>Limitations in Microsoft Fabric mirrored databases from Azure SQL Database</em></a>.</li>\n<li>Eclipse Tractus-X. <a href=\"https://github.com/eclipse-tractusx/tractusx-edc/blob/main/docs/development/decision-records/2024-10-07-azure-distribution/README.md\" rel=\"noopener\" target=\"_blank\"><em>Refactor of the Release Workflow</em></a>, Azure distribution decision record, October 7, 2024.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/fabric/database/sql/limitations\" rel=\"noopener\" target=\"_blank\"><em>Limitations in SQL database in Microsoft Fabric</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/overview?view=foundry\" rel=\"noopener\" target=\"_blank\"><em>What is Microsoft Foundry Agent Service?</em></a></li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/container-apps/overview\" rel=\"noopener\" target=\"_blank\"><em>Azure Container Apps overview</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/architecture/databases/guide/transactional-out-box-cosmos#solution\" rel=\"noopener\" target=\"_blank\"><em>Implement the Transactional Outbox Pattern by Using Azure Cosmos DB</em></a> (Azure Architecture Center), particularly the general pattern and relational-database discussion under Solution; the worked implementation uses Cosmos DB, not the SQL-based design proposed here.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview?view=azuresqldb-current\" rel=\"noopener\" target=\"_blank\"><em>Ledger overview</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-digest-management?view=azuresqldb-current\" rel=\"noopener\" target=\"_blank\"><em>Digest management</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-database-verification?view=azuresqldb-current\" rel=\"noopener\" target=\"_blank\"><em>Database verification</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview\" rel=\"noopener\" target=\"_blank\"><em>Store business-critical blob data with immutable storage in a write once, read many (WORM) state</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure\" rel=\"noopener\" target=\"_blank\"><em>Foundry Models sold by Azure</em></a>.</li>\n<li>OWASP GenAI Security Project. <a href=\"https://genai.owasp.org/llmrisk/llm01-prompt-injection/\" rel=\"noopener\" target=\"_blank\"><em>LLM01:2025 Prompt Injection</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/fabric-iq\" rel=\"noopener\" target=\"_blank\"><em>Connect agents to Microsoft Fabric with Fabric IQ (preview)</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/confidential-ledger/overview\" rel=\"noopener\" target=\"_blank\"><em>About Azure confidential ledger</em></a>.</li>\n<li>Eclipse Tractus-X. <a href=\"https://eclipse-tractusx.github.io/docs-kits/kits/eco-pass-kit/adoption-view/\" rel=\"noopener\" target=\"_blank\"><em>EcoPass KIT: adoption view</em></a>, published documentation, not the /next/ development version.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/entra/verified-id/introduction-to-verifiable-credentials-architecture\" rel=\"noopener\" target=\"_blank\"><em>Microsoft Entra Verified ID architecture overview</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/well-architected/pillars\" rel=\"noopener\" target=\"_blank\"><em>Azure Well-Architected Framework pillars</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/well-architected/ai/test\" rel=\"noopener\" target=\"_blank\"><em>Test and evaluate AI workloads on Azure</em></a> (Azure Well-Architected Framework).</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators\" rel=\"noopener\" target=\"_blank\"><em>Built-in evaluators reference</em></a> (Microsoft Foundry).</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview\" rel=\"noopener\" target=\"_blank\"><em>Training in Microsoft Foundry</em></a>.</li>\n<li>Catena-X Automotive Network. <a href=\"https://catena-x.net/about-us/\" rel=\"noopener\" target=\"_blank\"><em>About us</em></a>.</li>\n<li>Gaia-X European Association for Data and Cloud AISBL. <a href=\"https://gaia-x.eu/\" rel=\"noopener\" target=\"_blank\"><em>Gaia-X: A Federated Secure Data Infrastructure</em></a>.</li>\n<li>W3C. <a href=\"https://www.w3.org/TR/vc-data-model-2.0/\" rel=\"noopener\" target=\"_blank\"><em>Verifiable Credentials Data Model v2.0</em></a>.</li>\n<li>Eclipse Dataspace Decentralized Claims Protocol. <a href=\"https://github.com/eclipse-dataspace-dcp/decentralized-claims-protocol/tree/v1.0.1\" rel=\"noopener\" target=\"_blank\"><em>DCP v1.0.1</em></a>.</li>\n<li>Eclipse Dataspace Components (EDC). <a href=\"https://eclipse-edc.github.io/documentation/for-adopters/\" rel=\"noopener\" target=\"_blank\"><em>Adopters Manual</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/agent-framework/overview/\" rel=\"noopener\" target=\"_blank\"><em>Microsoft Agent Framework overview</em></a>, particularly Workflows.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns\" rel=\"noopener\" target=\"_blank\"><em>AI agent orchestration patterns</em></a> (Azure Architecture Center), particularly When to avoid handoff orchestration.</li>\n<li>European Commission. <a href=\"https://single-market-economy.ec.europa.eu/single-market/digital-product-passport/batteries_en\" rel=\"noopener\" target=\"_blank\"><em>Digital Product Passport for Batteries (Battery Passport)</em></a>, including the linked guidance on data points for each battery category, last updated on October 19, 2026.</li>\n<li>European Commission. <a href=\"https://single-market-economy.ec.europa.eu/single-market/digital-product-passport/eu-digital-product-passport-faq-batteries_en\" rel=\"noopener\" target=\"_blank\"><em>EU Digital Product Passport FAQ for Batteries</em></a>, September 2026, particularly sections 1, 2 and 5 to 10 on timelines, standards, responsibilities, the registry, verification, data requirements, dynamic data, repurposing and compliance.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/microsoft-agent-365/overview\" rel=\"noopener\" target=\"_blank\"><em>Microsoft Agent 365 overview</em></a> and <a href=\"https://learn.microsoft.com/en-us/office365/servicedescriptions/microsoft-agent-365/microsoft-agent-365\" rel=\"noopener\" target=\"_blank\"><em>Microsoft Agent 365 service description</em></a>, including governance, observability, feature and licensing boundaries.</li>\n<li>European Commission AI Act Service Desk. <a href=\"https://ai-act-service-desk.ec.europa.eu/en/ai-act-explorer\" rel=\"noopener\" target=\"_blank\"><em>AI Act Explorer</em></a>, for applicability, risk classification, AI literacy and transparency provisions; consult its linked Official Journal texts for legal authority.</li>\n<li><a href=\"https://eur-lex.europa.eu/eli/reg/2024/3015/oj/eng\" rel=\"noopener\" target=\"_blank\">Regulation (EU) 2024/3015 on prohibiting products made with forced labour on the Union market and amending Directive (EU) 2019/1937</a>, particularly Articles 3 and 39.</li>\n<li><a href=\"https://eur-lex.europa.eu/eli/dec_impl/2026/1736/oj/eng\" rel=\"noopener\" target=\"_blank\">Commission Implementing Decision (EU) 2026/1736 on harmonised standards for digital product passports drafted in support of Regulation (EU) 2024/1781</a>, particularly the Annex.</li>\n<li><a href=\"https://eur-lex.europa.eu/eli/dir/2024/1760/oj/eng\" rel=\"noopener\" target=\"_blank\">Directive (EU) 2024/1760 on corporate sustainability due diligence and amending Directive (EU) 2019/1937 and Regulation (EU) 2023/2859</a>. Consult the current consolidated version for later amendments.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/durable-task/scheduler/durable-task-scheduler\" rel=\"noopener\" target=\"_blank\"><em>Durable Task Scheduler</em></a> and <a href=\"https://learn.microsoft.com/en-us/azure/durable-task/sdks/durable-agents-microsoft-agent-framework\" rel=\"noopener\" target=\"_blank\"><em>Durable Task extension for Microsoft Agent Framework</em></a>.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection\" rel=\"noopener\" target=\"_blank\"><em>Prompt Shields</em></a> (Azure AI Content Safety), particularly document attack detection.</li>\n<li>Microsoft Learn. <a href=\"https://learn.microsoft.com/en-us/azure/defender-for-cloud/on-upload-malware-scanning\" rel=\"noopener\" target=\"_blank\"><em>On-upload malware scanning</em></a> (Microsoft Defender for Storage).</li>\n<li>Author. <em>Security and responsible-AI threat model</em>, companion prototype for this article, synthetic data only, released under the MIT License.&nbsp; [<a href=\"https://github.com/dzemp/multi-agent-digital-battery-passport\" rel=\"noopener\" target=\"_blank\">dzemp/multi-agent-digital-battery-passport</a>]</li>\n<li>Microsoft Azure. <a href=\"https://azure.microsoft.com/en-us/pricing/calculator/\" rel=\"noopener\" target=\"_blank\"><em>Pricing calculator</em></a>.</li>\n</ol>\n<h2>Appendix A: Capability map</h2>\n<p>This map supplements Figure 2 and the full reference architecture in Appendix B with implementation boundaries and conditional services. It is not a deployment specification.</p>\n<p>Table A1. Capabilities and Azure responsibilities.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th>Capability</th><th>Proposed realization and boundary</th></tr></thead><tbody><tr><td>Enterprise intake</td><td>Fabric Data Factory pipelines or supported mirroring read permitted ERP, MES, PLM and QMS data. Fabric access must be configured separately from source permissions [4]. MES owns as-built genealogy in this design; candidates retain source revision, completeness and freshness assurance for the application's gates.</td></tr><tr><td>Partner intake</td><td>Controlled file/API submission is a valid intake route; a maintained EDC/Tractus-X connector is optional where partners participate in Catena-X. Agree semantics, usage policy and credentials, and test conformance rather than infer it from the connector. Neither route replaces applicable EU DPP requirements. Earlier Azure-specific Tractus-X images are deprecated [5], [18], [24], [25], [27].</td></tr><tr><td>Credential verification</td><td>A deterministic verifier checks the supported VC/VP proof, issuer, subject, validity and status. Separate participant identity/eligibility from product-evidence claims and technical verification from field/action authorization and compliance disposition [26], [27]. Other submissions retain sender attribution and applicable signature checks without being treated as VC/VPs.</td></tr><tr><td>Data preparation</td><td>OneLake holds governed bronze, silver and gold datasets. Power BI reports readiness and committed outcomes, but neither controls publication.</td></tr><tr><td>Optional analytical assistant</td><td>A Fabric data agent can support read-only questions through Fabric IQ (preview) [16]. Foundry connections use incoming Microsoft Entra user context or an OAuth session. Validate the selected connection and permissions; analytical answers never authorize publication.</td></tr><tr><td>Agent roles</td><td>Foundry Agent Service supports the five roles with scoped retrieval and allowlisted tools. Each role runs with its own least-privilege identity, and Prompt Shields screens partner documents for embedded instructions [39]. Choose pretrained models for the work each role performs; roles may share a model where it meets their needs (section 2). Agents cannot directly write passport records, clear adverse findings or activate policy changes.</td></tr><tr><td>Orchestration, review and publication</td><td>The Container Apps passport application runs Agent Framework workflows that route typed agent results by fixed rules; agents do not hand control to one another [29], [30]. Each run ends with a result or a hold for human review, and case, hold and review state stays in the same SQL database, which remains the system of record. The application records human dispositions and checks current decision context. It commits the version, audit and outbox in one SQL transaction. This protects accepted SQL context, not live upstream data; source-owned genealogy confirmation also gates physical release.</td></tr><tr><td>Operational history</td><td>Azure SQL Database ledger tables preserve authoritative state and audit history. Protected digest retention and separate verification are necessary to make tampering detectable [10], [11], [12]. Digest anchors must be protected from database writers; ledger history contains only retention-approved data.</td></tr><tr><td>Evidence storage</td><td>Versioned immutable Blob Storage retains files, while SQL holds references and hashes. Microsoft Defender for Storage scans each upload for malware before an agent or reviewer opens it [40]. The application reconciles partial failures without assuming a shared transaction or permission to delete retained files [13].</td></tr><tr><td>Reader access</td><td>The public QR view is a static file in Blob Storage, served through Azure Front Door. Restricted views are precomputed for each access group and served through the authenticated API, which enforces field entitlements. Battery identity remains independent of the current hosting address. Use applicable DPP identifier/exchange standards and versioned legal access policies, including adopted rules for restricted data [31], [32].</td></tr><tr><td>Registry exchange</td><td>The outbox-fed adapter uses a verified operator identity and records acknowledgments, failures, registration identifiers and proofs (Appendix C). The registry's automatic checks confirm structure, not compliance [3, Art. 8].</td></tr><tr><td>Reporting</td><td>The application sends a minimized committed-status copy to OneLake. Power BI shows freshness and includes blocked batteries in the coverage denominator.</td></tr><tr><td>Shared operations</td><td>Microsoft Entra ID, managed identities, Key Vault, Azure Monitor and Application Insights support identity, secrets and traceability. Optional Microsoft Entra External ID manages partner identities, and Microsoft Purview classifies restricted data and labels the Fabric items that hold it. Recovery must include evidence, digests and registry reconciliation, not just database restore.</td></tr><tr><td>Optional agent governance</td><td>Microsoft Agent 365 adds organizational inventory, ownership, governance and observability for connected Foundry agents [33]. It is not the runtime, publication authority or a prerequisite for this architecture; validate integration, telemetry and licensing. Application Insights remains the workload-tracing service.</td></tr><tr><td>Conditional extensions</td><td>Azure Document Intelligence in Foundry Tools may help with complex document extraction; Foundry IQ (Azure AI Search) with governed retrieval; Azure API Management with external API policy; Azure Service Bus with asynchronous delivery; and Azure IoT Hub with device-event ingestion. Azure confidential ledger or a consortium ledger needs the justification discussed in section 4. Microsoft Entra Verified ID depends on partner credential fit [19]. These are not default deployments.</td></tr></tbody><colgroup><col style=\"width: 23.1711%;\" /><col style=\"width: 76.8289%;\" /></colgroup></table></div>\n<h2>Appendix B: Full reference architecture</h2>\n<p>Figure 2 is a simplified view. Figure B1 shows the full proposed reference architecture behind it. It adds the official regulatory sources, the eleven numbered workflow steps that Figure 3 refers to, the workflow worker and Durable Task Scheduler, the ledger digest container and integrity status, the registry adapter, the Fabric data agent and the optional, trigger-based services. Each agent role carries a short label for the permitted authority described in section 2.</p>\n<img />\n<p><em>Figure B1. Full proposed Azure reference architecture. Agents prepare typed, cited proposals; only the passport application writes passport versions. Role labels summarize the authority descriptions in section 2 and are not an industry or regulatory taxonomy. A Catena-X connector is conditional on partner participation and an agreed profile, not a legal prerequisite. EDC/Tractus-X does not itself establish interoperability, certification or deployment [5], [18], [24], [25], [27], [28]. The genealogy gate uses the source-version assurance described in section 3. Microsoft Agent 365 is optional governance and observability, not the agent runtime [33]. Long dashes mark external parties and systems; short dashes mark optional, conditional or recommended components. Azure Front Door is recommended for production public reads, with Azure Web Application Firewall as an option for rate limiting and bot protection. Foundry IQ (Azure AI Search), an optional retrieval service, is distinct from Fabric IQ. The Fabric data-agent box represents governed analytics through Fabric IQ (preview) [16]. Networking, regions and cost are not shown.</em></p>\n<p>&nbsp;</p>\n<p>Its numbered flow starts with enterprise and partner intake (steps 1 to 3), continues through data preparation (4), agent work (5) and human review (6) to publication (7), and ends with integrity verification (8), registry exchange (9), reader access (10) and reporting (11):</p>\n<ol>\n<li><strong>Enterprise intake.</strong> Data Factory pipelines or mirroring copy permitted ERP, MES, PLM and QMS data into OneLake bronze. MES owns the as-built genealogy, reconciled with ERP lot identities.</li>\n<li><strong>Partner intake.</strong> Suppliers and lifecycle partners submit through controlled file or API intake, with provenance, schema checks, malware scanning and quarantine, or through an optional Catena-X connector where both parties participate.</li>\n<li><strong>Credential verification.</strong> The verifier checks the VC/VP proof, issuer and status; authorization remains separate. Verified evidence and lifecycle events go to the passport API.</li>\n<li><strong>Data preparation.</strong> Fabric validates and joins data, builds versioned candidate packages and reports readiness in Power BI. Nothing is published here.</li>\n<li><strong>Agent work.</strong> Five Foundry roles, each with its own least-privilege identity, read permitted context and official sources and propose through typed tool endpoints. Prompt Shields screens partner documents. Agents hold no permission to write, publish, sign or approve.</li>\n<li><strong>Human review.</strong> Accountable reviewers record versioned dispositions that name the decision context they judged.</li>\n<li><strong>Publication.</strong> The passport API runs deterministic tools, including the passport builder; rechecks evidence validity, genealogy currency with MES, disposition currency and policy version; and commits version, audit and outbox in one SQL transaction.</li>\n<li><strong>Integrity verification.</strong> Ledger digests are stored asynchronously in a locked container, and integrity status moves from pending to verified or failed.</li>\n<li><strong>Registry exchange and enterprise release.</strong> The outbox relay sends each hold event to ERP, MES or QMS, which sets a blocking quality status and alone releases physical stock. It also passes registrations to the registry adapter, which uses a verified operator identity and stores the registration ID and proof for each version.</li>\n<li><strong>Reader access.</strong> Azure Front Door serves the static public view of each version from Blob Storage; partners and authorities use the authenticated restricted read API.</li>\n<li><strong>Reporting.</strong> The application sends a minimized committed-status copy to OneLake, and Power BI reports it with evidence readiness.</li>\n</ol>\n<p>Agent Framework workflows in the application route typed agent results and hold work for reviewers; Durable Task Scheduler checkpoints run progress, while case and review state stays in SQL. Agent outputs remain proposals until the application and its controls accept them. Microsoft Entra ID, managed identities, Azure Key Vault, Azure Monitor and Application Insights provide identity, credential management and operational visibility across the whole flow. The cross-cutting band also shows Azure Front Door as the recommended public entry point, optional Microsoft Entra External ID for partner identities, Microsoft Defender for Storage, Microsoft Purview, optional Microsoft Agent 365 and the backup and exit controls described in section 5. Appendix A lists the service-level boundaries.</p>\n<h2>Appendix C: Implementation considerations</h2>\n<p>This appendix keeps implementation detail that supports the main text but is not needed to follow the architecture. It is not a deployment specification.</p>\n<h3>C1. Who acts as the responsible economic operator</h3>\n<p>In this article, the battery manufacturer is the responsible economic operator, because it places the finished batteries on the EU market. For batteries made outside the EU, the importer can hold the role, and a vehicle manufacturer that completes the battery, for example by adding the battery management system, becomes responsible [32]. The battery manufacturer can then maintain the passport on the vehicle manufacturer's behalf under a written authorization, without selling or reusing the data beyond that service [1, Arts. 77(4) and 78(d)].</p>\n<h3>C2. Data spaces and verifiable credentials</h3>\n<p>Catena-X is an automotive data-space initiative, Gaia-X a related trust framework and Tractus-X EDC one connector implementation [5], [18], [24], [25], [28]. The Battery Regulation mandates none of them, nor verifiable credentials. Where partners use a<strong> </strong>verifiable credential (VC), a digitally signed statement about an organization or product, packaged in a verifiable presentation (VP) for an exchange [26], [27], the verifier checks the issuer, proof, subject and status against the agreed profile. Passing those checks shows who made a claim, for example that Supplier A says lot A came from Mine North, not that the claim is true. A VP does not itself grant access to data; the passport application decides which organization may see or do what.</p>\n<h3>C3. Workflow runs and checkpoints</h3>\n<p>Case status, holds, dispositions, passport versions and audit records stay in Azure SQL Database. The transactional outbox [9] starts each workflow run through Azure Durable Task Scheduler, which checkpoints run progress so that an interrupted run can resume [38]. A recorded disposition starts a new run that reloads current evidence, policy and decision context and reruns the publication gates.</p>\n<h3>C4. Starting model hypotheses</h3>\n<p>Table C1 lists starting candidates from the Microsoft Foundry model catalog [14]. The same model can serve several roles if it meets their needs; compare candidates on the same cases before choosing.</p>\n<p>Table C1. Starting model hypotheses for the five agent roles (not measured).</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Agent role and permitted authority</th><th>What the model contributes</th><th>Starting hypothesis</th><th>What stays outside the model</th><th>What evaluation measures</th></tr></thead><tbody><tr><td>Regulatory watch: advisory</td><td>Compares dated legal sources and drafts impact notes</td><td>More capable reasoning model; smaller challenger for simple summaries</td><td>Legal interpretation and policy activation</td><td>Correct source, status, scope and dates; no unsupported legal assertions</td></tr><tr><td>Supplier due diligence: bounded action with mandatory escalation</td><td>Reconciles conflicting documents, cites passages and prepares a review case</td><td>More capable reasoning model; smaller challenger for simple extraction</td><td>Credential verification; decisions on adverse findings</td><td>Accuracy of critical fields, correct citations, escalation of every known conflict, unnecessary holds</td></tr><tr><td>Carbon footprint: automated workflow within a pinned method and verifier check</td><td>Matches approved batch inputs to the pinned method and explains the result's provenance</td><td>Smaller tool-calling model</td><td>Method and factor versions, units, arithmetic and the verifier check</td><td>Correct inputs and method and factor versions, exact reproduction of the calculator's result, rejection of missing inputs</td></tr><tr><td>Passport issuance: automated workflow within deterministic publication gates</td><td>Assesses whether each candidate appears ready, then requests publication or explains blocking gaps</td><td>Smaller tool-calling model; shared capable model as challenger</td><td>Field values, access groups, applicability, authorization and the publication transaction</td><td>Correct readiness assessments, actionable gap explanations, no improper release</td></tr><tr><td>Lifecycle update: automated workflow within validation and duplicate checks</td><td>Interprets ambiguous partner submissions and explains conflicts</td><td>Smaller model; no model for well-structured events</td><td>Battery identity, event order, duplicate handling and state transitions</td><td>Correct battery and field mapping, duplicate and conflict handling, no unauthorized change</td></tr></tbody><colgroup><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /></colgroup></table></div>\n<h3>C5. Registry mechanics</h3>\n<p>Only verified economic operators can register passports, typically by using a qualified electronic seal or a qualified electronic attestation of attributes. Verification lapses when that seal or attestation expires, and after three years at the latest, so renewal belongs in the operating calendar [3, Art. 4], [32]. The operator must also protect its registry access credentials [3, Art. 19]. The registry's automatic checks confirm structure and granularity, not compliance [3, Art. 8]. Each proof of registration remains downloadable for only 90 days, so the adapter stores the registration identifier and a copy of the proof for each registered version [3, Arts. 8 and 9].</p>\n<h3>C6. Lifecycle events after release</h3>\n<p>Dynamic data must be updated at least whenever the battery's status changes, not necessarily in real time [32]. A change of ownership keeps the same passport and is not recorded in it, but it can change who has a legitimate interest in restricted data, so the application applies any access change only under an approved policy. Preparation for reuse or repurposing, repurposing and remanufacturing each create a new passport linked to the original [1, Art. 77(7)]. After recycling, the passport ceases to exist [1]; any evidence kept after that point needs its own justification.</p>\n<h3>C7. Evidence storage, ledger digests and retention</h3>\n<p>SQL and Blob Storage do not share a transaction, so the application uploads and verifies a file before recording its reference and hash, and reconciliation finds files left unreferenced by a failed write. Retention rules mean cleanup cannot assume that a stored file can be deleted. Ledger digests are kept in a container with a locked immutability policy, administered separately from database writers [11], [12]. Define retention by data class before enabling ledger or immutable storage: keep personal data and confidential narrative out of permanent ledger history, because deleting a current ledger row does not erase its history.</p>\n<h3>C8. Threat model summary</h3>\n<p>Table C2. Threats that shape this architecture, summarized from the companion threat model [41].</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Threat (identifier in the threat model)</th><th>Controls in the prototype</th><th>Controls to add before production</th></tr></thead><tbody><tr><td>Instructions hidden in supplier documents steer an agent (T03)</td><td>A read-only tool scoped to each role's sections; a strict decision schema; agents hold no human decision rights</td><td>Prompt Shields document attack detection; AI red teaming</td></tr><tr><td>Forged, stale or replayed claims and approvals (T04, T07)</td><td>Ed25519 signatures checked against a party registry; expiry, revocation and replay checks; stale-task and version-conflict checks</td><td>Verifiable credentials through a standards-aligned partner connector; partner keys in Key Vault with rotation</td></tr><tr><td>A hold is bypassed, or evidence or history is altered (T08, T09)</td><td>Gates enforced in application code; separation of duties between the reviewer, compliance and policy-approver roles; ledger tables with digests in a separate storage account</td><td>Separation of duties for each person who holds several roles; a locked immutability policy with an approved retention period</td></tr><tr><td>Restricted data reaches the wrong reader (T02, T06)</td><td>Server-side field policy for each access group; telemetry that excludes evidence and prompts</td><td>Isolation between organizations; Microsoft Purview sensitivity labels</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h3>C9. Cost drivers</h3>\n<p>Platform cost changes little with volume and covers Fabric capacity, Azure SQL Database, Container Apps, the Durable Task Scheduler, Front Door, API Management where you use it, monitoring, the qualified electronic seal and partner connectivity. Per-battery cost covers passport versions, registry exchanges, evidence retention and public reads [1, Art. 78(b)]. Per-exception cost covers the model tokens of each agent run, reviewer minutes at a loaded hourly rate and rework. Integration, support, assurance and continuity also belong in the operating-cost view. Estimate each driver with the Azure pricing calculator [42].</p>"
  "e71ada2638ed43cd6f4d962eeb108bc9":
    "id": "e71ada2638ed43cd6f4d962eeb108bc9"
    "title": "Who Can See This Record? Designing Reusable Access Control Lists for Azure Microservices"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/who-can-see-this-record-designing-reusable-access-control-lists/ba-p/4575167"
    "published": "2026-11-24 02:36:03"
    "fetched": "2026-11-25 01:35:31"
    "summary": "<p>A user signs in, opens <em><strong>/records/1042</strong></em>, and receives the correct response. Then they change one character in the URL and request<em><strong> /records/1043</strong></em>.</p>\n<p>The access token is valid. The API gateway accepted it. The user has the expected application role. Yet the response contains somebody else’s data.</p>\n<p>Nothing sophisticated happened. The API authenticated the caller but never answered the question that mattered: <strong>Is this caller allowed to perform this action on this specific record?</strong></p>\n<p><a href=\"https://api-security.owasp.org/editions/2023/en/0xa1-broken-object-level-authorization/\" rel=\"noopener\" target=\"_blank\">OWASP API Security Top 10 2023</a> calls this broken object-level authorization (BOLA). OWASP places it at API1:2023 and recommends an object-level authorization check in every endpoint that receives an object identifier and acts on the corresponding object.</p>\n<p>This article presents an Azure-oriented pattern for making those checks consistent across microservices: a small reusable enforcement library, a relationship-aware decision service, trusted identities for both users and workloads, explicit exceptions, and telemetry that exposes endpoints where no decision was made.</p>\n<blockquote>\n<p><strong>Terminology note:</strong> “ACL” in this article means application-level access control over business objects. It is not Azure role-based access control (Azure RBAC), a network ACL, or an Azure Storage ACL. Those controls protect different layers and remain important, but they do not decide whether a signed-in user may update business record 1043.</p>\n</blockquote>\n<h2>Authentication, roles, and object authorization answer different questions</h2>\n<p>Authentication answers <strong>who is calling</strong>. A role or scope answers <strong>what category of operation the caller may attempt</strong>. Object-level authorization answers <strong>whether that caller may perform that action on that resource now</strong>.</p>\n<p>A role such as <em>Member.Read</em> can establish that the caller is allowed to use a read API. It cannot, by itself, prove that the caller is related to the member identified in the route, query string, or request body. The <a href=\"https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/approaches/identity\" rel=\"noopener\" target=\"_blank\">Azure Architecture Center guidance for multitenant identity</a> makes this distinction explicit: role information can be carried in identity tokens, while resource-level authorization data can be maintained and evaluated by the application.</p>\n<p>For object authorization, the decision normally needs more context:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Decision input</th><th>Example</th></tr></thead><tbody><tr><td>Subject</td><td>The signed-in user or calling workload</td></tr><tr><td>Tenant</td><td>The customer or organization boundary</td></tr><tr><td>Action</td><td>Read, create, update, approve, or delete</td></tr><tr><td>Resource type</td><td>Member, booking, claim, account, or document</td></tr><tr><td>Resource ID</td><td>One ID or a batch of IDs</td></tr><tr><td>Relationship</td><td>Owner, delegate, reviewer, organization member, or service grant</td></tr><tr><td>Environment</td><td>Optional policy inputs such as endpoint or assurance level</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>A useful decision can be expressed as:</p>\n<blockquote>\n<p><em>Can subject S, in tenant T, perform action A on every resource R under policy P?</em></p>\n</blockquote>\n<p>Including the <strong>action</strong> matters. A relationship that allows reading a record does not automatically authorize updating or deleting it. Including the <strong>tenant</strong> matters because a valid relationship must never bridge an unintended tenant boundary.</p>\n<p>The <a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html\" rel=\"noopener\" target=\"_blank\">OWASP Authorization Cheat Sheet</a> recommends least privilege, deny by default, permission validation on every request, and early definition of users, resources, operations, and trust boundaries. Those principles shape the design below.</p>\n<h2>Reference architecture</h2>\n<p>The pattern separates identity, enforcement, policy evaluation, relationship data, and observability.</p>\n<img />\n<p><em>Figure 1. Reference architecture for object-level authorization</em></p>\n<p>The responsibilities are deliberately narrow:</p>\n<ol>\n<li><strong>Microsoft Entra ID</strong> issues identities and claims for users and workloads.</li>\n<li><strong>Azure API Management</strong> can validate the incoming token before forwarding the request. The API must still enforce its own authorization policy; token validation is not an object-level decision. The <a href=\"https://learn.microsoft.com/en-us/azure/api-management/validate-jwt-policy\" rel=\"noopener\" target=\"_blank\">validate-jwt policy</a> can enforce token existence and validity and can validate properties such as issuer, audience, and required claims. For Microsoft Entra tokens, API Management also provides <a href=\"https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy\" rel=\"noopener\" target=\"_blank\">validate-azure-ad-token</a>.</li>\n<li><strong>The endpoint</strong> knows which business objects the operation will access. This is why the final check belongs inside the service, close to the business logic.</li>\n<li><strong>The reusable library</strong> is the policy enforcement point. It extracts the trusted subject and tenant context, builds a normalized authorization request, calls the evaluator, fails closed, and records the outcome.</li>\n<li><strong>The relationship or policy service</strong> is the policy decision point. It evaluates authoritative relationships and returns a decision. It does not trust resource ownership supplied by the client.</li>\n<li><strong>Azure Monitor Application Insights and Log Analytics</strong> make missing, denied, skipped, and failed checks visible.</li>\n</ol>\n<p>This separation also keeps the library small. The library enforces the decision; it does not become a second database of relationships.</p>\n<h3>Model direct and inherited access</h3>\n<p>An application ACL can be stored as relationship tuples rather than hard-coded endpoint conditions.</p>\n<p>For example:</p>\n<blockquote>\n<p>(user:alice) -[owns]-&gt; (member:1042)</p>\n<p>(user:bob) -[delegate_for]-&gt; (member:1042)</p>\n<p>(member:1042) -[belongs_to]-&gt; (organization:contoso)</p>\n</blockquote>\n<p>A policy can allow Alice to read member 1042 through the <strong>direct owns relationship</strong>, allow Bob through <strong>delegate_for</strong>, and <strong>allow both to read an organization-level resource</strong> when the approved relationship chain reaches organization:contoso. This is relationship-based access control: the endpoint asks about the final resource and action, while the evaluator resolves direct or inherited relationships from authoritative data.</p>\n<p>Keep relationship creation and removal under the business system that owns that lifecycle. The authorization service should not infer a relationship merely because a client supplied two matching identifiers, and the enforcement library should not copy relationship data into local configuration.</p>\n<h2>Make the secure call the easy call</h2>\n<p>If every team implements object authorization from scratch, small differences accumulate: inconsistent tenant checks, one-at-a-time network calls, ambiguous batch behavior, and endpoints that forget the check entirely.</p>\n<p>A reusable API should make the safe path short and the dangerous path difficult. The following C# shape is intentionally small:</p>\npublic enum AccessAction\n{\n    Read,\n    Create,\n    Update,\n    Delete,\n    Approve\n}\npublic enum EntityType\n{\n    Member,\n    Booking,\n    Organization\n}\npublic interface IObjectAuthorizationClient\n{\n    Task AuthorizeAllAsync(AccessAction action, EntityType resourceType, IReadOnlyCollection&lt;string&gt; resourceIds, CancellationToken cancellationToken = default);\n    Task AuthorizeAllAsync(AccessAction action, EntityType resourceType, Func&lt;CancellationToken, Task&lt;IReadOnlyCollection&lt;string&gt;&gt;&gt; resourceIdsFactory, CancellationToken cancellationToken = default);\n}\n<p>The caller does <strong>not</strong> pass a subject ID or tenant ID. The library obtains them from the server’s validated identity context. This removes an easy source of confused-deputy and parameter-substitution bugs.</p>\n<p>A handler remains straightforward:</p>\npublic sealed class GetBalancesHandler\n{\n    private readonly IObjectAuthorizationClient authorization;\n    private readonly IBalanceRepository balances;\n\n    public GetBalancesHandler(IObjectAuthorizationClient authorization, IBalanceRepository balances)\n    {\n        this.authorization = authorization;\n        this.balances = balances;\n    }\n\n    public async Task&lt;IReadOnlyCollection&lt;Balance&gt;&gt; HandleAsync(GetBalances request, CancellationToken cancellationToken)\n    {\n        await this.authorization.AuthorizeAllAsync(\n            AccessAction.Read,\n            EntityType.Member,\n            request.MemberIds,\n            cancellationToken);\n\n        return await this.balances.GetAsync(request.MemberIds, cancellationToken);\n    }\n}\n<p>The authorization check runs <strong>before</strong> the protected data is loaded or changed.</p>\n<h3>Four implementation choices carry most of the value</h3>\n<ol>\n<li><strong> Deny by default.</strong> An unknown resource type, missing tenant context, malformed identity, evaluation timeout, or unexpected response must never turn into an allow decision.</li>\n<li><strong> Use all-of semantics for a batch.</strong> AuthorizeAllAsync allows the operation only when every target is authorized. If partial results are a valid business requirement, expose that as a differently named API and contract; do not silently drop denied items from a method that implies full success.</li>\n<li><strong> Evaluate in bulk.</strong> Send the caller, action, resource type, tenant, and complete ID set in one request. This avoids an N+1 authorization pattern and ensures the evaluator sees the batch as one decision.</li>\n<li><strong> Load IDs lazily when discovery is expensive.</strong> Some handlers must query another store to discover target IDs. A factory overload avoids that work when a preceding decision makes the lookup unnecessary. The library should invoke the factory at most once and only after validating the identity context.</li>\n</ol>\n<p>A local self-access optimization can be useful, but only when the resource type, tenant, action, and identifier semantics make it provably equivalent to the normal policy. “The token subject equals the route ID” is not a general solution to BOLA; OWASP explicitly notes that comparing a token user ID with a request parameter addresses only a limited subset of cases.</p>\n<h2>Model the decision explicitly</h2>\n<p>Avoid a Boolean-only contract when you need operational clarity. An evaluator response should distinguish an evaluated denial from a system failure.</p>\npublic enum AuthorizationDecision { Allow, Deny, Error }\npublic sealed record AuthorizationResult(AuthorizationDecision Decision, string PolicyVersion, string ReasonCode, string CorrelationId);\n<p>Keep ReasonCode low-cardinality and safe for telemetry, for example relationship_missing, tenant_mismatch, service_grant_missing, or evaluator_unavailable. Do not place access tokens, raw object data, or unrestricted identifiers in logs.</p>\n<p>In this design:</p>\n<ul>\n<li>Allow lets the handler continue.</li>\n<li>Deny stops the operation and normally maps to <em>HTTP 403 Forbidden</em>.</li>\n<li>Error also stops the operation. It is recorded separately so an unavailable decision service is not mistaken for a policy denial. A service can map that condition to <em>503 Service Unavailable</em> while still failing closed and returning no protected data.</li>\n</ul>\n<p>For highly sensitive APIs, decide consistently whether a missing or inaccessible record returns <em>403 or 404</em>. The key architectural requirement is that the response must not disclose protected information through inconsistent status codes, messages, or timing.</p>\n<h2>User calls and workload calls need different identities</h2>\n<p>Service-to-service authorization is where otherwise sound designs often acquire a bypass.</p>\n<p>Consider a booking flow. A user calls a Rules service. The Rules service then calls a Records service to find conflicting bookings. Sometimes Rules is acting for the user; at other times it performs a broader system operation that the user could not perform directly.</p>\n<p>Those are two different security modes and should be represented by two different tokens.</p>\n<p>When a downstream API should enforce the user’s permissions, use the <a href=\"https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow\" rel=\"noopener\" target=\"_blank\">OAuth 2.0 on-behalf-of flow</a>. Microsoft describes OBO as delegation: a middle-tier API obtains a downstream access token that carries the user’s identity and delegated permissions through the request chain.</p>\n<img />\n<p><em>Figure 2. Acting on behalf of the user with the OBO flow</em></p>\n<p>The downstream service validates a token intended for its own audience and applies the same object-level policy it would apply to a direct user request.</p>\n<h3>Mode 2: perform work as the service</h3>\n<p>When the caller is performing its own approved workload operation, use an app-only identity such as a <a href=\"https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview\" rel=\"noopener\" target=\"_blank\">managed identity for Azure resources</a>. Managed identities let Azure workloads obtain Microsoft Entra tokens without application code managing credentials. Microsoft Entra <a href=\"https://learn.microsoft.com/en-us/entra/identity-platform/howto-add-app-roles-in-apps\" rel=\"noopener\" target=\"_blank\">app roles</a> can also be assigned to another application’s service principal or to a managed identity, allowing the target API to authorize the workload from validated token claims.</p>\n<p>The target service should apply a narrow service grant such as:</p>\n{\n  \"principal\": \"&lt;managed-identity-or-service-principal-object-id&gt;\",\n  \"audience\": \"api://records-api\",\n  \"actions\": [ \"bookings.read-for-conflict-check\" ],\n  \"resourceTypes\": [ \"Booking\" ],\n  \"routeTemplates\": [ \"GET /api/bookings/conflicts\" ],\n  \"owner\": \"records-api-team\",\n  \"expiresOn\": \"&lt;review-date&gt;\"\n}\n<p>This is not an anonymous skip. It is an authorization decision for a validated workload identity.</p>\n<h2>Make “no object check required” explicit</h2>\n<p>Some endpoints genuinely do not operate on caller-specific objects. A reference-data endpoint might return a fixed list of countries, for example. Other endpoints might enforce a specialized authorization policy outside the shared library.</p>\n<p>Silence is a poor representation of that decision because silence also describes a forgotten check. Require explicit endpoint metadata and a reason:</p>\n[SuppressObjectAuthorization(\"Returns static reference data and accepts no caller-controlled object ID.\")]\n[HttpGet(\"api/reference/countries\")] \npublic IActionResult GetCountries() =&gt; Ok(this.countries);\n<p>Treat suppression as a reviewed decision, not a convenience:</p>\n<ul>\n<li>Require a non-empty justification.</li>\n<li>Record the endpoint, owner, reviewer, and review date.</li>\n<li>Reject vague reasons such as “not needed.”</li>\n<li>Prefer a specialized named policy when an endpoint does perform sensitive object access.</li>\n<li>Add a startup or CI test that inventories every endpoint and verifies that it has shared authorization, a specialized policy, or an approved suppression.</li>\n</ul>\n<p>This turns a missing check from an invisible omission into a test failure or telemetry signal.</p>\n<h2>Observe authorization coverage, not only denials</h2>\n<p>A security control is difficult to trust if you can measure failures but cannot detect where the control never ran.</p>\n<p>Initialize an authorization outcome for every authenticated request. Middleware can begin with NotApplied; the library or suppression filter then replaces it with the final result.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Outcome</th><th>Meaning</th><th>Operational response</th></tr></thead><tbody><tr><td>Allowed</td><td>Policy ran and allowed the action</td><td>Normal baseline</td></tr><tr><td>Denied</td><td>Policy ran and rejected the action</td><td>Investigate unusual increases and repeated probes</td></tr><tr><td>ServiceGrant</td><td>A validated workload used a narrow service grant</td><td>Confirm the principal, action, route, owner, and expiry</td></tr><tr><td>Suppressed</td><td>An approved declaration says object authorization is not applicable</td><td>Review reasons and age periodically</td></tr><tr><td>NotApplied</td><td>An authenticated request completed without an object-authorization decision</td><td>Treat as a coverage defect</td></tr><tr><td>Error</td><td>The authorization dependency or policy evaluation failed</td><td>Alert; fail closed and restore the dependency</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>Record the outcome as an application-defined property on request telemetry. In workspace-based Application Insights, the AppRequests table exposes application-defined properties in the dynamic Properties column, as documented in the <a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests\" rel=\"noopener\" target=\"_blank\">Azure Monitor Logs AppRequests reference</a>.</p>\n<p>The following KQL summarizes request volume and route coverage by result:</p>\nAppRequests\n| where TimeGenerated &gt; ago(7d)\n| extend\n    AclResult = tostring(Properties[\"AclResult\"]),\n    RouteTemplate = tostring(Properties[\"RouteTemplate\"]),\n    ServiceName = tostring(Properties[\"ServiceName\"])\n| where isnotempty(AclResult)\n| summarize\n    Requests = sum(ItemCount),\n    DistinctRoutes = dcount(RouteTemplate)\n    by ServiceName, AclResult\n| order by ServiceName asc, Requests desc\n<p>To find coverage gaps:</p>\nAppRequests\n| where TimeGenerated &gt; ago(24h)\n| extend\n    AclResult = tostring(Properties[\"AclResult\"]),\n    RouteTemplate = tostring(Properties[\"RouteTemplate\"]),\n    ServiceName = tostring(Properties[\"ServiceName\"])\n| where AclResult == \"NotApplied\"\n| summarize\n    Requests = sum(ItemCount),\n    LastSeen = max(TimeGenerated)\n    by ServiceName, RouteTemplate\n| order by Requests desc\n<h2>Test the decision matrix, not only the happy path</h2>\n<p>Authorization defects often hide in combinations. Build a reusable contract-test suite for every service that consumes the library.</p>\n<p>At minimum, cover:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Scenario</th><th>Expected result</th></tr></thead><tbody><tr><td>Caller owns the resource in the active tenant</td><td>Allow</td></tr><tr><td>Caller has the required delegated relationship</td><td>Allow</td></tr><tr><td>Relationship exists in another tenant</td><td>Deny</td></tr><tr><td>Caller has the relationship but not the requested action</td><td>Deny</td></tr><tr><td>Batch contains one unauthorized ID</td><td>Deny the full all-of request</td></tr><tr><td>Subject or tenant context is missing</td><td>Error or unauthenticated response; never allow</td></tr><tr><td>Relationship service is unavailable</td><td>Error and fail closed</td></tr><tr><td>Workload token matches the exact service grant</td><td>ServiceGrant</td></tr><tr><td>Workload token has the wrong audience, action, or route</td><td>Deny</td></tr><tr><td>Suppression has a valid explicit reason</td><td>Suppressed</td></tr><tr><td>Authenticated endpoint makes no decision</td><td>NotApplied and CI/runtime detection</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>Also test the trust boundary:</p>\n<ul>\n<li>A client-supplied identity header cannot override validated claims.</li>\n<li>Tokens for another audience are rejected.</li>\n<li>Expired or incorrectly issued tokens are rejected.</li>\n<li>A user token cannot activate a workload service grant.</li>\n<li>A workload token cannot silently become a delegated user token.</li>\n<li>A route change does not accidentally broaden an existing grant.</li>\n</ul>\n<p>Run these tests in pull requests and after policy configuration changes. OWASP’s BOLA guidance specifically recommends tests that evaluate the authorization mechanism and block deployment when those tests fail.</p>\n<h2>Trade-offs and alternatives</h2>\n<p>No authorization architecture is free.</p>\n<h3>Shared library plus relationship service</h3>\n<p><strong>Strengths</strong></p>\n<ul>\n<li>Consistent enforcement API across services.</li>\n<li>Decisions use authoritative business relationships.</li>\n<li>Bulk and lazy evaluation control unnecessary calls.</li>\n<li>Coverage markers make omissions visible.</li>\n<li>Teams keep business-specific relationship data outside the library.</li>\n</ul>\n<p><strong>Costs</strong></p>\n<ul>\n<li>A network dependency for non-local decisions.</li>\n<li>Versioning and adoption work across service teams.</li>\n<li>Operational ownership for policy, service grants, and telemetry.</li>\n<li>Careful caching is required if relationships change frequently. A cached allow must never outlive the risk tolerance for revoked access.</li>\n</ul>\n<h3>Gateway-only authorization</h3>\n<p>A gateway is valuable for token validation, coarse scopes, quotas, and common edge policies. It usually does not know every business object that a handler will load, particularly when IDs are derived from a request body or database query. Therefore, gateway authorization complements but does not replace in-service object authorization.</p>\n<h3>Token-only roles</h3>\n<p>Roles and scopes are efficient for broad capabilities. They become awkward when access depends on per-object relationships, tenant membership, or changing ownership. Use token claims as decision inputs, not as a substitute for resource policy.</p>\n<h2>Architecture review checklist</h2>\n<p>Before approving an object-authorization design, ask:</p>\n<ul>\n<li>Is the user or workload identity cryptographically validated for the target API?</li>\n<li>Is tenant context validated on every object decision?</li>\n<li>Does the decision include the action, resource type, and every target ID?</li>\n<li>Is the default outcome deny?</li>\n<li>Are batch semantics explicit?</li>\n<li>Does an evaluator outage fail closed without being misreported as a normal denial?</li>\n<li>Are workload calls represented by managed identities or service principals instead of self-asserted headers?</li>\n<li>Are service grants narrow, owned, logged, and time-bounded?</li>\n<li>Must every endpoint declare shared authorization, a specialized policy, or a justified suppression?</li>\n<li>Can Azure Monitor identify authenticated routes where no decision occurred?</li>\n<li>Do logs avoid tokens, sensitive payloads, and high-cardinality resource IDs?</li>\n<li>Do tests cover cross-tenant access, mixed batches, token substitution, and dependency failure?</li>\n</ul>\n<p>If any answer is unclear, the authorization boundary is unclear too.</p>\n<h2>Closing thoughts</h2>\n<p>An access-control library has two sets of customers: the people whose data it protects and the developers who must use it correctly.</p>\n<p>The design earns trust when the secure call is the shortest call, identities are validated rather than asserted, relationship decisions are authoritative, exceptions are narrow and visible, failures are closed, and missing checks appear in a dashboard or build failure before they appear in an incident report.</p>\n<p>Authentication gets the caller to the door. Object-level authorization decides which records they may touch once they are inside.</p>\n<h2>References</h2>\n<ul>\n<li><a href=\"https://api-security.owasp.org/editions/2023/en/0xa1-broken-object-level-authorization/\" rel=\"noopener\" target=\"_blank\">OWASP API1:2023 — Broken Object Level Authorization</a></li>\n<li><a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html\" rel=\"noopener\" target=\"_blank\">OWASP Authorization Cheat Sheet</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/approaches/identity\" rel=\"noopener\" target=\"_blank\">Azure Architecture Center — Architectural approaches for identity in multitenant solutions</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/api-management/validate-jwt-policy\" rel=\"noopener\" target=\"_blank\">Azure API Management — Validate JWT</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy\" rel=\"noopener\" target=\"_blank\">Azure API Management — Validate Microsoft Entra tokens</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview\" rel=\"noopener\" target=\"_blank\">Microsoft Entra ID — Managed identities for Azure resources</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow\" rel=\"noopener\" target=\"_blank\">Microsoft identity platform — OAuth 2.0 On-Behalf-Of flow</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/entra/identity-platform/howto-add-app-roles-in-apps\" rel=\"noopener\" target=\"_blank\">Microsoft identity platform — Add app roles and receive them in tokens</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete\" rel=\"noopener\" target=\"_blank\">Azure Monitor — Application Insights telemetry data model</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests\" rel=\"noopener\" target=\"_blank\">Azure Monitor Logs — AppRequests table</a></li>\n</ul>"
