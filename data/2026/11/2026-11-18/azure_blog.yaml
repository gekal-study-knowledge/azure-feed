    "published": "2026-11-18 03:05:00"
    "fetched": "2026-11-19 03:28:37"
    "summary": "<p>Today, we are announcing Microsoft IQ, the enterprise context management platform that helps organizations create their own IQ. What sets an organization apart is everything around the model: its own intelligence.</p>\n<p>The post <a href=\"https://azure.microsoft.com/en-us/blog/introducing-the-new-microsoft-iq-putting-your-organizations-intelligence-to-work-in-every-agent/\">Introducing the new Microsoft IQ: Putting your organization&#8217;s intelligence to work in every agent</a> appeared first on <a href=\"https://azure.microsoft.com/en-us/blog\">Microsoft Azure Blog</a>.</p>"
