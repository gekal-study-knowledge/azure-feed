    "published": "2026-11-18 03:35:00"
    "fetched": "2026-11-19 03:28:37"
    "summary": "<p>Our new integrations let AI agents reason across Oracle’s business-critical data.</p>\n<p>The post <a href=\"https://azure.microsoft.com/en-us/blog/microsoft-and-oracle-bring-agentic-ai-into-flow-of-enterprise-work/\">Microsoft and Oracle bring agentic AI into flow of enterprise work</a> appeared first on <a href=\"https://azure.microsoft.com/en-us/blog\">Microsoft Azure Blog</a>.</p>"
  "760f9c5b35728756439d6a58e7f0bff6":
    "id": "760f9c5b35728756439d6a58e7f0bff6"
    "title": "Introducing Azure Catalyst agentic modernization and new AI infrastructure innovations"
    "link": "https://azure.microsoft.com/en-us/blog/introducing-azure-catalyst-agentic-modernization-and-new-ai-infrastructure-innovations/"
    "published": "2026-11-18 03:35:00"
    "fetched": "2026-11-19 03:28:37"
    "summary": "<p>At Microsoft Ignite 2026, we’ll showcase what’s possible when models, silicon, and cloud infrastructure converge into a single, co-engineered system. By tuning the entire stack, and introducing new capabilities across isolated execution, networking, context management, and inference efficiency, we’re fundamentally improving agent speed, security, and unit economics.</p>\n<p>The post <a href=\"https://azure.microsoft.com/en-us/blog/introducing-azure-catalyst-agentic-modernization-and-new-ai-infrastructure-innovations/\">Introducing Azure Catalyst agentic modernization and new AI infrastructure innovations</a> appeared first on <a href=\"https://azure.microsoft.com/en-us/blog\">Microsoft Azure Blog</a>.</p>"
  "9cdc1e3cbe5d33b8ac2e7c07ef5242d1":
    "id": "9cdc1e3cbe5d33b8ac2e7c07ef5242d1"
    "title": "Microsoft Ignite 2026: What’s new in Azure, the platform purpose-built for AI"
    "link": "https://azure.microsoft.com/en-us/blog/microsoft-ignite-2026-whats-new-in-azure-the-platform-purpose-built-for-ai/"
    "published": "2026-11-18 03:35:00"
    "fetched": "2026-11-19 03:28:37"
    "summary": "<p>At Microsoft Ignite, we're sharing what's new across every layer of the platform. New capabilities spanning compute, storage, and networking let you run AI at scale with the control of your own infrastructure, without having to build, secure, and operate all of it yourself.</p>\n<p>The post <a href=\"https://azure.microsoft.com/en-us/blog/microsoft-ignite-2026-whats-new-in-azure-the-platform-purpose-built-for-ai/\">Microsoft Ignite 2026: What&#8217;s new in Azure, the platform purpose-built for AI</a> appeared first on <a href=\"https://azure.microsoft.com/en-us/blog\">Microsoft Azure Blog</a>.</p>"
