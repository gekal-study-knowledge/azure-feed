  "66775e87dd110f5569e6f5325bfec0a6":
    "id": "66775e87dd110f5569e6f5325bfec0a6"
    "title": "Secure AI. Secure with AI. Introducing the next chapter of Azure Firewall."
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/secure-ai-secure-with-ai-introducing-the-next-chapter-of-azure/ba-p/4573399"
    "published": "2026-11-18 03:42:28"
    "fetched": "2026-11-18 03:49:32"
    "summary": "<p>Author(s): <strong>Ashish Jain</strong>, Partner Group Product Manager, Network &amp; AI Security, with <strong>Pankaj Garg</strong>, Corporate Vice President (CVP), &amp; <strong>Vijayan Ramakrishnan</strong>, Vice-President (VP), Azure Core Networking.</p>\n<p>&nbsp;</p>\n<p>AI is changing how enterprises build applications, empower employees, and deliver value. It is also changing what security teams must protect. Enterprise AI agents introduce new entry points for manipulation. Sensitive information can leave the organization through a single upload to a generative AI application. Meanwhile, unfamiliar malware and emerging application exploits continue to challenge existing defenses.</p>\n<p>Security teams need protection that can understand new threats, act while traffic is in motion, and help organizations adopt AI responsibly – without adding friction to every application or overwhelming already stretched teams.</p>\n<p>At Microsoft Ignite, we are announcing a new add-on to&nbsp;<strong>Azure Firewall Premium</strong> with five capabilities designed for these challenges: inline AI anti-malware, inline AI application protection, prompt injection protection, network data loss prevention, and AI policy.</p>\n<p>These capabilities bring together two priorities:&nbsp;<strong>secure with AI</strong>, using specialized models to identify threats inline; and <strong>secure AI</strong>, helping protect enterprise AI applications and the sensitive data employees use with them. AI policy connects this protection to daily operations, helping teams make better decisions using intelligence across firewall policies and traffic.</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Secure with AI: Intelligence where prevention happens</strong></p>\n<p>For network security, understanding a threat is only part of the challenge. That understanding must arrive in time to stop it.</p>\n<p>Our approach brings highly tuned small AI models directly into the network inspection path. Running on CPUs and engineered for line-speed operation, these models provide semantic analysis for malware and application attacks. They examine characteristics of the content moving through the firewall to recognize malicious patterns, including threats that may not have a known signature.</p>\n<p>&nbsp;</p>\n<ol>\n<li><strong> Inline AI anti-malware: Classify unknown threats without detonation</strong></li>\n</ol>\n<p>An unfamiliar binary presents a difficult choice: allow it before its risk is understood, or hold it while deeper analysis completes.</p>\n<p>Traditional sandbox analysis executes suspicious files in an isolated environment and observes their behavior. That process can be resource intensive and take several minutes – sometimes five to ten – making it difficult to fit into an inline inspection path. Analysis often happens out of band, creating a gap between delivery and a verdict. Sophisticated malware can also recognize a sandbox and suppress its malicious behavior, limiting what the analysis reveals.</p>\n<img />\n<p>Azure Firewall takes a different approach. Its inline AI anti-malware capability uses a specialized small language model to analyze assembly opcodes – the instructions that make up executable code – alongside other properties of a binary. Trained on millions of samples capturing malicious behavior, the model classifies known and previously unseen binaries as malicious or benign without executing them.</p>\n<p><strong>Classification happens inline, with sub-second latency.</strong> Because the model does not depend on a sample revealing its behavior during detonation, it addresses an important source of sandbox evasion and brings detection into the moment when the firewall can enforce a decision.</p>\n<p>For customers, this means faster decisions about unfamiliar files and protection that acts while the content is crossing the network.</p>\n<p>&nbsp;</p>\n<ol start=\"2\">\n<li><strong> Inline AI application protection: Recognize emerging exploits</strong></li>\n</ol>\n<p>Enterprise applications remain targets for attacks that manipulate inputs, exploit vulnerabilities, and seek unauthorized access to systems or data. New vulnerabilities and variations of existing attacks create a continuing challenge for security teams.</p>\n<img />\n<p>Azure Firewall’s inline AI application protection applies specialized models to identify malicious requests across&nbsp;<strong>more than 35 attack categories</strong>, including SQL injection and path traversal.</p>\n<p>By analyzing attack characteristics within application traffic, these models help recognize new and emerging exploit attempts alongside familiar attack patterns. Inspection and enforcement happen inline, enabling the firewall to intervene as requests traverse the network.</p>\n<p>Together, AI anti-malware and AI application protection extend network defenses with intelligence designed to recognize threats beyond previously cataloged examples.</p>\n<p>&nbsp;</p>\n<p><strong>Secure AI: Shared safeguards for enterprise adoption</strong></p>\n<p>As generative AI applications and agents spread across an organization, protection can become fragmented. Individual application teams may implement different safeguards, while employees use additional AI services outside those teams’ control.</p>\n<p>The network provides a shared enforcement point for applying protection consistently across traffic routed through Azure Firewall.</p>\n<p>&nbsp;</p>\n<ol start=\"3\">\n<li><strong> Prompt injection protection: Protect AI applications at the network layer</strong></li>\n</ol>\n<p>A malicious prompt can attempt to override an AI application’s instructions, bypass safeguards, or redirect an enterprise agent toward unauthorized behavior. Protecting against these attempts becomes harder as the number of applications and agents grows.</p>\n<p>&nbsp;</p>\n<img />\n<p>Azure Firewall integrates with&nbsp;<strong>Azure AI Content Safety Prompt Shields</strong>, using more than 25 AI models operating in parallel to assess prompts inline for malicious instructions and jailbreak attempts.</p>\n<p>We are starting with <strong>user prompt injection attacks</strong>, also called direct prompt injection. Protection against indirect prompt injection – malicious instructions embedded in external content consumed by an AI application – is planned for the future.</p>\n<p>Customers connect their own Azure AI Content Safety resource to Azure Firewall, retaining control of their filtering configuration and applicable thresholds. This brings centrally managed prompt protection to supported AI traffic without requiring application code changes to add the network control.</p>\n<p>Our longer-term direction is to expand this flexibility so customers can bring their own content filters from additional sources.</p>\n<p>For security teams, the benefit is a consistent enforcement point across enterprise generative AI applications, reducing the need to implement the same network protection separately in every app.</p>\n<p>&nbsp;</p>\n<ol start=\"4\">\n<li><strong> Network DLP: Extend enterprise data protection to AI traffic</strong></li>\n</ol>\n<p>Responsible AI adoption also requires control over the information employees share. A document uploaded to an unsanctioned AI service can contain intellectual property, customer information, or other sensitive enterprise data.</p>\n<p>With <strong>Microsoft Purview integration</strong>, Azure Firewall brings network data loss prevention to traffic headed toward generative AI and cloud applications.</p>\n<img />\n<p>Azure Firewall extracts content attached to supported outbound web requests and sends it to Microsoft Purview for sensitive information classification and policy evaluation. It then enforces the returned decision inline, helping prevent sensitive content from leaving through prohibited destinations.</p>\n<p>This extends customers’ existing Purview data protection policies into network enforcement. Security teams can apply established definitions of sensitive information to supported application traffic, including uploads to unsanctioned AI services.</p>\n<p>The result is a practical foundation for responsible AI use: employees can access AI tools within organizational boundaries, while security teams gain a shared control for protecting enterprise data in transit.</p>\n<p>&nbsp;</p>\n<ol start=\"5\">\n<li><strong> AI policy: Connect configured intent with actual traffic</strong></li>\n</ol>\n<p>Effective protection also depends on policies that remain understandable and efficient as applications, traffic, and business requirements change.</p>\n<p>With <strong>AI policy</strong>, Azure Firewall brings AI reasoning across both customer-configured policies and the traffic those policies govern. Correlating these signals helps teams understand how policy intent translates into actual network behavior – and where changes may improve operations.</p>\n<p>&nbsp;</p>\n<img />\n<p>For example, AI policy can identify a frequently matched rule positioned at a lower processing priority and recommend reviewing its placement. Where rule dependencies and intended behavior permit, moving it earlier can improve processing efficiency.</p>\n<p>AI policy also applies this combined understanding to anomaly detection, helping surface unusual traffic patterns in the context of the rules that allow or deny them.</p>\n<p>These insights give administrators recommendations grounded in how their firewall is actually used, helping them maintain effective policies as their environments evolve.</p>\n<p>&nbsp;</p>\n<p><strong>Build AI confidence into the network</strong></p>\n<p>Enterprise AI adoption brings new opportunities and new security decisions. Organizations need to protect AI applications from manipulation, keep sensitive information within approved boundaries, and defend existing workloads against evolving threats.</p>\n<p>The new Azure Firewall Premium add-on brings these needs together: specialized AI that inspects threats inline, integrated controls that help secure AI use, and policy intelligence informed by real traffic.</p>\n<p><strong>Secure with AI. Secure AI. Bring both to the network with Azure Firewall.</strong></p>"
  "e3fe304cde5328b782f092102a925ed2":
    "id": "e3fe304cde5328b782f092102a925ed2"
    "title": "The patch window is closing. Put time back on the defender’s side."
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/the-patch-window-is-closing-put-time-back-on-the-defender-s-side/ba-p/4573401"
    "published": "2026-11-18 03:42:19"
    "fetched": "2026-11-18 03:49:32"
    "summary": "<p><em>Author – <strong>Ashish Jain</strong>, Partner Group Product Manager, Network &amp; AI Security, Azure Core Networking.</em></p>\n<p>&nbsp;</p>\n<p>A critical vulnerability is announced. Your security team identifies affected workloads. Application owners begin testing the fix. Deployment plans take shape.</p>\n<p>Attackers are already moving.</p>\n<p>For defenders, patching requires care: understanding dependencies, validating compatibility, protecting availability, and coordinating changes across production environments. For attackers, a single exploitable path can be enough.</p>\n<p>AI is widening that imbalance. Defenders need protection that can understand emerging threats, recognize where they matter, and act while patching is still underway.</p>\n<p>Today at Microsoft Ignite, we are announcing <strong>Azure Adaptive Virtual Patching</strong>, an AI-based adaptive shield designed to proactively reduce exposure to new, emerging, and zero-day vulnerabilities. It connects vulnerability intelligence and workload context with coordinated protection <strong>across the network and on the workload</strong>.</p>\n<p>Our goal is straightforward: <strong>put power – and time – back in the hands of defenders.</strong></p>\n<p>&nbsp;</p>\n<img />\n<p><strong>Turning the adaptive security vision into protection</strong></p>\n<p>In his August 2026 blog, <a href=\"https://azure.microsoft.com/en-us/blog/the-patch-window-is-collapsing-why-security-needs-a-new-control-plane/\" rel=\"noopener\" target=\"_blank\">“The patch window is collapsing: Why security needs a new control plane,”</a> Igor Sakhnov, Corporate Vice President and General Manager for Azure Networking, described a growing customer challenge: knowing that a workload is vulnerable does not mean an organization can immediately patch it. He outlined the opportunity for the network to serve as an adaptive control plane that reduces exposure during that interval.</p>\n<p>Azure Adaptive Virtual Patching advances that vision into a new product capability.</p>\n<p>It connects an understanding of how vulnerabilities work with an understanding of the workloads customers actually run. AI then orchestrates targeted mitigations through network-based controls, including inline intelligence, and eBPF-based runtime enforcement on the workload.</p>\n<p>Together, these capabilities bring protection to multiple points along an attack path while customers prepare the permanent fix.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>The attack timeline has changed. Production responsibilities have not.</strong></p>\n<p>Microsoft’s <a href=\"https://www.microsoft.com/en-us/security/blog/2026/04/02/threat-actor-abuse-of-ai-accelerates-from-tool-to-cyberattack-surface/\" rel=\"noopener\" target=\"_blank\">threat research</a> shows adversaries embedding AI into how they plan, refine, and sustain attacks. AI accelerates research, code development, and iteration across the attack lifecycle.</p>\n<p>Attackers can also access <em>special models</em>: models modified to weaken or remove safety refusal behavior. Research has found that models fine-tuned to remove safeguards can provide substantially more assistance with malicious tasks, further lowering barriers to misuse.</p>\n<p>These capabilities can help adversaries move from vulnerability information to attack development faster than customers can responsibly test and deploy a fix.</p>\n<p>A production change still requires validation. A critical service still has availability commitments. A maintenance window still needs coordination.</p>\n<p>Customers should not have to choose between rushing an untested patch into production and leaving a known attack surface exposed.</p>\n<p>Meeting this challenge requires AI-orchestrated defense that continuously connects emerging threats to customer environments – and translates that understanding into protection.</p>\n<p>&nbsp;</p>\n<p><strong>Three semantic layers. One adaptive defense.</strong></p>\n<p>Azure Adaptive Virtual Patching uses three connected semantic layers to move from vulnerability understanding to workload-specific mitigation.</p>\n<ol>\n<li><strong> Understand the vulnerability.</strong></li>\n</ol>\n<p>The first layer builds a semantic knowledge graph of vulnerabilities, including emerging and newly disclosed zero-days. It connects affected components, exploit prerequisites, vulnerable behaviors, and potential mitigations.</p>\n<p>The objective goes beyond recognizing a vulnerability identifier. It is to understand which software is involved, what conditions an attacker needs, and where controls could interrupt exploitation.</p>\n<p>As intelligence develops, that understanding evolves with it.</p>\n<ol start=\"2\">\n<li><strong> Understand the customer’s Azure environment.</strong></li>\n</ol>\n<p>The second layer builds a semantic knowledge map of the customer’s Azure estate.</p>\n<p>It brings together telemetry about running processes, installed modules, operating systems, open ports, and other workload characteristics to understand how systems are configured and exposed.</p>\n<p>The presence of a software package is only part of the picture. Exposure also depends on whether a vulnerable component is running, how it is used, and which network paths make it reachable.</p>\n<p>This layer grounds vulnerability intelligence in each workload’s operational context.</p>\n<ol start=\"3\">\n<li><strong> Understand exposure – and orchestrate protection.</strong></li>\n</ol>\n<p>The third layer combines the first two to determine the relevant attack surface and corresponding mitigation.</p>\n<p>The service’s AI core reasons across vulnerability prerequisites, workload configuration, and network exposure to orchestrate protection at the appropriate enforcement points. Depending on the vulnerability and workload, this can involve network mitigations, local runtime controls, or a coordinated combination.</p>\n<p>Together, the layers connect <strong>what the threat requires, what the customer runs, and where protection can interrupt the attack.</strong></p>\n<p>&nbsp;</p>\n<p><strong>Protection across the network and on the workload</strong></p>\n<p>The adaptive shield brings together two complementary forms of enforcement.</p>\n<p><strong>Network-based mitigations use the network as a compensating control.</strong> Multiple network defenses, including inline intelligence, help identify and interrupt exploit-related traffic and constrain the paths through which vulnerable workloads can be reached.</p>\n<p>This gives defenders a way to reduce exposure while the underlying software remains unpatched. The network becomes an active protection layer, applying controls around the workload while remediation proceeds.</p>\n<p><strong>Workload-based mitigations address relevant runtime behavior.</strong> Using eBPF-based enforcement, the service can apply granular controls at supported execution points on the workload itself.</p>\n<p>The AI core coordinates these capabilities according to the vulnerability and the customer’s environment. A network control may constrain an incoming attack path, while a workload policy addresses the runtime operation that makes exploitation possible.</p>\n<p>This combination expands the opportunities to interrupt an attack and tailor protection to the exposed resource.</p>\n<p><strong>From protected resource to protected execution</strong></p>\n<p>Customers bring workloads under the adaptive shield by adding them as <strong>protected resources</strong>. A <strong>neuron extension</strong> is then installed on each onboarded workload, connecting that resource to the service’s AI core.</p>\n<p>The extension collects telemetry that helps the AI core understand the workload’s exposure and attack surface. It also deploys workload mitigations as instructed by the AI core.</p>\n<img />\n<p>Alongside those local mitigations, the service orchestrates network-based protection to address the relevant exposure paths.</p>\n<p>This creates a continuous feedback loop: telemetry informs understanding, understanding informs mitigation, and coordinated enforcement puts protection into effect across the network and workload.</p>\n<p>&nbsp;</p>\n<p><strong>AI-synthesized policies. Granular runtime enforcement.</strong></p>\n<p>On the workload, mitigations are deployed through <strong>Tetragon</strong>, using eBPF-based security across user-mode and kernel-mode execution paths as needed and supported.</p>\n<p><a href=\"https://tetragon.io/\" rel=\"noopener\" target=\"_blank\">Tetragon</a> provides security observability and runtime enforcement, including visibility into process execution, system calls, and file and network activity. Its <a href=\"https://tetragon.io/docs/reference/tracing-policy/\" rel=\"noopener\" target=\"_blank\">policy framework</a> supports hooks in kernel and user-space code, allowing policies to target specific operations and take defined actions when their conditions match.</p>\n<p>The AI core synthesizes Tetragon policies dynamically, making them highly specific to each workload’s software, configuration, and relevant exploit conditions. The neuron extension deploys those policies to the corresponding protected resource.</p>\n<p>Two workloads affected by the same vulnerability may run different binaries, load different modules, or expose different network paths. Their protections should reflect those differences.</p>\n<p>&nbsp;</p>\n<p><strong>AI adaptability with deterministic protection</strong></p>\n<p>Production security demands predictable, reliable behavior.</p>\n<p>A central innovation in Azure Adaptive Virtual Patching is bringing AI-driven reasoning together with deterministic enforcement. AI interprets vulnerability information and workload context, then translates that understanding into defined mitigation controls.</p>\n<p>For workload protection, synthesized Tetragon policies express explicit matching conditions and enforcement actions. Once deployed, those policies enforce the defined behavior locally without requiring a new generative AI decision for every matching event.</p>\n<p>Across the Adaptive Shield, the principle is consistent: <strong>AI determines the appropriate protection; defined controls make enforcement predictable.</strong></p>\n<p>&nbsp;</p>\n<p><strong>Autonomous preparation for emerging threats</strong></p>\n<p>When actionable intelligence about a newly announced zero-day becomes available, AI-based training pipelines can trigger autonomously to prepare defenses at scale.</p>\n<p>The pipelines develop an understanding of exploit conditions and candidate protections. The semantic layers connect that learning to customer environments, and the AI core prepares workload-specific mitigations across the available network and runtime enforcement points.</p>\n<p>The result is a continuous cycle: understand the threat, assess exposure, prepare mitigation, enforce protection, and adapt as intelligence or workload conditions change.</p>\n<p>Proactive, pre-emptive defense means acting on those conditions before an attack succeeds.</p>\n<p>&nbsp;</p>\n<p><strong>HTTP/2 Bomb (CVE-2026-49975): interrupting resource exhaustion</strong></p>\n<p>HTTP/2 Bomb demonstrates how legitimate protocol features can combine into a disruptive attack.</p>\n<p>The original research describes header compression amplification combined with stalled streams. Small requests can cause disproportionate server memory consumption, while flow-control behavior keeps resources occupied. Request size alone does not capture the risk: header counts, allocation behavior, and stream lifetime also matter.</p>\n<p><strong>In our testing, Azure Adaptive Virtual Patching successfully mitigated HTTP/2 Bomb attacks.</strong></p>\n<p>The semantic layers connect the resource-exhaustion mechanism with the server implementation, runtime environment, and network exposure of the protected resource.</p>\n<p>That context informs where protection should apply. Network-based mitigations can address exploit-related traffic at an appropriate inspection point, while workload enforcement can target relevant runtime behavior. The service orchestrates the applicable controls for the workload.</p>\n<p>This approach connects the incoming attack path to the behavior it triggers inside the server, supporting more precise protection while customers validate and deploy the permanent fix.</p>\n<p>&nbsp;</p>\n<p><strong>PHP2Shell: connecting network exposure to runtime exploitation</strong></p>\n<p>PHP2Shell presents a different challenge.</p>\n<p>The vulnerabilities, CVE-2026-109618 and CVE-2026-109619, involve PHP runtime memory handling and can enable unauthenticated remote code execution under exploitable conditions. The PHP project’s advisories describe <a href=\"https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w\" rel=\"noopener\" target=\"_blank\">out-of-memory corruption</a> and <a href=\"https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp\" rel=\"noopener\" target=\"_blank\">stale request state</a>, with exposure influenced by server integration, configuration, extensions, and application behavior.</p>\n<p><strong>In our testing, Azure Adaptive Virtual Patching successfully mitigated PHP2Shell attacks.</strong></p>\n<p>Telemetry from the neuron extension helps the AI core connect vulnerability prerequisites to the workload’s PHP processes, installed modules, and operating environment. Network context establishes how the affected service can be reached.</p>\n<p>Together, these inputs inform targeted mitigation: network controls can constrain relevant attack paths and exploit-related requests, while workload-specific runtime policies address applicable execution behavior.</p>\n<p>The tested outcome demonstrates the value of coordinated protection. PHP’s advisories also make clear that interim measures do not provide complete coverage across every exploitation route. Protection against tested attacks buys time; installing the fixed software remains essential.</p>\n<p>&nbsp;</p>\n<p><strong>Time to patch. Protection while you do.</strong></p>\n<p>Azure Adaptive Virtual Patching deploys mitigations; it does not install the software patch. Customers continue to validate and deploy fixes through their patching processes. Once the patch is deployed and remediation confirmed, the corresponding temporary mitigations can be rolled back.</p>\n<p>We are starting with <strong>Linux virtual machines and Virtual Machine Scale Sets on Azure</strong>. Over time, we plan to extend protection to additional workload types, including Windows-based workloads.</p>\n<p>As AI accelerates offensive capabilities, defenders need the same advantage in understanding, coordination, and action. Azure Adaptive Virtual Patching brings those capabilities together through an autonomous adaptive shield – using the network as a compensating control and granular runtime enforcement to protect workloads while customers patch.<strong>&nbsp;</strong></p>\n<p><strong>The patch window is closing. We are putting time back on the defender’s side.</strong></p>"
  "fff06c7c7bbb3581d2580176c77d8a8a":
    "id": "fff06c7c7bbb3581d2580176c77d8a8a"
    "title": "Introducing Agent Grid"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/introducing-agent-grid/ba-p/4573407"
    "published": "2026-11-18 03:42:08"
    "fetched": "2026-11-18 03:49:32"
    "summary": "<p>A single request to an AI agent can set an entire network in motion.</p>\n<p>To prepare a customer briefing, an agent might consult a large language model, delegate research to another agent, invoke an MCP tool, query a platform service, retrieve records from a SaaS application, and search the internet. Multiple such hops combine into a single business transaction.</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Agentic traffic is a web of interactions:</strong> Agent to model, agent to agent, agent to MCP server, agent to PaaS, agent to SaaS, and agent to internet. Each connection introduces a security decision. Together, they create a challenge that grows with every agent, tool, and delegation.</p>\n<p>Where should enterprises enforce security across this web? Deploying another gateway for every interaction multiplies infrastructure, routing complexity, and policies to maintain. Consolidating everything behind a single gateway can introduce a bottleneck and a single point of failure. A gateway-by-gateway approach becomes increasingly difficult to scale as workflows cross hosting environments and trust boundaries.</p>\n<img />\n<p>At Microsoft Ignite, we are announcing&nbsp;<strong>Agent Grid: Identity-based, Zero Trust secure network access for agents.</strong> Agent Grid brings network isolation, micro-segmentation, inspection, and granular Layer 3–7 policies into Azure’s network infrastructure. Its context- and content-aware controls help enterprises govern agent communications across supported environments, without modifying agent code or managing sidecars.</p>\n<p>&nbsp;</p>\n<p><strong>Agents are untrusted insiders</strong></p>\n<p>Agents operate inside enterprise environments with legitimate access to sensitive information and powerful tools. Yet malicious content, compromised dependencies, or unexpected model behavior can redirect their actions.</p>\n<p>The security premise must therefore be clear: <strong>Agents are untrusted insiders.</strong> Their access needs enforceable boundaries that remain effective when an agent behaves unsafely.</p>\n<p><a href=\"https://x.com/satyanadella/status/2108931348857827686\" rel=\"noopener\" target=\"_blank\">Satya Nadella’s call for stronger AI containment</a> reflects this principle: assume a model could be compromised and build independent controls to contain its actions.</p>\n<p>A recent, publicly documented research incident illustrates why. During a frontier-model training run, an internal model exploited a DNS resolver misconfiguration to obtain limited access to the live internet, crossing an intended containment boundary. In a separate incident, AI agents reportedly attempted to attack or penetrate a public model-sharing platform – an episode that indirectly echoed concerns associated with major open-source AI hubs. The incidents were contained, and training and evaluation of the most capable models were paused while defenses were strengthened.</p>\n<p>Subsequent controlled testing uncovered additional weaknesses, including ways to escape isolated execution environments and use permitted infrastructure services as indirect paths to external systems. These adversarial research settings differ from customer production deployments, but the architectural lesson applies: Containment requires overlapping execution, network, and monitoring controls.</p>\n<p>For enterprises, this means <strong>placing security enforcement outside the agent’s trust boundary</strong>. A compromised agent should not control the rules governing its own communications.</p>\n<p>&nbsp;</p>\n<p><strong>The customer challenge is bigger than connectivity</strong></p>\n<p>Enterprises need agents to reach the resources required to complete their work. But permission to connect does not establish permission to perform every available operation.</p>\n<p>A trusted MCP server might expose both a search tool and a destructive delete operation. An approved domain might host both necessary APIs and restricted endpoints. A legitimate support ticket might carry malicious instructions to export customer records.</p>\n<p>These interactions also span heterogeneous environments. An agent on Azure Kubernetes Service (AKS) might delegate work to an agent in Azure Container Instances (ACI), with both accessing models, enterprise services, and external tools.</p>\n<p>Security teams need to establish which workload is communicating, constrain its permitted destinations and operations, inspect relevant content, and understand enforcement outcomes across those environments. When suspicious activity emerges, they need a way to contain affected workloads without depending on the agents themselves.</p>\n<p>Separate controls for every runtime and communication path make this difficult. Customers need a common security model that follows workload identity and understands agent interactions.</p>\n<p>&nbsp;</p>\n<p><strong>Zero Trust network access for the agentic enterprise</strong></p>\n<p>Agent Grid brings these requirements together in a shared network security layer across supported Azure substrates.</p>\n<p><strong>Network isolation and micro-segmentation</strong> constrain which agents, tools, and services can communicate. Identity-based policies establish explicit boundaries between workloads, helping limit lateral movement and unnecessary access.</p>\n<p><strong>Context-aware enforcement</strong> uses verified workload identity, destination, protocol, and the requested MCP tool operation to evaluate communications. <strong>Content-aware inspection</strong> examines supported application traffic and integrates prompt-injection protection.</p>\n<p>Together, these capabilities give enterprises granular control across Layers 3–7, from network access to application and tool interactions.</p>\n<p>&nbsp;</p>\n<p><strong>Transparent, agent-aware inspection</strong></p>\n<p>Agent Grid provides network-level security and Layer 3–7 visibility into interactions among agents, MCP servers, models, and external services.</p>\n<p>Enforcement operates in Azure’s network infrastructure, outside the agent’s sandbox. Customers can apply supported inspection and filtering policies without changing agent code or deploying customer-managed sidecars.</p>\n<p>This makes security an infrastructure capability that administrators can manage independently of agent development.</p>\n<p>&nbsp;</p>\n<p><strong>Granular policies and MCP tool governance</strong></p>\n<p>Trusting an MCP server should not automatically authorize every tool it exposes.</p>\n<p>Agent Grid inspects MCP protocol interactions and enforces tool-level allow and block policies. An enterprise can permit an agent to retrieve support records while restricting tools that delete records, modify configurations, or initiate sensitive operations – even on the same trusted server.</p>\n<img />\n<p>These controls complement authorization at the destination service, adding an independent enforcement boundary for tool use.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Consistent policies across substrates</strong></p>\n<p>Agent Grid provides centralized management of FQDN, URL, and application-layer security policies across onboarded workloads on supported Azure hosting environments.</p>\n<img />\n<p>Security teams can express common security intent and see enforcement outcomes across environments. Customers can choose an execution model for its isolation and operational requirements while maintaining consistent network protection.</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Verified identity and secure connectivity</strong></p>\n<p>Agent Grid uses SPIFFE standards and SPIRE-based attestation to cryptographically establish workload identity for all workloads including agents and MCP servers. Attestation verifies workload authenticity and provenance against configured trust criteria.</p>\n<p>Verified identities support granular access policies and mutually authenticated, encrypted connectivity using mutual TLS (mTLS), independent of IP addresses or the underlying compute substrate.</p>\n<p>Where TLS inspection is configured, authorized inspection becomes an explicit part of the protected path: traffic is decrypted for policy evaluation and re-encrypted onward, using platform provided managed-certificates.</p>\n<p>&nbsp;</p>\n<p><strong>Observability and visibility across agent interactions</strong></p>\n<p>Agent Grid provides a centralized view of agent communications through live inspection logs as well as an interactive flow map, connecting workload identities with the agents, MCP servers, models, and external destinations they access. Security teams can distinguish allowed and denied requests, examine communication patterns, and filter activity by time, source, destination, and policy verdict to understand how network policies are being enforced.</p>\n<p>This visibility helps teams investigate unexpected connections, identify unauthorized access attempts, and refine policies based on observed behavior. Integration with Azure Monitor and Log Analytics supports deeper investigation and alerting, while retained flow records preserve visibility into short-lived workloads after they leave the grid.</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>What we are announcing at Ignite</strong></p>\n<p>The Agent Grid preview supports three execution options:</p>\n<ul>\n<li><strong>ACI Agent Groups:</strong> A new virtualization-based isolation option for agent workloads, with serverless execution through Azure Container Instances.</li>\n<li><strong>AKS Agent Sandbox:</strong> Isolated agent execution using Kata Containers, combining virtualization-based boundaries with Kubernetes orchestration.</li>\n<li><strong>Native Kubernetes workloads on AKS:</strong> Network protection for onboarded workloads running directly on AKS.</li>\n</ul>\n<img />\n<p>Across these supported environments, we are announcing five policy capabilities:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Capability</strong></p>\n</td><td>\n<p><strong>Customer control</strong></p>\n</td></tr><tr><td>\n<p><strong>TLS inspection</strong></p>\n</td><td>\n<p>Inspect supported encrypted application traffic at an authorized enforcement point.</p>\n</td></tr><tr><td>\n<p><strong>FQDN filtering</strong></p>\n</td><td>\n<p>Restrict access to approved domain names.</p>\n</td></tr><tr><td>\n<p><strong>URL filtering</strong></p>\n</td><td>\n<p>Apply finer-grained restrictions to destinations within a domain.</p>\n</td></tr><tr><td>\n<p><strong>Granular MCP filtering</strong></p>\n</td><td>\n<p>Allow or block specific MCP tool invocations.</p>\n</td></tr><tr><td>\n<p><strong>Azure Content Safety (ACS) integration for Prompt Shields</strong></p>\n</td><td>\n<p>Inspect supported content for prompt-injection attacks and apply configured protection policies.</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>These policies provide complementary safeguards. Destination filtering constrains where an agent can communicate. MCP filtering governs which tools it can invoke. Content inspection helps detect malicious instructions within supported traffic.</p>\n<p>&nbsp;</p>\n<p><strong>How it works</strong></p>\n<p>Agent Grid combines centralized governance with security embedded across supported Azure hosting environments. A regional control plane manages policies and SPIRE-based workload identity, while platform-integrated network brokers capture agent traffic outside the agent’s trust boundary, without code changes or customer-managed sidecars. The brokers establish mutually authenticated, encrypted connections using mTLS and route traffic into a grid-scoped security boundary, where managed proxies, policy engines, and content inspection services enforce network access, segmentation, and granular application and MCP tool policies. This architecture delivers consistent protection across hosting environments, with protection services that scale independently of agent compute.</p>\n<img />\n<p>Agent Grid separates workload execution, security administration, and traffic enforcement through three architectural layers.</p>\n<ol>\n<li><strong> Connect and protect workloads outside their trust boundary.</strong><br />An Azure-managed network enforcement component connects onboarded workloads to Agent Grid. It operates outside the agent’s sandbox, establishes attested workload identity, and applies network access and traffic-redirection policies without requiring application changes or customer-managed sidecars.</li>\n<li><strong> Define and coordinate policy centrally.</strong><br />A managed control plane coordinates workload enrollment, identities, and policy distribution. Administrators define isolation, micro-segmentation, destination access, and inspection requirements centrally, with enforcement applied across participating environments.</li>\n<li><strong> Inspect and enforce in managed protection services.</strong><br />Traffic requiring inspection passes through Azure-managed protection services over authenticated, encrypted connections. These services evaluate supported application traffic, MCP tool calls, and content against configured policies, then allow or block the interaction and provide enforcement visibility.</li>\n</ol>\n<p>Protection services scale independently of agent compute. Distributed enforcement close to workloads, combined with centrally managed policies and scalable inspection, addresses the operational burden of assembling a separate gateway deployment for every agent interaction.</p>\n<p>The architectural principle is straightforward: <strong>Agents execute tasks; infrastructure enforces their communication boundaries.</strong></p>\n<p>&nbsp;</p>\n<p><strong>Customer Scenarios</strong><strong> </strong></p>\n<p><strong>Example scenario 1 – Preventing unauthorized actions across a delegated workflow</strong></p>\n<p>An employee asks an agent on AKS to prepare a customer briefing covering account status, support issues, and renewal risks.</p>\n<img />\n<p>The agent delegates research to a second agent in an ACI Agent Group. That agent queries an approved MCP server for read-only customer records and support tickets.</p>\n<p>One ticket contains malicious instructions to export customer data to an external website and modify the account.</p>\n<p>Agent Grid provides independent controls along the workflow:</p>\n<ul>\n<li>Identity-based policies restrict communication to authorized workloads and services.</li>\n<li>Prompt shields inspection can detect malicious instructions in supported inspected content.</li>\n<li>FQDN and URL policies block access to the unauthorized external destination.</li>\n<li>MCP tool policies permit approved retrieval operations while blocking account-modification tools.</li>\n</ul>\n<p>Resource authorization continues to enforce read-only permissions at the destination. Network and tool controls provide additional boundaries if the agent follows the injected instruction.</p>\n<p>Security teams can inspect enforcement outcomes across the participating environments while the authorized briefing workflow remains bounded by policy.</p>\n<p>&nbsp;</p>\n<p><strong>Example scenario 2 – An emergency brake for agent communications</strong></p>\n<p>An enterprise operates collaborating agents across onboarded ACI and AKS environments. The agents have approved access to internal services, tools, other agents, and selected internet destinations.</p>\n<img />\n<p>Security telemetry indicates suspected compromise. Administrators need to stop the activity immediately, without waiting for individual application teams to change code or for agents to obey a shutdown instruction.</p>\n<p>An emergency containment policy provides a <strong>“contain all agents”</strong> action across the onboarded estate. The policy overrides existing network permissions, terminates active connections, and blocks new inbound and outbound communications.</p>\n<p>Affected agents lose network access to other agents, tools, internal resources, and the internet, regardless of their supported hosting environment.</p>\n<p>Because enforcement sits outside the agent’s trust boundary, containment does not depend on the agent’s cooperation. It gives security teams an infrastructure-level emergency brake while they investigate and determine how to restore access.</p>\n<p>&nbsp;</p>\n<p><strong>Build agent autonomy on enforceable control</strong></p>\n<p>Enterprises need agents that can perform meaningful work across a growing web of models, tools, services, and other agents. Every additional capability increases the importance of controlling those connections.</p>\n<p>Agent Grid brings identity-based Zero Trust access, network isolation, micro-segmentation, and context- and content-aware inspection into a common Azure network security layer.</p>\n<p>By making those controls independent of agent behavior, Agent Grid helps customers expand agent autonomy while retaining authority over where agents communicate and which operations they can invoke.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><em>Meet the team:</em></p>\n<p><em>Product -&nbsp;</em><br /><em>Ashish Jain, </em><em>Shahzad Khalid</em></p>\n<p><em>Engineering -</em><br /><em>Chandan Aggarwal, </em><em>Neha Aggarwal, Alice Lin, Anubhab Majumdar, Apurup Chevuru, Bekzod Alibayev, Gokul Premkumar, Isaiah Raya, Jacques Massa, Kshitija Murudi, Mathew Merrick, Matthew Long, Quang Nguyen, Riya Jain, Sai Karthik Kosuri, Santhosh Prabhu, Sarath Sanam, Vanessa Chammas, Vipul Singh</em></p>"
  "90110906de7ba936df4dc5a6d7b5d3b0":
    "id": "90110906de7ba936df4dc5a6d7b5d3b0"
    "title": "From recordings to insights: Azure Bastion brings AI to privileged session review"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/from-recordings-to-insights-azure-bastion-brings-ai-to/ba-p/4573409"
    "published": "2026-11-18 03:41:56"
    "fetched": "2026-11-18 03:49:32"
    "summary": "<p>A privileged session can last an hour. A risky action can take seconds.</p>\n<p>For security teams, finding those seconds has often meant watching the entire recording. Multiply that effort across administrators, virtual machines, and daily operations, and even a small or midsize enterprise can accumulate more footage than its teams can reasonably review.</p>\n<p>The evidence exists. The challenge is turning it into understanding.</p>\n<p>At Microsoft Ignite, we are announcing the public preview of <strong>RDP vision, SSH vision, and SSH command logs in Azure Bastion</strong>. These capabilities bring AI-assisted session review and detailed command visibility to privileged access, helping customers understand what happened and identify activity that deserves closer attention.</p>\n<p>Together, they extend the value of session recording: from preserving administrative activity to helping security teams make sense of it.</p>\n<p>&nbsp;</p>\n<p><strong>The challenge: recording sessions is only the beginning</strong></p>\n<p>Privileged access is essential to keeping systems running. Administrators troubleshoot applications, update configurations, manage permissions, and maintain critical infrastructure. Those same privileges can also enable actions with significant security consequences.</p>\n<p>Azure Bastion already supports graphical session recording for both RDP and SSH through its Premium offering, preserving a visual record of activity for review. <a href=\"https://learn.microsoft.com/en-us/azure/bastion/session-recording\" rel=\"noopener\" target=\"_blank\">Learn more about Azure Bastion session recording</a>.</p>\n<p>But a recording does not explain itself.</p>\n<p>To understand a session, a reviewer may need to follow desktop interactions, interpret terminal activity, and distinguish routine administration from actions that warrant investigation. When a question arises about a particular change, finding the relevant activity can require substantial playback and analysis.</p>\n<p>This is not a challenge reserved for the largest organizations. A lean IT team managing a modest environment can generate a considerable volume of recordings through everyday maintenance and support. The time needed to review those sessions competes directly with the time needed to operate and protect the business.</p>\n<p>Customers need a more scalable way to answer fundamental questions: What happened during this session? Which actions deserve attention? Where should an investigator look next?</p>\n<img />\n<p><strong>Introducing a clearer view of privileged activity</strong></p>\n<p>The new Azure Bastion capabilities address this challenge through complementary forms of visibility.</p>\n<p>&nbsp;</p>\n<p><strong>RDP vision: understand activity beyond the connection.</strong></p>\n<p>RDP vision brings AI-assisted analysis to recorded remote desktop sessions. Session summaries help reviewers understand administrative activity, while insights into noteworthy and potentially risky actions help focus follow-up.</p>\n<p>Instead of beginning every review with uninterrupted playback, teams can start with a concise account of the session and use the recording to examine the underlying context.</p>\n<p>This is particularly valuable for desktop-based administration, where understanding an action may depend on interpreting a sequence of visual interactions.</p>\n<p>&nbsp;</p>\n<p><strong>SSH vision: bring context to terminal sessions.</strong></p>\n<p>SSH vision applies AI-assisted review to recorded SSH sessions, helping teams understand terminal activity through session summaries and insights into noteworthy and potentially risky actions.</p>\n<p>A terminal recording can contain extensive activity. SSH vision helps reviewers establish what took place and decide which sessions merit deeper investigation, reducing the effort required to build that initial understanding.</p>\n<p>&nbsp;</p>\n<p><strong>SSH command logs: examine commands directly.</strong></p>\n<p>SSH command logs complement the visual recording and AI-assisted insights with a detailed record of SSH commands.</p>\n<p>For reviewers investigating command activity, this provides a more direct way to examine what was entered. Teams can use command detail alongside the session summary and recording to assess administrative actions in context.</p>\n<p>Each capability contributes a different perspective: a summary to orient the reviewer, activity insights to guide attention, and command detail to support deeper examination.</p>\n<p>&nbsp;</p>\n<p><strong>A more focused investigation workflow</strong></p>\n<p>Consider a security team investigating an unexpected configuration change.</p>\n<p>With recordings alone, the team may need to watch multiple sessions to determine which contain relevant activity. Longer sessions add review time, even when most of the activity is routine.</p>\n<p>With the new capabilities, reviewers can begin with RDP vision or SSH vision summaries to understand the sessions under investigation. They can examine surfaced activity to prioritize follow-up and, for SSH sessions, inspect command logs for additional detail. The underlying recordings remain available to validate findings and understand the broader sequence of events.</p>\n<p>This changes the starting point of an investigation. Reviewers begin with context that helps guide their work.</p>\n<p>AI-assisted insights support human judgment. Security teams assess the evidence, interpret business context, and decide what action to take.</p>\n<p>&nbsp;</p>\n<p><strong>Security innovation for the AI era</strong></p>\n<p>As organizations adopt AI and accelerate the pace of their operations, security teams need ways to manage growing volumes of activity without a corresponding increase in manual review.</p>\n<p>Azure Bastion applies AI to a concrete customer problem: understanding privileged sessions at scale.</p>\n<p>The innovation lies in bringing together visual session evidence, AI-assisted interpretation across RDP and SSH, and detailed SSH command logs within the Bastion recording workflow. This combination helps customers connect secure administrative access with clearer oversight of what happens during that access.</p>\n<p>Built on Azure Bastion Premium session recording, with recordings stored in the customer’s designated Azure Storage account, these capabilities extend an established foundation with a new layer of insight.</p>\n<p>For customers, the value is practical: less effort spent establishing what happened, more focused investigation of activity that matters, and better use of the evidence they already capture.</p>\n<p>At Ignite, we are taking the next step in privileged access security – helping customers move from recording sessions to understanding them.</p>\n<p><strong>Explore </strong><a href=\"https://learn.microsoft.com/en-us/azure/bastion/bastion-overview\" rel=\"noopener\" target=\"_blank\"><strong>Azure Bastion</strong></a><strong> and evaluate how RDP vision, SSH vision, and SSH command logs can support your privileged-session review needs.</strong></p>\n<p>&nbsp;</p>\n<p>Meet the team:</p>\n<p><strong><em>Product -&nbsp;<br /></em></strong><strong><em>Ashish Jain – Partner Group Product Manager, Network Security, Azure Core Networking&nbsp;<br />Michael Aldridge - Principal Product Manager, Azure Core Networking<br /></em></strong><strong><em>Engineering -<br />Kapil Garg - Principal Engineering Manager, Azure Core Networking<br /></em></strong><em>Sreenivasulu Gummu - Principal Engineering Manager, Azure Core Networking</em></p>\n<p><strong><em>&nbsp;</em></strong></p>\n<p><strong><em>&nbsp;</em></strong></p>"
  "18b8f5737df62cde0240be618b149b69":
    "id": "18b8f5737df62cde0240be618b149b69"
    "title": "Connecting clouds and the last mile with Azure"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/connecting-clouds-and-the-last-mile-with-azure/ba-p/4573283"
    "published": "2026-11-18 03:41:38"
    "fetched": "2026-11-18 03:49:32"
    "summary": "<p><strong><span><span>By Sudha Mahajan, Partner PM, Azure Networking, and Pankaj Garg, CVP, Azure Networking</span></span><span>&nbsp;</span></strong></p>\n<p><span>In August, we introduced the public preview of Azure Multicloud Interconnect with Amazon Web Services (AWS) and described a simple goal: making the network the easiest part of a multicloud strategy, not the hardest. The preview replaced much of the customer-assembled work across circuits, routers, Border Gateway Protocol (BGP) sessions, encryption, and provider coordination with one logical resource and an integrated activation workflow.</span><span>&nbsp;</span></p>\n<p><span>Today, that journey advances in three important ways. Azure Multicloud Interconnect with AWS is now generally available. We are also announcing the public preview of Azure Multicloud Interconnect with Google Cloud, extending the same managed connectivity model to another cloud provider. And we are working with Lumen to simplify last mile connectivity into Azure, helping customers connect on-premises locations to Azure through a more integrated ExpressRoute and carrier experience.</span><span>&nbsp;</span></p>\n<p><span>Together, these announcements move Azure networking toward a consistent model across cloud-to-cloud and site-to-cloud connectivity: private paths, resilient infrastructure, provider-coordinated provisioning, and clear operational ownership, while customers retain control of their virtual networks, routing and security policies, and application architecture.</span><span>&nbsp;</span></p>\n<h4><span><span>The problem: distributed applications, fragmented connectivity</span></span><span>&nbsp;</span></h4>\n<p><span>Enterprises use multiple environments for practical reasons: distributed data and AI services, regulatory requirements, phased migrations, disaster recovery, mergers, partner ecosystems, and branch connectivity.</span><span>&nbsp;</span></p>\n<p><span>The challenge is creating a private, resilient, supportable, and end-to-end service. When customers must integrate across cloud and network providers themselves, provisioning can be slow, configuration problems difficult to isolate, and operational ownership</span><span> is</span><span> unclear.</span><span>&nbsp;</span></p>\n<h5><span><span>1 | AWS: from public preview to general availability</span></span><span>&nbsp;</span></h5>\n<p><span>At general availability, the service provides a production</span><span>-</span> <span>ready private connection built on Azure ExpressRoute and operated cooperatively by Microsoft and AWS. Redundant paths across physically separate locations reduce exposure to an isolated device, link, or site failure, while the providers coordinate the lifecycle of the managed connection.</span><span>&nbsp;</span></p>\n<h5><span>&nbsp;</span><span><span>What customers </span><span>can </span><span>gain</span></span><span>&nbsp;</span></h5>\n<ul>\n<li><span><span>A simpler path to production. </span></span><span><span>One logical resource and an integrated activation flow replace much of the provider-to-provider assembly work.</span></span></li>\n<li><span><span>Built-in resilience. </span></span><span><span>Redundant infrastructure across separate locations reduces exposure to an isolated device, link, or site failure.</span></span></li>\n<li><span><span>Clearer operations. </span></span><span><span>Microsoft and AWS coordinate the managed inter-provider connection, including maintenance and recovery of the underlying paths.</span></span></li>\n<li><span><span>Customer control where it matters. </span></span><span><span>Customers continue to own their cloud networks, route intent, security controls, application design, and recovery strategy.</span></span></li>\n</ul>\n<p><span><em>\"Applications, data and AI are more distributed than ever, and connectivity has to keep up. With AWS now generally available, Google Cloud in preview and Lumen simplifying the last mile, we're giving customers one consistent, resilient way to connect clouds and sites to Azure. Customers keep control of their networks, and the providers remove friction.\"</em><br /><strong>Igor Sakhnov, Corporate Vice President, Azure Networking, Microsoft</strong></span></p>\n<h4><span><span>2 | Google Cloud: extending the managed model in public preview</span></span><span>&nbsp;</span></h4>\n<p><span>The Google Cloud preview applies the managed model through a consistent Azure experience while adapting to provider-specific resources, authentication methods, interfaces, and operational processes. Customers create a logical interconnect, authorize the intended cloud account, and let the providers coordinate the underlying connection rather than reconciling those differences themselves.</span><span>&nbsp;</span></p>\n<p><span><span>What customers can </span><span>gain</span></span><span>&nbsp;</span></p>\n<ul>\n<li><span><span>A repeatable </span><span>multicloud</span><span> network pattern. </span></span><span><span>Teams can apply a more consistent approach as they connect Azure to another supported cloud.</span></span></li>\n<li><span><span>Greater </span><span>redundancy</span><span>. </span></span><span><span>Private connectivity can support distributed AI and analytics, persistent application dependencies, staged migrations, high-throughput data movement, and disaster recovery scenarios.</span></span></li>\n<li><span><span>A </span><span>flexible, enterprise-grade foundation</span><span>. </span></span><span><span>Customers </span><span>can </span><span>validate</span><span> workload-specific bandwidth,</span><span> availability, </span><span>and </span><span>security</span><span> profiles in staging to seamlessly tune network performance before scaling</span><span> production.</span></span></li>\n</ul>\n<p>\"<em>AI is pushing enterprises to run models, data, and agents across clouds, and the network shouldn't be what slows them down. By bringing partner Cross-Cloud Interconnect to Azure, Google Cloud and Microsoft are giving customers private, high-bandwidth connectivity between the two clouds in minutes, jointly supported by both providers. It's another step toward the open, unified multicloud experience that Google Cloud's Cross-Cloud Network is built to deliver</em>.\" '</p>\n<p><strong>Himanshu Mehra, Director of Product Management, Google Cloud</strong></p>\n<h4><span><span>3 | Lumen: simplifying the last mile into Azure</span></span><span>&nbsp;</span></h4>\n<p><span>For customers connecting offices, campuses, datacenters, edge environments, and partner locations to Azure, the last mile can still involve separate ordering, provisioning, portal, and support processes. The Lumen collaboration connects carrier reach with Azure-native networking to establish end-to-end private connectivity with fewer handoffs and clearer service boundaries.</span><span>&nbsp;</span></p>\n<p><span>The first experience is centered on integrated provisioning. Ordering and billing integration can evolve separately. Azure ExpressRoute remains the private connectivity foundation into Azure, while Azure Virtual WAN remains the Azure-native option for managed hybrid and branch connectivity and routing. Customers are not required to adopt a preferred third-party routing or orchestration platform.</span><span>&nbsp;</span></p>\n<p><em><span>“Enterprises shouldn’t have to choose between the agility of cloud and the performance and resiliency their critical workloads demand. By bringing Microsoft Azure and Lumen’s private, programmable network together, we’re simplifying how customers integrate their locations to the cloud and giving them a stronger foundation for what comes next.”</span><span>&nbsp;</span></em></p>\n<p><strong><span>Scott Yow, SVP Product, Lumen Technologies</span><span>&nbsp;</span></strong></p>\n<h5><span><span>What customers</span></span><span><span> can</span></span><span><span> gain</span></span><span>&nbsp;</span></h5>\n<ul>\n<li><span><span>Fewer provisioning handoffs. </span></span><span><span>A more integrated experience reduces the coordination </span><span>required</span><span> to connect a customer location to Azure.</span></span></li>\n<li><span><span>More connectivity choice. </span></span><span><span>Lumen extends carrier reach while Azure services continue to provide the cloud networking foundation.</span></span></li>\n<li><span><span>Clear service boundaries. </span></span><span><span>The collaboration simplifies the path without collapsing Azure and Lumen systems into a single operating model.</span></span></li>\n</ul>\n<p><span><span>Read the Lumen <a class=\"lia-external-url\" href=\"https://www.lumen.com/blog/en-us/lumen-cloud-interconnect-microsoft-azure-last-mile\" target=\"_blank\">announcement blog</a>.</span></span></p>\n<h4><span><span>Looking ahead</span></span><span>&nbsp;</span></h4>\n<p><span>As applications, data, and AI become more distributed, connectivity should become more consistent. We will continue building toward that goal with customers and partners.</span><span>&nbsp;</span></p>\n<h4><span><span>Get started</span></span><span>&nbsp;</span></h4>\n<p><span>Review the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/multicloud-interconnect/overview\" target=\"_blank\">Azure Multicloud Interconnect documentation</a> for the current AWS general-availability scope and Google Cloud preview availability. Work with your Microsoft account team and cloud-provider contacts to select a representative workload and confirm locations, bandwidth, addressing, security, commercial, and recovery requirements. For Lumen last-mile connectivity, contact your Microsoft or Lumen account team for current availability and onboarding details</span></p>"
  "9cfd54aa341f1f9ff64c47a23bbd9b48":
    "id": "9cfd54aa341f1f9ff64c47a23bbd9b48"
    "title": "Redefining application load balancing in Azure Application Gateway"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/redefining-application-load-balancing-in-azure-application/ba-p/4572687"
    "published": "2026-11-18 03:44:47"
    "fetched": "2026-11-18 03:49:32"
    "summary": "<p><em>By Jay Soni (Senior Product Manager) and Jordi Rey (Product Manager), Azure Application Gateway</em></p>\n<p>Modern applications change quickly. Teams run A/B experiments, version their APIs, tailor experiences by client and tenant, and serve AI models across reserved and pay-as-you-go capacity. Azure Application Gateway now gives you more precise control over where each request goes and how traffic is distributed once it gets there.</p>\n<p>Two new capabilities are now in public preview. Use them on their own or together:</p>\n<ul>\n<li><strong>Advanced routing rules:</strong> Match requests on path, header, query string, HTTP method and client IP, with regular expression support. A single rule can now cover request patterns that previously needed several.</li>\n<li><strong>Advanced load balancing:</strong> Choose backend pools by weight or priority, then choose servers within each pool using round robin, weighted round robin or least connections.</li>\n</ul>\n<p>The rest of this post explains how these capabilities work and the scenarios they enable, from blue-green deployments and client-aware experiences to multi-tenant SaaS and a single entry point for your AI endpoints.</p>\n<h2>What's new</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th>Capability</th><th>Details</th></tr></thead><tbody><tr><td>What a rule can match</td><td>Path, HTTP header, query string, HTTP method and client IP</td></tr><tr><td>How values are matched</td><td>Exact values, or RE2 regular expressions for path, header and query string</td></tr><tr><td>How conditions combine</td><td>Up to five conditions per rule, joined with AND and evaluated in priority order</td></tr><tr><td>Load balancing across pools</td><td>Multiple pools per rule, selected by weight or by priority</td></tr><tr><td>Load balancing within a pool</td><td>Round robin, weighted round robin or least connections, set per pool</td></tr><tr><td>Failover between pools</td><td>Priority-based failover driven by a configurable Minimum Healthy Percent</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2>Advanced routing rules: more control over request routing</h2>\n<p>Define conditions on URL paths, HTTP headers, query strings, HTTP methods and client IP addresses to send each request to the right backend pool. Combine conditions in one rule to support scenarios such as API versioning, tenant-specific routing and feature-based deployments. Rules are evaluated in priority order, and the first matching rule determines the destination. Requests that don't match any rule go to the configured default backend pool.</p>\n<p>Path, header and query-string conditions support RE2 regular expressions, so a single pattern can match many request variations. For example, <code>^/api/orders(/.*)?$</code> matches <code>/api/orders</code> and all of its subpaths. Each rule can also apply a rewrite rule set as part of routing.</p>\n<h2>Advanced load balancing: traffic distribution that fits your workload</h2>\n<p>Advanced load balancing gives you control at two levels:</p>\n<ul>\n<li><strong>Across pools:</strong> Use weighted distribution to split traffic by relative weight, such as 80/20 for a gradual rollout. Or use priority to keep traffic on a primary pool and fail over to the next pool when the primary pool's healthy servers drop below your Minimum Healthy Percent.</li>\n<li><strong>Within a pool:</strong> Each pool uses its own algorithm. Round robin spreads requests evenly. Weighted round robin sends more requests to larger servers. Least connections sends each request to the healthy server with the fewest active connections, so a server still working through long-running requests receives less new traffic.</li>\n</ul>\n<p style=\"text-align: center;\"><img alt=\"Figure 1: Advanced routing rules match the request; advanced load balancing selects a pool by weight or priority, then a server within the pool\" src=\"data:image/svg+xml;base64,\" width=\"800\" /></p>\n<p><em>Figure 1. Advanced routing rules match the request. Advanced load balancing then selects a pool by weight or priority, and a server within that pool.</em></p>\n<h2>Scenarios you can build</h2>\n<h3 class=\"lia-indent-padding-left-30px\">1. Canary and blue-green releases</h3>\n<p>Route requests that carry an <code>x-release: canary</code> header to a new version, or send 10% of all traffic to the green pool and raise its weight as confidence grows. Taking a pool out of rotation is a weight change, not a redeployment, and your customer-facing endpoint never changes.</p>\n<h3 class=\"lia-indent-padding-left-30px\">2. Read/write split</h3>\n<p>Send GET requests to a pool of read replicas or cache-heavy nodes, and send POST, PUT and DELETE requests to the primary write tier.</p>\n<h3 class=\"lia-indent-padding-left-30px\">3. Client-aware experiences</h3>\n<p>Route mobile clients to an optimized backend based on a client header such as <code>x-client-type: mobile</code> or a User-Agent pattern, while web traffic continues to the standard pool.</p>\n<h3 class=\"lia-indent-padding-left-30px\">4. Internal and partner traffic</h3>\n<p>Route requests from corporate or partner IP ranges to dedicated backend pools, such as staging or administrative environments. Combine client IP-based routing with Web Application Firewall (WAF) protection and appropriate authentication and authorization controls to help secure access to these applications.</p>\n<h3 class=\"lia-indent-padding-left-30px\">5. Multi-tenant SaaS</h3>\n<p>Route by tenant hostname to dedicated pools for premium tenants and shared pools for everyone else. Tenant tiers become a routing decision, not an infrastructure redesign.</p>\n<h3 class=\"lia-indent-padding-left-30px\">6. API versioning without URL changes</h3>\n<p>Route <code>?api-version=2026-01</code> or an <code>api-version</code> header to the right backend. Clients keep a stable URL while you run several versions side by side, and one regular expression condition can cover a whole family of versioned paths.</p>\n<h2>One entry point for your AI endpoints</h2>\n<p>AI applications often span several endpoints, mixing reserved Provisioned Throughput Unit (PTU) capacity and pay-as-you-go capacity across regions. Rather than having every application track which endpoint to call and what to do when reserved capacity runs out, Application Gateway can serve as the central entry point for all of them: one address, with TLS, WAF and private connectivity managed in one place.</p>\n<p><strong>Route by deployment, spill over automatically.</strong> Route AI requests to the appropriate backend pools based on deployment paths, team identifiers or application-specific headers. Put PTU endpoints in a priority 1 pool and pay-as-you-go endpoints in a priority 2 pool. Traffic moves to pay-as-you-go only when the share of healthy reserved endpoints drops below your Minimum Healthy Percent, with no change for the client.</p>\n<p style=\"text-align: center;\"><img alt=\"Figure 2: Application Gateway as one entry point for AI endpoints with priority failover from PTU to pay-as-you-go\" src=\"data:image/svg+xml;base64,\" width=\"800\" /></p>\n<p><em>Figure 2. One entry point for your AI endpoints: route by deployment path or header, and fail over by priority.</em></p>\n<h2>Get started</h2>\n<p>Advanced routing rules and advanced load balancing are available for both new and existing Application Gateway deployments. To get started, see the <a href=\"https://aka.ms/appgw/advancedloadbalancing\" rel=\"noopener\" target=\"_blank\">Application Gateway documentation for advanced routing rules and advanced load balancing</a>.</p>\n<p><strong>Note:</strong> Requires API version 2026-03-01 or later. During preview, weighted distribution doesn't check pool health, so set a pool's weight to 0 to take it out of rotation.</p>\n<p><em>This feature is in public preview. Previews are provided without a service-level agreement and aren't recommended for production workloads. For more information, see the <a href=\"https://azure.microsoft.com/support/legal/preview-supplemental-terms/\" rel=\"noopener\" target=\"_blank\">Supplemental Terms of Use for Microsoft Azure Previews</a>.</em></p>"
  "3573e2bb5f9e4407c4e0e1f2fb8e7b5e":
    "id": "3573e2bb5f9e4407c4e0e1f2fb8e7b5e"
    "title": "The patch window is closing. Put time back on the defender’s side."
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/the-patch-window-is-closing-put-time-back-on-the-defender-s-side/ba-p/4573402"
    "published": "2026-11-18 04:28:00"
    "fetched": "2026-11-19 03:28:41"
    "summary": "<p>A critical vulnerability is announced. Your security team identifies affected workloads. Application owners begin testing the fix. Deployment plans take shape.</p>\n<p>Attackers are already moving.</p>\n<p>For defenders, patching requires care: understanding dependencies, validating compatibility, protecting availability, and coordinating changes across production environments. For attackers, a single exploitable path can be enough.</p>\n<p>AI is widening that imbalance. Defenders need protection that can understand emerging threats, recognize where they matter, and act while patching is still underway.</p>\n<p>Today at Microsoft Ignite, we are announcing <strong>Azure Adaptive Virtual Patching</strong>, an AI-based adaptive shield designed to proactively reduce exposure to new, emerging, and zero-day vulnerabilities. It connects vulnerability intelligence and workload context with coordinated protection <strong>across the network and on the workload</strong>.</p>\n<p>Our goal is straightforward: <strong>put power – and time – back in the hands of defenders.</strong></p>\n<p>&nbsp;</p>\n<img />\n<p><strong>Turning the adaptive security vision into protection</strong></p>\n<p>In his August 2026 blog, <a href=\"https://azure.microsoft.com/en-us/blog/the-patch-window-is-collapsing-why-security-needs-a-new-control-plane/\" rel=\"noopener\" target=\"_blank\">“The patch window is collapsing: Why security needs a new control plane,”</a> Igor Sakhnov, Corporate Vice President and General Manager for Azure Networking, described a growing customer challenge: knowing that a workload is vulnerable does not mean an organization can immediately patch it. He outlined the opportunity for the network to serve as an adaptive control plane that reduces exposure during that interval.</p>\n<p>Azure Adaptive Virtual Patching advances that vision into a new product capability.</p>\n<p>It connects an understanding of how vulnerabilities work with an understanding of the workloads customers actually run. AI then orchestrates targeted mitigations through network-based controls, including inline intelligence, and eBPF-based runtime enforcement on the workload.</p>\n<p>Together, these capabilities bring protection to multiple points along an attack path while customers prepare the permanent fix.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>The attack timeline has changed. Production responsibilities have not.</strong></p>\n<p>Microsoft’s <a href=\"https://www.microsoft.com/en-us/security/blog/2026/04/02/threat-actor-abuse-of-ai-accelerates-from-tool-to-cyberattack-surface/\" rel=\"noopener\" target=\"_blank\">threat research</a> shows adversaries embedding AI into how they plan, refine, and sustain attacks. AI accelerates research, code development, and iteration across the attack lifecycle.</p>\n<p>Attackers can also access <em>special models</em>: models modified to weaken or remove safety refusal behavior. Research has found that models fine-tuned to remove safeguards can provide substantially more assistance with malicious tasks, further lowering barriers to misuse.</p>\n<p>These capabilities can help adversaries move from vulnerability information to attack development faster than customers can responsibly test and deploy a fix.</p>\n<p>A production change still requires validation. A critical service still has availability commitments. A maintenance window still needs coordination.</p>\n<p>Customers should not have to choose between rushing an untested patch into production and leaving a known attack surface exposed.</p>\n<p>Meeting this challenge requires AI-orchestrated defense that continuously connects emerging threats to customer environments – and translates that understanding into protection.</p>\n<p>&nbsp;</p>\n<p><strong>Three semantic layers. One adaptive defense.</strong></p>\n<p>Azure Adaptive Virtual Patching uses three connected semantic layers to move from vulnerability understanding to workload-specific mitigation.</p>\n<ol>\n<li><strong> Understand the vulnerability.</strong></li>\n</ol>\n<p>The first layer builds a semantic knowledge graph of vulnerabilities, including emerging and newly disclosed zero-days. It connects affected components, exploit prerequisites, vulnerable behaviors, and potential mitigations.</p>\n<p>The objective goes beyond recognizing a vulnerability identifier. It is to understand which software is involved, what conditions an attacker needs, and where controls could interrupt exploitation.</p>\n<p>As intelligence develops, that understanding evolves with it.</p>\n<ol start=\"2\">\n<li><strong> Understand the customer’s Azure environment.</strong></li>\n</ol>\n<p>The second layer builds a semantic knowledge map of the customer’s Azure estate.</p>\n<p>It brings together telemetry about running processes, installed modules, operating systems, open ports, and other workload characteristics to understand how systems are configured and exposed.</p>\n<p>The presence of a software package is only part of the picture. Exposure also depends on whether a vulnerable component is running, how it is used, and which network paths make it reachable.</p>\n<p>This layer grounds vulnerability intelligence in each workload’s operational context.</p>\n<ol start=\"3\">\n<li><strong> Understand exposure – and orchestrate protection.</strong></li>\n</ol>\n<p>The third layer combines the first two to determine the relevant attack surface and corresponding mitigation.</p>\n<p>The service’s AI core reasons across vulnerability prerequisites, workload configuration, and network exposure to orchestrate protection at the appropriate enforcement points. Depending on the vulnerability and workload, this can involve network mitigations, local runtime controls, or a coordinated combination.</p>\n<p>Together, the layers connect <strong>what the threat requires, what the customer runs, and where protection can interrupt the attack.</strong></p>\n<p>&nbsp;</p>\n<p><strong>Protection across the network and on the workload</strong></p>\n<p>The adaptive shield brings together two complementary forms of enforcement.</p>\n<p><strong>Network-based mitigations use the network as a compensating control.</strong> Multiple network defenses, including inline intelligence, help identify and interrupt exploit-related traffic and constrain the paths through which vulnerable workloads can be reached.</p>\n<p>This gives defenders a way to reduce exposure while the underlying software remains unpatched. The network becomes an active protection layer, applying controls around the workload while remediation proceeds.</p>\n<p><strong>Workload-based mitigations address relevant runtime behavior.</strong> Using eBPF-based enforcement, the service can apply granular controls at supported execution points on the workload itself.</p>\n<p>The AI core coordinates these capabilities according to the vulnerability and the customer’s environment. A network control may constrain an incoming attack path, while a workload policy addresses the runtime operation that makes exploitation possible.</p>\n<p>This combination expands the opportunities to interrupt an attack and tailor protection to the exposed resource.</p>\n<p><strong>From protected resource to protected execution</strong></p>\n<p>Customers bring workloads under the adaptive shield by adding them as <strong>protected resources</strong>. A <strong>neuron extension</strong> is then installed on each onboarded workload, connecting that resource to the service’s AI core.</p>\n<p>The extension collects telemetry that helps the AI core understand the workload’s exposure and attack surface. It also deploys workload mitigations as instructed by the AI core.</p>\n<img />\n<p>Alongside those local mitigations, the service orchestrates network-based protection to address the relevant exposure paths.</p>\n<p>This creates a continuous feedback loop: telemetry informs understanding, understanding informs mitigation, and coordinated enforcement puts protection into effect across the network and workload.</p>\n<p>&nbsp;</p>\n<p><strong>AI-synthesized policies. Granular runtime enforcement.</strong></p>\n<p>On the workload, mitigations are deployed through <strong>Tetragon</strong>, using eBPF-based security across user-mode and kernel-mode execution paths as needed and supported.</p>\n<p><a href=\"https://tetragon.io/\" rel=\"noopener\" target=\"_blank\">Tetragon</a> provides security observability and runtime enforcement, including visibility into process execution, system calls, and file and network activity. Its <a href=\"https://tetragon.io/docs/reference/tracing-policy/\" rel=\"noopener\" target=\"_blank\">policy framework</a> supports hooks in kernel and user-space code, allowing policies to target specific operations and take defined actions when their conditions match.</p>\n<p>The AI core synthesizes Tetragon policies dynamically, making them highly specific to each workload’s software, configuration, and relevant exploit conditions. The neuron extension deploys those policies to the corresponding protected resource.</p>\n<p>Two workloads affected by the same vulnerability may run different binaries, load different modules, or expose different network paths. Their protections should reflect those differences.</p>\n<p>&nbsp;</p>\n<p><strong>AI adaptability with deterministic protection</strong></p>\n<p>Production security demands predictable, reliable behavior.</p>\n<p>A central innovation in Azure Adaptive Virtual Patching is bringing AI-driven reasoning together with deterministic enforcement. AI interprets vulnerability information and workload context, then translates that understanding into defined mitigation controls.</p>\n<p>For workload protection, synthesized Tetragon policies express explicit matching conditions and enforcement actions. Once deployed, those policies enforce the defined behavior locally without requiring a new generative AI decision for every matching event.</p>\n<p>Across the Adaptive Shield, the principle is consistent: <strong>AI determines the appropriate protection; defined controls make enforcement predictable.</strong></p>\n<p>&nbsp;</p>\n<p><strong>Autonomous preparation for emerging threats</strong></p>\n<p>When actionable intelligence about a newly announced zero-day becomes available, AI-based training pipelines can trigger autonomously to prepare defenses at scale.</p>\n<p>The pipelines develop an understanding of exploit conditions and candidate protections. The semantic layers connect that learning to customer environments, and the AI core prepares workload-specific mitigations across the available network and runtime enforcement points.</p>\n<p>The result is a continuous cycle: understand the threat, assess exposure, prepare mitigation, enforce protection, and adapt as intelligence or workload conditions change.</p>\n<p>Proactive, pre-emptive defense means acting on those conditions before an attack succeeds.</p>\n<p>&nbsp;</p>\n<p><strong>HTTP/2 Bomb (CVE-2026-49975): interrupting resource exhaustion</strong></p>\n<p>HTTP/2 Bomb demonstrates how legitimate protocol features can combine into a disruptive attack.</p>\n<p>The original research describes header compression amplification combined with stalled streams. Small requests can cause disproportionate server memory consumption, while flow-control behavior keeps resources occupied. Request size alone does not capture the risk: header counts, allocation behavior, and stream lifetime also matter.</p>\n<p><strong>In our testing, Azure Adaptive Virtual Patching successfully mitigated HTTP/2 Bomb attacks.</strong></p>\n<p>The semantic layers connect the resource-exhaustion mechanism with the server implementation, runtime environment, and network exposure of the protected resource.</p>\n<p>That context informs where protection should apply. Network-based mitigations can address exploit-related traffic at an appropriate inspection point, while workload enforcement can target relevant runtime behavior. The service orchestrates the applicable controls for the workload.</p>\n<p>This approach connects the incoming attack path to the behavior it triggers inside the server, supporting more precise protection while customers validate and deploy the permanent fix.</p>\n<p>&nbsp;</p>\n<p><strong>PHP2Shell: connecting network exposure to runtime exploitation</strong></p>\n<p>PHP2Shell presents a different challenge.</p>\n<p>The vulnerabilities, CVE-2026-109618 and CVE-2026-109619, involve PHP runtime memory handling and can enable unauthenticated remote code execution under exploitable conditions. The PHP project’s advisories describe <a href=\"https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w\" rel=\"noopener\" target=\"_blank\">out-of-memory corruption</a> and <a href=\"https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp\" rel=\"noopener\" target=\"_blank\">stale request state</a>, with exposure influenced by server integration, configuration, extensions, and application behavior.</p>\n<p><strong>In our testing, Azure Adaptive Virtual Patching successfully mitigated PHP2Shell attacks.</strong></p>\n<p>Telemetry from the neuron extension helps the AI core connect vulnerability prerequisites to the workload’s PHP processes, installed modules, and operating environment. Network context establishes how the affected service can be reached.</p>\n<p>Together, these inputs inform targeted mitigation: network controls can constrain relevant attack paths and exploit-related requests, while workload-specific runtime policies address applicable execution behavior.</p>\n<p>The tested outcome demonstrates the value of coordinated protection. PHP’s advisories also make clear that interim measures do not provide complete coverage across every exploitation route. Protection against tested attacks buys time; installing the fixed software remains essential.</p>\n<p>&nbsp;</p>\n<p><strong>Time to patch. Protection while you do.</strong></p>\n<p>Azure Adaptive Virtual Patching deploys mitigations; it does not install the software patch. Customers continue to validate and deploy fixes through their patching processes. Once the patch is deployed and remediation confirmed, the corresponding temporary mitigations can be rolled back.</p>\n<p>We are starting with <strong>Linux virtual machines and Virtual Machine Scale Sets on Azure</strong>. Over time, we plan to extend protection to additional workload types, including Windows-based workloads.</p>\n<p>As AI accelerates offensive capabilities, defenders need the same advantage in understanding, coordination, and action. Azure Adaptive Virtual Patching brings those capabilities together through an autonomous adaptive shield – using the network as a compensating control and granular runtime enforcement to protect workloads while customers patch.<strong>&nbsp;</strong></p>\n<p><strong>The patch window is closing. We are putting time back on the defender’s side.</strong></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>Meet the team:</p>\n<p><strong>Product -<br /><em>Alisha Jyoti - Product Manager, Azure Core Networking.</em><br /></strong><strong><em>Ashish Jain, Partner Group Product Manager, Network &amp; AI Security, Azure Core Networking<br /></em></strong><strong>Engineering -&nbsp;<br /></strong><em><strong>Ashish Bhargava, Principal Software Engineering Manager, Azure Core Networking<br /></strong></em><em><strong>Chandan Aggarwal</strong>, Partner Engineering Manager, Azure Core Networking,&nbsp;<br /></em><em>Priyanka Mathur,</em> <em><strong>Principal Software Engineering Manager, Azure Core Networking<br /></strong></em><em><strong>Xinyan Zan</strong>, Vice President, Azure Core Networking.</em></p>"
