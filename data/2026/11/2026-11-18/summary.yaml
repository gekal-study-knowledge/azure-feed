"overview": |
  この日は Microsoft Ignite に合わせた大量のアップデートで、Azure Updates 161 件、Apps on Azure Blog 23 本、Azure Blog 6 本、Azure Networking Blog 7 本、Microsoft Security Blog 2 本の計 199 本が公開され、PostgreSQL 互換の Azure HorizonDB の一般提供を筆頭に、データベース、サーバーレス、ネットワークセキュリティ、AI エージェントの運用基盤が中心でした。Azure HorizonDB は次世代のフルマネージドなクラウドネイティブ PostgreSQL サービスとして一般提供となり、15 リージョンへの展開、Microsoft Entra 認証とユーザー割り当てマネージド ID、pgAudit による監査、Azure Monitor アラートと Log Analytics 連携、Azure Advisor 統合、Geo 冗長バックアップ、1〜35 日のバックアップ保持期間、Private Link によるプライベートエンドポイント、Apache AGE のグラフ性能改善が並び、カスタマーマネージドキーによる保存時暗号化や AI パイプラインによるナレッジグラフ構築がプレビュー、AI モデル管理が限定プレビューとなりました。Azure Database for PostgreSQL や Oracle から HorizonDB へ、Oracle から Azure Database for PostgreSQL への Database Migration Service による移行と、AI 支援の Oracle から PostgreSQL へのアプリケーションコード移行もプレビューで始まっています。Azure SQL では TDE 保護キーに AES-256 キーを使える機能、Microsoft SQL 全体でのあいまい文字列一致、SQL Managed Instance の Next-gen 汎用レベルのゾーン冗長、複数データベースを持つ可用性グループの Managed Instance link 対応が一般提供となり、サブスクリプションやクレジットカードなしでローカルで動く Azure SQL Database コンテナ、Hyperscale のクロスデータベースクエリ、SQL Server 2025 の Ubuntu 26.04 LTS 対応、Database Agent がプレビューになり、Microsoft Fabric の Database Hub も一般提供となりました。Cosmos DB では Azure Backup による Vaulted バックアップ、Cosmos DB Shell、Rust SDK、セマンティック再ランカー、スループットバケット、全文検索の BM25 スコア射影が一般提供となり、マネージド MCP サーバーと埋め込み生成がプレビューに、Azure DocumentDB は任意ノードからのクエリやニアインスタントプロビジョニングが一般提供、Azure Local と Azure Arc での提供や全文検索がプレビューに、Azure Managed Redis は Redis 8、シャード単位のメトリクス、IP フィルタリングがプレビュー、Azure Cache for Redis からの移行ツールとキースペース通知が一般提供になりました。インフラでは Azure Linux 4.0、Cobalt 200 Arm ベースの Dpsv7 / Dplsv7 / Epsv7 / Mpsv4 / Lpsv5 シリーズ VM、Ebsv6 / Ebdsv6 VM、Azure Red Hat OpenShift のホスト型コントロールプレーン、Azure Infrastructure Resiliency Manager、Azure Monitor Health Models が一般提供となり、Windows Server 2028、Azure Compute Spot plus、VM のアダプティブ配置、Blob Storage の turbo tier、Azure Files の HDD 上の NFS 共有、ディスクの不変スナップショット、Elastic SAN Next Generation がプレビュー、5th Gen AMD EPYC ベースの機密 VM (DCasv7 / ECasv7 など) と 6th Gen AMD EPYC (Venice) ベースの DHasv8 / EHasv8 がプライベートプレビューになりました。サーバーレス・統合では、Azure Functions の Flex Consumption での Go の一般提供、マネージドコネクタ、durable task scheduler のプライベートエンドポイントとカスタマーマネージドキー、Microsoft Agent Framework 向け Durable Task 拡張が一般提供となり、Node.js 26・Python 3.15 対応、コンテナによる OS レベルの依存関係、ホスト型スキル・エージェントバインディング、App Service の Geo 冗長と App Service Builder、Logic Apps Automation の各種機能がプレビューで、API Management の AI Gateway 層が独立した Azure AI Gateway として一般提供、API Management Premium v2 が 35 リージョンに広がり、統合モデル API と Agent 365 連携、Azure Connector Namespace も一般提供になりました。ネットワークとセキュリティでは、Azure Multicloud Interconnect が対応クラウドプロバイダーを広げて一般提供となり、AI エージェントの通信に ID ベースのゼロトラストを適用する Agent Grid、Azure Firewall Premium の AI Security アドオン、AI が調整する Azure Adaptive Virtual Patching、録画された特権セッションを AI でレビューする Azure Bastion RDP / SSH vision、Application Gateway の次世代エラスティックアーキテクチャ・高度な負荷分散・JWT 検証・機密コンピューティング、DDoS Protection の平常時テレメトリと NAT Gateway v2 IP 対応、Network Watcher の AI による接続トラブルシュート要約やパケットキャプチャ分析がプレビューとなり、DDoS Protection のカスタムポリシーも一般提供として告知されました。運用面では Azure SRE Agent が AWS と Google Cloud へのネイティブ対応、A2A プロトコル、Teams 連携、Entra Agent ID と Agent 365 の統制をプレビューで追加し (Slack 連携はプライベートプレビュー)、主権 (ソブリン) 対応として Sovereign Control Panel がプレビューで登場しました。ブログでは、Networking Blog がマルチクラウドとラストマイルの接続、Bastion の AI セッションレビュー、Agent Grid、Azure Firewall の新章、パッチ適用までの時間を稼ぐ防御、Application Gateway の負荷分散を解説し、Microsoft Security Blog はデバイスコードフィッシングが GitHub Copilot CLI を例に AI コーディングエージェントにも及びうることを示したラボ研究と、Project Perception の更新と新しい Microsoft Security のサイバースタックを紹介しました。後から追加された Azure Blog では、Ignite 2026 での Azure 全体の新機能、アプリ・データ・インフラをまたいでエージェント主導でモダナイズする Azure Catalyst と新しい AI インフラ、Cobalt 200 VM の提供、組織固有の知識をエージェントに生かすコンテキスト管理基盤 Microsoft IQ、エージェントを継続的に評価・改善する Microsoft Foundry の継続的改善、Oracle の業務データをまたいで AI エージェントが推論できる Microsoft と Oracle の新しい連携が紹介されました。Apps on Azure Blog では、Azure Functions のマネージドコネクタと Azure Red Hat OpenShift のホスト型コントロールプレーンの一般提供の解説、durable task scheduler のネイティブなディザスターリカバリーとタスクキュー、LangGraph エージェント向け Azure Durable Task (langchain-azure-compute[durabletask] 0.2.0 以降、プレビュー)、Flex Consumption でのコンテナによる OS レベル依存関係 (パブリックプレビュー)、GitHub Copilot と連携する Azure Functions Canvas (プレビュー)、Function App 向けの新しい Network Troubleshooter (プレビュー)、ホストと言語ワーカーを分ける Compute Separation、Python 3.15 対応に向けて Rust を基盤にした Python ワーカー、App Service の Geo 冗長と App Service Builder (パブリックプレビュー)、2026 年 8 月に一般提供となった App Service の Managed Instance で移行できる Windows アプリの拡大、Container Apps の Ignite 更新とポータルから対話的にデバッグできる Azure SRE Agent (プレビュー)、Foundry のオープンウェイトモデルとホスト型エージェントを既存の AKS クラスターに展開する AKS AI Manager for Foundry、Azure Container Registry の暗号化キーを Managed HSM に置ける機能が解説されました。Networking Blog には重大な脆弱性の公表からパッチ適用までの時間を防御側に取り戻す記事も追加されています。Apps on Azure Blog にはさらに、最初のエージェントのパイロットからインシデント対応・変更管理・オンコール運用といった中核業務へ Azure SRE Agent を広げる際の、エージェントとチームの協働のあり方や人が統制を保つべき箇所を考える記事も加わりました。Apps on Azure Blog には後からさらに、大量のオーケストレーションが呼び出し先 API のレート制限 (例: 毎秒 10 リクエスト) を超えないよう処理のペースを制御する Durable Task Scheduler のタスクキューの解説と、認可・変更検出・イベント配信を肩代わりする Azure Functions のコネクタの内部アーキテクチャの解説も加わりました。
