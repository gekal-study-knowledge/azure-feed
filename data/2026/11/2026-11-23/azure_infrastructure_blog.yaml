  "86421ad557745be121a05c0e890a59f4":
    "id": "86421ad557745be121a05c0e890a59f4"
    "title": "From Exposure to Fix: Connecting Microsoft Perception to Your Image Pipeline"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/from-exposure-to-fix-connecting-microsoft-perception-to-your/ba-p/4574765"
    "published": "2026-11-23 22:40:17"
    "fetched": "2026-11-25 01:35:31"
    "summary": "<p><em>This is Part 2 of a two-part series. <strong>Part 1</strong> explained how Microsoft Perception works: red, blue and green team agents, Microsoft-published playbooks, and sessions that record every step. This part puts it to work for an Azure platform team.</em></p>\n<p><em>[Add link to Part 1 once it is published]</em></p>\n<h2>1. The gap between \"fix this first\" and the fix</h2>\n<p>Perception is very good at answering one hard question: <strong>out of hundreds of findings, which ones actually matter?</strong> The Posture Prioritization Agent ranks issues by real-world risk, exposure, exploitability and asset criticality, and explains what to fix first and why.</p>\n<p>For many Azure estates, though, the fix for a vulnerable VM does not happen on the VM. If your workloads run from a golden image in Azure Compute Gallery, patching machines one by one creates drift: the next scale-out or rebuild brings the vulnerability straight back. The durable fix is to <strong>rebuild the image, validate it, publish a new version and roll it out</strong>.</p>\n<p>That is exactly the pipeline we built earlier in this blog series with Packer and Azure DevOps. This article connects the two: Perception decides what matters and a person approves it; a small, auditable bridge works out which images are affected and queues the existing image pipeline to rebuild them.</p>\n<h2>2. What we are building</h2>\n<img />\n<p>The flow has five stages:</p>\n<ol>\n<li><strong>Decide</strong> – run a Perception playbook, review the session and approve the CVEs to act on.</li>\n<li><strong>Find</strong> – use Defender advanced hunting to list the devices exposed to those CVEs.</li>\n<li><strong>Map</strong> – use Azure Resource Graph to map those VMs to the Compute Gallery image they were built from.</li>\n<li><strong>Rebuild</strong> – queue the image pipeline for each affected image, with the CVE IDs recorded as the reason.</li>\n<li><strong>Verify</strong> – once the new image is rolled out, confirm in Defender that the exposure is gone.</li>\n</ol>\n<p>Two design rules run through every stage:</p>\n<ul>\n<li><strong>A person approves the hand-off.</strong> Nothing is rebuilt just because an agent said so. The bridge only acts on CVE IDs a person has reviewed in a Perception session.</li>\n<li><strong>Only documented interfaces.</strong> The bridge uses public APIs (Microsoft Graph advanced hunting, Azure Resource Graph and the Azure DevOps Pipelines REST API). It does not depend on any undocumented Perception internals.</li>\n</ul>\n<h2>3. Prerequisites</h2>\n<ul>\n<li><strong>Perception</strong> enabled in your tenant, with Defender unified RBAC turned on and the agents used by your chosen playbook set up. Check Microsoft Learn for current availability.</li>\n<li><strong>Defender Vulnerability Management data</strong> for your VMs (for example through Defender for Servers or Defender for Endpoint), so the <code>DeviceTvmSoftwareVulnerabilities</code> table is populated.</li>\n<li><strong>An image pipeline</strong> in Azure DevOps that builds, validates and publishes to Azure Compute Gallery, such as the one from Part 1 of the image automation series.</li>\n<li><strong>An identity for the bridge</strong> with:\n<ul>\n<li>Microsoft Graph application permission <code>ThreatHunting.Read.All</code> to run advanced hunting queries.</li>\n<li><strong>Reader</strong> on the subscriptions that hold your VMs, for Resource Graph.</li>\n<li>Permission to queue the image pipeline in Azure DevOps.</li>\n</ul>\n</li>\n<li>Python 3.10 or later.</li>\n</ul>\n<h2>4. Step 1 – Decide in Perception</h2>\n<p>Start in the Microsoft Defender portal and select <strong>Perception</strong>. Two documented playbooks fit this scenario well:</p>\n<ul>\n<li><strong>Plan for posture remediation</strong> builds a prioritised remediation plan across clouds, devices and AI, weighing exposure, exploitability and asset context.</li>\n<li><strong>Protect against a threat</strong> starts from a threat intelligence source and produces attack path analysis, posture findings, prioritised remediation and new detection rules.</li>\n</ul>\n<p>Run the playbook from the <strong>Playbooks</strong> page (or describe the goal in <strong>New Chat</strong>), then open the session. Review the agents' reasoning and the prioritised list. Where agents ask for input, approve, reject or redirect them as you would with a colleague.</p>\n<p>The output we need is small: <strong>the CVE IDs the team agrees to fix through the image pipeline</strong>. Record them with the session link in your change ticket. This is the human checkpoint, and the session gives you the audit trail for why the rebuild happened.</p>\n<blockquote>\n<p><strong>Tip:</strong> Not every finding belongs in the image pipeline. Configuration issues or excess permissions surfaced by the Recon Agent are usually fixed in Bicep, policy or identity settings. Send only software vulnerabilities baked into the image down this path.</p>\n</blockquote>\n<h2>5. Step 2 – Find the exposed devices</h2>\n<p>Advanced hunting in Defender exposes vulnerability data in the <code>DeviceTvmSoftwareVulnerabilities</code> table, including the device, software, CVE ID and severity. Try the query in the portal first (<strong>Hunting &gt; Advanced hunting</strong>):</p>\n<pre class=\"lia-code-sample language-kusto\" contenteditable=\"false\" tabindex=\"0\"><code>// Devices exposed to the CVEs approved in the Perception session\nlet approvedCves = dynamic([\"CVE-YYYY-NNNNN\"]);   // replace with the CVE IDs from your session\nDeviceTvmSoftwareVulnerabilities\n| where CveId in~ (approvedCves)\n| summarize Cves = make_set(CveId),\n            Software = make_set(strcat(SoftwareName, \" \", SoftwareVersion)),\n            Severity = max(VulnerabilitySeverityLevel)\n          by DeviceId, DeviceName, OSPlatform</code></pre>\n<p>You should see each exposed VM, the vulnerable software and the CVEs that affect it. If the list is empty, check that the VMs are onboarded and reporting vulnerability data.</p>\n<h2>6. Step 3 – Map devices to gallery images</h2>\n<p>Defender knows which machines are vulnerable; Azure knows which image each VM came from. Azure Resource Graph joins the two quickly across subscriptions. This query lists every VM built from a Compute Gallery image, with its computer name for matching:</p>\n<pre class=\"lia-code-sample language-kusto\" contenteditable=\"false\" tabindex=\"0\"><code>resources\n| where type =~ 'microsoft.compute/virtualmachines'\n| extend computerName = tolower(tostring(properties.osProfile.computerName)),\n         imageId      = tolower(tostring(properties.storageProfile.imageReference.id))\n| where imageId contains '/galleries/'\n| project name, resourceGroup, subscriptionId, computerName, imageId</code></pre>\n<p>Matching on computer name is simple and works well when VM host names are unique, which is common in platform-managed estates. If your naming is less strict, add another key such as subscription or resource group. The query covers single VMs; extend it with <code>microsoft.compute/virtualmachinescalesets</code> if you run scale sets.</p>\n<h2>7. Step 4 – The remediation bridge</h2>\n<p>The bridge is a short Python script that runs both queries, groups the results by image definition and, only when asked, queues the image pipeline. It defaults to a <strong>dry run</strong>, so the first thing you see is a report, not a pipeline run.</p>\n<pre class=\"lia-code-sample language-python\" contenteditable=\"false\" tabindex=\"0\"><code>\"\"\"exposure_to_image.py - map approved CVEs to Compute Gallery images and queue rebuilds.\n\nDry run by default. Pass --queue to start the image pipeline for each affected image.\n\"\"\"\nimport argparse, os, re, requests\nfrom collections import defaultdict\nfrom azure.identity import DefaultAzureCredential\nfrom azure.mgmt.resourcegraph import ResourceGraphClient\nfrom azure.mgmt.resourcegraph.models import QueryRequest\n\nGRAPH = \"https://graph.microsoft.com/v1.0/security/runHuntingQuery\"\nADO_SCOPE = \"499b84ac-1321-427f-aa17-267ca6975798/.default\"   # Azure DevOps resource ID\nIMAGE_RE = re.compile(r\"/galleries/([^/]+)/images/([^/]+)\")\n\ndef hunt(cred, cves):\n    cve_list = \", \".join(f'\"{c}\"' for c in cves)\n    query = f\"\"\"DeviceTvmSoftwareVulnerabilities\n| where CveId in~ ({cve_list})\n| summarize Cves = make_set(CveId) by DeviceId, DeviceName\"\"\"\n    token = cred.get_token(\"https://graph.microsoft.com/.default\").token\n    r = requests.post(GRAPH, json={\"Query\": query},\n                      headers={\"Authorization\": \"Bearer \" + token}, timeout=60)\n    r.raise_for_status()\n    # DeviceName is an FQDN; keep the host part to match the VM computer name\n    return {row[\"DeviceName\"].split(\".\")[0].lower(): row[\"Cves\"]\n            for row in r.json()[\"results\"]}\n\ndef gallery_vms(cred, subscriptions):\n    query = \"\"\"resources\n| where type =~ 'microsoft.compute/virtualmachines'\n| extend computerName = tolower(tostring(properties.osProfile.computerName)),\n         imageId = tolower(tostring(properties.storageProfile.imageReference.id))\n| where imageId contains '/galleries/'\n| project name, computerName, imageId\"\"\"\n    client = ResourceGraphClient(cred)\n    return client.resources(QueryRequest(subscriptions=subscriptions, query=query)).data\n\ndef queue_rebuild(cred, image_definition, cves):\n    org, project, pipeline_id = (os.environ[k] for k in (\"ADO_ORG\", \"ADO_PROJECT\", \"ADO_PIPELINE_ID\"))\n    token = cred.get_token(ADO_SCOPE).token\n    url = f\"https://dev.azure.com/{org}/{project}/_apis/pipelines/{pipeline_id}/runs?api-version=7.1\"\n    body = {\"templateParameters\": {\"imageDefinition\": image_definition,\n                                   \"triggerReason\": \"perception-remediation\",\n                                   \"cveIds\": \",\".join(sorted(cves))}}\n    r = requests.post(url, json=body, headers={\"Authorization\": \"Bearer \" + token}, timeout=60)\n    r.raise_for_status()\n    return r.json()[\"_links\"][\"web\"][\"href\"]\n\ndef main():\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--cve\", action=\"append\", required=True, help=\"CVE ID approved in the Perception session\")\n    p.add_argument(\"--subscription\", action=\"append\", required=True)\n    p.add_argument(\"--queue\", action=\"store_true\", help=\"queue pipeline runs (default: dry run)\")\n    a = p.parse_args()\n\n    cred = DefaultAzureCredential()\n    exposed = hunt(cred, a.cve)\n    impact = defaultdict(lambda: {\"vms\": [], \"cves\": set()})\n    for vm in gallery_vms(cred, a.subscription):\n        cves = exposed.get(vm[\"computerName\"])\n        m = IMAGE_RE.search(vm[\"imageId\"])\n        if cves and m:\n            key = f\"{m.group(1)}/{m.group(2)}\"          # gallery/imageDefinition\n            impact[key][\"vms\"].append(vm[\"name\"])\n            impact[key][\"cves\"].update(cves)\n\n    if not impact:\n        print(\"No gallery-based VMs are exposed to the selected CVEs.\")\n    for image, info in impact.items():\n        print(f\"{image}: {len(info['vms'])} VM(s), CVEs {sorted(info['cves'])}\")\n        if a.queue:\n            print(\"  queued:\", queue_rebuild(cred, image.split(\"/\")[1], info[\"cves\"]))\n\nif __name__ == \"__main__\":\n    main()</code></pre>\n<p>A few points about the design:</p>\n<ul>\n<li><strong>One rebuild per image, not per VM.</strong> Twenty exposed VMs from the same image result in one pipeline run.</li>\n<li><strong>The reason travels with the run.</strong> The CVE IDs and trigger reason are passed as pipeline parameters, so they appear in the run history.</li>\n<li><strong>Standard authentication.</strong> <code>DefaultAzureCredential</code> works with a managed identity, a workload identity in a pipeline, or your own sign-in for testing. No secrets are stored in the script.</li>\n</ul>\n<p>Run it:</p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>pip install azure-identity azure-mgmt-resourcegraph requests\nexport ADO_ORG=&lt;your-org&gt; ADO_PROJECT=&lt;your-project&gt; ADO_PIPELINE_ID=&lt;image-pipeline-id&gt;\n\n# 1. Dry run: see which images are affected\npython exposure_to_image.py --cve CVE-YYYY-NNNNN --subscription &lt;subscription-id&gt;\n\n# 2. After review, queue the rebuilds\npython exposure_to_image.py --cve CVE-YYYY-NNNNN --subscription &lt;subscription-id&gt; --queue</code></pre>\n<h2>8. Step 5 – Make the image pipeline remediation-aware</h2>\n<p>The pipeline needs three new parameters and a way to record why each image version was built. Here is the relevant part, added to the Part 1 pipeline:</p>\n<pre class=\"lia-code-sample language-yaml\" contenteditable=\"false\" tabindex=\"0\"><code>parameters:\n- name: imageDefinition\n  type: string\n- name: triggerReason\n  type: string\n  default: scheduled\n- name: cveIds\n  type: string\n  default: ''\n\nstages:\n- stage: Build          # Packer build from Part 1, unchanged\n  # ...\n- stage: Validate       # existing validation stage from Part 1\n  # ...\n- stage: Promote\n  dependsOn: Validate\n  jobs:\n  - deployment: Promote\n    environment: image-promotion          # add an approval check on this environment\n    strategy:\n      runOnce:\n        deploy:\n          steps:\n          - task: AzureCLI@2\n            inputs:\n              azureSubscription: $(serviceConnection)\n              scriptType: bash\n              scriptLocation: inlineScript\n              inlineScript: |\n                az sig image-version update \\\n                  --resource-group $(galleryResourceGroup) \\\n                  --gallery-name $(galleryName) \\\n                  --gallery-image-definition ${{ parameters.imageDefinition }} \\\n                  --gallery-image-version $(imageVersion) \\\n                  --set tags.triggerReason='${{ parameters.triggerReason }}' \\\n                        tags.remediatedCves='${{ parameters.cveIds }}'</code></pre>\n<p>Two details matter here:</p>\n<ul>\n<li><strong>The approval check on the promotion environment</strong> means a person still signs off before a new image version is promoted, even when the run was queued by automation.</li>\n<li><strong>Tagging the image version</strong> with <code>remediatedCves</code> gives you a clear link from the Perception session, to the pipeline run, to the image version that fixed it.</li>\n</ul>\n<p>Because the pipeline still runs your validation stage, the rebuilt image goes through the same checks as any other release.</p>\n<h2>9. Step 6 – Roll out and verify</h2>\n<p>Roll the new image version out using your normal process: reimage, redeploy or update the scale set model. Then confirm the exposure has gone:</p>\n<pre class=\"lia-code-sample language-kusto\" contenteditable=\"false\" tabindex=\"0\"><code>let approvedCves = dynamic([\"CVE-YYYY-NNNNN\"]);\nDeviceTvmSoftwareVulnerabilities\n| where CveId in~ (approvedCves)\n| summarize ExposedDevices = dcount(DeviceId) by CveId</code></pre>\n<p>Vulnerability data is refreshed periodically, so allow time after rollout before you expect the count to reach zero. Finally, re-run the Perception playbook. The finding should drop out of the prioritised list, and the new session records that the loop is closed.</p>\n<h2>10. Governance checklist</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th>Control</th><th>Where it lives</th></tr></thead><tbody><tr><td>Which CVEs to act on</td><td>Human review in the Perception session</td></tr><tr><td>Who can read vulnerability data</td><td>Graph permission <code>ThreatHunting.Read.All</code> on the bridge identity only</td></tr><tr><td>Who can see VM inventory</td><td>Reader role, scoped to the right subscriptions</td></tr><tr><td>Accidental mass rebuilds</td><td>Dry run by default; <code>--queue</code> is explicit</td></tr><tr><td>Image quality</td><td>Existing validation stage in the pipeline</td></tr><tr><td>Promotion to production</td><td>Approval check on the Azure DevOps environment</td></tr><tr><td>Audit trail</td><td>Perception session, pipeline run parameters and image version tags</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2>11. Limitations and what to watch</h2>\n<ul>\n<li><strong>Preset playbooks.</strong> Perception playbooks are set by Microsoft and you cannot create custom ones in the current release, so the hand-off to the pipeline happens after the session rather than inside it.</li>\n<li><strong>The hand-off is CVE IDs.</strong> The bridge deliberately uses public Defender and Azure APIs rather than any Perception-specific interface. If Microsoft publishes documented integration points for Perception output, the manual step could become an automation rule.</li>\n<li><strong>Data freshness.</strong> Vulnerability data is not real time. Expect a delay between rollout and a clean result.</li>\n<li><strong>Matching.</strong> Computer-name matching assumes unique host names. Test it against your naming standard before you rely on it.</li>\n<li><strong>Not every fix is an image fix.</strong> Use this path for software baked into the image; use infrastructure-as-code or policy for configuration findings.</li>\n</ul>\n<h2>Conclusion</h2>\n<p>Perception changes where a platform team's time goes. Instead of sorting a long vulnerability list, the team reviews a prioritised, explained set of findings in a session and approves what to act on. Everything after that is engineering the team already trusts: a query to find exposure, a map from VMs to images, and the same build, validate and promote pipeline used for every other release.</p>\n<p>The result is a loop that runs from <strong>exposure to fix</strong>, with a person in control at the two points that matter (what to fix, and what to promote) and a clear audit trail from the Perception session to the image version that closed the gap.</p>\n<h2>References</h2>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-overview\" rel=\"noopener\" target=\"_blank\">What is Perception? – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-concepts\" rel=\"noopener\" target=\"_blank\">Key concepts in Perception (agents and playbooks) – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-playbooks\" rel=\"noopener\" target=\"_blank\">Work with playbooks in Perception – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicetvmsoftwarevulnerabilities-table\" rel=\"noopener\" target=\"_blank\">DeviceTvmSoftwareVulnerabilities table – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/graph/api/security-security-runhuntingquery\" rel=\"noopener\" target=\"_blank\">security: runHuntingQuery – Microsoft Graph</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/governance/resource-graph/overview\" rel=\"noopener\" target=\"_blank\">Azure Resource Graph overview – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/rest/api/azure/devops/pipelines/runs/run-pipeline\" rel=\"noopener\" target=\"_blank\">Pipelines – Run Pipeline – Azure DevOps REST API</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/automating-azure-vm-image-baking-and-validation-with-packer-and-azure-devops/4557578\" rel=\"noopener\" target=\"_blank\">Automating Azure VM image baking and validation with Packer and Azure DevOps</a></li>\n</ul>"
  "99695786f45cd503769130d691cc0099":
    "id": "99695786f45cd503769130d691cc0099"
    "title": "Microsoft Perception for Azure Platform Teams: How Multi-Agent Security Works"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/microsoft-perception-for-azure-platform-teams-how-multi-agent/ba-p/4574740"
    "published": "2026-11-23 22:39:25"
    "fetched": "2026-11-25 01:35:31"
    "summary": "<p><em>This is Part 1 of a two-part series. Part 1 explains how Microsoft Perception works and why it matters to teams that run Azure infrastructure. Part 2 will connect it to a real image-automation pipeline.</em></p>\n<h2>1. Why security operations need a different model</h2>\n<p>If you run Azure platforms, you know this pattern. A scanner flags a vulnerable package in a golden image. An alert fires on a VM built from that image. Someone checks whether the alert is real, someone else works out how exposed the workload is, and a third person decides what to patch first. Each step is reasonable on its own. Together they are slow, because every hand-off waits for a person to pick up context that the previous person already had.</p>\n<p>AI assistants have helped individual analysts move faster: you ask a question, you get a summary or a query. But the hand-offs remain. Attackers, meanwhile, are increasingly using automation of their own. The gap is less about how fast one person can work and more about how quickly an organisation can move from <em>signal</em> to <em>decision</em> to <em>fix</em>.</p>\n<p>Microsoft Perception is Microsoft's answer to that gap. Instead of one assistant helping one person, it coordinates several specialised agents that share context and carry work from one stage to the next, while people stay in charge of the decisions that matter.</p>\n<h2>2. What is Microsoft Perception?</h2>\n<p>Microsoft Learn describes Perception as a coordinated, multi-agent defense system designed to help security teams protect continuously, respond faster, and reduce risk. It was introduced earlier this year as <em>Project Perception</em> and announced as Microsoft Perception at Microsoft Ignite 2026.</p>\n<p>Three things are worth knowing up front:</p>\n<ul>\n<li><strong>It lives in the Microsoft Defender portal.</strong> You select <em>Perception</em> in the Defender navigation pane. There is no separate console to deploy.</li>\n<li><strong>It works with agents that Microsoft publishes.</strong> These are purpose-built security agents, not general chatbots.</li>\n<li><strong>Humans approve the important steps.</strong> Agents surface recommendations and ask for approval when needed, and every piece of work is recorded.</li>\n</ul>\n<p>Availability and licensing are changing quickly, so check the Microsoft Learn documentation linked at the end for the current status before you plan a rollout.</p>\n<h2>3. Why multi-agent, and not one bigger assistant?</h2>\n<p>Security work naturally splits into different ways of thinking. An attacker asks, \"Where can I get in?\" A defender asks, \"Is this real and how bad is it?\" An engineer asks, \"What do I fix first so this can't happen again?\" Each question needs different data, different tools and different judgement.</p>\n<p>Putting all of that into a single assistant makes it a generalist that does everything adequately. Splitting it across specialised agents lets each one be good at a narrow job. The hard part then becomes coordination: getting the output of one agent into the next without losing context. That coordination is what Perception adds.</p>\n<p>If you've built agentic systems yourself, the shape will feel familiar: specialised workers, shared state, a defined workflow and a human-in-the-loop checkpoint. The difference is that Perception packages this for security operations, with the agents, permissions and audit trail already built in.</p>\n<h2>4. The three agent teams</h2>\n<p>Perception borrows from classic security exercises and groups its agents into three teams. Microsoft Learn describes them as red team agents that expose vulnerabilities before attackers can exploit them, blue team agents that detect, triage and investigate threats, and green team agents that remediate and harden posture.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th>Team</th><th>Agent</th><th>What it does</th></tr></thead><tbody><tr><td>Red</td><td>Recon Agent</td><td>Scouts your environment the way an attacker would, surfacing attack paths, choke points, valuable assets, configuration issues and excess permissions.</td></tr><tr><td>Blue</td><td>Triage Agent</td><td>Classifies alerts as true or false positives and explains its reasoning, learning from context and feedback.</td></tr><tr><td>Blue</td><td>Threat Intelligence Agent</td><td>Turns threat intelligence into structured objects such as attack techniques, indicators and CVEs.</td></tr><tr><td>Blue</td><td>Attack Investigation Agent</td><td>Reconstructs the full attack story across alerts and incidents, with verdict, timeline and affected entities.</td></tr><tr><td>Blue</td><td>Detection Authoring Agent</td><td>Finds gaps in detection coverage and creates new detection rules.</td></tr><tr><td>Green</td><td>Posture Prioritization Agent</td><td>Ranks posture issues by real-world risk, exposure, exploitability and asset criticality, and explains what to fix first and why.</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>Together these form a closed loop: red finds weaknesses, blue checks what is actually happening, and green decides what to improve. Each pass makes the next one better informed.</p>\n<h2>5. Architecture: sessions, agents and playbooks</h2>\n<p>Perception organises all agentic work around three concepts. Once you understand these, the rest of the product makes sense.</p>\n<img />\n<h3>Agents</h3>\n<p>An agent is a software entity that can reason, use tools and carry out tasks. Before a Perception agent can run, it needs its own <strong>agent identity and role assignment</strong>. That is an important design choice: an agent never borrows a user's permissions, and its access can be scoped, reviewed and removed like any other identity. If your organisation scopes access with Defender for Endpoint device groups or Defender unified RBAC, the agent identity has to be granted the scopes it needs.</p>\n<h3>Playbooks</h3>\n<p>A playbook is a reusable, agent-driven set of actions for a specific security objective. It assigns a team of agents a set of objectives and orchestrates them through the workflow. Some points from the documentation that matter for planning:</p>\n<ul>\n<li>Playbooks are <strong>preset by Microsoft</strong>. In the current release you can't create custom ones.</li>\n<li>One playbook can use several agents, and one agent can appear in several playbooks.</li>\n<li>Some playbooks need an <strong>input</strong> before they start, such as an incident ID, a threat intelligence article or an Azure subscription.</li>\n<li>A playbook is only active when <strong>all</strong> of its required agents are set up and enabled.</li>\n<li>All playbooks can be run manually, and some can also be triggered by automation rules.</li>\n</ul>\n<p>Examples of documented playbooks include <em>Triage alert</em>, <em>Investigate attack</em>, <em>Extract threat intelligence</em> and <em>Protect against a threat</em>. The last one is a good illustration of multi-agent work, covered in the next section.</p>\n<h3>Sessions</h3>\n<p>A session is the record of an agent interaction. It captures activity, decisions, inputs, outputs and any approvals or human interventions. A session can involve one agent or several working together, and its status reflects the state of all tasks inside it. For auditors and change managers, this is the most reassuring part of the design: every piece of agent work leaves a reviewable trail.</p>\n<h3>Four ways in</h3>\n<p>Inside the Defender portal, Perception has five main areas: <strong>New Chat</strong>, <strong>Sessions</strong>, <strong>Agents</strong>, <strong>Playbooks</strong> and <strong>Insights</strong>. You can start work by describing a task in natural language in Chat (Perception picks a playbook and fills in inputs), by running a playbook directly, by running a single agent, or by letting an automation rule start a playbook.</p>\n<h2>6. How the agents collaborate: \"Protect against a threat\"</h2>\n<p>The <em>Protect against a threat</em> playbook shows the model end to end. It takes a threat intelligence source and produces attack path analysis, posture findings, prioritised remediation and new detection rules. Four agents take part, and each one's output feeds the next:</p>\n<ol>\n<li><strong>Threat Intelligence Agent</strong> reads the threat report and extracts the techniques, indicators and CVEs involved.</li>\n<li><strong>Recon Agent</strong> uses that intelligence to look for matching attack paths and exposures in your environment.</li>\n<li><strong>Posture Prioritization Agent</strong> ranks the findings by real risk, so the team sees what to fix first and why.</li>\n<li><strong>Detection Authoring Agent</strong> creates detection rules for the techniques that are not yet covered.</li>\n</ol>\n<p>Done by hand, this is several days of work across a threat intel analyst, a security engineer and a platform team. Here it becomes a single session that an analyst starts, watches and approves. The people are still there; they just spend their time reviewing conclusions instead of gathering evidence.</p>\n<h2>7. Perception and Security Copilot</h2>\n<p>A common question is how Perception relates to Microsoft Security Copilot. A simple way to think about it:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th>Aspect</th><th>Security Copilot</th><th>Microsoft Perception</th></tr></thead><tbody><tr><td>Main role</td><td>Helps an analyst with a task</td><td>Coordinates agents through a security workflow</td></tr><tr><td>Interaction</td><td>You ask, it answers</td><td>You start a playbook or describe a goal; agents carry it forward</td></tr><tr><td>Unit of work</td><td>A prompt or a promptbook</td><td>A session driven by a playbook</td></tr><tr><td>Human role</td><td>Directs each step</td><td>Supervises, approves and redirects</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>They are complementary rather than competing. Many teams will use an assistant for ad-hoc questions and a coordinated system for repeatable workflows.</p>\n<h2>8. Security and governance: keeping humans in control</h2>\n<p>Handing security work to agents raises fair questions. Perception answers them in four ways:</p>\n<ul>\n<li><strong>Identity per agent.</strong> Each agent runs under its own identity and role, so its access is explicit and can be reviewed.</li>\n<li><strong>Role-based access for people.</strong> Perception relies on Defender unified RBAC (URBAC), which must be enabled across all Defender workloads. Security Admins set up and remove agents; Security Readers can start and work with sessions. Starting a playbook needs Run access to every agent it uses.</li>\n<li><strong>Approvals and stop controls.</strong> Agents pause and ask for input when a decision needs a person. Users can approve, reject, give alternative guidance or stop a session, which ends all ongoing agent work.</li>\n<li><strong>A full audit trail.</strong> Sessions record what each agent did, with what input, and who approved what.</li>\n</ul>\n<p>For platform teams this matters as much as accuracy. An agent that can act but can't be audited is a risk; one that acts inside a clear identity, permission and approval model is something you can put in front of a change advisory board.</p>\n<h2>9. What this means for Azure platform teams</h2>\n<p>Most Perception material is written for security operations centres. It is just as relevant to teams that build and run Azure infrastructure:</p>\n<ul>\n<li><strong>Prioritising image and VM vulnerabilities.</strong> The Posture Prioritization Agent ranks issues by exposure and asset criticality, which is exactly the question a golden-image team asks: which CVE do we rebuild for first?</li>\n<li><strong>Understanding real attack paths.</strong> The Recon Agent's view of attack paths, choke points and excess permissions helps platform teams see how a misconfigured subscription or identity can be used, not just that it exists.</li>\n<li><strong>Cutting alert noise.</strong> The Triage Agent's false-positive filtering means infrastructure teams get pulled into fewer incidents that turn out to be nothing.</li>\n<li><strong>Closing the loop with automation.</strong> Perception decides what matters; your pipelines (Packer, Azure DevOps, Bicep) still make the change. That hand-off from prioritised finding to automated, validated fix is where platform engineering adds value.</li>\n</ul>\n<h2>10. Getting ready</h2>\n<p>If you want to try Perception, these are the documented prerequisites and first steps:</p>\n<ol>\n<li>Make sure you have access to the Microsoft Defender portal.</li>\n<li>Enable Defender unified RBAC across all Defender workloads.</li>\n<li>Have at least one Security Admin who can set up agent identities and permissions.</li>\n<li>If you scope access with device groups or RBAC scopes, plan what each agent identity needs to see.</li>\n<li>Start simple: ask a question in Chat, or run a single-agent playbook such as <em>Triage alert</em>, then review the session it creates.</li>\n</ol>\n<h2>Conclusion and what's next</h2>\n<p>Microsoft Perception moves security AI from \"help me do this task\" to \"coordinate this workflow, and check with me before anything important happens\". Its building blocks are simple: agents with their own identities, Microsoft-published playbooks that coordinate them, and sessions that record everything. The red, blue and green teams give a structure that both security and platform engineers can reason about.</p>\n<p>In <strong>Part 2</strong>, I'll take this into a hands-on scenario: taking a prioritised finding about a vulnerable VM image and connecting it to an automated rebuild-and-validate pipeline, so the loop runs from exposure to fix.</p>\n<h2>References</h2>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-overview\" rel=\"noopener\" target=\"_blank\">What is Perception? – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-concepts\" rel=\"noopener\" target=\"_blank\">Key concepts in Perception – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-playbooks\" rel=\"noopener\" target=\"_blank\">Work with playbooks in Perception – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-get-started\" rel=\"noopener\" target=\"_blank\">Get started with Perception – Microsoft Learn</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/security/agentic-security/\" rel=\"noopener\" target=\"_blank\">Perception documentation – Microsoft Learn</a></li>\n</ul>"
