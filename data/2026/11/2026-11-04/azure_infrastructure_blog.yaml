  "eefbf8d7a0a02575da871f39c7d1a519":
    "id": "eefbf8d7a0a02575da871f39c7d1a519"
    "title": "Azure Local: 10 mistakes that can derail your deployment before it starts"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/azure-local-10-mistakes-that-can-derail-your-deployment-before/ba-p/4569922"
    "published": "2026-11-04 05:53:03"
    "fetched": "2026-11-04 07:06:29"
    "summary": "<h5><span>Over the past few years, starting back when it was still called Azure Stack HCI, I've spent most of my time on Azure Local: scoping calls, design reviews, workshops, assessments and more escalations than I'd like to count. When I look back at the projects that went sideways, very few started with a product defect. They started with a decision made too early, too late, or without the right people in the room.</span><span>&nbsp;</span></h5>\n<h5><span>This post is for the people who design, deploy and run Azure Local: architects, partners and platform teams. For each mistake I cover what we see in the field, what's going on under the hood, and what to check instead, with the commands and settings I look at during reviews.</span><span>&nbsp;</span></h5>\n<h5><span>Three ground rules. The customer stories are real but anonymized. Prices are list prices at the time of writing. And Azure Local changes every month, so treat the Microsoft Learn pages listed at the end as the source of truth. Where a behavior changed in a specific release, I say which one. One more note on vocabulary: the documentation now says \"machines\", while most of us in the field still say \"nodes\". I use both.</span></h5>\n<h3><span class=\"lia-text-color-10\"><strong>The ten mistakes at a glance&nbsp;</strong></span></h3>\n<p><span>The mistakes follow the order a project meets them: <strong><span class=\"lia-text-color-11\">Plan</span></strong>, before the purchase order; <span class=\"lia-text-color-11\"><strong>Design</strong></span>, where some choices can't be undone; and <strong><span class=\"lia-text-color-11\">Operate</span></strong>, life after Day 1.</span><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-solid\" style=\"width: 100%; height: 850.094px; border-width: 1px;\"><tbody><tr style=\"height: 67px;\"><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><strong><span>#</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><strong><span>Mistake</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><strong><span>Phase</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><strong><span>Can you undo it after deployment?</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><strong><span>The check that prevents it</span><span>&nbsp;</span></strong></p>\n</td></tr><tr style=\"height: 67.2188px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>1</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Selling a hypervisor, not a hybrid platform</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-2 lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Plan</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Partly, with rework on every VM</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>A fit workshop before the hardware conversation</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2188px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>2</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Buying hardware before the design</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-2 lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Plan</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Only by buying again</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Catalog and per-role NIC validation</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 95px;\"><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>3</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Skipping the landing zone discussion</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-2 lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Plan</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Not the placement: Azure Local resources can't be moved</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Subscriptions/RGs, RBAC, policy and extension rules agreed up front</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 95px;\"><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>4</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>DNS that can't change after deployment</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-3 lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Design</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>No, for infrastructure DNS</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>DNS addresses that outlive the servers behind them</span><span> (VIPs or Forwarders)</span></p>\n</td></tr><tr style=\"height: 95px;\"><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>5</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Overlapping IPs and no room to grow</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-3 lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Design</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>No, for most ranges</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>One IP worksheet, checked against on-premises and Azure</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2188px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>6</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>AD, firewall and proxy left to Day 1</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-3 lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Design</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Yes, but the deployment stalls</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>The Environment Checker in week one</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2188px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>7</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>No headroom in storage or network</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-3 lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Design</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Yes, with budget and lead time</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Sizing for repair, growth and efficiency</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67px;\"><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>8</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>Testing in production</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-4 lia-border-color-6\" style=\"height: 67px;\">\n<p><span>Operate</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>Yes</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>A representative Dev/Test cluster</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2188px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>9</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Updating without a readiness routine</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-4 lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Operate</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>Yes, while you're still in support</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2188px;\">\n<p><span>The same routine before every window</span><span> and after.</span></p>\n</td></tr><tr style=\"height: 95px;\"><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>10</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>No Day-2 plan</span><span>&nbsp;</span></p>\n</td><td class=\"lia-background-color-4 lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Operate</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Yes, ideally before the first incident</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Monitoring, alerts, backup, DR and recovery keys before go-live</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 6.58017%;\" /><col style=\"width: 30.1205%;\" /><col style=\"width: 6.76552%;\" /><col style=\"width: 27.2564%;\" /><col style=\"width: 29.3701%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<img /><span><span>Figure 1. The ten mistakes across the project lifecycle. The later one is found, the more it costs to fix.</span></span>\n<h3><span><span>&nbsp;</span></span><strong><span><span>Why early mistakes get expensive fast</span></span><span>&nbsp;</span></strong></h3>\n<p><strong><span class=\"lia-text-color-8\">Licensing is an equation, not a default&nbsp;</span></strong></p>\n<p><span>Azure Local is billed per physical core, per month, through your Azure subscription. The storage design decides which meter you pay:</span><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-11 lia-border-style-solid\" style=\"width: 96.2037%; height: 212.93px; border-width: 1px;\"><tbody><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-11\" style=\"height: 67.2266px;\">\n<p><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 67.2266px;\">\n<p><strong><span>Hyperconverged (Storage Spaces Direct)</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 67.2266px;\">\n<p><strong><span>With external SAN storage</span><span> or Full SAN</span></strong></p>\n</td></tr><tr style=\"height: 39.2383px;\"><td class=\"lia-border-color-11\" style=\"height: 39.2383px;\">\n<p><strong><span>Meter</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 39.2383px;\">\n<p><span>L1</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 39.2383px;\">\n<p><span>L2</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 39.2383px;\"><td class=\"lia-border-color-11\" style=\"height: 39.2383px;\">\n<p><strong><span>List price</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 39.2383px;\">\n<p><span>$10 per physical core per month</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 39.2383px;\">\n<p><span>$20.10 per physical core per month</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-11\" style=\"height: 67.2266px;\">\n<p><strong><span>Azure Hybrid Benefit</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 67.2266px;\">\n<p><span>Waives the fee if you have Windows Server Datacenter with Software Assurance</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-11\" style=\"height: 67.2266px;\">\n<p><span>Not available</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 17.8264%;\" /><col style=\"width: 48.8413%;\" /><col style=\"width: 33.3338%;\" /></colgroup></table></div>\n<p><span>If your hardware ships with an OEM Azure Local license, read the footnotes on the pricing page: it lists a separate rate of $10 per core per month for OEM-licensed instances with external storage attached.</span><span>&nbsp;</span></p>\n<p><span>So L1 looks like the obvious winner, until you price the disks. Here's a simplified example I use with customers. A team starts on Storage Spaces Direct, then realizes two months in that a SAN fits their estate better.</span><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-border-color-6\">\n<p><span>Cluster</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>4 machines, 256 physical cores</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Drives</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>32 NVMe drives at about $2,000 each: $64,000</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Monthly difference between L2 and L1</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>256 cores × $10.10 = $2,585.60</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Saved by running two months on L1</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>$5,171</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Net cost of the false start</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>About $58,829, before any migration work</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Months of L1 savings needed to pay for the drives</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>About 24.75, or about 12.4 with Azure Hybrid Benefit</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p><span>I've seen customers move from L1 to L2 and pay less overall, with better storage efficiency, and I've seen the opposite. I<strong>t's an equation each customer has to solve before the purchase order,</strong> especially when a VMware renewal has already made cost the headline. And because the fee is per physical core, the CPU choice is a licensing decision too: cores the workloads don't need are a monthly cost, not a one-time one.</span><span>&nbsp;</span></p>\n<p><span>Two billing details catch people out. New registrations get a 60-day free trial, so the meter starts later than the deployment. And retiring an instance is a billing event too: if you stop using it without deleting its Azure resource, billing continues until it has been disconnected for more than 31 days. <strong>Delete what you decommission.</strong></span><strong><span>&nbsp;</span></strong></p>\n<p><strong><span class=\"lia-text-color-8\">People are part of the cost&nbsp;</span></strong></p>\n<p><span>Many teams rush to Azure Local because the VMware renewal date is coming, planning to migrate first and figure it out afterwards. That bill arrives later, as training under pressure, avoidable mistakes and outages. Engineers with 25 or 40 years of VMware experience are an asset, but Azure Local is a different beast, and the <strong>mindset shift is a lot like the move from on-premises to the cloud.</strong></span><strong><span>&nbsp;</span></strong></p>\n<p><span><strong>Upskill before Day 1</strong>, not after the first incident. Arc Jumpstart LocalBox is a good place to start: it deploys a complete Azure Local sandbox, nested inside a single Azure VM, so the team can practice deployment, VM provisioning, updates and break-fix without touching production (Which is also a common pattern - no Dev/test clusters planned as part of the PO)</span></p>\n<h4><span><span><span class=\"lia-text-color-8\"><strong>Mistake 1:</strong></span> <strong>Selling a hypervisor, not a hybrid platform</strong></span></span><span>&nbsp;</span></h4>\n<p><span>The most common expectation I hear is some version of \"a vSphere look-alike we deploy once and run however we like.\" Azure Local isn't that, and pretending otherwise sets the project up for disappointment.</span><span>&nbsp;</span></p>\n<p><span>The way I explain it: Hyper-V on Windows Server 2025 is a set of building blocks. It's Lego, and you can design it however you want as long as you respect the foundational patterns. Azure Local runs on the same Hyper-V engine, but it was designed from day one as a complete solution and a true extension of Azure. That brings a cloud-like experience on-premises, with obligations attached.</span><span>&nbsp;</span></p>\n<p><span><span>Under the hood</span></span><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-double\" style=\"width: 100%; height: 414.61px; border-width: 1px;\"><tbody><tr style=\"height: 39.2383px;\"><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><strong><span>Hyper-V on Windows Server 2025</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><strong><span>Azure Local</span><span>&nbsp;</span></strong></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>What you get</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>A role on a general-purpose OS. You assemble the solution</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>A validated solution: OS, hardware, Azure services and lifecycle, deployed and updated as one</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 39.2383px;\"><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><strong><span>Hardware</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><span>Any hardware certified for Windows Server</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><span>Solutions listed in the Azure Local catalog</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>Licensing</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Windows Server licenses, per core</span><span> or PAYG with Azure-Arc</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Per physical core per month through Azure. Guest OS licensing is a separate decision</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>Connection to Azure</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Optional</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Required: the instance must sync at least once every 30 days</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>Updates</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Your tools, your cadence</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Solution updates covering the OS, agents and OEM extension. Stay within six months</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>VM management</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Hyper-V Manager, Failover Cluster Manager, Windows Admin Center, SCVMM, PowerShell</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Azure Local VMs managed from Azure, or Hyper-V VMs managed locally</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><span><strong>The VM management model deserves its own decision record</strong>, because it shapes recovery and migration later. Azure Local VMs enabled by Azure Arc are created and managed through Azure:<span class=\"lia-text-color-11\"><strong> the portal, Azure CLI or any IaC tool that can interact with ARM APIs</strong></span>. Their lifecycle operations (create, start and stop, delete, NIC and disk changes, vCPU and memory changes, extensions) belong there. Hyper-V Manager, Failover Cluster Manager, Windows Admin Center and PowerShell <span class=\"lia-text-color-8\"><strong>are supported only for the operations on Microsoft's supported list.</strong></span> <strong><span class=\"lia-text-color-12\">A few things aren't supported with any tool:</span></strong> changing a NIC's VLAN ID, live-migrating a VM to another cluster, storage live migration, changing the disk type, and cloning. Live migration between machines of the same instance is fine.</span><span>&nbsp;</span></p>\n<p><span>Hyper-V VMs created locally run on the same hypervisor but don't show up as Azure Local VMs. You can Arc-enable their guest OS to bring Azure management services to them, but their lifecycle stays local. Neither model is wrong. Mixing them without rules is how you end up with VMs nobody can recover the same way twice.</span><span>&nbsp;</span></p>\n<p><u><span>N.B : The Hyper - VM living in Azure Local today can become hydrated to Azure Local native VMs once the hydration feature is out.</span></u></p>\n<h4><span class=\"lia-text-color-11\"><strong>What to do instead&nbsp;</strong></span></h4>\n<ul>\n<li><span>Run a fit workshop before the hardware conversation, covering workloads, the VM management model, connectivity and the update lifecycle.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Record the VM management model for each workload class, with the reasons.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Be explicit about the 30-day sync. If a site genuinely can't connect, that's a different design conversation, and you want it now, not after delivery.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>If the customer is weighing Azure Local against Hyper-V on Windows Server 2025, score both honestly.<strong> Sometimes the Lego set is the right answer.</strong></span></li>\n</ul>\n<h4><strong><span><span><span class=\"lia-text-color-8\">Mistake 2:</span> Buying hardware before the design</span></span><span>&nbsp;</span></strong></h4>\n<p><span>Too often, the quote arrives before the architecture. A bill of materials gets approved, and the NICs, drives and storage protocol are locked in by procurement instead of design.</span><span>&nbsp;</span></p>\n<p><span>I've watched a seven-figure order of servers and SAN storage go through for Azure Local before anyone validated the design. Then the network adapters turned out not to be supported for the chosen storage protocol, and the fallback plan became the very platform the team was trying to leave. Nobody was careless. They trusted an earlier assurance and skipped validation.</span><span>&nbsp;</span></p>\n<h5><span class=\"lia-text-color-11\"><strong>Under the hood&nbsp;</strong></span></h5>\n<p><span>Azure Local hardware is a validated solution, not a parts list. These are the checks I make before any order:</span><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-center\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-groove\" style=\"width: 100%; height: 442.598px; border-width: 1px;\"><tbody><tr style=\"height: 39.2383px;\"><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><strong><span>Check</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><strong><span>Why it matters</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39.2383px;\">\n<p><strong><span>Where to verify</span><span>&nbsp;</span></strong></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>The exact configuration is in the Azure Local catalog</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Solution updates deliver OEM drivers and firmware through the Solution Builder Extension, on hardware the OEM has validated</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><a href=\"https://azurelocalsolutions.azure.microsoft.com/#/catalog\" rel=\"noopener\" target=\"_blank\">Azure Local Solutions | Microsoft</a></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>Each NIC is qualified for the traffic it will carry</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Adapters are qualified per traffic type: management, compute (Standard or Premium) and storage (Standard or Premium). Using one outside its qualification isn't supported</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><a href=\"https://learn.microsoft.com/en-us/azure/azure-local/concepts/host-network-requirements?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Host network requirements for Azure Local - Azure Local | Microsoft Learn</a></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>The RDMA protocol fits the switches</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Deployment supports RoCEv2 or iWARP. RoCE depends on Data Center Bridging configured end to end</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><a href=\"https://learn.microsoft.com/en-us/azure/azure-local/concepts/physical-network-requirements?view=azloc-2610&amp;tabs=24H2reqs\" rel=\"noopener\" target=\"_blank\">Physical network requirements for Azure Local - Azure Local | Microsoft Learn</a></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>The storage path and protocol are settled</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Storage Spaces Direct versus external SAN changes the meter, the NIC requirements and the support matrix</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span><a href=\"https://azure.microsoft.com/en-us/pricing/details/azure-local/?msockid=3f310ba783ba61e12ddf1d61821260c6#pricing\" rel=\"noopener\" target=\"_blank\">Azure Local Pricing | Microsoft Azure</a>,&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/azure-local/concepts/san-requirements?view=azloc-2610&amp;tabs=Dell-PowerStore-support\" rel=\"noopener\" target=\"_blank\">Supported SAN solutions on Azure Local - Azure Local | Microsoft Learn</a></span></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>Some drive bays stay empty</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Empty bays are the cheapest growth you'll ever have. Full bays make the next increment a whole node</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><a href=\"https://azure.github.io/odinforazurelocal/sizer/\" rel=\"noopener\" target=\"_blank\">ODIN Sizer - Azure Local Sizing Tool</a></p>\n</td></tr><tr style=\"height: 67.2266px;\"><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><strong><span>Switched or switchless storage is a conscious choice</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><span>Switchless saves switches on day one but limits how the cluster grows</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67.2266px;\">\n<p><a href=\"https://learn.microsoft.com/en-us/azure/azure-local/plan/network-patterns-overview?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Network reference patterns overview for Azure Local - Azure Local | Microsoft Learn</a></p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><span><span class=\"lia-text-color-8\"><strong>One more thing to ask the OEM</strong></span>: which Solution Builder Extension (<strong>SBE</strong>) support the configuration gets, and how quickly feature releases reach it. <u>Feature releases arrive on hardware that uses the extension only after the OEM has validated them.</u></span><u><span>&nbsp;</span></u></p>\n<h4><strong><span class=\"lia-text-color-11\">What to do instead&nbsp;</span></strong></h4>\n<ul>\n<li><span>Design first, then the bill of materials.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Validate every NIC, drive and storage path for the role it will play, not just the server model.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Run the licensing equation from the previous section before choosing the storage path.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>When something is borderline, ask for a validation deployment before the full order.</span><span>&nbsp;</span></li>\n</ul>\n<h4><strong><span><span><span class=\"lia-text-color-8\">Mistake 3: </span>Skipping the Azure landing zone discussion</span></span><span>&nbsp;</span></strong></h4>\n<p><span>This is the one I push hardest, because of Arc. Every Azure Local instance projects its resources into Azure, into an environment that's <strong><u>either </u></strong>well structured or not. If you're plugging into an existing Azure estate, <span class=\"lia-text-color-8\"><strong>the plumbing has to be right.</strong></span></span><span class=\"lia-text-color-8\"><strong>&nbsp;</strong></span></p>\n<p><span>Azure Local has historically been driven by OEMs and partners, and many only ask the customer for a subscription ID and enough permissions to deploy. <span class=\"lia-text-color-8\"><strong>The instances land somewhere in Azure and nobody assesses the risks</strong></span>. I've also seen a VM recovery stall because its image lived in a different resource group.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img /><span><span>Figure 2. An Azure Local instance lands inside your Azure governance: management groups, policy, RBAC and resource group layout all apply from day one.</span></span>\n<p>&nbsp;</p>\n<h5><span class=\"lia-text-color-11\"><strong>Under the hood&nbsp;</strong></span></h5>\n<p><span><span class=\"lia-text-color-8\"><strong>Placement is permanent</strong></span>.</span><span> The Azure Local FAQ is explicit: moving resources between subscriptions or resource groups isn't supported for any Azure Local resource. To change location, you redeploy the instance into the new subscription and resource group. <span class=\"lia-text-color-11\"><strong>Decide the layout once, deliberately.</strong></span></span><span class=\"lia-text-color-11\"><strong>&nbsp;</strong></span></p>\n<p><span>Prerequisites belong in the landing zone, not the deployment call.</span><span> The subscription needs these resource providers registered:</span><span>&nbsp;</span></p>\n$providers = \"Microsoft.HybridCompute\", \"Microsoft.GuestConfiguration\", \"Microsoft.HybridConnectivity\", \"Microsoft.AzureStackHCI\", \"Microsoft.Kubernetes\", \"Microsoft.KubernetesConfiguration\", \"Microsoft.ExtendedLocation\", \"Microsoft.ResourceConnector\", \"Microsoft.HybridContainerService\", \"Microsoft.Attestation\", \"Microsoft.Storage\", \"Microsoft.Insights\", \"Microsoft.KeyVault\" foreach ($p in $providers) { az provider register --namespace $p }\n<p><span>Deployment roles are assigned on the resource group. Registering the machines with Azure Arc needs Azure Connected Machine Onboarding and Azure Connected Machine Resource Administrator. Deploying the instance needs Azure Stack HCI Administrator, Reader, Key Vault Data Access Administrator <em>(an owner on a Sub does not give you Data plan permissions)</em> , Key Vault Secrets Officer, Key Vault Contributor and Storage Account Contributor. Those are deployment rights. Operations teams need a different, smaller set, and the two shouldn't be the same standing assignments.</span><span>&nbsp;</span></p>\n<p><span>Policy reaches the nodes.</span><span> Each machine is an Arc-enabled server, so <span class=\"lia-text-color-8\"><strong>any policy assignment that targets Arc machines, at management group or subscription scope, applies to your cluster nodes as well</strong></span>. <span class=\"lia-text-color-6\"><strong>Azure Local isn't a standard Arc-enabled server, though</strong></span>. Updates are a good example: <strong>Microsoft's guidance is not to update Azure Local through Azure Update Manager's Machines pane or the Arc machine's Updates pane (nor through SConfig, Windows Admin Center or manual Cluster-Aware Updating runs), because that can install unsupported out-of-band updates and add billing for periodic assessment and patching. A patching policy inherited from the cloud side can do exactly that. List what actually lands on the resource group, inherited assignments included:</strong></span><strong><span>&nbsp;</span></strong></p>\naz policy assignment list --scope \"/subscriptions/&lt;sub-id&gt;/resourceGroups/&lt;rg&gt;\" --disable-scope-strict-search -o table\n<p>&nbsp;</p>\n<p><span class=\"lia-text-color-8\"><strong>Extensions are admin access.</strong></span><span> On the nodes and on Arc-enabled VMs, the Connected Machine agent's extension manager runs as Local System on Windows (root on Linux). Deploying an extension requires </span><span>Microsoft.HybridCompute/machines/extensions/write</span><span>, which the Azure Connected Machine Resource Administrator role includes, along with broad roles like Contributor. <span class=\"lia-text-color-8\"><strong>Whoever holds that permission at a scope covering your machines can run code with full rights on them. Treat it like local administrator access to the cluster.</strong></span></span><span class=\"lia-text-color-8\"><strong>&nbsp;</strong></span></p>\n<h4><strong><span class=\"lia-text-color-11\">What to do instead&nbsp;</span></strong></h4>\n<ul>\n<li><span>Start the conversation in Azure, before the OEM deploys anything: <strong>are landing zones in place? is the Cloud Adoption Framework followed? does the Sovereign Landing Zone apply?</strong></span><strong><span>&nbsp;</span></strong></li>\n</ul>\n<ul>\n<li><span>Settle the subscription and resource group layout knowing you can't move it later.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Separate deployment roles from operations roles, and make elevated access time-bound using <strong>PIM and a structured SG layout.</strong></span></li>\n</ul>\n<ul>\n<li><span>Review every inherited policy assignment that targets Arc machines, and<strong> add exemptions where a policy assumes a regular server.</strong></span><strong><span>&nbsp;</span></strong></li>\n</ul>\n<ul>\n<li><span>Decide who may deploy extensions to nodes and VMs, and <strong>audit it.</strong></span><strong><span>&nbsp;</span></strong></li>\n</ul>\n<ul>\n<li><strong><span>Bring the landing-zone owner to the first design workshop, not the deployment call.</span><span>&nbsp;</span></strong></li>\n</ul>\n<h4><strong><span><span><span class=\"lia-text-color-8\">Mistake 4:</span> DNS that can't change after deployment</span></span><span>&nbsp;</span></strong></h4>\n<p><span>Most people working with Azure Local have heard this one, and it still keeps happening. <span class=\"lia-text-color-8\"><strong>The DNS servers you give the infrastructure at deployment can't be changed afterwards.</strong></span> If they must change, <strong><u>you're looking at a rebuild.</u></strong>&nbsp;</span></p>\n<p><span>Three versions of the same story. One customer was advised not to change host DNS after deployment, did it anyway, and some VMs lost external connectivity. Another retired a domain controller without realizing it was one of the cluster's infrastructure DNS servers, and DNS went unhealthy. A third, moving to new DNS servers, tried to edit the infrastructure logical network and the change was rejected, as designed.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img /><span><span>Figure 3. Point the infrastructure at addresses designed to outlive any single DNS server.</span></span>\n<h4><span class=\"lia-text-color-11\"><strong>Under the hood:&nbsp;</strong></span></h4>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-center\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-border-color-6\">\n<p><strong><span>What you want to change</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\">\n<p><strong><span>Supported after deployment?</span><span>&nbsp;</span></strong></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>DNS servers of the infrastructure network, set at deployment</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>No. DNS updates aren't supported for the infrastructure logical network or the Arc resource bridge, and there's no documented procedure for the management network</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>DNS servers of a static workload logical network</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Yes, with&nbsp;</span><span>az stack-hci-vm network lnet update --dns-servers</span><span>. The new list replaces the old one and applies only to VMs created afterwards. Not possible on DHCP logical networks or on a logical network with an AKS cluster deployed</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>DNS settings inside an existing VM</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Yes, from inside the guest OS, like any server</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p><span><strong>Since release 2601, the infrastructure logical network also shows up in the Azure portal,</strong> named after the instance with an \"-InfraLNET\" suffix. It's there as a safeguard against provisioning workloads on the network reserved for infrastructure, and it's a useful reminder of what it holds.</span><span>&nbsp;</span></p>\n<p><span><span>What to do instead</span></span><span>&nbsp;</span></p>\n<ul>\n<li><strong><span>Plan DNS as if it has to outlive every server it points to, because it does.</span><span>&nbsp;</span></strong></li>\n</ul>\n<ul>\n<li><span>If your organization rotates DNS servers every few years,<strong> put a virtual IP, an anycast address or stable forwarders in front of them,</strong> so the real servers can change without touching what the cluster was given.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>If a DNS server the cluster uses has to be retired anyway, <strong>keep its IP alive</strong>: move the address to the replacement server or a forwarder before the old one goes.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Make sure those servers resolve both your Active Directory domain and the public Azure endpoints. <strong>Arc endpoints must resolve to public IPs.</strong></span><strong><span>&nbsp;</span></strong></li>\n</ul>\n<ul>\n<li><span>Add the cluster's DNS addresses to your domain controller decommissioning checklist.</span><span>&nbsp;</span></li>\n</ul>\n<h3><strong><span><span><span class=\"lia-text-color-8\">Mistake 5:</span> Overlapping IPs and no room to grow</span></span><span>&nbsp;</span></strong></h3>\n<p><span>IP conflicts used to hide. Now they tend to surface, usually at the worst possible moment. A workload logical network created without an explicit IP pool can claim the whole subnet, collide with the infrastructure range and get rejected. Designs that put VMs on the same subnet as the hosts hit the same wall, and a VLAN change after deployment once left a resource bridge in a failed state. Once Azure Local and Azure are connected privately, over ExpressRoute or a site-to-site VPN, overlaps stop being a local issue and become an estate-wide one.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img /><span><span>Figure 4. Every range Azure Local touches, on one page. Illustrative addressing.</span></span>\n<h4><span class=\"lia-text-color-11\"><strong>Under the hood&nbsp;</strong></span></h4>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-center\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-border-color-6\">\n<p><strong><span>Range</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\">\n<p><strong><span>Who sets it</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\">\n<p><strong><span>Fixed when</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\">\n<p><strong><span>What to check</span><span>&nbsp;</span></strong></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Machine IPs and the infrastructure IP pool, on the management subnet</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>You</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>At deployment</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>The pool needs at least six contiguous IPs not used by the machines. Machine, cluster and infrastructure IPs must sit outside 10.96.0.0/12</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Arc resource bridge pods and services</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>The platform</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Always</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>10.244.0.0/16 for pods and 10.96.0.0/12 for services. Resource bridge 1.8.0 (July 2026) reduced the service range to 10.96.0.0/24 for new deployments</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>AKS pod and service CIDRs</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>You (pods only), at cluster creation</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>At creation</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Pods default to 10.244.0.0/16 and can be set with </span><span>az aksarc create --pod-cidr</span><span>. Services use 10.96.0.0/12 and can't be customized</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Workload logical networks</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>You</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>At creation</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Address space, gateway, IP pools, VLAN ID and virtual switch can't change. Overlapping IP pools on the same VLAN aren't permitted</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Storage networks</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Network ATC</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>At deployment</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Default VLANs are 711 to 718, one per storage adapter. Override them with </span><span>Add-NetIntent -StorageVLANs</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<h4><strong><span class=\"lia-text-color-11\">What to do instead&nbsp;</span></strong></h4>\n<ul>\n<li><span>Keep one IP worksheet covering node IPs, the infrastructure pool, every logical network and its pools, the resource bridge, AKS and the storage VLANs.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Check it against everything already routed on-premises and in Azure, and again whenever the site gets a new private connection to Azure.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Give every static logical network an explicit IP pool.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Leave room in the management subnet for the machines you'll add later.</span><span>&nbsp;</span></li>\n</ul>\n<h4><strong><span><span><span class=\"lia-text-color-8\">Mistake 6:</span> Leaving AD, firewall and proxy to Day 1</span></span><span>&nbsp;</span></strong></h4>\n<p><span>These integrations are where deployments stall on the day of deployment, and some of the mistakes can't be undone afterwards.</span><span>&nbsp;</span></p>\n<p><strong><span><span>Active Directory</span></span><span>&nbsp;</span></strong></p>\n<p><span>Preparation is well documented, and the tooling does the heavy lifting:</span><span> <a href=\"https://learn.microsoft.com/en-us/azure/azure-local/deploy/deployment-prep-active-directory?view=azloc-2610\" rel=\"noopener\" target=\"_blank\">Prepare Active Directory for Azure Local deployment - Azure Local | Microsoft Learn</a></span></p>\nInstall-Module AsHciADArtifactsPreCreationTool -Repository PSGallery -Force New-HciAdObjectsPreCreation -AzureStackLCMUserCredential (Get-Credential) -AsHciOUName \"&lt;OU name or distinguished name including the domain components&gt;\"\n<p><span style=\"color: rgb(30, 30, 30);\">It creates a dedicated OU that blocks inherited GPOs and holds the deployment user.<strong> Keep one instance per OU</strong>. Believe it or not, the pattern keeps repeating anyway. Six months after a clean deployment, someone links a new GPO at the domain root, the Azure Local OU inherits it, and the next call is <strong><span class=\"lia-text-color-8\">\"my resource bridge VM is offline.\"</span></strong></span><strong><span class=\"lia-text-color-8\">&nbsp;</span></strong></p>\n<p><span>The detail people miss: <u><strong>blocking inheritance doesn't stop a GPO whose link is set to Enforced</strong></u>. Check what actually reaches the OU, not what you think reaches it:</span><span>&nbsp;</span></p>\n(Get-GPInheritance -Target \"OU=AzL-Prod01,DC=contoso,DC=com\").InheritedGpoLinks | Format-Table DisplayName, Enforced, Target\n<p><span>Replication is the other trap. Adding a node once failed validation until OU permission changes had replicated to every domain controller. Run </span><span>repadmin /replsummary</span><span> before you blame the product. And if Active Directory itself is the blocker, deployment with local identity, without AD, has been generally available since release 2604.</span><span>&nbsp;</span></p>\n<p><strong><span><span>Firewall and proxy</span></span><span>&nbsp;</span></strong></p>\n<p>&nbsp;</p>\n<img /><span><span>Figure 5. Arc gateway shrinks the allow-list, but some endpoints are always reached directly.</span></span>\n<p><span>Static IP allow-lists quietly go stale (Most modern firewalls support dynamic lists), <strong>because the addresses behind Microsoft's endpoints change over time</strong>. The firewall requirements page links per-region endpoint lists, so build rules on FQDNs, keep them under change control, and review them with each release.</span><span>&nbsp;</span></p>\n<p><span>Arc gateway changes the shape of the problem. It's generally available for new deployments, and since release 2610 it can be enabled on existing instances. Once enabled there, it can't be turned off, so rehearse it first. With the gateway, an Arc proxy on each machine sends most traffic to a single gateway FQDN, <u><strong>but some endpoints still go through your proxy or firewall directly:</strong></u></span><u><strong><span>&nbsp;</span></strong></u></p>\n<ul>\n<li><span>Bootstrap: aka.ms and azurestackreleases.download.prss.microsoft.com</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Arc registration: login.microsoftonline.com, the regional login endpoint, management.azure.com, gbl.his.arc.azure.com and the regional his.arc.azure.com endpoint</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>The gateway URL itself, your Key Vault and your cloud witness storage account</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>HTTP certificate revocation endpoints, because the gateway doesn't carry HTTP traffic</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>For AKS extensions, the regional &lt;region&gt;.obo.arc.azure.com endpoint on port 8084</span><span>&nbsp;</span></li>\n</ul>\n<p><span>The gateway doesn't work with TLS-terminating proxies, so plan for no TLS inspection on that path. Azure Arc private link scopes aren't supported by Azure Local either, and Arc endpoints must resolve to public IPs through whatever proxy you run.</span><span>&nbsp;</span></p>\n<p><span>The proxy bypass list is set during Arc registration, and its format trips people up. It must include the IP address and NetBIOS name of every machine and of the cluster, plus the infrastructure IPs or the whole infrastructure subnet. Entries are comma-separated and wildcards work, <span class=\"lia-text-color-8\"><strong>but CIDR notation and \"&lt;local&gt;\" don't:</strong></span></span><span class=\"lia-text-color-8\"><strong>&nbsp;</strong></span></p>\nInvoke-AzStackHciArcInitialization &lt;...&gt; -Proxy \"http://proxy.contoso.com:8080\" ` -ProxyBypass \"localhost,127.0.0.1,*.contoso.com,node01,node02,azlclus01,10.20.10.*\"\n<p><span>Changing proxy settings after deployment is possible from release 2610, but it's far easier to get right the first time.</span><span>&nbsp;</span></p>\n<p><span>Two smaller items cause outsized pain. The first is a reachable, verified time source: <strong>check it with </strong></span><strong><span>w32tm /query /status</span></strong><span><strong> on every machine</strong>. The second is the <span class=\"lia-text-color-8\"><strong>OEM's in-band path from the operating system to the iDRAC or iLO</strong></span>, which the Solution Builder Extension (SBE) relies on during updates.</span><span>&nbsp;</span></p>\n<p><strong><span><span>Validate in week one</span></span><span>&nbsp;</span></strong></p>\n<p><span>Deployment runs its own validation, but that's the worst possible day to discover a blocked endpoint or a missing OU permission. Run the Environment Checker yourself in week one, when there's still time to fix what it finds, and again before every update:</span><span>&nbsp;</span></p>\nInstall-Module -Name AzStackHci.EnvironmentChecker -Repository PSGallery -Force Invoke-AzStackHciConnectivityValidation Invoke-AzStackHciHardwareValidation Invoke-AzStackHciSoftwareValidation Invoke-AzStackHciNetworkValidation Invoke-AzStackHciArcIntegrationValidation Invoke-AzStackHciExternalActiveDirectoryValidation # takes your OU, domain and naming parameters\n<h4><span class=\"lia-text-color-8\"><strong>Mistake 7: <span class=\"lia-text-color-21\">No headroom in storage or network&nbsp;</span></strong></span></h4>\n<p><span>Sizing usually happens once, right before the hardware order. <span class=\"lia-text-color-8\"><strong>Then the migration starts and the cluster fills up with workloads nobody accounted for.</strong></span></span><span class=\"lia-text-color-8\"><strong>&nbsp;</strong></span></p>\n<p><span>Two things are usually missing. <u><strong>The first is repair:</strong></u> nodes go down for maintenance, disks fail, and Storage Spaces Direct needs free capacity to rebuild into. <u><strong>The second is growth.</strong></u> Azure Local keeps adding reasons to run more on it, from Azure Virtual Desktop and AKS to Foundry Local, and a cluster sized only for today's migration has nowhere to put them. On one cluster we reviewed, the pool was close to 80% full with every drive bay populated, so the only way to grow was a whole new node, with the budget and lead time that come with it.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img /><span><span>Figure 6. With a three-way mirror, usable capacity is a fraction of raw. Illustrative only; size real designs with the Azure Local sizer.</span></span>\n<h4><strong><span class=\"lia-text-color-6\">Storage, under the hood&nbsp;</span></strong></h4>\n<p><span>With three or more machines,<strong> the usual resiliency is a three-way mirror:</strong> three copies of every write, 33.3% storage efficiency. On top of that, Microsoft's guidance is to leave unallocated reserve in the pool equal to one capacity drive per server, up to four drives, so repairs have somewhere to go.</span><span>&nbsp;</span></p>\n<p><span>Run the numbers in Figure 6 and two things stand out. The reserve is capped at four drives, so it weighs less as the cluster grows: going from four to five nodes adds 20.5 TB of usable capacity while the reserve stays at 30.7 TB. And doubling the drives per node more than doubles usable capacity. <strong>Efficiency belongs in the same equation as cost, and empty drive bays are the cheapest growth path you'll ever have.</strong></span><strong><span>&nbsp;</span></strong></p>\n<p><span>To see where a pool stands today:</span><span>&nbsp;</span></p>\nGet-StoragePool -IsPrimordial $false | Select-Object FriendlyName, @{n='SizeTB'; e={[math]::Round($_.Size/1TB,1)}}, @{n='AllocatedTB'; e={[math]::Round($_.AllocatedSize/1TB,1)}}, @{n='FreeTB'; e={[math]::Round(($_.Size-$_.AllocatedSize)/1TB,1)}}\n<p><u><strong><span>If the free space is smaller than one capacity drive per node (up to four), you're already eating into repair capacity.</span><span>&nbsp;</span></strong></u></p>\n<h4><span class=\"lia-text-color-6\"><strong>Network, under the hood:</strong></span></h4>\n<p><span>I regularly find 25 GbE ports left idle, storage on 10 GbE while management and compute got the 25 GbE links, or a storage MTU left at the default. <strong>Network ATC makes the intent explicit, so start there:</strong></span><strong><span>&nbsp;</span></strong></p>\nGet-NetIntent # which adapters carry management, compute and storage Get-NetIntentStatus # did the intent apply cleanly on every machine? Get-NetAdapterRdma # is RDMA enabled where storage expects it? Get-NetAdapterAdvancedProperty -RegistryKeyword \"*JumboPacket\"\n<p><span><strong>Match storage bandwidth to drive density</strong>, <u><strong>put the fastest ports on storage, and keep jumbo frames consistent from adapter to switch</strong></u>. The deployment offers 1514, 4088 or 9014 bytes on the adapters, and Microsoft's guidance uses a 9216-byte MTU on the switch side for RDMA storage traffic.</span><span>&nbsp;<br /></span></p>\n<p><u><strong><span><span>Network intents: design for what </span><span>you'll</span><span> enable later</span></span><span>&nbsp;</span></strong></u></p>\n<p><span>Network ATC intents feel like plumbing, but they decide which features you can turn on later. In a recent case, a cluster went live with four intents: management, compute, storage, and a fourth for an isolated backup network used by a third-party backup appliance. Months later, SDN enabled by Arc stopped during enablement because it found more than three intents, and the project was blocked.</span><span>&nbsp;</span></p>\n<p><span><strong>Before SDN is enabled,</strong> the way out is manageable: remove the extra intent and its virtual switch, enable SDN, then add the backup intent back. <strong>After SDN is enabled, the options narrow</strong>. Enablement can't be rolled back or disabled, and the virtual switches carry the policies the Network Controller pushes, so removing or recreating one isn't a change to make casually. Remember too that SDN resources live on a single virtual switch, and NSGs apply to Azure Local VMs on it, so a VM that only sits on a separate backup switch won't get them.&nbsp;</span></p>\n<p><span><span class=\"lia-text-color-6\"><u><strong>If SDN is anywhere on the roadmap</strong></u></span>, check the intent design against its supported networking patterns before deployment. Microsoft Learn lists these intent configurations as unsupported for SDN enabled by Arc:</span><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-solid\" style=\"border-width: 1px;\"><tbody><tr><td class=\"lia-border-color-6\">\n<p><strong><span>Unsupported for SDN enabled by Arc</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\">\n<p><strong><span>What to do instead</span><span>&nbsp;</span></strong></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>More than three intents, on any deployment size</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Keep to management, compute and storage. Ask whether an extra network really needs its own intent</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Combined compute and storage intents, with or without a management intent</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Give storage its own intent</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>A standalone compute intent on a single-node deployment</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Group management and compute, or group all traffic on one intent</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Three intents on two-node or three-node switchless deployments</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Group management and compute in one intent, with a separate storage intent</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h4><strong><span class=\"lia-text-color-6\">What to do instead&nbsp;</span></strong></h4>\n<ul>\n<li><span>Size for repair, growth and efficiency, with the Azure Local sizer rather than a spreadsheet.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Keep the reserve unallocated, and set an expansion trigger at about 70% of usable capacity.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Leave drive bays free where the budget allows.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Validate the storage network the way you validate the servers: bandwidth, RDMA and MTU, end to end. </span><span><strong>If SDN is on the roadmap</strong>, <u>check the intent design against its supported patterns before deployment, not on enablement day.</u></span><u><span>&nbsp;</span></u></li>\n</ul>\n<h4><strong><span><span><span class=\"lia-text-color-8\">Mistake 8: </span>Testing in production</span></span><span>&nbsp;</span></strong></h4>\n<p><span><em><strong>\"We test in production.\"</strong></em> One customer team told us exactly that, and they're far from alone. Many estates have no Dev/test cluster at all, so every update and configuration change lands in production first.</span><span>&nbsp;</span></p>\n<p><span>Self-assessments can hide the problem. I've seen a team tick \"tested in a production-like environment\" when they meant test VMs running on the production cluster. <strong>That tests the VM, not the platform change you're about to make.</strong></span><strong><span>&nbsp;</span></strong></p>\n<h4><strong><span class=\"lia-text-color-6\">Under the hood:</span></strong></h4>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6\" style=\"width: 100%; height: 307px; border-width: 1px;\"><tbody><tr style=\"height: 39px;\"><td class=\"lia-border-color-6\" style=\"height: 39px;\">\n<p><strong><span>Option</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39px;\">\n<p><strong><span>Good for</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39px;\">\n<p><strong><span>What it can't tell you</span><span>&nbsp;</span></strong></p>\n</td></tr><tr style=\"height: 95px;\"><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Arc Jumpstart LocalBox, nested in Azure</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Learning, runbooks and Azure-side operations: VM provisioning, policy, monitoring, the update procedure</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 95px;\">\n<p><span>Your firmware, drivers, OEM extension, physical network or performance</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67px;\"><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>A small cluster on different hardware</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>The solution update flow, Azure integrations, operational procedures</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>How your NICs, RDMA, firmware and OEM extension behave</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 67px;\"><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>A small cluster on the same hardware generation, NICs and solution version</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>Nearly everything, including OEM updates and network intents</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 67px;\">\n<p><span>Effects that only appear at scale</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 39px;\"><td class=\"lia-border-color-6\" style=\"height: 39px;\">\n<p><span>Test VMs on the production cluster</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39px;\">\n<p><span>Guest-level changes</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\" style=\"height: 39px;\">\n<p><span>Any platform change. It's still production</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><span>The changes worth rehearsing are the ones you can't take back, or that touch every node: solution updates including the OEM extension, adding or repairing a node, secret and certificate rotation, enabling Arc gateway on an existing instance, and restore and failover tests.</span><span>&nbsp;</span></p>\n<h4><span class=\"lia-text-color-6\"><strong>What to do instead&nbsp;</strong></span></h4>\n<p><span>A Dev/test environment doesn't need to match production in scale. Few customers validate fixes on a smaller UAT clusters after updating them, ran several rounds of testing, and only then planned the rollout to the rest of the estate. That's the pattern to copy.</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Build something representative, not big: same hardware generation, same solution version, comparable network.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Update it first, every time.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Where a test cluster genuinely can't be justified, a recurring review of planned changes is a partial mitigation, not a substitute.</span></li>\n</ul>\n<h4><strong><span><span><span class=\"lia-text-color-8\">Mistake 9:</span> Updating without a readiness routine</span></span><span>&nbsp;</span></strong></h4>\n<p><span><strong>Azure Local updates are a lifecycle, not Patch Tuesday.</strong> Each release is supported for six months, and the rule is strict: <strong>outside that window, Microsoft Support can only help you update to a supported version, even in the middle of an outage.</strong></span><strong><span>&nbsp;</span></strong></p>\n<p><span>That said, nobody has to patch every month. <span class=\"lia-text-color-6\"><strong>You need to stay inside the six-month window</strong></span>, with a maintenance routine that fits your own change calendar. What hurts is having neither: no defined window, no readiness check, and a team constantly chasing the latest release.</span><span>&nbsp;</span></p>\n<p><span>The worst case I've seen was an estate where most clusters were failing updates on mixed versions, security updates were more than a month late, and a go-live was slipping. Looking back at the update escalations I've been part of, very few came down to a single product defect. Most traced back to readiness, drift or coordination: a VLAN change that broke the resource bridge, a certificate lost during rotation, a capacity alert disabled instead of addressed, or hosts reimaged from the same OEM image ending up <span class=\"lia-text-color-8\"><strong>on different hotfix levels.</strong></span></span><span class=\"lia-text-color-8\"><strong>&nbsp;</strong></span></p>\n<p>&nbsp;</p>\n<img /><span><span>Figure 7. Stay inside the six-month window, and run the same routine before every maintenance window.</span></span>\n<h4><span class=\"lia-text-color-6\"><strong>Under the hood&nbsp;</strong></span></h4>\n<p><span>A solution update isn't just an OS patch. It covers the <u>operating system</u>, the <u>core agents</u> and <u>services (including the Connected Machine agent and the Arc resource bridge)</u> and, where the OEM integrates, the <u>Solution Builder Extension with drivers and firmware</u>. <span class=\"lia-text-color-8\"><strong>Out-of-band updates to individual components aren't supported</strong></span>. The typical cadence is a cumulative update every month and a feature update twice a year. Within a feature release train you can skip ahead to a later release, <strong>but you must install the last cumulative update before moving to the next feature update.</strong></span><strong><span>&nbsp;</span></strong></p>\n<p><span>Use the Azure Local view in Azure Update Manager to update at scale, or PowerShell on a node:</span><span>&nbsp;</span></p>\n# Where are we, and what's available? Get-SolutionUpdateEnvironment Get-SolutionUpdate | Format-Table DisplayName, State # Download and run the readiness checks without installing Get-SolutionUpdate -Id &lt;update-id&gt; | Start-SolutionUpdate -PrepareOnly # Install, then follow progress Get-SolutionUpdate -Id &lt;update-id&gt; | Start-SolutionUpdate Get-SolutionUpdate -Id &lt;update-id&gt; | Format-Table DisplayName, State\n<p><span>When a run stops, </span><span>Get-SolutionUpdateRun</span><span> gives you the details of where it stopped. </span><span>Start-SolutionUpdate</span><span> also has an </span><span>-IgnoreWarnings</span><span> switch. <span class=\"lia-text-color-8\"><strong>Use it only when you understand every warning it would skip.</strong></span></span><span class=\"lia-text-color-8\"><strong>&nbsp;</strong></span></p>\n<p><span>Before the window, <strong>I also check the storage layer directly,</strong> because an update that starts on a degraded pool is an escalation waiting to happen:</span><span>&nbsp;</span></p>\nGet-StorageJob | Where-Object JobState -ne 'Completed' # no repairs still running Get-VirtualDisk | Where-Object HealthStatus -ne 'Healthy' # every volume healthy Get-HealthFault # open faults on the cluster\n<h4><strong><span class=\"lia-text-color-6\">What to do instead&nbsp;</span></strong></h4>\n<ul>\n<li><span>Check: run the Environment Checker, the health checks and the OEM prerequisites, and clear open faults.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Fix drift first: versions, VLANs, certificates and disabled alerts.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Rehearse on the test cluster, on the same version as production.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Update production inside the window, and keep every cluster on the same version.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Validate afterwards: live migration, the resource bridge and your workloads.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Check the Azure Local Supportability repository on GitHub before and after each window, for known issues and troubleshooting guides.</span><span>&nbsp;</span></li>\n</ul>\n<h4><strong><span><span><span class=\"lia-text-color-8\">Mistake 10:</span> No Day-2 plan for alerts, backup and DR</span></span><span>&nbsp;</span></strong></h4>\n<p><span>Azure Local is an extension of Azure, yet many customers run it without the Azure capabilities that come with it: monitoring and alerting, Microsoft Defender for Cloud and Microsoft Sentinel, backup and disaster recovery. <strong>That's a missed opportunity, and it ties straight back to the landing zone in mistake 3.</strong></span><strong><span>&nbsp;</span></strong></p>\n<p><span>On one cluster, a volume's write latency spiked past half a second, against a customer-impact threshold of 10 milliseconds. The spike was right there in the portal. <strong>No alert fired, because no alert rules existed, and nobody noticed until we opened the workbook together.</strong> The data was being collected. Nobody was being told.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img /><span><span>Figure 8. Day 2 starts on Day 1: the Azure services that close the gaps we see most often.</span></span>\n<h4><strong><span class=\"lia-text-color-6\">&nbsp;Under the hood: monitoring&nbsp;</span></strong></h4>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><tbody><tr><td class=\"lia-border-color-6\">\n<p><strong><span>Capability</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\">\n<p><strong><span>What it needs</span><span>&nbsp;</span></strong></p>\n</td><td class=\"lia-border-color-6\">\n<p><strong><span>Cost</span><span>&nbsp;</span></strong></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Platform metrics, more than 60 of them</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>The AzureEdgeTelemetryAndDiagnostics extension</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>No extra cost</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Health alerts and recommended alert rules</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>The AzureEdgeAlerts extension, enabled from the portal</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Health alerts at no extra cost. Check Azure Monitor pricing for any metric alert rules you add</span><span>&nbsp;</span></p>\n</td></tr><tr><td class=\"lia-border-color-6\">\n<p><span>Insights workbooks</span><span>&nbsp;<br /><strong>Bonus: use the LENS workoook:</strong>&nbsp;<a href=\"https://github.com/Azure/AzureLocal-LENS-Workbook\" rel=\"noopener\" target=\"_blank\">Azure/AzureLocal-LENS-Workbook: Azure Local LENS (Lifecycle, Events &amp; Notification Status) Dashboard | Azure Workbook</a></span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Azure Monitor Agent, a data collection rule and a Log Analytics workspace</span><span>&nbsp;</span></p>\n</td><td class=\"lia-border-color-6\">\n<p><span>Log Analytics ingestion and retention</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 44.0124%;\" /><col style=\"width: 22.7161%;\" /><col style=\"width: 33.3642%;\" /></colgroup></table></div>\n<p><strong><span>A small but useful detail if you're planning the move to 2610: update the AzureEdgeAlerts extension to 12.2607.5.0 or later first.</span><span>&nbsp;</span></strong></p>\n<h4><strong><span class=\"lia-text-color-6\">Under the hood: backup and recovery&nbsp;</span></strong></h4>\n<p><span><strong>Backup scope drifts</strong>. VMs moved or re-created on another cluster can silently fall out of the backup job meant to protect them, <strong>so check scope after every migration wave</strong>. Microsoft Azure Backup Server (MABS) V4 can protect Azure Local VMs and Hyper-V VMs at host or guest level, and many customers use partner products. Know your restore path before you need it: <strong>restoring an Azure Local VM to an alternate location with MABS or ASR gives you a VM that's no longer managed from Azure.</strong></span><strong><span>&nbsp;</span></strong></p>\n<p><span>For disaster recovery, <span class=\"lia-text-color-6\"><strong>Azure Site Recovery for Azure Local became generally available in October 2026.</strong></span> It replicates Windows and Linux VMs (Generation 1 and 2) to Azure, fails over there, and fails back to the same or an alternate host.</span><span>&nbsp;</span></p>\n<p><span><span class=\"lia-text-color-8\"><strong>BitLocker recovery keys often stay inside the cluster they protect</strong>.</span> If the cluster is down and the domain controllers run on it, the keys may be out of reach exactly when you need them. <strong>Export them from a local console, an RDP session or a CredSSP remote session, and store them outside the cluster, for example in Azure Key Vault</strong>:</span><span>&nbsp;</span></p>\nGet-AsRecoveryKeyInfo | Format-Table ComputerName, PasswordID, RecoveryKey \n<p><u><span>Starting with release 2609, automatic backup of the keys to a backup key vault is also available.</span></u></p>\n<h4><strong><span class=\"lia-text-color-6\">What to do instead&nbsp;</span></strong></h4>\n<ul>\n<li><span>Treat Day 2 as part of Day 1. Turn on Insights and the health alerts, add the recommended alert rules, and route them to an action group somebody reads - I would just get notified through a teams chat or through an SMS sent to my Phone. <u>(Use the Azure Native power)</u></span></li>\n</ul>\n<ul>\n<li><span>Agree RTO and RPO per workload, then choose backup and DR to match.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Test a restore after the migration, not during the first incident.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Export the recovery keys to a vault outside the cluster.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Onboard the nodes and VMs to Defender for Cloud, and connect them to Microsoft Sentinel.</span><span>&nbsp;</span></li>\n</ul>\n<p><strong><span>Most of this costs little or nothing, and it's usually missing.</span></strong></p>\n<h2><span class=\"lia-text-color-14\"><strong>The lesson behind all ten&nbsp;</strong></span></h2>\n<h6><span><strong>If I had to reduce this post to one sentence:</strong> design before you deploy, because some choices can't be undone. A handful of decisions are made once, at deployment: DNS, IP ranges, the landing zone and resource placement, the VM management model, the storage design and, increasingly, Arc gateway. <span class=\"lia-text-color-6\"><u><strong>Get those right and almost everything else gets easier.</strong></u></span></span><span class=\"lia-text-color-6\"><u><strong>&nbsp;</strong></u></span></h6>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-center\">&nbsp;</div>\n<h2><span class=\"lia-text-color-11\"><strong>Where to get help&nbsp;</strong></span></h2>\n<p><span>You don't have to learn all of this the hard way. If your organization has Microsoft Unified (or even without Unified),&nbsp; ask your account team/Microsoft Representative about the Azure Local Foundations Workshop and the Azure Local Architecture and Operations Assessment. Some customers book the workshop every year, even with years of Azure Local behind them, and the assessment is built to surface quick wins and flag what must be fixed before the next outage. Bringing Microsoft's delivery teams in before the first design workshop costs far less than bringing them in after the first incident.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><strong><span class=\"lia-text-color-21\">Thank you for reading my article till the end! Now, I'm interested to learn about your journey so far on Azure Local and which of these ten have you run into, and what would you add to the list? Tell me in the comments.&nbsp;</span></strong></p>\n<p><span>#AzureLocal #AzureArc #HybridCloud #VMwareExit #CloudArchitecture</span><span> #SovereignPrivateCloud</span></p>"
  "1952ffe2bb2131215a2b2aca0499ef56":
    "id": "1952ffe2bb2131215a2b2aca0499ef56"
    "title": "Extending Azure VM Image Automation with an MCP Operations Layer"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/extending-azure-vm-image-automation-with-an-mcp-operations-layer/ba-p/4570121"
    "published": "2026-11-04 18:08:12"
    "fetched": "2026-11-05 22:36:24"
    "summary": "<h2>Introduction</h2>\n<p>In Part 1, we built a repeatable Azure VM image pipeline with Packer, Azure DevOps and Azure Compute Gallery, then validated the published image before promotion. <a href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/automating-azure-vm-image-baking-and-validation-with-packer-and-azure-devops/4557578\" rel=\"noopener\" target=\"_blank\">Read Part 1</a></p>\n<p>This second part adds a focused MCP operations layer. The build logic remains in Azure DevOps; the server exposes controlled tools for build status, validation evidence and optional pipeline queueing.</p>\n<p>The essential implementation is included directly in this article so the reader can create the local project, run it and understand each moving part without a separate code download.</p>\n<blockquote>\n<p><strong>Solution at a glance:</strong> MCP host → Image Pipeline MCP server → policy boundary → Azure DevOps REST APIs → build, validation and promotion evidence</p>\n</blockquote>\n<h3>What this article demonstrates</h3>\n<ul>\n<li>Read recent image-pipeline runs and correlated build metadata.</li>\n<li>Run the server, invoke each tool and interpret the result.</li>\n<li>Keep write actions disabled by default and require explicit confirmation.</li>\n<li>Use the same tools from Visual Studio Code Copilot Chat.</li>\n</ul>\n<h2>Where MCP fits</h2>\n<p>The MCP server is a thin operations interface in front of the delivery system from Part 1. It does not replace Packer, Azure Pipelines, Azure Compute Gallery or Azure DevOps approval controls.</p>\n<img />\n<p><em>Figure 1. MCP operations layer for image-pipeline queries and guarded execution.</em></p>\n<blockquote>\n<p><strong>Design principle:</strong> Expose domain outcomes such as “show missing validation evidence”, not a broad unrestricted HTTP proxy.</p>\n</blockquote>\n<h2>Prerequisites</h2>\n<ul>\n<li>Visual Studio Code with GitHub Copilot Chat.</li>\n<li>Python 3.10 or later.</li>\n<li>uv for Python environment and dependency management.</li>\n<li>Node.js with npx available for MCP Inspector.</li>\n<li>An Azure DevOps organisation, project and image pipeline based on Part 1.</li>\n<li>Read access to pipeline runs and artefacts; queue permission only for guarded-write testing.</li>\n</ul>\n<h2>Build and configure the sample</h2>\n<h3>1. Create the local sample project</h3>\n<p>Create a folder named azure-image-pipeline-mcp and add the following files. The sample keeps the MCP layer in one Python file so the complete flow remains visible in the article.</p>\n<p><strong>Project structure</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>azure-image-pipeline-mcp/\n├── .env\n├── .vscode/\n│   └── mcp.json\n├── pyproject.toml\n└── server.py</code></pre>\n<p><strong>pyproject.toml</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>[project]\nname = \"azure-image-pipeline-mcp\"\nversion = \"0.1.0\"\nrequires-python = \"&gt;=3.10\"\ndependencies = [\n  \"mcp[cli]&gt;=2.2,&lt;3\",\n  \"httpx&gt;=0.27,&lt;1\"\n]\n\n[project.scripts]\nazure-image-pipeline-mcp = \"server:main\"</code></pre>\n<h3>2. Install dependencies</h3>\n<p><strong>Create the environment</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>uv --version\nuv sync</code></pre>\n<h3>3. Create .env</h3>\n<p><strong>macOS or Linux</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>touch .env</code></pre>\n<p><strong>Windows PowerShell</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>New-Item -ItemType File .env</code></pre>\n<p>Create .env in the project root. It holds a credential, so never commit it; if you use Git, add .env to .gitignore.</p>\n<h3>4. Configure Azure DevOps</h3>\n<p><strong>Initial configuration</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>AZDO_ORGANIZATION=https://dev.azure.com/your-organisation\nAZDO_PROJECT=your-project\nAZDO_PIPELINE_ID=42\nAZDO_PAT=your-local-development-token\nMCP_ALLOW_QUEUE_RUN=false\nMCP_ALLOWED_PARAMETERS=runtimeVersion,imageFlavor,enableSecurityScan,location,imageVersion</code></pre>\n<ul>\n<li>AZDO_ORGANIZATION is the organisation URL.</li>\n<li>AZDO_PROJECT contains the image pipeline.</li>\n<li>AZDO_PIPELINE_ID is the numeric ID shown in the pipeline URL.</li>\n<li>AZDO_PAT is for compact local development only; keep its scope minimal and never commit it.</li>\n<li>MCP_ALLOW_QUEUE_RUN=false keeps write behaviour blocked.</li>\n<li>MCP_ALLOWED_PARAMETERS defines the accepted pipeline template parameters.</li>\n</ul>\n<h3>5. Add the MCP server implementation</h3>\n<p>The server exposes three read-only tools and one guarded write tool. Azure DevOps remains responsible for the actual image build, validation and promotion.</p>\n<p><strong>server.py: configuration and Azure DevOps client</strong></p>\n<pre class=\"lia-code-sample language-python\" contenteditable=\"false\" tabindex=\"0\"><code>import base64\nimport os\nfrom urllib.parse import quote\n\nimport httpx\nfrom mcp.server import MCPServer\n\nmcp = MCPServer(\"Azure Image Pipeline MCP\")\nORG = os.environ[\"AZDO_ORGANIZATION\"].rstrip(\"/\")\nPROJECT = quote(os.environ[\"AZDO_PROJECT\"], safe=\"\")\nPIPELINE_ID = int(os.environ[\"AZDO_PIPELINE_ID\"])\nPAT = os.environ[\"AZDO_PAT\"]\nALLOW_QUEUE = os.getenv(\"MCP_ALLOW_QUEUE_RUN\", \"false\").lower() == \"true\"\nALLOWED = {x.strip() for x in os.getenv(\n    \"MCP_ALLOWED_PARAMETERS\",\n    \"runtimeVersion,imageFlavor,enableSecurityScan,location,imageVersion\"\n).split(\",\") if x.strip()}\nBASE = f\"{ORG}/{PROJECT}/_apis\"\n\nasync def azdo(method: str, path: str, **kwargs):\n    token = base64.b64encode(f\":{PAT}\".encode()).decode()\n    headers = {\"Authorization\": f\"Basic {token}\", \"Content-Type\": \"application/json\"}\n    async with httpx.AsyncClient(headers=headers, timeout=30) as client:\n        response = await client.request(method, f\"{BASE}/{path}\", **kwargs)\n        response.raise_for_status()\n        return response.json()</code></pre>\n<p><strong>server.py: read-only tools</strong></p>\n<pre class=\"lia-code-sample language-python\" contenteditable=\"false\" tabindex=\"0\"><code>@mcp.tool()\nasync def list_recent_image_runs(top: int = 10) -&gt; dict:\n    data = await azdo(\n        \"GET\", f\"pipelines/{PIPELINE_ID}/runs\",\n        params={\"api-version\": \"7.1\", \"$top\": min(max(top, 1), 50)}\n    )\n    return {\"pipelineId\": PIPELINE_ID, \"runs\": data.get(\"value\", [])}\n\n@mcp.tool()\nasync def get_image_run_status(run_id: int) -&gt; dict:\n    run = await azdo(\n        \"GET\", f\"pipelines/{PIPELINE_ID}/runs/{run_id}\",\n        params={\"api-version\": \"7.1\"}\n    )\n    build = await azdo(\n        \"GET\", f\"build/builds/{run_id}\",\n        params={\"api-version\": \"7.1\"}\n    )\n    return {\"run\": run, \"build\": build}\n\n@mcp.tool()\nasync def get_image_run_evidence(run_id: int) -&gt; dict:\n    data = await azdo(\n        \"GET\", f\"build/builds/{run_id}/artifacts\",\n        params={\"api-version\": \"7.1\"}\n    )\n    artifacts = data.get(\"value\", [])\n    expected = {\"build-summary\", \"image-validation\", \"security-scan\", \"promotion-record\"}\n    found = {item.get(\"name\") for item in artifacts}\n    return {\"runId\": run_id, \"artifacts\": artifacts, \"missing\": sorted(expected - found)}</code></pre>\n<p><strong>server.py: guarded queue tool and entry point</strong></p>\n<pre class=\"lia-code-sample language-python\" contenteditable=\"false\" tabindex=\"0\"><code>@mcp.tool()\nasync def queue_image_pipeline(\n    confirmation: str,\n    runtime_version: str,\n    image_flavour: str,\n    location: str,\n    enable_security_scan: bool = True,\n    branch: str = \"refs/heads/main\",\n) -&gt; dict:\n    if not ALLOW_QUEUE:\n        raise PermissionError(\"Queueing is disabled\")\n    if confirmation != \"QUEUE_IMAGE_PIPELINE\":\n        raise PermissionError(\"Explicit confirmation is required\")\n\n    parameters = {\n        \"runtimeVersion\": runtime_version,\n        \"imageFlavor\": image_flavour,\n        \"location\": location,\n        \"enableSecurityScan\": enable_security_scan,\n    }\n    unknown = set(parameters) - ALLOWED\n    if unknown:\n        raise ValueError(f\"Unsupported parameters: {sorted(unknown)}\")\n\n    body = {\n        \"resources\": {\"repositories\": {\"self\": {\"refName\": branch}}},\n        \"templateParameters\": parameters,\n    }\n    run = await azdo(\n        \"POST\", f\"pipelines/{PIPELINE_ID}/runs\",\n        params={\"api-version\": \"7.1\"}, json=body\n    )\n    return {\"queued\": True, \"run\": run, \"parameters\": parameters}\n\ndef main():\n    mcp.run()\n\nif __name__ == \"__main__\":\n    main()</code></pre>\n<h3>6. Validate the server locally</h3>\n<p><strong>Static validation</strong></p>\n<pre class=\"lia-code-sample language-python\" contenteditable=\"false\" tabindex=\"0\"><code>python -m compileall -q server.py\nuv run python -c \"import server; print('MCP server imports successfully')\"</code></pre>\n<p>Run the commands above from the project root. Successful completion confirms that server.py compiles and imports with the installed dependencies. The Inspector checks in the next section validate tool discovery and invocation.</p>\n<blockquote>\n<p><strong>Validation scope:</strong> These static checks confirm that server.py compiles and imports. A live integration check still requires a valid Azure DevOps organisation, project, pipeline ID and credential.</p>\n</blockquote>\n<h3>7. Run the MCP server and try the tools</h3>\n<p>Use MCP Inspector for a direct first test of the Python server. Inspector connects to the local server, discovers its registered tools and lets you call each tool with sample inputs before using the tools through Copilot Chat.</p>\n<p><strong>Start the server from the project root</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>uv run mcp dev server.py</code></pre>\n<p>The command prints a local Inspector URL. Open that URL, select Tools, and confirm these four tools are available:</p>\n<ul>\n<li>list_recent_image_runs</li>\n<li>get_image_run_status</li>\n<li>get_image_run_evidence</li>\n<li>queue_image_pipeline</li>\n</ul>\n<h4>Sample 1: list recent runs</h4>\n<p><strong>Tool and input</strong></p>\n<pre class=\"lia-code-sample language-json\" contenteditable=\"false\" tabindex=\"0\"><code>Tool: list_recent_image_runs\nInput:\n{\n  \"top\": 10\n}</code></pre>\n<p>What it does: queries the configured Azure DevOps image pipeline and returns recent run IDs, names, states, results, dates and links.</p>\n<h4>Sample 2: inspect one run</h4>\n<p><strong>Tool and input</strong></p>\n<pre class=\"lia-code-sample language-json\" contenteditable=\"false\" tabindex=\"0\"><code>Tool: get_image_run_status\nInput:\n{\n  \"run_id\": 1234\n}</code></pre>\n<p>Replace 1234 with a real run ID returned by the first tool. The response correlates the pipeline run with build number, result, branch and source commit.</p>\n<h4>Sample 3: check release evidence</h4>\n<p><strong>Tool and input</strong></p>\n<pre class=\"lia-code-sample language-json\" contenteditable=\"false\" tabindex=\"0\"><code>Tool: get_image_run_evidence\nInput:\n{\n  \"run_id\": 1234\n}</code></pre>\n<p>The server lists published artefacts and reports expected evidence that is missing, such as image validation, security scan, promotion record or build summary.</p>\n<h4>Sample 4: confirm the write guard</h4>\n<p><strong>Safe negative test</strong></p>\n<pre class=\"lia-code-sample language-json\" contenteditable=\"false\" tabindex=\"0\"><code>Tool: queue_image_pipeline\nInput:\n{\n  \"confirmation\": \"QUEUE_IMAGE_PIPELINE\",\n  \"runtime_version\": \"21\",\n  \"image_flavour\": \"cis\",\n  \"location\": \"uksouth\"\n}</code></pre>\n<p>With MCP_ALLOW_QUEUE_RUN=false, the request must be rejected with “Queueing is disabled”. This confirms the fail-closed default without starting a pipeline.</p>\n<h4>Live queue test</h4>\n<p>Only in an approved development or test project, set MCP_ALLOW_QUEUE_RUN=true, restart the server and repeat the call. The exact confirmation value and allow-listed parameters are still required. Azure DevOps approvals and permissions remain authoritative.</p>\n<p>After the four checks succeed, stop the Inspector process with Ctrl+C. Visual Studio Code starts the same server itself through .vscode/mcp.json for normal Copilot Chat use.</p>\n<h2>Use the MCP server from Visual Studio Code</h2>\n<p>Visual Studio Code recognises the server from .vscode/mcp.json. The Python source does not register itself. When the project root is the workspace, Visual Studio Code reads the configuration, starts the stdio command, loads .env and performs MCP tool discovery.</p>\n<p><strong>Discovery and start sequence</strong></p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>Open the project root in Visual Studio Code\n        |\n        v\nVisual Studio Code reads .vscode/mcp.json\n        |\n        v\nVisual Studio Code starts: uv run python server.py\n        |\n        v\nThe process loads ${workspaceFolder}/.env\n        |\n        v\nThe MCP handshake discovers the four tools\n        |\n        v\nTools appear in Copilot Chat &gt; Agent &gt; Configure Tools</code></pre>\n<blockquote>\n<p><strong>Important:</strong> Run <code>code .</code> from the azure-image-pipeline-mcp project root. If the parent directory is opened instead, <code>${workspaceFolder}</code> can point to the wrong location.</p>\n</blockquote>\n<p><strong>Workspace-level .vscode/mcp.json</strong></p>\n<pre class=\"lia-code-sample language-json\" contenteditable=\"false\" tabindex=\"0\"><code>{\n  \"servers\": {\n    \"azure-image-pipeline\": {\n      \"type\": \"stdio\",\n      \"command\": \"uv\",\n      \"args\": [\"run\", \"python\", \"server.py\"],\n      \"cwd\": \"${workspaceFolder}\",\n      \"envFile\": \"${workspaceFolder}/.env\"\n    }\n  }\n}</code></pre>\n<h3>Start the server and use it in Copilot Chat</h3>\n<ol>\n<li>Open .vscode/mcp.json and select the inline Start action for azure-image-pipeline.</li>\n<li>Review the command, approve the trusted local server and confirm its status is Running.</li>\n<li>Open Copilot Chat, select Agent, then Configure Tools, and enable the four azure-image-pipeline tools.</li>\n</ol>\n<h4>Try these prompts:</h4>\n<ul>\n<li>Show the latest ten image pipeline runs.</li>\n<li>Show the status, branch and source commit for run 1234.</li>\n<li>Which release evidence is missing from run 1234?</li>\n<li>Prepare a Java 21 CIS image build in UK South and show the parameters before requesting confirmation.</li>\n</ul>\n<h2>Troubleshooting</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><tbody><tr><th>Symptom</th><th>Check</th></tr><tr><td>uv is not recognised</td><td>Restart the terminal and verify PATH.</td></tr><tr><td>Inspector does not start</td><td>Confirm Node.js and npx are available.</td></tr><tr><td>Missing settings</td><td>Confirm .env is in the project root.</td></tr><tr><td>Azure DevOps returns 401 or 403</td><td>Check credential expiry and permissions.</td></tr><tr><td>Wrong pipeline data</td><td>Recheck project and numeric pipeline ID.</td></tr><tr><td>Visual Studio Code does not show the server</td><td>Validate .vscode/mcp.json and reload Visual Studio Code.</td></tr><tr><td>Queueing is disabled</td><td>Keep the safe default unless an intentional test is approved.</td></tr><tr><td>Unsupported parameters</td><td>Use only reviewed entries in MCP_ALLOWED_PARAMETERS.</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2>Production considerations</h2>\n<ul>\n<li>Prefer Microsoft Entra-backed authentication or the hosted Azure DevOps MCP server where supported.</li>\n<li>Use least privilege and separate read from queue permissions.</li>\n<li>Never return tokens, headers or unredacted logs.</li>\n<li>Keep Azure DevOps approvals and checks as the release authority.</li>\n<li>Add bounded outputs, timeouts, rate limits and safe correlation logging before remote hosting.</li>\n</ul>\n<h2>Conclusion</h2>\n<p>Part 1 established the deterministic image lifecycle. This second part adds a practical operations surface: Visual Studio Code starts the local MCP server from workspace configuration, discovers the curated tools and uses Azure DevOps as the source of build and release truth.</p>\n<h2>References</h2>\n<ul>\n<li><a href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/automating-azure-vm-image-baking-and-validation-with-packer-and-azure-devops/4557578\" rel=\"noopener\" target=\"_blank\">Part 1: Automating Azure VM Image Baking and Validation with Packer and Azure DevOps</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/devops/mcp-server/mcp-server-overview?view=azure-devops\" rel=\"noopener\" target=\"_blank\">Azure DevOps MCP server</a></li>\n<li><a href=\"https://py.sdk.modelcontextprotocol.io/\" rel=\"noopener\" target=\"_blank\">MCP Python SDK</a></li>\n<li><a href=\"https://code.visualstudio.com/docs/agents/reference/mcp-configuration\" rel=\"noopener\" target=\"_blank\">Visual Studio Code MCP configuration reference</a></li>\n</ul>"
  "3d7a3ff29790d0129bd37f704925515a":
    "id": "3d7a3ff29790d0129bd37f704925515a"
    "title": "Implementing Traefik as an Ingress Controller on Azure Kubernetes Service (AKS)"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/implementing-traefik-as-an-ingress-controller-on-azure/ba-p/4570088"
    "published": "2026-11-04 15:49:05"
    "fetched": "2026-11-05 22:36:24"
    "summary": "<h2>Prerequisites</h2>\n<p>Before starting the implementation, ensure you have:</p>\n<ul>\n<li>An existing Azure Kubernetes Service (AKS) cluster with a user node pool available for ingress workloads.</li>\n<li>kubectl configured with access to the AKS cluster.</li>\n<li>Helm 3 installed and access to the Traefik Helm repository.</li>\n<li>Permissions to create Kubernetes resources, including Deployments, Services, Secrets, and Traefik CRDs.</li>\n<li>An application already deployed in AKS and exposed through a Kubernetes Service.</li>\n<li>An Azure virtual network and subnet configured for the AKS internal Load Balancer.</li>\n<li>Appropriate Azure permissions to create and configure an Internal Load Balancer and Azure Private Link Service.</li>\n<li>Azure Front Door Premium, if implementing the private origin integration described in this article.</li>\n<li>Required TLS certificates and Kubernetes TLS secrets for HTTPS routing.</li>\n</ul>\n<p><strong>Note:</strong> The Azure networking and Front Door components require appropriate permissions and configuration in the target Azure environment.</p>\n<h1>1. Architecture overview</h1>\n<p>The solution uses the following traffic flow:</p>\n<p><strong>Client → Azure Front Door Premium → Azure Private Link → AKS Internal Load Balancer → Traefik → Kubernetes Service → Application Pod</strong></p>\n<p>The main components are:</p>\n<ul>\n<li><strong>Azure Front Door Premium:</strong> Provides the entry point for application traffic and supports private connectivity to the origin.</li>\n<li><strong>Azure Private Link Service:</strong> Enables private connectivity to the AKS-hosted ingress endpoint.</li>\n<li><strong>Internal Azure Load Balancer:</strong> Exposes Traefik through a private IP address within the virtual network.</li>\n<li><strong>Traefik:</strong> Handles incoming HTTP/HTTPS traffic and routes requests based on hostnames and URL paths.</li>\n<li><strong>Kubernetes Service:</strong> Provides internal connectivity to the application pods.</li>\n</ul>\n<h2>2. Deploying Traefik using Helm</h2>\n<p>I used the official Traefik Helm chart to deploy Traefik into a dedicated Kubernetes namespace.</p>\n<p>First, add the Traefik Helm repository:</p>\n<p>helm repo add traefik<strong> https://traefik.github.io/charts </strong>helm repo update</p>\n<p>Create a dedicated namespace:</p>\n<p><strong>kubectl create namespace ingress-system</strong></p>\n<p>For a production deployment, I used a custom values.yaml file to configure the deployment, service, node selection, and Kubernetes providers.</p>\n<h3>Key Helm configuration</h3>\n<p>deployment: replicas: 2 nodeSelector: kubernetes.azure.com/agentpool: application ingressClass: enabled: true isDefaultClass: true providers: kubernetesCRD: enabled: true allowCrossNamespace: true kubernetesIngress: enabled: true service: enabled: true type: LoadBalancer annotations: service.beta.kubernetes.io/azure-load-balancer-internal: \"true\" service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: \"tcp\" service.beta.kubernetes.io/azure-pls-create: \"true\" service.beta.kubernetes.io/azure-pls-name: \"aks-ingress-private-link\" spec: externalTrafficPolicy: Local</p>\n<p>The internal load balancer subnet annotation should be added according to the target AKS environment.</p>\n<h3>Important configuration considerations</h3>\n<ul>\n<li>Two replicas provide availability across application workloads.</li>\n<li>The node selector ensures Traefik is scheduled on the intended user node pool.</li>\n<li>Kubernetes CRD and Ingress providers allow Traefik to discover routing configurations.</li>\n<li>The internal load balancer annotation ensures Traefik is exposed through a private IP.</li>\n<li>The Private Link Service annotation enables private connectivity to the ingress endpoint.</li>\n<li>externalTrafficPolicy: Local helps preserve the original client source IP at the Kubernetes service forwarding layer.</li>\n</ul>\n<h2>3. Deploy Traefik</h2>\n<p>Once the Helm values file is ready, deploy Traefik:</p>\n<p>helm upgrade --install traefik traefik/traefik \\ --version 41.6.0 \\ --namespace ingress-system \\ --values values.yaml \\ --wait \\ --timeout 10m</p>\n<p><strong>Validate the deployment:</strong></p>\n<p>kubectl get pods -n ingress-system kubectl get svc -n ingress-system kubectl get deployment -n ingress-system</p>\n<p>The Traefik service should receive a private IP address from the configured subnet.</p>\n<h2>4. Configure application routing using IngressRoute</h2>\n<p>Traefik supports Kubernetes Custom Resource Definitions (CRDs), including IngressRoute, which provides more flexible routing capabilities.</p>\n<p>For this implementation, I used an IngressRoute to route requests based on the hostname and URL path.</p>\n<p>Example:</p>\n<p><strong>apiVersion: traefik.io/v1alpha1 kind: IngressRoute metadata: name: application-route namespace: application-namespace spec: entryPoints: - websecure routes: - match: Host(`internal.example.com`) &amp;&amp; PathPrefix(`/api`) kind: Rule middlewares: - name: api-to-v1 services: - name: application-backend port: 4545 tls: secretName: application-tls</strong></p>\n<p>Update the hostname, namespace, backend service, port, and TLS secret to match the application environment.</p>\n<p>The configuration ensures that HTTPS requests matching the specified hostname and /api path are forwarded to the corresponding Kubernetes Service.</p>\n<h2>5. Configure Traefik Middleware for URL rewriting</h2>\n<p>In this implementation, the application expected requests to reach its /v1 API endpoints, while incoming requests used the /api prefix.</p>\n<p>I used Traefik's Middleware CRD with a regular expression to rewrite the request path.</p>\n<p>Example:</p>\n<p><strong>apiVersion: traefik.io/v1alpha1 kind: Middleware metadata: name: api-to-v1 namespace: application-namespace spec: replacePathRegex: regex: '^/api(/(.*))?$' replacement: '/${2}'</strong></p>\n<p>This configuration removes the /api prefix before forwarding the request to the backend.</p>\n<p>For example:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><tbody><tr><th>Incoming request</th><th>Rewritten path</th></tr><tr><td>/api/health</td><td>/health</td></tr><tr><td>/api/orders</td><td>/orders</td></tr><tr><td>/api</td><td>/</td></tr></tbody></table></div>\n<p>This allows the application to retain its existing API structure without requiring changes to the application code.</p>\n<h2>6. Integrating Azure Private Link Service</h2>\n<p>To enable private connectivity to the AKS ingress endpoint, I configured Azure Private Link Service on the internal load balancer.</p>\n<p>The relevant Kubernetes Service annotations are:</p>\n<p>service.beta.kubernetes.io/azure-load-balancer-internal: \"true\" service.beta.kubernetes.io/azure-pls-create: \"true\" service.beta.kubernetes.io/azure-pls-name: \"aks-ingress-private-link\"</p>\n<p>The Azure Private Link Service is associated with the internal load balancer frontend.</p>\n<p>This provides a private connectivity option for consumers that need to access the application without exposing the AKS ingress endpoint directly to the public internet.</p>\n<p>The Private Link Service configuration and connection approval must also be validated on the Azure side.<br /><br /></p>\n<h2>7. Configuring TLS Termination in Traefik</h2>\n<p>TLS termination is an important part of the ingress architecture. It allows Traefik to handle HTTPS connections, manage certificates, and forward requests to backend Kubernetes services.</p>\n<p>In this implementation, Azure Front Door Premium handles the client-facing TLS connection and establishes a separate HTTPS connection to the AKS origin. Traefik terminates this origin-side TLS connection using a Kubernetes TLS Secret.</p>\n<h3>How TLS works in this architecture</h3>\n<ol>\n<li>The client sends an HTTPS request to Azure Front Door.</li>\n<li>Azure Front Door terminates the client-facing TLS connection.</li>\n<li>Front Door establishes a new HTTPS connection to the AKS origin through Private Link.</li>\n<li>Traefik receives the HTTPS request and terminates TLS using the configured certificate.</li>\n<li>Traefik applies the routing rules and forwards the request to the application Kubernetes Service.</li>\n</ol>\n<h3>Step 1: Create a Kubernetes TLS Secret</h3>\n<p>Traefik uses a Kubernetes TLS Secret containing the certificate and private key.</p>\n<p>kubectl create secret tls application-tls \\ --cert=tls.crt \\ --key=tls.key \\ --namespace application-namespace</p>\n<p>The secret contains:</p>\n<ul>\n<li>tls.crt: TLS certificate.</li>\n<li>tls.key: Corresponding private key.</li>\n</ul>\n<p>Ensure the certificate is valid for the hostname configured in the IngressRoute.</p>\n<h3>Step 2: Configure TLS in IngressRoute</h3>\n<p>Reference the TLS Secret in the IngressRoute configuration:</p>\n<p>apiVersion: traefik.io/v1alpha1 kind: IngressRoute metadata: name: application-route namespace: application-namespace spec: entryPoints: - websecure routes: - match: Host(`internal.example.com`) &amp;&amp; PathPrefix(`/api`) kind: Rule middlewares: - name: api-to-v1 services: - name: application-backend port: 4545 tls: secretName: application-tls</p>\n<p>The websecure entry point handles HTTPS traffic, while secretName tells Traefik which Kubernetes TLS Secret to use for the certificate.</p>\n<h3>Step 3: Validate the TLS configuration</h3>\n<p>Check whether the TLS Secret exists:</p>\n<p>kubectl get secret application-tls \\ -n application-namespace</p>\n<p>Inspect the IngressRoute:</p>\n<p>kubectl describe ingressroute application-route \\ -n application-namespace</p>\n<p>Check Traefik logs for certificate or routing-related errors:</p>\n<p>kubectl logs deployment/traefik \\ -n ingress-system</p>\n<h3>Important considerations</h3>\n<ul>\n<li>The certificate hostname must match the hostname used for the Front Door origin connection.</li>\n<li>The certificate must be trusted by Azure Front Door, with a valid certificate chain.</li>\n<li>The certificate and private key must be stored securely.</li>\n<li>The TLS Secret must exist in the same namespace as the IngressRoute referencing it.</li>\n<li>Configure certificate renewal and rotation before certificates expire.</li>\n<li>For production, avoid disabling certificate subject name validation at Azure Front Door.</li>\n</ul>\n<p>With this configuration, Traefik handles HTTPS termination at the AKS ingress layer, while application routing remains managed through Kubernetes CRDs.</p>\n<h2>8. Integrating Azure Front Door Premium</h2>\n<p>Azure Front Door Premium was configured to use the private AKS ingress endpoint as an origin.</p>\n<p>The important configuration areas include:</p>\n<ul>\n<li>Creating an origin group for the AKS-hosted application.</li>\n<li>Configuring the origin hostname and host header.</li>\n<li>Enabling Private Link for the origin.</li>\n<li>Selecting the appropriate Private Link Service.</li>\n<li>Configuring HTTPS on port 443.</li>\n<li>Setting up the health probe.</li>\n<li>Associating the origin group with the relevant Front Door route.</li>\n<li>Configuring the required WAF and security policies.</li>\n</ul>\n<p>This provides a managed entry point for application traffic while keeping the AKS ingress endpoint private.</p>\n<h2>9. Validation and troubleshooting</h2>\n<p>After deployment, I validated the components at different layers rather than relying only on the Helm deployment status.</p>\n<h3>Kubernetes validation</h3>\n<p>Check Traefik pods:</p>\n<p><strong>kubectl get pods -n ingress-system</strong></p>\n<p>Check the Traefik service and its assigned IP:</p>\n<p><strong>kubectl get svc -n ingress-system</strong></p>\n<p>Check the application services:</p>\n<p><strong>kubectl get svc -n application-namespace</strong></p>\n<p>Check the application endpoints:</p>\n<p><strong>kubectl get endpoints -n application-namespace</strong></p>\n<p>Check the routing resources:</p>\n<p><strong>kubectl get ingressroute -A kubectl get middleware -A</strong></p>\n<h3>Key areas to validate</h3>\n<ol>\n<li><strong>Pod scheduling:</strong> Confirm Traefik pods are scheduled on the intended node pool.</li>\n<li><strong>Image availability:</strong> Ensure AKS nodes can access the container image registries required for deployment.</li>\n<li><strong>Internal Load Balancer:</strong> Verify that the service receives the expected private IP.</li>\n<li><strong>Private Link Service:</strong> Confirm the service is provisioned and the required private endpoint connection is approved.</li>\n<li><strong>Backend service:</strong> Verify that the Kubernetes Service name and port match the actual application configuration.</li>\n<li><strong>Service endpoints:</strong> Confirm that the backend Service has healthy pod endpoints.</li>\n<li><strong>Routing and middleware:</strong> Validate the hostname match, path prefix, TLS secret, and rewrite behavior.</li>\n<li><strong>End-to-end connectivity:</strong> Test the complete traffic flow through Azure Front Door and the AKS ingress endpoint.</li>\n</ol>\n<h2>10. Key learnings</h2>\n<p>A few practical takeaways from the implementation:</p>\n<ul>\n<li><strong>Node pool selection matters:</strong> System node pools can have scheduling restrictions or taints. Plan the Traefik placement accordingly.</li>\n<li><strong>Validate backend service details:</strong> The Service name and port configured in an IngressRoute must match the actual Kubernetes Service.</li>\n<li><strong>Check service endpoints:</strong> A Kubernetes Service existing does not necessarily mean that it has healthy backend endpoints.</li>\n<li><strong>Understand the networking path:</strong> Validate the internal load balancer, Private Link Service, and Front Door configuration independently.</li>\n<li><strong>Use middleware for routing flexibility:</strong> Traefik path rewriting can help integrate applications without changing their existing API structure.</li>\n<li><strong>Validate image registry connectivity:</strong> AKS nodes need outbound access to the registries hosting the required container images.</li>\n<li><strong>Test end to end:</strong> Successful Helm deployment alone does not confirm that the complete application traffic flow is working.</li>\n</ul>\n<h2>Conclusion</h2>\n<p>Deploying Traefik on AKS provides a flexible way to manage application ingress, host-based routing, path rewriting, and TLS configuration.</p>\n<p>By combining Traefik with an internal Azure Load Balancer, Azure Private Link Service, and Azure Front Door Premium, it is possible to build a private and scalable application ingress architecture on Azure.</p>\n<p>The most important part of the implementation is validating each layer independently and then testing the complete traffic flow.</p>\n<p>This implementation was a good hands-on exercise in bringing together Kubernetes ingress capabilities and Azure networking services to support secure application connectivity.</p>"
"last_updated": "2026-11-05 22:36:24 JST"
