    "title": "What if your Azure Databricks workspaces have overlapping CIDRs?"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/what-if-your-azure-databricks-workspaces-have-overlapping-cidrs/ba-p/4569360"
    "published": "2026-11-04 02:41:11"
    "fetched": "2026-11-04 11:47:04"
    "summary": "<h1>&nbsp;</h1>\n<p>Consider a common enterprise networking challenge:</p>\n<p>You have three Azure Databricks workspaces. Each workspace uses classic VNet-injected compute, and each compute VNet uses the same address space:</p>\n<p>10.100.0.0/20</p>\n<p>Your networking team immediately sees the problem:</p>\n<p>If multiple networks advertise 10.100.0.0/20, which workspace should traffic for that prefix reach?</p>\n<p>At first glance, this looks like an IP-renumbering problem.</p>\n<p>But there is another question worth asking first:</p>\n<p><strong>Do enterprise users actually need network access to the Databricks compute subnets, or do they only need private access to the Databricks workspace service?</strong></p>\n<p>For standard workspace web UI and REST API access, that distinction can fundamentally change the architecture.</p>\n<p>The key design principle is:</p>\n<p><strong>Route to uniquely addressed private endpoints, not to the overlapping compute networks.</strong></p>\n<h2>The architecture challenge</h2>\n<p>RFC1918 address space may be private, but in large enterprises it is often far from unlimited.</p>\n<p>Acquisitions, independently designed environments, large historical reservations, and decentralized networking can result in multiple environments using the same address ranges.</p>\n<p>Imagine this deployment:</p>\n<ul>\n<li>Three Azure Databricks workspaces: <strong>A</strong>, <strong>B</strong>, and <strong>C</strong></li>\n<li>Three isolated VNet-injected compute VNets</li>\n<li>Each compute VNet uses 10.100.0.0/20</li>\n<li>Enterprise users require private access to all three workspaces</li>\n<li>Enterprise connectivity arrives through ExpressRoute private peering or VPN</li>\n</ul>\n<p>Directly exposing all three compute VNets to a shared routing domain creates an obvious ambiguity because the same prefix exists three times.</p>\n<p>Fortunately, workspace service access does not require enterprise clients to route directly into those compute networks.</p>\n<h2>Service access is different from compute-network access</h2>\n<p>Azure Databricks distinguishes between front-end Private Link, classic compute back-end Private Link, and serverless outbound connectivity.</p>\n<p>For front-end access, private endpoints can provide connectivity to the Databricks workspace web application and REST APIs without requiring enterprise clients to route into the workspace compute VNet.</p>\n<p>That separation gives us the basis for this design.</p>\n<p>Instead of importing the overlapping compute prefixes into the enterprise network:</p>\n<ol>\n<li>Create a uniquely addressed <strong>Transit VNet</strong>.</li>\n<li>Place the Databricks front-end private endpoints in that Transit VNet.</li>\n<li>Make the Transit VNet reachable from the enterprise connectivity hub.</li>\n<li>Keep each overlapping compute VNet in its own isolated routing domain.</li>\n</ol>\n<p>The enterprise network then routes only to addresses that are unique.</p>\n<p><strong>Important:</strong> This does not make overlapping VNets routable to one another. It avoids adding those overlapping prefixes to the common enterprise routing domain.</p>\n<p>Compute still requires its own control-plane connectivity, data access, and egress design. Those paths need to be considered independently.</p>\n<h2>Example topology</h2>\n<p>Consider the following illustrative single-region deployment.</p>\n<p><strong>Databricks compute networks</strong></p>\n<ul>\n<li>Workspace A VNet: 10.100.0.0/20</li>\n<li>Workspace B VNet: 10.100.0.0/20</li>\n<li>Workspace C VNet: 10.100.0.0/20</li>\n</ul>\n<p><strong>Enterprise-reachable Transit VNet</strong></p>\n<ul>\n<li>Transit VNet: 10.200.0.0/16</li>\n<li>Private endpoint subnet: 10.200.10.0/24</li>\n</ul>\n<p><strong>Example private endpoint addresses</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Private endpoint</th><th>Example IP</th><th>Purpose</th></tr></thead><tbody><tr><td>PE-A</td><td>10.200.10.10</td><td>Workspace A databricks_ui_api</td></tr><tr><td>PE-B</td><td>10.200.10.11</td><td>Workspace B databricks_ui_api</td></tr><tr><td>PE-C</td><td>10.200.10.12</td><td>Workspace C databricks_ui_api</td></tr><tr><td>Browser-auth PE</td><td>10.200.10.20</td><td>Shared regional browser_authentication</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>These addresses are examples only and are not production sizing recommendations.</p>\n<p>The enterprise network connects to either:</p>\n<ul>\n<li>a conventional connectivity hub, <strong>or</strong></li>\n<li>an Azure Virtual WAN hub.</li>\n</ul>\n<p>The example does not require chaining both hub models together.</p>\n<p>Enterprise connectivity reaches the selected hub through ExpressRoute <strong>private peering</strong> or VPN, and the Transit VNet connects using the appropriate mechanism for that topology.</p>\n<h3>Architecture diagram</h3>\n<img />\n<p class=\"lia-clear-both\">&nbsp;</p>\n<p><em>Figure 1. Enterprise routes terminate at uniquely addressed Transit VNet private endpoints for Databricks workspace services. The overlapping compute networks remain outside the enterprise routing domain.</em></p>\n<p>The important part is what is <strong>not</strong> connected.</p>\n<p>The three compute VNets are not:</p>\n<ul>\n<li>peered to the enterprise-connected Transit VNet,</li>\n<li>peered to the conventional enterprise hub,</li>\n<li>attached to the Azure Virtual WAN hub, or</li>\n<li>advertised into enterprise routing.</li>\n</ul>\n<p>Therefore, the three instances of 10.100.0.0/20 never compete in the same enterprise routing table.</p>\n<p>The address-space benefit is quite specific:</p>\n<p><strong>Enterprise routing consumes a unique ingress range rather than requiring three unique enterprise-visible compute ranges.</strong></p>\n<p>Each Databricks workspace still consumes its own subnet address space locally.</p>\n<h2>How the private service path works</h2>\n<p>Suppose a user wants to open Workspace B.</p>\n<p>The flow is conceptually:</p>\n<p><strong>Client → enterprise connectivity → hub → Transit VNet → PE-B → Databricks workspace service</strong></p>\n<p>The user accesses the normal workspace hostname.</p>\n<p>DNS resolves that hostname to the appropriate private endpoint address in the Transit VNet. Enterprise routing carries the traffic to that address, and Azure Private Link provides connectivity from the endpoint to the corresponding Databricks workspace service.</p>\n<p>The association remains deterministic:</p>\n<ul>\n<li>PE-A → Workspace A</li>\n<li>PE-B → Workspace B</li>\n<li>PE-C → Workspace C</li>\n</ul>\n<p>This is <strong>service-specific private connectivity</strong>.</p>\n<p>It is not a routed entrance into Workspace A, B, or C's compute subnet.</p>\n<p>Applications and users should also continue to use the <strong>standard Databricks workspace hostname</strong>, rather than configuring private endpoint IP addresses directly in browsers or API clients.</p>\n<h2>Don't forget browser authentication</h2>\n<p>There is another dependency that deserves special attention.</p>\n<p>The databricks_ui_api endpoint provides workspace UI and REST API connectivity.</p>\n<p>The browser_authentication endpoint has a different purpose: browser single sign-on callbacks.</p>\n<p>It is not the authentication endpoint used for REST API requests.</p>\n<p>Microsoft documents a browser-authentication endpoint per Azure region and private DNS zone that can be shared by workspaces in that region that use the same DNS configuration.</p>\n<p>Microsoft also recommends using a separate production web-auth workspace that:</p>\n<ul>\n<li>has no compute workloads,</li>\n<li>does not have a databricks_ui_api private endpoint on that host, and</li>\n<li>is treated as a shared infrastructure dependency.</li>\n</ul>\n<p>This dependency matters operationally because removing the workspace that hosts the browser-authentication endpoint can break browser authentication for dependent workspaces.</p>\n<p><strong>Design note:</strong> This example is intentionally region-local. It should not be interpreted as a single global browser-authentication endpoint design.</p>\n<p>Other Databricks access scenarios may also use endpoints such as general_access or service_direct. Those scenarios should be evaluated separately against the current Azure Databricks documentation.</p>\n<h2>DNS is as important as routing</h2>\n<p>A route to PE-B does not help if the Workspace B hostname resolves somewhere else.</p>\n<p>For hybrid clients, the DNS design should make the normal Databricks workspace hostname resolve to the private endpoint that the client can actually reach.</p>\n<p>Microsoft's hybrid Private Endpoint DNS guidance recommends conditionally forwarding the relevant <strong>public service suffix</strong> to a reachable Azure DNS Private Resolver inbound endpoint.</p>\n<p>For Azure Databricks, that means forwarding:</p>\n<p>azuredatabricks.net</p>\n<p>rather than designing the hybrid forwarding path around only:</p>\n<p>privatelink.azuredatabricks.net</p>\n<p>On-premises DNS should also not query Azure's 168.63.129.16 virtual IP directly.</p>\n<p>The resolver VNet context should be linked to the central:</p>\n<p>privatelink.azuredatabricks.net</p>\n<p>private DNS zone.</p>\n<p>Azure-provided DNS can then process the normal workspace hostname through the service DNS chain and private-zone lookup so that the client ultimately receives the appropriate Transit private endpoint address.</p>\n<p>An outbound Private Resolver endpoint is not required solely for servicing these inbound queries.</p>\n<h3>DNS architecture</h3>\n<img />\n<p><em>Figure 2. DNS resolution and HTTPS traffic are separate paths. DNS returns the reachable Transit private endpoint address; the private DNS zone itself is not part of the HTTPS routing path.</em></p>\n<p>Private Endpoint DNS zone groups should be used to maintain the service mappings instead of manually guessing record names.</p>\n<h2>A subtle DNS trap with front-end and back-end Private Link</h2>\n<p>There is an important architectural trap when both front-end and back-end private endpoints exist.</p>\n<p>Your enterprise clients need DNS to return the <strong>front-end Transit endpoint</strong> they can reach.</p>\n<p>Compute environments using back-end connectivity may require a different DNS view that returns endpoints reachable from those networks.</p>\n<p>If both endpoint types compete to update the same records in the same shared private DNS zone, name resolution may succeed while returning an endpoint that the client cannot reach.</p>\n<p>That leads to a useful design principle:</p>\n<p><strong>DNS visibility should follow network reachability.</strong></p>\n<p>Keep the central front-end DNS view populated with the Transit endpoints.</p>\n<p>Where isolated compute environments also require back-end private endpoints, design an appropriate reachable DNS view for those environments instead of peering overlapping VNets merely to solve DNS.</p>\n<p>And remember: DNS is not an access-control mechanism. Hiding a DNS record does not replace network or identity controls.</p>\n<h2>Private access does not automatically mean private-only</h2>\n<p>This is one of the most important distinctions in the design.</p>\n<p>Creating front-end private endpoints establishes a <strong>private access path</strong>.</p>\n<p>It does not, by itself, guarantee that public workspace access has been disabled.</p>\n<p>Microsoft distinguishes an inbound-only configuration from a complete private-isolation configuration.</p>\n<p>Complete private isolation introduces additional requirements, including back-end Private Link connectivity and the corresponding workspace networking configuration.</p>\n<p>Therefore:</p>\n<p><strong>Do not disable public network access on workload workspaces simply because the front-end Transit private endpoints are working.</strong></p>\n<p>First validate the required back-end/control-plane path, compute connectivity, data dependencies, and egress requirements against the complete-isolation guidance.</p>\n<p>Otherwise, a successful browser test could hide a broken compute environment.</p>\n<p>The dedicated browser-authentication workspace is also configured differently from workload workspaces. Its configuration should not be copied indiscriminately to the compute workspaces.</p>\n<h2>What this pattern solves</h2>\n<p>This design is useful when:</p>\n<ul>\n<li>multiple classic VNet-injected Databricks environments use overlapping compute address spaces,</li>\n<li>those compute networks can remain isolated,</li>\n<li>enterprise users need private UI access,</li>\n<li>applications need private REST API access, and</li>\n<li>the organization has a uniquely addressed enterprise-reachable Transit VNet.</li>\n</ul>\n<p>It reduces the requirement for unique <strong>enterprise-visible compute prefixes</strong>.</p>\n<p>It does not reduce the local address consumption of each Databricks workspace.</p>\n<h2>What this pattern does not solve</h2>\n<p>This design is not a general solution for overlapping networks.</p>\n<p>It does <strong>not</strong> make the overlapping compute VNets mutually routable.</p>\n<p>It also does not replace the design for:</p>\n<ul>\n<li>storage connectivity,</li>\n<li>data-service private endpoints,</li>\n<li>compute-to-control-plane connectivity,</li>\n<li>outbound/egress controls,</li>\n<li>direct cross-workspace compute communication, or</li>\n<li>serverless outbound networking.</li>\n</ul>\n<p>If workloads in Workspace A must communicate directly with workloads in Workspace B, and both networks use 10.100.0.0/20, you have returned to an address-ambiguity problem.</p>\n<p>That requirement needs a separate connectivity and addressing strategy.</p>\n<h2>Operational considerations</h2>\n<p>Before adopting this architecture, review the documented Azure Databricks Private Link prerequisites.</p>\n<p>These include considerations around:</p>\n<ul>\n<li>Premium workspaces,</li>\n<li>VNet injection,</li>\n<li>Secure Cluster Connectivity / No Public IP,</li>\n<li>configuration permissions,</li>\n<li>regional placement requirements, and</li>\n<li>potential downtime when retrofitting existing workspaces.</li>\n</ul>\n<p>Also consider the following operational areas.</p>\n<h3>Address capacity and cost</h3>\n<p>Plan enough space for private endpoints, subnet reservations, future endpoints, DNS infrastructure, and applicable platform limits.</p>\n<p>Private Endpoint, DNS Private Resolver, ExpressRoute/VPN, and the selected hub architecture also have associated costs.</p>\n<p>Reusing compute CIDRs does not mean the connectivity layer is free.</p>\n<h3>Network controls</h3>\n<p>When private endpoint network policies and NSG controls are applicable, validate the current documented service flows.</p>\n<p>Azure Databricks documentation currently lists inbound TCP requirements including:</p>\n<ul>\n<li>443</li>\n<li>6666</li>\n<li>3306</li>\n<li>8443-8451</li>\n</ul>\n<p>Use appropriately scoped rules based on the current service requirements rather than assuming that allowing only TCP 443 is sufficient.</p>\n<h3>Traffic inspection</h3>\n<p>A centralized private endpoint does not automatically imply centralized firewall inspection.</p>\n<p>Verify:</p>\n<ul>\n<li>effective routes,</li>\n<li>the selected hub topology,</li>\n<li>firewall traversal where required, and</li>\n<li>the actual data path.</li>\n</ul>\n<h2>Validation checklist</h2>\n<p>Before declaring the design operational, validate it from each relevant network.</p>\n<h3>DNS</h3>\n<ul>\n<li>[ ] Resolve every standard Databricks workspace hostname.</li>\n<li>[ ] Confirm that each hostname returns its expected Transit private endpoint IP.</li>\n<li>[ ] Validate browser-authentication DNS resolution.</li>\n<li>[ ] Confirm that isolated compute environments receive only endpoints they can reach.</li>\n</ul>\n<h3>Workspace connectivity</h3>\n<ul>\n<li>[ ] Open each workspace using its standard hostname.</li>\n<li>[ ] Verify connectivity follows the intended private path.</li>\n<li>[ ] Complete browser sign-in.</li>\n<li>[ ] Test an authenticated REST API request to each workspace.</li>\n</ul>\n<h3>Security</h3>\n<ul>\n<li>[ ] Verify unauthorized network sources are denied by the intended network controls.</li>\n<li>[ ] Verify unauthorized identities cannot access workspace resources.</li>\n<li>[ ] If complete private isolation is required, confirm public UI/API access is unavailable from outside the approved private path.</li>\n</ul>\n<h3>Compute</h3>\n<ul>\n<li>[ ] Start representative classic compute.</li>\n<li>[ ] Validate control-plane connectivity independently.</li>\n<li>[ ] Validate storage and data-service access.</li>\n<li>[ ] Validate required outbound/egress connectivity.</li>\n</ul>\n<p>These are proposed architectural validation checks, not reported results from a deployed test environment.</p>\n<h2>Key takeaway</h2>\n<p>Overlapping prefixes appear to be the central problem only if enterprise clients need to route directly into those prefixes.</p>\n<p>For standard Azure Databricks workspace UI and REST API ingress, they do not.</p>\n<p>Instead:</p>\n<p><strong>Give each workspace service a unique private endpoint in an enterprise-reachable Transit VNet, route enterprise clients to those endpoints, and keep the overlapping compute networks out of the shared routing domain.</strong></p>\n<p>Then make DNS return the endpoint the client can actually reach.</p>\n<p>Finally, treat compute networking, back-end Private Link, data dependencies, egress, public exposure, and serverless networking as separate design decisions.</p>\n<p>The goal is not to make overlapping networks routable.</p>\n<p>The goal is to <strong>solve the service-access requirement without importing the overlapping routes in the first place</strong>.</p>\n<h2>References</h2>\n<ol>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/databricks/security/network/concepts/privatelink-concepts\" rel=\"noopener\" target=\"_blank\">Azure Databricks Private Link concepts</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/databricks/security/network/front-end/front-end-private-connect\" rel=\"noopener\" target=\"_blank\">Configure front-end Private Link for Azure Databricks</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration\" rel=\"noopener\" target=\"_blank\">Azure Private Endpoint DNS integration</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/private-link/private-link-overview\" rel=\"noopener\" target=\"_blank\">Azure Private Link overview</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns\" rel=\"noopener\" target=\"_blank\">Azure Private Endpoint private DNS zone values</a></li>\n</ol>\n<p><strong>Architecture scope:</strong> This article presents an architectural pattern using illustrative single-region addressing. Microsoft documentation covers the individual Azure and Azure Databricks components referenced here. The composition for overlapping compute CIDRs described in this article is an architectural inference based on keeping the overlapping networks in separate routing domains; it should not be interpreted as a Microsoft-certified or independently validated reference architecture. No deployment or sandbox testing is claimed.</p>"
