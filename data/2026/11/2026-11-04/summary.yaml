"overview": |
  この日は 5 ソースから 10 本。Microsoft Threat Intelligence が、トロイの木馬化した Inno インストーラーで複数の収益化ペイロードを配布する偽ダウンロードキャンペーンを報告し、インストーラーセッション全体にわたる検出と調査のガイダンスを示した。Azure SDK Blog は AI エージェント向けの専門的な Azure プラグイン 6 種 (AKS 運用、コスト管理、Advisor の推奨事項、Kusto によるグラフ分析、Azure Local、Foundry IQ) を、プロンプト例とインストールコマンド付きで紹介した。Azure Updates では、アクセスパターン・データの経過時間・ストレージ階層・オブジェクトサイズ分布などを見られる Azure Storage Discovery の高度な容量インサイトがパブリックプレビューに入り、Azure SQL Database と Azure SQL Managed Instance の PITR バックアップで既定の 7 日を超えて設定済みの PITR 保持期間まで不変性を延長できるプレビューが始まり、フレキシブルオーケストレーションの仮想マシンスケールセット (VMSS Flex) に対する Azure Site Recovery の強化サポートが一般提供になった。ブログでは、Microsoft が 2026 年の Gartner Magic Quadrant (AI エージェント管理プラットフォーム) でリーダーに位置づけられたこと、Azure Local の導入が始まる前につまずく 10 の失敗、同じアドレス空間 (例: 10.100.0.0/20) を使う複数の Azure Databricks ワークスペースがある場合のネットワーク設計を扱った記事が出た。Azure Infrastructure Blog ではさらに、Packer・Azure DevOps・Azure Compute Gallery による VM イメージパイプラインの第 2 部として、ビルド状況・検証結果の参照やパイプラインのキュー投入を制御されたツールとして公開する MCP 運用レイヤーの追加と、AKS のユーザーノードプールに Traefik をイングレスコントローラーとして Helm で導入する手順が紹介された。
