  "f6ecb2f54cfbb20bd731a52376b8d128":
    "id": "f6ecb2f54cfbb20bd731a52376b8d128"
    "title": "Visit Azure and AMD at Microsoft Ignite and SC26"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/visit-azure-and-amd-at-microsoft-ignite-and-sc26/ba-p/4570345"
    "published": "2026-11-13 08:09:39"
    "fetched": "2026-11-13 19:12:00"
    "summary": "<p>AI workloads place different demands on infrastructure. Azure is continuing to partner closely with silicon partners including AMD to expand infrastructure choice across general purpose compute and AI accelerators. That choice includes three purpose built virtual machines (VMs): Azure HDv2-series virtual machines for the data preparation behind AI training, AMD Instinct™ MI300X accelerators for AI Inference and agents, generally available as managed endpoints in Microsoft Foundry or as Azure ND MI300X v5 VMs, and AMD Instinct™ MI455X accelerators in Azure for next generation AI infrastructure coming to Azure.</p>\n<p>In July, we shared how Azure is <a href=\"https://blogs.microsoft.com/blog/2026/07/20/microsoft-expands-azure-ai-and-hpc-infrastructure-with-amd/\" rel=\"noopener\" target=\"_blank\">expanding its AI and HPC infrastructure with AMD</a>. Here’s where to learn more at Microsoft Ignite and SC26.</p>\n<h5><strong>Azure HDv2: accelerating AI data processing, HPC, and agentic workloads&nbsp;</strong></h5>\n<p>Accelerators are only as productive as the data feeding them, and CPUs play an integral role in preparing that data. Microsoft has opened preview registration for <a href=\"https://techcommunity.microsoft.com/blog/azurehighperformancecomputingblog/accelerating-ai-data-processing-hpc-and-agentic-workloads-with-azure-hdv2-virtua/4567877\" rel=\"noopener\" target=\"_blank\">Azure HDv2-series virtual machines</a>, making Azure the first cloud to offer access to 6th Gen AMD EPYC™ (“Venice”) processors. HDv2 is built for AI data systems, with over 500 physical CPU cores, 3.8 TB of memory, 32 TB of local NVMe storage and 400 Gb Azure Boost networking.</p>\n<p>In benchmark testing on a preproduction AMD system with two “Venice” processors, an AI data-preparation pipeline prepared a 1.3 TB dataset for AI training in about 37 minutes<sup>1</sup>. HDv2 is projected to cut runtime by 49% compared with the next-best tested configuration (about 73 minutes), helping teams start training sooner and make better use of accelerator capacity. With over 500 cores, HDv2 can also speed compute-intensive HPC workloads such as engineering simulation and weather modeling. Customers can sign up to request access at&nbsp;<a href=\"https://techcommunity.microsoft.com/t5/aka.ms/HDv2Preview\" rel=\"noopener\" target=\"_blank\">aka.ms/HDv2Preview</a>.</p>\n<h5><strong>AMD Instinct™ MI300X, on Azure today: a managed endpoint or your own VM</strong></h5>\n<p>AMD Instinct™ MI300X is generally available on Azure today. Through Microsoft Foundry Managed Compute, teams can deploy open models from the Foundry model catalog onto dedicated MI300X capacity, via a private endpoint. Microsoft manages the software needed to run each model, so teams do not need to set up or maintain it themselves. Capacity is billed by the GPU-hour, and billing stops when the instances are spun down deployment is deleted.</p>\n<p>In a third-party evaluation by Signal65, AMD Instinct™ MI300X on Microsoft Foundry Managed Compute deployed live endpoints in 14-24 minutes with no serving stack tuning across the leading family of models including gpt-oss, gemma and GLM. MI300X delivered strong results across performance, cost per session, and agent capacity for coding, document analysis and chat workloads<sup>2</sup>.</p>\n<p>Teams that want full control of the software stack, or that are fine-tuning and training their own models can use Azure ND MI300X v5 virtual machines, with eight AMD Instinct™ MI300X accelerators and 1.5 TB of HBM per VM. Each MI300X provides 192 GB of HBM3 memory, allowing large models to run on fewer accelerators.</p>\n<h5><strong>AMD Instinct™ MI455X accelerators in Azure: engineered as a complete system</strong></h5>\n<p>That same focus on purpose-built infrastructure extends to AI accelerators. Azure and AMD are working together on AI infrastructure built around AMD Instinct™ MI455X accelerators and AMD’s Helios™ reference design.</p>\n<p>Running AI at scale requires more than AI accelerator performance. Consistent with how we approach AI infrastructure, Azure and AMD work together to design this complete system, so it fits into our Azure datacenter without retrofitting, with power, cooling and networking designed and validated together as one system. Microsoft’s system-level engineering across custom and partner silicon helps us bring advanced AI infrastructure from production to deployment faster, meaning we deliver more capacity to meet Azure and AI demand.</p>\n<h2><span class=\"lia-text-color-15\">Join us at Microsoft Ignite and SC26 to learn more about how Azure and AMD are expanding infrastructure choice.</span></h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 68.24%; height: 272px; border-width: 1px;\"><tbody><tr><td>\n<p><strong>Event</strong></p>\n</td><td>\n<p><strong>Session</strong></p>\n</td></tr><tr><td>\n<p>Ignite</p>\n</td><td>\n<p>BRKSP596: <a href=\"https://nam06.safelinks.protection.outlook.com/?url=https%3A%2F%2Fignite.microsoft.com%2Fen-US%2Fsessions%2F1787854982024001tGxB-1791588133619001CZW1%3Fsource%3Dsessions&amp;data=05%7C02%7Candrewblack%40microsoft.com%7C19eec12ffb1d4afd362d08df35517158%7C72f988bf86f141af91ab2d7cd011db47%7C1%7C0%7C639288296084664325%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=xJlDvYla8%2FPSm1P8R40oxu4ZP6uLvWnAgYYwjqMhZF4%3D&amp;reserved=0\" rel=\"noopener\" target=\"_blank\">Optimize data, security, and AI with AMD on Azure</a></p>\n</td></tr><tr><td>\n<p>Ignite</p>\n</td><td>\n<p>BRKSP614: <a href=\"https://nam06.safelinks.protection.outlook.com/?url=https%3A%2F%2Fignite.microsoft.com%2Fen-US%2Fsessions%2F1787854982135001twbi-1791588271585001C9WT%3Fsource%3Dsessions&amp;data=05%7C02%7Candrewblack%40microsoft.com%7C19eec12ffb1d4afd362d08df35517158%7C72f988bf86f141af91ab2d7cd011db47%7C1%7C0%7C639288296084681369%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=t%2FU2OYxqdodGnP6%2BbIc%2BdQ9v9rW7jReP1qyqbkMgUx4%3D&amp;reserved=0\" rel=\"noopener\" target=\"_blank\">AMD Instinct on Azure: More models. More agents. More choice.</a></p>\n</td></tr><tr><td>\n<p>Ignite</p>\n</td><td>\n<p>LABSP830: <a href=\"https://nam06.safelinks.protection.outlook.com/?url=https%3A%2F%2Fignite.microsoft.com%2Fen-US%2Fsessions%2F1790705089430001luN0-1791911906261001bUwk%3Fsource%3Dsessions&amp;data=05%7C02%7Candrewblack%40microsoft.com%7C19eec12ffb1d4afd362d08df35517158%7C72f988bf86f141af91ab2d7cd011db47%7C1%7C0%7C639288296084691867%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=aXiSMIt36RXZOBRV3xkZ3180U%2FnByb2wpRKPAlGiQEs%3D&amp;reserved=0\" rel=\"noopener\" target=\"_blank\">Improve token efficiency with vLLM Semantic Router</a></p>\n</td></tr><tr><td>\n<p>Ignite</p>\n</td><td>\n<p>LABSP831: <a href=\"https://nam06.safelinks.protection.outlook.com/?url=https%3A%2F%2Fignite.microsoft.com%2Fen-US%2Fsessions%2F1790705177215001bKjW-1791912014917001YvXO%3Fsource%3Dsessions&amp;data=05%7C02%7Candrewblack%40microsoft.com%7C19eec12ffb1d4afd362d08df35517158%7C72f988bf86f141af91ab2d7cd011db47%7C1%7C0%7C639288296084702114%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=3LSWKOfJaSZGXHWhG2SLuby4E45j89t%2B0EfExGwhwJM%3D&amp;reserved=0\" rel=\"noopener\" target=\"_blank\">Fine-tune AI models locally with AMD Ryzen AI and Unsloth</a></p>\n</td></tr><tr><td>\n<p>Ignite</p>\n</td><td>\n<p>LABSP833: <a href=\"https://nam06.safelinks.protection.outlook.com/?url=https%3A%2F%2Fignite.microsoft.com%2Fen-US%2Fsessions%2F1790705299182001YkwU-1791912172575001zFbk%3Fsource%3Dsessions&amp;data=05%7C02%7Candrewblack%40microsoft.com%7C19eec12ffb1d4afd362d08df35517158%7C72f988bf86f141af91ab2d7cd011db47%7C1%7C0%7C639288296084722821%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=ed0hbskE6KKodrPATAwz%2F2yHB%2FBGLA%2FwruoE%2FC586B0%3D&amp;reserved=0\" rel=\"noopener\" target=\"_blank\">Build local AI agents on AMD Ryzen AI PCs</a></p>\n</td></tr><tr><td>\n<p>SC26</p>\n</td><td>\n<p>Various: Visit Microsoft at Booth #3411</p>\n</td></tr></tbody><colgroup><col style=\"width: 11.86%;\" /><col style=\"width: 88.116%;\" /></colgroup></table></div>\n<p class=\"lia-align-center\">&nbsp;</p>\n<p><em>1 Projected HDv2 performance is based on benchmark results from a preproduction AMD system with two “Venice” processors, using recommended software and settings. Results may vary depending on workload, software, configuration and the final Azure environment.</em><br /><br /></p>\n<p><em>2 Study commissioned by Microsoft. Signal65, Tables 3, 5–8, 8–9. GPU-only economics at sustained tested load and $7.91/GPU-hour. Throughput is aggregate. Gemma chat economics calculated from 1,065 output tok/s and 490 output tokens/request. 1K-input/490-output test. Different workloads; no quality ranking. Use cases are illustrative.<br /></em></p>"
  "9f10bf937a6b81574fb50d51a96b5c96":
    "id": "9f10bf937a6b81574fb50d51a96b5c96"
    "title": "Join NVIDIA and Microsoft at Ignite 2026"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/join-nvidia-and-microsoft-at-ignite-2026/ba-p/4573012"
    "published": "2026-11-13 06:54:04"
    "fetched": "2026-11-13 19:12:00"
    "summary": "<p>Microsoft Ignite will run November 17 to 20 at Moscone Center in San Francisco and online <a href=\"https://register.ignite.microsoft.com/flow/microsoft/ignite27/welcome/page/welcome?ocid=AIDcmmtucbxncp_SEM__k_6cb7d6cc15cb1557dfe4bc0ad2c38ae2_k_\" rel=\"noopener\" target=\"_blank\">(register for in-person or online attendance access here).</a> Microsoft will open with the keynote on Tuesday, November 17, at 10:00 AM PT, and after Microsoft and NVIDIA will be there together in breakout sessions, in a hands-on lab, and on the show floor.</p>\n<h2><span class=\"lia-text-color-15\">In case you missed it</span></h2>\n<p><strong>Vera Rubin.</strong> In March, Microsoft became the first cloud to bring up an <a href=\"https://www.nvidia.com/en-us/data-center/vera-rubin-nvl72/\" rel=\"noopener\" target=\"_blank\">NVIDIA Vera Rubin NVL72</a> system for validation. In August, we delivered the first production Vera Rubin systems in our datacenters.</p>\n<p><strong>Cloud to edge.</strong> In our <a href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/microsoft-at-nvidia-gtc-berlin-2026-sovereign-ai-on-your-terms/4566171\" rel=\"noopener\" target=\"_blank\">October post</a>, we shared how Azure and Azure Local, with NVIDIA accelerated computing, let you build AI in the cloud and run it where latency, data residency, or operational control matter.</p>\n<h2><span class=\"lia-text-color-15\">Where to hear more at Ignite</span></h2>\n<h5><strong>AI infrastructure on Azure</strong></h5>\n<p>On Tuesday, November 17, at 3:15 PM PT, <a href=\"https://ignite.microsoft.com/en-US/sessions/BRKSP630\" rel=\"noopener\" target=\"_blank\">Power accelerated computing on Azure with NVIDIA</a> will be led by Dave Salvator, Director of Accelerated Computing at NVIDIA, who will cover running AI, data science, and simulation workloads with NVIDIA GPUs, software, and services.</p>\n<h5><strong>Agentic AI with Microsoft Foundry and NVIDIA Nemotron</strong></h5>\n<p>On Wednesday, November 18, at 11:30 AM PT, <a href=\"https://ignite.microsoft.com/en-US/sessions/BRKSP597\" rel=\"noopener\" target=\"_blank\">Architect reliable and secure agentic AI at scale</a> will show how to build agentic AI with Microsoft Foundry, NVIDIA Nemotron models, and NVIDIA infrastructure on Azure. To try it yourself, join <a href=\"https://ignite.microsoft.com/en-US/sessions/LABSP840\" rel=\"noopener\" target=\"_blank\">LABSP840</a>, a hands-on lab with Nemotron and Foundry. It's in person only and won't be recorded.</p>\n<h5><strong>Cloud to edge and physical AI</strong></h5>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/BRK480\" rel=\"noopener\" target=\"_blank\">Scaling intelligence cloud to edge with agentic AI factories</a> will run Thursday, November 19, at 2:45 PM PT. Dion Harris, Senior Director of AI Infrastructure and HPC Solutions at NVIDIA, will walk through how NVIDIA and Microsoft co-engineer full-stack AI infrastructure for Azure datacenters and for Azure Local. He'll also cover token-per-watt efficiency and how NVIDIA open models and Open Agent Safety help secure agentic AI.</p>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/BRKSP615\" rel=\"noopener\" target=\"_blank\">Industries reimagined with physical AI</a> will feature speakers from Microsoft and NVIDIA on Thursday, November 19, at 10:15 AM PT. The <a href=\"https://ignite.microsoft.com/en-US/sessions/LTGSP1631\" rel=\"noopener\" target=\"_blank\">LTGSP1631</a> lightning talk will cover digital twins and physical AI with Azure, NVIDIA Omniverse libraries, and NVIDIA cuOpt. NVIDIA cuOpt is an open-source GPU-accelerated optimization engine delivering near real-time solutions for complex decision-making challenges. Both are in person only. BRKSP615 will be recorded; the lightning talk won't be.</p>\n<h2><span class=\"lia-text-color-15\">Schedule at a glance</span></h2>\n<p>Times are subject to change, so please check each session page for the latest and add it to your schedule.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"0.5\" class=\"lia-border-color-17 lia-border-style-solid\" style=\"width: 760px; height: 655px; border-width: 0.5px;\"><tbody><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><strong>When (PT)</strong></p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><strong>Session</strong></p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><strong>How to attend</strong></p>\n</td></tr><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>Tue 11/17<br />3:15 to 4:00 PM</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/BRKSP630\" rel=\"noopener\" target=\"_blank\">BRKSP630</a>: Power accelerated computing on Azure with NVIDIA</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>In person + online</p>\n</td></tr><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>Wed 11/18<br />11:30 AM - 12:15 PM</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/BRKSP597\" rel=\"noopener\" target=\"_blank\">BRKSP597</a>: Architect reliable and secure agentic AI at scale</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>In person + online</p>\n</td></tr><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>Thu 11/19<br />10:15 to 11:00 AM</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/BRKSP615\" rel=\"noopener\" target=\"_blank\">BRKSP615</a>: Industries reimagined with physical AI</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>In person only; recorded</p>\n</td></tr><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>Thu 11/19<br />2:45 PM - 3:30 PM</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/BRK480\" rel=\"noopener\" target=\"_blank\">BRK480</a>: Scaling intelligence cloud to edge with agentic AI factories</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>In person + online</p>\n</td></tr><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>Fri 11/20<br />10:15 to 11:00 AM</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/BRK581\" rel=\"noopener\" target=\"_blank\">BRK581</a>: Model to mission: Azure Infra for agentic enterprise</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>In person + online</p>\n</td></tr><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>Tue 11/17, 2:30 PM - 3:45 PM</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/LABSP840\" rel=\"noopener\" target=\"_blank\">LABSP840</a>: Agentic AI with the NVIDIA Nemotron Open Models and Microsoft Foundry (lab)</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>In person only; not recorded</p>\n</td></tr><tr><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>Wed 11/18, 9:25 AM - 9:40 AM</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/LTGSP1631\" rel=\"noopener\" target=\"_blank\">LTGSP1631</a>: From Digital Twins to Physical AI: Azure Meets NVIDIA Omniverse &amp; cuOpt (lightning talk)</p>\n</td><td class=\"lia-border-color-17\" style=\"border-width: 0.5px;\">\n<p>In person only; not recorded</p>\n</td></tr></tbody><colgroup><col style=\"width: 171px;\" /><col style=\"width: 376px;\" /><col style=\"width: 212px;\" /></colgroup></table></div>\n<h2><span class=\"lia-text-color-15\">On the show floor</span></h2>\n<p>NVIDIA will be at <strong>booth 5644</strong>, with 30 in-person theater sessions Tuesday through Thursday, November 17 to 19.</p>\n<h2><span class=\"lia-text-color-15\">See you at Ignite</span></h2>\n<p>If you're watching online, you can join sessions marked \"In person + online\" and catch recorded sessions on demand. For everything else, browse the full <a href=\"https://ignite.microsoft.com/en-US/sessions\" rel=\"noopener\" target=\"_blank\">Ignite session catalog</a>.</p>"
  "a14474cf395e9c44842441ae6613f17c":
    "id": "a14474cf395e9c44842441ae6613f17c"
    "title": "Join Intel and Microsoft at Ignite 2026"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/join-intel-and-microsoft-at-ignite-2026/ba-p/4571739"
    "published": "2026-11-13 02:12:16"
    "fetched": "2026-11-13 19:12:00"
    "summary": "<p>&nbsp;</p>\n<p>At Microsoft Ignite 2026, Intel and Microsoft are coming together to showcase ideas, experts, and real-world impact. Join us to connect with industry leaders and step inside Intel Foundry, explore sovereign cloud and confidential computing, discover security ecosystem innovations, and see how edge AI and intelligent automation connect digital intelligence with the physical world.</p>\n<h3><strong><span class=\"lia-text-color-10\">Attend our sessions</span></strong></h3>\n<p>Attend our focus sessions and discover how Microsoft and Intel are advancing silicon, security, confidential computing, and edge AI.<br /><br /></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-17 lia-border-style-solid\" style=\"width: 99.9986%; height: 1011.67px; border-width: 1px;\"><colgroup><col style=\"width: 14.6425%;\" /><col style=\"width: 85.3529%;\" /></colgroup><tbody><tr style=\"height: 175.775px;\"><td class=\"lia-border-color-17\" style=\"height: 175.775px;\">\n<p><strong>TUES NOV 17<br /></strong>1:00 PM - 3:00 PM<br /><span class=\"lia-text-color-10\">I<span class=\"lia-text-color-10\">ntel and Microsoft Innovation Lounge</span></span><span class=\"lia-text-color-10\"> @ <a class=\"lia-external-url\" href=\"https://www.bing.com/maps/directions?ty=0&amp;v=2&amp;sV=1&amp;rtp=%7Epos.37.7852783203125_-122.39954376220703__Dimes%2520Gallery_&amp;cp=37.785278%7E-122.399544&amp;lvl=16&amp;style=r\" rel=\"noopener\" target=\"_blank\">Dimes Gallery</a></span></p>\n</td><td class=\"lia-border-color-17\" style=\"height: 175.775px;\">\n<p><span class=\"lia-text-color-21\"><strong>Intel Foundry Open House</strong></span></p>\n<p><span class=\"lia-text-color-21\">Step inside Intel Foundry and discover how advanced manufacturing, breakthrough packaging, and intelligent automation bring next-generation silicon to life.</span></p>\n</td></tr><tr style=\"height: 151.813px;\"><td class=\"lia-border-color-17\" style=\"height: 151.813px;\">\n<p><strong>TUES NOV 17<br /></strong>2:00 PM - 2:25 PM<br /><span class=\"lia-text-color-10\"><a href=\"https://ignite.microsoft.com/en-US/sessions/1787858586963001S9Tq-1791588096318001CQkJ?source=sessions\" rel=\"noopener\" target=\"_blank\">Theater Session @ Ignite</a> (THRSP1065)</span><strong><br /></strong></p>\n</td><td style=\"height: 151.813px;\">\n<p><strong>Local when it matters. Cloud when it counts.</strong></p>\n<p>Learn how agentic AI can combine local and cloud capabilities without choosing one over the other. See how Intel and Microsoft are enabling AI experiences that bring together local models for speed, privacy, and efficiency with Azure intelligence for sophisticated reasoning and enterprise scale.</p>\n</td></tr><tr style=\"height: 176.784px;\"><td class=\"lia-border-color-17\" style=\"height: 176.784px;\">\n<p><strong>TUES NOV 17<br /></strong>3:00 PM - 5:00 PM<br /><span class=\"lia-text-color-10\">Intel and Microsoft Innovation Lounge @&nbsp;<a href=\"https://www.bing.com/maps/directions?ty=0&amp;v=2&amp;sV=1&amp;rtp=%7Epos.37.7852783203125_-122.39954376220703__Dimes%2520Gallery_&amp;cp=37.785278%7E-122.399544&amp;lvl=16&amp;style=r\" rel=\"noopener\" target=\"_blank\">Dimes Gallery</a></span></p>\n</td><td class=\"lia-border-color-17\" style=\"height: 176.784px;\">\n<p><span class=\"lia-text-color-21\"><strong>Sovereignty &amp; Confidential Compute Open House</strong></span></p>\n<p><span class=\"lia-text-color-21\">Experience how Intel and Microsoft enable sovereign cloud innovation with hardware-based confidential computing across private and public cloud environments.</span></p>\n<p>Join the <a class=\"lia-external-url\" href=\"https://ignite.microsoft.com/en-US/sessions/1787854990794001th8O-1791588147778001CFLh?source=partnerdetail\" rel=\"noopener\" target=\"_blank\">15-minute Lightning Talk: Your Cloud. Your Data. Your Control.</a> during the open house.&nbsp;</p>\n</td></tr><tr style=\"height: 178.787px;\"><td class=\"lia-border-color-17\" style=\"height: 178.787px;\">\n<p><strong>WED NOV 18<br /></strong>11:00 AM - 1:00 PM<br /><span class=\"lia-text-color-10\">Intel and Microsoft Innovation Lounge @&nbsp;<a href=\"https://www.bing.com/maps/directions?ty=0&amp;v=2&amp;sV=1&amp;rtp=%7Epos.37.7852783203125_-122.39954376220703__Dimes%2520Gallery_&amp;cp=37.785278%7E-122.399544&amp;lvl=16&amp;style=r\" rel=\"noopener\" target=\"_blank\">Dimes Gallery</a></span></p>\n</td><td class=\"lia-border-color-17\" style=\"height: 178.787px;\">\n<p><strong>Security Experience Zone Open House</strong></p>\n<p>Discover how Intel, Microsoft, and security ecosystem innovations help protect AI agents, safeguard sensitive data, and detect emerging threats.</p>\n<p>Join the <a class=\"lia-external-url\" href=\"https://ignite.microsoft.com/en-US/sessions/1787854990896001tPB6-1791588231155001CJ0B?source=partnerdetail\" rel=\"noopener\" target=\"_blank\">15-minute Lightning Talk: Secure the Future of Agentic AI on Device</a> during the open house.&nbsp;</p>\n</td></tr><tr style=\"height: 173.772px;\"><td class=\"lia-border-color-17\" style=\"height: 173.772px;\">\n<p><strong>WED NOV 18<br /></strong>1:00 PM - 4:00 PM<br /><span class=\"lia-text-color-10\">Intel and Microsoft Innovation Lounge @ <a href=\"https://www.bing.com/maps/directions?ty=0&amp;v=2&amp;sV=1&amp;rtp=%7Epos.37.7852783203125_-122.39954376220703__Dimes%2520Gallery_&amp;cp=37.785278%7E-122.399544&amp;lvl=16&amp;style=r\" rel=\"noopener\" target=\"_blank\">Dimes Gallery</a></span></p>\n</td><td class=\"lia-border-color-17\" style=\"height: 173.772px;\">\n<p><strong>Agentic Edge &amp; Robotics Open House</strong></p>\n<p>Experience how Intel-powered edge AI brings spatial awareness and intelligent automation to the physical world.</p>\n<p>Join the <a class=\"lia-external-url\" href=\"https://ignite.microsoft.com/en-US/sessions/1787854990997001tMxi-1791588231379001CmI3?source=partnerdetail\" rel=\"noopener\" target=\"_blank\">15-minute Lightning Talk: AI beyond the screen. Intelligence in motion.</a> during the open house.</p>\n</td></tr><tr style=\"height: 154.737px;\"><td class=\"lia-border-color-17\" style=\"height: 154.737px;\">\n<p><strong>WED NOV 18<br /></strong>1:40 PM - 2:05 PM<br /><span class=\"lia-text-color-10\"><a href=\"https://ignite.microsoft.com/en-US/sessions/1787858590121001Sovz-1791588215428001CLYk?source=sessions\" rel=\"noopener\" target=\"_blank\">Theater Session @ Ignite</a> (THRSP1086)</span></p>\n</td><td class=\"lia-border-color-17\" style=\"height: 154.737px;\">\n<p><strong>Trust that travels starts on the endpoint</strong></p>\n<p>AI agents now act, not just read, and that action lands on the endpoint. Join ASUS and Intel to see how cloud policy, platform telemetry, and hardware root of trust combine to strengthen protection when a device is at risk or lost, and why post-quantum readiness starts today, years ahead of your next refresh cycle.</p>\n</td></tr></tbody></table></div>\n<h2><span class=\"lia-text-color-10\"><strong>Visit Intel booth #5403</strong></span></h2>\n<p>Engineering the agent era, together. Stop by the Intel booth at Microsoft Ignite, November 17–20 at the Moscone Center in San Francisco.</p>\n<p><strong>Focused demos</strong></p>\n<ul>\n<li>Scaling intelligent agentic AI to where work happens</li>\n<li>Powering a secure and sovereign cloud</li>\n<li>Re-imagining Azure infrastructure with Intel innovation</li>\n</ul>\n<p><strong>In-booth theater sessions</strong></p>\n<p>Catch Microsoft and Intel talks and demos in the booth theater.</p>\n<p><strong>Intel-led sessions</strong></p>\n<ul>\n<li>LIVE theater session: Local When It Matters, Cloud When It Counts</li>\n<li>Video on-demand session: Intel Assured Supply Chain</li>\n</ul>\n<p><strong>Daily treats at the booth</strong></p>\n<ul>\n<li>Tuesday: Boba tea (mid-afternoon)</li>\n<li>Wednesday: Smoothie bar in the morning and made-to-order crepes in the afternoon</li>\n</ul>\n<h2><span class=\"lia-text-color-10\"><strong>Connect with us</strong></span></h2>\n<p>Connect with Microsoft and Intel experts over drinks and conversation at our Innovation Lounge Happy Hour on Nov 16. The Innovation Lounge will be open from Nov 17 and 18 for our open houses.</p>\n<h5><span class=\"lia-text-color-10\"><strong>Happy Hour at the Innovation Lounge</strong></span></h5>\n<p><strong>MONDAY NOV 16<br /></strong>4:00 PM - 6:00 PM<br /><a class=\"lia-external-url\" href=\"https://www.bing.com/maps/directions?ty=0&amp;v=2&amp;sV=1&amp;rtp=%7Epos.37.7852783203125_-122.39954376220703__Dimes%2520Gallery_&amp;cp=37.785278%7E-122.399544&amp;lvl=16&amp;style=r\" rel=\"noopener\" target=\"_blank\">Dimes Gallery&nbsp;| 667 Howard St, San Francisco, CA</a></p>\n<h5><span class=\"lia-text-color-10\"><strong>Innovation Lounge Hours</strong></span></h5>\n<p><strong>TUESDAY NOV 17</strong> 1:00 PM - 5:00 PM<br /><strong>WEDNESDAY NOV 18</strong> 11:00 AM - 4:00 PM<br /><a class=\"lia-external-url\" href=\"https://www.bing.com/maps/directions?ty=0&amp;v=2&amp;sV=1&amp;rtp=%7Epos.37.7852783203125_-122.39954376220703__Dimes%2520Gallery_&amp;cp=37.785278%7E-122.399544&amp;lvl=16&amp;style=r\" rel=\"noopener\" target=\"_blank\">Dimes Gallery | 667 Howard St, San Francisco, CA</a></p>\n<p>The Innovation Lounge offers an immersive experience at the nearby Dimes Gallery, with demos, customer briefings and executive engagements.</p>\n<p>&nbsp;</p>\n<p><strong>We look forward to seeing you at <a class=\"lia-external-url\" href=\"https://ignite.microsoft.com\" rel=\"noopener\" target=\"_blank\">Microsoft Ignite 2026<span class=\"lia-text-color-21\">.</span></a></strong></p>"
