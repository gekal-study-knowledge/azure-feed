"overview": |
  この日は 2 ソースから 3 本で、Azure Monitor と Azure SQL Managed Instance の監視機能、コーディングエージェントを狙うサプライチェーン攻撃の研究が中心でした。Azure Monitor ワークスペースでは、観測された利用パターンに基づいて取り込み上限 (クォータの上限) を動的に調整し、健全な取り込みを保つワークスペース単位の自動スケーリングがパブリックプレビューになりました。Azure SQL Managed Instance では、Microsoft が運用するパフォーマンス監視のパブリックプレビューが始まりました。ビジネスクリティカルな SQL Managed Instance のワークロードを監視するために、独自スクリプトや別建ての監視ツールに頼る必要がなくなります。Microsoft Security Blog では、Microsoft Defender Research と AI Red Team が、汚染されたデータセットや汚染されたモデルチェックポイントによってコーディングエージェントが乗っ取られ、リモートコード実行などの悪意ある動作につながりうる学習後 (post-training) のサプライチェーン攻撃を解説しました。
