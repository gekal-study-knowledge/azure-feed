    "title": "Route summarization in Azure Route Server"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/route-summarization-in-azure-route-server/ba-p/4569901"
    "published": "2026-11-05 07:57:47"
    "fetched": "2026-11-06 05:51:34"
    "summary": "<h1>Why hybrid networks need native routing policy</h1>\n<p>Hybrid networks connect remote sites across multiple routing domains to an Azure Virtual Network (VNet). As these environments grow, you need a consistent way to control which routes Azure Route Server learns and advertises at the VNet boundary. That control matters wherever Azure Route Server exchanges routes with hybrid connections:</p>\n<ul>\n<li><strong>ExpressRoute and Azure VPN gateways:</strong> exchanged routes between Azure VNets and your on-premises networks.</li>\n<li><strong>Software-defined WAN (SD-WAN):</strong> manage routing across distributed branches and appliances.</li>\n<li><strong>Network virtual appliances (NVAs):</strong> control learned and advertised routes from remote sites or other clouds.</li>\n</ul>\n<p>Without a native policy layer, your options for route control are limited, and they get harder to manage as the network grows.</p>\n<p>This need becomes more urgent when branch-to-branch connectivity is enabled in Azure Route Server because routes can propagate across all connected networks. Production architectures, however, often require selective filtering, route summarization, segmentation, and predictable primary and backup paths.&nbsp;</p>\n<h2>Operational challenges without route maps</h2>\n<p>Without route maps, growing hybrid networks can become difficult to scale, secure, and operate. The main challenges include:</p>\n<ul>\n<li><strong>Route scale:</strong> Without inbound or outbound summarization, every specific prefix must be carried across the hybrid environment. Large deployments can approach or exceed Azure platform route limits, making routing tables harder to manage and troubleshoot. For example, if a VNet advertises more than 1,000 prefixes to an ExpressRoute circuit, the route limit is exceeded and the BGP session between the ExpressRoute gateway and the circuit is disconnected.</li>\n<li><strong>Path selection:</strong> When multiple connections reach the same remote site, customers need a straightforward way to define a preferred path and a backup path.</li>\n<li><strong>Network isolation:</strong> Unrestricted route propagation among SD-WAN, VPN, ExpressRoute, and NVA connections can expose segments to networks that should remain isolated.</li>\n<li><strong>Operational complexity in SD-WAN:</strong> Large SD-WAN deployments may require multiple NVAs for capacity and resiliency. Each appliance exchanges routes with the VNet, increasing the number of IP routes that operators must configure, monitor, and troubleshoot.</li>\n</ul>\n<h2>How route maps addresses these challenges</h2>\n<p>Route maps in Azure Route Server provide a native Azure policy layer for controlling the routes that enter and leave the VNet. They address the main operational challenges in the following ways:</p>\n<ul>\n<li><strong>Reduce route count:</strong> Summarize prefixes before they cross connection boundaries, reducing the number of propagated routes and helping limit routing-table growth.</li>\n<li><strong>Control path selection:</strong> Modify AS-PATH attributes to influence primary and backup path selection across hybrid connections.</li>\n<li><strong>Strengthen network isolation:</strong> Apply independent inbound and outbound policies to limit route exchange among SD-WAN, VPN, ExpressRoute, and NVA domains.</li>\n<li><strong>Simplify SD-WAN interoperability:</strong> Use BGP attribute manipulation to streamline route exchange with existing SD-WAN environments.</li>\n<li><strong>Enable downstream policy enforcement:</strong> Attach BGP communities that downstream devices can use to apply additional routing policies.</li>\n</ul>\n<h2>How route maps work</h2>\n<p>Route maps in Azure Route Server provide granular control over routes received from and advertised to hybrid networks.</p>\n<p>You can apply route maps to the following connection types:</p>\n<ul>\n<li>BGP peerings with a network virtual appliance (NVA) deployed in the virtual hub</li>\n<li>ExpressRoute gateway connections</li>\n<li>VPN gateway connections</li>\n</ul>\n<p>If the NVA is deployed in a spoke virtual network, apply the route map to the hub's virtual network connection to that spoke.</p>\n<p>An inbound route map processes routes as Azure Route Server learns them, whereas an outbound route map processes routes before Azure Route Server advertises them. Each route-map rule evaluates its configured match conditions and can modify route attributes, permit the route, or deny it. The following diagram illustrates this policy flow.</p>\n<img />\n<p>&nbsp;</p>\n<h2>Core capabilities and supported connections</h2>\n<p>Route maps support route summarization, route filtering, path selection, and route tagging with BGP communities. They can advertise aggregate prefixes, control which routes enter or leave an Azure Route Server deployment, modify AS-PATH to influence preference, and attach BGP communities that downstream devices can use when applying routing policy.</p>\n<p>You can apply route maps to BGP peerings with NVAs, ExpressRoute gateway connections, and Azure VPN gateway connections. Policies can be associated independently in the inbound and outbound directions, allowing the same connection to use different controls for received and advertised routes.</p>\n<p>The following diagram shows three route maps, route-map1, route-map2, and route-map3, applied to an NVA peering, an Azure VPN gateway connections, and an ExpressRoute gateway connection, respectively.</p>\n<img />\n<p>&nbsp;</p>\n<p>With these capabilities in mind, consider a common use case: summarizing spoke VNet prefixes before advertising them to on-premises networks over ExpressRoute private peering.</p>\n<h1>Summarize spoke VNet prefixes for an ExpressRoute connection</h1>\n<p>For this walkthrough, consider a hub-and-spoke topology with 50 spoke VNets. The hub VNet contains an ExpressRoute gateway named <strong>er-gw</strong> and an Azure Route Server named <strong>rs1</strong>.</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>Each of the 50 spoke VNets uses two /24 prefixes, resulting in 100 individual routes. The first two spokes and the final spoke in the address range are shown below.</p>\n<p><strong>Spoke 1:</strong> 10.90.0.0/24 and 10.90.1.0/24</p>\n<p><strong>Spoke 2:</strong> 10.90.2.0/24 and 10.90.3.0/24</p>\n<p>…</p>\n<p><strong>Spoke 50:</strong> 10.90.98.0/24 and 10.90.99.0/24</p>\n<p>The spoke-to-hub and hub-to-spoke peerings are configured with the following settings:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 31.2963%; border-width: 1px;\"><tbody><tr><td colspan=\"2\">\n<p><strong>Spoke-side virtual network peering setting</strong></p>\n</td></tr><tr><td>\n<p>\"allowVirtualNetworkAccess\"</p>\n</td><td>\n<p>true</p>\n</td></tr><tr><td>\n<p>\"allowForwardedTraffic\"</p>\n</td><td>\n<p>true</p>\n</td></tr><tr><td>\n<p>\"allowGatewayTransit\"</p>\n</td><td>\n<p>false</p>\n</td></tr><tr><td>\n<p>\"useRemoteGateways\"</p>\n</td><td>\n<p>true</p>\n</td></tr><tr><td colspan=\"2\">\n<p><strong>Hub-side virtual network peering setting</strong></p>\n</td></tr><tr><td>\n<p>\"allowVirtualNetworkAccess\"</p>\n</td><td>\n<p>true</p>\n</td></tr><tr><td>\n<p>\"allowForwardedTraffic\"</p>\n</td><td>\n<p>true</p>\n</td></tr><tr><td>\n<p>\"allowGatewayTransit\"</p>\n</td><td>\n<p>true</p>\n</td></tr><tr><td>\n<p>\"useRemoteGateways\"</p>\n</td><td>\n<p>false</p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p>With the ExpressRoute gateway deployed in the hub, the spoke prefixes can be advertised to the connected on-premises network.</p>\n<p>Before the route map is applied, the Azure Route Server <strong>Effective Routes</strong> include every individual spoke prefix.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>The Azure private peering route table likewise lists the individual spoke prefixes advertised by autonomous system 65515. The following excerpt from the primary ExpressRoute connection’s routing table shows the routes before summarization is applied.</p>\n<img />\n<p>Because the spoke address spaces form a contiguous range from 10.90.0.0 through 10.90.99.255, the 100 /24 prefixes can be represented by three aggregate prefixes:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 41.2037%; border-width: 1px;\"><thead><tr><td>\n<p><strong>Subnet</strong></p>\n</td><td>\n<p><strong>Range</strong></p>\n</td><td>\n<p><strong>Addresses</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p><strong>10.90.0.0/18</strong></p>\n</td><td>\n<p>10.90.0.0–10.90.63.255</p>\n</td><td>\n<p>16,384</p>\n</td></tr><tr><td>\n<p><strong>10.90.64.0/19</strong></p>\n</td><td>\n<p>10.90.64.0–10.90.95.255</p>\n</td><td>\n<p>8,192</p>\n</td></tr><tr><td>\n<p><strong>10.90.96.0/22</strong></p>\n</td><td>\n<p>10.90.96.0–10.90.99.255</p>\n</td><td>\n<p>1,024</p>\n</td></tr></tbody><colgroup><col style=\"width: 25.6821%;\" /><col style=\"width: 46.8546%;\" /><col style=\"width: 27.263%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p>Instead of advertising all 100 spoke prefixes to the on-premises network, an outbound route map can advertise only <strong>10.90.0.0/18</strong>, <strong>10.90.64.0/19</strong>, and <strong>10.90.96.0/22</strong>. This substantially reduces the number of advertised routes while preserving reachability across the complete spoke address range.</p>\n<p>The next step is to create an outbound route map named summarization1 in the Azure portal.</p>\n<ol>\n<li>Open the Azure Route Server resource, select <strong>Routing</strong> &gt; <strong>Route Maps</strong>, and then select <strong>Add Route-map</strong>.</li>\n<li>On the <strong>Create Route-map</strong> page, enter the route map name, and then select&nbsp;<strong>Add Route-map rule</strong>.</li>\n</ol>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>Create three rules, one for each aggregate prefix. Together, these rules replace the more-specific spoke advertisements with the three summarized routes.</p>\n<img /><img /><img />\n<p>After all three rules are added, review the route map and confirm that each aggregate is represented.</p>\n<img />\n<p>Select <strong>Save</strong> to commit the configuration.</p>\n<p>After the route map is saved, apply it to the ExpressRoute connection in the outbound direction.</p>\n<p>&nbsp;</p>\n<img />\n<p>In <strong>Apply Route-maps to connections</strong>, select the ExpressRoute connection <strong>er-conn</strong>, and then apply <strong>summarization1</strong> in the <u>outbound</u> direction. Azure Route Server will advertise the three aggregate prefixes instead of the more-specific spoke routes.</p>\n<img />\n<p>&nbsp;</p>\n<p>Wait for deployment to complete and verify that the provisioning state is&nbsp;<strong>Succeeded</strong>.</p>\n<img />\n<p>&nbsp;</p>\n<p>Use the Azure Route Server&nbsp;<strong>Connection Dashboard</strong> to inspect the routes advertised to the ExpressRoute connection. Select <strong>er-conn</strong> and review the <u>outbound direction</u>. The advertised routes should now contain only the three aggregate prefixes.</p>\n<img />\n<p>To confirm that the outbound summarization policy has not changed the routes received from on-premises, switch to the<u> inbound direction</u> and review the routes advertised by the customer edge toward the Azure VNet.</p>\n<img />\n<p>The network 10.1.11.0/25 is the on-premises network advertised from the customer's edge routers to the ExpressRoute private peering.</p>\n<p>As a final validation, inspect the routing table for the primary connection in the ExpressRoute circuit private peering.</p>\n<img />\n<p>The ExpressRoute circuit now receives only the three configured aggregate spoke prefixes: <strong>10.90.0.0/18</strong>, <strong>10.90.64.0/19</strong>, and <strong>10.90.96.0/22</strong>. The routing table also includes <strong>10.1.0.0/25</strong> for the on-premises network and <strong>10.99.0.0/24</strong> for the hub VNet address space.</p>\n<h1>Conclusion</h1>\n<p>Route maps are a significant step forward for Azure Route Server, adding a native routing policy layer that strengthens governance and control over route exchange across hybrid connectivity and Azure VNets. In this scenario, an outbound route map summarizes 100 spoke prefixes into three aggregate routes, reducing routing-table growth while preserving reachability across the complete spoke address range. The same policy model supports filtering, path selection, and BGP community tagging, helping customers control route propagation and operate growing hub-and-spoke environments more predictably.</p>"
