"overview": |
  この日は 3 ソースから 6 本。ネットワーク関連の発表が目立ち、Azure Route Server のルートマップが Azure パブリッククラウドで一般提供となり、ハイブリッド接続で Route Server が学習・広告するルートを受信・送信の両方向できめ細かく制御できるようになった。Azure Networking Blog ではこれに関連して、ExpressRoute などのハイブリッド接続と VNet の境界でルート集約を行う方法が解説された。Azure Firewall の IPv6 では、アプリケーションルールがパブリックプレビューで使えるようになり、IPv6 とデュアルスタック環境の HTTP/HTTPS トラフィックにもレイヤー 7 のフィルタリングをかけられる。ストレージでは、SCSI ディスクコントローラーを使う VM で、Premium SSD v2 と Ultra Disk のデータディスクを対象にしたマルチディスクのクラッシュ整合性 VM 復元ポイントがパブリックプレビューになり、エージェントなしで取得できる。Azure Database for PostgreSQL フレキシブルサーバーの安定版 REST API バージョン 2026-10-01 が一般提供となり、メンテナンス管理、不変バックアップ、テナント間のカスタマーマネージドキーによる暗号化などの機能が加わった。Azure Blog では、ハードウェア障害を予測して対象のワークロードを移動し、必要に応じて顧客に通知する Azure Failure Prediction and Detection (AFPD) が、SAP on Azure などのミッションクリティカルなワークロードの中断をどう減らすかを紹介した。
