    "title": "Durable Task extension for Microsoft Agent Framework is now Generally Available"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/durable-task-extension-for-microsoft-agent-framework-is-now/ba-p/4571100"
    "published": "2026-11-10 05:43:58"
    "fetched": "2026-11-10 16:50:52"
    "summary": "<p>Today, we’re excited to announce the general availability of the <a href=\"https://learn.microsoft.com/en-us/agent-framework/hosting/azure-functions?tabs=bash&amp;pivots=programming-language-csharp\" rel=\"noopener\" target=\"_blank\">Durable Task extension for Microsoft Agent Framework</a>. It brings the reliable execution model of <a href=\"https://learn.microsoft.com/en-us/azure/durable-task/scheduler/durable-task-scheduler\" rel=\"noopener\" target=\"_blank\">Durable Task</a> to <a href=\"https://learn.microsoft.com/en-us/agent-framework/\" rel=\"noopener\" target=\"_blank\">Agent Framework</a>, helping agents and agentic workflows recover from failures and interruptions without losing their progress.</p>\n<p>Saving a conversation is only part of the story. When an agent is doing work, your application also needs to know which steps have finished, which jobs are still running, and whether it’s waiting for someone’s approval. If the application restarts, that information makes the difference between continuing the work and figuring out where to begin again.</p>\n<p>The Durable Task extension keeps track of that state for you. Agents can continue the same conversation after a worker restart, and workflows can pick up interrupted work without repeating steps whose results have already been saved. They can also wait for approvals or external events without keeping a worker running. You can focus on what your agents do, with less state management and recovery code to build yourself.</p>\n<p>Run durable agents and workflows in <a href=\"https://learn.microsoft.com/azure/azure-functions/functions-overview\" rel=\"noopener\" target=\"_blank\">Azure Functions</a>, or self-host them in your own .NET or Python application.</p>\n<h2>Key capabilities of the Durable Task extension</h2>\n<p>The Durable Task extension adds two capabilities to <a href=\"https://learn.microsoft.com/agent-framework/\" rel=\"noopener\" target=\"_blank\">Microsoft Agent Framework</a> that work together: durable agents and durable workflows.</p>\n<p><strong>Durable agents</strong> keep conversation and session state between requests. Each agent call runs through Durable Task, so saved session state stays available even if a worker restarts or another application instance handles the next request. The conversation can continue without relying on the original process.</p>\n<p><strong>Durable workflows</strong> keep track of work that takes multiple steps or runs over time. You can write <a href=\"https://learn.microsoft.com/azure/durable-task/sdks/durable-task-overview\" rel=\"noopener\" target=\"_blank\">Durable Task orchestrations</a> to coordinate agent calls, application activities, and external events. If you prefer <a href=\"https://learn.microsoft.com/agent-framework/workflows/\" rel=\"noopener\" target=\"_blank\">Agent Framework’s graph-based workflows</a>, the extension runs those graphs as Durable Task orchestrations and handles registration of their agents and executors.</p>\n<p>The two come together when an interactive agent needs to start work that won’t finish in a single request. The agent can launch a workflow and return its instance ID rather than keep the user waiting. The workflow continues independently, including waiting for results or approvals. The agent can use that ID later to check progress or send an event, such as an approval decision.</p>\n<p>The examples below show how this works in practice: continuing a conversation, coordinating work across multiple steps, waiting for someone’s input, and managing session state and model context. Later in the post, we’ll show how to set up the host that runs these examples.</p>\n<h3>Agent sessions that survive interruptions</h3>\n<p>Suppose a customer starts a support conversation, then comes back with their order number. In between, your application restarts or another worker takes over. The agent should be able to pick up the conversation where it left off.</p>\n<p>Agent Framework can keep sessions in memory or use a persistent history provider to save messages between requests. A durable agent builds on that with a managed path for running agent calls and restoring session state, so you don’t have to wire that together yourself.</p>\n<p>With the Durable Task extension, each conversation has a stable durable session ID, and saved session state lives outside the worker process. Your application keeps the session reference. When the customer returns, another compatible worker can use that reference to continue the same conversation.</p>\n<p>The examples below show two separate requests. The first starts the conversation and serializes its session reference, which your application must save for later use. Serialization alone does not save it. The later request loads that reference and reconnects to the same durable session, without needing the original session object. Both requests use the same Durable Task backend, with SupportAgent registered through the extension.&nbsp;</p>\n<h4>C#</h4>\nusing System.Text.Json;\nusing Microsoft.Agents.AI;\nusing Microsoft.Agents.AI.DurableTask;\n\n// First request: start the conversation and return its session object.\nstatic async Task&lt;JsonElement&gt; StartConversationAsync(\n    IServiceProvider services)\n{\n    AIAgent agent = services.GetDurableAgentProxy(\"SupportAgent\");\n    AgentSession session = await agent.CreateSessionAsync();\n\n    await agent.RunAsync(\n        \"I need help with my order.\",\n        session: session);\n\n    // SerializeSessionAsync returns only the lightweight JSON session reference\n    // (containing the durable session ID); Durable Task already stores the\n    // conversation history in the backend.\n    return await agent.SerializeSessionAsync(session);\n}\n\n// Later request, after a restart or on another compatible worker.\n// Load savedSession from your application's durable storage before calling.\nstatic async Task&lt;AgentResponse&gt; ContinueConversationAsync(\n    IServiceProvider services,\n    JsonElement savedSession)\n{\n    AIAgent agent = services.GetDurableAgentProxy(\"SupportAgent\");\n    AgentSession session = await agent.DeserializeSessionAsync(savedSession);\n\n    return await agent.RunAsync(\n        \"The order number is 12345.\",\n        session: session);\n}\n<h4>Python</h4>\nfrom typing import Any\n\nfrom agent_framework import AgentResponse\nfrom agent_framework_durabletask import (\n    DurableAIAgentClient,\n    DurableAgentSession,\n)\n\n\n# First request: start the conversation and return its serialized session reference.\ndef start_conversation(\n    durable_client: DurableAIAgentClient,\n) -&gt; dict[str, Any]:\n    agent = durable_client.get_agent(\"SupportAgent\")\n    session = agent.create_session()\n\n    agent.run(\"I need help with my order.\", session=session)\n\n    # to_dict() returns only the lightweight session reference dict (containing\n    # durable_session_id); Durable Task already stores the conversation history\n    # in the backend.\n    return session.to_dict()\n\n\n# Later request, after a restart or on another compatible worker.\ndef continue_conversation(\n    durable_client: DurableAIAgentClient,\n    saved_session: dict[str, Any],\n) -&gt; AgentResponse:\n    agent = durable_client.get_agent(\"SupportAgent\")\n    session = DurableAgentSession.from_dict(saved_session)\n\n    return agent.run(\"The order number is 12345.\", session=session)\n<h3>Coordinate multi-step agentic workflows reliably</h3>\n<p>A simple customer question can lead to several steps: look up records, prepare a response, and send it to the right person or system. If something interrupts the process halfway through, your application needs to know what has already finished and what still needs to happen.</p>\n<p>Durable Task saves the results of agent calls and activities as the workflow progresses. After an interruption, the orchestration replays its history, reuses saved results, and continues with unfinished work. Completed agent calls whose results have been recorded don’t need to call the model again during replay, avoiding unnecessary token usage and inference costs during recovery.</p>\n<h4>C#</h4>\n// Registered as the Durable Task orchestration for this workflow.\nstatic async Task&lt;string&gt; RunOrderResponseWorkflowAsync(\n    TaskOrchestrationContext context,\n    string orderNumber)\n{\n    DurableAIAgent agent = context.GetAgent(\"OrderAgent\");\n    AgentSession session = await agent.CreateSessionAsync();\n\n    AgentResponse&lt;TextResponse&gt; summary = await agent.RunAsync&lt;TextResponse&gt;(\n        message: $\"Summarize order {orderNumber}.\",\n        session: session);\n\n    AgentResponse&lt;TextResponse&gt; reply = await agent.RunAsync&lt;TextResponse&gt;(\n        message: $\"Draft a customer reply: {summary.Result.Text}\",\n        session: session);\n\n    return reply.Text;\n}\n<h4>Python</h4>\n# Registered as the Durable Task orchestration for this workflow.\ndef run_order_response_workflow(\n    context: OrchestrationContext,\n    order_number: str,\n):\n    agent_context = DurableAIAgentOrchestrationContext(context)\n    agent = agent_context.get_agent(\"OrderAgent\")\n    session = agent.create_session()\n\n    summary = yield agent.run(\n        messages=f\"Summarize order {order_number}.\",\n        session=session,\n    )\n\n    reply = yield agent.run(\n        messages=f\"Draft a customer reply: {summary.text}\",\n        session=session,\n    )\n\n    return reply.text\n<h3>Make graph-based workflows durable</h3>\n<p>If you prefer to build workflows as graphs in Agent Framework, you can use that approach too. The Durable Task extension runs your graph as a durable orchestration, keeping track of its progress so it can recover from failures and interruptions.</p>\n<p>You only need to register the graph. The extension takes care of registering its agents, activities for the other executors, and the orchestration that runs it.</p>\n<h4>C#</h4>\nWorkflow expertTeamWorkflow = new WorkflowBuilder(questionParser)\n    .WithName(\"ExpertTeamReview\")\n    .AddFanOutEdge(questionParser, [biologist, physicist])\n    .AddFanInBarrierEdge([biologist, physicist], responseAggregator)\n    .Build();\n\nservices.ConfigureDurableWorkflows(\n    options =&gt; options.AddWorkflow(expertTeamWorkflow));\n<h4>Python</h4>\nexpert_team_workflow = (\n    WorkflowBuilder(\n        name=\"ExpertTeamReview\",\n        start_executor=question_parser,\n    )\n    .add_fan_out_edges(\n        source=question_parser,\n        targets=[biologist, physicist],\n    )\n    .add_fan_in_edges(\n        sources=[biologist, physicist],\n        target=response_aggregator,\n    )\n    .build()\n)\n\n# agent_worker wraps the Durable Task worker.\nagent_worker.configure_workflow(expert_team_workflow)\n<p>As agents and executors finish their work, Durable Task saves their results and reuses them during replay. You define how the work connects in the graph, and Durable Task handles preserving progress and recovering execution.</p>\n<h3>Human in the loop</h3>\n<p>Sometimes an agent needs someone to review a draft, approve an action, or provide more information before the work can continue. That response might take an hour, a day, or longer. Keeping a worker running just to wait can add cost and prevent the application from scaling down.</p>\n<p>With the Durable Task extension, the workflow can save its progress and wait for an external event without keeping a worker active. When the person responds, an HTTP endpoint, agent tool, or other application code sends the event to the matching workflow instance. The orchestration picks up from its saved state and continues the work.</p>\n<h4>C#</h4>\n// Registered as the Durable Task orchestration for this workflow.\nstatic async Task&lt;string&gt; RunContentReviewWorkflowAsync(\n    TaskOrchestrationContext context,\n    GeneratedContent draft)\n{\n    await context.CallActivityAsync(nameof(NotifyReviewer), draft);\n\n    HumanApprovalResponse decision = await context.WaitForExternalEvent&lt;HumanApprovalResponse&gt;(\n        eventName: \"HumanApproval\",\n        timeout: TimeSpan.FromHours(24));\n\n    if (!decision.Approved)\n        return \"Content was not approved.\";\n\n    await context.CallActivityAsync(nameof(PublishContent), draft);\n\n    return \"Content published.\";\n}\n\n// From the approval endpoint or agent tool, outside the orchestration:\nawait client.RaiseEventAsync(instanceId, \"HumanApproval\", approvalResponse);\n<h4>Python</h4>\n# Registered as the Durable Task orchestration for this workflow.\ndef run_content_review_workflow(\n    context: OrchestrationContext,\n    draft: dict[str, str],\n):\n    yield context.call_activity(\"notify_reviewer\", input=draft)\n\n    decision = yield context.wait_for_external_event(\"HumanApproval\")\n\n    if not decision[\"approved\"]:\n        return {\"status\": \"not-approved\"}\n\n    yield context.call_activity(\"publish_content\", input=draft)\n\n    return {\"status\": \"published\"}\n\n# From the approval endpoint or agent tool, outside the orchestration:\nclient.raise_orchestration_event(\n    instance_id=instance_id,\n    event_name=\"HumanApproval\",\n    data={\"approved\": True},\n)\n<h2>Observe agents and workflows in one place</h2>\n<p>When your application uses the Durable Task Scheduler as the durable backend, you can see what your agents and workflows are doing in the <a href=\"https://learn.microsoft.com/azure/durable-task/scheduler/durable-task-scheduler-dashboard\" rel=\"noopener\" target=\"_blank\">Durable Task Scheduler dashboard</a>, whether they run in Azure Functions or a self-hosted application.</p>\n<p>Open an agent session to review its conversation history, see the timeline of its execution, and check reported token usage.</p>\n<img />\n<p>For workflows, you can check their status and see how the work has progressed through the timeline, event history, and flow views. Open an individual step to inspect its inputs and outputs, understand what happened, or investigate a failure.</p>\n<img />\n<h1>Build with the Durable Task extension</h1>\n<p>You can run durable agents and workflows in <a href=\"https://learn.microsoft.com/azure/azure-functions/functions-overview\" rel=\"noopener\" target=\"_blank\">Azure Functions</a>, or host them in your own .NET or Python application.</p>\n<p>The examples below show how to register your agents and workflows with the host that runs them. They assume you’ve already defined the agents, workflow graphs, and orchestration functions.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>Hosting environment</th><th>.NET</th><th>Python</th></tr></thead><tbody><tr><td>Azure Functions</td><td><a href=\"https://www.nuget.org/packages/Microsoft.Agents.AI.Hosting.AzureFunctions\" target=\"_blank\">Microsoft.Agents.AI.Hosting.AzureFunctions</a></td><td><a href=\"https://pypi.org/project/agent-framework-azurefunctions/\" target=\"_blank\">agent-framework-azurefunctions</a></td></tr><tr><td>Self-hosted applications</td><td><a href=\"https://www.nuget.org/packages/Microsoft.Agents.AI.DurableTask\" target=\"_blank\">Microsoft.Agents.AI.DurableTask</a></td><td><a href=\"https://pypi.org/project/agent-framework-durabletask/\" target=\"_blank\">agent-framework-durabletask</a></td></tr></tbody></table></div>\n<h3>Azure Functions</h3>\n<p>Azure Functions gives you managed HTTP endpoints and scales with demand. To get started, add Microsoft.Agents.AI.Hosting.AzureFunctions for .NET or agent-framework-azurefunctions for Python to your Functions project, and configure its Durable Task backend.</p>\n<h4><span style=\"color: rgb(30, 30, 30); font-size: 28px;\">C# example for Azure Functions</span></h4>\n<p>Register standalone agents and agents used by your own orchestrations with ConfigureDurableAgents. For Agent Framework workflow graphs, use ConfigureDurableWorkflows. You can use either method on its own or combine them to host agents and graphs in the same application.</p>\nusing IHost app = FunctionsApplication\n    .CreateBuilder(args)\n    .ConfigureFunctionsWebApplication()\n    .ConfigureDurableAgents(options =&gt; options.AddAIAgent(agent))\n    .ConfigureDurableWorkflows(options =&gt; options.AddWorkflow(workflow))\n    .Build();\n\napp.Run();\n<p>For a Durable Task orchestration, mark its entry point with [Function] and [OrchestrationTrigger] so Azure Functions can discover it. If you register an Agent Framework graph, the extension creates the supporting orchestration for you.</p>\n<h4>Python</h4>\n<p>Pass standalone agents and agents used by your own orchestrations to AgentFunctionApp through the agents argument. For an Agent Framework graph, use the workflow argument. You can provide either or both.</p>\nfrom agent_framework_azurefunctions import AgentFunctionApp\n\napp = AgentFunctionApp(\n    agents=[agent],\n    workflow=workflow,\n)\n<p>For a Durable Task orchestration, mark its entry point with <a class=\"lia-mention lia-mention-user\" href=\"\">app​</a>.orchestration_trigger(context_name=\"context\"). For an Agent Framework graph, AgentFunctionApp adds that trigger for you.</p>\n<p>The <a href=\"https://github.com/microsoft/agent-framework-durable-extension/tree/main/dotnet/samples/DurableAgents/AzureFunctions\" rel=\"noopener\" target=\"_blank\">C# Functions samples</a> and <a href=\"https://github.com/microsoft/agent-framework-durable-extension/tree/main/python/samples/azure_functions\" rel=\"noopener\" target=\"_blank\">Python Functions samples</a> show the full project setup and how to call your agents and workflows.</p>\n<h3>Self-hosted applications</h3>\n<p>You can also run durable agents and workflows in your own application with Microsoft.Agents.AI.DurableTask for .NET or agent-framework-durabletask for Python. You choose where the application runs and how users or other systems call it. Durable Task handles saving execution state and recovering work after interruptions.</p>\n<h4>C# example for self-hosted applications</h4>\n<p>Configure the Durable Task worker and client, register your agents, and add any Agent Framework graphs.</p>\nusing IHost host = Host.CreateDefaultBuilder(args)\n    .ConfigureServices(services =&gt;\n    {\n        services.ConfigureDurableAgents(\n            options =&gt; options.AddAIAgent(agent),\n            workerBuilder: builder =&gt; builder.UseDurableTaskScheduler(connectionString),\n            clientBuilder: builder =&gt; builder.UseDurableTaskScheduler(connectionString));\n\n        services.ConfigureDurableWorkflows(\n            options =&gt; options.AddWorkflow(workflow));\n    })\n    .Build();\n\nawait host.RunAsync();\n<p>For a Durable Task orchestration, also register it through AddTasks in the workerBuilder callback. For example, this registers the earlier order-response function and passes it the orchestration input:</p>\nworkerBuilder: builder =&gt;\n{\n    builder.UseDurableTaskScheduler(connectionString);\n\n    builder.AddTasks(registry =&gt; registry.AddOrchestratorFunc(\n        \"RunOrderResponseWorkflow\",\n        (TaskOrchestrationContext context) =&gt; RunOrderResponseWorkflowAsync(\n            context,\n            context.GetInput&lt;string&gt;() ?? throw new ArgumentException(\n                \"An order number is required.\"))));\n}\n<p>The scheduler integration requires Microsoft.DurableTask.Worker.AzureManaged and Microsoft.DurableTask.Client.AzureManaged alongside the extension.</p>\n<h4>Python example for self-hosted applications</h4>\n<p>Pass your configured Durable Task worker to DurableAIAgentWorker, then register your agents, orchestrations, and workflow graphs before starting the worker.</p>\nfrom agent_framework_durabletask import DurableAIAgentWorker\n\nagent_worker = DurableAIAgentWorker(worker)\n\n# Register an agent and an orchestration you wrote directly.\nagent_worker.add_agent(order_agent)\nworker.add_orchestrator(run_order_response_workflow)\n\n# Register a graph and let the extension configure its components.\nagent_worker.configure_workflow(workflow)\n\nworker.start()\n<p>Register only the components your application needs, or combine them in the same worker. Your application keeps the worker running and calls worker.stop() when it shuts down.</p>\n<p>When you deploy, configure your Durable Task Scheduler endpoint, task hub, and authentication. <a href=\"https://learn.microsoft.com/azure/durable-task/scheduler/durable-task-scheduler\" rel=\"noopener\" target=\"_blank\">Durable Task Scheduler</a> is the recommended backend for Durable Functions and the Durable Task SDKs.</p>\n<h3>Start with a sample</h3>\n<p>You don’t have to start from scratch. Pick a sample for your language and hosting environment, and build from there:</p>\n<p>- <a href=\"https://github.com/microsoft/agent-framework-durable-extension/tree/main/dotnet/samples/DurableAgents/AzureFunctions\" rel=\"noopener\" target=\"_blank\">.NET Azure Functions samples</a></p>\n<p>- <a href=\"https://github.com/microsoft/agent-framework-durable-extension/tree/main/dotnet/samples/DurableAgents/ConsoleApps\" rel=\"noopener\" target=\"_blank\">.NET self-hosted samples</a></p>\n<p>- <a href=\"https://github.com/microsoft/agent-framework-durable-extension/tree/main/python/samples/azure_functions\" rel=\"noopener\" target=\"_blank\">Python Azure Functions samples</a></p>\n<p>- <a href=\"https://github.com/microsoft/agent-framework-durable-extension/tree/main/python/samples\" rel=\"noopener\" target=\"_blank\">Python Durable Task samples</a></p>\n<p>Read the <a href=\"https://learn.microsoft.com/agent-framework/hosting/azure-functions\" rel=\"noopener\" target=\"_blank\">Durable Task extension documentation</a> to get started, and share feedback or contribute in the <a href=\"https://github.com/microsoft/agent-framework-durable-extension\" rel=\"noopener\" target=\"_blank\">Microsoft Agent Framework Durable Task extension repository</a></p>"
