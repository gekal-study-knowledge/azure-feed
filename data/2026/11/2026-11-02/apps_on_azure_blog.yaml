    "title": "Announcing flex nodes for AKS (preview) in Azure portal"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/announcing-flex-nodes-for-aks-preview-in-azure-portal/ba-p/4569460"
    "published": "2026-11-02 22:00:00"
    "fetched": "2026-11-03 10:23:08"
    "summary": "<h3><strong>What’s new?</strong></h3>\n<p>Today, we’re announcing <strong>Azure portal support for flex nodes for AKS (preview)</strong>, offering an intuitive, guided experience that helps users create Flex node pools and connect supported user-managed compute to their existing AKS clusters.</p>\n<p><a href=\"https://blog.aks.azure.com/2026/09/22/flex-nodes-for-aks\" rel=\"noopener\" target=\"_blank\">Flex nodes for AKS</a> lets you extend an existing cluster with worker nodes running on user-managed virtual machines or on-premises servers in other Azure regions, on-premises, or at the edge, without adding another Kubernetes control plane to manage. The new portal experience brings flex node pool creation and supported host onboarding into the familiar AKS management workflow. By guiding users through these steps and showing deployment progress, the portal makes it easier to get started with flex nodes.</p>\n<h3><strong>How it works</strong></h3>\n<p>From an existing AKS cluster’s <strong>Node pools</strong> page, you can create a flex node pool and follow a guided onboarding experience for supported Azure virtual machines and Azure Arc-enabled servers.</p>\n<p>For supported onboarding paths, the portal coordinates pool creation and runs the onboarding script on the selected host. It displays deployment progress so you can follow the setup process. For supported Azure Compute, confirm that the node has joined your cluster and is <strong>Ready</strong> before scheduling workloads.</p>\n<p>Once connected, flex nodes participate in your existing cluster’s Kubernetes scheduling model. You can use labels, node affinity, and taints and tolerations to place selected workloads on the appropriate compute, while continuing to use standard AKS node pools for other workloads.</p>\n<p>You retain responsibility for the underlying hosts, their security, and network connectivity. The portal simplifies onboarding; it does not remove the configuration requirements or limitations of the flex nodes preview.</p>\n<h3><strong>How to get started</strong></h3>\n<p>To start using flex nodes in the Azure portal, you’ll need an existing AKS cluster, a supported host machine, and the required preview registrations, identity permissions, and network connectivity. Review the <a href=\"https://learn.microsoft.com/en-us/azure/aks/flex-nodes-for-aks-overview\" rel=\"noopener\" target=\"_blank\">Flex nodes documentation</a> before beginning.</p>\n<ol>\n<li>Open your existing AKS cluster in the <a href=\"https://portal.azure.com/\" rel=\"noopener\" target=\"_blank\">Azure portal</a>.</li>\n<li>Select <strong>Node pools</strong>, then start the <strong>Add flex node pool</strong> flow.</li>\n<li>Configure your flex node pool and choose the onboarding path for your compute environment.</li>\n<li>For supported <strong>Azure compute</strong>, select your Azure virtual machines and follow the streamlined onboarding flow in the portal. Before scheduling workloads, confirm that the nodes have joined the cluster and are&nbsp;<strong>Ready</strong>. After onboarding, a flex node’s Ready status may take a few moments to appear in the Azure portal.</li>\n<li>For <strong>Bring-your-own hosts </strong>outside Azure, download the onb<span style=\"color: rgb(30, 30, 30);\">oarding script from the portal and run it on your hosts.</span></li>\n</ol>\n<img />\n<h3><strong>Scenarios to explore</strong></h3>\n<p>Here are a few ways you can evaluate flex nodes with the new portal experience:</p>\n<ul>\n<li><strong>Use capacity outside your cluster’s region.</strong> Connect supported compute in another Azure region to evaluate workloads where capacity is available.</li>\n<li><strong>Bring existing infrastructure into your cluster.</strong> Explore using user-managed compute instead of operating a separate Kubernetes control plane.</li>\n<li><strong>Place selected workloads closer to data or devices.</strong> Use Kubernetes scheduling controls to target connected hosts in on-premises or edge environments.</li>\n</ul>\n<p>For each scenario, validate host compatibility, connectivity, and workload requirements. Workload placement can support your data residency strategy but does not by itself establish compliance.</p>\n<h3><strong>What’s next?</strong></h3>\n<p>We will continue refining the Azure portal experience for flex nodes in AKS, guided by feedback from the public preview. Our focus is on making it easier to connect your compute to an existing AKS cluster and understand onboarding progress.</p>\n<p>If you’re interested in helping shape the experience, <a href=\"https://aka.ms/aks-flex-node/github\" rel=\"noopener\" target=\"_blank\">share your feedback through the AKS Flex Node GitHub repository</a>. Tell us which host environments you’re evaluating, where setup could be clearer, and what would make ongoing management easier.</p>\n<p><strong>Learn more</strong></p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/aks/flex-nodes-for-aks-overview\" rel=\"noopener\" target=\"_blank\">What are Flex nodes for AKS? (preview) | Microsoft Learn</a></li>\n<li><a href=\"https://blog.aks.azure.com/2026/09/22/flex-nodes-for-aks\" rel=\"noopener\" target=\"_blank\">Announcing Flex nodes for AKS | AKS Engineering Blog</a></li>\n<li><a href=\"https://aka.ms/aks-flex-node/github\" rel=\"noopener\" target=\"_blank\">AKS Flex Node repository and feedback</a></li>\n</ul>"
