    "title": "Announcing public preview of Azure DDoS Protection peacetime telemetry"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/announcing-public-preview-of-azure-ddos-protection-peacetime/ba-p/4574781"
    "published": "2026-11-20 03:33:48"
    "fetched": "2026-11-20 14:18:13"
    "summary": "<p><span>We're excited to announce the public preview of peacetime telemetry for Azure DDoS Protection. The DDoS traffic metrics you rely on during an attack now show your traffic during normal operation too. You can learn what normal looks like, set alerts and test your monitoring well before you need them.</span><span>&nbsp;</span></p>\n<p><strong><span><span>Why it matters</span></span><span>&nbsp;</span></strong></p>\n<p><span>Azure DDoS Protection already monitors your traffic around the clock and mitigates attacks automatically, and that doesn't change. Peacetime telemetry adds visibility on top of that protection. Your teams get an everyday view of the traffic reaching your public IPs, in the same metrics they use during an attack, so they can understand that traffic and prepare their monitoring ahead of time.</span><span>&nbsp;</span></p>\n<p><strong><span><span>What's</span><span> new</span></span><span>&nbsp;</span></strong></p>\n<p><span>Before this preview, the DDoS traffic metrics for a protected public IP address showed data only while a mitigation was active. Now they also show the traffic reaching the IP during normal operation: the total in Inbound packets DDoS, and a breakdown in Inbound TCP packets DDoS, Inbound SYN packets DDoS, Inbound UDP packets DDoS and Inbound other packets DDoS. \"Other\" covers all traffic that isn't TCP or UDP. At the same time, Under DDoS attack or not stays at 0, which means DDoS Protection doesn't report an attack.</span><span>&nbsp;</span></p>\n<p><span>These are the metrics you already know, and nothing is renamed. For the full list, see the </span><a href=\"https://learn.microsoft.com/azure/ddos-protection/monitor-ddos-protection-reference\" rel=\"noopener\" target=\"_blank\"><span><span>monitoring data reference</span></span></a><span>.</span><span>&nbsp;</span></p>\n<p><strong><span><span>What you can do with it</span></span><span>&nbsp;</span></strong></p>\n<ul>\n<li><span>Learn your normal. Watch TCP, SYN, UDP and other traffic for each protected public IP over days and weeks, so you know your busy periods before an attack.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Compare traffic with mitigation triggers. Chart observed packet rates next to the trigger metrics for the same IP to see how everyday traffic compares with the thresholds that start mitigation.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Alert on traffic conditions. Create Azure Monitor metric alerts with thresholds that fit each workload. These alerts sit alongside your attack alerts; they don't replace them, and they don't change how mitigation starts.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Test your monitoring with everyday traffic. Check that your charts, workbooks and alerts receive data without simulating an attack.</span><span>&nbsp;</span></li>\n</ul>\n<p><strong><span><span>Availability and scope</span></span></strong><span>&nbsp;</span></p>\n<ul>\n<li><span>Both tiers. It works with DDoS Network Protection and DDoS IP Protection.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>The resources you already protect. It covers the </span><a href=\"https://learn.microsoft.com/azure/ddos-protection/ddos-protection-reference-architectures#protected-resources\" rel=\"noopener\" target=\"_blank\"><span><span>same resources DDoS Protection supports today</span></span></a><span>.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Automatic. It's on for protected public IP addresses. You don't need to register.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Nothing extra to set up. You can view the metrics in Azure Monitor without a Log Analytics workspace or diagnostic settings.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>No additional cost beyond your existing </span><a href=\"https://azure.microsoft.com/pricing/details/ddos-protection/\" rel=\"noopener\" target=\"_blank\"><span><span>Azure DDoS Protection pricing</span></span></a><span>. Standard </span><a href=\"https://learn.microsoft.com/azure/azure-monitor/fundamentals/cost-usage\" rel=\"noopener\" target=\"_blank\"><span><span>Azure Monitor charges</span></span></a><span> apply to alert rules.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Public cloud, IPv4 and IPv6. During the preview, peacetime telemetry is available in the Azure public cloud, for IPv4 and IPv6 public IP addresses. It isn't available in sovereign clouds, such as Azure Government. The preview is subject to the </span><a href=\"https://azure.microsoft.com/support/legal/preview-supplemental-terms/\" rel=\"noopener\" target=\"_blank\"><span><span>Supplemental Terms of Use for Microsoft Azure Previews</span></span></a><span>.</span><span>&nbsp;</span></li>\n</ul>\n<p><strong><span><span>Get started</span></span></strong><span>&nbsp;</span></p>\n<p><span>Before you begin</span><span>,</span><span> you need a public IP address protected by DDoS Network Protection or DDoS IP Protection, and permission to read its metrics.</span><span>&nbsp;</span></p>\n<ol>\n<li><span>In the </span><a href=\"https://portal.azure.com/\" rel=\"noopener\" target=\"_blank\"><span><span>Azure portal</span></span></a><span>, open the protected </span><span>public IP address</span><span>.</span></li>\n<li>Under&nbsp;<span style=\"color: rgb(30, 30, 30);\">Monitoring</span><span style=\"color: rgb(30, 30, 30);\">, select </span><span style=\"color: rgb(30, 30, 30);\">Metrics</span><span style=\"color: rgb(30, 30, 30);\">.</span><span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li>Set the time granularity to&nbsp;<span style=\"color: rgb(30, 30, 30);\">1 minute</span><span style=\"color: rgb(30, 30, 30);\">. Add </span><span style=\"color: rgb(30, 30, 30);\">Inbound TCP packets DDoS</span><span style=\"color: rgb(30, 30, 30);\">, </span><span style=\"color: rgb(30, 30, 30);\">Inbound UDP packets DDoS</span><span style=\"color: rgb(30, 30, 30);\"> and </span><span style=\"color: rgb(30, 30, 30);\">Inbound SYN packets DDoS</span><span style=\"color: rgb(30, 30, 30);\">, each with </span><span style=\"color: rgb(30, 30, 30);\">Max</span><span style=\"color: rgb(30, 30, 30);\"> aggregation. Packet metrics are already reported per second.</span><span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li>Select&nbsp;<span style=\"color: rgb(30, 30, 30);\">New chart</span><span style=\"color: rgb(30, 30, 30);\">, and add </span><span style=\"color: rgb(30, 30, 30);\">Under DDoS attack or not</span><span style=\"color: rgb(30, 30, 30);\"> with </span><span style=\"color: rgb(30, 30, 30);\">Max</span><span style=\"color: rgb(30, 30, 30);\"> aggregation.</span></li>\n</ol>\n<p><span>When the public IP receives normal traffic, the first chart shows that traffic and&nbsp;</span><span>Under DDoS attack or not</span><span> stays at </span><span>0</span><span>.</span><span>&nbsp;</span></p>\n<img />\n<p><em><span>Figure 1: The DDoS packet metrics for a protected public IP address during normal operation.</span><span>&nbsp;</span></em></p>\n<img />\n<p><em><span>Figure 2: Normal traffic is visible while the attack status stays at 0.</span><span>&nbsp;</span></em></p>\n<p><span>To add a traffic alert, see </span><a href=\"https://learn.microsoft.com/azure/ddos-protection/alerts#traffic-condition-alerts-during-peacetime-preview\" rel=\"noopener\" target=\"_blank\"><span><span>Traffic-condition alerts during peacetime (preview)</span></span></a><span>. Base the threshold on the traffic you've seen, not on the attack-status value of 1.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><strong><span><span>Good to know</span></span><span>&nbsp;</span></strong></p>\n<ul>\n<li><span>Check alerts and automation that assume an attack.</span><span> If a workbook, alert or script treats the presence of DDoS traffic data as a sign of an attack, update it to check </span><span>Under DDoS attack or not</span><span> instead.</span><span>&nbsp;</span></li>\n<li><span>Protection doesn't change.</span><span> Mitigation policies stay the same. Mitigation flow logs, reports and notifications are produced at the same times as before.</span></li>\n</ul>\n<p><strong><span><span>Learn more</span></span><span>&nbsp;</span></strong></p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/azure/ddos-protection/monitor-ddos-protection#peacetime-telemetry-availability-preview\" rel=\"noopener\" target=\"_blank\"><span><span>Read about peacetime telemetry availability</span></span></a><span>&nbsp;</span></li>\n<li><a href=\"https://learn.microsoft.com/azure/ddos-protection/alerts#traffic-condition-alerts-during-peacetime-preview\" rel=\"noopener\" target=\"_blank\"><span><span>Set up traffic-condition alerts during peacetime</span></span></a><span>&nbsp;</span></li>\n<li><a href=\"https://learn.microsoft.com/azure/ddos-protection/monitor-ddos-protection-reference\" rel=\"noopener\" target=\"_blank\"><span><span>Browse the DDoS Protection metrics reference</span></span></a><span>&nbsp;</span></li>\n<li><a href=\"https://learn.microsoft.com/azure/ddos-protection/ddos-faq\" rel=\"noopener\" target=\"_blank\"><span><span>Read the Azure DDoS Protection FAQ</span></span></a><span>&nbsp;</span></li>\n</ul>"
