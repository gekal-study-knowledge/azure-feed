"overview": |
  この日は 2 ソースから 6 本で、データベースの運用支援と可用性・復旧まわりのプレビューが中心でした。Azure Database for PostgreSQL では、データベースの正常性を先回りして監視し、メトリクスや構成をまとめて正常性やパフォーマンスの問題の検出・理解・対応を早める Database Agent がパブリックプレビューとなり、PostgreSQL 19 も Flexible Server の東アジアリージョンでパブリックプレビューとして Azure ポータルと Azure CLI から新規サーバーを作成して試せるようになりました。可用性では、対象のゾーン VM を既存の VM リソースと構成を保ったまま同じリージョンの別の可用性ゾーンで復旧できる Azure VM のゾーン回復性 (ZRS マネージドディスクのゾーン間同期レプリケーションを利用) がパブリックプレビューとなり、Azure Compute Gallery の論理的な削除が一般提供となって、誤って削除したイメージバージョンを 7〜365 日の保持期間内に復旧でき、保持期間中も論理削除済みイメージからデプロイできます。Azure DDoS Protection では、攻撃中に使っていた DDoS トラフィックメトリクスを平常時にも表示する peacetime telemetry がパブリックプレビューとなり、平常時のトラフィックを把握してアラートや監視を事前に試せるようになりました。そのほか、Microsoft Marketplace のマルチパーティプライベートオファーがマレーシアとサウジアラビアに拡大されました。
