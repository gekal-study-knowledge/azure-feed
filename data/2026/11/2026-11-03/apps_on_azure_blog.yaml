    "title": "Why Did Our Azure Bill Change? Investigating Cloud Spend with Azure SRE Agent"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/why-did-our-azure-bill-change-investigating-cloud-spend-with/ba-p/4569760"
    "published": "2026-11-03 12:51:16"
    "fetched": "2026-11-05 03:18:14"
    "summary": "<h2>The question after the cost chart</h2>\n<p>The monthly cost review usually starts with a straightforward observation: Azure spending changed.</p>\n<p>Then come the questions that take the time.</p>\n<p>Which subscription accounts for the increase? Is it an existing workload getting more expensive, or something that only started generating charges this month? Did a reduction somewhere else hide part of the increase? And which optimization recommendations are worth taking to a workload owner?</p>\n<p>Azure already has the underlying information. Cost Management provides spending data. Azure Advisor provides optimization recommendations. Resource inventory provides context about what those resources are.</p>\n<p>The work is connecting those sources into an explanation that someone can check and act on.</p>\n<p><strong>Conversational Cost Analytics Agent: </strong>a solution built around Azure SRE Agent that lets operations and FinOps leads start with a question, investigate cost drivers, identify optimization opportunities, and generate reusable reports. The solution can also generate proactive alerts and scheduled reports.</p>\n<p><strong>Scope of this post:</strong> The repository contains a prototype, an importable dashboard template, reusable skills, and example report screenshots. These demonstrate the reporting approach; they are not evidence of measured customer savings, verified production readiness, or a completed deployment in your environment. The prompts below are examples to try, not a transcript of a measured production investigation.</p>\n<h2>What we built</h2>\n<p>This is a custom cost-investigation workflow on Azure SRE Agent, not a separate billing system or a claim that every feature is available out of the box.</p>\n<p>The solution brings together three pieces:</p>\n<ul>\n<li><strong>An analytical skill</strong> that describes how to compare spending, calculate resource contributions, identify newly billed resources, and handle incomplete periods.</li>\n<li><strong>A query-reference skill</strong> that records the Cost Management query patterns, response shapes, aggregation rules, and SRE Agent tool mappings used by the dashboard workflow.</li>\n<li><strong>An HTML Live Report template</strong> that presents subscription selection, summary metrics, six-month trends, and expandable resource-level comparisons.</li>\n</ul>\n<p>The distinction matters. A template determines how findings appear. A skill determines how the agent should investigate. Neither replaces access to the underlying data.</p>\n<p>The agent still needs scoped permissions, supported tools, and a successful data refresh before the report can represent your subscriptions.'</p>\n<h2>How the investigation works</h2>\n<p>The workflow starts by discovering the subscriptions the agent can access. It then queries Cost Management for historical totals and current- and previous-month resource-level details, aggregates the results, and populates the report template.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 85.0926%; height: 210px; border-width: 1px;\"><colgroup><col style=\"width: 24.8378%;\" /><col style=\"width: 75.1622%;\" /></colgroup><tbody><tr style=\"height: 35px;\"><td style=\"height: 35px;\"><strong>Source or component</strong></td><td style=\"height: 35px;\"><strong>Role in the investigation</strong></td></tr><tr style=\"height: 35px;\"><td style=\"height: 35px;\">Azure Cost Management</td><td style=\"height: 35px;\">Billing-based cost data and historical comparisons</td></tr><tr style=\"height: 35px;\"><td style=\"height: 35px;\">Azure Resource Graph</td><td style=\"height: 35px;\">Resource inventory and metadata enrichment, not cost data</td></tr><tr style=\"height: 35px;\"><td style=\"height: 35px;\">Azure Advisor</td><td style=\"height: 35px;\">Optimization recommendations to review alongside spending</td></tr><tr style=\"height: 35px;\"><td style=\"height: 35px;\">Reusable agent skills</td><td style=\"height: 35px;\">Investigation rules, query patterns, and interpretation guardrails</td></tr><tr style=\"height: 35px;\"><td style=\"height: 35px;\">Live Report template</td><td style=\"height: 35px;\">Interactive presentation of the refreshed data snapshot</td></tr></tbody></table>\n<p>&nbsp;</p>\n</div>\n<ul>\n<li><strong>How cost data is collected:</strong> The agent sends a request to Azure Cost Management to retrieve spending data. The request uses HTTP POST, so the kit runs it through RunAzCliWriteCommands, even though it only reads data.</li>\n<li><strong>Reading costs does not change resources:</strong> This query does not resize, delete, or modify resources. Still, configure permissions and tools carefully to limit what the agent can do.</li>\n<li><strong>The report shows the most recently refreshed data:</strong> Opening the report displays the data collected during its most recent refresh. It does not automatically request updated billing data.</li>\n<li><strong>Fetching data directly from the report requires a connector:</strong> A supported connector gives the report access to a cost-query tool. The report cannot directly use the agent’s built-in CLI tools.</li>\n<li><strong>You can start without a connector:</strong> Use the report with periodically refreshed data, and add a connector later if you need to fetch updates directly from the report.</li>\n</ul>\n<h2>Four questions to explore in the report</h2>\n<h3>1. Where is spending heading?</h3>\n<p>Start with the broad view:</p>\n<p>The overview brings subscription selection, summary KPIs, previous-month actuals, and an adjustable cost trend into one view. Select the number of months you want to compare, up to 12, and expand any month to explore the services behind the spending changes.</p>\n<img />\n<p><em>Figure 1. Historical prototype snapshot, not current pricing or a verified financial result. The current-month KPI is a projection; the screenshot does not establish that the partial-month trend bar uses the same basis. Reconcile those values and use consistent labels before relying on the comparison.</em></p>\n<p>This is also where an apparently simple comparison can become misleading. Ten days of current-month spend and a full previous month are not comparable periods.</p>\n<p>For an in-progress month, ask for matched month-to-date periods when investigating change. If the report displays a full-month run-rate projection, keep it labeled as a projection. Do not describe it as a Cost Management forecast unless that forecast was actually retrieved.</p>\n<p>The useful outcome is not just a larger or smaller bar. It is an explicit statement of the period, cost basis, currency, and freshness behind that bar.</p>\n<h3>2. Which resources explain the change?</h3>\n<p>Once the subscription-level movement is clear, move to the contributors:</p>\n<p class=\"lia-indent-padding-left-30px\"><em>\"Rank the resources driving increases and decreases. Separate newly billed resources from existing resources whose costs changed.\"</em></p>\n<p>The resource view compares spending at the resource level, highlights resources appearing in the current period’s billing data, and supports expandable service breakdowns.</p>\n<img />\n<p><em>Figure 2. Historical prototype comparison. The screenshot's \"New Resources\" label means newly observed in billing, not confirmed creation. In this example workflow, current-month \"Full\" values are projections, not completed-month actuals.</em></p>\n<p>The agent can help break down cost changes that might otherwise require multiple spreadsheets and time-consuming manual comparisons:</p>\n<ul>\n<li><strong>New charges do not always mean new resources:</strong>&nbsp;An existing resource may start generating charges after a period of inactivity. Costs may also rise because of autoscaling, longer VM running hours, increased storage usage, more read/write operations, or billable data transfers. These changes can be difficult to spot in summary reports.</li>\n<li><strong>Newly created resources can add to spending:</strong>&nbsp;The agent can highlight resources appearing in the current period’s billing data. Resource inventory or deployment history is needed to confirm whether they were newly created or simply started generating charges.</li>\n<li><strong>One resource can have several cost entries:</strong>&nbsp;A resource may appear in multiple billing records for different services or meters. Adding the relevant entries together helps show its total cost and contribution to the change.</li>\n<li><strong>The net change can hide larger movements:</strong>&nbsp;For example, if one resource’s cost increases by $800 while another decreases by $300 over comparable periods, the net increase is $500. Showing both changes reveals the increase and the offsetting reduction. These figures are illustrative.</li>\n<li><strong>Finding the cost driver is not the same as finding the cause:</strong> Identifying which resource contributed to an increase is the first step. Explaining why it happened may require additional evidence about usage, configuration changes, pricing, or other factors.</li>\n</ul>\n<h3>3. Which optimization opportunities deserve attention?</h3>\n<p>The next question is usually practical:</p>\n<p class=\"lia-align-center\"><em>\"Show Azure Advisor cost optimization recommendations for the subscriptions in scope. Separate estimated savings from confirmed spending reductions.\"</em></p>\n<p>The repository includes an example Advisor optimization view for reviewing rightsizing and commitment-related opportunities alongside the cost investigation.</p>\n<img />\n<p><em>Figure 3. Historical prototype optimization view. Displayed savings are estimates, not realized savings; low CPU alone does not establish that shutdown is appropriate. A displayed zero for reservations requires a successful, authorized query before it can be interpreted as no reservations.</em></p>\n<p>The useful next step is to review the findings with the workload owner, not to make an automatic purchase or resize a resource.</p>\n<p>Rightsizing can change the baseline for a reservation or savings plan decision. Recommendations can also overlap, so adding every displayed savings figure may overstate the opportunity. Billing and commitment visibility depend on the identity's actual access; subscription resource access does not automatically expose every reservation or savings plan dataset.</p>\n<p>An unavailable dataset should be reported as unavailable. It should never silently become \"no recommendations\" or \"no commitments.\"</p>\n<h3>4. What might we be paying for without using?</h3>\n<p>Finally, investigate cleanup candidates:</p>\n<p class=\"lia-indent-padding-left-30px\"><em>\"Identify potentially orphaned resources and show the evidence that makes each one a candidate for owner review.\"</em></p>\n<p>The example orphaned-resource view covers candidates such as unattached disks, stale snapshots, unassociated public IP addresses and network interfaces, and empty App Service plans.</p>\n<img />\n<p><em>Figure 4. Example cleanup-candidate inventory. An apparent orphan is an investigation finding, not deletion approval.</em></p>\n<p>An unattached disk may be retained for recovery. A snapshot may be subject to a retention requirement. A network resource may be reserved for a planned deployment.</p>\n<p>The report should help the owner answer those questions by identifying the resource, its state, and any observed charges. It should not turn \"not currently attached\" into \"safe to delete.\"</p>\n<p>The intended configuration is read-only reporting and investigation. Validate the identity's effective permissions and enabled tools before use; the template alone does not enforce that boundary. Any cleanup requires separate validation and explicit approval.</p>\n<h2>Have a meaningful cost conversation with the agent</h2>\n<p>A cost dashboard remains useful. It shows the shape of spending and gives people a shared view. However, a conversational approach takes this further by helping users investigate what is driving spending, identify key contributors, distinguish new charges from changes in existing resources, and explore cost optimization opportunities.</p>\n<p>Start with a simple cost question, then use follow-up prompts to explore what changed, which resources contributed, and what needs further investigation.</p>\n<p><strong>Example prompts include:</strong></p>\n<p class=\"lia-indent-padding-left-30px\">“Which subscriptions and resources explain the largest cost increases compared with last month?”</p>\n<p class=\"lia-indent-padding-left-30px\">“Why did costs increase this month?”</p>\n<p class=\"lia-indent-padding-left-30px\">“Which resources contributed most to the increase?”</p>\n<p class=\"lia-indent-padding-left-30px\">“Is this newly billed spending or higher costs from existing resources?”</p>\n<p class=\"lia-indent-padding-left-30px\">“Compare the last three months and show the biggest changes.”</p>\n<p class=\"lia-indent-padding-left-30px\">“Create a report focused on this subscription and its top cost drivers.”</p>\n<p class=\"lia-indent-padding-left-30px\">“Show Azure Advisor savings opportunities and orphaned resources that require owner review.”</p>\n<p class=\"lia-indent-padding-left-30px\">“Refresh this report every Monday morning.”</p>\n<p>With the required data access and tools configured, the agent can help rerun analyses, narrow the scope, and generate reports focused on specific cost questions. Scheduled reports and cost alerts require supported capabilities, appropriate permissions, and separate configuration. Check findings against source data before making decisions or changing resources.</p>\n<h2>Try it in your environment</h2>\n<p>Start with one subscription whose costs you already understand. That makes it easier to reconcile the first report before expanding the scope.</p>\n<ol>\n<li><strong>Review the kit.</strong> Start with the <a href=\"https://github.com/Asithdee/Azure/blob/main/SREAgent/ConversationalCostAnalyticsAgent/README.md\" rel=\"noopener\" target=\"_blank\">repository overview</a></li>\n<li><strong>Add the three skills</strong> from the <a href=\"https://github.com/Asithdee/Azure/blob/main/SREAgent/ConversationalCostAnalyticsAgent/skills\" rel=\"noopener\" target=\"_blank\">skills folder</a>, and upload the <a href=\"https://github.com/Asithdee/Azure/blob/main/SREAgent/ConversationalCostAnalyticsAgent/knowledge/cost-analysis-playbook.md\" rel=\"noopener\" target=\"_blank\">cost analysis playbook</a> as a knowledge source.</li>\n<li><strong>Configure scoped access.</strong> The kit calls for Cost Management Reader and Reader on each target subscription for cost queries and inventory enrichment. Validate any additional billing or commitment access separately.</li>\n<li><strong>Bootstrap the report.</strong> Submit the first-run prompt from the <a href=\"https://github.com/Asithdee/Azure/tree/main/SREAgent/ConversationalCostAnalyticsAgent/prompts\" rel=\"noopener\" target=\"_blank\">bootstrap prompts</a> and provide the <a href=\"https://github.com/Asithdee/Azure/tree/main/SREAgent/ConversationalCostAnalyticsAgent/reports\" rel=\"noopener\" target=\"_blank\">HTML report template</a>.</li>\n<li><strong>Validate the result.</strong> Reconcile a completed month's totals against Cost Management using the same scope, currency, and cost basis. Check resource aggregation, labels, and missing-data states.</li>\n<li><strong>Configure refresh only after validation.</strong> The kit includes a suggested Monday 07:00 UTC refresh prompt. Confirm scheduling support, permissions, and failure handling in your environment before relying on it.</li>\n</ol>\n<p>Using this workflow may incur Azure SRE Agent charges and other applicable service charges. Review <a href=\"https://learn.microsoft.com/azure/sre-agent/pricing-billing\" rel=\"noopener\" target=\"_blank\">Azure SRE Agent pricing and billing</a> and the pricing for the services you configure before running a pilot. This post does not describe a free service offering.</p>\n<h2>Further reading</h2>\n<ul>\n<li><a href=\"https://learn.microsoft.com/azure/sre-agent/overview\" rel=\"noopener\" target=\"_blank\">Azure SRE Agent overview</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/cost-management-billing/costs/overview-cost-management\" rel=\"noopener\" target=\"_blank\">Azure Cost Management overview</a></li>\n<li><a href=\"https://learn.microsoft.com/rest/api/cost-management/query/usage\" rel=\"noopener\" target=\"_blank\">Azure Cost Management Query API</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/advisor/advisor-cost-recommendations\" rel=\"noopener\" target=\"_blank\">Azure Advisor cost recommendations</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/governance/resource-graph/overview\" rel=\"noopener\" target=\"_blank\">Azure Resource Graph overview</a></li>\n</ul>"
