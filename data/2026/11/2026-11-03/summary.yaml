  この日は Azure Updates に 6 件が掲載され、事業継続系の一般提供と Application Gateway for Containers のプレビューが中心でした。一般提供では、Azure Site Recovery が Azure Local に対応し、サポート対象の Windows と Linux の仮想マシンを保護できるようになりました。Azure Service Bus Premium では、パーティション分割された名前空間で Geo レプリケーションが使えるようになり、パーティション分割のスループットと、メッセージとメタデータのセカンダリリージョンへの複製を両立できます。Azure SQL Database は、単一データベース、Hyperscale、エラスティックプールのデータベースを、スクリプトやサポートへの連絡なしに Azure portal から再起動・フェイルオーバーできるようになりました。パブリックプレビューの Application Gateway for Containers には 3 件が加わりました。Azure Private Link のプライベートエンドポイント経由でのみ到達できるプライベートフロントエンド、MCPRoute カスタムリソースによる Model Context Protocol のルーティング、AuthPolicy カスタムリソースによる JWT の一元的な検証です。
