"overview": |
  この日は廃止告知が 2 件あり、Azure Fluid Relay が 2027 年 2 月 2 日に提供終了、Microsoft Defender for IoT の OT セキュリティが 3 年間の移行期間を経て 2029 年 10 月に完全廃止となる。一般提供では Azure Local 向け Azure Site Recovery、Service Bus Premium のパーティション分割名前空間での Geo-Replication、Azure portal からの Azure SQL DB の再起動、Storage Actions の機能強化、PostgreSQL フレキシブルサーバーの VNet 統合からプライベートエンドポイント構成への変更が並んだ。Application Gateway for Containers はプライベートイングレス・MCP ゲートウェイ・JWT 検証の 3 つをプレビュー公開し、Azure Migrate の NAS 検出・評価もプレビューとなった。セキュリティブログでは実際に悪用された脆弱性のデータ分析が出た。Microsoft Azure Blog では、エージェントがより長く戦略的な仕事を担うようになる AI の次のフロンティアと、それを支えるプラットフォームについての記事が出た。Apps on Azure Blog では、Azure SRE Agent を使って Azure の請求額の変化を調査する方法が紹介され、どのサブスクリプションが増加の原因か、既存ワークロードの値上がりか新たに課金が始まったものか、別の削減が増加を隠していないかといった問いを追いかける流れを解説した。
