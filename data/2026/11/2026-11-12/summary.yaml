"overview": |
  この日は 3 ソースから 4 本で、Azure Front Door WAF の新機能と、Microsoft Security Blog の Linux を狙う脅威の研究が中心でした。Azure Front Door Premium の Web Application Firewall (WAF) でレート制限のグループ化がパブリックプレビューとなりました。既定ではレート制限ルールはクライアント IP アドレスごとに要求を数えるため、多数の IP に分散させた攻撃はこれをすり抜けられますが、グループ化によってこうした分散攻撃に対処しやすくなります。Microsoft Security Blog では、Microsoft FORGE Lab の研究者がコードネーム MDASH を使って Linux カーネルの脆弱性を調査し、59 件のバグ報告をアップストリームに送り、33 件に CVE が割り当てられ、38 件の修正がマージされた成果が報告されました。8 件のローカル root 権限昇格のエクスプロイトを実証したほか、AI が生成した発見を検証済みの脆弱性とアップストリームの修正につなげるうえでの課題も検討しています。同ブログではまた、侵害された Linux サーバーに攻撃者が GSocket を展開し、元の脆弱性が修正されたあとも暗号化されたリモートアクセス (C2) を維持している手口と、その検出・調査・修復の方法が解説されました。Apps on Azure Blog では、VS Code で Azure アプリを作るガイド付き Copilot エクスペリエンスが JavaScript / TypeScript に続いて Python に正式対応したことが発表されています。
