  "fa1922215a541363ba0d92587cd9f9a2":
    "id": "fa1922215a541363ba0d92587cd9f9a2"
    "title": "Python support has arrived in the guided Copilot experience for VS Code"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/python-support-has-arrived-in-the-guided-copilot-experience-for/ba-p/4572591"
    "published": "2026-11-12 01:56:47"
    "fetched": "2026-11-12 13:34:40"
    "summary": "<p>When we introduced the&nbsp;<a href=\"https://techcommunity.microsoft.com/blog/AppsonAzureBlog/introducing-a-guided-copilot-experience-for-building-azure-apps-in-vs-code/4557120\" rel=\"noopener\" target=\"_blank\">guided Copilot experience for building Azure apps in VS Code</a>, we started with JavaScript and TypeScript, with Python on the roadmap. Since then, we've seen people creating Python projects with the experience, and we wanted to make sure our Python lovers had proper support.</p>\n<p>Today, we're excited to announce that the guided Copilot experience in VS Code now fully supports Python projects. \U0001F40D</p>\n<h2>From Python idea to Azure app</h2>\n<p>The guided experience helps you move from an idea to a deployed Azure app through a structured workflow, with checkpoints for reviewing important decisions. Now Python developers can use that same experience to:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<ol>\n<li><strong>Plan and scaffold:</strong> Describe your app, review the proposed architecture, and approve a plan before code is generated.</li>\n<li><strong>Develop locally:</strong> Get help preparing your development environment, then run and iterate on your Python project in VS Code.</li>\n<li><strong>Deploy to Azure:</strong> Review the deployment tools, resources, and estimated costs before deploying your app.</li>\n</ol>\n<p>This guided path complements the free-form Copilot workflows you already know, so you can choose the approach that works best for you.</p>\n<h2>Give it a try</h2>\n<p>Install the <a href=\"https://marketplace.visualstudio.com/items?itemName=ms-vscode.vscode-node-azure-pack\" rel=\"noopener\" target=\"_blank\">Azure Tools extension pack</a>, open an empty folder in VS Code, and start the guided Copilot experience with your Python project in mind.</p>\n<p>Whether you're building an API, prototyping an idea, or learning something new, we'd love to see what you create. Have feedback? <a href=\"https://github.com/microsoft/vscode-azureresourcegroups/\" rel=\"noopener\" target=\"_blank\">Share it with us on GitHub</a>.</p>\n<p>Thanks to everyone who's been building Python projects with the experience. We're excited to see what you make next!</p>"
  "6f0863fb72aef0b3d53a64fb7737ddee":
    "id": "6f0863fb72aef0b3d53a64fb7737ddee"
    "title": "Introducing Azure Container Apps as a target workload in Azure Migrate"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/introducing-azure-container-apps-as-a-target-workload-in-azure/ba-p/4571669"
    "published": "2026-11-12 14:51:04"
    "fetched": "2026-11-12 22:22:32"
    "summary": "<p>We are excited to announce <strong>Azure Container Apps as a target workload for assessment in Azure Migrate</strong>, helping organizations evaluate existing web applications for migration to a managed, serverless container platform.</p>\n<p>This capability extends the Azure Migrate assessment experience to Azure Container Apps, bringing application readiness, migration requirements, sizing recommendations, and estimated hosting costs into migration planning. Organizations can identify suitable applications, understand the changes required, and make informed decisions before starting migration.</p>\n<p>Supported workloads include Web Apps discovered through Azure Migrate</p>\n<h2>Make informed modernization and migration decisions</h2>\n<p>For organizations with an existing application estate, modernization starts with a few essential questions: Which applications are suitable for container-based hosting? What needs to change? What resources will they require, and what will they cost to run?</p>\n<p>Azure Migrate helps answer these questions through discovery and assessment. With Azure Container Apps as a workload target, migration teams can:</p>\n<ul>\n<li><strong>Assess application readiness:</strong> Evaluate existing web applications for migration to Azure Container Apps.</li>\n<li><strong>Identify migration requirements:</strong> Review compatibility issues, warnings, and recommended remediation.</li>\n<li><strong>Review resource recommendations:</strong> Understand the compute requirements of the assessed applications.</li>\n<li><strong>Estimate hosting costs:</strong> Use assessment estimates to support migration decisions and budgeting.</li>\n<li><strong>Plan migration waves:</strong> Turn assessment insights into manageable migration batches.</li>\n</ul>\n<p>These insights help migration teams and application owners establish a shared understanding of migration scope, effort, and priorities.</p>\n<h2>Why Azure Container Apps?</h2>\n<p>Azure Container Apps enables organizations to run containerized applications without managing servers or the underlying container orchestration infrastructure.</p>\n<p>The platform supports web applications, APIs, microservices, and background processing, with capabilities including:</p>\n<ul>\n<li><strong>Automatic scaling</strong> based on HTTP traffic or event-driven rules, including scale-to-zero for supported configurations.</li>\n<li><strong>Managed ingress</strong> for application endpoints.</li>\n<li><strong>Application revisions and traffic splitting</strong> to support controlled updates.</li>\n<li><strong>Connectivity to dependent services</strong>, including databases, storage, and messaging.</li>\n</ul>\n<p>Adding Azure Container Apps as an assessment target helps organizations evaluate these capabilities against the requirements of existing applications before migration begins.</p>\n<h2>From discovery to migration</h2>\n<h3>1. Discover existing web applications</h3>\n<p>Start with an Azure Migrate project and configure the Azure Migrate appliance for the source environment.</p>\n<p>Discovery builds an inventory of web applications and their hosting servers. Review the discovered applications and dependency information to establish the assessment scope.</p>\n<img />\n<p class=\"lia-clear-both\">&nbsp;</p>\n<p><em>Review discovered web applications and select workloads for assessment. The inventory includes discovered workloads; discovery alone does not establish readiness for Azure Container Apps.</em></p>\n<h3>2. Assess for Azure Container Apps</h3>\n<p>Create a web app assessment for the selected applications and choose Azure Container Apps as the target.</p>\n<p>Configure the applicable assessment settings, including target region and sizing preferences, then run the assessment to generate readiness findings, resource recommendations, and estimated costs.</p>\n<img />\n<p class=\"lia-clear-both\">&nbsp;</p>\n<p><em>Create an assessment for the discovered web app workloads.</em></p>\n<h3>3. Review results and decide</h3>\n<p>Review the assessment findings to understand which applications are ready for migration and which require changes.</p>\n<p>Evaluate migration issues alongside business criticality, application dependencies, and operational requirements. Use these insights to select applications for migration and prioritize modernization work.</p>\n<img />\n<p>&nbsp;</p>\n<p>Navigate to the <em>Azure Container Apps</em> tab for more details on the readiness</p>\n<img />\n<p><em>Review readiness and estimated monthly costs for Azure Container Apps. This example shows three web apps ready for migration and one not ready, with a cost estimate for the three ready apps. Estimates vary by workload and assessment settings.</em></p>\n<h3>4. Plan migration waves</h3>\n<p>After selecting the migration path, use <strong>Azure Migrate wave planning</strong>, to organize assessed applications and workloads into migration batches.</p>\n<p>Review the proposed waves, sequencing, dependencies, and risks. Refine assignments with application owners and stakeholders, then commit approved waves.</p>\n<p>Committing a wave accepts the migration plan; it does not start migration. The approved scope and assessment findings provide the foundation for application preparation and deployment.</p>\n<h3>5. Migrate to Azure Container Apps</h3>\n<p>Continue the approved migration plan in <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/developer/github-copilot-app-modernization/overview\" rel=\"noopener\" target=\"_blank\">GitHub Copilot app modernization</a>, using the Azure Migrate assessment findings, application scope, and dependency information as context. The tooling handles application code changes, validation, containerization, and deployment to Azure Container Apps.</p>\n<p>Follow the workflow for the application's language:</p>\n<ul>\n<li><strong>Java:</strong> <a href=\"https://learn.microsoft.com/en-us/azure/container-apps/migrate-java-github-copilot-app-modernization\" rel=\"noopener\" target=\"_blank\">Migrate with GitHub Copilot app modernization</a>, including <a href=\"https://learn.microsoft.com/en-us/azure/container-apps/migrate-java-github-copilot-app-modernization#containerize-your-application\" rel=\"noopener\" target=\"_blank\">containerization</a> and <a href=\"https://learn.microsoft.com/en-us/azure/container-apps/migrate-java-github-copilot-app-modernization#deploy-to-azure-container-apps\" rel=\"noopener\" target=\"_blank\">deployment to Azure Container Apps</a>.</li>\n<li><strong>.NET:</strong> <a href=\"https://learn.microsoft.com/en-us/dotnet/azure/migration/appmod/overview\" rel=\"noopener\" target=\"_blank\">GitHub Copilot modernization overview</a> and <a href=\"https://learn.microsoft.com/en-us/dotnet/azure/migration/appmod/deploy\" rel=\"noopener\" target=\"_blank\">deployment workflow</a>.</li>\n</ul>\n<h2>Get started</h2>\n<p>Assess existing web applications for Azure Container Apps and move forward with a migration grounded in application readiness, resource requirements, and cost insights.</p>\n<p>Explore the resources:</p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/azure/migrate/migrate-services-overview\" rel=\"noopener\" target=\"_blank\">Azure Migrate overview</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/container-apps/overview\" rel=\"noopener\" target=\"_blank\">Azure Container Apps overview</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/container-apps/migrate-azure-migrate\" rel=\"noopener\" target=\"_blank\">Migrate to Azure Container Apps with Azure Migrate</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/migrate/tutorial-app-containerization-java-container-apps?view=migrate\" rel=\"noopener\" target=\"_blank\">Containerize Java Web Apps and Migrate to Azure Container Apps - Azure Migrate</a></li>\n</ul>"
