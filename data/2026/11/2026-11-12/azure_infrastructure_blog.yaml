    "title": "Deploying an AI Application on Azure Container Apps"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/deploying-an-ai-application-on-azure-container-apps/ba-p/4572612"
    "published": "2026-11-12 04:12:23"
    "fetched": "2026-11-12 22:22:30"
    "summary": "<p>AI applications often start as prototypes running locally on a developer’s machine. A Streamlit application may work perfectly in a development environment, but making it accessible to users introduces a different set of infrastructure and operational considerations.</p>\n<p>From an infrastructure engineer’s perspective, the key questions are:</p>\n<ul>\n<li>How do we package the application?</li>\n<li>Where do we store and manage container images?</li>\n<li>How do we securely manage API keys and secrets?</li>\n<li>How do we expose the application to users?</li>\n<li>How do we scale it as usage increases?</li>\n<li>How do we automate deployments and future releases?</li>\n<li>How do we monitor and troubleshoot the application after deployment?</li>\n</ul>\n<p>This article walks through the end-to-end deployment lifecycle of an AI application using <strong>Azure Container Apps (ACA)</strong>, focusing on infrastructure, security, deployment and operational responsibilities rather than application development.</p>\n<h2>1. Understanding the Architecture</h2>\n<p>Before starting the deployment, it is important to understand how the different components fit together.</p>\n<p>At a high level, the deployment follows this flow:</p>\n<p><strong>Application Source Code → Container Image → Azure Container Registry → Azure Container Apps → Azure OpenAI</strong></p>\n<p>Additional Azure services provide identity, security, networking and operational capabilities around the application.</p>\n<h3>High-level architecture</h3>\n<img />\n<p>The responsibilities of the major components are:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Azure component</th><th>Purpose</th></tr><tr><td>Azure Container Registry (ACR)</td><td>Stores and manages container images</td></tr><tr><td>Azure Container Apps Environment</td><td>Provides the managed environment for container applications</td></tr><tr><td>Azure Container Apps</td><td>Hosts and runs the application containers</td></tr><tr><td>Microsoft Entra ID</td><td>Provides identity and authentication</td></tr><tr><td>Managed Identity</td><td>Enables passwordless access to supported Azure services</td></tr><tr><td>Azure Key Vault</td><td>Securely stores application secrets</td></tr><tr><td>Azure Monitor</td><td>Provides monitoring and metrics</td></tr><tr><td>Log Analytics</td><td>Stores and supports analysis of application and platform logs</td></tr><tr><td>Azure OpenAI</td><td>Provides AI model inference capabilities</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>The overall infrastructure lifecycle can be summarized as:</p>\n<p><strong>Package → Build → Registry → Deploy → Secure → Scale → Automate → Monitor</strong></p>\n<h2>2. Start with a Clear Application Handoff</h2>\n<p>As an infrastructure engineer, I should not need to redesign the application before deploying it.</p>\n<p>The application team should provide a deployment-ready application package with the following information:</p>\n<ul>\n<li>Application source code</li>\n<li>Dockerfile</li>\n<li>Dependency file, such as requirements.txt</li>\n<li>Application listening port</li>\n<li>Required environment variables</li>\n<li>External service endpoints</li>\n<li>Health-check requirements</li>\n<li>Expected CPU and memory requirements</li>\n<li>Authentication and integration requirements</li>\n</ul>\n<p>For example, a Streamlit application commonly uses port 8501.</p>\n<p>It is important to establish clear ownership between the teams.</p>\n<p><strong>Application team responsibilities:</strong></p>\n<ul>\n<li>Application functionality and business logic</li>\n<li>Application dependencies</li>\n<li>Application-level configuration</li>\n<li>Application testing</li>\n<li>Application-level troubleshooting</li>\n</ul>\n<p><strong>Infrastructure team responsibilities:</strong></p>\n<ul>\n<li>Container build infrastructure</li>\n<li>Container registry</li>\n<li>Azure resource provisioning</li>\n<li>Identity and access management</li>\n<li>Secrets management</li>\n<li>Networking and ingress</li>\n<li>Application deployment</li>\n<li>Scaling and monitoring</li>\n<li>CI/CD infrastructure</li>\n</ul>\n<p>This separation prevents an infrastructure deployment activity from unintentionally becoming an application development task.</p>\n<h2>3. Containerize the Application</h2>\n<p>Before deploying an application to Azure Container Apps, we need to package it as a container image.</p>\n<p>The Dockerfile defines how the application is packaged, including its base image, dependencies, working directory and startup command.</p>\n<p>From an infrastructure perspective, the following items should be validated:</p>\n<ol>\n<li>Is the expected base image being used?</li>\n<li>Are application dependencies installed successfully?</li>\n<li>Is the correct application port configured?</li>\n<li>Does the application listen on 0.0.0.0 rather than only localhost?</li>\n<li>Is the container configured to run as a non-root user wherever possible?</li>\n<li>Are sensitive files and credentials excluded from the image?</li>\n</ol>\n<p>For example, build and test the container locally:</p>\n<p><strong>Build the image:</strong></p>\n<p>docker build -t ai-app:v1 .</p>\n<p><strong>Run the container:</strong></p>\n<p>docker run -p 8501:8501 ai-app:v1</p>\n<p>Podman can also be used in environments where Docker is unavailable or not permitted.</p>\n<p>For a Streamlit application, ensure that the application startup configuration listens on all interfaces:</p>\n<p>streamlit run app.py --server.address=0.0.0.0 --server.port=8501</p>\n<p>Before introducing Azure into the troubleshooting process, validate that the container starts and the application is accessible locally.</p>\n<p>The objective at this stage is simple:</p>\n<p><strong>Can the application run successfully as a container?</strong></p>\n<p>If not, resolve the container or application startup issue first. Introducing Azure Container Apps at this point adds another troubleshooting layer.</p>\n<h2>4. Store the Container Image in Azure Container Registry</h2>\n<p>Once the container image has been validated, it needs to be stored in a registry that Azure Container Apps can access.</p>\n<p>For an Azure-native deployment, <strong>Azure Container Registry (ACR)</strong> is a suitable option.</p>\n<p>The deployment flow now becomes:</p>\n<p><strong>Application Code → Build Container → Test Container → Push Image to ACR → Deploy to Azure Container Apps</strong></p>\n<p>One convenient option is to build the image directly using ACR.</p>\n<p>az acr build \\ --registry &lt;ACR_NAME&gt; \\ --image ai-app:v1 \\ .</p>\n<p>This command builds the image from the current directory and pushes it to the specified Azure Container Registry.</p>\n<p>For production deployments, avoid relying exclusively on a mutable tag such as latest.</p>\n<p>Prefer traceable image versions:</p>\n<p>ai-app:v1 ai-app:v2 ai-app:v3</p>\n<p>For automated deployments, the image can also be tagged using a source commit ID or build number.</p>\n<p>For example:</p>\n<p>ai-app:build-1025</p>\n<p>The complete image reference will look like:</p>\n<p>&lt;ACR_NAME&gt;.azurecr.io/ai-app:v1</p>\n<p>This makes it easier to identify which application version is deployed and simplifies rollback and troubleshooting.</p>\n<p><strong>Infrastructure consideration:</strong> Ensure that Azure Container Apps has the appropriate permissions to pull images from the private registry. Managed identity with the required ACR permissions can be used instead of maintaining registry credentials.</p>\n<h2>5. Deploy the Application to Azure Container Apps</h2>\n<p>Once the container image is available in ACR, the next step is deploying it to Azure Container Apps.</p>\n<p>Two important concepts need to be understood.</p>\n<h3>Azure Container Apps Environment</h3>\n<p>The Container Apps Environment provides the managed hosting boundary for container applications.</p>\n<p>It provides shared capabilities such as networking, logging and integration with the underlying managed platform.</p>\n<p>Multiple container apps can run within the same environment.</p>\n<h3>Azure Container App</h3>\n<p>The Container App represents the actual application deployment.</p>\n<p>It contains the configuration required to run the workload, including:</p>\n<ul>\n<li>Container image and version</li>\n<li>CPU and memory allocation</li>\n<li>Environment variables</li>\n<li>Ingress configuration</li>\n<li>Target application port</li>\n<li>Secrets</li>\n<li>Scaling configuration</li>\n<li>Health probes</li>\n</ul>\n<p>The deployment structure can be visualized as:</p>\n<img />\n<p>For a Streamlit application, the Container Apps target port should match the port on which the application listens inside the container.</p>\n<p>At this stage, the infrastructure team owns the hosting configuration while the application code remains within the application team's ownership.</p>\n<h2>6. Secure Application Secrets</h2>\n<p>This is one of the most important considerations when deploying AI applications.</p>\n<p>AI applications frequently require credentials to access Azure OpenAI, external APIs or other services.</p>\n<p>A simple rule should always be followed:</p>\n<p><strong>Never store production API keys or credentials inside application source code or container images.</strong></p>\n<p>Avoid hardcoded credentials:</p>\n<p>API_KEY = \"xxxxxxxx\"</p>\n<p>Production credentials should also not be committed to source repositories through .env files.</p>\n<p>There are three important approaches to consider.</p>\n<h3>Option 1: Managed Identity</h3>\n<p>Where the target Azure service supports Microsoft Entra authentication, use Managed Identity instead of storing application credentials.</p>\n<p>For example, an application can authenticate to supported Azure services using its assigned identity.</p>\n<h3>Option 2: Azure Key Vault</h3>\n<p>When an application requires a secret, such as an API key or connection string, store it centrally in Azure Key Vault.</p>\n<p>Access should be controlled through Managed Identity and appropriate RBAC permissions.</p>\n<h3>Option 3: Azure Container Apps Secrets</h3>\n<p>Azure Container Apps supports application-level secrets that can be referenced by container environment variables or mounted as files.</p>\n<p>It can also reference secrets stored in Azure Key Vault using Managed Identity.</p>\n<p>A recommended secret-management flow is:</p>\n<img />\n<p>The objective is to minimize the number of long-lived credentials that application and infrastructure teams need to manage.</p>\n<h2>7. Configure Managed Identity</h2>\n<p>Managed Identity helps reduce credential-management overhead and eliminates the need to maintain application credentials for supported Azure integrations.</p>\n<p>For example, the access pattern can look like this:</p>\n<img />\n<p>Instead of storing a service principal password or application credential, the application uses its assigned identity to authenticate.</p>\n<p>For Azure OpenAI, assign the appropriate role, such as <strong>Cognitive Services OpenAI User</strong>, when using Microsoft Entra authentication.</p>\n<p>For Key Vault, assign <strong>Key Vault Secrets User</strong> when the application identity needs to retrieve secrets.</p>\n<p>The exact role depends on the target service and the operations the application needs to perform.</p>\n<p>From an infrastructure perspective, the principle is straightforward:</p>\n<p><strong>Grant only the permissions required by the application.</strong></p>\n<p>This follows the principle of least privilege and reduces unnecessary access across the Azure environment.</p>\n<h2>8. Configure Ingress and Application Connectivity</h2>\n<p>Once the application is deployed, users need a way to access it.</p>\n<p>Azure Container Apps provides managed ingress capabilities, allowing applications to be exposed through HTTPS without manually managing an application gateway for every basic deployment scenario.</p>\n<p>The infrastructure team needs to decide whether the application should be accessible through:</p>\n<ul>\n<li>External ingress – Accessible through a public application endpoint, subject to configured access controls.</li>\n<li>Internal ingress – Accessible within the Container Apps Environment and its supported internal networking configuration.</li>\n</ul>\n<p>Before enabling ingress, validate the following:</p>\n<ul>\n<li>Is ingress enabled?</li>\n<li>Should the application be internal or external?</li>\n<li>Does the target port match the application listening port?</li>\n<li>Is HTTPS configured correctly?</li>\n<li>Does the application require additional authentication?</li>\n<li>Are network restrictions required?</li>\n<li>Are outbound connections to dependent services permitted?</li>\n</ul>\n<p>A common deployment issue is a healthy container that is not reachable because the application listening port and the Container Apps target port do not match.</p>\n<p>For connectivity troubleshooting, validate the path in order:</p>\n<img />\n<p>This helps determine whether the issue is related to ingress, networking, container configuration or the application itself.</p>\n<h2>9. Plan Scaling Before Production</h2>\n<p>Getting one container running is only the first step.</p>\n<p>The next question is:</p>\n<p><strong>What happens when multiple users start accessing the application?</strong></p>\n<p>Azure Container Apps supports replica-based scaling using configurable scaling rules, including HTTP traffic and other supported KEDA-based triggers.</p>\n<p>Infrastructure teams should consider:</p>\n<ul>\n<li>Minimum replicas</li>\n<li>Maximum replicas</li>\n<li>CPU allocation</li>\n<li>Memory allocation</li>\n<li>Scaling triggers</li>\n<li>Concurrent requests</li>\n<li>Expected user traffic</li>\n<li>Application startup time</li>\n</ul>\n<p>For an interactive application, maintaining a minimum replica count may be appropriate when avoiding cold-start latency is important.</p>\n<p>However, AI applications introduce another important consideration.</p>\n<p>The container application is not necessarily the bottleneck.</p>\n<p>Azure OpenAI has its own model deployment capacity, quota and throttling considerations.</p>\n<p>Therefore:</p>\n<p><strong>Increasing Container Apps replicas does not automatically increase Azure OpenAI model capacity.</strong></p>\n<p>Scaling decisions should consider two separate layers.</p>\n<p><strong>Application capacity:</strong></p>\n<ul>\n<li>Container Apps replicas</li>\n<li>CPU and memory</li>\n<li>Request concurrency</li>\n<li>Application-level performance</li>\n</ul>\n<p><strong>AI model capacity:</strong></p>\n<ul>\n<li>Azure OpenAI deployment capacity</li>\n<li>Model quota</li>\n<li>Token throughput</li>\n<li>Request throttling</li>\n<li>Retry and backoff behavior</li>\n</ul>\n<p>Load testing should be performed to establish appropriate limits rather than simply configuring a high maximum replica count.</p>\n<h2>10. Consider Stateful Application Behaviour</h2>\n<p>Interactive applications may maintain user or session state during execution.</p>\n<p>This becomes particularly important when the application scales horizontally.</p>\n<p>With a single replica, user interactions are handled by one running application instance.</p>\n<p>With multiple replicas, requests may potentially be handled by different instances depending on the ingress and session configuration.</p>\n<p>The infrastructure and application teams should establish one important detail:</p>\n<p><strong>Is application state stored only inside the container, or is it persisted externally?</strong></p>\n<p>If application or session state must survive container restarts, scaling events or deployments, an external persistence mechanism should be evaluated.</p>\n<p>Container memory and local container storage should not be treated as durable application storage.</p>\n<p>For Streamlit and similar interactive applications, the application team should also validate session handling and WebSocket connectivity under the expected ingress and scaling configuration.</p>\n<p>This discussion should happen before increasing the application's replica count.</p>\n<h2>11. Validate the Manual Deployment Before Automating It</h2>\n<p>It can be tempting to start immediately with CI/CD pipelines.</p>\n<p>However, from an infrastructure perspective, I prefer validating the complete deployment lifecycle manually before introducing automation.</p>\n<p>The initial deployment should establish that the following process works:</p>\n<img />\n<p>Once this process is successful, the same steps can be automated through Azure DevOps or GitHub Actions.</p>\n<p>The automated deployment lifecycle then becomes:</p>\n<p>&nbsp;</p>\n<img />\n<p>This approach makes troubleshooting easier because each deployment stage has already been validated independently.</p>\n<p>The CI/CD pipeline simply automates a process that is known to work.</p>\n<h2>12. Authenticate the CI/CD Pipeline Securely</h2>\n<p>The deployment pipeline also needs access to Azure resources.</p>\n<p>Pipeline authentication should receive the same security attention as application authentication.</p>\n<p>Where supported, use <strong>Workload Identity Federation (OIDC)</strong> rather than maintaining long-lived client secrets in pipeline variables.</p>\n<p>The authentication flow looks like this:</p>\n<img />\n<p>This avoids creating another permanent credential simply to automate deployment.</p>\n<p>Pipeline permissions should also follow least privilege.</p>\n<p>The deployment identity should have sufficient permissions to perform the required deployment operations without receiving unnecessary access to unrelated subscriptions or resources.</p>\n<h2>13. Manage Application Releases Using Revisions</h2>\n<p>Application deployment does not end with the first successful release.</p>\n<p>There will be a version 2, version 3 and eventually another release that may need to be rolled back.</p>\n<p>Azure Container Apps provides a revision-based deployment model.</p>\n<p>A revision represents a version of the application configuration and container template.</p>\n<p>For example:</p>\n<img />\n<p>Depending on the configured revision mode, the application can use single-revision or multiple-revision deployment.</p>\n<p>Multiple-revision mode is particularly useful when implementing controlled traffic splitting, blue-green deployments or canary releases.</p>\n<p>This allows infrastructure teams to validate a new application version before directing all production traffic to it.</p>\n<p>Combined with traceable container image tags, revisions make it easier to answer a common operational question:</p>\n<p><strong>Which application version is actually running?</strong></p>\n<p>A rollback strategy should also be defined before production deployment.</p>\n<h2>14. Monitoring and Operational Visibility</h2>\n<p>A successful infrastructure deployment should not end with:</p>\n<p>\"The container is running.\"</p>\n<p>Once users start accessing the application, the infrastructure team needs operational visibility.</p>\n<p>At a minimum, consider monitoring the following:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Monitoring area</th><th>What to validate</th></tr><tr><td>Container health</td><td>Replica readiness and container restarts</td></tr><tr><td>Application logs</td><td>Startup failures and application exceptions</td></tr><tr><td>HTTP metrics</td><td>Request volume, status codes and response latency</td></tr><tr><td>Resource utilization</td><td>CPU and memory consumption</td></tr><tr><td>Scaling</td><td>Replica count and scaling activity</td></tr><tr><td>Connectivity</td><td>Access to dependent Azure services</td></tr><tr><td>Azure OpenAI</td><td>Authentication errors, throttling and request failures</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>Azure Monitor and Log Analytics can provide the operational visibility needed around the deployed workload.</p>\n<p>A practical troubleshooting sequence is:</p>\n<img />\n<p>Following this sequence prevents infrastructure, application and downstream-service issues from being mixed together.</p>\n<p>For production environments, configure diagnostic settings and appropriate alerts rather than relying only on manual log inspection.</p>\n<h2>15. Common Deployment Issues and Troubleshooting</h2>\n<p>Here are some common issues that infrastructure engineers may encounter during an Azure Container Apps deployment.</p>\n<h3>Issue 1: Container Image Cannot Be Pulled</h3>\n<p><strong>Possible causes:</strong></p>\n<ul>\n<li>Incorrect registry configuration</li>\n<li>Incorrect image name or tag</li>\n<li>Missing registry permissions</li>\n<li>Managed Identity misconfiguration</li>\n<li>Private registry connectivity issues</li>\n</ul>\n<p><strong>What to check:</strong></p>\n<ul>\n<li>Validate the complete image reference.</li>\n<li>Confirm the image exists in ACR.</li>\n<li>Check the Container App registry configuration.</li>\n<li>Verify the required registry pull permissions.</li>\n</ul>\n<h3>Issue 2: Application Starts and Immediately Restarts</h3>\n<p><strong>Possible causes:</strong></p>\n<ul>\n<li>Missing environment variables</li>\n<li>Incorrect startup command</li>\n<li>Missing application dependencies</li>\n<li>Missing secrets</li>\n<li>Insufficient CPU or memory</li>\n</ul>\n<p><strong>What to check:</strong></p>\n<ul>\n<li>Container console logs</li>\n<li>Container Apps system logs</li>\n<li>Application startup configuration</li>\n<li>Environment variable references</li>\n<li>Resource allocation</li>\n</ul>\n<h3>Issue 3: Application Is Deployed but Not Reachable</h3>\n<p><strong>Possible causes:</strong></p>\n<ul>\n<li>Incorrect target port</li>\n<li>Application listening only on localhost</li>\n<li>Ingress disabled</li>\n<li>Incorrect internal or external ingress configuration</li>\n<li>Network restrictions</li>\n</ul>\n<p><strong>What to check:</strong></p>\n<ul>\n<li>Container Apps ingress configuration</li>\n<li>Application listening port</li>\n<li>Application binding address</li>\n<li>Network connectivity</li>\n<li>HTTPS endpoint</li>\n</ul>\n<h3>Issue 4: Azure OpenAI Returns Authentication Errors</h3>\n<p><strong>Possible causes:</strong></p>\n<ul>\n<li>Managed Identity not enabled</li>\n<li>Incorrect role assignment</li>\n<li>Incorrect endpoint configuration</li>\n<li>Unsupported authentication method</li>\n<li>Missing application configuration</li>\n</ul>\n<p><strong>What to check:</strong></p>\n<ul>\n<li>Managed Identity assignment</li>\n<li>Azure RBAC permissions</li>\n<li>Azure OpenAI endpoint</li>\n<li>Application authentication configuration</li>\n</ul>\n<h3>Issue 5: Azure OpenAI Returns HTTP 429 Responses</h3>\n<p>Do not immediately assume that the Container App needs more replicas.</p>\n<p>Investigate:</p>\n<ul>\n<li>Azure OpenAI deployment capacity</li>\n<li>Model quota and throughput</li>\n<li>Request frequency</li>\n<li>Token consumption</li>\n<li>Retry and exponential backoff configuration</li>\n</ul>\n<p>The important distinction is:</p>\n<p><strong>Container scaling and AI model capacity are two different things.</strong></p>\n<h2>Final Thoughts</h2>\n<p>Deploying an AI application is about much more than getting a container to start.</p>\n<p>From an infrastructure perspective, the complete lifecycle involves packaging, registry management, identity, deployment, security, scaling, automation and monitoring.</p>\n<p>Azure Container Apps provides a managed container platform that allows infrastructure teams to focus on these operational responsibilities without having to manage the underlying Kubernetes infrastructure.</p>\n<p>For a Streamlit-based AI application, a practical implementation approach is to start small:</p>\n<p><strong>Get one container running securely → Configure Managed Identity → Validate secrets and connectivity → Configure ingress → Test scaling → Automate deployment → Implement production monitoring.</strong></p>\n<p>This incremental approach keeps application and infrastructure responsibilities clear and makes troubleshooting considerably easier.</p>\n<p>The goal is not simply to get an AI application running.</p>\n<p>The goal is to make the deployment:</p>\n<p><strong>Secure. Repeatable. Observable. Scalable. Production-ready.</strong></p>"
