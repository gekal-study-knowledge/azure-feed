    "title": "Redefining Application Load Balancing in Azure Application Gateway"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/redefining-application-load-balancing-in-azure-application/ba-p/4572687"
    "published": "2026-11-12 16:29:59"
    "fetched": "2026-11-12 22:22:31"
    "summary": "<p><em>By Jay Soni (Senior Product Manager) and Jordi Rey (Product Manager), Azure Application Gateway</em></p>\n<p style=\"text-align: center;\"><img alt=\"Advanced routing rules and advanced load balancing in Azure Application Gateway\" src=\"data:image/svg+xml;base64,\" width=\"800\" /></p>\n<p>Modern applications change quickly. Teams run A/B experiments, version their APIs, tailor experiences by client and tenant, and serve AI models across reserved and pay-as-you-go capacity. Azure Application Gateway now gives you more precise control over where each request goes and how traffic is distributed once it gets there.</p>\n<p>Two new capabilities are now in public preview. Use them on their own or together:</p>\n<ul>\n<li><strong>Advanced routing rules:</strong> Match requests on path, header, query string, HTTP method and client IP, with regular expression support. A single rule can now cover request patterns that previously needed several.</li>\n<li><strong>Advanced load balancing:</strong> Choose backend pools by weight or priority, then choose servers within each pool using round robin, weighted round robin or least connections.</li>\n</ul>\n<p>The rest of this post explains how these capabilities work and the scenarios they enable, from blue-green deployments and client-aware experiences to multi-tenant SaaS and a single entry point for your AI endpoints.</p>\n<h2>What's new</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th>Capability</th><th>Details</th></tr></thead><tbody><tr><td>What a rule can match</td><td>Path, HTTP header, query string, HTTP method and client IP</td></tr><tr><td>How values are matched</td><td>Exact values, or RE2 regular expressions for path, header and query string</td></tr><tr><td>How conditions combine</td><td>Up to five conditions per rule, joined with AND and evaluated in priority order</td></tr><tr><td>Load balancing across pools</td><td>Multiple pools per rule, selected by weight or by priority</td></tr><tr><td>Load balancing within a pool</td><td>Round robin, weighted round robin or least connections, set per pool</td></tr><tr><td>Failover between pools</td><td>Priority-based failover driven by a configurable Minimum Healthy Percent</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2>Advanced routing rules: more control over request routing</h2>\n<p>Define conditions on URL paths, HTTP headers, query strings, HTTP methods and client IP addresses to send each request to the right backend pool. Combine conditions in one rule to support scenarios such as API versioning, tenant-specific routing and feature-based deployments. Rules are evaluated in priority order, and the first matching rule determines the destination. Requests that don't match any rule go to the configured default backend pool.</p>\n<p>Path, header and query-string conditions support RE2 regular expressions, so a single pattern can match many request variations. For example, <code>^/api/orders(/.*)?$</code> matches <code>/api/orders</code> and all of its subpaths. Each rule can also apply a rewrite rule set as part of routing.</p>\n<h2>Advanced load balancing: traffic distribution that fits your workload</h2>\n<p>Advanced load balancing gives you control at two levels:</p>\n<ul>\n<li><strong>Across pools:</strong> Use weighted distribution to split traffic by relative weight, such as 80/20 for a gradual rollout. Or use priority to keep traffic on a primary pool and fail over to the next pool when the primary pool's healthy servers drop below your Minimum Healthy Percent.</li>\n<li><strong>Within a pool:</strong> Each pool uses its own algorithm. Round robin spreads requests evenly. Weighted round robin sends more requests to larger servers. Least connections sends each request to the healthy server with the fewest active connections, so a server still working through long-running requests receives less new traffic.</li>\n</ul>\n<p style=\"text-align: center;\"><img alt=\"Figure 1: Advanced routing rules match the request; advanced load balancing selects a pool by weight or priority, then a server within the pool\" src=\"data:image/svg+xml;base64,\" width=\"800\" /></p>\n<p><em>Figure 1. Advanced routing rules match the request. Advanced load balancing then selects a pool by weight or priority, and a server within that pool.</em></p>\n<h2>Scenarios you can build</h2>\n<h3>Canary and blue-green releases</h3>\n<p>Route requests that carry an <code>x-release: canary</code> header to a new version, or send 10% of all traffic to the green pool and raise its weight as confidence grows. Taking a pool out of rotation is a weight change, not a redeployment, and your customer-facing endpoint never changes.</p>\n<h3>Read/write split</h3>\n<p>Send GET requests to a pool of read replicas or cache-heavy nodes, and send POST, PUT and DELETE requests to the primary write tier.</p>\n<h3>Client-aware experiences</h3>\n<p>Route mobile clients to an optimized backend based on a client header such as <code>x-client-type: mobile</code> or a User-Agent pattern, while web traffic continues to the standard pool.</p>\n<h3>Internal and partner traffic</h3>\n<p>Route requests from corporate or partner IP ranges to dedicated backend pools, such as staging or administrative environments. Combine client IP-based routing with Web Application Firewall (WAF) protection and appropriate authentication and authorization controls to help secure access to these applications.</p>\n<h3>Multi-tenant SaaS</h3>\n<p>Route by tenant hostname to dedicated pools for premium tenants and shared pools for everyone else. Tenant tiers become a routing decision, not an infrastructure redesign.</p>\n<h3>API versioning without URL changes</h3>\n<p>Route <code>?api-version=2026-01</code> or an <code>api-version</code> header to the right backend. Clients keep a stable URL while you run several versions side by side, and one regular expression condition can cover a whole family of versioned paths.</p>\n<h2>One entry point for your AI endpoints</h2>\n<p>AI applications often span several endpoints, mixing reserved Provisioned Throughput Unit (PTU) capacity and pay-as-you-go capacity across regions. Rather than having every application track which endpoint to call and what to do when reserved capacity runs out, Application Gateway can serve as the central entry point for all of them: one address, with TLS, WAF and private connectivity managed in one place.</p>\n<p><strong>Route by deployment, spill over automatically.</strong> Route AI requests to the appropriate backend pools based on deployment paths, team identifiers or application-specific headers. Put PTU endpoints in a priority 1 pool and pay-as-you-go endpoints in a priority 2 pool. Traffic moves to pay-as-you-go only when the share of healthy reserved endpoints drops below your Minimum Healthy Percent, with no change for the client.</p>\n<p style=\"text-align: center;\"><img alt=\"Figure 2: Application Gateway as one entry point for AI endpoints with priority failover from PTU to pay-as-you-go\" src=\"data:image/svg+xml;base64,\" width=\"800\" /></p>\n<p><em>Figure 2. One entry point for your AI endpoints: route by deployment path or header, and fail over by priority.</em></p>\n<h2>Get started</h2>\n<p>Advanced routing rules and advanced load balancing are available for both new and existing Application Gateway deployments. To get started, see the <a href=\"https://aka.ms/appgw/advancedloadbalancing\" rel=\"noopener\" target=\"_blank\">Application Gateway documentation for advanced routing rules and advanced load balancing</a>.</p>\n<p><strong>Note:</strong> Requires API version 2026-03-01 or later. During preview, weighted distribution doesn't check pool health, so set a pool's weight to 0 to take it out of rotation.</p>\n<p><em>This feature is in public preview. Previews are provided without a service-level agreement and aren't recommended for production workloads. For more information, see the <a href=\"https://azure.microsoft.com/support/legal/preview-supplemental-terms/\" rel=\"noopener\" target=\"_blank\">Supplemental Terms of Use for Microsoft Azure Previews</a>.</em></p>"
