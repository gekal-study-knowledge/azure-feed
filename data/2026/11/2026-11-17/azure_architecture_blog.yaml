    "id": "779ed16e9d6a7aafe4176f8f743b1e85"
    "title": "Using AI to help forestry planners prioritise fuel-reduction work"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/using-ai-to-help-forestry-planners-prioritise-fuel-reduction/ba-p/4573152"
    "published": "2026-11-17 05:54:26"
    "fetched": "2026-11-17 18:49:37"
    "summary": "<nav class=\"print-controls\"><button type=\"button\">Print / save as PDF</button></nav>\n<h1>Using AI to help forestry planners prioritise fuel-reduction work</h1>\n<p><em>By Eneko Vallecillo, Principal Solution Engineer, Microsoft UK</em></p>\n<img />\n<p><em>Forestry companies, including pulp and paper producers, can manage thousands of plantation parcels. EU wildfire-prevention policy promotes reducing vegetation that can fuel fires [1], but legal duties vary. Portugal's Decree-Law 82/2021 requires fuel management around homes and other buildings used for economic activities on rural land, with a standard 50-metre strip where it covers forest land [2]. Spain's Forest Law 43/2003 makes owners responsible for managing private forests; regional governments set detailed fire-prevention rules [3].</em></p>\n<p><em>I evaluated whether an AI agent built with Microsoft Foundry could help a forestry planner choose where to send limited crews for fuel-reduction work, and explain those choices to the board or, where required, an auditor or regulator.</em></p>\n<blockquote>\n<p>The <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator\" rel=\"noopener\" target=\"_blank\">WFI Scoring Accelerator repository</a> [4] includes deployable code, setup instructions and a <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/tree/main/docs/reports\" rel=\"noopener\" target=\"_blank\">three-part test exercise</a>, with full evidence and analysis. You can reproduce the tests or adapt the solution to another dataset or industry using an appropriate scoring policy and data model.</p>\n</blockquote>\n<h2>The planner's challenge</h2>\n<p>Picture a forestry planner with 100 parcels in her queue, each with a proposed fuel-reduction job. She has fewer crews than jobs and a window that closes on Friday. Which parcels get a crew first, and can those crews actually do the work?</p>\n<p>The planner asks an AI agent for the risk scores of all parcels needing fuel-reduction work. For parcel PAX-0017, it reports 'high risk, score 72.4, fully assessed from measured inputs'. That answer could hide several problems:</p>\n<ul>\n<li>The AI agent calculates the risk score from raw data instead of retrieving one calculated by code using the organisation’s agreed rules. Ask the same question again and the AI agent may give a different number. AI agents are not guaranteed to produce the same answer each time.</li>\n<li>A missing wind reading was estimated, yet the agent called it \"observed\", as though a sensor had measured it.</li>\n<li>A weather update changed the parcel's risk after a crew was booked. Nothing flagged the booking as out of date, so the crew could have been sent out in weather that was no longer safe.</li>\n</ul>\n<p>The AI agent was asked to calculate from unlabelled data, with no check on its answer. Even a correct ranking would leave the planner with questions: can a crew reach parcel PAX-0017, who lives downwind and where is the nearest water? The weather problem also needs a way to reassess an earlier decision.</p>\n<h2>The approach</h2>\n<p>The WFI Scoring Accelerator calculates risk scores in Python and stores the data and its relationships in Microsoft Fabric. AI agents running in Microsoft Foundry explain the results, helping the planner decide what to do.</p>\n<h3>Keeping data, advice and approval separate</h3>\n<p>The design separates data, advice and approval into three areas, called \"planes\" in the diagrams. It draws on the NIST AI Risk Management Framework [5] and the intent of the EU AI Act's record-keeping and human-oversight requirements, Articles 12 and 14 [6], for high-risk systems.</p>\n<img />\n<p><em>Figure 1. Three planes. Only a designated owner in the authority plane advances a decision. Coloured parts are built; grey parts are design only.</em></p>\n<ul>\n<li>The <strong>evidence plane</strong> holds timestamped data in Fabric OneLake. Bronze, Silver and Gold are the stages of Fabric's medallion structure [7], which organises data as it is prepared for use. The agent reads only the Gold tables. Missing, stale or conflicting evidence blocks progression.</li>\n<li>The <strong>recommendation plane</strong> runs on Azure and Foundry. Agents use controlled, labelled data to rank parcels, explain results and propose next steps. A verifier, the code that checks an answer against its scoring record, checks their advisory output.</li>\n<li>The <strong>authority plane</strong> records authorised people's reviews and approvals in Fabric. An agent's answer cannot advance a decision on its own.</li>\n</ul>\n<h3>From parcel data to a planning decision</h3>\n<p>The intended workflow runs from parcel assessment to a crew list. Crew allocation components are not included in the accelerator.</p>\n<img />\n<p><em>Figure 2. Forestry crew allocation, end to end. The agent stage represents two independent query paths. Numbers come only from the scorer; the agents advise; a named planner decides.</em></p>\n<p>Each parcel passes through seven steps before it can reach the crew prioritisation list:</p>\n<ol>\n<li><strong>Evidence</strong>: Each scoring input in Fabric is labelled as either measured or estimated, and carries the date it was last assessed.</li>\n<li><strong>Scorer</strong>: each score is calculated and locked by deterministic Python code under a hashed policy. The score is never guessed. Missing, expired or wrongly sourced evidence is marked as “incomplete”.</li>\n<li><strong>Fabric IQ</strong>: adds context: access road, homes and facilities, water and crew access.</li>\n<li><strong>AI agents</strong>: two independent Foundry agents use separate read-only MCP connections. The receipt agent retrieves and compares parcel scores and their supporting evidence; the Fabric IQ agent queries relationships between parcels, roads, homes, water sources and crew access. Their answers support the planner’s priorities and next steps. Neither changes a score.</li>\n<li><strong>Verifier (algorithm)</strong>: checks scoring claims and evidence labels against the receipt and blocks any mismatch.</li>\n<li><strong>Forestry planner</strong>: a named planner approves or rejects. A rejection or a verifier block sends the job back to the planner.</li>\n<li><strong>Crew list</strong>: only approved jobs reach the Friday crew list, and every step is logged.</li>\n</ol>\n<h3>Calculating and recording the score</h3>\n<p>The scoring code is deterministic: the same inputs, policy and assessment time produce the same result. The policy is the set of rules specifying factor weights, input ranges, risk bands and allowed input sources. Missing, expired or wrongly sourced evidence produces an \"incomplete\" assessment instead of a guessed score.</p>\n<p>Each assessment produces a <strong>receipt</strong>, a stored scoring record containing the score, risk band (such as \"high\"), assessment status and each factor's measured or estimated label. SHA-256 hashes act as digital fingerprints, helping to detect changes to the policy and receipt and trace each score back to the policy and evidence used to calculate it.</p>\n<h3>Fabric IQ agent: context for planning</h3>\n<p>Fabric IQ holds an <strong>ontology</strong>, a model of business entities and their relationships [8]. Here, those entities include parcels, roads and water sources. It gives the agent recorded connections to query when the planner asks:</p>\n<ul>\n<li>Which road reaches the parcel?</li>\n<li>Which homes and facilities could be affected?</li>\n<li>Which water sources are linked to the parcel's access roads?</li>\n<li>Which crew types can reach the parcel using the recorded roads?</li>\n</ul>\n<img />\n<p><em>Figure 3. The Fabric IQ ontology behind a crew recommendation, built and queried in Fabric on synthetic data.</em></p>\n<p>These answers help the planner interpret the score, understand incomplete evidence and spot recorded gaps in access or water supply.</p>\n<h2>Solution architecture</h2>\n<img />\n<p><em>Figure 4. The cloud architecture maps the grounding framework to Azure and Fabric services. Connections show service relationships, not deployment-verification status.</em></p>\n<p>Figure 4 shows how the services connect. The solution deploys two independent Foundry agents, each with its own MCP connection [9]. One uses the receipt tools to retrieve scoring records. The other queries the Fabric IQ ontology for relationships between parcels, roads, homes, water sources and crew access. Fabric keeps the evidence and a record of decisions, while Microsoft Entra ID checks user and service identities. Application Insights logs requests and tool calls so each agent’s activity can be traced.</p>\n<p>Giving the AI agent deterministic Python tools makes scores reproducible: the same inputs, policy and assessment time produce the same result. The agent calls predefined functions instead of calculating scores itself. This helps manage token use by reducing repeated lookups and calculations by the model. In a separate <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/blob/main/docs/reports/scenario-3-four-tools.md\" rel=\"noopener\" target=\"_blank\">Foundry Agent Tools study</a>, four newer models averaged about 46 table-lookup calls per question, compared with one call when using predefined calculation tools.</p>\n<h2>Security and governance</h2>\n<p>The accelerator has adopted security and governance controls. The figure below shows which controls have been implemented and which remain planned.</p>\n<img />\n<p><em>Figure 5. Control layers and their deployment status as of 12 November 2026. Completed means deployed or configured; planned means not yet deployed.</em></p>\n<h3>What the agent can access</h3>\n<p>The receipt agent’s tools let it read and compare receipts, but not change them. The agent uses the Foundry project’s managed identity to call tools hosted in an Azure Function. The Azure Function uses its own managed identity [10] with Storage Blob Data Reader access to receipt storage, allowing it to retrieve receipts but not modify or delete them [11].</p>\n<p>For review and approval, the agent uses verified parcel scores to propose priorities, but the forestry planner must decide whether to approve those priorities. The accelerator checks the planner’s Entra sign-in name against its reviewer and approver lists before allowing them to record a review or approve a reviewed proposal.</p>\n<h3>Answer verification controls</h3>\n<p>The accelerator calculates each score using the pinned policy, checks the policy and receipt hashes for mismatches, and compares the agent’s answer with the receipt. These checks tie the answer to its supporting evidence. Application Insights [12] records agent activity to help trace what happened during a run.</p>\n<h3>Cost Guard</h3>\n<p>I also tested an estimated token-cost meter, a budget guard and a kill switch. The guard checks accumulated estimated spending before further model calls.</p>\n<p>You should consider the following improvements to strengthen the accelerator’s security posture:</p>\n<ul>\n<li>Set up private networking, read-only access to the SQL endpoint and Azure budget alerts.</li>\n<li>Choose and test protections against prompt injection and sensitive-data exposure, and controls for managing and monitoring agents. OWASP describes prompt-injection risks and mitigations, including least privilege and human approval [13]. Microsoft options include Foundry guardrails, Entra Agent ID, Defender, Purview and Agent 365. These options have not been configured or tested in the accelerator.</li>\n<li>The accelerator does not provide a complete production security posture or a compliance assessment.</li>\n</ul>\n<h2>Who approves the work?</h2>\n<img />\n<p><em>Figure 6. Where the decision stops. Coloured steps are built and tested in the reference implementation; grey, dashed steps are design only.</em></p>\n<p>The agent can submit a proposal only when the evidence is complete and verified. The planner then reviews it, and Fabric records each accepted step in the decision log. Before the next step can proceed, the application checks the log’s hash chain for signs of tampering. Approved decisions remain in Fabric, where you can use OneLake APIs to connect the records to your own systems and build the remaining stages, such as crew allocation and field-work scheduling.</p>\n<h2>Evaluation and results</h2>\n<p>I tested score consistency, answers from Fabric IQ and calculations through Foundry Agent Tools. The repository reports contain the full methods, question sets, results and supporting evidence.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Scenario</th><th>Test scope</th><th>Models tested</th></tr></thead><tbody><tr><td><a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/blob/main/docs/evidence/scenario-1-locking-the-score/combined-150/combined_150.md\" rel=\"noopener\" target=\"_blank\">Locking the score</a></td><td>150 synthetic parcels, three repeats</td><td>gpt-4.1, gpt-4.1-mini, Phi-4, gpt-5.5, gpt-6.1-sol, gpt-6.1-terra, grok-4.7</td></tr><tr><td><a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/blob/main/docs/reports/scenario-2-ontology.md\" rel=\"noopener\" target=\"_blank\">Fabric IQ</a></td><td>5 connection questions against 150 parcels; separate 20-question usefulness comparison</td><td>Live checks: Foundry agent deployment; usefulness: gpt-4.1, judged by gpt-4.1-mini</td></tr><tr><td><a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/blob/main/docs/reports/scenario-3-four-tools.md\" rel=\"noopener\" target=\"_blank\">Foundry Agent Tools</a></td><td>20 questions per model, covering four scenarios</td><td>gpt-4.1, gpt-5.5, gpt-6.1-sol, gpt-6.1-terra, grok-4.7</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h3>Locking the score</h3>\n<p>The study compared 7 models’ own score calculations from raw data with answers using code-calculated scores and verification across 150 synthetic parcels. Each available test was repeated three times. Four newer models calculated the scores correctly and the other three made errors.</p>\n<p>For the six models tested with verification and receipt fallback, delivered scores had zero error against the code-calculated reference. When a check failed, the system replaced the answer with values from the stored receipt. This is called <strong>receipt fallback</strong>. The <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/blob/main/docs/reports/scenario-1-locking-the-score.md\" rel=\"noopener\" target=\"_blank\">Locking the score evidence</a> contains additional details of the tests and results.</p>\n<img />\n<p><em>Figure 7. Score consistency by model. Verification and receipt fallback enforce zero delivered error.</em></p>\n<h3>Fabric IQ</h3>\n<p>The Fabric IQ experiment tested whether recorded relationships between parcels, roads, homes, water sources and crew access could answer planning questions. The dataset contained 150 parcels and 450 crew-access records. I asked five questions in two ways: directly through Fabric's Graph Query Language (GQL), and through the Fabric IQ agent's MCP connection. Both matched answers calculated independently in code, the test's <strong>ground truth</strong>. As an example, the crew-access question identified all 15 expected parcels with a critical facility but no access for a fire engine, including those with passable but narrow roads.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Latest 150-parcel relationship check</th><th>Correct answers</th></tr></thead><tbody><tr><td>Direct Fabric graph GQL</td><td>5/5</td></tr><tr><td>Foundry agent using <code>ask_ontology</code> MCP</td><td>5/5</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>The <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/blob/main/docs/evidence/cloud-acceptance/2026-11-11/summary.json\" rel=\"noopener\" target=\"_blank\">sanitised live evidence</a> contains additional details of the tests and results.</p>\n<h3>Foundry Agent Tools</h3>\n<p>I asked Foundry agents 20 planning questions about a synthetic electricity network, covering exposure, mitigation, electricity-feeder disconnection and sensitivity to scoring weights. The experiment compared three setups:</p>\n<ul>\n<li><strong>Foundry agent with calculation tools:</strong> custom Python functions calculated the results for the agent to explain.</li>\n<li><strong>Foundry agent with table-lookup tools:</strong> tools retrieved the data, leaving the model to connect the records and calculate the answers.</li>\n<li><strong>Direct model call without tools:</strong> the model received only the question, without access to the dataset.</li>\n</ul>\n<p>With calculation tools, four models answered all 20 questions correctly and one answered 19 correctly. Each averaged one tool call per question. With table-lookup tools, two models also answered every question correctly, while the others were less accurate. The four newer models averaged about 46 table-lookup calls per question. Without tools, correctness was between 0% and 5%.</p>\n<p>The <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator/blob/main/docs/reports/scenario-3-four-tools.md\" rel=\"noopener\" target=\"_blank\">Foundry Agent Tools evidence</a> contains additional details of the tests and results.</p>\n<img />\n<p><em>Figure 8. Foundry Agent Tools compared with raw-table lookup tools and a model given no data. These small, synthetic tests compare approaches, not model rankings.</em></p>\n<h3>Limits of the study</h3>\n<ul>\n<li>The tests used synthetic data, not field observations; crew access was derived from rules.</li>\n<li>An AI model assessed the answers for clarity, relevance and practical value. Further studies should include forestry planners’ feedback to assess their usefulness in practice.</li>\n<li>The decision-tool tests used one repeat per model, with different data sources and tool-call limits.</li>\n<li>Experiment 3 compared answers calculated by Python tools with those calculated by the model itself. The tools ran locally and are not yet part of the provided cloud deployment.</li>\n<li>The study did not demonstrate reductions in fires, improvements in crew safety or operating-cost savings.</li>\n<li>The tests covered answers and calculations, not live crew deployment or field operations.</li>\n</ul>\n<h2>Conclusion and recommendations</h2>\n<p>One observation worth exploring is how the proposed solution scales as more types of information need to be connected. In Fabric IQ, entity types represent categories such as parcels, roads and water sources. Relationships describe how they connect, such as which roads provide access to a parcel. The Fabric ontology contains five entity types and four relationships. In a larger model, perhaps with 100 entity types and many more relationships, maintaining Python logic for the connections could become more demanding. Fabric IQ could make those relationships easier to manage and query, although the study did not test a model of that size.</p>\n<p>The study supports keeping calculation, explanation and approval separate. The agent can help a planner work through the evidence, but its answer should not become the source of a score or permission to start work. Getting the same score each time does not prove that the weights accurately reflect real wildfire risk.</p>\n<p>For teams trying this approach, start with a decision that has stable rules and consequences worth checking. Calculate scores in code, record the inputs and give the agent only the tools and permissions it needs. Keep approval with the planner and make the supporting evidence inspectable.</p>\n<p>The next step is a pilot with forestry planners using real, governed data, comparing the agent with the simpler tools or templates they already use. This pilot would assess whether the accelerator improves planning compared with existing alternatives.</p>\n<p>The <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator\" rel=\"noopener\" target=\"_blank\">WFI Scoring Accelerator repository</a> contains the implementation, deployment instructions and detailed evaluation reports.</p>\n<p>This work is based on a broader wildfire intelligence project that has not yet been published. More details are planned for publication in the coming weeks.</p>\n<h2>When not to use it</h2>\n<ul>\n<li>There are no stable rules to pin: the result is a judgement or forecast.</li>\n<li>Answers contain no numbers or labels the verifier can check.</li>\n<li>A wrong or unrepeatable answer costs nothing.</li>\n<li>The use case requires very high volumes or real-time responses, and extra tool calls and verification would be too slow or costly.</li>\n</ul>\n<h2>References</h2>\n<p>[1] European Commission, <a class=\"lia-external-url\" href=\"https://environment.ec.europa.eu/topics/forests/wildfires_en\" rel=\"noopener\" target=\"_blank\">Wildfires: Policies to protect EU forests against fire</a>, including the 2026 integrated wildfire risk-management strategy and land-based prevention guidance.</p>\n<p>[2] Portugal, <a class=\"lia-external-url\" href=\"https://diariodarepublica.pt/dr/legislacao-consolidada/decreto-lei/2021-172745166-172791110\" rel=\"noopener\" target=\"_blank\">Decreto-Lei n.º 82/2021: Sistema de Gestão Integrada de Fogos Rurais</a>, consolidated text, article 49. See also the <a class=\"lia-external-url\" href=\"https://www.cm-vendasnovas.pt/municipe/areas-de-acao/ambiente/florestas/faixas-de-gestao-de-combustivel/\" rel=\"noopener\" target=\"_blank\">Vendas Novas municipal explanation of fuel-management strips</a>.</p>\n<p>[3] Spain, <a class=\"lia-external-url\" href=\"https://www.boe.es/buscar/act.php?id=BOE-A-2003-21339\" rel=\"noopener\" target=\"_blank\">Ley 43/2003, de Montes</a>, consolidated text, articles 23 (private forest management) and 44 (fire prevention), incorporating the amendments in Ley 21/2015.</p>\n<p>[4] <a class=\"lia-external-url\" href=\"https://github.com/enekazo/WFI-ScoringAccelerator\" rel=\"noopener\" target=\"_blank\">WFI Scoring Accelerator</a>: implementation, deployment instructions, test harnesses and recorded evidence.</p>\n<p>[5] NIST, <a class=\"lia-external-url\" href=\"https://www.nist.gov/itl/ai-risk-management-framework\" rel=\"noopener\" target=\"_blank\">AI Risk Management Framework</a>.</p>\n<p>[6] European Union, <a class=\"lia-external-url\" href=\"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng\" rel=\"noopener\" target=\"_blank\">Regulation (EU) 2024/1689: Artificial Intelligence Act</a>, articles 12 (record-keeping) and 14 (human oversight).</p>\n<p>[7] Microsoft Learn, <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/fabric/onelake/onelake-medallion-lakehouse-architecture\" rel=\"noopener\" target=\"_blank\">Implement medallion lakehouse architecture in Microsoft Fabric</a>.</p>\n<p>[8] Microsoft Learn, <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/fabric/iq/ontology/overview\" rel=\"noopener\" target=\"_blank\">What is ontology (preview)?</a>, including entity types and relationships in Fabric IQ.</p>\n<p>[9] Microsoft Learn, <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol\" rel=\"noopener\" target=\"_blank\">Connect agents to MCP server endpoints</a>.</p>\n<p>[10] Microsoft Learn, <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview\" rel=\"noopener\" target=\"_blank\">Managed identities for Azure resources</a>.</p>\n<p>[11] Microsoft Learn, <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory\" rel=\"noopener\" target=\"_blank\">Authorize access to blobs using Microsoft Entra ID</a>.</p>\n<p>[12] Microsoft Learn, <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept\" rel=\"noopener\" target=\"_blank\">Agent tracing overview</a>.</p>\n<p>[13] OWASP GenAI Security Project, <a class=\"lia-external-url\" href=\"https://genai.owasp.org/llmrisk/llm01-prompt-injection/\" rel=\"noopener\" target=\"_blank\">LLM01: Prompt injection</a>, risks and mitigation guidance.</p>"
  "a25357f8617f9d363b85d28c1eb6aec9":
    "id": "a25357f8617f9d363b85d28c1eb6aec9"
    "title": "Lantern: agentic AI for records and provenance\non Azure"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/lantern-agentic-ai-for-records-and-provenance-on-azure/ba-p/4572947"
    "published": "2026-11-17 05:53:39"
    "fetched": "2026-11-17 18:49:37"
    "summary": "<p><strong>Author:</strong> Warren Kahn, Senior Solution Engineer, Microsoft<br /><strong>Version:</strong> 3.5.10, 12 November 2026<br /><strong>Written for:</strong> Architects and technical leaders at museums, libraries and archives, auction houses, banks, land registries and manufacturers with product passports, and the partners who build for them<br /><strong>Reading time:</strong> About 20 minutes</p>\n<p><strong>Notice.</strong> The museum in this white paper is the Musée National des Arts Réunis (MNAR), a fictional French national museum from a case-study scenario [1]. The demonstration collection is real: 501 records from the French national catalogue, Joconde, under the Licence Ouverte 2.0 [12]. I built and ran the system on Azure in September and October 2026. Every measured result in this white paper comes from that build, and so does every lesson in section 9. Measured results carry their date, and every other figure is labelled as an assumption or an estimate.</p>\n<h2>Executive summary</h2>\n<p>Many organisations rely on experts who must describe what they hold, prove where it came from and explain it to the people they serve. Curators do it for a collection, specialists for the lots in a sale, compliance officers for a client’s wealth, and registrars for a property’s title. The work is slow, and it rests on a few people. Generative AI can help with the drafting and the research. The risk is an invented fact published in the organisation’s name, or a decision that breaches someone’s rights and can’t be undone.</p>\n<p>The museum I built Lantern for shows the scale: only 8% of its 600,000 objects are digitised with rich metadata, the cataloguing backlog is about a decade long, provenance research is largely manual, and visitors ask questions in a dozen languages [1].</p>\n<p>This white paper sets out Lantern, a design on Azure that I built around that risk and measured in the museum. Any organisation whose experts do this work can reuse it. It has four parts, named by what they do:</p>\n<ol>\n<li>An assistant drafts the description, with a source for every fact. In the museum, the cataloguing assistant drafts the catalogue record.</li>\n<li>An assistant builds the item’s history from evidence, citing every link. In the museum, the provenance assistant builds the chain of owners.</li>\n<li>A named person signs before anything goes out. In the museum, the curator signs the record and the rights officer the rights decision.</li>\n<li>A guide explains in the reader’s language, by voice or text, opened from a code with no app. In the museum, this is the visitor guide.</li>\n</ol>\n<p>I designed Lantern around three core principles: firstly, complete accuracy, with zero hallucinations; secondly, speed; and finally, ease of use, as the industries that would benefit most are often understaffed or have smaller technical teams. The assistants only make proposals. Four things carry over to any organisation: separate doors for staff and the public, one record of every decision that can’t be rewritten, templates that deploy in any Azure region, and the AI notice and machine-readable mark the EU AI Act asks for [4].</p>\n<p>What I found while building Lantern for the museum:</p>\n<ul>\n<li><strong>Cataloguing: an estimated 12.5 times less person-time per record</strong> (target: five times), from the measured review of the assistant’s drafts and stated times by hand. The pilot I propose measures it against the museum’s own figures.</li>\n<li><strong>Provenance: an estimated 87% less research time</strong> (target: 60%). On five test objects with known histories, the assistant found 23 of the 25 known links in their chains of owners and invented none.</li>\n<li><strong>Licensing: about €102,000 to €164,000 a year in gross revenue</strong> across the collection from the works that are licensable today (estimate). In the demonstration, a paid licence went from request to signed invoice.</li>\n<li><strong>Running cost: €1,846 a month for the pilot</strong>, with the guide for the museum’s staff only, and about €3,100 a month for the production design (estimates at Azure’s list prices).</li>\n</ul>\n<p>I recommend starting with cataloguing and rights together, in a pilot of 20,000 objects with the museum’s curators, and measuring every result against the museum’s figures before scaling up. For this type of solution, as with many others, a strong data set is critical for operability, and little else can be done before the objects are digitised. Once this is in place, more routes open and allow growth to occur naturally in the most pressing directions; for example, if the visitor experience is the most critical path, then that can be easily followed.</p>\n<h2>1. The problem, and why now</h2>\n<p>Museums, archives, libraries and heritage agencies share one problem: big holdings, small teams, and a legal duty to describe their collections and to protect them. Expectations are rising. In 2021 the Louvre put more than 482,000 entries online [11]. Since 2 August 2026 the AI Act has required that visitors are told they’re dealing with an AI, and that generated text is marked in a machine-readable way, with a transition to 2 December 2026 for systems already on the market [4]. French law now also asks museums to establish and make known the provenance of their works [3]. So I designed Lantern against invented facts and rights breaches first, for speed second, and for ease of use third. The case study set four outcomes for the museum: five times the cataloguing throughput, 60% less provenance research time, higher visitor satisfaction through guidance in many languages, and new licensing revenue [1]. I set every other target in this white paper myself.</p>\n<h2>2. Six design commitments, and the law behind them</h2>\n<p>Write these down before you pick any service, because each one rules out a design.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>#</th><th>Commitment</th><th>Law or policy (France)</th><th>Rules out</th></tr></thead><tbody><tr><td>1</td><td>Curators keep authority over what the museum publishes</td><td>Law [2]</td><td>An assistant that writes to the catalogue or publishes</td></tr><tr><td>2</td><td>Rights are decided per asset, with text and image apart</td><td>Law [5, 6, 7]</td><td>One rights flag per object</td></tr><tr><td>3</td><td>Visitors aren’t identified, and are told they’re talking to an AI</td><td>Law [4]; policy under GDPR [8]</td><td>A conversation log tied to a person</td></tr><tr><td>4</td><td>Residency is stated exactly</td><td>Policy</td><td>Saying “everything stays in the country” when a global service is in the path</td></tr><tr><td>5</td><td>One auditable record of who proposed and who decided, when, and on what evidence</td><td>Policy, serving the provenance duty [3]</td><td>Records edited in place</td></tr><tr><td>6</td><td>The visitor channel is accessible</td><td>Law [9]</td><td>A guide that only works for some visitors</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>In your jurisdiction, mark each one as law or policy. I’d enforce the legal ones through structure, such as permissions and separate services, and put policy into settings the institution can change.</p>\n<h2>3. How Lantern is built on Azure</h2>\n<img />\n<p><em>Figure 1. Lantern’s production design for the museum, with its steps numbered.</em></p>\n<p>No workflow engine or orchestrating agent runs the assistants. When a record is added or corrected, the assistant host, a single container app, picks it up within about ten seconds and runs the assistants one after another, each writing its own entry. The record itself coordinates the work.</p>\n<p>Three of the assistants run as agents in Foundry Agent Service: the cataloguing, provenance and exhibition assistants. Each decides its own steps within its tools. The cataloguing assistant chooses which sources to look up and flags where they conflict, and the provenance assistant decides which leads in the archive text to follow. What they can write is fixed: proposals only.</p>\n<p><strong>Table 1. The main choices, and what I set aside.</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Component</th><th>Azure service</th><th>Why</th><th>Set aside</th></tr></thead><tbody><tr><td>The record</td><td>Cosmos DB for NoSQL and its change feed [14]</td><td>Uneven payloads fit as they are; views rebuild without a broker</td><td>SQL with an outbox; Event Hubs plus a store [13]</td></tr><tr><td>Search</td><td>Two Azure AI Search services [15]</td><td>The line between public and research text is a legal one, so a permission enforces it</td><td>One index with a rights filter [25]</td></tr><tr><td>Assistants</td><td>One host on Container Apps; Foundry Agent Service for the cataloguing, provenance and exhibition assistants</td><td>The record coordinates the work; agent runs show in Foundry</td><td>One orchestrating agent</td></tr><tr><td>Model access</td><td>API Management [16]; Foundry’s AI Gateway in production [24]</td><td>One cap and one log for every caller</td><td>Each app calling models directly</td></tr><tr><td>Publication</td><td>Durable Functions [18]</td><td>A sequence that can undo itself</td><td>A transaction (none spans a database and an index)</td></tr><tr><td>Entrance</td><td>Front Door Premium for visitors; the museum’s network for staff</td><td>Managed attack rules, and staff traffic stays inside the EU Data Boundary [20]</td><td>Front Door for staff too</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>The templates deploy to any Azure region (France Central by default), with a recovery copy in a second EU region. Models on Data Zone Standard deployments may process prompts anywhere in the EU, while data at rest stays in the chosen geography [21]. In my build, cataloguing and the guide ran on gpt-5.4. The production cost estimate puts the guide on the smaller gpt-5.4-mini.</p>\n<p><strong>What I measured it on.</strong> Everything I measured ran on a demonstration build of this design. The production templates add what a live service needs, such as staff sign-in with multi-factor authentication, private endpoints throughout and a write-once archive in a second region. They also put Foundry’s AI Gateway in front of the models, with one project for visitors and one for staff, each with its own token limit. The pilot I propose runs on these templates, with some availability extras scaled down.</p>\n<h2>4. Five design choices, and why I made them</h2>\n<h3>4.1 Assistants propose, curators decide</h3>\n<p>If an assistant could write to the catalogue, every one of its errors would be published. In Lantern nothing reaches the public until a curator signs (Figure 2), and the system enforces that. The assistant host only lets an assistant write proposals, and an append-only role on the record blocks edits and deletions. Every proposed fact cites its source. Text, photographs and archive notes are screened for planted instructions when a record is saved, and in one live test (19 October 2026) a planted instruction was stopped. A checker reads every draft against its sources first, and each assistant works at a fixed level that its permissions enforce (Figure 3).</p>\n<img />\n<p><em>Figure 2. From proposal to publication. Every step is recorded with who took it and when.</em></p>\n<img />\n<p><em>Figure 3. Three fixed levels of independence.</em></p>\n<p><strong>I rejected</strong> the usual multi-agent design, a supervisor agent that calls the others and writes the result. It would need broad permissions, its steps would be hard to replay, and it would take decisions without a person. Letting the record coordinate keeps each assistant to one job and one permission.</p>\n<p><strong>The evidence.</strong> On a fixed test set of 20 records (21 October 2026), every proposed fact cited a source, all five known date errors were flagged, and 86.0% of compared fields matched the reference unchanged. A model judge reading 275 live fields (21 October) found 3 values that none of the sources hold, down from 10 before I tightened the cataloguing assistant. None could reach the public: the checker reads every draft against its sources, and nothing is published until a curator signs.</p>\n<h3>4.2 Keep research text away from the public guide</h3>\n<p>French law lets a museum keep in-copyright text for research only [5, 7], so it must never reach the index the public guide answers from. I use two separate search services. The guide’s identity has no role at all on the research one, and only the publishing sequence (section 4.5) can fill the public index.</p>\n<p><strong>I rejected</strong> the usual answer, a single index with a security filter. Filters are a documented way to control access [25], but one wrong filter would leak research text, and here the line is a legal one. Two services cost more than one, and I accept that for a line no query can cross.</p>\n<p><strong>The evidence.</strong> A boundary check on 13 and 14 October 2026 matched all 337 public documents to a publication on the record.</p>\n<h3>4.3 Use rules for legal decisions and models for language</h3>\n<p>A rights decision has to give the same answer tomorrow, and a rights officer has to be able to explain it to a rights holder in one sentence. That’s why the rights assistant is a decision table. It covers the term after the author’s death, anonymous works, works on deposit from other institutions, photographs of identifiable people [6] and out-of-commerce works [7], with separate licences for the text and the image (Appendix C shows five of the rules). The rights officer confirms or overrides each decision.</p>\n<p>I use the same split in every assistant. A model reads and suggests, but rules make the decisions and a person signs them off. The checker’s model only advises. The exhibition assistant’s model groups works by meaning, but rules decide whether a work can travel. The provenance assistant’s model reads archive passages and proposes each link, and a curator decides.</p>\n<p><strong>I rejected</strong> the obvious approach, asking a model for the rights status with the record as context. The same record could get two different answers, and a rights holder is owed one answer with the rule behind it.</p>\n<p><strong>The evidence.</strong> In the live demonstration, the rules leave 66 of 501 works (13.17%) for a person’s judgement (22 October 2026), against a target of at most 15%. I first set it at 2%, from a run that a misreading had distorted (section 9). By 26 October 2026, three licence requests had gone through the demonstration end to end: the rules issued an open-access licence at once, a rights officer signed and invoiced a paid one (€490 before VAT), and one request was declined.</p>\n<h3>4.4 Check in one language, then translate</h3>\n<p>Each visitor question passes Prompt Shields first [19]. The guide then drafts its answer in English from the public index and checks that it’s grounded in the records it cites. Only then does it translate the answer, with the AI notice, a machine-readable AI mark and a source line, so one check scores all twelve languages the same way. If it can’t ground an answer, it says so and points the visitor to a person.</p>\n<p>Visitors open the guide from one code at each gallery’s entrance, with no app and no new labels. They can type a question, or ask by voice in any of the twelve languages and hear the answer read aloud. Spoken words go through the same checks as typed ones. Lantern keeps no audio, and Microsoft doesn’t retain or store the audio its speech recognition processes [27]. In a check of all twelve languages, two rounds each (27 October 2026), 23 of 24 spoken questions were recognised, the language was detected 22 of 24 times, and the first sound of the answer came a median of 4.03 seconds after the question.</p>\n<p><strong>I rejected</strong> the obvious design, answering natively in each language, which gives twelve scores that can’t be compared.</p>\n<p><strong>The evidence.</strong> On 60 questions in twelve languages (26 October 2026), the guide answered 49, refused the 11 about things outside the collection, refused nothing it should have answered, and showed the AI notice on all 60. Foundry’s evaluators scored groundedness, how well an answer is backed by the records it drew on: all 48 answers they could check scored 4 or more out of 5 (mean 4.91), and the one left out has no record to check against. A rules-only citation check confirmed 43 of the 49, and the other 6 were correct when I read them.</p>\n<h3>4.5 Make every publication reversible</h3>\n<p>Only the publishing sequence can publish, and it needs a curator’s signature and a rights decision that clears the work. It follows the compensating-transaction pattern [17], so a failed step undoes the steps before it, and a rights withdrawal takes the work down again.</p>\n<p><strong>I rejected</strong> the usual content-management approach, a “published” flag on the record, because a flag can say published while the public copy says something else. <strong>The evidence:</strong> in one test (5 October 2026), a withdrawn work was gone from the public index within 60 seconds.</p>\n<h2>5. What I measured</h2>\n<p>I dated each target before its first run, and a miss stays on the record. The museum should supply the baseline for work by hand; my fictional museum has none, so I label my working assumptions. A p95 is the time within which 95% of answers arrive.</p>\n<p><strong>Table 2. What I measured (September to October 2026).</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Measure</th><th>Result</th><th>Basis</th></tr></thead><tbody><tr><td>Cataloguing person-time (target: 5× less)</td><td><strong>12.5×</strong> less: a 0.4-minute check plus an assumed 2 minutes to complete, against an assumed 30 minutes by hand</td><td>Estimate: the review is measured; the 2 and 30 minutes are stated assumptions</td></tr><tr><td>Cataloguing accuracy</td><td>86.0% of 143 compared fields unchanged; 5 of 5 date errors flagged (21 October)</td><td>Measured on a fixed test set of 20 records</td></tr><tr><td>Provenance research time (target: 60% less)</td><td><strong>87%</strong> less of a person’s time: up to 15 minutes to check the draft chain, against two hours by hand. Counting the assistant’s median of 67 seconds an object, 86.5% (22 October)</td><td>Estimate on five objects; the 15 minutes and the two hours are assumptions</td></tr><tr><td>Licensing</td><td><strong>59 of 501</strong> licensable (20 October); about €102,000 to €164,000 a year across the collection</td><td>Counts measured; revenue estimated on published yields [10, 23]</td></tr><tr><td>Rights needing a person (target: at most 15%)</td><td>66 of 501 (13.17%, 22 October)</td><td>Measured</td></tr><tr><td>The guide’s answers (60 questions, twelve languages)</td><td>49 answered, 11 rightly refused, none wrongly refused; groundedness 4.91 out of 5 (26 October)</td><td>Measured</td></tr><tr><td>The guide’s speed</td><td>Half of answers within 2.5 s (26 October)</td><td>Measured</td></tr><tr><td>Visitors asking at once (target: p95 8 s at ten, no errors)</td><td>Twenty at once, with every model step on: p95 5.97 s, no errors (23 October)</td><td>Measured</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>Two other results changed what I built. The provenance assistant’s model reading first got 22 of 26 links right (84.6%, 22 October) against my 90% target; after I fixed how it states each link’s role, a judge found all 31 of its links supported by their sources (23 October). And the smaller gpt-5.4-mini catalogued for US$0.0131 a record against US$0.0334 (21 October), but flagged only one of the five known date errors, so cataloguing stays on gpt-5.4.</p>\n<p>Satisfaction is for the museum to measure once the guide opens to visitors, by comparing guide users with non-users.</p>\n<h2>6. Running it: ease of use, resilience and cost</h2>\n<p><strong>Easy to run with a small team.</strong> The organisations that would gain most often have small technical teams, so I kept Lantern to managed Azure services, with no servers to patch. Its production templates take the Azure region as a setting and come with backup, monitoring and alerts built in. Staff work in one web app, the Workbench, reached only from inside their own network, and visitors need no app at all. Checking a draft took 0.4 minutes a record in my trial.</p>\n<p>One part failing doesn’t take the rest down. A model outage loses nothing already done, the guide carries on without the research side, and staff keep working without the public index. The record, held in the event store, is the one component whose loss stops new decisions, so it gets the most protection: continuous backup, plus zone redundancy and a write-once archive in a second region in production. The restore procedure is documented, and the pilot I propose tests it against the museum’s own recovery targets.</p>\n<p>The six-month pilot, with the guide for the museum’s staff only, costs <strong>€1,846 a month</strong> at Azure’s list prices (an estimate, within €1,673 to €2,168), about €11,000 in all (€11,076) [13, 22]. Lantern’s production design costs <strong>about €3,100 a month</strong> (an estimate of €3,129, within €2,873 to €3,565), for 20,000 records a year and 150,000 visitor questions a month [13, 22]. Search, the gateway, the guide’s model, Front Door Premium and Defender for Cloud make up 76.7% of it. A cheaper search tier, a smaller model for translation and more caching could save up to €759 a month without weakening security. With the guide on gpt-5.4, as I measured it, the month is about €3,950. On the live demonstration, a catalogue draft cost under three US cents in model calls and a visitor’s typed answer under one cent (US$0.0227 and US$0.0086, 20 to 22 October). The demonstration’s own bill for 1 to 20 October was US$312.26, within US$8.08 of my estimate for those days.</p>\n<h2>7. Beyond museums</h2>\n<p>I built and measured Lantern in a museum. The same four parts apply wherever experts must describe, prove and explain what an organisation holds. Table 3 shows what they become in five such places, and Appendix B lists more.</p>\n<p><strong>Table 3. Where the four parts apply.</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Where it applies</th><th>Drafts the description</th><th>Builds the history from evidence</th><th>Signs before it goes out</th><th>Explains to</th></tr></thead><tbody><tr><td>Libraries, archives and broadcasters’ archives</td><td>The catalogue record for a book, a file or a recording</td><td>Where each item came from, and who holds its rights</td><td>The librarian or archivist</td><td>Researchers and the public</td></tr><tr><td>Auction houses and art dealers</td><td>The lot description</td><td>Past owners, sales and exhibitions</td><td>The specialist</td><td>Buyers and sellers</td></tr><tr><td>Banks</td><td>The client’s profile</td><td>The source of wealth, and who really owns what</td><td>The compliance officer</td><td>Clients, about what the bank needs and why</td></tr><tr><td>Land and property registries</td><td>The property record</td><td>The chain of title</td><td>The registrar</td><td>Owners, buyers and their advisers</td></tr><tr><td>Supply chains with product passports</td><td>The product passport</td><td>Where each material and part came from</td><td>The person responsible for the product</td><td>Buyers, repairers and recyclers, from the code on the product</td></tr></tbody><colgroup><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /></colgroup></table></div>\n<p>What changes from one organisation to the next is the data the assistants read, the rules the evidence must meet, and who signs. The platform stays the same: assistants that only propose, one record that keeps every decision, separate doors for staff and the public, and the same templates. Each organisation measures the gains against its own baseline, as the museum would in the pilot I propose.</p>\n<h2>8. From pilot to scale</h2>\n<ol>\n<li><strong>First month:</strong> agree the commitments, the event vocabulary (the kinds of entry the record can hold, such as a proposal or a signature) and the rights table, freeze the evaluation sets, and ask the museum for its baseline timings.</li>\n<li><strong>Pilot:</strong> 20,000 objects, about 3% of the collection, with the museum’s curators. In the pilot the guide is for the museum’s staff, and it answers from the records the curators approve. Sample signed records each week, because a review that takes seconds may be a rubber stamp, and decide go or no-go on the museum’s figures at the end of June 2027.</li>\n<li><strong>Scale:</strong> this is the step that clears the backlog, so price it separately. Add model quota, connect the collection management system, open the guide to visitors and measure their satisfaction, and publish through IIIF, the International Image Interoperability Framework.</li>\n</ol>\n<p><strong>What I would refuse to build:</strong> an assistant that publishes, a model that decides rights, a visitor profile, or one search index split by a filter.</p>\n<h2>9. What I learned building it</h2>\n<p><strong>Read real records before you write a rule.</strong> A rule keyed on the word <em>dépôt</em> read a donor’s ban on lending, « interdiction de prêt et de dépôt », as a deposit, across hundreds of works. Sampling the records caught it.</p>\n<p><strong>Check what each link means.</strong> A judge that read what each provenance link claims found four with the wrong role, such as a place where a work was kept read as its owner. A check that only matched names passed all four. Once I fixed how the assistant states each role, the judge found all 31 links supported.</p>\n<p><strong>Ask for the customer’s baseline.</strong> I’m not a cataloguer, so timing myself would have proved nothing.</p>\n<p><strong>Fix the product when you miss a target.</strong> Cataloguing missed its speed target (p95 30.4 seconds against 20), so I gave each outside lookup its own time limit. The re-run took 18.4 seconds, with accuracy held.</p>\n<p><strong>Build the evaluation sets first.</strong> Freeze them before the first run, so every fix is proved on questions the assistants haven’t seen.</p>\n<h2>10. Limits, and what the pilot adds</h2>\n<ul>\n<li>The pilot adds what a demonstration can’t: the museum’s staff, native speakers among them, reading the guide’s answers, a rights specialist sampling the rules’ decisions, a full accessibility test, and the museum’s data protection impact assessment, from a draft I wrote.</li>\n<li>The provenance assistant reads one outside database live, the national catalogue, and the museum adds more sources without code, on the Sources page of the Workbench, the staff’s web app. When a lookup runs out of time, the chain says that source was not consulted.</li>\n<li>Every assistant will sometimes be wrong. Lantern’s design assumes that. Each output carries its source, and the record shows which person made each call.</li>\n</ul>\n<h2>11. Conclusion</h2>\n<p>Experts who describe, prove and explain what an organisation holds are too few for the work in front of them. Lantern shows that AI can take on the drafting and the research while a named person keeps the final say. In my build, cataloguing took an estimated 12.5 times less person-time and provenance research an estimated 87% less, with a source for every proposed fact and nothing published without a signature. I would start with cataloguing and rights in a pilot, and measure every gain against the organisation’s own figures.</p>\n<h2>Appendix A. Where to start: a checklist</h2>\n<ol>\n<li>Write the design commitments on one page, and mark each one as law or policy.</li>\n<li>Define the event vocabulary before any screen.</li>\n<li>Keep one append-only record, with assistants that can only propose.</li>\n<li>Use two search services and two identities for public and research text.</li>\n<li>Use rules for legal decisions and models for language.</li>\n<li>Put a checker between the assistant that proposes and the person who decides.</li>\n<li>Send every model call through a capped gateway, and write down the calls that bypass it.</li>\n<li>Freeze an evaluation set and date the targets before the first run.</li>\n<li>Ask for the institution’s own baseline.</li>\n<li>Screen content for planted instructions when it comes in.</li>\n<li>Turn on continuous backup and a write-once event archive in the first week, then test the restore in the pilot.</li>\n</ol>\n<h2>Appendix B. Where else the four parts apply</h2>\n<p>Section 7 shows five places where Lantern’s four parts apply. Table 4 lists more. In each, a guide would also explain the result to the people the organisation serves, and each would bring its own data, rules and signers.</p>\n<p><strong>Table 4. More places where the four parts apply.</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Where it applies</th><th>What the assistants draft</th><th>The history they build from evidence</th><th>Who signs</th></tr></thead><tbody><tr><td>Artist foundations and catalogue raisonné committees</td><td>The entry for each work</td><td>Past owners, exhibitions and publications</td><td>The authentication committee</td></tr><tr><td>Natural history collections, herbaria and biobanks</td><td>The specimen or sample record</td><td>Where and when it was collected, and under what permit or consent</td><td>The curator or custodian</td></tr><tr><td>Archaeology services and heritage registers</td><td>The record of a site or find</td><td>Its excavation and custody history</td><td>The heritage officer</td></tr><tr><td>Photo agencies, image libraries and publishers</td><td>The caption and rights record for each image</td><td>Who made it, and who has held and licensed its rights</td><td>The rights manager</td></tr><tr><td>News organisations</td><td>The caption for a photo or video</td><td>Where it was captured and how it was edited</td><td>The picture editor</td></tr><tr><td>Universities</td><td>The record of a degree or other qualification</td><td>The study and assessment records behind it</td><td>The registrar</td></tr><tr><td>Insurers of art, jewellery and other valuables</td><td>The schedule of insured items, and each claim file</td><td>Proof of ownership, value and condition</td><td>The underwriter or loss adjuster</td></tr><tr><td>Trade finance</td><td>The review of each shipment’s documents</td><td>The chain of bills of lading, invoices and certificates</td><td>The document examiner</td></tr><tr><td>Lawyers in mergers, acquisitions and lending</td><td>The register of the assets and contracts in a deal</td><td>Who owns each asset, and how they came to own it</td><td>The responsible lawyer</td></tr><tr><td>Audit</td><td>The working papers</td><td>The evidence behind each figure</td><td>The engagement partner</td></tr><tr><td>Company and beneficial-ownership registers</td><td>The company’s record</td><td>Its owners and controllers over time</td><td>The registrar</td></tr><tr><td>Vehicle, vessel and aircraft registries</td><td>The registration record</td><td>Ownership and mortgage history</td><td>The registrar</td></tr><tr><td>Courts and police evidence stores</td><td>The exhibit record</td><td>Its chain of custody</td><td>The exhibits officer</td></tr><tr><td>Aircraft maintenance</td><td>The record for each part</td><td>Its history back to manufacture</td><td>The engineer who releases the aircraft to service</td></tr><tr><td>Medicines and medical devices</td><td>The batch or device record</td><td>Where every material and component came from</td><td>The person who certifies it for release</td></tr><tr><td>Food, farming and timber</td><td>The record for each lot</td><td>Its chain from farm or forest to the buyer</td><td>The quality manager or certifier</td></tr><tr><td>Mining, metals and gemstones</td><td>The record for each lot</td><td>Its chain from mine to market</td><td>The responsible-sourcing officer or assayer</td></tr><tr><td>Luxury goods, fine wine, classic cars and collectibles</td><td>The listing or certificate</td><td>Past owners, storage, servicing and restoration</td><td>The authenticator</td></tr><tr><td>Construction and building safety</td><td>The building’s safety record</td><td>Every design change, product and inspection</td><td>The person accountable for the building’s safety</td></tr><tr><td>Energy, water and transport infrastructure</td><td>The asset record</td><td>Its inspection and repair history</td><td>The responsible engineer</td></tr><tr><td>Software suppliers</td><td>The software bill of materials</td><td>Where each component came from and how it was built</td><td>The release or security lead</td></tr><tr><td>Teams building AI models</td><td>The record of each training dataset</td><td>Where each source came from, and under what licence</td><td>The data steward</td></tr><tr><td>Carbon and nature credits</td><td>The project record</td><td>Each credit’s path from issue to retirement</td><td>The accredited verifier</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<h2>Appendix C. Five rules from the rights table</h2>\n<p>These are five of the rights assistant’s rules for France, in the order they’re checked. The first rule that matches decides, and every decision names its rule. Your jurisdiction’s terms will differ.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Rule</th><th>When the record shows</th><th>The decision</th></tr></thead><tbody><tr><td>R1b</td><td>A photograph of an identifiable person</td><td>The record may publish; the image waits for that person’s consent [6]</td></tr><tr><td>R3</td><td>An author who died 70 years ago or less, or is alive</td><td>In copyright: the record’s text may publish, and the image is blocked [26]</td></tr><tr><td>R4</td><td>An author who died more than 70 years ago</td><td>Public domain: the work’s text and image are free, and the photograph’s licence is decided on its own [26]</td></tr><tr><td>R5</td><td>An anonymous or uncertain work dated before 1850, or a named artist dead for more than 120 years</td><td>Public domain, whoever the maker was</td></tr><tr><td>R6</td><td>Anything else</td><td>Undetermined: nothing publishes, and a person decides after a diligent search</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h2>References</h2>\n<p>Web pages were read on 22 October 2026.</p>\n<ol>\n<li>Case-study scenario for the Musée National des Arts Réunis (fictional), 2026: the museum’s figures (600,000 objects; 8% digitised with rich metadata; 9 million visitors a year; a backlog of about a decad