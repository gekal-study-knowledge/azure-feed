  "c0e1b343fc7ac3ab78f1e0d1678ef785":
    "id": "c0e1b343fc7ac3ab78f1e0d1678ef785"
    "title": "Sovereignty at Microsoft Ignite"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/sovereignty-at-microsoft-ignite/ba-p/4573780"
    "published": "2026-11-17 11:58:19"
    "fetched": "2026-11-17 18:49:37"
    "summary": "<img />\n<p>Planning for sovereignty means making choices about specific workloads, controls, and operating environments. At Microsoft Ignite, use the sessions, demos, and conversations below to find the guidance that fits your priorities and leave with practical next steps for your team.</p>\n<p>Start with the sessions that match the questions you need to answer. Then see the controls in action, talk with product teams and partners, and use the resources at the end of this guide to continue planning after Ignite.</p>\n<h1>Sessions to add to your schedule</h1>\n<p>Choose sessions by the decision you need to make: how to prioritize risks and sovereign requirements, where a workload should run, which controls it needs, how to operate when disconnected, or how to build AI within your boundary. All times below are Pacific.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td>\n<p><strong>Session</strong></p>\n</td><td>\n<p><strong>Format and time</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856640049001EoQy-1791588100457001Ctmo?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK439: Sovereign Cloud Mythbusters: Separating fact from fiction</a></p>\n</td><td>\n<p>Tue Nov 17, 3:15-4:00 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856708798001EkEu-1791588104147001C8Ga?source=sessions\" rel=\"noopener\" target=\"_blank\">LTG1466: Azure Local disconnected operations: Tenant onboarding and IDP setup</a></p>\n</td><td>\n<p>Tue Nov 17, 3:35-3:50 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856637312001EsdU-1791588336733001CAme?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK421: Operate a global AKS fleet across regions, edge, and sovereign clouds</a></p>\n</td><td>\n<p>Wed Nov 18, 10:15-11:00 AM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856647653001EFmV-1791588220902001CGNJ?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK489: Partner opportunity: Sovereignty in every modernization conversation</a></p>\n</td><td>\n<p>Thurs Nov 19, 2:45PM-3:30PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787854984164001t0t5-1791588200649001Caph?source=sessions\" rel=\"noopener\" target=\"_blank\">BRKSP604: Meet your sovereign cloud goals with Dell and Azure Local</a></p>\n</td><td>\n<p>Thurs Nov 19, 1:30 PM-2:15 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787854984385001tpdF-1791588200901001CCnX?source=sessions\" rel=\"noopener\" target=\"_blank\">BRKSP605: Sovereign by design with smarter AI on Azure Local</a></p>\n</td><td>\n<p>Wed Nov 18, 1:45-2:30 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787854990569001te2G-1791588224298001CCu8?source=sessions\" rel=\"noopener\" target=\"_blank\">LTGSP1613: Speed, scale, sovereignty: Azure Local and Bridge on Armada</a></p>\n</td><td>\n<p>Wed Nov 18 3:50 PM-4:05 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856639900001E6cl-1791588218637001CGLI?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK438: Building sovereign private cloud for mission-critical environments</a></p>\n</td><td>\n<p>Wed Nov 18, 4:15-5:00 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856640517001EIKl-1791588245037001C6mG?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK442: Build sovereign AI with Azure Local and Foundry Local</a></p>\n</td><td>\n<p>Thu Nov 19, 9:00-9:45 AM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856601712001ErNY-1791588264657001CQB9?source=sessions\" rel=\"noopener\" target=\"_blank\">THR1025: Azure Unplugged: Perspectives on sovereign public cloud</a></p>\n</td><td>\n<p>Wed Nov 18, 2:50-3:20 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856582154001EA3N-1791588300382001CDxh?source=sessions\" rel=\"noopener\" target=\"_blank\">THR899: Build intelligent physical systems with Foundry Local and Azure Local</a></p>\n</td><td>\n<p>Thu Nov 19, 2:50-3:20 PM</p>\n</td></tr><tr><td>\n<p><a href=\"https://ignite.microsoft.com/en-US/sessions/1787856587203001Eq14-1791588290888001C6Q0?source=sessions\" rel=\"noopener\" target=\"_blank\">THR932: Competing and winning with Microsoft Sovereign Cloud</a></p>\n</td><td>\n<p>Thu Nov 19, 4:20-4:45 PM</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2>How to plan your week</h2>\n<p>If you are assessing sovereign cloud options, start with <a href=\"https://ignite.microsoft.com/en-US/sessions/1787856640049001EoQy-1791588100457001Ctmo?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK439</a> for a risk-based way to choose controls and deployment models. For disconnected operations and platform management, prioritize <a href=\"https://ignite.microsoft.com/en-US/sessions/1787856708798001EkEu-1791588104147001C8Ga?source=sessions\" rel=\"noopener\" target=\"_blank\">LTG1466</a> and <a href=\"https://ignite.microsoft.com/en-US/sessions/1787856637312001EsdU-1791588336733001CAme?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK421</a>. For mission-critical workloads under local control, add <a href=\"https://ignite.microsoft.com/en-US/sessions/1787856639900001E6cl-1791588218637001CGLI?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK438.</a> If you are planning AI within your environment, choose <a href=\"https://ignite.microsoft.com/en-US/sessions/1787856640517001EIKl-1791588245037001C6mG?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK442</a> and THR899. Partners can focus on <a href=\"https://ignite.microsoft.com/en-US/sessions/1787856647653001EFmV-1791588220902001CGNJ?source=sessions\" rel=\"noopener\" target=\"_blank\">BRK489</a> and <a href=\"https://ignite.microsoft.com/en-US/sessions/1787856587203001Eq14-1791588290888001C6Q0?source=sessions\" rel=\"noopener\" target=\"_blank\">THR932</a>. Check the times before you build your schedule: some of these sessions overlap and some will be recorded for on-demand viewing.</p>\n<p>Two sessions bring the customer view straight to the stage. In<a href=\"https://ignite.microsoft.com/en-US/sessions/1787856639900001E6cl-1791588218637001CGLI?source=sessions\" rel=\"noopener\" target=\"_blank\"> BRK438</a> on Wednesday, the <a href=\"https://www.goldengate.org/\" rel=\"noopener\" target=\"_blank\">Golden Gate Bridge, Highway and Transportation District</a> joins the Azure Local team to talk about running mission-critical systems under local control. On Thursday, Azure Unplugged pairs Microsoft product leaders with Azure MVP Steve Melan for a conversation that follows a bank through some hard questions, starting with how it keeps serving customers during a disruption and ending with how it uses AI without loosening its controls.</p>\n<p>Sponsors are also running sovereignty sessions:</p>\n<ul>\n<li><a href=\"https://ignite.microsoft.com/en-US/sessions/1787858591169001SUm7-1791588165357001CFAR?source=sessions\" rel=\"noopener\" target=\"_blank\">THRSP1050</a>, \"Scale enterprise AI with security, sovereignty, and governance\" (Tue Nov 17, 2:35 PM);</li>\n<li><a href=\"https://ignite.microsoft.com/en-US/sessions/1787858588582001SAMi-1791588123468001Clum?source=sessions\" rel=\"noopener\" target=\"_blank\">THRSP1076</a>, \"Transform your legacy estate for sovereign AI\" (Wed Nov 18, 10:10 AM); and</li>\n<li><a href=\"https://ignite.microsoft.com/en-US/sessions/1791389148065001QJMP-1791898611869001MlPu?source=sessions\" rel=\"noopener\" target=\"_blank\">TTSP1883</a>, \"Build mission-ready AI factories: From simulation to sovereign AI\" (Tue Nov 17, 2:00 PM PT)</li>\n</ul>\n<h1>Booth demos and time with the product team</h1>\n<p>Bring specific workload or planning questions to <strong>booth #4353 in The Hub</strong>. These short demos let you examine public cloud controls and ask the product team how they apply to your requirements.</p>\n<ul>\n<li><strong>Sovereign Control Panel</strong> <strong>discovery and remediation capabilities</strong> show how to assess Azure environments against sovereignty policies, see the affected resources and fix gaps from one place.</li>\n<li><strong>Sovereign Control Panel support for business continuity</strong> shows how to check the continuity posture of a critical workload and the dependencies it relies on.</li>\n<li><strong>Data Guardian</strong> walks through how European-resident oversight applies when a Microsoft engineer needs remote access to in-scope systems.</li>\n<li><strong>Production Touch Ledger</strong> shows how to review the tamper-evident record of that access.</li>\n</ul>\n<p>Can't make it to San Francisco? The full <a href=\"https://youtu.be/rfYJ4SgvrEs?is=msfq28QLnHzVootu\" rel=\"noopener\" target=\"_blank\">Microsoft Sovereign Cloud demo</a> is on YouTube.</p>\n<h1>Partners showing sovereign solutions</h1>\n<p>Several partners are bringing joint sovereignty work to Ignite. <strong>Armada, Booth #1669,</strong> will showcase its Galleon modular data center with guided experiences, showing how Sovereign Private Cloud and AI can run in remote, regulated and disconnected locations. The Galleon will be located at 176 2nd St, open daily from 9am to 6pm. The Armada lightning talk, <a href=\"https://ignite.microsoft.com/en-US/sessions/1787854990569001te2G-1791588224298001CCu8?source=sessions\" rel=\"noopener\" target=\"_blank\">LTGSP1613</a>, on Wednesday covers Azure Local and Bridge on Armada.</p>\n<p>Visit the <a href=\"https://ignite.microsoft.com/en-US/sponsors/1754968359625001fOem?source=/sponsor-directory\" rel=\"noopener\" target=\"_blank\">NVIDIA</a> booth on Thursday from 11:30 to 11:55 AM, to explore Microsoft Sovereign Private Cloud for AI with NVIDIA, Azure Local and Foundry Local.</p>\n<p><a href=\"https://ignite.microsoft.com/en-US/sponsors/1786572087657001Xgbs?source=/sponsor-directory\" rel=\"noopener\" target=\"_blank\">Lenovo</a> will host a sovereign AI session at its booth #5379 on Thursday alongside its <a href=\"https://ignite.microsoft.com/en-US/sessions/1787854984385001tpdF-1791588200901001CCnX?source=sessions\" rel=\"noopener\" target=\"_blank\">BRKSP605</a> breakout session, and Dell will cover sovereign cloud goals with Azure Local in <a href=\"https://ignite.microsoft.com/en-US/sessions/1787854984164001t0t5-1791588200649001Caph?source=sessions\" rel=\"noopener\" target=\"_blank\">BRKSP604</a>.</p>\n<p><a href=\"https://ignite.microsoft.com/en-US/sponsors/1735320030414001BRHr?source=/sponsor-directory\" rel=\"noopener\" target=\"_blank\">Intel</a> and Microsoft are also working together at Ignite on digital sovereignty and trusted AI infrastructure from silicon to cloud, including a co-authored <a href=\"https://marketingassets.microsoft.com/adobe/assets/urn:aaid:aem:25b19057-625c-4502-9476-bb8cedb98f99/original/as/Whitepaper-Digital-Sovereignty-in-the-AI-Era-Control-and-Verifiable-Trust-from-Silicon-to-Cloud.pdf\" rel=\"noopener\" target=\"_blank\">white paper</a> and <a href=\"https://ignite.microsoft.com/en-US/sessions/1787854990794001th8O-1791588147778001CFLh?source=partnerdetail\" rel=\"noopener\" target=\"_blank\">sessions in Intel's Innovation Hub</a>.</p>\n<h1>Learn more</h1>\n<p>Check out these new Tech Community posts published this week and go deeper <span>on individual capabilities</span>:</p>\n<ul>\n<li><a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/production-touch-ledger-ptl-verifiable-records-for-operator-transparency-in-the-/4573858\" target=\"_blank\">Production Touch Ledger (PLT): Verifiable records for operator transparency in the Sovereign Cloud</a>, by Shashwat Chandra</li>\n<li><a href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/what-is-new-in-sovereign-public-cloud/4566000\" rel=\"noopener\" target=\"_blank\">What is new in Sovereign Public Cloud</a>, by Stuart Russell</li>\n<li><a href=\"https://aka.ms/SovMoment2026Private\" rel=\"noopener\" target=\"_blank\">Sovereign Private Cloud: Bringing more choice and control to AI and cloud infrastructure</a>, by Meena Gowdar</li>\n<li><a href=\"https://blogs.microsoft.com/blog/2026/10/20/advancing-digital-sovereignty-with-greater-control-and-choice/\" rel=\"noopener\" target=\"_blank\">Advancing digital sovereignty with greater control and choice</a>, by Douglas Phillips</li>\n<li><a href=\"https://www.microsoft.com/en-us/microsoft-cloud/blog/general/2026/10/05/sovereign-ai-accelerate-innovation-with-control-and-choice/\" rel=\"noopener\" target=\"_blank\">Sovereign AI: Accelerate innovation with control and choice</a>, Didier Ongena</li>\n</ul>\n<h1>Updated resources</h1>\n<p>Use these to take the conversation back to your own team:</p>\n<ul>\n<li>The <a href=\"https://www.microsoft.com/sovereignty\" rel=\"noopener\" target=\"_blank\">Microsoft Sovereign Cloud website</a> and assessment, to help you work out which approach fits your workloads</li>\n<li><a href=\"https://aka.ms/SovereignAIwhitepaper\" rel=\"noopener\" target=\"_blank\">The Sovereign AI white paper</a> developed with NVIDIA, which lays out a framework for control, choice, flexibility and resilience across AI environments</li>\n<li><a href=\"https://info.microsoft.com/ww-landing-microsoft-sovereign-cloud-in-europe.html\" rel=\"noopener\" target=\"_blank\">The Microsoft Sovereign Cloud in Europe</a> white paper</li>\n<li>The <a href=\"https://marketingassets.microsoft.com/adobe/assets/urn:aaid:aem:25b19057-625c-4502-9476-bb8cedb98f99/original/as/Whitepaper-Digital-Sovereignty-in-the-AI-Era-Control-and-Verifiable-Trust-from-Silicon-to-Cloud.pdf\" rel=\"noopener\" target=\"_blank\">Microsoft and Intel white paper on digital sovereignty and trusted AI infrastructure</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/azure-sovereign-clouds/sovereign-business-continuity/overview\" rel=\"noopener\" target=\"_blank\">Sovereign Business Continuity</a> with Microsoft Sovereign Cloud on Microsoft Learn, the first in a set of continuity modules</li>\n<li>Sovereign Landing Zone implementation guidance with <a href=\"https://azure.github.io/Azure-Landing-Zones/accelerator/starter-bicep/options/slz/\" rel=\"noopener\" target=\"_blank\">Bicep</a> and <a href=\"https://azure.github.io/Azure-Landing-Zones/accelerator/starter-terraform/options/slz/\" rel=\"noopener\" target=\"_blank\">Terraform</a> options</li>\n<li>For partners, the <a href=\"https://partner.microsoft.com/en-us/partnership/specialization/digital-sovereignty\" rel=\"noopener\" target=\"_blank\">Digital Sovereignty specialization</a> in Partner Center</li>\n</ul>\n<h1>Take your next step after Ignite</h1>\n<p>Pick one service your organization depends on. Map its data, dependencies, and continuity needs, then use the sessions and demos above to identify the controls and operating model to assess further. Bring that example to a product-team conversation at Ignite and use the resources above to continue the discussion with your team.</p>"
  "a21009cc19b32136cdb11c9aea9aa99a":
    "id": "a21009cc19b32136cdb11c9aea9aa99a"
    "title": "Introducing new experiences in Kubernetes Center at Microsoft Ignite 2026"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/introducing-new-experiences-in-kubernetes-center-at-microsoft/ba-p/4569688"
    "published": "2026-11-17 10:02:26"
    "fetched": "2026-11-17 18:49:37"
    "summary": "<p>We are thrilled to announce new Kubernetes Center experiences designed to help you understand your Kubernetes estate and act across clusters from unified management experience. Building on the Security capabilities already available, these additions bring Multicluster update and insights, Fleet-backed Resource placement, Monitoring insights like deeper node and pod visibility, and AI Manager into Kubernetes Center.</p>\n<p>Managing Kubernetes across multiple clusters often means switching between resource views, checking upgrade prerequisites individually, and connecting monitoring signals to the workloads that need attention. Coordinating changes across clusters adds another layer of complexity, while deploying AI models introduces new infrastructure and operational requirements. Kubernetes Center brings these workflows closer together, helping you move from an estate-wide view to the relevant resources and management actions without repeatedly rebuilding context.</p>\n<p>What's New:&nbsp;</p>\n<img />\n<p>Functionality and Usage:&nbsp;</p>\n<ul>\n<li><strong>Prepare for upgrades with Multicluster update and insights</strong>. Identify clusters that need attention before a Kubernetes version upgrade and review blocking issues. When you are ready to coordinate upgrades across clusters, integrated Fleet Manager workflows provide a path to creating and tracking update runs.</li>\n<li>Look closer at nodes and pods with <strong>Monitoring insights</strong>. Identify not-ready nodes and failed or pending pods, explore affected resources by cluster and status, and navigate into the relevant resource for investigation. Monitoring coverage insights also highlight clusters missing Container Logs or Managed Prometheus and provide routes to configure the appropriate coverage.</li>\n<li>Take multi-cluster actions with Fleet Manager backed <strong>Resource Placement</strong>. Access Fleet’s Resource Placement experience directly within Kubernetes Center to manage resource distribution across member clusters through placement policies. View Fleet membership, add selected clusters to a Fleet, and use supported placement workflows alongside your broader estate-management experience.</li>\n<li><span>Deploy AI models with<strong> AI Manager </strong>on AKS. Select from a catalog of supported models and deploy to a new or existing cluster with your desired SKU and deployment profile. Post-deployment, you can easily check endpoint status, test model responses, view cost by deployment/namespace, and observe inference and GPU metrics.</span></li>\n</ul>\n<p>Security capabilities are already live in Kubernetes Center. Multicluster update and insights, Resource Placement using Fleet Manager, Monitoring insights, and the AI Manager preview are planned for Microsoft Ignite.&nbsp;</p>"
  "fee92aed132a5545e10aa0204b0fa8bc":
    "id": "fee92aed132a5545e10aa0204b0fa8bc"
    "title": "Production Touch Ledger (PTL): Verifiable records for operator transparency in the Sovereign Cloud"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/production-touch-ledger-ptl-verifiable-records-for-operator/ba-p/4573858"
    "published": "2026-11-17 07:47:19"
    "fetched": "2026-11-17 18:49:37"
    "summary": "<p><span>This post follows the broader </span><a href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/what-is-new-in-sovereign-public-cloud/4566000\" rel=\"noopener\" target=\"_blank\"><span><span>Sovereign Public Cloud update</span></span></a><span> by focusing on one technical mechanism for operational transparency: how PTL is designed to turn supported production-access event flows into reviewable tamper-evident records.</span><span>&nbsp;</span></p>\n<p><span>As of October 2026, PTL is being rolled out in phases. Today, it covers production-access events from systems involved in the Data Guardian workflow in EU and EFTA cloud regions. Throughout this post, 'covered or in-scope systems' refers to these participating sources; coverage is expected to expand over time.</span><span>&nbsp;</span></p>\n<p><span>For environments with sovereignty and regulatory requirements, the Production Touch Ledger (PTL) is designed to strengthen transparency and accountability for production-access activities. A production-access event represents an in-scope action performed during remote access by a Microsoft engineer to a production system in an EU or EFTA cloud region, captured by a supported source system - for example, reading a key in Azure Key Vault after being granted temporary access through Microsoft's just-in-time (JIT) access system. These events are recorded in an append-only, tamper-evident ledger, so any attempt to alter or delete the authoritative record — including by Microsoft — can be detected through verification.</span><span>&nbsp;</span></p>\n<p><span>PTL records help address three critical questions: What happened? Who did it? And can unauthorized changes be detected?</span><span>&nbsp;</span></p>\n<p><span>With PTL, authorized verification workflows can be used to</span> <span>verify the integrity of tamper-evident records of production activity, rather than relying solely on statements and assurances. Its architecture separates validation, signing, ingestion, processing, persistence, reconstruction, and verification so that each stage can be observed, tested, and governed.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>PTL provides documentation and verification of supported production-access activity. It does not replace the controls that determine whether production access is permitted.</span><span>&nbsp;</span></p>\n<p><strong><span>Why PTL exists</span><span>&nbsp;</span></strong></p>\n<p><span>In many systems, records handling can be implicit: events may be accepted, transformed, and queried in ways that make later verification difficult. PTL is designed to make records handling for supported production-access event flows explicit through defined stages and controls.</span><span>&nbsp;</span></p>\n<p><span>PTL is engineered around three key capabilities:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Verifiable records:</span><span> PTL is designed to create durable, tamper-evident records of in-scope production-access events.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Cryptographic integrity:</span> <span>PTL combines source signing, immutable storage, and cryptographic integrity proofs to support integrity verification. This verifiable-receipt model draws on is related to the approach Microsoft describes for software signing in </span><a href=\"https://learn.microsoft.com/en-us/azure/confidential-ledger/about-microsoft-signing-transparency-ledger\" rel=\"noopener\" target=\"_blank\"><span><span>Signing Transparency</span></span></a><span>.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Independent verification</span><span>: Authorized verification workflows are designed to evaluate record integrity and identify inconsistencies in supported event records using integrity information maintained separately from the originating source system.</span><span>&nbsp;</span></li>\n</ul>\n<p><strong><span>Architecture at a glance</span><span>&nbsp;</span></strong></p>\n<p><span>PTL organizes in-scope production-access records processing into a seven-element conceptual flow: a participating source followed by six processing stages. Together, these stages show one way to combine source validation, durable ingestion, purpose-specific storage, reconstruction, and independent verification. This is one approach to combining these Azure services — not a prescriptive reference architecture — that architects can adapt to their own requirements</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Validation and signing</span><span>: events are checked against the expected schema and cryptographically signed at the source.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Durable ingestion</span><span>: PTL is designed to acknowledge an event after durable capture. Downstream processing is then designed to complete or quarantine the event explicitly, so that processing failures can be surfaced for investigation.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Secure processing</span><span>: accepted events move through an asynchronous processing pipeline that validates each event, keeps it linked to the source system that produced it, and persists it for tamper-evident retention.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Tamper-evident persistence</span><span>: PTL is designed to retain signed events from supported source systems in </span><a href=\"https://azure.microsoft.com/en-us/products/storage/blobs/\" rel=\"noopener\" target=\"_blank\"><span><span>Azure Blob Storage</span></span></a><span> configured with immutability policies, record integrity references in </span><a href=\"https://azure.microsoft.com/en-us/products/azure-confidential-ledger/\" rel=\"noopener\" target=\"_blank\"><span><span>Azure Confidential Ledger</span></span></a><span>, and maintain query-ready projections in </span><a href=\"https://azure.microsoft.com/en-us/products/cosmos-db/\" rel=\"noopener\" target=\"_blank\"><span><span>Azure Cosmos DB</span></span></a><span>. Azure documentation describes Blob Storage write-once-read-many protections, Confidential Ledger's append-only and tamper-evident records, and Cosmos DB's indexing and query capabilities; PTL's end-to-end assurance still depends on its configuration, source coverage, and verification workflows.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Record reconstruction</span><span>: authorized workflows reconstruct event sequences and identify missing or inconsistent records.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Authorized verification</span><span>: authorized verification workflows are designed to evaluate event origin, integrity records, expected-event completeness, and records consistency beyond the producing system alone.</span><span>&nbsp;</span></li>\n</ul>\n<p><strong><span>Engineering deep dive</span><span>&nbsp;</span></strong></p>\n<p><span>Conceptual architecture</span><span>: Participating source -&gt; Validation and signing -&gt; Durable ingestion -&gt; Processing -&gt; Tamper-evident persistence -&gt; </span><span>Record </span><span>reconstruction -&gt; Authorized verification.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><span>1) Validation and source attribution</span><span>&nbsp;</span></p>\n<p><span>PTL events are checked for structural conformance and signed at the source, then evaluated for cryptographic validity and source attribution through authorized verification workflows.</span><span>&nbsp;</span></p>\n<p><span>2) Asynchronous processing</span><span>&nbsp;</span></p>\n<p><span>PTL’s ingestion design is intended to tie event acknowledgment to durable capture. After ingestion, accepted events move through an asynchronous pipeline, meaning processing continues in the background after the event is acknowledged. Controls in that pipeline help validate required attributes such as schema and signature, maintain the association between the event and their originating source system, record processing outcomes, and associate the retained event with the integrity information needed for later verification. Processing then completes, or the event is explicitly quarantined, so that processing outcomes can be surfaced for investigation.</span><span>&nbsp;</span></p>\n<p><span>3) Tamper-evident integrity association</span><span>&nbsp;</span></p>\n<p><span>PTL retains signed event material alongside append-only integrity records that preserve verifiable linkage. Completeness checks help identify gaps among expected events from participating sources, while integrity verification is designed to identify inconsistencies resulting from covered modifications or deletions. These checks do not establish that every production action generated an event.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>4) Purpose-specific persistence and record reconstruction</span><span>&nbsp;</span></p>\n<p><span>PTL separates signed event material, append-only integrity records, and query-ready projections across purpose-specific Azure services. Each record surface serves a distinct role in retention, independent verification, or reconstruction of production activity.</span><span>&nbsp;</span></p>\n<p><span>5) Governed records retrieval</span><span>&nbsp;</span></p>\n<p><span>PTL is designed to route records retrieval through authorized, role-scoped workflows rather than provide direct access to the underlying records stores. This keeps governance attached to records release as well as records retention.</span><span>&nbsp;</span></p>\n<p><strong><span>Closing</span><span>&nbsp;</span></strong></p>\n<p><span>PTL is best understood as a capability designed to provide reviewable records about supported production-access activity. Its architecture combines source validation and signing, durable ingestion, asynchronous processing, bounded completeness checks, tamper-evident persistence, record reconstruction, and governed retrieval. PTL is intended to support review of how in-scope production-access activity is captured, attributed, protected against undetected change, and released through governed workflows. This supports the broader Sovereign Public Cloud goal of operational oversight and transparency while remaining bounded by participating sources, configured controls, and published availability.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>In November 2026, </span><span><span>Production Touch Ledger (PTL)</span></span><span> was independently assessed by an authorized third party who evaluated its design and capabilities to provide verifiable, tamper-evident records of production access. </span><a href=\"https://aka.ms/DownloadPTLReport\" rel=\"noopener\" target=\"_blank\"><span><span>3P Validation report</span></span></a><span> assessment supports greater transparency, trust, and accountability in sovereign and regulated environments.</span><span>&nbsp;</span></p>"
