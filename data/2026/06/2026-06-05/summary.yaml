  この日は Microsoft Foundry IQ の一般提供が中心でした。プロジェクトごとに検索パイプラインを作り直すことなく、エージェントをエンタープライズデータに接地させるマネージドなナレッジ層を提供します。あわせて Fabric のオントロジーを連携ナレッジソースとして扱う機能、Azure SQL Database を第一級のナレッジソースとする機能がいずれもプレビューで追加されました。Azure AI Search と Foundry ナレッジベースの間のプライベートなエンドツーエンド接続も GA しています。Azure AI Search の Azure Content Understanding スキルは、構造化 Markdown による意味的なチャンク分割と AI 生成の画像説明が一般提供となり (Content Understanding のチャンク分割と画像の言語化はプレビューでも発表)、Foundry IQ と組み合わせて使えます。監視では Azure Monitor に Service Level Indicators / Objectives が加わり、OpenTelemetry Collector 経由での OTLP シグナル取り込みも一般提供となりました。AKS では Azure CNI Overlay の Pod CIDR 拡張が GA しています。同じ機能は Foundry IQ (旧 Azure AI Search) 側からも一般提供として告知されており、ドキュメントの構造を使って Markdown と位置のメタデータを備えたチャンクを作る点が説明されています。
