    "title": "Pod CIDR Expansion Generally Available and IP Address Planning on Azure CNI Overlay"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/pod-cidr-expansion-generally-available-and-ip-address-planning/ba-p/4521700"
    "published": "2026-06-05 09:14:24"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>In networking with Azure CNI Overlay, the cluster-wide pod CIDR is logically partitioned into smaller “node” blocks where each node is assigned a fixed CIDR slice (/24) by Azure. This decouples pod networking from the VNet address space entirely because pods receive addresses from a private CIDR that is separate from the VNet.</p>\n<p>By default, Azure CNI Overlay uses a pod CIDR of 10.244.0.0/16 which provides 65,536 addresses. Since each node consumes 256 addresses from the /24 slice, the default cluster has a node scaling limit of 65,536 divided by 256, or 256 nodes. Choosing a pod CIDR at cluster creation effectively sets an upper bound on how many nodes the cluster can accommodate.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Pod CIDR</strong></p>\n</td><td>\n<p><strong>Per-Node Block</strong></p>\n</td><td>\n<p><strong>Max Nodes Supported</strong></p>\n</td></tr><tr><td>\n<p>/16</p>\n</td><td>\n<p>/24</p>\n</td><td>\n<p>256</p>\n</td></tr><tr><td>\n<p>/15</p>\n</td><td>\n<p>/24</p>\n</td><td>\n<p>512</p>\n</td></tr><tr><td>\n<p>/14</p>\n</td><td>\n<p>/24</p>\n</td><td>\n<p>1,024</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h2>What does Pod CIDR Expansion enable?</h2>\n<p>Even with careful upfront planning, long-lived clusters grow in ways that are difficult to anticipate. For organizations using Azure CNI Overlay, this previous represents a difficult migration without meticulous IP planning.</p>\n<p>Pod CIDR expansion allows you to expand the existing CIDR without downtime or node reimaging. Instead of being locked to the range chosen at cluster creation, operators can expand the available pod address space with minimal operational burden.</p>\n<h2>Choosing a Pod CIDR</h2>\n<p>In addition to node scaling limits, there are other considerations for pod CIDR planning:</p>\n<ul>\n<li>Overlapping pod CIDRs across clusters – even though pod IPs are not directly routable between clusters, overlapping CIDRs can cause problems with observability tooling or cross-cluster networking on top of the overlay. Careful planning can prevent having to recreate the cluster down the road.</li>\n<li>Accounting for system node pools – each system node also consumes a /24 block. IP address planning should factor nodes running cluster control plane components in addition to existing workloads.</li>\n</ul>\n<h2>Learn More</h2>\n<p>Read more about Azure CNI Overlay:</p>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/aks/concepts-network-azure-cni-overlay\" rel=\"noopener\" target=\"_blank\">Overview of Azure CNI Overlay Networking in Azure Kubernetes Service (AKS)</a></li>\n</ul>\n<p>Try pod CIDR expansion:</p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/aks/azure-cni-overlay-pod-expand\" rel=\"noopener\" target=\"_blank\">Expand Pod CIDR Space in Azure CNI Overlay Azure Kubernetes Service (AKS) Clusters</a></li>\n</ul>"
