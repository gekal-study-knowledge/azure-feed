    "id": "d1a22abae32cdff6334f3a0b77bf39d4"
    "title": "Migrating from MSEE Hairpin Routing to AVNM Mesh for Large-Scale VNet-to-VNet Connectivity"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/migrating-from-msee-hairpin-routing-to-avnm-mesh-for-large-scale/ba-p/4529320"
    "published": "2026-06-19 16:55:59"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<h2>Introduction</h2>\n<p>A common pattern in large Azure deployments is to route <strong>VNet-to-VNet traffic</strong> through <strong>Microsoft Enterprise Edge (MSEE)</strong> routers. This happens when spoke VNets in a hub-and-spoke topology communicate with each other by hairpinning through the ExpressRoute circuit: traffic exits the Azure data center, traverses MSEE, and re-enters the data center to reach the destination VNet.</p>\n<p>This pattern works, but it was not designed as the long-term connectivity model for east-west traffic. With <strong>Azure Virtual Network Manager (AVNM) mesh connectivity</strong> and recent scale improvements — including high-scale mesh up to 5,000 VNets and <strong>High-Scale Private Endpoints (HSPE)</strong> up to 20,000 Private Endpoints across connected VNets — enterprises can migrate to a direct, in-datacenter routing model that removes MSEE dependency for VNet-to-VNet traffic.</p>\n<p>This article explains why the migration is useful, what the new scale limits are, how to enable the required features, and how to execute the migration with minimal disruption.</p>\n<h2>Who This Is For</h2>\n<p>This migration is most relevant if you have 50 or more spoke VNets communicating east-west through ExpressRoute hairpin routing, are approaching VNet peering limits, want to reduce ExpressRoute utilization from internal traffic, or need a simpler centrally managed connectivity model. Even if most east-west flows must continue through a hub firewall for inspection, you can still simplify connectivity management for the flows allowed to go direct.</p>\n<h2>Why MSEE Hairpin Routing for VNet-to-VNet Is Not Recommended</h2>\n<p>When spoke VNets communicate through MSEE, traffic follows a suboptimal path:</p>\n<p><strong>Spoke A → Hub VNet → ExpressRoute Gateway → MSEE → ExpressRoute Gateway → Hub VNet → Spoke B</strong></p>\n<ul>\n<li><strong>Single point of failure.</strong> MSEE becomes a shared dependency for east-west traffic. An MSEE outage or capacity constraint can affect every VNet pair in the topology.</li>\n<li><strong>Lower-latency path.</strong> Traffic no longer needs to leave the data center and return for spoke-to-spoke communication. Direct mesh keeps east-west traffic on an in-datacenter path, which is generally lower latency than hairpinning through MSEE.</li>\n<li><strong>Bandwidth constraints.</strong> MSEE circuits have finite bandwidth. Routing east-west traffic through them competes with north-south on-premises traffic and can saturate the circuit.</li>\n<li><strong>Operational risk at scale.</strong> Large deployments place significant load on MSEE infrastructure, creating scalability, reliability, and operational concerns for environments with thousands of VNets.</li>\n</ul>\n<h2>Why Manual Peering Was Not a Practical Alternative</h2>\n<p>The obvious alternative — creating direct VNet peerings between every spoke pair — solves the MSEE dependency but introduces its own operational complexity:</p>\n<ul>\n<li><strong>Combinatorial growth.</strong> Connecting N spokes requires N × (N - 1) / 2 peering relationships. For 100 spokes, that is 4,950 peerings. For 1,000 spokes, it is nearly 500,000.</li>\n<li><strong>Management overhead.</strong> Each peering must be individually provisioned, monitored, and maintained. This increases drift, audit, and operational overhead.</li>\n</ul>\n<h2>How AVNM Mesh Solves This</h2>\n<p><strong>AVNM mesh</strong> provides group-based connectivity. You define a set of VNets as a network group, apply a mesh connectivity configuration, and AVNM establishes bi-directional connectivity across all members.</p>\n<p>Traffic between meshed VNets stays within the Azure data center: no MSEE traversal, no hub hop, and no manual peering management.</p>\n<ul>\n<li><strong>Define once, connect all.</strong> A single mesh configuration connects every VNet in the group to every other VNet.</li>\n<li><strong>Centralized management.</strong> Add or remove VNets from the group; AVNM reconciles connectivity automatically.</li>\n<li><strong>Direct spoke-to-spoke paths.</strong> Traffic flows directly between VNets, bypassing both the hub and MSEE.</li>\n<li><strong>Dynamic membership.</strong> Use Azure Policy to auto-enroll new VNets based on tags or resource group conditions.</li>\n</ul>\n<h2>How to Migrate Large Scale Topology</h2>\n<p>High-scale mesh lets user migrate larger topology — up to 5,000 VNets and 20,000 Private Endpoints in a mesh.</p>\n<h2>Scale — Standard Mesh vs. High-Scale Mesh</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td style=\"border-width: 1px;\">\n<p>Dimension</p>\n</td><td style=\"border-width: 1px;\">\n<p>Standard Mesh</p>\n</td><td style=\"border-width: 1px;\">\n<p>High-Scale Mesh</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>VNets per mesh</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Up to 250 (soft limit, can request increase)</p>\n</td><td style=\"border-width: 1px;\">\n<p>Up to 5,000</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Private Endpoints per mesh</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Up to 2,000</p>\n</td><td style=\"border-width: 1px;\">\n<p>Up to 20,000 (with HSPE enabled)</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Private Endpoints per VNet</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Up to 1,000</p>\n</td><td style=\"border-width: 1px;\">\n<p>Up to 5,000 (with HSPE enabled)</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h2>Enabling High-Scale Private Endpoints (HSPE)</h2>\n<p>As a mesh footprint grows, so does the number of Private Endpoints deployed across the connected VNets. The default platform limits — 1,000 Private Endpoints per VNet and 2,000 across connected VNets and mesh — can be reached quickly in large environments. Enabling HSPE raises these limits to 5,000 and 20,000, respectively.</p>\n<p>For large-scale mesh migrations, enable HSPE proactively if the environment is expected to grow toward standard Private Endpoint limits by following the steps below.</p>\n<h3>Step 1 — Prepare Each VNet</h3>\n<ol>\n<li>Ensure Private Endpoint Network Policies are set to <strong>Enabled</strong> or <strong>RouteTableEnabled</strong> on all subnets containing Private Endpoints. This is a prerequisite.</li>\n<li>Set the VNet-level property <strong>PrivateEndpointVNetPolicies</strong> to <strong>Basic</strong>. This activates HSPE on the VNet.</li>\n</ol>\n<h3>Step 2 — Enable HSPE on the Mesh Configuration</h3>\n<p><strong>In the AVNM mesh connectivity configuration</strong>, enable the option for high-scale private endpoints. AVNM validates that all VNets in the mesh are HSPE-enabled. If any VNet is missing the configuration, the deployment is blocked with a clear error.</p>\n<h3>Step 3 — Deploy</h3>\n<p>Deploy the connectivity configuration. AVNM applies HSPE across the mesh.</p>\n<h3>Behavior Changes When Enabling HSPE</h3>\n<ul>\n<li><strong>Brief connection reset.</strong> Enabling or disabling HSPE triggers a one-time, approximately 1-second connection reset for existing Private Endpoint connections in the VNet. Plan this during a maintenance window.</li>\n<li><strong>Per-PE Bytes In / Out monitoring is no longer available.</strong> HSPE treats each Private Endpoint IP like any other IP in the VNet, which removes per-PE traffic counters. If you depend on per-PE metrics, evaluate alternatives before enabling.</li>\n<li><strong>On-premises PE traffic billing changes.</strong> PE traffic originating from on-premises appears as an aggregate bill on the gateway VNet, not on the individual Private Endpoint resource. The total bill does not change.</li>\n</ul>\n<h2>How to Avoid Downtime</h2>\n<ul>\n<li><strong>Mesh coexists with existing peerings.</strong> AVNM does not delete manually created peerings unless explicitly configured to do so.</li>\n<li><strong>Traffic shifts automatically.</strong> Once mesh is deployed, spoke-to-spoke traffic routes directly. The MSEE hairpin path remains available if mesh is removed.</li>\n<li><strong>No reconfiguration of hub components.</strong> Firewalls, gateways, and NVAs in the hub continue to function. North-south on-premises traffic still flows through the hub gateway.</li>\n<li><strong>Rollback is simple while the legacy path remains.</strong> Keep the MSEE hairpin path in place during validation so affected VNets can fall back by removing them from the network group or undeploying the mesh configuration.</li>\n</ul>\n<h2>Security and East-West Traffic Inspection</h2>\n<p>A common concern is whether direct mesh connectivity bypasses hub firewalls or network virtual appliances. The answer depends on how inspection is enforced today.</p>\n<ul>\n<li><strong>Mesh provides connectivity, not routing policy.</strong> If spoke subnets have UDRs that direct traffic through a hub NVA or firewall, those UDRs continue to apply and can keep inspected flows on the firewall path.</li>\n<li><strong>Security Admin Rules provide centralized segmentation.</strong> For flows that do not require firewall inspection, AVNM Security Admin Rules can enforce network-level allow or deny policies across network groups.</li>\n<li><strong>Use both where appropriate.</strong> Mesh can provide direct connectivity for approved flows while Security Admin Rules enforce segmentation boundaries where required.</li>\n</ul>\n<p><strong>Recommendation:</strong> Before migrating, inventory which spoke-to-spoke flows currently traverses the firewall. Decide per flow whether to maintain inspection by keeping UDRs in place or allowing a direct mesh path by removing the UDR for that flow pair.</p>\n<h2>Migration Order and Process</h2>\n<p>The migration from MSEE hairpin routing to AVNM mesh is non-disruptive by design. Mesh connectivity overlays on top of existing peerings and takes routing precedence for east-west traffic. You do not need to tear down the existing hub-and-spoke topology first.</p>\n<h3>Recommended Steps</h3>\n<ol>\n<li><strong>Design the mesh topology.</strong> Group VNets by region into mesh groups. If you expect more than 250 VNets per mesh, register the AllowHighScaleConnectedGroup feature in advance.</li>\n<li><strong>Create a Network Manager and define Network Groups.</strong> Ensure that the AVNM scope covers all relevant subscriptions. Use static membership for initial migration or dynamic membership through Azure Policy for ongoing enrollment.</li>\n<li><strong>Enable HSPE on every VNet in the mesh.</strong> <a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration#enable-high-scale-private-endpoints-in-azure-virtual-network-manager-connected-groups\" rel=\"noopener\" target=\"_blank\">Follow the HSPE enablement steps</a> if you need to have more than 2,000 Pes in a mesh. Schedule the change during a maintenance window to account for the brief connection reset.</li>\n<li><strong>Create the mesh connectivity configuration in AVNM.</strong> Select the network groups, enable mesh topology, enable high-scale private endpoints, and enable global mesh if cross-region connectivity is required.</li>\n<li><strong>Deploy incrementally.</strong> Start with a pilot region or non-critical environment. Validate effective routes, spoke-to-spoke connectivity, spoke-to-hub-to-on-premises connectivity, Private Endpoint reachability, and expected VNet flow log patterns before expanding to production regions.</li>\n</ol>\n<h2>Route Behavior During and After Migration</h2>\n<p><strong>During migration, mesh and MSEE can coexist.</strong> Mesh-connected VNets receive direct routes for mesh-connected destinations, while existing ExpressRoute gateway routes continue to serve on-premises destinations. UDRs still override system routes, so forced-tunneling and firewall inspection patterns remain in effect when UDRs are present.</p>\n<ul>\n<li><strong>Mesh destinations.</strong> Traffic between mesh-connected VNets goes directly instead of hairpinning through MSEE when no UDR overrides the route.</li>\n<li><strong>On-premises destinations.</strong> ExpressRoute continues to provide north-south connectivity to on-premises networks.</li>\n<li><strong>Gateway transit.</strong> Spokes can continue to reach on-premises through the hub gateway when the design uses gateway transit.</li>\n</ul>\n<h2>Infrastructure-as-Code Considerations</h2>\n<p>If VNet peerings are managed through Terraform, Bicep, or ARM templates, treat AVNM mesh as the new source of truth only after validation.</p>\n<ol>\n<li><strong>Deploy mesh first.</strong> AVNM mesh can coexist with existing peerings, so do not remove peering resources from IaC before validating the mesh path.</li>\n<li><strong>Validate the traffic path.</strong> Use effective routes, Connection Monitor, and flow logs to confirm traffic is using mesh where expected.</li>\n<li><strong>Guard against drift.</strong> Review pipeline state and lifecycle settings before decommissioning old peerings, especially in environments where multiple teams manage network resources.</li>\n<li><strong>Codify AVNM.</strong> Manage the Network Manager, network groups, configuration, and deployment through IaC so mesh becomes the governed connectivity model.</li>\n</ol>\n<h2>DNS Resolution Across Mesh</h2>\n<p>Mesh connectivity does not change DNS resolution behavior by itself. If spoke VNets are already linked to Private DNS Zones hosted or managed through the hub, those links continue to determine name resolution. If spokes use custom DNS servers in the hub, verify that any UDR changes made during migration do not unintentionally alter the DNS traffic path.</p>\n<h2>Migration Example — Two Hub-and-Spoke Topologies into a Single Mesh</h2>\n<p>This example shows how an enterprise can migrate two regional hub-and-spoke environments into one centrally managed AVNM mesh while preserving the existing MSEE path during validation.</p>\n<h3>Current State — Two Hub-and-Spoke Topologies with MSEE Hairpin</h3>\n<p>Contoso Corp operates a large Azure environment in the East US region with two hub-and-spoke topologies:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td style=\"border-width: 1px;\">&nbsp;</td><td style=\"border-width: 1px;\">\n<p>Topology A</p>\n</td><td style=\"border-width: 1px;\">\n<p>Topology B</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p>Hub VNet</p>\n</td><td style=\"border-width: 1px;\">\n<p>Hub-A</p>\n</td><td style=\"border-width: 1px;\">\n<p>Hub-B</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p>Spoke VNets</p>\n</td><td style=\"border-width: 1px;\">\n<p>500</p>\n</td><td style=\"border-width: 1px;\">\n<p>500</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p>ExpressRoute Gateway</p>\n</td><td style=\"border-width: 1px;\">\n<p>ER-GW-A in Hub-A</p>\n</td><td style=\"border-width: 1px;\">\n<p>ER-GW-B in Hub-B</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p>ExpressRoute Circuit</p>\n</td><td style=\"border-width: 1px;\">\n<p>Shared circuit, connected to both gateways</p>\n</td><td style=\"border-width: 1px;\">\n<p>Same shared circuit</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p>Avg. Private Endpoints per spoke</p>\n</td><td style=\"border-width: 1px;\">\n<p>~8 (4,000 total)</p>\n</td><td style=\"border-width: 1px;\">\n<p>~12 (6,000 total)</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p>Total Private Endpoints</p>\n</td><td colspan=\"2\" style=\"border-width: 1px;\">\n<p>10,000 across both topologies</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><strong>How traffic flows today:</strong></p>\n<ul>\n<li><strong>Spoke-to-spoke within Topology A:</strong> Spoke-A-01 → Hub-A → ER-GW-A → MSEE → ER-GW-A → Hub-A → Spoke-A-02</li>\n<li><strong>Spoke-to-spoke across topologies:</strong> Spoke-A-01 → Hub-A → ER-GW-A → MSEE → ER-GW-B → Hub-B → Spoke-B-01</li>\n</ul>\n<p>Every spoke-to-spoke packet — whether within the same topology or across topologies — exits the data center, traverses MSEE, and re-enters. With 1,000 spokes generating east-west traffic, MSEE becomes a shared single point of failure and adds latency to every flow.</p>\n<h3>Target State — A Single AVNM Mesh with 1,000 VNets</h3>\n<p>Contoso's goal is to consolidate all 1,000 spoke VNets into a single AVNM mesh, removing MSEE from the east-west traffic path.</p>\n<ul>\n<li><strong>Spoke-to-spoke traffic, any pair:</strong> Spoke-A-01 → directly→ Spoke-B-01. Traffic stays in the data center and uses the direct mesh path.</li>\n<li><strong>MSEE role:</strong> MSEE carries north-south on-premises traffic. East-west load is removed from the ExpressRoute hairpin path.</li>\n</ul>\n<h3>Migration Execution</h3>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<h4>Phase 0 — Pre-Work</h4>\n<ul>\n<li><strong>Register the feature.</strong> Since the mesh contains 1,000 VNets, above the 250 standard limit, Contoso registers the <strong>AllowHighScaleConnectedGroup</strong> feature flag on the subscription. This enables high-scale mesh support for up to 5,000 VNets.</li>\n<li><strong>Inventory Private Endpoints.</strong> With 10,000 Private Endpoints across 1,000 VNets, Contoso exceeds the standard mesh Private Endpoint limit of 2,000. HSPE must be enabled.</li>\n</ul>\n<h4>Phase 1 — Enable HSPE on All 1,000 Spoke VNets</h4>\n<ul>\n<li><strong>Batch 1:</strong> Enable HSPE on all 500 spoke VNets in Topology A during the maintenance window by following <a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration#prepare-each-virtual-network-in-the-connected-group\" rel=\"noopener\" target=\"_blank\">the instructions</a>.</li>\n<li><strong>Batch 2:</strong> Apply the same configuration to all 500 spokes in Topology B.</li>\n<li><strong>Expected impact:</strong> Each VNet may experience a brief connection reset for existing Private Endpoint connections when HSPE is enabled. Schedule the change during a maintenance window.</li>\n</ul>\n<h4>Phase 2 — Create the AVNM Mesh</h4>\n<ol>\n<li>Create a Network Manager scoped to the management group containing all 1,000 spoke VNets.</li>\n<li>Define a single network group called <strong>eastus-mesh-all-spokes</strong> with dynamic membership using an Azure Policy and the tags.</li>\n<li>Create a mesh connectivity configuration. Set topology to <strong>Mesh</strong>, network group to <strong>eastus-mesh-all-spokes</strong>, high-scale private endpoints to <strong>Enabled</strong>, and global mesh to <strong>Not needed</strong> because all VNets are in the same region.</li>\n<li>Save the configuration as a draft and do not deploy yet.</li>\n</ol>\n<h4>Phase 3 — Incremental Deployment</h4>\n<p><strong>Wave 1 — Pilot:</strong> Contoso deploys the mesh configuration to 50 dev/test spokes, either by using a temporary network group or by tagging only those VNets initially. Validation includes effective routes showing <strong>ConnectedGroup</strong> as the next-hop type for meshed spoke prefixes, spoke-to-spoke connectivity through the direct mesh path, Private Endpoint reachability across meshed spokes, unchanged on-premises connectivity through the hub and MSEE, and VNet flow logs that confirm expected direct spoke-to-spoke flows.</p>\n<p><strong>Wave 2 — Light production traffic VNets:</strong> After a successful pilot, Contoso tags light production traffic VNets. The dynamic network group picks them up automatically. Contoso redeploys the connectivity configuration, runs the same validation checklist, and monitors traffic to confirm that east-west traffic from these VNets is moving away from the ExpressRoute hairpin path.</p>\n<p><strong>Wave 3 — All remaining production VNets:</strong> Contoso tags all remaining spokes and redeploys the configuration. At this point, all 1,000 spokes are in the mesh.</p>\n<p><strong>No downtime migration:</strong> During Waves 2 and 3, existing MSEE hairpin routing remains functional. VNets not yet in the mesh continue to communicate through MSEE. VNets already in the mesh communicate directly through the mesh. This avoids a planned connectivity gap during migration.</p>\n<h4>Phase 4 — Post-Migration Validation</h4>\n<p>After deployment, confirm that mesh is active and traffic is taking the expected path before decommissioning the legacy route.</p>\n<ol>\n<li><strong>Effective routes.</strong> Verify spoke subnets show direct routes to peer VNet prefixes instead of routing through the gateway or MSEE.</li>\n<li><strong>Connection Monitor.</strong> Track representative spoke-to-spoke flows and compare latency and reachability before and after migration.</li>\n<li><strong>VNet flow logs.</strong> Confirm east-west traffic matches the expected mesh path and is not still traversing the ExpressRoute gateway path.</li>\n<li><strong>Network Watcher topology.</strong> Visualize the resulting connectivity model and identify any VNets not enrolled in the target network group.</li>\n</ol>\n<p>If traffic is still hairpinning after mesh deployment, check for UDRs overriding system routes, spokes missing from the network group, deployment not committed to the target region, or IaC pipelines recreating legacy peerings.</p>\n<h4>Rollback</h4>\n<ul>\n<li><strong>Quick rollback while MSEE remains in place.</strong> Remove affected VNets from the network group or undeploy the mesh connectivity configuration. AVNM removes only the connectivity it created, and traffic can fall back to the existing MSEE hairpin path.</li>\n<li><strong>Rollback after decommissioning legacy paths.</strong> If old peerings or route dependencies have already been removed, rollback may require reprovisioning those resources and should be treated as a longer change window.</li>\n<li><strong>Recommendation.</strong> Keep the MSEE hairpin path available for at least two weeks after mesh deployment, monitor traffic patterns, and only then remove the legacy path.</li>\n</ul>\n<h2>Before and After Summary</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td style=\"border-width: 1px;\">\n<p>Metric</p>\n</td><td style=\"border-width: 1px;\">\n<p>Before (MSEE Hairpin)</p>\n</td><td style=\"border-width: 1px;\">\n<p>After (AVNM HSPE Mesh)</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Spoke-to-spoke latency in the same region</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Higher due to the MSEE hairpin path</p>\n</td><td style=\"border-width: 1px;\">\n<p>Lower-latency direct in-datacenter path; actual latency depends on workload, region, and network conditions</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Traffic path for east-west</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Spoke → Hub → MSEE → Hub → Spoke</p>\n</td><td style=\"border-width: 1px;\">\n<p>Spoke → Spoke directly through the Mesh</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>MSEE dependency for east-west</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Yes, shared dependency</p>\n</td><td style=\"border-width: 1px;\">\n<p>No MSEE dependency for east-west traffic</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Manual peerings required</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>0 when using hairpin routing, but 499,500 if built manually for 1,000 spokes</p>\n</td><td style=\"border-width: 1px;\">\n<p>0 manual spoke-to-spoke peerings; AVNM manages connectivity</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Private Endpoints supported</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>2,000 per mesh under standard limits</p>\n</td><td style=\"border-width: 1px;\">\n<p>20,000 per mesh with HSPE</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Rollback complexity</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Not applicable to the current hairpin model</p>\n</td><td style=\"border-width: 1px;\">\n<p>Remove VNets from the network group or undeploy the connectivity configuration</p>\n</td></tr><tr><td style=\"border-width: 1px;\">\n<p><strong>Migration downtime</strong></p>\n</td><td style=\"border-width: 1px;\">\n<p>Not applicable</p>\n</td><td style=\"border-width: 1px;\">\n<p>Designed for no planned downtime when deployed incrementally and validated carefully</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h2>Closing Notes</h2>\n<p>Migrating to AVNM mesh does not require tearing down your existing network. The hub gateway, firewalls, and NVAs continue to function as they do today. What changes is that east-west spoke-to-spoke traffic stops leaving the data center unnecessarily.</p>\n<ul>\n<li><strong>MSEE is not the right tool for the east-west fabric.</strong> Removing internal traffic from the ExpressRoute circuit is a reliability and capacity improvement.</li>\n<li><strong>AVNM mesh replaces combinatorial complexity with group-based intent.</strong> The operational model scales with the number of groups, not the number of VNets.</li>\n<li><strong>High-scale mesh and HSPE remove the ceiling</strong> — up to 5,000 VNets and 20,000 Private Endpoints per mesh.</li>\n<li><strong>The migration is incremental and reversible.</strong> Mesh coexists with existing paths, and you can validate wave by wave before decommissioning the legacy route.</li>\n</ul>\n<p>Start with a pilot mesh in a non-critical environment, validate the traffic shift, and expand from there.</p>\n<h2>Resources</h2>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration\" rel=\"noopener\" target=\"_blank\">Connectivity configurations in Azure Virtual Network Manager</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/private-link/increase-private-endpoint-vnet-limits\" rel=\"noopener\" target=\"_blank\">Increase Private Endpoint virtual network limits</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/how-to-create-mesh-network\" rel=\"noopener\" target=\"_blank\">Create a mesh topology with Azure Virtual Network Manager</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins\" rel=\"noopener\" target=\"_blank\">Security admin rules in Azure Virtual Network Manager</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/create-virtual-network-manager-terraform\" rel=\"noopener\" target=\"_blank\">Create a mesh network topology with Azure Virtual Network Manager using Terraform</a></li>\n</ul>\n<p>&nbsp;</p>"
