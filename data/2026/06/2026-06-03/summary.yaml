  この日は Build 2026 前後の大量アップデートで、32 件が一度に公開されました。AI 分野では Azure AI Translator の PDF バッチ翻訳の改善、画像ファイルの翻訳、Office 文書内の画像翻訳がいずれも一般提供となり、Azure AI Search は OneLake カタログ統合をナレッジソースとして GA しています。インフラでは Azure Linux 4.0 のパブリックプレビュー、AKS 向けの Azure Container Linux の一般提供、Cobalt 200 Arm ベース VM シリーズのプレビュー、VMSS Flex の自動 OS イメージアップグレードが登場しました。監視では Azure VM と Arc サーバー向けの OpenTelemetry メトリクスが GA、ログ検索アラートの動的しきい値も一般提供です。API Management は Premium v2 / Standard v2 でワイルドカードカスタムホスト名に対応し、複数 LLM プロバイダーを扱う統合モデル API のプレビューも始まりました。このほか Azure Container Apps Sandboxes が一般提供となりました。エージェント型アプリケーション、マルチテナントのプラットフォーム、開発環境、CI/CD システムを作るチームは、信頼できないコードを安全に実行し、セッションをまたいで状態を保ち、突発的な需要をさばくために独自のインフラストラクチャを継ぎ合わせる必要がありましたが、それを置き換えるものです。
