    "title": "Kubernetes Center: Security & LTS/Out-of-Support Version Insights Now Available"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/kubernetes-center-security-lts-out-of-support-version-insights/ba-p/4524567"
    "published": "2026-06-02 03:30:12"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>What's New</strong></p>\n<p><strong>Security Insights:&nbsp;</strong></p>\n<img />\n<p>&nbsp;</p>\n<p>The new Security page in Kubernetes Center gives you an immediate, all clusters or Kubernetes Fleet Manager-wide view of your security posture without leaving the portal.</p>\n<p>At the summary level you can see:</p>\n<ul>\n<li><strong>Security vulnerabilities</strong> broken down by risk level</li>\n<li><strong>Runtime alerts</strong>&nbsp;categorized by severity</li>\n<li><strong>Non-compliant regulatory standards</strong>, with visibility into which benchmarks your clusters are falling short on</li>\n</ul>\n<p>Drilling deeper into the security detail view exposes four distinct panels:</p>\n<p><strong>Security Vulnerabilities</strong> show a total count of vulnerabilities across all clusters, broken down by risk tier.</p>\n<p><strong>Runtime Alerts</strong> surfaces live alerts from Defender for Containers categorized by High, Medium, Low, and Informational severity. You can see at a glance whether any active threats require immediate attention, and drill into the full alert list with one click.</p>\n<p><strong>Misconfigurations</strong> show a count of configuration issues detected across your clusters, again broken down by risk level.</p>\n<p><strong>Regulatory Compliance Standards</strong> lets you see which compliance standards your clusters are enrolled in, which are passing, and which are failing. The view surfaces the lowest-performing standard with its pass rate, so you know exactly where to focus remediation effort.</p>\n<p><strong>Recommendations</strong> are shown alongside these panels, providing actionable and prioritized guidance. Each recommendation shows affected resource counts and links directly to remediation details.</p>\n<p><strong>Note: Security insights require Microsoft Defender for Containers to be enabled. Kubernetes Center will confirm at a glance whether all your clusters have it enabled.</strong></p>\n<p>&nbsp;</p>\n<p><strong>Cluster Version Support Status: Stay Ahead of End-of-Support</strong></p>\n<p>Running an out-of-support Kubernetes version is one of the most common and preventable sources of risk in production environments. The new Cluster Version Support Status panel in Kubernetes Center gives you a clear picture of where every cluster stands.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>The view breaks your clusters down into four states:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td>\n<p><strong>Status</strong></p>\n</td><td>\n<p><strong>What it means</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p><strong>In support</strong></p>\n</td><td>\n<p>Running a supported Kubernetes version. No action needed.</p>\n</td></tr><tr><td>\n<p><strong>Expiring soon</strong></p>\n</td><td>\n<p>Version support is ending soon. Plan your upgrade.</p>\n</td></tr><tr><td>\n<p><strong>Out of support (LTS eligible)</strong></p>\n</td><td>\n<p>Out of support but eligible for Long Term Support. An easy path to extend coverage.</p>\n</td></tr><tr><td>\n<p><strong>Out of support</strong></p>\n</td><td>\n<p>No longer supported and not LTS eligible. Upgrade required.</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>You can filter the view by cluster tier (Premium, Standard, or Free) to understand exposure by tier and prioritize accordingly.</p>\n<p>For clusters that are out of support but LTS eligible, a single Enable LTS for Eligible Clusters button lets you act immediately without navigating away.</p>\n<p>Kubernetes Center brings this into a single, always-on view so platform teams can:</p>\n<ul>\n<li>Catch version drift before it becomes an incident</li>\n<li>Spot misconfiguration patterns across clusters, not just within one</li>\n<li>Act on recommendations without switching tools</li>\n<li>Report on compliance posture without manual aggregation</li>\n</ul>\n<p><strong>Try It Out</strong></p>\n<p>These features are available now in Kubernetes Center in the Azure portal.</p>\n<p><strong>→ <a class=\"lia-external-url\" href=\"https://portal.azure.com/?Microsoft_Azure_KubernetesFleet=https%3A%2F%2Flocalhost#view/Microsoft_Azure_KubernetesFleet/KubernetesHub.MenuView/~/securityCenter\" rel=\"noopener\" target=\"_blank\">Open Security -Kubernetes Center in the Azure portal</a></strong></p>\n<p>We'd love to hear what you think. Try the new security and version views with your clusters and share your feedback directly through the portal using the feedback button.</p>\n<p><strong>FAQ</strong></p>\n<p><strong>Do I need Microsoft Defender for Containers enabled to use the security features?</strong> Yes. Security vulnerabilities, runtime alerts, and misconfiguration data are powered by MS Defender for Containers. Kubernetes Center will show you if any clusters don't have it enabled so you can quickly close that gap.</p>\n<p><strong>Does this work across all my subscriptions and clusters?</strong> Kubernetes Center aggregates data across all AKS clusters you have access to. Make sure you have the appropriate RBAC permissions across the subscriptions you want visibility into.</p>\n<p><strong>What is LTS and should I enable it for eligible clusters?</strong> Long Term Support (LTS) extends the supported lifecycle of a Kubernetes version beyond its standard window. It's available for clusters on eligible versions running the Premium tier. If you have clusters showing \"Out of support, LTS eligible,\" enabling LTS is the fastest way to restore support coverage while you plan a full version upgrade.</p>\n<p><strong>Is there a cost to use Kubernetes Center?</strong> Kubernetes Center itself is part of the Azure portal experience and there is no additional charge. Note that Microsoft Defender for Containers, which powers the security features, is a paid add-on. See the <a class=\"lia-external-url\" href=\"https://azure.microsoft.com/pricing/details/defender-for-cloud/\" rel=\"noopener\" target=\"_blank\">Defender for Containers pricing page</a> for details.</p>\n<p><strong>Where can I learn more about the Kubernetes version lifecycle?</strong> See the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/aks/supported-kubernetes-versions\" rel=\"noopener\" target=\"_blank\">AKS Kubernetes version support policy documentation</a> for full details on version support windows, LTS eligibility, and upgrade guidance.</p>\n<p>&nbsp;</p>"
