    "title": "Maia 200: Software-defined dataflow and all-Ethernet networking for efficient inference on Azure"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/maia-200-software-defined-dataflow-and-all-ethernet-networking/ba-p/4548198"
    "published": "2026-08-26 23:40:52"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><em>By Sherry Xu, Prashant Ranjan, Torsten Hoefler</em></p>\n<p>&nbsp;</p>\n<p>As we enter the era of frontier-scale intelligence, the economics of AI are increasingly determined not by peak compute performance but by how efficiently an entire system can generate tokens at scale. Production inference workloads are rapidly expanding beyond interactive chat toward an array of Copilots, coding assistants, deep reasoning, multimodal experiences, agentic workloads, and synthetic data generation. Azure Maia 200, Microsoft’s second-generation AI accelerator, is our latest custom silicon, engineered from the ground up for efficient inference at cloud scale.</p>\n<p>At approximately <a class=\"lia-external-url\" href=\"https://blogs.microsoft.com/blog/2026/01/26/maia-200-the-ai-accelerator-built-for-inference/\" rel=\"noopener\" target=\"_blank\">30% better performance per dollar</a> than the latest-generation GPUs in Microsoft’s fleet, Maia 200 is built on one central principle: that co-optimizing the models, application harnesses, reinforcement learning environments, kernels, communication library, systems, and custom silicon will lead to the best customer outcomes – per token, per watt, and per dollar.&nbsp;</p>\n<p>There is no single specification that can achieve this, and no equation that drives faster math. System-level efficiency emerges from co-optimizing models, software, data placement, communication, and silicon together. At <strong>Hot Chips 2026</strong>, we are pleased to share the foundation behind that effort: the Software-defined Local Access architecture embodied in Maia 200.</p>\n<h3><span class=\"lia-text-color-21\"><strong>Inference is becoming a systems challenge</strong></span></h3>\n<p>Inference is no longer a compute problem alone—it is a systems problem that spans memory, networking, and software. As the range of production inference use cases continues to expand, workloads have also become more diverse and demanding.</p>\n<p>Different phases of inference place different stresses on infrastructure: processing an initial prompt often requires substantial compute, while generating tokens over time can become constrained by memory bandwidth and communication. Emerging model architectures, including Mixture-of-Experts designs, sparse execution techniques, and advanced KV-cache strategies, further increase the importance of efficiently moving and managing data. At the same time, the largest models now span many accelerators, making communication between devices a critical factor in overall performance.</p>\n<p>Meeting these demands requires optimizing for more than peak operations per second. An effective inference platform must deliver high throughput, low latency, reliability, and model quality while minimizing cost and energy per token. Maia 200 was designed with this broader objective in mind, and approaches this challenge using the architectural principles of Software-defined Local Access—both inside the accelerator and scaling to an all-Ethernet architecture that extends explicit memory orchestration across the system.<br /><br /></p>\n<img />\n<h3><span class=\"lia-text-color-21\"><strong>Software-defined Local Access: making movement explicit</strong></span></h3>\n<p>Software-defined Local Access, or SDLA, is a dataflow architecture that gives software direct control over how data moves between high-bandwidth memory and localized, highly specialized SRAMs. Rather than relying on implicit cache behavior, SDLA separates control from data movement and gives software direct control over both memory movement and placement using Direct Memory Access (DMA) engines, compute engines, network operations, and synchronization. This approach helps the system achieve more predictable execution characteristics, enabling more consistent performance between runs.&nbsp;</p>\n<p>Maia 200 brings the SDLA principles together in a vertically co-designed system-on-chip. Its control, compute, memory, I/O, and synchronization structures are designed to operate concurrently rather than compete for a single control path. The purpose of the architecture is to keep the compute engines productively fed by placing, reshaping, moving, and synchronizing data efficiently.</p>\n<h3><strong>All-Ethernet networking: extending SDLA beyond the chip</strong></h3>\n<p>As models span accelerators, networking becomes part of the execution engine. Maia 200’s two-tier scale-up network applies an all-Ethernet approach, combining a standards-based physical and switching foundation with AI-specific endpoint hardware, transport, topology, congestion management, reliability mechanisms, and collective software.</p>\n<p>Maia 200 delivers scalable, predictable performance for large AI inference deployments through an advanced two-tier, Ethernet-based scale-up networking architecture. Intelligent load balancing distributes traffic across on-chip resources, while built-in resilience mechanisms quickly adapt to network disruptions. This enables customers to run dense inference workloads more efficiently, maximize cluster utilization, reduce stranded capacity, and lower overall infrastructure costs.</p>\n<p>We have contributed this direction to the&nbsp;<span class=\"lia-text-color-10\"><a class=\"lia-external-url\" href=\"https://ultraethernet.org/\" rel=\"noopener\" target=\"_blank\">Ultra Ethernet Consortium (UEC)’s AI base transport profile</a></span>, helping establish Ethernet as a common foundation for networking across the industry.<br /><br /></p>\n<img />\n<p><span class=\"lia-text-color-21\"><strong>Figure 1. </strong></span>Maia 200 uses a unified Ethernet hierarchy based on a variant of the HammingMesh topology: four accelerators form a directly connected quad, 48 accelerators form a rack-scale domain, and a two-tier switched network can scale to 6,144 accelerators.</p>\n\n<h3><strong>Sustaining performance across real AI workloads</strong></h3>\n<p>The value of the SDLA architecture appears in sustained kernel performance rather than peak specifications alone. To evaluate Maia 200 under realistic conditions, we measured performance across 6,143 matrix-multiplication shapes representative of production inference workloads. Across these scenarios, Maia 200 kept compute engines highly utilized, minimizing idle time by coordinating computation, memory, and communication as a single workload. Even as AI workloads shift between heavy computation (e.g., prompt processing), memory access (e.g., token generation), and communication (e.g., collective operations such as Allgather), Maia 200 maintains consistently predictable performance—treating the accelerator, memory, network, and software as one coordinated system.</p>\n<img />\n<p><span class=\"lia-text-color-21\"><strong>Figure 2. </strong></span>FP8 matrix-multiplication performance across the same set of inference-relevant shapes, showing high utilization across compute- and memory-bound operating points.</p>\n<img />\n<p><span class=\"lia-text-color-21\"><strong>Figure 3. </strong></span>Allgather performance on eight Maia 200 accelerators. Direct exchange minimizes latency for small transfers; ring exchange approaches the network bandwidth limit for larger transfers.</p>\n\n<h3><span class=\"lia-text-color-21\"><strong>From silicon to useful AI systems</strong></span></h3>\n<p>Maia 200 demonstrates Microsoft’s system co-design philosophy for model performance and efficiency. <span>Maia 200 delivers over <a class=\"lia-external-url\" href=\"https://microsoft.ai/pdf/mai-thinking-1.pdf\" rel=\"noopener\" target=\"_blank\">40% higher token generation</a> under the same rack power budget throughput when running the MAI-Thinking-1 model than other leading accelerators in the Azure fleet</span>. This efficiency is only possible by co-designing models, application frameworks, reinforcement-learning environments, kernels, communication libraries, systems software, and custom silicon as a unified stack. At the same time, Maia 200 maintains the flexibility to support a broad ecosystem of open models, enabling customers to optimize for both performance and choice.</p>\n<p>As Microsoft continues along a path of co-designing models and infrastructure, Maia 200 provides a foundation for improving quality, performance, cost, and energy efficiency for agentic inference workloads. We look forward to advancing these SDLA architectural principles in future generations of Maia system, and invite you to see the full details and data on Maia 200 operations in our <a class=\"lia-external-url\" href=\"https://arxiv.org/abs/2608.24664\" target=\"_blank\">latest paper on arXiv:</a><a href=\"https://arxiv.org/abs/2608.24664\" target=\"_blank\">[2608.24664] Maia 200: A Software Defined Dataflow System for Large-scale AI Acceleration</a>.</p>\n<p>To learn more, explore our blogs on Maia 200:&nbsp;</p>\n<ul>\n<li><a href=\"https://blogs.microsoft.com/blog/2026/01/26/maia-200-the-ai-accelerator-built-for-inference/\" rel=\"noopener\" target=\"_blank\">Maia 200: The AI accelerator built for inference</a></li>\n<li><a href=\"https://techcommunity.microsoft.com/blog/azureinfrastructureblog/deep-dive-into-the-maia-200-architecture/4489312\" rel=\"noopener\" target=\"_blank\">Deep dive into the Maia 200 architecture</a></li>\n</ul>"
  "92e47ea7434e8cb183425f4d22e9310b":
    "id": "92e47ea7434e8cb183425f4d22e9310b"
    "title": "Azure Copilot Introduces Direct Access to Agents"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/azure-copilot-introduces-direct-access-to-agents/ba-p/4547932"
    "published": "2026-08-26 01:20:21"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p>Whether you are troubleshooting an application issue at 2 a.m., validating a deployment plan before a release, optimizing cloud resources, or improving workload resiliency, the challenge is finding the right expertise quickly enough to act with confidence.</p>\n<p>That’s why we are evolving the <a href=\"https://azure.microsoft.com/en-us/products/copilot\" rel=\"noopener\" target=\"_blank\">Azure Copilot</a> experience.</p>\n<p>As of August 2026, customers can engage directly with&nbsp;<a href=\"https://aka.ms/learnmore-copilotagent\" rel=\"noopener\" target=\"_blank\">Azure Copilot agents</a>, bringing focused expertise closer to the task at hand. Rather than routing requests through a single chat experience, you can now choose the specific agent best suited to your goal and move more quickly from question to action.</p>\n<p>This new capability is a natural evolution of our vision for agentic cloud operations, making it easier for cloud ops teams to engage specialized AI expertise when and where they need it.</p>\n<h2><strong>Azure Copilot agents </strong></h2>\n<p>Every day, cloud operations teams balance a wide range of responsibilities from incident response and deployment planning to cost optimization and resiliency improvements. Those responsibilities often require different kinds of expertise.</p>\n<p>With this release, users can directly invoke four Azure Copilot agents from the Azure Copilot chat experience:</p>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/copilot/troubleshooting-agent\" rel=\"noopener\" target=\"_blank\">Troubleshooting agent</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/copilot/deployment-agent\" rel=\"noopener\" target=\"_blank\">Deployment agent </a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/copilot/optimization-agent\" rel=\"noopener\" target=\"_blank\">Optimization agent</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/copilot/resiliency-agent\" rel=\"noopener\" target=\"_blank\">Resiliency agent</a></li>\n</ul>\n<img />\n<p>Two additional agents in the Azure Copilot portfolio will continue to be available through their existing product experiences in the short term:</p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/aiops/observability-agent-overview\" rel=\"noopener\" target=\"_blank\">Observability agent</a> (generally available) through Azure Monitor</li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/migrate/azure-copilot-migration-agent?view=migrate\" rel=\"noopener\" target=\"_blank\">Migration agent</a> through Azure Migrate</li>\n</ul>\n<h2><strong>Why direct access matters</strong></h2>\n<h3>Faster paths to answers</h3>\n<p>When users know which expertise they need, they can now engage that agent directly rather than starting with a generalized experience. This streamlines the path between question and resolution, helping teams spend less time navigating experiences and more time addressing the task at hand. Whether you're investigating an outage, reviewing deployment readiness, or identifying optimization opportunities, direct engagement with a specialized agent helps move from intent to action more quickly.</p>\n<h3>More focused expertise from the start</h3>\n<p>Each Azure Copilot agent is purpose-built around a specific operational domain. By selecting the appropriate agent upfront, users establish the right context earlier in the conversation and begin working immediately with the expertise most relevant to their goal. The result is a more focused experience that helps teams stay aligned to the task at hand and receive guidance tailored to their specific operational challenge.</p>\n<h3>Adopt agents at your own pace</h3>\n<p>Organizations often want to introduce new AI experiences incrementally. Direct agent access makes that easier by allowing individual agents to be evaluated, enabled, and adopted based on organizational priorities. Teams can begin with the scenarios that matter most to them, validate outcomes, and expand usage over time as confidence grows.</p>\n<p>&nbsp;</p>\n<h2><strong>What does this mean in practice?</strong></h2>\n<p>Direct access to agents is designed around how cloud teams already work.</p>\n<p>When investigating a production issue, teams can engage the Troubleshooting Agent immediately rather than beginning in a generalized experience. For deployment planning and rollout activities, the Deployment Agent can provide specialized guidance. Organizations focused on efficiency can work directly with the Optimization Agent, while teams evaluating reliability and business continuity can engage the Resiliency Agent.</p>\n<p>By aligning expertise to the task from the outset, Azure Copilot helps teams move more quickly from investigation and planning to action.</p>\n<p>&nbsp;</p>\n<h2><strong>Enable adoption with flexible administration</strong></h2>\n<p>As organizations expand their use of AI-powered experiences, governance matters just as much as capability.</p>\n<p>With this update, Azure Copilot is moving away from preview sign-up and allowlisting requirements. Instead, administrators can manage agent availability directly through the Azure Copilot Admin Center. Global administrators can enable or disable individual agents independently, allowing organizations to pilot and validate specific experiences before rolling them out more broadly.</p>\n<p>This approach makes it easier to align AI adoption with internal governance, operational requirements, and organizational readiness.</p>\n<p>Organizations that have Azure Copilot disabled today will continue to have agents disabled unless Azure Copilot is enabled for their tenant.</p>\n<img />\n<h2><strong>Pricing</strong></h2>\n<p>There are no changes to Azure Copilot pricing as part of this August 2026 release. Enabling Azure Copilot does not require an additional subscription or licensing fee.</p>\n<p>Today:</p>\n<ul>\n<li>Troubleshooting Agent, Deployment Agent, Optimization Agent, Resiliency Agent, and Migration Agent are available at <strong>no additional charge</strong>.</li>\n<li>Observability Agent, which is generally available, continues to use its <strong>existing usage-based billing model</strong>.</li>\n</ul>\n<h2><strong>Looking ahead</strong></h2>\n<p>This release represents the next step in our vision for Azure Copilot: a collection of specialized AI experts that help cloud teams operate more effectively across the entire application and infrastructure lifecycle. Together, these capabilities lay the foundation for a future of agentic cloud operations, where purpose-built agents collaborate with teams across troubleshooting, deployment, optimization, resiliency, observability, and migration workflows.</p>\n<p>In the months ahead, customers can expect expanded capabilities across existing agents, and new administrative controls that provide even greater flexibility in how organizations adopt and manage AI-powered assistance.</p>\n<p>To learn more about Azure Copilot agents and how to get started, visit the <a href=\"https://aka.ms/learnmore-copilotagent\" rel=\"noopener\" target=\"_blank\">Azure Copilot documentation</a>.</p>"
