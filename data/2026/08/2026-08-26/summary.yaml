"overview": |
  この日は推論向けの自社シリコンと SRE エージェントが中心でした。Maia 200 について、ソフトウェア定義のデータフローとオール Ethernet ネットワーキングによる効率的な推論という設計思想が解説されています。フロンティア規模の知能の時代では、AI の経済性がピーク演算性能ではなく、システム全体がどれだけ効率よくトークンを生成できるかで決まるという観点が示されました。Azure SRE Agent には Live Reports がパブリックプレビューで追加され、チャットでダッシュボードを説明するとエージェントが構築し、開くたびに更新されます。あわせて VNet 統合が一般提供となり、エージェントの送信トラフィックを仮想ネットワーク経由で、データベースや Container Apps、AKS の API サーバーといったプライベートエンドポイントの背後にあるリソースへ届けられるようになりました。Azure Copilot もエージェントへの直接アクセスに対応しています。Intel Xeon 6 搭載の 248 / 372 vCPU の D/E v7 シリーズ VM も一般提供です。
