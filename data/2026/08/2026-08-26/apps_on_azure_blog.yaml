    "title": "Azure SRE Agent VNet integration is now generally available"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-sre-agent-vnet-integration-is-now-generally-available/ba-p/4549774"
    "published": "2026-08-26 00:00:00"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>VNet integration for Azure SRE Agent is now generally available. You can route outbound agent traffic through your virtual network to access resources behind private endpoints, including databases, Azure Container Apps, Azure Kubernetes Service (AKS) API servers, and more. Traffic routed through your VNet follows your existing routes, network security group rules, firewall policies, private DNS configuration, and network logging.</p>\n<h2>How VNet integration fits into Azure SRE Agent security</h2>\n<p>Azure SRE Agent provides complementary security controls for enterprise workloads:</p>\n<ul>\n<li><strong>VNet integration</strong>&nbsp;controls where outbound traffic can go and applies your routing, firewall, DNS, and network logging policies.</li>\n<li><strong>Identity and permissions</strong>&nbsp;provide the identity and authorization layer and determine which resources and connected systems the agent can access.</li>\n<li><strong>Tool policies and approvals</strong>&nbsp;control which operations the agent can run and when human review is required.</li>\n</ul>\n<p>VNet integration controls outbound traffic only, and not all Azure SRE Agent traffic routes through your virtual network.</p>\n<h2>What's new since preview: inspect network activity</h2>\n<p>Administrators can now inspect network activity from the Azure SRE Agent portal. Open&nbsp;<strong>Settings</strong>&nbsp;&gt;&nbsp;<strong>Workspace configuration</strong>&nbsp;&gt;&nbsp;<strong>Inspect</strong>.</p>\n<p>Run commands in the workspace shell to test which destinations the agent can reach. Use&nbsp;<strong>Network audit</strong>&nbsp;to review allowed and denied outbound requests and their policy decisions.</p>\n<p>Network audit covers agent egress-policy decisions. It isn't a complete network audit trail and doesn't replace logs from your firewall, DNS, proxy, or other network infrastructure.</p>\n<img />\n<p>Inspect network activity in Azure SRE Agent</p>\n<h2>Enable VNet integration</h2>\n<ol>\n<li>Prepare an empty, dedicated subnet that is&nbsp;/27&nbsp;or larger, in the same region as the agent, and delegated to&nbsp;Microsoft.App/environments.</li>\n<li><a class=\"lia-external-url\" href=\"https://sre.azure.com/\" rel=\"noopener\" target=\"_blank\">Create or open an Azure SRE Agent</a>.</li>\n<li>Select&nbsp;<strong style=\"color: rgb(30, 30, 30);\">Settings</strong><span style=\"color: rgb(30, 30, 30);\">&nbsp;&gt;&nbsp;</span><strong style=\"color: rgb(30, 30, 30);\">Workspace configuration</strong><span style=\"color: rgb(30, 30, 30);\">.</span></li>\n<li>Select <strong style=\"color: rgb(30, 30, 30);\">Azure VNet</strong><span style=\"color: rgb(30, 30, 30);\">, and then select&nbsp;</span><strong style=\"color: rgb(30, 30, 30);\">Browse subnets</strong><span style=\"color: rgb(30, 30, 30);\">.</span></li>\n<li>Choose the virtual network and delegated subnet, select <strong style=\"color: rgb(30, 30, 30);\">Connect</strong><span style=\"color: rgb(30, 30, 30);\">, and then save the configuration.</span></li>\n<li>Review the <strong style=\"color: rgb(30, 30, 30);\">On the infra network</strong><span style=\"color: rgb(30, 30, 30);\"> settings. If the agent needs a code repository, enable its provider or make sure your VNet allows outbound access to the repository host.</span></li>\n<li>Test access to a resource that requires the intended network path.</li>\n</ol>\n<p><strong>Note:</strong> After you connect a VNet, the agent remains in Azure VNet mode. Disconnect the VNet before switching to Limited or Unrestricted mode.</p>\n<h2>Learn more</h2>\n<p>For the original architecture overview and the design decisions behind VNet integration, read the preview announcement blog: <a href=\"\" rel=\"noopener\" target=\"_blank\">VNet integration for Azure SRE Agent (preview)</a>.</p>\n<p>For current requirements, routing details, limitations, and troubleshooting, see <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/sre-agent/network-integration\" rel=\"noopener\" target=\"_blank\">Azure SRE Agent network integration.</a></p>"
