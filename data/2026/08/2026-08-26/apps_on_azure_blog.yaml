    "title": "Azure SRE Agent: Introducing Live Reports"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-sre-agent-introducing-live-reports/ba-p/4549732"
    "published": "2026-08-26 00:00:00"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p><span>Today we're introducing </span><strong><span>Live Reports</span></strong><span>&nbsp;in Azure SRE Agent, now in public preview.&nbsp;You describe a dashboard in&nbsp;chat;&nbsp;the agent builds it, and it&nbsp;refreshes&nbsp;every time you open it.</span><span>&nbsp;</span></p>\n<p>Ops teams ask the same handful of questions every morning: What's burning right now? What landed overnight? Who's on call? The answers usually live across multiple browser tabs, a one-off script only one person can run, or a chat prompt retyped daily and re-read as a fresh wall of text. Live Reports provides the missing piece: somewhere to author a view once and consume it many times.</p>\n<p>&nbsp;</p>\n<img />\n<h2><span><span>Frozen structure, live data</span></span><span>&nbsp;</span></h2>\n<p>This is the core design decision: the layout is deterministic, and the data is live.</p>\n<p><span><span>The agent authors the page once, then freezes it. Charts, thresholds, column order, and styling stay put. What refreshes on every open are the tool calls embedded in the page, so the shape is identical each morning, and the numbers are up to date.</span></span></p>\n<p>That's what separates a Live Report from a dashboard an LLM regenerates on every view. The chart looks consistent every day, and the page loads like a standard web page rather than a streaming chat response because there's no model in the render path.</p>\n<p>This leads to a key operational benefit: you only spend tokens when authoring the report. Opening a report built purely on tool calls uses no additional model tokens, no matter how many times you open it. (Reports that opt into AI-powered interpretation are the exception, as explained below.) This makes it practical for your entire team to open the report every morning without incurring ongoing LLM costs.</p>\n<p>When you want changes, simply ask the agent. It will edit the page in place and save a new version, preserving earlier revisions so you can always reference previous configurations.</p>\n<h2><span><span><span><span>Wha</span><span>t</span><span>&nbsp;</span><span>you can build</span></span>&nbsp;</span></span></h2>\n<p>Report data sources include the connectors your agent already has access to: any connected MCP server, logs and metrics, source control, work items, and internal services.</p>\n<p>Charts are real visualizations. Reports pull vetted charting and grid libraries from a CDN, giving you interactive, sortable tables and graphics rather than static markdown tables.</p>\n<p><span><span><span>Reports can also reason at view time. Alongside tool calls, a report can send a focused prompt to a fast, lightweight model as it renders: classify alerts by severity, group issues by likely root cause, or summarize a discussion thread into a single line. Every reload re-fetches and re-interprets the data, keeping real-time judgment aligned with the latest telemetry.</span></span></span></p>\n<blockquote>\n<p><span><span><span>Note: AI-powered interpretation consumes tokens each time the report loads, which is why it is strictly opt-in per report.</span></span></span></p>\n</blockquote>\n<p>&nbsp;</p>\n<img />\n<p><span>Reports can also take actions, but only the ones you wired in. A button invokes a write tool from a connector your agent is already connected to: acknowledge an incident, post to a discussion thread, assign an owner, open a work item. It cannot call an arbitrary URL or API of its own. Every button is limited to the exact tool names saved with that version of the report, and any tool that would ask for your approval in chat asks the same way when a button fires it. That's what turns a dashboard into something you operate from, without turning it into an open shell.</span><span>&nbsp;</span></p>\n<h2><span><span>The security model</span></span><span>&nbsp;</span></h2>\n<img />\n<p>A model-authored page capable of calling production tools requires strict guardrails. It is constrained across four layers:</p>\n<ul>\n<li><strong>Sandboxed origin:</strong> Reports render in an iframe with <em>sandbox=\"allow-scripts\"</em> and deliberately omit <em>allow-same-origin</em>, ensuring the page runs at an opaque origin with no access to session tokens or cookies.</li>\n<li><strong>Restricted network access:</strong> Report scripts cannot make direct API calls to arbitrary endpoints. All data requests route through the Live Reports runtime, which validates each call against the approved tool manifest for that specific report version.</li>\n<li><strong>Per-version allowlists:</strong> A report can only invoke the exact tools it was configured with. Any unapproved call is rejected server-side at runtime, rather than relying on prompt-level instructions.</li>\n<li><strong>Explicit human approval:</strong> When saving a report with connector access, the agent presents the exact tool descriptions provided by each connector. Nothing executes until you explicitly approve the configuration. Reports remain strictly bound to your agent's existing permission boundary.</li>\n</ul>\n<p><span><span>&nbsp;<span>Exports are sanitized to a static, offline-safe file, which is safe to attach to a postmortem.</span>&nbsp;</span></span></p>\n<h2><span><span><span><span>Getting started</span></span>&nbsp;</span></span></h2>\n<ol>\n<li>Open the <strong>Live Reports</strong> tab and select <strong>New report</strong>.</li>\n<li>Describe your scenario in chat. The agent will inspect your available connectors, ask clarifying questions if needed, and generate the layout.</li>\n<li>Review and approve the tool permissions to add the report to your gallery.</li>\n</ol>\n<h2><span><span>Wha</span><span>t</span><span>'s</span><span>&nbsp;next</span></span><span>&nbsp;</span></h2>\n<p>We're continuing to expand connector support, build richer visualization primitives, and tighten the loop between observability and automated remediation.</p>\n<p>The best reports are often the ones we didn't anticipate. What is the operational view your team finds itself rebuilding by hand? Let us know in the comments.</p>\n<p><span>\U0001F449&nbsp;</span><a class=\"lia-external-url\" href=\"http://aka.ms/sreagent\" rel=\"noopener\" target=\"_blank\"><span>Try Live Reports in Azure SRE Agent</span></a></p>"
  "7ebc796ca967b2183b5465427e72bf68":
