  この日は Foundry のエージェント選択という設計論と、VM の細かなチューニングが並びました。Microsoft Foundry Agent Service を巡る議論は最終的に「このワークロードは Prompt Agent と Hosted Agent のどちらで実装すべきか」という問いに行き着く、という観点から選択基準が整理されています。サービス更新では VM の vCore カスタマイズが一般提供となり、同時マルチスレッディングの無効化と制約付きコア数の設定が可能になりました。Azure Site Recovery は事前にプロビジョニングした既存の NIC をターゲットリージョンで使える BYON に対応しています。開発ツールでは MSSQL 拡張機能から Azure SQL Database を無償でプロビジョニングして接続できるようになり、SQL Formatter もプレビューで追加されました。
