    "title": "Advertised gateway prefixes in Azure"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/advertised-gateway-prefixes-in-azure/ba-p/4550940"
    "published": "2026-08-29 05:09:00"
    "fetched": "2026-08-30 02:57:34"
    "summary": "<h1>Introduction</h1>\n<p>Large Azure hub-and-spoke environments can advertise a significant number of routes toward on-premises networks. By default, Azure VPN Gateway and ExpressRoute Gateway advertise the address spaces of the hub virtual network and the address spaces of peered spoke virtual networks that use gateway transit. As the number of spokes and address spaces grows, the border gateway protocol (BGP) route table grows as well.</p>\n<p>Advertised gateway prefixes provide a native way to summarize those Azure-side routes. The feature is configured on the hub virtual network through the <strong>summarizedGatewayPrefixes</strong> property, which is exposed in the Azure portal as <strong>Advertised gateway prefixes</strong>.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-16 lia-border-style-solid\" style=\"width: 97.6852%; height: 168px; border-width: 1px;\"><tbody><tr><td>\n<p class=\"lia-align-center\"><strong>Fewer BGP prefixes</strong></p>\n<p class=\"lia-align-center\">Replace many individual networks with one or more aggregated CIDRs.</p>\n</td><td>\n<p class=\"lia-align-center\"><strong>Better scale management</strong></p>\n<p class=\"lia-align-center\">Help large hub-and-spoke designs stay within advertised-prefix limits.</p>\n</td><td>\n<p class=\"lia-align-center\"><strong>Cleaner route visibility</strong></p>\n<p class=\"lia-align-center\">Make the intended Azure address plan easier to recognize on provider and on-premises route views.</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>In this blog we will demonstrate leveraging Advertised gateway prefixes to summarize many Azure advertised prefixes into one.&nbsp;&nbsp;</p>\n<h1>What are advertised gateway prefixes?</h1>\n<p>Advertised gateway prefixes are summarized CIDR blocks that an Azure hybrid gateway advertises toward on-premises instead of advertising every covered hub and spoke address space individually. The configuration belongs on the gateway virtual network, usually the hub VNet that contains GatewaySubnet and the ExpressRoute or VPN gateway.</p>\n<h2>How the route advertisement changes</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-16 lia-border-style-solid\" style=\"width: 97.8704%; height: 277px; border-width: 1px;\"><tbody><tr><td>\n<p><strong>Default behavior</strong></p>\n</td><td>\n<p><strong>With advertised gateway prefixes</strong></p>\n</td></tr><tr><td>\n<p class=\"lia-align-left\">Hub: 10.27.0.0/24<br />Spoke 1: 10.27.1.0/24<br />Spoke 2: 10.27.2.0/24<br />Spoke 3: 10.27.3.0/24</p>\n</td><td>\n<p>Summary: 10.27.0.0/22</p>\n</td></tr><tr><td>\n<p>Four individual prefixes are advertised.</p>\n</td><td>\n<p>One summary prefix is advertised.</p>\n</td></tr><tr><td>\n<p>A spoke outside the summary is still advertised separately.</p>\n</td><td>\n<p>Example: 172.16.1.0/24 remains visible if it is not covered by 10.27.0.0/22.</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h1>When should you use it?</h1>\n<ul>\n<li>You use a hub-and-spoke topology with gateway transit and many spoke address spaces.</li>\n<li>You want to advertise a covering prefix, such as a /16, instead of many smaller prefixes, such as multiple /24 networks.</li>\n<li>You are approaching ExpressRoute advertised-prefix limits or want to reduce route-table growth before scale becomes a problem.</li>\n<li>Your Azure address plan is sufficiently structured to create safe, intentional summary ranges.</li>\n</ul>\n<p>&nbsp;</p>\n<p class=\"lia-align-left\"><strong>Note:</strong> ExpressRoute scale context: Microsoft documentation lists a maximum of 1,000 IPv4 prefixes and 100 IPv6 prefixes advertised from a virtual network to on-premises on a single ExpressRoute connection through private peering. Exceeding the connection prefix limit can cause the connection between the circuit and gateway to disconnect until the prefix count is reduced.</p>\n<h1>Prerequisites</h1>\n<ul>\n<li>A hub virtual network with GatewaySubnet.</li>\n<li>An ExpressRoute gateway or VPN gateway deployed in the hub virtual network.</li>\n<li>One or more peered spoke virtual networks if you want to demonstrate route summarization across spokes.</li>\n<li>A planned IPv4 and, when applicable, IPv6 summary that covers the intended hub and spoke address spaces.</li>\n<li>Access to the provider or on-premises BGP route view for validation. In this walkthrough, Megaport is used as the external verification point.</li>\n</ul>\n<h1>Configure advertised gateway prefixes in the Azure portal</h1>\n<p>The portal configuration is performed on the hub VNet, not on the ExpressRoute circuit and not on each spoke VNet.</p>\n<ol>\n<li><strong>In the Azure portal, search for Virtual networks and select the hub VNet that contains GatewaySubnet.</strong></li>\n</ol>\n<ul>\n<li>\n<ul>\n<li>Open the hub virtual network</li>\n</ul>\n</li>\n</ul>\n<img />\n<p>&nbsp;</p>\n<ol start=\"2\">\n<li><strong>Under Settings, select Address space.</strong></li>\n</ol>\n<ul>\n<li>\n<ul>\n<li>Open Address space</li>\n</ul>\n</li>\n</ul>\n<img />\n<p>&nbsp;</p>\n<ol start=\"3\">\n<li><strong>In Advertised gateway prefixes, select + Add prefix. Enter the covering CIDR, such as 10.0.0.0/22 for four contiguous /24 networks.</strong></li>\n</ol>\n<ul>\n<li>\n<ul>\n<li>Add the summarized prefix</li>\n</ul>\n</li>\n</ul>\n<img />\n<ol start=\"4\">\n<li><strong>For a dual-stack design, add IPv4 and IPv6 summarized prefixes explicitly.</strong></li>\n</ol>\n<ul>\n<li>\n<ul>\n<li>Add additional address families if needed</li>\n</ul>\n</li>\n</ul>\n<ol start=\"5\">\n<li><strong>Select Save and confirm the summarized prefixes remain listed in the Advertised gateway prefixes section.</strong></li>\n</ol>\n<ul>\n<li>\n<ul>\n<li>Save the configuration</li>\n</ul>\n</li>\n</ul>\n<img />\n<h1>Validate the summarized route on routers or provider</h1>\n<p>After Azure applies the change and BGP converges, I’m using ExpressRoute and Megaport here for my example, you can either log in to your router directly or view the incoming BGP routes via your provider’s interface to confirm what routes are being received from Azure. We want to capture a view that displays the BGP prefixes learned from the Azure side.</p>\n<ol>\n<li>Capture a baseline screenshot before enabling the feature, showing the individual hub and spoke prefixes.</li>\n<li>After configuration, refresh the route view and locate the new summarized prefix.</li>\n<li>Confirm that covered hub and spoke prefixes are no longer advertised individually.</li>\n<li>Confirm that any address space outside the configured summary remains advertised separately.</li>\n</ol>\n<p><strong>Before:</strong></p>\n<img />\n<p><strong>After:</strong></p>\n<img />\n<p>In my demo environment I have a hub and 20 spokes all within the 10.27.0.0/16 address prefix.&nbsp; We can see a successful implementation as before enabling the feature, I had a total of 21 prefixes being received at Megaport, after enabling the feature I have 1.&nbsp;</p>\n<h1>Important design considerations</h1>\n<p><strong>Configure the hub, not the spokes: </strong>Only the virtual network containing the gateway subnet uses the summarizedGatewayPrefixes property for this behavior. A value placed on a spoke VNet is ignored.</p>\n<p><strong>Avoid overlap within the prefix list:&nbsp;</strong>Do not configure overlapping entries in the advertised gateway prefixes list.</p>\n<p><strong>Expect uncovered networks to remain visible: </strong>If a hub or spoke address space is not covered by a configured summary, the gateway continues to advertise it individually.</p>\n<p><strong>Plan dual-stack explicitly: </strong>IPv4 and IPv6 summaries must be added separately.</p>\n<p><strong>Removing all entries restores default behavior: </strong>When every advertised gateway prefix is removed, Azure returns to advertising hub and peered spoke address spaces individually.</p>\n<p><strong>Protect the on-premises edge: </strong>Use appropriate route policies so only expected prefixes are accepted. Summarization simplifies advertisements, but it does not replace routing governance.</p>\n<h1>Conclusion</h1>\n<p>Advertised gateway prefixes give Azure networking teams a straightforward, native method to control route scale from a gateway-enabled hub VNet. Instead of sending every hub and spoke prefix across ExpressRoute or VPN connections, the gateway can advertise a concise list of summarized prefixes. The result is a smaller and more intentional route advertisement, while uncovered address spaces remain visible for compatibility.</p>\n<h1>References</h1>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/advertised-gateway-prefixes-overview\" rel=\"noopener\" target=\"_blank\">Advertised gateway prefixes in Azure virtual networks</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/how-to-advertised-gateway-prefixes\" rel=\"noopener\" target=\"_blank\">Configure advertised gateway prefixes using the Azure portal</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs\" rel=\"noopener\" target=\"_blank\">Azure ExpressRoute FAQ</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways\" rel=\"noopener\" target=\"_blank\">About ExpressRoute virtual network gateways</a></li>\n</ul>\n<p>&nbsp;</p>"
