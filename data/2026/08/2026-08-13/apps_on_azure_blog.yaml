  "af6f3fbd54735a0410746c89d377d5bd":
    "id": "af6f3fbd54735a0410746c89d377d5bd"
    "title": "Add AI to the workflows you already have using Serverless Agents in Azure Functions"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/add-ai-to-the-workflows-you-already-have-using-serverless-agents/ba-p/4544824"
    "published": "2026-08-13 07:51:34"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>There are a lot of ways to build with AI right now: chat frontends, copilots, greenfield agent apps, orchestration frameworks. All of them have their place, and some customers are building entirely new applications this way. But across customer engagements, a consistent pattern has emerged: <strong><em>the most successful and most cost-effective AI projects are not rewrites.</em></strong> They are existing, deterministic, event-driven business workflows (queue processing, message handling, scheduled jobs) with AI added at exactly the one step that was never deterministic to begin with. This enables the parts that are battle hardened to remain as before, adding AI where non-deterministic smarts are needed. This creates a more robust application along with spending costs for tokens only where beneficial.</p>\n<p><strong>That pattern has a natural home in Azure Function and Serverless Agents runtime now support non-Http triggers.</strong></p>\n<p>This post walks through the pattern in three layers: the app you already have, what it takes to add AI processing onto it yourself, and what it looks like with Serverless Agents. Learn and try it here: <a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/scenario-serverless-agents-runtime\" rel=\"noopener\" target=\"_blank\">Build serverless agents using Azure Functions | Microsoft Learn</a></p>\n<h1>The scenario: expense processing</h1>\n<p>Picture an expense approval pipeline. Expense and purchase-order requests arrive as messages on a queue: some as quick notes, some as forwarded emails, some as key-value text or JSON from intake tools. Most of the piping around the decision is deterministic and should stay that way: queueing, retries, policy storage, output queues, identity, and the audit trail. You do not want a language model reimplementing any of that.</p>\n<p>But one step in the middle has always resisted automation: understanding the request, choosing the policy that governs it, and applying a natural-language rulebook. <em>\"Booked a $450 round-trip flight to Denver for the customer onsite next week. — Albert\"</em> Turning that into a structured decision (amount, currency, vendor, category, policy applied, destination queue, reason) is exactly the kind of fuzzy, judgment-shaped work that used to mean either a human in the loop or a brittle pile of regexes and keyword lists.</p>\n<p>That one step is the AI part of the equation. Everything else stays as code.</p>\n<h1>Layer 1: the app you already have</h1>\n<p>If you're running message-based workloads on Azure Functions today, your expense processor looks something like this, using the standard Python v2 programming model with a queue trigger:</p>\nimport json\nimport azure.functions as func\napp = func.FunctionApp()\n \n@app.queue_trigger(arg_name=\"msg\", queue_name=\"expense-requests\",\n                   connection=\"AzureWebJobsStorage\")\ndef process_expense(msg: func.QueueMessage):\n    expense = json.loads(msg.get_body())\n    validate_expense(expense)\n    if is_duplicate(expense):\n        return\n    decision = apply_expense_policy(expense)\n    route_decision(decision)\n    write_audit_record(expense, decision)\n\n<p>This is good architecture, and nothing in this post asks you to change it. You get scale-out per message, retries with a poison queue after repeated failures, and scale to zero between messages. On the Flex Consumption plan you pay for execution, not for idle. The queue itself is doing real architectural work: it buffers spikes, absorbs backpressure, and decouples producers from processing.</p>\n<p>The limitation is only that process_expense can read only the schema for which it was written. Free text, email-shaped messages, and inconsistent key-value input require a parser before the deterministic policy code can use them, and selecting among category-specific policy documents means encoding more rules in code.</p>\n<h1>Layer 2: the do-it-yourself middle step</h1>\n<p>The obvious next move is to call a model from inside the function. The first version is deceptively short:</p>\n# Sketch of the DIY approach: this is the version that grows\nclient = get_model_client()          # SDK setup, endpoint, credential\nprompt = build_prompt(expense)       # prompt template you now maintain\nresponse = client.complete(prompt)   # plus retry/backoff for 429s\ndecision = parse_or_die(response)    # LLM output isn't always valid JSON\n\n<p>The problem isn't the first version. It's everything the first version turns into. Model SDK and auth wiring. Prompt templates living in Python strings. Retry and backoff logic for rate limits, on top of the queue's own retry semantics. Output parsing and re-prompting when the model returns almost-JSON. Then the requests start arriving: \"can it look up the current policy documents?\" (now you are building tool-calling), \"can it run a calculation?\" (now you need somewhere safe to execute generated code), \"why did it say that?\" (now you are building telemetry for model and tool activity). None of this is your expense pipeline. All of it becomes your code to own, patch, and secure.</p>\n<p>This is the middle step where a lot of AI-in-the-workflow projects stall, not because the idea was wrong, but because the glue outgrew the feature.</p>\n<h1>Layer 3: the same trigger, with the Serverless Agents runtime</h1>\n<p>The Serverless Agents runtime, collapses that middle layer. An agent is a markdown file, with instructions in the body and the trigger in YAML front matter, and it runs on the <em>same Azure Functions triggers you already use</em>. Here is the complete agent from the expense processor sample, expense_processor.agent.md:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 2111.85%; height: 1176px; border-width: 1px;\"><tbody><tr style=\"height: 1176px;\"><td style=\"height: 1176px;\">---\nname: Expense Processor\ndescription: Reads one expense or purchase-order request that arrives on a queue in any format — free text, email, key-value, or JSON — chooses the spending policy that fits the expense category from a set of policy documents, applies it, and routes the decision.\n \ntrigger:\n  type: queue_trigger\n  args:\n    queue_name: expense-requests\n    connection: AzureWebJobsStorage\n    data_type: string\n---\n \nYou are an expense-approval agent. Each queue message is **one** expense or purchase-order request as\nraw text — it might be a quick note, an email, `key: value` lines, or JSON. Finance keeps several\npolicy documents in storage: a general policy plus category-specific ones (travel, meals &amp;\nentertainment, equipment &amp; software). Your job is to understand the request, pick the policy that\ngoverns it, and route the decision.\n \nFor each message:\n \n1. **Extract** the details, whatever the format: `amount` (strip symbols, separators, and words —\n   `$1,250`, `1.250,00`, and `twelve hundred dollars` are all numbers), `currency` (default `USD`),\n   `vendor`, `category`, and an `expenseId` (use the one in the message, else generate `EXP-&lt;6 hex&gt;`).\n2. **Select the policy.** Call `list_expense_policies` to see each policy and what it covers, then\n   choose the one whose scope matches the expense. Use the general policy when nothing else fits.\n3. **Fetch it.** Call `get_expense_policy` with that document's exact name, and apply what it says.\n4. **Decide.** Work the policy's rules top to bottom; the first rule that matches wins. The amount is\n   the backbone — for an ordinary in-scope USD expense the policy's amount thresholds decide the\n   outcome, applied exactly at the boundaries. Never guess an exchange rate for a non-USD amount.\n   The result is one of three queues: `expense-approved`, `expense-review`, or `expense-flagged`.\n5. **Route** by calling `route_expense_decision` **once** with the destination queue and the decision\n   JSON. If it errors, carry on — still return the decision.\n6. **Respond** with the decision JSON so the outcome shows up in the logs:\n \n```json\n{ \"expenseId\": \"EXP-1001\", \"vendor\": \"United Airlines\", \"category\": \"travel\", \"amount\": 450.0, \"currency\": \"USD\", \"policyApplied\": \"travel-policy.md\", \"decision\": \"approve\", \"routedTo\": \"expense-approved\", \"reason\": \"Travel expense of 450 USD is at or below the travel policy's 1,000 auto-approve threshold.\" }\n```\n \nBase every decision only on the policy you just fetched — never on rules remembered from an earlier\nmessage. Keep `reason` to one sentence, and always set `policyApplied` to the document you used.\n\n<p>&nbsp;</p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p>Note what the front matter is: the same queue_trigger configuration you would pass to the Functions decorator: queue name, connection setting, and string data type. If you know Azure Functions triggers, you already know how to trigger an agent.</p>\n<p>The entire function_app.py is bootstrap:</p>\nfrom azure_functions_agents import create_function_app \napp = create_function_app()\n<p>And app-wide defaults live in agents.config.yaml:</p>\n# App-wide defaults for every agent in this function app.\n#\n# `model` is intentionally NOT set here so the runtime resolves it per provider:\n#   - deployed (foundry provider):  FOUNDRY_MODEL app setting        (e.g. gpt-5.4)\n#   - local (azure_openai provider): AZURE_OPENAI_DEPLOYMENT setting (e.g. gpt-5.4-mini)\n# Set AZURE_FUNCTIONS_AGENTS_MODEL to override in any environment.\ntimeout: 900\n\n<p>When a message lands on expense-requests, the runtime invokes the agent once for that one item. The trigger's data_type: string and the host's messageEncoding: \"none\" keep the raw text human-readable, while the runtime serializes the queue message body and metadata before adding them to the agent prompt. The agent's instructions do fuzzy work; the results show up in your Function App logs and Application Insights like any other execution.</p>\n<p>For the expense scenario, the pattern points directly at the intake queue: the agent extracts the amount, currency, vendor, category, and expense ID; calls list_expense_policies and get_expense_policy to choose and read the current policy from Blob Storage; applies the rules; and calls route_expense_decision to send the result to expense-approved, expense-review, or expense-flagged. Queueing, policy storage, identity, and routing stay deterministic; the agent gets responsibility for the part that needs judgment.</p>\n<h1>What changed between layer 2 and layer 3</h1>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-5 lia-border-color-15\" style=\"border-width: 1px;\"><thead><tr><td class=\"lia-border-color-15\">\n<p><strong>Concern</strong></p>\n</td><td class=\"lia-border-color-15\">\n<p><strong>DIY (layer 2)</strong></p>\n</td><td class=\"lia-border-color-15\">\n<p><strong>Serverless Agents (layer 3)</strong></p>\n</td></tr></thead><tbody><tr><td class=\"lia-border-color-15\">\n<p>Trigger &amp; scaling</p>\n</td><td class=\"lia-border-color-15\">\n<p>Yours (Functions)</p>\n</td><td class=\"lia-border-color-15\">\n<p>Yours (Functions, unchanged)</p>\n</td></tr><tr><td class=\"lia-border-color-15\">\n<p>Model client, auth, provider config</p>\n</td><td class=\"lia-border-color-15\">\n<p>Your code</p>\n</td><td class=\"lia-border-color-15\">\n<p>Runtime (Foundry, Azure OpenAI, or OpenAI)</p>\n</td></tr><tr><td class=\"lia-border-color-15\">\n<p>Prompt &amp; instructions</p>\n</td><td class=\"lia-border-color-15\">\n<p>Python strings</p>\n</td><td class=\"lia-border-color-15\">\n<p>Markdown agent file</p>\n</td></tr><tr><td class=\"lia-border-color-15\">\n<p>Trigger payload handling</p>\n</td><td class=\"lia-border-color-15\">\n<p>Manual parsing</p>\n</td><td class=\"lia-border-color-15\">\n<p>Raw queue payload and metadata injected by the runtime</p>\n</td></tr><tr><td class=\"lia-border-color-15\">\n<p>Tool calling</p>\n</td><td class=\"lia-border-color-15\">\n<p>Build it yourself</p>\n</td><td class=\"lia-border-color-15\">\n<p>MCP servers, connectors, plain-Python @tool functions</p>\n</td></tr><tr><td class=\"lia-border-color-15\">\n<p>Safe code execution</p>\n</td><td class=\"lia-border-color-15\">\n<p>Build it yourself</p>\n</td><td class=\"lia-border-color-15\">\n<p>Sandboxed via Azure Container Apps dynamic sessions</p>\n</td></tr><tr><td class=\"lia-border-color-15\">\n<p>Model/tool telemetry</p>\n</td><td class=\"lia-border-color-15\">\n<p>Build it yourself</p>\n</td><td class=\"lia-border-color-15\">\n<p>Built-in, flows to Application Insights</p>\n</td></tr><tr><td class=\"lia-border-color-15\">\n<p>Retries &amp; poison handling</p>\n</td><td class=\"lia-border-color-15\">\n<p>Queue semantics + your model retries</p>\n</td><td class=\"lia-border-color-15\">\n<p>Queue semantics, with dequeue_count right in the payload</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p>The economics follow from the architecture. On Flex Consumption, the app scales to zero between messages, so you pay when expense requests arrive, and the AI spend is confined to the single step that needs a model, instead of being architected into every request the way a chat-first design tends to force. This is a large part of why the augment-don't-rewrite engagements are the cost-effective ones: the deterministic 90% of the workload keeps running at deterministic-workload prices.</p>\n<h1>Use all Event Driven triggers</h1>\n<p>Queue Trigger is one row in a much longer table. The runtime supports the breadth of the Functions trigger model in .agent.md front matter: Service Bus queues and topics, Event Hubs, Event Grid, Blob Storage, Cosmos DB, Azure SQL, Kafka, timers, Dapr bindings, and connector triggers, alongside HTTP</p>\n<p>when you do want a chat endpoint. Wherever your events are already flowing, an agent can meet them there.</p>\n<p>&nbsp;</p>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<h1>Try it</h1>\n<p>The sample deploys with the Azure Developer CLI:</p>\ngit clone https://github.com/Azure-Samples/serverless-agents-expense-processor.git\ncd serverless-agents-expense-processor \nazd up\n<p>Then send one of the bundled requests to the provisioned expense-requests queue and read the decision queues:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>uv run scripts/send_expense.py --file samples/travel.txt --cloud\nuv run scripts/read_decision.py --queue all --peek --cloud\n\n<p>&nbsp;</p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p>The travel request is a $450 flight. Swap samples/travel.txt for samples/client-dinner.txt or samples/equipment.txt to see the same amount, select a different policy and route differently. The sample's README also covers running locally with Azurite and Core Tools.</p>\n<p>&nbsp;</p>\n<p>We are working on many more features to make it really easy for you to take your existing apps and make them intelligent, including Hybrid AI apps (your code + AI markdown binding), dynamic workflows and so on.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>"
  "e0a1c002d86cab0923d466835a266445":
    "id": "e0a1c002d86cab0923d466835a266445"
    "title": "Governing a Risk Operations Agent with the Microsoft Agent Framework Harness and AGT"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/governing-a-risk-operations-agent-with-the-microsoft-agent/ba-p/4546425"
    "published": "2026-08-13 06:00:13"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<h2>Introduction</h2>\n<p>I hope you have already found <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/auditing-and-telemetry-for-the-agent-governance-toolkit---getting-started-with-n/4533073\" rel=\"noopener\" target=\"_blank\">Auditing and Telemetry for the Agent Governance Toolkit - Getting Started with .NET Core</a>. This article demonstrates how you can leverage the Agent Governance Toolkit practically.</p>\n<p>This time, I'll take it a step further and combine the Microsoft Agent Framework Harness with AGT. The example is a file-access agent that operates on a local working directory.</p>\n<p>As soon as you let an agent touch files, a familiar set of requirements shows up:</p>\n<ul>\n<li>Listing, reading, and searching files should be allowed</li>\n<li>Creating, deleting, and overwriting files should not be</li>\n<li>That decision shouldn't be left entirely to the agent's prompt</li>\n<li>Blocked tool calls need to show up in an audit log</li>\n</ul>\n<p>This is exactly the kind of split where Harness answers \"what can the agent do\" and AGT answers \"should this particular call be allowed.\"</p>\n<p>The sample referenced throughout this post is here:</p>\n<p><a href=\"https://github.com/normalian/MyAGTSamples/tree/main/AGTPolicywithMAFApp03\" rel=\"noopener\" target=\"_blank\">https://github.com/normalian/MyAGTSamples/tree/main/AGTPolicywithMAFApp03</a></p>\n<h2>Dividing responsibility between Harness and AGT</h2>\n<p>Let's start by separating the two components' jobs.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Component</th><th>Responsibility</th></tr></thead><tbody><tr><td>Agent Framework Harness</td><td>Bundles the capabilities and tools an agent can use — file access, in this case</td></tr><tr><td>Agent Governance Toolkit</td><td>Evaluates each tool call against policy, allows or denies it, and emits the decision as an event</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>Harness is what shapes an agent's capabilities. In the sample, <strong>AsHarnessAgent()</strong> is given a <strong>FileSystemAgentFileStore</strong>, which exposes tools like <strong>file_access_ls</strong>, <strong>file_access_read</strong>, and <strong>file_access_grep </strong>to the agent.</p>\n<p>But just because Harness exposes a tool doesn't mean every call to it should execute. Applying AGT's <strong>.WithGovernance()</strong> afterward inserts a governance check into the pipeline right before the agent actually invokes a tool.</p>\n<p>In other words, it's not enough to tell the model \"please don't delete anything\" in the prompt — you can <strong>deny the delete tool at the execution layer even if the agent calls it.</strong></p>\n<h2>A closer look at the Microsoft Agent Framework Harness</h2>\n<p>Before going further, it's worth understanding what Harness itself actually does.</p>\n<p><strong>Microsoft.Agents.AI.Harness</strong> isn't just a package that bolts on some file-operation tools. It's an extension that assembles, as a ready-made pipeline, the pieces that long-running, repeatedly-tool-calling agents tend to need.</p>\n<p>A plain Agent Framework <strong>AIAgent</strong> already lets you configure tools, conversation history, the execution loop, and context management individually. But if every application has to reimplement the following on its own, the code gets complicated fast:</p>\n<ul>\n<li>The loop that executes function calls returned by the model and feeds results back</li>\n<li>Persisting conversation history that includes tool execution</li>\n<li>Compacting context that grows during long-running tasks</li>\n<li>Auxiliary capabilities like todos, file access, and sub-agents</li>\n<li>An approval flow before a tool actually executes</li>\n</ul>\n<p>Harness wires these long-task building blocks together, taking you from an <strong>IChatClient </strong>all the way to an <strong>AIAgent</strong>.</p>\n<h3>What's assembled inside <strong>HarnessAgent</strong></h3>\n<p>The reference material describes Harness's core as three layers:</p>\nIChatClient\n   │\n   ├─ FunctionInvokingChatClient\n   │    └─ the automatic loop that runs function calls and returns results\n   │\n   ├─ PerServiceCallChatHistoryPersistingChatClient\n   │    └─ persists history per service call\n   │\n   └─ AIContextProviderChatClient\n        └─ context management via Context Provider + compaction\n<p>Instead of wiring these together by hand, you call a single extension method:</p>\nAIAgent agent = chatClient.AsHarnessAgent(\n    maxContextWindowTokens,\n    maxOutputTokens,\n    new HarnessAgentOptions\n    {\n        Name = \"GovernedFileAccessAgent\",\n        ChatOptions = new ChatOptions\n        {\n            Instructions = \"An agent that investigates files.\",\n            Tools = [/* custom tools */],\n        },\n    });\n<p>Given an <strong>IChatClient</strong>, <strong>AsHarnessAgent()</strong> is the entry point for building a <strong>HarnessAgent</strong> designed for long-running tasks. In this sample, that call also takes a FileSystemAgentFileStore plus several additional options.</p>\n<blockquote>\n<p><strong>Microsoft.Agents.AI.Harness</strong> and the related <strong>AIContextProvider</strong> were experimental at the time this reference material was written. API shapes, tool names, and package versions may change, so check the official docs and release notes for the version you're using.</p>\n</blockquote>\n<h3>Compacting the context window</h3>\n<p>In a long-running agent, user instructions, model responses, function calls, and function results all accumulate in history. As that history approaches the model's context limit, there's no room left for new tool calls or results.</p>\n<p>Harness computes an input budget from <strong>maxContextWindowTokens </strong>and <strong>maxOutputTokens</strong>:</p>\nconst int maxContextWindowTokens = 1_050_000;\nconst int maxOutputTokens = 128_000;\n\nAIAgent agent = chatClient.AsHarnessAgent(\n    maxContextWindowTokens,\n    maxOutputTokens,\n    new HarnessAgentOptions { /* ... */ });\n<p>Conceptually, the input budget available for conversation history and tool results is whatever's left of the model's context limit after reserving room for the next response. As history grows, Harness's compaction mechanism compresses older history while trying to preserve what later reasoning still needs.</p>\n<p>That removes a lot of the code you'd otherwise write to manually truncate <strong>messages </strong>or summarize old tool results yourself. That said, compaction isn't \"preserve everything perfectly\" — if there's state you can't afford to lose, it's worth saving it explicitly through structured mechanisms like todos or file-based memory.</p>\n<h2>Sample project layout</h2>\n<p>Here's the shape of the sample:</p>\nAGTPolicywithMAFApp03/\n├── AGTPolicywithMAFApp03.csproj\n├── Program.cs\n├── policies/\n│   └── default.yaml\n└── working/\n    ├── sample.txt\n    └── notes/\n        └── details.txt\n<p><strong>working </strong>is the file store the agent operates against. The project file copies both the policy and this directory into the build output:</p>\n&lt;ItemGroup&gt;\n  &lt;None Include=\"policies\\default.yaml\"\n        CopyToOutputDirectory=\"PreserveNewest\" /&gt;\n  &lt;None Include=\"working\\**\\*\"\n        CopyToOutputDirectory=\"PreserveNewest\" /&gt;\n&lt;/ItemGroup&gt;\n<p>Paths are built relative to <strong>AppContext.BaseDirectory</strong> at runtime, so the sample doesn't depend on the current working directory.</p>\n<h2>Environment and packages</h2>\n<p>The sample targets .NET 10. Main packages (versions as of when the sample was written):</p>\n&lt;PackageReference Include=\"Azure.AI.OpenAI\" Version=\"2.9.0-beta.1\" /&gt;\n&lt;PackageReference Include=\"Azure.Identity\" Version=\"1.21.0\" /&gt;\n&lt;PackageReference Include=\"Microsoft.AgentGovernance\" Version=\"5.0.0\" /&gt;\n&lt;PackageReference Include=\"Microsoft.AgentGovernance.Extensions.Microsoft.Agents\"\n                  Version=\"5.0.0\" /&gt;\n&lt;PackageReference Include=\"Microsoft.Agents.AI\" Version=\"1.17.0\" /&gt;\n&lt;PackageReference Include=\"Microsoft.Agents.AI.Harness\" Version=\"1.17.0\" /&gt;\n&lt;PackageReference Include=\"Microsoft.Agents.AI.OpenAI\" Version=\"1.17.0\" /&gt;\n<p>Set the Azure OpenAI endpoint and sign in with the Azure CLI:</p>\nexport AZURE_OPENAI_ENDPOINT=\"https://your-resource.openai.azure.com/\"\nexport AZURE_OPENAI_DEPLOYMENT_NAME=\"gpt-5-mini\"\naz login\n<p>On Windows PowerShell:</p>\n$env:AZURE_OPENAI_ENDPOINT = \"https://your-resource.openai.azure.com/\"\n$env:AZURE_OPENAI_DEPLOYMENT_NAME = \"gpt-5-mini\"\naz login\n<p>Because the sample uses&nbsp;<strong>AzureCliCredential</strong>, there's no key to embed in the application.</p>\n<h2>Controlling file operations with policy</h2>\n<p><strong>policies/default.yaml</strong> allows the read-oriented tools and denies the mutating ones:</p>\napiVersion: governance.toolkit/v1\nversion: \"1.0\"\nname: governed-file-access-policy\n\n# Anything not explicitly denied is allowed in this sample\ndefault_action: allow\n\nrules:\n  - name: allow-file-access-read\n    condition: \"tool_name == 'file_access_read'\"\n    action: allow\n    priority: 10\n\n  - name: allow-file-access-ls\n    condition: \"tool_name == 'file_access_ls'\"\n    action: allow\n    priority: 10\n\n  - name: allow-file-access-grep\n    condition: \"tool_name == 'file_access_grep'\"\n    action: allow\n    priority: 10\n\n  - name: deny-file-access-write\n    condition: \"tool_name == 'file_access_write'\"\n    action: deny\n    priority: 100\n\n  - name: deny-file-access-replace\n    condition: \"tool_name == 'file_access_replace'\"\n    action: deny\n    priority: 100\n\n  - name: deny-file-access-replace-lines\n    condition: \"tool_name == 'file_access_replace_lines'\"\n    action: deny\n    priority: 100\n\n  - name: deny-file-access-delete\n    condition: \"tool_name == 'file_access_delete'\"\n    action: deny\n    priority: 100\n<p>The important part here is the combination of <strong>default_action </strong>and <strong>priority</strong>.</p>\n<p>Because this sample uses <strong>default_action: allow</strong>, any tool not covered by a rule is allowed by default. Mutating tools then get a higher-priority <strong>deny</strong>. Since <strong>ConflictStrategy.DenyOverrides</strong> is also configured, a deny wins whenever an allow and a deny conflict.</p>\n<p>For a stricter whitelist approach, switch to <strong>default_action: deny</strong> and explicitly <strong>allow</strong> only the tools you need. In production, that's worth considering — a whitelist means a newly added tool (from a Harness version bump, for example) doesn't get executed by accident.</p>\n<p>Note that <strong>tool_name</strong> is the function name Harness exposes. <strong>file_access_read</strong> and <strong>file_access_Read</strong> are different names, so the strings in your policy need to match the actual tool names exactly.</p>\n<h2>Wiring AGT into the Harness agent</h2>\n<p>The core of Program.cs:</p>\nusing AgentGovernance;\nusing AgentGovernance.Extensions.Microsoft.Agents;\nusing AgentGovernance.Policy;\nusing Azure.AI.OpenAI;\nusing Azure.Identity;\nusing Microsoft.Agents.AI;\nusing Microsoft.Extensions.AI;\n\nvar endpoint = Environment.GetEnvironmentVariable(\"AZURE_OPENAI_ENDPOINT\")\n    ?? throw new InvalidOperationException(\n        \"AZURE_OPENAI_ENDPOINT is not set.\");\nvar deploymentName =\n    Environment.GetEnvironmentVariable(\"AZURE_OPENAI_DEPLOYMENT_NAME\")\n    ?? \"gpt-5-mini\";\nvar workingDirectory =\n    Path.Combine(AppContext.BaseDirectory, \"working\");\n\nvar kernel = new GovernanceKernel(new GovernanceOptions\n{\n    PolicyPaths =\n    [\n        Path.Combine(AppContext.BaseDirectory, \"policies\", \"default.yaml\")\n    ],\n    ConflictStrategy = ConflictResolutionStrategy.DenyOverrides,\n});\n\nkernel.OnAllEvents(evt =&gt;\n{\n    Console.WriteLine(\n        $\"[Governance] Type: {evt.Type}, \" +\n        $\"Tool: {evt.PolicyName}, Agent: {evt.AgentId}\");\n});\n\nAIAgent agent = new AzureOpenAIClient(\n        new Uri(endpoint),\n        new AzureCliCredential())\n    .GetChatClient(deploymentName)\n    .AsIChatClient()\n    .AsHarnessAgent(new HarnessAgentOptions\n    {\n        Name = \"GovernedFileAccessAgent\",\n        Description =\n            \"Demonstrates governed read-only access to sample files.\",\n        FileAccessStore =\n            new FileSystemAgentFileStore(workingDirectory),\n        FileAccessProviderOptions = new FileAccessProviderOptions\n        {\n            DisableReadOnlyToolApproval = true,\n            DisableWriteToolApproval = true,\n        },\n        DisableTodoProvider = true,\n        DisableAgentModeProvider = true,\n        DisableAgentSkillsProvider = true,\n        DisableFileMemory = true,\n        DisableWebSearch = true,\n        ChatOptions = new ChatOptions\n        {\n            Instructions =\n                \"\"\"\n                You are a file access governance demonstration agent.\n                Use the file_access_* tools to inspect the sample files.\n                Read operations are allowed.\n                Write, delete, and replace operations are denied by governance.\n                \"\"\",\n        },\n    })\n    .WithGovernance(\n        kernel,\n        new AgentFrameworkGovernanceOptions\n        {\n            DefaultAgentId = \"governed-file-access-agent\",\n            EnableFunctionMiddleware = true,\n            BlockedToolResultFactory = toolResult =&gt;\n            {\n                Console.WriteLine(\n                    $\"[BLOCKED by Governance] \" +\n                    $\"{toolResult.AuditEntry.PolicyName}: \" +\n                    $\"{toolResult.Reason}\");\n                return\n                    $\"Tool call blocked by governance policy: \" +\n                    $\"{toolResult.Reason}\";\n            },\n        });\n<h3>What&nbsp;<strong>AsHarnessAgent()</strong> provides</h3>\n<p>Configuring <strong>AsHarnessAgent()</strong> with a <strong>FileSystemAgentFileStore</strong> gives the agent access to the file-operation tools.</p>\n<p>This sample turns off everything else Harness offers:</p>\nDisableTodoProvider = true,\nDisableAgentModeProvider = true,\nDisableAgentSkillsProvider = true,\nDisableFileMemory = true,\nDisableWebSearch = true,\n<p>That's just to keep the demo focused on file access. In a real application, enable only the capabilities you need, and write a policy for each corresponding tool — the more capabilities you turn on, the more surface area your policy and audit log need to cover.</p>\n<h3><strong>FileAccessProviderOptions</strong> vs. AGT</h3>\n<p><strong>DisableReadOnlyToolApproval</strong> and <strong>DisableWriteToolApproval</strong> control Harness's own approval flow. Turning them off does <strong>not</strong> disable AGT's policy evaluation.</p>\n<p>Harness answers \"how is the tool exposed,\" AGT answers \"should this call to it execute.\" An approval UI or human-in-the-loop check and a policy-enforced deny aren't alternatives to each other — they're two separate layers of defense you can combine.</p>\n<h3><strong>.WithGovernance()</strong> is the boundary</h3>\n<p>This is the part that actually joins the two together:</p>\n.WithGovernance(\n    kernel,\n    new AgentFrameworkGovernanceOptions\n    {\n        DefaultAgentId = \"governed-file-access-agent\",\n        EnableFunctionMiddleware = true,\n    })\n<p>With <strong>EnableFunctionMiddleware = true</strong>, AGT intercepts the agent's function calls. Even if the model's reasoning concludes \"write this file,\" the policy is consulted before the tool actually runs — and if that's a deny, it doesn't run.</p>\n<p><strong>BlockedToolResultFactory </strong>lets the application control what gets returned to the agent on a deny — useful for surfacing a user-facing explanation or attaching an audit ID.</p>\n<h2>Two agent IDs, on purpose</h2>\n<p>The sample deliberately uses two different identifiers.</p>\nName = \"GovernedFileAccessAgent\"\n<p>This is the Harness / Agent Framework side's agent name.</p>\nDefaultAgentId = \"governed-file-access-agent\"\n<p>This is the identifier AGT uses for policy evaluation and audit events.</p>\n<p>They don't need to match. In fact, keeping the framework-level display name separate from a stable governance/audit ID means you can rename the display name without losing continuity in your audit trail. If you're running multiple agents, it's worth deciding on a unique ID scheme up front that accounts for tenant and environment.</p>\n<h2>Running it</h2>\n<p>The sample walks through read, write, and delete in sequence:</p>\nConsole.WriteLine(\"=== Allowed read ===\");\nawait RunAndPrintAsync(\n    agent,\n    \"Use file_access_ls and file_access_read to list \" +\n    \"and read sample.txt. Do not modify any files.\");\n\nConsole.WriteLine(\"\\n=== Blocked write ===\");\nawait RunAndPrintAsync(\n    agent,\n    \"Use file_access_write to create blocked-write.txt \" +\n    \"with the text 'this write must be denied'.\");\n\nConsole.WriteLine(\"\\n=== Blocked delete ===\");\nawait RunAndPrintAsync(\n    agent,\n    \"Use file_access_delete to delete sample.txt. \" +\n    \"This operation must be denied by governance.\");\n<p>Run it with:</p>\ndotnet run --project AGTPolicywithMAFApp03/AGTPolicywithMAFApp03.csproj\n<p>Expected results:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Operation</th><th>AGT decision</th><th>Effect on files</th></tr></thead><tbody><tr><td><strong>file_access_ls</strong> / <strong>file_access_read</strong></td><td>allow</td><td><strong>sample.txt</strong> can be listed and read</td></tr><tr><td><strong>file_access_write</strong></td><td>deny</td><td><strong>blocked-write.txt</strong> is never created</td></tr><tr><td><strong>file_access_delete</strong></td><td>deny</td><td><strong>sample.txt</strong> is never deleted</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>On a denial, <strong>BlockedToolResultFactory</strong> returns something like:</p>\nTool call blocked by governance policy: ...\n<p>What matters isn't just that the agent gets an explanation — it's that&nbsp;<strong>the denied tool never actually executes.</strong> Even if a prompt injection or similar attack changes the agent's instructions mid-conversation, the write/delete boundary stays enforced at the execution layer as long as the policy is in place.</p>\n<h2>Using governance events for auditing</h2>\n<p>The sample writes every event to the console:</p>\nkernel.OnAllEvents(evt =&gt;\n{\n    Console.WriteLine(\n        $\"[Governance] Type: {evt.Type}, \" +\n        $\"Tool: {evt.PolicyName}, Agent: {evt.AgentId}\");\n});\n<p>That's fine for local development, but in production you'd want to send these to Application Insights or OpenTelemetry. At minimum, it's worth capturing:</p>\n<ul>\n<li>Agent ID</li>\n<li>Tool name</li>\n<li>The policy that applied</li>\n<li>The allow/deny outcome</li>\n<li>The reason for denial</li>\n<li>A correlation ID for the originating request</li>\n</ul>\n<p>Also design your logging so file contents and other sensitive arguments aren't written verbatim — separate what you need for auditing from data you shouldn't be persisting at all.</p>\n<h2>Choosing between <strong>default_action: allow</strong> and <strong>deny</strong></h2>\n<p>The sample uses <strong>default_action: allow</strong> to keep the walkthrough simple: allow everything Harness's read/write/delete/replace tools expose, and deny only the dangerous ones explicitly.</p>\n<p>In a real deployment, though, the two modes serve different purposes:</p>\n<h3>Deny-list approach</h3>\ndefault_action: allow\n<p>Broadly permissive, with specific dangerous operations explicitly blocked. Easy to adopt, but a newly introduced tool could end up allowed by default.</p>\n<h3>Allow-list approach</h3>\ndefault_action: deny\n<p>Every permitted tool has to be listed explicitly. More setup up front, but unknown tools fail safe.</p>\n<p>If the agent is going to operate against production data, default_action: deny is the safer baseline — start from nothing allowed and grant read access (with path conditions) incrementally. Combine that with per-agent IDs, per-environment policies, rate limiting, and circuit breakers for a stronger boundary overall.</p>\n<h2>Why this combination is worth it</h2>\n<p>Pairing Harness with AGT gives you four main benefits:</p>\n<ol>\n<li><strong>Capability and permission are separated.</strong> You can change what's executable through YAML policy alone, without touching the Harness configuration.</li>\n<li><strong>Denial happens at the execution layer, not the prompt.</strong> Deny rules apply at the tool-call boundary regardless of how the agent's instructions or conversation history change.</li>\n<li><strong>Decisions are auditable.</strong> Which agent, which tool call, which rule it matched, and why it was denied — all available as events.</li>\n<li><strong>Approval flows and enforced policy can coexist.</strong> Use Harness's approval features for UX, and AGT as the safety boundary that can't be crossed.</li>\n</ol>\n<p>None of this is specific to file access. The same pattern applies anywhere an agent is delegated a hard-to-reverse action — database writes, external API calls, closing a ticket, sending an email.</p>\n<h2>Summary</h2>\n<p>This sample built a read-only file-access agent through the following steps:</p>\n<ol>\n<li>Expose file-operation tools through Harness's FileAccessProvider</li>\n<li>Allow reads and deny write/delete/replace in AGT's YAML policy</li>\n<li>Insert the policy check into tool calls via .WithGovernance() and function middleware</li>\n<li>Use governance events and blocked-call results for auditing and user-facing feedback</li>\n</ol>\n<p>Harness gives an agent capability; the Agent Governance Toolkit draws the boundary around that capability. Getting an AI agent closer to production isn't just about adding useful tools — it's equally about being able to control, from outside the agent's own code, <strong>when, by whom, and under what conditions each tool can actually run.</strong></p>\n<p>Sample code for this post:</p>\n<p><a href=\"https://github.com/normalian/MyAGTSamples/tree/main/AGTPolicywithMAFApp03\" rel=\"noopener\" target=\"_blank\">https://github.com/normalian/MyAGTSamples/tree/main/AGTPolicywithMAFApp03</a></p>\n<h2>References</h2>\n<ul>\n<li><a href=\"https://zenn.dev/microsoft/articles/agent-governance-toolkit-policy-01\" rel=\"noopener\" target=\"_blank\">Previous post — Putting a \"gatekeeper\" in front of an AI agent</a></li>\n<li><a href=\"https://github.com/normalian/MyAGTSamples/tree/main/AGTPolicywithMAFApp03\" rel=\"noopener\" target=\"_blank\">MyAGTSamples — AGTPolicywithMAFApp03</a></li>\n<li><a href=\"https://github.com/microsoft/agent-governance-toolkit\" rel=\"noopener\" target=\"_blank\">Microsoft Agent Governance Toolkit</a></li>\n<li><a href=\"https://github.com/microsoft/agent-framework\" rel=\"noopener\" target=\"_blank\">Microsoft Agent Framework</a></li>\n<li><a href=\"https://microsoft.github.io/agent-governance-toolkit/tutorials/43-dotnet-maf-hook-integration/\" rel=\"noopener\" target=\"_blank\">Tutorial 43 — .NET MAF Hook Integration</a></li>\n</ul>"
