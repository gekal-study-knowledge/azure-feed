    "title": "Simplify secure, zone-resilient outbound connectivity with Azure Firewall and StandardV2 NAT Gateway"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/simplify-secure-zone-resilient-outbound-connectivity-with-azure/ba-p/4542573"
    "published": "2026-08-04 03:17:01"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><span>As organizations&nbsp;modernize their applications in Azure,&nbsp;secure&nbsp;and resilient outbound connectivity has become just as critical as&nbsp;inbound security. Workloads need reliable access to external APIs, SaaS services, operating system updates, and partner endpoints, while&nbsp;still meeting&nbsp;strong security controls, predictable&nbsp;egress&nbsp;IPs, and high availability.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>Achieving&nbsp;all of&nbsp;this consistently requires using the right networking services together.</span><span>&nbsp;</span></p>\n<p><span>To make this easier,&nbsp;we’ve&nbsp;updated the Azure Firewall&nbsp;create&nbsp;experience in the Azure portal to include&nbsp;</span><a href=\"https://aka.ms/standardv2natgw\" rel=\"noopener\" target=\"_blank\"><span><span>StandardV2 NAT Gateway</span></span></a><span>&nbsp;</span><span>directly in&nbsp;the deployment flow. This&nbsp;new&nbsp;experience&nbsp;makes it quick and seamless to&nbsp;adopt a secure, scalable, and zone‑resilient outbound&nbsp;architecture&nbsp;from day one&nbsp;by using&nbsp;</span><strong><span>Azure Firewall</span></strong><span>&nbsp;and</span><span>&nbsp;<strong>Azure&nbsp;NAT Gateway</strong>&nbsp;</span><span>together.</span><span>&nbsp;</span></p>\n<p><span>In this post,&nbsp;we’ll&nbsp;cover:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Why pairing Azure Firewall with StandardV2 NAT Gateway is a recommended design</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>How this combination simplifies secure and resilient outbound connectivity</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>What’s&nbsp;new in the Azure Firewall portal experience&nbsp;and how to get started</span><span>&nbsp;</span></li>\n</ul>\n<h2><span>Why Azure Firewall and StandardV2 NAT Gateway?</span></h2>\n<p><span><span>Azure Firewall and Azure NAT Gateway are designed to complement each other, each focusing on what they do best:</span><span>&nbsp;</span></span></p>\n<img />Azure NAT Gateway and Azure Firewall deployed in a hub and spoke architecture.\n<ul>\n<li><strong><span>Azure Firewall</span></strong><span>&nbsp;provides centralized traffic inspection and policy enforcement, including&nbsp;IP address and&nbsp;FQDN filtering, threat intelligence, and logging.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><strong><span>StandardV2 NAT Gateway</span></strong><span>&nbsp;delivers high‑scale outbound SNAT, static egress IPs, and built‑in zone&nbsp;redundancy.</span> <span>&nbsp;</span></li>\n</ul>\n<p><span><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/reliability/reliability-nat-gateway?toc=/azure/nat-gateway/toc.json&amp;bc=/azure/nat-gateway/breadcrumb/toc.json#resilience-to-availability-zone-failures\" rel=\"noopener\" target=\"_blank\">StandardV2 NAT Gateway</a> is </span><strong><span>zone‑redundant by default</span></strong><span>, automatically spanning availability zones within a region.&nbsp;This means outbound connectivity&nbsp;remains&nbsp;available even during a zonal failure&nbsp;without requiring multiple zonal NAT gateways or&nbsp;additional&nbsp;routing&nbsp;configurations.</span><span>&nbsp;</span></p>\n<p><span>Together, this pairing cleanly separates:</span><span>&nbsp;</span></p>\n<ul>\n<li><strong><span>Security policy&nbsp;and inspection</span></strong><span>&nbsp;handled by Azure&nbsp;Firewall</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><strong><span>Outbound scale,&nbsp;resiliency, and IP predictability</span></strong><span><strong>&nbsp;</strong>handled&nbsp;by&nbsp;NAT Gateway</span><span>&nbsp;</span></li>\n</ul>\n<p><span>This separation is key for modern, large‑scale cloud workloads.</span><span>&nbsp;</span></p>\n<h2><span>A recommended outbound architecture</span></h2>\n<p><span>In a typical hub‑and‑spoke design:</span><span>&nbsp;</span></p>\n<ol>\n<li><span>Workloads in spoke virtual networks route outbound traffic to Azure Firewall in the hub</span><span>&nbsp;</span></li>\n<li><span>Firewall&nbsp;policies inspect and allow the traffic</span><span>&nbsp;</span></li>\n<li><span>StandardV2 NAT&nbsp;Gateway is&nbsp;attached to the&nbsp;AzureFirewallSubnet&nbsp;in the Hub</span><span>&nbsp;</span></li>\n<li><span>Approved traffic flows through StandardV2 NAT Gateway for SNAT</span><span>&nbsp;</span></li>\n<li><span>Traffic exits Azure using static, predictable public IPs</span><span>&nbsp;</span></li>\n</ol>\n<p><span>This approach provides&nbsp;several important benefits:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Scalable SNAT capacity for high‑connection workloads</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Static outbound IPs for partner allow‑listing&nbsp;and compliance</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Zone‑resilient outbound connectivity by default</span></li>\n</ul>\n<p><span>For&nbsp;step-by-step&nbsp;architectural guidance, see&nbsp;</span><a href=\"https://learn.microsoft.com/en-us/azure/nat-gateway/tutorial-hub-spoke-nat-firewall?tabs=portal\" rel=\"noopener\" target=\"_blank\"><span><span>Integrate NAT gateway with Azure Firewall in a hub and spoke architecture</span></span></a><span>.</span><span>&nbsp;</span></p>\n<h2><span>Built for secure and resilient Azure environments</span></h2>\n<p><span>As customers increasingly adopt availability zones, large‑scale VMSS or AKS deployments, and zero‑trust network models, outbound connectivity must be&nbsp;</span><strong><span>secure, predictable, and resilient</span></strong><span>.</span><span>&nbsp;</span></p>\n<p><span>By pairing Azure Firewall with StandardV2 NAT Gateway—and now surfacing this pairing directly in the portal&nbsp;create&nbsp;experience—customers can start with a&nbsp;</span><strong><span>production‑ready outbound architecture</span></strong><span>&nbsp;that scales with their environment.</span><span>&nbsp;</span></p>\n<h2>What's new in the Azure Firewall create experience in the portal</h2>\n<p><span>When creating a new Azure Firewall in the portal, customers can now:</span><span>&nbsp;</span></p>\n<ul>\n<li><span><strong>Select and associate a StandardV2 NAT Gateway during&nbsp;firewall&nbsp;deployment</strong>.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Reduce post‑deployment configuration and manual touches.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Start with a recommended zone-resilient outbound architecture by default.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>By bringing NAT Gateway directly into the Firewall&nbsp;create&nbsp;flow, the portal helps guide customers toward a more&nbsp;secure&nbsp;and scalable outbound setup—without requiring them to stitch services together after the fact.</span><span>&nbsp;</span></p>\n<h2><span>Get started</span></h2>\n<p><span>You can try the updated experience today by creating a new Azure Firewall in the Azure portal and selecting&nbsp;</span><strong><span>StandardV2 NAT Gateway</span></strong><span>&nbsp;during deployment.</span><span>&nbsp;</span></p>\n<p><span>With just a couple clicks of a button:</span><span>&nbsp;</span></p>\n<ol>\n<li><span>In the&nbsp;</span><strong><span>Basics&nbsp;</span></strong><span>tab,&nbsp;configure your Firewall settings (ex.,&nbsp;SKU, policy,&nbsp;virtual network).</span><span>&nbsp;</span></li>\n<li><span>In the&nbsp;*new*&nbsp;</span><strong><span>Advanced&nbsp;</span></strong><span>tab, create&nbsp;a new&nbsp;or add an existing StandardV2 NAT gateway and associate&nbsp;StandardV2&nbsp;public&nbsp;IP addresses or prefixes. The StandardV2&nbsp;NAT gateway is automatically attached to the Firewall subnet—no&nbsp;additional&nbsp;routing or configuration&nbsp;required.</span><span>&nbsp;</span></li>\n<li><strong><span>Review&nbsp;</span></strong><span>and&nbsp;</span><strong><span>Create</span></strong><span>.</span><span>&nbsp;</span></li>\n</ol>\n<img />\n<p><strong><span>Note</span></strong><span>:&nbsp;StandardV2 NAT Gateway is not yet available in all regions. If your selected region does not support StandardV2 NAT Gateway, the&nbsp;option&nbsp;to enable StandardV2 NAT gateway&nbsp;will not appear during Firewall creation. Refer to&nbsp;</span><a href=\"https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview#key-limitations-of-standardv2-nat-gateway\" rel=\"noopener\" target=\"_blank\"><span><span>StandardV2 NAT Gateway limitations</span></span></a><span>&nbsp;for more information.</span><span>&nbsp;</span></p>\n<p><span>For more details, see:</span><span>&nbsp;</span></p>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/firewall/integrate-with-nat-gateway-v2\" rel=\"noopener\" target=\"_blank\">Integrate StandardV2 NAT Gateway with Azure Firewall</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/nat-gateway/tutorial-hub-spoke-nat-firewall?tabs=portal\" rel=\"noopener\" target=\"_blank\"><span><span>Integrate NAT Gateway with Azure Firewall in a hub‑and‑spoke network</span></span></a><span>&nbsp;</span></li>\n<li><a href=\"https://aka.ms/natsku\" rel=\"noopener\" target=\"_blank\"><span><span>Azure NAT Gateway SKUs</span></span></a><span>&nbsp;</span></li>\n</ul>"
