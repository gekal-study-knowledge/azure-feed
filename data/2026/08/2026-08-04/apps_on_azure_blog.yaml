  "dbfa94d9da695580d7f84b9f42ddaae1":
    "id": "dbfa94d9da695580d7f84b9f42ddaae1"
    "title": "Built-In Observability for Serverless AI Agents on Azure Functions"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/built-in-observability-for-serverless-ai-agents-on-azure/ba-p/4542087"
    "published": "2026-08-04 07:29:13"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>Azure Functions Agents - the markdown-first runtime that turns a folder of *.agent.md files into a serverless Azure Functions app - now ships with OpenTelemetry tracing built into the runtime itself. Every agent run becomes a real, structured trace in Application Insights: the model used, the session, and every tool call or sub-agent hand-off along the way. None of it requires writing a line of telemetry code in your app.</p>\n<h4><a class=\"lia-external-url\" href=\"https://aka.ms/serverless-agents-quickstart\" rel=\"noopener\" target=\"_blank\">Click here to create and run a Serverless Agent using Azure Functions</a></h4>\n<h1>Full visibility, zero code</h1>\n<p>Bootstrapping an agent app is still two lines:</p>\nfrom azure_functions_agents import create_function_app app = create_function_app()\n<p>Turning on export is two settings, no code:</p>\n<p>In requirements.txt -&nbsp;</p>\npip install azurefunctions-agents-runtime[monitor]\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\">In your App Settings -</div>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\">APPLICATIONINSIGHTS_CONNECTION_STRING=&lt;your-app-insights-connection-string&gt;&lt;/your-app-insights-connection-string&gt;</div>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\">&nbsp;</div>\n<p>From there, every run shows up automatically in Application Insights' <strong>Agents</strong> view, tagged with a consistent set of attributes the runtime adds for you: which agent ran, which model answered, which tools it called, and how the run finished. You don't pick and choose what to instrument - you get the whole run, every time, the same way, regardless of what the agent is doing underneath.</p>\n<p>That consistency is what makes the tracing useful for more than debugging. It's also the simplest way to <em>see</em> something that would otherwise happen invisibly inside a single API call.</p>\n<h1>Example: watching a model decision happen in real time</h1>\n<p>One good illustration is <a href=\"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router\" rel=\"noopener\" target=\"_blank\">Model Router</a> - a model you deploy yourself in your Foundry resource, like any other model deployment. Point an agent's model setting at that deployment, and Model Router picks a different underlying LLM per prompt: a smaller model for simple requests, a larger one once a prompt actually needs it.</p>\n<p>Normally that choice is invisible - it happens inside one API call. But because Azure Functions Agents traces every run the same way no matter which model is behind it, the decision shows up for free. Same chat session, two prompts:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td>\n<p><strong>Prompt</strong></p>\n</td><td>\n<p><strong>Model Router picked</strong></p>\n</td><td>\n<p><strong>Why</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p>Easy, one-shot question</p>\n</td><td>\n<p>gpt-5-mini</p>\n</td><td>\n<p>Small model is comparable quality for a fraction of the cost.</p>\n</td></tr><tr><td>\n<p>Complex, multi-step reasoning</p>\n</td><td>\n<p>gpt-5.4</p>\n</td><td>\n<p>Router escalates to a larger model once the prompt needs it.</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>Both requests show <em>gen_ai.request.model = model-router</em>, that's the deployment the agent called. What changes per message is the response attribute, which names whichever model Router actually picked.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><em>Trace for the easy prompt (response model gpt-5-mini)</em></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\">&nbsp;</div>\n<p>&nbsp;</p>\n<img />\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-center\"><em>Trace for the hard prompt (response model gpt-5.4)</em></div>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><em>Full session in the Agents pane of Application Insights</em></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\">&nbsp;</div>\n<p>Nothing here was instrumented specifically for Model Router - this is just what a trace looks like now, for any agent, on any model.</p>\n<h1>Try it yourself</h1>\n<ol>\n<li>Add the two settings above to an existing agent app - no code changes needed.</li>\n<li>Send a request or two, then open Application Insights' <strong>Agents</strong> view (or Transaction Search).</li>\n<li>Look at what's already there: model, session, tool calls, and timing, all correlated under one trace.</li>\n</ol>\n<h1>Wrapping up</h1>\n<p>The point isn't any single scenario - it's that whatever you build next on Azure Functions Agents, from a simple single-model agent to something as dynamic as router-based model selection, you'll be able to see exactly what happened without adding anything yourself. Try it against your own agent and see what's already there.</p>\n<h1>Resources</h1>\n<ul>\n<li><a href=\"https://github.com/Azure/azure-functions-agents-runtime\" rel=\"noopener\" target=\"_blank\">Azure Functions Agents runtime on GitHub</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router\" rel=\"noopener\" target=\"_blank\">Model router for Microsoft Foundry</a></li>\n</ul>"
  "97f95d15d72c4eda27a1ac8f9508d3f1":
    "id": "97f95d15d72c4eda27a1ac8f9508d3f1"
    "title": "Microsoft Foundry Now Has an AI Gateway Control Plane — What Changes for App Service"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/microsoft-foundry-now-has-an-ai-gateway-control-plane-what/ba-p/4538320"
    "published": "2026-08-04 03:24:20"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>In May, I published a <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/you-can-build-a-framework-agnostic-ai-gateway-on-azure-app-service-%E2%80%94-heres-how/4522004\" rel=\"noopener\" target=\"_blank\">runnable sample that put Azure API Management in front of an AI agent on Azure App Service</a>. APIM handled token limits, semantic caching, token metrics, and access to the model. The point was simple: keep the agent framework interchangeable and put the production controls at the gateway.</p>\n<p>A recent Apps on Azure post, <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/from-ai-adoption-to-ai-governance---using-apim-as-the-gateway-for-azure-ai-found/4536247\" rel=\"noopener\" target=\"_blank\">From AI Adoption to AI Governance</a>, arrived at the same architectural conclusion from a platform-governance angle. It uses APIM to turn model identity and token consumption into a per-model chargeback signal for Microsoft Foundry workloads.</p>\n<p>That is useful validation, but the more interesting update is in the product itself: <strong>Microsoft Foundry can now create or associate an APIM-based AI Gateway directly from its Admin console.</strong> The data path is still APIM. What changed is who can configure and govern it.</p>\n<p>This post explains what that means for an App Service-hosted agent, what Foundry now manages, what still belongs in APIM, and what I would change in the sample we built earlier.</p>\n<blockquote>\n<p><strong>Update (August 2026):</strong> Azure API Management now offers a dedicated <strong>AI Gateway tier</strong> in public preview. This article describes Foundry’s integration with APIM-based gateways. The new tier adds an AI-focused portal and resource experience for models and MCP tools and is expected to integrate with Foundry separately. See the <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/integrationsonazureblog/ai-gateway-tier-of-api-management-now-in-public-preview/4540170.\" target=\"_blank\">announcement</a>.</p>\n</blockquote>\n<h2>The short version: same gateway, new control plane</h2>\n<p>The architecture is still familiar:</p>\n<p><strong>Client -&gt; App Service agent -&gt; APIM AI Gateway -&gt; Foundry model</strong></p>\n<p>APIM remains the traffic gateway. It authenticates callers, applies policies, forwards requests, and emits telemetry. App Service remains the application runtime for the agent and its APIs.</p>\n<p>The new piece is the Foundry control plane. From <strong>Operate &gt; Admin console &gt; AI Gateway</strong>, a platform team can now:</p>\n<ul>\n<li>Create a new APIM instance or associate a supported existing instance.</li>\n<li>Enable the gateway for individual Foundry projects.</li>\n<li>Apply independent token limits to projects sharing the gateway.</li>\n<li>Verify gateway traffic and inspect logs.</li>\n</ul>\n<p>Once the gateway is enabled, separate Foundry experiences can also register custom agents and govern supported MCP tools. Those actions do not happen in the AI Gateway tab itself, but the gateway provides their governed traffic path.</p>\n<p>That is a meaningful shift. In the original sample, the infrastructure owner created APIM, imported the model API, deployed policy XML, and wired the agent to the gateway. Foundry does not remove APIM or replace those advanced capabilities. It gives Foundry administrators a first-party path into the same architecture.</p>\n<h2>What Foundry now owns</h2>\n<h3>Project onboarding</h3>\n<p>An AI Gateway is associated with a Foundry resource, then enabled for projects inside it. New projects can inherit the gateway automatically. Existing projects must be added explicitly.</p>\n<p>This creates a useful governance boundary: multiple teams can share the same APIM instance without sharing one undifferentiated token pool. Each project can receive its own token ceiling. If a project exceeds its configured limit, the gateway returns <code>429 Too Many Requests</code> while other projects continue using their allocations.</p>\n<h3>Foundry-level limits</h3>\n<p>Our earlier sample used an APIM token-limit policy keyed by an APIM subscription. That is still a valid pattern, especially when the consumer boundary is an application, business unit, or external customer.</p>\n<p>The Foundry integration adds another natural counter key: the Foundry project. For organizations already organizing models and agents by project, limits can now follow that structure instead of being recreated independently in every client application.</p>\n<h3>Inventory for agents and tools</h3>\n<p>The AI Gateway experience is expanding beyond model endpoints in two distinct ways. Foundry can register custom agents running outside Foundry, including agents that use A2A as their communication protocol. Separately, AI Gateway can govern supported MCP tools. The current tools-governance preview is scoped to MCP; it does not cover every Foundry or OpenAPI tool type.</p>\n<p>That matters for App Service because the runtime does not need to move. An agent can continue running on App Service while participating in Foundry's inventory, and its supported MCP traffic can flow through the gateway.</p>\n<p>These experiences are still preview features, so I would treat them as a control-plane integration to evaluate, not a reason to redesign a working production agent.</p>\n<h2>What still belongs in APIM</h2>\n<p>Foundry makes the common path easier. It does not make the full APIM surface unnecessary.</p>\n<p>I would still use APIM directly for:</p>\n<ul>\n<li>Custom policy expressions and organization-specific headers or claims.</li>\n<li>Semantic caching backed by Azure Managed Redis.</li>\n<li>Backend pools, priority routing, and circuit breakers.</li>\n<li>Private networking, multi-region gateways, and advanced topology decisions.</li>\n<li>Custom metrics and dimensions needed for internal chargeback.</li>\n</ul>\n<p>The clean mental model is: <strong>Foundry manages the AI assets and common project guardrails; APIM manages the traffic contract and advanced gateway behavior.</strong></p>\n<h2>Applying this to the App Service sample</h2>\n<p>The existing <a class=\"lia-external-url\" href=\"https://github.com/seligj95/app-service-ai-gateway-mcp-apim-python\" rel=\"noopener\" target=\"_blank\">framework-agnostic AI Gateway sample</a> hosts a Microsoft Agent Framework agent and an MCP server on one Linux App Service. The agent reaches its model through APIM, which applies token limits, semantic caching, token metrics, and managed-identity authentication.</p>\n<p>Most of that architecture should stay exactly as it is.</p>\n<h3>1. Keep the App Service application unchanged</h3>\n<p>The agent should continue calling a stable gateway endpoint. It should not need to understand whether APIM was provisioned by Bicep, associated in Foundry, or managed by a central platform team. That separation was the reason to introduce the gateway in the first place.</p>\n<h3>2. Choose the APIM ownership model deliberately</h3>\n<blockquote>\n<p><strong>Update (August 2026):</strong> Foundry can now associate eligible API Management instances on classic (v1) SKUs as AI Gateways, in addition to v2 instances. If you already operate a classic-tier gateway, check <strong>Use existing APIM</strong> before planning a migration. Association does not change that tier’s SLA, scaling, networking, or feature limitations.</p>\n</blockquote>\n<p>For a new proof of concept, Foundry can create a Basic v2 APIM instance. For production, Microsoft recommends evaluating Standard v2 or Premium v2 based on throughput and networking requirements.</p>\n<p>For an existing enterprise gateway, use the Foundry option to associate an APIM instance only after confirming that it meets the eligibility requirements: it must be in the same Microsoft Entra tenant and Azure subscription as the Foundry resource, you need the <strong>API Management Service Contributor</strong> role (or Owner), and the instance must use a currently supported APIM tier.</p>\n<h3>3. Add existing projects explicitly</h3>\n<p>Creating or associating the gateway at the Foundry resource level does not automatically enable every existing project. Add each existing project to the gateway, then verify its status is <strong>Enabled</strong>.</p>\n<h3>4. Decide where each limit belongs</h3>\n<p>Avoid layering limits without a clear ownership model. A Foundry project limit, an APIM subscription limit, and a model deployment TPM limit answer different questions:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Control</th><th>Best boundary</th><th>Question it answers</th></tr></thead><tbody><tr><td>Foundry project limit</td><td>Team or workload project</td><td>How much shared capacity can this project consume?</td></tr><tr><td>APIM policy limit</td><td>Subscription, user, tenant, or application</td><td>How much can this specific consumer use?</td></tr><tr><td>Model deployment quota</td><td>Backend deployment</td><td>What capacity exists at the model endpoint?</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>Use all three when the boundaries are intentional. Otherwise, operators end up debugging a <code>429</code> without knowing which layer produced it.</p>\n<h3>5. Verify the data path</h3>\n<p>After enabling a project, make a model request and confirm that the APIM request metric increments. Microsoft also recommends checking the <code>GatewayLogs</code> table for a successful response and an API name matching the AI Gateway.</p>\n<p>Then test the failure path. Set a deliberately small project limit, exceed it, and confirm that the gateway returns <code>429</code>. A governance feature is not finished until the team has observed both the allowed and denied behavior.</p>\n<h2>Which path should you choose?</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Scenario</th><th>Recommended approach</th></tr></thead><tbody><tr><td>New Foundry proof of concept</td><td>Create the AI Gateway from Foundry and start with project-level limits.</td></tr><tr><td>Existing v2 enterprise APIM</td><td>Associate the existing instance and preserve central networking and policy ownership.</td></tr><tr><td>Existing classic-tier APIM</td><td>\n<p>Associate the existing instance with Foundry if eligible; migrate only when production, networking, or scale requirements justify it.</p>\n</td></tr><tr><td>Advanced routing or custom policy needs</td><td>Use Foundry for inventory and common guardrails, then manage the advanced behavior in APIM.</td></tr><tr><td>Strict isolation between project groups</td><td>Use separate Foundry resources and separate gateways rather than assuming one gateway per project.</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2>The architecture was right; the experience caught up</h2>\n<p>The most important takeaway is not that everyone should rebuild an AI Gateway in a new portal. It is that the composable architecture now has a more accessible control plane.</p>\n<p>App Service still runs the agent. APIM still governs the traffic. Foundry now gives model and platform owners a direct way to connect projects, allocate capacity, and bring agents and tools into the same governance view.</p>\n<p>If you already built the earlier sample, the application boundary does not need to change. Evaluate the Foundry integration, decide whether its project model matches your organization, and check the APIM tier before planning any migration. The gateway remains the contribution; Foundry now makes it easier to operate.</p>\n<h2>Resources</h2>\n<ul>\n<li><a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/you-can-build-a-framework-agnostic-ai-gateway-on-azure-app-service-%E2%80%94-heres-how/4522004\" rel=\"noopener\" target=\"_blank\">You can build a framework-agnostic AI Gateway on Azure App Service</a></li>\n<li><a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/from-ai-adoption-to-ai-governance---using-apim-as-the-gateway-for-azure-ai-found/4536247\" rel=\"noopener\" target=\"_blank\">From AI Adoption to AI Governance</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/foundry/configuration/enable-ai-api-management-gateway-portal\" rel=\"noopener\" target=\"_blank\">Configure AI Gateway in your Foundry resources</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/api-management/genai-gateway-capabilities\" rel=\"noopener\" target=\"_blank\">AI Gateway capabilities in Azure API Management</a></li>\n<li><a class=\"lia-external-url\" href=\"https://github.com/seligj95/app-service-ai-gateway-mcp-apim-python\" rel=\"noopener\" target=\"_blank\">App Service AI Gateway sample</a></li>\n</ul>"
"last_updated": "2026-08-27 21:13:50 JST"
