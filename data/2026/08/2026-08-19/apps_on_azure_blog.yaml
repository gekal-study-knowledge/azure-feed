    "id": "f4884395088356b5807f66460556f508"
    "title": "What the New API Management AI Gateway Tier Changes for App Service-Hosted Agents"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/what-the-new-api-management-ai-gateway-tier-changes-for-app/ba-p/4543974"
    "published": "2026-08-19 22:54:21"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>In May, I published <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/you-can-build-a-framework-agnostic-ai-gateway-on-azure-app-service-%E2%80%94-heres-how/4522004\" rel=\"noopener\" target=\"_blank\">a runnable sample that put Azure API Management in front of an AI agent on Azure App Service</a>. The agent framework was replaceable; the gateway was the contribution. APIM handled model access, token limits, semantic caching, token metrics, and the MCP traffic contract.</p>\n<p>I followed that with <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/microsoft-foundry-now-has-an-ai-gateway-control-plane-%E2%80%94-what-changes-for-app-ser/4538320\" rel=\"noopener\" target=\"_blank\">a look at Foundry's new AI Gateway control plane</a>. The data path was still APIM, but Foundry gave model and platform owners a first-party way to associate gateways, onboard projects, and allocate capacity.</p>\n<p>Now <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/integrationsonazureblog/ai-gateway-tier-of-api-management-now-in-public-preview/4540170\" rel=\"noopener\" target=\"_blank\">API Management has a dedicated AI Gateway tier in public preview</a>. That raises a different question for App Service users: does the application runtime change, or does the boundary around models and tools change?</p>\n<p>The short answer is that App Service still owns the web application, agent orchestration, streaming experience, deployment lifecycle, scaling, managed identity, and application telemetry. The dedicated tier gives the model-and-tool boundary an AI-focused resource, portal, and runtime experience. To make that distinction concrete, I built a new runnable sample in which a Python agent on App Service can reach both its model and its MCP tools only through the dedicated AI Gateway.</p>\n<p><strong>Get the sample:</strong> <a class=\"lia-external-url\" href=\"https://github.com/seligj95/app-service-ai-gateway-tier-python\" rel=\"noopener\" target=\"_blank\">Deploy and explore the complete App Service + AI Gateway sample on GitHub</a>.</p>\n<blockquote>\n<p><strong>Preview notice:</strong> The dedicated AI Gateway tier is in public preview. It has no SLA, is currently available only in East US 2 and Sweden Central, and does not yet have an announced pricing or business model. APIs, limits, regions, policy behavior, and portal experiences may change. The sample is designed for learning and validation, not as a production-ready reference architecture.</p>\n</blockquote>\n<h2>The short version: App Service is the runtime; AI Gateway is the governed boundary</h2>\n<p>The architecture separates application concerns from AI access concerns:</p>\n<ul>\n<li><strong>App Service</strong> hosts the FastAPI application, browser UI, Microsoft Agent Framework agent, server-sent event stream, retry behavior, and a small read-only MCP server.</li>\n<li><strong>AI Gateway</strong> exposes the OpenAI-compatible model endpoint and MCP ToolServer endpoint used by the application. It owns the runtime access key, model registration, structured token policy, backend tool credential, and gateway telemetry exporter.</li>\n<li><strong>Microsoft Foundry / Azure AI Services</strong> supplies the backing model. AI Gateway reaches it with managed identity.</li>\n<li><strong>Key Vault</strong> stores the gateway runtime key and a separate MCP backend secret. App Service resolves both through managed identity-backed Key Vault references.</li>\n<li><strong>Application Insights</strong> receives application OpenTelemetry and the preview gateway token-usage export.</li>\n</ul>\n<img />\n<h2>First, which AI Gateway are we talking about?</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Experience</th><th>Primary abstraction</th><th>Policy and access model</th><th>How it relates to this sample</th></tr></thead><tbody><tr><td>AI gateway capabilities in regular API Management tiers</td><td>General APIs and products, with AI-aware capabilities added to APIM</td><td>Regular APIM subscriptions and policies, including XML policy definitions</td><td>Useful for organizations that already operate APIM or need general API management alongside AI traffic. This sample does not use a regular APIM SKU.</td></tr><tr><td>Foundry-created or associated APIM</td><td>A Foundry control-plane workflow that creates or associates an APIM instance</td><td>The associated APIM instance remains the gateway resource</td><td>This is an existing integration path and is separate from the dedicated tier demonstrated here.</td></tr><tr><td>Dedicated API Management AI Gateway tier</td><td>Models, providers, MCP ToolServers, runtime access keys, and an AI-focused catalog</td><td>AI-focused card experiences backed by structured JSON resources and policies</td><td>This is what the sample deploys and what every model and MCP request traverses.</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>The dedicated tier is not simply a renamed regular APIM instance. Its portal and resource model center on providers, models, ToolServers, runtime keys, telemetry exporters, and AI policies instead of asking an application team to begin with a general-purpose API surface.</p>\n<p>&nbsp;</p>\n<!-- INSERT IMAGE: images/04-ai-gateway-portal-composite.png --><img /><img />\n<h2>What the sample actually does</h2>\n<p>The sample deploys a Python 3.12 FastAPI application to Linux App Service. The browser presents a small chat interface, but the useful part is behind it:</p>\n<ul>\n<li>Microsoft Agent Framework configured with an <code>OpenAIChatCompletionClient</code> whose base URL is the gateway OpenAI v1 route.</li>\n<li>An <code>MCPStreamableHTTPTool</code> configured with the gateway ToolServer route and a fixed allow-list of two read-only tools.</li>\n<li>Server-sent event streaming from App Service to the browser.</li>\n<li>A stable gateway model name, <code>appservice-chat</code>, initially mapped to a <code>gpt-5-mini</code> deployment.</li>\n<li>A separate MCP endpoint on App Service that rejects direct callers unless AI Gateway injects the expected backend secret.</li>\n<li>Bounded handling for 401, 404, 429, and transient 5xx responses.</li>\n<li>Application Insights and OpenTelemetry with correlation IDs and a strict telemetry attribute allow-list.</li>\n<li>Complete azd and Bicep infrastructure using the published preview resource contracts.</li>\n</ul>\n<h3>The model path</h3>\n<ol>\n<li>The browser posts a message to <code>/api/chat/stream</code> on App Service.</li>\n<li>FastAPI creates or accepts a correlation ID and returns a server-sent event stream.</li>\n<li>The Agent Framework client sends an OpenAI-compatible request to <code>/default/models/openai/v1/</code> on AI Gateway with the gateway runtime access key.</li>\n<li>AI Gateway resolves the stable catalog name <code>appservice-chat</code>, applies its structured token policy, and calls the backing Foundry deployment with the gateway system-assigned managed identity.</li>\n<li>Text fragments return through AI Gateway and App Service as <code>delta</code> events. The browser renders them as they arrive.</li>\n<li>Application spans and gateway token usage are correlated in Application Insights without capturing prompts, responses, keys, or backend secrets as custom attributes.</li>\n</ol>\n<p>This is the first practical benefit for an App Service user: application code targets one governed OpenAI-compatible boundary. The app does not contain a Foundry endpoint, a Foundry key, or a direct-provider fallback.</p>\n<h3>The tool path</h3>\n<p>The sample deliberately hosts its MCP server on the same App Service application so the complete tool path is visible:</p>\n<ol>\n<li>For the two documented operational prompts, the application sets Agent Framework <code>tool_choice</code> to the matching read-only tool. Other prompts retain automatic tool selection.</li>\n<li>Agent Framework invokes the <code>appservice-ops</code> MCP ToolServer through AI Gateway using the same runtime access key.</li>\n<li>AI Gateway validates the caller and injects a different <code>x-appservice-mcp-secret</code> header only on the backend hop.</li>\n<li>The ToolServer calls <code>/mcp</code> on App Service.</li>\n<li>App Service compares the backend secret and executes one of two fixed, read-only tools.</li>\n<li>The tool result travels back through AI Gateway to the agent, which uses it in the streamed answer.</li>\n</ol>\n<p>This explicit choice matters in a demonstration. Strong instructions make tool use more likely, but they do not make a model decision deterministic. The application therefore recognizes the exact status and deployment-context prompts shown below and requires the matching function. The backend publishes raw names such as <code>get_service_status</code>; the AI Gateway ToolServer advertises them to the client as <code>appservice-ops_get_service_status</code> and <code>appservice-ops_get_deployment_context</code>. Agent Framework must allow the gateway-advertised names without adding a second prefix.</p>\n<p>The two tools are intentionally small:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Tool</th><th>What it returns</th><th>Why it is useful in the sample</th></tr></thead><tbody><tr><td><code>get_service_status</code></td><td>Non-sensitive service name, health state, and App Service instance identifier</td><td>Proves that the model called a live backend tool rather than inventing a generic operational answer.</td></tr><tr><td><code>get_deployment_context</code></td><td>Non-sensitive App Service site, slot, and region context</td><td>Proves that tool results come from the deployed App Service app.</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<!-- INSERT IMAGE: images/02-mcp-service-status.png -->\n<p>&nbsp;</p>\n<img />\n<h2>Try it yourself</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Prompt</th><th>Expected behavior</th><th>What it demonstrates</th></tr></thead><tbody><tr><td>“Explain the boundary between App Service and AI Gateway in this sample.”</td><td>Streams a model-generated answer without requiring an MCP call.</td><td>The OpenAI-compatible model route and SSE streaming path are working.</td></tr><tr><td>“What is the current service status?”</td><td>Invokes <code>get_service_status</code> and includes the live service, status, and instance fields.</td><td>Tool discovery, AI Gateway ToolServer routing, backend authentication, and the App Service MCP endpoint are working.</td></tr><tr><td>“Which site and deployment slot are you running in?”</td><td>Invokes <code>get_deployment_context</code> and reports live deployment context.</td><td>The response is grounded in the running App Service app rather than model knowledge.</td></tr><tr><td>“Show the current service status.”</td><td>Uses the same deterministic status-tool path with alternate documented wording.</td><td>The application—not a prompt-engineering trick—controls when the live operational tool is required.</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h2>Proving the gateway is actually in the path</h2>\n<p>A successful chat response alone is not sufficient evidence. The sample includes several tests that make the gateway boundary observable.</p>\n<h3>1. Confirm the application has no provider fallback</h3>\n<p>The application accepts only gateway-shaped model and MCP URLs. Configuration validation rejects other endpoint shapes, and there is no provider endpoint or provider credential setting. If the gateway is unavailable or misconfigured, the application fails visibly rather than silently bypassing policy.</p>\n<h3>2. Test runtime-key enforcement</h3>\n<p>Call the gateway model route with a deliberately invalid key. The expected result is HTTP 401. The application treats this as a deployment or configuration failure and does not retry it.</p>\n<h3>3. Test model catalog routing</h3>\n<p>Request an unknown model name through the OpenAI-compatible route. The expected result is HTTP 404. A normal application request uses the stable name <code>appservice-chat</code>, showing that the gateway catalog—not a provider-specific name embedded in application source—controls resolution.</p>\n<h3>4. Test the structured token policy</h3>\n<p>The model registration includes a JSON-backed token-limit policy. In a disposable test environment, temporarily lower the limit, send enough requests to exceed it, and capture HTTP 429. Restore the normal value immediately afterward. During preview validation, the gateway returned 429 without a <code>Retry-After</code> header, so the sample honors the header when present and otherwise uses bounded fallback backoff.</p>\n<h3>5. Prove direct MCP access is denied</h3>\n<p>Call the App Service <code>/mcp</code> endpoint without the backend header. The expected response is HTTP 401. Then ask the agent for live service status and confirm the same tool succeeds through the AI Gateway ToolServer. The contrast proves that the gateway is adding backend authentication rather than exposing an anonymous tool endpoint.</p>\n<h3>6. Verify telemetry on both sides of the boundary</h3>\n<p>Use the correlation ID returned by the chat stream to locate the App Service request and agent span in Application Insights. For a tool prompt, confirm the safe application <code>mcp_tool_called</code> trace and the AI Gateway <code>tools/call</code> dependency with its <code>gen_ai.tool.name</code> attribute. Separately confirm token-usage telemetry for the model request. These views prove different parts of the path: the application executed the backend tool, the gateway mediated the ToolServer call, and the model route emitted usage telemetry.</p>\n<!-- INSERT IMAGE: images/05-application-insights-composite.png -->\n<h2>Operating the boundary</h2>\n<h3>Who authenticates to whom</h3>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Connection</th><th>Authentication</th><th>Why</th></tr></thead><tbody><tr><td>App Service to AI Gateway</td><td>Gateway runtime access key in the lowercase <code>api-key</code> header</td><td>This is the current preview runtime-caller authentication model. The sample does not claim managed identity support where it does not exist.</td></tr><tr><td>AI Gateway to Foundry</td><td>AI Gateway system-assigned managed identity with Foundry User</td><td>No Foundry key is stored in the application.</td></tr><tr><td>App Service to Key Vault</td><td>App Service managed identity with Key Vault Secrets User</td><td>The runtime key and MCP backend secret are resolved through Key Vault references.</td></tr><tr><td>AI Gateway to the App Service MCP backend</td><td>Separate gateway-injected backend header secret</td><td>Direct anonymous callers cannot invoke the MCP tools.</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The post-provision hook retrieves the generated gateway runtime key through the documented management action, writes it and a newly generated MCP backend secret to Key Vault without printing them, and completes the ToolServer credential configuration. No runtime key is committed to source control or written to the azd environment.</p>\n<h3>Changing the model without rewriting the application</h3>\n<p>The application always requests <code>appservice-chat</code>. Both the Foundry deployment and gateway model registration use that stable client-facing alias, while model name and version remain deployment parameters. This lets the platform team evaluate a backing model update at the gateway and infrastructure layer without changing the FastAPI or Agent Framework source.</p>\n<h3>The gateway governs; the application still has to be resilient</h3>\n<ul>\n<li>401 and 404 are not retried.</li>\n<li>429 and transient 5xx responses use a maximum of three attempts by default, bounded exponential backoff, and jitter.</li>\n<li><code>Retry-After</code> is honored when the gateway supplies it.</li>\n<li>HTTP status and retry metadata are recovered from Agent Framework exception wrappers before classification.</li>\n<li>Retries occur only before the first streamed token.</li>\n<li>A partially emitted stream is never replayed.</li>\n<li>Prompts, model responses, secrets, and upstream response bodies are excluded from application error messages and custom telemetry.</li>\n</ul>\n<p>This is another important division of responsibility: the gateway governs access and policy; the application remains responsible for trustworthy interaction behavior.</p>\n<h3>What <code>azd</code> deploys</h3>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Resource</th><th>Purpose</th></tr></thead><tbody><tr><td>Linux App Service plan and web app</td><td>Hosts FastAPI, Agent Framework, the browser UI, SSE API, and MCP backend.</td></tr><tr><td>App Service staging slot</td><td>Optional manual deployment and swap demonstration. The sample does not automatically swap an empty or stale slot.</td></tr><tr><td>Dedicated API Management AI Gateway</td><td>Provides the governed model and MCP ToolServer boundary.</td></tr><tr><td>Connector namespace and default workspace</td><td>Supports the dedicated AI Gateway workspace and tool experience.</td></tr><tr><td>Foundry / Azure AI Services account and model deployment</td><td>Supplies the initial backing model.</td></tr><tr><td>Key Vault</td><td>Stores the gateway runtime key and MCP backend secret.</td></tr><tr><td>Virtual network and optional Key Vault private endpoint</td><td>Supports App Service outbound integration and stricter secret-access designs.</td></tr><tr><td>Application Insights and Log Analytics</td><td>Collect application telemetry and preview gateway token usage.</td></tr><tr><td>RBAC assignments</td><td>Grant the gateway access to Foundry and App Service identities access to only the required Key Vault secrets.</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2>The boundary is the product</h2>\n<p>This is the through line across all three posts. The first sample showed that the agent framework can change while APIM remains the traffic boundary. The Foundry post showed that the same boundary can gain a model- and project-focused control plane. This sample shows what changes when the gateway itself becomes an AI-focused tier.</p>\n<p>App Service still runs the agent. AI Gateway still does not replace application logic, deployment, or resilience. The better-together story is that App Service gives the agent a managed application runtime while AI Gateway gives that runtime a governed, observable, and replaceable boundary for models and tools.</p>\n<p><strong>One final preview boundary:</strong> This sample demonstrates a governed model and tool path, separated identities, model indirection, policy enforcement, and telemetry. It does not establish production readiness, scale limits, final pricing, or live multi-provider routing; the deployment uses one Foundry provider.</p>\n<h3>Resources</h3>\n<ul>\n<li><a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/you-can-build-a-framework-agnostic-ai-gateway-on-azure-app-service-%E2%80%94-heres-how/4522004\" rel=\"noopener\" target=\"_blank\">You Can Build a Framework-Agnostic AI Gateway on Azure App Service—Here's How</a></li>\n<li><a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/microsoft-foundry-now-has-an-ai-gateway-control-plane-%E2%80%94-what-changes-for-app-ser/4538320\" rel=\"noopener\" target=\"_blank\">Microsoft Foundry Now Has an AI Gateway Control Plane—What Changes for App Service</a></li>\n<li><a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/integrationsonazureblog/ai-gateway-tier-of-api-management-now-in-public-preview/4540170\" rel=\"noopener\" target=\"_blank\">AI Gateway tier of API Management now in public preview</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/api-management/ai-gateway-overview\" rel=\"noopener\" target=\"_blank\">Azure API Management AI Gateway overview</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/api-management/quickstart-ai-gateway-create\" rel=\"noopener\" target=\"_blank\">Quickstart: Create an AI Gateway</a></li>\n<li><a class=\"lia-external-url\" href=\"https://github.com/seligj95/app-service-ai-gateway-tier-python\" rel=\"noopener\" target=\"_blank\">Runnable App Service sample</a></li>\n<li><a class=\"lia-external-url\" href=\"https://github.com/Azure/ai-gateway/tree/main/samples\" rel=\"noopener\" target=\"_blank\">Azure AI Gateway samples catalog</a></li>\n</ul>"
  "0f2a95b6ea3a190ef3f9541df9c15758":
    "id": "0f2a95b6ea3a190ef3f9541df9c15758"
    "title": "Announcing public preview: Markdown for Agents in Azure App Service"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/announcing-public-preview-markdown-for-agents-in-azure-app/ba-p/4537023"
    "published": "2026-08-19 22:57:13"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<h2>Why Markdown for Agents?</h2>\n<p>Web pages often contain scripts, styles, and HTML markup that are useful to browsers but add noise when the content is sent to an AI model. Markdown for Agents removes that extra markup and returns a smaller, text-focused response that is easier for agents to process and can reduce token usage.</p>\n<p>In internal testing across more than 637,000 pages, converted Markdown responses were 97 percent smaller at the median than the source HTML, with a median conversion time of 2 milliseconds. Results vary based on the page and its content.</p>\n<h2>Public preview availability</h2>\n<p>Markdown for Agents is available in public preview for <strong>Windows apps on Azure App Service in all public regions</strong>. The app must use an App Service plan in the Basic tier or higher.</p>\n<p>No additional authentication setup is required for Markdown conversion. Your app's existing authentication, authorization, and network access controls continue to apply.</p>\n<blockquote>\n<p>This feature is only supported on Windows App Service at this time. Support for Linux apps will come later this year.</p>\n</blockquote>\n<h2>Enable Markdown for Agents</h2>\n<p>During the public preview, you can enable the feature through the REST API, ARM/Bicep template, or the Azure CLI using&nbsp;<code>az rest</code>. Dedicated Azure CLI commands and portal support are planned for a future update.</p>\n<h3>Azure CLI with az rest</h3>\n<p>Replace the placeholders with your subscription ID, resource group, and app name:</p>\naz rest --method patch --url \"https://management.azure.com/subscriptions/&lt;SUBSCRIPTION_ID&gt;/resourceGroups/&lt;RESOURCE_GROUP&gt;/providers/Microsoft.Web/sites/&lt;APP_NAME&gt;?api-version=2026-03-15\" --headers \"Content-Type=application/json\" --body '{\"properties\":{\"aiIntegration\":{\"markdown\":{\"enabled\":true}}}}'\n<p>Verify the setting:</p>\naz rest --method get --url \"https://management.azure.com/subscriptions/&lt;SUBSCRIPTION_ID&gt;/resourceGroups/&lt;RESOURCE_GROUP&gt;/providers/Microsoft.Web/sites/&lt;APP_NAME&gt;?api-version=2026-03-15\" --query \"properties.aiIntegration.markdown\"\n<p>To disable the feature, send the same PATCH request with <code>enabled</code> set to <code>false</code>.</p>\n<h3>ARM template</h3>\n<p>Add the following property to your <code>Microsoft.Web/sites</code> resource using API version <code>2026-03-15</code>:</p>\n\"properties\": {\n  \"aiIntegration\": {\n    \"markdown\": {\n      \"enabled\": true\n    }\n  }\n}\n<h3>Bicep</h3>\nresource webApp 'Microsoft.Web/sites@2026-03-15' = {\n  name: appName\n  location: location\n  properties: {\n    serverFarmId: appServicePlanResourceId\n    aiIntegration: {\n      markdown: {\n        enabled: true\n      }\n    }\n  }\n}\n<h2>Request a Markdown response</h2>\n<p>After enabling the feature, request an HTML page from your app with the <code>Accept: text/markdown</code> header:</p>\ncurl -i -H \"Accept: text/markdown\" \"https://&lt;APP_NAME&gt;.azurewebsites.net/\"\n<p>A successfully converted response includes these headers:</p>\n<pre><code>Content-Type: text/markdown; charset=utf-8\nx-markdown-source: easy-markdown</code></pre>\n<p>The response body contains Markdown generated from the page's HTML. Common content such as headings, paragraphs, links, lists, images, emphasis, and code is preserved, while script and style content is removed.</p>\n<p>Pages that cannot be safely converted may return their original HTML. Clients should check the <code>Content-Type</code> and <code>x-markdown-source</code> response headers before processing the response as Markdown.</p>\n<h2>What's next</h2>\n<p>Linux support is planned before the feature reaches general availability. We also plan to add dedicated Azure CLI commands and a portal experience in future updates.</p>\n<h2>Share your feedback</h2>\n<p>Try Markdown for Agents with your Windows App Service apps and let us know how it works for your agent scenarios. Share feedback, questions, and feature requests in the comments below.</p>"
"last_updated": "2026-08-27 21:13:50 JST"
