    "title": "Azure DNS introduces Traffic Manager linked records (Public Preview)"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/azure-dns-introduces-traffic-manager-linked-records-public/ba-p/4547112"
    "published": "2026-08-19 01:14:39"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p>We're excited to announce the <strong>public preview of Traffic Manager linked records</strong>, a new Azure DNS capability that enables customers to directly associate Azure Public DNS record sets with Azure Traffic Manager profiles without using a CNAME to trafficmanager.net.</p>\n<p>With this capability, customers can use Traffic Manager's DNS-based load balancing capabilities without exposing the intermediate trafficmanager.net domain in DNS responses. Azure DNS and Traffic Manager now work together to provide a more seamless, integrated DNS experience for applications running across Azure, hybrid, and multi-cloud environments.</p>\n<h3>Simplifying DNS-based traffic routing</h3>\n<p>Traditionally, customers using Azure DNS with Traffic Manager relied on CNAME records that returned a Traffic Manager hostname. DNS clients would then perform an additional lookup to resolve that hostname before reaching the application endpoint.</p>\n<p>Traffic Manager linked records<strong> </strong>simplifies this process by allowing Azure DNS to resolve Traffic Manager routing decisions internally and return the appropriate endpoint information directly to clients.</p>\n<p>The result is a cleaner DNS resolution path while preserving all of Traffic Manager's existing routing methods, health monitoring, and failover capabilities.</p>\n<img />\n<h3>Key benefits</h3>\n<p><strong>Better integration between Azure DNS and Azure Traffic Manager</strong></p>\n<p>Traffic Manager linked records allow Azure DNS record sets to directly reference Traffic Manager profiles, including nested profile configurations.</p>\n<p>This enables sophisticated traffic routing architectures without relying on intermediate CNAME records, making complex global deployments easier to build and manage.</p>\n<p><strong>Improved security and DNS hygiene</strong></p>\n<p>Because DNS responses no longer expose the intermediate <strong>trafficmanager.net</strong> domain, organizations can simplify firewall rules and reduce reliance on intermediate DNS names.</p>\n<p>Traffic Manager linked records also help eliminate a common source of dangling subdomains caused by orphaned or misconfigured <strong>trafficmanager.net</strong> records, strengthening overall DNS hygiene and reducing operational risk.</p>\n<p><strong>DNSSEC for Traffic Manager</strong></p>\n<p>Traffic Manager routing decisions are now resolved within Azure DNS, If the DNS zone is a DNSSEC signed zone the answers supplied by linked Traffic Manager&nbsp;profiles are automatically signed as well. This enables customer to use Traffic Manager profiles with DNSSEC, unlike a CNAME to trafficmanager.net which would break the DNSSEC end to end validation chain as trafficmanager.net is not a signed zone.</p>\n<p><strong>Zone apex load balancing</strong></p>\n<p>Traffic Manager Linked Records enable DNS-based load balancing directly at the <strong>zone apex</strong> (for example, <strong>contoso.com</strong>), where traditional CNAME records are prohibited by DNS standards. Customers can now bring Traffic Manager routing to root domains without complex workarounds. This is similar to ALIAS records but with much better integration and scale.</p>\n<p><strong>Cleaner &amp; faster DNS responses</strong></p>\n<p>Clients now receive the final endpoint directly from Azure DNS instead of first resolving a <strong>trafficmanager.net</strong> hostname. By removing an extra DNS lookup, applications can experience lower DNS resolution latency while benefiting from Traffic Manager's intelligent routing decisions.</p>\n<p><strong>Built-in operational safeguards with strictly typed profiles</strong></p>\n<p>Traffic Manager Linked Records integrate with <strong>strictly typed profiles </strong>in Azure Traffic Manager, providing validation that helps ensure DNS record types remain compatible with their associated Traffic Manager profiles. In simpler words this features ensures that type of response served by the traffic manager profile matches the type of DNS records it is linked to.</p>\n<p>The feature also prevents accidental deletion of Traffic Manager profiles that are still referenced by Azure DNS records, reducing the risk of configuration errors and improving operational safety.</p>\n<h3>Getting started</h3>\n<p>Traffic Manager linked records are available today in <strong>public preview</strong>.</p>\n<p>Following record types can be used with Traffic Manager Linked Records</p>\n<ul>\n<li><strong>A </strong></li>\n<li><strong>AAAA </strong></li>\n<li><strong>CNAME </strong></li>\n</ul>\n<p>Traffic Manager linked records are designed to make DNS-based load balancing simpler, faster, and more secure while preserving the flexibility and reliability customers expect from Azure Traffic Manager.</p>\n<p>To learn more and start using Traffic Manager linked records today, see the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/dns/dns-traffic-manager-linked-records\" rel=\"noopener\" target=\"_blank\">DNS Traffic Management</a> documentation.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>"
