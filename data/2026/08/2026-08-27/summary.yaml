"overview": |
  この日は Azure SRE Agent と Azure Bastion の更新が並びました。SRE Agent は 30 日間のトライアルが一般提供となり、新規顧客が運用ツールやデータソースと接続して自分のペースで機能を試せるようになりました。VNet 統合の GA と Live Reports のプレビューもあわせて案内されています。Azure Bastion では AKS クラスターへの接続が一般提供となり、ローカルマシンから Bastion を経由した安全なトンネルで AKS の API サーバーへ到達できます。加えて IPv4/IPv6 デュアルスタック構成のプレビューと、共有リンクの有効期限設定の GA も加わりました。Apps on Azure Blog では「エージェントを制限するのではなく、その実行環境を制限せよ」という AI 安全性の考え方が示され、Microsoft Threat Intelligence は LiteLLM ゲートウェイの悪用を含む、露出した AI ワークロードへの攻撃を分析しています。
