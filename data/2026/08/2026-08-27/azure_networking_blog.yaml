    "title": "Azure DNS + Traffic Manager linked records"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/azure-dns-traffic-manager-linked-records/ba-p/4548221"
    "published": "2026-08-27 00:59:25"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Introduction</strong></p>\n<p>Traffic Manager linked records creates a direct, managed link between an Azure DNS record set and a Traffic Manager profile. When a query arrives, Azure DNS evaluates the linked Traffic Manager profile internally and returns the appropriate endpoint response directly. For A and AAAA records, this means the client receives endpoint IP addresses without an intermediate CNAME response to trafficmanager.net.</p>\n<p>This practical guide uses a small multi-region Contoso scenario to explain the architecture, configure the feature in the Azure portal, validate the DNS response, and demonstrate endpoint failover. The feature is currently in public preview, so the walkthrough should be tested in a non-production environment before broader adoption.</p>\n<p><strong>Note</strong>: DNS-based global routing is powerful, but the traditional integration between a custom domain and Traffic Manager adds an intermediate name that customers must understand, resolve, and govern.</p>\n<h1>The scenario and the problem</h1>\n<p>Contoso operates a public application across North America, Europe, and Asia. Users browse to contoso.com. Azure Traffic Manager monitors the regional endpoints and selects the preferred healthy destination according to the profile routing method.</p>\n<ul>\n<li>Traditional CNAME integration can expose the intermediate trafficmanager.net name in the DNS response.</li>\n<li>A CNAME cannot be placed at the zone of apex, which makes root-domain routing harder.</li>\n<li>An unsigned intermediate DNS hop can interrupt end-to-end DNSSEC validation.</li>\n<li>Operations teams must understand which system is authoritative for the customer zone, and which system makes the routing decision.</li>\n</ul>\n<p><strong>Design objective</strong></p>\n<p>Preserve Traffic Manager routing methods, endpoint health monitoring, and automatic failover while returning the effective endpoint answer directly from Azure DNS.</p>\n<h1>The solution: Traffic Manager linked records</h1>\n<img />\n<p><em>Figure 1. Traditional CNAME resolution compared with Traffic Manager linked record.</em></p>\n\n<p>As you see in figure 1 above, the left side shows the traditional path. The client queries the application name in Azure DNS, receives a CNAME that points to a trafficmanager.net profile name, and then performs another lookup before receiving the selected endpoint address. The right side shows the linked-record path. Azure DNS remains authoritative for the Contoso zone, consults the linked Traffic Manager profile internally, and returns the selected endpoint directly.</p>\n<p>The key point is that the Traffic Manager still performs the routing decision and health evaluation. Linked records change the DNS integration and the answer returned to the client; they do not turn Traffic Manager into a reverse proxy or place it in the application's data path.</p>\n<h1>Reference architecture</h1>\n<img />\n<p><em>Figure 2. Practical multi-region architecture for testing direct resolution and failover.</em></p>\n\n<p>Reference architecture in figure 2 above shows the client queries contoso.com. Azure Public DNS hosts the authoritative zone and contains a record set linked to the tm-profile Traffic Manager profile. The profile uses a configured routing method and continuously evaluates the health of the regional endpoints. Azure DNS uses the Traffic Manager decision and returns the effective endpoint answer to the client.</p>\n<p>For a simple lab, two endpoints are enough. Configure the first endpoint with priority 1 and the second with priority 2. The third regional endpoint in the diagram illustrates how the same design scales to additional regions. The record set can be created at the zone apex by leaving the record name empty, or for a subdomain such as www.</p>\n<p><strong>Note:</strong> Traffic Manager is DNS based. After name resolution, the client connects directly to the selected public endpoint. Application traffic does not pass through the Traffic Manager.</p>\n<h1>Prerequisites</h1>\n<ul>\n<li>An Azure subscription and permissions to create or update Azure DNS and Traffic Manager resources.</li>\n<li>A public domain hosted in Azure DNS and delegated to the Azure DNS name servers.</li>\n<li>Two public application endpoints that can return visibly different responses for failover testing.</li>\n<li>The Microsoft.Network resource provider is registered in every subscription that contains the DNS zone or Traffic Manager profile.</li>\n</ul>\n<h1>Implementation in the Azure portal</h1>\n<p>The portal workflow has two main parts: create a strictly typed Traffic Manager profile, then create an Azure DNS record set that links to that profile.</p>\n<h2>Create the Traffic Manager profile</h2>\n<p><strong>Step1:</strong> Open Traffic Manager profiles, select create.</p>\n<img />\n<p><strong>Step 2:</strong>&nbsp;Configure the profile and instance details, fill out the subscription, resource group, name(tm-profile), routing method: priority, record type: A, and resource group location.</p>\n<img />\n<p><strong>Step 3:</strong>&nbsp;Add endpoints (Add tmendpoint-1 as the public IP address and external endpoint type with priority 1.</p>\n<img /><img />\n<p><strong>Step 4:</strong>&nbsp;Repeat Step 3 to add the secondary endpoint (Add tmendpoint-2 as the public IP address and external endpoint type with priority 2)</p>\n<p><strong>Step 5:</strong> Confirm endpoint health (Wait until both endpoints report online before testing DNS behavior.)</p>\n<img />\n<p><strong>Note:</strong>&nbsp;The record type selection creates a strictly typed profile. Select A for IPv4 answers, AAAA for IPv6 answers, or CNAME for canonical-name answers. The type is used to validate compatibility between the Traffic Manager profile and the linked DNS record.</p>\n<h2>Create the linked record in Azure DNS</h2>\n<p><strong>Step 1: </strong>Open the Azure DNS zone, select the zone that hosts the application domain, for example contoso.com.</p>\n<img />\n<p><strong>Step 2:&nbsp;</strong>Add DNS record sets, select + record set.</p>\n<img />\n<p><strong>Step 3:</strong>&nbsp;Choose the record name, leave name empty for the zone apex or enter www for a subdomain.</p>\n<img />\n<p><strong>Step 4:</strong> Choose the type, select the record type that matches the Traffic Manager profile, for example, A.</p>\n<p><strong>Step 5: </strong>Enable Traffic Management, select Enable Traffic Management (Preview).</p>\n<p><strong>Step 6: </strong>Select the profile, choose the profile subscription and tm-profile, then save the record set.</p>\n<p><strong>Note</strong>: The record set contains a managed association to the Traffic Manager profile. The linked record inherits its TTL from the Traffic Manager profile.</p>\n<p>In the Azure DNS record list, the new record should appear as a linked record associated with the Traffic Manager profile. For an apex A record, the conceptual result is:</p>\n<img />\n<h1>Validate the DNS response</h1>\n<p>Use both the Azure portal and direct DNS query. The portal confirms the resource association; the DNS query confirms the serving behavior.</p>\n<h2>Portal validation</h2>\n<ul>\n<li>The record exists in the expected Azure DNS zone.</li>\n<li>The record type matches the strictly typed Traffic Manager profile.</li>\n<li>The linked profile is tm-profile.</li>\n<li>The Traffic Manager endpoints show their expected health state.</li>\n</ul>\n<h2>Command-line validation</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><img />\n<p>&nbsp;</p>\n</div>\n<p>A successful A-record test returns the selected healthy endpoint IP address and does not include a trafficmanager.net CNAME in the answer. Querying for an Azure DNS authoritative name server directly is useful during testing because it reduces ambiguity from local recursive resolver caches.</p>\n<p>The specific endpoint returned depends on the routing method, endpoint health, source resolver location, and cached TTL behavior. Validate the result against the profile configuration rather than expecting one universal IP address.</p>\n<h1>Prove automatic failover</h1>\n<p>A practical demonstration should show that the linked record is not static. The returned answer continues to reflect Traffic Manager health decisions.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-center\"><table border=\"1\" class=\"lia-background-color-16 lia-border-color-21 lia-border-style-solid\" style=\"width: 74.6296%; border-width: 1px;\"><thead><tr><td class=\"lia-border-color-21\">\n<p><strong>Step</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p><strong>Portal action</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p><strong>What to configure</strong></p>\n</td></tr></thead><tbody><tr><td class=\"lia-border-color-21\">\n<p><strong>1</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p>Browse to contoso.com</p>\n</td><td class=\"lia-border-color-21\">\n<p>Confirm the priority 1 endpoint serves the application.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>2</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p>Stop priority 1 endpoint</p>\n</td><td class=\"lia-border-color-21\">\n<p>Uncheck the enable endpoint config in tm-profile or stop the VM</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>3</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p>Monitor Traffic Manager</p>\n</td><td class=\"lia-border-color-21\">\n<p>Wait until the endpoint status changes to unhealthy.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>4</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p>Clear local cache</p>\n</td><td class=\"lia-border-color-21\">\n<p>On Windows, run ipconfig /flushdns before querying again.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>5</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p>Query or browse again</p>\n</td><td class=\"lia-border-color-21\">\n<p>Confirm the priority 2 endpoint is now selected.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>6</strong></p>\n</td><td class=\"lia-border-color-21\">\n<p>Restore the primary endpoint</p>\n</td><td class=\"lia-border-color-21\">\n<p>Start the endpoint and confirm it returns to online.</p>\n</td></tr></tbody><colgroup><col style=\"width: 7.45168%;\" /><col style=\"width: 33.4344%;\" /><col style=\"width: 59.0906%;\" /></colgroup></table></div>\n<h1>Why this matters for real architecture</h1>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-background-color-16 lia-border-color-21 lia-border-style-solid\" style=\"width: 85.0926%; height: 442px; border-width: 1px;\"><tbody><tr><td class=\"lia-border-color-21\">\n<p><strong>Cleaner DNS answers</strong></p>\n<p>The client receives the effective endpoint result directly instead of resolving an intermediate trafficmanager.net name.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>Zone-apex routing</strong></p>\n<p>Linked records can be used at the root domain, where DNS standards do not allow a CNAME record.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>DNSSEC compatibility</strong></p>\n<p>Keeping resolution inside Azure DNS removes the unsigned intermediate trafficmanager.net hop from the customer response chain.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>Operational type safety</strong></p>\n<p>Strictly typed profiles help ensure that the linked DNS record type and Traffic Manager endpoint response type remain compatible.</p>\n</td></tr><tr><td class=\"lia-border-color-21\">\n<p><strong>Preserved routing intelligence</strong></p>\n<p>Traffic Manager routing methods, endpoint monitoring, and automatic failover continue to determine the selected endpoint.</p>\n</td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<h1>Preview and operational considerations</h1>\n<ul>\n<li>Treat the feature as preview and review the Microsoft Azure preview supplemental terms before production use.</li>\n<li>Confirm that the DNS zone and Traffic Manager profile subscriptions have the required resource provider registration.</li>\n<li>Plan the record type before creating the Traffic Manager profile because the strictly typed profile value cannot be changed after creation.</li>\n<li>Remember that the record TTL is inherited from the Traffic Manager profile.</li>\n<li>Test routing, endpoint health, DNSSEC behavior, zone-apex resolution, and rollback in a controlled environment.</li>\n<li>Document the previous DNS record so the change can be reversed if the validation plan fails.</li>\n</ul>\n<h1>Conclusion</h1>\n<p>Traffic Manager linked records is a focused DNS improvement with meaningful architectural impact.</p>\n<p>The feature keeps Azure DNS authoritative for the customer domain, preserves Traffic Manager health-aware routing, and removes the need for the client to follow an intermediate trafficmanager.net hop. That creates a cleaner DNS response path and enables scenarios that were difficult with a traditional CNAME, especially zone-apex routing and DNSSEC-protected domains.</p>\n<p>The strongest way to evaluate the feature is through a small, observable lab: create a strictly typed profile, link an Azure DNS record, query the authoritative DNS server, and deliberately fail the primary endpoint. When the DNS response changes to the secondary healthy destination without exposing an intermediate Traffic Manager name, the value becomes immediately clear.</p>\n<p>&nbsp;</p>\n<p><strong>Final takeaway</strong></p>\n<p>A small change in DNS integration can simplify the client experience without giving up Traffic Manager routing intelligence, monitoring, or failover.</p>\n<p>&nbsp;</p>\n<p>I hope you enjoyed it!</p>\n<p>&nbsp;</p>\n<h1>References</h1>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/dns/dns-traffic-manager-linked-records\" rel=\"noopener\" target=\"_blank\">Traffic Manager linked records overview - Azure DNS</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/dns/tutorial-traffic-manager-linked-records-portal\" rel=\"noopener\" target=\"_blank\">Tutorial: Create a Traffic Manager linked record - Azure portal - Azure DNS</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/dns/tutorial-traffic-manager-linked-records-cli\" rel=\"noopener\" target=\"_blank\">Create a Traffic Manager linked record using Azure CLI</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-overview\" rel=\"noopener\" target=\"_blank\">Azure Traffic Manager overview</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-how-it-works\" rel=\"noopener\" target=\"_blank\">How Azure Traffic Manager works</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/dns/dns-faq\" rel=\"noopener\" target=\"_blank\">Azure DNS FAQ</a></li>\n</ul>\n<p>&nbsp;</p>\n<p><em><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Visual note:</strong> Figures in this document were generated with Microsoft Copilot for explanatory use.</em></p>"
