    "id": "db3f62100071d6c0b21bfeac432baf38"
    "title": "Beyond Deployment: What It Really Takes to Run GitHub Actions Runners on AKS"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/beyond-deployment-what-it-really-takes-to-run-github-actions/ba-p/4547638"
    "published": "2026-08-18 15:44:57"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<h1><strong>A Successful Demo Is Not a Production Platform</strong></h1>\n<p>Getting GitHub Actions runners working on Azure Kubernetes Service (AKS) with Actions Runner Controller (ARC) is relatively straightforward. Within a short time, you can deploy ARC, register a runner scale set, and execute workflows successfully.</p>\n<p>However, a successful runner only proves that the components can communicate.</p>\n<p>It does not prove the platform is secure, supportable, observable, or ready to support multiple engineering teams.</p>\n<p>In our experience, moving ARC from proof of concept to production was defined less by Kubernetes deployment and more by operational decisions around identity, network connectivity, workload isolation, runner images, and ownership.</p>\n<h5>\U0001F3AF<strong> Production Reality</strong></h5>\n<p>Running a workflow successfully proves the deployment works.</p>\n<p>Running hundreds of workflows across multiple engineering teams proves the platform works.</p>\n<h1><strong>Identity Scope Is an Architecture Decision</strong></h1>\n<p>Authentication should be treated as a platform design decision rather than a deployment parameter.</p>\n<p>Repository- and organization-level runner scale sets typically use a GitHub App, while enterprise-level runner scale sets require a Personal Access Token (Classic).</p>\n<p>Before deployment, establish:</p>\n<ul>\n<li>Where the runner scale set will be registered</li>\n<li>Which repositories can use the runner group</li>\n<li>How credentials will be stored and rotated</li>\n<li>Who owns authentication lifecycle management</li>\n</ul>\n<p>The following values quickly become platform dependencies:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 92.2222%; height: 292px; border-width: 1px;\"><tbody><tr class=\"lia-background-color-5\" style=\"height: 39px;\"><td style=\"height: 39px;\">\n<p><span class=\"lia-text-color-21\"><strong>Placeholder</strong></span></p>\n</td><td style=\"height: 39px;\">\n<p><span class=\"lia-text-color-21\"><strong>Represents</strong></span></p>\n</td><td style=\"height: 39px;\">\n<p><span class=\"lia-text-color-21\"><strong>Example</strong></span></p>\n</td></tr><tr style=\"height: 47px;\"><td style=\"height: 47px;\">\n<p>&lt;GITHUB_CONFIG_URL&gt;</p>\n</td><td style=\"height: 47px;\">\n<p>GitHub scope hosting runners</p>\n</td><td style=\"height: 47px;\">\n<p>https://github.com/contoso</p>\n</td></tr><tr style=\"height: 39px;\"><td style=\"height: 39px;\">\n<p>&lt;RUNNER_GROUP&gt;</p>\n</td><td style=\"height: 39px;\">\n<p>Repository access boundary</p>\n</td><td style=\"height: 39px;\">\n<p>aks-platform-runners</p>\n</td></tr><tr style=\"height: 39px;\"><td style=\"height: 39px;\">\n<p>&lt;RUNNER_SCALE_SET_NAME&gt;</p>\n</td><td style=\"height: 39px;\">\n<p>Workflow target name</p>\n</td><td style=\"height: 39px;\">\n<p>aks-arc-linux</p>\n</td></tr><tr style=\"height: 39px;\"><td style=\"height: 39px;\">\n<p>&lt;CONTROLLER_NAMESPACE&gt;</p>\n</td><td style=\"height: 39px;\">\n<p>ARC controller namespace</p>\n</td><td style=\"height: 39px;\">\n<p>arc-systems</p>\n</td></tr><tr style=\"height: 39px;\"><td style=\"height: 39px;\">\n<p>&lt;RUNNER_NAMESPACE&gt;</p>\n</td><td style=\"height: 39px;\">\n<p>Runner namespace</p>\n</td><td style=\"height: 39px;\">\n<p>arc-runners</p>\n</td></tr><tr style=\"height: 45px;\"><td style=\"height: 45px;\">\n<p>&lt;RUNNER_IMAGE&gt;</p>\n</td><td style=\"height: 45px;\">\n<p>Runner image reference</p>\n</td><td style=\"height: 45px;\">\n<p>contoso.azurecr.io/actions-runner:2.329.0</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>\U0001F4A1 <strong>Production Insight</strong></p>\n<p>The biggest challenge is rarely authentication itself.</p>\n<p>It is defining ownership when credentials need to be rotated, audited, recovered, or replaced.</p>\n<h1><strong>DNS and Egress Are Part of the Runner Platform</strong></h1>\n<p>Many ARC deployments focus on Kubernetes configuration while underestimating network dependencies.</p>\n<p>A workflow may authenticate successfully with GitHub and still fail because actions, artifacts, package feeds, registries, or deployment targets are unreachable.</p>\n<p>In addition to workflow-specific dependencies, ensure that AKS outbound requirements for your chosen networking model are satisfied. AKS platform dependencies are separate from ARC and workflow connectivity requirements.</p>\n<p>The table below provides a practical baseline for outbound connectivity validation.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 92.2222%; height: 372px; border-width: 1px;\"><tbody><tr class=\"lia-background-color-5\"><td>\n<p><strong>Traffic Category</strong></p>\n</td><td>\n<p><strong>Common Destinations</strong></p>\n</td><td>\n<p><strong>Port</strong></p>\n</td><td>\n<p><strong>Why It Matters</strong></p>\n</td></tr><tr><td>\n<p>GitHub API and Registration</p>\n</td><td>\n<p>github.com, api.github.com</p>\n</td><td>\n<p>TCP 443</p>\n</td><td>\n<p>Authentication and runner registration</p>\n</td></tr><tr><td>\n<p>Actions Communication</p>\n</td><td>\n<p>*.actions.githubusercontent.com</p>\n</td><td>\n<p>TCP 443</p>\n</td><td>\n<p>Job execution and results</p>\n</td></tr><tr><td>\n<p>Actions Downloads</p>\n</td><td>\n<p>codeload.github.com, objects.githubusercontent.com</p>\n</td><td>\n<p>TCP 443</p>\n</td><td>\n<p>Action and runner downloads</p>\n</td></tr><tr><td>\n<p>GitHub Packages</p>\n</td><td>\n<p>ghcr.io, *.pkg.github.com</p>\n</td><td>\n<p>TCP 443</p>\n</td><td>\n<p>Images and packages</p>\n</td></tr><tr><td>\n<p>Azure APIs</p>\n</td><td>\n<p>management.azure.com, login.microsoftonline.com</p>\n</td><td>\n<p>TCP 443</p>\n</td><td>\n<p>Azure deployments and authentication</p>\n</td></tr><tr><td>\n<p>DNS Resolution</p>\n</td><td>\n<p>Cluster DNS path</p>\n</td><td>\n<p>UDP/TCP 53</p>\n</td><td>\n<p>Required for endpoint resolution</p>\n</td></tr><tr><td>\n<p>Private Registry</p>\n</td><td>\n<p>&lt;CONTAINER_REGISTRY_FQDN&gt;</p>\n</td><td>\n<p>TCP 443</p>\n</td><td>\n<p>Runner image pulls</p>\n</td></tr><tr><td>\n<p>Workflow Dependencies</p>\n</td><td>\n<p>Package feeds, scanners, deployment targets</p>\n</td><td>\n<p>Varies</p>\n</td><td>\n<p>Workflow-specific requirements</p>\n</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<h6><strong>✅ Validation Tip</strong></h6>\n<p>Always validate connectivity <strong>from the runner pod itself</strong>.</p>\n<p>Validating from the AKS node does not guarantee workflow traffic can reach required endpoints.</p>\n<h1><strong>Separate ARC Management from Workflow Execution</strong></h1>\n<p>A production deployment should isolate platform components from workload execution.</p>\n<p>A common architecture looks like:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>The controller manages ARC resources, while ephemeral runner pods execute arbitrary workflow code.</p>\n<p>For operational and security reasons, these workloads should not share the same boundary.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 92.2222%; height: 118px; border-width: 1px;\"><tbody><tr class=\"lia-background-color-5\"><td>\n<p><strong>Component</strong></p>\n</td><td>\n<p><strong>Namespace</strong></p>\n</td></tr><tr><td>\n<p>ARC Controller</p>\n</td><td>\n<p>Dedicated management namespace</p>\n</td></tr><tr><td>\n<p>Listeners and Runners</p>\n</td><td>\n<p>Dedicated runner namespace</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>Another important design choice is container execution strategy.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 92.3148%; height: 196px; border-width: 1px;\"><tbody><tr class=\"lia-background-color-5\"><td>\n<p><strong>Model</strong></p>\n</td><td>\n<p><strong>Benefits</strong></p>\n</td><td>\n<p><strong>Considerations</strong></p>\n</td></tr><tr><td>\n<p>Docker-in-Docker</p>\n</td><td>\n<p>Maximum workflow compatibility</p>\n</td><td>\n<p>Privileged containers</p>\n</td></tr><tr><td>\n<p>Kubernetes Mode</p>\n</td><td>\n<p>Better isolation</p>\n</td><td>\n<p>Additional complexity</p>\n</td></tr><tr><td>\n<p>No Container Mode</p>\n</td><td>\n<p>Simpler operations</p>\n</td><td>\n<p>Limited workload support</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The right choice depends on workload requirements and security expectations.</p>\n<h1><strong>Configuration Names Become Platform Contracts</strong></h1>\n<p>One of the most overlooked production considerations is naming.</p>\n<p>A runner scale set name is not merely a Helm value. It becomes an interface consumed by development teams through the runs-on configuration.</p>\njobs: \n  plan: \n    name: ARC runner validation \n    runs-on: &lt;RUNNER_SCALE_SET_NAME&gt; \n    steps: \n      - name: Checkout \n        uses: actions/checkout@v4 \n      - name: Validate runner \n        run: | \n          echo \"Running on an ARC self-hosted runner\" \n          uname -a \n<p>The following quickly become platform contracts:</p>\n<ul>\n<li>Runner scale set names</li>\n<li>Runner groups</li>\n<li>Namespace boundaries</li>\n<li>Runner image references</li>\n</ul>\n<p>Choose these names carefully and document which values are intended to remain stable.</p>\n<p>A repository should not need to understand ARC internals. It should consume a predictable runner service.</p>\n<h1><strong>Treat Runner Images as Managed Artifacts</strong></h1>\n<p>Custom runner images often begin as a convenience and eventually become shared platform dependencies.</p>\n<p>Treat them as managed platform artifacts.</p>\n<p>Recommended practices include:</p>\n<ul>\n<li>Pin runner versions</li>\n<li>Pin base image versions</li>\n<li>Scan images before release</li>\n<li>Publish immutable tags or digests</li>\n<li>Validate representative workflows</li>\n<li>Maintain tested rollback versions</li>\n</ul>\n<p>Once multiple repositories depend on a runner image, each image update effectively becomes a production release.</p>\n<h1><strong>Design Observability Beyond Job Success</strong></h1>\n<p>A successful workflow confirms execution, not operational readiness.</p>\n<p>Monitor the entire platform, not only workflow outcomes.</p>\n<h5>At a minimum, retain logs for:</h5>\n<ul>\n<li>ARC controller</li>\n<li>Listener components</li>\n<li>Runner pods</li>\n</ul>\n<h5>Monitor:</h5>\n<ul>\n<li>Queue duration</li>\n<li>Pod provisioning latency</li>\n<li>Authentication failures</li>\n<li>Image pull failures</li>\n<li>Scheduling failures</li>\n</ul>\n<h5>Alerts should help distinguish between:</h5>\n<ul>\n<li>GitHub-side issues</li>\n<li>AKS scheduling problems</li>\n<li>Capacity constraints</li>\n<li>DNS failures</li>\n<li>Identity failures</li>\n<li>Network connectivity issues</li>\n</ul>\n<p>The objective is not simply knowing that a workflow failed but understanding exactly where it failed.</p>\n<h1><strong>Production Readiness Checklist</strong></h1>\n<p>Before onboarding additional teams, validate the following:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 92.2222%; height: 352px; border-width: 1px;\"><tbody><tr class=\"lia-background-color-5\"><td>\n<p><strong>Area</strong></p>\n</td><td>\n<p><strong>Validation</strong></p>\n</td></tr><tr><td>\n<p>Platform</p>\n</td><td>\n<p>Controller healthy and runner pods created</p>\n</td></tr><tr><td>\n<p>Scale Set</p>\n</td><td>\n<p>Visible in expected GitHub scope</p>\n</td></tr><tr><td>\n<p>Access</p>\n</td><td>\n<p>Repository permissions validated</p>\n</td></tr><tr><td>\n<p>Network</p>\n</td><td>\n<p>GitHub, Azure, Registry and DNS reachable</p>\n</td></tr><tr><td>\n<p>Images</p>\n</td><td>\n<p>Runner image tested and scanned</p>\n</td></tr><tr><td>\n<p>Execution</p>\n</td><td>\n<p>Container execution model validated</p>\n</td></tr><tr><td>\n<p>Observability</p>\n</td><td>\n<p>Logs retained outside ephemeral runners</p>\n</td></tr><tr><td>\n<p>Operations</p>\n</td><td>\n<p>Rotation, rollback, ownership and escalation documented</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h1><strong>Troubleshoot ARC by Failure Boundary</strong></h1>\n<p>When troubleshooting, start by identifying where workflow execution stopped.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 92.2222%; height: 284px; border-width: 1px;\"><tbody><tr class=\"lia-background-color-5\"><td>\n<p><strong>Symptom</strong></p>\n</td><td>\n<p><strong>Check</strong></p>\n</td><td>\n<p><strong>Remediation</strong></p>\n</td></tr><tr><td>\n<p>Runners not visible in GitHub</p>\n</td><td>\n<p>Authentication and runner-group access</p>\n</td><td>\n<p>Validate credentials and scope</p>\n</td></tr><tr><td>\n<p>Runner pods not created</p>\n</td><td>\n<p>Scale set and controller status</p>\n</td><td>\n<p>Inspect controller logs and events</p>\n</td></tr><tr><td>\n<p>No matching runner available</p>\n</td><td>\n<p>Scale set name and permissions</p>\n</td><td>\n<p>Verify runner-group access</p>\n</td></tr><tr><td>\n<p>Image pull failures</p>\n</td><td>\n<p>Registry access and DNS</p>\n</td><td>\n<p>Validate image path and connectivity</p>\n</td></tr><tr><td>\n<p>Registration failures</p>\n</td><td>\n<p>Authentication configuration</p>\n</td><td>\n<p>Validate GitHub App or PAT settings</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<h1><strong>From a Working Runner to a Dependable Platform</strong></h1>\n<p>Our journey showed that deploying ARC is rarely the hardest part. The complexity emerges when runners become a shared service supporting multiple teams, environments, and business-critical workloads.</p>\n<p>The organizations that succeed with ARC focus not only on deployment, but also on operational excellence, governance, reliability, and clear ownership from day one.</p>\n<p>A green workflow run demonstrates capability. Consistent performance through outages, upgrades, scaling demands, and changing requirements demonstrates platform maturity.</p>\n<p><strong>\"Deploying ARC is a project. Operating it is a platform responsibility.\"</strong></p>"
