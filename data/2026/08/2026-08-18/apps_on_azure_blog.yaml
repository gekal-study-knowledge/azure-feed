    "title": "Announcing General Availability of Managed Instance on Azure App Service"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/announcing-general-availability-of-managed-instance-on-azure-app/ba-p/4541283"
    "published": "2026-08-18 23:16:56"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>Today, we are thrilled to announce the General Availability (GA) of Managed Instance on Azure App Service. Following the tremendous response to our&nbsp; <a class=\"lia-external-url\" href=\"http://(https://techcommunity.microsoft.com/blog/appsonazureblog/announcing-public-preview-of-managed-instance-on-azure-app-service/4469930\" rel=\"noopener\" target=\"_blank\">Public Preview announcement at Ignite 2025</a>, we've spent the past nine months working closely with customers, partners, and the community to harden the platform, expand capabilities, and validate real-world enterprise migration scenarios. Managed Instance on Azure App Service is now ready for your production workloads, backed by a full enterprise SLA.</p>\n<h2>The journey from Preview to GA</h2>\n<p>Since November 2025, thousands of customers have used the public preview to move workloads that were previously \"stuck\" on-premises or on aging Windows Server VMs. The feedback has been unmistakable: <strong>Managed Instance on Azure App Service dramatically shortens the path to the cloud for legacy and complex .NET Framework applications </strong>often removing the need for code changes entirely.</p>\n<p>Enterprises across various sectors like financial services, healthcare, manufacturing, and the public sector migrated applications that depended on GAC assemblies, COM components, Windows Services, registry configuration, and mapped network drives apps that historically required expensive re-platforming or a full rewrite. With Managed Instance on Azure App Service, these workloads now run on a fully managed PaaS platform, side-by-side with modern cloud-native apps.</p>\n<h2>What's new at GA</h2>\n<p>Building on the preview foundation of <strong>configuration scripts, registry adapters, storage mounts, and RDP via Azure Bastion</strong>, GA brings several important additions:</p>\n<ul>\n<li><strong>Production SLA (99.95%)</strong> – Full enterprise-grade availability commitment across all supported regions.</li>\n<li><strong>Expanded regional availability</strong> – Available in at least 8 Azure regions worldwide at GA with continued expansion planned through the remainder of 2026.</li>\n<li><strong>Deeper Premium v4 integration</strong> – Managed Instance now takes full advantage of the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/app-service/app-service-configure-premium-v4-tier\" rel=\"noopener\" target=\"_blank\">Premium v4 App Service Plan</a> tier for enhanced performance, memory-optimized SKUs, and improved price-performance.</li>\n<li><strong>Zone redundancy</strong> – Deploy Managed Instance workloads across Availability Zones for higher resiliency without additional configuration effort.</li>\n<li><strong>Enhanced observability</strong> – First-class integration with Azure Monitor, Application Insights, and Log Analytics, including instance-level metrics for CPU, memory and disk.</li>\n<li><strong>Improved configuration script experience</strong> – Faster startup times, richer diagnostics when scripts fail, versioning support for configuration bundles, and streamlined rollback.</li>\n<li><strong>Managed Identity everywhere</strong> – All secrets, storage connections, and Key Vault references at GA use Managed Identity by default, eliminating stored credentials from your deployment pipelines.</li>\n<li><strong>Azure Policy and Defender for Cloud coverage</strong> – Governance, compliance, and threat protection controls now apply to Managed Instance the same way they apply to standard App Service workloads.</li>\n<li><strong>Bicep, Terraform, and ARM templates</strong> – Full IaC support with new resource providers and modules for repeatable, auditable deployments.</li>\n<li>\n<p><strong>GitHub Copilot Modernization</strong> - Deep Integration with GitHub Copilot modernization for Application assessment targeting Managed Instance on App Service <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/dotnet/azure/migration/appmod/working-with-assessment\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/dotnet/azure/migration/appmod/working-with-assessment</a>&nbsp;</p>\n</li>\n</ul>\n<h2>Why customers are choosing Managed Instance on Azure App Service</h2>\n<p>The core value proposition remains the same and it's stronger than ever at GA:</p>\n<h3>1. Lift-and-Improve legacy applications</h3>\n<p>Migrate .NET Framework apps with hardcoded file paths, COM dependencies, GAC entries, or registry access <strong>with no major code rewrites</strong>. Install custom components directly on the managed instance using configuration scripts.</p>\n<h3>2. Re-platform hard-to-modernize apps</h3>\n<p>Move applications with lost source code, legacy middleware (MSMQ, SMTP servers, third-party runtimes), or tight infrastructure coupling. Managed Instance removes the blockers that historically forced these apps to stay on VMs.</p>\n<h3>3. Hybrid and regulated workloads</h3>\n<p>Integrate securely with on-premises resources using VNet integration and private endpoints. Enforce data residency, Bring Your Own Storage, and Managed Identity–backed access controls to meet finance, healthcare, and government compliance requirements.</p>\n<h3>4. Incremental modernization</h3>\n<p>Start with \"lift and Improve\" then adopt PaaS features like DevOps automation, autoscaling, deployment slots, and centralized configuration at your own pace. Future-proof your portfolio without a big-bang transformation.</p>\n<h2>What customers are saying</h2>\n<p>During preview, we saw real numbers:</p>\n<ul>\n<li><strong>Migration timelines cut from months to weeks</strong> for apps that would otherwise have required substantial refactoring.</li>\n<li><strong>Zero code changes</strong> for a significant share of preview workloads that previously blocked App Service adoption.</li>\n<li><strong>Reduced infrastructure footprint</strong> as customers consolidated Windows Server VMs onto managed App Service Plans with zone redundancy and autoscaling built in.</li>\n</ul>\n<p>We are grateful to every preview customer whose feedback shaped this release.</p>\n<h2>Pricing and licensing</h2>\n<p>Managed Instance on Azure App Service is billed as a capability on top of the Premium v4 App Service Plan. There is no separate Managed Instance surcharge at GA you pay for the underlying Premium v4 compute you consume. Existing App Service reservations, savings plans, and any other Azure Benefit all apply, helping you optimize the total cost of ownership as you migrate.</p>\n<h2>Getting started</h2>\n<p>Getting started is straightforward:</p>\n<ol>\n<li><strong>Assess</strong> your workload using Azure Migrate's updated App Service assessment, which now flags candidates ideal for Managed Instance.</li>\n<li><strong>Create</strong> a new Web App using the <em>Managed Instance on Azure App Service</em> option in the Azure Marketplace, or via Bicep, Terraform, or the Azure CLI.</li>\n<li><strong>Package</strong> your dependencies into a configuration bundle (a zip file plus a PowerShell install script) and store it in Azure Storage. Grant access via Managed Identity.</li>\n<li><strong>Configure</strong> registry values, storage mounts, and networking to match your on-premises environment.</li>\n<li><strong>Deploy</strong> your application using the same App Service deployment mechanisms you already know—ZIP deploy, GitHub Actions, Azure DevOps, or Visual Studio publish.</li>\n<li><strong>Operate</strong> with confidence use RDP over Azure Bastion for deep troubleshooting when you need it, and Azure Monitor for everything else.</li>\n</ol>\n<h2>Resources</h2>\n<ul>\n<li>\U0001F4D8 <a href=\"https://learn.microsoft.com/azure/app-service/\" rel=\"noopener\" target=\"_blank\">Managed Instance on Azure App Service documentation</a></li>\n<li>\U0001F3A5 <a class=\"lia-external-url\" href=\"https://build.microsoft.com/en-US/sessions/OD801\" rel=\"noopener\" target=\"_blank\">Technical Deep Dive session recording from Build 2026</a></li>\n<li>\U0001F9ED <a class=\"lia-external-url\" href=\"https://github.com/Azure/Managed-Instance-on-Azure-App-Service\" rel=\"noopener\" target=\"_blank\">GitHub Repo</a> with sample configuration scripts, webapp and guidance for Managed Instance on App Service workloads</li>\n</ul>\n<h2>Looking ahead</h2>\n<p>GA is a milestone, not a finish line. On our roadmap we're already working on:</p>\n<ul>\n<li><strong>Deeper integration with Azure Migrate's </strong>web app discovery and assessment capabilities to help identify web apps suitable for migration to Managed Instance on App Service</li>\n<li><strong>Enhanced migration tooling</strong> with easier dependency detection and one-click configuration bundle generation.</li>\n<li><strong>Expanded Rollout </strong>to Azure Regions across 2026 and beyond.</li>\n<li><strong>Continuously Release</strong> new features and capabilities to make migrations easier and faster than ever before</li>\n</ul>\n<p>We can't wait to see what you build and what you&nbsp;<em>migrate</em>. Managed Instance on Azure App Service is here to make your modernization journey faster, simpler, and more secure than ever.</p>\n<p><strong>Welcome to GA.</strong> \U0001F680</p>\n<p><em>The Azure App Service Team</em></p>"
  "80df14bb2ce9cdafef38aa6597bac09b":
    "id": "80df14bb2ce9cdafef38aa6597bac09b"
    "title": "Why Cloud Browsers Are Becoming Enterprise Infrastructure for AI Agents and Automation"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/why-cloud-browsers-are-becoming-enterprise-infrastructure-for-ai/ba-p/4547583"
    "published": "2026-08-18 13:30:35"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<h1>The browser is becoming a new execution environment</h1>\n<p>Over the last decade, enterprises moved compute from desktops to the cloud. Applications that once depended on individual machines now run on scalable, managed infrastructure.&nbsp;A similar shift is beginning to happen with browser automation.</p>\n<p>Browsers were originally designed for humans. A person opened a browser, navigated through websites, completed transactions, submitted forms, and consumed information. Today, a growing number of those same activities are being performed by automated systems. Test suites validate critical business applications before every release. Business workflows interact with legacy web portals that lack APIs. Most recently, AI agents have begun using browsers to access information and complete tasks on behalf of users.</p>\n<p>This creates a new question for enterprises: \"Where should those browser interactions run?\"</p>\n<p>Running a browser on a developer's laptop may be sufficient for experimentation and small-scale automation. However, it becomes increasingly difficult when hundreds of automated workflows, thousands of test executions, or fleets of AI agents require secure, isolated, observable, and governed browser environments.</p>\n<p>As organizations operationalize browser automation, the browser itself is evolving from a desktop application into enterprise infrastructure.</p>\n<h1>Enterprise cloud browsers solve a different problem than local browsers</h1>\n<p>Initially browser automation focused primarily on helping developers automate repetitive tasks and run tests. Today's enterprise requirements are significantly broader. Organizations need environments that can safely support autonomous execution while maintaining visibility, compliance, and operational control.&nbsp;</p>\n<p>Cloud-hosted browsers are changing the landscape for browser automation. Instead of treating the browser as something attached to one machine, they are turning it into an elastic, isolated, observable runtime. Modern automation is no longer about running one script. It is many agents, scrapers, workflows, and tests operating in parallel across websites, regions, identities, and environments.</p>\n<p>Some real-world problems that enterprises want to solve with the help of browser automation:</p>\n<ul>\n<li>\"We have 300 employees doing thousands of data transcription operations each day, need an alternate for RPA on legacy websites\"</li>\n<li>\"I want to get pricing of my SKUs across hundreds of websites, across devices, across geographies, daily &amp; almost real time\"</li>\n<li>\"We want to run E2E tests on our app across varied scenarios, geographies so that the quality is always very high for our customers\"</li>\n</ul>\n<img />\n<h2>Security and governance by design</h2>\n<p>Security is often the first concern enterprises raise when evaluating browser-based automation and AI agents. Browsers routinely execute untrusted code, render external content, download files, interact with third-party services, and handle sensitive information. When autonomous agents begin operating those browsers, the risk profile becomes even more significant. Cloud-hosted browsers provide a controlled environment where organizations can apply governance consistently across browser sessions.</p>\n<p>This includes:</p>\n<ul>\n<li><strong>Isolated browser sessions</strong></li>\n<li><strong>Role-based access controls</strong></li>\n<li><strong>Data residency and compliance controls</strong></li>\n<li><strong>Network controls</strong></li>\n<li><strong>Audit logging and activity tracking</strong></li>\n</ul>\n<p>A governed cloud environment provides a more practical foundation for these controls than unmanaged browser instances running on individual devices.</p>\n<ul>\n<li><strong>Secure automation on enterprise portals:</strong> Finance, procurement, and operations teams can execute transactions on legacy ERP, supplier, and line-of-business applications using managed browser sessions, centralized credentials, and policy controls rather than maintaining dedicated desktops for each workflow.</li>\n<li><strong>Customer support operations:</strong> Service teams can update accounts, process requests, and interact with multiple internal and external systems through individual browser sessions with centralized logging, replay, and live-view capabilities for troubleshooting.</li>\n</ul>\n<h2>Observability becomes critical</h2>\n<p>One of the most significant differences between experimentation and production automation is operational visibility. When a test fails, a workflow breaks, or an AI agent performs an unexpected action, organizations need to understand exactly what happened. This requires more than simply knowing whether the automation succeeded or failed.</p>\n<p>Key observability features that cloud browser platforms are offering:</p>\n<ul>\n<li><strong>Live view</strong></li>\n<li><strong>Screenshots and recordings</strong></li>\n<li><strong>Audit records</strong></li>\n<li><strong>Network traces</strong></li>\n<li><strong>Execution logs</strong></li>\n<li><strong>Browser console output</strong></li>\n</ul>\n<p>These capabilities help engineering teams troubleshoot failures, allow operations teams to investigate incidents, and provide governance teams with accountability for automated actions.&nbsp;As browser-based agents become part of critical business processes, observability is becoming a foundational requirement to move to production.</p>\n<ul>\n<li><strong>KYC and compliance verification:</strong> Financial institutions can automate identity checks across registries, verification services, and compliance portals while maintaining isolated customer sessions, auditability, and human review for high-risk decisions.</li>\n<li>\n<p><strong>Checkout and payment validation:</strong> E-commerce teams can validate end-to-end purchasing journeys using session recordings, traces, screenshots, and live browser visibility to quickly diagnose checkout failures, flaky tests, payment gateway issues, and abandoned transactions.</p>\n</li>\n</ul>\n<h3>Reproducibility and environment consistency</h3>\n<p>Local browsers often fail due to incorrectly setting up environments to complete the task at hand. One runner may have a different browser version; another may have a stale driver or a missing system package. The browser states from one local browser environment to another may be different due to leftover cookies or cached state.</p>\n<p>Cloud-hosted browsers move that surface area into a managed environment. They handle the underlying infrastructure setup and complexity, and provide consistent browser versions, dependencies, and clean starting states. This standardization ensures cleaner browser sessions and predictable states, making it easier to reproduce and debug errors.</p>\n<ul>\n<li><strong>Testing web application workflows:</strong> Each run starts with the expected browser version and state, improving consistency and reducing failures caused by stale cookies, cached data, missing packages, or machine-specific configuration.</li>\n<li><strong>Debugging support incidents:</strong> An automated support workflow can replay the same customer journey in a known environment, preserving session artifacts and making intermittent defects easier to reproduce.</li>\n</ul>\n<h3>Geographic distribution and network realism</h3>\n<p>Local browsers originate from one machine and one network. That is a poor match for globally used applications, regional pricing, localized content, and compliance-sensitive traffic paths.</p>\n<p>Cloud-hosted browsers provide regional execution, IP controls, or geo-targeting. For scraping and data extraction, geography can determine what data is visible. For test automation, geography can expose latency and localization issues. For enterprise workflows, region and network path can affect compliance and access-control requirements. With cloud browsers, all of the above becomes easily configurable.</p>\n<ul>\n<li><strong>Web data collection at scale: </strong>Organizations can gather competitor pricing, product availability, market intelligence, and localized content across thousands of websites by distributing workloads across concurrent browser sessions in multiple geographies.</li>\n<li><strong>Travel, commerce, and purchasing workflows: </strong>Agents can compare offers, inventory, pricing, taxes, and payment options across regions before completing bookings or purchases, with approval checkpoints for consequential actions.</li>\n<li><strong>Cross-border business processes: </strong>Logistics, trade, and operations teams can submit forms, declarations, and regulatory filings through region-specific carrier and government portals while adhering to network, residency, and compliance requirements.</li>\n<li><strong>Testing digital customer experiences:</strong> Engineering and QA teams can validate signup, purchase, and service workflows from multiple regions to identify localization, performance, compliance, and geo-routing issues before they impact customers.</li>\n</ul>\n<h2>Scale and parallel execution</h2>\n<p>Historically, scale was often the primary reason organizations adopted cloud-based automation. Scale remains important. Browser automation benefits largely from scaled execution and parallelism because most automation tasks are independent test cases, page crawls, price checks, form submissions, document downloads, and agent evaluations, that can all run concurrently.</p>\n<ul>\n<li><strong>Scraping competitor or vendor data: </strong>Running web scraping tasks across thousands of websites can be distributed crawls across concurrent browser sessions.</li>\n<li><strong>RPA transactions:</strong> Operations teams can process hundreds of spreadsheet records through a legacy supplier portal in parallel, no need of dedicated desktop infrastructure.</li>\n<li><strong>Customer onboarding:</strong> AI agents running on websites that incur seasonal surge in customer applications can complete form filling without having to worry about scaling their infrastructure.</li>\n</ul>\n<h1>When local browsers still make sense</h1>\n<p>The case for cloud-hosted browsers is strong, but it is not absolute. Local browsers remain useful in a few situations.</p>\n<ul>\n<li><strong>Debugging automation scripts:&nbsp;</strong>Developers debugging one-flow, stepping through script or iterating on selectors, local execution may be fast and simple.</li>\n<li><strong>Specialized browser modifications:&nbsp;</strong>Deep customizations that require patched browser binary, specialized extensions, direct file-system access, GPU behaviour, or unusual OS-level dependencies, local or self-managed infrastructure may be easier.</li>\n<li><strong>Workloads with very limited scale requirements:&nbsp;</strong>If the scale is very small and frequency is occasional, running locally may be cheaper and simpler.</li>\n</ul>\n<p>The transition point typically occurs when requirements expand beyond a single user and begin involving multiple teams, environments, agents, regions, or when concurrency, reliability, observability, security, or maintenance becomes more important than initial setup simplicity.</p>\n<h1>What customers should look for in a cloud-hosted browser platform</h1>\n<p>A managed cloud browser platform is not just about connecting to browser instances from anywhere. Customers should evaluate:</p>\n<ul>\n<li><strong>Isolation:</strong> Are sessions cleanly separated? Can state be controlled, persisted, or discarded intentionally?</li>\n<li><strong>Scale:</strong> Can the platform handle bursty traffic and parallel execution automatically without having to worry about the scale?</li>\n<li><strong>Reproducibility:</strong> Are browser versions, OS environments, and artifacts consistent and standard across the platform?</li>\n<li><strong>Observability:</strong> Are live view, logs, traces, screenshots, videos, network data, and audit records available?</li>\n<li><strong>Security:</strong> Are the browsers updates managed and kept up-to-date with the latest security patches? Are least privilege, identity, network boundaries, domain controls, and human approval patterns supported?</li>\n<li><strong>Geography:</strong> Can workloads run from relevant regions or network paths?</li>\n<li><strong>Cost visibility:</strong> Is pricing tied to minutes, sessions, data transfer, or concurrency and does that match the expected workload?</li>\n</ul>\n<h1>Looking ahead</h1>\n<p>The browser is now an execution environment. AI agents use browsers to interact with the parts of the web that do not have APIs. Test suites use browsers to validate releases. Data teams use browsers to extract information from the web. Operations teams use browsers to bridge legacy systems that will not be replaced soon.</p>\n<p>While local browsers helped get the automation started and they will continue to remain useful for prototyping, debugging, and small-scale work, the future of serious production-grade browser automation is cloud-hosted: elastic, isolated, observable, governed, and integrated into the rest of the enterprise platform.<br /><br /></p>\n<p>To know more:</p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/app-testing/playwright-workspaces/overview-what-is-microsoft-playwright-workspaces\" rel=\"noopener\" target=\"_blank\">What is Playwright Workspaces?</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/app-testing/playwright-workspaces/how-to-try-playwright-workspaces-free\" rel=\"noopener\" target=\"_blank\">Playwright Workspaces free trial</a></li>\n</ul>"
