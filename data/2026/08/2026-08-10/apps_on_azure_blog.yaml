    "title": "A simpler way to deploy ZIP packages to Azure App Service from the Azure portal"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/a-simpler-way-to-deploy-zip-packages-to-azure-app-service-from/ba-p/4545430"
    "published": "2026-08-10 15:42:46"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>We recently introduced a simpler way to deploy applications to Azure App Service for Linux by uploading a ZIP package through Kudu. The experience lets you review the package contents, choose whether to run a server-side build, and follow the deployment through its different stages.</p>\n<p>This capability is now available directly in the&nbsp;<strong>Azure portal</strong>&nbsp;through&nbsp;<strong>Deployment Center</strong>.</p>\n<p>To use it:</p>\n<ol>\n<li>Open your Linux web app in the Azure portal.</li>\n<li>Go to&nbsp;<strong>Deployment Center</strong>.</li>\n<li>Select&nbsp;<strong>Manual Deployment (Push)</strong>.</li>\n<li>Choose&nbsp;<strong>Publish files (new)</strong>&nbsp;as the source.</li>\n<li>Drag and drop your ZIP file or select&nbsp;<strong>Browse files</strong>.</li>\n</ol>\n<img />\n<p>You can now upload and deploy your application without navigating separately to the Kudu site. This is useful for getting started, testing an application, or performing an occasional manual deployment. For repeatable production deployments, we recommend configuring a CI/CD pipeline.</p>\n<p>To learn more about the deployment experience, including package preview, build options, progress tracking, and deployment logs, see our previous post: <a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/a-simpler-way-to-deploy-your-code-to-azure-app-service-for-linux/4510240\" target=\"_blank\">A simpler way to deploy your code to Azure App Service for Linux | Microsoft Community Hub</a></p>"
"last_updated": "2026-08-27 21:13:50 JST"
