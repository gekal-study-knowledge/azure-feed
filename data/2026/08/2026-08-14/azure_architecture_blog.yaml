    "id": "569d5d3d296d8f7ef92684f61bab0d1f"
    "title": "From Features to Flow: How Real-World Adoption Reshaped the Azure Architecture Diagram Builder"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/from-features-to-flow-how-real-world-adoption-reshaped-the-azure/ba-p/4546817"
    "published": "2026-08-14 07:10:46"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p>In May, I introduced the open-source <a href=\"https://aka.ms/diagram-builder\" target=\"_blank\">Azure Architecture Diagram Builder</a> as a way to move from a natural-language prompt to an Azure architecture diagram, cost estimate, Well-Architected assessment, and deployment guidance. In July, I shared how the project had become <a href=\"https://techcommunity.microsoft.com/blog/azurearchitectureblog/beyond-the-canvas-the-azure-architecture-diagram-builder-becomes-agent-ready/4534590\" target=\"_blank\">agent-ready through Model Context Protocol (MCP)</a>.</p>\n<p>Those posts described what the tool could do. The more interesting story came next: what happened when people actually used it.</p>\n<p>As adoption grew, the central product question changed. It was no longer simply, <em>Can AI generate an Azure architecture?</em> It became:</p>\n<blockquote>\n<p><strong>How do we help an architect choose how to begin, improve a result without losing their work, validate it responsibly, and turn it into something another person can use?</strong></p>\n</blockquote>\n<p>That question reshaped the Azure Architecture Diagram Builder from a collection of capabilities into a guided workflow:</p>\n<p><strong>Create → Refine → Validate &amp; Improve → Share or Build</strong></p>\n<p>This post explains what we learned, what changed in the product, and why the hardest part of AI-assisted architecture is not the first diagram. It is everything that comes after it.</p>\n<blockquote>\n<p><strong>TL;DR.</strong> Growing adoption created a feedback loop. Aggregate usage showed that people moved beyond generation into validation, recommendations, exports, and deployment guidance. Privacy-safe feedback revealed recurring problems with diagram integrity, preservation of human edits, cost credibility, export quality, and validation continuity. Those signals led to a four-stage architecture journey that keeps human judgment and professional review at the center. The same lesson now shapes agent access and the next product boundary: distinguish logical proposals from evidence-backed physical architecture.</p>\n</blockquote>\n<hr />\n<h2 id=\"adoption-created-a-product-feedback-loop\">Adoption created a product feedback loop</h2>\n<p>As of August 5, 2026, the first two Azure Architecture Blog articles had accumulated approximately <strong>12,100 combined views</strong>. A refreshed view of deduplicated application telemetry through August 13 recorded:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Activity</th><th class=\"lia-border-color-custom-0078d4 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Aggregate count</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Architecture generation and refinement events</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">5,023</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Well-Architected validations</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">960</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Recommendations applied</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">175</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Diagram exports</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">2,020</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Deployment guides generated</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">212</td></tr></tbody></table></div>\n<p>As of August 13, the public repository had reached <strong>45 stars and 14 forks</strong>. In GitHub’s current rolling 14-day window, the repository recorded <strong>277 unique visitors and 67 unique cloners</strong>.</p>\n<p>These numbers measure different things and should not be added together. Article views are not unique readers. Application activity uses anonymous telemetry identifiers, not verified people. GitHub traffic is a rolling aggregate window. The signals are useful because of the pattern they reveal, not because they can be combined into one headline user count.</p>\n<p>Activity also accelerated during the period following the second article. Compared with the May 19–July 9 baseline, daily activity from July 10 through August 13 was approximately <strong>7.0 times higher</strong> for architecture generation and refinement, <strong>5.6 times higher</strong> for Well-Architected validation, and <strong>5.9 times higher</strong> for recommendation application. The timing coincided with publication; it does not prove that the article alone caused the growth.</p>\n<p>The important product lesson was simpler: people were not stopping after the first diagram.</p>\n<p>They were testing alternatives, validating designs, applying recommendations, exporting artifacts, and asking how to move toward implementation. Generation was the entry point, not the complete job.</p>\n<p>The first guided-journey signals reinforce the need for more than one starting path. Through August 13, the new journey instrumentation recorded <strong>880 interactions from 174 anonymous identifiers across 241 sessions</strong>. At first start, structured brief/image generation and Guided Chat were selected at almost the same frequency (158 and 156 events), while template and live-Azure import added another 68 selections. These are interaction counts, not unique people or conversion rates, and the window is still too early to claim that the journey improves completion. They are enough to show that architecture work does not begin in one uniform way.</p>\n<figure><br />\n<figcaption>In-product Start Here panel showing the four-stage Azure Architecture Diagram Builder journey: Create, Refine, Validate and Improve, and Share or Build.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 1.</strong> The in-product Start Here panel explains one complete architecture loop. The stages are recommendations, not gates, and direct access to every tool remains available.</p>\n</blockquote>\n<hr />\n<h2 id=\"stage-1-create-make-the-starting-choice-explicit\">Stage 1: Create — make the starting choice explicit</h2>\n<p>As capabilities accumulated, the first screen became harder to interpret. Architecture Chat and structured generation were both useful, but they competed for attention. Importing an existing architecture was available, yet easy to miss.</p>\n<p>The new starting experience makes three paths explicit:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Starting path</th><th class=\"lia-border-color-custom-0078d4 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Best suited for</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Guided Chat</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Exploring requirements conversationally and refining them over multiple turns</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Generate Diagram</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Providing a structured brief or image and producing a first architecture quickly</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Import Existing</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Opening an existing architecture or infrastructure artifact for analysis and editing</td></tr></tbody></table></div>\n<p>This is not a marketing landing page placed in front of the tool. It is a small decision point inside the authoring experience. Once a path is selected, the user lands on the real canvas.</p>\n<p>The distinction matters because different architecture tasks begin with different levels of certainty. Sometimes the architect knows the target services. Sometimes the problem needs discovery. Sometimes the architecture already exists and the work is to understand or improve it.</p>\n<p>The product should acknowledge those differences instead of pretending every design starts with a perfect prompt.</p>\n<figure><br />\n<figcaption>Start chooser presenting Guided Chat, Generate Diagram, and Import Existing as three equal entry paths.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 2.</strong> Three starting paths reflect three different architecture situations: discovery, structured generation, and analysis of an existing design.</p>\n</blockquote>\n<hr />\n<h2 id=\"stage-2-refine-preserve-human-work\">Stage 2: Refine — preserve human work</h2>\n<p>One of the clearest feedback themes was not about adding another AI capability. It was about preventing AI from casually undoing human effort.</p>\n<p>An architect might spend time arranging a one-page diagram for a review, resizing groups, moving labels, or emphasizing a specific boundary. A subsequent AI refinement could improve the service selection while disrupting that carefully prepared layout.</p>\n<p>The design principle that emerged was straightforward:</p>\n<blockquote>\n<p><strong>AI acceleration should preserve deliberate human work by default.</strong></p>\n</blockquote>\n<p>Refinement now retains existing node positions, group geometry, sizes, and viewport context whenever possible. The model can change the architecture without treating every turn as permission to redraw the entire document.</p>\n<p>The same principle applies beyond geometry:</p>\n<ul>\n<li>Preserve the prior validation result when recommendations change the architecture.</li>\n<li>Preserve the active light or dark theme in exported artifacts.</li>\n<li>Preserve the distinction between the authoring canvas and the presentation deliverable.</li>\n<li>Preserve user-configured pricing assumptions rather than replacing them with one fixed estimate.</li>\n</ul>\n<p>This is a broader lesson for AI-assisted tools. A generated result is not the only source of value. The edits, judgments, and communication choices a person adds afterward are part of the artifact too.</p>\n<figure><br />\n<figcaption>Before-and-after AADB canvases showing an AI refinement that adds Azure Front Door and WAF while retaining the positions of eight existing services and the anchors of four existing groups.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 3.</strong> In this controlled synthetic refinement, all eight existing service positions and four group anchors remained unchanged. The containing Application group expanded to accommodate the new edge tier, so preservation does not imply that every group dimension stays fixed.</p>\n</blockquote>\n<hr />\n<h2 id=\"quality-is-structural-not-only-visual\">Quality is structural, not only visual</h2>\n<p>A diagram can look polished while still being architecturally confusing. Early feedback exposed cases where a generated service appeared disconnected because a model referenced a display name instead of the service identifier used by the canvas.</p>\n<p>The correction was not another prompt instruction alone. The application now resolves connection endpoints across identifiers, normalized service names, and service-type aliases. It repairs valid edges, drops invalid or self-referential edges, detects remaining orphan nodes, and records aggregate integrity signals.</p>\n<p>That creates a more useful definition of diagram quality:</p>\n<ul>\n<li>Are the services connected as intended?</li>\n<li>Were any generated edges repaired or dropped?</li>\n<li>Are there orphaned nodes?</li>\n<li>Did refinement preserve the existing layout?</li>\n<li>Did an architecture change receive a fresh validation?</li>\n</ul>\n<p>Visual polish still matters, especially when an artifact leaves the editor. But structural integrity gives the product something deterministic to test and monitor.</p>\n<hr />\n<h2 id=\"stage-3-validate-improve-treat-validation-as-a-lifecycle\">Stage 3: Validate &amp; Improve — treat validation as a lifecycle</h2>\n<p>The Azure Well-Architected Framework is most useful when validation becomes iterative rather than ceremonial.</p>\n<p>The Diagram Builder can assess a proposed design across the five Well-Architected pillars, surface findings, and apply selected recommendations. But that workflow exposed an important state-management problem: when the architecture changed, the prior validation result disappeared along with the obvious route back to revalidation.</p>\n<p>The updated experience keeps the previous report, marks it <strong>Revalidate Needed</strong>, and makes clear that the score describes an earlier state of the architecture. A new validation replaces it only after the updated design has been assessed.</p>\n<p>This distinction prevents a stale score from looking current.</p>\n<p>It also clarifies what an architecture-level assessment can and cannot prove. A diagram may show that a WAF, cache, backup service, or secondary region exists. It usually cannot prove that purge protection, diagnostic routing, encryption settings, role assignments, health probes, or failover policies are configured correctly.</p>\n<p>That is why validation findings need to distinguish between:</p>\n<ul>\n<li><strong>Pattern-level gaps</strong> — missing or misplaced architectural components</li>\n<li><strong>Configuration-level gaps</strong> — required settings that must be verified in Infrastructure as Code or the deployed environment</li>\n</ul>\n<p>Generated scores and recommendations help architects review a design; they do not replace an Azure Well-Architected Review, security review, deployment validation, or professional judgment.</p>\n<img />\n<p>&nbsp;</p>\n<figure>\n<figcaption>Validation result retained after architecture recommendations are applied, with a Revalidate Needed status and action.</figcaption>\n</figure>\n<blockquote>\n<p><strong>Figure 4.</strong> Architecture changes make a previous validation historical, not useless. The result remains available while the interface clearly asks for a fresh validation.</p>\n</blockquote>\n<hr />\n<h2 id=\"stage-4-share-or-build-design-for-the-artifacts-destination\">Stage 4: Share or Build — design for the artifact’s destination</h2>\n<p>The editing canvas and the final deliverable serve different purposes.</p>\n<p>Canvas dots, handles, navigation controls, and selection states help during authoring. They can make an exported diagram feel unfinished. The Diagram Builder now separates those concerns with <strong>Plain, Dots, and Grid</strong> export backgrounds while preserving the active light or dark theme.</p>\n<figure><br />\n<figcaption>The same AADB architecture shown first on the editing canvas with the export menu open and then as the resulting Plain PNG without authoring controls.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 5.</strong> Authoring and delivery are different contexts. The upper view shows the editable canvas and its real export controls; the lower view is the Plain PNG produced from that same canvas, without editing chrome.</p>\n</blockquote>\n<p>Cost language is deliberately qualified. Azure services often combine fixed, usage-based, and configuration-dependent charges. A baseline that includes six numerically priced services but excludes 20 usage-based items is not the total cost of the architecture. The output identifies those exclusions rather than treating missing values as zero.</p>\n<p>The final stage also includes deployment guides and Infrastructure as Code. Here, honesty about artifact coverage is essential. A generated Bicep file may be a useful starter while still omitting private endpoints, diagnostic settings, failover configuration, or service-specific resources. The artifact should state what it implements, what remains conceptual, and whether Azure Resource Manager validation passed.</p>\n<p>AI-generated diagrams, costs, validation results, deployment guides, and Infrastructure as Code should all be reviewed and validated before production use.</p>\n<h2 id=\"the-same-journey-now-extends-to-agents\">The same journey now extends to agents</h2>\n<p>The MCP server introduced in the previous article makes the Diagram Builder available to agent experiences such as Microsoft Scout. The four-stage journey provides a useful way to think about agent orchestration too:</p>\n<ol type=\"1\">\n<li>Import or create one canonical architecture.</li>\n<li>Refine it without silently changing the intended topology.</li>\n<li>Validate it, apply supported improvements, and revalidate.</li>\n<li>Render or generate artifacts with explicit coverage and limitations.</li>\n</ol>\n<p>The current MCP surface exposes <strong>12 tools, three resources, and three reusable prompts</strong>. It can normalize an existing architecture, validate and harden it deterministically, estimate regional costs from a dated pricing snapshot, render presentation/technical/cost views, and generate Bicep, Terraform, and deployment guidance. The calling agent still owns orchestration and reasoning; the MCP server is intended to remain a deterministic architecture capability, not a second hidden agent.</p>\n<p>The native MCP renderer can project one canonical architecture into three communication profiles:</p>\n<ul>\n<li><strong>Presentation</strong> emphasizes the primary request path, reduces supporting labels, and removes pricing.</li>\n<li><strong>Technical</strong> preserves complete connection detail for engineering inspection.</li>\n<li><strong>Cost</strong> retains the focused composition while adding service-level pricing assumptions, a fixed-priced baseline, and explicit exclusions.</li>\n</ul>\n<p>These are MCP-generated SVG views, not Blueprint diagrams or screenshots of the editable web canvas. The services, connections, and groups remain the same; only the information treatment changes.</p>\n<figure><br />\n<figcaption>The AADB MCP renderer projecting the same canonical architecture into presentation, technical, and cost SVG profiles.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 6.</strong> Native AADB MCP output from one 8-service, 9-connection, 4-group architecture. Presentation prioritizes the story, Technical exposes connection detail, and Cost foregrounds pricing assumptions and exclusions.</p>\n</blockquote>\n<p>Recent work on the MCP renderer added purpose-built presentation, technical, and cost profiles. More importantly, testing agent-generated artifacts reinforced an accountability principle: a polished diagram and a compiled Bicep file do not prove deployability.</p>\n<p>An agent workflow should report whether topology changed, whether validation improved, which services are represented only conceptually, and whether the generated IaC passed Azure preflight. That is more useful than an unsupported claim that a design is production-ready.</p>\n<p>Trust also includes the tool boundary itself. The hosted MCP endpoints now require a bearer token for real session operations; missing or incorrect credentials are rejected. A shared token is appropriate for the current controlled integration, but it is not the end state for enterprise multi-user access. Entra ID/OAuth, per-client authorization, rotation, and revocation remain future hardening work.</p>\n<figure><br />\n<figcaption>Microsoft Scout response after an authenticated Azure Architecture Diagram Builder MCP workflow, showing the tools used, initial and final validation scores, cost scope, Bicep classification, rendered architecture, artifact links, coverage gaps, and no-deployment warning.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 7.</strong> The guided lifecycle extends beyond the web application. In this synthetic Scout run with GPT-5.6 Sol, the agent used authenticated AADB MCP tools to validate, harden, cost, render, and generate starter artifacts while explicitly reporting coverage gaps and that nothing was deployed.</p>\n</blockquote>\n<hr />\n<h2 id=\"learning-from-adoption-without-identifying-people\">Learning from adoption without identifying people</h2>\n<p>Product learning does not require reconstructing individual identities.</p>\n<p>The findings behind this article use aggregate, deduplicated application telemetry, public article counters, public repository totals, and paraphrased feedback themes. They do not correlate Application Insights identifiers, feedback records, GitHub accounts, or email addresses.</p>\n<p>Written feedback remains submittable without contact information. When someone explicitly opts into follow-up, the email address is stored with the feedback record in Cosmos DB and is not sent to normal product telemetry. The current 180-day expiry field is a retention marker; automated deletion must be implemented and verified before describing that retention period as enforced.</p>\n<p>Those boundaries matter for both product design and public writing:</p>\n<ul>\n<li>Aggregate activity rather than profiling individuals.</li>\n<li>Paraphrase themes rather than publishing comments without permission.</li>\n<li>Keep optional contact consent separate from telemetry.</li>\n<li>Avoid presenting anonymous identifiers as confirmed people.</li>\n<li>Avoid claiming that publication timing proves acquisition causality.</li>\n</ul>\n<p>This is not a claim of legal compliance. It is a product discipline: collect less, preserve user agency, and make only the claims the evidence supports.</p>\n<hr />\n<h2 id=\"what-changed\">What changed</h2>\n<p>The guided journey is the visible result, but the deeper change is how the project now evaluates progress.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Earlier question</th><th class=\"lia-border-color-custom-0078d4 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Better question</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Did the model generate a diagram?</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Did it generate a connected and understandable architecture?</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Did the user click Validate?</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Was the current architecture validated, and was it revalidated after changes?</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Did export start?</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Did a professional artifact finish generating successfully?</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Does the IaC compile?</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">What does it actually implement, and does Azure preflight pass?</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">How many features exist?</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Can an architect understand the next useful step?</td></tr></tbody></table></div>\n<p>The model portfolio continued to evolve as well. The production selector now contains 15 configured entries, including <strong>MAI-Thinking-1 (Public Preview)</strong>. But the more consequential changes in this article are deliberately model-independent: preserve human work, keep state and provenance explicit, qualify generated artifacts, and authenticate the tools agents can call.</p>\n<p>The goal is not to remove flexibility. Architects can still open any tool directly, rearrange the canvas, reject recommendations, change pricing assumptions, or export at any point.</p>\n<p>The goal is to make the workflow coherent without pretending architecture itself is linear.</p>\n<hr />\n<h2 id=\"the-next-boundary-logical-versus-physical-architecture\">The next boundary: logical versus physical architecture</h2>\n<p>Recent feedback points to a harder problem than adding another model or export format. Architects working with private Azure AI landing zones need to distinguish shared platform resources from project-owned resources, preserve VNet and subnet boundaries, and reason about CIDRs, NSGs, route tables, private endpoints, DNS, and managed identities.</p>\n<p>The current Topology mode can show services and relationships, but it should not imply exact physical fidelity when those facts are absent. A useful logical diagram answers <em>what exists and how it interacts</em>. A physical or low-level design must answer <em>where it is deployed, how it is isolated, and which values came from evidence</em>.</p>\n<p>That is the next technical direction I am exploring: an evidence-aware Physical Architecture view backed by deterministic reconstruction from Terraform plan/state, ARM, or a live Azure inventory. Exact fields would be labeled as <strong>observed</strong> or <strong>resolved</strong>; AI suggestions would remain explicitly <strong>proposed</strong>; unsupported or missing inputs would be reported instead of silently invented.</p>\n<p>This capability is not shipped today, and it will require its own schema, validation rules, layout, security review, and evaluation set. That distinction matters. The lesson from adoption is not to put every architecture concern into one crowded canvas. It is to make each artifact’s purpose and evidence boundary clear.</p>\n<hr />\n<h2 id=\"try-it-challenge-it-help-shape-what-comes-next\">Try it, challenge it, help shape what comes next</h2>\n<p>The Azure Architecture Diagram Builder remains open source, and the live experience is available today:</p>\n<ul>\n<li><strong>Live app:</strong> <a href=\"https://aka.ms/diagram-builder\" target=\"_blank\">https://aka.ms/diagram-builder</a></li>\n<li><strong>Source code:</strong> <a href=\"https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder\" target=\"_blank\">github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder</a></li>\n<li><strong>Getting started:</strong> <a href=\"https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder/blob/main/DOCS/getting-started-guide.md\" target=\"_blank\">Documentation and deployment guidance</a></li>\n</ul>\n<p>The next phase is to measure whether the guided journey helps people complete the full loop, especially recommendation-to-revalidation and artifact-generation success. In parallel, I am beginning the narrower physical-architecture investigation described above. Both efforts will use aggregate signals, reviewed fixtures, and sufficiently large cohorts rather than individual journey reconstruction.</p>\n<p>Try the workflow with a real architecture problem. Tell me where the handoffs are unclear, where the diagram loses intent, or where an artifact claims more than it implements. Those are the gaps worth fixing next.</p>\n<hr />\n<p><strong>Measurement note:</strong> Article views are rounded public counters observed August 5, 2026. Application figures use deduplicated retained telemetry through August 13 and anonymous identifiers. GitHub totals and rolling 14-day traffic were observed August 13. The comparison windows are May 19–July 9 and July 10–August 13. These signals have different populations and must not be added together. Timing comparisons show concurrent activity, not causal attribution.</p>"
