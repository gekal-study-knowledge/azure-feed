"overview": |
  この日は 5 件で、オープンウェイトモデルのリスク管理、Azure MCP の脅威モデリング、そして鍵管理とネットワークの機能強化が中心でした。Azure ブログと Microsoft セキュリティブログの両方で、エンタープライズ環境におけるオープンウェイトモデルのリスク管理が取り上げられました。AI の選択肢が広がり、企業がますます高性能なモデルを構築・カスタマイズ・デプロイする方法を選べるようになっている状況を背景に、Microsoft と NVIDIA による新しいホワイトペーパーが、共通の分類体系 (タクソノミー)、評価、統制によってオープンウェイト AI モデルのリスクを管理する助けになるとしています。インフラブログでは、Azure MCP の脅威モデリングを通じて AI 支援のインフラ運用を守る方法が解説されました。エンジニアが Azure のインシデントを開いて AI アシスタントに「なぜこのアプリケーションは遅いのか」と尋ねると、アシスタントは Azure Monitor にクエリを投げ、Log Analytics の結果を確認し、App Service の構成を調べ、影響を受けているリソースを正常なデプロイと比較します。従来はポータルの複数のブレード、Azure CLI のコマンド、Kusto クエリを行き来する必要があった調査が、1 つの会話から始められるようになった、という前提が示されています。セキュリティでは、Azure Key Vault Managed HSM の外部キー管理が Azure のすべてのパブリックリージョンで一般提供となりました。規制や主権の要件から鍵暗号化キーを物理的に自社の管理下に置き続ける必要がある組織向けに、対応する Azure サービスからそれを利用できるようにするものです。ネットワークでは、Azure Databricks のプライベートネットワークゲートウェイがパブリックプレビューとなりました。1 つのマネージドゲートウェイを通じて、サーバーレスコンピューティングから仮想ネットワーク (VNet) 内のリソースと、そこから推移的に接続されたネットワークへ接続できます。
