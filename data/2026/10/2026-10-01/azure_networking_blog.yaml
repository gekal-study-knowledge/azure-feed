    "title": "Network security perimeter metrics are now generally available in Public Cloud"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/network-security-perimeter-metrics-are-now-generally-available/ba-p/4561244"
    "published": "2026-10-01 04:35:03"
    "fetched": "2026-10-01 18:30:18"
    "summary": "<img />\n<p>We are excited to announce the&nbsp;<strong>general availability (GA) of network security perimeter metrics</strong>, a capability that helps administrators monitor network access patterns, understand the impact of the access rules, and identify unexpected traffic behaviour across protected resources. These metrics are available through Azure Monitor and can be used to create dashboards, alerts, and operational monitoring experiences.</p>\n<p><strong>Why use network security perimeter metrics?</strong></p>\n<p>Network security perimeter metrics capture access requests evaluated by the data plane and provide visibility into network activity associated with the perimeter-protected resources. Metrics enable monitoring scenarios such as:</p>\n<ul>\n<li>Tracking approved and denied access requests.</li>\n<li>Monitoring inbound and outbound access activity.</li>\n<li>Understanding traffic patterns across protected resources, profiles, access modes and access rule versions.</li>\n<li>Detecting unexpected access attempts.</li>\n<li>Validating the impact of access rules’ changes.</li>\n<li>Establishing a baseline before moving a perimeter from Transition mode to Enforced mode.</li>\n</ul>\n<p>Network security perimeter metrics render aggregated time-series data that is optimized for monitoring, alerting, and trend analysis.</p>\n<p><strong>Accessing network security perimeter metrics</strong></p>\n<p>Network security perimeter metrics are available through Azure Monitor.</p>\n<ol>\n<li>In the Azure portal, navigate to your network security perimeter resource.</li>\n<li>Select <strong>Metrics</strong> under the <strong>Monitoring</strong> section.</li>\n<li>‘Add Metric’</li>\n<li>Choose the ‘NSP access metrics’ namespace.</li>\n<li>Select a metric and configure filters, splitting as needed.</li>\n<li>Use Azure Monitor features to build charts, dashboards, workbooks, and metric alerts.</li>\n<li>Multiple charts may be created for different metrics that are intended to be monitored.</li>\n</ol>\n<p>Regular Azure Monitor features like drilling into the logs, saving the chart as a dashboard or exporting it to a workbook can also be performed.</p>\n<p><strong>Metrics vs diagnostic logs</strong></p>\n<p>While metrics and diagnostic logs are complementary monitoring tools, metrics provide a high-level operational view and support alerting, while diagnostic logs provide detailed event data for troubleshooting and investigation. Table below gives a high-level differentiation view of one over the other.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Capability</strong></p>\n</td><td>\n<p><strong>Metrics</strong></p>\n</td><td>\n<p><strong>Diagnostic logs</strong></p>\n</td></tr><tr><td>\n<p>Trend analysis</p>\n</td><td>\n<p>Yes</p>\n</td><td>\n<p>Limited</p>\n</td></tr><tr><td>\n<p>Dashboards and visualizations</p>\n</td><td>\n<p>Yes</p>\n</td><td>\n<p>Requires log queries</p>\n</td></tr><tr><td>\n<p>Azure Monitor metric alerts</p>\n</td><td>\n<p>Yes</p>\n</td><td>\n<p>No</p>\n</td></tr><tr><td>\n<p>Detailed request information</p>\n</td><td>\n<p>No</p>\n</td><td>\n<p>Yes</p>\n</td></tr><tr><td>\n<p>Forensic investigations</p>\n</td><td>\n<p>No</p>\n</td><td>\n<p>Yes</p>\n</td></tr><tr><td>\n<p>Operational monitoring</p>\n</td><td>\n<p>Yes</p>\n</td><td>\n<p>Yes</p>\n</td></tr><tr><td>\n<p>Readibility</p>\n</td><td>\n<p>Instant</p>\n</td><td>\n<p>Destination needed</p>\n</td></tr><tr><td>\n<p>Cost implications</p>\n</td><td>\n<p>Free</p>\n</td><td>\n<p>Chargeable destinations</p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>Reach-out to <a class=\"lia-external-url\" href=\"mailto:nsppmvteam@microsoft.com\" rel=\"noopener\" target=\"_blank\">mailto:nsppmvteam@microsoft.com</a> for any questions.</p>"
