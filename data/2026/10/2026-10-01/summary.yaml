"overview": |
  この日は 14 件で、進行中の障害、ネットワークセキュリティの可視化、そして旧世代 VM の廃止予定が中心でした。Azure のステータスでは、2026 年 9 月 30 日 20:30 UTC から ExpressRoute および VPN Gateway を使っている環境でネットワーク接続の劣化や中断が発生し、一部のネットワーク管理操作が失敗または遅延する事象が継続中と報告されました。発生の契機となったインフラのサービス作業は一時停止され、追加のリソースが影響を受けないようにしているとされています。ネットワークブログでは、ネットワークセキュリティ境界 (network security perimeter) のメトリックがパブリッククラウドで一般提供となりました。管理者はネットワークアクセスのパターンを監視し、アクセスルールの影響を把握して、保護対象リソースをまたぐ予期しないトラフィックを特定できます。メトリックは Azure Monitor から利用でき、ダッシュボード・アラート・運用監視の構成に使えます。廃止予定では、Azure VM のライフサイクルポリシーに沿って Dv3・Dsv3・Ev3・Esv3 シリーズの廃止が告知され、これらはサポート終了 (End-of-Life) 段階に入り 2029 年 11 月 15 日に廃止されます。あわせて、NVv4 シリーズ (Standard_NV4as_v4 など 8 サイズ) と NVv3 シリーズ (Standard_NV12s_v3 など 6 サイズ) は 2026 年 9 月 30 日付で既に廃止されました。コンテナでは、AKS の Ubuntu 26.04 サポートがパブリックプレビューとなり、Ubuntu Minimal をベースにした Ubuntu2604 の OS SKU が導入されました。Ubuntu LTS の更新に追随しつつ、OS 移行ごとに生じるパッケージの構成・セキュリティ・互換性の懸念に対処するものです。データベースでは、Azure Virtual Machines 上の SQL Server に対する Microsoft 管理のパフォーマンス監視がパブリックプレビューとなり、独自の収集スクリプトを作らずに監視できるようになりました。開発ツールでは、GitHub Copilot 向けの Azure canvases が発表されました。Copilot との対話のすぐ横に Azure のツール・ダッシュボード・ガイド付きワークフローを並べる対話型の共有ワークスペースで、Azure リソースの探索、コストの分析、ホスト型スキルの構築ができます。Azure Developer CLI (azd) の 2026 年 9 月まとめも公開され、拡張機能管理が依存関係を考慮したアンインストールとバージョン付きの契約に対応し、プロジェクト構成にトップレベルのインフラ層とサービス層が加わり、デプロイフェーズが並行実行数の制限に対応し、外部認証のホストがローカルソケット転送を使えるようになりました。Azure ブログでは、より効率的なシステムと、データセンターのハードウェアの使用期間を延ばす Circular Centers によって、ハードウェアのライフサイクル全体を管理する取り組みが紹介されました。セキュリティブログでは、Microsoft Ignite 2026 におけるセキュリティ関連の案内が公開され、ID・デバイス・データ・アプリケーション・クラウド・インフラに加えて、チームと並んで働くようになった AI エージェントまでを保護する AI ファーストのエンドツーエンドのセキュリティプラットフォームが取り上げられています。セキュリティブログでは、2026 年の Microsoft Digital Defense Report の要点が公開されました。相互のつながりがいっそう強まり続けるセキュリティ環境が映し出されているとされ、関連記事では、政府機関とその行政サービスが 2026 年に最も多くサイバー脅威の影響を受けた分野で、観測された活動の 27% を占め、2025 年の 17% から増えていることが示されています。相互に連結したサイバーリスクの時代に向けて行政がどう備えるかが論じられています。開発体験では、GitHub Copilot アプリ内の Azure Functions Hosted Skills キャンバスが紹介されました。Azure Functions を下から順に進化させてきた流れ (まず Flex Consumption によるインフラ、次にアプリの書き方、そして今回はそれを作るツール) の続きで、Function App、平易な言葉での指示、トリガーの操作、ライブのログが会話の隣に並び、どのイベントを選ぶかから結果を読むまで、開発のループが 1 つのウィンドウで完結します。
