    "title": "Meet the Hosted Skills Canvas: Build, Run, and Debug in GitHub Copilot"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/meet-the-hosted-skills-canvas-build-run-and-debug-in-github/ba-p/4561222"
    "published": "2026-10-01 07:19:50"
    "fetched": "2026-10-02 01:44:24"
    "summary": "<p>We have been evolving Azure Functions from the bottom up: first the infrastructure with <a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan\" rel=\"noopener\" target=\"_blank\">Flex Consumption</a>, then the way you write an app, and now the tools you use to build it.<br /><br />We're introducing a new developer experience for event-driven apps: the <a class=\"lia-external-url\" href=\"\" rel=\"noopener\" target=\"_blank\"><strong>Azure Functions Hosted Skills canvas</strong></a> in the <strong>GitHub Copilot app</strong>. Your Function App, plain-English instructions, trigger controls, and live logs sit beside your conversation. From choosing an event to reading the result, the development loop stays in one window, with Copilot there when you need a hand.<br /><br />Let's walk through a daily digest for the Azure Functions host repository on GitHub.</p>\n<h2>Start in the canvas</h2>\n<p>Open <strong>Azure Functions Hosted Skills</strong> and choose <strong>Local Function App</strong>. Use the generated daily repository digest starter for this walkthrough. The app's source lives in your repo or worktree; you do not need an Azure deployment to test it locally.</p>\n<img /><em>The Hosted Skills canvas alongside Copilot, with local setup and developer controls in view.</em>\n<h2>Choose the event, then the instructions</h2>\n<p>First pick the event that starts the work. For this daily digest, choose <strong>Timer</strong> and set its schedule. HTTP or Queue are other options when a request or message should start the task.</p>\n<p>Then use or edit <strong>Skill instructions</strong>. A <a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-hosted-skills\" rel=\"noopener\" target=\"_blank\">hosted skill</a> is a set of instructions for an AI task, written in a Markdown .agent.md file. They describe what the app should do when the event arrives. Here, we ask the app to inspect recent repository activity and write a digest with links to the evidence.</p>\n<img /><em>The Timer sets when the skill runs; the instructions describe the job. This app is set to run daily at 09:00 local time.</em>\n<p>With the Functions host running, the runtime listens for the configured event and starts the skill automatically. You do not write a polling loop. Hosted Skills is in preview.</p>\n<h2>Invoke and read the result</h2>\n<p>Click <strong>Invoke Trigger</strong> to run the hosted skill now, without waiting for the next scheduled event. You can change the model or adjust <strong>Parameters</strong> to try another repository or reporting window.</p>\n<img />\n<p><em>Click <strong>Invoke Trigger</strong> to run the hosted skill now, without waiting for its next scheduled event.</em></p>\n\n<p>That runs the hosted skill. It uses your signed-in GitHub identity to make OAuth-authenticated calls to the GitHub MCP server for issues, pull requests, and workflow activity. The model follows the skill's instructions to reason over that evidence and write the digest.</p>\n<p>The starter also uses middleware to trim large tool responses before they reach the model. This run reduced about 181 KB of GitHub results to 2.6 KB.</p>\n<p>Read the output in <strong>Agent digest</strong> and the run status in <strong>Trigger activity</strong>. The instructions ask for evidence links and a clear note when access or data is missing, rather than made-up activity.</p>\n<img /><em>Actual output from a local Timer run against Azure/azure-functions-host on September 29, 2026. All three GitHub MCP calls completed successfully. This screenshot shows an excerpt; the output will vary with repository activity and the model.</em>\n<p>If the result needs work, the canvas gives you the evidence to debug it. The instructions and input stay visible, while&nbsp;<strong>Trigger activity</strong>, <strong>Commands</strong>, and the local Functions host log show what ran, when it ran, and any errors. You can check what happened against your instructions, see where the run went wrong, and either debug it yourself or give the coding agent the same inputs, commands, and error messages to work from.</p>\n<p>The event selector, model picker, logs, and editor handoff run directly in code. They do not need another model call to interpret a choice you already made. Those routine controls are fast and deterministic; the hosted skill's AI-generated response can still vary.</p>\n<p>Copilot stays available to help with instructions, errors, and code changes.</p>\n<h2>Where to take it next</h2>\n<p>You now have a local app you can inspect and change. Keep working in the canvas, or take it in one of these directions.</p>\n<h3>Open in VS Code</h3>\n<p>When you want to edit Python tools, review configuration, or work in your usual editor, select <strong>Open in VS Code</strong>.</p>\n<img /><em>A direct handoff to your editor, not another prompt.</em>\n<p>The source stays in your repo or worktree, where you can review and commit it. In REDACTED mode, the editor handoff uses a scrubbed copy so credentials are not exposed; the real project stays unchanged.</p>\n<p>You can extend the starter with reusable SKILL.md guidance, other MCP servers, and Python tools for the parts that need code. The generated project uses regular files, not a format owned by the canvas.</p>\n<h3>Deploy to Azure</h3>\n<p>To run beyond your laptop, <strong>Deploy to Azure</strong> uses Azure Developer CLI (azd) from an isolated copy. Your working source and local host stay unchanged.</p>\n<img />\n<p><em>Select <strong>Deploy to Azure</strong> to deploy your hosted skill from an isolated copy.</em></p>\n\n<p>The supported Timer/HTTP template configures the Function App's <strong>managed identity</strong>, required <strong>RBAC roles</strong>, and remote model and app settings. The deployed app uses its identity for Azure access, not your laptop's CLI session. Gateway credentials, when needed, pass through secure deployment parameters rather than source files.</p>\n<p>Deployment needs a subscription, an Azure-backed Foundry or AI Gateway model, and permission to create resources and assign roles. Copilot is local-only; Queue testing remains local. Reuse a model or explicitly approve model creation. Deployment starts only when you choose it, can incur charges, and reports progress and errors in <strong>Deployment output</strong>.</p>\n<h3>Expose the Hosted Skill as an MCP tool</h3>\n<p>The same digest can become a building block for developer tools and other agents, rather than only a task on your own schedule. Add one line to the skill's front matter:</p>\nbuiltin_endpoints: { mcp: true }\n<p>That enables a standard <a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-hosted-skills-reference#built-in-endpoints\" rel=\"noopener\" target=\"_blank\">MCP HTTP endpoint</a> at /runtime/webhooks/mcp for debugging and agent-to-agent use. Connected MCP clients, including Microsoft Foundry and Microsoft Agent 365 (A365) agents, can call the skill with the required mcp_extension system-key authentication.</p>\n<p>Other developers and agents get the same capability as a callable tool. Its event trigger still works; you do not write a separate MCP server.</p>\n<h2>Doctor is there if you need help</h2>\n<p><strong>Doctor</strong> is optional, not a gate before invoking. Use it for initial setup help or if you encounter an issue. Its readiness report shows which tools are ready, what is missing, and what to fix for the selected workflow.</p>\n<img /><em>A real local Copilot readiness check. Doctor reads status; it does not install software, sign you in, or change Azure. Azure sign-in is not required for this local path.</em>\n<p><strong>We recommend uv</strong> for Python and the isolated environment. Azure-backed workflows use your Azure CLI sign-in; local Copilot testing does not need an Azure deployment or Azure sign-in.</p>\n<h2>Shared pieces in canvas-toolkit</h2>\n<p>Building this meant solving Azure sign-in, environment checks, command activity, and styling that fits the host.</p>\n<p>We put the reusable parts back into <a class=\"lia-mention lia-mention-user\" href=\"\">Microsoft​</a>/canvas-toolkit: Azure authentication, redaction-safe command logs, and shared UI and theme support. Doctor remains app-specific and uses those shared pieces alongside its Functions checks.</p>\n<p>Find the <a href=\"https://github.com/microsoft/azure-dev-tools/tree/main/plugins/canvas-authoring\" rel=\"noopener\" target=\"_blank\">toolkit setup and starter examples</a> in the Azure Dev Tools repo.</p>\n<h2>Install the tools</h2>\n<p>Install the tools from the marketplace: open <strong>Customize &gt; Plugins</strong>, select <strong>Awesome Copilot</strong>, and install <strong>Azure Functions Hosted Skills</strong>.</p>\n<p>Pro tip: <a href=\"\" rel=\"noopener\" target=\"_blank\">install it directly</a>.</p>\n<p>Start a new session so the canvas and its launcher skills are available, then ask:</p>\n<p>Open Azure Functions Hosted Skills canvas.</p>\n<p>Give it a try, and <a href=\"https://github.com/microsoft/azure-dev-tools/issues\" rel=\"noopener\" target=\"_blank\">tell us what you think</a>. For resource queries and cost checks, take a look at the <a href=\"https://developer.microsoft.com/blog/azure-canvases/\" rel=\"noopener\" target=\"_blank\">other Azure canvases</a>.</p>\n<h2>Watch the demo</h2>\n<p>See the Azure Functions Hosted Skills canvas in action in the GitHub Copilot app.</p>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>&nbsp;</p>"
