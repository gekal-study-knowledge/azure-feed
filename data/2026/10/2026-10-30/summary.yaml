  この日は 2 ソースから 5 本。Microsoft Threat Intelligence が、北朝鮮の脅威アクターが攻撃の速度と効率を高めるために AI の利用を拡大しており、その導入度合いにはばらつきがあることを分析し、作戦全体での AI 活用の実態を解説した。また、IDC MarketScape の 2026 Worldwide Modern Endpoint Security for Enterprises ベンダー評価で Microsoft がリーダーに選ばれた。Azure Updates では 3 件の一般提供。Azure Confidential VM への移行シナリオで Large OS Disk Encryption (LOSDE) が GA となり、OS ディスクを完全に保護したまま、より大きく本番規模のワークロードをコンフィデンシャルコンピューティングへ移せるようになった。Azure Front Door Premium の Web Application Firewall では HTTP DDoS ルールセットが GA となった。HTTP レイヤーの DDoS 攻撃はアプリケーション停止の主要な原因であり続けており、IP フィルターや固定のレート制限といった静的な制御では追いつかないという背景がある。Azure MCP Server 3.0 も GA となり、オープンな Model Context Protocol を通じて AI エージェントや開発ツールが Azure を扱える範囲が広がった。Azure Terraform の Infrastructure as Code 対応など、新規・拡張の機能が加わっている。
