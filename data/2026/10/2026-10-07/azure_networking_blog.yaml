    "title": "Proactively monitor Azure VPN Gateway tunnel disconnections"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/proactively-monitor-azure-vpn-gateway-tunnel-disconnections/ba-p/4562011"
    "published": "2026-10-07 01:47:21"
    "fetched": "2026-10-07 18:29:29"
    "summary": "<p>Site-to-Site (S2S) VPN connections are a critical component of hybrid connectivity between Azure and on-premises environments. A tunnel outage can impact applications, user access, and business operations. Although Azure VPN Gateway automatically attempts to re-establish a tunnel when connectivity is restored, administrators should be notified immediately when a tunnel disconnects so they can quickly investigate and mitigate the issue.</p>\n<p>In this article, you'll learn how to configure an Azure Monitor alert that automatically notifies administrators whenever an Azure VPN Gateway tunnel enters a disconnected state.</p>\n<p><strong>Why monitor VPN tunnel status?</strong></p>\n<p>VPN tunnels can disconnect for a variety of reasons, including:</p>\n<ul>\n<li>Internet connectivity issues</li>\n<li>On-premises VPN device failures</li>\n<li>IPSec/IKE negotiation issues</li>\n<li>Network maintenance activities</li>\n<li>Device reboots or software upgrades</li>\n</ul>\n<p>By implementing proactive monitoring, organizations can:</p>\n<ul>\n<li>Reduce Mean Time to Detection (MTTD)</li>\n<li>Improve network availability</li>\n<li>Receive automated notifications</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Step 1: Enable VPN Gateway diagnostic logs</strong></p>\n<p>Before creating an alert rule, ensure that diagnostic logging is enabled for your VPN Gateway.</p>\n<ol>\n<li>Navigate to Azure Monitor in the Azure portal.</li>\n<li>Under Settings, select Diagnostic settings.</li>\n<li>Select the appropriate Subscription, Resource Group, and Resource Type, then choose your VPN Gateway resource.</li>\n<li>Click Add diagnostic setting.</li>\n<li>Provide a name for the diagnostic setting and select AllLogs (or at minimum TunnelDiagnosticLog).</li>\n<li>Choose Send to Log Analytics Workspace (or Event Hub / Storage Account, as required).</li>\n<li>Click Save to apply the diagnostic setting.</li>\n</ol>\n<p>&nbsp;</p>\n<p><strong>Step 2: Create an alert rule</strong></p>\n<p>&nbsp;</p>\n<p>After enabling diagnostics, navigate to Azure Portal &gt; Monitor &gt; Alerts, and select Create &gt; Alert Rule.</p>\n<p><strong>Scope</strong></p>\n<p>Select Scope and click Select scope. In the resource selection pane, choose your Virtual Network Gateway (VPN Gateway) resource and click Apply. This sets the VPN Gateway as the target resource for the alert rule.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Condition</strong></p>\n<p>On the Condition tab, select Custom log search as the signal name and choose Aggregated logs as the query type.</p>\n<p>Enter the following KQL query to identify VPN tunnel disconnection events during the last 10 minutes:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>AzureDiagnostics</p>\n<p>| where TimeGenerated &gt; ago(10m)</p>\n<p>| where Category == \"TunnelDiagnosticLog\"</p>\n<p>| where status_s == \"Disconnected\"</p>\n<p>| project TimeGenerated, Resource, status_s<br /><br /></p>\n<p>Configure the measurement settings as follows:</p>\n<ul>\n<li>Measure: Table rows</li>\n<li>Aggregation type: Count</li>\n<li>Aggregation granularity: 5 minutes</li>\n<li>Threshold type: Static</li>\n<li>Operator: Greater than</li>\n<li>Threshold value: 0</li>\n</ul>\n<p>This configuration triggers an alert whenever one or more tunnel disconnection events are detected.</p>\n<p><strong>Actions</strong></p>\n<p>On the Actions tab, select Use action groups and either choose an existing action group or create a new one. Configure the action group to send notifications through email, SMS, webhook, or other supported notification channels when a VPN tunnel disconnection event is detected. You can also customize the email subject to make alert notifications easier to identify and manage.<br />&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Details</strong></p>\n<p>On the Details tab, provide a meaningful Alert Rule Name, select the appropriate Severity, and add a brief description of the alert. This information will help operations teams quickly understand the purpose and importance of the alert when it is triggered.</p>\n<p><strong>Review + create</strong></p>\n<p>Review all configuration settings to ensure they are correct, then select Create to deploy the alert rule. Azure Monitor will begin evaluating the configured query and automatically notify the specified recipients whenever a VPN tunnel enters a disconnected state.</p>\n<p>&nbsp;</p>\n<p><strong>Summary</strong></p>\n<p>By combining Azure VPN Gateway diagnostic logs with Azure Monitor alert rules, organizations can proactively monitor VPN tunnel health and receive near real-time notifications when a tunnel disconnects. This approach improves operational visibility, reduces troubleshooting time, and helps maintain reliable hybrid connectivity between Azure and on-premises networks.</p>"
