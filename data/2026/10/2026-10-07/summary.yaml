"overview": |
  この日は 6 件で、提供終了の予告が 3 本と、エージェント機能やベアメタル Kubernetes のプレビューでした。提供終了では、Azure Stack Hub 上の Azure App Service が 2029 年 9 月 30 日に終了します。2026 年 9 月 30 日からは新規インストールがサポートされなくなり、新しい製品リリースや機能、拡張も提供されません。App Service における Java 8、11、17 のサポートは 2027 年 9 月 1 日に終了します。ホストされているアプリは動き続けますが、セキュリティ更新は提供されず、これらのバージョンに対するカスタマーサービスもなくなります。Azure SQL Database の Always Encrypted の Intel SGX エンクレーブは、SGX 対応の DC シリーズハードウェアの段階的な廃止に伴い 2027 年 10 月 31 日に終了します。ハードウェアに依存しない Virtualization-Based Security (VBS) エンクレーブへの移行が推奨されています。開発では、Azure Functions の Agent バインディングが Python の Function App 向けにプレビュー提供されました。アプリケーションのコードの決定的な部分に主導権を残したまま、範囲を限った AI の推論を足せるというものです。コンテナでは、ベアメタル上の AKS が Ubuntu に対応してパブリックプレビューとなりました。オンプレミスで Kubernetes を動かすには仮想化レイヤを追加したり、慣れないインフラに合わせたり、アプリケーションが依存するハードウェアとソフトウェアの制御を手放したりすることが多く、AI ワークロードではそうしたトレードオフがローカルのデバイスへのアクセスを制限しかねない、という背景が示されています。セキュリティでは、AI の時代の脆弱性リスクの管理について CISO の視点をまとめた記事が公開され、AI を活用した脆弱性管理のもとでサイバーセキュリティのリスクを緩和しレジリエンシーを高める方法が取り上げられました。
