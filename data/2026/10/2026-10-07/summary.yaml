"overview": |
  この日は 9 件で、提供終了の予告が 4 本と、エージェント機能やベアメタル Kubernetes のプレビューでした。提供終了では、Azure Stack Hub 上の Azure App Service が 2029 年 9 月 30 日に終了します。2026 年 9 月 30 日からは新規インストールがサポートされなくなり、新しい製品リリースや機能、拡張も提供されません。App Service における Java 8、11、17 のサポートは 2027 年 9 月 1 日に終了します。ホストされているアプリは動き続けますが、セキュリティ更新は提供されず、これらのバージョンに対するカスタマーサービスもなくなります。Azure SQL Database の Always Encrypted の Intel SGX エンクレーブは、SGX 対応の DC シリーズハードウェアの段階的な廃止に伴い 2027 年 10 月 31 日に終了します。ハードウェアに依存しない Virtualization-Based Security (VBS) エンクレーブへの移行が推奨されています。開発では、Azure Functions の Agent バインディングが Python の Function App 向けにプレビュー提供されました。アプリケーションのコードの決定的な部分に主導権を残したまま、範囲を限った AI の推論を足せるというものです。コンテナでは、ベアメタル上の AKS が Ubuntu に対応してパブリックプレビューとなりました。オンプレミスで Kubernetes を動かすには仮想化レイヤを追加したり、慣れないインフラに合わせたり、アプリケーションが依存するハードウェアとソフトウェアの制御を手放したりすることが多く、AI ワークロードではそうしたトレードオフがローカルのデバイスへのアクセスを制限しかねない、という背景が示されています。セキュリティでは、AI の時代の脆弱性リスクの管理について CISO の視点をまとめた記事が公開され、AI を活用した脆弱性管理のもとでサイバーセキュリティのリスクを緩和しレジリエンシーを高める方法が取り上げられました。あわせて AKS の Pod プラットフォームメトリクスにおける pod name ディメンションのサポートが 2027 年 9 月 30 日に終了し、該当するメトリクスは Pod 数の集計カウンターへ移行します (フェーズごとの Pod 数を表す kube_pod_status_phase など)。ネットワークの運用では、Azure VPN Gateway のトンネルの切断を先回りして監視する方法が紹介されました。サイト間 (S2S) VPN 接続は Azure とオンプレミス環境をつなぐハイブリッド接続の重要な構成要素で、トンネルの障害はアプリケーション、ユーザーのアクセス、業務に影響します。Azure VPN Gateway は接続が回復すると自動でトンネルの再確立を試みますが、管理者はトンネルが切断された時点で通知を受け、すばやく調査して緩和できるべきです。記事では、トンネルが disconnected の状態に入ったときに自動で管理者へ通知する Azure Monitor のアラートの設定方法が解説されています。切断の原因にはインターネット接続の問題、オンプレミス側の VPN デバイスの障害、IPSec/IKE のネゴシエーションの問題、ネットワークの保守作業、デバイスの再起動やソフトウェアのアップグレードなどがあり、先回りの監視によって検知までの平均時間 (MTTD) を短縮し、ネットワークの可用性を高められます。まず VPN Gateway の診断ログ (AllLogs、少なくとも TunnelDiagnosticLog) を有効にすることが前提です。このほか、Microsoft が 2026 年の Gartner Magic Quadrant でグローバルな産業向け AIoT プラットフォーム部門のリーダーに選出されたことが発表されました。
