"overview": |
  この日は 6 件で、Open Compute Project Global Summit にあわせたインフラブログの記事が 5 件と、フィッシング基盤の解析が 1 件でした。ハードウェアセキュリティでは、オープンソースでの協業による 6 つのセキュリティ革新が発表されました。ハードウェアで保護された鍵管理、プラットフォームのレジリエンシー、システム全体にわたる構成証明 (attestation)、スケーラブルなベアメタル管理、リカバリー、シリコンの堅牢化にまたがるもので、その 1 つである Tessera Integrated HSM は、最新のワークロードに合わせてスケールしながら鍵と認証情報を業界最高水準で保護することを狙ったオープンソースのシリコン HSM です。ネットワークでは、AI 時代に向けてスケール・効率・オープン性を軸に構築を進める方針が示されました。モデルの能力が上がり AI システムが大きくなるにつれ、コンピュートを足すことは課題の一部にすぎず、今日最大級の AI システムはデータセンター内で数十万のアクセラレータを束ね、さらに AI インフラは複数のサイトにまたがって広がりつつあるため、ネットワークに求められるものが根本的に変わってきているという論旨です。電力では、グリッドからチップまで Azure のインフラに電力を供給する取り組みが取り上げられました。AI インフラの規模が拡大するにつれ、どれだけのコンピュートを配置できるかの上限を電力の確保が決めるようになってきており、ワークロードが長いコンテキストの推論やメモリ集約的なエージェントタスクへ移るなかで、大規模に AI を動かす際の電力の枠組みが大きく変化していること、最新の GPU や AI アクセラレータで構成される高密度な AI システムが需要のあり方を根本的に変えていることが述べられています。あわせて公開された 2 件のうち 1 件は、オープンソースの Integrated HSM 技術によるハードウェアセキュリティの前進で、協業と暗号鍵の保護について扱っています。もう 1 件は「フロンティア時代のインフラ」として、より大きなフロンティアモデルを作ることから実用的な成果を出す知能へと焦点が移りつつある状況を踏まえ、オープンな業界協業によって知能をスケールさせる取り組みを紹介しています。セキュリティでは、Microsoft が中国語圏のサイバー犯罪エコシステムを明らかにしました。フィッシングキットの運営者が相互に結びついたネットワーク (Storm-2990 として追跡) と、大規模なフィッシング用のツールやインフラを売る不正なマーケットプレイス (Storm-3119 として追跡) で構成され、Microsoft のデジタル犯罪対策ユニット (DCU) が各国の法執行機関やパートナーと協力してこのエコシステムの阻止を進めました。
