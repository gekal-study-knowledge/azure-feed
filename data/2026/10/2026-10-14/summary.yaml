"overview": |
  この日は 3 件で、いずれも Open Compute Project Global Summit にあわせたインフラブログの記事でした。ハードウェアセキュリティでは、オープンソースでの協業による 6 つのセキュリティ革新が発表されました。ハードウェアで保護された鍵管理、プラットフォームのレジリエンシー、システム全体にわたる構成証明 (attestation)、スケーラブルなベアメタル管理、リカバリー、シリコンの堅牢化にまたがるもので、その 1 つである Tessera Integrated HSM は、最新のワークロードに合わせてスケールしながら鍵と認証情報を業界最高水準で保護することを狙ったオープンソースのシリコン HSM です。ネットワークでは、AI 時代に向けてスケール・効率・オープン性を軸に構築を進める方針が示されました。モデルの能力が上がり AI システムが大きくなるにつれ、コンピュートを足すことは課題の一部にすぎず、今日最大級の AI システムはデータセンター内で数十万のアクセラレータを束ね、さらに AI インフラは複数のサイトにまたがって広がりつつあるため、ネットワークに求められるものが根本的に変わってきているという論旨です。電力では、グリッドからチップまで Azure のインフラに電力を供給する取り組みが取り上げられました。AI インフラの規模が拡大するにつれ、どれだけのコンピュートを配置できるかの上限を電力の確保が決めるようになってきており、ワークロードが長いコンテキストの推論やメモリ集約的なエージェントタスクへ移るなかで、大規模に AI を動かす際の電力の枠組みが大きく変化していること、最新の GPU や AI アクセラレータで構成される高密度な AI システムが需要のあり方を根本的に変えていることが述べられています。
