"overview": |
  この日は 4 件で、開発者ワークフローへの SRE エージェント統合、Azure MCP Server の安定版、それに HSM と災害対策の GA 情報でした。Apps on Azure Blog では、Azure SRE Agent の新しいキャンバスが紹介されました。インシデント管理システムから障害を受け取った SRE Agent が調査して初期診断を返したあと、その診断を自分で確かめたい担当者が、普段使っている GitHub Copilot の中で作業できるようにするものです。キャンバスは会話の隣に並ぶ対話型のパネルで、GitHub Copilot アプリでは左にセッション、中央に Copilot のチャット、右に SRE のキャンバスが並び、キャンバスに対応した Copilot CLI のセッションでも同じものが使えます。SRE Agent の調査結果と、SRE 側にはないもの (自分のコード、プライベートなデータソース、アプリについての知識) を並べて見ながら、どこまで掘り下げ、何をいつ SRE に返すかを判断できます。Azure SDK Blog では Azure MCP Server 3.0 の安定版リリースが公開され、Terraform、バックアップ、リカバリー、トラブルシューティング向けの AI エージェント用ツールが追加され、セキュリティの既定値も強化されました。更新情報では 2 件が一般提供になりました。1 つは Azure Cloud HSM のハードウェア監査ログで、対応する HSM 管理操作についてハードウェアが生成した監査記録を提供し、セキュリティ監視やコンプライアンス報告、ガバナンス、フォレンジック調査を支えます。もう 1 つは Azure Site Recovery の Azure Arc 対応で、Azure Arc 管理下の Windows の VMware 仮想マシンとオンプレミスの物理サーバーを災害対策の対象にできるようになりました。ガバナンスやインベントリは Azure Arc のまま利用できます。
