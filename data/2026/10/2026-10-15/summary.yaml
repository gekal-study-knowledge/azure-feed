"overview": |
  この日は 7 件で、Azure SRE Agent の導入指針と開発ワークフローへの組み込み、MCP サーバーの安定版リリース、それに仮想化プラットフォームの評価が中心でした。Azure SRE Agent については 3 本の記事が公開されました。新しい canvas は、インシデント管理システムからインシデントを受け取って調査し初期の診断を返してくる SRE Agent の調査内容を、GitHub Copilot の中で、自分のコードやツール、自分自身のデータへのアクセス権のもとで確かめられるようにするものです。エンタープライズ導入ガイドのパート 1 は「どこから始めるべきか」という問いに答えるもので、ユースケースの特定から最初の SRE Agent のデプロイまでを扱います。パート 2 は 1 つのチームから組織全体へ導入を広げる段階の問いを扱い、エージェントを誰と共有すべきか、別のチームが自分たちのエージェントを必要とするのはどんなときか、分かれたエージェントどうしをどう連携させるか、どうデプロイして展開するかを整理しています。開発ツールでは、Azure MCP Server 3.0 の安定版がリリースされました。Terraform・バックアップ・リカバリー・トラブルシューティング向けの AI エージェントツールが加わり、セキュリティのデフォルト設定も強化されています。サービス更新では、Azure Site Recovery (ASR) が Azure Arc 対応の Windows VMware 仮想マシンとオンプレミスの物理サーバーのディザスタリカバリに対応しました。Azure Arc をガバナンスやインベントリに使い続けながら、Arc 管理下のマシンを ASR で保護できます。あわせて、Azure Cloud HSM のハードウェア監査ログが一般提供となりました。対応する HSM の管理操作についてハードウェアが生成した監査レコードを提供するもので、セキュリティ監視・コンプライアンス報告・ガバナンス・フォレンジック調査の強化に役立ちます。あわせて、Microsoft が 2026 年の Gartner Magic Quadrant (Server Virtualization Platforms 部門) でリーダーに選出されたことが報告されました。Azure と Azure Arc による運用面の一貫性と、Hyper-V によるインフラ面の一貫性を築いているという位置づけです。
