    "title": "Bring Azure SRE Agent into your developer workflow with the new canvas"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/bring-azure-sre-agent-into-your-developer-workflow-with-the-new/ba-p/4564514"
    "published": "2026-10-15 01:35:26"
    "fetched": "2026-10-15 04:47:19"
    "summary": "<p>You’re on call. A customer-reported incident lands, Azure SRE Agent picks it up from your incident management system, investigates, and gives you a starting diagnosis.</p>\n<p>If you’re like me, you want to check that diagnosis yourself, and you want to do it where you already work: in GitHub Copilot, with your code, your tools, and your own access to the data.</p>\n<p>The new <a class=\"lia-external-url\" href=\"https://aka.ms/sreagent/canvas/doc\" rel=\"noopener\" target=\"_blank\">Azure SRE Agent canvas</a> puts the investigation right next to your Copilot chat. A canvas is an interactive panel beside the conversation, with context and actions you and Copilot can both use. You get SRE Agent’s findings plus everything SRE doesn’t have: your code, your private data sources, and what you know about the app.</p>\n<p>In the <strong>GitHub Copilot App</strong>, sessions are on the left, Copilot chat is in the middle, and the SRE canvas is on the right. You can use the same canvas in <strong>Copilot CLI</strong> sessions that support canvases.</p>\n<p>I now have SRE's findings alongside my own context in Copilot chat. I can keep digging here and decide what to send back to SRE, and when.</p>\n<img /><em>The GitHub Copilot App with the September investigation open in the canvas.</em>\n<p>Let me show you the inner loop with an incident from September 22. It’s a Contoso demo, but it’s modeled on a real one we hit in production. Gateway health looked available while orders and payments failed. I'll use SRE's diagnosis as a starting point, check the historical telemetry with my own authorized access, and work out what the evidence does and doesn't establish. I’ll share findings with the team, and anything worth keeping goes back to SRE Agent.</p>\n<h2>Start with the incident</h2>\n<p>With the plugin enabled, I prompt Copilot to open <strong>Azure SRE Agent</strong> and choose my saved demo1-dt-snow favorite. I can also discover agents in a subscription I choose or connect through a caller-authorized external URL. For this investigation, I open <strong>INC0922001</strong>, \"Trading order and payment requests failing while gateway health remains available,\" and choose <strong>Connect this thread</strong>. Selecting a row lets me browse; connecting makes it the investigation for this conversation.</p>\n<img />\n<p><em>The September incident as recorded in SRE Agent.</em></p>\n\n<p>Then I ask:</p>\n<blockquote>\n<p>Summarize this connected September 22 investigation. Separate the reported diagnosis from observed evidence. Give the incident time window, and list what still needs independent verification.</p>\n</blockquote>\n<p>The SRE record reports a stopped PostgreSQL database. It says the gateway passed its health check, but Orders and payments requests failed after about 15 seconds. That's useful context, but a passing health check doesn't mean orders and payments are working. I want to check the logs for myself.</p>\n<img />\n<p><em>SRE’s diagnosis and suggested recovery. Suggested isn’t the same as confirmed, which is where I start digging.</em></p>\n\n<h2>Get the historical window right</h2>\n<p>The first query assumption I check is the date. This incident needs <strong>September 22, 17:30 to 19:45 UTC</strong>, not the last 24 hours.</p>\n<p>I use the Log Analytics workspace behind the demo and ask:</p>\n<blockquote>\n<p>Reconstruct the failure check for this historical window. Show the complete query and target before running it. Then break down the request routes and status codes.</p>\n</blockquote>\n<p>The reconstructed query and its saved result give me something concrete to inspect. This is my own reconstruction, not a replay of SRE’s query, so the counts differ a little from SRE’s snapshot. The <a href=\"https://github.com/coreai-microsoft/canvases-cloud-foundation/blob/paulyuk-microsoft-sre-demo-and-blog/docs/blog/azure-sre-agent-canvas-demo-runbook.md#q1-reconstructed-baseline-saved-result\" rel=\"noopener\" target=\"_blank\">query runbook</a> includes the complete KQL, working Log Analytics API route, and scope for review.</p>\n<img /><em>The reconstructed query, saved as an evidence artifact I can review before anything runs.</em>\n<p>The result contains&nbsp;<strong>120 gateway Orders 500 records</strong>, <strong>115 gateway payments 502 records</strong>, corresponding backend failures, and <strong>119 database connection timeouts</strong>. These are telemetry records, not distinct customer requests: the gateway and backend can record the same call. Exporter authentication errors and later route 404s are separate signatures, not more examples of the same database failure.</p>\n<h2>Inspect the requests, dependencies, and exceptions</h2>\n<p>Grouped counts tell me where to look.</p>\n<img /><em>The grouped result. Each error signature stays separate so I don’t lump unrelated failures together.</em>\n<p>To understand the failure, I want to look at some of the actual log entries from that time window, not just the totals:</p>\n<blockquote>\n<p>Show the Orders requests, downstream dependencies, and database timeouts for this window. Where operation IDs are populated, follow the same operation. Tell me what is correlated and what is only nearby in time.</p>\n</blockquote>\n<p>The saved exception signature says the connection to the database endpoint timed out. That supports a connectivity problem; it doesn't independently prove the database was stopped. To connect a particular exception to a particular request, I need matching trace identifiers, not just nearby timestamps. The raw-record and correlation queries are the next checks, with their own execution approval.</p>\n<h2>Widen my check beyond Orders</h2>\n<p>An Orders-focused query is a useful starting point, not an impact assessment. I ask:</p>\n<blockquote>\n<p>Keep the same source and time window, but remove the Orders operation and dependency-target restrictions. What else has 5xx failures or the same database-connectivity signature? Keep unrelated errors separate.</p>\n</blockquote>\n<p>The saved broader result already includes payments, which SRE also identified. My goal is to verify that scope independently and see whether the wider query adds anything. I won't turn two affected paths into an all-services outage. This data also has blank application-role names, so I use the recorded operations and dependency targets rather than invent an application-name filter.</p>\n<h2>Test the competing explanation</h2>\n<p>A gateway deployment or connection setting could also cause trouble. I want to compare that explanation with the database diagnosis:</p>\n<blockquote>\n<p>Preview the historical deployment and configuration records needed for this window, plus independent database state or availability evidence. Do not use today's settings or health as proof of September 22. If the records aren't available, leave the check open.</p>\n</blockquote>\n<p>The first SRE record reports the database as stopped, but its Activity Log check found no stop event and may not have covered the right scope. Independent incident-window records would help distinguish stopped state from configuration or network problems. Current settings can't establish historical state, and missing or expired change history can't rule out a deployment.</p>\n<p>For now, the logs support connectivity trouble. Historical database state and the competing configuration explanation still need checking. The first record also doesn't confirm completed recovery; a later recurrence doesn’t tell us what happened on September 22..</p>\n<h2>Bring in evidence SRE may not have, or go where it cannot</h2>\n<p>The logs got me to a connectivity problem. The next question is capacity: was something starved? That evidence lives in a Kusto cluster SRE Agent can’t reach, but I can. <strong>Private Connectors</strong> let me use my own authorized access from inside the same investigation.</p>\n<img />\n<p><em>Copilot-private connections are separate from the SRE Agent connectors. Teams is ready for the update.</em></p>\n<p>&nbsp;</p>\n\n<p>For a performance or capacity question, I can choose an authorized connection, review the source and complete query, and approve its time range and filters before execution. Then I can compare the relevant measurements and units. This is an extension of the investigation. Granting capacity is a separate action with its own approval. I can do it from here, but it’s my call, not the agent’s.</p>\n<p>The connection stays private to Copilot. Connecting an SRE investigation doesn't give the agent my datasource permissions. If I want SRE to use a finding, I separately preview and approve the evidence to share. For checks I run locally, I use my identity and network access; a cloud-backed connector uses its provider's network path.</p>\n<h2>Review the updated team message</h2>\n<p>The team update should carry the refined root-cause analysis, including its limits: SRE's reported diagnosis, the independently observed failures, the scope, and the checks still open. Next prompt:</p>\n<blockquote>\n<p>Draft a September 22 update to send to the team in Teams. Include the reported diagnosis, observed Orders and payments failures, connectivity evidence, competing explanations, and remaining checks. Include the investigation link. Show me the exact message and destination before sending.</p>\n</blockquote>\n<img /><em>The September 22 demo update posted to the Azure Functions Team's PMs channel after I reviewed and approved it.</em>\n<p>That gives the team a useful starting point for the next check, with a link back to the investigation.</p>\n<h2>Continue in the terminal</h2>\n<p>I can carry the same investigation into a canvas-capable <strong>Copilot CLI</strong> session. I connect <strong>INC0922001</strong> explicitly in that conversation; the App's connection doesn't carry over.</p>\n<blockquote>\n<p>Connect to INC0922001 from September 22. Give me a TL;DR that separates the reported diagnosis, independently checked evidence, and remaining questions.</p>\n</blockquote>\n<p>The terminal is another place where I like to work, and I still want to follow the same evidence and use my own context and tools. The SRE canvas provides tools to Copilot CLI too. The <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/access-your-sre-agent-from-any-ide-terminal-or-ai-assistant/4523434\" rel=\"noopener\" target=\"_blank\">IDE and terminal guide</a> covers a separate connection through the Azure MCP Server.</p>\n<img /><em>The same September investigation, connected again in Copilot CLI.</em>\n<p>So who stopped the database? We did, for the demo. The real production incident that inspired this was resource exhaustion, which is less satisfying, because every engineer wants it to be the database. It’s better when you can prove it.</p>\n<h2>Try the canvas for your next investigation</h2>\n<p>The useful loop isn't just reading an incident summary from an agent. It's taking SRE's starting diagnosis into Copilot, inspecting the evidence, testing alternatives, and bringing in authorized data from my own tools. Sometimes that confirms SRE Agent got it right. Sometimes it doesn’t. Either way, what I learn goes back into the agent’s memory so the next incident starts smarter. In this one, I learned we’re not resilient enough to this kind of failure yet, and we have hardening work to do.</p>\n<p>Install from <strong>Customize &gt; Plugins &gt; Awesome Copilot &gt; Azure SRE Agent</strong>, start a new session, and ask:</p>\n<blockquote>\n<p>Open Azure SRE Agent canvas.</p>\n</blockquote>\n<p>Watch the <a class=\"lia-external-url\" href=\"https://aka.ms/sreagent/canvas/demo\" rel=\"noopener\" target=\"_blank\">demo video</a>, bring an existing investigation, and <a href=\"https://github.com/microsoft/azure-dev-tools/issues\" rel=\"noopener\" target=\"_blank\">tell us what you think</a>. The <a href=\"https://aka.ms/sreagent/canvas/doc\" rel=\"noopener\" target=\"_blank\">canvas guide</a> has setup details. Also see the <a href=\"https://aka.ms/sreagent/updates/2026-10\" rel=\"noopener\" target=\"_blank\">October SRE Agent update</a> and explore the <a href=\"https://developer.microsoft.com/blog/azure-canvases/\" rel=\"noopener\" target=\"_blank\">other Azure canvases</a>.</p>"
