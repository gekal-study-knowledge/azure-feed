"overview": |
  この日は 6 件で、PostgreSQL まわりの機能強化とソブリンクラウドへの展開が中心でした。データベースでは、Azure Backup for PostgreSQL flexible server および elastic cluster (v2) がプレビューとなり、エンタープライズ水準の長期保持が PostgreSQL に加わりました。バックアップはマネージドディスクのスナップショットからの物理バックアップとして取得され、Azure Backup コンテナーに保管されます。あわせて Azure HorizonDB の提供リージョンが追加され、PostgreSQL のワークロードをアプリケーションや利用者のより近くに配置する選択肢が広がりました (プレビュー)。SQL Server on Azure Virtual Machines はフランスのソブリンクラウド環境である Azure Bleu で一般提供となり、データ所在地と主権の要件を満たしながら SQL Server のワークロードを展開・管理できます。ネットワークセキュリティでは、Application Gateway の Web Application Firewall (WAF) が IPv6 トラフィックの検査と適用に対応しました (パブリックプレビュー)。分析では、2026 年 10 月 15 日から Microsoft Fabric の検索が、セマンティックモデル・レイクハウス・ミラーリングされたデータベースのテーブルを個別の結果として返すようになることが告知されました。テーブル名や説明での検索、列名の完全一致によるテーブル検索ができます。サーバーレスでは、Azure Functions の管理コネクタについて、1,700 のサービスへアクセスでき、対応するサービスコネクタではトリガーと型付きクライアントが使える点が解説され、SharePoint・Azure Content Understanding・Teams を横断して RFP の受付を自動化するサンプルが紹介されました。
