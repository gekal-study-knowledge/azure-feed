    "id": "ad61cf449fcf0edfdbac121beabf438d"
    "title": "Qwen3.8-Flash-Next on two H100s in an Azure Spot VM"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/qwen3-8-flash-next-on-two-h100s-in-an-azure-spot-vm/ba-p/4563893"
    "published": "2026-10-13 02:05:45"
    "fetched": "2026-10-14 01:32:01"
    "summary": "<p>With 150,000 tokens of context, one request to Qwen3.8-Flash-Next decoded at about 200 tokens a second, and its first token arrived in under a second, because 95% of the prompt came from the cache. That held while the agents kept up to five requests running at once. At seven, one request in twenty waited 23 seconds or more for its first token. No error explained it; the dashboard did, one panel after another.</p>\n<p>This post covers how to run the model on two H100 GPUs in one Azure VM and how to observe it: which signals matter for this kind of model, three places where a standard dashboard misreads it, and one serving flag that made a measurable difference. My previous post, <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/4563387\" target=\"_blank\">Qwen3.8-27B on a $2 H100 Azure Spot VM: does it pay off?</a>, walks through the base setup (the VM, the Compose stack, the LiteLLM gateway and the OpenTelemetry pipeline into Application Insights and Grafana) in more detail; here I focus on what changes for a bigger model.</p>\n<img />\n<h2>What you're running</h2>\n<p><a href=\"https://huggingface.co/Qwen/Qwen3.8-Flash-Next\" target=\"_blank\">Qwen3.8-Flash-Next</a> is a mixture-of-experts (MoE) model from Qwen, released in August 2026 under the qwen-community-1.0 license. A few of its properties shape how you serve it:</p>\n<ul>\n<li><strong>125B parameters, 6B active per token.</strong> Each token passes through a small share of the experts, so decoding reads far less than the full weights.</li>\n<li><strong>Mostly linear attention.</strong> Its 48 layers come in 12 blocks of three Gated DeltaNet layers, which keep a fixed-size state, and one Qwen Sparse Attention layer. Only those 12 sparse-attention layers keep a per-token KV cache.</li>\n<li><strong>A 51B n-gram embedding table</strong> (20 million bigram and trigram entries), which vLLM keeps in host memory on H100 GPUs.</li>\n<li><strong>A multi-token prediction (MTP) layer</strong> for speculative decoding, a 262,144-token context window (extendable to about one million with YaRN), and vision input.</li>\n<li><strong>Thinking on by default,</strong> with a <code>reasoning_effort</code> setting (<code>xhigh</code> by default, or <code>medium</code> or <code>low</code>).</li>\n</ul>\n<p>Qwen's FP8 checkpoint, <code>Qwen/Qwen3.8-Flash-Next-FP8</code>, is 185.6 GB, too much for one 94 GB H100 even with the n-gram table in host memory. Split across two with tensor parallelism, it fits with room left for the KV cache:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><colgroup><col style=\"width: 91.36%;\" /><col style=\"width: 8.64%;\" /></colgroup><thead><tr><th>Per GPU</th><th>GiB</th></tr></thead><tbody><tr><td>Weights, n-gram table excluded, split in two</td><td>65.6</td></tr><tr><td>vLLM's share of the GPU at <code>--gpu-memory-utilization 0.90</code></td><td>~84</td></tr><tr><td>Left for the KV cache, activations and CUDA graphs</td><td>~18</td></tr></tbody></table></div>\n<h3>Why not 4-bit weights?</h3>\n<p>FP4 weights would save memory, but on an H100 they can be slower. The H100's tensor cores compute in FP8, not FP4, which arrived with Blackwell. NVIDIA publishes an <a href=\"https://huggingface.co/nvidia/Qwen3.8-Flash-Next-NVFP4\" target=\"_blank\">NVFP4 checkpoint of this model</a>, 132.7 GB, quantized for and tested on B200 and B300 GPUs, under the NVIDIA Open Model License in addition to Qwen's. vLLM v0.31.0 still loads it on an H100 by falling back to a Marlin kernel, which keeps the expert weights in 4 bits and unpacks them to BF16 for each matrix multiplication. That saves memory, not compute: the experts then multiply in BF16, whose peak rate on an H100 is half that of FP8.</p>\n<p>In that checkpoint, only the routed experts are FP4. Attention, the shared experts and the other layers stay in BF16, and the n-gram table and the MTP layer stay in FP8. My estimate from its file sizes:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><colgroup><col style=\"width: 31.19%;\" /><col style=\"width: 20.23%;\" /><col style=\"width: 48.58%;\" /></colgroup><thead><tr><th>&nbsp;</th><th>FP8 (this post)</th><th>NVFP4 on H100 (estimate)</th></tr></thead><tbody><tr><td>Weights on the GPUs, n-gram table excluded</td><td>131 GiB</td><td>~76 GiB</td></tr><tr><td>On one H100</td><td>Doesn't fit</td><td>Only just: a few GiB left for the KV cache, about one long agent session</td></tr><tr><td>KV cache on two H100s</td><td>1.5 million tokens, FP8 cache</td><td>About three times as much</td></tr><tr><td>Expert matrix math</td><td>FP8 tensor cores</td><td>BF16, after unpacking the weights</td></tr></tbody></table></div>\n<p>Which way it goes depends on the workload. Decoding mostly reads weights, so smaller weights can keep it fast. Prefill is mostly math, and coding agents send long prompts, so a slower prefill shows up as a longer wait for the first token whenever the cache misses. A cache three times larger would miss less often. I haven't measured this trade; if you try it, the panels later in this post show it, with time to first token and computed prefill set against the prefix-cache hit rate. For one GPU today, see the one-GPU alternative near the end of this post.</p>\n<h2>Step 1: Get a two-GPU Spot VM</h2>\n<p>The size is <code>Standard_NC80adis_H100_v5</code>: two H100 NVL GPUs with 94 GB each, 80 vCPUs and 640 GiB of memory. On October 12, 2026 it cost $3.22 an hour as an <a href=\"https://learn.microsoft.com/azure/virtual-machines/spot-vms\" target=\"_blank\">Azure Spot Virtual Machine</a> in UK South, against $17.45 at the pay-as-you-go price: about 80% less, for capacity that Azure can take back with 30 seconds' notice (prices change; check <a href=\"https://azure.microsoft.com/pricing/details/virtual-machines/linux/\" target=\"_blank\">the pricing page</a>). In the two regions I compared, the Spot price was exactly twice the one-GPU size's.</p>\n<p>Spot draws on your regional low-priority vCPU quota. This size takes 80 vCPUs of it, which in my subscription left no room in the same region for the one-GPU VM from the previous post. Plan for evictions: my two VMs of this size in UK South zone 2 ran 6 h 17 min and 6 h 30 min before Azure reclaimed them. Both kept their disks under the <em>Deallocate</em> eviction policy, so a restart in place reloads the model from disk in a few minutes.</p>\n<p>The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-flash-next/infra/provision-spot-vm.sh\" target=\"_blank\">infra/provision-spot-vm.sh</a> creates this size, with the same private network as in the previous post: no public IP, outbound traffic through a NAT gateway, and administration through <code>az vm run-command</code>:</p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>LOCATION=southeastasia ZONE=2 infra/provision-spot-vm.sh\n</code></pre>\n<h2>Step 2: Prepare the host</h2>\n<p>The host bootstrap is the same as for one GPU: the data disk, the NVIDIA datacenter driver (595 branch), Docker and the NVIDIA Container Toolkit, in about four minutes. Then check how the two GPUs are connected, because tensor parallelism exchanges data between them in every layer:</p>\n<pre class=\"lia-code-sample language-markup\" contenteditable=\"false\" tabindex=\"0\"><code>$ nvidia-smi topo -m\n        GPU0    GPU1    CPU Affinity    NUMA Affinity\nGPU0     X      NV12    0-39            0\nGPU1    NV12     X      40-79           1\n</code></pre>\n<p><code>NV12</code> means an NVLink bridge with 12 links. <code>nvidia-smi nvlink --status</code> lists 18 links per GPU, 12 active at 26.6 GB/s each and 6 inactive. Remember those six; they come back in the monitoring section.</p>\n<h2>Step 3: Serve it with vLLM</h2>\n<p>NVIDIA's NGC vLLM container that served the 27B predates this model, so the stack uses vLLM's own <code>vllm/vllm-openai:v0.31.0</code> image, which knows the architecture and its MTP layer. The flags follow <a href=\"https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next\" target=\"_blank\">vLLM's recipe for this model</a>, adjusted for two GPUs:</p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>vllm serve /models/Qwen3.8-Flash-Next-FP8 \\\n  --served-model-name qwen3.8-flash-next-vllm \\\n  --tensor-parallel-size 2 \\\n  --max-model-len 262144 \\\n  --gpu-memory-utilization 0.90 \\\n  --max-num-seqs 32 \\\n  --max-num-batched-tokens 16384 \\\n  --enable-prefix-caching \\\n  --kv-cache-dtype fp8 \\\n  --attention-config.indexer_kv_dtype fp8 \\\n  --moe-backend triton \\\n  --no-enable-flashinfer-autotune \\\n  --spec-method mtp --spec-tokens 3 \\\n  --reasoning-parser qwen3 \\\n  --enable-auto-tool-choice --tool-call-parser qwen3_coder\n</code></pre>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><colgroup><col style=\"width: 29.15%;\" /><col style=\"width: 70.85%;\" /></colgroup><thead><tr><th>Flag</th><th>Why</th></tr></thead><tbody><tr><td><code>--tensor-parallel-size 2</code></td><td>Splits every layer across the two GPUs.</td></tr><tr><td><code>--gpu-memory-utilization 0.90</code></td><td>Under load each GPU reached 92 of 96 GB at this setting, so I left it there.</td></tr><tr><td><code>--kv-cache-dtype fp8</code>, <code>--attention-config.indexer_kv_dtype fp8</code></td><td>Stores the KV cache, and the sparse-attention indexer's, in FP8. The recipe's H100 command leaves these out; its H200 command, also a Hopper GPU, includes them. Why I added them is the subject of <em>One flag, measured</em>, below.</td></tr><tr><td><code>--moe-backend triton</code>, <code>--no-enable-flashinfer-autotune</code></td><td>The recipe's MoE kernels for Hopper GPUs.</td></tr><tr><td><code>--spec-method mtp --spec-tokens 3</code></td><td>Speculative decoding with the model's MTP layer.</td></tr><tr><td><code>--reasoning-parser qwen3</code>, <code>--tool-call-parser qwen3_coder</code></td><td>Thinking returned separately from the answer, and OpenAI-style tool calls.</td></tr></tbody></table></div>\n<p>Two container settings matter as well. vLLM pins each GPU's share of the n-gram table in host memory, so the container needs <code>ulimits: memlock: -1</code>, and the two tensor-parallel workers communicate through shared memory, so it needs <code>ipc: host</code>.</p>\n<p>On a new VM, the download takes about 20 minutes and loading about 4 more. The startup log then tells you the two numbers that decide everything later:</p>\n<pre class=\"lia-code-sample language-markup\" contenteditable=\"false\" tabindex=\"0\"><code>Model loading took 65.58 GiB memory\nGPU KV cache size: 1,506,691 tokens, Maximum concurrency for 262,144 tokens per request: 5.75x\n</code></pre>\n<h2>Step 4: Check it</h2>\n<p>The smoke test from the previous post (an exact answer, a required tool call and a decode-speed run) passes, and one request generates 260 tokens a second with thinking off, against 166 for the 27B on one GPU. A 45-case basic evaluation (math and logic with and without thinking, knowledge, instruction following, generated code run against tests, tool calls, and needle retrieval at 30K and 120K tokens) scores 44 of 45, the same as the 27B. An agentic coding evaluation on 10 short <a href=\"https://www.tbench.ai/\" target=\"_blank\">Terminal-Bench 2.0</a> tasks solved 8.</p>\n<h2>Step 5: Observe it</h2>\n<p>The telemetry pipeline is the one from the previous post: an OpenTelemetry Collector on the VM scrapes vLLM, LiteLLM and NVIDIA's DCGM exporter, reads host and container statistics, receives LiteLLM's spans and tails the container logs, and sends all of it to Application Insights, which stores the metrics in an Azure Monitor workspace as Prometheus data. Grafana reads both. Two things changed for this model.</p>\n<h3>One dashboard for several models</h3>\n<p>The collector stamps every metric, span and log record with an <code>upstream_model</code> label naming the model the VM serves. A <code>model</code> variable at the top of the dashboard filters every panel by it and lets you pick one model, several or all. With more than one, each graph draws a line per model, so the 27B and Flash-Next appear side by side.</p>\n<p>Two details made it work. The Azure Monitor workspace's label-values API requires exactly one metric name, so the variable's query is <code>label_values(vllm:num_requests_running, upstream_model)</code>. And the VM's cost is now computed from the GPUs reporting in each minute times a price per GPU-hour, so a one-GPU and a two-GPU model are both costed correctly from one price.</p>\n<h3>Three numbers the dashboard got wrong at first</h3>\n<p><strong>Per-request speed.</strong> The usual formula, <code>1 / histogram_quantile(0.5, ...inter_token_latency_seconds...)</code>, read a constant 57 tokens a second on this model while requests were really getting 150 to 260. Two things go wrong at once. With speculative decoding, vLLM records one inter-token interval per decode step, and each step produced about 2.4 tokens. And 99.7% of the steps landed in the histogram's 10–25 ms bucket, so the median is that bucket's midpoint, 17.5 ms, whatever the real speed. I used the same formula in the previous post's table; this one holds up better:</p>\n<pre class=\"lia-code-sample language-markup\" contenteditable=\"false\" tabindex=\"0\"><code>(sum(rate(vllm:generation_tokens_total[5m])) &gt; 0)\n  / clamp_min(sum(avg_over_time(vllm:num_requests_running[5m])), 1)\n</code></pre>\n<p>That's output tokens per second divided by the requests running. The <code>clamp_min</code> matters because the collector samples the running-request gauge every 15 seconds and misses short requests that start and end between samples. Without it, a minute of short requests read up to 668 tokens a second.</p>\n<p><strong>GPU health.</strong> DCGM's health check reported <em>Fail</em> on a healthy VM. Its NVLink watch reports the six inactive links on each GPU as down (<code>dcgm_fr_nvlink_down</code>), while the bridge's 12 links are up. The dashboard's health tile now leaves that one error code out, which leaves the <em>Warn</em> that power throttling raises under normal load.</p>\n<p><strong>Histogram means.</strong> OTLP histograms arrive in the Azure Monitor workspace as native histograms. <code>histogram_quantile</code> works on them, but <code>histogram_sum</code>, <code>histogram_count</code> and <code>histogram_avg</code> returned 0 or NaN for these metrics, so averages come from counter rates, as above, rather than from the histograms.</p>\n<h3>The panels that matter for this model</h3>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><colgroup><col style=\"width: 18.45%;\" /><col style=\"width: 81.55%;\" /></colgroup><thead><tr><th>Question</th><th>PromQL</th></tr></thead><tbody><tr><td>Are requests waiting, and for what?</td><td><code>sum by (reason) (vllm:num_requests_waiting_by_reason)</code>: <code>capacity</code> means the KV cache is full</td></tr><tr><td>Is the KV cache holding the sessions?</td><td><code>max(vllm:kv_cache_usage_perc)</code>, and the prefix-cache hit rate <code>sum(rate(vllm:prefix_cache_hits_total[5m])) / sum(rate(vllm:prefix_cache_queries_total[5m]))</code></td></tr><tr><td>Is the GPU recomputing prompts?</td><td><code>sum(rate(vllm:prompt_tokens_by_source_total{source=\"local_compute\"}[5m]))</code> against <code>{source=\"local_cache_hit\"}</code>, and <code>sum(increase(vllm:num_preemptions_total[5m]))</code></td></tr><tr><td>How far does speculative decoding get?</td><td><code>sum by (position) (rate(vllm:spec_decode_num_accepted_tokens_per_pos_total[5m])) / scalar(sum(rate(vllm:spec_decode_num_drafts_total[5m])))</code></td></tr><tr><td>What crosses the PCIe bus?</td><td><code>sum(dcgm_fi_prof_pcie_rx_bytes)</code>, host to GPU in bytes per second</td></tr></tbody></table></div>\n<p>The spans complete the picture. Each LiteLLM call carries its input and output tokens, time to first token, duration and finish reason, so decode speed per call is <code>output tokens / (duration - time to first token)</code>, and you can group calls by prompt size. The spans also record each tool the client declares, which tells different agents apart without capturing a single prompt.</p>\n<h2>Load it with coding agents</h2>\n<p>A benchmark sends synthetic prompts at a fixed rate. Agents don't: their prompts grow with every turn, most of each prompt is the previous turn's, and between turns they run tools while the model waits. To see the model under that shape of load, I ran <a href=\"https://opencode.ai/\" target=\"_blank\">opencode</a>, an open-source coding agent, as a load generator: one instance per local repository, each asked to review every file.</p>\n<p>Agents that can edit files and run commands shouldn't be pointed at a dozen repositories for a load test, so every instance ran with an inline configuration that limits it to read-only tools. Passed in <code>OPENCODE_CONFIG_CONTENT</code>, it overrides the global and project <a href=\"https://opencode.ai/docs/config/\" target=\"_blank\">opencode config</a> files; only managed settings rank higher. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-flash-next/load-test/review-readonly.json\" target=\"_blank\">load-test/review-readonly.json</a> is a copy of the one I ran that also defines the gateway as an OpenAI-compatible provider and keeps agents away from <code>.env</code> files:</p>\n<pre class=\"lia-code-sample language-json\" contenteditable=\"false\" tabindex=\"0\"><code>{\n  \"provider\": {\n    \"litellm\": {\n      \"npm\": \"@ai-sdk/openai-compatible\",\n      \"name\": \"LiteLLM gateway\",\n      \"options\": { \"baseURL\": \"{env:LOCAL_LLM_URL}/v1\" },\n      \"models\": { \"local-llm\": { \"name\": \"local-llm\", \"limit\": { \"context\": 245760, \"output\": 16384 } } }\n    }\n  },\n  \"model\": \"litellm/local-llm\",\n  \"small_model\": \"litellm/local-llm\",\n  \"permission\": {\n    \"read\": { \"*\": \"allow\", \"*.env\": \"deny\", \"*.env.*\": \"deny\", \"*.env.example\": \"allow\" },\n    \"glob\": \"allow\", \"grep\": \"allow\", \"list\": \"allow\", \"todowrite\": \"allow\",\n    \"edit\": \"deny\", \"bash\": \"deny\", \"webfetch\": \"deny\", \"websearch\": \"deny\",\n    \"external_directory\": \"deny\", \"question\": \"deny\", \"task\": \"deny\", \"doom_loop\": \"deny\"\n  },\n  \"mcp\": { \"playwright\": { \"enabled\": false } },\n  \"lsp\": false,\n  \"formatter\": false,\n  \"snapshot\": false,\n  \"autoupdate\": false,\n  \"share\": \"disabled\"\n}\n</code></pre>\n<p>List your own MCP servers under <code>mcp</code> the same way. To run one agent by hand:</p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>export LOCAL_LLM_URL=https://&lt;your-domain&gt;.ngrok-free.dev\nexport OPENCODE_CONFIG_CONTENT=\"$(cat load-test/review-readonly.json)\"\ncd ~/src/some-repo &amp;&amp; opencode run --pure -m litellm/local-llm \"Review every file in this repository.\"\n</code></pre>\n<p>The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-flash-next/load-test/launch.sh\" target=\"_blank\">load-test/launch.sh</a> starts one per folder you list, a few seconds apart, and stops launching when the workstation runs low on memory.</p>\n<p>Check it in a scratch folder first: ask an agent to create a file and run a command. In my test the agent wasn't offered those tools, and the folder stayed unchanged.</p>\n<p>Three settings in it matter beyond safety. The context limit tells opencode when to compact the conversation; without it, sessions grew until the gateway rejected them as too long. Denying <code>task</code> stops an agent from starting sub-agents, so each instance is one session; with sub-agents allowed, 29 instances had 69 requests in flight. And each instance took 0.7–0.9 GB of memory on my workstation, so the workstation, not the GPU, capped the first run at 46 agents.</p>\n<h2>What the telemetry showed</h2>\n<h3>Decode speed barely depends on context length</h3>\n<p>From the spans, here is the median decode speed of calls with at least 300 output tokens, by prompt size, next to the 27B's from the previous post's busy window:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><colgroup><col style=\"width: 18.33%;\" /><col style=\"width: 34.25%;\" /><col style=\"width: 25.11%;\" /><col style=\"width: 22.31%;\" /></colgroup><thead><tr><th>Prompt size</th><th>Flash-Next, 1–2 requests at once</th><th>Flash-Next, 3–5 at once</th><th>27B, about 3 at once</th></tr></thead><tbody><tr><td>Under 50K tokens</td><td>197–221</td><td>201</td><td>60–78</td></tr><tr><td>50–100K</td><td>192</td><td>183</td><td>63</td></tr><tr><td>150–200K</td><td>217</td><td>200</td><td>54</td></tr><tr><td>Over 200K</td><td>195</td><td>166</td><td>51</td></tr></tbody></table></div>\n<p>The 27B slowed by about a fifth as its prompts grew; Flash-Next held its speed. The architecture explains it: 36 of its 48 layers keep a fixed-size state, and the other 12 use sparse attention, so the work per token grows little with the context.</p>\n<h3>The n-gram table shows up on the PCIe bus</h3>\n<p>With the model decoding, DCGM reported 4.6–8.6 GB/s flowing from host to GPU over PCIe, rising and falling with the output rate and dropping to almost nothing when idle. On the 27B, which keeps everything in GPU memory, the same counter read 0.03 GB/s. The n-gram table is the part of this model that lives in host memory, so it's the likely source. That's at most an eighth of what the GPUs' PCIe 5.0 x16 links carry, so it isn't a bottleneck at this load, but it's worth a panel if you run more requests at once.</p>\n<h3>Sessions, not requests, fill the KV cache</h3>\n<p>Agentic traffic is mostly reused prompt. For hours, 88–95% of input tokens came from the prefix cache, and time to first token stayed under a second at 100,000 tokens and more. vLLM keeps each session's prompt in the cache between turns, so the next turn only processes what's new.</p>\n<p>That works only while every active session's prompt fits, including the sessions that are between turns, running tools. With the KV cache in BF16, the cache held 840,277 tokens. Here is what happened when the agents went from five requests running at once to seven, with prompts of about 110,000 tokens at the median and up to 230,000:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><colgroup><col style=\"width: 14.72%;\" /><col style=\"width: 17.08%;\" /><col style=\"width: 11.29%;\" /><col style=\"width: 12.41%;\" /><col style=\"width: 13.55%;\" /><col style=\"width: 9.85%;\" /><col style=\"width: 21.10%;\" /></colgroup><thead><tr><th>15 minutes to (UTC)</th><th>Requests running, peak</th><th>KV cache, peak</th><th>Prefix-cache hits</th><th>Input recomputed</th><th>Preemptions</th><th>Time to first token, p50 / p95</th></tr></thead><tbody><tr><td>04:15</td><td>5</td><td>72%</td><td>91%</td><td>2.1M tokens</td><td>0</td><td>0.7 s / 2.7 s</td></tr><tr><td>04:30</td><td>7</td><td>97%</td><td>45%</td><td>9.0M tokens</td><td>4</td><td>1.4 s / 25.5 s</td></tr><tr><td>04:45</td><td>7</td><td>98%</td><td>50%</td><td>6.8M tokens</td><td>2</td><td>3.9 s / 23.2 s</td></tr><tr><td>05:00</td><td>7</td><td>99%</td><td>74%</td><td>5.2M tokens</td><td>24</td><td>0.6 s / 14.5 s</td></tr></tbody></table></div>\n<img />\n<p>At no point did vLLM run more than seven requests, against a limit of 32. The limit that mattered was memory: the sessions evicted each other's cached prompts, and each turn recomputed 100,000 tokens or more. The waiting-requests metric says so directly: up to four requests at a time waited, all with the <code>reason</code> label <code>capacity</code>.</p>\n<h3>One flag, measured</h3>\n<p>The KV cache in FP8 takes half the memory per token. With <code>--kv-cache-dtype fp8</code> and <code>--attention-config.indexer_kv_dtype fp8</code>, the cache grew from 840,277 to 1,506,691 tokens in the same memory, and from 3.2 to 5.75 full-length contexts. The weights don't change, and neither did the checks: 260 tokens a second for one request and 44 of 45 on the evaluation, including both long-context retrievals.</p>\n<p>Then I repeated the load on a fresh VM with eight of the read-only review agents described above, one session each. Their prompts grew to a median of 122,000 tokens and up to 235,000, a little larger than in the BF16 window. Measured the same way for both windows:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><colgroup><col style=\"width: 42.79%;\" /><col style=\"width: 29.34%;\" /><col style=\"width: 27.87%;\" /></colgroup><thead><tr><th>&nbsp;</th><th>BF16 cache, 04:15–05:00</th><th>FP8 cache, 07:23–07:38</th></tr></thead><tbody><tr><td>Requests running, average / peak</td><td>3.3 / 7</td><td>6.4 / 8</td></tr><tr><td>Prompt size, p50 / max</td><td>112K / 229K</td><td>122K / 235K</td></tr><tr><td>KV cache, peak</td><td>99%</td><td>88%</td></tr><tr><td>Prefix-cache hits</td><td>58%</td><td>74%</td></tr><tr><td>Preemptions</td><td>30</td><td>0</td></tr><tr><td>Time to first token, p50 / p95 / max</td><td>0.9 s / 23.8 s / 42.2 s</td><td>1.1 s / 11.0 s / 20.7 s</td></tr><tr><td>Output tokens per second, all requests</td><td>219</td><td>415</td></tr></tbody></table></div>\n<p>Twice as many requests ran at once, the cache never filled, nothing was preempted, and the slowest first tokens arrived in half the time. The hit rate didn't climb back to 90%: review agents read new files on every turn, and no cache can serve tokens it hasn't seen. The two windows come from different agents, so take the comparison as indicative rather than exact; the cache panels tell the same story.</p>\n<img />\n<h3>Past the cache</h3>\n<p>More agents don't help once the cache is full. With 46 agents on the FP8 cache, 21 requests ran and 24 waited for capacity, the cache stayed 97% full, and the prefix-cache hit rate fell to 0%. The GPUs spent their time on about 12,000 tokens a second of recomputed prompts against 400–450 of output, and the median time to first token passed 30 seconds.</p>\n<img />\n<p>Stopping the agents didn't free the server right away either. Their disconnects didn't make it through the gateways to vLLM, which worked through the 35 requests the agents had left queued, a few minutes of work for nobody, before the next test could start.</p>\n<h2>Rules of thumb</h2>\n<ul>\n<li><strong>Size by sessions, not requests.</strong> The number of agent sessions that stay cached is roughly the KV cache size divided by a typical session's context: about 1.5 million / 100,000–150,000, so 10 to 15 here. The startup log gives you the first number, and the spans give you the second.</li>\n<li><strong>Watch why requests wait.</strong> <code>vllm:num_requests_waiting_by_reason{reason=\"capacity\"}</code> rising means memory, which <code>--max-num-seqs</code> won't fix.</li>\n<li><strong>Read prefix-cache hits and recomputed input together.</strong> A falling hit rate with rising computed input is the cache thrashing, and time to first token follows within minutes.</li>\n<li><strong>Mind the thinking.</strong> 87–94% of output tokens were reasoning. For routine tool calls, a lower <code>reasoning_effort</code> is the client-side lever.</li>\n</ul>\n<h2>The one-GPU alternative</h2>\n<p>If one H100 is all you have, <a href=\"https://github.com/Niko1221/Strata\" target=\"_blank\">Strata</a>, an open-source engine built for this model on consumer GPUs, runs <a href=\"https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF\" target=\"_blank\">Unsloth's ~4-bit GGUF</a> on a single H100 NVL with every expert in GPU memory: 151 tokens a second for one request, 44 of 45 on the same evaluation and 9 of 10 agentic tasks. Concurrency is where it differs from vLLM: in version 0.1.42, four batch slots added only about 20% (177 tokens a second in total), and under the evaluation's mixed concurrent load they started failing requests, so I ran it one request at a time. Check newer releases if you need concurrency.</p>\n<h2>Try it</h2>\n<ul>\n<li><strong>Sample code:</strong> <a href=\"https://github.com/1w2w3y/wuyi-labs/tree/main/2610-h100-qwen-38-flash-next\" target=\"_blank\">wuyi-labs/2610-h100-qwen-38-flash-next</a>, with provisioning, the vLLM Compose stack, the dashboard and the read-only opencode load test.</li>\n<li><strong>The model:</strong> <a href=\"https://huggingface.co/Qwen/Qwen3.8-Flash-Next\" target=\"_blank\">Qwen3.8-Flash-Next on Hugging Face</a> and <a href=\"https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next\" target=\"_blank\">vLLM's recipe for it</a>.</li>\n<li><strong>The base setup:</strong> <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/4563387\" target=\"_blank\">Qwen3.8-27B on a $2 H100 Azure Spot VM: does it pay off?</a>, and <a href=\"https://learn.microsoft.com/azure/azure-monitor/containers/opentelemetry-protocol-ingestion\" target=\"_blank\">Ingest OTLP data into Azure Monitor with the OpenTelemetry Collector</a>.</li>\n<li><strong>KV cache quantization:</strong> <a href=\"https://docs.vllm.ai/en/latest/features/quantization/quantized_kvcache.html\" target=\"_blank\">Quantized KV cache in vLLM</a>.</li>\n<li><strong>Load generation:</strong> <a href=\"https://opencode.ai/\" target=\"_blank\">opencode</a> and its <a href=\"https://opencode.ai/docs/permissions/\" target=\"_blank\">permissions</a>.</li>\n<li><strong>Spot:</strong> <a href=\"https://learn.microsoft.com/azure/virtual-machines/spot-vms\" target=\"_blank\">Azure Spot Virtual Machines</a> and <a href=\"https://azure.microsoft.com/pricing/details/virtual-machines/linux/\" target=\"_blank\">Linux VM pricing</a>.</li>\n</ul>"
