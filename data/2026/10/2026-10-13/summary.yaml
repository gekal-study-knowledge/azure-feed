  この日は 1 件で、Apps on Azure Blog による大規模モデルのセルフホスティングと可観測性の実践記事でした。Azure Spot 仮想マシン 1 台の H100 GPU 2 枚で Qwen3.8-Flash-Next を動かし、どの指標を見るべきか、標準的なダッシュボードが読み違える 3 か所、効果が測れた 1 つの起動フラグを扱っています。モデルは 2026 年 8 月に qwen-community-1.0 ライセンスで公開された Mixture-of-Experts で、総パラメーター 125B・トークンあたり活性 6B、48 層のうち 36 層が固定サイズの状態を持つ Gated DeltaNet で残り 12 層が Qwen Sparse Attention、さらに 51B の n-gram 埋め込みテーブル (H100 ではホストメモリに置かれる) と投機的デコード用の MTP 層、262,144 トークンのコンテキストを備えます。FP8 チェックポイントは 185.6 GB で 94 GB の H100 1 枚には載らず、テンソル並列で 2 枚に分割します。H100 のテンソルコアは FP8 までなので、FP4 重みは Marlin カーネルで BF16 に展開されて計算されるため省メモリにはなるが高速化にはならない点も整理されています。VM は Standard_NC80adis_H100_v5 で、2026 年 10 月 12 日時点の英国南部の Spot 価格は 1 時間 3.22 USD、従量課金の 17.45 USD に対して約 80% 安い一方、30 秒の通知で回収され得ます。実際に同サイズの 2 台はそれぞれ 6 時間 17 分と 6 時間 30 分で回収されました。可観測性の指摘が中心で、投機的デコードがあると 1 デコードステップに約 2.4 トークンが含まれ、かつ 99.7% のステップがヒストグラムの 10〜25 ms バケットに入るため、トークン間レイテンシーの中央値から求める一般的な速度計算が実測 150〜260 トークン/秒に対して一定の 57 と読めてしまう、DCGM のヘルスチェックが NVLink ブリッジの未使用 6 リンクを down と報告して正常な VM を Fail と判定する、Azure Monitor ワークスペース上のネイティブヒストグラムでは histogram_sum や histogram_avg が 0 や NaN を返す、という 3 点が挙げられています。負荷はベンチマークではなくオープンソースのコーディングエージェント opencode を読み取り専用の設定で複数走らせて生成しており、エージェント型のトラフィックでは入力トークンの 88〜95% がプレフィックスキャッシュから供給され、10 万トークン超でも最初のトークンが 1 秒未満で返ることが示されました。ただし同時 5 リクエストから 7 に増えると互いのキャッシュを追い出し合い、1 ターンごとに 10 万トークン以上を再計算して p95 の初回トークンが 25.5 秒まで伸びました。そこで KV キャッシュを FP8 にする 2 つのフラグを加えると、同じメモリでキャッシュが 840,277 から 1,506,691 トークンへ増え、同時実行が倍になってプリエンプションが消え、p95 の初回トークンは 23.8 秒から 11.0 秒へ、全体の出力は 219 から 415 トークン/秒へ改善しました。まとめとして、サイジングはリクエスト数ではなくセッション数で考える (KV キャッシュ 150 万トークン ÷ 1 セッション 10〜15 万トークンで 10〜15 セッション)、待ち要因は capacity ラベルで見る、プレフィックスキャッシュのヒット率と再計算入力は併せて読む、出力トークンの 87〜94% が思考なので定型的なツール呼び出しでは reasoning_effort を下げる、といった指針が示されています。
