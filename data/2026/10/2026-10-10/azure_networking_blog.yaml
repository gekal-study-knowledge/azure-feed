    "title": "Multi-NIC Support on AKS powered by DRANET – Now in Public Preview"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/multi-nic-support-on-aks-powered-by-dranet-now-in-public-preview/ba-p/4563257"
    "published": "2026-10-10 03:24:27"
    "fetched": "2026-10-10 10:20:49"
    "summary": "<p>Kubernetes was designed around a simple networking model, every pod gets one network interface, and every pod on a node shares the same flat network. For most stateless microservices, this works well as it keeps the model simple and the platform portable.</p>\n<p>But a large class of workloads don't fit that shape. Some need network separation, with management, control, and data traffic on separate and isolated networks rather than multiplexed over one interface. Other workloads need predictable performance, a dedicated path for high-throughput or latency-sensitive traffic. Until now, meeting these requirements on Kubernetes meant adding and manually integrating multiple components, or keeping the workload on VMs.</p>\n<p><strong>Today we're announcing the public preview of multi-NIC support for pods on AKS, powered by the AKS managed </strong><a href=\"https://github.com/kubernetes-sigs/dranet\" rel=\"noopener\" target=\"_blank\"><strong>DRANET driver.</strong></a><strong> You can now provision worker nodes with multiple network interfaces connected to different subnets, and attach a dedicated interface directly to a pod using standard upstream Kubernetes APIs, with no Multus, no custom CNI extensions, and no manual interface wiring.</strong></p>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<h2>Two ways to use multi-NIC on AKS</h2>\n<p><strong>Use case 1: A dedicated NIC attached directly to a pod</strong></p>\n<p><em>“As a networking engineer, I want to attach a dedicated network interface directly to a Kubernetes pod so the workload can connect to different networks and route traffic natively, without relying on host-level DPDK/VPP forwarding, custom routing rules, or gateway-based NAT.”</em><br /><em>“I also want the secondary interface on my pod to send and receive traffic on a specific, known public IP address, so that downstream partners can allow-list my traffic by IP and no NAT hop adds latency to time-sensitive streams.\"</em></p>\n<p>This is the pattern where the workload itself expects to see multiple interfaces. The pod asks for a network device the same way it would ask for any other resource, and the interface shows up inside the container alongside the standard CNI interface. No host-level forwarding layer, no NAT gateway in the middle.</p>\n<p><strong>What you get</strong></p>\n<ul>\n<li>The DRANET driver is deployed automatically. Once a node pool is configured with secondary interfaces, AKS installs and manages the driver for you; there is no add-on to install and no CRDs to author by hand.</li>\n<li>Declarative, scheduler-aware requests. Interfaces are advertised to Kubernetes as allocatable devices, so a pod that asks for one is placed on a node that can actually provide it, using standard Dynamic Resource Allocation (DRA) objects rather than vendor-specific annotations.</li>\n<li>A predictable interface lifecycle. The driver handles attach, release, and recovery as pods are rescheduled or restarted.</li>\n<li>A public IP address can be assigned directly to a secondary interface, configured at node pool creation time using IP tags. The pod's secondary interface talks to the outside world without going through the load balancer or any address translation layer.</li>\n<li>Both IPv4 and IPv6 addresses are supported on the secondary interface.</li>\n</ul>\n<p><strong>What to plan around</strong></p>\n<ul>\n<li>Interfaces are dedicated, not shared. When a NIC is attached to a pod, it moves into that pod's network namespace and is no longer available to the node or to any other pod. Sharing a secondary NIC across pods isn't supported in this release.</li>\n<li>Because of that, pod density on a multi-NIC node pool is bounded by the number of interfaces on the node.</li>\n<li>All interfaces must be attached to the same virtual network as the primary NIC. On a bring-your-own VNet cluster, different subnets within that VNet are supported, but different VNets are not, in this preview. On an AKS-managed VNet, secondary interfaces are currently limited to the same subnet as the primary NIC , since creating a new subnet on a managed VNet isn't supported yet.</li>\n<li>Each pod's secondary interface gets its own dedicated public IP, so plan node pool sizing around how many pods need a tagged public IP of their own. Public IP assignment is configured at node pool creation time through IP tags, so decide your IP range and tagging strategy before you provision the node pool.</li>\n<li>Kubernetes network policy is enforced on the primary interface only. Plan isolation for secondary interfaces at the subnet and NSG layer.</li>\n</ul>\n<p><strong><span>Use Case 2: Multi-NIC nodes with your own NIC management</span></strong></p>\n<p><em>“As a platform/networking engineer, I want to provision Kubernetes worker nodes with multiple network interfaces connected to different networks and use my own&nbsp; VPP, DPDK, or any custom routing logic to steer traffic at the node level, without attaching additional interfaces to pods.” </em>&nbsp;</p>\n<p>This is the pattern for teams who already own their dataplane. The node is multi-homed, each interface lands on its own subnet, and your own software decides which traffic goes where. Pods keep a single CNI-assigned interface and stay unaware of the underlying topology.</p>\n<p><strong>What you get</strong></p>\n<ul>\n<li>Depending on the selected SKU size, you can configure nodes with multiple network interfaces.</li>\n<li>Full control, and full ownership of the additional nics. AKS provisions the interfaces and keeps them attached to the node. How traffic is steered across them is entirely yours to design, configure, operate, and support. That includes your routing rules, your userspace dataplane, and any troubleshooting of the forwarding path itself.</li>\n<li>The same-VNet constraint applies here too, secondary interfaces can span subnets, but not virtual networks. This applies to bring-your-own VNet clusters. On an AKS-managed VNet, secondary interfaces are restricted to the primary NIC's subnet for now.</li>\n</ul>\n<p>Both patterns start from the same node pool configuration. The difference is whether you stop there and manage the interfaces yourself, or let the DRANET hand them to your pods.</p>\n<h2>How it works</h2>\n<p>Multi-NIC on AKS starts with a single configuration step: you add secondary network interfaces to a node pool. AKS provisions the NICs on every VM in the pool and installs the DRANET driver alongside them. From there, what happens to those NICs depends on your workload. Reference a resource claim in your pod spec, and DRANET moves an interface into the pod Or Leave them on the node and steer traffic yourself with VPP, DPDK, or custom routing.</p>\n<img />\n<h3>Step 1: Provision the node pools with secondary NICs</h3>\n<p>Secondary interfaces are declared when you create the node pool. The agent pool's network profile carries a secondaryNetworkInterfaces array, and each entry points at a subnet in the same virtual network as the primary NIC:</p>\n\"networkProfile\": {\n  \"secondaryNetworkInterfaces\": [\n    { \"type\": \"Standard\", \"vnetSubnetId\": \"&lt;VNET_SUBNET_ID&gt;\" } \n    { \"type\": \"Standard\", \"vnetSubnetId\": \"&lt;VNET_SUBNET_ID&gt;\" }\n  ] \n}\n<p>AKS extends VMSS provisioning to attach those NICs to every VM in the pool. Add more entries for more interfaces, up to what the VM SKU allows. The array length is validated against the SKU at creation time, so a pool with mixed sizes has to be planned around the smallest one.</p>\n<p>The node is now multi-homed and the interfaces are visible on the host. If you are building for use case 2, this is where you stop. AKS provisions and keeps the interfaces attached to the node, and how traffic is steered across them, the routing rules, the userspace dataplane, the troubleshooting of the forwarding path, is yours to design, operate, and support.</p>\n<h3>Step 2: Using AKS managed DRANET driver to hand an interface to the pod</h3>\n<p>Once a node pool has secondary interfaces configured, and the cluster is using AKS-managed CNI (Azure CNI or Azure CNI Powered by Cilium), AKS automatically installs the DRANET driver as a DaemonSet, packaged and delivered through an AKS-managed Helm chart. There is nothing to deploy yourself and no CRDs to author by hand. <br />If you're running a BYO CNI cluster, AKS still provisions the secondary NICs, but you're responsible for deploying DRANET (or your own driver of choice) yourself.</p>\n<p>The driver does three things:</p>\n<ul>\n<li>Discovers the additional interfaces present on each node.</li>\n<li>Advertises them to Kubernetes as allocatable DRA devices, published in a ResourceSlice.</li>\n<li>Manages the lifecycle: exclusive per-pod allocation, attachment, release, and recovery as pods move or restart.</li>\n</ul>\n<p>Inspect the DRANET deamonset, pods, and deviceclass using the following commands:</p>\nkubectl get deviceclasses\nkubectl get daemonset -A\nkubectl get pods -A -o wide\n<p>Now you can create a “ResourceClaimTemplate” that defines how each pod requests a device.</p>\napiVersion: resource.k8s.io/v1\nkind: ResourceClaimTemplate\nmetadata:\n   name: nic-dev-template\nspec:\n  spec:\n    devices:\n      requests:\n      - name: nic\n        exactly:\n        deviceClassName: standard-secondary-nic\n        allocationMode: ExactCount\n        count: 1\n<p>Configure the pod references the template, and the scheduler places it on a node that has a matching NIC available:</p>\napiVersion: v1\nkind: Pod\nmetadata:\n  name: multi-nic-test\nspec:\n  containers:\n  - name: multi-nic\n    image: nicolaka/netshoot\n    resources:\n      claims:\n      - name: nic\n  resourceClaims:\n  - name: nic\n    resourceClaimTemplateName: nic-dev-template\n<p>A pod referencing a claim comes up with its usual CNI-assigned eth0 plus the allocated secondary interface, and you can confirm both from inside the container.</p>\n<p>When DRANET attaches a secondary NIC to a pod, that interface moves into the pod's network namespace and is no longer available on the node or to any other pod. It returns to the node's pool of available devices when the pod terminates. That gives you a clean isolation boundary and deterministic performance, with the trade-off that pod density on a multi-NIC pool is bounded by interface count, not just CPU and memory.</p>\n<p><br /><strong>For the full walkthrough including feature flag registration, more examples visit </strong><a href=\"https://aka.ms/aks/multi-nic\" rel=\"noopener\" target=\"_blank\">https://aka.ms/aks/multi-nic.</a></p>\n<h2>Try it now</h2>\n<p>Multi-NIC support for pods on AKS is available now in public preview. Start with the documentation for the full walkthrough: provisioning a node pool with secondary interfaces, defining a resource claim, and validating that both interfaces appear inside the pod.&nbsp;</p>\n<ul>\n<li>Documentation: <a href=\"https://aka.ms/aks/multi-nic\" rel=\"noopener\" target=\"_blank\">https://aka.ms/aks/multi-nic</a></li>\n<li>Upstream project: <a href=\"https://github.com/kubernetes-sigs/dranet\" rel=\"noopener\" target=\"_blank\">DRANET on GitHub</a></li>\n</ul>\n<p>Preview is when your input can actually shape the feature. If you hit a limitation or have a use case we haven’t covered, comment below and share your feedback.</p>"
