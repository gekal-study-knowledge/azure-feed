"overview": |
  この日は 2 件で、AKS のマルチ NIC 対応と、Azure Arc 向け拡張機能の廃止予定でした。ネットワークブログでは、DRANET による AKS のマルチ NIC サポートがパブリックプレビューとなりました。Kubernetes は「すべての Pod がネットワークインターフェースを 1 つ持ち、同じノード上の Pod は同一のフラットなネットワークを共有する」という単純なネットワークモデルを前提に設計されており、ステートレスなマイクロサービスの多くではモデルが単純に保たれプラットフォームの可搬性も高まるため、これでうまく機能します。しかし、管理・制御・データの各トラフィックを別々のインターフェースに分けるようなネットワーク分離を必要とする一群のワークロードはこの形に収まりません。今回の対応はそうしたワークロードに向けたものです。廃止予定では、Azure Arc 対応 Kubernetes クラスター向けの Azure Key Vault Secrets Provider 拡張機能が 2027 年 10 月 9 日に廃止されると告知されました。現在この拡張機能を使っている場合は、廃止日までに Azure Key Vault Secret Store 拡張機能へ移行する必要があります。
