"overview": |
  この日は 4 件で、AKS のマルチ NIC 対応と Azure Arc 向け拡張機能の廃止予定、そしてインフラのイベント案内と GPU の実測記事でした。ネットワークブログでは、DRANET による AKS のマルチ NIC サポートがパブリックプレビューとなりました。Kubernetes は「すべての Pod がネットワークインターフェースを 1 つ持ち、同じノード上の Pod は同一のフラットなネットワークを共有する」という単純なネットワークモデルを前提に設計されており、ステートレスなマイクロサービスの多くではモデルが単純に保たれプラットフォームの可搬性も高まるため、これでうまく機能します。しかし、管理・制御・データの各トラフィックを別々のインターフェースに分けるようなネットワーク分離を必要とする一群のワークロードはこの形に収まりません。今回の対応はそうしたワークロードに向けたものです。廃止予定では、Azure Arc 対応 Kubernetes クラスター向けの Azure Key Vault Secrets Provider 拡張機能が 2027 年 10 月 9 日に廃止されると告知されました。現在この拡張機能を使っている場合は、廃止日までに Azure Key Vault Secret Store 拡張機能へ移行する必要があります。インフラでは、2026 年 10 月の OCP Global Summit 2026 における Microsoft の出展内容が案内されました。シリコンとシステムからデータセンターまで、AI をスケールさせるために必要なインフラをどう進めているかを、ブース C73 と基調講演、セッション、パネル、ワークショップで紹介するという内容です。10 月 13 日の基調講演 「Intelligence Infrastructure: Scaling AI for the Frontier Era」では、AI インフラがシリコン・システム・ソフトウェア・サイトをまたいだコデザインに依存することを前提に、技術の開発からグローバルなフリートに至る道筋、規模が変わると要件がどう変わるか、そしてクローズドループ冷却と低炭素な建設による持続可能なスケーリング、立地するコミュニティでの系統の信頼性と人材育成の役割などが扱われます。10 月 12 日のエグゼクティブセッションでは、生成 AI の急成長がコンピューティング基盤の需要を前例のない水準へ押し上げ、学習から広範な推論へワークロードが広がるなかで、電力系統やデータセンターからサーバー・シリコン・ソフトウェアまでクラウドのあらゆる層が試されていることが取り上げられます。GPU の運用では、Azure の H100 のスポット VM で Qwen3.8-27B を動かした実測の記事が公開されました。10 月 9 日の朝の 3 時間で 1 台の H100 が 1,434 リクエストを処理し、入力 1 億 6,870 万トークン、出力 127 万トークンをさばいています。その日のこのモデルの公開価格 (入力 100 万トークンあたり 0.425 ドル、キャッシュ済み入力 0.085 ドル、出力 2.55 ドル) で換算すると 24.35 ドル相当で、3 時間の VM の費用はそのリージョンのスポット価格で 4.65 ドルでした。Qwen3.8-27B は Apache 2.0 ライセンスの 270 億パラメータの密なモデルで、64 層のうち 48 層が Gated DeltaNet の線形アテンションを使ってトークンごとの KV キャッシュの代わりに固定サイズの状態を保つため、コンテキストに応じて伸びるのは残りの 16 層のフルアテンションだけで、長いコンテキストが GPU 1 枚に収まります。コンテキストウィンドウは 262,144 トークンで、YaRN でおよそ 100 万トークンまで広げる方法も文書化されています。記事では Azure の GPU VM 上での動かし方、チューニング、そして Application Insights と Grafana を使ったメトリクス・ログ・トレースによる端から端までの監視の組み方が解説されています。
