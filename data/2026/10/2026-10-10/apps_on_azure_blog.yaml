  "6449fb15e032805fe089755a182aca35":
    "id": "6449fb15e032805fe089755a182aca35"
    "title": "Qwen3.8-27B on a $2 H100 Azure Spot VM: does it pay off?"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/ba-p/4563387"
    "published": "2026-10-10 16:27:28"
    "fetched": "2026-10-11 03:59:41"
    "summary": "<p>For three hours on the morning of October 9, a single H100 in Azure served 1,434 requests to Qwen3.8-27B: 168.7 million input tokens in, 1.27 million output tokens out. At a public list price for this model that day ($0.425 per million input tokens, $0.085 per million cached input tokens and $2.55 per million output tokens), those tokens are worth $24.35. The three hours of VM time cost $4.65 at that region's Spot price; the dashboard below counts them at a round $2 an hour.</p>\n<p>This post is the guide I'd have wanted before I started: how to run Qwen3.8-27B on an Azure GPU VM, how to tune it, and how to monitor it end to end, with metrics, logs and traces, using Application Insights and Grafana. The answer to the title comes at the end. The dashboard that measured it comes from the monitoring setup in the middle.</p>\n<img />\n<h2>What you're running</h2>\n<p>Qwen3.8-27B is a 27-billion-parameter dense model from Qwen, released under the Apache 2.0 license. A few of its properties shape how you serve it:</p>\n<ul>\n<li><strong>Hybrid attention.</strong> 48 of its 64 layers use Gated DeltaNet linear attention, which keeps a fixed-size state instead of a per-token KV cache. Only the 16 full-attention layers grow with the context, which is why long contexts fit on one GPU.</li>\n<li><strong>A 262,144-token context window,</strong> which Qwen documents how to extend to about one million tokens with YaRN.</li>\n<li><strong>Thinking on by default,</strong> with a per-request switch to turn it off.</li>\n<li><strong>Multi-token prediction (MTP) layers,</strong> which vLLM can use for speculative decoding.</li>\n<li><strong>Vision:</strong> it reads images and video as well as text.</li>\n</ul>\n<p>The GPU is a <code>Standard_NC40ads_H100_v5</code>: one H100 NVL with 94 GB of memory and 40 vCPUs. Both official checkpoints fit on it:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>&nbsp;</th><th>BF16 (<code>Qwen/Qwen3.8-27B</code>)</th><th>FP8 (<code>Qwen/Qwen3.8-27B-FP8</code>)</th></tr></thead><tbody><tr><td>Download</td><td>55.6 GB</td><td>30.9 GB</td></tr><tr><td>Weights in GPU memory</td><td>51.9 GiB</td><td>29.0 GiB</td></tr><tr><td>KV cache left over</td><td>805K tokens</td><td>1.45M tokens</td></tr><tr><td>One request, 512 tokens, thinking off</td><td>124 tok/s</td><td>172 tok/s</td></tr></tbody><colgroup><col style=\"width: 40.60%;\" /><col style=\"width: 28.13%;\" /><col style=\"width: 31.27%;\" /></colgroup></table></div>\n<p>Use FP8. The H100 runs FP8 natively, each decode step reads fewer bytes, and the memory the smaller weights free up nearly doubles the KV cache. The NVFP4 builds you'll see in vLLM's recipes target Blackwell GPUs, since the H100 has no FP4 tensor cores.</p>\n<h2>Step 1: Get a Spot H100 VM</h2>\n<p><a href=\"https://learn.microsoft.com/azure/virtual-machines/spot-vms\" rel=\"noopener\" target=\"_blank\">Azure Spot Virtual Machines</a> sell spare capacity at a discount, with no SLA, and Azure can evict them with 30 seconds' notice. In October 2026 this size cost $1.55 to $1.84 an hour on Spot in the regions I settled on, which this post rounds to $2 (prices change; check <a href=\"https://azure.microsoft.com/pricing/details/virtual-machines/linux/\" rel=\"noopener\" target=\"_blank\">the pricing page</a>). Spot draws on your regional low-priority vCPU quota, 40 vCPUs for this size, not on the H100 family quota, which was zero in my subscription.</p>\n<p>Pick the region with data rather than habit. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/infra/spot-regions.sh\" rel=\"noopener\" target=\"_blank\">infra/spot-regions.sh</a> lists each region's eviction-rate bucket and Spot price history, and the current placement score per zone; there's more on that in the Spot section below. Then create the VM with <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/infra/provision-spot-vm.sh\" rel=\"noopener\" target=\"_blank\">infra/provision-spot-vm.sh</a>:</p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>LOCATION=southeastasia ZONE=2 IDENTITY_RG=rg-llm-telemetry infra/provision-spot-vm.sh\n</code></pre>\n<p>In about five minutes that gives you:</p>\n<ul>\n<li>a resource group, a VNet and a network security group with only the default rules, which deny inbound traffic from the internet</li>\n<li>a NAT gateway for outbound traffic: Docker images, Hugging Face downloads and telemetry</li>\n<li>the VM: Ubuntu 24.04 and no public IP. It uses Trusted Launch with Secure Boot off, because Secure Boot rejects the unsigned NVIDIA kernel modules. It has a 512 GB data disk for weights and images, the Spot <em>Deallocate</em> eviction policy so an eviction keeps the disks, and a managed identity for telemetry</li>\n</ul>\n<p>With no public IP and no SSH, you administer the VM through <code>az vm run-command</code>, which the sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/scripts/vm-run.sh\" rel=\"noopener\" target=\"_blank\">scripts/vm-run.sh</a> wraps: <code>scripts/vm-run.sh &lt;script&gt;</code> runs a local script on the VM as root and prints the output.</p>\n<h2>Step 2: Prepare the host</h2>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>scripts/vm-run.sh scripts/bootstrap-host.sh\n</code></pre>\n<p><a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/scripts/bootstrap-host.sh\" rel=\"noopener\" target=\"_blank\">The bootstrap</a> takes about four minutes. It mounts the data disk at <code>/data</code>, installs the NVIDIA datacenter driver (the 595 branch with open kernel modules, which loads without a reboot), installs Docker Engine with its data root on <code>/data</code>, and registers the NVIDIA Container Toolkit with Docker. At the end, <code>nvidia-smi</code> should report one H100 NVL with 95,830 MiB.</p>\n<h2>Step 3: Serve the model with vLLM</h2>\n<p>The stack is a Docker Compose project: a one-shot job that downloads the pinned checkpoint, vLLM, a LiteLLM gateway, and optional overlays for telemetry and a public URL. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/scripts/deploy.sh\" rel=\"noopener\" target=\"_blank\">scripts/deploy.sh</a>, run with <code>up</code>, copies the folder to the VM through run-command and starts it in the background. On a new VM everything is healthy about 20 minutes later. Most of that is image pulls and the 31 GB download, and later restarts of the model take a few minutes.</p>\n<p>The model runs in NVIDIA's NGC vLLM container, release 26.07 (vLLM 0.24). One fix was needed there: tool calls failed with HTTP 500 because the bundled xgrammar 0.2.0 lacks a function vLLM's frontend imports, so <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/images/vllm/Dockerfile\" rel=\"noopener\" target=\"_blank\">the sample's image</a> adds xgrammar 0.2.3. The checkpoint is pinned to a revision and downloaded once to the data disk, so restarts don't depend on Hugging Face.</p>\n<p>This is the serve command:</p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>vllm serve /models/Qwen3.8-27B-FP8 \\\n  --served-model-name qwen3.8-27b \\\n  --trust-remote-code \\\n  --max-model-len 262144 \\\n  --gpu-memory-utilization 0.93 \\\n  --max-num-seqs 32 \\\n  --max-num-batched-tokens 16384 \\\n  --kv-cache-dtype fp8 \\\n  --enable-prefix-caching \\\n  --spec-method mtp --spec-tokens 3 \\\n  --reasoning-parser qwen3 \\\n  --enable-auto-tool-choice --tool-call-parser qwen3_coder \\\n  --limit-mm-per-prompt '{\"image\":{\"count\":4,\"width\":1024,\"height\":1024},\"video\":0}'\n</code></pre>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Flag</th><th>Why</th></tr></thead><tbody><tr><td><code>--max-model-len 262144</code></td><td>The native context window.</td></tr><tr><td><code>--gpu-memory-utilization 0.93</code></td><td>Lets vLLM use 93% of the GPU's memory. After the weights, that leaves 1.5 million tokens of KV cache, about 5.7 full-length requests at once.</td></tr><tr><td><code>--max-num-seqs 32</code></td><td>Throughput barely grows beyond 32 concurrent requests on this GPU (measured below).</td></tr><tr><td><code>--max-num-batched-tokens 16384</code></td><td>The prefill chunk per step. 32K gained nothing and cost 5% of the KV cache.</td></tr><tr><td><code>--kv-cache-dtype fp8</code></td><td>Halves the KV cache's memory compared with BF16.</td></tr><tr><td><code>--enable-prefix-caching</code></td><td>Reuses the KV blocks of a repeated prefix instead of recomputing them. Agentic traffic resends long prefixes, so this matters: 88% of the input tokens in the busy window below came from the cache.</td></tr><tr><td><code>--spec-method mtp --spec-tokens 3</code></td><td>Speculative decoding with the model's own MTP layers. vLLM's Qwen3.8 recipe writes the same setting as <code>--speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3}'</code>.</td></tr><tr><td><code>--reasoning-parser qwen3</code></td><td>Returns the thinking separately from the answer, so clients get a clean reply.</td></tr><tr><td><code>--enable-auto-tool-choice --tool-call-parser qwen3_coder</code></td><td>OpenAI-style tool calls.</td></tr><tr><td><code>--limit-mm-per-prompt</code></td><td>Up to four images per prompt, and no video.</td></tr></tbody><colgroup><col style=\"width: 23.35%;\" /><col style=\"width: 76.65%;\" /></colgroup></table></div>\n<h2>Step 4: Call it</h2>\n<p>vLLM serves an OpenAI-compatible API, and so does the LiteLLM gateway in front of it, under one stable alias, <code>local-llm</code>, so clients don't change when the model does:</p>\n<pre class=\"lia-code-sample language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>curl http://127.0.0.1:4000/v1/chat/completions -H 'Content-Type: application/json' -d '{\n  \"model\": \"local-llm\",\n  \"messages\": [{\"role\": \"user\", \"content\": \"Explain prefix caching in two sentences.\"}],\n  \"temperature\": 0.7, \"top_p\": 0.8, \"presence_penalty\": 1.5,\n  \"chat_template_kwargs\": {\"enable_thinking\": false}\n}'\n</code></pre>\n<p>Thinking is on unless a request turns it off with <code>chat_template_kwargs</code>. Qwen's <a href=\"https://huggingface.co/Qwen/Qwen3.8-27B\" rel=\"noopener\" target=\"_blank\">model card</a> recommends temperature 1.0, top_p 0.95 and top_k 20 with thinking on, and temperature 0.7, top_p 0.8, top_k 20 and presence_penalty 1.5 with it off. Tool calls work as they do with OpenAI: send <code>tools</code>, and the parser turns the model's tool-call markup into <code>tool_calls</code>.</p>\n<p>The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/scripts/smoke-test.sh\" rel=\"noopener\" target=\"_blank\">smoke test</a> (<code>scripts/vm-run.sh scripts/smoke-test.sh</code>) checks an exact answer, a required tool call and the decode speed. On this VM, one request generates about 166 tokens a second with thinking off.</p>\n<p>The VM has no public IP, so the gateway is published through an ngrok tunnel with an IP allow-list. The gateway has no authentication of its own, so that allow-list is the only access control on the public URL. That suited my own tests. For anything more, add a LiteLLM key or an authentication policy at the tunnel.</p>\n<h2>Step 5: Tune it</h2>\n<p>Two settings were worth measuring.</p>\n<p><strong>How many tokens to draft.</strong> Speculative decoding drafts tokens with the MTP layers and verifies them in one pass. On natural-language prompts with 512-token replies:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Draft tokens</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>One request (tok/s)</td><td>105</td><td>131</td><td>151</td><td>146</td></tr><tr><td>32 requests (tok/s)</td><td>1,497</td><td>1,546</td><td>1,548</td><td>1,342</td></tr></tbody><colgroup><col style=\"width: 42.32%;\" /><col style=\"width: 14.42%;\" /><col style=\"width: 14.42%;\" /><col style=\"width: 14.42%;\" /><col style=\"width: 14.42%;\" /></colgroup></table></div>\n<p>Three came out on top at both ends. vLLM warns that drafting more than one token reuses the same MTP layer and can lower acceptance, so watch the acceptance rate on the dashboard rather than trusting the setting.</p>\n<p><strong>How many requests at once.</strong> On synthetic 2,000-token prompts, output grows to 32 concurrent requests and then flattens: 150 tokens a second at 1, 821 at 16, 1,187 at 32 and 1,212 at 48, while each stream slows from 150 to 25 tokens a second. On natural text, where more drafts are accepted, 32 requests reach about 1,550 output tokens a second. That's the measured ceiling: 5.6 million output tokens an hour, worth $14.23 an hour at $2.55 per million.</p>\n<h2>Step 6: Monitor it: metrics, logs and traces</h2>\n<p>A self-hosted model has no provider status page. When it's slow, you need to know whether the cause is the queue, the cache, the GPU or the client, and when it's idle, you're still paying for it. Azure Monitor ingests OpenTelemetry natively (<a href=\"https://techcommunity.microsoft.com/blog/azureobservabilityblog/direct-opentelemetry-ingestion-into-azure-monitor-is-now-generally-available/4524044\" rel=\"noopener\" target=\"_blank\">generally available since June 2026</a>), so one Application Insights resource can receive all three signals.</p>\n<h3>Create the destination</h3>\n<ol>\n<li>Create an Application Insights resource with <strong>OTLP support</strong> set to <strong>On</strong>. That provisions a Log Analytics workspace for logs and traces, an Azure Monitor workspace that stores metrics as Prometheus data, and the data collection endpoint and rule that route OTLP into them. <a href=\"https://learn.microsoft.com/azure/azure-monitor/containers/opentelemetry-protocol-ingestion\" rel=\"noopener\" target=\"_blank\">Ingest OTLP data into Azure Monitor with the OpenTelemetry Collector</a> walks through it.</li>\n<li>On the resource's <strong>Overview</strong> page, copy the OTLP connection info: the endpoint URLs for traces, logs and metrics, and the data collection rule ID.</li>\n<li>Give the VM's managed identity the <strong>Monitoring Metrics Publisher</strong> role on that data collection rule. The collector signs in with Microsoft Entra ID, so you don't have to store a key on the VM. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/infra/telemetry-identities.sh\" rel=\"noopener\" target=\"_blank\">infra/telemetry-identities.sh</a> creates one identity per region you run in and assigns the role.</li>\n</ol>\n<h3>Point a collector at it</h3>\n<p>One OpenTelemetry Collector (the contrib distribution) runs next to the model and gathers everything:</p>\n<ul>\n<li><strong>Metrics:</strong> it scrapes vLLM's and LiteLLM's Prometheus endpoints and NVIDIA's DCGM exporter for the GPU, and reads host and container statistics.</li>\n<li><strong>Traces:</strong> LiteLLM sends its spans to the collector over OTLP. Each model call is a span with the token counts, time to first token and finish reason as <code>gen_ai.*</code> attributes.</li>\n<li><strong>Logs:</strong> it tails every container's log, plus the host's syslog, where GPU Xid errors and out-of-memory kills appear.</li>\n</ul>\n<p>The part that talks to Azure Monitor is short (abridged from the sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/observability/otelcol/config.yaml\" rel=\"noopener\" target=\"_blank\">observability/otelcol/config.yaml</a>, collector 0.161):</p>\n<pre class=\"lia-code-sample language-yaml\" contenteditable=\"false\" tabindex=\"0\"><code>extensions:\n  azure_auth:\n    managed_identity:\n      client_id: ${env:TELEMETRY_UAMI_CLIENT_ID}\n    scopes: [https://monitor.azure.com/.default]\n\nprocessors:\n  resource:\n    attributes:\n      - {key: microsoft.applicationId, value: \"${env:AZMON_APPLICATION_ID}\", action: upsert}\n\nexporters:\n  otlp_http/azuremonitor:\n    traces_endpoint: ${env:AZMON_TRACES_ENDPOINT}\n    logs_endpoint: ${env:AZMON_LOGS_ENDPOINT}\n    metrics_endpoint: ${env:AZMON_METRICS_ENDPOINT}\n    auth:\n      authenticator: azure_auth\n</code></pre>\n<p>Here's where each signal lands and how you query it:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Signal</th><th>Sources</th><th>Stored in</th><th>Query with</th></tr></thead><tbody><tr><td>Metrics</td><td>vLLM, LiteLLM, GPU (DCGM), host, containers</td><td>Azure Monitor workspace</td><td>PromQL</td></tr><tr><td>Traces</td><td>LiteLLM request and model-call spans</td><td>Application Insights (Log Analytics)</td><td>KQL, or the Application Insights transaction view</td></tr><tr><td>Logs</td><td>every container, host syslog</td><td>Application Insights (Log Analytics)</td><td>KQL</td></tr></tbody><colgroup><col style=\"width: 6.41%;\" /><col style=\"width: 32.81%;\" /><col style=\"width: 25.74%;\" /><col style=\"width: 35.04%;\" /></colgroup></table></div>\n<h3>Four things that tripped me up</h3>\n<ul>\n<li><strong>Set <code>microsoft.applicationId</code> on everything you send.</strong> The data collection rule that Application Insights creates routes data on that resource attribute, which is why the processor above sets it on every resource.</li>\n<li><strong>Metrics keep only a few resource attributes.</strong> The metrics rule keeps <code>service.*</code>, <code>host.name</code> and <code>cloud.region</code>, and drops the rest, so per-container series merged into one until a <code>transform</code> processor copied the container name onto each data point. The sample does the same for an <code>upstream_model</code> label, so a second model on the same VM shows up as its own series. In logs, fields you want to filter on also belong on the record, not the resource.</li>\n<li><strong>OTLP histograms arrive as native histograms.</strong> <code>histogram_quantile</code> takes the bare metric name, with no <code>_bucket</code> suffix and no <code>le</code> label, and OpenTelemetry-native names keep their dots, so you write <code>{__name__=\"system.cpu.utilization\"}</code>.</li>\n<li><strong>Check what your spans carry.</strong> LiteLLM records the useful parts of each call (token counts, time to first token, finish reason) without prompts or responses when message capture is off. It still records every tool definition the client declares, though. Decide whether that's acceptable in your Application Insights resource, and choose the fields carefully before you share a dashboard.</li>\n</ul>\n<h3>Build the dashboard in Grafana</h3>\n<p>In Azure Managed Grafana, connect the Azure Monitor workspace as a Prometheus data source for the metrics (<a href=\"https://learn.microsoft.com/azure/azure-monitor/metrics/prometheus-grafana\" rel=\"noopener\" target=\"_blank\">Connect Grafana to Azure Monitor managed service for Prometheus</a>), and use the built-in Azure Monitor data source for KQL over the logs and traces. If you'd rather not run a Grafana instance, <a href=\"https://learn.microsoft.com/azure/azure-monitor/visualize/visualize-use-grafana-dashboards\" rel=\"noopener\" target=\"_blank\">Azure Monitor dashboards with Grafana</a> work in the Azure portal.</p>\n<p>You don't have to build the dashboard yourself. The one in these screenshots is in the sample repository as <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/observability/grafana/h100-llm.json\" rel=\"noopener\" target=\"_blank\">h100-llm.json</a>. To use it:</p>\n<ol>\n<li>In Grafana, go to <strong>Dashboards</strong> &gt; <strong>New</strong> &gt; <strong>Import</strong> and upload the file.</li>\n<li>When it asks, enter your Application Insights resource ID.</li>\n<li>At the top of the dashboard, pick your Azure Monitor workspace's Prometheus data source and your Azure Monitor data source.</li>\n</ol>\n<p>It has ten rows: overview, token economics, throughput, the gateway, traffic and latency, cache and scheduling, the GPU, host and containers, the telemetry pipeline itself, and traces and logs. These are the questions I look at first:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Question</th><th>PromQL</th></tr></thead><tbody><tr><td>How long until the first token?</td><td><code>histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds[5m])))</code></td></tr><tr><td>How fast does one request generate?</td><td><code>1 / histogram_quantile(0.5, sum(rate(vllm:inter_token_latency_seconds[5m])))</code></td></tr><tr><td>Is the KV cache full?</td><td><code>max(vllm:kv_cache_usage_perc)</code>: near 1, vLLM starts preempting requests</td></tr><tr><td>Are requests queuing?</td><td><code>sum(vllm:num_requests_waiting)</code> next to <code>sum(vllm:num_requests_running)</code></td></tr><tr><td>Is prefix caching working?</td><td><code>sum(rate(vllm:prefix_cache_hits_total[5m])) / sum(rate(vllm:prefix_cache_queries_total[5m]))</code></td></tr><tr><td>Is speculative decoding paying off?</td><td><code>sum(rate(vllm:spec_decode_num_accepted_tokens_total[5m])) / sum(rate(vllm:spec_decode_num_draft_tokens_total[5m]))</code></td></tr><tr><td>Is the GPU doing work?</td><td><code>max(dcgm_fi_prof_sm_active)</code></td></tr></tbody><colgroup><col style=\"width: 23.15%;\" /><col style=\"width: 76.85%;\" /></colgroup></table></div>\n<img />\n<p>Metrics tell you that something is slow. Traces and logs tell you which request and why. The dashboard's last row has both. <strong>LLM calls</strong> lists one row per model call from the LiteLLM spans, with its time to first token, input tokens, finish reason and trace ID. <strong>Model server log</strong> shows vLLM's own log lines: the engine stats it prints every ten seconds (throughput, running and waiting requests, KV cache usage, prefix cache hit rate) and any warning.</p>\n<img />\n<p>There's one more step I haven't taken yet: vLLM can export its own spans over OTLP with <code>--otlp-traces-endpoint</code>, and NVIDIA's container already includes the OpenTelemetry SDK. Pointed at the same collector, that would add vLLM's own timing for each request, such as time in the queue, next to the gateway's spans.</p>\n<h3>Change the dashboard and ask the data with an agent</h3>\n<p>You don't have to edit dashboard JSON or write every query by hand. Azure Managed Grafana instances in the Azure public cloud include a remote MCP server at <code>https://&lt;grafana-endpoint&gt;/api/azure-mcp</code> (<a href=\"https://aka.ms/amg-mcp\" rel=\"noopener\" target=\"_blank\">Configure an Azure Managed Grafana Remote MCP server</a>). Connect an MCP client to it, and an AI agent can work with this dashboard and the telemetry behind it. GitHub Copilot in Visual Studio Code signs in with Microsoft Entra ID; Claude Code and other clients can use a Grafana service account token.</p>\n<ul>\n<li><strong>Author and change dashboards.</strong> <code>amgmcp_dashboard_inspect</code> reads a dashboard's panels, variables and queries, and <code>amgmcp_dashboard_update</code> creates a dashboard or patches one panel, query or title at a time. A request such as \"add a panel for preemptions per minute next to KV cache usage\" becomes a targeted patch instead of a JSON edit.</li>\n<li><strong>Query the telemetry.</strong> <code>amgmcp_prometheus_query</code> runs PromQL against the Azure Monitor workspace, <code>amgmcp_query_resource_log</code> runs KQL against Application Insights, and <code>amgmcp_query_application_insights_trace</code> fetches a trace. Questions like \"which requests waited longest for their first token this morning?\" or \"how many output tokens did the model generate per VM hour this week?\" come back with numbers from the same data the dashboard shows.</li>\n</ul>\n<p>The agent acts with the Grafana permissions of the identity it signs in with, so give that identity the role the job needs: Grafana Viewer to ask questions, Grafana Editor to change dashboards. My previous post, <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/dashboards-are-for-ai-agents-too-not-just-humans/4556383\" rel=\"noopener\" target=\"_blank\">Dashboards are for AI agents too, not just humans</a>, shows the other half: how an agent uses a dashboard's queries and descriptions as context.</p>\n<h2>What the dashboard showed</h2>\n<p>The traffic in these screenshots is a real agentic workload: long-running sessions that call tools and send the whole conversation back with each request. In the busy window it looked nothing like the benchmark:</p>\n<ul>\n<li><strong>Prompts were long.</strong> The median request carried about 120,000 input tokens, and the 95th percentile 186,000.</li>\n<li><strong>Most of it was cached.</strong> 88% of input tokens were prefix-cache hits.</li>\n<li><strong>Output was small.</strong> There were 133 input tokens for every output token, and 62% of the output tokens were reasoning.</li>\n<li><strong>Concurrency was low.</strong> At most 10 requests ran at once, with room for 32.</li>\n</ul>\n<img />\n<p>Output averaged 117 tokens a second, under 8% of the 1,550 ceiling, yet the GPU was busy 77% of the time. The work went into prefill (19.9 million computed input tokens in three hours) and into attention over contexts of 100,000 tokens and more. A single request saw about 34 tokens a second at the median, not 166.</p>\n<p>Long contexts also fill the KV cache with only a few requests. Around 08:00 the cache reached 88.6%, and at the same moment the 95th-percentile time to first token jumped to 2.6 minutes: new requests were waiting for memory, not compute. The traces show it request by request, with 200,000-token prompts waiting 40 seconds or more for their first token. About 60 of the window's 64 failed requests were prompts that had outgrown the 262K-token context window, which is where the dashboard's 4.47% error rate comes from.</p>\n<img />\n<p><strong>Measure the shape of your own traffic, not the shape of a benchmark.</strong> For this workload the numbers that matter are prefill throughput, the cache hit rate and how many long contexts fit in memory at once.</p>\n<h2>Spot, honestly</h2>\n<p>Here is what one VM met in its first week:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>#</th><th>Region (eviction-rate bucket)</th><th>Ran before eviction</th></tr></thead><tbody><tr><td>1</td><td>West US 3 (5–10%)</td><td>about a minute, just after a restart</td></tr><tr><td>2</td><td>West US 3 (5–10%)</td><td>2 h 01 min</td></tr><tr><td>3</td><td>West US 3 (5–10%)</td><td>2 h 16 min</td></tr><tr><td>4</td><td>UK South (0–5%)</td><td>2 h 36 min</td></tr><tr><td>5</td><td>UK South (0–5%)</td><td>5 h 34 min</td></tr><tr><td>6</td><td>North Europe (0–5%)</td><td>8 h 28 min</td></tr><tr><td>7</td><td>UAE North (0–5%)</td><td>2 h 58 min</td></tr></tbody><colgroup><col style=\"width: 4.39%;\" /><col style=\"width: 45.84%;\" /><col style=\"width: 49.77%;\" /></colgroup></table></div>\n<p>Seven evictions in about 40 hours of running, and five attempts to create or restart a VM in UK South that failed for lack of capacity. An eviction deallocates the VM with the model still on its disk, so a restart in place brings the stack back in a few minutes once capacity returns.</p>\n<p>I pick regions with two public data sources, which <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/infra/spot-regions.sh\" rel=\"noopener\" target=\"_blank\">infra/spot-regions.sh</a> combines:</p>\n<ul>\n<li>The <code>SpotResources</code> table in <a href=\"https://learn.microsoft.com/azure/virtual-machines/spot-vms#azure-resource-graph\" rel=\"noopener\" target=\"_blank\">Azure Resource Graph</a> has the eviction-rate bucket and recent Spot price history for each size and region.</li>\n<li><a href=\"https://learn.microsoft.com/azure/virtual-machine-scale-sets/spot-placement-score\" rel=\"noopener\" target=\"_blank\">Spot Placement Score</a> rates how likely a Spot request is to succeed right now, per zone, and shows zones where the size is restricted for your subscription. It needs the Compute Recommendations Role.</li>\n</ul>\n<pre class=\"lia-code-sample language-markup\" contenteditable=\"false\" tabindex=\"0\"><code>region               eviction  usd/h    since    min-max\nnortheurope          0-5       1.55     2026-02  1.55-1.55\nuksouth              0-5       1.61     2026-09  1.61-2.06\nsoutheastasia        0-5       1.68     2026-09  1.68-2.28\n...\nRegion         Zone    Score                      QuotaAvailable\nsoutheastasia  1       Low                        True\nsoutheastasia  2       Low                        True\nsoutheastasia  3       RestrictedSkuNotAvailable  True\n</code></pre>\n<p>My rule is the lowest eviction bucket, then the lower price, then a zone that isn't restricted. For this size the placement score was Low in almost every unrestricted zone I checked, all week. Low isn't a refusal, though: VMs scored Low in West US 3, North Europe, UAE North and Southeast Asia all allocated on the first try.</p>\n<p>Two things I got wrong at first:</p>\n<ul>\n<li><strong>The eviction rate is per hour.</strong> Microsoft Learn describes the eviction rate in the portal as the chance of being evicted within the next hour, based on recent history. At 5% an hour, an eight-hour run has roughly a one-in-three chance of being evicted. Read 0–5% as \"plan for evictions\", not \"evictions are rare\".</li>\n<li><strong>Changing zones didn't change much.</strong> The first five evictions were all in zone 1, so I moved to other zones. North Europe zone 3 and UAE North zone 2 were evicted too.</li>\n</ul>\n<p>Spot fits workloads that can wait for a restart. For steady serving, request quota for regular capacity and drop the Spot flags: the same scripts work, at the regular price.</p>\n<h2>Does it pay off?</h2>\n<p>The token economics row at the top of this post turns the dashboard into a running answer. VM hours are the minutes in which the collector could scrape vLLM, so stopped or evicted time doesn't count. The prices are dashboard variables: the VM's hourly price and the per-million prices for input, cached input and output, defaulting to the list prices above. Every stat is an instant query, so after an eviction it reads \"Off\" instead of holding its last value.</p>\n<p>Over the busiest three hours it reads $8.12 of tokens per VM hour, about four times the VM's price. Over the first week it's a different story:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>&nbsp;</th><th>Busiest 3 hours (Oct 9, 05:35–08:35 UTC)</th><th>First week (Oct 3–10)</th></tr></thead><tbody><tr><td>Hours the model server was up</td><td>3.0</td><td>37.9</td></tr><tr><td>Requests</td><td>1,434</td><td>5,469</td></tr><tr><td>Input tokens (share served from the prefix cache)</td><td>168.7M (88%)</td><td>564.2M (88%)</td></tr><tr><td>Output tokens</td><td>1.27M</td><td>6.11M</td></tr><tr><td>Worth at the list price</td><td>$24.35</td><td>$85.94</td></tr><tr><td>Per hour the model server was up</td><td><strong>$8.12</strong></td><td><strong>$2.27</strong></td></tr></tbody><colgroup><col style=\"width: 42.29%;\" /><col style=\"width: 37.47%;\" /><col style=\"width: 20.24%;\" /></colgroup></table></div>\n<p>The VMs actually ran about 46 hours that week, counting setup, model loading, benchmarks and the first runs before the telemetry existed. At each region's Spot price that was about $98 of compute, plus a little for disks and the NAT gateway, against $86 of tokens. The first nine and a half hours ran in West US 3 at $3.95 an hour, before I started choosing regions with the data above; the rest averaged $1.67 an hour.</p>\n<p>Look at where the value comes from, too. In the busy window, cached input brought in 52% of it ($12.65), computed input 35% ($8.48) and output only 13% ($3.23). Benchmarks measure output tokens per second, but for this workload output was less than a fifth of the value.</p>\n<p>So the answer to the title is: <strong>it pays off when it's busy.</strong> At $8.12 of tokens per busy hour against about $2 of VM, the H100 needs to be busy roughly a quarter of the time to break even, and it can't earn while it's evicted, loading or idle. Self-hosting on an H100 Spot VM makes sense when:</p>\n<ul>\n<li>traffic is steady and its prompts share long prefixes, which is where prefix caching makes input cheap to serve</li>\n<li>you want control over the exact checkpoint, the serving flags and where requests go</li>\n<li>the workload tolerates an occasional restart, or you pay for regular capacity</li>\n</ul>\n<p>It makes less sense for bursty traffic that leaves the GPU idle most of the day, or for anything that needs an SLA on a Spot VM.</p>\n<h2>Try it</h2>\n<ul>\n<li><strong>Sample code:</strong> <a href=\"https://github.com/1w2w3y/wuyi-labs/tree/main/2610-h100-qwen-38-27b\" rel=\"noopener\" target=\"_blank\">wuyi-labs/2610-h100-qwen-38-27b</a> has everything in this post: provisioning, the host bootstrap, the Compose stack, the collector configuration, the smoke test and benchmarks, and <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/infra/spot-regions.sh\" rel=\"noopener\" target=\"_blank\">spot-regions.sh</a>.</li>\n<li><strong>The dashboard:</strong> <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-h100-qwen-38-27b/observability/grafana/h100-llm.json\" rel=\"noopener\" target=\"_blank\">h100-llm.json</a>, ready to import into Azure Managed Grafana. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/tree/main/2610-h100-qwen-38-27b#dashboard\" rel=\"noopener\" target=\"_blank\">README</a> has the import steps.</li>\n<li><strong>The model:</strong> <a href=\"https://huggingface.co/Qwen/Qwen3.8-27B\" rel=\"noopener\" target=\"_blank\">Qwen3.8-27B on Hugging Face</a> and <a href=\"https://recipes.vllm.ai/Qwen/Qwen3.8-27B\" rel=\"noopener\" target=\"_blank\">vLLM's Qwen3.8-27B recipe</a>.</li>\n<li><strong>Monitoring:</strong> <a href=\"https://learn.microsoft.com/azure/azure-monitor/containers/opentelemetry-protocol-ingestion\" rel=\"noopener\" target=\"_blank\">Ingest OTLP data into Azure Monitor with the OpenTelemetry Collector</a>, <a href=\"https://learn.microsoft.com/azure/azure-monitor/metrics/prometheus-grafana\" rel=\"noopener\" target=\"_blank\">Connect Grafana to Azure Monitor managed service for Prometheus</a>, and, for AI coding agents rather than the model behind them, <a href=\"https://learn.microsoft.com/azure/managed-grafana/grafana-opentelemetry-app-insights\" rel=\"noopener\" target=\"_blank\">Monitor AI coding agents with Grafana</a>.</li>\n<li><strong>Agents:</strong> the <a href=\"https://aka.ms/amg-mcp\" rel=\"noopener\" target=\"_blank\">Azure Managed Grafana MCP server</a>, to change dashboards and query telemetry from an AI agent.</li>\n<li><strong>Spot:</strong> <a href=\"https://learn.microsoft.com/azure/virtual-machines/spot-vms\" rel=\"noopener\" target=\"_blank\">Azure Spot Virtual Machines</a>, <a href=\"https://azure.microsoft.com/pricing/details/virtual-machines/linux/\" rel=\"noopener\" target=\"_blank\">Linux VM pricing</a> and <a href=\"https://learn.microsoft.com/azure/virtual-machine-scale-sets/spot-placement-score\" rel=\"noopener\" target=\"_blank\">Spot Placement Score</a>.</li>\n</ul>\n<p>Then keep it busy.</p>"
