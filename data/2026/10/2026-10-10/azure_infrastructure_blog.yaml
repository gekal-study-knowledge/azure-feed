    "title": "Microsoft at OCP Global Summit 2026"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/microsoft-at-ocp-global-summit-2026/ba-p/4562337"
    "published": "2026-10-10 00:17:37"
    "fetched": "2026-10-10 23:01:27"
    "summary": "<h5>At OCP Global Summit 2026, Microsoft will showcase how we’re advancing the infrastructure needed to scale AI, from silicon and systems to the datacenter. Come visit Microsoft at Booth C73 and hear from Microsoft leaders and experts through our keynote and sessions, panels, and workshops across the summit.</h5>\n<!-- BLOCK 4: Featured card with label, people row and description -->\n<h2 style=\"margin-top: 48px; color: #0078d4;\"><span style=\"color: #3598db;\">Featured Sessions</span></h2>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 16px; padding: 24px; margin-bottom: 24px; background: #ffffff;\">\n<div style=\"display: inline-block; background: #0078d4; color: #ffffff; padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 15px;\">KEYNOTE</div>\n<h3 style=\"margin-top: 0; color: #0078d4; font-size: 20px;\">Intelligence Infrastructure: Scaling AI for the Frontier Era</h3>\n<p style=\"font-size: 14px; margin-bottom: 20px;\"><strong><span class=\"lia-text-color-21\">October 13</span> </strong>· 9:15 AM - 9:35 AM · SJCC, Street Level, South Hall</p>\n<div style=\"display: flex; border-top: 1px solid #f0f0f0; padding: 15px 0;\">\n<div style=\"display: flex;\">\n<div>\n<div style=\"font-size: 13px; color: #555;\"><img /></div>\n</div>\n</div>\n</div>\n<div style=\"border-top: 1px solid #f0f0f0; padding-top: 15px;\">\n<p style=\"font-size: 14px; line-height: 1.6; color: #444; margin: 0;\">AI infrastructure depends on co-design across silicon, systems, software, and sites. This keynote examines how Microsoft brings those layers together to build scalable, reliable, and efficient infrastructure with security embedded throughout. It explores the path from technology development to a global fleet, how requirements change at scale, and how those lessons shape next-generation platforms. The session also considers sustainable scaling through closed-loop cooling and lower-carbon construction, the role of grid reliability and workforce development in host communities, and the challenges that call for ecosystem innovation.</p>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 16px; padding: 24px; margin-bottom: 24px; background: #ffffff;\">\n<div style=\"display: inline-block; background: #0078d4; color: #ffffff; padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 15px;\">EXECUTIVE SESSION</div>\n<h3 style=\"margin-top: 0; color: #0078d4; font-size: 20px;\">Powering the AI Era: Building Sustainable and Efficient Infrastructure at Cloud Scale</h3>\n<p style=\"font-size: 14px; margin-bottom: 20px;\"><span class=\"lia-text-color-21\"><strong>October 12</strong></span> · 2:30 PM - 2:50 PM · SJCC, Concourse Level, 210AE</p>\n<div style=\"display: flex; border-top: 1px solid #f0f0f0; padding: 15px 0;\">\n<div style=\"display: flex;\">\n<div style=\"font-weight: 600; font-size: 15px;\"><img /></div>\n</div>\n</div>\n<div style=\"border-top: 1px solid #f0f0f0; padding-top: 15px;\">\n<p style=\"font-size: 14px; line-height: 1.6; color: #444; margin: 0;\">The explosive growth of generative AI is driving an unprecedented increase in demand for computing infrastructure. As AI workloads scale from training to widespread inference, every layer of the cloud stack is being challenged, from power grids and datacenters to servers, silicon, and software systems. Meeting this demand sustainably requires rethinking how computing infrastructure is designed, operated, and optimized.</p>\n</div>\n</div>\n<h2 style=\"margin-top: 48px; color: #0078d4;\"><span style=\"color: #3598db;\">Microsoft Breakout Sessions, Panels, and Workshops</span></h2>\n<h6>Explore Microsoft daily sessions and hear from experts shaping the future of cloud and AI infrastructure.</h6>\n<!-- BLOCK 6: Agenda / timeline rows. Copy a row DIV to add more. -->\n<h4 style=\"color: #0078d4; margin-bottom: 15px; border-left: 4px solid #0078d4; padding-left: 10px;\">Tuesday, October 13</h4>\n<div style=\"display: flex; margin-bottom: 40px;\">\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">9:55 - 10:00 <br />AM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">KEYNOTE</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Women in OCP (WOCP) - Community First, AI Forward</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Sung Kim - BP Castrol, Shruti Sethi - Microsoft, Allison Boen - Alcatex and Shell Fluid, Anu Ramamurthy - Microchip</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Street Level - South Hall</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">1:15 - 1:35&nbsp;<br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | OIF Workshop</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Enabling AI Scale-Up: Why Standards Matter and the Need for Industry Alignment</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Fotini Karinou - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Lower Level - LL20BCD</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">1:45 - 2:00 <br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | Networking</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Switch Platform Architecture: A Unified Network Switch Platform Reference Design</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Tao Ren - Meta, Ying Xie - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 210AE</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">1:50 - 2:15 <br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PANEL | AI Open Data Center</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Beyond the Build: Autonomous Robotics and the Future of Data Center Operations</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Shashank Gupta - Fleet Data Centers, Eric Xu - Meta, Rob Lawson-Shanks - Molg, Evan Johnson - Microsoft; Moderator: Joel Chakkalakal - PHS West</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 210CG</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">1:55 - 2:20 <br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | Manageability Workshop</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Redfish Aliasing Support and Redfish Streaming Telemetry Enhancements</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Bill Scherer - HPE, Hari Ramachandran - Microsoft Corporation, Jeff Autor - Vertiv</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Lower Level - LL21BC</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">2:20 - 2:45 <br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PANEL | AI Open Data Center</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Material Handling Automation for Next-Generation Datacenter Operations</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Rachel Soukup - Google; Ben Wong - Meta; Amir Porter - Microsoft; Moderator: Evan Johnson - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 210CG</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">2:20 - 2:45 <br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PANEL | AI Computing Continuum</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Two Years of x86 Ecosystem Collaboration: Open Infrastructure, AI Readiness, and Developer Predictability</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Jeff McVeigh - Intel, Stephen Watt - Red Hat, Andrew Wheeler - HPE, Martin Dixon - Google, Jon Lange - Microsoft; Moderator: Robert Hormuth - AMD</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 211</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">2:35 - 2:45 <br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | IPEC Workshop</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>IPEC Presentation</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Yawei Yin - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 230A&nbsp;</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">3:15 - 3:45&nbsp;<br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PANEL | AI Open Data Center</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Automation-Ready Infrastructure Design: From Light to Compute</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Mike McKee-Hector - Microsoft, Dave Evans - Google, Ryan Olson - Meta; Moderator: Eric Xu - Meta</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 210CG</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">3:50 - 4:05&nbsp;<br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | Cooling Environments</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Building a Scalable Waste Heat Ecosystem: Datacenter Waste Heat, Offtakers, and Market Platforms</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Maria Viitaniemi - Microsoft, Bharath Ramakrishnan - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 220C&nbsp;</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">4:00 - 4:20&nbsp;<br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | Manageability Workshop</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Using SPDM for PLDM Firmware Updates: Authorization Policy and Measurement Manifest Capabilities</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Patrick Caporale - Lenovo, Brett Henning - Broadcom Inc., Scott Phuong - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Lower Level - LL21BC</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">4:10 - 4:45&nbsp;<br />PM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | Cooling Environments</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>Heat Reuse Sub-Project Overview and Updates + Economics Tool Contribution</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Aime Comella - DayOne; Jack Kolar - Dataquarium; Gemma Reeves - Alfa Laval; Bharath Ramakrishnan - Microsoft; Ahliana Byrd - Ascentra Innovations</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 220C</div>\n</div>\n</div>\n<h4 style=\"color: #0078d4; margin-bottom: 15px; border-left: 4px solid #0078d4; padding-left: 10px;\">Wednesday, October 14</h4>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">8:00 - 8:25 <br />AM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PANEL | AI Open DC: Power Distribution</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>+/-400V / 800V On-Board Power Delivery Requirements</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: James Sun - Microsoft, Sachin Madhusoodhanan - Google, LJ (Jian) Lu - Google, Shengwen Xu - Meta; Moderator: Michelle Badal - Google</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 210CG</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">8:15 - 9:10 <br />AM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PANEL | Systems Management</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>OCP Hardware Fault Management Workstreams Status and Relationship</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Theodros Yigzaw - NVIDIA; Vilas Sridharan - AMD; Janusz Jurski - Intel; Shubhada Pugaonkar - NVIDIA; Samer El-Haj-Mahmoud - Arm;&nbsp;Moderator: Drew Walton - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: Concourse Level - 211</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">8:15 - 8:35 <br />AM</div>\n<div style=\"padding: 12px 20px;\">\n<div style=\"font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px;\">PRESENTATION | SONiC Workshop</div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4;\"><strong>SONiC Community Year in Review: Powering the Open Network for the AI Era</strong></p>\n<div style=\"font-size: 13px; margin-top: 4px;\">Speakers: Yanzhao Zhang - Microsoft, Xin Liu - Microsoft</div>\n<div style=\"font-size: 13px; margin-top: 4px;\">Location: SJCC - Concourse Level - 230A</div>\n</div>\n</div>\n<div style=\"border: 1px solid #e1e8f0; border-radius: 12px; background: #ffffff; display: flex; overflow: hidden;\">\n<div style=\"background: #f5f9fd; width: 90px; display: flex; border-right: 1px solid #e1e8f0; font-weight: bold; color: #0078d4; font-size: 13px; text-align: center;\">8:20 - 8:40