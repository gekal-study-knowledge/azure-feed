"overview": |
  この日は 2 件で、分散した AI インフラのための接続性の見直しと、機密コンピューティング向け VM の廃止予定でした。インフラブログでは、Azure の ExpressRoute と AI Points of Presence (AI PoPs) によって分散した AI インフラをスケールさせる構想が示されました。AI はアプリケーションのあり方だけでなく、それを支えるインフラをどこに配置するかも変えつつあります。長年クラウドコンピューティングは、コンピュート・ストレージ・ネットワーク・セキュリティ・運用を巨大な規模で組み合わせたハイパースケールのリージョンを軸にしてきました。そのモデルは今も基盤として重要ですが、分散した AI インフラに向けては接続性の設計を見直す必要があるという論旨です。廃止予定では、DCsv3 および DCdsv3 シリーズの Azure Linux・Windows・専用ホストの仮想マシンが 2029 年 10 月 31 日に廃止されると告知されました。その日以降は利用も購入もできなくなるため、それまでに後継のシリーズへワークロードを移行する必要があります。
