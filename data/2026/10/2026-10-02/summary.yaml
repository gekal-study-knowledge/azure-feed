"overview": |
  この日は 3 件で、分散した AI インフラのための接続性の見直しと、機密コンピューティング向け VM の廃止予定でした。インフラブログでは、Azure の ExpressRoute と AI Points of Presence (AI PoPs) によって分散した AI インフラをスケールさせる構想が示されました。AI はアプリケーションのあり方だけでなく、それを支えるインフラをどこに配置するかも変えつつあります。長年クラウドコンピューティングは、コンピュート・ストレージ・ネットワーク・セキュリティ・運用を巨大な規模で組み合わせたハイパースケールのリージョンを軸にしてきました。そのモデルは今も基盤として重要ですが、分散した AI インフラに向けては接続性の設計を見直す必要があるという論旨です。廃止予定では、DCsv3 および DCdsv3 シリーズの Azure Linux・Windows・専用ホストの仮想マシンが 2029 年 10 月 31 日に廃止されると告知されました。その日以降は利用も購入もできなくなるため、それまでに後継のシリーズへワークロードを移行する必要があります。あわせて、Azure Container Apps 上で「判断」に特化したモデルを動かす記事が公開されました。AI の呼び出しの多くは実のところ会話ではなく、サポートのメッセージには意図が、ワークフローには経路が、ポリシーのチェックには yes か no が、エージェントには既知の一覧から選ぶ次の行動が必要なだけで、こうした範囲の限られた判断まで汎用の LLM に投げていることが多い、という問題意識が語られます。LLM はリクエストを読み、トークンを 1 つずつ生成して答えを作り、アプリケーション側がその応答を検証して解析するわけですが、有効な答えが 60 個のラベルのどれかしかないのなら、必要以上の仕組みだということです。2026 年 9 月 15 日に TypeSafe が最初の公開 System One Model である Jev をアーリーアクセスで出したことで、構造化された状態を入れると型付きの選択肢と確率が返る、判断のために作られたモデルに注目が集まりました。Ollaya は同じ問題に自己ホストの側から取り組むもので、ここで使われている winnow:e4b を含む公開された判断モデルを提供できるモデルランタイムです (Jev と Ollaya に直接の関係はありません)。
