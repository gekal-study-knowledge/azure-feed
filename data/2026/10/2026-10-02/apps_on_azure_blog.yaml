    "title": "Run an Ollaya decision model on Azure Container Apps"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/run-an-ollaya-decision-model-on-azure-container-apps/ba-p/4561558"
    "published": "2026-10-02 06:48:30"
    "fetched": "2026-10-02 23:13:30"
    "summary": "<p>Many AI calls are not really conversations. A support message needs an intent. A workflow needs a route. A policy check needs a yes or no. An agent needs to select its next action from a known list.</p>\n<p>These are bounded decisions, but they are often sent to a general-purpose LLM. The LLM reads the request, generates an answer token by token, and then the application validates and parses the response. That is useful when the task needs reasoning or language generation. It is more machinery than necessary when the only valid answer is one of 60 labels.</p>\n<p>On September 15, 2026, TypeSafe released <a href=\"https://typesafe.ai/blog/introducing-system-one-models-and-jev\" rel=\"noopener\" target=\"_blank\">Jev, its first public System One Model</a>, in early access. Jev has helped bring attention to models built specifically for decisions: structured state goes in, and typed choices with probabilities come out.</p>\n<p><a href=\"https://ollaya.dev/\" rel=\"noopener\" target=\"_blank\">Ollaya</a> approaches the same problem from a self-hosted direction. It is a model runtime that can serve open decision models, including the <code>winnow:e4b</code> model used here. Jev and Ollaya are not connected products. Jev is a hosted model from TypeSafe; Ollaya provides a way to run decision models in infrastructure you control. They are related by the kind of work they target.</p>\n<h2>What decision models are good at</h2>\n<img />\n<p>A decision model scores predefined options rather than generating open-ended text:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th><strong>Decision model</strong></th><th><strong>Traditional LLM</strong></th></tr></thead><tbody><tr><td>Selects from allowed choices</td><td>Generates text</td></tr><tr><td>Returns a probability for each decision</td><td>Usually returns one generated answer</td></tr><tr><td>Has a bounded, typed output</td><td>Needs schema constraints and validation</td></tr><tr><td>Supports confidence thresholds</td><td>Often needs a separate confidence strategy</td></tr><tr><td>Fits classification, routing, scoring, policy, and prioritization</td><td>Fits generation, summarization, coding, and open-ended reasoning</td></tr></tbody></table></div>\n<p>That narrower interface creates several practical benefits:</p>\n<ul>\n<li><strong>Predictable outputs:</strong> the application receives an allowed value rather than text that must be repaired or parsed.</li>\n<li><strong>Lower decision latency:</strong> there is no autoregressive output sequence to generate.</li>\n<li><strong>Token savings:</strong> a decision can be returned without generating output tokens.</li>\n<li><strong>Useful uncertainty:</strong> calibrated probabilities let the application act, reject, or escalate.</li>\n<li><strong>Smaller infrastructure:</strong> a specialized model can fit on hardware that would be modest for a general LLM.</li>\n</ul>\n<p>Decision models are not replacements for every LLM call. They make sense when the possible outcomes are known before the request arrives. An LLM remains the better tool when the output itself is language, code, or open-ended reasoning.</p>\n<h2>Why Azure Container Apps serverless GPU</h2>\n<p><a href=\"https://learn.microsoft.com/azure/container-apps/gpu-serverless-overview\" rel=\"noopener\" target=\"_blank\">Azure Container Apps serverless GPUs</a> make self-hosted inference feel much closer to consuming a managed API. You bring the container and model; Azure manages the underlying GPU infrastructure.</p>\n<p>The Consumption GPU profile provides:</p>\n<ul>\n<li>NVIDIA T4 or A100 GPUs without managing GPU nodes or a Kubernetes cluster.</li>\n<li>Automatic scaling with the option to scale to zero.</li>\n<li>Per-second GPU billing while replicas are running.</li>\n<li>Container Apps networking, identity, ingress, logging, and revision management.</li>\n<li>A private inference path where the model and request data stay inside your Azure environment.</li>\n</ul>\n<p>That last point matters for data-sensitive decisions. In the Ollaya-only configuration, text is sent to an internal Ollaya endpoint rather than an external model API. The model, API, persistent cache, and operational controls remain in the application's Azure environment.</p>\n<p>Serverless does not remove the need to think about cold starts. A model still needs to be loaded into VRAM. For low or sporadic traffic, scaling to zero can avoid idle GPU cost. For latency-sensitive traffic, a warm minimum replica avoids making a user wait for the model to load. Azure Files can retain the model layers across revisions so a new deployment does not download the full model again.</p>\n<p>The T4 is also an important part of this experiment. It is not the largest GPU available, but the goal is not to run the largest model. The goal is to match the hardware to a model designed for the task. A focused decision model on a T4 can compete with a hosted API when the workload is a bounded classification rather than text generation.</p>\n<h2>The experiment</h2>\n<p>I deployed <code>winnow:e4b</code> through Ollaya on an Azure Container Apps <code>Consumption-GPU-NC8as-T4</code> workload profile. An authenticated API exposed the classifier while Ollaya remained on internal-only ingress. A second path sent the same requests to GPT-5.4 Nano through Azure OpenAI using managed identity.</p>\n<img /><!-- INSERT IMAGE: MASSIVE classification with Ollaya Winnow and Azure OpenAI on Azure Container Apps -->\n<p>The evaluation used the complete 2,974-record test partition from Amazon MASSIVE 1.1. It contains 18 scenarios and 60 intents. Both providers received the same records, labels, and descriptions.</p>\n<p>The benchmark measured latency at concurrency 1 and throughput at concurrency 8. Providers and modes ran sequentially so one measurement did not load the service used by another. This was not a direct benchmark of Jev; it tested the same decision-model pattern with an open model that could run inside the Azure environment.</p>\n<h2>What the results showed</h2>\n<p>The benchmark ran on September 30, 2026.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th><strong>Provider</strong></th><th>Successful</th><th>Intent accuracy</th><th>Macro-F1</th><th>p50</th><th>p95</th></tr></thead><tbody><tr><td>Winnow on T4</td><td>2,974 / 2,974</td><td>75.59%</td><td>76.40%</td><td>946 ms</td><td>960 ms</td></tr><tr><td>GPT-5.4 Nano</td><td>2,974 / 2,974</td><td>79.12%</td><td>78.07%</td><td>1,369 ms</td><td>2,489 ms</td></tr></tbody></table></div>\n<p>Nano led intent accuracy by 3.53 percentage points. Winnow was 30.9% faster at p50 and 61.4% faster at p95. This is the useful T4 result: a smaller GPU running the right specialized model matched and beat the hosted endpoint on response latency, though not on accuracy.</p>\n<p>At concurrency 8, Nano delivered 1.367 requests per second compared with Winnow's 1.120. Nano also had 25 requests fail after eight retries because the deployment exceeded its token-rate limit. Winnow completed all 2,974 requests, but its single loaded runner serialized work and increased queue time.</p>\n<p>The token comparison shows what the decision-only path removes:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th><strong>Provider, both benchmark passes</strong></th><th>Input tokens</th><th>Cached input tokens</th><th>Output tokens</th></tr></thead><tbody><tr><td>Winnow on T4</td><td>9,252,872</td><td>0</td><td>0</td></tr><tr><td>GPT-5.4 Nano</td><td>8,501,200</td><td>7,564,800</td><td>122,759</td></tr></tbody></table></div>\n<p>Winnow returned every decision without generating output tokens. Nano generated 122,759 output tokens across the latency and throughput passes. The rows do not represent equivalent billing models: Winnow consumes self-hosted GPU time, while Nano is metered by hosted token usage. The comparison isolates the generated tokens that a bounded decision did not need.</p>\n<p>Winnow also returned calibrated probabilities. At a 0.90 threshold, it accepted 53.73% of the records and was correct on 94.43% of those accepted decisions. An application could handle that high-confidence group locally and send only the uncertain remainder to an LLM or human reviewer.</p>\n<h2>In brief</h2>\n<p>A decision model is useful when software needs a bounded answer rather than generated language. In this experiment, Winnow on a serverless T4 traded some accuracy for lower latency, zero generated output tokens, private inference, and an explicit confidence signal. The practical design is often a combination: use the decision model for fast, high-confidence choices and reserve LLM calls for uncertain or open-ended work.</p>\n<h2>Try it with the template</h2>\n<p>The <a href=\"https://github.com/simonjj/ollaya-on-aca\" rel=\"noopener\" target=\"_blank\">Azure Developer CLI template</a> packages the Container Apps environment, T4 workload profile, authenticated API, internal Ollaya service, persistent model cache, GPU readiness checks, and benchmark.</p>\n<p>It supports two deployment modes:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th><strong>Mode</strong></th><th><strong>What it deploys</strong></th></tr></thead><tbody><tr><td><code>ollaya-only</code></td><td>Private Winnow inference on a serverless T4 plus the authenticated API</td></tr><tr><td><code>full</code></td><td>The Ollaya deployment, GPT-5.4 Nano, and the comparison benchmark</td></tr></tbody></table></div>\n<ul>\n<li><a href=\"https://github.com/simonjj/ollaya-on-aca#readme\" rel=\"noopener\" target=\"_blank\">Read the deployment guide</a></li>\n<li><a href=\"https://github.com/simonjj/ollaya-on-aca/blob/main/benchmarks/results.json\" rel=\"noopener\" target=\"_blank\">Inspect every benchmark prediction and retry</a></li>\n<li><a href=\"https://github.com/simonjj/ollaya-on-aca/blob/main/app/taxonomy.json\" rel=\"noopener\" target=\"_blank\">Review the shared MASSIVE taxonomy</a></li>\n</ul>"
