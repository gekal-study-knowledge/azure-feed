    "title": "Beyond Hub-and-Spoke: Routable and Non-Advertised Azure Networks"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/beyond-hub-and-spoke-routable-and-non-advertised-azure-networks/ba-p/4553044"
    "published": "2026-10-22 21:19:59"
    "fetched": "2026-10-23 05:54:55"
    "summary": "<h1>Why Enterprise Azure Networking Needs to Evolve</h1>\n<p>Hub-and-spoke remains a common foundation for enterprise Azure networking. The hub provides shared transit, hybrid connectivity, DNS, and security services, while spokes host application and platform workloads.</p>\n<p>A conventional design allocates each spoke a <strong>non-overlapping enterprise CIDR</strong> and propagates the prefix through the enterprise routing domain. <strong>This model becomes harder to sustain as the environment expands across:</strong></p>\n<ul>\n<li>Multiple Azure regions and landing zones</li>\n<li>Production, non-production, and disaster-recovery environments</li>\n<li>Existing data centers and branch networks</li>\n<li>Acquired or partner networks</li>\n<li>Other public clouds</li>\n<li>Data, analytics, and AI platforms</li>\n<li>Private endpoints and dedicated platform subnets</li>\n</ul>\n<p>At that scale, the constraint is not merely available IPv4 capacity. It is the availability of <strong>non-overlapping prefixes that can be safely advertised across all connected routing domains</strong>.</p>\n<p>Many workload networks also do not require direct routed connectivity from the wider enterprise. Application backends, compute clusters, integration services, and data-processing platforms might require access to specific dependencies or endpoints, rather than full prefix reachability.</p>\n<p>The design question is therefore:</p>\n<p><strong>Does the enterprise require a route to the complete workload prefix, or only to selected services exposed by that workload?</strong></p>\n<p>This separates two architecture decisions:</p>\n<ol>\n<li><strong>Where is the workload hosted?</strong></li>\n<li><strong>Which workload endpoints require enterprise-wide reachability?</strong></li>\n</ol>\n<p>A spoke can consume governed connectivity through a hub without requiring its complete prefix to be propagated into the wider enterprise network.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p class=\"lia-align-center\"><strong>Figure 1:</strong> An enterprise Azure environment can provide enterprise-routable endpoints while keeping the underlying workload networks outside the wider enterprise routing domain. Connecting a workload to a hub enables governed connectivity, but it does not require the workload’s complete address space to be advertised enterprise-wide.</p>\n<h1>Routable and Non-Advertised Address Spaces</h1>\n<p>A private IP address is not automatically enterprise-routable. Reachability depends on the effective route selected by the source, route propagation across connected domains, a valid return path, and the applicable security controls.</p>\n<p>Azure creates system routes for each VNet subnet. Custom routes can override selected system routes, and Azure selects an outbound path from the subnet’s effective route table.[1]</p>\n<p>For this architecture, address spaces fall into two categories:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Address-space type</th><th>Routing behavior</th><th>Typical use</th></tr></thead><tbody><tr><td><strong>Enterprise-routable</strong></td><td>Prefix is propagated into approved parts of the enterprise routing domain</td><td>Hybrid connectivity, DNS, security services, ingress, management endpoints, and selected private endpoints</td></tr><tr><td><strong>Non-advertised workload</strong></td><td>Prefix is routable within its approved Azure topology but is not propagated enterprise-wide</td><td>Applications, data platforms, compute clusters, integration services, and internal platform components</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>A non-advertised workload network is not disconnected. Azure system routes, VNet peering, user-defined routes, or a transit component can still provide connectivity within its approved scope.</p>\n<p>Throughout this article, <strong>non-advertised workload network</strong> means:</p>\n<p><strong>A network that is locally routable within its approved Azure topology, but whose prefix is intentionally not propagated across the wider enterprise routing domain.</strong></p>\n<p>Routing and authorization remain separate controls. The existence of a route does not imply that NSGs, Azure Firewall, an NVA, identity controls, or the destination application will permit the connection.</p>\n<h1>Address-Space Strategy at Scale</h1>\n<p>Most enterprise private networks use the RFC 1918 ranges:[2]</p>\n<ul>\n<li>10.0.0.0/8</li>\n<li>172.16.0.0/12</li>\n<li>192.168.0.0/16</li>\n</ul>\n<p>Enterprise-routable allocations must remain unique across every connected routing domain in which the prefixes are propagated. This includes Azure, on-premises networks, connected partners, acquired networks, and other clouds.</p>\n<p>Non-advertised workload ranges still require IPAM governance, but their uniqueness boundary can be limited to the Azure topology in which they are used.</p>\n<p>The routing scope should therefore be defined when the CIDR is allocated:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Requirement</th><th>Addressing direction</th></tr></thead><tbody><tr><td>Complete workload prefix requires direct enterprise connectivity</td><td>Allocate enterprise-routable space and define route propagation</td></tr><tr><td>Only selected workload services require enterprise access</td><td>Keep the workload prefix non-advertised and expose controlled endpoints</td></tr><tr><td>Proposed CIDR overlaps with a directly connected network</td><td>Readdress, maintain isolation, or evaluate translation</td></tr><tr><td>Future connectivity is uncertain</td><td>Define the routing boundary and reserve an access pattern before deployment</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>Microsoft recommends planning non-overlapping address spaces across Azure regions and on-premises locations and maintaining an IP address-management strategy for large environments.[3]</p>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><strong>Figure 2:</strong> Address-space selection begins with the required routing scope, not simply with CIDR availability.</p>\n<h2>Considering 100.64.0.0/10</h2>\n<p>Microsoft’s current Azure IP-planning guidance describes 100.64.0.0/10 as RFC 6598 shared address space treated as private address space in Azure and identifies RFC 1918 exhaustion as a scenario in which it may be evaluated.[3]</p>\n<p>However, 100.64.0.0/10 is not a universal replacement for RFC 1918. Before using it, validate:</p>\n<ul>\n<li>Existing enterprise, partner, or service-provider allocations</li>\n<li>Azure service and connected-network compatibility</li>\n<li>Security, observability, and IPAM tooling</li>\n<li>Future hybrid or cross-cloud connectivity</li>\n<li>Translation, return-path, and organizational-policy requirements</li>\n</ul>\n<p>Azure includes a default system route for 100.64.0.0/10 with the <strong>None</strong> next-hop type. When an address prefix from this range is assigned to a VNet, Azure creates a route for the configured VNet prefix with the <strong>Virtual network</strong> next-hop type.[1] The effective route table must therefore be validated as part of the design.</p>\n<p>The pattern described in this article does not depend on 100.64.0.0/10. The relevant property is whether the selected prefix is intentionally excluded from the wider enterprise routing domain.</p>\n<p><strong>Key principle:</strong> Select a CIDR based on the routing domains in which the prefix must remain unique, not merely because the range appears unused.</p>\n<h1>The Two-Layer Architecture</h1>\n<p>The addressing model translates into two logical layers.</p>\n<h2>Enterprise-Routable Layer</h2>\n<p>This layer contains prefixes and endpoints that require reachability from approved enterprise networks.</p>\n<p>Typical components include:</p>\n<ul>\n<li>Hybrid connectivity infrastructure</li>\n<li>DNS and security services</li>\n<li>Application ingress</li>\n<li>Management endpoints</li>\n<li>Selected private endpoints</li>\n<li>Load balancers or proxies</li>\n</ul>\n<p>Where ExpressRoute is used, Azure private peering exchanges routes through a redundant pair of BGP sessions between the customer network and Microsoft.[5][6]</p>\n<h2>Non-Advertised Workload Layer</h2>\n<p>This layer hosts workload components whose complete prefixes do not require enterprise-wide propagation.</p>\n<p>Typical components include:</p>\n<ul>\n<li>Application backends</li>\n<li>Data-processing platforms</li>\n<li>Compute clusters</li>\n<li>Integration services</li>\n<li>Internal platform services</li>\n</ul>\n<p>These networks remain routable within their approved Azure topology. Their prefixes are not automatically propagated to on-premises networks, other clouds, or unrelated landing zones.</p>\n<h2>The Routable Front Door</h2>\n<p>When an enterprise consumer requires access to a selected workload service, the architecture can expose an endpoint in the enterprise-routable layer. That endpoint acts as a <strong>routable front door</strong>.</p>\n<p>The routable front door is an architectural role, not a specific Azure service. Depending on the protocol and connectivity requirement, enterprise access might be provided through:</p>\n<ul>\n<li>An application ingress service</li>\n<li>A load balancer or reverse proxy</li>\n<li>A private endpoint</li>\n<li>Azure Firewall or an NVA</li>\n<li>Another service-specific access component</li>\n</ul>\n<p>The address presented to the enterprise is separated from the address space used to host and scale the workload.</p>\n<p><strong>Expose the required service without propagating the complete workload prefix.</strong></p>\n<p>The same model can be applied to traditional hub-and-spoke, multi-region landing zones, or Azure Virtual WAN. Azure Virtual WAN provides managed transit between connected VNets, branches, and remote users, but the decision to propagate a workload prefix should remain explicit.[7]</p>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\"><strong>Figure 3:</strong> The routable front door exposes selected services while the underlying workload prefix remains outside the wider enterprise routing domain.</p>\n<h1>Architecture Review Checks</h1>\n<p>Before allocating a workload address range, validate:</p>\n<ol>\n<li>Does the complete workload prefix require enterprise-wide propagation?</li>\n<li>Which exact services, FQDNs, ports, and protocols require access?</li>\n<li>Is the CIDR unique across every routing domain it must directly reach?</li>\n<li>Can a routable front door satisfy the requirement?</li>\n<li>Which routes will be advertised in each direction?</li>\n<li>\n<p>Is the return path valid, and does it traverse the same stateful inspection or translation boundary where required?</p>\n</li>\n<li>Which team owns IPAM, route policy, DNS, security policy, and monitoring?</li>\n<li>What happens if future connectivity expands the routing scope?</li>\n</ol>\n<h1>Conclusion</h1>\n<p>Enterprise Azure network design should treat workload hosting and enterprise reachability as separate decisions.</p>\n<p>Enterprise-routable space should be reserved for prefixes and endpoints that require broader reachability. Workload networks can remain locally routable within Azure without propagating their complete prefixes across the organization.</p>\n<p>The core principle is:</p>\n<p><strong>A workload can consume governed hub connectivity without requiring its complete address space to become enterprise-routable.</strong></p>\n<h1>Up Next: Part 2</h1>\n<p><strong>Part 2: Implementing Routable Front Doors for Non-Advertised Azure Workloads</strong></p>\n<p>Part 2 will implement the architecture using BGP and ExpressRoute, effective routes and UDRs, Azure Firewall and NVA patterns, SNAT, DNAT and double NAT, Private Link, hybrid DNS, return-path validation, failure handling, observability, and pattern selection.</p>\n<h1>References</h1>\n<ol>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview\" rel=\"noopener\" target=\"_blank\">Azure virtual network traffic routing</a> <a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview\" rel=\"noopener\" target=\"_blank\">[learn.microsoft.com]</a></li>\n<li><a href=\"https://datatracker.ietf.org/doc/html/rfc1918\" rel=\"noopener\" target=\"_blank\">https://datatracker.ietf.org/doc/html/rfc1918</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/networking/design-guide/ip-planning\" rel=\"noopener\" target=\"_blank\">IP address planning for Azure virtual networks</a> <a href=\"https://learn.microsoft.com/en-us/azure/networking/design-guide/ip-planning\" rel=\"noopener\" target=\"_blank\">[learn.microsoft.com]</a></li>\n<li><a href=\"https://datatracker.ietf.org/doc/html/rfc6598\" rel=\"noopener\" target=\"_blank\">RFC 6598: Shared Address Space Request</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing\" rel=\"noopener\" target=\"_blank\">Azure ExpressRoute routing requirements</a> <a href=\"https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing\" rel=\"noopener\" target=\"_blank\">[learn.microsoft.com]</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings\" rel=\"noopener\" target=\"_blank\">Azure ExpressRoute circuits and peering</a> <a href=\"https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings\" rel=\"noopener\" target=\"_blank\">[learn.microsoft.com]</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/networking/design-guide/cross-region\" rel=\"noopener\" target=\"_blank\">Cross-region and multicloud connectivity in Azure</a> <a href=\"https://learn.microsoft.com/en-us/azure/networking/design-guide/cross-region\" rel=\"noopener\" target=\"_blank\">[learn.microsoft.com]</a></li>\n</ol>"
