"overview": |
  この日は 5 件で、ARTEX を使った国家支援型のサプライチェーン侵害、Microsoft Entra ID の電話認証プロバイダーの選択、そして Azure Cosmos DB のキーローテーションが中心でした。セキュリティブログでは、Storm-0940 がエージェント型 AI の ARTEX を使って ConnectWise のサプライチェーン侵害を加速させ、Microsoft 365 環境をまたいでアプリケーションの認証情報を悪用できる状態に至った、AI 主導の大規模な国家支援型キャンペーンが報告されました。サービス更新では、2026 年 10 月 30 日から Microsoft Entra ID で Choose Your Own Telephony (CYOT) が利用できるようになります。SMS と音声による認証に、サポート対象のサードパーティーの通信事業者を組織が選んで使えるようにするものです。あわせて Azure Cosmos DB の Safe Key Rotation が一般提供となりました。各アカウントキーが最後に使われた時刻のメタデータを確認できるため、認証情報をローテーションしたり廃止したりする前に、まだ使われているキーを特定できます。アプリ開発では、Azure App Configuration の Enhanced Feature Flags がパブリックプレビューとなりました。コードをデプロイするだけが出荷ではなく、たとえば新しいチェックアウト体験を本番に置いたまま、まず少数の利用者に見せ、段階的に対象を広げ、結果を見ながら問題があれば止められるようにしたい、という使い方が一般的になってきたことを背景に、機能管理のために専用のリソースモデルを設けたものです。リリースマネージャーが機能の公開時期を制御できる一方で、構成全体の権限までは必ずしも必要ないといった権限の切り分けも動機に挙がっています。ネットワークでは、ハブアンドスポークの先を考える記事が公開されました。ハブが共有のトランジット・ハイブリッド接続・DNS・セキュリティを担い、スポークがワークロードを載せる構成は依然として基本ですが、各スポークに重複しない企業 CIDR を割り当てて企業のルーティングドメイン全体に広告する従来設計は、複数リージョンとランディングゾーン、本番・非本番・災害復旧の各環境、既存データセンターや支社、買収先やパートナーのネットワーク、他のパブリッククラウド、データ・分析・AI のプラットフォーム、プライベートエンドポイントや専用サブネットへと広がるにつれて維持が難しくなります。制約は IPv4 の在庫そのものではなく、安全に広告できる重複しないプレフィックスの確保にあるとして、ルーティング可能なネットワークと広告しないネットワークを分ける設計が論じられています。
