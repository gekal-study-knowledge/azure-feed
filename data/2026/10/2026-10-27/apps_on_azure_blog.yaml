  "c13fa0afe826d6083215b0ba708dcbb4":
    "id": "c13fa0afe826d6083215b0ba708dcbb4"
    "title": "Qwen3.8-27B on a Lenovo laptop: run it on RTX Spark, watch it in Azure Monitor"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/qwen3-8-27b-on-a-lenovo-laptop-run-it-on-rtx-spark-watch-it-in/ba-p/4567828"
    "published": "2026-10-27 03:52:23"
    "fetched": "2026-10-27 15:55:26"
    "summary": "<p>In an earlier post I served&nbsp;<a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/4563387\" rel=\"noopener\" target=\"_blank\">Qwen3.8-27B from an H100 in Azure</a>. The same model also runs on a laptop: the Lenovo Yoga 9n 2-in-1 (16\", 11) with NVIDIA's RTX Spark N1X and 64 GB of unified memory. On a short code-generation benchmark it decodes 44.7 tokens a second for one request, and it holds the model's full 262,144-token context. Over three hours of an OpenCode agent reviewing two open-source repositories, it decoded replies at a steady 27 tokens a second per request, and the GPU averaged 41 W.</p>\n<p>A coding agent needs three things from a local model: replies fast enough to wait for, room for the whole conversation, and a machine that runs cool and steady for hours. In my testing, the Yoga 9n delivered all three. This post reviews it for that job, shows what three hours of agent traffic looked like on the dashboard, and walks through the setup: Windows on Arm, Docker, vLLM, a speculative decoder that suits the hardware, and the monitoring that measured it all.</p>\n<p><strong>Disclosure:</strong> I work at Microsoft. Lenovo provided this laptop to Microsoft in July 2026 as a pre-release unit for software testing, and I used it for this post. Retail units may differ slightly.</p>\n<img />\n<h2>At a glance</h2>\n<p><strong>Verdict:</strong> the Yoga 9n 2-in-1 with RTX Spark is a practical machine for running a 27B coding model locally. Its 64 GB of unified memory holds Qwen3.8-27B, a draft model and the full 262,144-token context, and it served three hours of real agent work at a consistent speed and a modest power draw.</p>\n<p><strong>What I liked:</strong></p>\n<ul>\n<li>The model, its drafter and the full native context fit in the 64 GB configuration, alongside Windows.</li>\n<li>44.7 tokens a second on a short code benchmark and about 27 per request in a long agent session, with a median first token in 2–3 seconds while a conversation stays cached.</li>\n<li>Sustained performance: 41 W of average GPU power, a 67 °C peak and a graphics clock near 2 GHz for three hours.</li>\n<li>The GPU's share of the memory is a setting in the NVIDIA app, so you can give a large model room and take it back afterward.</li>\n<li>The standard stack runs unchanged: Docker Desktop, the official vLLM ARM64 image, LiteLLM and OpenCode.</li>\n<li>No hourly bill. The H100 VM from the earlier post costs $6.98–$10.12 an hour at the October 2026 pay-as-you-go price, depending on the region.</li>\n</ul>\n<p><strong>Good to know:</strong></p>\n<ul>\n<li>It suits one agent session at a time; many parallel subagents wait their turn.</li>\n<li>Memory is shared with Windows, so give the model room while it runs.</li>\n<li>The NVFP4 checkpoint is a preview release from Unsloth.</li>\n</ul>\n<p><strong>Who it's for:</strong> developers who want a capable coding model on their own machine, with the model's full context window and no per-hour or per-token bill.</p>\n<h2>The machine</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>&nbsp;</th><th>Lenovo Yoga 9n 2-in-1 (16\", 11), as tested</th></tr></thead><tbody><tr><td>Unit</td><td>Pre-release, provided by Lenovo to Microsoft in July 2026 for software testing</td></tr><tr><td>Chip</td><td>NVIDIA RTX Spark N1X: 20-core Arm CPU, 6,144-core Blackwell GPU</td></tr><tr><td>Memory</td><td>64 GB of LPDDR5X-9400, shared by the CPU and the GPU</td></tr><tr><td>Software</td><td>Windows 11 on Arm, Docker Desktop with Windows Subsystem for Linux (WSL) 2, NVIDIA's Windows driver</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>Lenovo sells it configured to order <a href=\"https://www.lenovo.com/us/en/p/laptops/yoga/yoga-2-in-1-series/yoga-9n-2-in-1-gen-11-16-inch-nvidia/83n7cto1wwus1\" rel=\"noopener\" target=\"_blank\">on Lenovo.com</a>, and in the US, Best Buy carries two fixed configurations: the <a href=\"https://www.bestbuy.com/product/lenovo-yoga-9n-2-in-1-16-3k-oled-touchscreen-laptop-nvidia-rtx-spark-n1x-20-core-2026-64gb-memory-1tb-storage-cosmic-blue/J3PT7W54S2/sku/6687121\" rel=\"noopener\" target=\"_blank\">20-core N1X with 64 GB</a>, as tested, and an 18-core N1X with a 5,120-core GPU and 32 GB (<a href=\"https://www.notebookcheck.net/Lenovo-launches-powerful-2-in-1-laptop-globally-with-up-to-64-GB-RAM-and-20-core-RTX-Spark-N1X.1418562.0.html\" rel=\"noopener\" target=\"_blank\">Notebookcheck</a>). For this model, choose the 64 GB configuration; the next section explains why.</p>\n<h3>Why it works for a 27B model</h3>\n<p>Three specs decide whether a laptop can run a model this size for real work, and the Yoga 9n has all three.</p>\n<p><strong>64 GB of unified memory.</strong> The CPU and GPU share one pool of memory. On this laptop 32,704 MiB of it is set aside for the GPU, which Windows shows as dedicated GPU memory, and Windows keeps 30.8 GiB for itself. The GPU's share holds the model and its draft model (23.35 GiB once loaded) and a KV cache big enough for one full 262,144-token request. Windows backs about 10 GiB more of GPU allocations with system memory, which it shows as shared GPU memory. A 32 GB laptop has half as much memory to share between Windows and the GPU, and this model's weights alone are 19.1 GB.</p>\n<p>That split is a setting, not a fixed spec. In the NVIDIA app, <strong>Dedicated GPU Memory (GB)</strong> under <strong>System</strong> &gt; <strong>Advanced</strong> sets how much of the unified memory the GPU gets, and a new value takes effect after a restart. That's handy for local models: give the GPU a large share while you serve a model this size, and give the memory back to Windows when you don't. I ran everything here with 32 GB for the GPU.</p>\n<p><strong>Memory bandwidth.</strong> To generate a token, the GPU reads every weight of the model. LPDDR5X-9400 on the 256-bit bus that press reports describe works out to about 300 GB/s on paper; a simple read test inside the model's container measured 229 GB/s. For this model that number sets the speed, as Step 3 shows.</p>\n<p><strong>4-bit weights in hardware.</strong> Blackwell GPUs compute in NVFP4, a 4-bit floating-point format. The NVFP4 checkpoint reads 19.1 GB of weights per decode step, where the FP8 weights took 31.1 GB (29.0 GiB) on the H100. vLLM runs it with native FP4 kernels (<code>FlashInferCutlassNvFp4LinearKernel</code>).</p>\n<p>The software is ready too. vLLM's official image comes in a Linux ARM64 build with CUDA 13, and it runs unchanged in Docker Desktop's WSL 2 backend. The building blocks are the ones I used on the H100: vLLM behind a LiteLLM gateway, with OpenCode as the agent.</p>\n<h2>How I measured</h2>\n<p>The numbers in this post come from three different workloads, so read each one with its own conditions:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>&nbsp;</th><th>Code benchmark</th><th>Long-prompt benchmark</th><th>Agent session</th></tr></thead><tbody><tr><td>Task</td><td>Three code-generation prompts: a thread-safe LRU cache in Python with tests, a token-bucket rate limiter in TypeScript, and Dijkstra's algorithm in Go</td><td>One question about a prompt cut from the source and docs of my own lab repository</td><td>OpenCode asked to review every file in <a href=\"https://github.com/microsoft/agent-framework\" rel=\"noopener\" target=\"_blank\">microsoft/agent-framework</a> and <a href=\"https://github.com/microsoft/TypeScript\" rel=\"noopener\" target=\"_blank\">microsoft/TypeScript</a></td></tr><tr><td>Prompt</td><td>36–40 tokens</td><td>97,880 tokens, with a random first line so none of it came from the prefix cache</td><td>19,000 to 115,000 tokens, resent on every turn and mostly cached</td></tr><tr><td>Reply</td><td>512 tokens each, temperature 0, thinking off</td><td>384 tokens, temperature 0, thinking off</td><td>As long as the agent needed, thinking on</td></tr><tr><td>How it was sent</td><td>One request at a time, straight to vLLM</td><td>One request, straight to vLLM</td><td>Through LiteLLM from a second machine, one request running at a time</td></tr><tr><td>Result</td><td><strong>44.7 tok/s</strong> decode, mean of three</td><td><strong>44.3 tok/s</strong> decode, 1,033 tok/s prefill</td><td><strong>27 tok/s</strong> decode per request over three hours</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>All three use the same model, drafter and quantization: Unsloth's NVFP4 checkpoint of Qwen3.8-27B, the DFlash 2 drafter quantized to FP8 and proposing seven tokens, an FP8 KV cache, and vLLM 0.31. What you're running and Step 2 give the details. The two benchmarks ran before I raised the context from 196,608 to the full 262,144 tokens; on the final profile the code benchmark measured 44.1 tokens a second. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/scripts/Invoke-SpeedBench.ps1\" rel=\"noopener\" target=\"_blank\"><code>scripts/Invoke-SpeedBench.ps1</code></a> runs both benchmarks.</p>\n<p>With speculative decoding, decode speed depends on how predictable the text is. Each decode step produced 5.04 tokens on the code benchmark and 3.3 in the agent session, where most of the output was reasoning. A tokens-per-second figure is only comparable with one measured on the same workload and the same speculative-decoding settings.</p>\n<h2>Three hours of real coding work</h2>\n<p>The session in these screenshots is real OpenCode traffic: an agent asked to review every file in two open-source repositories, <a href=\"https://github.com/microsoft/agent-framework\" rel=\"noopener\" target=\"_blank\">microsoft/agent-framework</a> and <a href=\"https://github.com/microsoft/TypeScript\" rel=\"noopener\" target=\"_blank\">microsoft/TypeScript</a>, run from a second machine on the same network through LiteLLM, from 22:52 to about 01:50 UTC.</p>\n<p>For the first 32 minutes the agent worked in one conversation that grew from 19,000 to 77,000 tokens. That is the everyday case for a coding agent, and the Yoga 9n was quick and consistent through it:</p>\n<ul>\n<li><strong>Fast first tokens.</strong> The median time to first token was 2.1–3.3 seconds in each ten-minute window, because 92% of the prompt tokens came from the prefix cache.</li>\n<li><strong>Steady decode.</strong> Replies decoded at about 27 tokens a second per request, with 3.6 tokens produced per decode step.</li>\n<li><strong>Low power.</strong> The GPU averaged 30 W and peaked at 59 °C.</li>\n</ul>\n<p>Agent traffic is harder than benchmark traffic. Over the whole session the model read 85 input tokens for every token it wrote, and 72% of the output tokens the gateway returned were thinking. Each step produced 3.3 tokens on average instead of the 5.04 it reached on the code benchmark in Step 3, because reasoning and prose are harder to guess than code. The first drafted token was accepted 71% of the time, the seventh 13%:</p>\n<img />\n<p>Even so, replies averaged 27 tokens a second per request across three hours of agent traffic.</p>\n<h3>Memory held steady</h3>\n<img />\n<p>The GPU used 30.7 of its 31.9 GiB throughout, and Windows backed another 9.9 GiB of GPU allocations with system memory. Windows kept 3.5 GiB or more available, and with one request at a time the KV cache peaked at 51%. vLLM preempted no requests in three hours.</p>\n<h3>Cool and consistent for three hours</h3>\n<img />\n<p>Over three hours of continuous agent work, GPU power averaged 41 W and peaked at 74 W. The temperature averaged 55 °C and peaked at 67 °C, and the graphics clock held near 2 GHz from the first hour to the last, with no sign of thermal throttling. That is a modest, stable power draw for sustained inference.</p>\n<h2>The setting that matters most: one request at a time</h2>\n<p>With two requests running at once, each request's decode steps share the GPU with the other request's 8,192-token prefill chunks, and two long conversations push each other's prefixes out of the cache. With one, a reply decodes at full speed and its conversation stays cached. I ran the same OpenCode task with each setting:</p>\n<img />\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>First 70 minutes</th><th>Two requests at a time</th><th>One request at a time</th></tr></thead><tbody><tr><td>Requests completed</td><td>74</td><td><strong>111</strong></td></tr><tr><td>Output tokens</td><td>45K</td><td><strong>64K</strong></td></tr><tr><td>Input from the prefix cache</td><td>33%</td><td><strong>62%</strong></td></tr><tr><td>Decode per request</td><td>9.7 tok/s</td><td><strong>29.0 tok/s</strong></td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>One request at a time completed 50% more requests and 42% more output in the same time, and per-request decode held between 25 and 38 tokens a second. The agent's subagents don't run in a fixed order, so the two runs reached their busy phases at different moments; take the exact margin as indicative. A synthetic replay agrees on the direction for long conversations: two conversations of 135K and 90K tokens finished 2.8 times sooner with one request at a time. For six short conversations with 200-token replies, two at a time was faster (214 against 297 seconds), so if your agent sends many small requests, measure both.</p>\n<h2>What you're running</h2>\n<p>The rest of this post is the setup, step by step.</p>\n<p><a href=\"https://huggingface.co/Qwen/Qwen3.8-27B\" rel=\"noopener\" target=\"_blank\">Qwen3.8-27B</a> is a 27-billion-parameter dense model from Qwen under the Apache 2.0 license. My <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/4563387\" rel=\"noopener\" target=\"_blank\">H100 post</a> describes its architecture. The part that matters most here is its hybrid attention: 48 of its 64 layers keep a fixed-size state instead of a per-token KV cache, which is why a full-length context fits in 12 GiB.</p>\n<p>Two checkpoints, both pinned to a revision:</p>\n<ul>\n<li><strong>The model:</strong> <a href=\"https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4\" rel=\"noopener\" target=\"_blank\"><code>unsloth/Qwen3.8-27B-NVFP4</code></a> at revision <code>16b6615</code>, Unsloth's Dynamic V3.0 NVFP4 quantization: 19.1 GB of weights. It's a preview release from Unsloth, not an official Qwen checkpoint, so treat quality and speed results as results for this checkpoint.</li>\n<li><strong>The draft model:</strong> <a href=\"https://huggingface.co/incoai/Qwen3.8-27B-DFlash2\" rel=\"noopener\" target=\"_blank\"><code>incoai/Qwen3.8-27B-DFlash2</code></a> at revision <code>015e795</code>, a 1.86B-parameter DFlash 2 drafter that proposes seven tokens per pass. vLLM quantizes it to FP8 when it loads.</li>\n</ul>\n<h2>Step 1: Prepare Windows</h2>\n<p>The stack runs in Docker Desktop with the WSL 2 backend, which runs an ARM64 Linux engine on this laptop. Install NVIDIA's current Windows driver and the NVIDIA app, set <strong>Dedicated GPU Memory (GB)</strong> to 32 under <strong>System</strong> &gt; <strong>Advanced</strong> in the app, and restart. Then install Docker Desktop and cap the WSL virtual machine's memory in <code>%UserProfile%\\.wslconfig</code> (the sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/config/wslconfig.example\" rel=\"noopener\" target=\"_blank\"><code>config/wslconfig.example</code></a>):</p>\n[wsl2]\nmemory=12GB\nswap=8GB\n\n[experimental]\nautoMemoryReclaim=dropCache\n<p>Run <code>wsl --shutdown</code> after changing it. The cap matters on unified memory. The GPU reservation and the shared GPU memory come out of the same 64 GB as Windows and WSL, so a VM that grows freely competes with the model. With 12 GB for WSL, Windows kept at least 3.5 GiB available through three hours of agent traffic.</p>\n<p>Two habits help:</p>\n<ul>\n<li><strong>Stop the model before large downloads or image builds.</strong> They need memory of their own; pulling the weights while vLLM was running left Windows short of memory.</li>\n<li><strong>Let it start in peace.</strong> Free memory dips to about 1 GiB for a moment while vLLM captures CUDA graphs at startup, and then recovers.</li>\n</ul>\n<h2>Step 2: Serve the model with vLLM</h2>\n<p>The model image (<a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/images/vllm/Dockerfile\" rel=\"noopener\" target=\"_blank\"><code>images/vllm/Dockerfile</code></a>) builds on <code>vllm/vllm-openai:v0.31.0</code> and downloads both checkpoints into the image at pinned revisions, so the stack starts offline. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/compose.yaml\" rel=\"noopener\" target=\"_blank\"><code>compose.yaml</code></a> runs vLLM and the LiteLLM gateway:</p>\ndocker compose build\ndocker compose up -d\n<p>This is the serve command:</p>\nvllm serve /models/Qwen3.8-27B-NVFP4 \\\n  --served-model-name qwen3.8-27b \\\n  --quantization compressed-tensors \\\n  --trust-remote-code \\\n  --max-model-len 262144 \\\n  --kv-cache-memory-bytes 12616466432 \\\n  --gpu-memory-utilization 0.05 \\\n  --kv-cache-dtype fp8 \\\n  --block-size 64 \\\n  --max-num-seqs 1 \\\n  --max-num-batched-tokens 8192 \\\n  --enable-prefix-caching \\\n  --speculative-config '{\"method\":\"dflash\",\"model\":\"/models/Qwen3.8-27B-DFlash2\",\"num_speculative_tokens\":7,\"quantization\":\"fp8\"}' \\\n  --limit-mm-per-prompt '{\"image\":{\"count\":4,\"width\":1024,\"height\":1024},\"video\":0}' \\\n  --mm-processor-cache-gb 0.25 \\\n  --reasoning-parser qwen3 \\\n  --enable-auto-tool-choice --tool-call-parser qwen3_coder\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Flag</th><th>Why</th></tr></thead><tbody><tr><td><code>--quantization compressed-tensors</code></td><td>The NVFP4 checkpoint's format.</td></tr><tr><td><code>--max-model-len 262144</code></td><td>The model's native context window.</td></tr><tr><td><code>--kv-cache-memory-bytes 12616466432</code></td><td>An 11.75-GiB cache: 740 blocks, 263,927 tokens, one full-length request. On unified memory an explicit size is more predictable than a share of \"GPU memory\".</td></tr><tr><td><code>--gpu-memory-utilization 0.05</code></td><td>With an explicit cache size, vLLM uses this value for its startup memory check, not to size the cache. A low value keeps that check below the Windows GPU reservation.</td></tr><tr><td><code>--kv-cache-dtype fp8</code></td><td>Half the bytes per cached token.</td></tr><tr><td><code>--block-size 64</code></td><td>Needed for DFlash 2. Without it, vLLM pads the drafter's 64-token pages to the model's 1,648-token hybrid page, and a 196,608-token request needed 13.5 GiB of cache instead of 9.2.</td></tr><tr><td><code>--max-num-seqs 1</code></td><td>One request at a time; others wait in the queue. This let the coding agent complete 50% more requests in the same time, as measured above.</td></tr><tr><td><code>--max-num-batched-tokens 8192</code></td><td>The prefill chunk per step.</td></tr><tr><td><code>--enable-prefix-caching</code></td><td>Reuses the cached prefix of a conversation, so each agent turn computes only what's new.</td></tr><tr><td><code>--speculative-config</code></td><td>DFlash 2 drafts seven tokens in one pass. <code>\"quantization\":\"fp8\"</code> saved 1.73 GiB of memory and decoded slightly faster than BF16.</td></tr><tr><td><code>--limit-mm-per-prompt</code>, <code>--mm-processor-cache-gb 0.25</code></td><td>Up to four images per prompt, with a small image-processing cache instead of the 4-GiB default, which vLLM keeps in two processes.</td></tr><tr><td><code>--reasoning-parser</code>, <code>--tool-call-parser</code></td><td>Thinking returned separately from the answer, and OpenAI-style tool calls.</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>When it's ready, the startup log reports 263,927 tokens of KV cache, 1.01 full-length requests.</p>\n<h2>Step 3: Make decode fast</h2>\n<p>On this laptop, decode speed is a question of bytes. Each decode step reads the model's weights once, and speculative decoding lets one step produce several tokens: a small draft model guesses ahead, and the big model checks all the guesses in the same pass. So:</p>\n<p><em>tokens per second ≈ effective bandwidth ÷ bytes read per step × tokens accepted per step</em></p>\n<p>I calibrated the effective bandwidth on the first setup I ran: 203 GB/s, 89% of the measured 229. With that, the formula predicted the DFlash 2 result within 3% before I measured it. The measurements are the two single-request benchmarks from How I measured, not agent traffic:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>On vLLM 0.31</th><th>MTP, 3 draft tokens</th><th>DFlash 2, 7 draft tokens, FP8 drafter</th></tr></thead><tbody><tr><td>Bytes read per step</td><td>25.5 GB: the model, plus the MTP head and output layer three times</td><td>~22.3 GB: the model, the drafter and the output layer once each</td></tr><tr><td>Tokens per step, code benchmark</td><td>3.30</td><td>5.04</td></tr><tr><td>Predicted</td><td>26.3 tok/s</td><td>45.9 tok/s</td></tr><tr><td>Measured, code benchmark</td><td>28.4 tok/s</td><td><strong>44.7 tok/s</strong></td></tr><tr><td>Measured, 98K-token prompt benchmark</td><td>29.4 tok/s</td><td><strong>44.3 tok/s</strong></td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The model's built-in multi-token prediction (MTP) head reads the output layer once per draft token. DFlash 2 drafts its seven-token block in one pass, so each step reads fewer bytes and accepts more tokens. From the MTP setup I started with (26.4 tokens a second on vLLM 0.24) to DFlash 2 on vLLM 0.31, the code benchmark got 69% faster; the vLLM upgrade alone was worth about 8%.</p>\n<p>Prefill, reading a new prompt, ran at 1,000–1,400 tokens a second on the 34K- and 98K-token benchmark prompts and slowed to 645 on a brand-new 240,000-token prompt, which took about six minutes to its first token. A follow-up turn that reused that prompt started in 4.9 seconds. Coding agents resend the conversation with every turn, so in practice the prefix cache does most of that work.</p>\n<h2>Step 4: Connect a coding agent</h2>\n<p>LiteLLM serves the model under a stable alias, <code>local-llm</code>, on port 4000, so clients don't change when the model does. This is the provider block for <a href=\"https://opencode.ai/\" rel=\"noopener\" target=\"_blank\">OpenCode</a>, an open-source coding agent, from the sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/config/opencode.json\" rel=\"noopener\" target=\"_blank\"><code>config/opencode.json</code></a>; use <code>127.0.0.1</code> on the laptop itself, or its LAN address from another machine:</p>\n{\n  \"$schema\": \"https://opencode.ai/config.json\",\n  \"model\": \"litellm-local/local-llm\",\n  \"small_model\": \"litellm-local/local-llm\",\n  \"provider\": {\n    \"litellm-local\": {\n      \"npm\": \"@ai-sdk/openai-compatible\",\n      \"name\": \"Local LiteLLM (Qwen3.8-27B)\",\n      \"options\": { \"baseURL\": \"http://127.0.0.1:4000/v1\", \"apiKey\": \"none\", \"timeout\": false },\n      \"models\": {\n        \"local-llm\": {\n          \"name\": \"Qwen3.8-27B (local)\",\n          \"reasoning\": true,\n          \"tool_call\": true,\n          \"limit\": { \"context\": 262144, \"output\": 16384 },\n          \"modalities\": { \"input\": [\"text\", \"image\"], \"output\": [\"text\"] }\n        }\n      }\n    }\n  }\n}\n<p>The context limit tells OpenCode when to compact the conversation, and the 16K output cap covered every reply in the three-hour session with room to spare: the largest used 7,300 tokens. LiteLLM binds to localhost by default and has no authentication of its own, so if you open it to your network (<code>LITELLM_HOST_BIND</code> in the sample's <code>.env</code>), restrict the port to a trusted subnet in Windows Firewall.</p>\n<p>Before handing it real work, I checked it. A smoke test returned an exact answer, read an image and made a required tool call through LiteLLM; the sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/scripts/Test-LocalLlm.ps1\" rel=\"noopener\" target=\"_blank\"><code>scripts/Test-LocalLlm.ps1</code></a> runs those three checks through the gateway. My local evaluation suites passed 15 of 16 basic cases, 4 of 5 large-context cases and 5 of 5 complex-reasoning cases, the same cases as the MTP setup on the same vLLM version. A needle placed at the very start of a 239,685-token prompt came back correct.</p>\n<h2>Step 5: Watch it</h2>\n<p>A server has memory of its own and a GPU with memory of its own. On this laptop one 64 GB pool feeds Windows, WSL, the GPU's share and the shared GPU memory Windows adds on top, so the signals that matter cross the line between the model and the operating system. The monitoring follows the earlier posts, adapted to Windows on Arm, and the <a href=\"https://github.com/1w2w3y/wuyi-labs/tree/main/2610-rtx-qwen-38-27b\" rel=\"noopener\" target=\"_blank\">sample</a> has every piece of it.</p>\n<h3>What runs where</h3>\nWindows on Arm\n  nvidia-smi -&gt; Export-NvidiaGpuMetrics.ps1, every 5 s -&gt; textfile -&gt; windows_exporter :9182\nDocker Desktop (WSL 2)\n  vLLM /metrics    LiteLLM /metrics/ and spans    OpenTelemetry Collector (linux/arm64):\n                                                    scrapes all three every 10 s, receives the spans\n                                                    |  OTLP, Microsoft Entra ID\n                                                    v\nApplication Insights with OTLP support\n  metrics -&gt; Azure Monitor workspace -&gt; Azure Managed Grafana dashboard, Prometheus alert rules\n  traces  -&gt; Application Insights\n<ul>\n<li><strong>vLLM</strong> reports tokens, the prefix cache, the queue, KV cache usage and speculative decoding, down to how often each draft position is accepted.</li>\n<li><strong>LiteLLM</strong> reports what the gateway answered, and the sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/litellm/request_log_callback.py\" rel=\"noopener\" target=\"_blank\">callback</a> logs one line per request with its tokens, time to first token and status. When requests go missing, that is the count to compare with vLLM's. It also sends a span for every model call over OTLP.</li>\n<li><strong>windows_exporter</strong> reports the memory Windows has available and the GPU's dedicated and shared memory, as Windows sees them.</li>\n<li><strong>GPU power, temperature and clocks</strong> come from <code>nvidia-smi</code>. DCGM, which the H100 posts used, isn't available on Windows, so <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/scripts/Export-NvidiaGpuMetrics.ps1\" rel=\"noopener\" target=\"_blank\">a small PowerShell script</a>, run as a scheduled task, polls <code>nvidia-smi</code> and writes Prometheus text that windows_exporter's textfile collector serves. On RTX Spark, <code>nvidia-smi</code> also lists the NPU, with a temperature of its own; the script keeps only the GPU, so <code>max()</code> over these series means the GPU.</li>\n</ul>\n<h3>Send it to Azure Monitor</h3>\n<p>The sample uses the same collector as the H100 posts: the <a href=\"https://opentelemetry.io/docs/collector/\" rel=\"noopener\" target=\"_blank\">OpenTelemetry Collector</a>, contrib distribution, as a linux/arm64 container next to the model. It scrapes the three Prometheus endpoints, receives LiteLLM's spans, labels everything with the laptop's name, and keeps only the Windows series the dashboard and alerts use, since Azure Monitor bills per sample ingested. Then it sends both signals over OTLP to an Application Insights resource with OTLP support: metrics land in its Azure Monitor workspace as <a href=\"https://learn.microsoft.com/azure/azure-monitor/metrics/prometheus-metrics-overview\" rel=\"noopener\" target=\"_blank\">Azure Monitor managed service for Prometheus</a> data, and traces in Application Insights.</p>\n<p>Without a managed identity on the laptop, the collector signs in as a Microsoft Entra ID application, which needs the Monitoring Metrics Publisher role on the data collection rule that Application Insights creates. The part that talks to Azure Monitor, abridged from the sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/observability/otelcol/config.yaml\" rel=\"noopener\" target=\"_blank\"><code>observability/otelcol/config.yaml</code></a>:</p>\nextensions:\n  azure_auth:\n    service_principal:\n      tenant_id: ${env:AZURE_TENANT_ID}\n      client_id: ${env:AZURE_CLIENT_ID}\n      client_secret: ${env:AZURE_CLIENT_SECRET}\n    scopes: [https://monitor.azure.com/.default]\n\nprocessors:\n  resource:\n    attributes:\n      - {key: microsoft.applicationId, value: \"${env:AZMON_APPLICATION_ID}\", action: upsert}\n\nexporters:\n  otlp_http/azuremonitor:\n    traces_endpoint: ${env:AZMON_TRACES_ENDPOINT}\n    metrics_endpoint: ${env:AZMON_METRICS_ENDPOINT}\n    auth:\n      authenticator: azure_auth\n<p><a href=\"https://learn.microsoft.com/azure/azure-monitor/containers/opentelemetry-protocol-ingestion\" rel=\"noopener\" target=\"_blank\">Ingest OTLP data into Azure Monitor with the OpenTelemetry Collector</a> walks through creating the resource, and my <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/4563387\" rel=\"noopener\" target=\"_blank\">H100 post</a> covers the details that tripped me up there. Two matter here. OTLP histograms arrive as native histograms, with no <code>_sum</code> or <code>_count</code> series, so a query reads <code>histogram_sum(...)</code> where remote-written data would use <code>_sum</code>. And each model call's span carries its token counts and time to first token; with message capture off it carries no prompts or responses, but it does carry the tool definitions the agent declares, so decide whether that's acceptable in your Application Insights resource.</p>\n<h3>The dashboard</h3>\n<p>I built the dashboard in these screenshots for this post through the <a href=\"https://aka.ms/amg-mcp\" rel=\"noopener\" target=\"_blank\">Azure Managed Grafana MCP server</a>: I described the panels and an agent created them with <code>amgmcp_dashboard_update</code>. The sample has it as <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/observability/grafana/rtx-spark-qwen38.json\" rel=\"noopener\" target=\"_blank\">JSON to import</a> into any Azure Managed Grafana instance that reads your workspace, with its queries written for OTLP's native histograms. On a laptop, a few questions matter more than on a server:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Question</th><th>PromQL</th></tr></thead><tbody><tr><td>Is the GPU spilling into system memory?</td><td><code>max(windows_gpu_adapter_memory_shared_bytes{phys=\"0\"})</code></td></tr><tr><td>Is Windows running short?</td><td><code>min(windows_memory_available_bytes)</code></td></tr><tr><td>How fast does a reply decode?</td><td><code>histogram_sum(sum(increase(vllm:request_generation_tokens[10m]))) / histogram_sum(sum(increase(vllm:request_decode_time_seconds[10m])))</code></td></tr><tr><td>How many tokens does each step produce?</td><td><code>1 + sum(rate(vllm:spec_decode_num_accepted_tokens_total[5m])) / sum(rate(vllm:spec_decode_num_drafts_total[5m]))</code></td></tr><tr><td>Is the drafter's first guess landing?</td><td><code>sum(increase(vllm:spec_decode_num_accepted_tokens_per_pos_total{position=\"0\"}[1h])) / sum(increase(vllm:spec_decode_num_drafts_total[1h]))</code></td></tr><tr><td>Are requests queuing?</td><td><code>max(vllm:num_requests_waiting)</code></td></tr><tr><td>How much power, how hot?</td><td><code>max(nvidia_gpu_power_draw_watts)</code>, <code>max(nvidia_gpu_temperature_celsius)</code></td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>The decode-speed query divides the generated tokens of finished requests by their decode time. Both come from vLLM's per-request histograms, so the result doesn't depend on histogram buckets or on how many tokens each speculative step produced.</p>\n<p>Read the memory panels together. GPU memory in use against the GPU's share says whether the model and its cache fit the reservation, shared GPU memory says how much Windows backs with system memory, and the memory Windows has available says what's left for everything else. Any one of them alone can look fine while the pool runs out.</p>\n<p>The same MCP server can answer questions about the data, too: <code>amgmcp_prometheus_query</code> runs PromQL against the workspace, so an agent can tell you when requests started waiting during a session and how much memory Windows had at that moment. My <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/4563387\" rel=\"noopener\" target=\"_blank\">H100 post</a> covers what else it can do.</p>\n<h3>Alerts</h3>\n<p>A long agent run is a job you walk away from, and Azure Monitor evaluates Prometheus alert rules against the workspace whether or not you're looking at the dashboard. The sample's <a href=\"https://github.com/1w2w3y/wuyi-labs/blob/main/2610-rtx-qwen-38-27b/observability/alerts/local-llm-alerts.bicep\" rel=\"noopener\" target=\"_blank\"><code>local-llm-alerts.bicep</code></a> deploys four as a rule group:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Alert</th><th>Fires when</th><th>Why</th></tr></thead><tbody><tr><td>Windows memory low</td><td>Windows has had under 2 GiB available for 5 minutes</td><td>Windows, WSL, the GPU's share and shared GPU memory draw on one pool.</td></tr><tr><td>Slow first token</td><td>The mean time to first token over 10 minutes passes 2 minutes</td><td>The agent dropped requests that waited about five minutes, and neither server logged an error.</td></tr><tr><td>Preemptions</td><td>vLLM preempted a request in the last 10 minutes</td><td>The KV cache ran out of room, and the work will be recomputed.</td></tr><tr><td>Stale GPU metrics</td><td>The GPU metrics haven't updated for 5 minutes</td><td>The collector stopped, and windows_exporter keeps serving its last file.</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>Each rule groups by the laptop's name, so one rule group covers every laptop that writes to the workspace, and a laptop that's asleep raises nothing.</p>\n<h2>Getting the most out of it</h2>\n<p><strong>Keep subagent fan-out modest.</strong> The Yoga 9n is at its best with one conversation at a time. When the agent started 12 to 18 subagents at once, the request on the GPU kept decoding at 22–29 tokens a second, but the others waited their turn, and the mean time to a first token grew to about five minutes. In OpenCode, the <code>task</code> permission controls subagents. Deny it, or ask for fewer parallel subagents, for work you run locally, and keep wide fan-out for a data-center GPU.</p>\n<p><strong>Watch for long waits.</strong> The client dropped requests that had waited about five minutes, and neither server recorded an error: vLLM counted no aborts, and its access log showed <code>200</code>, which a streaming response sends before its first token. Compare the requests arriving at vLLM with the requests the gateway answers; a gap is your sign. I haven't confirmed which layer sets the limit. LiteLLM's timeouts were an hour, and the OpenCode provider block above turns its own timeout off, which points to the client's HTTP stack giving up while it waits for response headers: LiteLLM appears to send them only with the first token.</p>\n<p><strong>Leave Windows some memory.</strong> Keep a few GiB free for Windows while the model runs, and stop it before large downloads or builds.</p>\n<p><strong>Mind the thinking.</strong> Nearly three-quarters of the output was reasoning. For routine edits, a lower <code>reasoning_effort</code> in the client can save more time than tuning the server.</p>\n<h2>Laptop or H100?</h2>\n<p>They're built for different jobs, and the laptop is well matched to its own. The H100 in the earlier post served many sessions at once and peaked at about 1,550 output tokens a second across 32 requests. The Yoga 9n serves one developer's coding session at about 27 tokens a second per request in real agent work, and 44.7 on short code generation, with the model's full context, on the machine that developer already carries, and with no hourly bill. The model runs locally, so requests are served on the laptop instead of by a model provider.</p>\n<p>The two setups differ in checkpoint, draft method and vLLM version as well as hardware, so read this as two working configurations, not a like-for-like benchmark:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>&nbsp;</th><th>Lenovo Yoga 9n 2-in-1</th><th>Azure H100 NVL VM</th></tr></thead><tbody><tr><td>Running cost</td><td>The laptop's own power</td><td>$6.98–$10.12 an hour pay-as-you-go: about $5,100 a month or more if it stays on</td></tr><tr><td>Where requests are served</td><td>On the laptop</td><td>In an Azure region</td></tr><tr><td>Memory for the model</td><td>32 GB GPU share of 64 GB unified memory</td><td>94 GB of HBM</td></tr><tr><td>Checkpoint</td><td>Unsloth NVFP4 preview</td><td>Qwen FP8</td></tr><tr><td>Speculative decoding</td><td>DFlash 2, 7 draft tokens</td><td>MTP, 3 draft tokens</td></tr><tr><td>vLLM</td><td>0.31 (official ARM64 image)</td><td>0.24 (NVIDIA NGC 26.07)</td></tr><tr><td>KV cache</td><td>263,927 tokens: one full-length request</td><td>1.45M tokens</td></tr><tr><td>One short request, thinking off</td><td>44.7 tok/s on the code benchmark</td><td>About 166 tok/s in the smoke test</td></tr><tr><td>Best for</td><td>One developer's interactive coding sessions</td><td>A team, wide subagent fan-out, throughput</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The running cost is the October 2026 pay-as-you-go Linux price of <code>Standard_NC40ads_H100_v5</code>, which depends on the region. The earlier post ran it as a Spot VM for about $2 an hour, but Azure can evict Spot capacity with 30 seconds' notice.</p>\n<h2>Rules of thumb</h2>\n<ul>\n<li><strong>Buy for memory.</strong> 64 GB of unified memory and its bandwidth are what make a 27B model practical. The CPU and GPU core counts matter less for this job.</li>\n<li><strong>Count bytes per step.</strong> Decode speed is roughly bandwidth divided by the bytes each step reads, times the tokens it accepts. A drafter that reads less and accepts more, like DFlash 2 in FP8, was the biggest lever I measured.</li>\n<li><strong>Run one request at a time for one agent.</strong> It keeps decode fast and the conversation cached.</li>\n<li><strong>Watch shared GPU memory and the memory Windows has available</strong> next to the KV cache. On unified memory, they're the same pool.</li>\n</ul>\n<h2>The bottom line</h2>\n<p>The Lenovo Yoga 9n 2-in-1 with RTX Spark makes a local 27B coding model practical. Its 64 GB of fast unified memory is the reason: Qwen3.8-27B, a draft model and the full 262,144-token context fit on the laptop, short code generation decodes at 44.7 tokens a second, and a real agent code review held at about 27 tokens a second per request for three hours at an average of 41 W of GPU power.</p>\n<p>For a developer who wants a capable coding model on their own machine, it's an easy configuration to recommend. Choose the 64 GB model, run one agent session at a time, and in my testing it made a dependable everyday coding machine.</p>\n<h2>Try it</h2>\n<ul>\n<li><strong>Sample code:</strong> <a href=\"https://github.com/1w2w3y/wuyi-labs/tree/main/2610-rtx-qwen-38-27b\" rel=\"noopener\" target=\"_blank\">wuyi-labs/2610-rtx-qwen-38-27b</a>, with the Compose files, the model image, the LiteLLM configuration, the OpenCode provider block, the OpenTelemetry Collector and windows_exporter configuration, the GPU metrics script, the dashboard, the alert rules, the smoke test and the speed benchmark.</li>\n<li><strong>Agent load:</strong> <a href=\"https://github.com/1w2w3y/wuyi-labs/tree/main/agent-bench\" rel=\"noopener\" target=\"_blank\">agent-bench</a> drives read-only OpenCode reviews of microsoft/agent-framework and microsoft/TypeScript through your gateway, and reports the load and how much review work the agents finished.</li>\n<li><strong>The machine:</strong> <a href=\"https://www.lenovo.com/us/en/p/laptops/yoga/yoga-2-in-1-series/yoga-9n-2-in-1-gen-11-16-inch-nvidia/83n7cto1wwus1\" rel=\"noopener\" target=\"_blank\">Lenovo's product page for the Yoga 9n 2-in-1 (16\", 11)</a>, where you can configure one to order, and <a href=\"https://www.bestbuy.com/product/lenovo-yoga-9n-2-in-1-16-3k-oled-touchscreen-laptop-nvidia-rtx-spark-n1x-20-core-2026-64gb-memory-1tb-storage-cosmic-blue/J3PT7W54S2/sku/6687121\" rel=\"noopener\" target=\"_blank\">Best Buy's listing for the 64 GB configuration</a>.</li>\n<li><strong>The model:</strong> <a href=\"https://huggingface.co/Qwen/Qwen3.8-27B\" rel=\"noopener\" target=\"_blank\">Qwen3.8-27B</a>, <a href=\"https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4\" rel=\"noopener\" target=\"_blank\">Unsloth's NVFP4 checkpoint</a> and the <a href=\"https://huggingface.co/incoai/Qwen3.8-27B-DFlash2\" rel=\"noopener\" target=\"_blank\">DFlash 2 drafter</a>.</li>\n<li><strong>The earlier posts:</strong> <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-27b-on-a-2-h100-azure-spot-vm-does-it-pay-off/4563387\" rel=\"noopener\" target=\"_blank\">Qwen3.8-27B on a $2 H100 Azure Spot VM: does it pay off?</a> for the server setup and its monitoring, and <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/qwen3-8-flash-next-on-two-h100s-in-an-azure-spot-vm/4563893\" rel=\"noopener\" target=\"_blank\">Qwen3.8-Flash-Next on two H100s in an Azure Spot VM</a> for KV cache sizing under agent load.</li>\n<li><strong>Monitoring:</strong> <a href=\"https://learn.microsoft.com/azure/azure-monitor/containers/opentelemetry-protocol-ingestion\" rel=\"noopener\" target=\"_blank\">Ingest OTLP data into Azure Monitor with the OpenTelemetry Collector</a>, <a href=\"https://learn.microsoft.com/azure/azure-monitor/metrics/prometheus-metrics-overview\" rel=\"noopener\" target=\"_blank\">Azure Monitor managed service for Prometheus</a> and the <a href=\"https://aka.ms/amg-mcp\" rel=\"noopener\" target=\"_blank\">Azure Managed Grafana MCP server</a>.</li>\n<li><strong>The agent:</strong> <a href=\"https://opencode.ai/\" rel=\"noopener\" target=\"_blank\">OpenCode</a> and its <a href=\"https://opencode.ai/docs/permissions/\" rel=\"noopener\" target=\"_blank\">permissions</a>.</li>\n</ul>"
  "f807cc325f885f43dce0ae48d545882b":
    "id": "f807cc325f885f43dce0ae48d545882b"
    "title": "Bringing AI-Powered SRE to Your On-Premise Server Estate For Unifying Ops"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/bringing-ai-powered-sre-to-your-on-premise-server-estate-for/ba-p/4566884"
    "published": "2026-10-27 00:15:49"
    "fetched": "2026-10-27 15:55:26"
    "summary": "<h2>The problem nobody talks about at cloud conferences</h2>\n<p>Walk the floor at any cloud event and you'll hear a lot about AI-assisted operations: agents that triage alerts, correlate signals, and hand your on-call engineer a root cause instead of a wall of logs. It's genuinely useful. But there's a quiet assumption — that the workload lives in the cloud.</p>\n<p>Meanwhile, back in the real world, a huge amount of enterprise compute still runs on-premises. Manufacturing, engineering and EPC firms, banks, hospitals, government — they keep critical systems in their own data centers for reasons that aren't going away: latency to plant-floor or trading systems, data gravity, data-residency rules, and decade-old SQL Server estates that nobody is going to re-platform on a whim.</p>\n<p><u><em>The question that naturally follows is whether modern, AI-driven operations have to stop at the cloud boundary — or whether that same intelligence can be extended to the servers running in your own facilities.</em></u></p>\n<p><span class=\"lia-text-color-12\"><strong><u><em>The Question - This AI SRE stuff sounds great. But many of </em></u></strong><u><em><strong>i</strong></em><strong><em>mportant </em></strong></u><strong><u><em>servers aren't in Azure — they're sitting in my rack. Is any of this actually for me?\"</em></u></strong></span></p>\n<p><span class=\"lia-text-color-12\"><u><em><strong>Answer is - It Is</strong></em></u> </span>- And this is the point worth being clear about:&nbsp;<span>this is not a cut-down experience.</span>&nbsp;When you bring an on-premises server into Azure's management plane through Azure Arc, the Azure SRE Agent can apply essentially its full operations capability set to that server — continuous monitoring, incident detection and response, root-cause analysis, guided and automated remediation, patch planning, inventory and drift tracking, configuration assessment, and more — for both&nbsp;<span>Windows and Linux</span>.</p>\n<p>The rest of this post explains how that works, what the agent can do, and then grounds it with four sample reports from real Arc-enabled server</p>\n<h2>What the Azure SRE Agent is — and why \"agent\" is the right word</h2>\n<p>\"AI agent\" gets used loosely, so let's be precise. The SRE Agent isn't a chatbot bolted onto a dashboard. It's an operations agent that works the way a strong site reliability engineer works:</p>\n<ul>\n<li>It&nbsp;<span>watches</span>&nbsp;your estate continuously and reacts to signals and alerts.</li>\n<li>It&nbsp;<span>gathers the evidence</span>&nbsp;itself — metrics, logs, events, inventory — instead of making you chase it across tools.</li>\n<li>It&nbsp;<span>correlates and diagnoses</span>, lining up performance data with error events across an incident's timeline so patterns surface.</li>\n<li>It&nbsp;<span>explains the root cause</span>&nbsp;in writing — the&nbsp;<em>why</em>, not just a graph of the&nbsp;<em>what</em>.</li>\n<li>It&nbsp;<span>recommends next steps</span>, and where you allow it,&nbsp;<span>takes action</span>&nbsp;— with human-in-the-loop approvals and a full audit trail.</li>\n<li>Automated incident intake from Azure Monitor, driven by a response plan</li>\n<li>You&nbsp;<span>drive all of it in plain language</span>&nbsp;— ask it a question the way you'd ask a colleague, no query language required.</li>\n</ul>\n<p>The capability that makes the whole on-premises story possible is simple:&nbsp;<span>the agent doesn't care where a server physically lives.</span>&nbsp;It cares whether that server exposes telemetry it can reason over and resources it can act on. Provide those, and an Arc-enabled box in your data center is, to the agent, just another Azure resource.</p>\n<h2>How This Can Be Done? The bridge: Azure Arc</h2>\n<p>Azure Arc projects your on-premises (and multi-cloud) servers into Azure as&nbsp;<span>first-class resources</span>. Once a server is Arc-enabled it appears in the portal, honors Azure role-based access control and policy, and — the part we care about — becomes reachable by Azure's monitoring and management services&nbsp;<em>and</em>&nbsp;by the SRE Agent.</p>\n<p>That one step is what unlocks everything else, and it works equally for&nbsp;<span>Windows and Linux</span>&nbsp;— which matters in the real world, where a Windows Server running SQL and IIS usually sits right next to Oracle Linux or RHEL boxes doing everything else.</p>\n<p>And to be clear about what Arc is&nbsp;<em>not</em>: it is not a migration. Your workload stays exactly where it is. You're giving Azure a secure window into the server, not moving the server.</p>\n<h2>The rule that makes or breaks everything: telemetry first</h2>\n<p><span class=\"lia-text-color-6\"><em><strong>The SRE Agent is only as good as the telemetry you give it. Starve it of data and it will — honestly — tell you it doesn't have enough to go on.</strong></em></span></p>\n<p>An SRE Agent with no Windows Event Logs is like an on-call engineer who's told there's an outage but isn't allowed to open Event Viewer. The agent isn't wrong in that situation; it's blind. So before you judge the output, build the data foundation.</p>\n<p>Here's what \"properly instrumented\" looks like for a hybrid estate:</p>\n<p><span>Windows servers</span></p>\n<ul>\n<li><span>Azure Monitor Agent (AMA)</span>&nbsp;deployed via Arc.</li>\n<li><span>Data Collection Rules (DCRs)</span>&nbsp;capturing Guest OS performance metrics,&nbsp;<span>Windows Event Logs</span>&nbsp;(System/Application/Security — the backbone of Windows diagnosis), and workload logs like&nbsp;<span>IIS</span>&nbsp;and&nbsp;<span>SQL</span>.</li>\n</ul>\n<p><span>Linux servers</span></p>\n<ul>\n<li><span>Azure Monitor Agent</span>&nbsp;plus the&nbsp;<span>Linux agent and required extensions</span>.</li>\n<li><span>DCRs</span>&nbsp;capturing&nbsp;<span>syslog</span>, performance metrics, and&nbsp;<span>package/inventory data</span>.</li>\n</ul>\n<p><span>Both</span></p>\n<ul>\n<li>A&nbsp;<span>Log Analytics workspace</span>&nbsp;as the destination — the single store the agent queries.</li>\n<li>The relevant&nbsp;<span>Azure management services</span>&nbsp;enabled — Azure Monitor,&nbsp;<span>Azure Update Manager</span>,&nbsp;<span>Change Tracking &amp; Inventory</span>,&nbsp;<span>SQL Best Practices Assessment</span>&nbsp;— each adding signals the agent can reason over.</li>\n</ul>\n<p>This is the Reference Diagram Which can be used for understanding this Architecture &amp; Configuration -&nbsp;</p>\n<img />Azure SRE Agent For On-Premises Servers\n<p><em>Windows and Linux servers are Arc-enabled and ship telemetry through their agents and Data Collection Rules into a Log Analytics workspace, enriched by Azure's management services. The Azure SRE Agent reasons and acts over all of it. The panel on the right is the agent's broad operations capability set — the starred (★) items are the four sample use cases demonstrated later in this post.</em></p>\n<h2>What you can actually do with it</h2>\n<p>With the foundation in place, the agent brings a broad operations capability set to your on-premises servers. This is the part to internalize: the four sample reports later are&nbsp;<span>examples</span>, not the boundary. The capability surface includes:</p>\n<ul>\n<li><span>Automated incident intake from Azure Monitor, driven by a response plan.</span>&nbsp;This is where it gets powerful. When Azure Monitor raises an alert or logs an incident against an Arc-enabled server — a memory threshold breached, a service down, a disk filling, an event-log signature — that incident is handed directly to the SRE Agent. The agent then acts on it according to a&nbsp;<span>response plan you define</span>: it picks up the incident, investigates automatically using the server's telemetry, works through the prescribed diagnostic and mitigation steps, and recommends. In effect, an alert that used to page a human at 3 a.m. now triggers an AI first responder that has already gathered the evidence and started working the playbook before anyone logs in.</li>\n<li><span>Alert-driven incident detection and response</span>&nbsp;— the agent reacts to signals and alerts and starts investigating, rather than waiting for a human to notice.</li>\n<li><span>Root-cause analysis</span>&nbsp;of failures, crashes, and degradations — correlating metrics, events, and logs into a written cause.&nbsp;<em>(<strong>Sample 1</strong>)</em></li>\n<li><span>Guided and automated remediation</span>&nbsp;— it proposes concrete fixes and, where you permit, executes them, always with approvals and an audit trail.</li>\n<li><span>Natural-language operations</span>&nbsp;— \"chat with your estate\": ask about a server's health, a recent change, or last night's spike, in plain English.</li>\n<li><span>Proactive health and performance monitoring</span>&nbsp;— surfacing emerging problems (memory pressure, disk, latency) before they become outages.</li>\n<li><span>Patch and update lifecycle planning</span>&nbsp;— pending updates, CVE risk, and an approval-ready maintenance plan for Windows and Linux together.&nbsp;<em>(<strong>Sample 2</strong>)</em></li>\n<li><span>Inventory and change / drift tracking</span>&nbsp;— what's installed, what changed, and which changes carry risk.&nbsp;<em>(<strong>Sample 3</strong>)</em></li>\n<li><span>Configuration and best-practice assessment</span>&nbsp;— measuring your setup against Microsoft guidance, by severity, with specific fixes.&nbsp;<em>(<strong>Sample 4</strong>)</em></li>\n<li><span>Security and vulnerability awareness</span>&nbsp;— spotting exposure such as missing patches, disabled firewalls, or weak settings.</li>\n<li><span>Capacity and resource optimization insights</span>&nbsp;— flagging under-provisioned or misconfigured resources.</li>\n<li><span>Operational reporting and documentation</span>&nbsp;— turning investigations into shareable, review-ready write-ups.</li>\n<li><span>Governance</span>&nbsp;— human-in-the-loop approvals and a full audit trail, so nothing happens behind your back.</li>\n</ul>\n<p>All of this against servers that never left your data center.</p>\n<h2>Four sample use cases: the agent's output on real Arc-enabled servers</h2>\n<p>Abstract capability lists don't convince anyone, so here are four concrete examples — each one a full report the agent produced, each showing a&nbsp;<em>different</em>&nbsp;facet of the broader capability set above. Treat them as a representative sample, not a complete list.</p>\n<h3>Sample 1 — Root-cause analysis: a recurring SQL Server memory crash</h3>\n<p>The classic on-call nightmare: a SQL Server instance keeps crashing and nobody's sure why. Instead of an engineer manually joining performance counters to event logs across a timeline, they simply asked the agent to investigate. Working only from telemetry already in Log Analytics, it reconstructed the whole story:</p>\n<ul>\n<li><span>Failure chain:</span>&nbsp;two SQL Server instances running with default, unbounded&nbsp;max server memory&nbsp;on a ~4 GB server → memory starvation → available memory collapsing to tens of MB → CPU pinned at 99–100% from page-fault thrashing → process crash and instant memory release, repeating across multiple events.</li>\n<li><span>Aggravating factors:</span>&nbsp;a confirmed&nbsp;<span>SSMS memory leak</span>, heavy agent overhead, and a missing \"Lock Pages in Memory\" privilege.</li>\n<li><span>The fix:</span>&nbsp;a prioritized&nbsp;<span>P0–P2 remediation plan</span>&nbsp;— cap memory, stop leaving SSMS open, add RAM, grant Lock Pages in Memory, consolidate instances.</li>\n</ul>\n<p>It reads like a post-incident review a senior engineer would write — assembled automatically.&nbsp;</p>\n<h3>Sample 2 — Patch and update lifecycle planning across Windows and Linux</h3>\n<p>Patch planning in a hybrid estate is tedious and high-stakes. Using&nbsp;<span>Azure Update Manager</span>&nbsp;data, the agent produced a single, CAB-ready plan spanning an Arc-connected Windows server and a Linux server:</p>\n<ul>\n<li><span>Assessment:</span>&nbsp;pending updates per server, classified and with reboot requirements. One cumulative update on Windows;&nbsp;<span>420 pending updates (200+ security) on Linux</span>&nbsp;across kernel, OpenSSH, OpenSSL, glibc, systemd, and more.</li>\n<li><span>Risk in plain terms:</span>&nbsp;it explained&nbsp;<em>why</em>&nbsp;the updates mattered — an actively exploited&nbsp;<span>zero-day</span>&nbsp;plus critical RCE fixes on Windows; a high-CVSS OpenSSH flaw, kernel privilege-escalation bugs, and bootloader issues on Linux.</li>\n<li><span>The plan:</span>&nbsp;maintenance configuration, reboot policy, a pre-patch checklist, a&nbsp;<span>risk matrix</span>, and a&nbsp;<span>phased timeline with verification</span>&nbsp;— formatted for Change Advisory Board sign-off.</li>\n</ul>\n<p>A document that normally eats an afternoon to assemble by hand.&nbsp;<em>[Attach: CAB update planning report]</em></p>\n<h3>Sample 3 — Inventory and change / drift tracking</h3>\n<p>\"What's installed on these servers, and what changed recently?\" is the first question you want answered when something breaks or an audit lands. Using&nbsp;<span>Change Tracking &amp; Inventory</span>&nbsp;data, the agent reported across a Windows and a Linux server:</p>\n<ul>\n<li>A&nbsp;<span>software and services inventory</span>&nbsp;per server.</li>\n<li>A&nbsp;<span>change summary</span>&nbsp;over the last 7 days — hundreds of additions, removals, and modifications.</li>\n<li><span>Risk-flagged recommendations</span>&nbsp;— e.g., a&nbsp;<span>stopped SQL Server Agent</span>&nbsp;service on Windows and a&nbsp;<span>disabled host firewall</span>&nbsp;on Linux.</li>\n</ul>\n<p>Drift detection and configuration visibility without logging into a single machine.&nbsp;<em>[Attach: change tracking &amp; inventory report]</em></p>\n<h3>Sample 4 — Configuration and best-practice assessment (SQL BPA)</h3>\n<p>A proactive one — preventing the next incident rather than reacting to one. Reading&nbsp;<span>SQL Best Practices Assessment</span>&nbsp;results, the agent evaluated two SQL instances against Microsoft's recommended configuration:</p>\n<ul>\n<li><span>Findings across every category</span>&nbsp;— configuration, performance, indexing, security, backup &amp; recovery, memory, tempdb — over a thousand in total.</li>\n<li><span>Severity grouping</span>&nbsp;(high vs. medium) so you know what's urgent.</li>\n<li><span>A specific fix per finding</span>&nbsp;— change recovery model, create an overdue full backup, defragment indexes, cap memory, address suspect pages — plus a&nbsp;<span>\"quick wins\"</span>&nbsp;shortlist.</li>\n</ul>\n<p>A sprawling assessment turned into a prioritized worklist the DBA can start on today.&nbsp;<em>[Attach: SQL BPA report]</em></p>\n<h2>Why this matters, pulled together</h2>\n<p>Each capability is useful alone. Together they add up to something strategic:&nbsp;<span>a single, AI-driven operating model that spans on-premises Windows, on-premises Linux, and native Azure — one way of working instead of several.</span></p>\n<p>Concretely, the payoff shows up as:</p>\n<ul>\n<li><span>Faster incident resolution</span>&nbsp;— the agent does first-pass evidence gathering and diagnosis, so engineers start from a hypothesis, not a blank page. At 3 a.m., that's a 20-minute triage instead of two hours.</li>\n<li><span>Fewer surprises</span>&nbsp;— proactive monitoring and best-practice assessment catch problems before they become outages.</li>\n<li><span>Clearer, safer change</span>&nbsp;— patching, with real risk and an approval-ready plan, across both operating systems at once.</li>\n<li><span>Visibility and control</span>&nbsp;— you can see what's installed, what changed, and what's exposed, with risk called out.</li>\n<li><span>Consistency</span>&nbsp;— the same quality of investigation and reporting regardless of where a server runs.</li>\n<li><span>Governance you can trust</span>&nbsp;— approvals and audit trails mean the agent assists your team, it doesn't go rogue.</li>\n</ul>\n<p>And none of it required migrating or re-platforming a single critical workload. The servers stayed put; you modernized&nbsp;<em>how you operate them</em>.</p>\n<h2>A generic adoption path (works for any estate)</h2>\n<p>You don't need the four sample scenarios to get started. Here's a general rollout any team can follow to bring the SRE Agent to their on-premises servers:</p>\n<ol>\n<li><span>Pick a representative scope.</span>&nbsp;Choose a Windows server and a Linux server with real, meaningful workloads — not a sandbox nobody cares about.</li>\n<li><span>Arc-enable them.</span>&nbsp;Connect each server through Azure Arc so it becomes a managed Azure resource.</li>\n<li><span>Deploy the agents and extensions.</span>&nbsp;AMA on Windows; AMA plus the Linux agent and extensions on Linux. Confirm they report healthy.</li>\n<li><span>Turn on the management services</span>&nbsp;that fit your goals — Azure Monitor, Update Manager, Change Tracking &amp; Inventory, SQL BPA, and so on. Enable what's relevant; you can add more later.</li>\n<li><span>Configure Data Collection Rules</span>&nbsp;to capture the right signals: Guest OS metrics, Windows Event Logs, syslog, and workload logs (IIS, SQL).</li>\n<li><span>Verify telemetry is actually landing</span>&nbsp;in Log Analytics. Do not skip this — it's where setups quietly fail.</li>\n<li><span>Attach the SRE Agent</span>&nbsp;to the resources and set your&nbsp;<span>governance posture</span>&nbsp;— decide up front what it can recommend versus what it's allowed to action, and who approves.</li>\n<li><span>Start interacting.</span>&nbsp;Ask it about current health, investigate a past incident, request a patch plan, check for drift, review a configuration. Read the output critically and build trust incrementally.</li>\n<li><span>Expand.</span>&nbsp;Once the pattern works on your pilot servers, widen the scope across the estate and fold more capabilities in.</li>\n</ol>\n<p>Nail steps 1–6 — the data foundation — and everything above it follows. Rush past them and you'll blame the agent for what is really a telemetry gap.</p>\n<h2>Closing thought</h2>\n<p>The honest headline isn't \"AI is magic.\" It's more grounded and more durable:&nbsp;<span>good AI operations start with good telemetry — and with Azure Arc, your on-premises servers can have both.</span></p>\n<p>Arc brings your Windows and Linux servers into Azure's management plane. The agents and Data Collection Rules feed their data in. Azure's management services enrich it. And the Azure SRE Agent turns all of that into continuous, AI-driven operations — monitoring, diagnosis, recommendations, and governed action — for the servers you already run, right where they sit.</p>\n<p>If you've been assuming AI-driven reliability is a cloud-native-only luxury, it's worth a second look. Arc-enable one Windows box and one Linux box, wire up the telemetry, set your guardrails, and put the agent to work. The four sample reports in this post all started exactly that way.</p>\n<p>&nbsp;</p>\n<p><strong><em>Useful Links -</em></strong></p>\n<p><strong><em>Azure SRE Agent</em></strong></p>\n<ul>\n<li><span>Azure SRE Agent – overview/features:</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/sre-agent/overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/sre-agent/overview</a>&nbsp;</li>\n<li><span>Incident management:</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/sre-agent/incident-management\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/sre-agent/incident-management</a>&nbsp;</li>\n<li><span>Response plans:</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/sre-agent/response-plan\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/sre-agent/response-plan</a>&nbsp;</li>\n<li><span>Run modes (governed automation):</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/sre-agent/run-modes\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/sre-agent/run-modes</a>&nbsp;</li>\n<li><span>Permissions:</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/sre-agent/permissions\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/sre-agent/permissions</a>&nbsp;</li>\n<li><span>Billing:</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/sre-agent/billing\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/sre-agent/billing</a>&nbsp;</li>\n</ul>\n<p><strong><em>Azure ARC</em></strong></p>\n<ul>\n<li><span>Azure Arc-enabled servers – overview:</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview</a>&nbsp;</li>\n<li><span>Monitoring Arc-enabled servers (Log Analytics / extension deployment):</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-arc/servers/concept-log-analytics-extension-deployment\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-arc/servers/concept-log-analytics-extension-deployment</a>&nbsp;</li>\n<li><span>Monitor machines with Azure Monitor (VMs &amp; Arc servers):</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/vm/monitor-virtual-machine\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-monitor/vm/monitor-virtual-machine</a>&nbsp;</li>\n<li><span>Azure Monitor Agent (AMA) overview:</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview</a>&nbsp;</li>\n<li><span>Data Collection Rules (DCR) overview:</span> <a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/data-collection-rule-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/data-collection-rule-overview</a>&nbsp;</li>\n<li><span>Azure Monitor alerts overview (feeds incidents to the SRE Agent):</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview</a>&nbsp;</li>\n</ul>"
