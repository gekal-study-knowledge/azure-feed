"overview": |
  この日は 8 件で、ソブリンパブリッククラウドの機能拡張、監視メトリクスの強化、そしてネットワークセキュリティの更新が中心でした。インフラブログでは、10 月の Frontier Tour にあわせて Microsoft Sovereign Public Cloud の新しい、あるいは拡張された機能が発表されました。各機能が何をするのか、どこに適用されるのか、ソブリンな Azure アーキテクチャの中でどう位置づけられるのかが説明され、組織に合うソブリンクラウドの選択には Microsoft Sovereign Cloud アセスメントの利用が案内されています。監視では、Azure Monitor の高度なプラットフォームメトリクスが一般提供となりました。より粒度の細かいシグナルによって、リソース内の変化や傾向をより速く正確に特定できます。あわせて Azure Container Registry (ACR) のデータ転送とトランザクションのメトリクスが一般提供となりました。いずれもプラットフォームメトリクスとして自動的に出力され、まずサポートリクエストを開かなくても、送出データ転送量の把握、API トラフィックの確認、スロットリングされたリクエストや失敗したリクエストの調査ができます。セキュリティでは、Azure Application Gateway が Azure Key Vault Managed HSM に秘密鍵を置いたままの鍵レス TLS 終端に対応しました。TLS ハンドシェイクの署名はすべて HSM 内で行われ、秘密鍵がゲートウェイへエクスポートされることはありません。Azure Front Door Premium の WAF カスタムルールではサービスタグの一致条件が一般提供となりました。サービスタグは Azure サービスが使う IP アドレスプレフィックスのグループを表し、Microsoft が内容を更新します。ネットワークでは、ピアリングした仮想ネットワーク間のトラフィックをより細かく制御できるルートテーブルの機能「disable VNet peering route (DPR)」がパブリックプレビューとなりました。そのルートテーブルを関連付けたサブネットで、システムが生成するピアリングのルートを抑制します。コンテナでは、AKS における GPU メモリのプロファイリングが取り上げられました。割り当てが少なすぎると AI ワークロードが遅くなったり、信頼性が最も重要になるピーク時に out-of-memory エラーで失敗したりし、多すぎると高価な GPU の容量が使われないまま残るため、最初からワークロードの実際のメモリ需要を把握することが有効だという論旨です。あわせて、Azure SRE Agent の 10 月の更新として、セキュリティとアーキテクチャの検討、Splunk のようなツールとの接続、エージェントの働きを改善する実践的な方法などの新しいガイダンス・事例・リソースがまとめられました。
