  この日は 4 件で、いずれも Azure の更新情報でした。セキュリティ関連が 2 件あります。1 つは Azure Front Door Premium の Web Application Firewall (WAF) カスタムルールで、サービスタグの一致条件が一般提供になりました。サービスタグは Azure サービスが使う IP アドレスプレフィックスのまとまりを表し、Microsoft が更新を管理します。もう 1 つは Azure Application Gateway のキーレス TLS で、秘密鍵を Azure Key Vault Managed HSM に置いたままの証明書で TLS 終端できるようになりました。TLS ハンドシェイクごとの署名は HSM の内部で行われ、秘密鍵はゲートウェイへ一切エクスポートされません。監視では、Azure Monitor の高度なプラットフォームメトリクスが一般提供になりました。より細かい粒度の信号を提供し、リソース内の変化や傾向を素早く正確に把握できるようにするものです。ネットワークでは、VNet ピアリングのルートを無効化する機能がパブリックプレビューになりました。ルートテーブルに関連付けたサブネットで、システムが生成するピアリングルートを抑止するもので、ピアリングした仮想ネットワーク間のトラフィックをより細かく制御できます。
