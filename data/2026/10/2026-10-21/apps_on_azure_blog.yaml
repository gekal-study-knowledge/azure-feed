  "4ca89cf754b353f74c0da9b22f2b46ac":
    "id": "4ca89cf754b353f74c0da9b22f2b46ac"
    "title": "GPU Memory Profiling on AKS: Find the Code Behind Memory Pressure"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/gpu-memory-profiling-on-aks-find-the-code-behind-memory-pressure/ba-p/4566375"
    "published": "2026-10-21 10:00:40"
    "fetched": "2026-10-21 14:27:51"
    "summary": "<p>By <a class=\"lia-external-url\" href=\"https://www.linkedin.com/in/brianbenz/\" rel=\"noopener\" target=\"_blank\">Brian Benz</a>, <a class=\"lia-external-url\" href=\"https://www.linkedin.com/in/yupaul\" rel=\"noopener\" target=\"_blank\">Paul Yu</a>, <a class=\"lia-external-url\" href=\"https://www.linkedin.com/in/mayasingh95/\" target=\"_blank\">Maya Singh</a>, <a class=\"lia-external-url\" href=\"https://www.linkedin.com/in/johnsonshi\" rel=\"noopener\" target=\"_blank\">Johnson Shi</a></p>\n<p>GPU memory allocation can be tricky to get right. Allocate too little and your AI workload can slow down or fail with an out-of-memory error, often during peak traffic when reliability matters most. Allocate too much and expensive GPU capacity sits unused. Getting an informed view of your workload's actual memory needs from the start helps you avoid both problems.</p>\n<p>Kubernetes dashboards can show that GPU memory is under pressure, but they cannot tell you which functions in your AI workload are responsible. Without that detail, teams are left shrinking the workload, moving it to a larger GPU, or restarting it and hoping the problem does not return. That guesswork gets expensive fast.</p>\n<p><a href=\"https://learn.microsoft.com/azure/aks/gpu-profiling\" rel=\"noopener\" target=\"_blank\">GPU memory profiling on Azure Kubernetes Service (AKS)</a> provides the evidence to show which functions allocate GPU memory while the workload runs. You can use that visibility to size memory with an informed perspective from the beginning, troubleshoot unexpected pressure, and validate that later adjustments work as intended.</p>\n<blockquote>\n<p><strong>Preview</strong></p>\n<p>This preview covers GPU <strong>memory</strong> allocations, not GPU <strong>compute</strong> utilization. Your existing GPU metrics tell you that something is going on; the profile gives you specific details on where it is happening.</p>\n</blockquote>\n<h2>From guessing to seeing</h2>\n<p>A GPU memory profile is a record of where allocations occur across your application's function call paths while the workload runs. Instead of showing only how much memory is in use, it connects that memory to the functions that requested it. This gives you a path from the symptom to the code responsible.</p>\n<p>In Grafana, the profile is visualized as a flame graph displayed in an icicle-style, top-down layout. Each block represents a function in a call path, and wider bars represent more attributed GPU memory. That helps you identify where to investigate and make targeted changes.</p>\n<img />\n<p>GPU memory profile flame graph showing allocation call paths</p>\n\n<p>You don't add profiling code to your app, and you don't need a sidecar or pod restart to turn it on. Enable profiling on the cluster before deploying your workload, or enable it while an existing workload is running so its CUDA allocation calls can be captured. Profiling won't decide for you that an allocation is wasteful, and it won't tune your workload automatically. It gives you the evidence to decide what your workload needs.</p>\n<h2>How it works</h2>\n<p>GPU memory profiling on AKS runs on <a href=\"https://inspektor-gadget.io/\" rel=\"noopener\" target=\"_blank\">Inspektor Gadget</a>, an open-source, eBPF-based observability framework for Kubernetes and a CNCF project that Microsoft helps maintain. For GPU profiling, it traces CUDA memory-allocation calls directly from the node, which is why there's no profiling code or sidecar container needed. Enable profiling before deploying the workload, or restart it afterward when you need to capture allocations that occurred during startup.</p>\n<p>It's also secure: the Inspektor Gadget project recently completed its <a href=\"https://inspektor-gadget.io/blog/2026/04/inspektor-gadget-security-audit\" rel=\"noopener\" target=\"_blank\">first independent security audit</a>; three issues were found and fixed in version 0.51.1.</p>\n<p>Results flow into <a href=\"https://grafana.com/oss/pyroscope/\" rel=\"noopener\" target=\"_blank\">Pyroscope</a> and show up in Grafana as flame graphs rendered in a top-down layout. Pair that with Azure Monitor managed service for Prometheus, and you get memory pressure in one panel and the code path behind it in another.</p>\n<p>For more details and to get started, check out the <a href=\"https://learn.microsoft.com/azure/aks/gpu-profiling\" rel=\"noopener\" target=\"_blank\">AKS GPU profiling documentation</a>, which covers the prerequisites, extension installation, and wiring up Pyroscope, Grafana, and the dashboard.</p>\n<h2>A real before and after</h2>\n<p>A GPU memory flame graph shows which function call paths are responsible for GPU memory allocations. Unlike a distributed trace, it doesn't show operations in chronological order. Instead, it combines many allocation call stacks into a single aggregated view.</p>\n<p>The diagram below illustrates the basic idea in the same top-down orientation used by Grafana. Each block represents a function in a call path, stacked blocks show caller-to-callee relationships, and wider blocks represent more attributed GPU memory. The diagram is conceptual, not an actual AKS profile; its colors and example hotspot are illustrative rather than indicators of memory waste.</p>\n<img />Conceptual top-down flame graph diagram showing function call paths as stacked bars and bar width as attributed GPU memory\n<p><em>Conceptual flame graph illustration in the same top-down, icicle-style orientation used by Grafana. Read from top to bottom. Wider blocks mean more GPU memory is attributed to that function or call path.</em></p>\n<p>In the Grafana view below, read the graph <strong>from top to bottom</strong>. Start at the total allocation at the top and follow the function calls downward. Each horizontal bar represents a function. Its width represents the memory attributed to that function and the functions it calls, while horizontal position does not represent time. A tall stack of equally wide bars does not mean each function allocated that memory separately; the same allocation is attributed through the call path.</p>\n<p>The AKS documentation includes a vLLM inference example. At the top, the profile shows <strong>65.9 GiB</strong> of attributed allocations. One wide branch accounts for <strong>55.1 GiB</strong>. Follow that branch downward through the Python and vLLM call stack to find where the memory was allocated.</p>\n<img />\n<p>Expanded Grafana flame graph for a vLLM workload showing GPU memory allocation call stacks</p>\n\n<p><em>Expanded flame graph from the AKS documentation. Read from top to bottom, following the widest allocation path toward the function with high self memory allocation.</em></p>\n<p>Two terms help you interpret the bars:</p>\n<ul>\n<li><strong>Total</strong>: memory attributed to a function, including allocations made by functions it calls.</li>\n<li><strong>Self</strong>: memory allocated directly by that function, rather than deeper functions in the recorded stack.</li>\n</ul>\n<p>A bar can show 55.1 GiB of total allocation with little or no self allocation because the memory was allocated further down its call path. Keep following the branch downward until you find high self allocation. In this example, that leads to <code>GPUModelRunner._allocate_kv_cache_tensors</code>, which the profile attributes with approximately <strong>55.1 GiB of self allocation</strong>. This function creates the KV cache tensors that vLLM uses to reuse previously computed attention keys and values during inference.</p>\n<p>The flame graph identifies <strong>where memory was allocated</strong>, not whether that allocation is unnecessary or the underlying cause of an out-of-memory error. The profile also describes recorded allocations, which are not necessarily the same as the amount of GPU memory simultaneously in use.</p>\n<p>A large KV cache isn't automatically a problem; it's doing real work. The real question is whether it's sized for the traffic you actually serve. For a vLLM service, that usually means comparing your configured context length and concurrency against real-world usage, then right-sizing the settings that control them.</p>\n<p>Here's a loop to find and fix issues in the flame graph data:</p>\n<ol>\n<li>See the memory pressure.</li>\n<li>Find the allocation path in the flame graph.</li>\n<li>Change one setting, based on what your workload actually needs.</li>\n<li>Run the same load again, and profile it again.</li>\n<li>Compare memory, performance, and reliability before you call it done.</li>\n</ol>\n<h2>What this means for reliability, capacity, and cost</h2>\n<p>Reliability is the most direct win. When you can trace an out-of-memory failure back to a specific allocation, you fix the actual cause instead of guessing, and you can prove it by profiling again.</p>\n<p>Memory efficiency comes next. You might find memory you can safely give back, or confirm the workload genuinely needs what it has. Both answers are useful: one frees up headroom, the other stops you from \"optimizing\" something that didn't need it.</p>\n<p>Capacity and cost are downstream of both. A validated drop in memory use might let you fit more work on the GPUs you already have, or reconsider the GPU size you're requesting; call it responsible resourcing. The profiler isn't a cost calculator and won't resize nodes for you, so you still have to test the change and do the math yourself.</p>\n<p>Either way, the decision is now backed by a real allocation path and a repeatable test, not a hunch.</p>\n<h2>One more example: fine-tuning Stable Diffusion XL on KubeRay</h2>\n<p>Everything so far has focused on inference, but the same workflow applies to training. The <a href=\"https://github.com/pauldotyu/awesome-aks/tree/main/2026-07-17-kubecon-gpuprofiling\" rel=\"noopener\" target=\"_blank\">KubeRay GPU profiling demo for AKS with Anyscale</a> spins up an AKS Automatic cluster with GPU Node Autoprovisioning, Inspektor Gadget, Pyroscope, Azure Monitor managed Prometheus, and Azure Managed Grafana.</p>\n<p>The demo runs Anyscale's <a href=\"https://console.anyscale.com/template-preview/finetune-stable-diffusion\" rel=\"noopener\" target=\"_blank\">Fine-tuning Stable Diffusion XL with Ray Train</a> template: DreamBooth LoRA fine-tuning across four GPU workers, moving through model loading, training, checkpointing, and image generation.</p>\n<p>It's a useful reminder that profiling isn't just for inference. Watch the metrics, find the allocation path, make one change, profile again; the loop works whether you're serving a model or training one.</p>\n<h2>Try it yourself</h2>\n<p>Start with the <a href=\"https://learn.microsoft.com/azure/aks/gpu-profiling\" rel=\"noopener\" target=\"_blank\">GPU profiling documentation on Microsoft Learn</a> for setup. Once you're running, it's worth exploring the open-source contributions:</p>\n<ul>\n<li><a href=\"https://inspektor-gadget.io/\" rel=\"noopener\" target=\"_blank\">Inspektor Gadget</a></li>\n<li><a href=\"https://github.com/inspektor-gadget/grafana-dashboards\" rel=\"noopener\" target=\"_blank\">Advanced GPU Observability dashboards</a></li>\n<li><a href=\"https://grafana.com/oss/pyroscope/\" rel=\"noopener\" target=\"_blank\">Pyroscope</a></li>\n</ul>\n<blockquote>\n<p><strong>Preview</strong></p>\n<p>GPU memory profiling on AKS is in preview, so there could be breaking changes as the product evolves in response to feedback. Point it at a workload, see what the flame graph can tell you, fix your GPU allocation issues, and share feedback with us on what you find useful and what could be improved.</p>\n</blockquote>"
  "85b8d1eac4e68f8816ed8c3658471479":
    "id": "85b8d1eac4e68f8816ed8c3658471479"
    "title": "Data Transfer and Transactions metrics now generally available for Azure Container Registry"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/data-transfer-and-transactions-metrics-now-generally-available/ba-p/4565530"
    "published": "2026-10-21 04:55:04"
    "fetched": "2026-10-21 14:27:51"
    "summary": "<p>Azure Container Registry now provides two new platform metrics that make it easier to understand outbound data transfer, inspect API traffic, and investigate throttled or failed requests without first opening a support request.</p>\n<p>We're excited to share the general availability of the <strong>Data Transfer</strong> and <strong>Transactions </strong>metrics for Azure Container Registry (ACR). Both metrics are emitted automatically through Azure Monitor and include dimensions that help you move from “something changed” to the operation, response, and region that explain the change.</p>\n<blockquote>\n<p><strong>Available to all ACR customers today:</strong> The Data Transfer and Transactions metrics are available automatically for every registry, with no additional configuration or cost for the metrics themselves.</p>\n</blockquote>\n<h2>Deeper visibility into registry activity</h2>\n<p>ACR's existing platform metrics provide useful high-level signals such as total and successful pull and push counts, along with storage usage. However, those aggregate signals don't tell you which API operation changed, which region served the traffic, or whether requests were successful, rejected, or throttled.</p>\n<p>Answering those questions often required you to configure diagnostic settings, query logs, correlate client-side telemetry, or contact support. The new metrics add built-in dimensions for common operational investigations, so you can identify the traffic pattern first and then decide whether to tune clients, adjust deployment behavior, change capacity, or investigate a failure.</p>\n<p>&nbsp;</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 82.037%; height: 251.933px; border-width: 1px;\"><colgroup><col style=\"width: 36.749%;\" /><col style=\"width: 63.26%;\" /></colgroup><tbody><tr style=\"height: 39.5333px;\"><td class=\"lia-align-center\" style=\"height: 39.5333px;\"><strong>Before</strong></td><td class=\"lia-align-center\" style=\"height: 39.5333px;\"><strong>What the new metrics unlock</strong></td></tr><tr style=\"height: 39.5333px;\"><td class=\"lia-align-left\" style=\"height: 39.5333px;\">Aggregate pull and push counts</td><td class=\"lia-align-left\" style=\"height: 39.5333px;\">Transaction volume split by registry API operation.</td></tr><tr style=\"height: 66.6167px;\"><td class=\"lia-align-left\" style=\"height: 66.6167px;\">HTTP 429 responses visible primarily from client failures</td><td class=\"lia-align-left\" style=\"height: 66.6167px;\">Throttled transactions filtered by response type and split by API or region.</td></tr><tr style=\"height: 39.5333px;\"><td class=\"lia-align-left\" style=\"height: 39.5333px;\">Limited attribution for outbound transfer</td><td class=\"lia-align-left\" style=\"height: 39.5333px;\">Outbound bytes split by operation and serving registry region.</td></tr><tr style=\"height: 66.7167px;\"><td class=\"lia-align-left\" style=\"height: 66.7167px;\">Separate log and client-side investigations</td><td class=\"lia-align-left\" style=\"height: 66.7167px;\">Built-in metric charts, alerts, and Grafana dashboards without custom instrumentation.</td></tr></tbody></table></div>\n<p>&nbsp;</p>\n<p>This visibility is especially useful for shared registries and geo-replicated environments. If request volume increases, outbound transfer changes, or clients begin receiving HTTP 429 responses, you can investigate the activity directly in Azure Monitor or the integrated Grafana experience.</p>\n<p>&nbsp;</p>\n<h2>What is new</h2>\n<h3>Data Transfer: understand outbound registry traffic</h3>\n<p>The Data Transfer metric measures total outbound data transferred from your registry in bytes. Split the metric by ApiName to distinguish client blob and manifest downloads, geo-replication traffic, and data read when another registry imports content from this registry. Split by Region to see where that transfer originated.</p>\n<h3>Transactions: understand registry API activity</h3>\n<p>The Transactions metric counts registry API operations. Use its dimensions to identify which operations are generating traffic, where requests are served, and whether the response succeeded, redirected, failed, or was throttled.</p>\n<p>&nbsp;</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-center\"><table border=\"1\" style=\"width: 91.1111%; height: 168.267px; border-width: 1px;\"><colgroup><col style=\"width: 17.2952%;\" /><col style=\"width: 27.8814%;\" /><col style=\"width: 54.8302%;\" /></colgroup><tbody><tr style=\"height: 35.0667px;\"><td style=\"height: 35.0667px;\"><strong>Dimension</strong></td><td style=\"height: 35.0667px;\"><strong>Available on</strong></td><td style=\"height: 35.0667px;\"><strong>What it tells you</strong></td></tr><tr style=\"height: 39.0667px;\"><td class=\"lia-align-left\" style=\"height: 39.0667px;\">\n<pre>ApiName</pre>\n</td><td class=\"lia-align-left\" style=\"height: 39.0667px;\">\n<pre>DataTransfer/Transactions</pre>\n</td><td class=\"lia-align-left\" style=\"height: 39.0667px;\">The registry operation represented by the metric.</td></tr><tr style=\"height: 35.0667px;\"><td class=\"lia-align-left\" style=\"height: 35.0667px;\">\n<pre>Region</pre>\n</td><td class=\"lia-align-left\" style=\"height: 35.0667px;\">\n<pre>DataTransfer/Transactions</pre>\n</td><td class=\"lia-align-left\" style=\"height: 35.0667px;\">The region that served the request or from which data was transferred.</td></tr><tr style=\"height: 59.0667px;\"><td class=\"lia-align-left\" style=\"height: 59.0667px;\">\n<pre>ResponseType</pre>\n</td><td class=\"lia-align-left\" style=\"height: 59.0667px;\">\n<pre>Transactions</pre>\n</td><td class=\"lia-align-left\" style=\"height: 59.0667px;\">The request outcome, including success, redirect, authorization failure, not found, throttled, and other client or server errors.</td></tr></tbody></table></div>\n<p>&nbsp;</p>\n<p>For the complete list of API names and response classifications, see the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/monitor-container-registry-reference\" rel=\"noopener\" target=\"_blank\">Azure Container Registry monitoring data reference </a>.</p>\n<h2>Questions you can answer</h2>\n<h5><em>Which APIs are busiest?</em></h5>\n<p>Split&nbsp;<strong>Transactions&nbsp;</strong>metric by <strong>ApiName </strong>to compare manifest, layer, metadata, and authentication operations.</p>\n<h5><em>How is traffic distributed across my registry geo-replications?</em></h5>\n<p>Split <strong>Transactions </strong>and <strong>DataTransfer </strong>metrics by <strong>Region </strong>to monitor transaction volume and outbound data transfer across the registry's geo-replications.</p>\n<h5><em>Are my requests being throttled?</em></h5>\n<p>Filter <strong>Transactions </strong>by <strong>ResponseType </strong>= <strong>Throttled</strong>, then split by <strong>ApiName </strong>or <strong>Region </strong>to find the affected traffic.</p>\n<h5><em>What operations are driving outbound data transfer from my registry?</em></h5>\n<p>Split <strong>DataTransfer </strong>by <strong>ApiName </strong>to compare client downloads, replication, and import-source traffic.</p>\n<p>&nbsp;</p>\n<p>You can explore these new insights in two ways. Start with the integrated Grafana dashboard for a curated, customizable view of registry health and activity. For quick questions or focused investigations, use Azure Monitor Metrics to filter and split the underlying metrics by API, region, and response type.</p>\n<h2>Start with the integrated Grafana dashboard</h2>\n<p>Alongside these metrics, we're introducing a new visualization experience for ACR customers: <strong>Dashboards with Grafana</strong>. The experience is enabled by <a href=\"https://learn.microsoft.com/azure/managed-grafana/overview\" rel=\"noopener\" target=\"_blank\">Azure Managed Grafana</a> and brings a prebuilt, customizable Grafana dashboard into the registry's Azure portal experience. The dashboard provides out-of-the-box panels for key operational insights, including transaction activity and request outcomes by region, outbound data transfer, throttled requests, and storage consumption.</p>\n<p>To get started, open your registry in the Azure portal and select <strong>Monitoring</strong> &gt; <strong>Dashboards with Grafana</strong>. The gallery includes the Azure Container Registry observability dashboard with views for data transfer, transaction trends, throttling, and storage consumption. You don't need to deploy or manage a separate Grafana instance. For teams that already use Grafana, the ACR Observability dashboard is also available in the <a class=\"lia-external-url\" href=\"https://grafana.com/grafana/dashboards/25777-azure-container-registry-observability/\" rel=\"noopener\" target=\"_blank\">public Grafana dashboard gallery</a>, where it can be imported and customized for existing monitoring environments.</p>\n<p>Use the prebuilt dashboard as a starting point, then add panels and customize the views to surface and save the insights most important to your team. You can also use Grafana Explore for ad hoc analysis.</p>\n<img />Access the new Grafana dashboard directly from your registry in the Azure portal.\n<p class=\"lia-align-center\">The integrated observability dashboard brings key registry metrics together in one view.<br /><br /></p>\n<img />\n<p>The dashboard is broken down into sections: Overview, Data Transfer, Transactions, and Storage.</p>\n\n<p class=\"lia-align-center\">Explore the dashboard sections, including Transactions, to view overall request breakdown and audit throttle activity.<br /><br /></p>\n<p>For dashboard creation, customization, access, and deployment guidance, see&nbsp;<a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/container-registry-dashboards-with-grafana\" rel=\"noopener\" target=\"_blank\">Use Grafana dashboards in Azure Container Registry</a>.</p>\n<h2>Run ad hoc metric queries in Azure Monitor</h2>\n<p>For a quick question or focused investigation, open your registry and select <strong>Monitoring</strong> &gt; <strong>Metrics</strong>. Select <strong>Data Transfer</strong> or <strong>Transactions</strong>, then use filtering and splitting to analyze the relevant API, region, or response dimensions.</p>\n<blockquote>\n<p><strong>Investigating throttling?</strong> Start with Transactions, filter ResponseType to Throttled, and split by ApiName. After you identify the traffic pattern, review the mitigation guidance in <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/container-registry-skus#throttling-and-bandwidth-constraints\" rel=\"noopener\" target=\"_blank\">Azure Container Registry SKU features and limits </a>.</p>\n</blockquote>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-align-center\">Use the Transactions dimensions to investigate operation volume, regional traffic, and outcomes.</p>\n<p class=\"lia-align-center\">&nbsp;</p>\n<img />\n<p class=\"lia-align-center\">Use Data Transfer dimensions to identify the operations and regions generating outbound transfer.</p>\n<h2>Learn more</h2>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/monitor-container-registry\" rel=\"noopener\" target=\"_blank\">Monitor Azure Container Registry</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/monitor-container-registry-reference\" rel=\"noopener\" target=\"_blank\">Azure Container Registry monitoring data reference</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/container-registry-dashboards-with-grafana\" rel=\"noopener\" target=\"_blank\">Use Grafana dashboards in Azure Container Registry</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/container-registry/container-registry-skus#api-request-rate-limits\" rel=\"noopener\" target=\"_blank\">Azure Container Registry API request rate limits</a></li>\n</ul>\n<h2>Engineering deep dives</h2>\n<p>For a closer look behind the scenes, these engineering deep dives explain how our team designed and implemented the capabilities that make these new insights possible.</p>\n<ul>\n<li><a class=\"lia-internal-link lia-internal-url lia-internal-url-content-type-blog\" href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/making-acr-data-transfer-visible-the-storage-activity-platform-behind-getblob-me/4564893\" rel=\"noopener\" target=\"_blank\">Making ACR Data Transfer Visible: The Storage Activity Platform Behind GetBlob Metrics</a></li>\n<li><a class=\"lia-external-url\" href=\"https://aka.ms/acr/metrics-at-scale-blog\" rel=\"noopener\" target=\"_blank\">Making Registry Activity Visible at Scale</a></li>\n</ul>\n<h2>Start exploring the metrics today</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\">\n<p>Open your registry in the Azure portal and select <strong>Monitoring </strong>&gt; <strong>Dashboards with Grafana</strong> to explore transaction trends, outbound data transfer, throttling, and storage in one integrated view. Use the built-in dashboard as a starting point, then add panels and customize the views to surface and save the insights most important to your team.</p>\n<p>This integrated experience gives registry teams a self-service path from signal to explanation, helping you understand usage patterns and investigate failed or throttled requests before turning to logs or opening a support request.</p>\n</div>"
  "57efad8e95f9b36eaf6b7f4da7be1a87":
    "id": "57efad8e95f9b36eaf6b7f4da7be1a87"
    "title": "What’s new in Azure SRE Agent: October Update"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/what-s-new-in-azure-sre-agent-october-update/ba-p/4566004"
    "published": "2026-10-21 01:00:00"
    "fetched": "2026-10-21 14:27:51"
    "summary": "<p>There’s been a lot happening with Azure SRE Agent lately, with new guidance, examples, and resources to help teams get more out of the service. Whether you’re thinking through security and architecture, connecting tools like Splunk, or looking for practical ways to improve how your agents work, there’s plenty to dig into.</p>\n<p>So, we’ve pulled the latest updates together in one place. Here’s a look at what’s new and what to start.</p>\n<h2>Understand how Azure SRE Agent handles security and data</h2>\n<p>Security questions often come first when teams evaluate Azure SRE Agent: What can it access? Where does data go? How are actions controlled? Our updated security overview and data residency guidance answer those questions in one place.</p>\n<p>Our latest guidance brings those answers together. It explains how Azure SRE Agent approaches security through execution isolation, secretless credential management, customer separation, encryption, network controls, and logging. It also covers how data such as prompts, responses, conversation history, and resource analysis is stored and processed, including important data residency considerations when choosing a model provider.</p>\n<p>Explore the guidance docs:&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/sre-agent/security-overview\" rel=\"noopener\" target=\"_blank\">Security overview for Azure SRE Agent</a>, <a href=\"https://learn.microsoft.com/en-us/azure/sre-agent/data-privacy\" rel=\"noopener\" target=\"_blank\">Data residency and privacy in Azure SRE Agent</a> and <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/stop-restricting-the-agent-start-restricting-its-environment-/4548726\" rel=\"noopener\" target=\"_blank\">If you want a secure AI agent, start restricting its environment.</a></p>\n<h2>Plan a governed enterprise deployment</h2>\n<p><strong>Get more from your agent from day one</strong></p>\n<p>Creating an agent is the easy part. The real value comes from giving it the right scope, data, and operational context. Our new practical setup guide explains the choices that make the biggest difference. The guidance covers how to start with a focused set of resources, connect code and telemetry, configure incident integrations, and add the runbooks and knowledge your team already relies on. These steps help ground the agent in your environment so it can support real investigations, not just generic questions.</p>\n<p>Read the practical guide: <a href=\"https://techcommunity.microsoft.com/blog/AppsonAzureBlog/getting-the-best-out-of-azure-sre-agent/4559745\" rel=\"noopener\" target=\"_blank\">Getting the best out of Azure SRE Agent</a>.</p>\n<p><strong>Enterprise Adoption Guide</strong></p>\n<p>Getting started with Azure SRE Agent is one thing. Figuring out how to expand it across teams and make it part of the way your organization operates is another. In this two-part guide, we share practical lessons for both ends of that journey: how to get your first SRE Agent up and running, and how to build on that foundation as more teams and use cases come on board. The guides walk through resource design, identity, connec?tivity, governance, and integration patterns so platform and architecture teams can build an approach that fits and scale in their environment.</p>\n<p>Read the guidance: <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/enterprise-adoption-guide-for-azure-sre-agent-part-1-deploying-your-first-azure-/4564306\" rel=\"noopener\" target=\"_blank\">Part 1: deploying your SRE Agent</a> and <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/enterprise-adoption-guide-for-azure-sre-agent-part-2-from-one-team-to-enterprise/4564311\" rel=\"noopener\" target=\"_blank\">Part 2: from one team to enterprise-wide adoption</a>.</p>\n<h2>Connect operations and development with Azure SRE Agent Canvas in GitHub Copilot</h2>\n<p>We are also introducing Azure SRE Agent Canvas in GitHub Copilot Apps and Copilot CLI, a new collaborative experience that brings operational findings and context into GitHub Copilot. It gives developers and operators a shared place to review evidence, work through an issue, and decide what to do next.</p>\n<p>To help you see how the experience works, we have put together three resources:</p>\n<ul>\n<li>Documentation: Learn how to use Azure SRE Agent Canvas in GitHub Copilot during an investigation. <a href=\"https://aka.ms/sreagent/canvas/doc\" rel=\"noopener\" target=\"_blank\">https://aka.ms/sreagent/canvas/doc</a></li>\n<li>Blog: Read more about how the experience helps operations and development teams work from the same context. <a href=\"https://aka.ms/sreagent/canvas/blog\" rel=\"noopener\" target=\"_blank\">https://aka.ms/sreagent/canvas/blog</a></li>\n<li>Demo: Watch Azure SRE Agent Canvas in GitHub Copilot support an investigation from initial findings through team handoff. <a href=\"https://aka.ms/sreagent/canvas/demo\" rel=\"noopener\" target=\"_blank\">https://aka.ms/sreagent/canvas/demo</a></li>\n</ul>\n<p>Azure SRE Agent Canvas in GitHub Copilot brings cloud operations context into a familiar developer workflow, helping teams investigate and resolve issues together without starting over in another tool.</p>\n<h2>Extend Azure SRE Agent with plugins and response plans</h2>\n<p>If your Splunk Enterprise environment is private, two new MCP samples can help you connect it to Azure SRE Agent without opening Splunk to inbound internet traffic. Each sample provides a starting point that you can adapt to your own network and production requirements. Both samples could be useful for anyone who uses SRE Agent and Splunk together. Choose the pattern that matches your setup:</p>\n<ul>\n<li>Same-region deployment: Run Azure SRE Agent and the private Splunk workload in the same Azure region and virtual network, with isolated subnets and private MCP traffic. <a href=\"https://github.com/microsoft/sre-agent/tree/main/sreagent-templates/examples/private-splunk-mcp-same-region\" rel=\"noopener\" target=\"_blank\">Private Splunk MCP—same region</a></li>\n<li>Cross-region deployment: Keep Splunk in another Azure region and route private MCP traffic through Global VNet Peering and private DNS. <a href=\"https://github.com/microsoft/sre-agent/tree/main/sreagent-templates/examples/private-splunk-mcp-cross-region\" rel=\"noopener\" target=\"_blank\">Private Splunk MCP—cross region</a>.</li>\n</ul>\n<p>You can now use a private Azure DevOps repo as a plugin marketplace for Azure SRE Agent. This gives your team one place to manage and share plugins and skills built around the tools, processes, and knowledge you already use. The <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/bring-your-azure-devops-repos-to-azure-sre-agent-plugins/4560857\" rel=\"noopener\" target=\"_blank\">Azure DevOps plugins blog</a> shows how to connect a repo and install those capabilities in Azure SRE Agent.</p>\n<p>If your team uses ServiceNow, you can also create more advanced response plans based on the type of incident you are handling. The <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/build-advanced-servicenow-response-plans-in-azure-sre-agent/4553059\" rel=\"noopener\" target=\"_blank\">ServiceNow response plans blog</a> walks through how to set up targeted plans that trigger the right investigation workflow while fitting into the ServiceNow processes your team already has in place.</p>\n<h2>Where to start</h2>\n<p>Not sure which resource to open first? Start with the question you are trying to answer:</p>\n<ul>\n<li><strong>Evaluating security or compliance?</strong> Start with the security overview, data residency guidance, and Security and Governance white paper.</li>\n<li><strong>Designing for production?</strong> Use the Enterprise Architecture Guide to align platform, identity, networking, and governance decisions.</li>\n<li><strong style=\"color: rgb(30, 30, 30);\">Configuring a new agent?</strong><span style=\"color: rgb(30, 30, 30);\"> Follow the practical setup guide to add the context that improves investigation quality.</span></li>\n<li><strong>Want to connect operational work with developer collaboration?</strong> Explore the documentation, blog, and demo for Azure SRE Agent Canvas in GitHub Copilot.</li>\n<li><strong>Connecting with plugins?</strong> Choose the right Splunk MCP sample and learn more from the Azure DevOps plugins blogs and ServiceNow responses plan blog.</li>\n</ul>\n<h2>Additional resources:</h2>\n<ul>\n<li>Get started: <a href=\"https://sre.azure.com/\" rel=\"noopener\" target=\"_blank\">https://sre.azure.com/</a></li>\n<li>Documentation: <a href=\"https://learn.microsoft.com/azure/sre-agent/\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/azure/sre-agent/</a></li>\n<li>Azure SRE Agent on GitHub: <a href=\"https://aka.ms/sreagent/github\" rel=\"noopener\" target=\"_blank\">https://aka.ms/sreagent/github</a></li>\n<li>Azure SRE Agent blogs: <a href=\"https://aka.ms/sreagent/blog\" rel=\"noopener\" target=\"_blank\">https://aka.ms/sreagent/blog</a></li>\n</ul>\n<p>Have feedback or a question? Join the discussion in the <a href=\"https://github.com/microsoft/sre-agent/discussions\" rel=\"noopener\" target=\"_blank\">Azure SRE Agent GitHub repository</a>.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>"
