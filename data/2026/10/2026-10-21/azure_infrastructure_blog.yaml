  "45ee1d62f6bca02601323ece54a9758e":
    "id": "45ee1d62f6bca02601323ece54a9758e"
    "title": "What is new in Sovereign Public Cloud"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/what-is-new-in-sovereign-public-cloud/ba-p/4566000"
    "published": "2026-10-21 00:25:37"
    "fetched": "2026-10-21 14:27:48"
    "summary": "<p><em>To identify which sovereign cloud solution may fit your organization’s needs, take the&nbsp;<a class=\"lia-external-url\" href=\"https://aka.ms/MicrosoftSovereignCloudExplorer\" rel=\"noopener\" target=\"_blank\">Microsoft Sovereign Cloud assessment</a></em></p>\n<p>&nbsp;</p>\n<p><span><span>New and upcoming controls, where they apply</span><span>, and how they fit into </span><span>sovereign</span><span> Azure architecture.</span> <span>At </span><span>the October</span><span> Frontier</span><span> Tour</span><span>, we are announcing new and expanded capabilities for Microsoft Sovereign Public Cloud. This post explains what each capability does, where it applies, and how customers can combine controls within an Azure architecture.</span></span><span>&nbsp;</span></p>\n<p><span><span>It is written for the platform engineer responsible for the landing zone, the security engineer answering operator-access questions, the compliance prof</span><span>essional translating requirements into controls and evidence, and the architect deciding where and how an AI workload can run. The </span></span><a href=\"http://www.aka.ms/SovMoment2026\" rel=\"noopener\" target=\"_blank\"><span><span>O</span><span>ne</span><span> Microsoft Blog</span></span></a><span><span> provides the broader business framing.</span></span><span>&nbsp;</span></p>\n<h2>Why the control surface changed</h2>\n<p><span><span>For years, residency addressed many sovereignty questions: select the </span><span>appropriate region</span><span>, understand commitments such as the EU Data Boundary and in-country processing, and design the workload accordingly. Those commitments continue to provide an important foundation.</span></span><span>&nbsp;</span></p>\n<p><span><span>AI makes the choice of controls increasingly important</span><span>. An AI workload can </span><span>help organizations </span><span>create and process sensitive information across prompts, retrieved context, model responses, embeddings, model artifacts, and operational data. Each can have its own residency, protection, and </span><span>access</span><span> considerations</span><span>. Sovereignty therefore needs to extend across the workload architecture, not only the location in which the workload runs.</span> <span>Sovereignty is not one-size-fits-all. With Microsoft Sovereign Public Cloud, organizations can select and combine sovereign controls based on the requirements of each workload while </span><span>benefiting</span><span> from the innovation and scale of the public cloud. </span><span>Data residency controls, including the choice of more than 80 Azure regions and the EU Data Boundary, help customers address where data is stored and processed.&nbsp;</span></span><span>&nbsp;</span></p>\n<p><span><span>Customer-managed keys with Azure Key Vault Managed HSM strengthen customer control over data at rest; Private Link and TLS protect data in transit; and </span><span>Azure </span><span>C</span><span>onfidential </span><span>C</span><span>omputing</span> <span>helps</span><span> extend</span> <span>protection to data while it is being processed. Customer Lockbox provides </span><span>additional</span><span> control over Microsoft access to customer data, while Sovereign Landing Zone uses policy-based guardrails to help organizations apply sovereignty requirements at scale. Together, these complementary controls allow customers to tailor architectures to specific sovereignty, regulatory, and workload requirements while </span><span>benefiting from</span><span> Azure’s hyperscale infrastructure and advanced cloud and AI capabilities.</span></span><span>&nbsp;</span></p>\n<p><span><span>Prompts, retrieved context, and model responses are processed in memory. For supported workloads, Azure confidential computing helps protect this data during processing using hardware-based, attested trusted execution environments. For supported workloads configured for secure key release, Microsoft Azure Attestation provides claims about the execution environment’s identity and security state. Azure Key Vault Managed HSM evaluates those claims against the configured release policy before releasing a key. Residency and encryption protections for stored embeddings, vector indexes, and model artifacts depend on the services and configurations used. Operational telemetry should be assessed separately against the applicable service’s data handling and residency commitments.</span></span><span>&nbsp;</span></p>\n<p><span><span>We</span><span> are </span><span>now </span><span>expanding this portfolio with new and enhanced capabilities that give customers </span><span>additional</span><span> choices across sovereignty posture, encryption-key control, the protection of data in use, policy enforcement, operator-access transparency, and business continuity.</span></span><span>&nbsp;</span></p>\n<h2>Start with the workload</h2>\n<p><span><span><span>Consider an AI-powered application that uses sensitive organizational information to answer questions</span>. Information moves from the source records to a search index, then to an AI model that generates a response. Instead of using every available sovereignty control, the o</span><span>rganization first reviews the requirements and risks for this workload. It then chooses the controls that best address those needs.</span></span><span>&nbsp;</span></p>\n<p><span><span>Each stage of that pipeline raises a different question. Source records raise residency and encryption-at-rest questions. Embedding and indexing </span><span>determine</span><span> where vector representations of </span><span>sensitive</span><span> data </span><span>live. Inference </span><span>determines</span><span> where prompts and retrieved context are processed, and whether that processing is </span><span>hardware-isolated</span><span>. Responses and operational telemetry raise retention, logging, and access questions. The sections that follow introduce each new capability against these stages, and the table at the end </span><span>consolidates</span><span> the mapping.</span></span><span>&nbsp;</span></p>\n<h2>Sovereign Control Panel Public Preview at Microsoft Ignite</h2>\n<p><span><span>Organizations increasingly need to&nbsp;</span><span>demonstrate</span><span> not only where their data </span><span>resides</span><span>, but also how sovereignty controls are applied, </span><span>monitored</span><span>, and </span><span>evidenced</span><span>. Answering questions from executives, auditors, regulators, and risk teams can require information spread across policy, security, monitoring, and operational processes. This fragmentation </span><span>can </span><span>make sovereignty posture difficult </span><span>for organizations </span><span>to assess and </span><span>demonstrate</span><span> consistently</span><span>.</span> <span>Sovereign Control Panel, currently in private preview, will enter public preview at Microsoft Ignite.</span> <span>Delivery timelines are subject to change.</span></span><span>&nbsp;</span></p>\n<p><span><span>Just as Microsoft Defender for Cloud</span><span> helps organizations understand and improve their security posture, and Microsoft Purview brings visibility and governance to data,</span><span> Sovereign Control Panel is designed to bring </span><span>organizations </span><span>greater clarity and operational focus to sovereignty.</span></span><span>&nbsp;</span></p>\n<p><span><span>Sovereign Control Panel is an Azure-based posture and evidence experience designed to help organizations assess, </span><span>monitor</span><span>, and </span><span>demonstrate</span><span> their sovereignty posture from a centralized position. Instead of manually assembling information across tools and teams for every assessment, customers can gain a more continuous and actionable understanding of their posture across their existing Azure estate</span><span>.</span></span><span>&nbsp;</span></p>\n<p><span><span>The experience is organized around a continuous Discover, Control, Act model. Discover helps organizations understand where they stand and why by </span><span>establishing</span><span> their actual sovereignty posture, surfacing evidence, </span><span>identifying</span><span> gaps and risks, and explaining the underlying drivers. It also supports business </span><span>continuity</span><span> readiness by helping organizations assess dependencies and </span><span>readiness for portability across operating environments, if </span><span>required</span><span>. </span><span>Control helps organizations define what </span><span>should</span> <span>be true and how it should be maintained by selecting and configuring controls, assigning ownership, applying guardrails, and detecting deviations.</span> <span>Act helps organizations </span><span>address</span> <span>identified gaps through guided remediation and verify the resulting posture.</span></span><span>&nbsp;</span></p>\n<img />\n<p><span><span>By connecting posture assessment, control management, remediation, and verification, Sovereign Control Panel is designed to help customers move from manually assembling sovereignty information toward a continuous, insight-driven approach to managing sovereignty. It complements the policy-based guardrails provided by Sovereign Landing Zone and provides a foundation for progressively bringing sovereignty posture and operator-access </span><span>visibility together in one experience.</span></span><span>&nbsp;</span></p>\n<h2>Data Guardian and Production Touch Ledger</h2>\n<p><span>Customers increasingly expect cloud-provider access to be governed, monitored, and evidenced. Existing controls already govern access before it begins. Just-in-Time Access reviews time-bound Microsoft engineer access, while Customer Lockbox adds customer approval when customer data is in scope.</span><span>&nbsp;</span></p>\n<p><span>We are rolling out two complementary additions to these operator-access controls for customers in the EU and EFTA: Data Guardian and Production Touch Ledger.</span><span>&nbsp;</span></p>\n<p><span>Data Guardian strengthens operational oversight by enabling European-resident oversight by a trusted EU partner to monitor qualifying Microsoft engineer remote access to in-scope production systems in EU and EFTA regions. This oversight spans Azure, Microsoft 365, and Dynamics 365 workloads.</span><span>&nbsp;</span></p>\n<p><span>Production Touch Ledger, also launched with phased rollout, complements this oversight with tamper-evident records of the actions performed during qualifying remote Microsoft engineer access to in-scope production systems in EU and EFTA regions. </span><span>&nbsp;</span></p>\n<p><span>Together, these capabilities extend the operator-access lifecycle from access governance to oversight and evidence:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Govern: Just-in-Time Access and Customer Lockbox govern access before it begins.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Monitor: Data Guardian provides EU-resident oversight by a trusted EU partner during qualifying Microsoft engineer access to in-scope production environments.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Record: Production Touch Ledger preserves tamper-evident records of access and the actions performed for validation reconstruction.</span><span>&nbsp;</span></li>\n</ul>\n<h2>External Key Management with Azure Managed HSM, generally available</h2>\n<p><span><span>Azure Managed HSM already provides customers with </span><span>dedicated, single-tenant protection and control over the encryption keys used by supported Azure services</span><span>. </span><span>We are now announcing the general availability of External Key Management with Azure Managed HSM, </span><span>allowing customers to keep the root encryption key in hardware they own and </span><span>operate</span><span> on-premises or through a trusted third party.</span></span><span>&nbsp;</span></p>\n<p><span><span>With External Key Management, the key-encryption key </span><span>remains</span><span> in a customer-owned and customer-operated HSM, either on-premises or hosted by a trusted third party. When a supported Azure service needs to wrap or unwrap a data-encryption key, Azure Managed HSM delegates the cryptographic operation to the external HSM through an External Key Management proxy.</span></span><span>&nbsp;</span></p>\n<p><span><span>Azure Managed HSM </span><span>remains</span><span> the Azure-facing </span><span>service for </span><span>authorization and key</span> <span>management, while </span><span>External Key Management allows</span><span> the key-encryption key</span><span> to remain in an HSM physically </span><span>controlled </span><span>by the customer or a third-party provider</span><span>.</span></span><span>&nbsp;</span></p>\n<p><span><span>Because the external HSM, proxy, and connectivity become part of the </span><span>workload’s</span><span> critical path, organizations should design and test availability, failover, key rotation, rewrapping, and recovery procedures before production deployment. </span><span>External Key Management is </span><span>available</span><span> to customers</span><span> globally</span><span>. </span></span><span>&nbsp;</span></p>\n<h2>Azure Confidential Clean Rooms: In Limited Preview</h2>\n<p>&nbsp;Some of the most valuable insights require organizations to bring data together, but sensitive data often can’t simply be shared. Azure Confidential Clean Rooms, currently in Limited Preview, is designed to help organizations collaborate on sensitive data while keeping the underlying data protected. Participants can analyze approved datasets together using Spark SQL within a hardware-protected environment, helping enable scenarios such as advertising measurement, customer matching, joint risk analysis, and other multiparty analytics without broadly exposing each participant’s raw data.</p>\n<p><span><span>Built on Azure&nbsp;</span><span>c</span><span>onfidential </span><span>c</span><span>omputing, Azure Confidential Clean Rooms brings a verifiable trust model to these collaborations.</span><span> Participants encrypt their data, agree to the analysis being performed, and can use attestation to verify the expected environment and code before encryption keys are released. Only approved results leave the protected environment, while tamper-resistant audit </span><span>trails </span><span>help </span><span>record </span><span>important activity</span><span>.</span> <span>Azure Confidential Clean Rooms is moving toward making confidential, multiparty data collaboration available to a broader set of customers and scenarios.</span></span><span>&nbsp;</span></p>\n<h2>Sovereign Landing Zone with Bicep, Terraform, and Azure Verified Modules, now available</h2>\n<p><span><span>Sovereign Landing Zone provides a policy-based foundation for implementing sovereign controls across Azure environments, using a management group hierarchy and Azure Policy definitions, initiatives, and assignments to help organizations apply sovereignty requirements consistently</span><span>.</span></span>&nbsp;<br />&nbsp;<br /><span><span>W</span><span>e’re announcing an updated Sovereign Landing Zone implementation supporting both Bicep and Terraform, using Azure Verified Modules to provide reusable infrastructure-as-code building blocks that platform teams can integrate into their existing deployment practices</span><span>-</span></span>&nbsp;<br />&nbsp;<br /><span><span>In the current geopolitical environment, organizations are revisiting how they maintain control, continuity, and resilience for critical workloads. Azure Local can support these requirements by </span><span>providing</span><span> an option to run workloads in a customer-controlled environment, including disconnected operations when needed.</span></span><span>&nbsp;</span></p>\n<p><span><span>The new Local management group in the </span><span>Sovereign </span><span>landing zone hierarchy gives customers a clear place to govern Azure Local clusters and the workloads running on them. It also helps teams design workloads in Azure public cloud today with a potential exit path to Azure Local later, so business continuity planning is built into the architecture rather than addressed only during a disruption.</span></span></p>\n<img />\n<h2>Business Continuity and Portability</h2>\n<p>Sovereign business continuity extends beyond traditional high availability and disaster recovery. It starts with understanding what should remain operational when disruptions affect access, connectivity or cloud-platform assumptions.</p>\n<p>Sovereign Control Panel introduces portability evaluations that help customers assess continuity risks and measure readiness for portability across operating environments, if required. These evaluations help identify baseline considerations such as service availability and compatibility, while recognizing that porting the applications may require additional architectural work.</p>\n<p>We are also publishing a new <a href=\"https://aka.ms/BizContinuityGuidance\" rel=\"noopener\" target=\"_blank\">Sovereign Business Continuity guidance and architecture patterns </a>starting with an initial set, with more to follow in the coming months. The library provides prescriptive architecture guidance in the form of flexibly composable patterns for designing continuity paths across Azure, <a href=\"https://aka.ms/SovMoment2026Private\" rel=\"noopener\" target=\"_blank\">Azure Local, and Azure Local disconnected operations</a>. Combined with governance capabilities in Sovereign Landing Zone for Azure Local, these resources can help customers inform risk-based continuity planning and establish recovery ready architectures.</p>\n<img />\n<h2>Putting them together</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Sovereignty requirement category</strong></p>\n</td><td>\n<p><strong>Sovereign Public Cloud</strong></p>\n</td><td>\n<p><strong>Sovereign Private Cloud</strong></p>\n</td><td>\n<p><strong>National Partner Cloud</strong></p>\n</td></tr><tr><td>\n<p><strong>Foundational</strong></p>\n</td><td>\n<p><strong>Controls:</strong> Azure landing zone<br /><strong>Enforcement:</strong> Azure Policy, Microsoft Defender, Microsoft Entra, Microsoft Purview</p>\n</td><td>\n<p><strong>Controls:</strong> Azure landing zone, Security defaults<br /><strong>Enforcement:</strong> Azure Policy for connected and disconnected</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Data residency</strong></p>\n</td><td>\n<p><strong>Controls:</strong> Region selection and Microsoft Entra ID<br /><strong>EU control:</strong> EU Data Boundary<br /><strong>Enforcement:</strong> Azure Policy, Go-Local</p>\n</td><td>\n<p><strong>Controls:</strong> Customer-controlled infrastructure placement<br /><strong>Enforcement:</strong> Configuration</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Data confidentiality at rest</strong></p>\n</td><td>\n<p><strong>Control:</strong> Encryption at rest<br /><strong>Enforcement:</strong> Azure default setting</p>\n</td><td>\n<p><strong>Controls:</strong> Encryption at rest for connected and disconnected<br /><strong>Enforcement:</strong> Manual configuration</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Data confidentiality in transit</strong></p>\n</td><td>\n<p><strong>Controls:</strong> Encryption in transit (TLS 1.2+), Private Link, Virtual Network integration<br /><strong>Enforcement:</strong> Azure Policy for HTTPS, TLS version, Private Link</p>\n</td><td>\n<p><strong>Controls:</strong> Encryption in transit for connected and disconnected<br /><strong>Enforcement:</strong> Manual configuration</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Data confidentiality in use</strong></p>\n</td><td>\n<p><strong>Control:</strong> Azure confidential computing<br /><strong>Enforcement:</strong> Azure Policy</p>\n</td><td>\n<p><strong>Controls:</strong> Confidential VMs, Trusted Launch<br /><strong>Enforcement:</strong> SKU selection for confidential VMs, Azure Policy for Trusted Launch</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Data confidentiality with key control</strong></p>\n</td><td>\n<p><strong>Controls:</strong> Customer-managed keys (CMK), managed HSM, and/or External Key Management<br /><strong>Enforcement:</strong> Azure Policy for CMK and HSM</p>\n</td><td>\n<p><strong>Controls:</strong> Customer-controlled keys<br /><strong>Enforcement:</strong> Azure Policy for CMK and HSM</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Operator access</strong></p>\n</td><td>\n<p><strong>Control:</strong> Customer Lockbox<br /><strong>EU and EFTA control:</strong> Data Guardian<br /><strong>Enforcement:</strong> Enable Customer Lockbox</p>\n</td><td>\n<p><strong>Controls:</strong> Customer operator, identity access for connected and disconnected<br /><strong>Enforcement:</strong> Manual</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Operator validation</strong></p>\n</td><td>\n<p><strong>Control:</strong> Production Touch Ledger<br /><strong>Enforcement:</strong> Manual</p>\n</td><td>\n<p><strong>Controls:</strong> Customer operator<br /><strong>Enforcement:</strong> Manual</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Infrastructure control</strong></p>\n</td><td>\n<p>Microsoft-operated</p>\n</td><td>\n<p><strong>Controls:</strong> Customer-owned hardware<br /><strong>Enforcement:</strong> Manual</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr><tr><td>\n<p><strong>Policy management</strong></p>\n</td><td>\n<p><strong>Control:</strong> Sovereign Control Panel, Azure Policy<br /><strong>Enforcement:</strong> Manual</p>\n</td><td>\n<p><strong>Controls:</strong> Azure Policy<br /><strong>Enforcement:</strong> Manual</p>\n</td><td>\n<p>Partner-specific</p>\n</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p>Choosing between these controls is usually a small number of concrete decisions. If a customer requires the root encryption key to remain in hardware outside Microsoft infrastructure, External Key Management applies, and the external HSM, proxy, and connectivity become part of the workload's critical path. If the requirement is strong customer control of keys without external custody, customer-managed keys in Managed HSM may be sufficient. If prompts, retrieved context, or model weights must be protected while in use, the workload needs confidential computing SKUs and attestation-gated key release rather than encryption at rest alone. If the requirement is record of who accessed the environment, the operator-access controls apply. And if the requirement is the ability to keep operating through disruption, continuity and portability planning belongs in the architecture from the start rather than at the point of failure.</p>\n<p>&nbsp;</p>\n<p>The result is not a single prescribed sovereign architecture. It is a tailored sovereignty architecture in which organizations combine the controls that meet the requirements and risk profile of each workload while continuing to benefit from the innovation and scale of the public cloud. Service, region, SKU, and workload support vary by capability, so validate availability before making any control an architectural dependency.</p>\n<h2>Resources</h2>\n<ul>\n<li>Microsoft Sovereign Cloud overview: https://learn.microsoft.com/azure/azure-sovereign-clouds/</li>\n<li>Capabilities of Sovereign Public Cloud: https://learn.microsoft.com/azure/azure-sovereign-clouds/public/sovereign-public-cloud-capabilities</li>\n<li>Confidential Computing: https://learn.microsoft.com/azure/azure-sovereign-clouds/public/confidential-computing</li>\n<li>Data Guardian: https://learn.microsoft.com/azure/azure-sovereign-clouds/public/data-guardian</li>\n<li>External Key Management: https://learn.microsoft.com/azure/azure-sovereign-clouds/public/external-key-management</li>\n<li>Sovereign Control Panel: https://learn.microsoft.com/azure/azure-sovereign-clouds/public/sovereign-control-panel</li>\n<li>Sovereign Landing Zone: https://learn.microsoft.com/azure/azure-sovereign-clouds/public/overview-sovereign-landing-zone</li>\n<li>Sovereign Landing Zone implementation options: <a href=\"https://learn.microsoft.com/azure/azure-sovereign-clouds/public/implementation-options\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/azure/azure-sovereign-clouds/public/implementation-options</a></li>\n<li>New Local Management Group for ALZ https://techcommunity.microsoft.com/blog/azuregovernanceandmanagementblog/new-local-management-group-for-alz--updated-sovereign-policies-for-slz/4515156</li>\n<li>Sovereign Private Cloud Tech Community <a href=\"https://aka.ms/SovMoment2026Private\" rel=\"noopener\" target=\"_blank\">blog</a></li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>"
  "f31f022ae57ef769873a9514cde33e2b":
    "id": "f31f022ae57ef769873a9514cde33e2b"
    "title": "Microsoft at NVIDIA GTC Berlin 2026: sovereign AI on your terms"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/microsoft-at-nvidia-gtc-berlin-2026-sovereign-ai-on-your-terms/ba-p/4566171"
    "published": "2026-10-21 20:32:12"
    "fetched": "2026-10-22 07:51:03"
    "summary": "<p><span>Microsoft is excited to attend NVIDIA GTC Berlin October 20 through 22, bringing news across the AI stack. We are expanding the infrastructure and platform capabilities organizations need to build and run AI across cloud and customer-controlled environments. This includes new capabilities for Microsoft Sovereign Cloud supported by NVIDIA accelerated computing, open-model choice with NVIDIA Nemotron models through Fireworks AI on Azure, and </span><a href=\"https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/bringing-governed-analytics-into-the-flow-of-work-fabric-analytics-at-fabcon-eur/5368918\" rel=\"noopener\" target=\"_blank\"><span><span> GPU-accelerated analytics</span><span> in </span><span>Microsoft Fabric</span><span>.</span></span></a><span>&nbsp; Find us at booth 3066 and <a class=\"lia-external-url\" href=\"https://microsoftindustryevents.eventbuilder.com/GTCBerlin?ref=GTCBerlin?utmsource=orgsoc&amp;utmcampaign=gtcberlin\" rel=\"noopener\" target=\"_blank\">off site at the JW Marriott</a>.&nbsp;</span></p>\n<p><span>What ties these areas together is a question customers in every industry are asking us: how can we use the latest models and infrastructure while retaining control over where our workloads run and who can access them? For many organizations, especially those in regulated industries, answering these questions is essential to expanding the use of AI and agentic workloads. Through our work with NVIDIA, these are some of the challenges we are helping customers address in Berlin.</span><span>&nbsp;</span></p>\n<h3><span><span>Control and choice, wherever AI runs</span></span><span>&nbsp;</span></h3>\n<p><span>Teams want the newest, most capable models running on the most performant hardware, all while keeping control over their data, models, and outputs. The public cloud is the right solution for many workloads.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>Other workloads may need to run in specialized, secured environments because of requirements for data residency, operator access, connectivity, latency, or operational control. Microsoft is building solutions to meet customers across this range of needs.</span><span>&nbsp;</span></p>\n<p><span>Microsoft’s approach to sovereign AI starts with the level of control each workload requires. Depending on the workload, this can include control over where data and models reside, who can access and operate the environment, how AI workloads are governed, and whether critical operations can continue when cloud connectivity is restricted or unavailable. The goal is to help organizations meet these requirements while maintaining access to modern cloud and AI capabilities.</span><span>&nbsp;</span></p>\n<h3><span><span>A consistent</span> <span>platform, from </span><span>Cloud</span> <span>to </span><span>the edge</span></span><span>&nbsp;</span></h3>\n<p><span>Microsoft provides resilient infrastructure for AI demands across Azure and Azure Local, supported by NVIDIA accelerated computing. This hardware spans accelerated systems in Azure datacenters and NVIDIA GPUs in Azure Local environments that customers operate themselves. It connects two important needs: building and scaling AI in the cloud, and deploying and operating where latency, connectivity, data residency, or operational control matter.</span><span>&nbsp;</span></p>\n<p><span>This gives organizations more choice in where they build, deploy, and operate AI workloads, while applying consistent management and governance across their environments.</span><span>&nbsp;</span></p>\n<h3><span><span>Sovereign AI on Azure Local with NVIDIA accelerated computing</span></span><span>&nbsp;</span></h3>\n<p><span>With Sovereign Private Cloud, built on Azure Local, organizations can bring AI closer to sensitive data and physical operations across connected and disconnected environments. At Microsoft Ignite, Foundry Local on Azure Local will become generally available for local model deployment and inference. This enables organizations to run AI models within their own environments so that models and sensitive workload information can remain under local control. Microsoft is also expanding support for grounded and agentic AI scenarios that use enterprise data within the customer’s local environment.</span><span>&nbsp;</span></p>\n<p><span>NVIDIA accelerated computing supports these deployments. Looking ahead, Microsoft is working to bring support for NVIDIA HGX-based multi-GPU systems to Azure Local, providing the dense accelerated infrastructure needed to run larger models with Foundry Local in customer-controlled environments. With high-performance NVIDIA GPUs on Azure Local, organizations can build, test, and deploy AI workloads in sovereign and edge environments.</span><span>&nbsp;</span></p>\n<p><span>Beyond Azure Local, Microsoft is also a key partner in the NVIDIA OpenShell Reference Architecture for Safe AI Agents, supporting the extension of secure agentic AI from the datacenter to the edge, including the recently launched NVIDIA RTX Spark and DGX Station running Windows.</span><span>&nbsp;</span></p>\n<p><span>Confidential virtual machines on Azure Local are generally available, extending hardware-based data-in-use protection to customer-controlled infrastructure. Hardware-encrypted memory and attestation help protect supported workloads from the host operating environment and infrastructure administrators.</span><span>&nbsp;</span></p>\n<p><span>Microsoft is a key partner in the </span><a href=\"https://nvidianews.nvidia.com/news/openshell-reference-architecture\" rel=\"noopener\" target=\"_blank\"><span><span>NVIDIA OpenShell Reference Architecture for Safe AI Agents</span></span></a><span>, supporting the extension of secure agentic AI from the data center to the edge, including the </span><a href=\"https://nam06.safelinks.protection.outlook.com/?url=https%3A%2F%2Fblogs.nvidia.com%2Fblog%2Flocal-ai-rtx-spark-microsoft-windows-event%2F&amp;data=05%7C02%7Cbensickle%40microsoft.com%7C39df03134b6b409d959908df2c02757e%7C72f988bf86f141af91ab2d7cd011db47%7C1%7C0%7C639278061286207494%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=13ZPaRTnHK%2BrqfiGm0ZDnL8kzYo6qBYwpOk8iaBWO80%3D&amp;reserved=0\" rel=\"noopener\" target=\"_blank\"><span><span>recently launched NVIDIA RTX Spark</span></span></a><span> and DGX Station running Windows.</span><span>&nbsp;</span></p>\n<p><span>For data in use, confidential computing adds protection enforced from the silicon up, so security leaders can explain where trust is enforced at each layer.&nbsp;</span><span>&nbsp;</span></p>\n<h3><span><span>Open models you can choose, and change: NVIDIA </span><span>Nemotron</span> <span>with</span><span> Fireworks AI on Azure</span></span><span>&nbsp;</span></h3>\n<p><span>Customers continue to prioritize avoiding model provider lock-in. Fireworks AI is bringing open models including the family of NVIDIA Nemotron models to Azure as managed endpoints, so teams can put open models into production without having to build and run the serving stack themselves. Fireworks serves these models on NVIDIA accelerated computing with TensorRT-LLM and Dynamo.</span><span>&nbsp;</span></p>\n<p><span>The same emphasis on model choice carries into Microsoft Foundry, where NVIDIA open models are available alongside a broader model catalog. For workloads that need to run within a customer-controlled environment, Foundry Local provides a path to deploy supported models locally.</span><span>&nbsp;</span></p>\n<h3><span><span>Faster data for AI: Microsoft Fabric with NVIDIA </span><span>accelerated computing&nbsp;</span></span><span>&nbsp;</span></h3>\n<p><span>As analytics become more conversational, the warehouse has to answer more queries, more interactively, and at greater scale. To meet that demand, GPU-accelerated query </span><span>acceleration</span><span>,</span> <span>powered by NVIDIA accelerated computing, is now in public preview. Based on award-winning research, it accelerates </span><span>your </span><span>analytical workloads without requiring changes to your data or your SQL queries, with benefits that become increasingly important under the high-concurrency patterns AI experiences create.</span><span>&nbsp;</span></p>\n<p><span>Our customers across industries are already seeing value from GPU-accelerated Fabric Data Warehouse:</span><span>&nbsp;</span></p>\n<blockquote>\n<p><span>“In healthcare, timely insights matter, and GPU-accelerated Fabric Data Warehouse will help ensure critical data is available when clinicians and leaders need it most. We’re seeing up to 5x improvement in our query speeds, which allows our teams to spend less time managing performance and more time delivering meaningful insights.”</span>&nbsp;<br /><span>- Shaun McDonald, IT Manager, UNC Health</span><span>&nbsp;</span></p>\n</blockquote>\n<p>&nbsp;</p>\n<blockquote>\n<p><span>“Our experience with GPU-accelerated Fabric Data Warehouse has been excellent. The capability integrates seamlessly into our existing architecture and has delivered meaningful performance improvements across a range of queries, with complex workloads running 3.4x faster at single concurrency and more consistently.</span><span>&nbsp;</span></p>\n<p><span>At WTW, we operate a shared data platform supporting multiple applications and reporting workloads. GPU-accelerated Fabric Data Warehouse enables us to serve high volumes of queries more efficiently, directly improving the responsiveness of our downstream analytics and reporting. We see the potential for this capability to help unify how we deliver data across our platform.”</span><span>&nbsp;</span></p>\n<p><span>- Andrew Bradbrook, Director – Systems Architecture, WTW</span><span>&nbsp;</span></p>\n</blockquote>\n<h3><span><span>Better data for physical AI: NVIDIA Cosmos Data Factory on Azure</span></span><span>&nbsp;</span></h3>\n<p><span>For teams building autonomous vehicles, robotics and vision AI agents, creating and improving physical systems intelligence depends on having the right training data not just more of it. Rare conditions are difficult to capture, and turning raw recordings into useful datasets often means moving between disconnected tools and manual processes. NVIDIA Cosmos Data Factory brings data curation, processing and synthetic data generation into a connected workflow. Its agentic blueprints and composable skills help developers prepare high-quality real and synthetic datasets, expanding coverage of the scenarios their models need to handle.</span><span>&nbsp;</span></p>\n<p><span>This week NVIDIA Cosmos Data Factory’s AV Dataset Generation blueprint becomes generally available on Azure. The workflow turns raw driving video and vehicle signals into curated, searchable, augmented and evaluated datasets, with engineers setting the target scenarios and data-quality criteria. A rare cut-in on a wet road, for example, can become the starting point for finding similar recordings and generating additional variations. NVIDIA supplies the data workflows and open models, while Azure supplies the compute to run them at scale helping teams spend less effort preparing data and more time developing and testing.</span><span>&nbsp;</span></p>\n<p><span>The next step is connecting that data foundation to model improvement. NVIDIA Alpamayo Agentic Factory, coming soon to Azure, builds on Cosmos Data Factory to connect targeted dataset creation with driving-model post-training and simulation evaluation. Engineers define the goal, review outputs and guide subsequent experiments, while agents plan and execute the development steps. The aim is a repeatable path from a known driving failure to an evaluated model improvement, with each iteration informing what to test next.</span><span>&nbsp;</span></p>\n<h3><span><span>From announcements to&nbsp;</span><span>availability</span></span><span>&nbsp;</span></h3>\n<p><span>Across these announcements, Microsoft and NVIDA are expanding the choices available to originations building expand the options available to organizations building AI across cloud and customer-controlled environments. Confidential virtual machines on Azure Local are generally available today. At Microsoft Ignite, Foundry Local on Azure Local will become generally available for local model deployment and inference across connected and disconnected environments.</span><span>&nbsp;</span></p>\n<h3><span>What's next</span><span>&nbsp;</span></h3>\n<p><span>Berlin is the first stop in Microsoft's FY27 NVIDIA GTC series. Next is NVIDIA GTC Washington, D.C., November 30 to December 3, followed by GTC San Jose, March 15 to 18, 2027. There is more on Azure AI infrastructure coming at </span><a href=\"https://ignite.microsoft.com/en-US/home\" rel=\"noopener\" target=\"_blank\"><span><span>Microsoft Ignite</span></span></a><span>, hosted in San Francisco November 16 – 20.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>If you are in Berlin, stop by booth 3066 on October 21 and 22, or&nbsp;</span><a href=\"https://www.nvidia.com/en-eu/gtc/session-catalog/sessions/gtceu26-sb61158/\" rel=\"noopener\" target=\"_blank\"><span><span>join our 15-minute theater session, \"Sovereign AI, From Azure to the Edge,\" on Thursday, October 22 at 11:00 CEST</span></span></a><span> or </span><a href=\"https://microsoftindustryevents.eventbuilder.com/GTCBerlin?ref=GTCBerlin?utmsource=orgsoc&amp;utmcampaign=gtcberlin\" rel=\"noopener\" target=\"_blank\"><span><span>find us at our space at the JW Marriott</span><span>.</span></span></a><span> Bring your hard-hitting and pressing questions!</span><span>&nbsp;</span></p>\n<p><span>Learn more: </span><a href=\"https://www.microsoft.com/en-us/sovereignty\" rel=\"noopener\" target=\"_blank\"><span><span>Microsoft Sovereign Cloud</span></span></a><span> · </span><a href=\"https://azure.microsoft.com/en-us/explore/global-infrastructure/silicon-systems\" rel=\"noopener\" target=\"_blank\"><span><span>Azure AI infrastructure, silicon to systems</span></span></a><span> · Next in the series: </span><a href=\"https://www.nvidia.com/gtc/dc/\" rel=\"noopener\" target=\"_blank\"><span><span>Microsoft at NVIDIA GTC Washington, D.C.</span></span></a><span>&nbsp;</span></p>"
