"overview": |
  この日は 5 件で、ソブリン AI のアーキテクチャ、Java のサポート期限への備え、そして監視と DNS の機能強化が中心でした。Azure ブログでは、エッジからクラウドまで共通の基盤を持つソブリン AI の設計が取り上げられました。柔軟なソブリンアーキテクチャにより、各ワークロードを適した環境に配置し、必要な統制を適用しながら一貫性を保てるという考え方です。アプリ関連では、Microsoft の 2027 年のサポート節目を見据えた Java アップグレードの計画が示されました。2021 年 4 月に Microsoft Build of OpenJDK を Java 11 のプレビューとして発表して以来、Azure 上の Java アップグレードでは 11・17・21、そして 25 と世代を積み上げてきており、Java 8 についても Eclipse Foundation の Eclipse Adoptium プロジェクトの協力のもとで扱われてきた経緯が説明されています。あわせて、Azure Container Registry (ACR) がこれまで示せなかった「どれだけのデータがレジストリから出ていくか」を可視化できるようになり、その GetBlob メトリクスを支えるストレージアクティビティのプラットフォームが解説されました。Grafana ダッシュボードの活用方法も案内されています。サービス更新では、Azure DNS が Azure Traffic Manager とのシームレスな統合により DNS ベースのロードバランシングを提供するようになりました。Azure DNS のレコードセットを Traffic Manager のプロファイルに直接関連付けられるため、Traffic Manager を指す CNAME レコードを作る必要がなくなります。あわせて、Azure Monitor ワークスペースのメトリクス使用状況インサイトが一般提供となりました。ワークスペース全体でメトリクスの使用量を押し上げている要因を可視化し、ワークスペースの利用状況の監視、使われていないメトリクスの特定、使用傾向の把握、変化の調査ができます。
