    "title": "Azure Key Vault and BYOK: Lessons Learned"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/azure-key-vault-and-byok-lessons-learned/ba-p/4561156"
    "published": "2026-10-08 21:41:54"
    "fetched": "2026-10-09 11:36:49"
    "summary": "<p class=\"lia-align-justify\">Bring Your Own Key (BYOK) lets you import externally generated key material into Azure Key Vault. Importing that material again creates a new version; it does not recreate the original version identifier. If Azure Storage still requires the original&nbsp;<span>customer-managed key (CMK)</span> version to unwrap <span>(decrypt)</span> its account encryption key, re-importing the same material under a new version does not restore that access.</p>\n<p class=\"lia-align-justify\">With&nbsp;<span>Azure Storage CMK</span>, the key in Key Vault wraps the&nbsp;<span>account encryption key</span>. A key change requires access to the current CMK&nbsp;<span>version</span>&nbsp;to unwrap the&nbsp;<span>account encryption key</span>&nbsp;before&nbsp;<span>it can be wrapped with the new key</span>. If the required version cannot be recovered at the referenced endpoint, importing the material under a new URI does not complete the transition.</p>\n<blockquote>\n<p class=\"lia-align-left\"><strong>Keep both the key material and the required Key Vault versions recoverable. Re-importing the material alone cannot complete a recovery operation that requires the original version.</strong></p>\n</blockquote>\n<p class=\"lia-align-justify\">The backup and restore procedures below apply to Azure Key Vault, not Azure Key Vault Managed HSM.</p>\n<h4>BYOK re-import vs. key restore</h4>\n<p class=\"lia-align-justify\">A versioned key URI includes the vault endpoint, key name and version identifier. Importing a key under an existing name creates a new version. Restoring a Key Vault key backup preserves the name and the version identifiers captured in that backup. These operations are not interchangeable, even when the imported material is identical.&nbsp;</p>\n<p class=\"lia-align-justify\">Restoring to another vault preserves the saved version identifiers but changes the vault endpoint and therefore the full URI. A service that still needs the original URI may be unable to switch to the restored copy. Account for the original endpoint, access permissions and service configuration when planning recovery.</p>\n<img />\n<p class=\"lia-align-justify\">Record each versioned key URI together with its dependent workloads, access identities and owner. This inventory is needed when rotating a shared key, changing vaults or recovering from a deletion. Retain the external key material and any Key Vault object backups required by the recovery policy.</p>\n<blockquote>\n<p>If a dependent service references a key version that is no longer available, work in this order:</p>\n<ol>\n<li>Check whether the key or the vault is soft-deleted. If it is, recover it; recovery brings back the original identifiers.</li>\n<li>Otherwise, restore the most recent Key Vault backup that contains the referenced version into the original vault.</li>\n<li>If neither is possible, open a Microsoft support case before you import replacement material or change the service's key configuration.</li>\n</ol>\n</blockquote>\n<h4>Key rotation in Azure Storage</h4>\n<p class=\"lia-align-justify\">Creating a new version in Key Vault does not immediately change every dependent service. Azure Storage must start using the new key version before the previous version is disabled. Keep the old and new versions enabled and accessible while the change completes. Storage updates the protection of its root encryption key without re-encrypting the stored data.</p>\n<p class=\"lia-align-justify\">When automatic version updates are configured, Storage checks for a new version daily. Microsoft <span>recommends</span> <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview#update-the-key-version\" target=\"_blank\">waiting 24 hours</a> after rotation before disabling the previous version. If the account is pinned to a&nbsp;<span>specific</span>&nbsp;version, update&nbsp;<span>the configured version</span> explicitly. Confirm the version in use and test data access before <span>disabling</span> the previous version; elapsed time alone is not sufficient.</p>\n<p class=\"lia-align-justify\">If new keys must originate in your HSM, generate the material there and import it through the supported BYOK process. Re-importing unchanged material creates a version, but does not constitute cryptographic key rotation. Key Vault auto-rotation generates new material in Azure, not in your HSM, so you cannot use it for these keys.</p>\n<img />\n<p class=\"lia-align-justify\">This sequence assumes that the account is pinned to a key version, so the switch in step 4 happens only after the backup in step 3. With automatic version updates, Storage can adopt the new version at its next daily check, possibly before the backup exists. If your policy requires a backup before use, pin the key version and update it explicitly once the backup has completed.</p>\n<h4>Soft delete and purge protection</h4>\n<p class=\"lia-align-justify\">Azure Storage CMK requires soft delete and purge protection. Soft delete provides a configured recovery window of 7 to 90 days, with a default of 90 days. Purge protection prevents permanent deletion before that window expires. It does not prevent the initial deletion or keep a deleted key available to the service.&nbsp;</p>\n<p class=\"lia-align-justify\">Monitor key deletions and failed key access, and investigate before the recovery window closes. If the required object is still soft-deleted, recover it rather than importing a replacement. A recovery procedure must include the permissions, network access and responsible owner needed to perform that operation.</p>\n<h4>Monitoring and guardrails</h4>\n<p class=\"lia-align-justify\">Key Vault records key operations in its AuditEvent log category. Send these logs to a Log Analytics workspace with a diagnostic setting, and alert on operations that change which keys and versions exist.</p>\nAzureDiagnostics\n| where ResourceProvider == \"MICROSOFT.KEYVAULT\"\n| where OperationName in (\"KeyDelete\", \"KeyPurge\", \"KeyRecover\",\n                          \"KeyImport\", \"KeyBackup\", \"KeyRestore\")\n| project TimeGenerated, Resource, OperationName, requestUri_s,\n          CallerIPAddress, ResultSignature\n| sort by TimeGenerated desc\n<p>If your diagnostic setting writes to resource-specific tables, query AZKVAuditLogs instead; some column names differ.</p>\n<p class=\"lia-align-justify\">On the storage side, lost key access surfaces as HTTP 403 errors such as KeyVaultEncryptionKeyNotFound, KeyVaultVaultNotFound or KeyVaultAccessTokenCannotBeAcquired. Treat&nbsp;<span>these errors as incidents</span>, not as transient&nbsp;<span>failures</span>.</p>\n<p class=\"lia-align-justify\">Resource locks do not protect keys. A CanNotDelete lock prevents deletion of the vault resource, but locks apply only to control plane operations, and deleting a key is a data plane operation. Limit who can delete, purge, back up and restore keys, and review those assignments regularly.</p>\n<h4>Retention of previous key versions</h4>\n<p class=\"lia-align-justify\">Active workloads, migrations and retained data backups can require old key versions after a rotation. Determine those dependencies before setting a retirement date. Data backups may still depend on retained encryption keys. Verify which versions the service requires to restore each retained recovery point; these dependencies vary by service.&nbsp;</p>\n<p class=\"lia-align-justify\">Test the recovery points you must retain before retiring a key. Keep disabling and deleting as separate decisions, with an owner for each. Key Vault does not support deleting individual historical versions, so deletion is not a version-cleanup strategy.&nbsp;</p>\n<h4>Backup scope and restore constraints</h4>\n<p class=\"lia-align-justify\">A Key Vault key backup is an encrypted object snapshot, not a plaintext key export or a whole-vault backup. It can be restored only to a vault in the same Azure subscription and geography as the source vault, though not necessarily the same region. Restore brings back all captured versions, not one selected version. The original key name must be available in the destination.&nbsp;</p>\n<p class=\"lia-align-justify\">A snapshot does not include versions created after the backup, and restoring the key does not rebuild identities, permissions or networking. <span>Backing up a key</span>&nbsp;with more than 500 versions&nbsp;<span>is not supported</span>. Check version counts and backup completion as part of the rotation process.</p>\n<p class=\"lia-align-justify\">Where key backups are required, <span>back up the key again</span> after each import or rotation. If policy requires a backup before use, configure the service to use the new version only after its backup has completed. Automatic adoption can otherwise occur before the backup completes. Keep the backup accessible even when the source CMK is unavailable. Restrict backup&nbsp;<span>and</span> restore permissions and monitor their use. Disabling the original key does not disable a copy restored elsewhere.&nbsp;</p>\n<h4>Checking the active key version</h4>\n<p class=\"lia-align-justify\">The following Azure CLI commands use PowerShell line continuation. Replace the placeholders, sign in to the intended tenant and run each command separately, stopping on errors. <span>The storage account and the key vault</span> can be in different subscriptions. <span>You need</span>&nbsp;read, list, backup,&nbsp;<span>and</span>&nbsp;restore permissions, plus network access&nbsp;<span>to the vault</span>. <span>The storage account's</span>&nbsp;managed identity separately needs&nbsp;<span>the</span>&nbsp;get, wrapKey,&nbsp;<span>and</span>&nbsp;unwrapKey&nbsp;<span>permissions</span>. With Azure RBAC, the Key Vault Crypto Service Encryption User role covers these permissions.</p>\n<p>Read the account's key properties and list the available versions:</p>\naz storage account show `\n  --subscription \"&lt;storage-subscription&gt;\" `\n  --resource-group \"&lt;resource-group&gt;\" `\n  --name \"&lt;storage-account&gt;\" `\n  --query \"encryption.keyVaultProperties\" `\n  --output json\n\naz keyvault key list-versions `\n  --subscription \"&lt;key-subscription&gt;\" `\n  --vault-name \"&lt;source-vault&gt;\" `\n  --name \"&lt;key-name&gt;\" `\n  --query \"[].kid\" `\n  --output tsv\n<p class=\"lia-align-justify\">The currentVersionedKeyIdentifier property reports the version in use. An empty keyVersion means that automatic version updates are enabled; a value means that the account is pinned to that version. Do not rely only on the configured keyVersion or the newest version in Key Vault. Record the identifier before and after the change, and test application reads and writes&nbsp;<span>separately</span>. Azure Storage does not currently log key rotation in its Azure Monitor logs, so this record may be your only evidence of which version was in use.</p>\n<h4>Backup and restore with Azure CLI</h4>\n<p>Create a key backup&nbsp;<span>with</span>&nbsp;a unique&nbsp;<span>file name</span> for each snapshot:</p>\n$backupFile = \".\\cmk-backup-$(Get-Date -Format yyyyMMdd-HHmmss).blob\"\n\naz keyvault key backup `\n  --subscription \"&lt;key-subscription&gt;\" `\n  --vault-name \"&lt;source-vault&gt;\" `\n  --name \"&lt;key-name&gt;\" `\n  --file $backupFile\n<p class=\"lia-align-justify\"><span>To test the restore,</span>&nbsp;use an approved, isolated test vault in the same subscription and geography. The key name must not already be active or reserved by a soft-deleted object. HSM-protected keys require a compatible Premium vault. Do not delete or purge production keys to make room for a restore test.</p>\naz keyvault key restore `\n  --subscription \"&lt;key-subscription&gt;\" `\n  --vault-name \"&lt;isolated-test-vault&gt;\" `\n  --file $backupFile\n\naz keyvault key list-versions `\n  --subscription \"&lt;key-subscription&gt;\" `\n  --vault-name \"&lt;isolated-test-vault&gt;\" `\n  --name \"&lt;key-name&gt;\" `\n  --query \"[].kid\" `\n  --output tsv\n<p class=\"lia-align-justify\">Compare the final version segment of each returned URI with the source inventory; the vault hostname will differ. These commands do not change Storage encryption. A successful test restore validates the backup, not the service recovery procedure. Test that procedure separately with a non-production workload before relying on it for production recovery.</p>\n<h4>Key retirement checklist</h4>\n<ul>\n<li><strong>Identify all services that use the key. Avoid unnecessary key sharing across production and non-production.</strong></li>\n<li><strong>Verify that the backup includes the required versions and can be restored to the intended destination.</strong></li>\n<li><strong>Confirm the version in use, test data access, and validate the required backup restores.</strong></li>\n<li><strong>Disable the old version only after confirming that no active workload or required backup restore still needs it.</strong></li>\n</ul>\n<blockquote>\n<p class=\"lia-align-justify\">Reliable recovery requires the key material, the referenced versions and a tested service recovery procedure. When a recovery operation depends on the original CMK version, re-importing the material under a new version cannot replace it. <span>Disable</span>&nbsp;old versions only after&nbsp;<span>you verify that no remaining workload or backup depends on them</span>.</p>\n</blockquote>"
