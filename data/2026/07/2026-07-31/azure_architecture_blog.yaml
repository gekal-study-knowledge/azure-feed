    "title": "Skill or Sub-Agent. Choosing AI Capabilities You Will Actually Reuse"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/skill-or-sub-agent-choosing-ai-capabilities-you-will-actually/ba-p/4542099"
    "published": "2026-07-31 05:50:02"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Audience:</strong> Cloud architects, platform engineers, engineering leaders</p>\n<hr />\n<h2>The wrong first question</h2>\n<p>Most teams building AI capabilities start with the wrong question. They ask which model to use.</p>\n<p>The model matters less than the shape of the capability around it. The first real fork is this. Are you building a skill or a sub-agent? Get that wrong and no model choice will save you. A skill and a sub-agent are two different delivery shapes, and each one fails at the other one's job.</p>\n<h2>The insight</h2>\n<p>The choice between a skill and a sub-agent is not about model power. It comes down to four checks. How the work iterates, whether the output carries a voice, how far an early wrong turn spreads, and how often it recurs. Score each, count which way they lean, and the shape falls out. An even split means build both, and let the skill drive the sub-agent.</p>\n<p>The three sections below take the checks worth a pause. Frequency is the plain one: a one-off craft piece leans to a skill, a repeatable batch job to a sub-agent.</p>\n<p>A skill lives inside the conversation. It reads files, asks a question, refines with the author, and keeps a human in the loop mid-flight. A sub-agent takes one prompt, runs to completion, and returns one report. Both are useful, for different work.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Dimension</th><th>Skill</th><th>Sub-agent</th></tr><tr><td>Iteration</td><td>Conversation, many turns</td><td>One hand-off, one pass</td></tr><tr><td>Voice</td><td>Holds a style profile and applies it</td><td>Drifts toward generic by design</td></tr><tr><td>Human gate</td><td>Every turn</td><td>Once, at the end</td></tr><tr><td>Best for</td><td>Craft, subjective output</td><td>Bounded, structured output</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><em>Table 1. The same three dimensions decide the shape every time.</em></p>\n<h2>1. Decide the iteration model first</h2>\n<p>Before anything else, architects should ask how the work actually happens. Is it a conversation or a hand-off? That single answer removes most of the ambiguity.</p>\n<ul>\n<li>Craft work needs back and forth</li>\n<li>Batch work needs one clean pass</li>\n<li>Conversations need memory of the thread</li>\n<li>Hand-offs need a bounded input and a clear output</li>\n</ul>\n<p>A skill is right when the value comes from iteration. A blog post, a design review, a tricky refactor. A sub-agent is right when the work is well defined and the output is the deliverable.</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: use a skill when the team expects three or four rounds of \"close, but change this\". The trade-off: a skill costs more attention per run because a human stays involved. The trap to avoid: forcing iterative craft into a one-shot agent and then editing the output by hand every time.</p>\n<h2>2. Voice fidelity decides craft work</h2>\n<p>Some outputs have a voice. An article, a customer email, an architecture narrative. Others do not. A query result, a data export, a status summary. The line between them is not cosmetic. It decides which shape survives review.</p>\n<ul>\n<li>Voice-heavy work favours a skill</li>\n<li>Voice-neutral work favours a sub-agent</li>\n<li>Skills can hold a style profile and apply it</li>\n<li>Sub-agents drift toward generic by design</li>\n</ul>\n<p>When the output carries a name, fidelity is the whole game. A capable model with no voice anchor produces text that reads like it came from a committee.</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: give a skill an explicit voice profile with banned phrases and cadence rules. Let it self-check before it shows anyone anything. The trade-off: the profile takes real effort to write once. The trap to avoid: expecting a stateless agent to match a personal style from a single prompt.</p>\n<h3>Implementation note</h3>\n<p>A voice profile is not documentation. It lives in the skill definition, an executable contract the skill checks itself against before a draft is ever shown. A small profile goes a long way.</p>\n# voice-profile (excerpt)\nbanned_phrases: [seamless, robust, game-changing, leverage the power]\nforbid: [em-dash, semicolon, exclamation in body]\nmax_avg_sentence_words: 20\nrequire:\n  - one \"In practice\" block per section\n  - a closing discussion question\nself_check: run before any draft is shown to a human\n\n<h2>3. Put the human gate where the risk is</h2>\n<p>Every AI capability needs a human review gate. The design question is where that gate sits. Placement is the difference between catching a problem early and unpicking it later.</p>\n<ul>\n<li>Skills gate continuously, turn by turn</li>\n<li>Sub-agents gate once, at the end</li>\n<li>Continuous gates catch drift early</li>\n<li>End gates are cheaper but riskier for craft</li>\n</ul>\n<p>If a wrong turn early corrupts everything after it, the team wants a skill. If the work is bounded and a bad output is easy to spot and discard, an end gate is fine.</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: match the gate to the blast radius. High blast radius and subjective quality point to a skill. Low blast radius and objective output point to a sub-agent. The trap to avoid: a one-shot agent doing forty minutes of unattended work that a human then has to unpick.</p>\n<h2>4. The pattern that scales is both</h2>\n<p>The mature answer is not one or the other. It is a skill on top of a sub-agent. The two shapes compose cleanly when each one keeps to its own job.</p>\n<ul>\n<li>The skill orchestrates and holds the voice</li>\n<li>The sub-agent executes bounded sub-tasks</li>\n<li>The human reviews at the skill layer</li>\n<li>Each layer does what it is good at</li>\n</ul>\n<img />\n<p><em>Figure 1. In the combined pattern the human reviews at the skill layer, and the sub-agent only touches the bounded task.</em></p>\n<p>The skill runs the conversation and keeps quality. When it needs a bounded, repeatable job done, it delegates to a sub-agent. The result is iteration where craft lives and automation where the work is mechanical.</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: a skill drafts and refines an article with the author, and calls a sub-agent to fetch and summarise reference material. The trade-off: two layers are more to build than one. The trap to avoid: collapsing both into a single agent and losing either the voice or the automation.</p>\n<h2>The operational trade-offs</h2>\n<p>Shape is not only a design choice. It shows up in cost, latency, and how you debug a bad run. Architects should price these in before committing to a pattern.</p>\n<ul>\n<li>A skill spends more tokens and more human minutes per run</li>\n<li>A sub-agent spends compute once and returns fast</li>\n<li>A skill fails in small, visible steps you can correct</li>\n<li>A sub-agent fails as one block you inspect after the fact</li>\n</ul>\n<p>The cost of a skill is attention. Someone stays in the loop and that time is real. The cost of a sub-agent is rework. When a one-shot run goes wrong, the whole output is suspect and someone redoes it. Observability follows the same split. A skill leaves a turn-by-turn trail you can read. A sub-agent leaves one input and one output. You instrument the boundary and log the prompt and the result. Pick the shape whose failure mode your team can afford. The wrong shape does not announce itself. It shows up later as a cost line or a rewrite.</p>\n<h2>Two capabilities, one team</h2>\n<blockquote>\n<p>Consider a team standardising its engineering work with AI. Two capabilities land on the backlog in the same week. The first is recurring status queries. Well defined input, structured output, no voice. A stateless sub-agent fits. One prompt in, one report out, gate at the end. It works on day one and keeps working.</p>\n<p>The second is authored technical content. Subjective, voice-heavy, many rounds of refinement. The reflex is to reuse the sub-agent that just shipped. That reflex is the mistake. The queries stay clean. The content reads flat and generic, and every draft needs a heavy human rewrite. Rebuilt as a skill with a voice profile and a turn-by-turn gate, the same work compounds instead of fighting back. Same team, same models, two different shapes of work, and only one right tool for each.</p>\n</blockquote>\n<h2>What teams get wrong</h2>\n<p>The common pattern is defaulting to whichever shape the team built first. A team ships one sub-agent, likes it, and forces every new problem into a sub-agent. Or it builds one skill and runs everything as a conversation, including batch work that should be automated.</p>\n<p>It looks like consistency. It feels like reuse. But it leads to craft work that reads generic and batch work that needs babysitting. The fix is not a better model. It is naming the shape of the work before picking the tool.</p>\n<p>The three shapes to watch for in your own stack:</p>\n<ul>\n<li>A voiced deliverable coming out of a one-shot agent, rewritten by hand every run. A skill wearing a sub-agent costume.</li>\n<li>A batch job run as a conversation and babysat turn by turn. A sub-agent wearing a skill costume.</li>\n<li>A large workflow forced into one agent that holds neither the voice nor the automation. Two shapes collapsed into one.</li>\n</ul>\n<p>Name which one you are looking at, and the fix picks itself.</p>\n<h2>A quick way to decide</h2>\n<p>When a new capability lands on the backlog, run four checks before picking a tool.</p>\n<ul>\n<li>Iteration: conversation or one hand-off</li>\n<li>Output: subjective and voiced, or structured and neutral</li>\n<li>Blast radius: does an early wrong turn corrupt the rest</li>\n<li>Frequency: a one-off craft piece, or a repeatable batch job</li>\n</ul>\n<p>Three or more answers leaning subjective and iterative point to a skill. Three or more leaning structured and repeatable point to a sub-agent. A split answer usually means a skill orchestrating a sub-agent underneath.</p>\n<img />\n<p><em>Figure 2. Score the four checks and count the leanings. Three or four one way pick the shape. An even split means a skill orchestrating a sub-agent.</em></p>\n<h2>Where to start depends on what you have already built</h2>\n<p>The framework is the destination. Where you start depends on what your team has shipped so far. Find your stage and take the one first move for it this week.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Stage</th><th>First move, this week</th><th>Watch out for</th></tr><tr><td>Just starting, nothing built yet</td><td>Pick the single task you repeat most and write a one-paragraph capability brief for it, iteration, output, blast radius, and frequency, before you build. The brief names the shape, and the shape names the tool.</td><td>Building a general assistant before you have named one concrete job.</td></tr><tr><td>One capability, reused for everything</td><td>List every job you push through the one tool, find the one whose shape does not match, and rebuild just that one in the right shape. You do not need to replace what works.</td><td>Forcing new work into the tool you already have.</td></tr><tr><td>A small fleet, a handful of capabilities</td><td>Take your largest layered workflow and split it, a skill that holds the voice and the human gate on top, a sub-agent that does the bounded work underneath.</td><td>Capabilities that duplicate each other with no composition between them.</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p><em>Table 2. Same framework, different first move. What you have already built decides where the leverage is this week.</em></p>\n<p>Your setup also shapes the answer. A solo builder should optimise for their own voice and iteration speed, where one strong skill beats three thin ones. A platform team should standardise the capability brief and a shared voice profile, so the fleet stays consistent as more people add to it, and a new capability inherits the house style instead of drifting from it.</p>\n<img />\n<p><em>Figure 3. Whatever you have built so far, the first move has the same shape. Name the work before the tool, then match the shape to the tool.</em></p>\n<h2>The shift</h2>\n<p>The shift is from \"what can the model do\" to \"what shape is the work\". Model capability is table stakes now. The advantage is in matching the capability to the work. Our own capability fleet is built this way, interactive skills and autonomous sub-agents in separate places with an orchestrator on top, and that split is what keeps it maintainable as it grows.</p>\n<p>Iterative and voice-heavy points to a skill. Bounded and mechanical points to a sub-agent. Large and layered points to a skill orchestrating sub-agents. Decide that first, and the model becomes a detail the team can change later without rebuilding anything.</p>\n<p>Most teams collapse both ideas into \"automation\" and end up with neither. The teams that separate them build capabilities they actually reuse.</p>\n<hr />\n<p><strong>Want to discuss?</strong> Drop a comment with patterns you have seen in your environment. I read every reply.</p>\n<!--\nTaxonomy suggestions:\n  Primary product: Azure\n  Secondary: .NET, AI + Machine Learning\n  Tags: AI agents, developer tools, engineering leadership, platform engineering, software design\n-->"
