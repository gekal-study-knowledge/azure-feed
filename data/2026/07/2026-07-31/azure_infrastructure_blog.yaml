"entries":
  "1b953d26f866553d6c95a79d38ed78b2":
    "id": "1b953d26f866553d6c95a79d38ed78b2"
    "title": "Move a live GitLab project between groups without breaking Terraform state or CI/CD"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/move-a-live-gitlab-project-between-groups-without-breaking/ba-p/4539677"
    "published": "2026-07-31 17:00:00"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><span class=\"lia-text-color-15\"><strong>Why this is trickier than it looks&nbsp;</strong></span></p>\n<p>A group transfer in GitLab isn't just a rename. It re-parents the project under a new namespace, which changes every path-based assumption downstream: inherited group variables, group-scoped runners, and any external system that hardcoded the old your-source-group/your-project path. For a plain application repo that's a minor cleanup. For a project that manages infrastructure, four things can bite at once:&nbsp;</p>\n<p>-Terraform state can appear to \"reset\" if the backend address was built from the old project path instead of the stable project ID.&nbsp;<br />-Pipelines can fail because CI/CD variables that were inherited from the old group are no longer in scope.&nbsp;<br />-Terraform jobs can fail on permissions because the runner or service account in the new group has different access.&nbsp;<br />-Cloud authentication can break because a service principal's federated credentials were mapped to the old GitLab repo path.&nbsp;</p>\n<p>&nbsp;</p>\n<p><span>Get ahead of those four and the transfer itself is the easy part.</span> <span>Here's&nbsp;the shape of the move: the project keeps its identity (and its ID), but everything it inherited from the old parent stays behind.</span><span>&nbsp;</span></p>\n<p><span>Group transfer overview — project ID stays the same, inherited resources do not follow:</span><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><span>BEFORE: your-source-group</span><span>&nbsp;</span></p>\n<p><span>your-project&nbsp; |&nbsp; ID 4021</span><span>&nbsp;</span></p>\n<p><span>&nbsp; ├─ GitLab-managed Terraform state</span><span>&nbsp;</span></p>\n<p><span>&nbsp; ├─ Group CI/CD variables (inherited)</span><span>&nbsp;</span></p>\n<p><span>&nbsp; └─ Group runners (inherited)</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>→</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>AFTER: your-target-group</span><span>&nbsp;</span></p>\n<p><span>your-project&nbsp; |&nbsp; ID 4021 (unchanged)</span><span>&nbsp;</span></p>\n<p><span>&nbsp; ├─ GitLab-managed Terraform state</span><span>&nbsp;</span></p>\n<p><span>&nbsp; ├─ Group CI/CD variables (re-create)</span><span>&nbsp;</span></p>\n<p><span>&nbsp; └─ Group runners (re-point)</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table>\n<p>&nbsp;</p>\n</div>\n<p><span>The project (and its GitLab-managed state) moves with its ID intact. The group-scoped variables and runners do not follow it — which is exactly where the rework lives.</span><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>Prerequisites and assumptions&nbsp;</strong></span></p>\n<p>This guide assumes the project you're moving includes:&nbsp;</p>\n<p>-Terraform code spread across multiple folders and environments.&nbsp;<br />-Multiple Git branches and tags.&nbsp;<br />-GitLab-managed Terraform state.&nbsp;<br />-GitLab CI/CD pipelines, variables, and related configuration.&nbsp;</p>\n<p>You'll also want Owner access in both the source and target groups, and a maintenance window you can announce in advance.</p>\n<p><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>Before the move&nbsp;</strong></span></p>\n<p><span>Everything that makes the move safe happens here, while the project is still quiet and reversible.</span><span>&nbsp;</span></p>\n<ul>\n<li><strong><span class=\"lia-text-color-15\">Confirm governance and access -&nbsp;</span></strong><span style=\"font-weight: 400; color: rgb(30, 30, 30);\">Announce the change window and the expected freeze period so nobody pushes into a moving target. Confirm you hold Owner access in both the source and target groups, and that the users and teams who need the project already exist in the target group with the correct roles.</span><span style=\"font-weight: 400; color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><strong><span class=\"lia-text-color-15\">Capture a baseline inventory</span><span style=\"color: rgb(30, 30, 30);\"><span class=\"lia-text-color-15\"> -</span> </span></strong>Write down what \"good\" looks like now so you can&nbsp;compare&nbsp;after the move. Capture the current project path and URL, the default branch and protected-branch rules, the full list of branches and tags, open merge requests and issues, pipeline schedules and their owners, the environment list with protected environments and approvals, and your runner topology (project runners, group runners inherited from the source group, and shared-runner status).<strong><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></strong></li>\n<li><span class=\"lia-text-color-15\"><strong>Check Terraform readiness - </strong></span>For each Terraform root folder,&nbsp;identify&nbsp;the backend configuration pattern and confirm whether it points to the project ID (preferred) or the project path. List every state name in use, confirm there are no active state locks and no running Terraform jobs, and take a state backup for each active state as a safety export.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">Inventory the states GitLab is managing for this root</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">terraform state list</span></li>\n</ul>\n</li>\n<li><span style=\"color: rgb(30, 30, 30);\">Pull a point-in-time backup of each state before you touch anything</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">terraform state pull &gt; backup-&lt;environment&gt;-&lt;state-name&gt;.tfstate</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><strong><span>TIP</span><span>&nbsp;</span></strong></p>\n<p><span>Keep these backups outside the project&nbsp;you're&nbsp;about to&nbsp;move. If the transfer ever needs to be reversed,&nbsp;you'll&nbsp;want the safety net to live somewhere the move&nbsp;can't&nbsp;touch.</span><span>&nbsp;</span></p>\n<ul>\n<li><span class=\"lia-text-color-15\"><strong>Prepare CI/CD variables and secrets - </strong></span>Export and document your project-level CI/CD variables, including their masked and protected flags. Inventory the source-group inherited variables your pipelines&nbsp;actually consume, then prepare the same variables at the target group (or pull them down to project scope if&nbsp;that's&nbsp;cleaner). Review&nbsp;your .gitlab-ci.yml&nbsp;includes and&nbsp;templates for any references to the old group or project path.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">Watch for includes that hardcode the old namespace and will break after the move</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">include: </span>- project: 'your-source-group/ci-templates' and file: '/terraform/plan.yml'<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ul>\n</li>\n</ul>\n</li>\n<li><strong><span class=\"lia-text-color-15\">Freeze and lock down - </span></strong>Put a temporary merge freeze in place, pause scheduled pipelines, and make sure no release or deployment jobs are running. Tell the team to hold pushes during the transfer window.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">Checklist: before the move</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span>Change window announced and&nbsp;freeze&nbsp;period agreed.</span><span>&nbsp;</span></li>\n<li><span>Owner access&nbsp;confirmed&nbsp;in both groups.</span><span>&nbsp;</span></li>\n<li><span>Baseline inventory captured (branches, tags, MRs, issues, schedules, environments, runners).</span><span>&nbsp;</span></li>\n<li><span>Backend pattern verified as project ID versus path, per root.</span><span>&nbsp;</span></li>\n<li><span>State backups exported and stored off-project.</span><span>&nbsp;</span></li>\n<li><span>CI/CD variables documented and staged in the target group.</span><span>&nbsp;</span></li>\n<li><span>Merge freeze on, schedules paused, no active deploys.</span><span>&nbsp;</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>Executing the move&nbsp;</strong></span></p>\n<p><span>With the project frozen and backed up, the transfer itself is quick. Keep your eyes on one number: the project ID.</span><span>&nbsp;</span></p>\n<ul>\n<li><span class=\"lia-text-color-15\"><strong>Run the transfer - </strong></span>In the project's&nbsp;<span style=\"color: rgb(30, 30, 30);\">Settings &gt; General &gt; Advanced</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;section, transfer the project to the target group. Confirm the transfer succeeds, note the new namespace path, and verify that the project ID has not changed. The unchanged project ID is what lets your Terraform state and your rollback plan keep working.</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><span class=\"lia-text-color-15\"><strong>Validate immediately</strong></span><span style=\"color: rgb(30, 30, 30);\"><span class=\"lia-text-color-15\"><strong> -</strong></span> </span>Right after the move, confirm the repository is&nbsp;present&nbsp;and that branches, tags, merge requests, and issues are all visible. Check that the default branch and protected branches&nbsp;survived, and&nbsp;confirm the&nbsp;project&nbsp;visibility level (the target&nbsp;group's&nbsp;settings can constrain it).<span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li><span class=\"lia-text-color-15\"><strong>Cut over CI/CD and runners</strong></span><span style=\"color: rgb(30, 30, 30);\"><span class=\"lia-text-color-15\"><strong> -</strong></span> </span>Verify that the runners you need are available in the target context, and re-enable or pin them as required. Re-create or validate the variables that used to be inherited from the old group, confirm your project-level variables are intact, and only unpause schedules after a smoke pipeline succeeds.</li>\n<li><span class=\"lia-text-color-15\"><strong>Run a Terraform safety pass - </strong></span>Do a dry run for each Terraform root before you trust anything. Confirm the backend resolves to the existing GitLab-managed state, run a plan per environment, and make sure the state lock and unlock cycle still works.\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">terraform init</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><span style=\"color: rgb(30, 30, 30);\">terraform plan&nbsp;&nbsp; # expect no unexpected recreation</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ul>\n</li>\n<li><span>&nbsp;</span><span class=\"lia-text-color-15\"><strong>Checklist: executing the move -&nbsp;</strong></span>\n<ul>\n<li><span>Transfer completed and new namespace path recorded.</span><span>&nbsp;</span></li>\n<li><span>Project ID confirmed unchanged.</span><span>&nbsp;</span></li>\n<li><span>Repo, branches, tags, MRs, and issues all visible.</span><span>&nbsp;</span></li>\n<li><span>Default and protected branches intact.</span><span>&nbsp;</span></li>\n<li><span>Runners available and pinned in the new context.</span><span>&nbsp;</span></li>\n<li><span>Inherited variables re-created; project variables intact.</span><span>&nbsp;</span></li>\n<li><span>Dry-run plans clean before schedules are unpaused.</span><span>&nbsp;</span></li>\n</ul>\n</li>\n</ul>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>After the move -&nbsp;</strong></span></p>\n<p><span>Now&nbsp;confirm&nbsp;the project is genuinely healthy, not just present.</span><span>&nbsp;</span></p>\n<ul>\n<li><span class=\"lia-text-color-15\"><strong>Validate Terraform end to end - </strong></span>For each root, confirm&nbsp;terraform&nbsp;init&nbsp;succeeds,&nbsp;terraform&nbsp;plan shows the drift you expect (ideally none), and state list and pull are accessible. Check that there are no orphaned or duplicate state files.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">terraform init</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><span style=\"color: rgb(30, 30, 30);\">terraform plan</span><span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li>terraform state list<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ul>\n</li>\n</ul>\n</li>\n<li><span class=\"lia-text-color-15\"><strong>Re-check access and security - </strong></span>Validate the role model in the new group (Maintainer, Developer, Reporter) and re-test masked and protected variable&nbsp;behavior&nbsp;so secrets still mask in job logs.<span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li><span class=\"lia-text-color-15\"><strong>Clean up operationally</strong></span><span style=\"color: rgb(30, 30, 30);\"><span class=\"lia-text-color-15\"><strong> -</strong></span> </span>Update local Git remotes to the new&nbsp;URL, and&nbsp;update your docs and runbooks with the new namespace and project path.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">git remote set-url origin https://gitlab.example.com/your-target-group/your-project.git</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ul>\n</li>\n<li><span class=\"lia-text-color-15\"><strong>Stay in&nbsp;hypercare - </strong></span>For a short window after the move, watch pipelines and Terraform plans closely. Unexpected drift is easiest to catch and reason&nbsp;about while&nbsp;the change is fresh.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><strong><span class=\"lia-text-color-15\">Checklist: after the move - </span></strong>\n<ul>\n<li><span>terraform init and terraform plan clean per root.</span><span>&nbsp;</span></li>\n<li><span>No orphaned or duplicate state files.</span><span>&nbsp;</span></li>\n<li><span>Roles and masked/protected variables verified.</span><span>&nbsp;</span></li>\n<li><span>Git remotes, docs, and runbooks updated to the new path.</span><span>&nbsp;</span></li>\n<li><span>Pipelines and plans&nbsp;monitored&nbsp;through&nbsp;hypercare.</span><span>&nbsp;</span></li>\n</ul>\n</li>\n</ul>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>Gotchas that will bite you&nbsp;</strong></span></p>\n<p><span>This is the part I wish someone had handed me before the move. Each gotcha follows the same shape: a symptom&nbsp;you'll&nbsp;see, the cause underneath it, and the fix.</span> <span>&nbsp;</span></p>\n<p><span>&nbsp;</span>⚠️&nbsp; WARNING — Re-point the service principal's federated credentials -</p>\n<div>If your Terraform authenticates to the cloud with a service principal using workload-identity federation, the App Registration's federated credential is mapped to the old GitLab repo path. After the transfer, authenticated Terraform runs fail even though the state is fine, because the identity no longer matches the new namespace.&nbsp;</div>\n<div>&nbsp;</div>\n<div><strong>Symptom:</strong> plans or applies fail on authentication or token issuance after an otherwise clean move.&nbsp;</div>\n<div><strong>Cause:</strong> the federated credential subject still references your-source-group/your-project.&nbsp;</div>\n<div><strong>Fix:</strong> update the federated credential in the App Registration to point at the new your-target-group/your-project path.&nbsp;</div>\n<p>&nbsp;</p>\n<ul>\n<li><span class=\"lia-text-color-15\"><strong>The backend built from project ID versus project path - </strong></span>GitLab-managed Terraform state lives at an HTTP backend address. When that address is keyed to the stable project ID, it survives a group transfer untouched. When&nbsp;it's&nbsp;keyed to the&nbsp;project&nbsp;path, the address changes the moment the namespace&nbsp;changes, and&nbsp;Terraform can no longer find the existing state — so a plan looks like a brand-new, empty deployment.<span style=\"color: rgb(30, 30, 30);\"> </span>\n<ul>\n<li>\n<p><span><strong>Symptom:</strong>&nbsp;</span><span>after the move,&nbsp;terraform&nbsp;plan proposes to create everything from scratch.</span></p>\n</li>\n<li>\n<p><span><strong>Cause:</strong> </span><span>the backend address was derived from the old project path.</span></p>\n</li>\n<li>\n<p><span><strong>Fix:</strong>&nbsp;</span><span>point the backend at the project-ID form of the address (which is unchanged by the move) and re-run the plan. See the&nbsp;</span><span>Terraform GitLab-managed state docs</span><span>&nbsp;for the exact address format.</span><span>&nbsp;</span></p>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;# Stable: keyed to the numeric project ID — survives a namespace change<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></p>\n<p><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;# https://gitlab.example.com/api/v4/projects/&lt;PROJECT_ID&gt;/terraform/state/&lt;state-name&gt;</span></p>\n<p><span><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span></span><span># Fragile: keyed to the project path — breaks the moment the group changes</span><span>&nbsp;</span></p>\n<p><span><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span></span><span># https://gitlab.example.com/api/v4/projects/your-source-group%2Fyour-project/terraform/state/&lt;state-name&gt;</span><span>&nbsp;</span></p>\n<ul>\n<li><span class=\"lia-text-color-15\"><strong>Variables that vanish with the old group -</strong></span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\"><strong>Symptom:</strong> </span><span style=\"color: rgb(30, 30, 30);\">pipelines that passed yesterday now fail on missing configuration.</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><span style=\"color: rgb(30, 30, 30);\"><strong>Cause:</strong> </span><span style=\"color: rgb(30, 30, 30);\">those values were inherited from the source group and&nbsp;aren't&nbsp;in scope under the new parent.</span><span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li><strong>Fix:</strong> <span style=\"color: rgb(30, 30, 30);\">re-create them at the target&nbsp;group, or&nbsp;pull the essential ones down to project&nbsp;scope&nbsp;so they travel with the project.</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ul>\n</li>\n<li><span>&nbsp;</span><span class=\"lia-text-color-15\"><strong>Runner and service-account permission differences -</strong></span>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\"><strong>Symptom:</strong> </span><span style=\"color: rgb(30, 30, 30);\">jobs queue forever or fail on permissions.</span><span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li><strong>Cause:</strong> <span style=\"color: rgb(30, 30, 30);\">the new group offers different runners, or the&nbsp;runner's&nbsp;service account has different access than the old&nbsp;group's.</span><span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li><strong>Fix:</strong> <span style=\"color: rgb(30, 30, 30);\">confirm runner availability in the target context, pin the runners you need, and reconcile the service-account permissions before unpausing schedules.</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ul>\n</li>\n</ul>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>NOTE - </strong></span><span>GitLab preserves a lot on transfer, but it&nbsp;can't&nbsp;preserve anything that lived outside the project — like group-inherited variables or an external identity mapped to your old path. For the transfer mechanics themselves, the official&nbsp;</span><span>&nbsp;</span></p>\n<p><span>GitLab transfer-a-project docs are the authoritative reference:</span><span>&nbsp;</span></p>\n<p><strong><span>https://docs.gitlab.com/ee/user/project/settings/index.html#transfer-a-project-to-another-namespace</span><span>&nbsp;</span></strong></p>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>What's&nbsp;preserved vs. what needs rework</strong></span></p>\n<p><span>&nbsp;</span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; height: 260px; border-width: 1px;\"><tbody><tr style=\"height: 38.6667px;\"><td style=\"height: 38.6667px;\">\n<p><strong><span>Preserved automatically</span><span>&nbsp;</span></strong></p>\n</td><td style=\"height: 38.6667px;\">\n<p><strong><span>Requires rework after the move</span><span>&nbsp;</span></strong></p>\n</td></tr><tr style=\"height: 38.6667px;\"><td style=\"height: 38.6667px;\">\n<p><span>Git history, commits, branches, and tags</span><span>&nbsp;</span></p>\n</td><td style=\"height: 38.6667px;\">\n<p><span>Group-level CI/CD variables inherited from the old group</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 38.6667px;\"><td style=\"height: 38.6667px;\">\n<p><span>Merge requests, issues, milestones, labels, and wiki</span><span>&nbsp;</span></p>\n</td><td style=\"height: 38.6667px;\">\n<p><span>Access that came from old group membership</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 38.6667px;\"><td style=\"height: 38.6667px;\">\n<p><span>In-repo CI/CD config (.gitlab-ci.yml)</span><span>&nbsp;</span></p>\n</td><td style=\"height: 38.6667px;\">\n<p><span>Old group runners inherited at group scope</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 38.6667px;\"><td style=\"height: 38.6667px;\">\n<p><span>Project-level CI/CD variables</span><span>&nbsp;</span></p>\n</td><td style=\"height: 38.6667px;\">\n<p><span>External systems that hardcoded the old namespace or project path</span><span>&nbsp;</span></p>\n</td></tr><tr style=\"height: 66.6667px;\"><td style=\"height: 66.6667px;\">\n<p><span>GitLab-managed Terraform state tied to the same project (project ID unchanged)</span><span>&nbsp;</span></p>\n</td><td style=\"height: 66.6667px;\">\n<p><span>Service principal federated credentials mapped to the old repo path (see Warning above)</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p><span>&nbsp;</span></p>\n<p><strong><span class=\"lia-text-color-15\">How to verify (evidence to capture)&nbsp;</span></strong></p>\n<p><span>Treat verification as a read-only exercise first. The goal is proof that nothing changed under you, captured one environment at a time.</span><span>&nbsp;</span></p>\n<p><span>Work through the environments individually rather than all at once. For each one, run a read-only plan before anything else, investigate any proposed create or destroy before you apply, and confirm the state key name stays&nbsp;exactly identical&nbsp;to what it was before the move. If the state key naming drifts, stop and fix the backend address before&nbsp;proceeding.</span><span>&nbsp;</span></p>\n<p><span>Capture this evidence as you go:</span></p>\n<ul>\n<li><span style=\"color: rgb(30, 30, 30);\">A screenshot of the project transfer success page showing the new namespace and unchanged project ID.</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><span>A screenshot of branches and tags after the move.</span><span>&nbsp;</span></li>\n<li><span>A screenshot of CI/CD variables and runner availability in the new context.</span></li>\n<li>The IDs of the first successful pipeline runs.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><span>The terraform plan summaries for each root and environment.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>If something goes wrong: how to roll back&nbsp;</strong></span></p>\n<p><span>Your rollback plan is already in place if you did the prep. It rests on three facts from earlier in this process, and it needs nothing you&nbsp;haven't&nbsp;already prepared.</span><span>&nbsp;</span></p>\n<ul>\n<li><span>You took a state backup for every active state before the move (from the readiness step). If a plan looks wrong, you can&nbsp;restore from&nbsp;those backups rather than letting an apply run.</span><span>&nbsp;</span></li>\n<li><span>The merge&nbsp;freeze&nbsp;and paused schedules are still holding, so nothing is racing your recovery. The freeze window is the safe point to restore a state backup or reverse the move.</span><span>&nbsp;</span></li>\n<li><span>The project ID never changed, which means the project can be transferred back to the source group the same way it came, and the same GitLab-managed state (keyed to that ID) remains valid.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>&nbsp;</span><span class=\"lia-text-color-15\"><strong>CAUTION - </strong></span><span>Only lift the freeze and&nbsp;unpause&nbsp;schedules once your read-only plans are clean. The freeze is what keeps rollback simple; releasing it early is what turns a small correction into an incident.</span><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>Lessons learned&nbsp;</strong></span></p>\n<ul>\n<li><span>Key your Terraform backend to the project ID, not the project path.&nbsp;It's&nbsp;the single decision that makes a group transfer boring instead of terrifying.</span><span>&nbsp;</span></li>\n<li><span>Federated credentials are&nbsp;path-shaped. If a cloud identity trusts your old repo path, it&nbsp;won't&nbsp;trust the new one until you re-map it.</span><span>&nbsp;</span></li>\n<li><span>Inventory before you inherit. Group-inherited variables and runners don't move with the project, so know what you depend on before you cut the cord.</span></li>\n<li><span>A freeze plus off-project backups is your whole rollback plan. Keep both until your plans come back clean.</span><span>&nbsp;</span></li>\n<li><span>Verify read-only, one environment at a time. Drift is easy to reason about in isolation and painful to untangle in bulk.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>&nbsp;</span></p>\n<p><span>Have you moved a Terraform-managed GitLab project between groups?&nbsp;I'd&nbsp;love to hear which gotcha caught you, and whether the project-ID backend trick saved you the way it saved us. Drop your experience (or your horror story) in the comments.</span><span>&nbsp;</span></p>"
