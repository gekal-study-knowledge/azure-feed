    "title": "From Policy to Proof: Governing AI to Scale Human Ambition and Machine Intelligence"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/from-policy-to-proof-governing-ai-to-scale-human-ambition-and/ba-p/4535137"
    "published": "2026-07-16 04:51:51"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><span>Enterprises are moving from AI experiments to AI in production. Copilots are in the flow of daily work, custom applications are built on foundation models, and autonomous agents are beginning to take actions on behalf of the business. As organizations combine&nbsp;</span><strong><span>human ambition with machine intelligence</span></strong><span><strong>, trust becomes the defining requirement</strong> for scaling AI responsibly and realizing AI's full potential.</span><span>&nbsp;</span></p>\n<p><span>That shift changes the governance question from&nbsp;</span><em><strong><span>\"can we use AI responsibly?\"</span></strong></em><span><em><strong>&nbsp;</strong></em>to&nbsp;a harder one:<em><strong>&nbsp;</strong></em></span><em><strong><span>\"can we prove, continuously, that every AI system and agent in our estate is safe, compliant, observable, and accountable?\"</span><span>&nbsp;</span></strong></em></p>\n<p><span>The organizations getting this right have stopped treating governance as a static document that lives in a policy binder. They treat it as an operating system: a connected set of policies, controls, telemetry, and evidence that runs alongside AI everywhere it&nbsp;operates.&nbsp;Governance defines what should happen.&nbsp;Observability and evaluations verify what is actually happening.&nbsp;Audit and response prove it, and feed what they learn back into policy. The loop, not any single control, is what makes governance real.</span><span>&nbsp;</span></p>\n<p><span>Every control in this map ladders up to a principled foundation:&nbsp;</span><a href=\"https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/final/en-us/microsoft-brand/documents/Microsoft-Responsible-AI-Standard-General-Requirements.pdf?culture=en-us&amp;country=us\" rel=\"noopener\" target=\"_blank\"><span><span>Microsoft's Responsible AI Standard</span></span></a><span>, whose six principles (fairness, reliability and safety, privacy and security, inclusiveness, transparency, and accountability) set the bar these controls exist to meet.</span><span>&nbsp;</span></p>\n<p><span>This post lays out a practical reference map for that operating system: the&nbsp;domains&nbsp;AI governance must cover, the cross-cutting runtime enforcement layer that operationalizes them, and the Microsoft services that support each one.</span><span>&nbsp;</span></p>\n<h2><u><span class=\"lia-text-color-21\"><strong>The four pillars of AI governance</strong></span></u></h2>\n<p>At its core, AI governance does four things. Skip any one of them and a gap opens up -policy without control is aspirational, control without visibility is blind, and visibility without proof cannot withstand an audit.</p>\n<ol>\n<li><strong>Policy - Define the rules</strong>, and who owns them. What's acceptable use, which use cases are approved, how each is classified by risk, and -critically -who is accountable for outcomes at each stage.</li>\n<li><strong>Control - Enforce the boundaries</strong>, proportionate to risk. Turn policy into guardrails, access decisions, and lifecycle gates that constrain systems at runtime -with tighter controls on higher-risk use cases.</li>\n<li><strong>Visibility - Observe behavior</strong>, including fairness and quality. Capture logs, metrics, traces, token consumption, tool calls, and runtime signals that reveal what AI is truly doing -not just latency and cost, but grounding, drift, and fairness signals.</li>\n<li><strong>Proof - Audit, prove, and improve</strong>. Produce the evidence to demonstrate compliance and transparency (explainability and traceability you can show regulators and customers), investigate incidents, and feed what you learn back into policy.</li>\n</ol>\n<h1><u><span class=\"lia-text-color-21\"><strong>What AI governance covers: the domain map</strong></span></u></h1>\n<p>A complete AI governance program spans nine core domains, with runtime enforcement operating as a cross-cutting layer across several of them. Use this taxonomy to map your own requirements to concrete controls:&nbsp;&nbsp;</p>\n<ul>\n<li><strong>Policy:</strong> Responsible AI policies, approval workflows, and guardrails.</li>\n<li><strong>Data governance:</strong> Classification, sensitivity labels, DLP, retention, and lineage.</li>\n<li><strong>Model governance:</strong> Validation, versioning, documentation, and change control.</li>\n<li><strong>Observability:</strong> Logs, metrics, traces, token usage, and runtime signals.</li>\n<li><strong>Evaluations:</strong> Quality, safety, grounding, drift, and agent task success.</li>\n<li><strong>Security:</strong> Threat detection, posture management, proactive AI red teaming, and prompt-injection resistance.</li>\n<li><strong>Identity &amp; access:</strong> RBAC, least privilege, conditional access, and agent identities.</li>\n<li><strong>Audit &amp; compliance:</strong> Evidence, eDiscovery, legal hold, and reporting.</li>\n<li><strong>Agent governance:</strong> Registry, lifecycle, policy enforcement, and fleet visibility.</li>\n</ul>\n<p><strong>Cross-cutting runtime enforcement:</strong> Runtime enforcement is not a separate governance program. It is the control layer that operationalizes policy, security, identity, data protection, observability, and agent governance while AI systems are running. It governs live interactions between users, agents, models, tools, APIs, MCP servers, A2A agent APIs, and enterprise systems through authentication, authorization, traffic controls, token governance, quotas, policy checks, and operational guardrails.</p>\n<h3><strong>The Microsoft governance stack</strong></h3>\n<p>Microsoft's approach is a composed platform rather than a single product — AI lifecycle, data governance, identity, security, observability, and audit working together:</p>\n<img />\n<h3>1. Policy and the control plane: define and enforce</h3>\n<p>Governance starts with a place to define the rules and decide who owns them. This is where responsible AI and acceptable use policies are authored; where new use cases come in through intake, get classified by risk, and are approved or rejected; where you decide up front which decisions and agent actions require human sign-off versus running autonomously within guardrails; and where accountability is assigned across the deploy, update, and retire lifecycle. Enforcing those rules through runtime guardrails, security posture, agent-level controls, and API-level controls is the job of the sections that follow; the work here is defining what “acceptable” means before anything is switched on.&nbsp;</p>\n<p><strong>Services that support it:</strong></p>\n<ul>\n<li><strong>Microsoft Foundry</strong> -Compliance workspace for authoring and housing responsible AI policies and use case approvals.</li>\n<li><strong>Azure Policy</strong> -Resource level governance to codify those rules as enforceable baselines.</li>\n<li><strong>Azure API Management (AI Gateway):&nbsp;</strong>Runtime enforcement for AI applications, models, agents, tools, and APIs, including authentication, authorization, token governance, quota management, and policy enforcement.&nbsp;</li>\n</ul>\n<p>(Agent specific policy and lifecycle controls via Microsoft Agent 365 are covered in Section 6.)</p>\n<p><strong>Practical takeaway: </strong>establish a governance baseline before AI and agent adoption scales -including deciding up front where a human stays in the loop. Retrofitting controls onto a sprawling estate is far harder than starting from one.</p>\n<h3>2. Data governance and compliance: Purview at the center</h3>\n<p><span>Most AI risk is&nbsp;ultimately data&nbsp;risk: the&nbsp;wrong information&nbsp;reaching a model, leaving through a response, or being&nbsp;retained&nbsp;without a policy.&nbsp;</span><a href=\"https://www.microsoft.com/en-us/security/business/microsoft-purview\" rel=\"noopener\" target=\"_blank\"><span><span>Microsoft Purview</span></span></a><span>&nbsp;is the primary governance engine for AI interactions and enterprise data controls, and it works in three moves:</span><span>&nbsp;</span></p>\n<ul>\n<li><strong>Discover - </strong>Identify AI usage, sensitive prompts and responses, and overall risk posture with DSPM for AI.</li>\n<li><strong>Protect - </strong>Apply sensitivity labels, DLP, access boundaries, and retention policies.</li>\n<li><strong>Prove - </strong>Generate audit trails, eDiscovery evidence, and compliance reporting.</li>\n</ul>\n<p>If the question is <em>“how do we govern the data flowing through AI?”</em> - Purview is the anchor.</p>\n<h3>3. Model governance, safety, and evaluations: quality at build time and runtime</h3>\n<p>Evaluations are what make governance measurable, and they belong at two points in the lifecycle:</p>\n<ul>\n<li><strong>Pre-deployment - </strong>Release gating on safety, grounding, quality, fairness, and task success before anything ships.</li>\n<li><strong>Post-deployment - </strong>Runtime scoring for drift, quality thresholds, and harmful-output alerts once a system is live.</li>\n</ul>\n<p><strong>Services that support it:&nbsp;</strong></p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators\" rel=\"noopener\" target=\"_blank\"><span><span>Microsoft Foundry evaluators</span></span></a><span>:</span><span>&nbsp;quality, safety, RAG grounding, and agent task metrics</span><span>&nbsp;</span></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview\" rel=\"noopener\" target=\"_blank\"><span><span>Azure AI Content Safety</span></span></a><span>:</span><span>&nbsp;detects unsafe or harmful content in prompts and responses. This is also integrated in Microsoft Foundry as guardrails that protect against unsafe content and direct and indirect&nbsp;jailbreak&nbsp;prompt injection attacks.</span><span>&nbsp;</span></li>\n<li><a href=\"https://github.com/responsibleai/ASSERT\" rel=\"noopener\" target=\"_blank\"><span><span>ASSERT</span></span></a><span>&nbsp;(open source):</span><span>&nbsp;Microsoft's open-source, policy-driven evaluation framework, short for Adaptive Spec-driven Scoring for Evaluation and Regression Testing. ASSERT turns your&nbsp;specific requirements and&nbsp;organizational policies into targeted, safety-focused test cases rather than generic benchmarks, and runs across frameworks such as&nbsp;LangChain,&nbsp;CrewAI,&nbsp;LiteLLM, and OpenAI, so evaluation is not locked to any single stack. ASSERT also pairs with runtime controls to close the loop: measure a failure rate, apply a control (see&nbsp;</span><a href=\"https://commandline.microsoft.com/agent-control-specification-runtime-governance/\" rel=\"noopener\" target=\"_blank\"><span><span>Agent Control Specification</span></span></a><span>&nbsp;in section 6), then re-run the same evaluation to prove the rate dropped. That turns \"we mitigated it\" into a measured before-and-after.</span><span>&nbsp;</span></li>\n</ul>\n<p>Evaluations are not separate from governance - they are what turn governance from a promise into measurable proof.&nbsp;</p>\n<h3>4. Observability and runtime monitoring: know what is actually happening</h3>\n<p><span>Once AI is in production, you need to see its behavior in real time. Capture four kinds of signal:</span><span>&nbsp;</span></p>\n<ul>\n<li><strong><span>Logs:</span></strong><span>&nbsp;prompts, responses, and decisions</span><span>&nbsp;</span></li>\n<li><strong><span>Metrics:</span></strong><span>&nbsp;latency, token usage, quality scores, request volume, and quota consumption</span><span>&nbsp;</span></li>\n<li><strong><span>Traces:</span></strong><span><strong>&nbsp;</strong>agent reasoning paths, tool calls, model calls, and inter-service dependencies</span><span>&nbsp;</span></li>\n<li><strong><span>Alerts:</span></strong><span><strong>&nbsp;</strong>policy violations, drift, harmful outputs, and abnormal traffic patterns</span><span>&nbsp;</span></li>\n</ul>\n<p><span>Microsoft Foundry provides purpose-built observability for AI applications and agents across three connected capabilities. Evaluation measures quality, safety, and reliability throughout development. Monitoring tracks deployed systems in real-world conditions. Tracing, built on OpenTelemetry standards, captures the execution flow of LLM calls, tool invocations, and agent decisions, so you can debug multi-step reasoning rather than guess at it, across frameworks including LangChain, LangGraph, the OpenAI Agents SDK, and the Microsoft Agent Framework. The Agent Monitoring Dashboard brings these signals together for production traffic: token usage, latency, run success rates, evaluation scores, and red-teaming results in one view, backed by Azure Monitor, Application Insights. From the same surface you can turn on continuous evaluation to score sampled live responses, scheduled evaluations to detect drift against benchmarks, scheduled red team scans to probe deployed agents for emerging risks, and alerts that fire when outputs fail quality thresholds or produce harmful content.</span><span>&nbsp;</span></p>\n<p><span>Critically, this coverage is not limited to agents built on Foundry. Agents running elsewhere can be onboarded through the AI Gateway and instrumented with&nbsp;OpenTelemetry&nbsp;semantic conventions to send telemetry to the same Application Insights instance, so one dashboard, one evaluation pipeline, and one alerting surface cover the whole estate.</span><span>&nbsp;</span></p>\n<p><strong><span>The broader observability fabric</span><span>&nbsp;</span></strong></p>\n<p><span>Foundry observability composes with the rest of the platform: Azure Monitor, Application Insights, Log Analytics, Purview Audit, and Microsoft Agent 365 dashboards. Azure API Management (AI Gateway) extends visibility further by capturing AI traffic patterns, token consumption, API usage, policy violations, and agent-to-tool interactions,&nbsp;providing&nbsp;runtime insight into AI workloads at the network boundary.</span><span>&nbsp;</span></p>\n<p><strong><span>Practical takeaway:</span></strong><span><strong>&nbsp;</strong>wire&nbsp;observability&nbsp;before launch, not after the first incident. Continuous evaluation on sampled production traffic is the cheapest early-warning system you can buy, and the trace data it rides on is the same evidence an auditor will ask for later.</span><span>&nbsp;</span></p>\n<h3>5. Security and identity governance: protect the AI estate</h3>\n<p>AI expands the attack surface, so governance has to include security and identity across the following:</p>\n<ul>\n<li><strong>Threat protection -</strong>Prompt injection, jailbreak, data exfiltration, and unsafe actions -with Microsoft Defender for Cloud and Microsoft Defender XDR.</li>\n<li><strong>Proactive adversarial testing -</strong>Find failures before attackers do, with the AI Red Teaming Agent in Microsoft Foundry for automated agent probing and PyRIT, Microsoft’s open-source red-teaming framework.</li>\n<li><strong>Security posture -</strong>Misconfigurations, exposed endpoints, and risky resources -with Defender for Cloud and Azure Policy.</li>\n<li><strong>Identity &amp; access -</strong>Who can use AI, and what data, apps, and agents it can reach -with Microsoft Entra ID and RBAC.</li>\n<li><strong>Runtime access enforcement:&nbsp;</strong>Who can call which model, tool, API, or MCP server, under which conditions, and with what level of throttling, inspection, and monitoring.&nbsp;</li>\n<li><strong>Secrets &amp; network -</strong>Protecting keys and enforcing private access and network boundaries -with Azure Key Vault and Private Link.</li>\n<li><strong>Device management</strong>-Discover, monitor, and govern unmanaged AI agents and the endpoints they run on -with Microsoft Intune and Microsoft Defender for Endpoint (MDE).</li>\n</ul>\n<p><strong>Cross-cutting runtime enforcement&nbsp;</strong></p>\n<p>As AI systems increasingly rely on APIs, tools, MCP servers, enterprise applications, and agent-to-agent interactions, governance must extend beyond model build-time controls to the live interactions that&nbsp;connect&nbsp;those systems. Runtime enforcement helps operationalize the broader AI governance program by enforcing who can call what, under which conditions, at what scale, and with what level of monitoring.&nbsp;</p>\n<p><strong>Services that support it&nbsp;:</strong></p>\n<ul>\n<li><strong>Azure API Management (AI Gateway):&nbsp;</strong>Centralized authentication, authorization, token controls, traffic shaping, quota enforcement, content safety policies, and policy governance for AI models, agents, tools, MCP servers, A2A agent APIs, and enterprise APIs.&nbsp;</li>\n<li><strong>Microsoft Entra ID: </strong>Identity and access control for applications, users, and agents.&nbsp;</li>\n<li><strong>Azure RBAC:&nbsp;</strong>Fine-grained authorization for AI resources and workloads.&nbsp;</li>\n</ul>\n<p><strong>The mindset shift: </strong>treat agents as non-human identities with their own permissions, lifecycle, runtime access and monitoring.</p>\n<h3>6. Agent governance: the emerging control plane</h3>\n<p>Agents are a new kind of enterprise actor, and governing them takes two complementary pieces: a control plane to manage the whole fleet, and a portable control standard to enforce safety inside each agent's workflow.</p>\n<h5><strong>Microsoft Agent 365: govern the agent fleet</strong></h5>\n<p>Agents introduce a new problem - sprawl. As teams build agents on different platforms, organizations need one way to see and govern all of them. Microsoft Agent 365, now generally available, is the control plane for AI agents: it gives each agent its own identity and manages agents with the admin tools you already use - Microsoft Entra, Defender, Purview, Intune, and the Microsoft 365 admin center. It works across agents built on Microsoft, open-source, and third-party platforms, through five core capabilities:</p>\n<ul>\n<li><strong>Registry - </strong>Discover and catalog every agent - including shadow agents - and quarantine the unsanctioned ones.</li>\n<li><strong>Access control - </strong>Give each agent a unique Microsoft Entra Agent ID, and enforce least-privilege, risk-based access with policy templates.</li>\n<li><strong>Visualization - </strong>Unified dashboards, telemetry, and alerts across the entire agent fleet.</li>\n<li><strong>Interoperability - </strong>Works with agents from Microsoft, open-source, and third-party frameworks, alongside your Microsoft 365 apps and data.</li>\n<li><strong>Security - </strong>Threat detection, data protection, and compliance for agents at scale, through Defender, Purview, and Entra.</li>\n</ul>\n<h5><strong>Agent Control Specification (ACS): portable runtime controls</strong></h5>\n<p><span>Governing agents also means enforcing controls consistently, no matter which framework an agent is built on. The&nbsp;</span><a href=\"https://commandline.microsoft.com/agent-control-specification-runtime-governance/\" rel=\"noopener\" target=\"_blank\"><span><span>Agent Control Specification (ACS)</span></span></a><span>&nbsp;is an open industry standard, part of Microsoft's Agent Governance Toolkit, for placing deterministic safety and security controls at defined checkpoints in an agent's workflow. Just as the Model Context Protocol (MCP) standardized how agents connect to tools, and A2A standardized how agents communicate with each other, ACS aims to standardize how agents are governed: one portable control layer that any framework can adopt, with Microsoft providing reference implementations.</span><span>&nbsp;</span></p>\n<ul>\n<li><strong><span>Control checkpoints:</span></strong><span>&nbsp;validation at defined intervention points across the agent's lifecycle, spanning input, model invocation, state, tool selection and execution, and output</span><span>&nbsp;</span></li>\n<li><strong><span>Composable controls:</span></strong><span>&nbsp;deterministic checks (allow/deny rules, custom filters) alongside model-based checks (classifier endpoints, LLM judges), each placed exactly where it is needed</span><span>&nbsp;</span></li>\n<li><strong><span>Portable and auditable:</span></strong><span>&nbsp;expressed as a declarative manifest with policy-as-code evaluation, so controls are&nbsp;versionable, auditable, and travel with the agent across any stack</span><span>&nbsp;</span></li>\n</ul>\n<p>Together they cover both altitudes of agent governance: Agent 365 governs the fleet from the outside, while ACS enforces safety inside each agent's workflow. Those checkpoints can also&nbsp;<strong>route to a human for approval before a high-impact action</strong> -the runtime side of human-in-the-loop -while Agent 365 defines which agents and actions require sign-off.</p>\n<h1><u><strong>The governance service map</strong></u></h1>\n<p>Use this as a quick reference for matching each governance area to the Microsoft services that support it. Runtime enforcement is shown as a cross-cutting capability because it operationalizes several domains rather than replacing them:&nbsp;</p>\n<img />\n<h1><u><strong>A practical path forward</strong></u></h1>\n<p>You do not have to govern everything at once. A pragmatic sequence gets you to a defensible position quickly:&nbsp;</p>\n<ul>\n<li><strong>Start with scope:&nbsp;</strong>Inventory the AI apps, Copilots, agents,&nbsp;APIs, tools, MCP servers,&nbsp;and custom Microsoft Foundry workloads that exist today.&nbsp;</li>\n<li><strong>Classify risk: </strong>Determine&nbsp;what data is used, what actions AI can take,&nbsp;what systems it can reach,&nbsp;and which regulations apply.&nbsp;</li>\n<li><strong>Apply controls: </strong>Bring in Purview, Entra, Defender, Microsoft Foundry guardrails,&nbsp;Azure API Management AI Gateway policies,&nbsp;Agent 365 policies, and portable ACS checkpoints for agents.&nbsp;</li>\n<li><strong>Measure and prove: </strong>Add evaluations, including policy-driven ASSERT runs and adversarial testing with the AI Red Teaming Agent, plus observability,&nbsp;APIM runtime telemetry,&nbsp;audit evidence, and operational dashboards.&nbsp;</li>\n</ul>\n<p>Governance works best when it follows the business rather than leading it. This journey view shows how the controls layer in progressively starting from a high-value business use case and adding only what each next step requires, so governance&nbsp;<em>accelerates</em>&nbsp;safe delivery instead of gating it. The path runs through four stages:&nbsp;<strong>align</strong>&nbsp;on the use case and its value, stand up a&nbsp;<strong>safe foundation</strong>&nbsp;of minimum viable controls,&nbsp;<strong>build and validate</strong>&nbsp;quality and safety, then&nbsp;<strong>operate and scale</strong>&nbsp;-monitoring, auditing, enforcing runtime controls and governing agents in production.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><span><strong>Microsoft gives you the building blocks to govern AI as a live operating system - not a static policy document.</strong>&nbsp;</span><span>To go deeper, explore&nbsp;Microsoft Foundry, Microsoft Purview, Microsoft Defender for Cloud, Microsoft&nbsp;Entra, Azure&nbsp;API Management&nbsp;and Microsoft Agent 365&nbsp;-plus the open-source&nbsp;</span><a href=\"https://github.com/responsibleai/ASSERT\" rel=\"noopener\" target=\"_blank\"><span><span>ASSERT</span></span></a><span>&nbsp;evaluation framework and the&nbsp;</span><a href=\"https://commandline.microsoft.com/agent-control-specification-runtime-governance/\" rel=\"noopener\" target=\"_blank\"><span><span>Agent Control Specification (ACS)</span></span></a><span>&nbsp;for portable, framework-agnostic agent controls.</span><span>&nbsp;</span></p>\n<h1><u><strong>References</strong></u></h1>\n<p><strong>Policy &amp; lifecycle</strong></p>\n<ul>\n<li><strong>Microsoft Foundry</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry</a></li>\n<li><strong>Microsoft Foundry Compliance and Security</strong>- <a href=\"https://learn.microsoft.com/en-us/azure/foundry/control-plane/how-to-manage-compliance-security\" rel=\"noopener\" target=\"_blank\">Manage compliance and security in Microsoft Foundry - Microsoft Foundry | Microsoft Learn</a></li>\n<li><strong>Azure Policy</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/governance/policy/overview</a></li>\n<li><strong>Azure API Management AI Gateway</strong> - https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities</li>\n<li><strong>Microsoft Agent 365</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/microsoft-agent-365/overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/microsoft-agent-365/overview</a></li>\n</ul>\n<p><strong>Data governance</strong></p>\n<ul>\n<li><strong>Microsoft Purview</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/purview/purview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/purview/purview</a></li>\n<li><strong>DSPM for AI</strong>&nbsp;(Data Security Posture Management) —&nbsp;<a href=\"https://learn.microsoft.com/en-us/purview/data-security-posture-management-learn-about\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/purview/data-security-posture-management-learn-about</a></li>\n<li><strong>DLP</strong>&nbsp;(Data Loss Prevention) —&nbsp;<a href=\"https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp</a></li>\n<li><strong>Sensitivity labels</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/purview/sensitivity-labels\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/purview/sensitivity-labels</a></li>\n</ul>\n<p><strong>Model safety</strong></p>\n<ul>\n<li><strong>Azure AI Content Safety</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview</a></li>\n<li><strong>Prompt Shields</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection</a></li>\n</ul>\n<p><strong>Evaluations</strong></p>\n<ul>\n<li><strong>Azure AI Foundry evaluators</strong>&nbsp;(observability &amp; evaluation) —&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/foundry/concepts/observability\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/foundry/concepts/observability</a></li>\n<li><strong>ASSERT</strong>&nbsp;— official announcement (open-source agent evals; no standalone Learn page yet):&nbsp;<a href=\"https://devblogs.microsoft.com/foundry/build-2026-open-trust-stack-ai-agents/\" rel=\"noopener\" target=\"_blank\">https://devblogs.microsoft.com/foundry/build-2026-open-trust-stack-ai-agents/</a></li>\n</ul>\n<p><strong>Observability</strong></p>\n<ul>\n<li><strong>Azure Monitor</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview</a></li>\n<li><strong>Application Insights</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview</a></li>\n<li><strong>Log Analytics</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-workspace-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-workspace-overview</a></li>\n<li><strong>Purview Audit</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/purview/audit-solutions-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/purview/audit-solutions-overview</a></li>\n</ul>\n<p><strong>Security</strong></p>\n<ul>\n<li><strong>Microsoft Defender for Cloud</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction</a></li>\n<li><strong>Microsoft Defender XDR</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-defender\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-defender</a></li>\n<li><strong>Microsoft Sentinel</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/sentinel/sentinel-overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/sentinel/sentinel-overview</a></li>\n</ul>\n<p><strong>Identity</strong></p>\n<ul>\n<li><strong>Microsoft Entra ID</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/entra/identity/\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/entra/identity/</a></li>\n<li><strong>Azure RBAC</strong>&nbsp;(role-based access control) —&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/role-based-access-control/overview\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/role-based-access-control/overview</a></li>\n<li><strong>Conditional Access</strong>&nbsp;—&nbsp;<a href=\"https://learn.microsoft.com/en-us/entra/identity/conditional-access/o