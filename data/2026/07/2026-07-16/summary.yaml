  この日は Microsoft Agent Framework 関連の発表が集中しました。C# と Python 向けのマルチエージェントオーケストレーション SDK として Agent Framework が導入され、AutoGen と Semantic Kernel に分散していたパターンが統合されています。本番ランタイムである Agent Harness と、動的な Magentic を含むマルチエージェントオーケストレーションパターンがいずれも一般提供となりました (Magentic は GAIA で 38% を記録)。プレビューでは、エージェントの実行をモデル呼び出し・ツール実行・中間結果のツリーとして可視化する DevUI Agent Inspector、成功したタスクパターンを記憶して再利用するエピソード的手続き記憶、複数ステップの計画を単一の実行可能コードブロックにまとめる CodeAct パターンと Hyperlight コンテナ、Python / .NET 向けのトレーシングが追加されています。
