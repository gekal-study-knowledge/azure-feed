    "title": "MCP Enterprise Authorization Is Here — What Entra and App Service Can Do Today"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/mcp-enterprise-authorization-is-here-what-entra-and-app-service/ba-p/4537433"
    "published": "2026-07-16 23:31:39"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>A few weeks ago I wrote about what the latest MCP changes meant for scaling on Azure App Service. This time, the protocol change is about a different kind of scale: how an enterprise connects hundreds or thousands of employees to MCP servers without making every person authorize every server one at a time.</p>\n<p><a class=\"lia-external-url\" href=\"https://modelcontextprotocol.io/extensions/auth/enterprise-managed-authorization\" rel=\"noopener\" target=\"_blank\">Enterprise-Managed Authorization (EMA)</a> is now a stable MCP extension. It makes the organization's identity provider the policy decision point, replaces repeated server-by-server browser prompts with an identity assertion grant, and gives security teams a central place to grant and revoke access.</p>\n<p>That sounds a lot like Microsoft Entra preauthorization and App Service Authentication. But while building the sample for this post, I found an important distinction:</p>\n<blockquote>\n<p>A centrally governed OAuth experience is not automatically the EMA protocol.</p>\n</blockquote>\n<p>App Service and Entra can give you a strongly governed MCP endpoint today. The full EMA flow additionally requires the enterprise identity provider to issue an Identity Assertion JWT Authorization Grant, or ID-JAG, and the MCP authorization server to exchange it. Same goal, related building blocks, different wire protocol.</p>\n<p>So I built both.</p>\n<h2>Why the normal OAuth flow gets expensive</h2>\n<p>Standard MCP authorization is user-driven. A client discovers an MCP server, sends the user through that server's authorization flow, receives an access token, and repeats the process for the next server.</p>\n<p>That is a good property for consumer scenarios. The user chooses which application can reach which data.</p>\n<p>At enterprise scale, the same pattern becomes an authorization tax:</p>\n<ul>\n<li>Every employee has to connect every approved MCP server.</li>\n<li>Consent and account-selection prompts create inconsistent setup.</li>\n<li>Security teams have to reason about access across many separate authorization relationships.</li>\n<li>Offboarding and policy changes are harder to apply from one control plane.</li>\n<li>Work and personal identities can get mixed together at the worst possible boundary: the tool that can act on a user's behalf.</li>\n</ul>\n<p>EMA moves the authoritative decision back to the enterprise IdP.</p>\n<h2>What EMA changes on the wire</h2>\n<p>The user still signs in to the MCP host with the corporate identity provider. The difference comes when the client needs an access token for an MCP server.</p>\n<ol>\n<li>The MCP client exchanges the user's identity assertion at the enterprise IdP for an ID-JAG. The stable extension uses OAuth token exchange semantics from <a class=\"lia-external-url\" href=\"https://datatracker.ietf.org/doc/html/rfc8693\" rel=\"noopener\" target=\"_blank\">RFC 8693</a>.</li>\n<li>The IdP evaluates enterprise policy for the requested client, MCP resource, user, and scopes.</li>\n<li>If policy allows access, the IdP issues a short-lived, audience-bound ID-JAG.</li>\n<li>The client presents that JWT to the MCP authorization server using the JWT bearer grant from <a class=\"lia-external-url\" href=\"https://datatracker.ietf.org/doc/html/rfc7523\" rel=\"noopener\" target=\"_blank\">RFC 7523</a>.</li>\n<li>The authorization server validates the assertion and returns the resource access token the client uses for MCP calls.</li>\n</ol>\n<p><img alt=\"Standard Entra OAuth on App Service compared with the EMA ID-JAG exchange\" src=\"https://raw.githubusercontent.com/seligj95/app-service-ema-mcp/main/assets/authorization-paths.png\" /></p>\n<p>The user never goes through a second browser flow at the MCP authorization server. The enterprise IdP already made the decision.</p>\n<p>That gives the organization three useful properties:</p>\n<ul>\n<li><strong>Authorize once, inherit everywhere.</strong> Admins enable approved servers and users receive access according to their existing groups and roles.</li>\n<li><strong>Central policy and revocation.</strong> Conditional access, employment state, device requirements, and other policy remain in the IdP.</li>\n<li><strong>A cleaner identity boundary.</strong> The enterprise login is the source of authority instead of an account picker at every MCP server.</li>\n</ul>\n<h2>What Entra and App Service provide today</h2>\n<p>Azure App Service already has a very good home for an enterprise MCP resource server: <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/app-service/configure-authentication-mcp\" rel=\"noopener\" target=\"_blank\">App Service Authentication</a> sits in front of the application and validates Microsoft Entra access tokens before a request reaches your Python process. App Service Authentication’s MCP authorization integration and protected resource metadata support are currently in preview.</p>\n<p>In the deployable half of the sample, App Service:</p>\n<ul>\n<li>publishes OAuth protected resource metadata for MCP discovery;</li>\n<li>requires authentication on <code>/mcp</code> and returns <code>401</code> to unauthenticated requests;</li>\n<li>validates token signature, issuer, audience, and lifetime;</li>\n<li>allows only the configured client application IDs;</li>\n<li>injects the validated principal into platform-controlled request headers;</li>\n<li>leaves only <code>/</code> and <code>/health</code> public;</li>\n<li>sends OpenTelemetry data to Application Insights with managed identity.</li>\n</ul>\n<p>The Entra application exposes <code>user_impersonation</code> and preauthorizes Visual Studio Code and Azure CLI. Tenant administrators can then apply Conditional Access to the enterprise application and inspect Entra sign-in logs.</p>\n<p>That is centrally governed OAuth. It removes consent prompts for known clients and puts token validation at the platform edge.</p>\n<p>It is not native EMA because this path does not ask Entra to issue an ID-JAG through RFC 8693, and there is no RFC 7523 assertion exchange at a separate MCP authorization server.</p>\n<p>Here is the practical comparison:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Capability</th><th>Entra + App Service path</th><th>EMA path</th></tr></thead><tbody><tr><td>Central tenant policy</td><td>Yes</td><td>Yes</td></tr><tr><td>Protected resource metadata</td><td>Yes</td><td>Yes</td></tr><tr><td>Known-client preauthorization</td><td>Yes, through Entra preauthorization</td><td>Often still required at the IdP and authorization server</td></tr><tr><td>Per-server browser flow</td><td>Avoided for preauthorized clients</td><td>Avoided by protocol design</td></tr><tr><td>Enterprise IdP issues an ID-JAG</td><td>No</td><td>Yes</td></tr><tr><td>MCP authorization server exchanges the ID-JAG</td><td>No</td><td>Yes</td></tr><tr><td>Included in the sample</td><td>Deployable Azure app</td><td>Local interoperability lab</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The distinction matters because \"no consent prompt\" describes a user experience, not a protocol proof.</p>\n<h3>Could you run full EMA on App Service today?</h3>\n<p>Yes. App Service does not prevent you from deploying the complete EMA flow. If your enterprise IdP can issue ID-JAGs, you can implement the resource authorization server and MCP token validation in application code—or point the MCP server at a separate authorization service. App Service then remains the compute platform rather than the authorization boundary.</p>\n<p>That approach replaces Easy Auth’s platform-managed token validation with responsibilities such as token issuance, signing-key management, ID-JAG validation, replay protection, scope enforcement, and audit logging. The remaining prerequisite is still an enterprise IdP and MCP client that support the ID-JAG exchange.</p>\n<h2>I built both paths on purpose</h2>\n<p>The companion repository is <a class=\"lia-external-url\" href=\"https://github.com/seligj95/app-service-ema-mcp\" rel=\"noopener\" target=\"_blank\">seligj95/app-service-ema-mcp</a>.</p>\n<p>The Azure path is a FastAPI MCP server running on Linux App Service. It exposes two read-only tools:</p>\n<ul>\n<li><code>whoami</code> returns the tenant, client, subject, roles, and scopes that App Service Authentication validated.</li>\n<li><code>authorization_model</code> states exactly which authorization model protects the deployment.</li>\n</ul>\n<p>The local path runs four components in one process:</p>\n<ul>\n<li>a stand-in enterprise IdP;</li>\n<li>an MCP authorization server;</li>\n<li>an MCP resource server;</li>\n<li>an MCP client using the official Python SDK's identity-assertion APIs.</li>\n</ul>\n<p>The SDK's <code>IdentityAssertionOAuthProvider</code> covers the second leg: the RFC 7523 JWT bearer grant from the MCP client to the MCP authorization server. The first leg, the RFC 8693 exchange with the enterprise IdP that produces the ID-JAG, is deployment-specific and supplied through the SDK's <code>assertion_provider</code> callback. The lab fulfills that callback with its in-process stand-in IdP.</p>\n<p>The lab validates the ID-JAG signature, <code>typ</code>, issuer, audience, client ID, resource, scopes, expiration, and single-use <code>jti</code>. It also tests rejection cases for the wrong issuer, wrong audience, wrong resource, scope escalation, expiration, and replay. The lab deliberately requires a <code>resource</code> claim, which is stricter than the stable specification's optional claim; production authorization servers should choose that posture explicitly.</p>\n<p>The stand-in IdP and in-memory token store are deliberately not production components. They make the protocol visible and testable without pretending Entra currently exposes the exact issuance flow used by the lab.</p>\n<h2>Run the EMA flow locally</h2>\n<p>Clone the repository and install the project:</p>\n<pre class=\"language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>git clone https://github.com/seligj95/app-service-ema-mcp\ncd app-service-ema-mcp\npython3 -m venv .venv\nsource .venv/bin/activate\npython -m pip install -e \".[dev]\"\n</code></pre>\n<p>Then run the complete ID-JAG exchange:</p>\n<pre class=\"language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>python -m examples.ema_lab.client\n</code></pre>\n<p>The final result is the identity and authorization context returned by the MCP server:</p>\n<pre class=\"language-text\" contenteditable=\"false\" tabindex=\"0\"><code>{'subject': 'alice@example.com', 'client_id': 'finance-agent',\n 'scopes': ['mcp:whoami'], 'resource': 'http://localhost/mcp'}\n</code></pre>\n<p>Run the test suite to see both the successful exchange and the rejection boundaries:</p>\n<pre class=\"language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>python -m ruff check .\npython -m pytest\n</code></pre>\n<p>One implementation note: at the time of writing, PyPI <code>mcp</code> 1.28.1 package does not yet contain the identity-assertion APIs used by the stable extension. The sample pins an exact commit from the official Python SDK until those APIs ship in a release.</p>\n<h2>Deploy the Entra-governed MCP server</h2>\n<p>The repository includes azd and Bicep for a Basic B1 Linux App Service plan, Python 3.14, App Service Authentication, protected resource metadata, Log Analytics, Application Insights, and managed-identity telemetry.</p>\n<p>After choosing a subscription:</p>\n<pre class=\"language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>azd auth login\nazd env new ema-mcp\nazd env set AZURE_SUBSCRIPTION_ID &lt;subscription-id&gt;\nazd env set AZURE_LOCATION eastus\n./scripts/configure-entra-app.sh\nazd up\n</code></pre>\n<p>The Entra bootstrap runs once before <code>azd up</code> because azd resolves required Bicep parameters before the preprovision hook. After that, the hook reruns the same idempotent configuration on each provision.</p>\n<p>Verify the deployed boundary:</p>\n<pre class=\"language-bash\" contenteditable=\"false\" tabindex=\"0\"><code>./scripts/verify-deployment.sh\n</code></pre>\n<p>The script checks that protected resource metadata is available, an anonymous MCP request is rejected, Azure CLI can obtain the delegated API token, and the same MCP request succeeds with that token.</p>\n<p>During deployment validation, I invoked <code>whoami</code> against the deployed app. App Service returned the expected Azure CLI client and the delegated scope:</p>\n<pre class=\"language-json\" contenteditable=\"false\" tabindex=\"0\"><code>{\n  \"authentication_type\": \"aad\",\n  \"client_id\": \"04b07795-8ddb-461a-bbee-02f9e1bf7b46\",\n  \"scopes\": [\"user_impersonation\"]\n}\n</code></pre>\n<p>The corresponding custom trace arrived in Application Insights through the App Service managed identity, with local telemetry authentication disabled.</p>\n<p>The response above is shortened for readability. The complete tool result also includes <code>name</code>, <code>subject</code>, <code>tenant_id</code>, and <code>roles</code>.</p>\n<h2>Three details worth carrying into production</h2>\n<p>The platform did the hard security work, but three integration details were easy to miss.</p>\n<h3>1. Allow the audience Entra actually emits</h3>\n<p>The client requests <code>api://&lt;application-id&gt;/user_impersonation</code>, but a v2 delegated access token can carry the bare application client ID in <code>aud</code>. The sample allows both the bare client ID and the <code>api://</code> form while still rejecting tokens for every other resource.</p>\n<h3>2. Keep the SDK's DNS-rebinding protection</h3>\n<p>The MCP Python SDK defaults to localhost when a server does not declare its deployment hostname. That is a safe local default, but a deployed request correctly fails with <code>421 Invalid Host header</code>.</p>\n<p>The sample reads <code>WEBSITE_HOSTNAME</code> and allowlists only that exact App Service hostname and its optional port form. It does not disable the protection.</p>\n<h3>3. Account for App Service claim mapping</h3>\n<p>App Service maps some JWT claim names before it builds <code>X-MS-CLIENT-PRINCIPAL</code>. For example, the delegated <code>scp</code> value can arrive under the mapped scope claim URI.</p>\n<p>The application accepts both representations, while continuing to trust only the principal header injected by App Service. A caller-supplied identity header never becomes proof of authentication because the platform strips and replaces these headers at the edge.</p>\n<h2>The production checklist</h2>\n<p>This sample gives you the authorization boundary, not every production control. Before using the pattern for a real tool surface:</p>\n<ul>\n<li>Apply Conditional Access deliberately, starting in report-only mode.</li>\n<li>Add tool-level scope or role checks when different tools have different sensitivity.</li>\n<li>Use managed identity or an explicit on-behalf-of flow for downstream APIs; never forward the MCP resource token.</li>\n<li>Add private networking or an API gateway when the workload requires network isolation.</li>\n<li>Keep access tokens and ID-JAGs short-lived.</li>\n<li>Validate ID-JAG signatures with the enterprise IdP's published JWKS, discovered from its authorization server metadata. The lab's shared HMAC key exists only to keep the local flow self-contained.</li>\n<li>Enforce single-use ID-JAG replay protection at the authorization server.</li>\n<li>Log authorization decisions without logging bearer tokens or assertion contents.</li>\n<li>Replace the SDK Git pin after the identity-assertion APIs reach a tested package release.</li>\n</ul>\n<h2>The takeaway</h2>\n<p>EMA is bigger than eliminating another consent screen. It defines how an enterprise IdP becomes the authorization control plane for an MCP fleet, with a portable assertion that an MCP authorization server can validate.</p>\n<p>Entra ID and App Service already give you many of the outcomes enterprises need: tenant policy, known-client governance, protected resource discovery, platform token validation, Conditional Access, and centralized telemetry.</p>\n<p>Just name the boundary honestly.</p>\n<p>Use App Service and Easy Auth when you want a deployable, Entra-governed MCP endpoint today. If your IdP already supports ID-JAG issuance, App Service can also host a custom EMA authorization implementation. Otherwise, use the local lab to understand and test the protocol while platform-native support develops.</p>\n<p>That is the part I like most about the extension: enterprise authorization stops being an experience every MCP server invents and becomes a protocol the ecosystem can share.</p>\n<h2>Resources</h2>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://modelcontextprotocol.io/extensions/auth/enterprise-managed-authorization\" rel=\"noopener\" target=\"_blank\">Enterprise-Managed Authorization extension</a></li>\n<li><a class=\"lia-external-url\" href=\"https://blog.modelcontextprotocol.io/posts/enterprise-managed-auth/\" rel=\"noopener\" target=\"_blank\">Enterprise-Managed Authorization announcement</a></li>\n<li><a class=\"lia-external-url\" href=\"https://github.com/modelcontextprotocol/ext-auth/blob/main/specification/stable/enterprise-managed-authorization.mdx\" rel=\"noopener\" target=\"_blank\">Stable EMA specification</a></li>\n<li><a class=\"lia-external-url\" href=\"https://github.com/modelcontextprotocol/python-sdk/blob/main/docs/client/identity-assertion.md\" rel=\"noopener\" target=\"_blank\">MCP Python SDK identity assertion guide</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/app-service/configure-authentication-mcp\" rel=\"noopener\" target=\"_blank\">Configure MCP server authorization on App Service</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/app-service/configure-authentication-mcp-server-vscode\" rel=\"noopener\" target=\"_blank\">Secure MCP calls from Visual Studio Code</a></li>\n<li><a class=\"lia-external-url\" href=\"https://github.com/seligj95/app-service-ema-mcp\" rel=\"noopener\" target=\"_blank\">Companion sample</a></li>\n</ul>"
