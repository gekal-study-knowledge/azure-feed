    "title": "Bring Your Own Orchestrator to Azure Container Apps Jobs"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/bring-your-own-orchestrator-to-azure-container-apps-jobs/ba-p/4541275"
    "published": "2026-07-30 02:49:33"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>Azure Container Apps Jobs are a good fit for batch processing, ETL, machine learning, reports, and other tasks that run to completion. But when those tasks have dependencies, retries, or fan-out, you still need an orchestrator.</p>\n<p>Many teams already have one. The community-maintained <a href=\"https://github.com/hetvip2/aca-jobs-orchestrator-templates\" rel=\"noopener\" target=\"_blank\">Bring Your Own Orchestrator collection</a> provides 13 templates that connect existing workflow engines to Azure Container Apps Jobs. The collection is also listed in the <a href=\"https://github.com/microsoft/azure-container-apps/tree/main/templates#community-template-collections\" rel=\"noopener\" target=\"_blank\">Microsoft Azure Container Apps template index</a>.</p>\n<p>The idea is simple:</p>\n<ul>\n<li>Your orchestrator manages schedules, dependencies, retries, and workflow history.</li>\n<li>Azure Container Apps Jobs runs each containerized task and reports the result.</li>\n</ul>\n<p>You keep the control plane your team knows while ACA Jobs provides the execution layer.</p>\n<h2>How it works</h2>\n<p>Each integration follows the same flow:</p>\n<ol>\n<li>The orchestrator authenticates to Azure.</li>\n<li>It starts an ACA Job execution.</li>\n<li>It waits for that execution to succeed or fail.</li>\n<li>It uses the result to continue, retry, or stop the workflow.</li>\n</ol>\n<pre><code>Your orchestrator  ---&gt;  Azure Container Apps Job\n  ^                         |\n  +---- execution result ---+\n</code></pre>\n<p>The templates package this flow in the native model of each platform: an Airflow operator, a Temporal Activity, an Argo workflow template, a Camunda service task, or visual actions in Logic Apps and n8n.</p>\n<p>The workload container stays independent of the orchestrator that launched it.</p>\n<h2>Choose the orchestrator that fits the workflow</h2>\n<p>There is no single best orchestrator for every workload. The useful question is which control plane matches the way your team models work.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>When this describes your team</th><th>Start with</th><th>Why</th></tr></thead><tbody><tr><td>You already operate Airflow</td><td><a href=\"https://github.com/hetvip2/airflow-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Airflow on ACA Jobs</a></td><td>Adds an ACA Jobs operator without replacing your Airflow deployment</td></tr><tr><td>You need a complete Airflow environment</td><td><a href=\"https://github.com/hetvip2/airflow-hosted-on-aca\" rel=\"noopener\" target=\"_blank\">Airflow hosted on ACA</a></td><td>Deploys the Airflow control plane and the ACA Jobs integration</td></tr><tr><td>Your workflows are Kubernetes-native and run from AKS</td><td><a href=\"https://github.com/hetvip2/argo-workflows-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Argo Workflows</a></td><td>Uses Argo workflow templates and AKS workload identity</td></tr><tr><td>You model long-running business processes in BPMN</td><td><a href=\"https://github.com/hetvip2/camunda-8-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Camunda 8</a></td><td>Connects Camunda service tasks to ACA Job executions</td></tr><tr><td>You use JSON-defined microservice workflows</td><td><a href=\"https://github.com/hetvip2/conductor-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Conductor</a></td><td>Uses Conductor workers and native <code>FORK_JOIN</code> workflows</td></tr><tr><td>You need durable replay, heartbeats, and resilient retries</td><td><a href=\"https://github.com/hetvip2/temporal-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Temporal</a></td><td>Keeps Temporal as the durable control plane while ACA Jobs runs the workload</td></tr><tr><td>You build asset-centric Python data pipelines</td><td><a href=\"https://github.com/hetvip2/dagster-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Dagster</a></td><td>Uses Dagster resources, ops, and dynamic mapping</td></tr><tr><td>You build general Python flows and task automation</td><td><a href=\"https://github.com/hetvip2/prefect-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Prefect</a></td><td>Uses Prefect tasks, flows, and mapped execution</td></tr><tr><td>You prefer visual automation and SaaS integrations</td><td><a href=\"https://github.com/hetvip2/n8n-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">n8n</a></td><td>Provides visual workflows for starting and observing ACA Jobs</td></tr><tr><td>You use Azure-native data pipelines</td><td><a href=\"https://github.com/hetvip2/data-factory-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Azure Data Factory and Fabric</a></td><td>Provides pipeline definitions for Azure data integration workflows</td></tr><tr><td>You need connector-rich application integration</td><td><a href=\"https://github.com/hetvip2/logic-apps-standard-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Logic Apps Standard</a></td><td>Uses stateful workflows, connectors, and native control flow</td></tr><tr><td>You want Azure-native, code-first durable orchestration</td><td><a href=\"https://github.com/hetvip2/durable-functions-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Durable Functions</a></td><td>Uses durable orchestrations, activities, retries, and fan-out/fan-in</td></tr><tr><td>You already operate a Dapr-enabled workflow host</td><td><a href=\"https://github.com/hetvip2/dapr-workflow-on-aca-jobs\" rel=\"noopener\" target=\"_blank\">Dapr Workflow</a></td><td>Demonstrates Dapr Workflow directing external ACA Job workloads</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The <a href=\"https://github.com/hetvip2/aca-jobs-orchestrator-templates\" rel=\"noopener\" target=\"_blank\">Bring Your Own Orchestrator catalog</a> keeps this comparison current and links to deployment instructions for every option.</p>\n<h2>Before production</h2>\n<p>The existing-orchestrator templates are designed around managed identity, scoped Azure RBAC, failure handling, and native fan-out/fan-in examples. Their fan-out samples default to five shards and accept configurations from 1 to 50.</p>\n<p>Treat higher shard counts as configuration support, not a throughput guarantee. Test them against your Azure quotas, orchestrator limits, and downstream systems.</p>\n<p>Two template-specific boundaries are worth calling out:</p>\n<h3>Dapr Workflow is a preview architecture</h3>\n<p>Azure Container Apps Jobs do not host Dapr sidecars. The Dapr workflow runtime must run in a separate Dapr-enabled host and start ACA Jobs through Azure Resource Manager. The template is therefore labeled <strong>preview architecture</strong>.</p>\n<h3>Fabric still needs a native workspace run</h3>\n<p>The Azure Data Factory path has live validation. The included Fabric pipeline is structurally validated but still needs a native run in a Fabric workspace.</p>\n<p>Each repository README documents its validation scope and limitations.</p>\n<h2>Get started</h2>\n<ol>\n<li>Open the <a href=\"https://github.com/hetvip2/aca-jobs-orchestrator-templates\" rel=\"noopener\" target=\"_blank\">template catalog</a>.</li>\n<li>Choose the orchestrator your team already uses.</li>\n<li>Review that template's prerequisites and validation notes.</li>\n<li>Deploy the sample ACA Job with <code>azd up</code>.</li>\n<li>Run the single-job example, then test fan-out and failure behavior.</li>\n</ol>\n<p>For example, if Airflow is already your standard:</p>\n<pre><code>git clone https://github.com/hetvip2/airflow-on-aca-jobs\ncd airflow-on-aca-jobs\nazd up\n</code></pre>\n<p>The exact setup differs by orchestrator, but the target remains ACA Jobs.</p>\n<h2>Try the templates</h2>\n<ul>\n<li><strong><a href=\"https://github.com/hetvip2/aca-jobs-orchestrator-templates\" rel=\"noopener\" target=\"_blank\">Compare all 13 orchestrator templates</a></strong> and choose the control plane that matches your team.</li>\n<li><strong><a href=\"https://learn.microsoft.com/azure/container-apps/jobs\" rel=\"noopener\" target=\"_blank\">Review the Azure Container Apps Jobs documentation</a></strong> for triggers, permissions, and platform limits.</li>\n<li><strong><a href=\"https://github.com/microsoft/azure-container-apps/tree/main/templates#community-template-collections\" rel=\"noopener\" target=\"_blank\">Browse the ACA community template collections</a></strong> to find the collection in the Microsoft Azure Container Apps repository.</li>\n</ul>\n<h2>Closing thoughts</h2>\n<p>Using Azure Container Apps Jobs should not require an orchestrator migration. Keep the workflow engine your team already trusts and use ACA Jobs for containerized task execution.</p>\n<p>Explore all 13 options in the <strong><a href=\"https://github.com/hetvip2/aca-jobs-orchestrator-templates\" rel=\"noopener\" target=\"_blank\">Bring Your Own Orchestrator to Azure Container Apps Jobs</a></strong> collection.</p>\n<h2>References</h2>\n<ol>\n<li><a href=\"https://learn.microsoft.com/azure/container-apps/jobs\" rel=\"noopener\" target=\"_blank\">Azure Container Apps Jobs overview</a></li>\n<li><a href=\"https://learn.microsoft.com/rest/api/resource-manager/containerapps/jobs\" rel=\"noopener\" target=\"_blank\">Azure Container Apps Jobs management API</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/container-apps/managed-identity\" rel=\"noopener\" target=\"_blank\">Managed identities in Azure Container Apps</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/developer/azure-developer-cli/\" rel=\"noopener\" target=\"_blank\">Azure Developer CLI documentation</a></li>\n<li><a href=\"https://github.com/hetvip2/aca-jobs-orchestrator-templates\" rel=\"noopener\" target=\"_blank\">Bring Your Own Orchestrator template catalog</a></li>\n<li><a href=\"https://github.com/microsoft/azure-container-apps/tree/main/templates#community-template-collections\" rel=\"noopener\" target=\"_blank\">Azure Container Apps community template collections</a></li>\n</ol>\n<!-- === END PASTE HERE === -->"
