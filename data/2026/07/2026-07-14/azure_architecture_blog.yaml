    "title": "Beyond the Canvas: The Azure Architecture Diagram Builder Becomes Agent-Ready"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/beyond-the-canvas-the-azure-architecture-diagram-builder-becomes/ba-p/4534590"
    "published": "2026-07-14 23:02:30"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>AZURE ARCHITECTURE BLOG</strong> · 8 MIN READ</p>\n<p><strong>Author:</strong> Arturo Quiroga, Senior Partner Solutions Architect — Microsoft</p>\n<hr />\n<p>Two months ago I published <a href=\"https://techcommunity.microsoft.com/blog/azurearchitectureblog/from-prompt-to-production-building-azure-architecture-diagrams-with-ai/4520336\" rel=\"noopener\" target=\"_blank\"><em>From Prompt to Production: Building Azure Architecture Diagrams with AI</em></a>, introducing the open-source <a href=\"https://aka.ms/diagram-builder\" rel=\"noopener\" target=\"_blank\">Azure Architecture Diagram Builder</a>. The response was humbling — thousands of you read it, tried the tool, and filed issues and feature requests. A follow-up on <a href=\"https://techcommunity.microsoft.com/post-2-waf-validation/blog-draft-waf-validation.md\" rel=\"noopener\" target=\"_blank\">how the Well-Architected Framework scoring works</a> went deep on validation.</p>\n<p>You asked, and the tool grew. This post is about what’s new since May — and one change big enough to reframe the whole project: <strong>the Azure Architecture Diagram Builder is no longer just an app you click. It’s a partner you chat with, and a tool other agents can call.</strong></p>\n<blockquote>\n<p><strong>TL;DR.</strong> Three arcs of new capability: (1) <strong>Architecture Chat</strong> turns diagram design into a multi-turn conversation over the live canvas; (2) <strong>Blueprint Diagrams</strong> produce hand-drawn, whiteboard-style deliverables alongside the formal topology; and (3) the app now exposes its capabilities as a <strong>Model Context Protocol (MCP) server</strong>, so AI agents can generate, validate, cost, and render Azure architectures programmatically. Plus a <strong>13-model fleet</strong>, deployment guides grounded in <strong>Microsoft Learn</strong>, and July output enhancements.</p>\n</blockquote>\n<hr />\n<h2 id=\"whats-new-at-a-glance\">What’s new at a glance</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; height: 510.903px; border-width: 1px;\"><colgroup><col style=\"width: 49.9588%;\" /><col style=\"width: 49.9588%;\" /></colgroup><thead><tr style=\"height: 35.1215px;\"><th style=\"height: 35.1215px;\">Capability</th><th>\n<p><strong>What it does</strong></p>\n</th></tr></thead><tbody><tr style=\"height: 83.1424px;\"><td style=\"height: 83.1424px;\"><strong>Architecture Chat</strong></td><td>\n<p>Refine a diagram by conversation — “add Front Door with WAF,” then“now make it zone-redundant.” Each turn reads the live canvas and auto-saves to history.</p>\n</td></tr><tr style=\"height: 83.1424px;\"><td style=\"height: 83.1424px;\"><strong>Blueprint Diagrams (BETA)</strong></td><td>\n<p>Hand-drawn, whiteboard-style renders with nested zones and numbered&nbsp;flow arrows. Topology, Blueprint, or Both.</p>\n</td></tr><tr style=\"height: 59.1319px;\"><td style=\"height: 59.1319px;\"><strong>A fleet of 14 models</strong></td><td>\n<p>Multi-provider roster — GPT-5.x, DeepSeek, Grok, Mistral, and Kimi — with side-by-side comparison to pick the right brain per task.</p>\n</td></tr><tr style=\"height: 84.0799px;\"><td style=\"height: 84.0799px;\"><strong>MCP server</strong></td><td>\n<p>The app is now a remote MCP server. Agents can list_services, validate_architecture, estimate_costs, generate_bicep and render_diagram with typed, structured outputs.</p>\n</td></tr><tr style=\"height: 83.1424px;\"><td style=\"height: 83.1424px;\"><strong>Microsoft Learn grounding</strong></td><td>\n<p>Deployment guides now cite live Microsoft Learn documentation.</p>\n</td></tr><tr style=\"height: 83.1424px;\"><td style=\"height: 83.1424px;\"><strong>Output enhancements (July 2026)</strong></td><td>\n<p>Cost badges, light/dark render themes, and metadata panels in rendered diagrams.</p>\n&nbsp;</td></tr></tbody></table></div>\n<hr />\n<h2 id=\"from-clicking-to-conversing-architecture-chat\">From clicking to conversing: Architecture Chat</h2>\n<p>The single most common request after the launch post was some version of <em>“I love the first diagram, but I want to iterate without re-writing the whole prompt.”</em> Regenerating from scratch every time you tweak a requirement is slow and loses context.</p>\n<p><strong>Architecture Chat</strong> solves this. It’s a conversational panel that sits alongside the canvas and treats your diagram as a living document. Each message is a turn in an ongoing design session:</p>\n<ul>\n<li><em>“Add an Azure Front Door with WAF in front of the app tier.”</em></li>\n<li><em>“Now make the data layer zone-redundant.”</em></li>\n<li><em>“Swap the SQL Database for Cosmos DB and update the connections.”</em></li>\n</ul>\n<p>Every turn reads the <strong>current state of the canvas</strong> — not the original prompt — so refinements compound naturally the way they would with a human architect at a whiteboard. The conversation auto-saves to history, so you can step back through the evolution of a design or branch from an earlier point.</p>\n<figure><br />\n<figcaption>Architecture Chat panel beside the canvas, showing a multi-turn conversation that incrementally adds and modifies services on the diagram.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 1.</strong> Architecture Chat treats the diagram as a living document. Each message refines the current canvas — adding services, changing SKUs, or reorganizing groups — and the full exchange is saved to history.</p>\n</blockquote>\n<p>The shift is subtle but important: architecture design stops being a one-shot prompt and becomes an <strong>iterative dialogue</strong>.</p>\n<hr />\n<h2 id=\"the-whiteboard-deliverable-blueprint-diagrams-beta\">The whiteboard deliverable: Blueprint Diagrams (BETA)</h2>\n<p>Formal topology diagrams with official Azure icons are perfect for documentation and stakeholder decks. But early-stage design conversations often want something looser — the hand-drawn feel of a whiteboard sketch that communicates intent without implying finality.</p>\n<p><strong>Blueprint Diagrams</strong> generate exactly that: a whiteboard-style render with nested zones (subscription → VNet → subnet), numbered flow arrows, and a deliberately sketchy aesthetic. You choose the output mode:</p>\n<ul>\n<li><strong>Topology</strong> — the formal, icon-based diagram from the launch post</li>\n<li><strong>Blueprint</strong> — the hand-drawn whiteboard style</li>\n<li><strong>Both</strong> — generate the two side by side</li>\n</ul>\n<figure><br />\n<figcaption>The formal topology diagram of an architecture shown next to a Blueprint-style hand-drawn version of the same design with nested zones and numbered flow arrows.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 2.</strong> The same architecture in two visual languages. <strong>Left:</strong> the formal, icon-based topology. <strong>Right:</strong> Blueprint mode — a whiteboard-style render with nested zones and numbered flow steps, plus a numbered legend explaining each hop. Use Blueprint for early design conversations and Topology for final documentation.</p>\n</blockquote>\n<p>It’s the same underlying architecture — two visual languages for two different moments in the design lifecycle.</p>\n<hr />\n<h2 id=\"a-fleet-of-13-models-pick-the-right-brain-per-task\">A fleet of 14 models: pick the right brain per task</h2>\n<p>The launch post shipped with multi-model support. That fleet has grown to <strong>13 models across five providers</strong>, so you can match the model to the job — fast models for iteration, reasoning models for complex designs, code-optimized models for Bicep generation:</p>\n<ul>\n<li><strong>OpenAI GPT-5.x</strong> — GPT-5.1, GPT-5.2, GPT-5.6 Sol, Terra and Luna, GPT-5.4, GPT-5.4 Mini</li>\n<li><strong>DeepSeek</strong> — V3.2 Speciale, V4 Pro</li>\n<li><strong>xAI Grok</strong> — 4.1 Fast, 4.3</li>\n<li><strong>Mistral</strong> — Large 3</li>\n<li><strong>MoonshotAI Kimi</strong> — K2.5, K2.7 Code</li>\n</ul>\n<p>The <strong>Compare Models</strong> feature runs the same prompt through any subset of these in parallel and ranks them on service count, token usage, latency, and cost — with <em>Fastest / Cheapest / Most Thorough</em> badges — so you can make an evidence-based choice rather than a guess.</p>\n<figure><br />\n<figcaption>Compare Models results grid showing side-by-side metrics across all 13 models with Fastest, Cheapest, and Most Thorough badges.</figcaption>\n</figure>\n<img />\n<figure><br />\n<figcaption>AI Critique panel with an overall ranking and per-model analysis generated by a critic model.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 3.</strong> Multi-model comparison across the full 13-model fleet. <strong>Top:</strong> the results grid ranks every model on service count, connections, token usage, latency, and cost, with <em>Fastest / Cheapest / Most Thorough</em> badges. <strong>Bottom:</strong> an optional AI Critique uses a critic model to rank the outputs and explain each model’s strengths and gaps.</p>\n</blockquote>\n<p>Adding a model is now a small, well-understood change — a testament to how the multi-provider abstraction has matured since May.</p>\n<hr />\n<h2 id=\"the-headline-the-diagram-builder-is-now-an-mcp-server\">The headline: the Diagram Builder is now an MCP server</h2>\n<p>Here’s the change that reframes the project. Everything above is about a <em>person</em> using a <em>web app</em>. But the same capabilities — generating a diagram, validating it against WAF, estimating its cost, producing Bicep — are exactly the things an <strong>AI agent</strong> needs when it reasons about Azure architecture.</p>\n<p>So we exposed them. The Azure Architecture Diagram Builder now runs as a <strong>Model Context Protocol (MCP) server</strong>. Any MCP-capable agent can call its tools with typed inputs and structured outputs:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 98.7963%; height: 259.653px; border-width: 1px;\"><colgroup><col style=\"width: 50.0054%;\" /><col style=\"width: 50.0054%;\" /></colgroup><thead><tr style=\"height: 35.1215px;\"><th style=\"height: 35.1215px;\">Tool</th><th>\n<p><strong>What the agent gets</strong></p>\n</th></tr></thead><tbody><tr style=\"height: 35.434px;\"><td style=\"height: 35.434px;\"><code>list_services</code></td><td>\n<p>The catalog of supported Azure services and categories</p>\n</td></tr><tr style=\"height: 35.434px;\"><td style=\"height: 35.434px;\"><code>validate_architecture</code></td><td>\n<p>A WAF assessment with pillar scores and findings</p>\n</td></tr><tr style=\"height: 59.1146px;\"><td style=\"height: 59.1146px;\"><code>estimate_costs</code></td><td>\n<p>Multi-region cost estimates from the Azure Retail Prices API</p>\n</td></tr><tr style=\"height: 35.434px;\"><td style=\"height: 35.434px;\"><code>generate_bicep</code></td><td>\n<p>Infrastructure-as-Code templates for the design</p>\n</td></tr><tr style=\"height: 59.1146px;\"><td style=\"height: 59.1146px;\"><code>render_diagram</code></td><td>\n<p>A rendered diagram (topology or blueprint) of the architecture</p>\n</td></tr></tbody></table></div>\n<p><strong>This means an agent can hold a conversation like <em>“design a HIPAA-compliant platform, check it against the Well-Architected Framework, tell me the monthly cost in West Europe, and give me the Bicep”</em> — and the Diagram Builder answers each part programmatically, returning structured data the agent can reason over and chain.</strong></p>\n<figure><br />\n<figcaption>Microsoft Scout invoking the Diagram Builder’s render_diagram MCP tool, showing the tool-call parameters and saving the generated SVG to the workspace.</figcaption>\n</figure>\n<img />\n<figure><br />\n<figcaption>The Azure architecture diagram rendered by the MCP tool and displayed inline in the Microsoft Scout conversation.</figcaption>\n</figure>\n<img />\n<blockquote>\n<p><strong>Figure 4.</strong> The Diagram Builder as an MCP server inside <strong>Microsoft Scout</strong>. <strong>Top:</strong> from a natural-language request, the agent calls the <code>render_diagram</code> tool with structured parameters (title, format, direction, theme, region) and saves the returned SVG to its workspace. <strong>Bottom:</strong> the rendered architecture — grouped zones, labeled flows, and cost badges — appears inline in the conversation, generated entirely through agent tool calls.</p>\n</blockquote>\n<p>The tool that started as a canvas for humans is now also a <strong>building block for agents</strong>. That’s the arc: <em>from an app you click, to a partner you chat with, to a tool other agents call.</em></p>\n<hr />\n<h2 id=\"grounded-in-microsoft-learn-and-sharper-output\">Grounded in Microsoft Learn, and sharper output</h2>\n<p>Two smaller-but-meaningful improvements round out the release:</p>\n<ul>\n<li><strong>Microsoft Learn grounding.</strong> Deployment guides now search official <a href=\"https://learn.microsoft.com/\" rel=\"noopener\" target=\"_blank\">Microsoft Learn</a> documentation at generation time and cite it, so the guidance reflects current, authoritative practice rather than a model’s training snapshot.</li>\n<li><strong>Output enhancements (July 2026).</strong> Rendered diagrams now carry per-service <strong>cost badges</strong>, support <strong>light and dark render themes</strong>, and include <strong>metadata panels</strong> that summarize the architecture — service counts, regions, and estimated cost — directly on the image.</li>\n</ul>\n<hr />\n<h2 id=\"highlights\">Highlights</h2>\n<p>Since the May launch, the Azure Architecture Diagram Builder has grown from a design tool into an agent-ready platform:</p>\n<ul>\n<li><strong>Conversational design</strong>: iterate on a diagram by chatting over the live canvas, with full history</li>\n<li><strong>Two visual languages</strong>: formal topology and hand-drawn Blueprint, from the same architecture</li>\n<li><strong>13 models, five providers</strong>: choose the right brain per task, with evidence-based comparison</li>\n<li><strong>Agent-ready</strong>: an MCP server exposing generation, validation, costing, and IaC as callable tools</li>\n<li><strong>Grounded guidance</strong>: deployment guides cite live Microsoft Learn documentation</li>\n<li><strong>Still open source</strong>: every capability above is available to inspect, extend, and contribute to</li>\n</ul>\n<h2 id=\"try-it-today\">Try It Today</h2>\n<ul>\n<li><strong>Live demo</strong>: <a href=\"https://aka.ms/diagram-builder\" rel=\"noopener\" target=\"_blank\">https://aka.ms/diagram-builder</a></li>\n<li><strong>Source code</strong>: <a href=\"https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder\" rel=\"noopener\" target=\"_blank\">GitHub repository</a></li>\n<li><strong>Documentation</strong>: See the <a href=\"https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder/blob/main/DOCS/getting-started-guide.md\" rel=\"noopener\" target=\"_blank\">Getting Started Guide</a> for setup, and the repository’s MCP server directory for agent integration.</li>\n</ul>\n<p>If you read the first post and tried the tool — thank you. The features above exist because you told me what you needed. Keep the feedback coming via GitHub Issues.</p>\n<hr />\n<p><strong>Tags:</strong> <code>artificial intelligence</code> · <code>application</code> · <code>apps &amp; devops</code> · <code>well architected</code> · <code>infrastructure</code></p>"
