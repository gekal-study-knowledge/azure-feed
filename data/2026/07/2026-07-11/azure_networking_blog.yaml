    "title": "Azure Front Door: Resiliency Series – Part 3: Tenant isolation"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/azure-front-door-resiliency-series-part-3-tenant-isolation/ba-p/4535866"
    "published": "2026-07-11 07:08:29"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p>Abhishek Tiwari, Vice President of Engineering, Azure Networking<br />Amit Srivastava, Partner Director of PM, Azure Networking<br />Varun Chawla, Partner Director of Engineering, Azure Networking</p>\n<p>&nbsp;</p>\n<p>Azure Front Door serves hundreds of thousands of tenants from hundreds of edge locations, densely sharing the globally distributed edge fleet. That density is exactly what allows us to deliver global scale, performance, and cost efficiency. It also means that, without strong isolation, a single tenant’s incompatible configuration or anomalous traffic can, in the worst case, affect many other tenants. The October 2025 incidents reinforced how important it is to contain this class of risk. Our goal for this tenant isolation is simple to state and hard to achieve: no single tenant’s configuration or traffic should be able to impact any other tenant.</p>\n<p>In <a href=\"https://techcommunity.microsoft.com/blog/azurenetworkingblog/azure-front-door-implementing-lessons-learned-following-october-outages/4479416\" rel=\"noopener\" target=\"_blank\">Part 1</a> of our three part mini blog series, we outlined our four‑pillar strategy for improving the resiliency of Azure Front Door: configuration resiliency, data plane resiliency, tenant isolation, and accelerated Recovery Time Objective (RTO). <a href=\"https://techcommunity.microsoft.com/blog/azurenetworkingblog/azure-front-door-implementing-lessons-learned-following-october-outages/4479416\" rel=\"noopener\" target=\"_blank\">Part 1</a> detailed how we would make configuration propagation safer and how the data plane keeps serving from a ‘last‑known‑good’ (LKG) configuration, even if an incompatible configuration change is propagated to the data plane. <a href=\"https://techcommunity.microsoft.com/blog/azurenetworkingblog/azure-front-door-resiliency-series-%E2%80%93-part-2-faster-recovery-rto/4503091\" rel=\"noopener\" target=\"_blank\">Part 2</a> turned to recovery, showing how we bring the system back to full operation in an accelerated, predictable, and in a bounded timeframe. In this final part, we turn to the tenant isolation pillar that ensures that any single tenant configuration or traffic issues are limited in scope to that tenant alone and do not impact other tenants. We will also show how Azure Front Door achieves single-tenant containment through configuration isolation, lazy loading, and a micro-cellular layered ingress-sharding architecture.</p>\n<p><strong>Repair status: all outstanding items now complete</strong></p>\n<p>Before we dive into tenant isolation, here is a final update on the overall repair items from the two October 2025 incidents (you can review the details in our Azure Incident Retrospective sessions for the October 9th and October 29th incidents). We are pleased to report that all outstanding work across every pillar is now complete and fully deployed in production – including the tenant isolation work described in this post. With these safeguards in place, we have also returned configuration propagation latency to pre‑incident levels while keeping platform stability our top priority. In the table below, “Completed” means broadly deployed in production.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong>Learning category</strong></p>\n</td><td>\n<p><strong>Goal</strong></p>\n</td><td>\n<p><strong>Repairs</strong></p>\n</td><td>\n<p><strong>Status</strong></p>\n</td></tr><tr><td>\n<p><strong>Safe customer configuration deployment</strong></p>\n</td><td>\n<p>Incompatible configuration never propagates beyond ‘EUAP or canary regions’</p>\n</td><td>\n<p>Control plane and data plane defect fixes; forced synchronous configuration processing; additional stages with extended bake time; early detection of crash state</p>\n</td><td>\n<p><span class=\"lia-text-color-6\"><strong>Completed</strong></span></p>\n</td></tr><tr><td>\n<p><strong>Data plane resiliency</strong></p>\n</td><td>\n<p>Configuration processing cannot impact data plane availability</p>\n</td><td>\n<p>Manage data‑plane lifecycle to prevent outages caused by configuration‑processing defects; isolated work‑process in every data plane server to process and load the configuration</p>\n</td><td>\n<p><span class=\"lia-text-color-6\"><strong>Completed</strong></span></p>\n</td></tr><tr><td>\n<p><strong>100% Azure Front Door resiliency posture for Microsoft internal services</strong></p>\n</td><td>\n<p>Microsoft operates an isolated, independent Active/Active fleet with automatic failover for critical Azure services</p>\n</td><td>\n<p>Phase 1: onboarded critical services batch impacted on Oct 29th outage running on a day‑old configuration; Phase 2: automation &amp; hardening of operations, auto‑failover and self‑management of onboarding for additional services</p>\n</td><td>\n<p><span class=\"lia-text-color-6\"><strong>Completed</strong></span></p>\n</td></tr><tr><td>\n<p><strong>Recovery improvements</strong></p>\n</td><td>\n<p>Data plane crash recovery in under 10 minutes</p>\n</td><td>\n<p>Data plane boot‑up time optimized via local cache; recovery time accelerated to under 10 minutes</p>\n</td><td>\n<p><span class=\"lia-text-color-6\"><strong>Completed</strong></span></p>\n</td></tr><tr><td>\n<p><strong>Tenant isolation</strong></p>\n</td><td>\n<p>No configuration or traffic regression can impact other tenants</p>\n</td><td>\n<p>Micro‑cellular Azure Front Door with ingress layered shards</p>\n</td><td>\n<p><span class=\"lia-text-color-6\"><strong>Completed</strong></span></p>\n</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<p><strong>Why isolation at edge scale is deceptively hard</strong></p>\n<p>Traditional isolation techniques such as dedicating separate hardware to each tenant or running every tenant inside its own virtual machine are impractical at the edge. Edge sites are constrained on space, power, and capacity. The entire premise of a modern, multi-tenant application delivery platform is that any tenant can be served from any site closest to the user. We cannot simply partition hundreds of thousands of tenants onto dedicated machines without giving up either proximity, scale, or the efficiency that make the edge fast and cost efficient. Isolation therefore, must be achieved in software, inside a multi-tenant fleet.</p>\n<p><strong>What we already do today</strong></p>\n<p>Azure Front Door already includes several layers of tenant isolation and partitioning. However, the incidents in October clearly highlighted that these techniques were not enough. Prior to the incidents, our protection mechanisms included:</p>\n<ul>\n<li><strong>Infrastructure partitioning. </strong>Edge sites were organized into physically isolated primary and fallback traffic rings.</li>\n<li><strong>Noisy‑neighbor protection. </strong>Fair‑share resource allocation, rate limiting, and anomaly-based load protection kept any single tenant from monopolizing shared resources such as CPU, memory, or network bandwidth on an Azure Front Door server.</li>\n<li><strong>Circuit breakers. </strong>Circuit breakers shed costly work first and can disable a risky per‑tenant feature before it exhausts shared resources on a server.</li>\n<li><strong>Real‑time crash protection. </strong>A crash‑analysis system correlates crash signatures across machines and can pinpoint and block crash patterns caused by tenant IPs or traffic patterns.</li>\n</ul>\n<p>While these protections are valuable, many of them are reactive and proved insufficient during the October incidents. The next generation of isolation makes single‑tenant containment a fundamental part of the platform which governs how configurations are loaded, and how traffic is served.</p>\n<p><strong>Configuration isolation: loading only what is needed</strong></p>\n<p>Part 2 introduced ‘lazy loading’ as a recovery optimization technique. It is also an important configuration‑isolation mechanism. Historically, every worker on every edge server had to be ready to serve any tenant, which meant each worker loaded a large set of tenant configurations. A single incompatible configuration could therefore ripple across many workers.</p>\n<p>With lazy loading, a worker loads a tenant’s configuration and its TLS certificates only when it actually receives traffic for that tenant. The practical consequence for isolation is powerful: a faulty configuration can only affect the workers that have loaded that specific tenant, never the entire server or fleet. Combined with per‑tenant validation on load, and the <strong>Food Taster </strong>safeguard from Part 1 (a sacrificial process that pretests every configuration change in isolation), configuration problems are caught early and contained to the smallest possible footprint.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><em>Figure 1: With lazy loading, an incompatible configuration is contained to the workers serving that tenant, instead of poisoning the whole server.</em></p>\n<p><strong>Tenant isolation: a micro-cellular, layered ingress sharding architecture</strong></p>\n<p>Configuration isolation limits the blast radius of an incompatible configuration. Traffic isolation addresses the other half of the problem: a tenant whose anomalous traffic incident, like a sudden surge, a pathological request pattern, or malicious activity, could degrade a shared worker. Our approach is a micro‑cellular architecture that combines multiple concepts working together.</p>\n<ul>\n<li><strong>Worker‑process isolation. </strong>Each edge server already runs many independent worker processes. Instead of letting every worker serve every tenant, we assign tenants to specific groups of workers. Those worker group (shards) become the unit of isolation: if a tenant destabilizes its shard, the impact is contained to that shard’s workers while the rest of the server keeps serving normally.</li>\n<li><strong>Ingress sharding. </strong>Rather than a handful of fixed shards, we compose shards from overlapping subsets of a server’s workers. Even a modest number of workers can be combined into an enormous number of distinct, overlapping shards – giving us a very large number of fine‑grained fault domains without dedicating hardware to every tenant.</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><em>&nbsp;</em></p>\n<p><em>Figure 2: Tenants are randomly assigned to different shards on each server (layer). Even when a good tenant shares the noisy tenant’s shard on one layer, routing steers its traffic to healthy shards on the others.</em></p>\n<p>&nbsp;</p>\n<ul>\n<li><strong>Multi‑layer ingress sharding. </strong>This is where ‘layered’ comes in. Each edge server is treated as an independent layer, and each tenant is assigned to a different, randomly chosen shard on every server. Because assignments are independent from one server to the next, two tenants that happen to share a shard on one server are extremely unlikely to share a shard again on another server. The chance of any good tenant repeatedly colliding with a noisy tenant across many servers becomes vanishingly small.</li>\n<li><strong>Intelligent ingress routing. </strong>Tying it together is a routing layer that terminates each incoming connection, identifies the tenant, and steers the request to that tenant’s assigned, healthy shard. If a shard is unhealthy or saturated, traffic is directed to the tenant’s healthy shards on other layers.</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><em>Figure 3: Intelligent Ingress Routing</em></p>\n<p>&nbsp;</p>\n<p>The combined effect is that when a noisy tenant overwhelms or crashes its shard on one server, only that shard is affected. Because every other tenant is spread across a different, randomized set of shards, they continue to find healthy paths, and the routing layer moves their traffic accordingly. A worst-case availability problem is downgraded to, at most, a small and redistributable capacity problem, that the routing layer smooths over.</p>\n<p>An in-depth technical analysis of layered ingress sharding is available <a href=\"https://techcommunity.microsoft.com/blog/reliability-and-resiliency-in-azure/introducing-layered-ingress-sharding-achieving-single-tenant-isolation-in-multi-/4535859\" rel=\"noopener\" target=\"_blank\">here</a> for reference.</p>\n<p><strong>Shrinking the blast radius</strong></p>\n<p>Taken together, these mechanisms fundamentally change the shape of failure. In a uniform, fully shared fleet, an incompatible tenant can, in the worst case, affect a large share of the tenants on a machine, in an edge location, or beyond. With configuration isolation and layered ingress sharding, the same failure is confined to a subset of workers serving the offending tenant. Our target for this tenant isolation pillar is effectively single‑tenant containment: a configuration or traffic anomaly caused by one tenant should never cause issues to any other tenants.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><em>Figure 4: From a shared fleet where a single tenant can affect many, to micro‑cellular shards that confine impact to the offending tenant.</em></p>\n<p><strong>Validating isolation in practice</strong></p>\n<p>As with our recovery work, we don’t simply design these boundaries and assume they hold, we test them. Through deliberate fault‑injections, we have pushed noisy and faulty tenants into the system and confirmed that impact stayed contained to the offending shard, that healthy tenants kept serving, and that the routing layer steered around unhealthy shards as intended. This turns isolation from a design claim into a well-drilled, and repeatable outcome.</p>\n<p><strong>Closing</strong></p>\n<p>This post concludes our three-part mini blog series on Azure Front Door resiliency. We have shared how we are making configuration propagation safer (<a href=\"https://techcommunity.microsoft.com/blog/azurenetworkingblog/azure-front-door-implementing-lessons-learned-following-october-outages/4479416\" rel=\"noopener\" target=\"_blank\">Part 1</a>), recovering faster when failures do occur (<a href=\"https://techcommunity.microsoft.com/blog/azurenetworkingblog/azure-front-door-resiliency-series-%E2%80%93-part-2-faster-recovery-rto/4503091\" rel=\"noopener\" target=\"_blank\">Part 2</a>), and containing the blast radius stemming from any single tenant through configuration isolation and a micro‑cellular, layered‑sharding architecture (Part 3).</p>\n<p>Resiliency, however, is not a project with an end date. It is an ongoing commitment. While this series concludes the blog series of our response to the October 2025 incidents, our investments in Azure Front Door’s resiliency, isolation, and recovery will continue. As we make further improvements, we will keep sharing them with you.</p>\n<p>We deeply value our customers’ trust in Azure Front Door. We remain committed to exceeding expectations for security, reliability, and transparency.</p>"
