    "summary": "<p>Learn how to build long-running MCP tools on Azure Functions using Durable Functions. This post explains why synchronous tool calls break down for long-running work, introduces the MCP Tasks extension, and walks through a sample pattern that works with existing request/response clients today.</p>\n<p>The post <a href=\"https://devblogs.microsoft.com/azure-sdk/long-running-mcp-tools-azure-functions/\">How to build long-running MCP tools on Azure Functions</a> appeared first on <a href=\"https://devblogs.microsoft.com/azure-sdk\">Azure SDK Blog</a>.</p>"
