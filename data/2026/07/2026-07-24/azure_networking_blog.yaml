    "title": "Announcing public preview of Azure DDoS Protection custom policy"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/announcing-public-preview-of-azure-ddos-protection-custom-policy/ba-p/4538963"
    "published": "2026-07-24 02:16:28"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><span>We are excited to announce the public preview of Azure DDoS Protection custom policy, a new capability that gives customers more granular control over how Azure DDoS Protection detects and mitigates attacks against protected workloads.</span></p>\n<p><span>Azure DDoS Protection has always focused on delivering automatic, adaptive protection at scale. With custom policy, customers can now fine-tune mitigation behaviour for supported resources and configure protocol-specific detection thresholds. This allows customers to better align protection settings with any planned or projected changes in their application traffic patterns upfront, while giving them additional control over supported protocol thresholds.</span></p>\n<p>&nbsp;</p>\n<blockquote>\n<p><em><span><span>Azure DDoS Protection custom policy is currently in preview. See the&nbsp;<a href=\"\" rel=\"noopener\" target=\"_blank\">Supplemental Terms of Use for Microsoft Azure Previews</a> for legal terms that apply to Azure features that are in beta, preview, or otherwise not yet generally available.</span></span></em></p>\n</blockquote>\n<h3><span><span><span>Why customers asked for more control</span>&nbsp;</span></span></h3>\n<p><span>Azure DDoS Protection automatically analyses traffic patterns and applies adaptive mitigation during attacks. While this approach works well for most workloads, some organizations require additional flexibility to support unique traffic characteristics, operational environments, or changes around big releases and events.</span><span>&nbsp;</span></p>\n<p><span>Customers running latency-sensitive applications, high-throughput services, gaming platforms, or workloads with predictable traffic spikes often want the ability to customize mitigation trigger behavior for specific protocols.</span><span>&nbsp;</span></p>\n<p><span>Example scenarios include:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Applications with known peak traffic periods</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Workloads that experience sustained high packet-per-second rates</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Services requiring protocol-specific tuning</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Organizations that need separate mitigation policies across environments or applications</span><span>&nbsp;</span></li>\n</ul>\n<p><span>Custom policy allows organizations to align DDoS protection behaviour with their operational traffic baselines while still leveraging Azure’s global-scale mitigation infrastructure.</span><span>&nbsp;</span></p>\n<h3><span><span>Key benefits:</span>&nbsp;</span></h3>\n<ol>\n<li><strong><span>Granular, protocol-level&nbsp;control</span></strong><span><strong>:&nbsp;</strong>Configure custom detection thresholds for TCP, UDP, and TCP SYN traffic, so mitigation triggers reflect how your application behaves rather than generic baselines.&nbsp;</span><span>&nbsp;</span></li>\n<li><strong><span>Predictable protection during planned&nbsp;events</span></strong><span><strong>:</strong> Align mitigation behaviour with&nbsp;anticipated&nbsp;traffic&nbsp;changes&nbsp;product launches, seasonal peaks, gaming events,&nbsp;so legitimate traffic surges&nbsp;aren't&nbsp;mistaken for attacks.&nbsp;</span><span>&nbsp;</span></li>\n<li><strong><span>Flexibility without sacrificing scale</span></strong><span><strong>:</strong>&nbsp;Fine-tune&nbsp;triggers for&nbsp;specific workloads while still&nbsp;benefiting&nbsp;from Azure's global-scale mitigation infrastructure and adaptive protection everywhere else.&nbsp;</span><span>&nbsp;</span></li>\n<li><strong><span>Per-resource policy management</span></strong><span><strong>:</strong>&nbsp;Apply separate policies across environments or applications, giving teams the ability to tune protection independently for dev, test, and production workloads.&nbsp;</span><span>&nbsp;</span></li>\n<li><strong><span>Full operational visibility</span></strong><span><strong>:</strong>&nbsp;Existing Azure Monitor and DDoS Protection telemetry continue to work with custom policies, so you can&nbsp;validate&nbsp;threshold changes and monitor mitigation activity end to end.</span><span>&nbsp;</span></li>\n</ol>\n<h3><span><span>Public preview walkthrough</span></span><span>&nbsp;</span></h3>\n<p><span>Customers can deploy and manage DDoS custom policies directly from the Azure portal.</span><span>&nbsp;</span></p>\n<p><span>To create a new policy:</span><span>&nbsp;</span></p>\n<ol>\n<li><span>Open the Azure portal.</span><span>&nbsp;</span></li>\n<li><span>Search for&nbsp;</span><span>DDoS custom policies</span><span>.</span><span>&nbsp;</span></li>\n<li><span>Select&nbsp;</span><span>Create</span><span>.</span><span>&nbsp;</span></li>\n<li><span>Choose the subscription, resource group, and region.</span><span>&nbsp;</span></li>\n<li><span>Select a supported frontend IP configuration.</span><span>&nbsp;</span></li>\n<li><span>Configure protocol detection rules.</span><span>&nbsp;</span></li>\n<li><span>Review and deploy.</span><span>&nbsp;</span></li>\n</ol>\n<p><span>Once deployed, the custom policy can be associated with supported frontend IP resources to apply protocol-specific mitigation settings.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p class=\"lia-clear-both\">&nbsp;</p>\n<p class=\"lia-clear-both\">&nbsp;</p>\n<img />\n<h3><span><span>Current public preview scope</span></span><span>&nbsp;</span></h3>\n<p><span>During public preview, Azure DDoS Protection custom policy supports:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Standard Load Balancer frontend IP configurations</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>TCP, UDP, and TCP SYN threshold customization</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Azure portal management</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>ARM and REST API deployment</span><span>&nbsp;</span></li>\n</ul>\n<p><span>Current limitations include:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Support is currently limited to&nbsp;Standard Load Balancer frontend&nbsp;IPs&nbsp;and no Power Shell support</span><span>&nbsp;</span></li>\n</ul>\n<p><span>As with all preview features, functionality and supported scenarios may evolve before general availability.</span><span>&nbsp;</span></p>\n<h3><span><span>Important considerations</span></span><span>&nbsp;</span></h3>\n<p><span>When a customer configures a custom threshold for a protocol, Azure disables&nbsp;autotuning&nbsp;triggers&nbsp;for&nbsp;that protocol and uses the configured static value.</span><span>&nbsp;</span></p>\n<p><span>Customers should:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Use&nbsp;anticipated&nbsp;traffic baselines to guide threshold&nbsp;selection</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Start with conservative tuning changes</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Validate behaviour in lower environments before broad deployment</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Monitor mitigation telemetry after configuration changes</span><span>&nbsp;</span></li>\n</ul>\n<p><span>Azure Monitor and existing Azure DDoS Protection telemetry continue to provide visibility into mitigation activity and operational behavior.</span><span>&nbsp;</span></p>\n<h3><span><span>Looking ahead</span></span><span>&nbsp;</span></h3>\n<p><span>Azure DDoS Protection continues to evolve to support modern application architectures, large-scale internet exposure, and advanced operational requirements.</span><span>&nbsp;</span></p>\n<p><span>Custom policy extends Azure DDoS Protection's automatic, adaptive baseline with optional per-resource control, without changing the turnkey default that protects every workload out of the box. Autotuning stays on everywhere a custom threshold is not explicitly configured.</span><span>&nbsp;</span></p>\n<p><span>We want customers to know that Azure DDoS continues to be a hands-off fully automated service, and that policy customization is not a new operational model, but rather an optional override-on-top automated/adaptive engine.</span><span>&nbsp;</span></p>\n<h3><span><span>Get started</span></span><span>&nbsp;</span></h3>\n<p><span>Customers can begin using Azure DDoS Protection custom policy today through the public preview experience.</span><span>&nbsp;</span></p>\n<p><span>To learn more:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Review the Azure REST API documentation for DDoS Custom Policies&nbsp;</span><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/rest/api/virtualnetwork/ddos-custom-policies?view=rest-virtualnetwork-2025-05-01\" rel=\"noopener\" target=\"_blank\">here</a><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Deploy a test policy in a supported subscription</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Explore the Azure portal experience for policy management</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Evaluate protocol-specific threshold tuning for your applications</span><span>&nbsp;</span></li>\n</ul>\n<p><span>We look forward to&nbsp;hearing&nbsp;your&nbsp;feedback.</span><span>&nbsp;</span></p>"
