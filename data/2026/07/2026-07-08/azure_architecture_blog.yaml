  "199cad46088a1fd7f1f7d022fd5ac299":
    "id": "199cad46088a1fd7f1f7d022fd5ac299"
    "title": "Golden Paths Are a Product. Treat Them Like One."
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/golden-paths-are-a-product-treat-them-like-one/ba-p/4533707"
    "published": "2026-07-08 03:26:04"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Audience:</strong> Cloud architects, platform engineers, engineering leaders</p>\n<hr />\n<p>In my earlier Cloud Native Platforms articles, I focused on how teams <a href=\"https://techcommunity.microsoft.com/blog/azurearchitectureblog/cloud-native-platforms-build/4519605\" rel=\"noopener\" target=\"_blank\">build</a>, <a href=\"https://techcommunity.microsoft.com/blog/azurearchitectureblog/cloud-native-platforms-run/4520188\" rel=\"noopener\" target=\"_blank\">run</a>, and <a href=\"https://techcommunity.microsoft.com/blog/azurearchitectureblog/cloud-native-platforms-evolve/4520195\" rel=\"noopener\" target=\"_blank\">evolve</a> modern engineering foundations. This article focuses on what keeps those capabilities useful after launch.</p>\n<p>Most teams do not lose adoption because the first release was poor. They lose adoption because the path was launched like a project and left to survive like a product.</p>\n<p>The pattern is familiar. A capability ships with good intent, reasonable documentation, and early enthusiasm. A few months later, teams start bypassing it, exceptions multiply, support load rises, and the platform team quietly becomes a ticket queue.</p>\n<p>If a capability is expected to be adopted, trusted, improved, and measured over time, it needs product discipline from the start.</p>\n<blockquote>\n<p><strong>How this connects to forward-deployed engineering</strong></p>\n<p>Forward-deployed engineering (FDE) is a delivery model where an engineer embeds directly with a customer or team, learns the real operating context, and builds a working solution in the field. The model was <a href=\"https://blog.palantir.com/a-day-in-the-life-of-a-palantir-forward-deployed-software-engineer-45ef2de257b1\" rel=\"noopener\" target=\"_blank\">popularized by Palantir</a>, whose engineers embed with customers. The same pattern now appears inside large engineering organizations, where platform engineers embed with internal product teams. Golden paths are a logical next step. FDE is the front of the funnel, where bespoke solutions get built one team at a time. Between the two sits a graduation decision. When the same pattern shows up across several independent teams with the same friction, it is ready to become a safe default. A golden path is the back end. The part that repeats across teams becomes that default, so you stop solving the same problem by hand every time. FDE does not stop once a path exists. New teams, new domains, and new edges keep producing forward-deployed work in parallel. The loop closes through what the path cannot absorb. Where teams bypass the path or hit a case it does not cover, those gaps become the next forward-deployed engagement, and the cycle repeats.</p>\n</blockquote>\n<p>&nbsp;</p>\n<img />\n<p><em>Figure 1. Forward-deployed work is the continuous front of the funnel. Golden paths are how the repeatable parts scale.</em></p>\n<h2>Quick context before we begin</h2>\n<p><a class=\"lia-anchor\" id=\"community--1-term-golden-path\"></a><strong>Golden path</strong> is the easiest safe default way to deliver a repeated engineering outcome.</p>\n<p><a class=\"lia-anchor\" id=\"community--1-term-nps\"></a><strong>Net Promoter Score (NPS)</strong> measures how likely someone is to recommend something to others. In this context, <strong>internal NPS</strong> means how likely one internal engineering team is to recommend a capability to another internal team. It is useful as a directional trust signal, not as a standalone operating metric.</p>\n<p><a class=\"lia-anchor\" id=\"community--1-term-slo\"></a><strong>Service Level Objective (SLO)</strong> is a quantitative target for a service characteristic such as availability, latency, or error rate.</p>\n<p><a class=\"lia-anchor\" id=\"community--1-term-sla\"></a><strong>Service Level Agreement (SLA)</strong> is a formal service commitment, often external or contract-backed. Many internal engineering capabilities will use <a rel=\"noopener\" target=\"_blank\" title=\"A quantitative target for availability, latency, or error rate\">SLO</a>s without using formal SLAs.</p>\n<p><a class=\"lia-anchor\" id=\"community--1-term-deprecation-lane\"></a><strong>Deprecation lane</strong> is the planned and time-bound way to retire an older pattern without causing unnecessary disruption.</p>\n<h2>How to identify a true golden path</h2>\n<p>Not every good practice is a golden path. A path qualifies when most of the following are true:</p>\n<ul>\n<li>Repeated use case across teams</li>\n<li>High cost of inconsistency</li>\n<li>High cognitive load from scratch</li>\n<li>A safe default can be defined</li>\n<li>Measurable outcome exists</li>\n</ul>\n<p>If those signals are absent, teams are usually looking at a local implementation pattern, not a <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a>.</p>\n<p>That distinction matters. Internal capability teams need to invest their product energy where standardization meaningfully reduces risk, cost, delay, or complexity.</p>\n<h2>Two transformation threads that make this real</h2>\n<p>To keep this practical, this article refers back to two transformation threads throughout the discussion.</p>\n<p>The first was an AKS migration effort. The existing hosting model worked until scale, operational control, and predictable performance started pulling in opposite directions. The move to AKS was not treated as a one-time infrastructure shift. Workloads were phased over time, traffic was controlled through a single API entry point, and teams were trained to operate in a container-first model before the migration accelerated. The outcome was not only better control. It created a stronger foundation for observability, scaling, policy-driven operations, and future platform standardization.</p>\n<p>The second was a security modernization effort around a more unified authentication and authorization model. Identity logic had grown across services over time. Permissions were fragmented. Operational inconsistency was becoming risk. The move toward a more centralized approach depended as much on rollout safety as on design quality. Feature flags, parallel writes during transition, read-repair, and rollback paths made that shift survivable on a live platform while preserving performance and user continuity.</p>\n<p>These two threads matter because they show the same principle in different settings. A capability becomes durable when teams combine the right architecture with the right product mindset, operating model, and feedback loop.</p>\n<h2>The golden path operating canvas</h2>\n<p>A useful way to think about a <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a> is through five decision areas:</p>\n<ol>\n<li>Product framing</li>\n<li>Operating model</li>\n<li>Engineering guardrails</li>\n<li>Adoption and change strategy</li>\n<li>Measurement and feedback loop</li>\n</ol>\n<img />\n<p><em>Figure 2. The measurement and feedback area is what keeps the other four honest over time.</em></p>\n<p>Individually, each area matters. Together, they determine whether a capability becomes the default, stays trusted, and improves over time.</p>\n<h2>1. Product framing</h2>\n<p>A common first mistake is treating a capability as an output instead of a product.</p>\n<p>Product framing starts with four simple questions:</p>\n<ul>\n<li>Who is the consumer</li>\n<li>What repeated problem are we solving</li>\n<li>What safe default are we standardizing</li>\n<li>What measurable outcome proves value</li>\n</ul>\n<p>This matters equally for a platform capability and for a shared service. An internal deployment template, a security validation path, a standardized API onboarding flow, or the opinionated consumption path around a reusable identity service can all become <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden paths</a> if they remove repeated friction and create better defaults.</p>\n<p><strong>In practice</strong></p>\n<p>The path gets clearer when teams name the repeated decision they want to remove. In the AKS migration, the real question was not \"should we modernize hosting.\" It was \"what is the safest default for workloads that now need predictable performance and stronger operational control.\" That framing forces sharper scoping. It also prevents vague launch language from hiding the actual default teams are expected to adopt.</p>\n<p>If teams are defining a new <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a>, product framing is where they start.</p>\n<p>If teams already have one and see drift, they should return here first and ask whether the original consumer problem is still sharp, still current, and still visible.</p>\n<h2>2. Operating model</h2>\n<p>A <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a> does not stay healthy because documentation exists. It stays healthy because ownership exists.</p>\n<p>The operating model answers questions like these:</p>\n<ul>\n<li>Who owns the path</li>\n<li>Who contributes to it</li>\n<li>Who makes change decisions</li>\n<li>What review cadence exists</li>\n<li>How support expectations are communicated</li>\n<li>How exceptions are granted and retired</li>\n</ul>\n<p>Without this, teams end up with a queue, not a product.</p>\n<p>This is where many internal capabilities weaken over time. Platform teams become catch-all owners. Security teams review too late. Consumer teams give feedback, but no one is clearly accountable for converting that feedback into decisions.</p>\n<p>Team Topologies describes a similar problem through cognitive load and enabling-team boundaries. When ownership and interaction modes are unclear, friction rises and good patterns fail to scale (<a href=\"https://teamtopologies.com/\" rel=\"noopener\" target=\"_blank\">Team Topologies</a>).</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works is simple: one accountable owner, one recurring decision forum, and one visible exception model. The exception model matters more than teams expect. A path becomes brittle when consumers can go off-path with no review, and it becomes unusable when every exception requires escalation with no expiry. Temporary exceptions need an owner, a review date, and a retirement path.</p>\n<p>If teams are starting new, they should define one accountable owner and one recurring review rhythm.</p>\n<p>If teams already see drift, they should look for ambiguity in decision rights, ownership, or support expectations.</p>\n<h2>3. Engineering guardrails</h2>\n<p>A <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a> is only valuable if it makes the safe path the easy path.</p>\n<p>Engineering guardrails are the non-negotiables built into the path itself. These typically include:</p>\n<ul>\n<li>Security posture</li>\n<li>Reliability targets</li>\n<li>Cost boundaries</li>\n<li>Operational readiness</li>\n<li>Observability and telemetry standards</li>\n<li>Supportability expectations</li>\n<li>Versioning and compatibility expectations</li>\n</ul>\n<p>This is one place where product, service, and platform thinking often get separated unnecessarily. They should not be. A shared identity service needs guardrails just as much as a platform deployment path does. A platform path without operational clarity is as incomplete as a service without security consistency.</p>\n<p>The unified auth work shows why. Centralizing identity enforcement was not just an architectural choice. It was a way to make security control more consistent, measurable, and operable. Feature-flag strategy, rollback readiness, and performance targets were all part of the guardrail model, not postscript concerns.</p>\n<p>Microsoft's Well-Architected guidance reinforces the same principle. Security, reliability, and cost are not side dimensions. They are core decision lenses that shape how capabilities are designed and operated (<a href=\"https://learn.microsoft.com/azure/well-architected/\" rel=\"noopener\" target=\"_blank\">Microsoft Well-Architected Framework</a>).</p>\n<p><strong>In practice</strong></p>\n<p>The unified auth work makes this concrete. The technical design mattered, but the real strength came from turning security rules into operating defaults: central enforcement, predictable rollout controls, and a clear rollback posture. The same principle applies elsewhere. If teams do not know the compatibility expectations, cost envelope, or minimum operational standard up front, they invent their own.</p>\n<p>If teams are defining a new path, they should decide the minimum guardrails before expansion.</p>\n<p>If an existing path is drifting, teams should look for where consumers are stepping outside the guardrails or where the guardrails were never made explicit.</p>\n<h2>4. Adoption and change strategy</h2>\n<p>A <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a> does not become real because it is published. It becomes real because teams can adopt it safely and progressively.</p>\n<p>That means rollout strategy must be designed as carefully as the solution itself. That includes:</p>\n<ul>\n<li>Migration sequencing</li>\n<li>Consumer onboarding</li>\n<li>Enablement and training</li>\n<li>Shadow testing where needed</li>\n<li>Rollback readiness</li>\n<li>Transition governance</li>\n<li>Minimum viable self-service</li>\n</ul>\n<p>This was one of the clearest lessons from the AKS migration. The technical work mattered, but the people ramp-up mattered just as much. Moving a large engineering group from one operational model to another required structured enablement, practical migration guidance, and a way to build confidence in steps rather than all at once.</p>\n<p>This mirrors the intent behind Microsoft's Cloud Adoption Framework. Large-scale change lands better when teams combine technical design with lifecycle planning, capability enablement, and operating model clarity (<a href=\"https://learn.microsoft.com/azure/cloud-adoption-framework/\" rel=\"noopener\" target=\"_blank\">Microsoft Cloud Adoption Framework</a>).</p>\n<p><strong>In practice</strong></p>\n<p>The AKS migration worked because adoption was designed, not assumed. Teams had a phased route in, a safe path back, and enough enablement to operate the new model with confidence. Just as important, the path moved toward self-service instead of permanent dependency on the central team. If a so-called path still requires repeated manual intervention for normal use, it is closer to a managed service queue than a true default.</p>\n<p>If teams are building a new path, they should design adoption as a first-class workstream.</p>\n<p>If teams already have a path that is drifting, they should treat re-adoption as a change program, not a documentation refresh.</p>\n<h2>5. Measurement and the feedback loop</h2>\n<p>If feedback does not change decisions, feedback collection becomes theater.</p>\n<p>A <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a> needs a small, meaningful set of signals that tells teams whether it is healthy. That usually includes some mix of:</p>\n<ul>\n<li>Adoption depth</li>\n<li>Time to first success</li>\n<li>On-path versus off-path incidents</li>\n<li>Cost efficiency trend</li>\n<li>Reliability trend against <a rel=\"noopener\" target=\"_blank\" title=\"Service Level Objective\">SLO</a>s</li>\n<li>Internal <a rel=\"noopener\" target=\"_blank\" title=\"Net Promoter Score\">NPS</a></li>\n<li>Deprecation progress</li>\n</ul>\n<p>The metric set does not need to be large. It needs to be actionable.</p>\n<p>Internal <a rel=\"noopener\" target=\"_blank\" title=\"Net Promoter Score\">NPS</a> is especially useful when paired with qualitative input. A team may still be using a capability while quietly warning other teams away from it. That is an early drift signal. It is still only one signal. Mandatory adoption, small sample sizes, and local politics can all distort it.</p>\n<p>DORA research reinforces the broader point that improvement depends on disciplined measurement and learning loops, not on collecting more indicators than teams can act on (<a href=\"https://cloud.google.com/devops\" rel=\"noopener\" target=\"_blank\">DORA research</a>).</p>\n<p><strong>In practice</strong></p>\n<p>The most useful feedback loop is visible. Teams should be able to see what was heard, what changed, and what did not make the cut. That is what turns trust into an operating behavior instead of a sentiment score. Without that trace, even good metrics become noise.</p>\n<p>If teams are launching a new path, they should define baseline metrics before expansion.</p>\n<p>If teams already have a path and see drift, they should run a focused diagnostic on adoption, incidents, bypass behavior, and team sentiment before redesigning anything.</p>\n<h2>The mindset shift that makes this work</h2>\n<p>Project thinking asks whether the capability shipped.</p>\n<p>Product thinking asks whether it is being adopted, trusted, improved, and measured over time.</p>\n<p>That shift changes how teams define success, stage rollout, involve consumers, and respond to drift. It applies to internal platforms, shared services, reusable components, and enablement models. The operating details are not identical across all of them, but the product discipline is still useful wherever teams expect repeat consumers and recurring outcomes.</p>\n<p>The CNCF Platforms white paper captures a related idea through paved paths and shared internal capabilities. The technical foundation matters, but the sustained value comes from how teams shape adoption, ownership, and evolution around it (<a href=\"https://tag-app-delivery.cncf.io/whitepapers/platforms/\" rel=\"noopener\" target=\"_blank\">CNCF Platforms White Paper</a>).</p>\n<p>That is the broader point of this article. Golden path thinking is not just for platform teams. It is a repeatability and trust model for internal engineering capability design.</p>\n<h2>Signals your golden path is drifting</h2>\n<ul>\n<li>Adoption stalls or declines</li>\n<li>Side paths become normal</li>\n<li>Support load rises while roadmap clarity drops</li>\n<li>Consumers cannot name the owner</li>\n<li>Breaking changes surprise teams</li>\n<li>Feedback is collected with no decision trail</li>\n<li>Teams still use the path, but would not recommend it</li>\n</ul>\n<p>These are usually not random symptoms. They point back to weak framing, weak ownership, weak guardrails, weak adoption design, or a weak feedback loop.</p>\n<h2>Immediate next steps</h2>\n<h3>If you are defining a new golden path</h3>\n<p>Start where you already embed. Your forward-deployed and high-touch engagements are the best source of golden path candidates.</p>\n<ol>\n<li>Pick one repeated, high-friction workflow with high risk if implemented inconsistently.</li>\n<li>Define the consumer, safe default, and one measurable success outcome.</li>\n<li>Set minimum guardrails for security, reliability, observability, cost, compatibility, and rollback.</li>\n<li>Create a 30-day pilot with a named owner, a review cadence, and a visible exception path.</li>\n<li>Capture internal <a rel=\"noopener\" target=\"_blank\" title=\"Net Promoter Score\">NPS</a> plus qualitative feedback, then publish the first improvement decision.</li>\n</ol>\n<h3>If you already have a golden path and see drift</h3>\n<ol>\n<li>Identify the top drift signals, such as bypass behavior, adoption drop, or trust erosion.</li>\n<li>Diagnose which area is weak: framing, ownership, guardrails, adoption, or feedback loop.</li>\n<li>Run a focused 30-day correction cycle rather than a broad redesign.</li>\n<li>Reset one decision forum, one owner, and one exception model before changing anything larger.</li>\n<li>Publish what changed, then re-measure adoption, sentiment, and operational metrics after one cycle.</li>\n</ol>\n<h2>Key takeaways</h2>\n<ul>\n<li>Golden paths reduce repeated risk and effort</li>\n<li>Product discipline keeps them useful</li>\n<li>Product discipline applies beyond platforms</li>\n<li>Safe defaults need explicit guardrails</li>\n<li>Trust grows when feedback changes decisions</li>\n<li>Golden paths are how the repeatable parts of forward-deployed work scale</li>\n</ul>\n<h2>What this means</h2>\n<p>Good engineering capabilities do not fail only because the technology is weak. They often fail because the operating model around them is too thin.</p>\n<p>That is why treating a <a rel=\"noopener\" target=\"_blank\" title=\"The easiest safe default way to deliver a repeated engineering outcome\">golden path</a> like a product matters. It turns a useful pattern into a dependable default.</p>\n<p>It also creates a stronger bridge back to the earlier Cloud Native Platforms <a href=\"https://techcommunity.microsoft.com/blog/azurearchitectureblog/cloud-native-platforms-run/4520188\" rel=\"noopener\" target=\"_blank\">Run article</a> and <a href=\"https://techcommunity.microsoft.com/blog/azurearchitectureblog/cloud-native-platforms-evolve/4520195\" rel=\"noopener\" target=\"_blank\">Evolve article</a>. Building, running, and evolving technical foundations is one part of the problem. Sustaining trust and adoption around those foundations is the next one.</p>\n<p>The real shift is this: a golden path is not complete when it launches. It is complete when teams still trust it after the first wave of exceptions, change pressure, and scale.</p>\n<hr />\n<p><strong>Want to discuss?</strong> Drop a comment with patterns you have seen in your environment. I read every reply.</p>"
  "59c5c59541fc5b35d64909b3507102b5":
    "id": "59c5c59541fc5b35d64909b3507102b5"
    "title": "Optimizing GitHub Copilot Cost in the Usage-Based Billing Era"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/optimizing-github-copilot-cost-in-the-usage-based-billing-era/ba-p/4534171"
    "published": "2026-07-08 00:43:49"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p>GitHub Copilot has become a core part of the modern developer workflow. We use it to complete code, explain unfamiliar repositories, write tests, refactor legacy applications, review pull requests, generate documentation, and automate repetitive engineering work.</p>\n<p>But as GitHub Copilot moves further into usage-based billing, teams and users are asking a very practical question:</p>\n<p>How do we keep getting value from GitHub Copilot without letting costs become unpredictable?</p>\n<p>The answer is not to blindly slash GitHub Copilot usage—that would defeat the purpose of adopting AI-assisted development in the first place. The better answer is to use GitHub Copilot more intentionally.</p>\n<p>Usage-based billing shifts our mindset from:</p>\n<p>“Can I use GitHub Copilot?” to: “Am I using the right GitHub Copilot capability, with the right model, the right context, and the right level of automation for this specific task?”</p>\n<p>This guide outlines the major ways developers and organizations can optimize GitHub Copilot costs while continuing to accelerate productivity.</p>\n<p>For a strategic look at how organizations are scaling these financial practices across modern infrastructure, read the playbook <a href=\"https://techcommunity.microsoft.com/blog/azuredevcommunityblog/token-economics-the-new-finops-for-agentic-ai/4533743\" target=\"_blank\">Token Economics: The New FinOps for Agentic AI | Microsoft Community Hub</a></p>\n<h2>Understanding the New Cost Model</h2>\n<p>Under usage-based billing, GitHub Copilot costs are driven primarily by two factors:</p>\n<ol>\n<li><strong>The model used</strong> (e.g., frontier vs. lightweight models)</li>\n<li><strong>The number of tokens consumed</strong></li>\n</ol>\n<p>A token is a small unit of text processed by the AI. This includes what you send to the model (input), what the model generates back (output), and, in some cases, cached context that the model reuses.</p>\n<p>This means a short question using a lightweight model consumes very little. Conversely, a long, multi-file agentic session using a frontier model can consume significantly more. GitHub Copilot cost is no longer just about how many people have seats—<strong>it is about how those seats are being used.</strong></p>\n<h3>The Biggest Cost Drivers:</h3>\n<ul>\n<li>Using expensive models for simple tasks</li>\n<li>Overly large context windows</li>\n<li>Long chat sessions with repeated context</li>\n<li>Agentic workflows that inspect too many files</li>\n<li>Enabling tools when they aren't needed</li>\n<li>Dumping large terminal logs or full repository scans into the chat</li>\n<li>A lack of active budgets and usage monitoring</li>\n</ul>\n<p>The good news? <strong>Most of these are completely controllable.</strong></p>\n<h2>1. Set Spending Guardrails First</h2>\n<p>The first cost-reduction step isn't technical—it’s financial governance. Before teams start heavy usage, set spending caps and budget controls. This is critical for organizations where many developers share a pool of AI credits.</p>\n<h3>Recommended Actions:</h3>\n<ul>\n<li><strong>Set a monthly budget</strong> and enable hard-stop controls where available.</li>\n<li><strong>Segment limits:</strong> Create separate limits for standard users and power users.</li>\n<li><strong>Track granularly:</strong> Monitor consumption by user, team, organization, or cost center.</li>\n<li><strong>Review early:</strong> Closely analyze the first few weeks of usage and adjust limits based on real consumption patterns.</li>\n</ul>\n<p>This prevents a single heavy user, an runaway automated agent session, or an experimental workflow from consuming a massive chunk of shared capacity early in the billing cycle.</p>\n<p>For enterprises, <strong>avoid a one-size-fits-all budget.</strong> A junior developer asking occasional chat questions does not need the same budget as a platform engineer running massive migration tasks across multiple repositories.</p>\n<h3>A Smarter Budgeting Model:</h3>\n<ul>\n<li>Standard developer budget</li>\n<li>Power user budget</li>\n<li>Pilot team budget</li>\n<li>Agentic workflow budget</li>\n<li>Innovation/experimentation budget</li>\n</ul>\n<p>This gives leaders control without blocking productivity, allowing organizations to analyze and adjust budgets frequently.</p>\n<h2>2. Use the Right Model for the Right Task</h2>\n<p><strong>Not every task requires the most powerful model.</strong> This is one of the biggest mindset shifts in usage-based billing. Developers often default to the strongest model because it feels \"safer,\" but a smaller, cheaper model is often more than enough for daily tasks.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td><strong>Use Lightweight / Lower-Cost Models For:</strong></td><td><strong>Use Stronger / Premium Models For:</strong></td></tr></thead><tbody><tr><td><span>Simple code explanations</span></td><td><span>Architecture &amp; system design decisions</span></td></tr><tr><td><span>Documentation &amp; comment updates</span></td><td><span>Complex debugging &amp; multi-file reasoning</span></td></tr><tr><td><span>Small unit test generation</span></td><td><span>Security-sensitive reviews</span></td></tr><tr><td><span>Basic debugging &amp; syntax help</span></td><td><span>Legacy modernization &amp; code translation</span></td></tr><tr><td><span>Regex help &amp; simple refactoring</span></td><td><span>Performance tuning &amp; optimization</span></td></tr><tr><td><span>Translating code from one style to another</span></td><td><span>Ambiguous, cross-service production issues</span></td></tr><tr><td><span>Summarizing small, single files</span></td><td><span>Large pull request reviews</span></td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h3>Team Golden Rule:</h3>\n<p>Start with the cheapest model that can do the task well. Move to a stronger model <em>only</em> when the task requires deeper reasoning. This keeps high-cost models reserved for where they provide the highest value.</p>\n<h2>3. Lean More on Code Completions</h2>\n<p>Inline code completions and next edit suggestions are still some of the most cost-effective GitHub Copilot experiences available. For paid GitHub Copilot plans, these inline experiences <strong>are not billed against your AI credits.</strong> Developers should aggressively lean on completions when they already know <em>what</em> they want to build.</p>\n<h3>Ideal Completion Scenarios:</h3>\n<ul>\n<li>Writing a function after creating the signature</li>\n<li>Completing repetitive boilerplate code</li>\n<li>Filling in obvious implementation logic or adding similar methods</li>\n<li>Writing simple, predictable unit tests</li>\n<li>Completing configuration files</li>\n</ul>\n<p><strong>The Rule of Thumb:</strong> Use chat when you need <em>reasoning</em>. Use completions when you need <em>acceleration</em>.</p>\n<ul>\n<li>❌ <strong>Bad Habit:</strong> Opening a new chat window for every small function.</li>\n<li>\U0001F449 <strong>Better Habit:</strong> Write the function name, a descriptive comment, or the first few lines, and let GitHub Copilot fill in the implementation inline. Open chat only if the completion misses the mark or the logic requires deeper discussion.</li>\n</ul>\n<h2>4. Use Tools Only When Needed</h2>\n<p>Agents are incredibly powerful because they can interact with tools: reading files, searching repositories, editing code, running commands, inspecting test failures, or connecting to external systems via Model Context Protocol (MCP) servers.</p>\n<p>However, <strong>tools heavily amplify costs.</strong> Every tool call adds more context, more model invocations, and more output back into the token loop. If an agent reads too many files or dumps raw logs into chat, token counts skyrocket.</p>\n<p>The goal is not to ban tools, but to <strong>scope them correctly</strong>:</p>\n<ul>\n<li><strong>Don't enable everything:</strong> Avoid activating every tool for every agent. Use only what is required.</li>\n<li><strong>Specialized agents:</strong> Create custom agents with specialized tool access (e.g., a documentation agent needs read/search tools, but likely doesn't need terminal or cloud database access).</li>\n<li><strong>Avoid full scans:</strong> Ask Copilot to inspect specific files or folders rather than scanning the entire repository.</li>\n<li><strong>Summarize logs:</strong> Ask Copilot to summarize terminal outputs or run the narrowest relevant unit test instead of dumping pages of raw test logs.</li>\n</ul>\n<h3>A Cost-Aware Prompting Example:</h3>\n<p><em>\"Use tools only if needed. Start by reading the files I mention. Do not scan the entire repository. If tests are needed, run only the relevant unit tests and summarize the failure instead of pasting full logs.\"</em></p>\n<h2>5. Narrow the Context Window</h2>\n<p>Context is useful only when it is relevant. A common cost driver is issuing broad prompts that pull massive chunks of irrelevant code into the session.</p>\n<ul>\n<li>❌ <strong>Broad Prompt:</strong> <em>\"Analyze this repo and fix the bug.\"</em> (Forces the agent to scan, search, and load unnecessary files).</li>\n<li>\U0001F449 <strong>Targeted Prompt:</strong> <em>\"The bug appears to be in /src/auth/tokenValidator.ts and /src/auth/sessionStore.ts. Review only these files and their related tests. Propose the smallest safe fix.\"</em></li>\n</ul>\n<h3>Practical Ways to Reduce Context:</h3>\n<ul>\n<li>Explicitly mention exact files, folders, error messages, or failing tests.</li>\n<li>Instruct the model on what <em>not</em> to change.</li>\n<li>Explicitly exclude generated files, vendor folders, build artifacts, and lock files.</li>\n<li><strong>Clear your sessions:</strong> Staying in one massive chat session all day causes historical context to stack up. Start a fresh session when your topic/intent changes, when frequent compactions occur, or when different tools are required.</li>\n<li><em>Pro tip:</em> If you are ending a long session but need to carry forward the conclusion, ask Copilot to generate a quick Markdown summary of the session to paste as the starting context of your new, clean session.</li>\n</ul>\n<h2>6. Use Plan-First Prompts for Complex Work</h2>\n<p>For large-scale tasks, do not let GitHub Copilot immediately start editing files in agent mode. <strong>Always ask it to plan first.</strong></p>\n<p>This is crucial for large refactoring, multi-file changes, legacy modernization, dependency upgrades, security fixes, and performance tuning.</p>\n<h3>A Plan-First Prompting Pattern:</h3>\n<p><em>\"Before editing files, create a short plan. Identify the files you need to inspect, the likely root cause, the risk level, and the smallest validation test. Do not make changes until the plan is clear.\"</em></p>\n<h3>Why this works:</h3>\n<ol>\n<li><strong>Prevents wasted work:</strong> It ensures the agent doesn't modify the wrong files or run unnecessary commands.</li>\n<li><strong>Creates a cost checkpoint:</strong> If the plan looks too broad or incorrect, you can narrow the scope <em>before</em> GitHub Copilot kicks off an expensive, multi-step agentic loop.</li>\n</ol>\n<h2>7. Batch Related Questions in One Session</h2>\n<p>While giant, day-long sessions are bad for context bloat, opening a brand-new chat for every tiny, consecutive question introduces unnecessary context reload overhead. Finding the right balance is key.</p>\n<ul>\n<li>❌ <strong>Less Efficient (Fragmented):</strong>\n<ul>\n<li><em>Chat 1:</em> \"What does this function do?\"</li>\n<li><em>Chat 2:</em> \"Can you write tests for it?\"</li>\n<li><em>Chat 3:</em> \"Can you check it for security issues?\"</li>\n</ul>\n</li>\n<li>\U0001F449 <strong>More Efficient (Batched):</strong>\n<ul>\n<li><em>Single Chat:</em> \"Review this function for correctness, security, performance, and test coverage. Give me the top issues first, then suggest the smallest safe improvement.\"</li>\n</ul>\n</li>\n</ul>\n<p><strong>The Balance:</strong> Batch highly related work in a single conversation, but hit the \"New Chat\" button the moment you pivot to an entirely new topic.</p>\n<h2>8. Keep Custom Instructions Short</h2>\n<p>Custom instructions (.github/copilot-instructions.md) and AGENT.md files are powerful tools for enforcing team standards, but they are appended as base tokens to <strong>every single chat interaction</strong>. If they are bloated, they act as a hidden tax on every prompt.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td><strong>✅ Keep it Concise &amp; Rules-Based:</strong></td><td><strong>❌ Avoid Attaching to Every Prompt:</strong></td></tr></thead><tbody><tr><td><span><em>\"Prefer small, testable changes.\"</em></span></td><td><span>Massive architecture blueprints</span></td></tr><tr><td><span><em>\"Do not modify public APIs without calling it out.\"</em></span></td><td><span>Full enterprise coding standards documents</span></td></tr><tr><td><span><em>\"Use our standard logging pattern.\"</em></span></td><td><span>Entire infrastructure runbooks</span></td></tr><tr><td><span><em>\"When writing tests, follow the existing test style.\"</em></span></td><td><span>Pages of multi-shot coding examples</span></td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p><strong>The Strategy:</strong> Use global/repository instructions <em>only</em> for non-negotiable, high-level rules. For specific workflows, use localized prompt files, specialized skills, or custom agents.</p>\n<h2>9. Use Skills and Specialized Agents for Repeatable Work</h2>\n<p>If your team frequently asks Copilot to perform identical workflows (e.g., API reviews, PR summarization, Accessibility audits, Terraform checks), turn them into reusable <strong>skills, prompt files, or custom agents</strong>.</p>\n<p>This ensures prompt formatting remains minimal, highly consistent, and optimized for low token usage. Furthermore, if you discover an excellent workflow during an active chat session, <strong>ask Copilot to turn that knowledge into a SKILL file.</strong> This prevents future sessions from having to waste tokens \"re-learning\" the process.</p>\n<h2>10. Avoid Unnecessary Agentic Mode</h2>\n<p>Agent mode is incredibly capable, but it shouldn't be the default default mode for standard queries.</p>\n<ul>\n<li>\U0001F6E0️ <strong>Use Agent Mode For:</strong> Multi-file bug fixes, generating and validating complex test suites, cross-file refactoring, reproducing test failures, or implementing full PR tasks.</li>\n<li>\U0001F4AC <strong>Stick to Normal Chat/Completions For:</strong> Simple syntax lookups, single-file explanations, writing minor snippets, basic documentation rewrites, or simple formatting tweaks.</li>\n</ul>\n<p><strong>The Rule:</strong> If a task doesn't explicitly require autonomous file editing, tool execution, or terminal commands, stick to standard chat or inline completions.</p>\n<h2>11. Monitor Usage Weekly</h2>\n<p>Optimization without measurement is just guesswork. During your organization's transition into usage-based billing, establish a <strong>weekly review cadence</strong> to look at your telemetry data.</p>\n<h3>What to Look For:</h3>\n<ul>\n<li>Which models are drawing the most volume?</li>\n<li>Are premium frontier models being used for simple tasks?</li>\n<li>Which teams or workflows are spiking above their allocated credit budgets?</li>\n<li>Is tool usage or long context history driving up the average cost per session?</li>\n</ul>\n<p>Use these insights to refine default model guidance, create user-level budget overrides for true power users, update prompt templates, and host short, continuous training sessions. <strong>The goal is never to shame high usage—high usage is fantastic if it yields high-value code. The goal is to eliminate systemic token waste.</strong></p>\n<h2>12. Create a Simple Team Policy</h2>\n<p>To make this stick, give your developers a lightweight checklist they can actually memorize. Here is a great blueprint for an internal team policy:</p>\n<ul>\n<li><strong>Completions First:</strong> Use inline completions for normal code acceleration.</li>\n<li><strong>Cheaper Models First:</strong> Default to lightweight models; escalate to frontier models only for deep reasoning.</li>\n<li><strong>Scope Wisely:</strong> Mention specific files/folders; avoid blind repository scans.</li>\n<li><strong>Plan First:</strong> Ask for an architectural plan before allowing agents to execute large edits.</li>\n<li><strong>Tool Hygiene:</strong> Keep tools and custom instructions tightly scoped and concise.</li>\n<li><strong>Review Cadence:</strong> Check usage metrics weekly and adjust budgets monthly.</li>\n</ul>\n<h2>Reusable, Cost-Aware Prompt Templates</h2>\n<p>Copy and paste these templates into your daily workflows to keep token counts down:</p>\n<ul>\n<li><strong>For Debugging:</strong> <em>\"Analyze this error using only the files I mention. Do not scan the whole repository. First explain the likely root cause, then suggest the smallest fix.\"</em></li>\n<li><strong>For Agent Mode:</strong> <em>\"Use tools only if needed. Before editing, create a short plan and list the files you need to inspect. Run only the narrowest relevant test.\"</em></li>\n<li><strong>For Code Review:</strong> <em>\"Review this pull request for correctness, security, and maintainability. Focus on high-impact issues only. Do not rewrite the code unless necessary.\"</em></li>\n<li><strong>For Testing:</strong> <em>\"Generate unit tests for this function using the existing test style. Do not modify production code. Keep the test scope narrow.\"</em></li>\n<li><strong>For Refactoring:</strong> <em>\"Refactor this file only. Preserve behavior. Do not change public APIs. Explain the risk before making edits.\"</em></li>\n<li><strong>For Large Repositories:</strong> <em>\"Do not analyze the entire repository. Start with /src/payment and /tests/payment. Ask before expanding scope.\"</em></li>\n</ul>\n<h2>Summary: What to Avoid</h2>\n<p>To keep budgets predictable, coach your teams away from these common anti-patterns:</p>\n<ol>\n<li>Setting an expensive frontier model as the default for every single interaction.</li>\n<li>Running full agent loops for questions that a simple chat could answer.</li>\n<li>Allowing agents to freely scan entire codebases without folder constraints.</li>\n<li>Enabling every single available MCP tool by default.</li>\n<li>Dumping massive, raw terminal outputs or log dumps directly into the prompt.</li>\n<li>Carrying massive, multi-hour chat histories instead of opening fresh sessions.</li>\n<li>Disregarding your usage dashboards until the invoice arrives.</li>\n</ol>\n<h2>The Bigger Picture: Cost Optimization <em>is</em> Workflow Optimization</h2>\n<p>Optimizing Copilot costs isn't about using AI less—<strong>it’s about using AI better.</strong> Smaller context windows, tighter tool scoping, cleaner prompts, and proper model selection don't just lower the bill; <strong>they make the model significantly more accurate.</strong> When you overwhelm a model with irrelevant files and messy logs, you introduce noise that degrades the quality of the output.</p>\n<p>Cost optimization is an engineering maturity practice, not a restriction. When managed through a smart operating model, GitHub Copilot will continue to securely accelerate our delivery, eliminate boilerplate toil, and maximize our focus on the work that truly matters.</p>\n<p><strong>References:</strong></p>\n<p><a href=\"https://techcommunity.microsoft.com/blog/azuredevcommunityblog/token-economics-the-new-finops-for-agentic-ai/4533743\" rel=\"noopener\" target=\"_blank\">Token Economics: The New FinOps for Agentic AI | Microsoft Community Hub</a></p>\n<p><strong>Contributors:</strong></p>\n<p>This article is maintained by Microsoft. It was originally written by the following contributors.</p>\n<ol>\n<li><a class=\"lia-external-url\" href=\"https://www.linkedin.com/in/gaurav-bhardwaj-33312854/\" rel=\"noopener\" target=\"_blank\">Gaurav Bhardwaj</a> | Senior Cloud Solution Architect</li>\n<li><a class=\"lia-external-url\" href=\"https://www.linkedin.com/in/dustinellis/\" rel=\"noopener\" target=\"_blank\">Dustin Ellis</a> | Senior Cloud Solution Architect&nbsp;</li>\n</ol>"
