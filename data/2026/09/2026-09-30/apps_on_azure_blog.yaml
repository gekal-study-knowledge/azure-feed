  "2e110e6ff3df563fc39ac720e78e2f91":
    "id": "2e110e6ff3df563fc39ac720e78e2f91"
    "title": "Bring Your Azure DevOps Repos to Azure SRE Agent Plugins"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/bring-your-azure-devops-repos-to-azure-sre-agent-plugins/ba-p/4560857"
    "published": "2026-09-30 05:00:25"
    "fetched": "2026-09-30 23:19:22"
    "summary": "<p>Plugins package the skills, agents, and connector settings your team wants every SRE Agent to have. A <a href=\"https://sre.azure.com/docs/capabilities/plugin-marketplace\" rel=\"noopener\" target=\"_blank\">plugin marketplace</a> is a Git repository that lists those plugins so any agent can install them.</p>\n<p>Until now, that repository had to be on GitHub. If your team keeps its runbooks and tooling in Azure DevOps, you had to mirror them somewhere else. Now you can point your agent at the Azure DevOps repository directly.</p>\n<p>Your team keeps authoring plugins in the repository it already uses. The agent reads from that repository and installs the plugins you choose, and a pinned version stays put until you change it.</p>\n<h2>Connect a marketplace</h2>\n<p>Azure DevOps marketplaces are rolling out now. You can use them today by turning on the preview feature.</p>\n<ol>\n<li>Open the <code>Plugins</code> page on your agent and select <code>Connect marketplace</code>.</li>\n<li>Paste the repository URL, for example <code>https://dev.azure.com/&lt;organization&gt;/&lt;project&gt;/_git/&lt;repository&gt;</code>.</li>\n<li>Sign in to Azure DevOps if the agent is not connected to that organization yet. Choose your account, a managed identity, or a personal access token.</li>\n</ol>\n<p>The marketplace is added as soon as the credential is saved. If the organization is already connected under Code access, the dialog uses that connection and skips the sign-in.</p>\n<img />\n<p>When the repository finishes cloning, its plugins appear on the <code>Plugins</code> page. Select a plugin to review its skills and install it. The docs below cover each step, including managed identity setup.</p>\n<p>Use a personal access token or managed identity limited to the repositories you need rather than your own account.</p>\n<h2>Try it</h2>\n<p>Put one procedure your on-call team repeats into a plugin, push it to an Azure DevOps repository, and connect that repository to a test agent. If the skill runs as expected, connect the same marketplace to your other agents.</p>\n<p><a href=\"https://sre.azure.com\" rel=\"noopener\" target=\"_blank\"><strong>Create or open your Azure SRE Agent</strong></a> to get started.</p>\n<p>Product documentation:</p>\n<ul>\n<li><a href=\"https://sre.azure.com/docs/capabilities/plugin-marketplace\" rel=\"noopener\" target=\"_blank\">Plugin marketplace overview</a></li>\n<li><a href=\"https://sre.azure.com/docs/tutorials/connectors/add-private-marketplace\" rel=\"noopener\" target=\"_blank\">Add a private marketplace</a>, which now covers Azure DevOps</li>\n<li><a href=\"https://sre.azure.com/docs/tutorials/connectors/install-plugin-from-marketplace\" rel=\"noopener\" target=\"_blank\">Install a plugin from a marketplace</a></li>\n<li><a href=\"https://sre.azure.com/docs/tutorials/automation/create-skill\" rel=\"noopener\" target=\"_blank\">Create a skill</a> if you are not using a marketplace. You can build a custom skill directly in the agent, with no repository involved.</li>\n</ul>"
  "baa01f8862f9d1969121b877a3a9394c":
    "id": "baa01f8862f9d1969121b877a3a9394c"
    "title": "Comparing Three Approaches to AI Agent Evaluation and Observability"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/comparing-three-approaches-to-ai-agent-evaluation-and/ba-p/4560833"
    "published": "2026-09-30 03:25:14"
    "fetched": "2026-09-30 23:19:22"
    "summary": "<h2 id=\"why-evaluation-and-observability-belong-together\">Why evaluation and observability belong together</h2>\n<p>Agent evaluation and observability answer two related questions:</p>\n<ul>\n<li>Is the agent producing the right result?</li>\n<li>What happened from the initial request through every model and tool call?</li>\n</ul>\n<p>Evaluation measures quality with repeatable scores (is our system working), such as task completion, tool-call accuracy, groundedness, or safety. Observability captures the end-to-end execution flow, including prompts, model responses, tool calls, latency, token usage, and errors.</p>\n<p>You need both. A score can tell you that an agent failed, while a trace helps you understand why.</p>\n<p>Microsoft provides several ways to host and monitor agents. You can use a Microsoft Foundry hosted agent with integrated tracing and evaluation, or run the agent independently on a service such as Azure Container Apps and connect it to Azure Monitor. Open-source platforms such as Langfuse provide another option and can be self-hosted in Azure.</p>\n<p>We built three proofs of concept (POCs) to compare these approaches:</p>\n<ol type=\"1\">\n<li>Self-hosted Langfuse</li>\n<li>A Microsoft Foundry hosted agent</li>\n<li>A standalone agent on Azure Container Apps</li>\n</ol>\n<p>The best choice depends on more than features. Authentication, networking, security boundaries, operational ownership, and the existing Azure architecture all affect the decision.</p>\n<div class=\"note\">\n<div class=\"title\">\n<p>Note</p>\n</div>\n<p>These findings come from one controlled comparison, not a general performance benchmark. We used the same agent image, model deployment, prompt, tools, and synthetic test data in all three POCs.</p>\n</div>\n<h2 id=\"the-common-test\">The common test</h2>\n<p>The test agent summarized a synthetic portfolio. It had to call three deterministic tools in a fixed order:</p>\n<ol type=\"1\">\n<li>Load the dataset</li>\n<li>Validate its schema</li>\n<li>Compute the summary</li>\n</ol>\n<p>The expected answer was known in advance, which allowed us to evaluate both the final result and the tool trajectory. We also created a deterministic tool-call-accuracy score so we could compare how each platform stored and displayed the same custom metric.</p>\n<h2 id=\"poc-1-self-hosted-langfuse\">POC 1: Self-hosted Langfuse</h2>\n<p>For the Langfuse POC, one private Azure virtual machine ran the agent and the Langfuse stack with Docker Compose. The deployment included Langfuse web and worker services, PostgreSQL, ClickHouse, Redis, MinIO, and an OpenTelemetry Collector. Azure Bastion provided private administrative access, and a managed identity retrieved secrets from Azure Key Vault.</p>\n<img />\n<p>The main advantage was the integrated experience. Traces, scores, datasets, experiments, annotations, latency, token usage, and cost appeared in one application. We could move from the original prompt to each tool call, the final response, and the evaluation score without building a separate dashboard.</p>\n<img />\n<p>That capability comes with operational responsibility. A production self-hosted deployment requires patching, scaling, backup, recovery, data retention, access control, and monitoring for the Langfuse services and their data stores.</p>\n<p>Choose this approach when a unified, open-source AI engineering platform and deployment control are higher priorities than minimizing platform operations.</p>\n<h2 id=\"poc-2-microsoft-foundry-hosted-agent\">POC 2: Microsoft Foundry hosted agent</h2>\n<p>For the Foundry POC, Microsoft Foundry hosted the agent from a pinned container image. Application Insights and Log Analytics stored the telemetry. We used Foundry's Traces experience for agent trajectories and added an Azure Workbook for custom evaluation metrics.</p>\n<img />\n<p>Foundry provided the strongest Azure-native developer experience. Its trace view displayed model and tool activity as an agent trajectory, and its evaluation capabilities included built-in and custom evaluators. The underlying traces still flowed to Application Insights, where they could be queried and used in Azure Monitor visualizations.</p>\n<img />\n<p>The tradeoff is architectural alignment. The application must fit the customer's Foundry account, identity, networking, and deployment model. Custom business metrics can also require additional emission and visualization work beyond the native evaluation experience.</p>\n<p>Choose this approach when managed agent hosting, Foundry-native tracing, and Azure-native evaluation are the priorities.</p>\n<h2 id=\"poc-3-standalone-agent-on-azure-container-apps\">POC 3: Standalone agent on Azure Container Apps</h2>\n<p>For the third POC, we removed Foundry from the hosting path. The same image ran as an Azure Container App and used a managed identity to pull from Azure Container Registry and call Azure OpenAI. OpenTelemetry sent agent activity to Application Insights and Log Analytics.</p>\n<img />\n<p>This POC demonstrated that the Azure Monitor foundation is not limited to Foundry-hosted agents. Application Insights still provided an end-to-end transaction waterfall showing model calls, tool executions, latency, and errors, along with agent-level monitoring views.</p>\n<img />\n<p>The difference was the amount of assembly required. The team owns application instrumentation, the evaluation runner, custom metric emission, dashboards, and CI integration. The result offers more control over hosting, authentication, ingress, and network placement, but it requires more engineering than the Foundry-native experience.</p>\n<p>Choose this approach when the agent must fit an existing container platform or custom security architecture and the team is prepared to build the evaluation workflow around it.</p>\n<h2 id=\"side-by-side-comparison\">Side-by-side comparison</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>Decision area</th><th>Langfuse</th><th>Foundry hosted agent</th><th>Azure Container Apps</th></tr></thead><tbody><tr><td>Agent hosting</td><td>Customer-operated in this POC</td><td>Microsoft-managed hosted agent</td><td>Customer-managed container app</td></tr><tr><td>Primary trace experience</td><td>Native Langfuse tracing</td><td>Foundry Traces plus Application Insights</td><td>Application Insights</td></tr><tr><td>Evaluation</td><td>Native scores, evaluators, datasets, and experiments</td><td>Foundry built-in and custom evaluators</td><td>Custom runner or separate evaluation service</td></tr><tr><td>Custom metrics</td><td>Native scores and dashboards</td><td>Emit to Azure Monitor and visualize as needed</td><td>Emit to Azure Monitor and visualize as needed</td></tr><tr><td>Infrastructure ownership</td><td>Highest</td><td>Lowest for agent hosting</td><td>Moderate</td></tr><tr><td>Architecture flexibility</td><td>High, but the platform must be operated</td><td>Aligned to Foundry architecture</td><td>Highest for the application hosting layer</td></tr><tr><td>Best fit</td><td>Integrated open-source AI engineering platform</td><td>Managed Azure-native agent experience</td><td>Existing container and security architecture</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<h2 id=\"what-we-learned\">What we learned</h2>\n<p>All three approaches can support meaningful evaluation and observability. The real difference is where the capabilities live and how much the customer must assemble and operate.</p>\n<ul>\n<li>Langfuse provided the most integrated tracing and evaluation experience in this comparison, but we owned the platform infrastructure.</li>\n<li>Foundry reduced hosting operations and provided a purpose-built agent trace and evaluation experience.</li>\n<li>Azure Container Apps provided the greatest hosting flexibility while preserving Azure Monitor observability, but required us to supply the evaluation and custom visualization layers.</li>\n</ul>\n<p>Because all three POCs used the same model, prompt, and tool sequence, the LLM token cost for an equivalent run was effectively the same. Platform and infrastructure costs were not equivalent and require a separate estimate based on scale, retention, networking, support, and operational requirements.</p>\n<p>The decision should start with the customer's constraints:</p>\n<ol type=\"1\">\n<li>Does the agent fit the Foundry hosting and identity model?</li>\n<li>Does the organization want to operate an open-source observability platform?</li>\n<li>Does the agent need to run inside an existing container and network architecture?</li>\n<li>Which evaluation capabilities must be available before deployment and in production?</li>\n<li>Who will own instrumentation, dashboards, storage, upgrades, and incident response?</li>\n</ol>\n<p>There is no single correct platform for every agent. The right choice is the one that provides the required evidence about quality and behavior while fitting the customer's security, architecture, and operating model.</p>\n<h2 id=\"learn-more\">Learn more</h2>\n<ul>\n<li><a href=\"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-setup\" rel=\"noopener\" target=\"_blank\">Set up tracing for agents in Microsoft Foundry</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/azure-monitor/app/agents-view\" rel=\"noopener\" target=\"_blank\">Monitor AI agents with Application Insights</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators\" rel=\"noopener\" target=\"_blank\">Review Microsoft Foundry agent evaluators</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/container-apps/opentelemetry-agents\" rel=\"noopener\" target=\"_blank\">Collect OpenTelemetry data in Azure Container Apps</a></li>\n<li><a href=\"https://langfuse.com/docs/observability/overview\" rel=\"noopener\" target=\"_blank\">Explore Langfuse observability</a></li>\n<li><a href=\"https://langfuse.com/docs/evaluation/overview\" rel=\"noopener\" target=\"_blank\">Explore Langfuse evaluation</a></li>\n<li><a href=\"https://langfuse.com/self-hosting/deployment/azure\" rel=\"noopener\" target=\"_blank\">Deploy Langfuse on Azure</a></li>\n</ul>"
  "89384cd716fc20c848fadef70cf5e5fb":
    "id": "89384cd716fc20c848fadef70cf5e5fb"
    "title": "Bring managed browser automation to your agent applications"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/bring-managed-browser-automation-to-your-agent-applications/ba-p/4561184"
    "published": "2026-09-30 23:25:38"
    "fetched": "2026-10-01 08:15:59"
    "summary": "<p>AI agents become more useful when they can move beyond conversation and complete real workflows. <br /><strong>Playwright Cloud Browsers</strong> provides managed, on-demand browser capacity that agent applications can access through Model Context Protocol (MCP).</p>\n<p>You can connect Playwright Cloud Browsers to agent applications, including coding agents such as the GitHub Copilot app and Visual Studio Code: when they support custom remote MCP servers. Once connected, an agent can navigate an approved application, complete forms, verify results, capture evidence, and close the managed browser session. Your team gets browser automation without maintaining browsers in every user or agent environment.</p>\n<p>In this example, we use the GitHub Copilot app to show the connection and workflow. You can extend the same approach to other compatible applications by adding the Playwright workspace endpoint through their custom remote MCP configuration.</p>\n<h5><strong>Example: Follow one registration request from start to finish</strong></h5>\n<p>If your team processes employee registrations for approved training programs, each request can involve several repetitive steps: open the portal, enter employee and course information, check required fields, review the details, submit the form, and retain confirmation evidence.</p>\n<p>After you connect the workspace MCP endpoint, you can ask your agent application to handle the browser steps. In the GitHub Copilot app, for example, you could use this prompt:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td><em>\"Use Playwright Cloud Browsers to open &lt;approved-registration-portal-url&gt; and process case &lt;number&gt;. Enter the employee and course information I provide, validate all required fields, and show me a structured summary. Do not submit until I approve it. After approval, submit once, verify the confirmation number and success message, capture a screenshot, and close the browser session. If submission times out, inspect the page before deciding whether a retry is safe.\"</em></td></tr></tbody><colgroup><col style=\"width: 100.00%;\" /></colgroup></table></div>\n<p>The prompt defines the outcome, approved destination, human decision point, evidence, and cleanup expectation. The agent handles repetitive browser interaction while you remain in control of the consequential submission.</p>\n<h5><strong>Connect managed browser capacity in minutes</strong></h5>\n<p>Every Playwright workspace provides a workspace-scoped MCP endpoint:</p>\n<p><strong>https://&lt;region&gt;.mcp.playwright.microsoft.com/playwrightworkspaces/&lt;workspace-id&gt;/mcp</strong></p>\n<ol>\n<li>Provision a Playwright workspace in the Azure portal.</li>\n<li>Open the workspace and copy its MCP endpoint.</li>\n<li>In the GitHub Copilot app, open Customize, select Add, and then select MCP.</li>\n<li>Choose HTTP, enter a server name, paste the endpoint, and select Save.</li>\n</ol>\n<p>For this illustrated setup, only the server name and workspace endpoint are entered. Follow your organization's authentication and access policies for the workspace.<br /><br /><u>Figure 1. Open the Playwright workspace Overview page in the Azure portal</u></p>\n<img />\n<p><br /><u>Figure 2. Copy the workspace-scoped MCP endpoint</u></p>\n<img />\n<p>&nbsp;</p>\n<p><u>Figure 3. Open Customize in the GitHub Copilot app</u></p>\n<img />\n<p><br /><br /><br /></p>\n<p><u>Figure 4. Select 'MCP' Tab, and add the workspace endpoint as a custom HTTP MCP server</u></p>\n<img />\n<p><br /><br />This article demonstrates Add &gt; MCP in the GitHub Copilot app. Other compatible applications use their own custom remote MCP configuration.</p>\n<p><strong>Using another compatible application? </strong>In Visual Studio Code or another client that supports custom remote MCP servers, add the same workspace endpoint through that application’s MCP configuration. The interface can differ, but the endpoint and connection model remain the same.</p>\n<h5><u>Features of Playwright Cloud Browsers</u></h5>\n<h5>1. Watch the agent complete the form</h5>\n<p>When the task begins, the agent creates a managed browser session and uses its browserSessionId throughout the registration flow. Session creation might also return a liveViewUrl; Live View availability depends on the session.</p>\n<p>When available, Live View lets you watch while the agent opens the portal, finds the registration fields, and enters the supplied information. The agent follows an observe-act-verify loop: inspect the page, enter the required values, wait for validation or dependent fields, and observe the page again.</p>\n<p>If you need to intervene rather than observe, Playwright Cloud Browsers provides Take Control for supported active sessions. An authorized operator can interact directly with the running browser to address an unexpected page state, complete an action that requires human judgment, or help troubleshoot the flow. Control can then return to automation.</p>\n<h5>2. Review before the consequential action</h5>\n<p>Before submission, the agent presents a structured summary with the case ID, employee name, selected course, date, contact information, required acknowledgements, and any validation warning. It waits for explicit approval. Automation removes repetitive entry and navigation, while you retain authority over the action that creates the registration.</p>\n<p>After approval, the agent submits once. It verifies the success message and confirmation identifier, captures a screenshot when evidence is required, and reports the outcome.</p>\n<h5>3. Investigate errors before retrying</h5>\n<p>A timeout or disconnected caller does not prove that submission failed. Repeating a non-idempotent action can create a duplicate registration. If the result is unclear, the agent first checks the page for a confirmation number, success message, changed status, or validation error. It retries only when the page state shows that repeating the action is safe.</p>\n<p>Console messages and network activity can explain client-side errors, failed requests, authentication problems, or validation behavior. Playwright Cloud Browsers also provides built-in observability and browser session data, including logs, traces, screenshots, recordings, and execution artifacts. Availability depends on the workflow, session, and configuration.</p>\n<h5>4. Close the session and monitor the result</h5>\n<p>The agent closes the browser session whether the registration succeeds, fails, or is cancelled. Closed or expired sessions cannot be reopened. Explicit cleanup releases browser capacity promptly and reduces unexpected activity.</p>\n<p><br /><u>Figure 5. Review MCP created sessions in the Azure portal Browser activity log</u></p>\n<img />\n<p>&nbsp;</p>\n<p>Use Browser sessions &gt; Browser activity log to review MCP-created sessions, source, start time, and duration.</p>\n<p>&nbsp;</p>\n<p>The result is one connected workflow: your agent application provides the conversational or coding experience, MCP provides the connection, and Playwright Cloud Browsers provides managed execution, visibility, human intervention, evidence, diagnostics, and auditability.</p>\n<p><strong>Responsible use: </strong>Use browser automation only with approved websites, accounts, and data. Retain human review before consequential submissions, and never place workspace credentials, access tokens, or sensitive form data in prompts, source control, screenshots, or logs.</p>\n<h1>Learn more</h1>\n<ul>\n<li><strong>Azure portal: </strong><a href=\"https://portal.azure.com/\" target=\"_blank\">https://portal.azure.com/</a></li>\n<li><strong>What is Playwright Workspaces?: </strong><a href=\"https://learn.microsoft.com/azure/app-testing/playwright-workspaces/overview-what-is-microsoft-playwright-workspaces\" target=\"_blank\">https://learn.microsoft.com/azure/app-testing/playwright-workspaces/overview-what-is-microsoft-playwright-workspaces</a></li>\n<li><strong>Create and manage a workspace: </strong><a href=\"https://learn.microsoft.com/azure/app-testing/playwright-workspaces/how-to-manage-playwright-workspace\" target=\"_blank\">https://learn.microsoft.com/azure/app-testing/playwright-workspaces/how-to-manage-playwright-workspace</a></li>\n<li><strong>Playwright Workspaces remote MCP server:&nbsp;</strong><a href=\"https://learn.microsoft.com/en-us/azure/app-testing/playwright-cloud-browsers/quickstart-automate-browser-tasks-remote-mcp\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/app-testing/playwright-cloud-browsers/quickstart-automate-browser-tasks-remote-mcp</a></li>\n<li><strong>Manage workspace access tokens:&nbsp;</strong><a href=\"https://learn.microsoft.com/azure/app-testing/playwright-workspaces/how-to-manage-access-tokens\" target=\"_blank\">https://learn.microsoft.com/azure/app-testing/playwright-workspaces/how-to-manage-access-tokens</a></li>\n<li><strong>Customize the GitHub Copilot app: </strong><a href=\"https://docs.github.com/copilot/how-tos/github-copilot-app/customize-github-copilot-app\" target=\"_blank\">https://docs.github.com/copilot/how-tos/github-copilot-app/customize-github-copilot-app</a></li>\n<li><strong>Add and manage MCP servers in Visual Studio Code: </strong><a href=\"https://code.visualstudio.com/docs/agent-customization/mcp-servers\" target=\"_blank\">https://code.visualstudio.com/docs/agent-customization/mcp-servers</a></li>\n</ul>"
