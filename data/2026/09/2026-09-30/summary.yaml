"overview": |
  この日は 35 件で、SQL とデータベース関連の更新が大量に出た日でした。SQL では、AI エージェントで SQL ワークロードを構築・運用・移行するときに製品固有の的確な指針を得られる Microsoft SQL Agent Skills がパブリックプレビューとなり、SQL Server から Azure への移行を評価・移行先選定・移行実行・移行後検証まで通して自動化する SQL Migration Agent Skills が一般提供となりました。Azure Arc の移行画面から Hyperscale を含む Azure SQL Database を移行先として直接選べるようになり (プレビュー)、Azure SQL Database Hyperscale のサーバーレスコンピューティング階層では非アクティブ時の自動一時停止と再開がプレビューで使えます。Azure SQL Database Hyperscale Premium シリーズには 160 vCore と 192 vCore の選択肢が加わり、従来より最大 50% 多いコンピューティング容量を提供します。監視面では、Azure SQL Database 向けの Microsoft 管理によるパフォーマンス監視がパブリックプレビューとなり、独自の収集スクリプトを書いたり分断されたツール間でテレメトリーを突き合わせる必要がなくなりました。Azure Arc 対応 SQL Server のパフォーマンス監視プレビューも拡張され、Microsoft 管理の監視データをテレメトリーエンドポイントから直接クエリできます。開発者向けには、Visual Studio Code で SQL スクリプトを整形できる SQL Formatter が一般提供となり、SSMS では Microsoft.Build.Sql プロジェクトによるデータベース DevOps が使えるようになりました。実行環境では、SQL Server on Azure Local の接続モードが一般提供となり、継続的な Azure 接続を保てない高度に規制された環境・遠隔地・エアギャップ環境向けの SQL Server on Azure Local Disconnected (ALDO) も一般提供に、Linux の Azure VM 上の SQL Server はレガシーのマーケットプレイスイメージを置き換えるスクリプトベースの自動プロビジョニングがプレビューとなりました。Azure Arc 対応 SQL Server は Italy North と Germany West Central で利用できるようになっています。PostgreSQL では、論理バックアップ (pg_dump/pg_restore) から Azure Backup コンテナーと統合した物理スナップショットベースのバックアップに移行する長期保持 (LTR) v2 がパブリックプレビューとなり、I/O 集約でトランザクションの多いワークロード向けに Ultra Disk サポートもプレビューで登場しました。Flexible Server は PostgreSQL とは別の Microsoft Entra テナントにある Azure Key Vault や Azure Managed HSM の鍵で暗号化できるクロステナントのカスタマー管理キー (CMK) に対応しました。ストレージでは、Azure NetApp Files が SMB ボリュームで Microsoft Entra Kerberos 認証に対応し (プレビュー)、クラウド発行の Kerberos チケットでハイブリッドまたはクラウドのみの ID から認証できます。あわせて、Premium と Ultra のサービスレベルで cool access を有効にしたときの QoS が改善されてホットとクールが混在するワークロードの性能とコストの両立が進み、大容量ボリュームのブレークスルーモードが一般提供となって最大 2PiB のボリュームとワークロード特性に応じて最大 80 GiBps のスループットを提供します。コンピュートでは、第 5 世代 AMD EPYC (Turin) ベースのストレージ最適化 VM Lasv5 / Laosv5 シリーズが一般提供となり、2〜160 vCPU で vCPU あたり 8 GiB のメモリと 720 GB のローカル NVMe を備えます。仮想マシンスケールセットには、SKU の空き状況・容量・配置要件から Azure が最適な可用性ゾーンを自動選択する Automatic Zone Placement がプレビューで加わりました。廃止予定は 4 件で、Azure IoT Central が 2029 年 9 月 20 日に、Azure Arc 対応 System Center Virtual Machine Manager (SCVMM) が 2029 年 9 月に廃止され、Microsoft HPC Pack は全バージョンが廃止に向かい 2027 年 8 月 27 日でサポート終了 (1 年間の廃止期間中は限定的な対応のみ)、Azure Container Apps 上の Azure Functions v1 ホスティングモデルは 2027 年 9 月 29 日に廃止され、以降は既存アプリが動作を停止してリクエストやイベント駆動のトリガーを処理しなくなります。セキュリティブログでは 3 件が公開されました。ロシアの国家系脅威アクター Star Blizzard が 2026 年 1 月以降、大規模なフィッシングキャンペーン、侵害されたサイト上のアカウント利用、そして Microsoft が「RedFlick」と追跡する新しいマルウェア配布手法によって検知回避能力を高めていること、Storm-3068 が侵害した ID を起点にクラウド全体へのアクセスへ広げた経緯と ID・パイプライン・クラウド基盤を守る手立て、そして MSP360 の RMM を悪用して ScreenConnect を展開し冗長なリモートアクセス経路を作るフィッシングキャンペーンが報告されています。あわせて Azure SDK の 2026 年 9 月リリースが公開されました。エージェント運用では、Azure SRE Agent のプラグインマーケットプレイスとして Azure DevOps のリポジトリを直接指定できるようになりました。プラグインは、チームがすべての SRE Agent に持たせたいスキル・エージェント・コネクタ設定をまとめたもので、マーケットプレイスはそれらを並べた Git リポジトリです。これまではそのリポジトリが GitHub にある必要があり、Runbook やツールを Azure DevOps に置いているチームはどこかに複製しなければなりませんでしたが、今は Azure DevOps のリポジトリをそのまま指せます。エージェントはそこからプラグインを読み込んでインストールし、ピン留めしたバージョンは変更するまで固定されます (プレビュー機能を有効にすると今日から使えます)。あわせて、AI エージェントの評価と可観測性について 3 つのアプローチを比べた記事が公開されました。評価は「システムがうまく動いているか」をタスクの完了率、ツール呼び出しの正確さ、根拠づけ、安全性といった再現可能なスコアで測るもの、可観測性はプロンプト・モデルの応答・ツール呼び出し・レイテンシー・トークン使用量・エラーを含む端から端までの実行の流れを捉えるもので、スコアは失敗したことを教えてくれても、なぜ失敗したかを理解するにはトレースが要るため、両方が必要だと整理されています。Microsoft Foundry のホステッドエージェントでトレースと評価を統合的に使う方法と、エージェントを別のサービスで独立して動かす方法が比較されています。ブラウザー操作では、Playwright Cloud Browsers によってマネージドでオンデマンドのブラウザー能力を、Model Context Protocol (MCP) 経由でエージェントアプリケーションから使えることが紹介されました。カスタムのリモート MCP サーバーに対応していれば、GitHub Copilot アプリや Visual Studio Code のようなコーディングエージェントからも接続でき、承認済みのアプリケーションを操作してフォームを入力し、結果を確認して証跡を残し、マネージドなブラウザーセッションを閉じるところまでをエージェントに任せられます。利用者やエージェントの環境ごとにブラウザーを維持する必要がなくなります。セキュリティブログでは、インターネットに面したメールサーバーに対する未認証のコマンドインジェクションとして CVE-2026-73570 の追跡結果が公開されました。Microsoft Threat Intelligence が Zimbra における悪用を分析し、観測された攻撃経路、検知の糸口、緩和策の指針をまとめています。
