"overview": |
  この日は 36 件で、SQL とデータベース関連の更新が大量に出た日でした。SQL では、AI エージェントで SQL ワークロードを構築・運用・移行するときに製品固有の的確な指針を得られる Microsoft SQL Agent Skills がパブリックプレビューとなり、SQL Server から Azure への移行を評価・移行先選定・移行実行・移行後検証まで通して自動化する SQL Migration Agent Skills が一般提供となりました。Azure Arc の移行画面から Hyperscale を含む Azure SQL Database を移行先として直接選べるようになり (プレビュー)、Azure SQL Database Hyperscale のサーバーレスコンピューティング階層では非アクティブ時の自動一時停止と再開がプレビューで使えます。Azure SQL Database Hyperscale Premium シリーズには 160 vCore と 192 vCore の選択肢が加わり、従来より最大 50% 多いコンピューティング容量を提供します。監視面では、Azure SQL Database 向けの Microsoft 管理によるパフォーマンス監視がパブリックプレビューとなり、独自の収集スクリプトを書いたり分断されたツール間でテレメトリーを突き合わせる必要がなくなりました。Azure Arc 対応 SQL Server のパフォーマンス監視プレビューも拡張され、Microsoft 管理の監視データをテレメトリーエンドポイントから直接クエリできます。開発者向けには、Visual Studio Code で SQL スクリプトを整形できる SQL Formatter が一般提供となり、SSMS では Microsoft.Build.Sql プロジェクトによるデータベース DevOps が使えるようになりました。実行環境では、SQL Server on Azure Local が一般提供となりました。データの置き場所を自分で選びながら、インフラ・接続性・データ配置の制御を保ったまま近代化でき、接続モードでは Azure Arc 経由で集中管理・ガバナンス・監視・セキュリティ・ライセンス管理を Azure のサービスで扱えます。継続的な Azure 接続を保てない高度に規制された環境・遠隔地・エアギャップ環境向けの SQL Server on Azure Local Disconnected (ALDO) も一般提供となり、Linux の Azure VM 上の SQL Server はレガシーのマーケットプレイスイメージを置き換えるスクリプトベースの自動プロビジョニングがプレビューとなりました。Azure Arc 対応 SQL Server は Italy North と Germany West Central で利用できるようになっています。PostgreSQL では、論理バックアップ (pg_dump/pg_restore) から Azure Backup コンテナーと統合した物理スナップショットベースのバックアップに移行する長期保持 (LTR) v2 がパブリックプレビューとなり、I/O 集約でトランザクションの多いワークロード向けに Ultra Disk サポートもプレビューで登場しました。Flexible Server は PostgreSQL とは別の Microsoft Entra テナントにある Azure Key Vault や Azure Managed HSM の鍵で暗号化できるクロステナントのカスタマー管理キー (CMK) に対応しました。アプリとエージェントでは、エージェントの評価と可観測性を 3 つの手法で比較する記事が公開され、評価がタスク完了率・ツール呼び出しの正確さ・根拠性・安全性といった反復可能なスコアで品質を測るのに対し、可観測性は最初のリクエストからすべてのモデル呼び出しとツール呼び出しまで何が起きたかを捉えるものとして整理されています。Azure SRE Agent のプラグインマーケットプレイスはこれまで GitHub のリポジトリに限られていましたが、Azure DevOps のリポジトリも指定できるようになり、ランブックやツールを Azure DevOps に置いているチームが別の場所にミラーする必要がなくなりました。あわせて、Playwright Cloud Browsers がマネージドでオンデマンドのブラウザー容量を Model Context Protocol (MCP) 経由で提供し、GitHub Copilot アプリや Visual Studio Code のようなコーディングエージェントを含むエージェントアプリケーションからブラウザー操作を任せられるようになりました。ストレージでは、Azure NetApp Files が SMB ボリュームで Microsoft Entra Kerberos 認証に対応し (プレビュー)、クラウド発行の Kerberos チケットでハイブリッドまたはクラウドのみの ID から認証できます。あわせて、Premium と Ultra のサービスレベルで cool access を有効にしたときの QoS が改善されてホットとクールが混在するワークロードの性能とコストの両立が進み、大容量ボリュームのブレークスルーモードが一般提供となって最大 2PiB のボリュームとワークロード特性に応じて最大 80 GiBps のスループットを提供します。コンピュートでは、第 5 世代 AMD EPYC (Turin) ベースのストレージ最適化 VM Lasv5 / Laosv5 シリーズが一般提供となり、2〜160 vCPU で vCPU あたり 8 GiB のメモリと 720 GB のローカル NVMe を備えます。仮想マシンスケールセットには、SKU の空き状況・容量・配置要件から Azure が最適な可用性ゾーンを自動選択する Automatic Zone Placement がプレビューで加わりました。廃止予定は 4 件で、Azure IoT Central が 2029 年 9 月 20 日に、Azure Arc 対応 System Center Virtual Machine Manager (SCVMM) が 2029 年 9 月に廃止され、Microsoft HPC Pack は全バージョンが廃止に向かい 2027 年 8 月 27 日でサポート終了 (1 年間の廃止期間中は限定的な対応のみ)、Azure Container Apps 上の Azure Functions v1 ホスティングモデルは 2027 年 9 月 29 日に廃止され、以降は既存アプリが動作を停止してリクエストやイベント駆動のトリガーを処理しなくなります。セキュリティブログでは 4 件が公開されました。ロシアの国家系脅威アクター Star Blizzard が 2026 年 1 月以降、大規模なフィッシングキャンペーン、侵害されたサイト上のアカウント利用、そして Microsoft が「RedFlick」と追跡する新しいマルウェア配布手法によって検知回避能力を高めていること、Storm-3068 が侵害した ID を起点にクラウド全体へのアクセスへ広げた経緯と ID・パイプライン・クラウド基盤を守る手立て、MSP360 の RMM を悪用して ScreenConnect を展開し冗長なリモートアクセス経路を作るフィッシングキャンペーン、そしてインターネットに露出したメールサーバーに対する認証不要のコマンドインジェクション CVE-2026-73570 の Zimbra における悪用 (観測された攻撃経路、検知の機会、緩和策) が報告されています。あわせて Azure SDK の 2026 年 9 月リリースが公開されました。
