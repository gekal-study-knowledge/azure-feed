    "title": "Azure Copilot announces general availability of the Troubleshooting Agent"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-copilot-announces-general-availability-of-the/ba-p/4554549"
    "published": "2026-09-10 00:00:00"
    "fetched": "2026-09-11 00:19:40"
    "summary": "<p>Cloud operations are most effective when teams can turn insights into understanding and understanding into action. Whether you’re deploying new services, troubleshooting an issue, assessing resource health, or managing change, you need operational intelligence that helps you make faster, more informed decisions and continuously improve your environment.</p>\n<p>This is the promise of agentic cloud operations, a new operating model that uses AI powered agents equipped with deep contextual understanding and built in governance to help you run your cloud environments with speed and confidence. <a href=\"https://azure.microsoft.com/en-us/products/copilot\" target=\"_blank\">Azure Copilot</a> brings AI-powered operations directly into Azure, helping you understand your environment, identify issues, determine likely causes and take informed action using the context already available in your Azure resources and services.</p>\n<p>Today, Azure Copilot is announcing <strong>the general availability of Troubleshooting Agent</strong>, a unified, built-in Azure Copilot capability that helps customers investigate and resolve operational issues faster. Available through both Azure Copilot and Support + Troubleshooting in the Azure portal, Troubleshooting Agent enables you to move from issue detection to resolution faster by bringing together troubleshooting insights, operational context, and recommended actions in a single experience.</p>\n<h2>Deep expertise across Azure services</h2>\n<p>Azure services support a wide variety of architectures, operational patterns, and workload requirements. While Azure Copilot provides consistent agentic troubleshooting across Azure, deeper service integrations enable specialized expertise and investigative capabilities for specific services.</p>\n<p>At general availability, Azure Compute and Azure Kubernetes Service (AKS) are the first services to offer these enhanced troubleshooting experiences.</p>\n<ul>\n<li>Azure Compute: You can investigate issues such as unexpected virtual machine restarts, connectivity and boot failures, high resource utilization, deployment and allocation failures, and unhealthy scale set instances.</li>\n<li>AKS: You can investigate issues such as pod restarts, stalled deployments, scheduling constraints, cluster networking, scaling behavior, upgrade regressions, and degraded performance.</li>\n</ul>\n<blockquote>\n<p><em>“This [Troubleshooting Agent] is really helpful for the person who is debugging, and they can come to a conclusion. Instead of going through the entire documentation, it is giving us the exact information on what it needs and what to look on.” – Senior Software Engineer, Lavelle Networks</em></p>\n</blockquote>\n<p>As the agentic troubleshooting capabilities of Azure Copilot continue to evolve, additional service specific skills and capabilities will be added to support a broader range of operational scenarios across Azure services through the same conversational experience.</p>\n<h2>Grounded in Azure context, with customers in control</h2>\n<p>Azure Copilot Troubleshooting Agent uses the resource information and supported diagnostics available for the affected resource while respecting your identity and Azure role based access control (RBAC).</p>\n<p>The agent explains the information behind its findings and recommends actions for review, allowing you to remain in control of remediation actions. Diagnostic depth varies by service, resource type, and scenario, but the goal remains consistent: helping you investigate, diagnose, and resolve operational issues more effectively using the context already available within your Azure environment.</p>\n<p>When additional assistance is needed, Azure Support remains available, but you can begin those engagements with a richer understanding of the issue, its likely causes, and potential remediation options.</p>\n<h2>Available at no additional cost</h2>\n<p>Troubleshooting Agent in Azure Copilot is available at no additional cost. There is no separate license or per-query charge, and existing Azure Support plans remain unchanged. Standard charges for the Azure resources continue to apply.</p>\n<h2>Get started</h2>\n<p>Open&nbsp;Azure Copilot and select Troubleshooting Agent&nbsp;in the <a class=\"lia-external-url\" href=\"https://portal.azure.com/\" target=\"_blank\">Azure portal</a> or go to&nbsp;Support + Troubleshooting, then describe the issue you are experiencing. Include the affected resource or subscription if it is not already clear from your current context.</p>\n<p>To get started, here are some prompt suggestions: <em>\"Why did my virtual machine restart unexpectedly?\", \"Investigate why my AKS deployment is failing.\", \"Why can't I connect to this resource?\", \"What recent platform issues have affected this resource?\", \"Check whether this resource has active errors or configuration issues.\"</em></p>\n<p>Troubleshooting Agent will use the supported resource diagnostics available for the investigation, explain what it finds, and recommend next steps.</p>\n<h2>Looking ahead</h2>\n<p>Connected cloud environments need a more intelligent approach to operations. As part of our broader vision for agentic cloud operations, Azure Copilot is your starting point when you need to understand, troubleshoot, and take action across your Azure environment. Troubleshooting Agent is an important step in that journey. Based on available context and diagnostics, we help you move from symptoms to informed next steps faster.</p>"
  "bb8e9d1e43b4809810efdbebe41c7bcb":
    "id": "bb8e9d1e43b4809810efdbebe41c7bcb"
    "title": "How Azure uses AI to turn feedback into improved customer experience"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/how-azure-uses-ai-to-turn-feedback-into-improved-customer/ba-p/4552810"
    "published": "2026-09-10 11:27:37"
    "fetched": "2026-09-11 00:19:40"
    "summary": "<p><span><span><strong>Authors: </strong><a class=\"lia-mention lia-mention-user\" href=\"\">ebhattad​</a><strong>, </strong><a class=\"lia-mention lia-mention-user\" href=\"\">jenniferjhan​</a><strong>, </strong><a class=\"lia-mention lia-mention-user\" href=\"\">lakshminarasimha​</a><strong>, </strong><a class=\"lia-mention lia-mention-user\" href=\"\">bharadwajr​</a><strong>&nbsp;</strong></span></span></p>\n<h3><span><span>The Challenge: Synthesizing fragmented feedback signals, to improve Azure's experience quality at scale</span></span></h3>\n<p><span>Customers experience products and services end to end, but product&nbsp;experiences&nbsp;are often structured around individual service.&nbsp;One&nbsp;team may&nbsp;only&nbsp;know its top issues, while&nbsp;another may see only its own slice of&nbsp;experience.&nbsp;&nbsp;That structure&nbsp;makes&nbsp;it difficult to&nbsp;identify&nbsp;cross-cutting friction across the broader&nbsp;product&nbsp;experience.</span><span>&nbsp;</span></p>\n<p><span>The&nbsp;feedback&nbsp;signals themselves&nbsp;are&nbsp;also fragmented. Customers share feedback through in-product surveys, support cases, field conversations, and social channels. Most product teams&nbsp;can&nbsp;see only part of that picture, making it hard to distinguish&nbsp;isolated&nbsp;comments&nbsp;from meaningful trends,&nbsp;understand which issues were having the greatest impact, and&nbsp;avoid missing&nbsp;critical feedback.</span><span>&nbsp;</span></p>\n<p><span>For the Azure&nbsp;team,&nbsp;the challenges of&nbsp;fragmentation&nbsp;were amplified&nbsp;by scale.&nbsp;The&nbsp;team processed&nbsp;roughly 10,000&nbsp;to 15,000 customer feedback reports each&nbsp;month, and&nbsp;synthesizing that feedback required&nbsp;80 to&nbsp;100 hours&nbsp;of expert analysis.&nbsp;&nbsp;Additional&nbsp;effort was needed&nbsp;to translate findings into consistent engineering&nbsp;work&nbsp;items.&nbsp;As feedback&nbsp;volume&nbsp;grew,&nbsp;manual analysis&nbsp;became increasingly&nbsp;unsustainable&nbsp;creating&nbsp;delays in identifying and addressing customer priorities.</span><span>&nbsp;</span></p>\n<p><span>Compounding&nbsp;the challenge was the absence of an&nbsp;effective&nbsp;feedback loop&nbsp;to measure the impact of&nbsp;quality improvements.&nbsp;Teams struggled to&nbsp;justify&nbsp;investments in quality over&nbsp;new features&nbsp;because the return on those investments was difficult to quantify.&nbsp;The absence of a closed-loop measurement system made it difficult to consistently assess the&nbsp;customer&nbsp;impact of quality improvements.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>The team needed a system that could&nbsp;operate&nbsp;across organizational boundaries and across the product development lifecycle:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Identify&nbsp;the&nbsp;most&nbsp;critical&nbsp;customer issues across&nbsp;fragmented&nbsp;feedback channels and product areas.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Convert&nbsp;those insights into&nbsp;actionable&nbsp;engineering work,&nbsp;help teams&nbsp;address&nbsp;issues&nbsp;effectively, and&nbsp;measure outcomes&nbsp;to close the loop.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>The&nbsp;solution&nbsp;needed&nbsp;to preserve team-specific context,&nbsp;maintain&nbsp;auditability,&nbsp;continuously&nbsp;improve through feedback, and keep human experts in control of decisions that require judgment.&nbsp;To address these challenges, Microsoft launched the Great Experiences Matter (GEM)&nbsp;initiative.&nbsp;GEM is designed to analyze feedback signals in aggregate,&nbsp;with access controls and privacy safeguards designed to limit exposure&nbsp;of&nbsp;customer-identifiable information while helping teams&nbsp;identify&nbsp;patterns across channels.</span><span>&nbsp;</span></p>\n<h3><span><span>The Solution: an agentic feedback-to-fix loop with humans in control</span></span><span>&nbsp;</span></h3>\n<p><span>GEM created an AI-enabled&nbsp;feedback-to-fix&nbsp;workflow that connects customer listening, engineering action, and&nbsp;impact measurement across the product development lifecycle. The workflow uses&nbsp;Microsoft&nbsp;Foundry,&nbsp;Azure Data Explorer, Microsoft&nbsp;Fabric, Azure DevOps, and a set of custom agents to transform large volumes of qualitative feedback into prioritized insights and actionable&nbsp;engineering&nbsp;work.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<pre><span>Fig 1. GEM AI-enabled automation workflow</span><span>&nbsp;</span></pre>\n<p>&nbsp;</p>\n<p><span>The&nbsp;system closes&nbsp;the loop through&nbsp;two&nbsp;connected motions.</span><span>&nbsp;</span></p>\n<p><span><strong>Find</strong>.</span><span>&nbsp;Agentic workflows remove noise and duplicate&nbsp;reports, assess relevance and actionability,&nbsp;classify&nbsp;feedback against known issues from UX research,&nbsp;cluster related&nbsp;issues, and&nbsp;surface&nbsp;likely&nbsp;root&nbsp;causes.&nbsp;GEM&nbsp;builds on&nbsp;years of deep end-to-end UX research that has&nbsp;identified&nbsp;systemic friction across customer journeys and product boundaries. By continuously triangulating GEM signals with ongoing research, we combine broad, scalable listening with deep human insight to inform a more cohesive Azure experience.</span><span>&nbsp;</span></p>\n<p><span>The results&nbsp;are surfaced&nbsp;through global&nbsp;scorecards&nbsp;for cross-cutting Azure issues and vertical scorecards tailored to individual product teams.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<pre><span>Fig 2.&nbsp;GEM Global scorecard of top issues&nbsp;with Azure, data has been fictionalized to protect intellectual property</span><span>&nbsp;</span></pre>\n<p>&nbsp;</p>\n<p><span><strong>Fix</strong>.</span><span>&nbsp;The workflow creates Azure DevOps work items with the customer&nbsp;context,&nbsp;likely reproduction&nbsp;steps, recommended next actions, and an auditable&nbsp;trace of the&nbsp;supporting&nbsp;analysis.&nbsp;To date,&nbsp;42% of the&nbsp;identified&nbsp;issues have been addressed&nbsp;through engineering action.&nbsp;The team is also extending&nbsp;an AI-assisted&nbsp;engineering&nbsp;workflow,&nbsp;using GitHub Copilot&nbsp;cloud agent,&nbsp;that can generate proposed fixes&nbsp;for&nbsp;straightforward issues. Engineers&nbsp;remain&nbsp;responsible for reviewing, refining, approving, and&nbsp;shipping any changes.</span><span>&nbsp;</span></p>\n<p><span>The architecture is designed for inspection rather than blind automation.&nbsp;The recommendations&nbsp;include an&nbsp;auditable evidence trail&nbsp;allowing&nbsp;reviewers&nbsp;to&nbsp;inspect the&nbsp;source&nbsp;feedback, classifications, supporting references, confidence indicators, and recommendation&nbsp;actions.</span><span>&nbsp;</span></p>\n<p><span>Human&nbsp;expertise&nbsp;enters the system at several points. Researchers shape the&nbsp;issue&nbsp;taxonomies and qualitative grounding. Product teams define&nbsp;ownership boundaries,&nbsp;business priorities,&nbsp;domain-specific&nbsp;vocabulary, and&nbsp;trusted&nbsp;sources&nbsp;that guide agent analysis. Engineers review and act on resulting work items, while leaders use scorecards to&nbsp;inform&nbsp;investment decisions.</span><span>&nbsp;</span></p>\n<p><span>This context is captured in configuration files that&nbsp;evolve alongside&nbsp;the&nbsp;products&nbsp;they support.&nbsp;Teams&nbsp;can add new issue categories, refine keywords, clarify ownership boundaries, or&nbsp;identify&nbsp;trusted research&nbsp;sources. The next analysis&nbsp;cycle&nbsp;automatically&nbsp;incorporates&nbsp;&nbsp;the&nbsp;updated context without requiring&nbsp;changes to the underlying agents.</span><span>&nbsp;</span></p>\n<p><span>That design creates a \"feedback&nbsp;loop&nbsp;for&nbsp;the feedback&nbsp;loop\".&nbsp;Teams review the root-cause analyses and work-item quality,&nbsp;identify&nbsp;gaps, and refine their configurations.&nbsp;This&nbsp;enables&nbsp;teams to continuously&nbsp;embed domain&nbsp;expertise&nbsp;into the workflow, improving how&nbsp;feedback&nbsp;is&nbsp;interpreted and prioritized&nbsp;without requiring changes to the underlying infrastructure.&nbsp;Their input improves&nbsp;subsequent&nbsp;runs, helping the system become more precise while preserving local product knowledge.</span>&nbsp;<br />&nbsp;<br /><span>The agent also&nbsp;maintains&nbsp;access to reports from&nbsp;previous&nbsp;runs and uses tools such as Web IQ and MCP servers to assess whether previously&nbsp;identified&nbsp;issues are improving, still require attention, or can be confidently closed.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p><span>&nbsp;</span></p>\n<pre><span>Fig 3. Example of the vertical feedback agent reasoning through customer feedback to find new work items</span><span>&nbsp;</span></pre>\n<p><span>One&nbsp;demonstrated&nbsp;example surfaced customer reports that a networking tool lacked IPv6 validation and support. The workflow generated an engineering work item&nbsp;describing the issue,&nbsp;customer impact,&nbsp;likely&nbsp;reproduction&nbsp;path, and recommended&nbsp;actions. The networking team reproduced the issue,&nbsp;validated&nbsp;the finding, and added it to its backlog.</span><span>&nbsp;</span></p>\n<p><span>The goal is not to remove people from the process. Agents&nbsp;assume much of&nbsp;the cognitive load&nbsp;associated with&nbsp;sorting, clustering, tracing, and&nbsp;drafting,&nbsp;allowing experts&nbsp;to&nbsp;focus on judgment, prioritization, and implementation.&nbsp;Teams remain accountable for what is fixed, what is funded, and what is allowed to ship.</span><span>&nbsp;</span></p>\n<h3><span><span>The Impact: measurable experience gains at Microsoft production scale</span></span><span>&nbsp;</span></h3>\n<p><span>GEM began with manual interventions and is now scaling through AI-enabled workflows. The combined approach has produced measurable results across the Azure Portal and individual product experiences:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>The workflow&nbsp;aggregates and&nbsp;analyzes&nbsp;approximately 10,000&nbsp;to 15,000 feedback reports each month across in-product, support, and social channels.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Automated analysis&nbsp;reduced manual synthesis time by&nbsp;over&nbsp;95&nbsp;percent, turning a process that required&nbsp;110&nbsp;to&nbsp;160&nbsp;hours each month into a workflow that runs in under&nbsp;60 minutes.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Between October 2025 and April 2026, Azure Portal feedback rates declined by 30%.&nbsp;During that same period, GEM helped teams&nbsp;identify&nbsp;and prioritize&nbsp;experience improvements, creating a clearer link between customer feedback, engineering action, and outcome measurement.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>Service-level outcomes&nbsp;also&nbsp;demonstrate&nbsp;how better signals can&nbsp;drive&nbsp;business impact.&nbsp;For example, improvements to VM Connect experiences&nbsp;reduced&nbsp;overall&nbsp;Core Compute support volume by&nbsp;1-2%&nbsp;per month, resulting in proportionate cost savings.&nbsp;The Azure Growth team increased subscription conversion by 9.1 percent after prioritizing issues highlighted through GEM.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span>The value goes beyond speed.&nbsp;Leaders gain a more consistent basis for prioritization, and engineering teams receive work that is already connected to customer evidence&nbsp;and impact signals.</span><span>&nbsp;</span></li>\n</ul>\n<p><span>Most importantly, every completed cycle creates new&nbsp;learning.&nbsp;Teams&nbsp;can measure&nbsp;changes in customer&nbsp;feedback and support volumes&nbsp;following improvements,&nbsp;incorporate&nbsp;partner input&nbsp;into future&nbsp;analyses, and&nbsp;continuously refine both the system and&nbsp;the products it helps improve.&nbsp;</span><span>&nbsp;</span></p>\n<h3><span><span>Key learnings and transferable practices</span></span><span>&nbsp;</span></h3>\n<p><span>The GEM experience offers several lessons for teams building agentic systems around complex, qualitative business processes:</span><span>&nbsp;</span></p>\n<ol>\n<li><strong><span>Start with&nbsp;real&nbsp;problems, not AI</span></strong><span> - </span>Value comes from understanding the genuine business needs and applying AI where it is demonstrably better than existing approaches.&nbsp;&nbsp;Applying AI without a clearly defined problem often adds complexity without delivering meaningful value.&nbsp;<span style=\"color: rgb(30, 30, 30);\"> </span></li>\n<li><strong>Design for the end-to-end workflow</strong><span style=\"color: rgb(30, 30, 30);\"> -</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;Value comes from connecting&nbsp;insights to the broader business process,&nbsp;including grounding&nbsp;in prior knowledge,&nbsp;prioritization, engineering action, post-fix&nbsp;measurement&nbsp;and reporting.&nbsp;Standalone&nbsp;AI output creates limited value, while an integrated workflow drives outcomes.</span><span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><strong><span>Design for human judgment and accountability</span></strong><span> - </span>Agents can reduce toil and cognitive load, but researchers, product managers, engineers, and leaders&nbsp;remain&nbsp;responsible for&nbsp;validating&nbsp;insights and determining&nbsp;appropriate actions.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><strong><span>Ground agents in the knowledge of the teams they serve</span></strong><span> - </span>Shared models&nbsp;require&nbsp;local context. Editable configuration files allow teams to define ownership,&nbsp;business&nbsp;priorities,&nbsp;releases,&nbsp;examples, and trusted sources without&nbsp;modifying&nbsp;underlying agents.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><strong><span>Build observability and feedback mechanisms into the agentic system itself</span></strong><span> - </span>Making analysis inspectable through&nbsp;reasoning traces, source context, and recommendations enables experts to&nbsp;identify&nbsp;gaps, improve outputs, and build trust over time.&nbsp;Build feedback mechanisms directly into the flow of work, making it effortless for users to provide input on the system.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><strong><span>Tailor outputs to the people making decisions</span></strong><span> - </span>Executives need trends and investment signals. Researchers need evidence and themes. Engineers need reproducible, actionable work.&nbsp;Effective systems deliver the right information to the right audience.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n<li><strong><span>Start small and iterate quickly</span></strong><span> - </span>The AI&nbsp;landscape continues to evolve rapidly. Begin with a well-defined problem, measure outcomes, learn from feedback, and iterate as capabilities mature.<span style=\"color: rgb(30, 30, 30);\">&nbsp;</span></li>\n</ol>\n<h3><span><span>Looking forward</span></span><span>&nbsp;</span></h3>\n<p><span>GEM&nbsp;continues&nbsp;to scale across the Azure Portal ecosystem.&nbsp;In addition to the&nbsp;global scorecard,&nbsp;vertical scorecards are&nbsp;now&nbsp;live with seven teams, expanding to the top 20&nbsp;portal&nbsp;extensions&nbsp;representing&nbsp;more than 80%&nbsp;of&nbsp;portal traffic and feedback,&nbsp;with longer-term plans to extend coverage across the entire ecosystem.</span><span>&nbsp;</span></p>\n<p><span>The roadmap includes expanded&nbsp;feedback&nbsp;ingestion, streamlined work-item tracking, AI-assisted remediation workflows, stronger evaluation, and a self-improving architecture. Proposed fixes would remain subject to engineer review, approval, and standard release controls before deployment.&nbsp;GEM is also&nbsp;developing&nbsp;AI-assisted&nbsp;pre-release governance&nbsp;workflows&nbsp;for production code&nbsp;that help&nbsp;identify&nbsp;potential quality issues during development.&nbsp;We will share more&nbsp;about these&nbsp;pre-release&nbsp;workflows&nbsp;in&nbsp;a&nbsp;future&nbsp;post.</span><span>&nbsp;</span></p>\n<p><span>New tools and models will&nbsp;continue to&nbsp;evolve, but the enduring principle&nbsp;remains&nbsp;the same:&nbsp;combine enterprise-scale automation with clear ownership, trusted grounding, and human control.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>For Microsoft, Customer Zero means&nbsp;deploying&nbsp;these systems in real production environments, learning from&nbsp;the complexities, and sharing those lessons&nbsp;broadly. GEM shows what becomes possible when AI does more than summarize feedback. It&nbsp;helps an organization listen, act,&nbsp;measure outcomes,&nbsp;and continuously&nbsp;learn&nbsp;at&nbsp;customer&nbsp;scale.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><em><span><span>Microsoft's Customer Zero blog series gives an insider view of how Microsoft builds and&nbsp;operates&nbsp;Microsoft using our trusted, enterprise-grade agentic platform. Learn best practices from our engineering teams through real-world lessons, architectural patterns, and operational strategies for building,&nbsp;operating, and scaling AI-powered systems across the organization.</span>&nbsp;</span></em></p>"
