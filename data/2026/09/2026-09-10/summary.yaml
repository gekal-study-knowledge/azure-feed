"overview": |
  この日は 9 件で、クラウド運用エージェントの一般提供、ゾーン冗長の設計指針、そしてソーシャルエンジニアリングの脅威情報が並びました。Azure Copilot の Troubleshooting Agent が一般提供となり、新規サービスのデプロイ、問題の切り分け、リソース正常性の評価、変更管理といった運用の場面で、より速く根拠のある判断を助ける組み込み機能として使えるようになりました。サービス更新では、VM / VMSS 向けの Azure Ephemeral OS Disk のフルキャッシュが一般提供となり、OS イメージ全体を VM のローカルストレージにキャッシュして、キャッシュ完了後はリモートストレージへの読み取りをなくせるようになりました。もう 1 つは Azure Storage の user-bound user delegation SAS の一般提供で、user delegation SAS の柔軟性と Entra ID による利用者バインドのアクセス制御を組み合わせられます。Azure ブログの設計論では、ゾーン冗長は「いくつのゾーンか」ではなく「各コンポーネントが 1 つの障害ドメインの喪失に耐えるのに何ゾーン必要か」で考えるべきで、サービス管理のゾーン冗長を使えるところでは使い、3 ゾーン設計は本当に第 3 の障害ドメインが要るコンポーネントに限る、という枠組みが示されました。ネットワークでは、ネットワーク対応の移行計画にネットワークインテリジェンスを組み込む方法が解説されています。セキュリティでは、パスキーをテーマにしたソーシャルエンジニアリングが ID とクラウドの侵害につながる手口 (MFA の永続化、Microsoft Graph を使った偵察、SharePoint / OneDrive / メールへのアクセス) と、クラウド上の Web アプリとサーバーレス基盤への脅威を MITRE ATT&CK に沿って整理する Cloud Web Applications Threat Matrix が公開されました。
