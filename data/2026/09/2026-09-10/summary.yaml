  - "脅威情報: パスキーをテーマにしたソーシャルエンジニアリングによる ID / クラウド侵害 (MFA 永続化、Graph 偵察)"
  - "脅威フレームワーク: クラウド Web アプリ / サーバーレスの脅威を MITRE ATT&CK に沿って整理する Cloud Web Applications Threat Matrix"
