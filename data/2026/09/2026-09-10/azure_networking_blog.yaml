    "title": "Adding network intelligence into a network-ready Azure migration plan"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/adding-network-intelligence-into-a-network-ready-azure-migration/ba-p/4554519"
    "published": "2026-09-10 03:01:43"
    "fetched": "2026-09-10 15:43:47"
    "summary": "<pre><span class=\"lia-text-color-21\"><em><strong>Sudha Mahajan, Partner PM Azure Networking, Vijay Mamtani, CVP Azure Networking | September 2026</strong></em></span></pre>\n<p><span class=\"lia-text-color-15\"><strong>Lift-and-shift succeeds when the network moves with the application&nbsp;</strong></span></p>\n<p><span>For many VMware customers, the immediate migration goal is practical: move workloads to Azure quickly, preserve application behavior and connectivity, reduce execution risk, keep it secure, and build a costed plan that leaders can approve. Compute and storage sizing are necessary, but it is not the whole migration plan. Applications depend on IP prefixes, network paths, security policies, load-balancing behavior, shared services, and connections to systems that may move at different times.</span><span>&nbsp;</span></p>\n<p><span>Azure Migrate is critical to making this work manageable. It provides the foundation for discovering the estate, assessing migration readiness, developing the business case, and translating collected evidence into a plan. With Network Planning, that foundation becomes network-aware, combining server inventory with insights into how application connectivity can be represented in Azure.</span></p>\n<p><span>&nbsp;</span></p>\n<p><strong><span class=\"lia-text-color-15\">Networking is the hidden critical path&nbsp;</span></strong></p>\n<p><span>Network planning often begins late. A team may group and size virtual machines, then assume the target network can be designed near cutover. That approach overlooks the dependencies that determine whether an application will function after migration.</span><span>&nbsp;</span></p>\n<p><span>The required information for networking is fragmented. Workload inventory may sit in vCenter; network constructs and flows may be reflected in NSX; policy intent may be distributed across firewalls; application delivery may depend on load balancers; address constraints may live in spreadsheets; and operational knowledge may be divided among application, infrastructure, security, and network teams. Each system provides part of the answer, but no single view naturally explains what an application needs in Azure.</span><span>&nbsp;</span></p>\n<p><span>Common mistakes follow - planning by individual servers rather than application, missing dependencies, carrying forward rules without understanding their intent, overlooking shared services, estimating compute while omitting network costs, or designing target topology before the source environment is fully understood. These gaps create additional analysis, redesign, stakeholder review iterations, and cutover uncertainty. Networking becomes the hidden critical path - not because teams lack expertise, but because the evidence needed for decisions is incomplete and disconnected.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><span class=\"lia-text-color-15\"><strong>Network planning bridges discovery and decisions&nbsp;</strong></span></p>\n<p><span>Network planning is designed to close that gap within the Azure Migrate. Its purpose is to turn discovered network evidence and customer migration intent into an actionable, Azure-oriented planning view.</span><span>&nbsp;</span></p>\n<p><span>Beginning September, Azure migrate enters public preview with network-aware assessment and networking incorporated into business-case and assessment functionality.</span><span>&nbsp;</span></p>\n<p><span>Visualize and validate source network resources:</span><span> Discovered VMware network information provides context for workload placement, connectivity, dependencies, and applicable destination constructs.</span><span>&nbsp;</span></p>\n<p><span>Azure-native recommendations:</span><span> Network Planning translates source findings into recommended Azure networking building blocks and guidance, including topology considerations (hub-and-spoke), security intent considerations (mapping on-prem firewall rules to NSG and Azure FW) and application delivery considerations (Application load balancing and WAF rules), instead of requiring customers to manually map every source construct.</span><span>&nbsp;</span></p>\n<p><span>Readiness and issue visibility:</span><span> Assessments surface network-related readiness considerations and planning issues that require attention before migration, allowing teams to separate straightforward moves from items needing design decisions or remediation.</span><span>&nbsp;</span></p>\n<p><span>Networking in the business case:</span><span> Network-cost estimates are included alongside the broader migration analysis, helping decision-makers evaluate a more complete cost picture.</span><span>&nbsp;</span></p>\n<p><span>Security-rule planning context:</span><span> Where source data supports it, translated security-rule information can help teams reason about security requirements and prepare for target policy design and validation.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><span class=\"lia-text-color-15\"><strong>FROM DISCOVERY TO A NETWORK-READY MIGRATION PLAN&nbsp;</strong></span></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><span>Discover</span>&nbsp;<br /><span>VMware estate</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Scope</span>&nbsp;<br /><span>Applications</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Assess</span>&nbsp;<br /><span>Readiness</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Recommend</span>&nbsp;<br /><span>Azure network</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Plan</span>&nbsp;<br /><span>Costs and migration</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /></colgroup></table></div>\n<p><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-15\"><strong>What changes for customers and partners&nbsp;</strong></span></p>\n<p><span>Network planning does not eliminate the need for engineering judgment or automate network design. Its value is a more structured starting point, grounded in discovered data and presented in the same Azure Migrate workflow used for assessment and business-case development.</span><span>&nbsp;</span></p>\n<p><span>Customers can bring application, network, security, and migration stakeholders to a shared planning view. They can identify missing information sooner, connect network requirements to migration groups, review readiness before cutover planning, and include network considerations in financial discussions. Partners can use the same evidence to guide workshops, validate assumptions, focus design effort on exceptions, and produce a plan that is easier for customer teams to review.</span><span>&nbsp;</span></p>\n<p><span>The result is a more practical migration conversation: not simply \"Which virtual machines can move?\" but \"What does this application require, what must be addressed, what Azure is the recommended network approach , and what should be included in the costed plan?\"</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><span class=\"lia-text-color-15\"><strong>Launch scope first, roadmap second&nbsp;</strong></span></p>\n<p><span>The August preview of network planning in Azure Migrate is intentionally focused on the lift-and-shift planning path. Items such as application modernization, third-party virtual appliances, advanced topologies, infrastructure-as-code generation, and IP-retention scenarios remain future roadmap areas. Keeping that boundary clear allows customers to evaluate the preview for what it delivers now while Microsoft continues to shape later capabilities from feedback.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><span class=\"lia-text-color-15\"><strong>Key takeaway&nbsp;</strong></span></p>\n<p><span>For customers preparing VMware lift-and-shift migrations, begin by enabling and validating discovery in Azure Migrate, then choose a representative application or migration group. Review its workloads, dependencies, source network context, readiness findings, Azure recommendations, and estimated network costs with the teams responsible for application ownership, networking, security, and migration execution.</span><span>&nbsp;</span></p>\n<p><span>For partners, use Network planning to anchor planning conversations in evidence rather than assumptions and to connect technical findings directly to the business case.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>A successful migration plan should describe more than where servers will run. It should explain how applications will remain connected, what issues must be resolved, what the target approach will require, and what it is expected to cost. Network planning brings those networks decisions into Azure Migrate - where lift-and-shift planning already begins.</span><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><span><span>For further reference- you can <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/migrate/review-network-assessment?view=migrate\" target=\"_blank\">refer to our website</a>.&nbsp;</span></span></p>"
