"overview": |
  この日は 3 件のサービス更新で、ランタイムと OS の更新、そして VS Code でのアプリ構築体験が話題でした。Azure Functions の PowerShell 7.6 サポートが一般提供となり、ローカルで PowerShell 7.6 を使ってアプリを開発し、Azure Functions のプランへデプロイできるようになりました。VS Code では、GitHub Copilot で Azure のクラウドアプリを構築する新しい方法がパブリックプレビューとして登場し、結果が読めない自由形式のチャットではなく、構造化され予測可能なワークフローによってアイデアからデプロイ済みの Azure アプリまで進められるガイド付き Copilot 体験が提供されます。Azure Sphere OS はバージョン 26.09 が Retail フィードで提供開始となり、今回は OS のみの更新で SDK の更新は含まれません。インターネットに接続されているデバイスはクラウドから更新版 OS を受け取ります。アプリ関連のブログでは、Azure Container Instances 上の仮想ノードが AKS の新しいコンピュート層として紹介されました。AKS がコントロールプレーンを自分で運用せずにマネージド Kubernetes を提供するのに対し、ACI 上の仮想ノードはさらに一歩進めて、Pod を Azure のサーバーレスコンテナ基盤で直接動かし、キャパシティ計画なしに伸縮できるようにします。
