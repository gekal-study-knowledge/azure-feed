"overview": |
  この日は 5 件で、AI 向けインフラとコンテナ実行基盤の話題が中心でした。インフラブログでは、Dapple と Azure を通じた特殊な GPU インフラへのアクセス拡大が取り上げられ、基盤モデルの学習・ファインチューニング・大規模推論・エージェントシステムといったエンタープライズ AI のワークロードが規模と複雑さを増すなかで、それを支えるインフラが根本的な転換期にあるとしています。アプリ関連では、Azure Container Instances 上の仮想ノードが AKS の新しいコンピュートレイヤーとして紹介されました。AKS はコントロールプレーンを自前で運用せずにフルの Kubernetes API を使えるマネージド Kubernetes ですが、ACI 上の仮想ノードはさらに一歩進めて、Pod を Azure のサーバーレスコンテナ基盤で直接実行し、キャパシティプランニングもマシンの待ち時間もなく弾力性を得られます。サービス更新では、Azure Functions の PowerShell 7.6 サポートが一般提供となり、ローカルで PowerShell 7.6 のアプリを開発して Azure Functions プランへデプロイできるようになりました。VS Code では、GitHub Copilot で Azure アプリを構築するガイド付き体験がパブリックプレビューとなり、自由形式のチャットではなく構造化された予測可能なワークフローでアイデアからデプロイ済みの Azure アプリまで導きます。あわせて、Azure Sphere OS バージョン 26.09 が Retail フィードで提供開始となりました。今回は OS のみの更新で SDK の更新はなく、インターネットに接続されたデバイスはクラウドから自動で受け取ります。
