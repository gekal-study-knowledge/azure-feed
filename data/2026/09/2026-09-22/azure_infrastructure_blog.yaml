    "title": "Expanding access to specialized GPU infrastructure through Dapple and Azure"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/expanding-access-to-specialized-gpu-infrastructure-through/ba-p/4558663"
    "published": "2026-09-22 23:53:54"
    "fetched": "2026-09-23 11:02:23"
    "summary": "<p>Enterprise AI has entered a new phase. For much of the past decade, the challenge was building enough compute for machine learning. Today, organizations need platforms for foundation model training, fine-tuning, large-scale inference, agentic systems, and enterprise AI. As these workloads grow in scale and sophistication, the infrastructure supporting them is undergoing a fundamental transformation.</p>\n<p>The defining characteristic of modern AI infrastructure is no longer compute alone. It is topology. Training state-of-the-art AI models requires coordinated communication across hundreds or thousands of accelerators. Performance increasingly depends on how GPUs are interconnected, how data moves across the network fabric, and how efficiently distributed systems synchronize at scale—making network architecture as critical as compute performance.</p>\n<p>This shift is driving purpose-built AI infrastructure built around tightly coupled GPU fabrics, accelerated networking back-end interconnects, specialized storage architectures, and operational models that treat physical topology as a first-class concern. The challenge is turning this infrastructure into AI production without creating a separate operational domain or adding complexity for platform teams, application developers, and infrastructure operators.</p>\n<h3><strong>A new approach to scaling purpose-built AI infrastructure&nbsp;</strong></h3>\n<p>Microsoft is expanding access to purpose-built GPU capacity through infrastructure partners, including <a href=\"https://dapple.co/\" rel=\"noopener\" target=\"_blank\">Dapple</a>. Customers can use this specialized infrastructure within the Azure environment they already rely on to operate and govern their workloads.</p>\n<p>Through our collaboration, Dapple’s dedicated, topology-aware GPU infrastructure (<a href=\"https://marketplace.microsoft.com/en-us/product/saas/dappleie.d694ea44-9949-4e51-bd8d-099e92750f55?tab=overview\" rel=\"noopener\" target=\"_blank\">Dapple Private AI Cloud | Microsoft Marketplace</a>) is integrated into an Azure-native operating model that preserves Azure governance, security, and operational consistency. This model for purpose-built AI infrastructure can benefit any organization running compute-intensive AI workloads, including large-scale pre-training, fine-tuning, and distributed inference.</p>\n<h3><strong>Why purpose-built AI infrastructure matters</strong></h3>\n<p>AI workloads place demands on infrastructure that differ fundamentally from traditional enterprise applications. Conventional cloud architectures support a broad range of workloads across diverse infrastructure pools. Large-scale AI training environments, by contrast, depend on highly deterministic infrastructure characteristics, including GPU proximity, network topology, bandwidth consistency, and low-latency communication across thousands of accelerators. As model sizes continue to grow, the efficiency of the underlying GPU fabric becomes a critical determinant of training performance, infrastructure utilization, and overall time-to-results. For this reason, many AI deployments are increasingly built around purpose-designed GPU clusters featuring:</p>\n<ul>\n<li>Fixed infrastructure topology</li>\n<li>Dedicated InfiniBand fabrics</li>\n<li>High-bandwidth, low-latency communication paths</li>\n<li>Topology-optimized storage architectures</li>\n<li>Rack-scale and cluster-scale operational boundaries</li>\n</ul>\n<p>These systems are designed as integrated AI platforms rather than collections of independent compute nodes. Purpose-built GPU infrastructure is organized around validated cluster blocks: groups of compute, network, and related resources managed as a single topology, readiness, and maintenance boundary within InfiniBand fabric domains. Kubernetes nodes remain workload-scheduling objects, while cluster blocks represent the infrastructure unit on which distributed-job performance and availability depend.</p>\n<p>&nbsp;</p>\n<img /><strong>Figure 1: Topology-aware AI infrastructure</strong>\n<p>Figure 1 highlights an important distinction between traditional cloud infrastructure and modern AI systems. In conventional environments, compute resources are often treated as interchangeable units. Distributed AI workloads operate differently. GPU placement, rack boundaries, InfiniBand connectivity, and cluster block relationships can directly influence training throughput, communication efficiency, and overall job completion time. Physical topology therefore becomes a first-class operational consideration. The scheduler must account not only for resource availability, but also for how GPUs, racks, fabric domains, and cluster blocks relate to one another.</p>\n<h3><strong>Extending Azure beyond traditional cloud boundaries</strong></h3>\n<p>Addressing this challenge requires more than connecting specialized AI infrastructure to Azure. Purpose-built infrastructure must operate as a natural extension of the Azure environment, with the governance, security, and operational experience customers already use. This is where Azure and enterprise AI clouds such as Dapple are taking a different approach. Rather than treating large-scale GPU clusters as isolated infrastructure islands, the architecture extends the Azure operational model into dedicated AI environments. Customers can continue using familiar Azure governance frameworks, security models, and operational tools while leveraging infrastructure specifically optimized for large-scale AI workloads.</p>\n<p>The result is an architecture that combines two complementary capabilities:</p>\n<ul>\n<li>Purpose-built AI infrastructure optimized for topology-aware GPU workloads</li>\n<li>An Azure-native operational experience that preserves governance, security, and lifecycle consistency</li>\n</ul>\n<p>This model enables organizations to focus on AI innovation without creating a separate operational domain for their most demanding AI infrastructure.</p>\n<h3><strong>The role of Azure Kubernetes Service as the operational control plane</strong></h3>\n<p>As AI infrastructure evolves, the role of Kubernetes is evolving alongside it. Kubernetes has become the dominant platform for orchestrating cloud-native applications, AI services, and distributed workloads. Increasingly, it is also becoming the operational abstraction layer that enables organizations to manage heterogeneous infrastructure through a consistent interface. Azure Kubernetes Service (AKS) plays a critical role in this evolution. In the Azure and Dapple architecture, AKS serves as the primary operational control plane for AI workloads running on purpose-built GPU infrastructure. The physical infrastructure remains optimized around the realities of large-scale AI systems, including GPU topology, InfiniBand fabrics, hardware maintenance domains, and infrastructure lifecycle management.</p>\n<p>At the same time, platform teams continue to interact through familiar Kubernetes constructs for workload deployment, scheduling policies, governance, and lifecycle management. Organizations gain access to infrastructure designed specifically for modern AI workloads while preserving the operational consistency of a Kubernetes-based platform.</p>\n<p>In practice, enterprises rarely operate a single orchestrator. Kubernetes provides the common substrate, but the layers above it differ by team: batch schedulers for large training runs, workflow engines for data and fine-tuning pipelines, and internal control planes built around a specific operating model. Many organizations run several of these concurrently. For this reason, orchestration is best treated as a customer-owned concern. The infrastructure layer remains responsible for presenting consistent topology, readiness, and lifecycle semantics to whichever orchestrators an organization already operates.</p>\n<h3><strong>Extending Kubernetes into topology-aware infrastructure</strong></h3>\n<p>While Kubernetes excels at abstracting infrastructure, large-scale AI systems frequently require orchestration platforms that understand physical topology, maintenance boundaries, network fabrics, and hardware relationships. Simply exposing GPUs to a scheduler is no longer sufficient. Infrastructure operations must account for cluster blocks, fabric domains, rack boundaries, node recovery workflows, and physical lifecycle management activities that do not naturally exist within traditional Kubernetes environments.</p>\n<p>To bridge this challenge, Azure and Dapple are collaborating on an architecture that extends Kubernetes operations into topology-aware AI infrastructure while maintaining a clear separation between workload intent and infrastructure intent. Within this model, AKS remains the authoritative control plane for Kubernetes operations. Platform teams continue to leverage:</p>\n<ul>\n<li>Kubernetes APIs</li>\n<li>GitOps workflows</li>\n<li>Policy management</li>\n<li>Application lifecycle operations</li>\n<li>Multi-cluster governance</li>\n<li>AI workload orchestration</li>\n</ul>\n<p>At the infrastructure layer, Dapple maintains awareness of:</p>\n<ul>\n<li>Cluster-block composition</li>\n<li>GPU fabric topology</li>\n<li>Network-domain relationships</li>\n<li>Hardware lifecycle operations</li>\n<li>Infrastructure maintenance events</li>\n<li>Recovery and repave workflows</li>\n</ul>\n<p>The Dapple Operator serves as the integration layer between these domains. Rather than exposing infrastructure complexity directly to platform teams, the operator translates Azure-native operational intent into topology-aware infrastructure actions while synchronizing infrastructure state back into the Kubernetes environment. When hardware maintenance, node replacement, cluster recovery, or lifecycle events occur, the operator coordinates state transitions across both layers, helping ensure that infrastructure operations and workload operations remain aligned.</p>\n<p>&nbsp;</p>\n<img /><strong>Figure 2: AKS and Dapple control-plane architecture</strong>\n<p>FlexNode connects external workers to AKS, while the Dapple Operator synchronizes cluster block identity, topology, fabric health, maintenance intent, and rejoin evidence with the underlying Dapple infrastructure. This architecture reflects an important design principle: AKS remains responsible for workload intent, while Dapple remains responsible for infrastructure intent. The result is a unified operational model that preserves the architectural characteristics of purpose-built AI infrastructure while enabling Azure-native operations.</p>\n<h3><strong>Learn more </strong></h3>\n<p><a href=\"https://marketplace.microsoft.com/en-us/product/saas/dappleie.d694ea44-9949-4e51-bd8d-099e92750f55?tab=overview\" rel=\"noopener\" target=\"_blank\">Dapple Private AI Cloud | Microsoft Marketplace</a></p>\n<p><a href=\"https://dapple.co/\" rel=\"noopener\" target=\"_blank\">Dapple | The Enterprise OS Cloud</a></p>\n<p>&nbsp;</p>"
