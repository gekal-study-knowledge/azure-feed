    "title": "Azure App Service is now a trigger destination for Azure Managed Connectors"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-app-service-is-now-a-trigger-destination-for-azure-managed/ba-p/4555785"
    "published": "2026-09-12 03:41:02"
    "fetched": "2026-09-13 06:44:46"
    "summary": "<p>Azure Managed Connectors, currently in public preview, now lets you choose <strong>Azure App Service as a trigger destination</strong>. Connector events can be delivered directly to applications running on App Service, including ASP.NET Core, Java, Node.js, and Python applications.</p>\n<p>This is a new capability in the <strong>Managed Connectors public preview</strong>. It is not the announcement of a separate App Service preview.</p>\n<h2>What's new</h2>\n<p>When you create a trigger in the Managed Connectors portal, <strong>App Service</strong> now appears as a first-class destination alongside Azure Functions and the generic HTTP endpoint option.</p>\n<p><img alt=\"App Service in the Azure Managed Connectors destination list\" src=\"https://raw.githubusercontent.com/Azure-Samples/app-service-connectors-net-e2e-email-users-teams/main/docs/images/app-service-destination.png\" /></p>\n<p>After selecting an existing App Service app, you configure:</p>\n<ul>\n<li>The application route that receives the event. New triggers default to <code>POST /api/webhook</code>, and the route can be edited.</li>\n<li>The Connector Namespace managed identity used to authenticate the callback.</li>\n<li>The Microsoft Entra audience expected by the receiving application.</li>\n</ul>\n<p>Managed Connectors then records the selected App Service resource, route, managed identity, and audience as part of the trigger configuration. You no longer need to select the generic HTTP destination and manually assemble the App Service callback URL.</p>\n<h2>What are managed connectors?</h2>\n<p>Managed connectors provide a consistent way for applications to integrate with services such as Office 365, SharePoint, Teams, Dataverse, and Salesforce. A Connector Namespace manages connections and connector operations so developers do not need to build a separate OAuth flow and service-specific client for every integration.</p>\n<p>Managed connectors support both directions:</p>\n<ul>\n<li><strong>Triggers</strong> deliver events to your application, such as a new Outlook email or a file added to SharePoint.</li>\n<li><strong>Actions</strong> let your application call operations such as posting a Teams message, flagging an email, or creating a list item.</li>\n</ul>\n<p>The App Service destination makes the trigger side a first-class option for existing web applications and APIs.</p>\n<h2>How it works</h2>\n<ol>\n<li>In the Managed Connectors portal, create a trigger and select <strong>App Service</strong> as its destination.</li>\n<li>Select the web app, callback route, Connector Namespace managed identity, and Microsoft Entra audience.</li>\n<li>When the source event occurs, Managed Connectors requests a token using the selected managed identity and sends the event to the App Service route.</li>\n<li>App Service built-in authentication validates the token before the request reaches application code.</li>\n<li>The application processes the event and can use Managed Connectors actions to continue the workflow.</li>\n</ol>\n<p>The callback is an ordinary authenticated HTTP request, so the application can use its normal framework, routing, dependency injection, logging, monitoring, and deployment practices.</p>\n<h2>Configure receiving-app authentication</h2>\n<p>The App Service destination configures the <strong>Managed Connectors side</strong> of the callback. The receiving application must still be configured to trust it.</p>\n<p>The reference sample uses App Service built-in authentication, also known as Easy Auth, with:</p>\n<ul>\n<li>A Microsoft Entra application that identifies the receiving application and its audience.</li>\n<li>A secretless federated credential configuration.</li>\n<li>The Connector Namespace managed identity pinned as an allowed principal.</li>\n<li>Authentication required for requests reaching the application.</li>\n</ul>\n<p>This configuration rejects unauthenticated requests and allows callbacks carrying the expected managed-identity token. The Managed Connectors trigger wizard does not currently create or update the App Service authentication configuration automatically.</p>\n<h2>Try the end-to-end sample</h2>\n<p>The <a href=\"https://github.com/Azure-Samples/app-service-connectors-net-e2e-email-users-teams\" rel=\"noopener\" target=\"_blank\">Managed Connectors on Azure App Service email-triage sample</a> demonstrates a complete workflow:</p>\n<ol>\n<li>An Office 365 Outlook trigger delivers a new email to an ASP.NET Core application on App Service.</li>\n<li>App Service built-in authentication validates the managed-identity callback.</li>\n<li>The application classifies the message and enriches the sender through the Office 365 Users connector.</li>\n<li>Important mail produces a Microsoft Teams triage card.</li>\n<li>The application flags the source email in Outlook.</li>\n</ol>\n<p>The repository includes the application, Bicep infrastructure, App Service authentication configuration, Connector Namespace connections, and an Azure Developer CLI deployment flow.</p>\n<p>We validated the complete workflow end to end: the authenticated callback reached <code>POST /api/webhook</code>, the application processed the event, a Teams card was posted, and the source Outlook message was flagged.</p>\n<h2>Current limitations</h2>\n<ul>\n<li>The capability is configured through the <strong>Managed Connectors portal</strong>, not the App Service portal.</li>\n<li>The wizard configures the Managed Connectors trigger but does not configure App Service built-in authentication on the selected web app.</li>\n<li>The current sample authentication setup requires a Microsoft Entra application, audience configuration, federated credential, and allowed-principal configuration.</li>\n<li>Depending on the application's Easy Auth configuration, authentication can apply to the whole application rather than only the connector callback route.</li>\n<li>The reference sample validates one push-trigger scenario; it is not a compatibility statement for every connector and operation.</li>\n</ul>\n<h2>What's next</h2>\n<p>The first-class App Service destination removes the generic callback URL step and provides an App Service-aware trigger experience in Azure Managed Connectors.</p>\n<p>We are also exploring ways to simplify receiving-side authentication so applications can establish connector-scoped trust without manually assembling the App Service authentication configuration.</p>\n<p>Try the <a href=\"https://github.com/Azure-Samples/app-service-connectors-net-e2e-email-users-teams\" rel=\"noopener\" target=\"_blank\">reference sample</a> and share feedback on the connectors and App Service scenarios you want to use.</p>"
