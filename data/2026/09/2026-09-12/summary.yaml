"overview": |
  この日は 3 件で、コネクタの新しいトリガー先、ファイル移行、ディストリビューションの廃止案内でした。Azure Managed Connectors (パブリックプレビュー) は、トリガー先として Azure App Service を選べるようになりました。ASP.NET Core・Java・Node.js・Python で動くアプリへ、コネクタのイベントを直接配信できます。これは Managed Connectors のプレビューに加わった新機能であり、App Service 自体の新しいプレビューを発表するものではありません。ファイル移行では、Azure Storage Mover がオンプレミスの SMB ファイル共有を Azure Files (SMB) へ移行するエージェントレス移行をパブリックプレビューでサポートし、移行エージェントをデプロイ・登録・保守することなく、Windows Server や NAS の共有からデータを Azure へ移せるようになりました。一方、Azure Kubernetes Service の Azure Linux with OS Guard は 2026 年 12 月 10 日にサポートを終了することが発表され、後継の Azure Container Linux (プレビュー) への移行が案内されています。同日以降は Azure Linux with OS Guard の新規作成ができなくなります。
