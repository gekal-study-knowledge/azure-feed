    "title": "Azure Red Hat OpenShift with hosted control planes now available in public preview"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-red-hat-openshift-with-hosted-control-planes-now-available/ba-p/4555997"
    "published": "2026-09-16 02:10:06"
    "fetched": "2026-09-16 08:14:46"
    "summary": "<p>Red Hat OpenShift momentum on Azure keeps building, driven by teams standardizing on Kubernetes for application modernization and, increasingly, by AI-enabled applications that need a consistent platform for the services around them. Azure Red Hat OpenShift gives those teams a jointly engineered, first-party Azure service, and today's announcement adds a new way to run it.</p>\n<p>Today we are excited to announce the public preview of Azure Red Hat OpenShift with hosted control planes. Hosted control planes is a new deployment option that runs the OpenShift control plane as a fully managed service in a Microsoft-managed Azure subscription, operated by Microsoft and Red Hat site reliability engineers (SREs), separate from the worker nodes that run your applications. This deployment option helps organizations accelerate application modernization, increase developer velocity, streamline operations, and strengthen security while maintaining the familiar OpenShift experience jointly engineered and supported by Microsoft and Red Hat. Azure Red Hat OpenShift with standard architecture remains fully supported and actively developed.</p>\n<p><a href=\"https://azure.microsoft.com/en-us/products/openshift\" rel=\"noopener\" target=\"_blank\">Azure Red Hat OpenShift</a> provides a unified platform for managing different workloads such as AI-enabled applications alongside VMs and containers, offloading ongoing infrastructure management to a team of Red Hat SREs, giving you a robust foundation to build, deploy and manage applications at scale.</p>\n<p>&nbsp;</p>\n<h1>One service, two places the control plane can live</h1>\n<p>The two deployment models compare like this:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; height: 173.333px; border-width: 1px;\"><tbody><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\"><strong>Dimension</strong></td><td style=\"height: 34.6667px;\"><strong>Control plane in your subscription</strong></td><td style=\"height: 34.6667px;\"><strong>Hosted control plane</strong></td></tr><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\"><strong>Control-plane location</strong></td><td style=\"height: 34.6667px;\">Your Azure subscription</td><td style=\"height: 34.6667px;\">Microsoft-managed Azure subscription</td></tr><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\"><strong>Who operates it</strong></td><td style=\"height: 34.6667px;\"><span>Red Hat SREs, in a single-tenant control plane.&nbsp;You pay for control-plane nodes on every cluster</span><span>&nbsp;</span></td><td style=\"height: 34.6667px;\"><span>Red Hat SREs, in a multi-tenant hosted control plane</span><span>&nbsp;</span></td></tr><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\"><strong>Upgrade coupling</strong></td><td style=\"height: 34.6667px;\">Control plane and workers move as one</td><td style=\"height: 34.6667px;\">Independent; Control plane can run on 2 minor versions ahead of worker node pools. Nodepools can also be on different versions with each other.</td></tr><tr style=\"height: 34.6667px;\"><td style=\"height: 34.6667px;\"><strong>Minimum cluster footprint</strong></td><td style=\"height: 34.6667px;\">3 Control-plane nodes plus 3 worker nodes</td><td style=\"height: 34.6667px;\">Two worker nodes</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<img />\n<p>Figure 1. Today the control plane runs in your subscription alongside your workers. With a hosted control plane, it moves into a Microsoft-managed Azure subscription operated by Red Hat SREs, and the two planes meet through a delegated VNet integration subnet.</p>\n<p>&nbsp;</p>\n<h1>Key benefits of Azure Red Hat Openshift with hosted control planes</h1>\n<p>Organizations can modernize at their own pace and run virtual machines, containers, and cloud-native applications on a single platform while extending existing applications for AI-ready workloads.</p>\n<p>Hosted control planes also help developers move faster. Clusters provision in minutes, and development and test environments can scale down during idle periods and scale back up when needed. This enables teams to accelerate experimentation, shorten testing cycles, and bring applications to production more quickly while optimizing infrastructure spend.</p>\n<p>To support growing multi-cluster environments, hosted control planes simplify platform operations and provide greater flexibility and control. Independent control plane and worker node lifecycles give organizations more control over application upgrade timing while Microsoft and Red Hat manage the underlying platform. Organizations can scale clusters across teams, environments, and regions, customize networking with bring-your-own container network interface (CNI), and maintain operational consistency without increasing management complexity.</p>\n<h1>What the Azure platform adds</h1>\n<p>What sets Azure Red Hat OpenShift apart is how deeply it integrates with the broader Azure platform, helping organizations simplify operations, accelerate adoption of OpenShift, and reduce the complexity of running cloud-native applications at scale.</p>\n<p>Customers gain access to Azure's global infrastructure, enterprise security capabilities, and rich portfolio of data and AI services, accelerating modernization and innovation without requiring changes to familiar OpenShift tools and workflows.</p>\n<p>For organizations already invested in Azure, Azure Red Hat OpenShift operates as a first-party Azure service that fits naturally into existing cloud operations. Clusters can be managed, governed, secured, and monitored using the same Azure tools, policies, and automation practices already used across the broader Azure estate. Customers also benefit from a unified commercial model, integrated billing, and Azure-native management experience, while Azure Red Hat OpenShift consumption contributes toward Microsoft Azure Consumption Commitment, helping maximize the value of existing cloud investments.</p>\n<p>Customers are already building on that foundation. <a href=\"https://azure.microsoft.com/en-us/blog/red-hat-summit-2026-platform-modernization-and-ai-on-azure-microsoft-red-hat-openshift/\" rel=\"noopener\" target=\"_blank\">Banco Bradesco</a>, one of the largest financial institutions in Latin America, runs its enterprise AI platform on Azure Red Hat OpenShift, using integration with Azure identity, security, and policy capabilities to unify governance across more than 200 AI initiatives in a highly regulated environment. <a href=\"https://www.microsoft.com/en/customers/story/26504-akkuro-by-topicus\" rel=\"noopener\" target=\"_blank\">Topicus</a> runs its Akkuro lending platform on Azure Red Hat OpenShift and deploys in Switzerland North to keep financial data in-country, using the same Azure-native controls to maintain a repeatable deployment model across regions. Both illustrate what the Azure platform adds: a consistent operating model, enterprise-grade security and compliance, and native access to Azure data and AI services on a service jointly operated by Microsoft and Red Hat.</p>\n<img />\n<p><em>Figure 2. The Azure platform around the service: Microsoft Entra ID managed and workload identities, a customer-managed key in Azure Key Vault for etcd encryption, Azure Monitor diagnostic settings for control-plane logs,&nbsp;</em><em>Customer Lockbox for Microsoft Azure for support-access approval, portal (upcoming), CLI, REST API and Bicep self-service, and native integration with Azure compute, database, analytics, and machine learning services.</em></p>\n<h1>Secure by design</h1>\n<p>Azure Red Hat OpenShift with hosted control planes is secure by design, helping you run sensitive and regulated workloads with confidence without adding operational complexity. By running the control plane in a Microsoft-managed subscription, the platform reduces infrastructure exposure while maintaining secure access to applications through managed ingress.</p>\n<p>Identity management is seamless. Cluster operators and applications use managed identities and workload identities that authenticate with short-lived, automatically rotated tokens, eliminating the need to manage service principals or long-lived credentials. Organizations can also integrate with their existing identity providers, preserving established authentication and access management practices.</p>\n<p>Azure-native protections help safeguard data and support compliance requirements. Data is encrypted by default with etcd encryption, with the option to use customer-managed keys through Azure Key Vault for additional control. Confidential and sandboxed containers provide additional protection for data in use, helping organizations address stringent security, data residency, and digital sovereignty requirements without deploying a separate cloud environment.</p>\n<p>The platform is backed by enterprise-grade compliance and support. Azure Red Hat OpenShift (with standard architecture) is pre-certified for HIPAA, FedRAMP, DoD IL4, PCI-DSS, ISO, and SOC standards, supported by joint Microsoft and Red Hat incident response. Customer Lockbox for Microsoft Azure adds another layer of control by requiring explicit customer approval before Microsoft support personnel can access cluster resources.</p>\n<h1>Get started now</h1>\n<p>Availability is expanding, with UK South, Canada Central, Australia East, Switzerland North, Brazil South, Central India, US East 2, and West Europe among the regions supported at public preview launch. &nbsp;The fastest way to get started is to create three resources: a cluster, a node pool, and an external authentication provider, using either the Azure CLI extension or a Bicep template. From there, deploy a single application using workload identity to see the full flow end to end, signing in with your existing identity provider, and an application reaching Azure services with no stored credentials. See the <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/openshift/intro-openshift\" target=\"_blank\">Azure Red Hat OpenShift documentation</a> for the current region list, supported versions, and the deployment reference, and tell us in the comments what you would like covered next.</p>\n<p><strong>What it costs</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"width: 100%; border-width: 1px;\"><tbody><tr><td><strong>Component</strong></td><td><strong>Price</strong></td><td><strong>Purchasing Options</strong></td></tr><tr><td>OpenShift license (per worker core)</td><td>$0.171 per hour per 4 worker vCPUs. The same flat rate applies to every VM series, size, and generation.</td><td>Pay-as-you-go, or a 1- or 3-year reservation on the OpenShift license (available at GA)</td></tr><tr><td>Azure infrastructure (worker VMs, storage, networking, plus control-plane nodes)</td><td>Billed separately at standard Azure rates for Linux VMs. Standard clusters are also billed for the control-plane deployment; clusters with a hosted control plane are not.</td><td>Pay-as-you-go, reservations, or Azure savings plan for compute</td></tr><tr><td>Cluster management (only applicable to Azure Red Openshift with hosted control planes)</td><td>A flat $0.25 per cluster per hour. Applies only to clusters with a hosted control plane.</td><td>Pay-as-you-go</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>A hosted control plane takes control-plane node cost off your bill and replaces it with a single, predictable cluster management fee.</p>\n<p><em>Pricing for hosted control planes is not yet reflected on the Azure Red Hat OpenShift pricing page; pricing calculator support is coming soon. Azure Red Hat OpenShift with hosted control planes is in public preview, and this pricing is preliminary and subject to change prior to general availability.</em></p>"
  "b3bc65e1b920392143c254a7337161ab":
    "id": "b3bc65e1b920392143c254a7337161ab"
    "title": "Introducing a Guided Copilot Experience for Building Azure Apps in VS Code"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/introducing-a-guided-copilot-experience-for-building-azure-apps/ba-p/4557120"
    "published": "2026-09-16 22:59:47"
    "fetched": "2026-09-17 08:19:23"
    "summary": "<p>Today we're previewing a new way to build cloud apps with GitHub Copilot in VS Code: a <strong>guided Copilot experience</strong>&nbsp;that takes you from idea to a deployed Azure app through a structured, predictable workflow instead of a free-form chat session that may or may not land where you need it to.</p>\n<p>&nbsp;</p>\n<p><strong>The problem: Copilot is powerful, but unpredictable</strong></p>\n<p>Ask Copilot to <em>\"build me a Node.js API on Azure Functions with a Postgres database\"</em> today, and you might get a working project, or you might not. Sometimes Copilot scaffolds the app but skips infrastructure. Sometimes it generates a deployment script that fails halfway through. Sometimes it forgets what you were building three prompts later.</p>\n<p>The underlying model is capable. The problem is the <em>shape</em>&nbsp;of the experience: an open-ended chat with no checkpoints, no guardrails, and no consistent path from <em>\"I have an idea\"</em> to <em>\"it's running in Azure.\"</em></p>\n<h1><strong>How it works</strong></h1>\n<p>The guided Copilot experience adds to that open-ended flow with three clear, explicit stages:</p>\n<p><strong>1. Project scaffolding:</strong>&nbsp;Describe your app in plain language. Copilot proposes an architecture and asks for anything that is missing (e.g., language, app type, Azure services) through simple forms and pickers, not more back-and-forth chat. You review and approve the plan before any code is written.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>2. Local development:</strong> Your project is scaffolded then Copilot checks for the runtimes, emulators, and tools you'll need and helps you install what's missing, so the project runs locally from the very first launch. Debug configurations are wired up automatically, so you can test and iterate on your app before it ever touches Azure.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>3. Deployment:</strong> Copilot shows the tools that will be used for deployment along with a summary of all resources that will be created and a cost estimate so you can be confident in what you're getting. Infrastructure files are created for your app to ensure a consistent and reproducible deployment environment for testing and staging before going to production. Deployment runs through the same reliable tooling used across Azure (az and azd), so if something goes wrong, you get a clear explanation and a concrete next step instead of a wall of CLI output.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Once your app is live, the guided experience doesn't disappear, Copilot retains context about your project's architecture, so coming back later to add a service or make a change picks up right where you left off. \U0001F389</p>\n<img />\n<h1><strong>What this means for how you work</strong></h1>\n<ul>\n<li><strong>Determinism over guesswork.</strong>&nbsp;The same input reliably produces the same kind of outcome, so no more wondering which \"mode\" Copilot is going to be in.</li>\n<li><strong>First try success.</strong>&nbsp;Projects are built to run and deploy on the first attempt, not after several rounds of manual repair.</li>\n<li><strong>Structure over chat walls.</strong> Decisions that matter such as architecture choices, missing configuration, and deployment targets are surfaced through real UI, so you're not parsing paragraphs of text to figure out what Copilot needs from you.</li>\n<li><strong>Stay in VS Code.</strong>&nbsp;The entire journey, from planning through deployment, happens without leaving your editor.</li>\n</ul>\n<h2><strong>What's in the initial preview</strong></h2>\n<p>The first version focuses on JavaScript and TypeScript projects, including web apps, Azure Functions, Container Apps, and Static Web Apps, with support for PostgreSQL, Azure Storage, Azure Key Vault, and Azure OpenAI. .NET and Python support are on the roadmap for a future release.</p>\n<p>Nothing about your existing Copilot workflows changes, the guided experience is an additional, opinionated path alongside the free form chat you already know, for when you want a reliable, structured way to go from zero to deployed.</p>\n<h2><strong>What's next</strong></h2>\n<p>This is an early look at a broader shift in how we think about AI-assisted development on Azure: less \"ask and hope,\" more structured collaboration with clear checkpoints and real UI where it counts. We're continuing to expand language support, refine the deployment experience, and incorporate feedback from developers using it in the wild.</p>\n<p>&nbsp;</p>\n<p>Install othe<a class=\"lia-external-url\" href=\"https://marketplace.visualstudio.com/items?itemName=ms-vscode.vscode-node-azure-pack\" rel=\"noopener\" target=\"_blank\"> Azure Tools extension pack</a> and open an empty folder to try the guided Copilot experience and let us know what you think. File issues or share feedback on the&nbsp;<a class=\"lia-external-url\" href=\"https://github.com/microsoft/vscode-azureresourcegroups/\" rel=\"noopener\" target=\"_blank\">GitHub repo</a>.</p>"
