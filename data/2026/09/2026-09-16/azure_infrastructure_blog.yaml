    "title": "Deploying Custom Images and Implementing CI/CD for Azure Virtual Machine Scale Sets"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/deploying-custom-images-and-implementing-ci-cd-for-azure-virtual/ba-p/4556902"
    "published": "2026-09-16 14:26:11"
    "fetched": "2026-09-17 05:31:15"
    "summary": "<p>Azure Virtual Machine Scale Sets (VMSS) are useful when an application needs to run across multiple virtual machines while automatically scaling based on demand. Instead of configuring every VM manually, we can create a standard VM image and use that image to provision identical VM instances.</p>\n<p>In this article, we'll walk through an example architecture where:</p>\n<ul>\n<li>We build a custom application image.</li>\n<li>The image is stored in <strong>Azure Compute Gallery</strong>.</li>\n<li>A VM Scale Set uses that image.</li>\n<li>Azure DevOps handles CI/CD.</li>\n<li>A new image version is deployed to the VM Scale Set through the pipeline.</li>\n</ul>\n<h2>1. What is Azure VM Scale Set?</h2>\n<p>An Azure Virtual Machine Scale Set allows you to create and manage a group of load-balanced VMs.</p>\n<p>For example:</p>\n<p>Internet | Azure Load Balancer | +---------+---------+ | | | VMSS-1 VMSS-2 VMSS-3 | | | +---------+---------+ | Application</p>\n<p>If traffic increases, VMSS can automatically add instances. When traffic decreases, it can remove instances.</p>\n<p>A major advantage is that all instances can be created from the same VM image, giving us consistent environments.</p>\n<h1>2. Creating a Custom VM Image</h1>\n<p>Suppose we have a simple Node.js application.</p>\n<p>Our desired VM might contain:</p>\n<p>Ubuntu Linux | +-- Node.js | +-- Application | +-- Configuration | +-- Required dependencies</p>\n<p>Instead of installing these components every time a VM is created, we can create a reusable image.</p>\n<p>There are several approaches for creating images in Azure. One common approach is to use <strong>Azure Image Builder</strong>.</p>\n<p>The general process is:</p>\n<p>Source Image | v Azure Image Builder | +-- Install packages +-- Copy application +-- Configure services | v Azure Compute Gallery | v VM Scale Set</p>\n<p>The resulting image becomes the standard image used by VMSS.</p>\n<h1>3. Store the Image in Azure Compute Gallery</h1>\n<p>Azure Compute Gallery allows organizations to manage and version VM images.</p>\n<p>For example, we could have:</p>\n<p>Gallery: myApplicationGallery Image Definition: webapp Versions: 1.0.0 1.1.0 1.2.0</p>\n<p>This is particularly useful for CI/CD because every application release can produce a new image version.</p>\n<p>For example:</p>\n<p>Application Release | v Build Image | v Image Version 1.2.0 | v Deploy to VMSS</p>\n<p>Instead of modifying running servers manually, we create a new immutable image and roll it out.</p>\n<h1>4. Create a VM Scale Set</h1>\n<p>A VMSS can be created using Azure CLI.</p>\n<p>First, define some variables:</p>\n<p>RESOURCE_GROUP=\"rg-vmss-demo\" LOCATION=\"eastus\" VMSS_NAME=\"webapp-vmss\"</p>\n<p>Create the resource group:</p>\n<p>az group create \\ --name $RESOURCE_GROUP \\ --location $LOCATION</p>\n<p>A VM Scale Set can then be created using an image from Azure Compute Gallery.</p>\n<p>For example:</p>\n<p>az vmss create \\ --resource-group $RESOURCE_GROUP \\ --name $VMSS_NAME \\ --image \"/subscriptions/&lt;SUBSCRIPTION_ID&gt;/resourceGroups/&lt;IMAGE_RG&gt;/providers/Microsoft.Compute/galleries/myApplicationGallery/images/webapp/versions/1.0.0\" \\ --instance-count 2 \\ --admin-username azureuser \\ --generate-ssh-keys</p>\n<p>The important part is the image reference:</p>\n<p>.../galleries/myApplicationGallery/images/webapp/versions/1.0.0</p>\n<p>This tells VMSS which image version should be used.</p>\n<h1>5. Why Image-Based Deployment?</h1>\n<p>Imagine we have five VM instances.</p>\n<p>Without an image-based approach, we might have:</p>\n<p>VM1 -&gt; install application VM2 -&gt; install application VM3 -&gt; install application VM4 -&gt; install application VM5 -&gt; install application</p>\n<p>This can result in configuration differences.</p>\n<p>With an image-based approach:</p>\n<p>Application Image 1.0.0 | +--------------+--------------+ | | | VM1 VM2 VM3</p>\n<p>Every VM starts from the same known state.</p>\n<p>This makes deployments more predictable and repeatable.</p>\n<h1>6. CI/CD Pipeline Architecture</h1>\n<p>A typical CI/CD architecture can look like this:</p>\n<p>Developer | | git push v Azure Repos / GitHub | v Azure DevOps Pipeline | +------------------+ | | v v Build/Test Build Image | v Azure Compute Gallery | v Image Version 1.2.0 | v Update VMSS | v Rolling Upgrade</p>\n<p>The key idea is that <strong>the application image becomes the deployment artifact</strong>.</p>\n<h1>7. Example Azure DevOps Pipeline</h1>\n<p>A simplified azure-pipelines.yml could look like this:</p>\n<p>trigger: branches: include: - main variables: resourceGroup: 'rg-vmss-demo' location: 'eastus' vmssName: 'webapp-vmss' imageVersion: '1.2.0' stages: - stage: Build displayName: Build Application jobs: - job: Build steps: - script: | npm install npm test displayName: Install and test application - stage: BuildImage displayName: Build VM Image dependsOn: Build jobs: - job: Image steps: - script: | echo \"Building VM image...\" # Azure Image Builder commands go here displayName: Build custom image - stage: Deploy displayName: Deploy to VMSS dependsOn: BuildImage jobs: - job: DeployVMSS steps: - task: AzureCLI@2 inputs: azureSubscription: 'Azure-Service-Connection' scriptType: bash scriptLocation: inlineScript inlineScript: | az vmss update \\ --resource-group $(resourceGroup) \\ --name $(vmssName) \\ --set virtualMachineProfile.storageProfile.imageReference.version=$(imageVersion) az vmss rolling-upgrade start \\ --resource-group $(resourceGroup) \\ --name $(vmssName)</p>\n<p>This is a simplified example. In a production pipeline, you would normally add validation, image creation, approval gates, health checks, and rollback handling.</p>\n<h1>8. Understanding the Pipeline</h1>\n<p>Let's break down what happens.</p>\n<h3>Stage 1 — Build</h3>\n<p>The pipeline checks out the application and runs tests:</p>\n<p>git push | v npm install | v npm test</p>\n<p>If the tests fail, the deployment stops.</p>\n<h3>Stage 2 — Build Image</h3>\n<p>If the application passes testing, the pipeline creates a new VM image.</p>\n<p>For example:</p>\n<p>webapp | +-- 1.0.0 +-- 1.1.0 +-- 1.2.0 &lt;-- new version</p>\n<p>The image can contain:</p>\n<p>Ubuntu Node.js Application version 1.2.0 Application dependencies Configuration</p>\n<h3>Stage 3 — Deploy</h3>\n<p>The pipeline updates the VMSS to use the new image version.</p>\n<p>VMSS | +-- VM1 -&gt; old image +-- VM2 -&gt; old image +-- VM3 -&gt; old image</p>\n<p>After the upgrade:</p>\n<p>VMSS | +-- VM1 -&gt; new image +-- VM2 -&gt; new image +-- VM3 -&gt; new image</p>\n<p>A rolling upgrade can be used so that instances are updated progressively rather than all being replaced simultaneously.</p>\n<h1>9. Rolling Deployment</h1>\n<p>For production systems, we generally don't want to replace every VM at exactly the same time.</p>\n<p>For example:</p>\n<p>Before: VM1 -&gt; v1.1 VM2 -&gt; v1.1 VM3 -&gt; v1.1 VM4 -&gt; v1.1</p>\n<p>The deployment can progressively update instances:</p>\n<p>Step 1 VM1 -&gt; v1.2 VM2 -&gt; v1.1 VM3 -&gt; v1.1 VM4 -&gt; v1.1 Step 2 VM1 -&gt; v1.2 VM2 -&gt; v1.2 VM3 -&gt; v1.1 VM4 -&gt; v1.1 Step 3 VM1 -&gt; v1.2 VM2 -&gt; v1.2 VM3 -&gt; v1.2 VM4 -&gt; v1.2</p>\n<p>Health checks should be used to ensure the updated instances are working correctly before continuing.</p>\n<h1>10. Image Versioning</h1>\n<p>One of the most important practices is to give every image a unique version.</p>\n<p>For example:</p>\n<p>1.0.0 1.1.0 1.2.0 1.2.1</p>\n<p>Avoid treating latest as your only deployment reference.</p>\n<p>Instead, record exactly which version is running:</p>\n<p>Production | +-- VMSS | +-- Image: webapp +-- Version: 1.2.0</p>\n<p>This makes troubleshooting and rollback easier.</p>\n<h1>11. Rollback</h1>\n<p>Suppose version 1.2.0 has a production issue.</p>\n<p>Because the previous image still exists:</p>\n<p>1.0.0 1.1.0 1.2.0</p>\n<p>we can deploy the previous known-good image:</p>\n<p>VMSS | +-- current: 1.2.0 | +-- rollback: 1.1.0</p>\n<p>This is one of the biggest benefits of immutable image-based deployments.</p>\n<h1>12. Recommended Production Architecture</h1>\n<p>A more complete production architecture might look like:</p>\n<p>Developer | v Git Repository | v Azure DevOps CI | +-------+-------+ | | Build Tests | | +-------+-------+ | v Azure Image Builder | v Azure Compute Gallery / \\ v1.1.0 v1.2.0 | v Azure DevOps | v VM Scale Set | +---------+---------+ | | | VM1 VM2 VM3 | | | +---------+---------+ | Application</p>\n<h1>13. Security Considerations</h1>\n<p>The pipeline should not contain Azure passwords or service-principal secrets directly.</p>\n<p>Instead, use an Azure DevOps service connection with an appropriately scoped identity.</p>\n<p>For example:</p>\n<p>Azure DevOps | | Managed identity / service connection v Azure Resources</p>\n<p>Also consider:</p>\n<ul>\n<li>Store application secrets in Azure Key Vault.</li>\n<li>Follow least-privilege access.</li>\n<li>Restrict access to image galleries.</li>\n<li>Scan application and OS images for vulnerabilities.</li>\n<li>Don't bake sensitive credentials into VM images.</li>\n<li>Use HTTPS and appropriate network security controls.</li>\n</ul>\n<h1>14. Best Practices</h1>\n<p>For a production VMSS CI/CD implementation, consider the following:</p>\n<ul>\n<li><strong>Immutable images:</strong> Build a new image rather than modifying production VMs manually.</li>\n<li><strong>Version images:</strong> Use explicit image versions such as 1.2.0.</li>\n<li><strong>Automated testing:</strong> Run application and infrastructure tests before deployment.</li>\n<li><strong>Rolling upgrades:</strong> Update instances progressively.</li>\n<li><strong>Health checks:</strong> Validate the application after instances are upgraded.</li>\n<li><strong>Rollback:</strong> Keep previous image versions available.</li>\n<li><strong>Infrastructure as Code:</strong> Manage VMSS, networking, identities, and other infrastructure using Bicep or Terraform.</li>\n<li><strong>Secrets management:</strong> Use Azure Key Vault instead of putting secrets in pipeline YAML.</li>\n<li><strong>Approvals:</strong> Add an approval before production deployment where appropriate.</li>\n</ul>\n<h1>Conclusion</h1>\n<p>A strong Azure VM Scale Set deployment strategy is to treat the VM image as a versioned deployment artifact.</p>\n<p>The overall process becomes:</p>\n<p>Code | v Build &amp; Test | v Create VM Image | v Publish Image Version | v Update VMSS | v Rolling Upgrade | v Health Check | +---- Success ---&gt; Production | +---- Failure ---&gt; Rollback</p>\n<p>This approach gives teams a repeatable way to deploy applications to VM Scale Sets while maintaining consistency between instances and providing a straightforward path for upgrades and rollback.</p>\n<p>The exact implementation can vary depending on whether you use <strong>Azure DevOps or GitHub Actions</strong>, and whether your images are built using <strong>Azure Image Builder, Packer, or another image-building tool</strong>.</p>"
