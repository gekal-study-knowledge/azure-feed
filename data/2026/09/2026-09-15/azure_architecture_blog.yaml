  "96428768cfc8836042c0b50379ffbca9":
    "id": "96428768cfc8836042c0b50379ffbca9"
    "title": "Microsoft Foundry Observability: How to Trace, Evaluate, Monitor, and Secure AI Agents"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/microsoft-foundry-observability-how-to-trace-evaluate-monitor/ba-p/4555846"
    "published": "2026-09-15 04:42:07"
    "fetched": "2026-09-15 21:17:20"
    "summary": "<h2>The green check that hid a real problem</h2>\n<p>During a recent customer conversation, I was shown a customer-service refund agent that looked healthy by every traditional measure. Requests completed successfully. The endpoint returned HTTP 200. Latency was within the team's target, and there were no obvious exceptions in the application logs.</p>\n<p>Then a customer asked a simple thing:</p>\n<p>Please refund the duplicate $500 charge on invoice 83457.</p>\n<p>The agent processed the refund and confirmed success. There was only one problem: in the failure case explored in this article, the agent calls the correct tool with the <strong>wrong parameter</strong>—refunding <strong>$5,000 instead of $500</strong>.</p>\n<p>From the application's perspective, the request succeeded. From the business's perspective, the agent failed.</p>\n<p>That moment changed the direction of our discussion. We were no longer asking, \"Is the endpoint available?\" We were asking:</p>\n<ul>\n<li>Which tool did the agent call, and with what arguments?</li>\n<li>Was the refund amount correct?</li>\n<li>Did the agent honor the approval threshold?</li>\n<li>How many other customers were affected?</li>\n<li>How would we prove that the correction actually worked?</li>\n</ul>\n<p>This is the gap that AI observability must close.</p>\n<p>Traditional monitoring tells us whether a system is operating. Agent observability helps us determine whether the system is behaving as intended—and whether that behavior produces a trustworthy business outcome.</p>\n<p>Below screenshot captures successful but incorrect action by agent. Later in this article, we will build this agent step by step and explore how observability helps us identify the failure.</p>\n<img />\n<h2>Observability must extend beyond logs, metrics, and traces</h2>\n<p>Logs, metrics, and traces remain essential, but an AI application introduces another dimension: the application can be technically healthy and semantically wrong.</p>\n<p>I frame this as <strong>five layers of AI observability</strong>. A refund that returns HTTP 200 can still fail on the layers that matter:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Layer</th><th>Question</th><th>Refund-scenario result</th></tr><tr><td>1. Technical</td><td>Is it available, fast, healthy, and affordable?</td><td>Pass — HTTP 200, normal latency, zero exceptions</td></tr><tr><td>2. Agent execution</td><td>What did the agent actually do?</td><td>Fail — wrong parameter passed to the tool</td></tr><tr><td>3. Safety / policy</td><td>Was the behavior permitted?</td><td>Fail — approval threshold bypassed</td></tr><tr><td>4. Quality</td><td>Was the action correct?</td><td>Fail — task executed incorrectly</td></tr><tr><td>5. Business</td><td>Did it achieve the outcome?</td><td>Fail — financial loss</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>These layers are related, but they are not interchangeable. A response can have low latency and high fluency while still passing the wrong amount to a payment tool. Traditional APM only covers Layer 1.</p>\n<h2>The Microsoft Foundry observability landscape</h2>\n<p>For this implementation, Microsoft Foundry was the development and evaluation experience, while Azure Monitor Application Insights became the telemetry store and investigation surface.</p>\n<p>The responsibilities were intentionally separated:</p>\n<ul>\n<li><strong>Microsoft Foundry Traces</strong> gave the development team an ordered view of the agent run.</li>\n<li><strong>Foundry Evaluation</strong> measured quality, safety, and agent behavior.</li>\n<li><strong>The Foundry Monitor experience</strong> showed operational and evaluation trends for the deployed agent.</li>\n<li><strong>Application Insights Agent Observability</strong> connected runs, models, tools, token usage, latency, and failures.</li>\n<li><strong>Log Analytics</strong> supported customer-specific questions with Kusto Query Language.</li>\n<li><strong>Azure Monitor alerts</strong> turned important signals into an operational response.</li>\n</ul>\n<p>OpenTelemetry provides the connective tissue. It gives us a standard trace model for agent, model, tool, and custom application spans instead of restricting observability to one application framework.</p>\n<img />\n<h2>Step 1: Prepare the project</h2>\n<p>The sample uses Python 3.10 or later, a Microsoft Foundry project, a deployed model, and an Application Insights resource connected to the project. It does not require a preexisting repository or any additional source files. Create a new empty folder and run every snippet in this article in order.</p>\n<p>Create and enter the working folder:</p>\nmkdir foundry-observability-demo\ncd foundry-observability-demo\npython -m venv .venv\n<p>Activate the virtual environment on Windows PowerShell:</p>\n.\\.venv\\Scripts\\Activate.ps1\n<p>On macOS or Linux, use:</p>\nsource .venv/bin/activate\n<p>Install the packages used by the article:</p>\npython -m pip install --upgrade pip\npython -m pip install \\\n  \"azure-ai-projects&gt;=2.0.0\" \\\n  azure-identity \\\n  azure-monitor-opentelemetry \\\n  azure-core-tracing-opentelemetry \\\n  opentelemetry-sdk \\\n  python-dotenv\n<p>For local development, authenticate with the Azure CLI:</p>\naz login\n<p>Create a local .env file. Copy the endpoint and deployment name from the Foundry project rather than hard-coding them in source control.</p>\nFOUNDRY_ENDPOINT=&lt;copy-from-the-Foundry-project-overview&gt;\nFOUNDRY_MODEL=gpt-4o\nAZURE_TENANT_ID=&lt;your-tenant-id&gt;\nAPPINSIGHTS_CONNECTION_STRING=&lt;copy-from-Project-Tracing-Manage-data-source&gt;\nLOG_ANALYTICS_WORKSPACE_ID=&lt;workspace-guid&gt;\n<p>Run Python from foundry-observability-demo. The following code loads .env from that folder and validates every value required by the later snippets</p>\n<p>Load and validate the configuration:</p>\nimport os\nfrom dotenv import load_dotenv\n\n# Load .env from the directory where Python or Jupyter was started.\nif not load_dotenv(dotenv_path=\".env\"):\n    raise FileNotFoundError(\n        \"No .env file was found. Create it in the current working directory.\"\n    )\n\n# Validate the variables required by the article.\nrequired_variables = [\n    \"FOUNDRY_ENDPOINT\",\n    \"AZURE_TENANT_ID\",\n    \"APPINSIGHTS_CONNECTION_STRING\",\n]\nmissing_variables = [\n    name for name in required_variables if not os.environ.get(name)\n]\nif missing_variables:\n    raise ValueError(\n        \"Missing required .env values: \" + \", \".join(missing_variables)\n    )\n\nfoundry_endpoint = os.environ.get(\"FOUNDRY_ENDPOINT\")\ntenant_id = os.environ.get(\"AZURE_TENANT_ID\")\nmodel_deployment = os.environ.get(\"FOUNDRY_MODEL\", \"gpt-4o\")\napp_insights_conn = os.environ.get(\"APPINSIGHTS_CONNECTION_STRING\")\nlog_analytics_workspace_id = os.environ.get(\"LOG_ANALYTICS_WORKSPACE_ID\")\n\nprint(f\" Foundry endpoint : {foundry_endpoint[:50]}...\")\nprint(f\"Model deployment : {model_deployment}\")\nprint(f\"Tenant ID        : {tenant_id[:8]}...\")\nprint(\" Application Insights connection string loaded\")\nprint(\n    \" Log Analytics workspace ID loaded\"\n    if log_analytics_workspace_id\n    else \" LOG_ANALYTICS_WORKSPACE_ID is optional until the KQL section\"\n)\n<p>Initialize the clients:</p>\nfrom azure.identity import AzureCliCredential\nfrom azure.ai.projects import AIProjectClient\n\ncredential = AzureCliCredential(tenant_id=tenant_id)\nproject_client = AIProjectClient(endpoint=foundry_endpoint, credential=credential)\nopenai_client = project_client.get_openai_client()\n\nprint(\" AIProjectClient initialized\")\nprint(\"OpenAI client ready\")\n<p>The identity running the sample needs permission to use the Foundry project. To query the resulting telemetry, it also needs appropriate access to Application Insights and its Log Analytics workspace. In production, assign access through Microsoft Entra groups and least-privilege roles.</p>\n<h2>Step 2: Create the refund agent and observe what it actually did</h2>\n<p>The agent is a function-tool agent named refund-agent-observability-demo. It exposes a single process_refund tool. The instructions are intentionally ambiguous about amount handling to demonstrate how an agent can misinterpret a parameter.</p>\nimport json\nfrom azure.ai.projects.models import PromptAgentDefinition, FunctionTool, Tool\n\n# Define the refund tool\nprocess_refund_tool = FunctionTool(\n    name=\"process_refund\",\n    description=\"Process a refund for a customer invoice. Returns confirmation with refund details.\",\n    parameters={\n        \"type\": \"object\",\n        \"properties\": {\n            \"invoice_id\": {\n                \"type\": \"string\",\n                \"description\": \"The invoice ID to refund\"\n            },\n            \"amount\": {\n                \"type\": \"number\",\n                \"description\": \"The refund amount in dollars\"\n            }\n        },\n        \"required\": [\"invoice_id\", \"amount\"],\n        \"additionalProperties\": False,\n    },\n    strict=True,\n)\n\ntools: list[Tool] = [process_refund_tool]\n\nprint(\" Refund tool defined\")\nprint(f\" Tool: process_refund(invoice_id, amount)\")\nprint(f\"   Tool: process_refund(invoice_id, amount)\")\n\n# Create the refund agent\n\n# NOTE: The instructions are intentionally ambiguous about amount handling\n\n# to demonstrate how agents can misinterpret parameters\n\nagent = project_client.agents.create_version(\n    agent_name=\"refund-agent-observability-demo\",\n    definition=PromptAgentDefinition(\n        model=model_deployment,\n        instructions=\"\"\"You are a customer service agent that processes refund requests.\nWhen a customer asks for a refund, use the process_refund tool.\nExtract the invoice ID and amount from the customer's message.\nAlways confirm the refund was processed successfully.\n\"\"\",\n        tools=tools,\n    ),\n)\nprint(f\" Agent created: {agent.name} (version {agent.version})\")\n<p>Now send a refund request and inspect exactly what the agent proposed. The \"Traditional Monitoring View\" stays green while we independently check the tool argument:</p>\n# Send a refund request\n\nuser_message = \"Please refund the duplicate $500 charge on invoice 83457.\"\nprint(f\" User: {user_message}\")\nprint(\"─\" * 60)\nresponse = openai_client.responses.create(\n    model=model_deployment,\n    instructions=agent.definition.instructions,\n    tools=[{\n        \"type\": \"function\",\n        \"name\": \"process_refund\",\n        \"description\": \"Process a refund for a customer invoice.\",\n        \"parameters\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"invoice_id\": {\"type\": \"string\", \"description\": \"The invoice ID\"},\n                \"amount\": {\"type\": \"number\", \"description\": \"The refund amount in dollars\"}\n            },\n            \"required\": [\"invoice_id\", \"amount\"],\n            \"additionalProperties\": False,\n        },\n        \"strict\": True,\n    }],\n    input=user_message,\n)\n# Inspect what the agent did\n\nprint(\"\\n Traditional Monitoring View:\")\nprint(f\"   HTTP Status:      200\")\nprint(f\"   Exception Count:  0\")\nprint(f\"   Response Time:    ~2-4s\")\nprint(f\"   Status:           SUCCESS\")\nprint(\"\\n Agent Output:\")\nfor item in response.output:\n    if item.type == \"function_call\":\n        args = json.loads(item.arguments)\n        print(f\"\\n    Tool Called:   {item.name}\")\n        print(f\"    Invoice ID:    {args.get('invoice_id')}\")\n        print(f\"    Amount:      ${args.get('amount')}\")\n        # Check if the amount is correct\n        expected_amount = 500.0\n        actual_amount = args.get('amount', 0)\n        if actual_amount != expected_amount:\n            print(f\"\\n    PARAMETER ERROR DETECTED!\")\n            print(f\"      Expected: ${expected_amount}\")\n            print(f\"      Actual:   ${actual_amount}\")\n            print(f\"      Loss:     ${abs(actual_amount - expected_amount)}\")\n        else:\n            print(f\"\\n    Parameters correct\")\n    elif item.type == \"message\":\n        print(f\" Response: {item.content[0].text if item.content else 'N/A'}\")\n<p>This is the whole point of observability: the HTTP status, exception count, and latency all look healthy, while the argument check is the only thing that reveals whether the refund amount is right.</p>\n<p><strong>The all-green moment:</strong></p>\n<img />\n<h2>Step 3: Classify the failure across the five layers</h2>\n<p>When the amount is wrong, the workshop classifies the same interaction across all five layers—so the \"green check\" and the real failure sit side by side:</p>\n<p># Visualize the five-layer assessment print(\"═\" * 65) print(\" FIVE-LAYER AI OBSERVABILITY ASSESSME</p>\n# Visualize the five-layer assessment\n\nprint(\"═\" * 65)\nprint(\"  FIVE-LAYER AI OBSERVABILITY ASSESSMENT\")\nprint(\"═\" * 65)\nprint()\nlayers = [\n    (\"1. Technical\",       \"PASS\", \"HTTP 200, 0 errors, 2.8s latency\"),\n    (\"2. Agent Execution\", \"FAIL\", \"Wrong parameter: $5000 instead of $500\"),\n    (\"3. Safety &amp; Policy\", \"FAIL\", \"Approval threshold bypassed\"),\n    (\"4. Quality\",         \"FAIL\", \"Task executed incorrectly\"),\n    (\"5. Business\",        \"FAIL\", \"$4,500 financial loss\"),\n]\nfor layer, status, detail in layers:\n    print(f\"  {layer:&lt;22} {status:&lt;10} {detail}\")\nprint()\nprint(\"─\" * 65)\nprint(\"  Traditional APM verdict:    ALL GREEN\")\nprint(\"  AI Observability verdict:   CRITICAL FAILURE\")\nprint(\"─\" * 65)\n<p>Traditional monitoring only covers Layer 1. The remaining sections show how to detect, evaluate, monitor, and prevent the other four.</p>\n<h2>Step 4: Turn on tracing and read the run as a story</h2>\n<p>Server-side traces become available after Application Insights is connected to the project. Client-side tracing adds visibility into the application logic around the agent call. The workshop enables both with a few lines: it turns on content recording, configures Azure Monitor, and gets a tracer.</p>\n# Enable experimental GenAI tracing and content capture before instrumentation.\nos.environ[\"AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING\"] = \"true\"\nos.environ[\"OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT\"] = \"true\"\n\nfrom azure.ai.projects.telemetry import AIProjectInstrumentor\nfrom azure.monitor.opentelemetry import configure_azure_monitor\nfrom opentelemetry import trace\n\nconfigure_azure_monitor(connection_string=app_insights_conn)\nAIProjectInstrumentor().instrument(\n    enable_content_recording=True,\n    enable_trace_context_propagation=True,\n    enable_baggage_propagation=False,\n)\n\ntracer = trace.get_tracer(\"foundry-observability-blog\")\nprint(\"Azure Monitor configured\")\nprint(\"Foundry GenAI instrumentation enabled\")\nprint(\"Content recording enabled\")\nprint(\"Tracer initialized\")\n<p>Wrapping an agent interaction in a custom parent span ties the model call and each tool call into one ordered trace. Here the workshop wraps a customer-service session, dispatches the tool the model requested, and returns the result with previous_response_id so the follow-up model call joins the same conversation:</p>\nfrom openai.types.responses.response_input_param import FunctionCallOutput\n# Run the agent with tracing\n\nwith tracer.start_as_current_span(\"customer_service_session\") as session_span:\n    session_span.set_attribute(\"session.type\", \"customer_inquiry\")\n    session_span.set_attribute(\"customer.segment\", \"premium\")\n    # Initial model call\n    response = openai_client.responses.create(\n        model=model_deployment,\n        instructions=agent.definition.instructions,\n        tools=[{\n            \"type\": \"function\",\n            \"name\": t.name,\n            \"description\": t.description,\n            \"parameters\": t.parameters,\n            \"strict\": True,\n        } for t in tools],\n        input=user_message,\n    )\n    # Process function calls, return tool output, then continue the conversation\n    input_items = []\n    for item in response.output:\n        if item.type == \"function_call\":\n            result = {\"status\": \"processed\", \"arguments\": json.loads(item.arguments)}\n            input_items.append(\n                FunctionCallOutput(\n                    type=\"function_call_output\",\n                    call_id=item.call_id,\n                    output=json.dumps(result),\n                )\n            )\n    if input_items:\n        final_response = openai_client.responses.create(\n            model=model_deployment,\n            instructions=agent.definition.instructions,\n            input=input_items,\n            previous_response_id=response.id,\n        )\n    # Record the trace ID for investigation\n    span_context = session_span.get_span_context()\n    trace_id = format(span_context.trace_id, '032x')\n    print(f\" Trace ID: {trace_id}\")\n    print(f\"   View in Application Insights → Transaction Search → {trace_id}\")\n<p>The resulting trace reads as a sequence, not a pile of logs:</p>\n<p><strong>Trace anatomy:</strong>&nbsp;</p>\n<img /><img /><img />\n<p><strong>Graph view of Conversation id:</strong>&nbsp;</p>\n<img />\n<p><strong>&nbsp;End-to-end investigation in Application Insight</strong></p>\n<img /><img /><img />\n<p><strong>Application Insight- Agents (Preview)</strong></p>\n<img />\n<p><strong>Agents Preview — Models &amp; Tools</strong></p>\n<img />\n<p><strong>Application Insight captures the platform where the agent lives (foundry,copilot studio etc)</strong></p>\n<img />\n<p><strong>Application Insight - failures</strong></p>\n<img />\n<h2>Step 5: Ask custom questions with KQL</h2>\n<p>The portal is an excellent starting point, but customers eventually ask questions specific to their business. The workshop's cookbook targets a <strong>Log Analytics workspace</strong> and uses the workspace tables (AppDependencies, AppEvents). The legacy aliases (dependencies, customEvents) only resolve in an Application Insights resource query context—use the schema that matches your query scope.</p>\n<p>Tool failure rate:</p>\nAppDependencies\n| where DependencyType == \"GenAI\"\n| where Name == \"ExecuteTool\"\n| summarize\n    Total   = count(),\n    Failed  = countif(Success == false),\n    FailPct = round(100.0 * countif(Success == false) / count(), 2)\n    by bin(TimeGenerated, 1h)\n| render timechart\n<p>Token consumption over time:</p>\nAzureMetrics\n| where MetricName in (\"InputTokens\", \"OutputTokens\", \"TotalTokens\")\n| summarize Tokens = sum(Total)\n    by MetricName, bin(TimeGenerated, 1h)\n| render timechart\n<p>Follow one trace end to end:</p>\n<p>// Replace &lt;operation-id&gt; with the actual OperationId let TraceId = \"&lt;operation-id&gt;\"; AppDependencies | where OperationId == TraceId | project TimeGenerated, Name, DurationMs, Success, ResultCode, OperationId, ParentId, Properties | order by TimeGenerated asc</p>\n// Replace &lt;operation-id&gt; with the actual OperationId\nlet TraceId = \"&lt;operation-id&gt;\";\nAppDependencies\n| where OperationId == TraceId\n| project\n    TimeGenerated,\n    Name,\n    DurationMs,\n    Success,\n    ResultCode,\n    OperationId,\n    ParentId,\n    Properties\n| order by TimeGenerated asc\n<p>Correlate human/evaluation feedback with responses:</p>\n<p>AppEvents | where Name == \"gen_ai.evaluation.result\" | extend responseId = tostring(Properties[\"gen_ai.response.id\"]), score = todouble(Properties[\"gen_ai.evaluation.score.value\"]), label = tostring(Properties[\"gen_ai.evaluation.score.label\"]), source = tostring(Properties[\"microsoft.gen_ai.human_evaluation.source\"]) | project TimeGenerated, responseId, score, label, source | order by TimeGenerated desc</p>\nAppEvents\n| where Name == \"gen_ai.evaluation.result\"\n| extend\n    responseId = tostring(Properties[\"gen_ai.response.id\"]),\n    score      = todouble(Properties[\"gen_ai.evaluation.score.value\"]),\n    label      = tostring(Properties[\"gen_ai.evaluation.score.label\"]),\n    source     = tostring(Properties[\"microsoft.gen_ai.human_evaluation.source\"])\n| project TimeGenerated, responseId, score, label, source\n| order by TimeGenerated desc\n<p>Telemetry schemas continue to evolve. Before using a query in production, inspect a representative span and confirm the table and attribute names emitted by the SDK version in use.</p>\n<p><strong>Custom KQL:</strong></p>\n<img />\n<h2>Step 6: Evaluate the process — did the agent pass the right parameters?</h2>\n<p>Tracing explains how an action happened. Evaluation measures whether it was correct, consistently. For a refund agent, the most direct check is <strong>process evaluation</strong>: did it select the right tool and pass the right arguments?</p>\n<p>The following example runs builtin.tool_call_accuracy over a set of banking scenarios—including a process_refund case—using the Evals API:</p>\nimport json\n# Banking tool definitions\n\nbanking_tools = [\n    {\n        \"type\": \"function\",\n        \"name\": \"get_account_balance\",\n        \"description\": \"Retrieve the current balance for a customer account.\",\n        \"parameters\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"account_number\": {\"type\": \"string\", \"description\": \"Account number (e.g., CHK-12345)\"}\n            },\n        },\n    },\n    {\n        \"type\": \"function\",\n        \"name\": \"process_refund\",\n        \"description\": \"Process a refund to a customer account.\",\n        \"parameters\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"invoice_id\": {\"type\": \"string\"},\n                \"amount\": {\"type\": \"number\"}\n            },\n        },\n    },\n]\n# Test scenarios with expected tool calls\n\n# Note: ToolCallAccuracyEvaluator requires a `tool_call_id` on every tool_call item.\n\nscenarios = [\n    {\n        \"query\": \"What's the balance in account CHK-12345?\",\n        \"tool_definitions\": banking_tools,\n        \"tool_calls\": [{\n            \"type\": \"tool_call\",\n            \"tool_call_id\": \"call_1\",\n            \"name\": \"get_account_balance\",\n            \"arguments\": {\"account_number\": \"CHK-12345\"}\n        }],\n    },\n    {\n        \"query\": \"Please refund $75 on invoice INV-9876.\",\n        \"tool_definitions\": banking_tools,\n        \"tool_calls\": [{\n            \"type\": \"tool_call\",\n            \"tool_call_id\": \"call_3\",\n            \"name\": \"process_refund\",\n            \"arguments\": {\"invoice_id\": \"INV-9876\", \"amount\": 75}\n        }],\n    },\n]\nprint(f\"{len(scenarios)} test scenarios defined\")\n\nimport time\n# Prepare test data — file_content expects an array of {\"item\": {...}} objects\n\ntest_content = [{\"item\": s} for s in scenarios]\ntesting_criteria = [\n    {\n        \"type\": \"azure_ai_evaluator\",\n        \"name\": \"tool_accuracy\",\n        \"evaluator_name\": \"builtin.tool_call_accuracy\",\n        \"initialization_parameters\": {\"deployment_name\": model_deployment},\n        \"data_mapping\": {\n            \"query\": \"{{item.query}}\",\n            \"tool_definitions\": \"{{item.tool_definitions}}\",\n            \"tool_calls\": \"{{item.tool_calls}}\",\n        },\n    },\n]\ndata_source_config = {\n    \"type\": \"custom\",\n    \"item_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n            \"query\": {\"type\": \"string\"},\n            \"tool_definitions\": {\"type\": \"array\"},\n            \"tool_calls\": {\"type\": \"array\"},\n        },\n        \"required\": [\"query\", \"tool_definitions\", \"tool_calls\"],\n    },\n}\neval_object = openai_client.evals.create(\n    name=\"Banking Agent — Tool Call Accuracy\",\n    data_source_config=data_source_config,\n    testing_criteria=testing_criteria,\n)\neval_run = openai_client.evals.runs.create(\n    eval_id=eval_object.id,\n    name=\"Tool Accuracy Run\",\n    data_source={\n        \"type\": \"jsonl\",\n        \"source\": {\"type\": \"file_content\", \"content\": test_content},\n    },\n)\nprint(f\"Evaluation run started: {eval_run.id}\")\nwhile eval_run.status not in [\"completed\", \"failed\"]:\n    time.sleep(5)\n    eval_run = openai_client.evals.runs.retrieve(\n        run_id=eval_run.id, eval_id=eval_object.id\n    )\n    print(f\"   Status: {eval_run.status}\")\nprint(f\"\\n{'' if eval_run.status == 'completed' else '' } Final: {eval_run.status}\")\n<p>The workshop also runs a quality-and-safety suite (builtin.violence, builtin.fluency, builtin.task_adherence) against a registered agent using evals.create and azure_ai_target_completions. Together, these give both a process signal (right tool, right arguments) and a quality/safety signal.</p>\n<p>One honest caveat for publication: in the workshop's saved run, the tool-call records are hand-authored fixtures, not calls captured from a live agent. For a production regression test, capture the agent's actual tool call and its tool_call_id, then evaluate that. For a refund, the exact-amount and approval checks belong in the transaction path as deterministic controls—an LLM judge should not be the only guard.</p>\n<p><strong>Evaluation</strong></p>\n<img />\n<p>At first glance, this evaluation run appears healthy: the run completed successfully and achieved 80% tool accuracy. However, the final test case tells a different story. The agent failed the duplicate-refund scenario, receiving a tool-accuracy score of 2 and a result of 0/1. This illustrates why aggregate scores and completion status alone are insufficient—production observability must make individual failures easy to identify and investigate.</p>\n<p><strong>A completed evaluation run can still contain a critical failure. The final refund scenario failed tool-call accuracy despite an overall score of 80%.</strong></p>\n<img />\n<h2>Step 7: Red-team the agent before it ships</h2>\n<p>Quality evaluation asks whether expected tasks succeed. Red teaming asks whether deliberate adversarial pressure pushes the agent past its boundaries. The workshop runs the <strong>AI Red Teaming Agent in the cloud</strong>: it registers a Foundry agent target, generates a prohibited-actions taxonomy, wires up agentic evaluators, and submits a run with attack strategies.</p>\nfrom azure.ai.projects.models import (\n    AzureAIAgentTarget,\n    AgentTaxonomyInput,\n    EvaluationTaxonomy,\n    RiskCategory,\n)\n# Target descriptor referenced by both the taxonomy and the run.\n\ntarget = AzureAIAgentTarget(name=agent.name, version=agent.version)\n# Foundry generates the attack-prompt taxonomy from the agent's tools &amp; instructions.\n\ntaxonomy = project_client.beta.evaluation_taxonomies.create(\n    agent.name,\n    EvaluationTaxonomy(\n        description=\"Taxonomy for banking agent red teaming\",\n        taxonomy_input=AgentTaxonomyInput(\n            risk_categories=[RiskCategory.PROHIBITED_ACTIONS],\n            target=target,\n        ),\n    ),\n)\ntaxonomy_file_id = taxonomy.id\n# The red team groups one or more runs and wires up the built-in agentic evaluators.\n\nred_team = openai_client.evals.create(\n    name=\"Red Team — Banking Agent Safety\",\n    data_source_config={\"type\": \"azure_ai_source\", \"scenario\": \"red_team\"},\n    testing_criteria=[\n        {\n            \"type\": \"azure_ai_evaluator\",\n            \"name\": \"Prohibited Actions\",\n            \"evaluator_name\": \"builtin.prohibited_actions\",\n            \"evaluator_version\": \"1\",\n        },\n        {\n            \"type\": \"azure_ai_evaluator\",\n            \"name\": \"Task Adherence\",\n            \"evaluator_name\": \"builtin.task_adherence\",\n            \"evaluator_version\": \"1\",\n            \"initialization_parameters\": {\"deployment_name\": model_deployment},\n        },\n        {\n            \"type\": \"azure_ai_evaluator\",\n            \"name\": \"Sensitive Data Leakage\",\n            \"evaluator_name\": \"builtin.sensitive_data_leakage\",\n            \"evaluator_version\": \"1\",\n        },\n    ],\n)\n\n# Create the red-team run — it executes server-side in Foundry.\n\neval_run = openai_client.evals.runs.create(\n    eval_id=red_team.id,\n    name=\"Banking Agent Red Team Run\",\n    data_source={\n        \"type\": \"azure_ai_red_team\",\n        \"item_generation_params\": {\n            \"type\": \"red_team_taxonomy\",\n            \"attack_strategies\": [\"Flip\", \"Base64\", \"IndirectJailbreak\"],\n            \"num_turns\": 5,\n            \"source\": {\"type\": \"file_id\", \"id\": taxonomy_file_id},\n        },\n        \"target\": target.as_dict(),\n    },\n)\nprint(f\"Run created: {eval_run.id}  status={eval_run.status}\")\nprint(\"   View in Foundry → Build → Evaluations → Red team\")\n<p>The strategies (Flip, Base64, IndirectJailbreak) select input transformations and multi-turn depth; they test whether the agent resists manipulation, stays on task, and does not leak data. Two things matter for an honest write-up:</p>\n<ul>\n<li><strong>Review the taxonomy before scanning.</strong> Confirm the generated prohibited behaviors reflect your policy. Run red teaming against an isolated target with synthetic accounts and no irreversible side effects.</li>\n<li><strong>Distinguish a security result from an infrastructure failure.</strong> A run that ends in failed is incomplete coverage, not a passing scan. Capture the run status honestly, and only present an attack-success-rate scorecard from a completed run.</li>\n</ul>\n<p><strong>Red-team run:</strong> Capture the run status and, when the run completes, the scorecard in Foundry → Build → Evaluations → Red team. If the run failed, caption it as incomplete coverage rather than a pass.</p>\n<h2>Step 8: Prove the fix and move to production monitoring</h2>\n<p>For the sample, the correction is a tightened prompt plus a deterministic amount/approval check in the transaction path—so the agent is not expected to reason its way out of receiving or emitting the wrong amount. After a fix, compare the two versions across the same evaluation set:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Signal</th><th>Before the fix</th><th>After the fix</th></tr><tr><td>Request success</td><td>100%</td><td>100%</td></tr><tr><td>Correct refund amount</td><td>Fail</td><td>Pass</td></tr><tr><td>Approval threshold honored</td><td>Fail</td><td>Pass</td></tr><tr><td>Tool-call accuracy</td><td>Fail</td><td>Pass</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The operational success rate does not change. The business outcome does.</p>\n<p>Once you know how to detect the failure, the next question is whether it is happening elsewhere. The Foundry Monitor experience brings operational metrics, evaluation results, and red-team results together for the selected agent; Application Insights adds deeper investigation across runs, models, tools, tokens, and errors. For this refund agent, I would monitor at least:</p>\n<ul>\n<li>Run success rate and model or tool errors</li>\n<li>P50 and P95 end-to-end latency</li>\n<li>Input and output token consumption</li>\n<li>Refund-amount and approval-threshold pass rate</li>\n<li>Tool-call-accuracy distribution</li>\n<li>Human escalation and customer correction rate</li>\n<li>Safety and adversarial-testing findings</li>\n</ul>\n<p>An alert should lead to an operational action:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Signal</th><th>Example condition</th><th>Action</th></tr><tr><td>Wrong-amount refund</td><td>Any run proposes an amount outside the approved range</td><td>Block the version and notify the finance/policy owner</td></tr><tr><td>Quality regression</td><td>Tool-call-accuracy pass rate falls below the release threshold</td><td>Stop promotion or roll back</td></tr><tr><td>Token anomaly</td><td>Tokens per run rise materially above baseline</td><td>Inspect context growth and repeated tool calls</td></tr><tr><td>Latency</td><td>P95 exceeds the agreed service objective</td><td>Inspect model, tool, and throttling spans</td></tr><tr><td>Safety</td><td>A scheduled red-team or production safety check fails</td><td>Route to the security and responsible-AI process</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>A KQL query like the tool-failure-rate example can become the signal for an Azure Monitor log alert. Configure the rule to trigger when the query returns results in the evaluation window, and route the notification through the customer's approved action group.</p>\n<h2>Continuous evaluation is the bridge between deployment and learning</h2>\n<p>A one-time evaluation protects one release. It does not protect the agent indefinitely. Production traffic changes, tools change, and models and prompts are revised. This makes observability a continuous engineering loop:</p>\n<ol>\n<li>Observe production behavior.</li>\n<li>Diagnose representative traces.</li>\n<li>Evaluate the failure mode.</li>\n<li>Add that failure to the regression dataset.</li>\n<li>Correct the prompt, tool, policy, or model configuration.</li>\n<li>Compare the candidate with the approved baseline.</li>\n<li>Promote only when the required quality, safety, operational, and business gates pass.</li>\n</ol>\n<p>Microsoft Foundry supports recurring and continuous evaluation. When using live production traces, sample intentionally—random sampling gives coverage, while targeted or intelligent sampling can prioritize unusual, high-risk, failed, expensive, or low-quality interactions. Evaluation calls and telemetry have cost, privacy, and retention implications, so the sampling strategy should reflect business risk.</p>\n<h2>Security, privacy, and cost are part of observability design</h2>\n<p>Tracing can capture prompts, model outputs, tool arguments, and tool results. That visibility is valuable, but it creates responsibility:</p>\n<ul>\n<li>Keep message-content recording disabled unless there is an approved need.</li>\n<li>Never place credentials, tokens, or secrets in prompts or span attributes.</li>\n<li>Avoid storing personal data when a pseudonymous transaction identifier is sufficient.</li>\n<li>Redact or minimize sensitive content before telemetry is emitted.</li>\n<li>Apply Azure RBAC to Application Insights and Log Analytics; set retention by environment and data classification.</li>\n<li>Monitor ingestion and evaluation cost, not only model-token cost.</li>\n<li>Validate preview capabilities against production requirements.</li>\n</ul>\n<p>There is also a practical instrumentation lesson: do not add every available value to every span. Capture the dimensions needed to investigate reliability, behavior, quality, security, cost, and business outcomes. More telemetry is not automatically better telemetry.</p>\n<h2>What the customer gained</h2>\n<p>The most valuable outcome was not another dashboard. It was a shared way for developers, platform engineers, finance/policy owners, security teams, and business stakeholders to discuss the same agent run with evidence.</p>\n<p>The developer could see the exact execution path. The platform team could see latency, errors, and token consumption. The policy owner could see the refund amount and whether the approval threshold held. The security team could verify how sensitive telemetry was handled. The business sponsor could see whether customers were refunded correctly.</p>\n<p>The original request had a green check before the investigation, and it had a green check afterward. The difference was that after the fix, we could prove the refund amount was correct.</p>\n<h2>Final takeaway</h2>\n<p>An agent should not be considered healthy merely because it responds. A production-ready observability practice should be able to answer:</p>\n<ul>\n<li>Did the agent complete the request?</li>\n<li>What model, tool, and path did it use, and with what arguments?</li>\n<li>Was its action relevant, grounded, safe, and correct?</li>\n<li>Did it comply with the approved business process?</li>\n<li>Can the team detect a regression before it affects more users?</li>\n<li>Can the team prove that the remediation improved the outcome?</li>\n</ul>\n<p>In the agentic era, observability is not the dashboard at the end of deployment. It is the evidence system connecting design decisions, production behavior, governance controls, and measurable business value.</p>\n<h6><strong>References</strong></h6>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/concepts/observability\" rel=\"noopener\" target=\"_blank\">Observability in generative AI — Microsoft Foundry</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup\" rel=\"noopener\" target=\"_blank\">Set up tracing in Microsoft Foundry</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side\" rel=\"noopener\" target=\"_blank\">Add client-side tracing to Foundry agents</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard\" rel=\"noopener\" target=\"_blank\">Monitor agents with the Agent Monitoring Dashboard</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/app/agents-view\" rel=\"noopener\" target=\"_blank\">Monitor AI agents with Application Insights</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-generative-ai-app\" rel=\"noopener\" target=\"_blank\">Run evaluations from the Microsoft Foundry portal</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-ai-red-teaming-cloud\" rel=\"noopener\" target=\"_blank\">Run AI Red Teaming Agent in the cloud</a></li>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/python/api/overview/azure/ai-evaluation-readme?view=azure-python\" rel=\"noopener\" target=\"_blank\">Azure AI Evaluation client library for Python</a></li>\n</ul>\n<p><strong>Contributors:</strong></p>\n<p>This article is maintained by Microsoft. It was originally written by the following contributors.</p>\n<p><a href=\"https://www.linkedin.com/in/gaurav-bhardwaj-33312854/\" rel=\"noopener\" target=\"_blank\">Gaurav Bhardwaj</a>&nbsp;| Senior Cloud Solution Architect</p>"
