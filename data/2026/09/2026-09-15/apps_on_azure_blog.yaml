  "f950f06c4c1cb5f40a5d09bcb6b24745":
    "id": "f950f06c4c1cb5f40a5d09bcb6b24745"
    "title": "SSL/TLS certificates and end-to-end encryption for Azure Functions Flex Consumption"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/ssl-tls-certificates-and-end-to-end-encryption-for-azure/ba-p/4556425"
    "published": "2026-09-15 06:01:36"
    "fetched": "2026-09-15 10:01:56"
    "summary": "<p>Last week we announced the general availability of TLS/SSL certificate support and end-to-end TLS encryption for Azure Functions Flex Consumption.</p>\n<p>Flex Consumption is the recommended serverless hosting plan for Azure Functions. It combines event-driven scale-to-zero and execution-based billing with fast scale-out, configurable instance memory, always-ready instances, and virtual network integration. With this release, customers can now apply a more complete transport-security model to HTTP-based serverless applications without moving to dedicated compute.</p>\n<p>The new capabilities include:</p>\n<ul>\n<li><strong>Site-scoped certificates</strong>, with up to three private certificates and three public certificates for each function app.</li>\n<li><strong>Multiple certificate sources</strong>, including direct upload, Azure Key Vault, App Service Certificates, and free App Service Managed Certificates for supported custom domains.</li>\n<li><strong>Per-certificate access from application code</strong>, replacing the broad WEBSITE_LOAD_CERTIFICATES model in Flex Consumption.</li>\n<li><strong>End-to-end TLS encryption</strong>&nbsp;between the Azure platform front ends and the workers that run your functions.</li>\n</ul>\n<p>Together, these features support common enterprise scenarios such as custom HTTPS endpoints, outbound client-certificate authentication, mutual TLS (mTLS), certificate-based cryptographic operations, and stricter encryption-in-transit requirements.</p>\n<h2>What end-to-end TLS means for a function app</h2>\n<p>It helps to separate the different places where TLS and certificates participate in an application request.</p>\n<p>First, a client connects to your function app over HTTPS. For the default&nbsp;*.azurewebsites.net&nbsp;hostname, Azure provides and manages the certificate automatically. For a custom hostname such as&nbsp;api.contoso.com, you map the domain to the function app and bind an appropriate server certificate.</p>\n<p>Second, Azure Functions receives the request at an Azure platform front end and routes it to a worker that runs your code. HTTPS has always protected the client-to-front-end connection. When end-to-end TLS is enabled, the front-end-to-worker connection is also encrypted. This removes the unencrypted internal hop that otherwise exists after TLS termination at the front end.</p>\n<p>Third, your function code might call another service that requires a certificate. For example, a partner API that uses mTLS. A site-scoped private certificate can be exposed to the function runtime and loaded from the Linux file system for that outbound connection.</p>\n<p>These controls are complementary:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>Traffic or trust boundary</th><th>Capability</th></tr></thead><tbody><tr><td>Client to Azure Functions front end</td><td>HTTPS and a certificate bound to the hostname</td></tr><tr><td>Azure platform front end to function worker</td><td>End-to-end TLS encryption</td></tr><tr><td>Function code to a downstream service</td><td>A private or public certificate made accessible to app code</td></tr><tr><td>Client identity presented to the function app</td><td>Client-certificate authentication, with validation performed by application code</td></tr></tbody></table></div>\n<p>End-to-end TLS does not replace a custom-domain certificate, and a certificate uploaded for use by code does not automatically configure mTLS. Each control protects a different boundary.</p>\n<h2>A certificate model designed for Flex Consumption</h2>\n<p>Traditional App Service certificate resources are scoped to a&nbsp;<em>webspace</em>, a deployment unit associated with an App Service plan's resource group, region, and operating system. Apps in the same webspace can share access to those certificates.</p>\n<p>Flex Consumption apps don't share the same plan, so we have introduced a new site-scoped model. The certificate is a child resource of one function app and isn't shared with other apps. This tighter boundary makes certificate ownership easier to reason about, reduces unintended sharing, and aligns well with function apps that are deployed and governed independently like Flex Consumption.</p>\n<p>Each Flex Consumption function app supports:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>Certificate type</th><th>Maximum per app</th><th>Typical uses</th></tr></thead><tbody><tr><td>Private certificate (.pfx)</td><td>3</td><td>Custom-domain TLS bindings, outbound client authentication, signing, or decryption</td></tr><tr><td>Public certificate (.cer)</td><td>3</td><td>Trusting or validating remote resources from application code</td></tr></tbody></table></div>\n<p>The three-certificate limit includes App Service Managed Certificates, App Service Certificates, Key Vault imports, and directly uploaded PFX files. Plan certificate usage before assigning a separate certificate to every hostname. A certificate with appropriate subject alternative names can be useful when one certificate must cover multiple hostnames.</p>\n<h2>Choose the right certificate source</h2>\n<p>Flex Consumption supports several certificate-management approaches:</p>\n<p><strong>App Service Managed Certificate.</strong>&nbsp;This is the simplest choice for a supported public custom domain. The domain-validated certificate is free, automatically issued, bound, and renewed by App Service. Managed certificates aren't exportable and don't support wildcard domains, private DNS, or use as an outbound client certificate. Avoid certificate pinning because the issuer, public key, and private key can change during renewal.</p>\n<p><strong>App Service Certificate.</strong>&nbsp;This paid option provides Azure-managed lifecycle capabilities with support for scenarios such as wildcard domains and export.</p>\n<p><strong>Azure Key Vault import.</strong>&nbsp;This is generally the preferred option when an organization centrally governs certificate issuance, access, and rotation. Use a managed identity and grant the&nbsp;<strong>Key Vault Certificate User</strong>&nbsp;role. When the certificate is renewed in Key Vault, the platform synchronizes the new version to the function app within 24 hours. If the vault blocks public access, enable the trusted Microsoft services bypass so the Azure Functions platform can retrieve the certificate.</p>\n<p><strong>Direct private certificate upload.</strong>&nbsp;Upload a password-protected PFX that includes the complete certificate chain, including intermediate and root certificates. For a custom-domain binding, the certificate must include the server-authentication extended key usage and be signed by a trusted certificate authority. Elliptic Curve Cryptography certificates are supported when uploaded as PFX.</p>\n<p><strong>Direct public certificate upload.</strong>&nbsp;Upload a CER when function code needs a public certificate. Public certificates aren't used to secure custom domains.</p>\n<h2>Configure the security foundation with infrastructure as code</h2>\n<p>The following Bicep excerpt shows the relevant settings on the function app. Add these properties to a complete Flex Consumption deployment that also defines the FC1 plan, deployment storage, runtime, identity, and monitoring resources.</p>\nresource functionApp 'Microsoft.Web/sites@2024-11-01' = \n{ \n  name: functionAppName \n  location: location \n  kind: 'functionapp,linux' \n  identity: { type: 'SystemAssigned' } \n  properties: { \n    serverFarmId: serverFarmResourceId \n    httpsOnly: true \n    siteScopedCertificatesEnabled: true \n    endToEndEncryptionEnabled: true \n    siteConfig: \n    { \n      minTlsVersion: '1.2' \n    } \n  functionAppConfig: { // Add the deployment, runtime, and scale configuration for your app. } \n  } \n}\n<p>The settings have distinct purposes:</p>\n<ul>\n<li>httpsOnly&nbsp;redirects HTTP requests to HTTPS.</li>\n<li>siteConfig.minTlsVersion&nbsp;defines the minimum TLS version accepted for inbound connections.</li>\n<li>siteScopedCertificatesEnabled&nbsp;enables per-app certificate resources.</li>\n<li>endToEndEncryptionEnabled&nbsp;encrypts front-end-to-worker traffic.</li>\n</ul>\n<p>You can also create certificate child resources with&nbsp;Microsoft.Web/sites/certificates@2024-11-01, including importing a certificate by specifying its Key Vault resource ID and secret name. Use secure deployment parameters for any certificate password or PFX content; never store private key material or passwords in source control.</p>\n<p>Azure CLI doesn't currently provide dedicated commands to manage Flex Consumption site-scoped certificates. Use the Azure portal or ARM/Bicep for certificate operations.</p>\n<p>For more on using Bicep and ARM to configure site-scoped certificates in Flex Consumption see&nbsp;<a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-infrastructure-as-code?pivots=flex-consumption-plan#site-scoped-certificates\" target=\"_blank\">Automate resource deployment for your function app in Azure Functions</a>.</p>\n<h2>Add and use a certificate</h2>\n<p>After creating the app with site-scoped certificates enabled, choose the workflow that matches your scenario.</p>\n<h3>Secure a custom domain with a managed certificate</h3>\n<p>In the Azure portal, open the Flex Consumption function app. Under <strong>Settings</strong>, select&nbsp;<strong>Custom domains</strong>, and then select&nbsp;<strong>Add custom domain </strong>and configure the certificates. For customer-managed certificates, add or import the private certificate under&nbsp;<strong>Settings</strong>&nbsp;&gt;&nbsp;<strong>Certificates</strong>, and then bind it to the custom domain. A domain showing as&nbsp;<strong>Secured</strong>&nbsp;confirms that a binding exists, but clients can still reject an expired, self-signed, name-mismatched, or incomplete certificate chain. Test the endpoint from representative client environments.</p>\n<h3>Make a certificate available to function code</h3>\n<p>Adding a certificate to the app does not automatically expose it to code. In&nbsp;<strong>Settings</strong>&nbsp;&gt;&nbsp;<strong>Certificates</strong>, open the menu for the required certificate and select&nbsp;<strong>Make accessible to app code</strong>.</p>\n<p>This per-certificate control replaces&nbsp;WEBSITE_LOAD_CERTIFICATES&nbsp;in Flex Consumption. That app setting remains valid for other supported Functions and App Service hosting plans, but it isn't used by Flex Consumption. The per-certificate model applies least privilege more naturally: expose only the certificates that the workload must read.</p>\n<p>Flex Consumption runs on Linux, so accessible certificates are files rather than entries in a Windows certificate store:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>Certificate</th><th>Runtime location</th></tr></thead><tbody><tr><td>Private</td><td>/var/ssl/private/&lt;thumbprint&gt;.p12</td></tr><tr><td>Public</td><td>/var/ssl/certs/&lt;thumbprint&gt;.der</td></tr></tbody></table></div>\n<p>Load the file by thumbprint using the certificate APIs for your language. Don't assume a Windows certificate store is available, and don't package private keys with the function code.</p>\n<p>For Key Vault imports, the platform places a renewed certificate version on the function instances after synchronization. If your application hard-codes a thumbprint, account for the fact that renewal produces a new thumbprint. Prefer a configuration or discovery pattern that lets you rotate without a code release.</p>\n<h2>Enable mutual TLS without confusing transport and identity</h2>\n<p>For inbound mTLS, configure the function app to request a client certificate by using the appropriate client-certificate mode:&nbsp;<strong>Required</strong>,&nbsp;<strong>Optional</strong>, or&nbsp;<strong>Optional Interactive User</strong>.</p>\n<p>Azure terminates the client TLS connection at the platform front end and forwards the presented certificate to the application in the&nbsp;X-ARR-ClientCert&nbsp;header. The platform forwards the certificate; your function code remains responsible for validating it. Validation should include the trusted issuer and chain, validity period, intended usage, revocation policy where applicable, and the application's authorization rules. Do not trust the presence of the header alone.</p>\n<p>If you use exclusion paths or&nbsp;<strong>Optional Interactive User</strong>&nbsp;mode, review the TLS renegotiation behavior carefully. TLS 1.3 and HTTP/2 don't support renegotiation, and requests with bodies larger than 100 KB can fail in configurations that require renegotiation. Prefer a mode and route design that avoids renegotiation when possible.</p>\n<p>For outbound mTLS, make the private certificate accessible to app code, load it from&nbsp;/var/ssl/private, and attach it to the TLS client used to call the downstream service. This is separate from enabling inbound client certificates.</p>\n<h2>Operational guidance for production</h2>\n<p>Treat certificates as rotating dependencies rather than static configuration:</p>\n<ul>\n<li>Inventory certificate purpose, owner, source, expiration, bound hostnames, and whether code access is enabled.</li>\n<li>Use managed identity and Key Vault for centrally governed certificates.</li>\n<li>Alert before expiration for directly uploaded certificates and rehearse renewal.</li>\n<li>Monitor custom-domain DNS because managed certificate issuance and renewal depend on successful domain validation.</li>\n<li>Avoid certificate or issuer pinning when using App Service Managed Certificates.</li>\n<li>Test certificate rotation on all scaled instances, not only one warm worker.</li>\n<li>Keep HTTPS-only enabled and require TLS 1.2 or later unless a documented compatibility requirement prevents it.</li>\n<li>Use Azure Policy and deployment validation to keep transport-security settings consistent across environments.</li>\n</ul>\n<p>When migrating from the legacy Consumption plan, remember that&nbsp;WEBSITE_LOAD_CERTIFICATES&nbsp;isn't used in Flex Consumption. Re-add the certificates to the new app, explicitly grant code access where required, and update code that expects the Windows certificate store to load files from the Linux paths instead.</p>\n<h2>Get started</h2>\n<p>The general availability of site-scoped certificates and end-to-end TLS gives teams a stronger security foundation for serverless APIs and event-driven applications on Flex Consumption. You can now keep certificate ownership at the function-app boundary, automate certificate lifecycle through Azure Key Vault or App Service, and encrypt request traffic through the worker that executes your code, all while retaining dynamic scale and consumption-based billing.</p>\n<p>Use the following resources to begin:</p>\n<ul>\n<li><a href=\"https://azure.microsoft.com/updates?id=570940\" target=\"_blank\">Azure update: TLS/SSL certificate and end-to-end TLS encryption support for Azure Functions Flex Consumption</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/azure-functions/flex-consumption-how-to\" target=\"_blank\">Create and manage function apps in a Flex Consumption plan</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/azure-functions/functions-scale#certificates\" target=\"_blank\">Azure Functions scale and hosting options: certificate support</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/azure-functions/functions-infrastructure-as-code?pivots=flex-consumption-plan#secured-deployments\" target=\"_blank\">Automate Azure Functions resource deployment</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/app-service/overview-tls\" target=\"_blank\">TLS in Azure App Service</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/app-service/app-service-web-configure-tls-mutual-auth\" target=\"_blank\">Configure TLS mutual authentication</a></li>\n<li><a href=\"https://github.com/Azure-Samples/Flex-Consumption-Site-Scoped-Certificates\" target=\"_blank\">Flex Consumption site-scoped certificates sample</a></li>\n</ul>"
  "6deb90f3d2aa918acd682e04f6a3c36d":
    "id": "6deb90f3d2aa918acd682e04f6a3c36d"
    "title": "Dashboards are for AI agents too, not just humans"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/dashboards-are-for-ai-agents-too-not-just-humans/ba-p/4556383"
    "published": "2026-09-15 05:25:20"
    "fetched": "2026-09-15 10:01:56"
    "summary": "<p>A few days ago I opened <a href=\"https://learn.microsoft.com/azure/sre-agent/overview\" rel=\"noopener\" target=\"_blank\">Azure SRE Agent</a> and typed four prompts. None of them was careful:</p>\n<blockquote>\n<p>find grafana dashboard for: GitHub Copilot</p>\n</blockquote>\n<blockquote>\n<p>run the panels queries. list top 3 very long sessions in the past 3 days</p>\n</blockquote>\n<blockquote>\n<p>what session 1 was doing?</p>\n</blockquote>\n<blockquote>\n<p>what was session 2 doing?</p>\n</blockquote>\n<p>No KQL. No table names. I didn't say what a \"session\" is, what \"long\" means, or which Application Insights resource my GitHub Copilot telemetry lands in.</p>\n<p>Ten minutes later I had this:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>#</th><th>Session</th><th>Start (UTC)</th><th>Duration</th><th>Spans</th><th>LLM calls</th><th>Tool calls</th></tr></thead><tbody><tr><td>1</td><td><code>9b195ee3…</code></td><td>Sep 10 19:55</td><td>142.7 min</td><td>663</td><td>291</td><td>365</td></tr><tr><td>2</td><td><code>93d53744…</code></td><td>Sep 08 10:17</td><td>47.9 min</td><td>103</td><td>49</td><td>53</td></tr><tr><td>3</td><td><code>6da6be34…</code></td><td>Sep 10 19:24</td><td>28.6 min</td><td>264</td><td>108</td><td>153</td></tr></tbody><colgroup><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /></colgroup></table></div>\n<p>and two diagnoses I would not have gotten from the dashboard alone:</p>\n<ul>\n<li><strong>Session 1 (142.7 min)</strong> was a GitHub Copilot CLI session building a Grafana dashboard: 291 model calls (233 of them on <code>gpt-6-astra</code>, P50 17 s), 365 tool calls — 162 of them KQL queries through the Azure Managed Grafana MCP endpoint — 3 dashboard writes, and 2 failures. Verdict: <em>\"long, not stuck.\"</em> The cost driver was a ~147:1 input-to-output token ratio: query results and dashboard JSON accumulating in context and being re-sent on every turn.</li>\n<li><strong>Session 2 (47.9 min)</strong> was a wait loop: 23 rounds of <code>cost_analysis</code> → <code>bash sleep</code> (60, 120 or 180 s) → retry. The sleeps account for ~44 of the 47.9 minutes. Verdict: <em>\"latency-long, not work-long\"</em> — and a pattern worth flagging.</li>\n</ul>\n<p>On the dashboard these two look the same: a long bar in <em>Agent Run Duration</em>. Underneath they are completely different stories.</p>\n<img />\n<p>The agent didn't know any of that when I started. The dashboard did. That is what this post is about.</p>\n<h2>First principles</h2>\n<p>Start from what a dashboard is. Every panel is a query someone wrote because the answer mattered, pointed at the right resource, titled with the question it answers, and annotated with the ways it can mislead. The variables pin it to a subscription, a resource group, an Application Insights component. The tags say what it covers. And it tends to stay correct, because people look at it every day and complain when it isn't. A dashboard is a team's understanding of a system, written down in a form that runs.</p>\n<p>That is why a person on call can open one and get insight without asking anyone. It is also the whole argument for handing one to an agent. The insight was never in the pixels; it is in the queries, scopes, titles and descriptions underneath them, and an agent can read those directly.</p>\n<p><strong>A dashboard is a map for the agent.</strong> It shows where the data lives, which questions are worth asking, how each one is asked, and where the traps are. The agent didn't need a separate context file, a hand-written playbook, or a tour of the schema. Most of what a human needs to reason about the system is already there, and so is most of what the agent needs. The map is already drawn. Here is what the agent found on it.</p>\n<h2>What the agent did</h2>\n<p>SRE Agent reached my Grafana instance through the <a href=\"https://learn.microsoft.com/azure/managed-grafana/grafana-mcp-server\" rel=\"noopener\" target=\"_blank\">Azure Managed Grafana MCP endpoint</a> — instances in the Azure public cloud have one at <code>https://&lt;grafana-endpoint&gt;/api/azure-mcp</code> — attached as an <a href=\"https://learn.microsoft.com/azure/sre-agent/mcp-connectors\" rel=\"noopener\" target=\"_blank\">MCP connector</a>. SRE Agent has a built-in connector for exactly this now; more on that below. The tool trace for the first two prompts is short:</p>\n<ol>\n<li><code>amgmcp_dashboard_search</code> — \"GitHub Copilot\" → one hit: uid <code>GitHubCopilot</code>, tags <code>github-copilot</code>, <code>opentelemetry</code>, <code>application-insights</code>.</li>\n<li><code>amgmcp_dashboard_inspect</code> — the panel list, the template variables with their current values, the time range, and every panel's KQL with the variables substituted.</li>\n<li><code>amgmcp_datasource_list</code> — the UID of the Azure Monitor data source.</li>\n<li><code>amgmcp_query_resource_log</code> — a query the agent composed, run against the Application Insights resource the dashboard points at.</li>\n</ol>\n<p>Each \"what was session N doing?\" was two more <code>query_resource_log</code> calls.</p>\n<p>Step 2 is where the interesting part happens, so I connected the same MCP endpoint to my own coding agent and ran the inspect call myself to see exactly what comes back.</p>\n<p><strong>Summary mode</strong> (no arguments) returns the shape of the dashboard: 21 panels with ids, titles and types; six template variables <em>with their current values</em>; the default time range; and a <code>nextSteps</code> map that tells the agent how to go deeper.</p>\n{\n  \"title\": \"GitHub Copilot\",\n  \"panelCount\": 21,\n  \"panels\": [\n    { \"panelId\": 5,   \"title\": \"Time to First Token by Model (P50 / P90)\", \"type\": \"barchart\" },\n    { \"panelId\": 203, \"title\": \"Tool Latency by Tool (P50 / P90)\",         \"type\": \"barchart\" },\n    { \"panelId\": 204, \"title\": \"Agent Run Duration by Source and Agent\",   \"type\": \"table\" },\n    { \"panelId\": 202, \"title\": \"Telemetry Freshness\",                      \"type\": \"table\" },\n    \"…\"\n  ],\n  \"variables\": [\n    { \"name\": \"sub\",    \"current\": \"&lt;subscription-id&gt;\" },\n    { \"name\": \"rg\",     \"current\": \"my-resource-group\" },\n    { \"name\": \"res\",    \"current\": \"my-app-insights\" },\n    { \"name\": \"source\", \"current\": \"copilot-chat,github-copilot\" },\n    \"…\"\n  ],\n  \"timeRange\": { \"from\": \"now-7d\", \"to\": \"now\" },\n  \"nextSteps\": {\n    \"panel_queries\": \"Set includeQueries=true to get each panel's underlying queries plus `resources`, the Azure resource IDs each target actually runs against …\"\n  }\n}\n<p><strong>Panel-queries mode</strong> returns, for every panel, the query, the data source, and the resource scope, with the template variables resolved on request. This is panel 204, the one that makes long runs visible:</p>\ndependencies\n| where cloud_RoleName in (${source:singlequote})\n| where tostring(customDimensions[\"gen_ai.operation.name\"]) == \"invoke_agent\"\n| extend agent = tostring(customDimensions[\"gen_ai.agent.name\"])\n| summarize Runs = count(),\n    ['P50 Duration'] = round(percentile(duration, 50), 0),\n    ['P90 Duration'] = round(percentile(duration, 90), 0),\n    ['Max Duration'] = max(duration),\n    ['Runs &gt; 10 min'] = countif(duration &gt; 600000)\n    by Source = cloud_RoleName, Agent = iff(isempty(agent), \"(unnamed)\", agent)\n| order by Runs desc\n<p>The agent still has to do the last mile. The query tool sends no time window and doesn't expand Grafana macros, so the agent swaps <code>$__interval</code> for a literal bin size and adds its own <code>| where timestamp &gt; ago(3d)</code>. But the tool description says exactly that. The agent isn't guessing.</p>\n<h2>What's on the map</h2>\n<p>Look at what the dashboard put in that response, and what the agent therefore did not have to figure out.</p>\n<p><strong>Where the data is.</strong> A single Azure Monitor data source can query any resource its identity is allowed to read, and the scope appears nowhere in the KQL. The dashboard's variables resolved it to one Application Insights component. Without that, the first ten minutes of an investigation often go to \"which workspace?\"</p>\n<p><strong>Which table, which attributes.</strong> <code>dependencies</code>, filtered by <code>cloud_RoleName in ('copilot-chat', 'github-copilot')</code> — GitHub Copilot in Visual Studio Code and GitHub Copilot CLI. The <code>source</code> variable <em>is</em> that mapping. Spans are classified by <code>gen_ai.operation.name</code> (<code>chat</code>, <code>execute_tool</code>, <code>invoke_agent</code>); tools by <code>gen_ai.tool.name</code>; tokens by <code>gen_ai.usage.input_tokens</code> and <code>output_tokens</code>. A session is <code>copilot_chat.chat_session_id</code> from VS Code and <code>gen_ai.conversation.id</code> from the CLI, coalesced, because the two clients don't agree.</p>\n<p><strong>The pitfalls.</strong> This is the part I care about most. Three of the panel descriptions:</p>\n<blockquote>\n<p>Time to first token per model (P50 / P90) for measured requests. VS Code reports <code>copilot_chat.time_to_first_token</code> in ms; Copilot CLI reports <code>gen_ai.response.time_to_first_chunk</code> in seconds (converted to ms here).</p>\n</blockquote>\n<blockquote>\n<p>Copilot CLI tool calls that cluster at exactly 60 s, 120 s or 180 s are client-side timeouts, which the CLI reports as successful calls.</p>\n</blockquote>\n<blockquote>\n<p>Agent-run roll-up spans (<code>invoke_agent</code>), which repeat their child requests, are excluded.</p>\n</blockquote>\n<p>Each of those is a mistake I have already made once. Milliseconds versus seconds. Timeouts that look like successes. Roll-up spans that double-count tokens when you sum naively. None of it is derivable from the schema; it is tribal knowledge, and it is sitting in the dashboard JSON where an agent can read it with <code>jsonPath: \"$.panels[*].description\"</code>.</p>\n<p><strong>The questions.</strong> The 21 panel titles are the questions an experienced on-call engineer asks about this system: <em>Time to First Token by Model. Tool Latency by Tool. Tool Call Failures by Tool. LLM Call Outcomes Over Time. Telemetry Freshness</em> — the last one so you can tell \"no problem\" from \"no data\". An agent reading those titles doesn't have to invent a triage plan. It has one.</p>\n<h2>Off the edge of the map</h2>\n<p>Notice what the dashboard does <em>not</em> have: a per-session view. There is no \"longest sessions\" panel; I would have to add one. The agent composed it anyway, from the dashboard's vocabulary:</p>\ndependencies\n| where timestamp &gt; ago(3d)\n| where cloud_RoleName in ('copilot-chat', 'github-copilot')\n| extend op = tostring(customDimensions[\"gen_ai.operation.name\"]),\n    sessId = coalesce(tostring(customDimensions[\"copilot_chat.chat_session_id\"]),\n                      tostring(customDimensions[\"gen_ai.conversation.id\"]))\n| where isnotempty(sessId)\n| summarize Start = min(timestamp), End = max(timestamp), Spans = count(),\n    LLMCalls = countif(op == \"chat\"), ToolCalls = countif(op == \"execute_tool\")\n    by sessId\n| extend DurationMin = round(datetime_diff('second', End, Start) / 60.0, 1)\n| top 3 by DurationMin\n<p>Every identifier in that query came from a panel. The agent walked off the edge of the map, but it took the map's coordinate system along.</p>\n<p>Compare that with what a human does next. The dashboard's <em>Recent Operations</em> table links every run to <em>Trace Visualization</em>, and for one slow tool call that is exactly the right tool. This is session 1's longest run in that view: a single <code>invoke_agent</code> span, 1 hour 18 minutes, 476 spans underneath it.</p>\n<img />\n<p>That view is hard to read end to end. You scroll, sample a few of the long red bars, and move on. The trace is the right shape for \"why was this call slow?\" and the wrong shape for \"what was this run doing?\"</p>\n<p>The agent never looked at this picture. Its per-session stories came from aggregation instead: <code>execute_tool</code> spans grouped by <code>gen_ai.tool.name</code>, <code>chat</code> spans by <code>gen_ai.response.model</code>, P50s and first/last timestamps per group, and the phases fall out in seconds. Same rows, different reader, different question.</p>\n<img />\n<p>With content capture enabled, the spans even carry <code>gen_ai.tool.call.arguments</code> — which is how \"<code>bash</code>, 120 s\" became \"<code>sleep 120</code> — <em>Wait before retrying throttled query</em>\", and how the agent could say <em>backoff</em>, not <em>hang</em>.</p>\n<p>That last step matters more than it looks. The description above says calls clustering at exactly 60/120/180 s are usually client-side timeouts. In session 2 they were the other thing — deliberate sleeps — and only the captured arguments could settle it. A description tells an agent what to check; the telemetry lets it check.</p>\n<h2>Don't write dashboards for agents</h2>\n<p>The tempting takeaway is a new checklist: agents read dashboards now, so write dashboards with agents in mind. I think that is backwards. Nothing in the GitHub Copilot dashboard was written for an agent. The titles are questions because the person on call needs to know what a panel answers without reading its query. The descriptions carry the pitfalls because I hit each one and didn't want the next person to. The variables scope the queries because nobody remembers resource IDs. The freshness panel exists because a human can't tell \"no problem\" from \"no data\" either. An agent can use every one of those.</p>\n<p>Same principle, other direction. What matters to the person on call is what matters to the agent, and the agent is smart enough to work out the rest: the time window, the bin size, a query the dashboard doesn't have yet. If a dashboard is enough for the human, it is enough for the agent. If it isn't enough for the agent, it probably wasn't enough for the next person on call either, and the fix is the same: fix the dashboard, and both readers get it.</p>\n<p>Which brings me to the thing I find genuinely new here. A dashboard used to be a terminal artifact — the end of the pipeline, something you looked at. It is now also an input: a compact, versioned, access-controlled, human-reviewed description of how to reason about a system, in a format agents can execute. It runs the other way as well: session 1, the 142-minute one, was a coding agent building a dashboard through the same endpoint (18 inspects, 162 queries, 3 writes), and the longest-sessions query above could become a panel the same way, so the humans get it next time. The same JSON serves both readers, and you only maintain it once.</p>\n<h2>Connecting SRE Agent to Grafana</h2>\n<p>I expected the plumbing to be the boring ten minutes: find the endpoint, mint a token, paste both into a connector form. It wasn't, because SRE Agent has a native Azure Managed Grafana connector. Search for \"grafana\" under <a href=\"https://learn.microsoft.com/azure/sre-agent/mcp-connectors\" rel=\"noopener\" target=\"_blank\"><strong>Connectors</strong></a>, pick the card, point it at your instance, test the connection, choose the tools. The agent talks to the instance's MCP endpoint with its own managed identity, so you don't have to create or rotate a token.</p>\n<img />\n<h2>Try it</h2>\n<ul>\n<li><strong>Pipeline and dashboards:</strong> <a href=\"https://learn.microsoft.com/azure/managed-grafana/grafana-opentelemetry-app-insights\" rel=\"noopener\" target=\"_blank\">Monitor AI coding agents with Grafana</a> — the OpenTelemetry Collector, the VS Code settings that turn on GitHub Copilot telemetry, and dashboards for GitHub Copilot, Claude Code, Codex, OpenClaw, OpenCode and Gemini CLI.</li>\n<li><strong>The dashboard:</strong> <a href=\"https://aka.ms/amg/dash-doc/gh-copilot\" rel=\"noopener\" target=\"_blank\">GitHub Copilot on Grafana.com</a>, ID 25053, ready to import into an Azure Managed Grafana instance.</li>\n<li><strong>The agent:</strong> in SRE Agent, add the Azure Managed Grafana connector as above. For anything else — VS Code with GitHub Copilot, Claude Code, your own client — point it at <code>https://&lt;grafana-endpoint&gt;/api/azure-mcp</code>; see <a href=\"https://learn.microsoft.com/azure/managed-grafana/grafana-mcp-server\" rel=\"noopener\" target=\"_blank\">Configure an Azure Managed Grafana Remote MCP server</a>.</li>\n</ul>\n<p>Then ask it something lazy.</p>"
