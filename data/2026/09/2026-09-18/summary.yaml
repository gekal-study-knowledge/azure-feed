"overview": |
  この日は 7 件で、大規模ネットワーク接続の一般提供、決済向け HSM の新版プレビュー、そして VM イメージ運用の自動化が話題でした。Azure Virtual Network Manager では、接続グループを使うハイスケールメッシュが一般提供となり、利用可能なリージョンでは 1 つのメッシュ接続構成に既定で最大 3,000 の仮想ネットワークを接続できます。Azure Payments HSM v2 がパブリックプレビューとなり、決済処理・クレデンシャル発行・PIN 処理・鍵管理・認証データ保護向けの、高可用でシングルテナントの Payment HSM サービスとして、顧客が隔離された HSM に対する排他的な管理権限を保持します。アーキテクチャブログでは、小売業が複数都市の店舗網で販促セールを展開するシナリオを題材に、サードパーティ システム (商品・店舗・セールイベント) と ERP (顧客データ) に分かれたデータを扱う記事が 2 本続きました。1 本は OneLake 上のデータを Fabric IQ で扱うエージェント体験、もう 1 本は Dynamics 365 Finance and Operations と Fabric IQ を組み合わせた Foundry IQ を取り上げ、都市によって顧客と店舗が結び付けられる構造をどうモデル化するかを示しています。インフラストラクチャブログでは、Packer と Azure DevOps で VM イメージの作成と検証を自動化する手法が解説されました。ソースイメージから Packer ビルド、Azure Compute Gallery、検証用 VM、エビデンス取得、制御された昇格へと進む流れで、手作業のイメージ管理に起因する構成ドリフトや再現性の低さ、リリースの追跡性の乏しさを避け、各イメージをバージョン管理されたビルド成果物として扱います。セキュリティブログでは、メールセキュリティのベンチマークレポートで配信前・配信後の両シナリオにおける Microsoft Defender の高い実績が示されたこと、そして AI が変えたサイバーセキュリティの環境の中でリスクを確実に減らす基本対策を、エクスポージャー管理のガイダンスとして行動に移す考え方が公開されました。
