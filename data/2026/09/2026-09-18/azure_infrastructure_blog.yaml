  "4e07d8c3be5315753a54b579dafe7703":
    "id": "4e07d8c3be5315753a54b579dafe7703"
    "title": "Automating Azure VM Image Baking and Validation with Packer and Azure DevOps"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/automating-azure-vm-image-baking-and-validation-with-packer-and/ba-p/4557578"
    "published": "2026-09-18 17:15:11"
    "fetched": "2026-09-18 20:55:57"
    "summary": "<blockquote>\n<p><span><strong>Solution at a glance</strong>&nbsp; <br /></span><span>Source image&nbsp; →&nbsp; Packer build&nbsp; →&nbsp; Azure Compute Gallery&nbsp; →&nbsp; Validation VM&nbsp; →&nbsp; Evidence&nbsp; →&nbsp; Controlled promotion</span><span>&nbsp;</span></p>\n</blockquote>\n<h3><span><span>Introduction</span></span><span>&nbsp;</span></h3>\n<p><span>Maintaining enterprise virtual machine images manually can lead to configuration drift, inconsistent builds, slow remediation and limited release traceability. A stronger pattern is to treat each image as a versioned build artefact: create it from a controlled source, configure it deterministically, validate the published image and promote only an explicitly identified version.</span><span>&nbsp;</span></p>\n<p><span>This article presents a generic implementation using HashiCorp Packer and Azure DevOps. The examples intentionally use non-production placeholders and avoid customer-specific names, subscriptions, networks, credentials, repositories, gallery names, certificate material, package sources and internal promotion topology.</span><span>&nbsp;</span></p>\n<h3><span><span>What this article demonstrates</span></span><span>&nbsp;</span></h3>\n<ul>\n<li><span><span>Consolidate</span><span> a layered image process into a </span><span>parameterised</span><span> Packer build.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Preserve image metadata and Azure Marketplace lineage through publication.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Validate the published image version rather than only the temporary build VM.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Publish validation evidence and make promotion decisions traceable.</span></span><span>&nbsp;</span></li>\n</ul>\n<h3><span><span>Solution overview</span></span><span>&nbsp;</span></h3>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-left\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"width: 78.4257%; border-width: 1px;\"><tbody><tr><td>\n<p><span>1. Source</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>2. Build</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>3. Publish</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>4. Validate</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>5. Evidence</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>6. Promote</span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><span>Marketplace image</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Packer + scripts</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Compute Gallery</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Temporary VM</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>JSON + logs</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Approved version</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 16.67%;\" /><col style=\"width: 16.67%;\" /><col style=\"width: 16.67%;\" /><col style=\"width: 16.67%;\" /><col style=\"width: 16.67%;\" /><col style=\"width: 16.67%;\" /></colgroup></table></div>\n<h3><span><span>Reference architecture</span></span><span>&nbsp;</span></h3>\n<p><span>The pipeline separates image creation, validation, security scanning and promotion. This separation makes each release decision explicit and preserves evidence for the exact image version that downstream workloads consume.</span><span>&nbsp;</span></p>\n<blockquote>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN lia-align-left\"><table border=\"1\" class=\"lia-border-style-solid\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><strong><span>Azure DevOps</span></strong>&nbsp;<br /><span>Orchestration</span><span>&nbsp;</span></p>\n</td><td>\n<p><strong><span>Packer</span>&nbsp;</strong><br /><span>Image build</span><span>&nbsp;</span></p>\n</td><td>\n<p><strong><span>Compute Gallery</span></strong>&nbsp;<br /><span>Versioned artefact</span><span>&nbsp;</span></p>\n</td><td>\n<p><strong><span>Validation VM</span></strong>&nbsp;<br /><span>Runtime checks</span><span>&nbsp;</span></p>\n</td><td>\n<p><strong><span>Release gate</span></strong>&nbsp;<br /><span>Promotion</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /><col style=\"width: 20.00%;\" /></colgroup></table></div>\n<p><span><strong>Important</strong>&nbsp; </span><span>A successful Packer build proves that the build completed. It does not prove that the published gallery image behaves correctly when consumed. Validate the published version independently.</span><span>&nbsp;</span></p>\n</blockquote>\n<p>&nbsp;</p>\n<img />\n<h3><span><span>Designing the image build</span></span><span>&nbsp;</span></h3>\n<h6><strong><span><span>Why use a single reproducible build?</span></span><span>&nbsp;</span></strong></h6>\n<p><span>Layered pipelines can be useful, but multiple sequential image builds create intermediate artefacts and dependencies that complicate remediation. Where the complete configuration can be reproduced from source, use one ordered flow: select the source image, configure the operating system, apply the chosen hardening profile, install the runtime, configure trust, run smoke checks, clean up and capture the result.</span><span>&nbsp;</span></p>\n<h6><strong><span><span>Parameterise</span><span> the pipeline</span></span><span>&nbsp;</span></strong></h6>\n<p><span>Keep environment-specific values outside the reusable image logic. Typical queue-time parameters include runtime version, image flavour, build region, optional security scanning and the image version to validate.</span><span>&nbsp;</span></p>\n<h6><strong><span><span>Queue-time pipeline parameters (YAML)</span><span>&nbsp;</span></span></strong></h6>\nparameters: \n- name: runtimeVersion \n  type: string \n  default: '17' \n  values: ['8', '11', '17', '21'] \n- name: imageFlavor \n  type: string \n  default: standard \n  values: [standard, cis] \n- name: enableSecurityScan \n  type: boolean \n  default: false \n- name: location \n  type: string \n  default: eastus \n<h3><span><span>Define the Packer builder and provisioning order</span></span><span>&nbsp;</span></h3>\n<p><span>Use a single template with an explicit provisioning sequence. Fail the build for conditions that make the image unusable; keep advisory checks separate when the release process intentionally treats them as non-blocking</span></p>\n<h6><strong><span><span>Generic Azure builder and inputs (HCL)</span><span>&nbsp;</span></span></strong></h6>\npacker { \n  required_plugins { \n    azure = { \n      source  = \"github.com/hashicorp/azure\" \n      version = \"~&gt; 2.6\" \n    } \n  } \n} \n \nvariable \"location\"        { type = string } \nvariable \"image_name\"      { type = string } \nvariable \"image_version\"   { type = string } \nvariable \"runtime_version\" { type = string } \nvariable \"image_flavour\"   { type = string } \n \nsource \"azure-arm\" \"base\" { \n  use_azure_cli_auth = true \n  location            = var.location \n  os_type             = \"Linux\" \n  vm_size             = \"Standard_D4s_v5\" \n  image_publisher     = \"RedHat\" \n  image_offer         = \"RHEL\" \n  image_sku           = \"8-lvm-gen2\" \n  image_version       = \"latest\" \n  managed_image_resource_group_name = \"rg-image-build\" \n  managed_image_name = \"${var.image_name}-${var.image_version}\" \n} \n<h6><strong><span><span><span>Deterministic provisioning sequence (HCL)</span> </span></span></strong></h6>\nbuild { \n  sources = [\"source.azure-arm.base\"] \n \n  provisioner \"shell\" { script = \"scripts/os-update.sh\" } \n  provisioner \"shell\" { script = \"scripts/configure-system.sh\" } \n  provisioner \"shell\" { \n    environment_vars = [ \n      \"RUNTIME_VERSION=${var.runtime_version}\", \n      \"IMAGE_FLAVOUR=${var.image_flavour}\" \n    ] \n    script = \"scripts/install-runtime.sh\" \n  } \n  provisioner \"shell\" { script = \"scripts/configure-trust.sh\" } \n  provisioner \"shell\" { script = \"scripts/image-smoke-test.sh\" } \n  provisioner \"shell\" { script = \"scripts/image-cleanup.sh\" } \n} \n<p><span><strong>Authentication</strong>&nbsp; </span><span>Use Azure DevOps service connections or workload identity. Do not place client secrets in Packer templates or ordinary YAML parameters, and do not write sensitive values to logs or image artefacts.</span><span>&nbsp;</span></p>\n<p><span><strong>Marketplace lineage</strong>&nbsp; </span><span>When the selected source image includes purchase-plan metadata, preserve the required plan information and verify the gallery definition before promotion.</span><span>&nbsp;</span></p>\n<h3><span><span>Version images independently</span></span><span>&nbsp;</span></h3>\n<p><span>Maintain a separate incrementing version stream for each runtime and image-flavour combination. This keeps versions meaningful within the corresponding image definition.</span><span>&nbsp;</span></p>\n<h6><span><strong><span>Version key concept</span></strong><span>&nbsp;</span></span></h6>\nimageVersion: '8.1.$(imageMinor)' \n# Counter key: &lt;runtime&gt;-&lt;flavour&gt; \n<h3><span><span>Validate the published image</span></span><span>&nbsp;</span></h3>\n<p><span>After publication, deploy a temporary VM from the exact gallery image version, run validation remotely, publish the results and always remove temporary resources.</span><span>&nbsp;</span></p>\n<h6><strong><span>Create and validate a VM from the published version (YAML)</span><span>&nbsp;</span></strong></h6>\n- stage: ValidatePublishedImage \n  dependsOn: BuildImage \n  jobs: \n  - job: ValidationVM \n    steps: \n    - task: AzureCLI@2 \n      inputs: \n        azureSubscription: $(validationServiceConnection) \n        scriptType: bash \n        scriptLocation: inlineScript \n        inlineScript: | \n          set -euo pipefail \n          az vm create \\ \n            --resource-group \"$(validationResourceGroup)\" \\ \n            --name \"$(validationVmName)\" \\ \n            --image \"$(galleryImageVersionId)\" \\ \n            --admin-username imageadmin \\ \n            --generate-ssh-keys \n          az vm run-command invoke \\ \n            --resource-group \"$(validationResourceGroup)\" \\ \n            --name \"$(validationVmName)\" \\ \n            --command-id RunShellScript \\ \n            --scripts @scripts/image-validation.sh \n<h6><strong><span><span>Validation coverage</span></span></strong><span>&nbsp;</span></h6>\n<ul>\n<li><span><span>Operating-system</span><span> baseline and expected distribution/version.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Runtime version and </span><span>required</span><span> environment variables.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Required packages, </span><span>services</span><span> and cloud-agent readiness.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Truststore</span><span> existence and basic integrity.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Expected hardening state for the selected image </span><span>flavour</span><span>.</span></span><span>&nbsp;</span></li>\n</ul>\n<h6><strong><span>Minimal in-guest validation script (Bash)</span><span>&nbsp;</span></strong></h6>\n#!/usr/bin/env bash \nset -euo pipefail \nreport_dir=\"${REPORT_DIR:-validation-results}\" \nmkdir -p \"$report_dir\" \n \ncheck() { \n  local name=\"$1\"; shift \n  if \"$@\"; then \n    printf '%s\\tPASS\\n' \"$name\" | tee -a \"$report_dir/result.txt\" \n  else \n    printf '%s\\tFAIL\\n' \"$name\" | tee -a \"$report_dir/result.txt\" \n    return 1 \n  fi \n} \n \ncheck os-baseline grep -q '^ID=\"rhel\"' /etc/os-release \ncheck runtime-version java -version \ncheck java-home test -n \"${JAVA_HOME:-}\" \ncheck truststore test -s \"${JAVA_HOME}/lib/security/cacerts\" \ncheck cloud-agent systemctl is-active --quiet waagent \n<h6><strong><span><span>Publish evidence and enforce the gate</span></span><span>&nbsp;</span></strong></h6>\n- task: PublishPipelineArtifact@1 \n  displayName: Publish image validation evidence \n  condition: always() \n  inputs: \n    targetPath: validation-results \n    artifact: image-validation \n \n- bash: jq -e '.result == \"PASS\"' validation-results/result.json \n  displayName: Enforce validation gate \n<p><span>The report should identify the image definition and version and provide an explicit result for every check. Correlate build logs, validation artefacts, scan outputs and promotion records with the pipeline run.<br /></span></p>\n<h6><strong><span><span>Promotion and release controls</span></span><span>&nbsp;</span></strong></h6>\n<p><span>Bake once, then promote the same identified image version rather than rebuilding independently for each environment. If validation or scanning is required for a production release, represent that requirement as a pipeline dependency or approval gate.</span><span>&nbsp;</span></p>\n<h6><strong><span>Promotion dependency and approval boundary (YAML)</span><span>&nbsp;</span></strong></h6>\n- stage: Promote \n  dependsOn: \n  - BuildImage \n  - ValidatePublishedImage \n  - SecurityScan \n  condition: | \n    and( \n      succeeded('BuildImage'), \n      succeeded('ValidatePublishedImage'), \n      or( \n        eq('${{ parameters.enableSecurityScan }}', false), \n        succeeded('SecurityScan') \n      ) \n    ) \n  jobs: \n  - deployment: PromoteImage \n    environment: image-production-approval \n    strategy: \n      runOnce: \n        deploy: \n          steps: \n          - bash: ./scripts/promote-image-version.sh \n<h6><strong><span><span>Failure handling and clean-up</span></span><span>&nbsp;</span></strong></h6>\n- task: AzureCLI@2 \n  displayName: Remove temporary validation resources \n  condition: always() \n  inputs: \n    azureSubscription: $(validationServiceConnection) \n    scriptType: bash \n    scriptLocation: inlineScript \n    inlineScript: | \n      az vm delete \\ \n        --resource-group \"$(validationResourceGroup)\" \\ \n        --name \"$(validationVmName)\" --yes || true \n      az disk delete \\ \n        --resource-group \"$(validationResourceGroup)\" \\ \n        --name \"$(validationOsDiskName)\" --yes || true \n<ul>\n<li><span><span>Revoke temporary disk access before </span><span>deleting</span><span> staging resources.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Use the pipeline </span><span>run</span><span> or image version in temporary resource names.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Do not overwrite a successfully published image version.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Define retention for gallery versions and capture intermediates.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Rollback by directing new deployments to </span><span>a previous</span><span> known-good version.</span></span><span>&nbsp;</span></li>\n</ul>\n<h3><span><span>Production considerations</span></span><span>&nbsp;</span></h3>\n<h6><span><span><strong>Release gates</strong></span></span><span>&nbsp;</span></h6>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p><span>Gate</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Expected evidence</span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><span>Build</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Packer completes; the image version reaches a successful provisioning state; expected metadata is present.</span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><span>Functional</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>A VM created from the published version passes OS, runtime, package, service, agent and trust checks.</span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><span>Security</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Hardening and vulnerability outputs meet the organisation’s defined release threshold.</span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><span>Promotion</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>The validated version is copied or replicated without rebuilding, and target metadata matches.</span><span>&nbsp;</span></p>\n</td></tr><tr><td>\n<p><span>Operational</span><span>&nbsp;</span></p>\n</td><td>\n<p><span>Temporary resources are removed, evidence is retained, ownership is clear and rollback is recorded.</span><span>&nbsp;</span></p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h6><strong><span><span>Stable validation contract</span></span><span>&nbsp;</span></strong></h6>\n<p><span>Use a small, predictable report schema so the pipeline, release approvers and downstream automation interpret the same top-level result.</span><span>&nbsp;</span></p>\n<p><span>Example validation report (JSON)</span><span>&nbsp;</span></p>\n{ \n  \"schemaVersion\": \"1.0\", \n  \"image\": { \n    \"definition\": \"rhel-runtime-standard\", \n    \"version\": \"8.1.12\" \n  }, \n  \"result\": \"PASS\", \n  \"checks\": [ \n    {\"name\": \"os-baseline\", \"status\": \"PASS\"}, \n    {\"name\": \"runtime-version\", \"status\": \"PASS\"}, \n    {\"name\": \"truststore\", \"status\": \"PASS\"}, \n    {\"name\": \"required-services\", \"status\": \"PASS\"} \n  ] \n} \n<h6><strong><span><span>Operational checklist</span></span><span>&nbsp;</span></strong></h6>\n<ul>\n<li><span><span>Verify source-image terms and permissions before each bake.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Pin Packer and plug-in versions; test upgrades deliberately.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Give build and promotion identities only the scopes they </span><span>require</span><span>.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Confirm validation targets the same subscription, gallery, </span><span>definition</span><span> and version produced by the build.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Define promotion, retention, retry, notification and ownership policies before production handover.</span></span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>Keep a build summary, validation report, scan output, promotion </span><span>record</span><span> and cleanup record for each released version.</span></span><span>&nbsp;</span></li>\n</ul>\n<h6><strong><span><span>Consumer rollout</span></span><span>&nbsp;</span></strong></h6>\n<p><span>The image pipeline ends at a versioned, validated gallery artefact. Consumers such as Virtual Machine Scale Sets should reference an explicit version during controlled rollout, validate health after deployment and move new deployments to a previous known-good version when rollback is required.</span><span>&nbsp;</span></p>\n<h3><span><span>Conclusion</span></span><span>&nbsp;</span></h3>\n<p><span>Image baking becomes easier to operate when it is treated as a software-delivery problem: source-controlled configuration, deterministic builds, explicit metadata, versioned outputs, independent validation, published evidence and controlled promotion. Packer supplies the repeatable image build, Azure DevOps supplies orchestration and governance, and Azure Compute Gallery supplies the distribution boundary.</span><span>&nbsp;</span></p>\n<p><span>The most important addition is validating the image after publication so release decisions are based on the same artefact that downstream workloads will consume.</span><span>&nbsp;</span></p>\n<p><span><strong>Adapt before use</strong>&nbsp; </span><span>The examples are intentionally generic. Replace placeholder names and policy thresholds for the target environment; keep secrets in protected variables or an approved secret store.</span><span>&nbsp;</span></p>\n<h3><span><span>References</span></span><span>&nbsp;</span></h3>\n<ul>\n<li><span><span>Azure Pipelines runtime parameters: </span></span><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters\" rel=\"noopener\" target=\"_blank\"><span><span>https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters</span></span></a><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><span><span>HashiCorp</span><span> Packer Azure ARM builder: <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters</a></span></span></li>\n</ul>\n<ul>\n<li><span><span>Create Linux Azure VM images with Packer: <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters</a></span></span></li>\n</ul>\n<ul>\n<li><span><span>Azure Infrastructure Blog: <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters\" rel=\"noopener\" target=\"_blank\">https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters</a></span></span></li>\n</ul>\n<ul>\n<li><span><span>Deploying custom images and implementing CI/CD for Azure Virtual Machine Scale Sets: </span></span><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters\" rel=\"noopener\" target=\"_blank\"><span><span>https://techcommunity.microsoft.com/blog/azureinfrastructureblog/deploying-custom-images-and-implementing-cicd-for-azure-virtual-machine-scale-se/4556902</span></span></a><span>&nbsp;</span></li>\n</ul>"
