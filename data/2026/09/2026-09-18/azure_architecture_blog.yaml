    "title": "Agent experience with data in Onelake using Fabric IQ"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/agent-experience-with-data-in-onelake-using-fabric-iq/ba-p/4557504"
    "published": "2026-09-18 08:57:52"
    "fetched": "2026-09-18 20:55:56"
    "summary": "<p><strong>Business Scenario</strong></p>\n<p>A retail organization runs <strong>multiple promotional sales events</strong> across its store network in different cities, featuring various product categories.</p>\n<p>Data is captured from:</p>\n<ul>\n<li>Third-party systems (products, stores, sales events)</li>\n<li>ERP system i.e. Finance and Operations (customer data)</li>\n</ul>\n<p>Customers are linked to stores <strong>based on city in the ERP system</strong>, and each store hosts specific sales events.</p>\n<p>However, while significant investments are made in <strong>marketing campaigns, inventory allocation, and event planning</strong>, the organization needs to identify</p>\n<ul>\n<li>Which <strong>stores generate the highest revenue during events</strong></li>\n<li>Which <strong>locations are having majority of customer footprint</strong></li>\n</ul>\n<p><strong>Solution</strong>:</p>\n<p>Rather than creating custom reports on raw data, an <strong>agent</strong> can leverage the data in <strong>Onelake</strong> and use <strong>Fabric semantic models and Fabric IQ</strong> to provide conversational analytics. The agent can intelligently normalize user inputs and return accurate results even when values such as city names are entered with spelling errors or variations.</p>\n<p>&nbsp;</p>\n<p><strong>Advantage</strong>:</p>\n<p>Because the data comes from two disconnected worlds (third-party systems for products/stores/events, ERP for customers), the \"join\" between them — customer → city → store → event → product — is business logic, not a database key. Fabric Ontology captures exactly that: entity types, relationships, rules and source mappings, so agents don't have to rediscover it from raw tables each time.</p>\n<p>&nbsp;</p>\n<p><strong>A. Prerequisite:</strong></p>\n<p><strong>Data Sources &amp; Relationships Overview</strong></p>\n<ul>\n<li>Product, store, and sales event data are sourced from <strong>third-party systems</strong>.</li>\n<li>Customer data is sourced from the <strong>ERP (Dynamics 365 Finance &amp; Operations)</strong> system through Fabric lakehouse.</li>\n</ul>\n<p><strong>How the data is connected:</strong></p>\n<ul>\n<li>Customers are linked to stores based on <strong>city alignment</strong> (customer city = store location).</li>\n<li>Sales events are associated with:</li>\n<ul>\n<li>The <strong>products being sold</strong>, and</li>\n<li>The <strong>stores where the events are conducted</strong>.</li>\n</ul>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Licenses and access requirement:</strong></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><td>\n<p><strong>Component</strong></p>\n</td><td>\n<p><strong>License / Requirement</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p>Microsoft Fabric</p>\n</td><td>\n<p><strong>Fabric Capacity F2 or higher</strong> OR <strong>Power BI Premium Capacity P1 or higher with Fabric enabled</strong></p>\n</td></tr><tr><td>\n<p>Fabric IQ Ontology</p>\n</td><td>\n<p><strong>Ontology (Preview) enabled</strong> and an active Ontology item in Fabric</p>\n</td></tr><tr><td>\n<p>Copilot Studio</p>\n</td><td>\n<p>A <strong>Copilot Studio environment</strong> where MCP tools are allowed</p>\n</td></tr><tr><td>\n<p>D365 F&amp;O</p>\n</td><td>\n<p>Valid <strong>Dynamics 365 Finance and/or Supply Chain Management licenses</strong> for the source users and data access</p>\n</td></tr><tr><td>\n<p>Data movement</p>\n</td><td>\n<p>Fabric ingestion pattern (Lakehouse, OneLake, Dataflow, Link to Fabric, etc.) as applicable</p>\n</td></tr></tbody></table></div>\n<p>&nbsp;</p>\n<p><strong>B. Step by step configuration:&nbsp;</strong></p>\n<p>&nbsp;</p>\n<ol>\n<li>Push the data to OneLake : Connect D365 F&amp;O customer data to Fabric Lakehouse through PowerPlatform</li>\n</ol>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Ref</strong>: <a href=\"https://learn.microsoft.com/en-us/power-apps/maker/data-platform/azure-synapse-link-view-in-fabric\" target=\"_blank\">Link your Dataverse environment to Microsoft Fabric and unlock deep insights - Power Apps | Microsoft Learn</a></p>\n<ol start=\"2\">\n<li><strong> </strong>A Lake house will be created in Fabric with the data</li>\n</ol>\n<img />\n<p>&nbsp;</p>\n<ol start=\"3\">\n<li><strong> </strong>Ingest the Data for <strong>Store , Sales event and Product</strong> from third party system to Fabric using any of the methods as outlined in the documentation below (as relevant)</li>\n</ol>\n<p><strong>Ref</strong>: <a href=\"https://learn.microsoft.com/en-us/fabric/data-engineering/load-data-lakehouse\" target=\"_blank\">https://learn.microsoft.com/en-us/fabric/data-engineering/load-data-lakehouse</a></p>\n<p>&nbsp;</p>\n<ol start=\"4\">\n<li><strong> </strong><strong>Create a semantic model and relationship between them</strong></li>\n</ol>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Ref</strong>: <a href=\"https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-build-report\" target=\"_blank\">https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-build-report</a></p>\n<p>&nbsp;</p>\n<ol start=\"5\">\n<li><strong> </strong><strong>Create Ontology using the semantic model</strong></li>\n</ol>\n<p><strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </strong></p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Ref: </strong><a href=\"https://learn.microsoft.com/en-us/fabric/iq/ontology/concepts-generate\" target=\"_blank\">https://learn.microsoft.com/en-us/fabric/iq/ontology/concepts-generate</a></p>\n<p><strong>&nbsp;Ref: </strong><a href=\"https://learn.microsoft.com/en-us/training/modules/create-ontology-with-fabric-iq/\" target=\"_blank\">Create an Ontology with Fabric IQ - Training | Microsoft Learn</a></p>\n<p>&nbsp;</p>\n<p>Click on View entity type details &gt; click on manage relationship &gt; click on the relation</p>\n<p><strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </strong></p>\n<img />\n<p>&nbsp;</p>\n<p>Configure the source and target entity names and connected fields. Repeat similar setup for others as relevant</p>\n<p><strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </strong></p>\n<img />\n<p>&nbsp;</p>\n<ol start=\"6\">\n<li><strong> </strong><strong>Login to </strong><a href=\"https://copilotstudio.preview.microsoft.com/\" target=\"_blank\"><strong>https://copilotstudio.preview.microsoft.com/</strong></a><strong> and Create Copilot studio agent with following instruction:</strong></li>\n</ol>\n<p><strong>&nbsp;</strong></p>\n<p><em>When processing a user query:</em></p>\n<ol>\n<li><em> </em><em>Determine whether the user input contains a city name, location name, region, state, or geographical reference.</em></li>\n<li><em> </em><em>If a location reference is detected:</em></li>\n</ol>\n<p>o&nbsp;&nbsp; <em>Identify potential spelling mistakes, abbreviations, alternate spellings, phonetic variations, or non-standard user input using the&nbsp; &lt;&lt;custom prompt&gt;&gt;.</em></p>\n<p>o&nbsp;&nbsp; <em>Normalize the value to the most likely official city name used in the enterprise data model.</em></p>\n<p>o&nbsp;&nbsp; <em>Examples: </em></p>\n<ul>\n<li><em>\"Bombay\" → \"Mumbai\"</em></li>\n<li><em>\"NYC\" → \"New York\"</em></li>\n</ul>\n<ol start=\"3\">\n<li><em> </em><em>Use only the normalized location value when querying Fabric IQ.</em></li>\n<li><em> </em><em>If confidence in the normalization is high, proceed automatically without asking the user for confirmation.</em></li>\n<li><em> </em><em>If multiple cities are equally likely matches, ask a clarifying question before querying Fabric IQ.</em></li>\n<li><em> </em><em>When invoking Fabric IQ MCP:</em></li>\n</ol>\n<p>o&nbsp;&nbsp; <em>Replace the original user-entered city value with the normalized city value.</em></p>\n<p>o&nbsp;&nbsp; <em>Use the normalized value consistently across all ontology searches and filters.</em></p>\n<ol start=\"7\">\n<li><em> </em><em>Never expose the internal normalization process unless the user explicitly asks how the result was determined.</em></li>\n<li><em> </em><em>Return the business result based on data retrieved from Fabric IQ, not based on assumptions.</em></li>\n</ol>\n<p><em>Example: User: \"Show sales for Bangaluru last quarter\" Normalized City: \"Bengaluru\" Fabric IQ Query: \"Show sales for Bengaluru last quarter\"</em></p>\n<p><strong>&nbsp;</strong></p>\n<ol start=\"7\">\n<li><strong> </strong><strong>Add Fabric IQ MCP tool</strong></li>\n</ol>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Click on Fabric IQ MCP and provide workspace ID and Ontology ID as retrieved from the Ontology URL in Fabric</p>\n<p>To find the URL, follow these steps:</p>\n<ul>\n<li>Open your ontology item in Fabric.</li>\n<li>View the URL in the browser, in the format https://app.fabric.microsoft.com/groups/&lt;workspace-ID&gt;/ontologies/&lt;ontology-item-ID&gt;.</li>\n<li>Copy the values of &lt;workspace-ID&gt; and &lt;ontology-item-ID&gt; from the URL.</li>\n</ul>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<ul>\n<li>Form the MCP server URL by entering the copied values into this string: https://api.fabric.microsoft.com/v1/mcp/dataPlane/workspaces/&lt;<strong>workspace-ID</strong>&gt;/items/&lt;<strong>ontology-item-ID</strong>&gt;/ontologyEndpoint.You use this MCP server URL in the next section</li>\n<li>Following figures explains the details once the process</li>\n</ul>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<img />\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>&nbsp;&nbsp;&nbsp;&nbsp; Ref</strong>: <a href=\"https://learn.microsoft.com/en-us/fabric/iq/ontology/how-to-create-agent-copilot-studio\" target=\"_blank\">https://learn.microsoft.com/en-us/fabric/iq/ontology/how-to-create-agent-copilot-studio</a></p>\n<p>&nbsp;</p>\n<ol start=\"8\">\n<li>Add a tool<strong> Prompt </strong>to ensure normalised search<strong> </strong>for any user input (e.g. City)</li>\n</ol>\n<p>&nbsp;&nbsp;&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Put the following instruction in a custom prompt :</p>\n<p><em>You are a location normalization expert.</em></p>\n<p><em>&nbsp;Your task is to identify the most likely city name from the user's input, even when:</em></p>\n<p><em>- The city name contains spelling mistakes.</em></p>\n<p><em>- The city name is partially entered.</em></p>\n<p><em>- The city is entered using an old or alternate name.</em></p>\n<p><em>- The city contains abbreviations or phonetic spellings.</em></p>\n<p><em>&nbsp;</em></p>\n<p><em>Rules:</em></p>\n<ol>\n<li><em> Determine the most likely official city name.</em></li>\n<li><em> Correct spelling mistakes using geographic knowledge.</em></li>\n<li><em> Expand abbreviations where appropriate.</em></li>\n<li><em> Return only the normalized city name.</em></li>\n<li><em> If confidence is below 80%, return \"AMBIGUOUS\".</em></li>\n<li><em> Never invent a city when multiple equally likely matches exist.</em></li>\n</ol>\n<p><em>&nbsp;Examples:</em></p>\n<p><em>&nbsp;Input: Banglore</em></p>\n<p><em>Output: Bengaluru&nbsp;</em></p>\n<p><em>Input: Mumbi</em></p>\n<p><em>Output: Mumbai</em></p>\n<p><em>Input: BNG</em></p>\n<p><em>Output: Bengaluru&nbsp;</em></p>\n<p><em>Input: Londn</em></p>\n<p><em>Output: London&nbsp;</em></p>\n<p><strong><em>City input: {{CityName}}</em></strong></p>\n<p><strong><em>Output format:</em></strong></p>\n<p><strong><em>{</em></strong></p>\n<p><strong><em>\"normalizedCity\": \"Bengaluru\",</em></strong></p>\n<p><strong><em>\"confidence\": 0.95</em></strong></p>\n<p><strong><em>}</em></strong></p>\n<p>&nbsp;</p>\n<ol start=\"9\">\n<li><strong> Test the agent</strong></li>\n</ol>\n<ul>\n<li>Open the Test pane using the Test button in the top right corner of the screen. Enter NL query</li>\n<li>Allow the MCP tool when prompted</li>\n</ul>\n<img />\n<p>&nbsp;</p>\n<p><strong>Test case 1</strong>: <strong>What is the top product revenue across all stores?</strong></p>\n<p>&nbsp;</p>\n<img />\n<p><strong>Test case 2:&nbsp;</strong><strong>Intelligent Location Normalization with Fabric IQ</strong></p>\n<p><strong>&nbsp;</strong></p>\n<p>When a user submits a query such as \"Compare the customer footfall between city Blr and Hyd\", the agent first applies an AI-powered normalization layer before querying enterprise data.</p>\n<p>The normalization prompt analyses abbreviations, alternate spellings, phonetic variations, and non-standard location references, mapping them to their canonical business values. In this example:</p>\n<p>Blr → Bengaluru (Bangalore)</p>\n<p>Hyd → Hyderabad</p>\n<p>The normalized city names are then passed to Fabric IQ for semantic retrieval against the ontology and underlying data sources. This approach improves query accuracy, reduces dependency on exact user input, and enables a more natural conversational experience while ensuring consistent reporting and analytics results.</p>\n<p><strong>Process Flow :</strong></p>\n<p>User Query</p>\n<p>&nbsp;→ AI Prompt Normalization</p>\n<p>&nbsp;→ Canonical City Resolution (Bengaluru, Hyderabad)</p>\n<p>&nbsp;→ Fabric IQ Semantic Search</p>\n<p>&nbsp;→ Data Retrieval &amp; Comparison Results</p>\n<p>&nbsp;</p>"
