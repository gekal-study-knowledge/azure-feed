"overview": |
  この日は 3 件で、データベースのプレビュー更新と、クラウドを狙った攻撃の分析でした。Azure HorizonDB が PostgreSQL 18 のサポートを含めてパブリックプレビューとなりました。HorizonDB は、スケーラブルで高性能なワークロードのために設計された、PostgreSQL 互換のフルマネージドかつクラウドネイティブなデータベースサービスです。セキュリティブログでは、侵害したサービスプリンシパルを使ったエージェント駆動のクラウド攻撃として Storm-3168 の分析が公開されました。JADEPUFFER に関連する Azure 環境の偵察、リソースの削除、認証情報へのアクセスといった活動を Storm-3168 によるものと特定し、防御側向けの指針がまとめられています。このほか、マルチモーダルな生成 AI で製造現場の作業手順書を自動生成するソリューションが紹介されました。製造業では、現場に蓄積された暗黙知や組み立ての実演を標準作業手順に落とし込むのに大きな工数がかかり、手作業ゆえに内容がばらつき、工場・製品ライン・地域をまたいで展開しづらいという課題があります。この構成では、組み立て作業の動画を Azure Blob Storage に置き、Web アプリからパイプラインを起動すると、Azure Functions がジョブを作成して Azure Cosmos DB に状態を記録し、Azure Queue Storage 経由で文字起こしをワーカーに渡す、という非同期の処理でレビュー可能な図解入りの手順書へ変換します。文書化の工数を大幅に減らし、新人の立ち上がりを早め、現場の重要な知識を残すことを狙いとしています。
