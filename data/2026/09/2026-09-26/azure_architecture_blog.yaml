    "title": "From Camera to Canvas: How Multimodal GenAI Automates Shop Floor Instructions"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/from-camera-to-canvas-how-multimodal-genai-automates-shop-floor/ba-p/4557740"
    "published": "2026-09-26 03:56:13"
    "fetched": "2026-09-26 23:47:48"
    "summary": "<h2>Scenario</h2>\n<p>Across the industry, manufacturing organizations spend significant engineering effort converting tribal knowledge and assembly demonstrations into standardized work instructions. This process is traditionally manual, inconsistent, and difficult to scale across plants, product lines, and geographies. By integrating multimodal Generative AI directly into supply chain workflows on Azure, this solution automates the transformation of raw assembly videos into reviewable, illustrated work instructions—dramatically reducing documentation effort, accelerating worker onboarding, and preserving critical operational knowledge.</p>\n<p>&nbsp;</p>\n<h2>Solution Components and Architecture</h2>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<h3>Assembly Video to Manufacturing Document Execution Flow</h3>\n<ol>\n<li><strong> Video Ingestion and Job Creation</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">The user selects an assembly video from the web application and starts a pipeline run. The API creates a job record and places a transcription request onto a queue for asynchronous processing.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Components</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\"><strong>Web Review Application:</strong>&nbsp;Lists available videos and starts pipeline runs.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>video</em>):</strong>&nbsp;Stores source assembly videos.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Functions (<em>StartJob</em>):</strong>&nbsp;Creates and initiates the job.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Cosmos DB (<em>assembly-pipeline/jobs</em>):</strong>&nbsp;Records job status, source video, timestamps, and progress.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Queue Storage (<em>transcription-jobs</em>):</strong>&nbsp;Delivers the transcription request to the worker.</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;A tracked pipeline job and queued transcription request.</p>\n<p>&nbsp;</p>\n<ol start=\"2\">\n<li><strong> Audio Extraction and Transcription</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">The queue-triggered worker downloads the source video, extracts mono 16-kHz WAV audio, divides long recordings into chunks, and submits each chunk to Whisper.</p>\n<p class=\"lia-indent-padding-left-30px\">The resulting segments are merged into a timestamped transcript. Repeated phrases, chunk overlaps, and common transcription artifacts are removed.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Components</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Functions (<em>TranscriptionWorker</em>):</strong>&nbsp;Coordinates transcription processing.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>FFmpeg:</strong>&nbsp;Extracts and divides the audio.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure OpenAI Whisper:</strong>&nbsp;Converts speech into timestamped text.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>audio</em>):</strong>&nbsp;Stores extracted audio.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>transcripts</em>):</strong>&nbsp;Stores transcript JSON.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Cosmos DB:</strong>&nbsp;Records progress and transcript metadata.</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Quality controls</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">Retry handling for temporary service failures and rate limits.</li>\n<li class=\"lia-indent-padding-left-30px\">Transcript cleanup and boundary deduplication.</li>\n<li class=\"lia-indent-padding-left-30px\">Recommended enhancement: benchmark transcription models using evaluations.&nbsp;</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;Clean, consolidated, timestamped transcript.</p>\n<p>&nbsp;</p>\n<ol start=\"3\">\n<li><strong> Transcript Review and Approval</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">The transcript is presented to a human reviewer. The reviewer can approve it or provide corrections. GPT-5.1 applies submitted feedback and stores a revised transcript for another review cycle.</p>\n<p class=\"lia-indent-padding-left-30px\">The pipeline cannot proceed until the transcript is approved.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Components</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\"><strong>Web Review Application:</strong>&nbsp;Displays the transcript and captures feedback.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Functions (<em>SubmitFeedback</em>,&nbsp;<em>ApproveStage</em>):</strong>&nbsp;Processes feedback and approval.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure OpenAI GPT-5.1:</strong>&nbsp;Applies transcript corrections.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>transcripts</em>):</strong>&nbsp;Versions revised transcripts.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Cosmos DB:</strong>&nbsp;Maintains approval status and the current preview.</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Quality Gate:</strong>&nbsp;Human transcript accuracy check.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;Human-approved transcript.</p>\n<p>&nbsp;</p>\n<ol start=\"4\">\n<li><strong> Assembly Step Identification</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">After transcript approval, GPT-5.1 analyzes the timestamped content and converts it into a structured manufacturing procedure.</p>\n<p class=\"lia-indent-padding-left-30px\">The generated JSON includes:</p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">Document and product information</li>\n<li class=\"lia-indent-padding-left-30px\">Numbered assembly instructions</li>\n<li class=\"lia-indent-padding-left-30px\">Part numbers and quantities</li>\n<li class=\"lia-indent-padding-left-30px\">Required tools and fixtures</li>\n<li class=\"lia-indent-padding-left-30px\">Safety warnings</li>\n<li class=\"lia-indent-padding-left-30px\">Step-specific notes</li>\n<li class=\"lia-indent-padding-left-30px\">Source-video timestamps</li>\n<li class=\"lia-indent-padding-left-30px\">Training requirements</li>\n<li class=\"lia-indent-padding-left-30px\">Technical glossary</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Components</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Functions (<em>IdentifySteps</em>):</strong>&nbsp;Constructs the prompt and coordinates model execution.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure OpenAI GPT-5.1:</strong>&nbsp;Generates the structured procedure.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>procedures</em>):</strong>&nbsp;Stores procedure JSON.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Cosmos DB:</strong>&nbsp;Stores the procedure preview and workflow status.</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Recommended automated evaluations</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">Step completeness and sequence</li>\n<li class=\"lia-indent-padding-left-30px\">Safety-instruction coverage</li>\n<li class=\"lia-indent-padding-left-30px\">Part-number accuracy</li>\n<li class=\"lia-indent-padding-left-30px\">Groundedness against the transcript</li>\n<li class=\"lia-indent-padding-left-30px\">Unsupported-instruction and hallucination detection</li>\n<li class=\"lia-indent-padding-left-30px\">JSON schema and structure validation</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;Structured assembly-procedure JSON.</p>\n<p>&nbsp;</p>\n<ol start=\"5\">\n<li><strong> Step Review and Approval</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">The generated procedure is presented to a reviewer for validation. The reviewer checks the instructions, sequence, parts, tools, timestamps, and safety information.</p>\n<p class=\"lia-indent-padding-left-30px\">Feedback is applied through GPT-5.1, and the revised procedure remains in review until approved.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Components</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\"><strong>Web Review Application:</strong>&nbsp;Presents structured instructions.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Functions (<em>SubmitFeedback</em>,&nbsp;<em>ApproveStage</em>):</strong>&nbsp;Coordinates revision and approval.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure OpenAI GPT-5.1:</strong>&nbsp;Revises the procedure using reviewer feedback.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>procedures</em>):</strong>&nbsp;Stores revised procedures.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Cosmos DB:</strong>&nbsp;Tracks feedback and approval state.</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Quality Gate:</strong>&nbsp;Human procedure-quality check.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;Human-approved assembly procedure.</p>\n<p>&nbsp;</p>\n<ol start=\"6\">\n<li><strong> Reference Frame Extraction</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">For every approved step, the system locates the associated video timestamps and extracts several nearby candidate frames.</p>\n<p class=\"lia-indent-padding-left-30px\">OpenCV calculates a sharpness score using Laplacian variance. The sharpest candidate is selected to avoid blurry or transitional images.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Components</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Functions (<em>ExtractFrames</em>):</strong>&nbsp;Builds and executes the extraction plan.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>FFmpeg:</strong>&nbsp;Captures candidate video frames.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>OpenCV:</strong>&nbsp;Scores image sharpness.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>frames</em>):</strong>&nbsp;Stores selected PNG images.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Cosmos DB:</strong>&nbsp;Records stage progress.</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Quality controls</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">Multiple candidates per timestamp</li>\n<li class=\"lia-indent-padding-left-30px\">Configurable action-time offset</li>\n<li class=\"lia-indent-padding-left-30px\">Sharpness-based selection</li>\n<li class=\"lia-indent-padding-left-30px\">Video-duration boundary checks</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;Best-quality reference images for each assembly step.</p>\n<p>&nbsp;</p>\n<ol start=\"7\">\n<li><strong> Manufacturing Document Generation</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">The approved procedure and selected images are assembled into technician-ready manufacturing instructions.</p>\n<p class=\"lia-indent-padding-left-30px\">The documents contain product information, revision details, parts and tools tables, safety warnings, illustrated instructions, notes, and a technical glossary.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Components</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Functions (<em>GenerateDocumentation</em>):</strong>&nbsp;Coordinates document creation.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>python-docx:</strong>&nbsp;Generates the editable Word document.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>ReportLab:</strong>&nbsp;Generates the PDF.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Blob Storage (<em>reports</em>):</strong>&nbsp;Stores final DOCX and PDF files.</li>\n<li class=\"lia-indent-padding-left-30px\"><strong>Azure Cosmos DB:</strong>&nbsp;Records report paths and completion status.</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;Draft manufacturing document in DOCX and PDF formats.</p>\n<p>&nbsp;</p>\n<ol start=\"8\">\n<li><strong> SME Validation and Publication</strong></li>\n</ol>\n<p class=\"lia-indent-padding-left-30px\">A subject-matter expert reviews the generated document for technical correctness, operational usability, safety coverage, and image relevance.</p>\n<p class=\"lia-indent-padding-left-30px\">The SME can approve the document, reject it, or request corrections before publication.</p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Validation areas</strong></p>\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">\n<ul class=\"lia-indent-padding-left-30px\">\n<li class=\"lia-indent-padding-left-30px\">Instruction accuracy and completeness</li>\n<li class=\"lia-indent-padding-left-30px\">Correct assembly sequence</li>\n<li class=\"lia-indent-padding-left-30px\">Part-number and tool accuracy</li>\n<li class=\"lia-indent-padding-left-30px\">Safety-content coverage</li>\n<li class=\"lia-indent-padding-left-30px\">Image-to-step alignment</li>\n<li class=\"lia-indent-padding-left-30px\">Terminology and formatting</li>\n<li class=\"lia-indent-padding-left-30px\">Readiness for shop-floor use</li>\n</ul>\n</li>\n</ul>\n<p class=\"lia-indent-padding-left-30px\"><strong>Output:</strong>&nbsp;Approved manufacturing work instruction.</p>\n<p class=\"lia-indent-padding-left-30px\"><em>The current application implements transcript and procedure approval, but a separate post-generation SME approval state is not yet implemented. It is a recommended workflow enhancement.</em></p>\n<h3>Component Table</h3>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><td>\n<p><strong>Stage</strong></p>\n</td><td>\n<p><strong>Primary activity</strong></p>\n</td><td>\n<p><strong>Components</strong></p>\n</td><td>\n<p><strong>Stored output</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p>Ingestion</p>\n</td><td>\n<p>Select video and create job</p>\n</td><td>\n<p>Web UI, Functions, Cosmos DB, Queue Storage</p>\n</td><td>\n<p>Job record</p>\n</td></tr><tr><td>\n<p>Transcription</p>\n</td><td>\n<p>Extract audio and generate text</p>\n</td><td>\n<p>Functions, FFmpeg, Whisper</p>\n</td><td>\n<p>Audio and transcript</p>\n</td></tr><tr><td>\n<p>Transcript review</p>\n</td><td>\n<p>Correct and approve transcript</p>\n</td><td>\n<p>Web UI, GPT-5.1, Functions</p>\n</td><td>\n<p>Approved transcript</p>\n</td></tr><tr><td>\n<p>Step identification</p>\n</td><td>\n<p>Generate structured instructions</p>\n</td><td>\n<p>GPT-5.1, Functions</p>\n</td><td>\n<p>Procedure JSON</p>\n</td></tr><tr><td>\n<p>Step review</p>\n</td><td>\n<p>Validate instructions</p>\n</td><td>\n<p>Web UI, GPT-5.1, Functions</p>\n</td><td>\n<p>Approved procedure</p>\n</td></tr><tr><td>\n<p>Frame extraction</p>\n</td><td>\n<p>Select reference images</p>\n</td><td>\n<p>FFmpeg, OpenCV, Functions</p>\n</td><td>\n<p>PNG frames</p>\n</td></tr><tr><td>\n<p>Document generation</p>\n</td><td>\n<p>Create manufacturing documents</p>\n</td><td>\n<p>python-docx, ReportLab</p>\n</td><td>\n<p>DOCX and PDF</p>\n</td></tr><tr><td>\n<p>SME validation</p>\n</td><td>\n<p>Final technical approval</p>\n</td><td>\n<p>SME review workflow</p>\n</td><td>\n<p>Approved document</p>\n</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p><strong>&nbsp;</strong></p>\n<p class=\"lia-indent-padding-left-30px\"><strong>Cross-Cutting Components</strong></p>\n<ul>\n<li>\n<ul>\n<li><strong>Azure Cosmos DB:</strong>&nbsp;Tracks status, progress, approvals, errors, and artifact locations.</li>\n<li><strong>Azure Blob Storage:</strong>&nbsp;Stores all input, intermediate, frontend, deployment, and output artifacts.</li>\n<li><strong>Managed Identity and RBAC:</strong>&nbsp;Authenticate backend access to Storage, Cosmos DB, and AI services.</li>\n<li><strong>Application Insights and Log Analytics:</strong>&nbsp;Capture telemetry, failures, and operational diagnostics.</li>\n<li><strong>Retry and Recovery:</strong>&nbsp;Resume failed jobs from their last completed processing stage.</li>\n<li><strong>AI Quality Assurance:</strong>&nbsp;Combines automated evaluation with human approval gates.</li>\n</ul>\n</li>\n</ul>\n<h2>Demo</h2>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>&nbsp;</p>\n<h2>Security Considerations</h2>\n<p><strong>Azure Blob Storage:</strong> Use separate quarantine, processing, and approved-output containers for source videos, extracted media, transcripts, and generated manuals. Keep uploads quarantined until Azure Functions validates the file and Azure AI <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image?tabs=visual-studio%2Cwindows&amp;pivots=programming-language-foundry-portal\" rel=\"noopener\" target=\"_blank\">Content Safety</a> assesses representative frames; the application must enforce the result and release only reviewed outputs. Restrict access through a <a href=\"https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview\" rel=\"noopener\" target=\"_blank\">private endpoint</a>, disable public and anonymous access, and assign each function a least-privilege managed identity at container scope. Require TLS 1.2+, encryption at rest, and short-lived user-delegation SAS tokens only when needed. Enable <a href=\"https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction\" rel=\"noopener\" target=\"_blank\">Defender for Storage</a>, diagnostic logging, versioning, soft delete, lifecycle retention, and Azure Policy to detect threats, remove temporary artifacts, and recover source or generated content without publishing unapproved instructions.</p>\n<p><strong>Azure Cosmos DB:</strong> Store only pipeline metadata, transcripts, review status, and Blob references—not media files. Restrict access to the Azure Functions <a href=\"https://www.google.com/url?sa=E&amp;q=https%3A%2F%2Flearn.microsoft.com%2Fen-us%2Fazure%2Fcosmos-db%2Fhow-to-configure-vnet-service-endpoint\" rel=\"noopener\" target=\"_blank\">VNet</a> through a private endpoint and least-privilege managed identities. Partition by job or assembly ID, validate AI-generated fields, and never store secrets. Require TLS 1.2+ and encryption at rest, and enable <a href=\"https://www.google.com/url?sa=E&amp;q=https%3A%2F%2Ftechcommunity.microsoft.com%2FOverview%2520of%2520Defender%2520for%2520Azure%2520Cosmos%2520DB%2520-%2520Microsoft%2520Defender%2520for%2520Cloud%2520%7C%2520Microsoft%2520Learn\" rel=\"noopener\" target=\"_blank\">Defender for Cosmos DB</a>, logging, TTL, continuous backup, and Azure Policy for threat detection, retention, recovery, and compliance.</p>\n<p><strong>Azure Functions: </strong>Use separate pipeline functions with least-privilege managed identities for Blob Storage, Cosmos DB, Azure OpenAI, and Key Vault. Keep service traffic private, require HTTPS and Entra ID for operator APIs, and validate uploads, AI outputs, and approval status at every stage. Never log media, secrets, tokens, or sensitive transcripts. Use queue retries, poison-message handling, idempotency, and correlation IDs to prevent duplicate processing or unreviewed publishing. Monitor failures and publishing events with Application Insights, Azure Monitor, and <a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/security-concepts\" rel=\"noopener\" target=\"_blank\">Defender for Cloud</a>, and enforce security standards with Azure Policy.</p>\n<p><strong>Microsoft Foundry: </strong>Use a dedicated project with approved models and least-privilege access for Azure Functions, developers, reviewers, and administrators. Keep connections to Blob Storage, Cosmos DB, and Key Vault private. Minimize data sent to models, defend against prompt injection, validate generated parts, timestamps, safety warnings, and steps, and require expert approval before publishing. Encrypt data, avoid sensitive content in logs, and use Defender for AI Services, <a href=\"https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture\" rel=\"noopener\" target=\"_blank\">AI Security Posture Management</a>, Purview, and Azure Policy to detect threats and enforce governance.</p>\n<p><strong>AI Model:</strong> Only verified and <a href=\"https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security\" rel=\"noopener\" target=\"_blank\">approved</a> models should be deployable, with centralized registration, security validation, RBAC controls, auditability, and policy-based enforcement. AI applications should be designed with layered defenses, including multi‑stage content filtering, safety meta‑prompts, and least‑privilege permissions for agents and plugins to reduce the risk of prompt injection, data leakage, and unintended actions. Enforce <a href=\"https://learn.microsoft.com/en-us/azure/azure-sovereign-clouds/public/ai-workloads-sovereignty\" rel=\"noopener\" target=\"_blank\">model provenance</a>, integrity validation, approval workflows, policy-based deployment controls, and lifecycle auditability.</p>\n<h2>Related Scenarios</h2>\n<p><strong>Equipment Maintenance</strong>: Organizations often rely on experienced technicians to perform complex maintenance and repair procedures, yet much of this knowledge remains undocumented or difficult to scale. By recording maintenance activities and technician narration, multimodal AI can automatically generate standardized work instructions, troubleshooting guides, and training materials. This helps preserve institutional knowledge, accelerate onboarding, and improve consistency across maintenance operations.</p>\n<p><strong>Healthcare Training</strong>: Healthcare educators and clinical experts spend significant time creating training materials and documenting procedures. By converting recorded demonstrations into structured documentation, healthcare organizations can automatically generate training guides, equipment setup instructions, and step-by-step procedural references. Human review checkpoints ensure accuracy while reducing the manual effort required to produce educational content.</p>\n<p><strong>Consumer Products</strong>: Manufacturers of consumer products often create assembly and setup instructions manually, requiring extensive documentation effort for each new product and revision. By analyzing product assembly recordings and narrated demonstrations, AI can generate user manuals, assembly guides, parts lists, and visual instructions automatically. This accelerates product launches while helping maintain consistency and quality across documentation.</p>\n<p><strong>Hobby Communities</strong>: Many hobbyists share expertise through video tutorials covering activities such as woodworking, model building, electronics, and crafting. Multimodal AI can transform these demonstrations into structured, searchable guides that include step-by-step instructions, reference images, required tools, and material lists. This allows creators to expand the reach and accessibility of their knowledge beyond video content alone.</p>\n<p><strong>DIY and Home Improvement</strong>: Home improvement professionals and skilled tradespeople frequently create instructional videos to demonstrate repairs, installations, and maintenance tasks. AI-powered documentation generation can convert these demonstrations into detailed how-to guides complete with images, safety considerations, required tools, and step-by-step procedures. This makes technical knowledge easier to consume while reducing the effort needed to create high-quality instructional content.</p>\n<h2>Contributors</h2>\n<p><em>This article is maintained by Microsoft. It was originally written by the following contributors.</em><em>  </em><em>&nbsp;</em></p>\n<p>Principal authors:  &nbsp;</p>\n<ul>\n<li><a href=\"https://www.linkedin.com/in/trmanasa\" rel=\"noopener\" target=\"_blank\">Manasa Ramalinga</a>&nbsp;| Senior Principal Cloud Solution Architect&nbsp;</li>\n<li><a href=\"https://www.linkedin.com/in/oscarshk/\" rel=\"noopener\" target=\"_blank\">Oscar Shimabukuro</a>&nbsp;| Senior Cloud Solution Architect&nbsp;</li>\n<li><a href=\"https://www.linkedin.com/in/matthew-kazanowsky-411034152/\" rel=\"noopener\" target=\"_blank\">Matt Kazanowsky</a> | Cloud Solution Architect</li>\n<li><a href=\"https://www.linkedin.com/in/abed-sau/\" rel=\"noopener\" style=\"font-style: normal; font-weight: 400; background-color: rgb(255, 255, 255);\" target=\"_blank\">Abed Sau</a><span style=\"color: rgb(30, 30, 30);\"> | Principal Cloud Solution Architect</span></li>\n<li><a href=\"https://www.linkedin.com/in/yagneswari-kanadam/\" rel=\"noopener\" style=\"font-style: normal; font-weight: 400; background-color: rgb(255, 255, 255);\" target=\"_blank\">Yagneswari Kanadam</a><span style=\"color: rgb(30, 30, 30);\"> | Senior Cloud Solution Architect</span></li>\n</ul>"
