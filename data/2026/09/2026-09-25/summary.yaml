"overview": |
  この日は 6 件で、提供終了の告知 1 件と、バックアップの改善、そしてセキュリティの脅威分析が中心でした。提供終了では、Azure Communication Services (ACS) のスタンドアロンサービスのいくつかが 2028 年 9 月 30 日に廃止されます。この日以降、対象のサービスは利用できなくなるため、期日までに移行先を確認しておく必要があります。サービス更新では、VM の復元ポイントに対する Instant Access が一般提供となりました。データディスクに Premium v2 または Ultra ディスクを使っている仮想マシンのアプリケーション整合性のある復元ポイントが対象で、スナップショットが取得された時点からディスクの復元を開始できるようになり、復元の待ち時間が短くなります。セキュリティブログでは、ランサムウェアのアフィリエイトである Storm-2570 の分析が公開されました。Qilin、DragonForce、Anubis、BERT といった複数のランサムウェアを用いた侵害において、侵入後に使うツールと手口が一貫していることを示し、ランサムウェアが展開される前の段階で防御側がその活動を検知し断ち切るための手がかりがまとめられています。あわせて月次の「What’s new in Microsoft Security: 2026 年 9 月」が公開され、今月の更新はローカルで動く AI エージェントの発見と制御、Zero Trust のエージェント通信への拡張、SOC の基盤強化を助ける内容だと紹介されています。エージェント運用では、Azure SRE Agent を使いこなすためのベストプラクティスガイドが公開されました。SRE Agent 自身のスコアリングと本番テレメトリーをもとに、成績の良いエージェントと悪いエージェントの差を調べたところ、良いエージェントはむしろ軽量で、最も優れたものはスキルが 1 つだけという例もあった一方、成績の悪いエージェントは大量のスキルライブラリ・多数のコネクタ・膨大なツールを抱えていたといいます。差は結局「適切な仕事が適切なハンドラーに届くかどうか」に帰着するとして、初めて設定する人向けに、着手する順番に沿って 7 つの要点が整理されています。Azure ブログでは、モデルの選択肢の拡大・音声エージェント・継続的な最適化によってエージェントの投入を速める取り組みが紹介されました。自社にとって最適なモデルは変わり続けるものであり、それを採用することが、そのたびにアーキテクチャを作り直す作業になってはならない、という問題意識が示されています。
