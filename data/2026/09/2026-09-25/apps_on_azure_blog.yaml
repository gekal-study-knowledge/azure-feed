    "title": "Getting the best out of Azure SRE Agent"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/getting-the-best-out-of-azure-sre-agent/ba-p/4559745"
    "published": "2026-09-25 05:24:01"
    "fetched": "2026-09-25 09:58:17"
    "summary": "<p>A common question that we get from our customers is&nbsp;<em>\"Hey guys, we are excited about SRE agent and we 've created one but whats the best way to configure it?\"</em>. The below guide aims at sharing some of the best practices that anyone can follow to make the most out of our SRE Agent. This guide is based on SRE Agent's own scoring system and we evaluated production telemetry of the agents performing best vs. the ones performing the worst and we tried understanding the key differences that led to one agent performing better than the other.</p>\n<p>Interestingly, agents doing the best work are usually <strong>not</strong> the most heavier ones. Some of the strongest agents we looked at had just one skill. On the other hand, some of the worst performing agents had large skill libraries, plenty of connectors, and insane number of tools. The difference almost always comes down to one thing: <strong>\"whether the right work reaches the right handler\"</strong></p>\n<p>This guide walks through what to set up, roughly in the order you'd do it. It's written for someone configuring an agent for the first time, so it starts simple.</p>\n<h2 id=\"the-seven-things-that-matter\">The seven things that matter</h2>\n<p>These are written in the order you'll most likely execute on them. \"How much it matters\" shows how much each aspect makes an agent significantly better (the goal is to help you quickly decide which ones to prioritize).</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>&nbsp;</th><th>What to do</th><th>How much it matters</th></tr></thead><tbody><tr><td><strong>1</strong></td><td>Connect your data first</td><td><strong>Critical</strong> — everything else depends on it</td></tr><tr><td><strong>2</strong></td><td>Start with the problem that annoys you most</td><td>How to begin</td></tr><tr><td><strong>3</strong></td><td>Send the right incidents to the right specialist</td><td><strong>Critical</strong> — filter incidents in the response plan, not in the agent's instructions</td></tr><tr><td><strong>4</strong></td><td>Write a few skills that really teach something</td><td>Worth getting right</td></tr><tr><td><strong>5</strong></td><td>Add custom agents when different problems need different help</td><td>Worth getting right</td></tr><tr><td><strong>6</strong></td><td>Decide how much freedom to give, scenario by scenario</td><td><strong>High</strong> — can leave work waiting for approval</td></tr><tr><td><strong>7</strong></td><td>Check the agent can finish the job</td><td><strong>High</strong> — check permissions for the final step</td></tr></tbody></table></div>\n<h2 id=\"start-here-the-one-idea-that-is-worth-internalising\">Start here: The One idea that is worth internalising</h2>\n<p>Think of your agent less like an AI system but more like a new hire in your team, even though its hard to visulaize it that way. Do you burden a new hire with year old documents, PIR investigation reports, architecture documents that have drifted over years, information about systems that have become obsolete or telemetry logging that is long gone? The same hold true for an agent.</p>\n<p>An agent needs access to your systems. They need to know which problems <em>they</em> should be really solving. They need true context about how your service works. And they need to know when to act and when to check with someone first.</p>\n<p>If you get these things right, a fairly plain agent can do excellent work. Otherwise, you are just in a constant loop of updating prompts, changing tools, updating skills and getting frustrated. Everything below is a version of those four things.</p>\n<h2 id=\"1-connect-your-data-first\">1. Connect your data first</h2>\n<p>You might have heard this phrase before - \"Context is the King\". Before writing a skill or an agent prompt, \"empower\" your agent first: your telemetry logs (most important), your incident system, your work tracking, your repositories. Agent without the right data is never going to succeed no matter how good prompt or skill is. Connect the \"right\" connectors and not \"many\" connectors.</p>\n<h4 id=\"these-are-important-so-do-these\">These are important so \"do\" these</h4>\n<ul>\n<li><strong>Connect telemetry and work tracking first</strong> — These help with most of the real investigative work.</li>\n<li><strong>Add deployment history and service health next</strong> — this is what links a problem to the change that caused it.</li>\n<li><strong>Index the systems where work already happens</strong> — your wiki and work items get used heavily; a separate document store barely gets touched.</li>\n<li><strong>Connect Teams or email for delivery</strong> — findings should land where your team already works.</li>\n<li><strong>Check connections are healthy, not just configured</strong> — a dead connector fails silently and takes your scheduled runs with it.</li>\n</ul>\n<h4 id=\"avoid-doing-these\">Avoid doing these</h4>\n<ul>\n<li><strong>Don't connect a system until you need it</strong> — extra connections rarely get used, and you still have to keep them working.</li>\n<li><strong>Don't treat Teams or email as investigation tools</strong> — they carry a fraction of the traffic because they're output, not input.</li>\n<li><strong>Don't treat past incidents as the answer</strong> — use them as a starting point, then confirm with current data.</li>\n<li><strong>Don't add connections to fix a struggling agent</strong> — the best and worst agents we studied had nearly identical, fully healthy connection sets. One scored 4.9, the other 2.3. The difference was routing.</li>\n</ul>\n<blockquote>\n<p>Never let the agent decide the source of truth. Feed it!</p>\n</blockquote>\n<h2 id=\"2-start-with-the-problem-that-annoys-you-most\">2. Start with the problem that annoys you most</h2>\n<p>This goes back to the same new hire principal. Don't try to teach the agent your whole system. Pick an important component that wakes people up, or the investigation everyone dreads because it takes four hours and always ends the same way.</p>\n<p>Work that one scenario with the agent, interactively. The best to do is to \"chat\" with the agent without writing a new custom agent. Let it dig, correct it when it goes the wrong way, point it at the data it didn't knew about. When you and and the agent solve the issue together, ask the agent to turn what just happened into a skill or a custom agent. This approach is way more effective that perfecting the \"correct\" agent by starting with a lengthy prompt.</p>\n<p>Once you perfected one problem, move on to the next one.</p>\n<p>Each scenario is small, so it's quick to get right, and the context compounds. After a few weeks, you'll notice that the agent is helping with things you never \"explicitly\" taught it. It <em>just</em> learns (just like a good new hire).</p>\n<h2 id=\"3-send-the-right-incidents-to-the-right-specialist\">3. Send the right incidents to the right specialist</h2>\n<p><em>If you read only one section, read this one. Sending an agent the wrong work was one of the clearest problems we found.</em></p>\n<p>A response plan decides which incidents reach an agent. If the plan accepts every incident but sends them all to a specialist built for one problem, many incidents will arrive without the information that specialist needs. It stops without helping, and the incident is marked unresolved. The agent may look broken, but it was given work it wasn’t built to do.</p>\n<p>We saw this with an agent that handled scheduled work well, scoring <strong>4.5 out of 5</strong>, but scored <strong>1.7 out of 5</strong> on incidents it received through a broad response plan. Another agent used <strong>71 response plans</strong>, each directing a specific kind of incident to the right specialist. It scored <strong>4.5 out of 5</strong> on incidents, with fewer than 1% failing. These are examples from different agents, not a before-and-after test, but they show why it’s worth checking how incidents are routed.</p>\n<p><strong>We recommend using response plans that match specific incidents to specialists that can handle them.</strong> Having many focused plans is fine; sending every incident through one broad plan to a narrow specialist is the problem.</p>\n<h2 id=\"4-write-a-few-skills-that-really-teach-something\">4. Write a few skills that really teach something</h2>\n<p><em>The number of skills an agent has matters less than what those skills teach it.</em></p>\n<p>In our study, some agents with no skills performed better than agents with several. The strongest results were associated with skills that gave clear, detailed guidance, while agents with vague or empty skill descriptions struggled. One agent had three skills with no descriptions at all. That doesn’t prove that writing more will improve results, but it does show why adding skills just to increase the count isn’t useful.</p>\n<p>Think of a skill as a briefing for a colleague - It should explain <strong>which question it answers</strong>, the words people might use when asking it, how to decide what to do, and when the skill does <strong>not</strong> apply. It should also warn about mistakes that are easy to make. We recommend writing a skill when you have specific knowledge or judgment to teach the agent. Make it detailed enough to guide a real decision, rather than adding a short description that only names a topic.</p>\n<p>Here are three examples of how to turn a vague skill description into guidance the agent can actually use. These are <strong>illustrative examples</strong>, not descriptions taken from the study.</p>\n<p><strong>Billing issue</strong></p>\n<ul>\n<li><strong>Too vague:</strong> “Helps with billing problems.”</li>\n<li><strong>Useful:</strong> “Use this when someone asks whether an order was charged, whether a missing charge will appear later, or how to recover a failed charge. Check the order and billing records before deciding. Don’t suggest creating a new billing record until you’ve ruled out an existing or delayed charge.”</li>\n</ul>\n<p><strong>Deployment failure</strong></p>\n<ul>\n<li><strong>Too vague:</strong> “Investigates failed deployments.”</li>\n<li><strong>Useful:</strong> “Use this when a deployment has failed or stopped making progress. Check its status, the failed step, and recent changes. Don’t recommend retrying until you know whether the previous attempt is still running or left work unfinished.”</li>\n</ul>\n<p><strong>High error rate</strong></p>\n<ul>\n<li><strong>Too vague:</strong> “Handles service alerts.”</li>\n<li><strong>Useful:</strong> “Use this when a service’s error rate rises. Check when the increase started, which requests are failing, and whether a deployment or dependency changed around the same time. Don’t blame the most recent deployment without evidence that it affected the failing requests.”</li>\n</ul>\n<p>The useful versions tell the agent <strong>when to use the skill, what to check, and which mistake to avoid</strong>.</p>\n<h2 id=\"5-add-custom-agents-when-different-problems-need-different-help\">5. Add custom agents when different problems need different help</h2>\n<p>A custom agent has its own instructions, tools, and scope for a particular kind of work. Create one when a problem comes up often enough to need a clear owner—not just because the option is available.</p>\n<p>For example, a <strong>deployment custom agent</strong> could check rollout status, failed steps, and recent changes when an alert follows a release. A <strong>billing custom agent</strong> could check order and charge records, with instructions to avoid actions that might charge a customer twice. These jobs need different evidence and different safeguards. An occasional question doesn’t necessarily need its own custom agent.</p>\n<p>In our study, agents with one or two custom agents performed much like agents with none; agents with three or more tended to do better. That’s an observation, <strong>not a target number</strong>. Add them as distinct, recurring problems emerge.</p>\n<p><strong>Be clear about when each custom agent runs.</strong> As the <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/zero-ops-agents-operate-humans-govern/4545151\" target=\"_blank\">Zero Ops guidance</a> explains, you can call one directly in chat or select it through a response plan or scheduled task. This lets you send a deployment alert to the deployment custom agent without sending every incident there.</p>\n<p><strong>Limit access to what the job needs.</strong> Start with read access for investigation, and grant permission to make changes only where needed, with appropriate approval. Give each custom agent an explicit list of tools: for a custom agent, an empty tool list means default tool access, <em>not</em> “no tools.” The agent’s identity and permissions still set the outer boundary; a custom agent’s instructions alone are not a security control.</p>\n<h2 id=\"6-decide-how-much-freedom-to-give-scenario-by-scenario\">6. Decide how much freedom to give, scenario by scenario</h2>\n<p><em>Review mode protects you by asking a person to approve actions. Use it where approval matters, but remember that work can sit unfinished while it waits.</em></p>\n<p>We saw this in two agents handling busy incident queues. Both followed their instructions well and rarely failed. One ran in review mode: <strong>96% of its incident work was waiting for approval</strong>, and its overall score was <strong>3.0 out of 5</strong>. The other worked autonomously and scored <strong>4.8 out of 5</strong>. These are different agents, so the scores don’t prove that changing the mode alone would close the gap. They do show why it’s worth checking how much work is waiting.</p>\n<p><strong>Choose the level of approval for each kind of work.</strong> For example:</p>\n<ul>\n<li><strong>Investigating an alert:</strong> Let the agent read logs, check service health, and compare the alert with recent deployments without asking for approval at every step.</li>\n<li><strong>Sharing findings:</strong> If your team is comfortable with it, let the agent post an investigation summary to the incident. If posts need review, let it prepare a draft instead.</li>\n<li><strong>Restarting a service:</strong> Have the agent explain what it found and ask a person to approve the restart.</li>\n<li><strong>Changing a database or network setting:</strong> Keep a person involved. These changes can affect more than the incident the agent is investigating.</li>\n</ul>\n<p>The goal isn’t to make the whole agent autonomous or put everything in review mode. <strong>Let routine investigation move forward, and require approval where the consequences of a mistake are greater.</strong></p>\n<h2 id=\"7-check-the-agent-can-finish-the-job\">7. Check the agent can finish the job</h2>\n<p><em>An agent can do a good investigation and still fail at the last step.</em></p>\n<p>We saw several examples where an agent did useful work but couldn't complete the final step:</p>\n<ul>\n<li>One agent found three incidents that needed action, but the incident-management write tools it needed were unavailable. It could explain what to do, but couldn't complete its scheduled task.</li>\n<li>Another investigated an incident and found the right team to take over, but the transfer failed with an authorization error. The incident stayed unresolved.</li>\n<li>A third gathered evidence for an incident, but couldn't save a lasting update because it lacked permission to write back to the incident system.</li>\n</ul>\n<p>These can look like investigation failures when the actual blocker is access. That doesn't mean granting every agent write permission: decide which final steps it should perform, give it only the access those steps require, and make the human handoff clear for anything it shouldn't do itself.</p>\n<p>Before sending an agent to a live incident queue, try one example from start to finish. Check not only that it can find the answer, but that it can deliver the result in the way your team expects.</p>\n<hr />\n<h3 id=\"troubleshooting-when-something-isnt-working-find-out-why\">Troubleshooting: When something isn't working, find out why</h3>\n<p>Different problems can look alike. Check what happened before changing the agent's instructions.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><th>What you see</th><th>What to check first</th></tr></thead><tbody><tr><td>An investigation stops quickly without using tools</td><td>Did the response plan send it to the wrong custom agent?</td></tr><tr><td>The agent does a lot of work but misses the task</td><td>Does it need clearer instructions or a smaller task?</td></tr><tr><td>Work is accurate but waiting for approval</td><td>Is review mode stopping routine steps?</td></tr><tr><td>The same error keeps appearing</td><td>Is a connector broken, or is a permission missing?</td></tr></tbody></table></div>\n<p>Two questions are especially useful: <strong>Did the agent use the tools it needed?</strong> And <strong>do failures look the same each time?</strong> No tool use during an investigation may point to a routing problem. Repeated identical errors may point to a broken connection or missing permission. If the mistakes vary, look more closely at the instructions, skills, and information the agent received. These are clues, not diagnoses on their own.</p>\n<h3 id=\"if-you-already-have-an-agent-thats-struggling\">If you already have an agent that's struggling</h3>\n<p>Check the basics before rewriting its skills:</p>\n<ol>\n<li><strong>Check routing.</strong> Are unrelated incidents reaching a custom agent built for a narrower problem?</li>\n<li><strong>Check connections.</strong> Can the agent actually reach the systems it needs?</li>\n<li><strong>Check what is waiting.</strong> Is review mode holding up work that could safely continue?</li>\n<li><strong>Check the last step.</strong> Can the agent post its findings or complete an approved action?</li>\n<li><strong>Then review its guidance.</strong> If the agent has the right work, access, and permissions but still makes different mistakes, improve its instructions or skills.</li>\n</ol>\n<hr />\n<h2 id=\"how-we-know-this\">How we know this</h2>\n<p>We studied production SRE Agent activity. We set aside test and demo agents, looked at agents doing real scheduled work, incident response, and chat, and compared their results with how they were configured.</p>\n<p>The examples show <strong>patterns we observed</strong>, not before-and-after tests. An agent scoring differently on incidents and scheduled work is a useful clue, but it does not prove that routing was the only cause. Scores can also change when the evaluation changes, so use the numbers as context rather than promises of what a configuration change will achieve.</p>\n<p><strong>Read scores in context.</strong> Compare incidents with incidents and scheduled tasks with scheduled tasks: open-ended chat often scores lower than work with a clear goal. Greetings aren't investigations, so don't use their scores to judge incident performance. And if an agent is marked down for a wordy answer, check whether its findings were useful before treating it as a failure.</p>\n<p>This is a starting point for teams to review and improve and we really hope this helps!</p>"
