  "8d51739c84b6d9c1405a6cd02279a94e":
    "id": "8d51739c84b6d9c1405a6cd02279a94e"
    "title": "Building 3IQ Retail Assistant Demo – Part 1"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/building-3iq-retail-assistant-demo-part-1/ba-p/4547228"
    "published": "2026-09-04 02:24:53"
    "fetched": "2026-09-04 10:36:48"
    "summary": "<p><strong>Introduction</strong></p>\n<p>Recently I received a request from one of our GSI partners to demonstrate them 4IQs on a retail industry scenario. Unfortunately, Web IQ is still not in public preview. Hence, I promised them to come back with an example later with Web IQ. But even with the remaining Fabric IQ, Foundry IQ and Work IQ, the issue is finding the right set of data and then build a story around it to demonstrate an agentic solution addressing some practical real-life scenario.</p>\n<p>After doing some research with available data, I formulated a plan to prepare an assistant for customer reps to address incoming questions and requests from customers. This article describes how to build such an environment to demonstrate the capability of 3IQs together.</p>\n<p>First, we need an Azure subscription with option to provision Fabric capacity, need Foundry, M365, and Copilot Studio access. Once you have those, let’s move to set up our environment.</p>\n<p><strong>Environment Set Up</strong></p>\n<p>I have limited time in hand. So, I went ahead with existing templates to implement Foundry and surrounding services on Azure. I used this Bicep template: <a href=\"https://github.com/microsoft-foundry/foundry-samples/tree/main/infrastructure/infrastructure-setup-bicep/16-private-network-standard-agent-apim-setup\" target=\"_blank\">foundry-samples/infrastructure/infrastructure-setup-bicep/16-private-network-standard-agent-apim-setup at main · </a><a href=\"https://github.com/microsoft-foundry/foundry-samples/tree/main/infrastructure/infrastructure-setup-bicep/16-private-network-standard-agent-apim-setup\" target=\"_blank\">microsoft</a><a href=\"https://github.com/microsoft-foundry/foundry-samples/tree/main/infrastructure/infrastructure-setup-bicep/16-private-network-standard-agent-apim-setup\" target=\"_blank\">-foundry/</a><a href=\"https://github.com/microsoft-foundry/foundry-samples/tree/main/infrastructure/infrastructure-setup-bicep/16-private-network-standard-agent-apim-setup\" target=\"_blank\">foundry-samples</a>. There are several other templates available on that page. You can choose any one of those based on your preference. This template puts all resources including Foundry behind private endpoints with no public internet access. You can add a jumpbox as a Bastion host to connect to all these services. Or time to time you can make those services public to complete your work.</p>\n<p><strong>Setting up Fabric</strong></p>\n<p>We will start with data layer which is Fabric. It is not provisioned yet. I provisioned a Fabric capacity with minimum size/SKU (F2) within the Resource Group generated by the Bicep template earlier. Fabric is an expensive service, especially the higher SKUs are. So, we need to be careful not spend too much and surpass our monthly Azure quota. Once provisioned, go to <a href=\"https://app.fabric.microsoft.com/\" target=\"_blank\">https://app.fabric.microsoft.com/</a> and create a Workspace using the same Fabric Capacity we provisioned earlier.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Here “Fabric3IQ” is the name of my Fabric capacity. &nbsp;As the workspace is created now, let’s create a Lakehouse inside the Workspace and start loading data into the Lakehouse. But prior to that, let’s go to the Fabric capacity on Azure Portal and increase the size to a bigger SKU such as F64. We will load AdventureWorks sales data into the Lakehouse. There is a detail description here showing how to do it: <a href=\"https://learn.microsoft.com/en-us/fabric/graph/quickstart\" target=\"_blank\">Quickstart: Create Your First Graph in Microsoft Fabric - Microsoft Fabric | Microsoft Learn</a>. Only follow the “Load Sample Data” section. One done, it should look like this:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Now is the time to create our Ontology. People who are not familiar can find a guide in this tutorial: <a href=\"https://learn.microsoft.com/en-us/fabric/iq/ontology/tutorial-1-create-ontology?pivots=onelake\" target=\"_blank\">Tutorial Part 1: Create an Ontology - Microsoft Fabric | Microsoft Learn</a>. We added each table from Lakehouse as entities and build relationship within those entities. Here is how it looks like now:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<p>Next is adding a Data Agent to the Fabric Workspace. Once added, now add a data source and select the Ontology you created earlier.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Now, as your Data Agent is ready ask few complex questions like: “What are the top 5 categories sold?”, “Give me the seller's name who handled most orders in numbers and not in total sale amount?”, “List those customers who didn't purchase anything” and see the result. Once, satisfied, let’s pause the Fabric Capacity from Azure Portal and reduce the size of the capacity to F2. We will resume and rescale it once everything is ready.</p>"
  "cefe7185c856489531721ced1b585155":
    "id": "cefe7185c856489531721ced1b585155"
    "title": "Building 3IQ Retail Assistant Demo – Part 2"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/building-3iq-retail-assistant-demo-part-2/ba-p/4547231"
    "published": "2026-09-04 02:24:04"
    "fetched": "2026-09-04 10:36:48"
    "summary": "<p>In part 1 while setting up the Azure environment, I informed the template puts everything under VNET and all the services are having only private endpoints. Which is great from the security point of view. We also spoke about creating a jumpbox as a Bastion host to work on those services. If you did it already – great, if not, we can bypass the situation by opening the public endpoint from Networking menu for each of these following services.&nbsp;</p>\n<p><strong>Setting up Blob Storage Container </strong></p>\n<p>Unlike structured data used for Foundry, we will use some unstructured data (pdf files) for Foundry and build knowledge source and knowledge base and will use those with our Foundry agent. To start with, I used 3 PDF files as listed below:</p>\n<ul>\n<li>Adventure Works Inc Retail Customer Support Representative Guide.pdf</li>\n<li>Adventure Works Inc. – Retail Customer Terms and Conditions.pdf</li>\n<li>Adventure Works Inc. – Retail Customer Payment, Purchase, Shipping &amp; Refund Information.pdf</li>\n</ul>\n<p>I used synthetic data for these PDF files. You can use Copilot, ChatGPT, Gemini, or Claude to generate the content.</p>\n<p>Once done, we will create a Blob Container. There is a Storage Account created already by the template. You can use it to create the Blob Container. Now upload these 3 files there. You may have to add your account as a Storage Blob Data Contributor to upload the files if not already there.</p>\n<p>We need to add few more permissions to this container. Add Storage Blob Data Reader access to:</p>\n<ul>\n<li>Foundry account's managed identity</li>\n<li>Foundry Project's managed identity</li>\n<li>Azure AI Search service's managed identity</li>\n</ul>\n<p><strong>Setting up Search </strong></p>\n<p>A search service is already provisioned by the template. Use this to set up your knowledgebase and knowledgesource. Create the knowledgesource with similar set up:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Then create a knowledgebase using this knowledgesource and with the following description: “<em>Use this to answer questions related to Adventure Works Inc.'s retail customer policies, including the Support Representative Guide, Terms and Conditions, and Payment, Purchase, Shipping &amp; Refund information</em>”. I kept the Retrieval Reasoning Effect as Minimal and didn’t add any Chat completion model as such.</p>\n<p><strong>Setting up Foundry Agent</strong></p>\n<p>It’s time now to set up our Foundry Agent. Create a simple prompt agent and use any Chat completion model. It can be any LLM or SLM of your choice. This agent can be pro-code one using either Agent Service SDK or a hosted agent using MAF or LangGraph. But we would like to keep it simple for this demo.</p>\n<p>For the Instructions I have written –</p>\n<p>“<em>You are an intelligent agent to answer questions on Adventure Works Inc. Retail Customer Support Representative Guide, Retail Customer Terms and Conditions, Retail Customer Payment, Purchase, Shipping &amp; Refund Information.</em></p>\n<p><em>Please answer from the knowledgebase only. If answer is not available within knowledgebase say not available politely</em>”.</p>\n<p>And now add the knowledgebase you created within the search service. That’s pretty much it. Your Foundry Agent with IQ is ready and you can now ask a few complex questions to it like – “<em>Can customer get refund if the delivery is returned due to wrong address?</em>”, \"<em>Can customer get refund if the shipping is delayed?</em>\", “<em>Customer wants to return but she doesn't have the bill. Can she return the product?</em>” etc.</p>\n<p>At last, make sure you turn your Foundry service public on Azure Portal by going to Resource Management &gt; Networking &gt; Firewall and Virtual Networks. This is required to publish the Foundry Agent to M365 Copilot:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>As of today, you cannot publish the agent if it has a private endpoint. There are workarounds by creating the Bot service separately (the publish option does the magic silently) and exposing the Agent endpoint using APIM/App Gateway etc. I haven’t taken that route for this demo to make it simple. But here are some links just in case someone would like to explore:</p>\n<p><a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/publish-copilot-virtual-network\" target=\"_blank\">Publish agents to Microsoft 365 and Teams by using the REST API - Microsoft Foundry | Microsoft Learn</a></p>\n<p><a href=\"https://www.russrimmerman.com/blog/foundry-agents-teams-private-endpoint/\" target=\"_blank\">Publish Foundry Agents to Teams Behind a Private Endpoint · Russ Rimmerman</a></p>\n<p><a href=\"https://github.com/graemefoster/locked-down-foundry-m365-agent\" target=\"_blank\">graemefoster/locked-down-foundry-m365-agent</a></p>"
  "4b51b18100b71de5d78dcdbeb6e3a507":
    "id": "4b51b18100b71de5d78dcdbeb6e3a507"
    "title": "Building 3IQ Retail Assistant Demo – Part 3"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/building-3iq-retail-assistant-demo-part-3/ba-p/4547233"
    "published": "2026-09-04 02:23:13"
    "fetched": "2026-09-04 10:36:48"
    "summary": "<p>We are now at the last part of our demo. We will build a Copilot Agent to connect it to a SharePoint List holding data related to Support case raised by the customers. Then connect the other 2 agents (Fabric Data Agent and Foundry Prompt Agent) to it. But before doing it ensure Work IQ is activated with your Copilot, and you can build agents in Copilot Studio using Work IQ. Contact your Admin if it is not available. Also, Go ahead and rescale the Fabric Capacity to F64 and Resume it from the Azure Portal.</p>\n<p><strong>Setting up SharePoint List &nbsp;</strong></p>\n<p>Create a list in your M365 SharePoint site of choice and add the following entries. I referred to the customer/sales data available in our Fabric Lakehouse:</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>You can add more entries referring to the related data from Lakehouse. These 2 entries are enough for the time being for our demo purpose.</p>\n<p><strong>Setting up Copilot Agent</strong></p>\n<p>Now open your Copilot Studio and start creating an agent. Give it a name of your choice and select “GPT-5 Chat” as the model. Once created, in the Agents tab click on “Add an agent” and then “Connect to an external agent”. You can add both your Fabric Data Agent and Foundry Prompt Agent through this.</p>\n<p>Next, open the Knowledge tab and click on “Add knowledge” and then on “SharePoint (Powered by Work IQ)”. Here you add your SharePoint list and add it to the agent.</p>\n<p>At the end, In the instruction write the following. Change the name of your Data and Prompt agents and SharePoint knowledge source suitably:</p>\n<p>“<em>You are an intelligent agent assisting customer service representatives of Adventure Works Inc. You have different sources to retrieve data. Give least priority to answers generated by the LLM model and give highest priorities to the data retrieved from these data sources. </em></p>\n<p><em>To start with if the requirement is customer support, then ask for customer name, sales order id, and if they are calling due to an existing support request then support case id. Then use following sources to get data: </em></p>\n<ol>\n<li><em> Foundry IQ Agent - use this connected agent to answers questions on Adventure Works Inc. Retail Customer Support Representative Guide, Retail Customer Terms and Conditions, Retail Customer Payment, Purchase, Shipping &amp; Refund Information. </em></li>\n<li><em> AWDataAgent - use this connected agent to retrieve sales data about orders by the customers, about sellers/employees, about products and product subcategories and categories. This is based on Ontology that defines the relationships among the entities. </em></li>\n<li><em> Use the knowledge source Support_Data through SharePoint to fetch data about the support request/case/ticket raised by the customer previously. If the customer has previous support case open bring that info additionally once you get information about the customer. </em></li>\n</ol>\n<p><em>If given a Sales Order ID, or Customer Name, Customer ID and the question is not relevant to support case then use AWDataAgent connected agent. If it is specific to existing support request, then use SharePoint List knowledge source.</em>”</p>\n<p>That’s it. Our demo is ready. Now test it with a series of relevant questions:</p>\n<p><em>“I have to help a customer”.</em></p>\n<p><em>“The Sales Order ID is 58970”.</em></p>\n<p><em>“Is there any support case opened by this customer?”.</em></p>\n<p><em>“Customer is asking the Half Finger Gloves are not up to the quality and she wants to return. But she used it. Can we do that?”.</em></p>\n<p>That’s it. Your demo is ready for the show.</p>"
  "8b0edf25f6c6d02c3e4fb70eae14e7d7":
    "id": "8b0edf25f6c6d02c3e4fb70eae14e7d7"
    "title": "Your Private Endpoint Does Not Cover Agent Egress: Locking Down Azure AI Foundry in Both Directions"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/your-private-endpoint-does-not-cover-agent-egress-locking-down/ba-p/4547864"
    "published": "2026-09-04 23:59:04"
    "fetched": "2026-09-05 00:15:41"
    "summary": "<p>I got asked a question a few weeks ago that sounded simple. Lock down Azure AI Foundry with Private Link, and let the agents call an MCP server hosted on a VM in a different virtual network. Everything private, nothing over the public internet, and proof rather than a diagram.</p>\n<p>I said yes, that is straightforward. I was wrong about the second half.</p>\n<p>What follows is what I actually built, what broke along the way, and the one thing that cost me most of an afternoon. Everything here was deployed and verified on a live subscription. The scripts and the raw logs are on GitHub if you want to reproduce it:</p>\n<a class=\"lia-embeded-content lia-rich-preview-card-container\" href=\"https://github.com/raffaeu/azure-foundry-private-link\" rel=\"nofollow noopener noreferrer\" target=\"_blank\"><img alt=\"\" class=\"lia-rich-preview-card-image\" src=\"https://opengraph.githubassets.com/0961685d2b243b4ca09420c43882200d03f6cf31b18840a492c0d9330cb9dd3c/raffaeu/azure-foundry-private-link\" /><div class=\"lia-rich-preview-card-content\"><div class=\"lia-rich-preview-card-header\"><h5>GitHub - raffaeu/azure-foundry-private-link: Provision Azure AI Foundry behind a Private Endpoint with private DNS, then prove it works: HTTP 200 from inside the VNet over a private IP, HTTP 403 from outside. Numbered az CLI scripts, managed-identity auth, and a one-command test harness.</h5></div><p class=\"lia-rich-preview-card-description\">Provision Azure AI Foundry behind a Private Endpoint with private DNS, then prove it works: HTTP 200 from inside the VNet over a private IP, HTTP 403 from outside. Numbered az CLI scripts, managed-identity auth, and a one-command test harness. - raffaeu/azure-foundry-private-link</p><div class=\"lia-rich-preview-card-provider-name\"><img src=\"https://github.com/favicon.ico\" />github.com</div></div></a>\n<h2>The mistake almost everyone makes</h2>\n<p>Here is the thing I want you to take away, even if you read nothing else.</p>\n<p>A private endpoint on your Foundry resource secures traffic going <strong>into</strong> Foundry. It does absolutely nothing about the traffic your agents send <strong>out</strong>.</p>\n<p>Those are two different features, configured in two completely different ways, with two completely different sets of failure modes. If you configure the private endpoint, disable public network access, see your test call succeed from inside the VNet, and call it done, you have secured exactly half of the problem. Your agent can still be reaching out to a tool endpoint from a Microsoft owned public IP address, and nothing in the portal will tell you that.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><thead><tr><th>&nbsp;</th><th>Direction</th><th>Mechanism</th></tr></thead><tbody><tr><td>Inbound</td><td>client to Foundry</td><td>Private <strong>endpoint</strong></td></tr><tr><td>Outbound</td><td>Foundry agent to your API</td><td>Network <strong>injection</strong></td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>I built and proved both. Let me take them in order.</p>\n<div class=\"placeholder\"><img />Inbound vs Outbound traffic via Private Link.</div>\n<h2>Part one: the inbound half</h2>\n<p>This part is well documented and mostly behaves. The shape of it:</p>\n<ul>\n<li>A VNet with a subnet for private endpoints, with <code>private-endpoint-network-policies</code> disabled, which is mandatory and easy to forget</li>\n<li>A Foundry account created with a <strong>custom domain</strong>, which is required for Private Link to work at all</li>\n<li>Private DNS zones, and here is the first trap</li>\n<li>A private endpoint with a DNS zone group</li>\n<li><code>publicNetworkAccess</code> set to <code>Disabled</code></li>\n</ul>\n<p>The DNS trap is that you need <strong>three</strong> zones, not one:</p>\n<pre><code>privatelink.openai.azure.com\nprivatelink.services.ai.azure.com\nprivatelink.cognitiveservices.azure.com</code></pre>\n<p>The Foundry endpoint answers on several FQDNs, and if you only create the zone matching the hostname you happen to be testing with, the others silently resolve to the public IP. Traffic still works, which is exactly what makes it dangerous. It looks fine.</p>\n<p>All three zones have to be linked to the VNet, and the DNS zone group on the private endpoint is what actually writes the A records. Miss the zone group and you get zones with nothing in them.</p>\n<h3>Proving it, properly</h3>\n<p>This is where I want to push back on how these setups usually get validated. People run one test, from inside the VNet, see a 200, and declare victory.</p>\n<p>That proves nothing on its own.</p>\n<p>A 200 from inside the VNet is perfectly compatible with a resource whose public endpoint is also wide open. You need both halves:</p>\n<pre><code>from inside the VNet   -&gt;  DNS resolves to 10.0.1.5, call returns HTTP 200\nfrom my laptop         -&gt;  HTTP 403, \"Public access is disabled\"</code></pre>\n<p>Only when both are true have you proven anything. I wrote a small script that runs both and prints a single verdict, because I know that if it is two commands, one of them eventually gets skipped.</p>\n<div class=\"placeholder\"><img />iTerm TEST proving the inbound and outbound traffic.</div>\n<p>A couple of things bit me here that are worth knowing.</p>\n<p>The tenant had key based authentication disabled by policy. Every <code>api-key</code> call returned <code>403 AuthenticationTypeDisabled</code>, and attempts to set <code>disableLocalAuth</code> back to false silently reverted. Not a problem, Entra ID tokens are the better practice anyway, but if you are following an older tutorial with <code>api-key</code> headers you will lose time wondering why your key is rejected. Inside the VM I used the managed identity via IMDS, so there were no secrets to copy around at all.</p>\n<p>The subscription also blocked public IP creation, which meant Azure Bastion could not be deployed. That turned out not to matter. <code>az vm run-command invoke</code> runs scripts inside a VM over the Azure control plane, no SSH, no public IP, no Bastion required. I now prefer it for this kind of testing.</p>\n<h2>Part two: the outbound half, where it got interesting</h2>\n<p>Now the actual request. The agent needs to call an MCP server on a VM in a separate VNet, and I need to prove the call arrives from a private address.</p>\n<p>The mechanism is <strong>network injection</strong>, officially \"Standard Setup with Bring Your Own Virtual Network\". You give Foundry a delegated subnet in your VNet, and the agent runtime gets network interfaces in it, so its outbound calls originate from your address space.</p>\n<p>Three requirements caught me out before I wrote a single line.</p>\n<p><strong>The delegation is <code>Microsoft.App/environments</code>.</strong> Not <code>Microsoft.CognitiveServices</code>, which is what I assumed. Agent compute runs on Azure Container Apps under the hood, which is why the delegation belongs to the <code>Microsoft.App</code> namespace. You also have to register both <code>Microsoft.App</code> and <code>Microsoft.ContainerService</code> as resource providers. Skip that and ARM happily accepts your account, then puts it in <code>provisioningState: Failed</code> several minutes later.</p>\n<p><strong>Network injection is creation time only.</strong> You cannot add it to an existing Foundry account. I had a perfectly good account from part one and it was useless for this. Plan for a rebuild, or better, make the decision before you deploy anything.</p>\n<p><strong>Private networking forces Standard Setup</strong>, which means bring your own Storage, Cosmos DB and AI Search. These are not optional extras you can add later for convenience. The capability host will not provision without all three. That is real money, AI Search Basic alone is around 75 dollars a month, so budget for it and remember to tear it down.</p>\n<p>For the proof I wrote a deliberately dumb mock MCP server. About sixty lines of Node.js, JSON-RPC on port 8080, no authentication, running as a systemd unit. Its only real job is forensic: log <code>req.socket.remoteAddress</code> for every single caller to a file.</p>\n<pre><code>const ip = (req.socket.remoteAddress || '').replace(/^::ffff:/, '');\nlog(`CALLER=${ip}  ${req.method} ${req.url}  ua=\"${req.headers['user-agent']}\"`);</code></pre>\n<p>That log file is the entire experiment. Everything else is scaffolding.</p>\n<div class=\"placeholder\"><img />MCP server used to emulate Private Link outbound traffic.</div>\n<h2>The thing that cost me the afternoon</h2>\n<p>I built everything. Subnet delegated correctly, verified. Providers registered, verified. Account created with <code>networkInjections.scenario = \"agent\"</code>, and I could read the property straight back off the resource to confirm it. Peering connected in both directions. The MCP server responding happily to curl from a VM in the other VNet, logging the caller as <code>10.0.2.4</code>, so cross-VNet private routing was definitely working.</p>\n<p>Then I ran the agent and got this:</p>\n<pre><code>BadRequestError: Error code: 400 - {'error': {'message': 'Server returned 424: None',\n'type': 'external_connector_error', 'param': 'tools', 'code': 'http_error'}}</code></pre>\n<p>And the MCP server log showed nothing at all. Not a failed connection, not a rejected handshake. Zero packets.</p>\n<p>That \"424\" tells you almost nothing. My first instinct was networking, because that is what the error smells like, and because I had just spent an hour on networking. I checked the NSG. I went back over the peering. I confirmed the delegation again. All fine.</p>\n<p>The actual answer is that <strong>there are two capability hosts</strong>, and I had only one.</p>\n<p>The <strong>account level</strong> capability host is created implicitly for you when you set <code>networkInjections</code>. You will see it exist, it will say <code>Succeeded</code>, and it looks like the job is done.</p>\n<p>The <strong>project level</strong> capability host has to be created explicitly, along with connections to your three BYO resources. Until that exists, the agent runtime has nowhere to run. Every tool call fails with that opaque 424, and because the runtime never starts, your tool endpoint never sees a packet, which sends you looking at the network instead of at the thing that is actually missing.</p>\n<p>I also had to grant the project's managed identity data plane roles on Storage, Cosmos and Search, or the capability host provisioning itself fails.</p>\n<p>Worth noting: the documentation says to expect 30 to 35 minutes for this on a network injected account. Mine completed in about four. Do not cancel it either way, but do not block your afternoon on the higher number.</p>\n<div class=\"placeholder\"><img />Account vs Project level - Microsoft Foundry capabilities host.</div>\n<h2>The proof</h2>\n<p>With the project capability host in place, I ran it again. The agent's response:</p>\n<blockquote>The MCP server reports that your request arrived from source IP <strong>10.0.4.119</strong>.</blockquote>\n<p>And from the MCP server's own access log:</p>\n<pre><code>2026-08-17T15:07:02.378Z  CALLER=10.0.4.119  POST /  ua=\"AzureAIFoundryAgentRuntime/231188750\"\n   {\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-11-25\",...}}\n2026-08-17T15:07:02.508Z  CALLER=10.0.4.119  POST /  ua=\"AzureAIFoundryAgentRuntime/231188750\"\n   {\"method\":\"tools/list\",\"params\":{},\"id\":2,\"jsonrpc\":\"2.0\"}\n2026-08-17T15:07:03.829Z  CALLER=10.0.4.119  POST /  ua=\"AzureAIFoundryAgentRuntime/231188750\"\n   {\"method\":\"tools/call\",\"params\":{\"name\":\"whoami\",\"arguments\":{}},\"id\":2,\"jsonrpc\":\"2.0\"}</code></pre>\n<p><code>10.0.4.119</code> is an address from the delegated agent subnet, <code>10.0.4.0/24</code>. The user agent is the Foundry agent runtime identifying itself. The full MCP handshake is there, initialize, then tools/list, then tools/call.</p>\n<p>That is the whole point of the exercise, in one line of a log file. The agent reached a server in a different virtual network, over peering, from a private IP address, and I can show you the packet arriving rather than asking you to trust an architecture diagram.</p>\n<img />iTerm showing the entire TEST suite.\n<h2>Smaller things that wasted my time</h2>\n<p>In case you hit the same walls:</p>\n<ul>\n<li><code>az vm create</code> would not resolve my subnet. By name it tried to create a new one at <code>10.0.0.0/24</code>, which was not what I asked for at all, and by full resource ID it insisted the subnet did not exist. I gave up and created the NIC explicitly with <code>az network nic create</code>, then attached it with <code>--nics</code>. Worked immediately.</li>\n<li><code>az cosmosdb create</code> has no <code>-l/--location</code>. It wants <code>--locations regionName=... failoverPriority=0</code>.</li>\n<li><code>az vm run-command</code> executes under <code>/bin/sh</code>, not bash. My script started with <code>set -euo pipefail</code> and died on line one with \"Illegal option -o pipefail\".</li>\n<li><code>azure-ai-projects</code> 2.x changed shape. <code>list_agents</code> is gone. I used <code>client.get_openai_client()</code> and the Responses API with a native <code>mcp</code> tool type instead, which worked cleanly. It also needs <code>httpx</code> installed and does not pull it in.</li>\n<li>Role names differ per tenant. \"Azure AI User\" did not exist in mine. \"Azure AI Developer\" and \"Azure AI Administrator\" did.</li>\n<li>And an early self inflicted one, I put <code>set -euo pipefail</code> in a variables file that was meant to be <strong>sourced</strong>. That applies the flags to your interactive shell, so the first command returning non-zero closes your terminal window. If a file is designed to be sourced, leave strict mode out of it.</li>\n</ul>\n<h2>If your DNS lives on premises</h2>\n<p>This came up straight after, so it is worth including.</p>\n<p>Azure Private DNS zones are not reachable from on premises. <code>168.63.129.16</code> is a VNet internal address and is not routable over VPN or ExpressRoute, so your own DNS server cannot query the zone directly.</p>\n<p>Deploy an <strong>Azure DNS Private Resolver</strong> with an inbound endpoint in the VNet, then conditional forward from the on premises resolver to that private IP. Forward <strong>only</strong> the <code>privatelink.*</code> zones. Do not forward <code>openai.azure.com</code> wholesale, because the public lookup returns the CNAME that the whole chain depends on, and taking that over breaks other Azure endpoints.</p>\n<h2>What I would tell the next person</h2>\n<ul>\n<li>Test both directions, and test the negative case. A 200 from inside proves nothing on its own.</li>\n<li>Decide on network injection before you create the account, because you cannot add it later.</li>\n<li>If you get a <code>424 external_connector_error</code> and your endpoint logs are empty, stop looking at the network. Check whether the project level capability host exists.</li>\n<li>Budget for Cosmos and AI Search from the start, they are mandatory, not optional.</li>\n<li>Prove it with a log from the destination. A source IP in an access log is evidence. A diagram is a claim.</li>\n</ul>\n<p>Everything is on GitHub, including the raw run logs, so you can see the failures as well as the working version: <a href=\"https://github.com/raffaeu/azure-foundry-private-link\" rel=\"noopener\" target=\"_blank\">github.com/raffaeu/azure-foundry-private-link</a></p>\n<p>If you have done this in a hub and spoke topology with a firewall in the path, I would genuinely like to hear how the UDRs worked out for you, because that is the next thing on my list.</p>"
