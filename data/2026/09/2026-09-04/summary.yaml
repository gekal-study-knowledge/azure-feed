"overview": |
  この日は OpenAI の新しいフロンティアモデル GPT-6 Astra が主題でした。Microsoft Foundry の Limited Access Program を通じて展開が始まり、参加する顧客へ順次広がっていきます。同じ内容が提供開始と一般提供という 2 つの告知で流れており、業務向けのフロンティアインテリジェンスという位置づけが強調されています。あわせて、この数週間の Microsoft への評価は、モデル・インフラストラクチャ・データ・アプリケーション・開発者ツールが AI の本番投入時に 1 つのシステムとして噛み合っている点に帰着する、という主張の記事も公開されました。アーキテクチャブログでは、Private Link で Azure AI Foundry を閉じてもエージェントの送信 (egress) までは覆えない、という指摘が実践的に扱われています。AI Foundry を Private Link で固めたうえで、別の仮想ネットワークの VM 上にある MCP サーバーをエージェントから呼ばせ、すべてをプライベートに保ったまま図ではなく実証で示す、という依頼に対して、後半が想定どおりにいかなかった経緯と実際に構築したものが書かれています。小売業向けのデモ 3IQ Retail Assistant も 3 部構成で公開されました。Fabric IQ、Foundry IQ、Work IQ を組み合わせ (Web IQ はまだパブリックプレビュー前)、テンプレートがすべてのサービスを VNET 配下のプライベートエンドポイントのみで構成することや、Copilot Studio で SharePoint リストにつながる Copilot エージェントを作って他の 2 つのエージェントと接続する手順が扱われています。事例としては、Microsoft の物理セキュリティエンジニアリングチームが Azure Arc と Azure Virtual Desktop でハイブリッド運用を簡素化し、可視性を高めてグローバルに展開した取り組みが紹介されました。サービス更新は Azure Virtual Network Manager の IP アドレス管理 (IPAM) のリージョン拡大で、US Gov Virginia、US Gov Texas、US Gov Arizona、および China North 3、China East 3 で一般提供になりました。セキュリティでは、AI モデルから指示を隠す手口として広まった不可視の Unicode 文字が、メールフィルターが解析する前の段階で単語を難読化する用途に転用され、フィッシングの回避にも使われ始めているという分析が公開されています。
