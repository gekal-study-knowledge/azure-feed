    "title": "Foundry IQ with D365F&O and Fabric IQ"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/foundry-iq-with-d365f-o-and-fabric-iq/ba-p/4557381"
    "published": "2026-09-17 23:47:21"
    "fetched": "2026-09-18 05:38:27"
    "summary": "<p><strong>Business Scenario</strong></p>\n<p>A retail organization runs <strong>multiple promotional sales events</strong> across its store network in different cities, featuring various product categories where Data is captured from third-party systems (products, stores, sales events) and D365 Finance and Operations (customer data)</p>\n<p>Customers are linked to stores <strong>based on city</strong>, and each store hosts specific sales events.</p>\n<p>To figure out the <strong>store generating highest revenue</strong>, store event driving the <strong>best outcome</strong>, majority <strong>customer footprint</strong>, the organization has implemented copilot studio agent using Fabric IQ, Ontology and ERP MCP.</p>\n<p>&nbsp;</p>\n<p><strong><em>New Business Challenge</em></strong></p>\n<p>Beyond understanding past performance, the retailer wants the system to answer:</p>\n<ul>\n<li>Are there procurement risks impacting promotional sales?</li>\n<li>Which cities should receive additional marketing spend?</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong><em>Solution</em></strong></p>\n<p>Create a foundry agent using Foundry IQ including Fabric IQ, Web IQ, Web IQ as knowledge source.</p>\n<p><strong>Foundry IQ is not the source of data</strong>. Its primary role is the <strong>reasoning, orchestration, and decision-making layer</strong> that connects insights from Fabric IQ, Work IQ, and Web IQ , sharepoint, blob, custom agents etc and generates business recommendations. It is backed by Azure AI search to get an indexed search with accurate result.</p>\n<p>&nbsp;</p>\n<p><strong>A. Prerequisite:</strong></p>\n<p><strong>Data Sources &amp; Relationships Overview</strong></p>\n<ul>\n<li>Product, store, and sales event data are sourced from <strong>third-party systems </strong>.</li>\n<li>Customer data is sourced from the <strong>ERP (Dynamics 365 Finance &amp; Operations)</strong> system through Fabric.</li>\n</ul>\n<p><strong>How the data is connected:</strong></p>\n<ul>\n<li>Customers are linked to stores based on <strong>city alignment</strong> (customer city = store location).</li>\n<li>Sales events are associated with:</li>\n</ul>\n<p>o&nbsp;&nbsp; The <strong>products being sold</strong>, and</p>\n<p>o&nbsp;&nbsp; The <strong>stores where the events are conducted</strong>.</p>\n<p>&nbsp;</p>\n<ul>\n<li>Country specific marketing policy documents stored in sharepoint</li>\n</ul>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<ul>\n<li>WebIQ Setup for getting real time information from web (Web IQ is the key enabler for the supplier-news scenario. It can help with Real-time supplier news, market disruptions, geopolitical events, regulatory changes, competitor activity)</li>\n</ul>\n<p>&nbsp;</p>\n<p>Ref: <a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/web-iq\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/web-iq</a></p>\n<p>&nbsp;</p>\n<ul>\n<li>Finance and Operations data connected toFabric Lakehouse</li>\n</ul>\n<p><strong>Ref</strong>: <a href=\"https://learn.microsoft.com/en-us/power-apps/maker/data-platform/azure-synapse-link-view-in-fabric\" target=\"_blank\">Link your Dataverse environment to Microsoft Fabric and unlock deep insights - Power Apps | Microsoft Learn</a></p>\n<p>&nbsp;</p>\n<ul>\n<li>Store, event , Product data ingested to lakehouse using any of the methods as outlined in the documentation below</li>\n</ul>\n<p><strong>Ref</strong>: <a href=\"https://learn.microsoft.com/en-us/fabric/data-engineering/load-data-lakehouse\" target=\"_blank\">https://learn.microsoft.com/en-us/fabric/data-engineering/load-data-lakehouse</a></p>\n<ul>\n<li>Fabric Ontology created combining the F&amp;O customer, store, product and event data (sample screenshot below)</li>\n</ul>\n<img />\n<p>&nbsp;</p>\n<ul>\n<li>A <a href=\"https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects\" target=\"_blank\">Microsoft Foundry project</a> with an <a href=\"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/create-model-deployments\" target=\"_blank\">LLM deployment</a>, such as gpt-4.1-mini.</li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/foundry-iq-connect?tabs=foundry%2Cpython#authentication-and-permissions\" target=\"_blank\">Authentication and permissions</a> on your search service and project.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>B. Architecture Pattern</strong></p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>C. Step by Step Configuration&nbsp;</strong></p>\n<p><strong>&nbsp;</strong></p>\n<ol>\n<li>Goto Azure portal and add a search service (as that runs in the background of foundry IQ for an indexed search)</li>\n</ol>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p><strong>Ref: </strong><a href=\"https://learn.microsoft.com/en-us/azure/search/search-create-service-portal\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/search/search-create-service-portal</a></p>\n<p><strong>&nbsp;</strong></p>\n<ol start=\"2\">\n<li><strong> </strong>Goto Azure foundry portal (<a href=\"https://ai.azure.com/\" target=\"_blank\">https://ai.azure.com/</a>) and add an agent with ERP MCP as a tool:</li>\n</ol>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<ol start=\"3\">\n<li>Goto knowledge (Foundry IQ) and select the AI Search</li>\n</ol>\n<p><strong>&nbsp;</strong></p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<ol start=\"4\">\n<li>Create a knowledgebase and add the following options: Fabric IQ , Web , SharePoint. Use the knowledge base for the Retail growth Intelligence agent</li>\n</ol>\n<img />\n<p>&nbsp;</p>\n<p><strong>&nbsp;</strong></p>\n<img />\n<p>&nbsp;</p>\n<p><strong>&nbsp;</strong></p>\n<ol start=\"5\">\n<li><strong> </strong><strong>Working with the agent</strong></li>\n</ol>\n<p><strong>&nbsp;</strong></p>\n<p>The agent can be published in the channel of choice (M365, teams, copilot studio using A2A&nbsp; etc).</p>\n<p>Ref: <a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/publish-copilot\" target=\"_blank\">https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/publish-copilot</a></p>\n<p>&nbsp;</p>\n<p>The question <strong>\"Are there procurement timeline or any other risks impacting promotional sales?\"</strong></p>\n<p>is exactly the type of cross-domain reasoning scenario where the agent combines:</p>\n<p>&nbsp;</p>\n<ul>\n<li><strong>Fabric IQ Ontology</strong> → understands relationships between Store, Product, SaleEvent, Customer.</li>\n<li><strong>F&amp;O ERP MCP</strong> → retrieves operational procurement data such as PO status, Confirmed Delivery Date, Vendor performance, Inventory levels.</li>\n<li><strong>SharePoint Policy Repository</strong> → validates country-specific marketing investment rules and campaign approval constraints.</li>\n<li><strong>Foundry IQ/Web Intelligence (if enabled)</strong> → checks supplier news, disruptions, external market events.</li>\n</ul>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><td>\n<p><strong>Sub-question</strong></p>\n</td><td>\n<p><strong>Source</strong></p>\n</td><td>\n<p><strong>Why</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p>Which promotional sale events are upcoming, at which stores, for which products</p>\n</td><td>\n<p><strong>Fabric IQ ontology</strong></p>\n</td><td>\n<p>The ontology gives the agent \"business meaning… entity types (such as Store, Product…) and their relationships, not just raw tables\" — so SaleEvent → Products → Store is the anchor.</p>\n</td></tr><tr><td>\n<p>Are the promoted products actually going to be in stock in time — open POs, confirmed delivery dates, vendor lead times, on-hand/available inventory, any PO holds or approval delays</p>\n</td><td>\n<p><strong>D365 F&amp;O via the ERP MCP server</strong></p>\n</td><td>\n<p>The dynamic ERP MCP server exposes data tools (entity CRUD via OData entities) and form tools, so the agent can read purchase order lines, confirmed receipt dates, inventory on-hand, vendor lead time — the procurement facts the ontology simply doesn't hold.</p>\n</td></tr><tr><td>\n<p>Does the promotion comply with the country policy — approval lead times, spend caps, blackout periods, mandatory sign-offs</p>\n</td><td>\n<p><strong>SharePoint (Marketing Policy / Germany, India, USA)</strong></p>\n</td><td>\n<p>Policy is unstructured and country-specific; the agent must pick the folder matching the store's country and read it</p>\n</td></tr></tbody></table></div>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>&nbsp;</strong></p>"
