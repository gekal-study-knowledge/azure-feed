    "title": "Enable Dynamic Workflows in Azure Functions hosted skills"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/enable-dynamic-workflows-in-azure-functions-hosted-skills/ba-p/4551993"
    "published": "2026-09-17 21:00:00"
    "fetched": "2026-09-18 10:48:16"
    "summary": "<p>Azure Functions already gives you a familiar way to build event-driven apps. A queue message, HTTP request, timer, or event triggers the code that handles the work.</p>\n<p><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-hosted-skills\" rel=\"noopener\" target=\"_blank\">Azure Functions hosted skills</a> (formerly Serverless Agents) add AI reasoning to that model. A hosted skill can read a request, use the regular tools you give it to inspect context, and choose the next step, while your triggers, tools, and business logic stay in place.</p>\n<h1>When the work needs to keep going</h1>\n<p>Consider an insurance policy servicing request. A hosted skill can use its regular tools to understand the requested change, look up the policy, and inspect the submitted documents. If the information is ready and the request can finish now, the normal tool loop, where the model calls a tool, reads the result, and decides the next step, is a good fit.</p>\n<p>That changes when the work must continue after the initial request. An insurance policy servicing request may need to inspect several documents in parallel, wait for a configured delay before checking again for missing information, and build a review packet after the checks it depends on complete. In a normal tool loop, each result returns to the model before the skill can decide what happens next. The application must keep the job alive, save its progress, and deliver the final result.</p>\n<p>At that point, the work needs to keep running independently of the original interaction instead of relying on the model and application to coordinate every step. For a queue or other non-HTTP trigger, the final result also needs to be written or sent somewhere useful because there is no response channel.</p>\n<p><span style=\"color: rgb(30, 30, 30); font-size: 34px;\">Introducing Dynamic Workflows</span></p>\n<p><a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-hosted-skills-dynamic-workflows\" rel=\"noopener\" target=\"_blank\">Dynamic Workflows</a> is a Durable Functions-backed way to run a hosted skill's multi-step plan outside the original request. It separates planning from execution. At run time, the AI model generates a structured plan from the workflow-safe tools and subagents you explicitly allow. The hosted skill calls start_workflow with that plan. The runtime validates it, starts a Durable Functions orchestration, and runs each task when its dependencies are ready.</p>\n<p>That separation addresses the limits of the normal tool loop: the workflow store keeps state and intermediate results out of the model's context, independent checks can run in parallel, and durable timers resume waits without holding a worker open. Because a Durable Functions orchestration handles execution, the work can continue after the original request or a Functions worker restart.</p>\n<p>To test the difference, we ran the same structured multi-step task with the regular tool loop and with Dynamic Workflows, using a Foundry gpt-5.4-mini deployment. We ran it with inputs for one service and then ten services. In the Dynamic Workflows version, the model made the plan once, while the runtime kept intermediate tool results in the workflow store instead of sending them back to the model after every tool call. Dynamic Workflows used 56% fewer total model tokens for the one-service run and 93% fewer for the ten-service run, while producing the same final reports. Results will vary by workload and model, and small jobs can have planning overhead. The savings are largest when intermediate tool results would otherwise return to the model after every tool call.</p>\n<h1>How it works</h1>\n<p>Enable workflows in the hosted skill's Markdown front matter. The runtime then adds the management tools: <em>start_workflow,</em> <em>get_workflow_status</em>, <em>list_workflows</em>, <em>cancel_workflow,</em> and <em>terminate_workflow.</em> You do not implement those tools. You choose the workflow-safe tools and subagents that a plan can use.</p>\n<p>At run time, the AI model uses the hosted skill's instructions to generate a structured plan, limited to the workflow-safe tools and subagents you explicitly allow. The hosted skill calls start_workflow with that plan; the runtime validates it, starts a Durable Functions orchestration, and returns a workflow ID right away.</p>\n---\nname: Add Driver Review\ndescription: Prepares an add-driver document review for an insurance representative.\nworkflows:\n  enabled: true\ntrigger:\n  type: queue_trigger\n  args:\n    queue_name: policy-service-requests\n    connection: AzureWebJobsStorage\n---\n<p>Put workflow-safe handlers under tools/ and decorate them for use in a workflow. Each handler must run synchronously, accept one dict argument, return JSON-serializable data, and be idempotent. A worker failure can cause a handler to run more than once, which is why that last point matters. Ordinary tools retain their existing behavior unless you explicitly make them available to a workflow.</p>\n<a class=\"lia-mention lia-mention-user\" href=\"\">workflow</a>_tool(\n    description=(\n        \"Inspect one document from an add-driver request. Args: \"\n        \"{document: &lt;document&gt;, position: int}. Returns the document and evidence state.\"\n    )\n)\ndef inspect_driver_document(args: dict[str, Any]) -&gt; dict[str, Any]:\n    document = args[\"document\"]\n    evidence_state = {\n        \"received\": \"present\",\n        \"missing\": \"missing\",\n        \"expired\": \"needs_current_copy\",\n    }[document[\"status\"]]\n\n    return {\n        \"position\": args[\"position\"],\n        \"document_id\": document[\"document_id\"],\n        \"type\": document[\"type\"],\n        \"file_name\": document[\"file_name\"],\n        \"evidence_state\": evidence_state,\n    }\n<p>Dynamic Workflows runs on Durable Functions. You can configure Durable Task Scheduler in host.json and use its dashboard to see per-instance task state, retry history, and controls for work that is still running. Durable timers let a workflow wait without keeping a worker busy, then resume the steps that are ready. The workflow stays visible and durable instead of depending on an open request or a best-effort background task.</p>\n<img />\n<h1>Get started</h1>\n<p>Build your first Azure Functions hosted skill dynamic workflow with the quickstart, then use the overview and sample to go deeper:</p>\n<ul>\n<li>Follow the <a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-hosted-skills-dynamic-workflows-how-to?tabs=azure-storage\" rel=\"noopener\" target=\"_blank\">Dynamic Workflows quickstart</a>.</li>\n<li>Read the <a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-hosted-skills-dynamic-workflows\" rel=\"noopener\" target=\"_blank\">Dynamic Workflows overview</a>.</li>\n<li>Browse the <a class=\"lia-external-url\" href=\"https://github.com/Azure-Samples/hosted-skills-dynamic-workflows-insurance-policy-review/tree/main\" rel=\"noopener\" target=\"_blank\">insurance policy review sample</a> for an end-to-end implementation.</li>\n</ul>\n<p>&nbsp;</p>"
