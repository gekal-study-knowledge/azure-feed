    "title": "Automating Private Endpoint DNS Across Azure Tenants with Azure Policy and Azure Lighthouse"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/automating-private-endpoint-dns-across-azure-tenants-with-azure/ba-p/4557495"
    "published": "2026-09-17 23:49:01"
    "fetched": "2026-09-18 15:46:40"
    "summary": "<h2>Problem statement</h2>\n<p>Azure Private Endpoints let applications connect to Azure platform services through private IP addresses. They reduce public exposure, keep traffic on private networks, and support a Zero Trust architecture.</p>\n<p>In a single Microsoft Entra tenant, Azure Policy can automatically associate a Private Endpoint with a centrally managed Private DNS zone. The problem becomes more complex when an organization uses several tenants:</p>\n<ul>\n<li>A <strong>central management tenant</strong> owns the shared Private DNS zones.</li>\n<li>Separate <strong>application tenants</strong> host workloads and Private Endpoints.</li>\n<li>Application teams cannot modify resources in the central networking subscription.</li>\n<li>DNS records must be created and removed automatically as Private Endpoints are created and deleted.</li>\n<li>Cross-tenant access must be limited, auditable, and free from long-lived shared credentials.</li>\n</ul>\n<p>When an application creates a Private Endpoint, Azure must create a <code>privateDnsZoneGroup</code> and register an A record in the appropriate Private DNS zone. However, the Azure Policy identity in the application tenant cannot update a DNS zone in the central tenant unless it receives explicitly delegated access.</p>\n<pre><code>Application tenant                         Central management tenant\n------------------                         -------------------------\nApplication workload\n        |\nPrivate Endpoint\n        |\nAzure Policy\n        |\nPolicy managed identity\n        |          Cross-tenant delegation\n        +------------------------------------&gt; Central Private DNS zone\n                                                  |\n                                                  +-- Private A record</code></pre>\n<h2>Why not use a custom synchronization service?</h2>\n<p>A central pipeline or Azure Function could copy DNS records between tenants. That approach can work, but it introduces more credentials, custom code, retry and reconciliation logic, monitoring, hosting costs, and record-cleanup responsibilities.</p>\n<p>An Azure-native alternative is to combine <strong>Azure Policy</strong> with a carefully scoped <strong>Azure Lighthouse</strong> delegation. Azure Policy controls the Private Endpoint DNS lifecycle, while Azure Lighthouse gives its managed identity only the access required to work with the dedicated central DNS resource group.</p>\n<blockquote>\n<p><strong>Note:</strong> This article describes a proposed design assembled from publicly documented Azure capabilities; it is not an official Microsoft reference architecture or a claim of production implementation. Validate it through security review, threat modeling, and a non-production proof of concept before use.</p>\n</blockquote>\n<h2>Azure resources used in the solution</h2>\n<h3>Azure Private Endpoint</h3>\n<p>A Private Endpoint is a network interface with a private IP address from a virtual network. It provides private connectivity to an Azure service such as Storage, Key Vault, or Azure SQL.</p>\n<h3>Azure Private DNS Zone</h3>\n<p>A Private DNS zone resolves an Azure service name to the private IP address of its Private Endpoint. Hosting these zones centrally gives the platform team consistent ownership and allows cloud and on-premises networks to use a common DNS resolution path.</p>\n<h3>Private DNS zone group</h3>\n<p>A <code>privateDnsZoneGroup</code> is a child resource of a Private Endpoint. It associates the endpoint with one or more Private DNS zones. Azure then creates and removes the relevant DNS records as part of the endpoint lifecycle.</p>\n<h3>Azure Policy</h3>\n<p>A <code>DeployIfNotExists</code> policy detects a supported Private Endpoint and deploys the required DNS zone group when it is missing. Policy parameters identify the correct central zone for each Azure service and private-link group ID.</p>\n<h3>User-assigned managed identity</h3>\n<p>A dedicated identity in each application tenant performs policy remediation. Unlike a stored service-principal secret, a managed identity has no credential that operators need to rotate or distribute. A user-assigned identity also has a stable principal ID and an independent lifecycle.</p>\n<h3>Azure Lighthouse</h3>\n<p>Azure Lighthouse provides delegated resource management across Entra tenants. In this design, an application-tenant identity receives narrowly scoped access to DNS resources in the central tenant. In Azure Lighthouse terminology, the application tenant is the managing tenant for this specific delegation, while the central tenant owns the delegated resource group.</p>\n<h3>Terraform and GitHub Actions</h3>\n<p>Terraform creates the Lighthouse registration definition and assignment consistently for every tenant. GitHub Actions runs validation, planning, approval, and deployment. OpenID Connect workload identity federation should be used instead of a long-lived client secret.</p>\n<h2>Proposed solution</h2>\n<p>The solution gives each application tenant a dedicated policy identity and delegates that identity the <strong>Private DNS Zone Contributor</strong> role over only the required central DNS scope.</p>\n<pre><code>+---------------- Application tenant ----------------+\n|                                                     |\n|  Workload --&gt; Private Endpoint                      |\n|                    |                                |\n|            DeployIfNotExists Policy                 |\n|                    |                                |\n|          User-assigned managed identity             |\n+--------------------|--------------------------------+\n                     | Azure Lighthouse delegation\n                     | Private DNS Zone Contributor\n+--------------------v--------------------------------+\n|              Central management tenant              |\n|                                                     |\n|  Central Private DNS zones -- DNS resolution path   |\n+-----------------------------------------------------+</code></pre>\n<p>The identity does not receive general access to the central networking platform. Its delegation is limited to the dedicated resource group containing the centrally managed Private DNS zones.</p>\n<h2>How the solution works</h2>\n<ol>\n<li>An application deploys an Azure service and a Private Endpoint in its tenant.</li>\n<li>Azure Policy evaluates the new Private Endpoint.</li>\n<li>The policy identifies the service using properties such as <code>groupId</code> and <code>privateLinkServiceId</code>.</li>\n<li>The policy uses its managed identity to deploy a Private DNS zone group.</li>\n<li>The zone group references the appropriate Private DNS zone in the central tenant.</li>\n<li>Azure registers the endpoint's private IP address in the central zone.</li>\n<li>Cloud or on-premises clients resolve the service name through the central DNS path.</li>\n<li>When the Private Endpoint is deleted, Azure removes the associated DNS record through the zone-group lifecycle.</li>\n</ol>\n<h2>Deployment sequence</h2>\n<p>Deploying this pattern is best approached as a sequence of platform onboarding phases rather than a single infrastructure deployment. Each phase establishes a dependency required by the next.</p>\n<h3>Begin with the central DNS foundation</h3>\n<p>Start in the central management tenant. Create the required Private DNS zones and connect them to the approved resolution path. Depending on the wider network design, this may include virtual network links, Azure DNS Private Resolver, forwarding rules, and integration with on-premises DNS. Completing this foundation first ensures that application tenants have a valid destination for their Private Endpoint records.</p>\n<h3>Prepare the application tenant identity</h3>\n<p>Next, create a dedicated user-assigned managed identity in the application tenant. Record its tenant ID and principal ID because these values identify who will receive delegated access. Keeping this identity dedicated to DNS policy remediation makes its purpose, permissions, and audit trail easier to understand.</p>\n<h3>Establish the Lighthouse delegation</h3>\n<p>Create the Azure Lighthouse registration definition and assignment in the central tenant. Delegate only the dedicated DNS resource group using the Private DNS Zone Contributor role. Before continuing, confirm that the managing tenant, principal, role, and scope are all correct. This step must finish before Azure Policy attempts remediation; otherwise, the identity will not be able to work with the central zones.</p>\n<h3>Introduce the policy automation</h3>\n<p>With delegation active, deploy the relevant DNS policy definitions or initiative in the application tenant. Assign the policy to the managed identity and provide the central Private DNS zone resource IDs as parameters. For Private Endpoints that already exist, start a remediation task so that they receive the same configuration as newly created endpoints.</p>\n<h3>Prove the complete lifecycle</h3>\n<p>Finally, deploy a test Private Endpoint. Confirm that Azure Policy creates the Private DNS zone group, that the correct A record appears in the central zone, and that an approved workload resolves the service name to its private IP address. Delete the endpoint and verify that Azure also removes the DNS record. This final cleanup test is important: automation is only complete when it handles both creation and deletion.</p>\n<h2>How to validate the solution</h2>\n<p>A successful deployment does not prove that name resolution and application connectivity work. Validation should cover three layers.</p>\n<h3>1. Control-plane validation</h3>\n<ul>\n<li>The Lighthouse registration definition exists.</li>\n<li>The registration assignment references the correct definition.</li>\n<li>The managing tenant, principal ID, role, and scope are correct.</li>\n<li>The policy assignment uses the intended managed identity.</li>\n<li>The policy parameters contain the correct central zone resource IDs.</li>\n</ul>\n<h3>2. Resource validation</h3>\n<ul>\n<li>The test Private Endpoint exists.</li>\n<li>The policy reports compliance or completes remediation successfully.</li>\n<li>A Private DNS zone group exists below the endpoint.</li>\n<li>The zone group references the intended central zone.</li>\n<li>The expected A record exists and matches the endpoint's private IP address.</li>\n</ul>\n<h3>3. Resolution and lifecycle validation</h3>\n<p>From an approved application network, resolve the service name and confirm that it returns a private IP address:</p>\n<pre><code>Resolve-DnsName myservice.blob.core.windows.net</code></pre>\n<p>Test application connectivity over the private path. Then delete the test Private Endpoint and confirm that the corresponding record is removed from the central zone.</p>\n<h2>Security considerations</h2>\n<ul>\n<li>Use a dedicated identity for DNS policy remediation.</li>\n<li>Scope the Lighthouse delegation to only the dedicated DNS resource group.</li>\n<li>Separate deployment identities from runtime identities.</li>\n<li>Use workload identity federation instead of stored secrets.</li>\n<li>Require approval before applying delegation changes.</li>\n<li>Protect tenant configuration and Terraform state.</li>\n<li>Monitor Lighthouse registration assignments, policy remediation, and DNS changes.</li>\n<li>Test both DNS record creation and deletion.</li>\n<li>Review every new Private Link service before enabling its policy.</li>\n</ul>\n<h2>Benefits and trade-offs</h2>\n<p>This pattern can provide central DNS governance, automatic registration and cleanup, repeatable tenant onboarding, reduced custom code, and narrowly scoped cross-tenant access. Azure Lighthouse itself does not add a service charge.</p>\n<p>The design also has trade-offs. Each application tenant requires an explicit delegation, and the central platform must govern identities originating in multiple tenants. Azure Lighthouse primarily delegates Azure control-plane access; it does not solve every data-plane authorization requirement. Policy definitions must also be maintained as new Private Link services are introduced.</p>\n<h2>When to use this pattern</h2>\n<p>Consider this architecture when workloads span multiple Entra tenants, Private DNS zones must remain centrally owned, application teams should not receive broad central-network access, and the organization prefers an Azure-native lifecycle over custom synchronization code.</p>\n<p>A simpler design may be more suitable when all resources are in one tenant, only a few endpoints exist, or organizational policy does not permit cross-tenant delegated identities.</p>\n<h2>Conclusion</h2>\n<p>Cross-tenant Private Endpoint DNS is more than a DNS challenge. It combines networking, identity, governance, automation, and resource lifecycle management.</p>\n<p>Azure Policy and Azure Lighthouse provide a promising Azure-native pattern: policy manages the endpoint-to-zone association, Azure manages the DNS record lifecycle, and Lighthouse supplies only the cross-tenant permission required for the operation.</p>\n<blockquote>\n<p>Grant the smallest required DNS scope, automate the complete lifecycle, and validate the result from policy evaluation through application connectivity.</p>\n</blockquote>\n<h2>Further reading</h2>\n<ul>\n<li><a href=\"https://learn.microsoft.com/azure/lighthouse/overview\" rel=\"noopener\" target=\"_blank\">What is Azure Lighthouse?</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/private-link/private-endpoint-dns\" rel=\"noopener\" target=\"_blank\">Azure Private Endpoint DNS configuration</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/cloud-adoption-framework/ready/azure-best-practices/private-link-and-dns-integration-at-scale\" rel=\"noopener\" target=\"_blank\">Private Link and DNS integration at scale</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/governance/policy/concepts/effect-deploy-if-not-exists\" rel=\"noopener\" target=\"_blank\">DeployIfNotExists policy effect</a></li>\n<li><a href=\"https://learn.microsoft.com/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-azure\" rel=\"noopener\" target=\"_blank\">Use OpenID Connect with GitHub Actions and Azure</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/lighthouse/concepts/architecture\" rel=\"noopener\" target=\"_blank\">Azure Lighthouse architecture and delegation scopes</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/lighthouse/concepts/tenants-users-roles\" rel=\"noopener\" target=\"_blank\">Azure Lighthouse tenants, principals, and supported roles</a></li>\n</ul>"
