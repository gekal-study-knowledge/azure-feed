"overview": |
  この日は 7 件で、提供終了の告知が 2 件と、セキュリティ運用の刷新が話題でした。Azure Functions では、.NET 8 と .NET 9 のサポートが 2026 年 11 月 10 日に終了します。それまでに .NET 10 へ移行する必要があり、以降も Function App は動作し続けるものの、セキュリティ更新とサポートは提供されません。同じく PowerShell 7.4 のサポートも 2026 年 11 月 10 日に終了し、PowerShell 7.6 への移行が案内されています。セキュリティブログでは、Microsoft Defender における ISOC が発表されました。エージェント型セキュリティのために作られた基盤で、SIEM と脅威防御の主要なソリューションを 1 つにまとめ、エージェント時代に向けて SOC を作り直すものと位置づけられています。インフラストラクチャブログでは、Azure と NVIDIA を基盤に科学や産業のブレークスルーを起こしている企業を取り上げる動画シリーズ Catalyst が紹介されました。コンテナでは、Azure Container Apps Express が一般提供となりました。コンテナイメージから本番運用に耐えるアプリまでを最短で届けることを狙ったもので、事前に環境を用意する必要がなく、即時プロビジョニング、1 秒未満に最適化された起動、ゼロからのスケールを備えます。イメージを持ち込み、リージョンを選び、必要な設定を加えてデプロイするだけで Azure が環境を用意します。パブリックプレビュー中に数千規模の Express アプリが作られ、そこで寄せられた「足りないもの」の声が GA の優先順位を決めたとされています。Azure ブログでは、エージェントが仕事をするようになると何が変わるのかを扱った「Designing agent-first platforms」が公開され、先行している組織は既存のものに AI を足しているのではなく、別種のソフトウェアとして設計し直していると論じられました。あわせて「Your architecture diagram is not your resilience」では、レジリエンスを一度設定して終わりのプロジェクトとして扱うのではなく、維持し続ける性質として捉えるべきだと指摘されています。
