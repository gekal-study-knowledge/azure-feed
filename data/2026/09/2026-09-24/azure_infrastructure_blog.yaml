    "summary": "<h4>In the Catalyst series, we explore the transformative power of AI by showcasing visionary companies driving scientific and industry breakthroughs powered by Azure and NVIDIA. This video series spotlights how innovation ignites action and how today’s visionaries are shaping tomorrow with the power of AI and cloud innovation.</h4>\n<h2><span class=\"lia-text-color-10\"><strong>Building resilience against extreme weather</strong></span></h2>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>Tomorrow.io turns space-based data into AI-driven forecasting powered by Azure and NVIDIA at a global scale. Its high-performance AI models deliver real-time weather intelligence that helps governments and enterprises anticipate disruption, optimize operations, and act faster in the face of severe events.</p>\n<h2><strong><span class=\"lia-text-color-10\">Expanding access in preventative healthcare</span></strong></h2>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>Powered by Microsoft Azure and NVIDIA, Helfie uses multimodal AI to transform smartphone selfies into intelligent health screening at scale. By combining advanced models with real-time inference, it delivers rapid biometric insights that help identify risks earlier and expand access to remote and underserved communities.</p>\n<h2><strong><span class=\"lia-text-color-10\">How AI is mapping the tree of life</span></strong></h2>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>Powered by Azure and NVIDIA to build the world’s largest biological databases, Basecamp Research is decoding the complexity of biology to accelerate scientific breakthroughs.</p>\n<h2><strong><span class=\"lia-text-color-10\">Building the next frontier of data</span></strong></h2>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>Powered by Microsoft Azure and NVIDIA, Global Objects is digitizing the real world by creating high-fidelity digital twins of over 5 million physical items. These photorealistic 3D models are transforming immersive content creation across Hollywood, gaming, robotics, and cultural preservation.</p>\n<h2><strong><span class=\"lia-text-color-10\">Changing how doctors diagnose diseases with AI</span></strong></h2>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p>Powered by Microsoft Azure and NVIDIA, Pangaea Data is closing care gaps by identifying untreated and under-treated patients across rare and hard-to-diagnose diseases faster, earlier, and more accurately.</p>\n<h3><span class=\"lia-text-color-10\"><strong>Learn more</strong></span></h3>\n<p>The Catalyst series explores how organizations are using AI infrastructure to tackle some of their most complex technical and business challenges, from accelerating scientific discovery to advancing autonomous systems and transforming core industries.&nbsp;</p>\n<p>Learn more about <a class=\"lia-external-url\" href=\"https://datacenters.microsoft.com/catalyst-series/\" rel=\"noopener\" target=\"_blank\">Catalyst</a>.</p>\n<p>Learn more about <a class=\"lia-external-url\" href=\"https://azure.microsoft.com/en-us/solutions/high-performance-computing/ai-infrastructure?msockid=2d4dccd6b15a6db43209db0bb0266ca9\" rel=\"noopener\" target=\"_blank\">Azure AI infrastructure</a>.&nbsp;</p>"
