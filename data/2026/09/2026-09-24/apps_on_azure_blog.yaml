    "title": "Azure Container Apps Express is now Generally Available"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/azure-container-apps-express-is-now-generally-available/ba-p/4559101"
    "published": "2026-09-24 00:33:53"
    "fetched": "2026-09-24 14:35:10"
    "summary": "<p>For many web apps and APIs, a container image should be enough to get started. Developers should not have to choose and configure an environment before the first deployment.</p>\n<p>Today, <strong>Azure Container Apps Express</strong> reaches general availability. It is the fastest way to go from a container image to a production-ready app on Azure, with instant provisioning, startup optimized for sub-second performance, and scale-from-zero.</p>\n<p>Customers created many thousands of Express apps during public preview and told us, clearly and often, what was missing. That feedback set the priorities for general availability, and it continues to guide what comes next.</p>\n<img />\n<h2>From container image to running app</h2>\n<p>Express starts with the application. Bring a container image, choose a region, add the configuration your app needs, and deploy. In the Express experience, there is no environment to stand up first. Azure provisions the underlying compute, ingress, and scaling.</p>\n<p>That shorter path matters when you are shipping a web app or API. It matters even more when the thing doing the shipping is an agent: AI-assisted workflows can create and update apps far faster than anyone can configure infrastructure by hand.</p>\n<p>Speed continues after deployment. Express apps can scale to zero when idle and are optimized for sub-second startup when traffic returns. For a measured look at that experience, <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/azure-container-apps-express-for-shipping-container-apps-fast/4531371\" rel=\"noopener\" target=\"_blank\">see Express scale from zero</a>.</p>\n<h2>Broad regional availability</h2>\n<p>At general availability, Express is available in more than 40 Azure regions, covering almost every public region where Azure Container Apps is offered. You get the same direct deployment experience while placing applications close to users and data. See the current list in the <a href=\"https://learn.microsoft.com/azure/container-apps/express-overview#region-availability\" rel=\"noopener\" target=\"_blank\">Express region availability documentation</a>.</p>\n<h2>Built on Azure Container Apps Sandboxes</h2>\n<p>Azure Container Apps Express runs on <strong>Azure Container Apps Sandboxes</strong>, the isolated compute layer behind its provisioning and startup speed.</p>\n<p>Developers can also use Sandboxes directly to build agent platforms, secure code-execution services, and other systems that need isolated compute on demand. The <a href=\"https://aka.ms/aca/sandbox/launch-blog\" rel=\"noopener\" target=\"_blank\">Azure Container Apps Sandboxes announcement</a> covers the compute platform underneath Express.</p>\n<h2>Where Express goes next</h2>\n<p>We launched Express in public preview while its focused feature set was still taking shape. That gave customers access sooner and let real usage shape the work that followed.</p>\n<p>Since preview, we have expanded regional availability, strengthened Express for production workloads, and added capabilities that fit its direct application model. General availability makes Express ready for production use. We will continue adding features while preserving its focus on fast, simple deployment.</p>\n<p>Express offers a focused subset of Azure Container Apps capabilities. Choose Express when speed and simplicity matter most. Choose a standard Container Apps environment when you need greater control over networking, GPU compute, advanced configuration, or environment-level capabilities such as Dapr.</p>\n<h2>Deploy your first Express app</h2>\n<p>Ready to try it? <a href=\"https://containerapps.azure.com/apps/create\" rel=\"noopener\" target=\"_blank\">Create an Azure Container Apps Express app</a>.</p>\n<p>Then <a href=\"https://learn.microsoft.com/azure/container-apps/express-overview\" rel=\"noopener\" target=\"_blank\">read the Express documentation</a>, <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/azure-container-apps-express-for-shipping-container-apps-fast/4531371\" rel=\"noopener\" target=\"_blank\">see Express scale from zero</a>, or <a href=\"https://aka.ms/aca/sandbox/launch-blog\" rel=\"noopener\" target=\"_blank\">learn about Azure Container Apps Sandboxes</a>.</p>"
