    "title": "Elasticsearch Vector Database on Azure: semantic search and RAG without managing a cluster"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/elasticsearch-vector-database-on-azure-semantic-search-and-rag/ba-p/4558647"
    "published": "2026-09-21 22:34:07"
    "fetched": "2026-09-22 21:12:50"
    "summary": "<p>With <a href=\"https://www.elastic.co/search-labs/blog/vector-database-rag-serverless\" rel=\"noopener\" target=\"_blank\">Elasticsearch Vector Database</a>, Elastic's new serverless offering for vector workloads, Azure customers can build semantic search, retrieval-augmented generation (RAG), and agent-powered experiences. <a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/partner-solutions/elastic/overview\" target=\"_blank\"><strong>Azure Native Integrations</strong></a> make it easy to discover, deploy, and manage the resource through the Azure portal.</p>\n<h1>Built for AI, without managing a search cluster</h1>\n<p>Elasticsearch Vector Database brings key retrieval capabilities together, so you can focus on your application:</p>\n<ul>\n<li><strong>Hybrid search and relevance:</strong> Combine keyword and vector retrieval, with metadata filters and reranking to refine the context returned to your application.</li>\n<li><strong>Managed embeddings and inference:</strong> Use Elastic's semantic_text field and managed inference to generate embeddings without running separate machine learning infrastructure.</li>\n<li><strong>Context for agents:</strong> Give agents access to relevant Elasticsearch data and tools through integrations such as <a href=\"https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/announcing-elastic-mcp-server-in-microsoft-foundry-tool-catalog/4469302\" rel=\"noopener\" target=\"_blank\">Elastic MCP Server in Microsoft Foundry</a>.</li>\n</ul>\n<p>Built on Elastic's Search AI Lake architecture with Azure Blob Storage, Elastic Cloud Serverless manages the underlying infrastructure, so you don't have to provision or maintain clusters.</p>\n<h1>Discover and deploy directly from Azure</h1>\n<ol>\n<li><strong>From the resource hub:</strong> Open <a href=\"https://portal.azure.com/#browse/Microsoft.Elastic%2Fmonitors\" rel=\"noopener\" target=\"_blank\">Elastic Cloud (Elasticsearch)</a> in the Azure portal. Select <strong>Create</strong>, then <strong>Elasticsearch Vector Database</strong>.</li>\n<li><strong>From Azure Marketplace:</strong> Open <a href=\"https://portal.azure.com/#view/Microsoft_Azure_Marketplace/GalleryItemDetailsBladeNopdl/id/elastic.ec-azure-vector/selectionMode~/false/resourceGroupId//resourceGroupLocation//dontDiscardJourney~/false/selectedMenuId/home/launchingContext~/%7B%22galleryItemId%22%3A%22elastic.ec-azure-vectorelastic-cloud-usage%22%2C%22source%22%3A%5B%22GalleryFeaturedMenuItemPart%22%2C%22VirtualizedTileDetails%22%5D%2C%22menuItemId%22%3A%22home%22%2C%22subMenuItemId%22%3A%22Search%20results%22%2C%22telemetryId%22%3A%22654c8388-f362-4a50-ad5e-6d2a999a74d7%22%7D/searchTelemetryId/ea183133-f64c-4f4f-8669-a9f62220f792\" rel=\"noopener\" target=\"_blank\">Elasticsearch - Vector Database</a> to review the offering and begin creating your resource.</li>\n</ol>\n<p>Discover Elasticsearch Vector Database alongside Elastic's search, observability, and security offerings.</p>\n<img />\n<p>&nbsp;</p>\n<p>You'll need deployment permissions, such as Owner or Contributor access, on the target Azure subscription. Follow the creation flow to select your subscription, resource group, and an available region, then review the configuration and create your resource.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<h1>Go from your resource to your first query</h1>\n<p>Your resource overview in the Azure portal brings together connection links and shortcuts to Elastic's tools:</p>\n<ul>\n<li><strong>Add data &amp; embed:</strong> Add documents and generate embeddings using semantic_text and Jina models.</li>\n<li><strong>Open Agent Builder:</strong> Ask natural-language questions grounded in your data.</li>\n<li><strong>Open in Dev Tools:</strong> Start with a prefilled semantic search example, then adapt it to your index and queries.</li>\n</ul>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>Start in Azure, then move directly into Elastic's tools to ingest, embed, and query your data.</p>\n<p>Try Elastic's <a href=\"https://www.elastic.co/docs/solutions/vector-database/vector-full-text-search\" rel=\"noopener\" target=\"_blank\">vector and full-text search quickstart</a>, then use the retrieved context in an application powered by Azure OpenAI.</p>\n<h1>Keep management and billing connected to Azure</h1>\n<p>The <a href=\"https://learn.microsoft.com/en-us/azure/partner-solutions/elastic/overview\" rel=\"noopener\" target=\"_blank\">Azure native integration</a> connects more than the creation experience:</p>\n<ul>\n<li><strong>Familiar management:</strong> Organize Elastic resources with Azure resource groups and tags, and view them alongside your other Azure resources.</li>\n<li><strong>Connected access:</strong> Use Microsoft Entra ID single sign-on to access Elastic from Azure. Manage the Azure resource in the portal, then use Elastic's tools for data and search workflows.</li>\n<li><strong>Consolidated billing:</strong> Marketplace purchases appear on your Azure billing statement. View Elastic usage and costs in the Elastic Cloud Console. Eligible purchases also count toward your Microsoft Azure Consumption Commitment (MACC), subject to <a href=\"https://learn.microsoft.com/en-us/marketplace/azure-consumption-commitment-benefit\" rel=\"noopener\" target=\"_blank\">offer eligibility and agreement terms</a>.</li>\n</ul>\n<h1>Start building, and explore more on Azure</h1>\n<p>Start your next AI project with <a href=\"https://portal.azure.com/#view/Microsoft_Azure_Marketplace/GalleryItemDetailsBladeNopdl/id/elastic.ec-azure-vector/selectionMode~/false/resourceGroupId//resourceGroupLocation//dontDiscardJourney~/false/selectedMenuId/home/launchingContext~/%7B%22galleryItemId%22%3A%22elastic.ec-azure-vectorelastic-cloud-usage%22%2C%22source%22%3A%5B%22GalleryFeaturedMenuItemPart%22%2C%22VirtualizedTileDetails%22%5D%2C%22menuItemId%22%3A%22home%22%2C%22subMenuItemId%22%3A%22Search%20results%22%2C%22telemetryId%22%3A%22654c8388-f362-4a50-ad5e-6d2a999a74d7%22%7D/searchTelemetryId/ea183133-f64c-4f4f-8669-a9f62220f792\" rel=\"noopener\" target=\"_blank\"><strong>Elasticsearch - Vector Database</strong></a> in Azure Marketplace, or <a href=\"https://portal.azure.com/#browse/Microsoft.Elastic%2Fmonitors\" rel=\"noopener\" target=\"_blank\"><strong>open the Elastic resource hub</strong></a> in the Azure portal.<strong> New users get a 7-day free trial!</strong></p>\n<p>Explore other Elastic offerings on Azure: <a href=\"https://azuremarketplace.microsoft.com/marketplace/apps/elastic.ec-azure-pp?tab=Overview\" rel=\"noopener\" target=\"_blank\">Elasticsearch</a>, <a href=\"https://azuremarketplace.microsoft.com/marketplace/apps/elastic.ec-azure-observability?tab=Overview\" rel=\"noopener\" target=\"_blank\">Elastic Observability</a>, and <a href=\"https://azuremarketplace.microsoft.com/marketplace/apps/elastic.ec-azure-security?tab=Overview\" rel=\"noopener\" target=\"_blank\">Elastic Security</a>. Learn more about <a href=\"https://learn.microsoft.com/en-us/azure/partner-solutions/elastic/overview\" rel=\"noopener\" target=\"_blank\">Elastic on Azure</a> and how <a href=\"https://learn.microsoft.com/en-us/azure/partner-solutions/overview\" rel=\"noopener\" target=\"_blank\">Azure Native Integrations</a> connect partner services with Azure onboarding, management, identity, and billing.</p>"
