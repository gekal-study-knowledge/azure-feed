  この日は 5 件で、開発者向けツールの一般提供とエージェント型 AI の研究応用が話題でした。Azure Developer CLI (azd) の Extension Framework が一般提供となり、開発者・チーム・パートナーが独自の機能で azd を拡張して、好みのアプリケーション開発ワークフローを組み込めるようになりました。Azure App Testing の Playwright Workspaces も、Switzerland North・Japan East・Australia East で一般提供になりました。フルマネージドのクラウドホスト型ブラウザーで、エンドツーエンドの Playwright テストを並列に大規模実行できます。Apps on Azure ブログでは、共有の Azure DevOps パイプラインテンプレートがパラメータの氾濫で使いにくくなる問題に対し、Manifest Facade パターンで複雑さを隠す手法が紹介されました。もう 1 本は、Azure がばらばらのフィードバック信号を AI で統合し、サービス単位に分断されがちな体験の横断的な摩擦を特定して顧客体験の改善につなげている取り組みです。Azure ブログでは、研究開発におけるエージェント型 AI の価値は一度きりの良い回答ではなく、複数の仮説を追い、証拠に照らして検証し、うまくいかないことから学んでアプローチを適応させる、新しい探索のしかたにあるという論考が公開されました。
