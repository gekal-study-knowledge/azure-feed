"overview": |
  この日はクラウド間の接続が主題でした。Azure Multicloud Interconnect がパブリックプレビューとして発表され、Azure と他のクラウドプロバイダーとの間にプライベートな接続を張るマネージドサービスとして、まず Amazon Web Services (AWS) がサポート対象になります。ネットワークブログでは、マルチクラウドがもはや例外ではなく大半の企業の運用形態になっている一方で、分析を一方のクラウドで、アプリケーションを別のクラウドで動かし、データレジデンシー要件に合わせてワークロードを配置し、AI モデルの学習・推論のために大量のデータをクラウド間で移動させるようになったにもかかわらず、それらをつなぐネットワークがマルチクラウド戦略の中で最も難しい部分のまま残っていた、という背景が説明されています。もう 1 件のサービス更新は VM のディスク単位のレジリエンシーのプレビューです。従来、接続されたマネージドディスクへのアクセスが長時間失われると、Azure は VM をシャットダウンし、ディスクの接続が回復してから起動し直すという復旧を自動で行っており、これが引き続き既定の動作となります。あわせて SDK ブログでは、Azure Connector Namespace で MCP サーバーをホストし、サーバー基盤を自前で運用せずに Azure SRE Agent へ運用ツールを与える方法が紹介されました。
