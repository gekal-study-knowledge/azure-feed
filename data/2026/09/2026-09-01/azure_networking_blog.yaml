    "title": "Simpler, private connectivity between Azure and AWS with Azure Multicloud Interconnect"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/simpler-private-connectivity-between-azure-and-aws-with-azure/ba-p/4550556"
    "published": "2026-09-01 02:59:37"
    "fetched": "2026-09-01 10:29:15"
    "summary": "<p><span>Multicloud is no longer the exception — it is how most enterprises operate. Teams run analytics in one cloud and applications in another, place workloads to meet data-residency requirements, and increasingly move large volumes of data between clouds to train and serve AI models. Yet the network that connects these environments has remained one of the hardest parts of a multicloud strategy to get right.</span><span>&nbsp;</span></p>\n<p><span>Connecting Azure and AWS privately has traditionally meant stitching together Azure ExpressRoute, AWS Direct Connect, a connectivity provider or colocation footprint, customer-managed routers, BGP sessions, and link-layer encryption — then owning the resiliency design and day-to-day operations across all of it. The result is often slow to deliver, difficult to troubleshoot, and inconsistent in performance.</span><span>&nbsp;</span></p>\n<p><span>Today, Microsoft and AWS are together introducing </span><span>Azure Multicloud Interconnect</span><span>, a jointly engineered, fully managed service that delivers private, high-throughput connectivity between Azure and AWS through a single logical resource. Both clouds coordinate provisioning, resiliency, encryption, and lifecycle operations, so the connection between your environments simply works — end to end.</span><span>&nbsp;</span></p>\n<p><strong><span class=\"lia-text-color-10\">The challenge with connecting clouds today&nbsp;</span></strong></p>\n<p><span>For most organizations, cross-cloud connectivity has been a build-it-yourself exercise. Establishing a private link between Azure and AWS typically requires provisioning an ExpressRoute circuit on one side and a Direct Connect circuit on the other, engaging a connectivity provider or securing space in a colocation facility to bridge them, and then configuring and maintaining the routers, BGP peering, and encryption that tie the two clouds together.</span><span>&nbsp;</span></p>\n<p><span>Each of those pieces is owned by a different team or vendor, which makes the end-to-end path only as reliable as its least-managed component. When something breaks, isolating the root cause means coordinating across Microsoft, AWS, a network provider, and your own operations team — and mean time to resolution suffers as a result. Capacity planning is equally difficult: bandwidth is often provisioned for peak demand and left underused, while scaling up to meet a new AI or data initiative can take weeks.</span><span>&nbsp;</span></p>\n<p><span>The outcome is a connectivity layer that is slow to stand up, expensive to operate, and hard to reason about — exactly the opposite of what a multicloud strategy is meant to deliver. Azure Multicloud Interconnect removes that complexity by turning cross-cloud connectivity into a managed service.</span><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-10\"><strong>What is Azure Multicloud Interconnect?&nbsp;</strong></span></p>\n<p><span>Azure Multicloud Interconnect is a provider-managed, private intercloud connectivity service built on the proven foundations of </span><span>Azure ExpressRoute</span><span> and </span><span>AWS Direct Connect</span><span>. Instead of assembling and operating the underlying components yourself, you establish one interconnect resource and consume a private, dedicated path between your Azure and AWS environments.</span><span>&nbsp;</span></p>\n<p><span>Under the covers, Microsoft and AWS coordinate the circuits, routing, and encryption on your behalf. You get the outcome you want — a reliable private connection between clouds — without becoming the systems integrator for it. Because the service builds on ExpressRoute and Direct Connect, it fits naturally into the connectivity models, tooling, and operational practices your teams already use in each cloud.</span><span>&nbsp;</span></p>\n<p><span>One managed resource replaces a stack of circuits, routers, BGP sessions, and encryption you would otherwise build and operate yourself.&nbsp;</span><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<img />\n<p><span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><span>Figure 1. Azure Multicloud Interconnect provides a single, managed private path between Azure and AWS, built on ExpressRoute and Direct Connect with a quad-redundant, 400G-class design and MACsec encryption.</span><span>&nbsp;</span></p>\n<p><strong><span class=\"lia-text-color-10\">How it works&nbsp;</span></strong></p>\n<p><span>Azure Multicloud Interconnect is engineered for the performance and availability that production and AI-scale workloads demand:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>A single logical connection. </span><span>You provision and manage one interconnect resource. There are no customer-owned routers to rack, configure, or patch between the clouds.</span></li>\n<li><span>Quad-redundant, multi-site design. </span><span>The data path is built across redundant devices and diverse sites — four Azure Microsoft Enterprise Edge (MSEE) routers and four AWS routers — so there is no single point of failure.</span></li>\n<li><span>High bandwidth backbone. </span><span>A high-capacity LAG-based design provides the headroom needed for large-scale data movement and distributed AI traffic.</span></li>\n<li><span>Elastic bandwidth. </span><span>Scale capacity up or down as demand changes, rather than provisioning for peak and paying for it year-round.</span></li>\n<li><span>Encryption by default. </span><span>MACsec link-layer encryption is enabled automatically, so traffic between clouds is protected without extra configuration.</span></li>\n<li><span>Enterprise-ready networking. </span><span>The service is IPv6-ready, supports APIPA addressing, and targets a 99.99% availability SLA.</span></li>\n</ul>\n<p><span>Routing and provisioning are coordinated by the platform, which removes the most common sources of cross-cloud connectivity errors — mismatched BGP configuration, inconsistent encryption settings, and asymmetric or fragile failover paths.</span><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-10\"><strong>A foundation you can trust&nbsp;</strong></span></p>\n<p><span>Azure Multicloud Interconnect is not a new, unproven path — it extends two connectivity services that enterprises already rely on: </span><span>Azure ExpressRoute</span><span> and </span><span>AWS Direct Connect</span><span>. Both are private connectivity backbones trusted for mission-critical hybrid and cloud workloads, and the interconnect inherits their carrier-grade capacity, global edge presence, and operational maturity from day one.</span><span>&nbsp;</span></p>\n<p><span>It also means your teams do not have to learn a separate model. The interconnect appears as a first-class resource governed by the identity, access, and monitoring controls each cloud already provides, and it can be automated with the tooling you use today. Extending trusted services, rather than introducing a parallel one, is what allows Microsoft and AWS to offer intercloud connectivity as a managed experience with confidence.</span><span>&nbsp;</span></p>\n<p><span>Why this matters for your team</span><span>&nbsp;</span></p>\n<p><span>Azure Multicloud Interconnect is designed to change the economics and the experience of running across clouds.</span><span>&nbsp;</span></p>\n<p><span>Taken together, these benefits shift cross-cloud networking from a specialized, high-effort project to a repeatable, on-demand capability. Instead of dedicating senior engineers to build and babysit intercloud links, your team can direct that expertise toward the applications and data platforms that differentiate your business — while trusting that the connective tissue between clouds is reliable, secure, and ready to scale.</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Faster time to value. </span><span>Turn up private Azure–AWS connectivity through a guided, managed workflow instead of a multi-week integration project spanning several vendors.</span></li>\n<li><span>Lower operational burden. </span><span>Microsoft manages the infrastructure, resiliency, and lifecycle, so your networking team is freed from patching routers and diagnosing cross-cloud faults.</span></li>\n<li><span>Predictable, high performance. </span><span>A dedicated, private path with high capacity that delivers the consistent throughput and low latency that public-internet or VPN paths cannot guarantee.</span></li>\n<li><span>Security you don’t have to assemble. </span><span>Private connectivity plus default MACsec encryption keeps intercloud traffic off the public internet and protected in transit.</span></li>\n<li><span>A consistent experience in both clouds. </span><span>Provision, monitor, and manage the interconnect using the native constructs and tooling your teams already rely on in Azure and AWS alike.</span></li>\n</ul>\n<p><span class=\"lia-text-color-10\"><strong>Built for the way enterprises use multicloud&nbsp;</strong></span></p>\n<p><span class=\"lia-text-color-21\"><strong>“I've heard a very consistent message across many years of customer engagements - we are multi-cloud enterprise by design. With this announcement we are taking a burden on connecting clouds away from the customers.\" Igor Sakhnov, CVP Azure Networking</strong></span></p>\n<p><span>Customers have told us where dedicated, managed intercloud connectivity makes the biggest difference. Azure Multicloud Interconnect is designed for scenarios such as:</span><span>&nbsp;</span></p>\n<ul>\n<li><span>Distributed AI workloads. </span><span>Move training data and model outputs between clouds at high throughput to feed pipelines wherever the compute lives.</span></li>\n<li><span>Large-scale data movement. </span><span>Replicate datasets, back up across clouds, and support analytics that span Azure and AWS.</span></li>\n<li><span>Cross-cloud disaster recovery. </span><span>Use a second cloud as a resilient recovery target over a private, reliable link.</span></li>\n<li><span>Hybrid and best-of-breed architectures. </span><span>Run each application on the cloud that suits it best while keeping the connection between them private and performant.</span></li>\n<li><span>Regulated and sovereign workloads. </span><span>Keep intercloud traffic on a private path to help meet data-residency and compliance requirements.</span></li>\n<li><span>Workload migration. </span><span>Rehost or rebalance workloads between clouds without re-engineering connectivity for each move.</span></li>\n</ul>\n<p><span class=\"lia-text-color-10\"><strong>Availability and what’s next&nbsp;</strong></span></p>\n<p><span>Azure Multicloud Interconnect is launching first for </span><span>Azure and AWS connectivity</span><span>, the pairing customers ask about most often. Microsoft and AWS are starting with a preview so that you can validate the experience against your own architectures, with general availability to follow.</span><span>&nbsp;</span></p>\n<p><span>This is the beginning of a broader journey. Building on existing multicloud connectivity capabilities, we plan to extend the managed interconnect model to additional clouds — </span><span>including </span><span>Google Cloud</span><span> (coming soon)—</span><span> so that a consistent, provider-managed experience can span your entire multicloud estate. As always, the roadmap will be guided by customer demand and real-world use.</span><span>&nbsp;</span></p>\n<p><span>Our shared goal is simple: make the network the easiest part of your multicloud strategy, not the hardest. By delivering intercloud connectivity as a managed service, Microsoft and AWS want every organization — from a team moving its first dataset between clouds to an enterprise operating at AI scale — to connect Azure and AWS privately, securely, and with confidence, and to do it in minutes rather than months.</span><span>&nbsp;</span></p>\n<p><span class=\"lia-text-color-10\"><strong>Get started&nbsp;</strong></span></p>\n<p><span>Learn more about Azure Multicloud Interconnect, Azure ExpressRoute, and AWS Direct Connect from Microsoft and AWS documentation, talk with your Microsoft or AWS account team about joining the preview, and tell us which cloud pairings and scenarios matter most for your organization. We are building this with your feedback.</span><span>&nbsp;</span></p>\n<p><span>&nbsp;</span></p>\n<p><em><span>Azure Multicloud Interconnect is jointly delivered by Microsoft and AWS, built on Azure ExpressRoute and AWS Direct Connect. Feature availability, performance targets, and timelines may evolve as the service moves from preview to general availability.</span><span>&nbsp;</span></em></p>"
