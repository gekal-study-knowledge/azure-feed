"overview": |
  この日は 9 件で、Microsoft Foundry への主要モデル追加と、AKS の AI 対応強化、そしてフィッシング基盤の摘発が中心でした。Microsoft Foundry には、Anthropic の Claude Opus 5.5 が加わりました。コードベース全体にまたがる機能実装、複雑な問題の調査、数百ページの情報の統合、多段階の業務プロセスなど、単一のプロンプトを超えて続く仕事を担うモデルとして位置づけられています。あわせて OpenAI の GPT-6 Astra、Sol、Luna が Foundry で紹介され、本番のAI エージェント・複雑なワークフロー・大量処理に向けて、規模に応じて選べるモデルの選択肢が示されました。Reactor イベントにあわせて、AKS 上で AI アプリケーションを動かし拡張するための新機能が発表されています。今日の Kubernetes ワークロードはステートレスな Web 層にとどまらず、高価な GPU を背後に持つ推論サービス、予測しづらい挙動をするエージェント、そしてデータセットのスループットからチェックポイントの耐久性、提供時のレイテンシーへと要求が移っていくデータ経路を含むという課題意識が語られました。サービス更新では、AKS 向けの Flex Nodes がパブリックプレビューとなり、ハイブリッドやエッジのインフラを Azure の AKS コントロールプレーンに接続されたワーカーノードとして利用できます。Azure Functions は管理コネクタに対応し、Microsoft 365、Microsoft Teams、Dataverse、SharePoint、OneDrive やサードパーティのシステムなど約 1,700 のコネクタにアクセスできるようになりました。コネクタトリガーがこれらのサービスからイベントを関数に届け、型付きのコネクタクライアントからコードで操作できます。廃止予定として、Node.js 22 のサポートが 2027 年 4 月 30 日に終了します。その日以降も Azure Functions アプリは動作し続けますが、セキュリティパッチと更新、カスタマーサポートは提供されなくなるため、Node.js 24 への移行が必要です。ネットワークブログでは、Azure Resource Graph の Change Analysis が「何が変わったのか」を調べる最初の手がかりとして紹介され、VPN や接続の問題、Azure Firewall の挙動変化、VM の停止、ルーティングの問題、アプリケーションの障害を調査する際に、直近の構成変更を特定することが原因究明の近道になると解説されました。SDK ブログでは、LangChain Deep Agents の永続ファイルシステムとして Azure Blob Storage を使う方法が取り上げられています。セキュリティブログでは、AI を使った誘導・インフラの自動化・トークン窃取によってデバイスコードフィッシングを可能にする主要な PhaaS プラットフォーム EvilTokens の分析が公開され、Microsoft デジタル犯罪対策ユニット (DCU) がパートナーと協力してそのインフラと活動の停止を実現したことが報告されました。
