    "title": "Change Analysis in Azure Resource Graph: Your first stop for “What changed?”"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/change-analysis-in-azure-resource-graph-your-first-stop-for-what/ba-p/4559038"
    "published": "2026-09-23 02:57:34"
    "fetched": "2026-09-23 05:33:38"
    "summary": "<p>&nbsp;</p>\n<p><strong>Introduction</strong></p>\n<p>One of the most common questions during Azure networking troubleshooting is:</p>\n<p>“Did anything change before the issue started?”</p>\n<p>Whether we are investigating VPN/, connectivity problems, Azure Firewall behavior changes, VM outages, routing issues, or application failures, identifying recent configuration changes is often the fastest way to determine the root cause.</p>\n<p>Change Analysis is a powerful capability built on Azure Resource Graph that allows engineers and administrators to quickly see:</p>\n<ul>\n<li>What changed</li>\n<li>When the change occurred</li>\n<li>Who made the change</li>\n<li>Which client or tool performed the change</li>\n<li>The exact configuration differences before and after the change</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>What is Change Analysis?</strong></p>\n<p>Azure resources are constantly being modified through:</p>\n<ul>\n<li>Azure portal</li>\n<li>Azure CLI</li>\n<li>PowerShell</li>\n<li>ARM/Bicep deployments</li>\n<li>Terraform</li>\n<li>Azure Policy remediation</li>\n<li>Automation runbooks</li>\n<li>CI/CD pipelines</li>\n</ul>\n<p>In many organizations, multiple administrators and engineers have access to the same Azure tenant and subscriptions. Because teams often work across different regions and time zones, it can be difficult to determine who made a change and to quickly contact the responsible person when an issue occurs. While most changes are intentional and necessary for daily operations, some modifications can unintentionally introduce outages, connectivity issues, or performance problems. Azure Change Analysis provides a centralized view of resource changes and helps organizations quickly answer critical troubleshooting questions such as: Who changed a setting? Was a route table updated before traffic stopped flowing? Did someone modify an NSG rule? Was the Azure Firewall configuration changed? When was a virtual machine resized? By showing what changed, when it changed, and who made the change, Change Analysis significantly reduces troubleshooting time and helps accelerate root cause analysis.</p>\n<p>&nbsp;</p>\n<p><strong>How Change Analysis works</strong></p>\n<p>When an Azure resource is:</p>\n<ul>\n<li>Created</li>\n<li>Updated</li>\n<li>Deleted</li>\n</ul>\n<p>&nbsp;Azure Resource Graph captures change information and stores snapshots that can later be queried.</p>\n<p>The platform records:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><td>\n<p>Attribute</p>\n</td><td>\n<p>Description</p>\n</td></tr><tr><td>\n<p>Resource</p>\n</td><td>\n<p>Azure resource affected</p>\n</td></tr><tr><td>\n<p>Change Type</p>\n</td><td>\n<p>Create, Update, Delete</p>\n</td></tr><tr><td>\n<p>Timestamp</p>\n</td><td>\n<p>When the change occurred</p>\n</td></tr><tr><td>\n<p>Changed By</p>\n</td><td>\n<p>User, service principal, or system</p>\n</td></tr><tr><td>\n<p>Client Type</p>\n</td><td>\n<p>Portal, CLI, ARM template, etc.</p>\n</td></tr><tr><td>\n<p>Operation</p>\n</td><td>\n<p>Azure operation executed</p>\n</td></tr><tr><td>\n<p>Property Changes</p>\n</td><td>\n<p>Before and after values</p>\n</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>This dramatically reduces troubleshooting time because engineers can immediately identify configuration drift or recent modifications.</p>\n<p>&nbsp;</p>\n<p>Accessing Change Analysis in Azure portal</p>\n<p>As shown in the screenshot, Change Analysis can be accessed directly from the Azure portal.</p>\n<img />\n<p>&nbsp;</p>\n<p>Navigation options</p>\n<p>Global Change Analysis view</p>\n<ol>\n<li>Open Azure portal</li>\n<li>Search for Change Analysis</li>\n<li>Select Change Analysis</li>\n</ol>\n<p>This approach is particularly useful when troubleshooting a specific service such as:</p>\n<ul>\n<li>VPN Gateway</li>\n<li>Azure Firewall</li>\n<li>Virtual Machine</li>\n<li>Load Balancer</li>\n<li>Application Gateway</li>\n<li>Network security group (NSG)</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Compare old and new configuration</strong></p>\n<ul>\n<li>View the exact configuration changes made to a resource.</li>\n<li>Compare Old Configuration (left panel) with New Configuration (right panel).</li>\n<li>Identify added, removed, or modified properties.</li>\n<li>Review configuration differences at the property level.</li>\n<li>Quickly determine what changed during the incident timeframe.</li>\n<li>Useful for analyzing:</li>\n<ul>\n<li>NSG rule additions or deletions</li>\n<li>Route table modifications</li>\n<li>Azure Firewall rule changes</li>\n<li>VPN Gateway configuration updates</li>\n<li>Public IP changes</li>\n<li>Resource property updates</li>\n</ul>\n</ul>\n<p>Example: In the screenshot above, Change Analysis clearly shows the previous NSG rule configuration on the left and the updated configuration on the right, making it easy to identify exactly which rule was added, modified, or removed. This helps engineers quickly correlate configuration changes with service disruptions and accelerate root cause analysis.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Common Azure networking use cases</strong></p>\n<p>As an Azure networking some practical scenarios include:</p>\n<p><strong>VPN Gateway troubleshooting</strong></p>\n<p>VPN down</p>\n<ul>\n<li>Modified Local Network Gateway prefixes</li>\n<li>BGP ASN changes</li>\n<li>Tunnel configuration updates</li>\n<li>Public IP changes</li>\n<li>IKE parameter</li>\n</ul>\n<p><strong>Azure Firewall investigation</strong></p>\n<p>A workload suddenly loses connectivity.</p>\n<p>Change Analysis may show:</p>\n<ul>\n<li>DNAT rule modification</li>\n<li>Network Rule change</li>\n<li>Application Rule update</li>\n</ul>\n<p><strong>NSG connectivity problems</strong></p>\n<p>When VM traffic is blocked unexpectedly, Change Analysis can identify:</p>\n<ul>\n<li>Newly added deny rules</li>\n<li>Priority changes</li>\n<li>Rule deletions</li>\n</ul>\n<p><strong>Route table changes</strong></p>\n<p>Change Analysis quickly exposes:</p>\n<ul>\n<li>Next-hop modifications</li>\n<li>UDR updates</li>\n<li>Route propagation changes</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Querying changes using Azure Resource Graph</strong></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>Azure Portal → Monitor → Change Analysis →Open query&nbsp; →Azure Resource Graph Explorer.</p>\n<img />\n<p>&nbsp;</p>\n<p>resourcechanges</p>\n<p>|extend timestamp = todatetime(properties.changeAttributes.timestamp)</p>\n<p>|where timestamp &gt; ago(24h)</p>\n<p>|extend resourceType = properties.targetResourceType</p>\n<p>|extend resourceId = properties.targetResourceId</p>\n<p>|extend changeType = properties.changeType</p>\n<p>|extend changeAttributes = parse_json(properties.changeAttributes)</p>\n<p>|where resourceId in ('-----------')</p>\n<p>|project id, timestamp, subscriptionId, resourceGroup, resourceId, resourceType, changeType, changeAttributes</p>\n<p>|order by timestamp desc</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Conclusion</strong></p>\n<p>Change Analysis has become one of the most valuable troubleshooting tools available in Azure. By providing visibility into who changed what and when, it helps engineers quickly identify configuration drift, reduce mean time to resolution, and accelerate root cause analysis.</p>\n<p>For Azure networking scenarios such as VPN Gateway, ExpressRoute, Azure Firewall, Route Tables, and NSGs, Change Analysis should be one of the very first tools consulted when investigating unexpected behavior.</p>\n<p>As every Azure support engineer knows, solving an incident often starts with a simple question:</p>\n<p>“What changed?”</p>\n<p>Change Analysis helps answer that question in seconds</p>"
