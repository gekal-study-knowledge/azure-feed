  "15d24ee698cf2999a974fe00d1e0fde9":
    "id": "15d24ee698cf2999a974fe00d1e0fde9"
    "title": "Run and scale AI applications on AKS – the latest product innovations"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/run-and-scale-ai-applications-on-aks-the-latest-product/ba-p/4559103"
    "published": "2026-09-23 05:17:22"
    "fetched": "2026-09-23 11:02:24"
    "summary": "<p>AI changed what teams ask of Kubernetes. Workloads today are more than a stateless web tier, they are an inference service with an expensive GPU behind it, an agent that behaves unpredictably, and a data path that shifts from dataset throughput to checkpoint durability to serving latency as the application matures. Today at the <a class=\"lia-external-url\" href=\"https://aka.ms/BCNA/b\" target=\"_blank\">Reactor event</a>, we are showing demos and announcing new capabilities to support your AI workloads. &nbsp;</p>\n<p>This wave of AKS releases answers three of those pressures directly: isolating AI workloads, assembling the componentry that agentic applications need, and making capacity work harder than it did last quarter.</p>\n<p><strong>Workload and AI isolation</strong></p>\n<p>Agents are unpredictable by design. Consider an agent installing packages, making unexpected network calls, or attempting to escape its pod into the node — with a shared kernel, one compromise becomes a node-wide problem. The AKS answer is layered: secure by default, verify the workload, then raise the boundary when the data demands it.</p>\n<ul>\n<li><strong>GA: Pod sandboxing support in node auto-provisioning (NAP).</strong> Every pod runs inside its own lightweight VM with an isolated guest kernel, built on the open-source Kata Containers project, so a compromise of one kernel instance is contained to one workload. With NAP support, that isolated compute is provisioned efficiently instead of hand-sized.</li>\n<li><strong>GA: Confidential GPU support. </strong>AMD SEV-SNP confidential VMs with NVIDIA H100 Tensor Core GPUs, linking CPU and GPU trusted execution environments. Memory stays hardware-encrypted, which helps prevent data access by cloud providers, administrators, and privileged users — the control that makes sovereign, regulated, and privacy-sensitive AI workloads viable.</li>\n<li><strong>GA: Trusted Launch support in NAP.</strong> Secure boot, virtual TPM, and boot integrity monitoring on Generation 2 VMs, applied automatically whenever NAP selects a Gen 2 SKU. No touch, no configuration, hardened nodes.</li>\n<li><strong>GA: Identity Bindings. </strong>Removes the 20 federated identity credential ceiling on a user-assigned managed identity. Multiple clusters now share one managed identity through a single credential, with access governed by granular Kubernetes RBAC and AKS-managed token exchange — the difference between a platform that stops at 20 clusters and one that doesn't.</li>\n<li><strong>GA: NFS encryption in transit and workload identity for Azure Files CSI.</strong> Protects traffic on the shared-file path and lets pods authenticate with identity instead of storage account keys, for the models, artifacts, and configuration many replicas read at once.</li>\n<li><strong>GA: Argo CD extension for AKS.</strong> Automate application deployment and continuous reconciliation from Git with trusted access and security controls built in: see application health, sync state, and the deployed revision at a glance, get improved security through automatic updates of the Argo CD components, sign in to the Argo CD UI with Azure identities, and authenticate to ACR and Azure DevOps with workload identity.&nbsp;</li>\n</ul>\n<p><strong>Agent componentry</strong></p>\n<p>Agentic applications need a path from code to a verified deployment, a runtime that absorbs bursts, and enough observability to find out why a GPU ran out of memory at 2am.</p>\n<ul>\n<li><strong>GA: Argo CD extension for AKS.</strong> Managed GitOps with application health, sync state, and deployed revision visible in one place, automatic updates for Argo CD components, single sign-on with Azure identities, and workload identity authentication to ACR and Azure DevOps. The Flux extension for AKS remains available for Flux-based workflows.</li>\n<li><strong>Public Preview: Virtual Nodes v2 as a cluster extension.</strong> Burst into Azure Container Instances in seconds without waiting for node provisioning, pay only while pods run, and get Hyper-V isolated microVMs with confidential container support. Inference spikes and agent fan-out stop requiring permanently overprovisioned nodes.</li>\n<li><strong>Public Preview: GPU memory profiling. </strong>See which functions allocate GPU memory, with no app code changes and no sidecar, and go from \"memory is under pressure\" to the exact call path as a flame graph. Profile, fix, re-profile.</li>\n</ul>\n<ul>\n<li><strong>GA: NFS encryption in transit and workload identity for Azure Files CSI.</strong> Secures the shared-file path that many replicas read at once, protecting traffic on the wire and letting pods authenticate with identity instead of storage account keys. Best fit for models, artifacts, configuration, and shared application data reached through a Kubernetes-native interface.</li>\n<li><strong>GA: Azure Container Storage v2.2.1. </strong>Improves local NVMe provisioning and expansion, reduces resource consumption at scale, and adds Elastic SAN support on tainted nodes, strengthening the production foundation for databases, data pipelines, and model-serving workloads that need container-native volume orchestration.</li>\n<li><strong>GA: Azure CSI driver security hardening (AKS release v20260904). </strong>Stronger input and mount validation, credential isolation and refresh, protection against resource-exhaustion paths, and better diagnostics. The storage integration is part of the workload trust boundary, and this release treats it that way.</li>\n</ul>\n<p>Around these, the developer surfaces stay where teams already work: the AKS extension for VS Code, AKS Skills in GitHub Copilot and your preferred CLI, AKS desktop, and Azure Kubernetes Fleet Manager resource placement for declaring one release intent across many clusters and regions.</p>\n<p><strong>Efficiency</strong></p>\n<p>Getting the most out of expensive compute is key, and we want to ensure your training, inference, fine-tuning and batch jobs spend with purpose and scale with demand. We’re introducing the following capabilities to help support.</p>\n<ul>\n<li><strong>GA: Improved Spot VM handling in NAP.</strong> Proactive replacement of evicted spot nodes via Node Problem Detector, extended eviction notification, and an in-VM rebalancing signal, so spot capacity becomes usable for real workloads.</li>\n<li><strong>GA: Provisioning Request support in Cluster Autoscaler.</strong> Immediate cleanup of partially provisioned compute when capacity constraints prevent full allocation, reducing wasted spend and capacity fragmentation for AI and batch job orchestrators.</li>\n<li><strong>GA: Ultra SSD and GPU Operator/BYO driver support in NAP.</strong> Sub-millisecond, high-IOPS storage for stateful and AI workloads, and your choice of AKS-managed GPU driver, NVIDIA GPU Operator, or a self-managed custom driver.</li>\n<li><strong>Public Preview: AKS Hyperscale Configuration.</strong> Pre-provisioned control planes in H2, H4, and H8 tiers, reaching 7,000 API server executing seats, 400 pods per second scheduling, and six etcd partitions. For AI training, HPC, batch, and surge events, the control plane is ready before demand arrives.</li>\n<li><strong>Public Preview: Automatic zonal placement. </strong>Zones auto lets AKS pick SKU-supported zones, cap any single zone at 50% of the pool, and re-evaluate capacity during scale-out instead of failing against a fixed zone list.</li>\n<li><strong>GA: Managed system components uptime SLA. </strong>A 99.9% guarantee for system components running on managed system node pools in AKS Automatic clusters, including CoreDNS, KEDA, Eraser, Konnectivity, VPA, and workload identity.</li>\n<li><strong>Private Preview:</strong> <strong>Azure Chaos Studio extension. </strong>Blue/green node pool upgrades, node pool rollback up to seven days, maxUnavailable fallback, capacity reservation groups for existing node pools, pod eviction on freeze, on-demand node health checks</li>\n</ul>\n<ul>\n<li><strong>Public Preview: Flex Nodes for AKS.</strong> A deployment option that lets application and platform teams use hybrid and edge infrastructure as connected worker nodes attached to an AKS control plane in Azure.</li>\n</ul>\n<p>With Flex Nodes for AKS, we’ve seen three forces pull workloads outside a single Azure region: data residency, constrained capacity, and latency. The traditional answer is another cluster at the edge, and with it another control plane, another upgrade cycle, another policy surface. Flex Nodes offers an alternative architecture. The Kubernetes control plane stays in Azure while only worker nodes run at the edge or on customer infrastructure, giving one cluster and one operating model across cloud and edge.</p>\n<p>Flex Nodes fits applications that require local execution but not local operations: AI inference, data processing, industrial applications, content delivery, branch office services, and latency-sensitive business workloads. Flex nodes can specifically detect NVIDIA hardware and configure the runtime, while customers supply the driver and Kubernetes GPU components today. Azure Linux, Ubuntu, and RHEL are supported. Learn more at: <a class=\"lia-external-url\" href=\"http://aka.ms/aks/flexnodeforaks\" target=\"_blank\"><strong>aka.ms/aks/flexnodeforaks</strong></a>.</p>\n<p>Where local autonomy is the requirement instead, we also have the <strong>Public Preview for AKS on bare metal Ubuntu</strong> runs a full local cluster on your own CPU and GPU hardware with no virtualization layer.</p>\n<p>AKS is more than where your AI application runs. Your Kubernetes environments now operate the contract between the workload and its state, its isolation boundary, its capacity, and its location, so your teams can spend their attention on building new AI apps, deploying agents, and supporting development teams with the open-source frameworks they need.</p>"
  "0bfa6494712d76b193b7800a3b4e1526":
    "id": "0bfa6494712d76b193b7800a3b4e1526"
    "title": "Connect Azure Functions to more services with managed connectors"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/connect-azure-functions-to-more-services-with-managed-connectors/ba-p/4558711"
    "published": "2026-09-23 04:51:43"
    "fetched": "2026-09-23 11:02:24"
    "summary": "<p>Azure Functions can already connect to many Azure services through triggers and bindings. With managed connectors, your functions can access about 1,700 connectors across services such as Microsoft 365, Microsoft Teams, <span>Dataverse, </span>SharePoint, OneDrive<span>,</span> and third-party systems.&nbsp;</p>\n<p>Connector triggers deliver events from these services to your function, while typed connector clients let your code take actions against them. You get this broader integration surface without writing the webhook registration code or managing the OAuth tokens required to connect to each service. Focus on your function's business logic and let Azure Connector Namespace handles the connection.</p>\n<p>Azure Functions integration with Connector Namespace is currently in <em>public preview</em>. It supports .NET isolated, Python, and Node.js. Review the <a href=\"https://learn.microsoft.com/azure/azure-functions/functions-connectors-overview\" rel=\"noopener\" target=\"_blank\">managed connectors overview</a> for current language, hosting plan, and regional availability.</p>\n<p>To demonstrate how connector triggers and actions work together, this article follows a .NET sample that automates RFP intake across SharePoint, Azure Content Understanding, and Teams.</p>\n<h2>From an uploaded RFP to Teams notification</h2>\n<p>Consider an organization that receives requests for proposals (RFPs) in a shared SharePoint document library. Someone must read each document, identify the requested capabilities, determine which subject-matter experts should respond, and notify the right team.</p>\n<p>The <a href=\"https://github.com/Azure-Samples/functions-connectors-net-rfp-intake-sharepoint-teams\" rel=\"noopener\" target=\"_blank\">automated RFP intake sample</a> turns that process into an event-driven workflow:</p>\n<ol>\n<li>A customer uploads an RFP to a SharePoint document library.</li>\n<li>A SharePoint connector trigger invokes an Azure Function when the file is created.</li>\n<li>The function uses a typed SharePoint connector client to retrieve the file contents.</li>\n<li>Azure Content Understanding extracts the document’s text and layout.</li>\n<li>The function applies deterministic rules to identify the customer, required capabilities, and recommended subject-matter experts.</li>\n<li>The function uses a typed Teams connector client to post the results as an Adaptive Card in a channel.</li>\n</ol>\n<p>Connector Namespace manages the SharePoint and Teams connections. The function controls file processing, document analysis, routing rules, error handling, and notification content</p>\n<h2>How the sample works</h2>\n<p>The .NET sample demonstrates both parts of the connector programming model: a connector trigger receives an event from SharePoint, and typed connector clients provided by the Connector SDKs to perform actions against SharePoint and Teams.</p>\n<p>The function starts when the SharePoint <strong>When a file is created</strong> trigger detects a new RFP. It declares the trigger using the ConnectorTrigger attribute and receives a typed payload containing the file’s properties:</p>\n[Function(\"OnNewFile\")]\npublic async Task OnNewFile(\n    [ConnectorTrigger]\n    SharePointOnlineOnNewFileItemsTriggerPayload payload,\n    CancellationToken cancellationToken)\n{\n    // Process the newly uploaded file.\n}\n<p>&nbsp;</p>\n<p>Because the trigger provides file properties rather than its contents, the function uses a typed SharePoint client to retrieve the document:</p>\nbyte[] response = await _sharePoint.GetFileContentAsync(\n    Uri.EscapeDataString(siteAddress),\n    fileIdentifier,\n    cancellationToken: cancellationToken);\n\nbyte[] document = SharePointFileContent.Decode(response);\n<p>&nbsp;</p>\n<p>The SharePoint and Teams clients are registered through dependency injection. Each client uses the runtime URL of its Connector Namespace connection and authenticates with DefaultAzureCredential:</p>\nservices.AddSingleton(\n    new SharePointOnlineClient(\n        new Uri(sharePointRuntimeUrl),\n        credential));\n\nservices.AddSingleton(\n    new TeamsClient(\n        new Uri(teamsRuntimeUrl),\n        credential));\n<p>&nbsp;</p>\n<p>The function sends the document to Content Understanding’s prebuilt-layout analyzer, which extracts its text and structure. It then applies deterministic C# rules to identify the customer and required capabilities and map those capabilities to predefined subject-matter expert roles.</p>\n<p>Finally, the function creates an Adaptive Card containing the results and posts it to the configured Teams channel with the typed Teams client:</p>\nawait _teams.PostCardToConversationAsync(\n    postAs,\n    postIn,\n    request,\n    cancellationToken);\n<p>&nbsp;</p>\n<p>Connector Namespace handles the SharePoint and Teams connections, while the function controls the document analysis, routing logic, error handling, and notification content.</p>\n<h3>Try the sample</h3>\n<p>The <a href=\"https://github.com/Azure-Samples/functions-connectors-net-rfp-intake-sharepoint-teams\" rel=\"noopener\" target=\"_blank\">RFP intake sample</a> includes the function code, Bicep infrastructure, Azure Developer CLI configuration, and supporting scripts. Its README explains how to test the workflow locally and deploy it to Azure.</p>\n<h2><span style=\"color: rgb(30, 30, 30);\">Common connector patterns</span></h2>\n<p>Managed connectors are useful when a function must react to events or perform operations in external systems. Common patterns include:</p>\n<ul>\n<li><strong>Event to action:</strong> React to an event in one service and take an action in another.</li>\n<li><strong>Event to enrich to action:</strong> Retrieve additional information related to an event before acting.</li>\n<li><strong>Event to document analysis to action:</strong> Extract text and structure from a document, apply application rules, and send the result through another connector.</li>\n<li><strong>Event to AI to action:</strong> Analyze event data with an AI service and write the result back through a connector.</li>\n<li><strong>Extend an existing function app:</strong> Add connector-based integrations alongside HTTP, timer, queue, Service Bus, Event Grid, or Durable Functions workloads.</li>\n</ul>\n<p>The RFP sample combines several of these patterns. A SharePoint event starts the workflow, a SharePoint action retrieves the document, Content Understanding extracts its contents, application code enriches the result, and a Teams action sends the notification.</p>\n<h2>Closing thoughts</h2>\n<p>Managed connectors extend the external systems that can trigger your functions and the services your function code can act on. This brings services such as SharePoint, Teams, Microsoft 365, and many third-party systems into the Azure Functions programming model without requiring you to build the underlying webhook and OAuth infrastructure.</p>\n<p>Choose Azure Functions with managed connectors when you want this broader integration surface in a code-first application and need custom branching, application libraries and SDKs, other Functions bindings, document or AI processing, or application-specific logic between the trigger and action.</p>\n<p>If the workload primarily orchestrates connector operations, involves little custom code, and would benefit from a visual designer, Azure Logic Apps is usually the simpler choice.</p>\n<h2>Resources</h2>\n<h5>Documentations&nbsp;</h5>\n<ul>\n<li><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-connectors-overview?pivots=programming-language-csharp\" rel=\"noopener\" target=\"_blank\">Overview of managed connectors in Azure Functions</a></li>\n<li><a href=\"https://github.com/Azure-Samples/azure-functions-connectors-samples\" rel=\"noopener\" target=\"_blank\">Azure Functions connector samples</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/connector-namespace/connector-namespace-overview\" rel=\"noopener\" target=\"_blank\">Azure Connector Namespace overview</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/ai-services/content-understanding/concepts/prebuilt-analyzers#prebuilt-layout\" rel=\"noopener\" target=\"_blank\">Content Understanding prebuilt-layout analyzer</a></li>\n</ul>\n<h5>Connector SDK GitHub repos</h5>\n<ul>\n<li><a href=\"https://github.com/Azure/Connectors-NET-SDK\" target=\"_blank\">.NET SDK</a></li>\n<li><a href=\"https://github.com/Azure/Connectors-python-sdk\" target=\"_blank\"> Python SDK</a></li>\n<li><a href=\"https://github.com/Azure/connectors-nodejs-sdk\" target=\"_blank\">Node.js SDK</a></li>\n</ul>"
