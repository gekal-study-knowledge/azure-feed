"overview": |
  この日は 6 件で、Azure SQL 周りの機能追加とリージョン拡大の一般提供、仮想マシンのライフサイクル方針、そして侵入後に使われるマルウェアの分析でした。データベースでは、Azure SQL Database のベクトル検索とベクトルインデックスが一般提供となりました。CREATE VECTOR INDEX と VECTOR_SEARCH の T-SQL 機能を使って、セマンティック検索のような AI シナリオ向けに効率的な近似最近傍 (ANN) 検索を実行できます。あわせて Azure SQL Dev Hub がパブリックプレビューとなりました。Azure SQL でアプリケーションを作るときの中心的な出発点となるもので、直接開発する場合にも AI エージェントを使う場合にも対応し、.NET・Python・Node.js・Java から Azure SQL へ接続するためのガイダンスとリソースがまとまっています。Azure SQL Managed Instance では 2026 年 9 月下旬の更新がまとめて一般提供となり、その中にはフレキシブルメモリ機能によって、マネージドインスタンスに割り当てるメモリ量を変更できるようになったことが含まれます。リージョンでは、ルクセンブルクの Azure Extended Zone が一般提供となりました。Azure Extended Zones は、低レイテンシーやデータレジデンシーの要件があるワークロードに応えるために、大都市圏・産業集積地・特定の法域に置かれる小規模な Azure の拡張です。運用面では、仮想マシンのライフサイクルに関する記事が公開されました。Virtual Machine Lifecycle ポリシーが世代交代をどう管理するかを定めており、利用者に透明性・予測可能性・指針を提供するという位置づけが説明されています。セキュリティブログでは、標的型の侵入で使われるモジュール型のマルウェアフレームワーク NeedyMantis の分析が公開されました。Microsoft Threat Intelligence によると、独自のローダー、暗号化されたアーカイブ、拡張可能なコンポーネントを組み合わせることで長期のアクセスを維持し、その後の活動を支える構成になっています。
