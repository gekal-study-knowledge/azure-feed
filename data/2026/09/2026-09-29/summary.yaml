"overview": |
  この日は 7 件で、Azure SQL のベクトル検索の一般提供と、バルセロナで開催された FabCon / SQLCon 2026 の発表が中心でした。Azure SQL Database でベクトル検索とベクトルインデックスが一般提供となりました。CREATE VECTOR INDEX と VECTOR_SEARCH の T-SQL 機能を使い、セマンティック検索のような AI シナリオ向けに効率的な近似最近傍 (ANN) 探索を実行できます。あわせて、Azure SQL を使ったアプリケーション開発の入口をまとめた Azure SQL Dev Hub がパブリックプレビューとなり、直接開発する場合も AI エージェントを使う場合も、.NET・Python・Node.js・Java から Azure SQL に接続するための指針とリソースが得られます。Azure SQL Managed Instance の 2026 年 9 月下旬の更新も一般提供となり、SQL マネージドインスタンスに割り当てるメモリ量を変更できるフレキシブルメモリ機能などが含まれます。Azure ブログでは、バルセロナの FabCon および SQLCon 2026 で発表された Microsoft Fabric と SQL の機能強化が、Microsoft Copilot とエージェントのための信頼できるデータ基盤づくりにどうつながるかが紹介されました。あわせて、仮想マシンのライフサイクルポリシーがどのように世代交代を管理し、顧客に透明性・予測可能性・指針を提供しているかを説明する記事も公開されています。リージョンでは、ルクセンブルクの Azure Extended Zone が一般提供となりました。Azure Extended Zones は低レイテンシーとデータ所在地の要件を満たすため、都市圏・産業集積地・特定の管轄区域に置かれる小規模な Azure の拡張です。セキュリティブログでは、Microsoft Threat Intelligence が標的型侵入で使われるモジュール型の侵害後マルウェアフレームワーク NeedyMantis を公開しました。独自のローダー、暗号化されたアーカイブ、拡張可能なコンポーネントを組み合わせ、長期的なアクセスの維持と後続の活動を支えるものです。
