"overview": |
  この日はエージェントの運用とコスト最適化、ネットワークのアウトバウンド制御が話題でした。Azure ブログでは、AI のコスト最適化はモデル選択だけでは終わらないとして、Microsoft Foundry におけるコンテキストエンジニアリングを取り上げています。知識の取得、ツールの選択、メモリ、エージェントの性能を大規模に改善することで AI のコストを下げるという整理です。運用エージェントの側では、Azure SRE Agent の ServiceNow 連携で高度なフィルタリングを使い、対応プランごとに扱うインシデントを絞り込む方法が紹介されました。ServiceNow の接続は SRE Agent が見られるインシデントの範囲を決めますが、高度なフィルターを使うと「ネットワークグループが所有する本番環境の高優先度ネットワークインシデントはネットワーク専門家へ送り、提案された操作には承認を必須にする」といった、オンコールチームが既に運用しているルールをそのままプランとして表現できます。ネットワークでは Azure Firewall の明示的プロキシ (explicit proxy) が一般提供になりました。使い慣れた明示的プロキシの設定モデルが Azure Firewall にネイティブで持ち込まれ、アプリケーションやブラウザーは標準のプロキシ設定を通じて送信 HTTP / HTTPS トラフィックを直接ファイアウォールへ送れるようになります。サービス更新では、Azure Database for MySQL フレキシブルサーバーに読み取りエンドポイントが追加され、複数のレプリカを使うときの読み取り専用接続を自動的に負荷分散できるようになりました (パブリックプレビューとプライベートプレビューの両方の告知が流れています)。もう 1 つは Azure Front Door の WAF で、プロファイル単位とルート単位のポリシー関連付けにプレビュー対応し、プロファイル全体へ広く基本的な保護をかけつつ、必要な箇所に絞り込んだポリシーを併用できます。セキュリティでは、Microsoft Teams の外部コラボレーションを悪用して IT サポートになりすまし、リモートアクセスを得て Node.js ベースのインプラントを展開する人手による侵入キャンペーンが分析されました。
