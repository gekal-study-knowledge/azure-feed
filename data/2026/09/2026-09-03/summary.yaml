"overview": |
  この日は 5 件で、エージェントのコスト最適化とネットワークのアウトバウンド制御が話題でした。Azure ブログでは、AI のコスト最適化はモデル選択だけでは終わらないとして、Microsoft Foundry におけるコンテキストエンジニアリングを取り上げています。知識の取得、ツールの選択、メモリ、エージェントの性能を大規模に改善することで AI のコストを下げるという整理です。ネットワークでは Azure Firewall の明示的プロキシ (explicit proxy) が一般提供になりました。使い慣れた明示的プロキシの設定モデルが Azure Firewall にネイティブで持ち込まれ、アプリケーションやブラウザーは標準のプロキシ設定を通じて送信 HTTP / HTTPS トラフィックを直接ファイアウォールへ送れるようになります。集中的なポリシー適用と可視性が得られる点が主眼です。サービス更新は 2 件のプレビューで、Azure Database for MySQL フレキシブルサーバーに読み取りエンドポイントが追加され、複数のレプリカを使うときの接続管理を簡素化して読み取り専用接続を自動的に負荷分散できるようになりました。もう 1 つは Azure Front Door の WAF で、プロファイル単位とルート単位のポリシー関連付けに対応し、プロファイル全体へ広く基本的な保護をかけつつ、必要な箇所に絞り込んだポリシーを併用できるようになります。セキュリティでは、Microsoft Teams の外部コラボレーションを悪用して IT サポートになりすまし、リモートアクセスを得て Node.js ベースのインプラントを展開する人手による侵入キャンペーンが分析されました。ソーシャルエンジニアリングから正規ツールを使った横展開へ至る流れと、Microsoft Defender による検知・妨害の方法が解説されています。
