    "title": "Azure Firewall explicit proxy is now generally available"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/azure-firewall-explicit-proxy-is-now-generally-available/ba-p/4552450"
    "published": "2026-09-03 00:40:04"
    "fetched": "2026-09-03 03:11:05"
    "summary": "<p><span>We are excited to announce the general availability of&nbsp;explicit proxy&nbsp;in Azure Firewall. This capability brings the familiar explicit proxy configuration model natively to Azure Firewall, enabling applications and browsers to send outbound HTTP and HTTPS traffic directly to the&nbsp;firewall&nbsp;through standard proxy settings. Customers can now gain centralized policy enforcement and visibility while reducing their dependence on self-managed forward proxy appliances.</span><span>&nbsp;</span></p>\n<h3><span><span>Proxy the traffic you choose—not the entire subnet</span></span><span>&nbsp;</span></h3>\n<p><span>Traditional route-based steering can require all traffic from a subnet to traverse&nbsp;a firewall.&nbsp;Explicit proxy&nbsp;offers a more targeted model: configure selected applications or browsers to use the Azure Firewall private IP and proxy port, while other traffic&nbsp;continues on&nbsp;its existing route. This application-level control can simplify migrations, reduce unnecessary routing changes, and help teams apply inspection where it matters most.</span><span>&nbsp;</span></p>\n<h3><span><span>What’s</span><span>&nbsp;new for general availability</span></span><span>&nbsp;</span></h3>\n<ul>\n<li><strong><span>A simpler single-port experience:</span></strong><span><strong>&nbsp;</strong>Serve both HTTP and HTTPS destinations through one HTTP explicit proxy endpoint port, reducing client configuration complexity.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><strong><span>More secure PAC file access:</span></strong><span>&nbsp;Retrieve customer-owned proxy auto-configuration files from Azure Blob Storage using a managed identity. PAC files can be up to 256 KB.</span><span>&nbsp;</span></li>\n</ul>\n<ul>\n<li><strong><span>A streamlined portal workflow:</span></strong><span>&nbsp;Enable&nbsp;Explicit proxy&nbsp;when creating a Firewall Policy, with added guidance and validation to help prevent common configuration errors.</span><span>&nbsp;</span></li>\n</ul>\n<h3><span><span>Built for real-world modernization</span></span><span>&nbsp;</span></h3>\n<p><strong><span>Modernize legacy proxy infrastructure.</span></strong><span>&nbsp;Use Azure Firewall as the forward proxy endpoint while&nbsp;retaining&nbsp;the explicit proxy model already configured in applications and browsers. This can help organizations&nbsp;consolidate&nbsp;infrastructure and reduce operational overhead associated with self-hosted proxy appliances.</span><span>&nbsp;</span></p>\n<p><strong><span>Apply selective application-level steering.</span></strong><span><strong>&nbsp;</strong>Direct only the workloads that require centralized inspection through Azure Firewall, without forcing every flow on a subnet through the same path.</span><span>&nbsp;</span></p>\n<p><span><strong>Secure Azure Arc connectivity in hybrid environments</strong>.</span><span>&nbsp;Organizations using ExpressRoute or VPN can configure Azure Firewall as a forward proxy for Azure Arc-enabled servers, providing an inspected, policy-controlled outbound path to required Azure services without opening direct internet access from corporate networks.</span><span>&nbsp;</span></p>\n<h3><span><span>How it works</span></span><span>&nbsp;</span></h3>\n<ol>\n<li><span>Enable explicit proxy in the Azure Firewall Policy and choose the HTTP proxy port used for both HTTP and HTTPS destinations.<br /><br /></span></li>\n<li><span>Configure applications manually with the firewall’s private IP and proxy port or enable proxy auto-configuration.</span><span>&nbsp;<br /><br /></span></li>\n<li><span>If you use a PAC file, store it in Azure Blob Storage and configure the required managed identity and access permissions.</span><span>&nbsp;<br /><br /></span></li>\n<li><span>Create an application rule in the Firewall Policy to&nbsp;allow&nbsp;the intended outbound destinations.</span><span>&nbsp;<br /></span></li>\n</ol>\n<h3><span>Get started today</span></h3>\n<p><span>Ready to simplify outbound web traffic steering? Explore the&nbsp;</span><a class=\"lia-external-url\" href=\"https://learn.microsoft.com/en-us/azure/firewall/explicit-proxy?tabs=portal\" rel=\"noopener\" target=\"_blank\">Azure Firewall&nbsp;explicit proxy&nbsp;documentation</a><span>&nbsp;for prerequisites, portal and API configuration steps, PAC file guidance, and supported scenarios.</span><span>&nbsp;</span></p>\n<p><span>With&nbsp;explicit proxy&nbsp;now generally available, Azure Firewall gives organizations another flexible path to modernize secure egress—combining a familiar proxy model with the simplicity, scale, and centralized management of a cloud-native service.</span><span>&nbsp;</span></p>"
