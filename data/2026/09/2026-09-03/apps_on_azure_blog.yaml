    "title": "Build Advanced ServiceNow Response Plans in Azure SRE Agent"
    "link": "https://techcommunity.microsoft.com/t5/apps-on-azure-blog/build-advanced-servicenow-response-plans-in-azure-sre-agent/ba-p/4553059"
    "published": "2026-09-03 23:07:15"
    "fetched": "2026-09-04 15:37:21"
    "summary": "<p>A ServiceNow connection tells Azure SRE Agent which incidents it can see. Advanced filtering narrows that further, so each response plan handles only the incidents it should.</p>\n<p>Advanced filters let a plan express the rule your on-call team already follows:</p>\n<blockquote>\n<p>Send High-priority production network incidents owned by the Network group to our network specialist, and require approval for its proposed actions.</p>\n</blockquote>\n<p>The response plan defines the incident criteria, response subagent, and autonomy level. The selected subagent uses the connectors, source code, telemetry, and Azure access already configured on the agent. If you are still building that foundation, see <a href=\"https://techcommunity.microsoft.com/blog/appsonazureblog/what-it-takes-to-give-sre-agent-a-useful-starting-point/4500343\" rel=\"noopener\" target=\"_blank\">What It Takes to Give SRE Agent a Useful Starting Point</a>.</p>\n<h2 id=\"match-the-incidents-your-team-owns\">Match the incidents your team owns</h2>\n<p>A plan can specify one or more assignment groups. Search by display name or <code>sys_id</code>, then choose the group from the list. The plan keeps the group's stable identity, so renaming it in ServiceNow does not break the scope.</p>\n<p>If you leave the plan's assignment group empty, it inherits the group selected under <a href=\"https://sre.azure.com/docs/tutorials/incident-platforms/setup-servicenow-indexing\" rel=\"noopener\" target=\"_blank\"><strong>Generate insights</strong></a> when ServiceNow was connected. If no group was selected there, priority, title, and the plan's other filters define the match.</p>\n<img />\n<p>You can narrow the match on fields your team already uses: priority, configuration item, category and subcategory, caller/requestor, location, state, impact, urgency, and severity. Title contains and title does not contain catch patterns those fields miss.</p>\n<img />\n<p>For fields specific to your ServiceNow instance, add up to 20 custom incident fields whose technical names start with <code>u_</code>. Custom fields use exact equality against the stored value. Reference fields normally use the record's <code>sys_id</code>.</p>\n<p>If the integration account can read ServiceNow field metadata, the form suggests friendly labels and technical names. Manual entry remains available when discovery is unavailable.</p>\n<img />\n<p>All populated filters use AND matching. Within a multi-select field, an incident can match any selected value. A plan for the Network group, High priority, category <code>network</code>, and <code>u_environment = production</code> runs only when all four conditions match.</p>\n<h2 id=\"configure-the-responder\">Configure the responder</h2>\n<p>Each plan can use the Meta Agent, when its ServiceNow skill is enabled, or a custom agent with focused instructions, skills, tools, and hooks. Custom agents share the parent SRE Agent's identity, Azure resource scope, and RBAC permissions.</p>\n<p>The built-in ServiceNow skill covers common incident actions. For more control, create a skill with your team's procedure and add search, retrieval, or other tools when the workflow needs them.</p>\n<p>Then set how far the responder can go on its own:</p>\n<ul>\n<li><strong>Autonomous</strong> is the default. The agent investigates and acts within its configured permissions.</li>\n<li><strong>Review</strong> lets the agent investigate and propose actions for approval before it changes resources.</li>\n</ul>\n<img />\n<h2 id=\"preview-and-tune-the-match\">Preview and tune the match</h2>\n<p>Before saving or enabling a plan, preview recent ServiceNow incidents against the filter. Adjust the criteria or time range until the results reflect the incidents you intend to route.</p>\n<img />\n<p>&nbsp;</p>\n<p><em>This example intentionally uses a filter with no recent matches.</em></p>\n<p>Start a new plan in Review mode. Move to Autonomous once the team has seen the filter select the right incidents and agrees with the actions the agent proposes.</p>\n<h2 id=\"get-started\">Get started</h2>\n<p><a href=\"https://sre.azure.com\" rel=\"noopener\" target=\"_blank\"><strong>Create or open your Azure SRE Agent</strong></a>.</p>\n<p>Open <strong>Incidents</strong>, select <strong>Triggers &amp; response plans</strong>, and turn on <strong>Advanced filters</strong>. You can then use the preview in new or existing response plans.</p>\n<img />\n<p>Product documentation:</p>\n<ul>\n<li><a href=\"https://sre.azure.com/docs/tutorials/incident-platforms/configure-servicenow-response-plans\" rel=\"noopener\" target=\"_blank\">Configure ServiceNow response plans</a> for the new filters and preview flow.</li>\n<li><a href=\"https://sre.azure.com/docs/tutorials/incident-platforms/setup-servicenow-indexing\" rel=\"noopener\" target=\"_blank\">Connect ServiceNow</a> if the incident platform is not configured yet.</li>\n<li><a href=\"https://sre.azure.com/docs/tutorials/agent-config/setup-response-plan\" rel=\"noopener\" target=\"_blank\">Create a response plan</a> for the end-to-end workflow.</li>\n<li><a href=\"https://sre.azure.com/docs/tutorials/automation/create-subagent\" rel=\"noopener\" target=\"_blank\">Create a custom agent</a> to define focused instructions, skills, tools, and hooks.</li>\n<li><a href=\"https://sre.azure.com/docs/tutorials/automation/create-skill\" rel=\"noopener\" target=\"_blank\">Create a skill</a> to add a reusable procedure and its tools.</li>\n<li><a href=\"https://sre.azure.com/docs/concepts/permissions\" rel=\"noopener\" target=\"_blank\">Configure agent permissions</a> to set Azure resource access.</li>\n</ul>"
