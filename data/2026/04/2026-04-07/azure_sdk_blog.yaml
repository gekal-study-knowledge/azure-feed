    "title": "MCP Apps on Azure Functions: Quickstart with TypeScript"
    "link": "https://devblogs.microsoft.com/azure-sdk/mcp-apps-on-azure-functions-quickstart-with-typescript/"
    "published": "2026-04-07 00:01:58"
    "fetched": "2026-08-27 21:13:50"
    "summary": "<p>Learn how to build and deploy MCP (Model Context Protocol) apps on Azure Functions using TypeScript. This guide covers MCP tools, resources, local development, and serverless deployment with a practical weather app example.</p>\n<p>The post <a href=\"https://devblogs.microsoft.com/azure-sdk/mcp-apps-on-azure-functions-quickstart-with-typescript/\">MCP Apps on Azure Functions: Quickstart with TypeScript</a> appeared first on <a href=\"https://devblogs.microsoft.com/azure-sdk\">Azure SDK Blog</a>.</p>"
