    "title": "Golden Image Refresh for Virtual Machines and VM Scale Sets: Driving Consistency at Scale"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/golden-image-refresh-for-virtual-machines-and-vm-scale-sets/ba-p/4521376"
    "published": "2026-05-20 11:56:39"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Overview:<br /></strong></p>\n<p>A&nbsp;<strong>golden image</strong> is a prebuilt, approved system template that represents the ideal baseline for deployment. It includes:</p>\n<ul>\n<li>Hardened operating system configuration (e.g., RHEL)</li>\n<li>Preinstalled software and dependencies</li>\n<li>Security patches and updates</li>\n<li>Organizational compliance standards</li>\n</ul>\n<p><strong>Architecture:</strong></p>\n<img />\n<p><span><strong>Golden Image Refresh for VM Scale Sets (VMSS):</strong></span></p>\n<p>Instead of updating instances individually:</p>\n<ul>\n<li>A <strong>new image version is published</strong></li>\n<li>The VMSS is updated to reference the new image</li>\n<li>Instances are gradually replaced through a controlled rollout</li>\n<li>New instances (based on updated image) are introduced</li>\n<li>Traffic is gradually shifted to these new instances</li>\n<li>Old instances are decommissioned in phases</li>\n<li>Minimizes service disruption</li>\n<li>Enables safe rollout of updated environments</li>\n<li>Allows real-time validation of new image versions</li>\n</ul>\n<p>Virtual Machine Scale Set (VMSS) deployments use a&nbsp;<strong>custom image</strong> that is baked on top of a <strong>Golden Image</strong>.<br />The Golden Image version is pinned in the environment-specific <strong>Packer variables (</strong><strong>pkrvariables</strong><strong>) files</strong>.<br />Refreshing a VMSS Golden Image involves baking a new custom image using an updated Golden Image version and deploying it via the VMSS pipelines.</p>\n<p><strong>Image Dependency Flow</strong></p>\n<ol>\n<li><strong>Golden Image</strong>\n<ul>\n<li>Published and versioned by the Golden Image Team.</li>\n<li>Source OS image, pinned in pkrvariables per environment.</li>\n</ul>\n</li>\n<li><strong>Custom Image</strong>\n<ul>\n<li>Created by the <strong>custom image pipeline</strong>.</li>\n<li>Built on top of the pinned Golden Image.</li>\n<li>Used by VMSS deployments.</li>\n</ul>\n</li>\n<li><strong>VMSS Deployment</strong>\n<ul>\n<li>Deploys or updates scale sets using the selected custom image version.</li>\n</ul>\n</li>\n</ol>\n<p><strong>Golden Image Version Management (VMSS)</strong></p>\n<ul>\n<li>Each environment pins the Golden Image version in its respective pkrvariables file.</li>\n<li>Golden Image versions are selected from the same Golden Image Galleries:\n<ul>\n<li>Dev</li>\n<li>PPR</li>\n<li>Prod</li>\n</ul>\n</li>\n<li>No automatic upgrades occur; changes are explicit and controlled via Git.</li>\n</ul>\n<p><strong>VMSS Golden Image Refresh Procedure</strong></p>\n<p><strong>1.Select Golden Image Version</strong></p>\n<ul>\n<li>Navigate to the appropriate <strong>Golden Image Gallery</strong> for the target environment.</li>\n<li>Identify the Golden Image version to be used for the refresh.</li>\n</ul>\n<p><strong>2. Update Packer Variables</strong></p>\n<ul>\n<li>Create a <strong>feature branch</strong>.</li>\n<li>Update the pinned Golden Image version in the environment-specific pkrvariables file.</li>\n</ul>\n<p><strong>3.Merge Changes</strong></p>\n<ul>\n<li>Raise a <strong>Merge Request (MR)</strong> for the updated version.</li>\n<li>After approval, merge the MR into the target branch.</li>\n</ul>\n<p><strong>Custom Image Creation</strong></p>\n<ul>\n<li>Trigger the <strong>custom image pipeline</strong>.</li>\n<li>This pipeline:\n<ul>\n<li>Uses the updated Golden Image version</li>\n<li>Bakes a <strong>new custom image</strong></li>\n<li>Publishes a new custom image version for VMSS consumption</li>\n</ul>\n</li>\n</ul>\n<p><strong>VMSS Deployment</strong></p>\n<p>Once the custom image is successfully created, deploy it using one of the following approaches:</p>\n<p><strong>Option 1: Operational Pipeline</strong></p>\n<ul>\n<li>Use the&nbsp;<strong>operational pipeline</strong> to deploy the newly created custom image to the VMSS. Operational Pipeline is separate pipeline which will refresh the image.</li>\n</ul>\n<p><strong>option 2: Infrastructure Pipeline Update</strong></p>\n<ul>\n<li>Update the infrastructure (Terraform) pipeline code with the new custom image version.</li>\n<li>Run:\n<ul>\n<li>terraform plan to review VMSS updates</li>\n<li>terraform apply to roll out the new image</li>\n</ul>\n</li>\n</ul>\n<p><strong>Terraform Behavior</strong></p>\n<ul>\n<li>VMSS instances are updated to use the newly created custom image.</li>\n<li>The same remote Terraform backend is used to preserve state consistency.</li>\n</ul>\n<p><strong>Validation and Verification</strong></p>\n<p>After deployment:</p>\n<ul>\n<li>Validate VMSS instance health</li>\n<li>Confirm successful instance provisioning</li>\n<li>Verify application and service functionality</li>\n<li>Monitor scale set upgrade status and error metrics</li>\n</ul>\n<p><strong>Image Team will provide the golden image and then we need to create custom image.</strong></p>\n<p>After retrieval of Custom image used in Infra code.</p>\n<p>The Golden image refresh in infra code, requires a activity which is called upgrade and there are 2 kinds of upgrade in VMSS :</p>\n<p><strong>Automatic upgrade -&nbsp;</strong>VMSS instances will upgrade automatically, and this requires downtime.</p>\n<p>All VMSS instances will start upgrading simultaneously and application will be down till VMSS instances is up and running.</p>\n<p><strong>Manual upgrade -&nbsp;</strong>VMSS instances need to be manually upgraded, and this requires 10 - 15 minutes of degradation.</p>\n<p>As part of this Upgrade - we need to manually upgrade VMSS instance one by one and so other instances will be up. There will be no downtime for the application.</p>\n<p>&nbsp;</p>\n<p>Bydefault VMSS will consider automatic upgrade which requires downtime. If we do not require Automatic upgrade then we need to change the setting in provider like below.</p>\n<p>provider \"azurerm\" {<br />&nbsp; features {<br /><strong>virtual_machine_scale_set {</strong><br /><strong>&nbsp; &nbsp; &nbsp; reimage_on_manual_upgrade &nbsp; &nbsp;= false</strong><br /><strong>&nbsp; &nbsp; &nbsp; roll_instances_when_required = false</strong><br />&nbsp; &nbsp; }<br />&nbsp; }</p>\n<p><strong>After updating above code in provider.tf as part of manual upgrade then update the terraform code for new golden image.&nbsp;</strong></p>\n<ul>\n<li>Create a New Image: Start by creating a new golden image with the latest updates and configurations using YAML pipeline.&nbsp;</li>\n<li>Update Terraform Configuration: Modify your Terraform configuration to reference the new image. This involves updating the source_image_id or image_reference in your azurerm_virtual_machine_scale_set resource to point to the new image version.</li>\n</ul>\n<p>Example:&nbsp;</p>\n<p><strong>source_image_id = \"/subscriptions/subscriptionid/resourceGroups/rgname/providers/Microsoft.Compute/images/confluence-prd-v-24052450\"</strong><br /><br />data_disks = [<br />&nbsp; &nbsp; {<br />&nbsp; &nbsp; &nbsp; storage_account_type &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; = \"Premium_LRS\"<br />&nbsp; &nbsp; &nbsp; caching &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= \"ReadWrite\"<br /><strong> create_option &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= \"FromImage\"</strong><br />&nbsp; &nbsp; &nbsp; lun &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 0<br />&nbsp; &nbsp; &nbsp; disk_size_gb &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; = \"500\"<br />&nbsp; &nbsp; &nbsp; disk_encryption_set_id &nbsp; &nbsp; &nbsp; &nbsp; = null<br />&nbsp; &nbsp; &nbsp; ultra_ssd_disk_iops_read_write = null<br />&nbsp; &nbsp; &nbsp; ultra_ssd_disk_mbps_read_write = null<br />&nbsp; &nbsp; }<br />&nbsp; ]<br />instances = 3&nbsp;<br />automatic_instance_repair = [{<br />&nbsp; &nbsp; enabled &nbsp; &nbsp; &nbsp;= false<br />&nbsp; &nbsp; grace_period = \"PT30M\"<br />&nbsp; }]<br />computer_name_prefix &nbsp; &nbsp; &nbsp; &nbsp; = \"Appname-prd\"<br />overprovision &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= false<br />edge_zone &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= null<br />health_probe_id &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= null<br /><strong>upgrade_mode &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; = \"Manual\"</strong><br />single_placement_group &nbsp; &nbsp; &nbsp; = true<br />secure_boot_enabled &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= false</p>\n<p><br />Apply Terraform Configuration: Run terraform apply to apply the updated configuration. This will update the scale set to use the new image.</p>\n<p>After the Apply - Upgrade type is Manual then upgrade the VMSS instances one by one to make the service up and running.</p>\n<p>&nbsp;</p>\n<p><strong><span>Golden Image Refresh for VM Scale Sets (VM)</span></strong></p>\n<p><strong><span>Scope</span></strong></p>\n<ul>\n<li>Linux VMs:\n<ul>\n<li>VMs use&nbsp;<strong>RHEL 7.9</strong></li>\n<li>VMs use&nbsp;<strong>RHEL 8.10</strong></li>\n</ul>\n</li>\n</ul>\n<p>For RHEL 7.9 , there is no golden image hence needs to create custom image. To refresh the image, change the image from (example from 1.0 to 1.1)</p>\n<p><strong>Resource Changes (VMTRF):</strong></p>\n<ul>\n<li>VM: <strong>will be replaced</strong> (source_image_id changed)</li>\n<li>OS disk: azapi_update_resource.disk ⇒ <strong>replaced</strong></li>\n<li>Data disk attachments: <strong>will be replaced</strong></li>\n<li>Network interface: <strong>updated in-place</strong></li>\n<li>Disk encryption set: <strong>updated in-place</strong></li>\n<li>Role assignments: <strong>will be replaced</strong></li>\n<li>VM extension (Custom Script Extension): <strong>will be replaced</strong></li>\n</ul>\n<p>RHEL 8.10</p>\n<p>To refresh the image, change the image from (example from 1.0 to 1.1)</p>\n<p><strong>Resource Changes (VM STD):</strong></p>\n<ul>\n<li>VM: <strong>will be replaced</strong> (source_image_id changed)</li>\n<li>OS disk: azapi_update_resource.disk ⇒ <strong>replaced</strong></li>\n<li>Data disk attachments: <strong>will be replaced</strong></li>\n<li>Network interface: <strong>updated in-place</strong></li>\n<li>Disk encryption set: <strong>updated in-place</strong></li>\n<li>Role assignments: <strong>will be replaced</strong></li>\n<li>VM extension (Custom Script): <strong>will be replaced</strong></li>\n</ul>\n<p><strong>&nbsp;</strong></p>"
