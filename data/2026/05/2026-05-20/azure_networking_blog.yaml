    "title": "Metrics Filtering and Log Aggregation Now GA for Advanced Container Networking Services"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/metrics-filtering-and-log-aggregation-now-ga-for-advanced/ba-p/4516508"
    "published": "2026-05-20 03:13:31"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p>We are thrilled to announce that Advanced Container Networking Services (ACNS) for Azure Kubernetes Service (AKS) now delivers two powerful observability features in General Availability: container network metrics filtering and container network log filtering and aggregation. Together, these capabilities set a new standard for Kubernetes network observability, giving you high-fidelity visibility at dramatically lower cost and noise. These capabilities fundamentally redefine how network observability works at scale while delivering up to 97% cost reduction.</p>\n<p><strong>Why this is a Milestone?</strong></p>\n<p>Most Kubernetes observability solutions face a fundamental tension: collect everything and drown in noise and cost, or sample and miss the signals that matter, with new features of Advanced Container Networking Services that tradeoff has been eliminated.</p>\n<p>With this release, Azure becomes the first cloud provider to deliver on-node metrics filtering and flow log aggregation for Kubernetes networking, capabilities now also contributed to the upstream Hubble project, making them available to the broader open-source community.</p>\n<p>For AKS customers running Cilium-based clusters, this means:</p>\n<ul>\n<li>Every flow you care about is captured. Everything else is dropped at the source.</li>\n<li>Log volume is compressed by up to 45% through aggregation, without losing security verdicts or error context.</li>\n<li>Costs scale with what you monitor, not with cluster size.</li>\n</ul>\n<p><strong>What’s been improved in observability?</strong></p>\n<p>This release introduces two capabilities that work together: container network metrics filtering and container network log filtering and aggregation. Both are available on AKS clusters with the Cilium data plane and give you precise controls to keep observability costs predictable while maintaining the visibility you need.</p>\n<p><strong><em>Container Network Metrics Filtering</em></strong></p>\n<p>Container network metrics are generated for all pods by default whenever Advanced Container Networking Services is enabled. With metrics filtering, you now control what gets collected at the point of ingestion, on the node, before anything is scraped or transmitted.</p>\n<p>A single ContainerNetworkMetric CRD per cluster defines which metric types (dns, flow, tcp, drop), namespaces, pod labels, and protocols to ingest. It supports both include and exclude filters, so you can maintain broad collection while carving out specific workloads or namespaces. Anything that doesn't match is dropped on the node. Changes reconcile in a few seconds, with no Cilium agent or Prometheus restarts required.</p>\n<p><strong><em>Container Network Log Filtering and Aggregation</em></strong></p>\n<p>Unlike metrics, container network logs are not generated automatically. You start capturing network flows only after applying a ContainerNetworkLog CRD that defines exactly which traffic to capture-by namespace, pod, service, protocol, or verdict. Only matching flows are logged, giving you a precise, targeted view rather than a fire hose.</p>\n<p>This is where Azure's first-to-market innovation comes in. Flow log aggregation, now built into Advanced Container Networking Services and contributed upstream to Hubble for the open-source community, groups similar flows into summarized records every 30 seconds. The result is dramatically reduced data volume while preserving security verdicts, service identity, and error context. What previously required custom post-processing pipelines is now built directly into the platform before storage costs are incurred.</p>\n<p>Every matched flow log captures: source and destination pods, namespaces, ports, protocols, traffic direction, and policy verdicts.</p>\n<p>Logs are stored in a Log Analytics workspace (ContainerNetworkLogs table) with a choice of using the Analytics or Basic tier. Built-in Azure portal dashboards are available for both tiers. Logs can also be exported to external log collectors such as Splunk or Datadog.</p>\n<p><strong>First to Market:&nbsp;</strong><strong>Azure and the upstream Hubble Contribution</strong></p>\n<p>Advanced Container Networking Services built-in filtering and aggregation capabilities were engineered from the ground up to solve real production observability challenges at scale. Rather than keeping this innovation proprietary, Azure contributed the log aggregation and filtering capabilities to the upstream Hubble project, the observability layer of the Cilium ecosystem.</p>\n<p>This means:</p>\n<ul>\n<li>AKS customers get a fully managed, Azure-native experience with portal dashboards, Log Analytics integration, and Grafana visualization, out of the box.</li>\n<li>The broader open-source community gains access to the same filtering and aggregation primitives through upstream Hubble.</li>\n</ul>\n<p>Azure is the first to ship this capability in a managed Kubernetes service, and the first to give it back to the community.</p>\n<p><strong>Key Benefits</strong></p>\n<p>\U0001F4B0 Lower observability cost. Metrics filtering drops unwanted data on the node before Prometheus ever scrapes it. Flow log aggregation compresses log data by up to 97% in lab testing. Your cost scales with what you choose to monitor, not with cluster size.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<p>\U0001F4C9 Less noise, more signal. Metrics filtering carves out the namespaces and workloads that matter, so dashboards show only relevant signals. Log filters scope collection to specific pods and verdicts. Engineers start every investigation with data that's already relevant.</p>\n<p>⚡ Faster root-cause isolation. Every metric carries source and destination pod context. Targeted flow logs add the forensic detail, which policy, destination, or port is involved. Together, they cut mean time to resolution from hours of guesswork to minutes of structured investigation.</p>\n<p>\U0001F512 Full signal, zero gaps. Within the scope you define, every flow is captured and every pattern is preserved. Aggregation compresses volume without losing security verdicts or error context.</p>\n<p><strong>Who Benefits</strong></p>\n<p>Platform engineers managing multi-tenant clusters can scope data collection per namespace, so each team gets visibility into their own traffic without contributing to a shared cost pool.</p>\n<p>SREs can isolate packet drops, TCP resets, or DNS failures to a specific workload in minutes, starting with data that's already scoped to what matters.</p>\n<p>Decision-makers evaluating observability spend get predictable, controllable ingestion costs that scale with intent, not infrastructure size.</p>\n<p><strong>How to optimize metrics and logs with filtering?</strong></p>\n<ol>\n<li>Enable Advanced Container Networking Services ( ACNS) on your AKS cluster with the Cilium data plane:</li>\n</ol>\n<p><em>az aks create --enable-acns</em></p>\n<p>Or on an existing cluster:</p>\n<p><em>az aks update --resource-group $RESOURCE_GROUP --name $CLUSTER --enable-acns</em></p>\n<ol start=\"2\">\n<li>Apply a ContainerNetworkMetric CRD to filter which metrics are collected on each node. Start by excluding noisy system namespaces, then scope to business-critical workloads.</li>\n<li>Apply a ContainerNetworkLog CRD to define which flows to capture.</li>\n<li>Enable Azure Monitor integration with --enable-container-network-logs to send logs to a Log Analytics workspace, or export logs from the node to an external logging system such as Splunk or Datadog.</li>\n<li>Check your dashboards. Open your cluster in the Azure portal and go to Monitor &gt; Insights &gt; Networking for bytes, drops, DNS errors, and flows. For flow logs, use the built-in Azure portal dashboards available for both Basic and Analytics tiers.</li>\n</ol>\n<p>&nbsp;</p>\n<div class=\"lia-video-container lia-media-is-center lia-media-size-large\"></div>\n<p><strong>Conclusion</strong></p>\n<p>Kubernetes network observability has long meant choosing between visibility and cost. With container network metrics filtering and log filtering and aggregation now GA in Advanced Container Networking Services (ACNS) and contributed to upstream Hubble for the open-source community, that tradeoff is gone.</p>\n<p>Azure is first to market with this capability. AKS customers get it fully managed, out of the box, with built-in dashboards with Log Analytics integration. And the broader Cilium ecosystem gets it through upstream Hubble.</p>\n<p>High-fidelity visibility. Lower cost. No compromise.</p>\n<p><strong>Learn more:</strong></p>\n<ul>\n<li>Container network metrics overview:&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/container-network-observability-metrics?tabs=Cilium\" rel=\"noopener\" target=\"_blank\">Container network metrics overview - Azure Kubernetes Service | Microsoft Learn</a></li>\n<li>Container network logs overview:&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/aks/container-network-observability-logs\" rel=\"noopener\" target=\"_blank\">Container Network Logs Overview - Azure Kubernetes Service | Microsoft Learn</a></li>\n<li>Configure container network metrics filtering: <a href=\"https://learn.microsoft.com/en-us/azure/aks/how-to-configure-container-network-metrics-filtering\" rel=\"noopener\" target=\"_blank\">Configure Container network metrics filtering for Azure Kubernetes Service (AKS) - Azure Kubernetes Service | Microsoft Learn</a></li>\n<li>Set up container network logs: <a href=\"https://learn.microsoft.com/en-us/azure/aks/how-to-configure-container-network-logs?tabs=cli%2Ccilium\" rel=\"noopener\" target=\"_blank\">Set up container network logs - Azure Kubernetes Service | Microsoft Learn</a></li>\n</ul>"
