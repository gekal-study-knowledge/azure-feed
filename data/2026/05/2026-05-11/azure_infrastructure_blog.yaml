    "title": "Scaling GitHub Advanced Security in Azure DevOps with a single reusable YAML template"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/scaling-github-advanced-security-in-azure-devops-with-a-single/ba-p/4518410"
    "published": "2026-05-11 19:47:04"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<h2>Scaling GitHub Advanced Security in Azure DevOps with a single reusable YAML template</h2>\n<p>Managing security scanning across dozens of repositories can quickly become complex—especially when each repository uses different languages, frameworks, and infrastructure patterns.</p>\n<p>In our environment, we needed a scalable way to apply <strong>GitHub Advanced Security (GHAS)</strong> consistently across:</p>\n<ul>\n<li>Application code (Python, C#, Java, JavaScript)</li>\n<li>Infrastructure as Code (Terraform, ARM, Bicep)</li>\n<li>Mixed (polyglot) repositories</li>\n</ul>\n<p>Instead of maintaining multiple pipelines, we built a <strong>single reusable Azure DevOps YAML template</strong> that dynamically adapts to any repository.</p>\n<h2>The problem</h2>\n<p>Most teams struggle with:</p>\n<ul>\n<li>Multiple pipelines for different tech stacks</li>\n<li>Inconsistent security coverage</li>\n<li>Maintenance overhead across repositories</li>\n<li>Unnecessary scans increasing build time</li>\n</ul>\n<p>We needed a solution that:</p>\n<ul>\n<li>Detects repository content automatically</li>\n<li>Runs only relevant scans</li>\n<li>Standardizes security across all repos</li>\n<li>Minimizes duplication</li>\n</ul>\n<h2>Solution overview</h2>\n<p>The solution is a <strong>single-stage pipeline template</strong> with three key jobs:</p>\n<ol>\n<li>Detect repository content</li>\n<li>Run CodeQL for application code</li>\n<li>Run IaC security scanning</li>\n</ol>\n<p>Scanning behavior is driven entirely by detection outputs.</p>\n<h2>Architecture</h2>\n<h3>\U0001F7E6 High-level flow</h3>\n<img /><img />\n<h2>Key design patterns</h2>\n<h3>1. Detection-driven execution</h3>\n<p>Instead of hardcoding logic, the pipeline first detects repository content.</p>\n<p>&nbsp;</p>\n<img />\n<p>✅ Runs only when code is present<br />✅ Avoids unnecessary execution</p>\n<h3>2. Single template for all repositories</h3>\n<p>A single YAML template works for:</p>\n<ul>\n<li>Backend services</li>\n<li>Frontend apps</li>\n<li>IaC repositories</li>\n<li>Mixed projects</li>\n</ul>\n<p>No duplication. No branching logic across repos.</p>\n<h3>3. Dynamic CodeQL configuration</h3>\n<p>The pipeline generates a <strong>runtime CodeQL config file</strong>:</p>\n<img />\n<p>✅ Keeps configuration centralized<br />✅ Avoids scan failures due to irrelevant directories</p>\n<h3>4. Language-aware setup</h3>\n<p>The pipeline dynamically prepares environments:</p>\n<img />\n<p>✅ No need for separate pipelines<br />✅ Works across polyglot repos</p>\n<h3>5. Correct CodeQL build strategy</h3>\n<p>For compiled languages like C#, the pipeline performs build tracing:</p>\n<img />\n<p>✅ Ensures proper CodeQL extraction<br />✅ Avoids empty-database failures</p>\n<h3>6. Integrated IaC security scanning</h3>\n<p>Infrastructure scanning is handled in the same pipeline:</p>\n<img />\n<p>✅ Covers Terraform, ARM, Bicep<br />✅ Unified reporting across code and infrastructure</p>\n<h3>7. Centralized reporting</h3>\n<p>Artifacts are published for traceability:</p>\n<ul>\n<li>Code scanning results → CodeScanningReports</li>\n<li>IaC results → IaCSecurityReports</li>\n</ul>\n<p>✅ Easy audit and troubleshooting<br />✅ Retains SARIF outputs</p>\n<h2>Benefits</h2>\n<p>This approach delivers:</p>\n<p>✔ One pipeline for all repositories<br />✔ Reduced maintenance overhead<br />✔ Consistent security enforcement<br />✔ Faster pipeline execution<br />✔ Scalable DevSecOps model</p>\n<h2>Lessons learned</h2>\n<ul>\n<li>Detection-first pipelines are critical for scale</li>\n<li>Config-driven CodeQL execution prevents failures</li>\n<li>Build tracing must be handled explicitly for compiled languages</li>\n<li>IaC scanning should not be a separate workflow</li>\n</ul>\n<h2>Conclusion</h2>\n<p>Scaling GitHub Advanced Security across Azure DevOps doesn’t require multiple pipelines—it requires the right architecture.</p>\n<p>By combining:</p>\n<ul>\n<li>Detection-driven execution</li>\n<li>Dynamic configuration</li>\n<li>Conditional setup</li>\n<li>Unified scanning</li>\n</ul>\n<p>You can operationalize security at scale with a <strong>single reusable YAML template</strong>.</p>"
  "dd46b686b7ca9b870f6b3f188bccb87d":
    "id": "dd46b686b7ca9b870f6b3f188bccb87d"
    "title": "Understanding the deployment quota limitation (800) Error in Azure Bicep and ARM Deployments"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/understanding-the-deployment-quota-limitation-800-error-in-azure/ba-p/4518262"
    "published": "2026-05-11 14:12:56"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Understanding deployment quota limitation (800) Error in Azure Deployments (Bicep/ARM)</strong></p>\n<p><strong>Introduction</strong></p>\n<p>When working with Infrastructure as Code (IaC) using Azure Bicep or ARM templates, deployment failures are a common part of day-to-day operations—especially in large-scale enterprise environments.</p>\n<p>One such frequently encountered but often misunderstood issue is the quota limitation (800) error, which typically occurs during repeated or automated deployments.</p>\n<img /><img />Figure: Azure Bicep deployment failure showing DeploymentQuotaExceeded error after reaching the 800 deployment history limit, with reference to aka.ms/800 for remediation.\n<p>&nbsp;</p>\n{\n  \"code\": \"DeploymentFailed\",\n  \"target\": \"/subscriptions/cxxx8e00-0add-4f8a-8709-xxxxxxxxxxxx/resourceGroups/pxs-azure-connectivity-d-gwc-dnszone-rg/providers/Microsoft.Resources/deployments/ppiwwpkn7kkla-pdns-zone-deployment\",\n  \"message\": \"At least one resource deployment operation failed. Please list deployment operations for details. Please see https://aka.ms/arm-deployment-operations for usage details.\",\n  \"details\": [\n    {\n      \"code\": \"DeploymentQuotaExceeded\",\n      \"message\": \"Creating the deployment '46d3xbcp.res.network-privatednszone.0-6-0.rysq' would exceed the quota of '800'. The current deployment count is '800'. Please delete some deployments before creating a new one, or see https://aka.ms/800LimitFix for information on managing deployment limits.\"\n    }\n  ]\n}\n<p>&nbsp;</p>\n<p>This blog explains:</p>\n<ul>\n<li>What this error means</li>\n<li>A practical Bicep deployment use case</li>\n<li>Root causes</li>\n<li>Resolution approaches</li>\n<li>Preventive best practices</li>\n</ul>\n<p><strong>What is the quota limitation (800) Error?</strong></p>\n<p>The quota limitation (800) reference is commonly associated with a deployment quota limitation in Azure Resource Manager (ARM).</p>\n<p>In simple terms:<br />Azure limits the number of deployment records that can be stored per resource group.</p>\n<p>Key detail:</p>\n<ul>\n<li>Maximum allowed deployment history entries per resource group:&nbsp;<strong>800</strong></li>\n</ul>\n<p>Once this limit is exceeded:</p>\n<ul>\n<li>New deployments fail</li>\n<li>Error messages such as the following are observed:</li>\n</ul>\n<p>“DeploymentQuotaExceeded”</p>\n<p>The current deployment count is '800'. Please delete some deployments before creating a new one.</p>\n<p>This happens because Azure maintains deployment history for auditing, tracking, and troubleshooting purposes. [aka.ms/800]</p>\n<p><strong>Use Case: Bicep Deployment Failure in CI/CD</strong></p>\n<p><strong>Scenario</strong></p>\n<p>An organization is deploying infrastructure using a Bicep template through an automated pipeline.</p>\n<p>Example command:</p>\naz deployment group create \\\n  --resource-group prod-rg \\\n  --template-file main.bicep \\\n  --parameters @params.bicepparam\n<p><strong>Environment Characteristics</strong></p>\n<ul>\n<li>Continuous deployment using pipelines (Azure DevOps / GitHub Actions)</li>\n<li>Multiple deployments triggered daily</li>\n<li>Incremental deployment mode enabled</li>\n<li>A shared resource group used across multiple deployments</li>\n</ul>\n<p><strong>Issue Encountered</strong></p>\n<p>After repeated deployments over time, the following failure occurs:</p>\n<p>Error: DeploymentQuotaExceeded</p>\n<p>The current deployment count is '800'</p>\n<p>See aka.ms/800 for more information</p>\n<p>At this point, no further deployments succeed in that resource group.</p>\n<p><strong>Root Cause Analysis</strong></p>\n<ol>\n<li><strong>Deployment History Limit</strong></li>\n</ol>\n<p>Azure stores every deployment execution as a record under:</p>\n<p>Resource Group → Deployments</p>\n<p>These records accumulate over time, and once the count reaches 800, new deployments are blocked.</p>\n<p>Important clarification:</p>\n<ul>\n<li>This is not a resource limit (VMs, VNets, etc.)</li>\n<li>This is a metadata limit related to deployment history</li>\n</ul>\n<ol>\n<li><strong>High Frequency CI/CD Deployments</strong></li>\n</ol>\n<p>In enterprise environments, pipelines may run frequently due to:</p>\n<ul>\n<li>Minor configuration updates</li>\n<li>Validation runs</li>\n<li>Automated releases</li>\n</ul>\n<p>Each run contributes to the deployment count.</p>\n<ol>\n<li><strong>Absence of Cleanup Mechanism</strong></li>\n</ol>\n<p>Although Azure manages some cleanup automatically, it is not always sufficient in high-frequency environments. Manual or automated cleanup is often required.</p>\n<p><strong>Resolution Approaches</strong></p>\n<p><strong>Option 1: Manual Cleanup from Azure Portal</strong></p>\n<p>Navigate to:</p>\n<ul>\n<li>Azure Portal</li>\n<li>Resource Group</li>\n<li>Deployments</li>\n</ul>\n<p>Delete older deployment entries manually to free up space.</p>\n<p><strong>Option 2: Cleanup Using Azure CLI</strong></p>\n#List deployments:\n\naz deployment group list \\\n  --resource-group prod-rg \\\n  --query \"[].name\" -o tsv\n\n#Delete a deployment:\n\naz deployment group delete \\\n  --resource-group prod-rg \\\n  --name &lt;deployment-name&gt;\n<p><strong>Option 3: Automated Cleanup (Recommended)</strong></p>\n<p>Example PowerShell approach:</p>\n$deployments = Get-AzResourceGroupDeployment -ResourceGroupName \"prod-rg\"\n\nif ($deployments.Count -gt 700) {\n    $deployments | Sort-Object Timestamp | Select-Object -First 100 | ForEach-Object {\n        Remove-AzResourceGroupDeployment -ResourceGroupName \"prod-rg\" -Name $_.DeploymentName\n    }\n}\n<p>This approach ensures that older deployments are periodically removed, preventing quota exhaustion.</p>\n<p><strong>Option 4: Use Multiple Resource Groups</strong></p>\n<p>Instead of using a single resource group for all deployments:</p>\n<ul>\n<li>Separate environments (Dev, Test, Prod)</li>\n<li>Temporary or experimental deployments</li>\n</ul>\n<p>This helps distribute deployment records across multiple scopes.</p>\n<p><strong>Best Practices</strong></p>\n<ol>\n<li><strong>Implement Deployment Retention Policy</strong></li>\n</ol>\n<ul>\n<li>Maintain only recent deployments (for example, last 100–200)</li>\n<li>Automate deletion of older entries</li>\n</ul>\n<ol>\n<li><strong>Control Deployment Frequency</strong></li>\n</ol>\n<ul>\n<li>Avoid unnecessary pipeline triggers</li>\n<li>Batch multiple changes into a single deployment</li>\n</ul>\n<ol>\n<li><strong>Use Predictable Deployment Naming</strong></li>\n</ol>\n<p>Example:</p>\nname: 'deploy-${utcNow()}'\n<p>This improves traceability and cleanup management.</p>\n<ol>\n<li><strong>Monitor Deployment Count</strong></li>\n</ol>\n<p>Example:</p>\naz deployment group list \\\n  --resource-group prod-rg \\\n  --query \"length(@)\"\n<p>Set alerts or monitoring thresholds if required.</p>\n<ol>\n<li><strong>Understand Deployment Mode Behavior</strong></li>\n</ol>\n<p>Incremental deployments prevent unwanted deletions of resources but still increase the deployment history count.</p>\n<p><strong>Common Misconceptions</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><td>\n<p><strong>Misconception</strong></p>\n</td><td>\n<p><strong>Reality</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p>Resource quota exceeded</p>\n</td><td>\n<p>The issue is related to deployment history</p>\n</td></tr><tr><td>\n<p>Template is invalid</p>\n</td><td>\n<p>The template can be valid but blocked by quota</p>\n</td></tr><tr><td>\n<p>Permission issue</p>\n</td><td>\n<p>Not related to RBAC</p>\n</td></tr><tr><td>\n<p>Regional limitation</p>\n</td><td>\n<p>Independent of region</p>\n</td></tr></tbody></table></div>\n<p><strong>Related Deployment Errors</strong></p>\n<p>While troubleshooting deployments, other common errors may appear, such as:</p>\n<ul>\n<li>Authorization failures (insufficient permissions)&nbsp;<a href=\"https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors\" target=\"_blank\">[learn.microsoft.com]</a></li>\n<li>Invalid template errors (syntax or parameter mismatch)</li>\n<li>Concurrent deployment conflicts</li>\n</ul>\n<p>It is important to analyze deployment logs to identify the exact failure reason.</p>\n<p><strong>Summary</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table><thead><tr><td>\n<p><strong>Area</strong></p>\n</td><td>\n<p><strong>Key Insight</strong></p>\n</td></tr></thead><tbody><tr><td>\n<p>Error Type</p>\n</td><td>\n<p>Deployment quota limitation</p>\n</td></tr><tr><td>\n<p>Limit</p>\n</td><td>\n<p>800 deployments per resource group</p>\n</td></tr><tr><td>\n<p>Primary Cause</p>\n</td><td>\n<p>Frequent CI/CD executions</p>\n</td></tr><tr><td>\n<p>Resolution</p>\n</td><td>\n<p>Delete older deployment history</p>\n</td></tr><tr><td>\n<p>Prevention</p>\n</td><td>\n<p>Automate cleanup and monitor usage</p>\n</td></tr></tbody></table></div>\n<p><strong>Closing Thoughts</strong></p>\n<p>For teams operating at scale with Azure Bicep and automated pipelines, this issue is common but preventable.</p>\n<p>The key takeaway is to treat deployment history as an actively managed component of your environment. Without proper governance, it can become a blocking factor for ongoing automation efforts.</p>"
