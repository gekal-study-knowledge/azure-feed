    "title": "Simplify Virtual WAN Spoke Connectivity at Scale with Azure Virtual Network Manager"
    "link": "https://techcommunity.microsoft.com/t5/azure-networking-blog/simplify-virtual-wan-spoke-connectivity-at-scale-with-azure/ba-p/4523055"
    "published": "2026-05-27 05:44:54"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>With Azure Virtual Network Manager (AVNM) integration, organizations using Virtual WAN for transitive connectivity can simplify spoke connectivity and policy management across large-scale hub-and-spoke deployments.</strong> By using a Virtual WAN hub as the hub in an AVNM hub-and-spoke topology, organizations can define connectivity and routing intent once at the network group level and apply it consistently across large numbers of spoke VNets. This reduces repetitive per-spoke connection and routing configuration, helps maintain operational consistency as deployments expand, and makes it easier to manage hub-and-spoke environments at scale. Together, AVNM’s centralized, group-based orchestration and Virtual WAN’s managed routing, security integration, and hybrid connectivity provide a more streamlined way to simplify operations and scale with confidence.</p>\n<h2>What is Azure Virtual Network Manager?</h2>\n<p>Azure Virtual Network Manager is a management service that lets you group, configure, and deploy network connectivity and security policies across virtual networks at scale. Instead of configuring VNet peering and access rules on each virtual network individually, you define <strong>network groups</strong> — logical collections of virtual networks based on static selection or dynamic Azure Policy conditions — and apply <strong>connectivity configurations</strong> and <strong>security admin rules</strong> to those groups.</p>\n<p>Key capabilities include:</p>\n<ul>\n<li><strong>Hub-and-spoke and mesh topologies</strong> — Define how virtual networks in a network group connect to a central hub or to each other.</li>\n<li><strong>Network groups</strong> — Group VNets statically or dynamically (using tags, subscriptions, resource group names, or other Azure Policy conditions).</li>\n<li><strong>Security admin rules</strong> — Author and enforce access control lists across all VNets in a network group, providing a centralized layer of defense that complements NSGs and firewalls.</li>\n<li><strong>Region-scoped deployment</strong> — Deploy configurations to specific Azure regions, enabling incremental rollout and controlled blast radius.</li>\n</ul>\n<p>AVNM operates as an overlay management layer — it orchestrates VNet peering, connectivity, and security rules without replacing the underlying networking primitives.</p>\n<h2>What is Azure Virtual WAN?</h2>\n<p>Azure Virtual WAN as a service brings together routing, security, VPN, ExpressRoute, and transitive connectivity in a hub-and-spoke architecture. A Virtual WAN hub is a managed regional resource that acts as a central transit point for branch connectivity, remote users, private enterprise connectivity, spoke virtual networks, and private traffic routing through security services.</p>\n<ul>\n<li><strong>Site-to-site VPN</strong> connectivity (branch offices, SD-WAN devices)</li>\n<li><strong>Point-to-site VPN</strong> connectivity (remote users)</li>\n<li><strong>ExpressRoute</strong> private connectivity (on-premises datacenters)</li>\n<li><strong>VNet-to-VNet</strong> transitive connectivity (spoke virtual networks)</li>\n<li><strong>Routing, firewall, and encryption</strong> for private traffic</li>\n</ul>\n<p>All hubs in a Standard Virtual WAN are connected in a full mesh over the Microsoft backbone, enabling any-to-any connectivity between spokes, branches, and remote users across regions. Virtual WAN removes the need to manually manage complex route tables and transit VNets — routing is handled by the hub's built-in router.</p>\n<h2>What this integration enables</h2>\n<p>When you select a Virtual WAN hub as the hub in an AVNM connectivity configuration, AVNM handles the spoke-to-hub wiring for you. For each virtual network in your selected network groups:</p>\n<ul>\n<li><strong>If the VNet is not yet connected</strong> to the Virtual WAN hub, AVNM creates the Virtual Network connection to Virtual WAN hub and applies a consistent routing configuration with Virtual WAN connection policy.</li>\n<li><strong>If the VNet is already connected</strong>, AVNM updates the existing Virtual Network connection to utilize the routing properties in the Virtual WAN connection policy.</li>\n</ul>\n<p>A <strong><a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-connection-policy\" target=\"_blank\">connection policy</a></strong> is a hub-level Virtual WAN resource that defines shared routing behavior for the virtual network connections it governs, including route table association and propagation, route maps, internet security settings, and propagated labels. Because the policy applies these settings consistently across governed connections, it helps standardize routing and overrides conflicting settings configured directly on individual connections.</p>\n<p>&nbsp;</p>\n<img />\n<p>&nbsp;</p>\n<h2>How it works</h2>\n<p>The setup follows AVNM's standard workflow:</p>\n<ol>\n<li><strong>Create a network group.</strong> Add virtual networks as members — either statically (by selecting specific VNets) or dynamically (using Azure Policy conditions such as tags or resource group names).</li>\n<li><strong>Create a connectivity configuration.</strong> Choose hub-and-spoke topology, select your Virtual WAN hub as the hub, and select or create a connection policy.</li>\n<li><strong>Deploy.</strong> Commit the configuration to your target regions. AVNM connects all VNets in the network groups to the Virtual WAN hub and applies the connection policy in parallel.</li>\n</ol>\n<p>You can also enable <strong>direct connectivity</strong> within a spoke network group. When enabled, VNet-to-VNet traffic within that group routes directly between virtual networks instead of transiting the Virtual WAN hub — useful for latency-sensitive or high-throughput east-west workloads. By default, direct connectivity is regional; enable global mesh to extend it across Azure regions.</p>\n<h2>Key use cases</h2>\n<p><strong>Bulk spoke onboarding</strong></p>\n<p>Connect many virtual networks to a Virtual WAN hub in one operation. All connections are orchestrated in parallel by AVNM, and the pre-defined routing configuration is automatically applied.</p>\n<p><strong>Policy-based dynamic onboarding</strong></p>\n<p>Use Azure Policy to define network group membership conditions. When a new virtual network matches those conditions—for example, a VNet tagged env:prod—it is automatically added to the network group. On the next deployment, AVNM connects it to the Virtual WAN hub with the correct routing configuration, reducing manual onboarding effort.</p>\n<p><strong>Batch routing configuration updates</strong></p>\n<p>Push routing changes to all virtual networks in a network group as a single, fully parallelized operation. This significantly reduces maintenance window duration for network-wide changes and makes rollback straightforward.</p>\n<p><strong>Incremental deployment</strong></p>\n<p>Segment your network into precise update domains by creating separate network groups — for example, by environment (staging, dev, production) or by region. Deploy connection policies to each group or region independently. This lets you test changes on a smaller subset before applying them broadly, minimizing blast radius.</p>\n<p><strong>Mesh for selective inspection bypass</strong></p>\n<p>If you use routing intent to send all private traffic through a firewall in the Virtual WAN hub, certain high-throughput or latency-sensitive flows (such as database replication) may benefit from bypassing that inspection. Enable direct connectivity in AVNM to create a mesh between selected spokes, allowing VNet-to-VNet traffic to route directly while all other traffic continues through the hub firewall.</p>\n<p><strong>Security admin rules at scale</strong></p>\n<p>Define network groups for your Virtual WAN spokes, then use AVNM security admin rules to author and deploy access control lists across those spokes. This provides an additional layer of defense alongside next-generation firewalls in the Virtual WAN hub.</p>\n<h2>Getting started</h2>\n<h3>Prerequisites:</h3>\n<ul>\n<li>An existing Azure Virtual Network Manager instance</li>\n<li>An existing Azure Virtual WAN and Virtual WAN hub</li>\n<li>One or more virtual networks to use as spoke members</li>\n</ul>\n<h3>To configure:</h3>\n<ol>\n<li>Go to your Network Manager instance in the Azure portal.</li>\n<li>Create a network group and add your spoke VNets.</li>\n<li>Create a connectivity configuration → select hub-and-spoke → select your Virtual WAN hub → select or create a connection policy → add spoke network groups.</li>\n<li>Deploy the configuration to your target regions.</li>\n<li>In your Virtual WAN resource, verify that the expected spoke VNet connections are in a connected state. Review effective routes in the virtual hub to confirm routing behavior matches the selected connection policy.</li>\n</ol>\n<p>For detailed step-by-step instructions, see <a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/configure-virtual-wan-hub-for-network-manager\" target=\"_blank\">Configure Azure Virtual WAN hub for Azure Virtual Network Manager</a>.</p>\n<p>For more on connection policy, see <a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-connection-policy\" target=\"_blank\">Connection policy in Azure Virtual WAN</a>.</p>\n<p><strong>Learn more</strong></p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network-manager/\" target=\"_blank\">Azure Virtual Network Manager documentation</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-network-manager-integration\" target=\"_blank\">Virtual WAN and Virtual Network Manager integration overview</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-wan/\" target=\"_blank\">Azure Virtual WAN documentation</a></li>\n</ul>"
