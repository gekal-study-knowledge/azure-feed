  "d8a376ca4d6bcbe62570e2670e91a58d":
    "id": "d8a376ca4d6bcbe62570e2670e91a58d"
    "title": "Cloud Native Platforms: Build"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/cloud-native-platforms-build/ba-p/4519605"
    "published": "2026-05-22 07:41:29"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Audience:</strong> Cloud architects, platform engineers, engineering leaders making design decisions</p>\n<p><strong>Reading time:</strong> 8 minutes</p>\n<p><strong>Series:</strong> Cloud Native Platforms. Build, Run, Evolve. This is Part 1 of 3.</p>\n<hr />\n<p>Most engineering teams can build systems.</p>\n<p>Few can scale them without rebuilding them.</p>\n<p>As platforms grow, complexity does not increase linearly. It multiplies across users, services, tenants, regions, and integrations. The systems that struggle and the systems that scale are rarely separated by which cloud they run on. They are separated by a handful of design choices made early and applied consistently.</p>\n<p>This post is about those choices.</p>\n<h2>The differentiator is not the cloud</h2>\n<p>Scalable platforms are not built with the right tools. They are built with the right design choices.</p>\n<p>Cloud services have closed the gap on infrastructure. The differentiator is no longer which managed service a team picks. It is whether the platform is designed to absorb change, tolerate failure, and support visibility from day one. Five engineering disciplines determine whether a platform scales gracefully or collects technical debt while it grows.</p>\n<img />\n<p><em>Figure 1. The five disciplines compound into platform scale. Any one neglected becomes the constraint that forces a rewrite later.</em></p>\n<h2>1. Flexibility is the foundation of scale</h2>\n<p>Hard-coded systems work until they do not. The first request to add a tenant, a region, a SKU (a sellable product variant), or a regulatory variant is the moment a rigid design starts to bend. Each subsequent request adds weight.</p>\n<p>Scalable platforms move behavior out of code:</p>\n<ul>\n<li>Configuration replaces conditional logic</li>\n<li>Feature flags enable safer, tenant-scoped rollouts</li>\n<li>APIs evolve through versioning, not breaking changes</li>\n<li>Schemas evolve additively. Breaking changes go through versioned contracts with a deprecation window long enough that consumers can migrate without downtime.</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: configuration in a managed store, feature flags with tenant scope, and APIs versioned per consumer contract. Cost is the discipline of treating configuration as code (versioned, reviewed, audited). The return is that releases stop being events and start being routine. A change that previously needed a coordinated deployment can be executed in minutes, gated to a single tenant for verification, and rolled out broadly only after the signal is clean. Most platforms reach this state by retrofit, not by design. Doing it earlier costs less than waiting.</p>\n<blockquote>\n<p><em>If a change requires a redeploy, it should require a very good reason.</em></p>\n</blockquote>\n<h2>2. Failures are normal. Resilience is a choice.</h2>\n<p>Distributed systems will fail in unpredictable ways. The real question is not how to prevent failure. It is how the system responds when failure happens.</p>\n<p>Resilience is engineered, not inherited from the platform. The patterns that move the needle are well known and consistently applied:</p>\n<ul>\n<li><strong>Idempotent operations</strong> (safe to call multiple times with the same result) that make retries safe</li>\n<li><strong>Reliable messaging patterns such as the transaction outbox</strong> (writing the message to the same database transaction as the business change, then publishing asynchronously) to avoid lost or duplicated events</li>\n<li>Decoupled services that contain <strong>blast radius</strong> (the scope of damage when one component fails)</li>\n<li>Timeouts, retries, and <strong>circuit breakers</strong> (a wrapper around a dependency that stops calling it for a cool-off window after repeated failures) tuned per dependency</li>\n<li>Bulkheads (isolation pools, often a separate compute or queue lane per workload class) that keep noisy neighbours from starving critical paths of resources</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: every write that can be retried carries an idempotency key, every queue consumer is safe to replay, every event published goes through an outbox in the same transactional unit as the business change. When peak load triggers retries, duplicates collapse cleanly instead of producing duplicate orders, double-charged customers, or split-brain state. The contract changes outwards: callers can retry without thinking, queues can be at-least-once instead of exactly-once, and recovery moves from a manual cleanup task to a property of the system. Most teams that adopt this pattern stop seeing certain classes of incident entirely.</p>\n<h3>Implementation note</h3>\n<p>An idempotent API is not just a design preference. It changes how the rest of the system can be built. Once writes are safe to repeat, retries become cheap, queues become trustworthy, and recovery becomes automatic.</p>\n<p>The naive implementation (read the key, if absent process and save) has a race. Two concurrent requests with the same key both miss the lookup, both call the processor, and both attempt to save. That is the failure mode idempotency exists to prevent. The pattern that survives production is an atomic reserve-then-execute: insert a row keyed by the idempotency key with a unique constraint before doing any work. The first writer wins. Concurrent callers either wait for the original to complete and read its result, or they receive a conflict response.</p>\n// Contract for the idempotency store. The two key methods are TryReserveAsync\n// (atomic insert with unique-key constraint) and CompleteAsync (record the\n// result of the first writer). GetCompletedResultAsync polls until the first\n// writer commits or returns 409 Conflict if the in-flight window exceeds the\n// configured deadline.\npublic interface IIdempotencyStore\n{\n    Task&lt;Reservation&gt; TryReserveAsync(\n        string idempotencyKey, string requestHash, CancellationToken ct);\n\n    Task CompleteAsync(\n        string idempotencyKey, OrderResult result, CancellationToken ct);\n\n    Task&lt;OrderResult&gt; GetCompletedResultAsync(\n        string idempotencyKey, CancellationToken ct,\n        TimeSpan? maxWait = null);\n}\n\npublic readonly record struct Reservation(\n    bool IsFirstWriter, string RequestHash);\n\n// Idempotency via atomic reserve-then-execute.\n// First writer wins; replays return the original result; concurrent\n// duplicates lose the race and read the winner's outcome (or get 409).\npublic async Task&lt;OrderResult&gt; CreateOrderAsync(\n    Order order, string idempotencyKey, CancellationToken ct)\n{\n    var requestHash = StableHash(order); // canonical content hash\n\n    // Atomic insert: succeeds for the first caller, fails for the rest.\n    var reserved = await _store.TryReserveAsync(\n        idempotencyKey, requestHash, ct);\n\n    if (!reserved.IsFirstWriter)\n    {\n        if (reserved.RequestHash != requestHash)\n            throw new IdempotencyKeyReusedException();\n\n        // A previous run committed (return its result) or is in-flight\n        // (poll with a bounded deadline; 409 if exceeded).\n        return await _store.GetCompletedResultAsync(\n            idempotencyKey, ct, maxWait: TimeSpan.FromSeconds(5));\n    }\n\n    // We are the first writer. Execute, persist, mark complete.\n    var result = await _processor.ProcessAsync(order, ct);\n    await _store.CompleteAsync(idempotencyKey, result, ct);\n    return result;\n}\n\n\n<p>Three production details matter:</p>\n<ul>\n<li><strong>TTL or compaction on the idempotency record.</strong> Without it, the store grows forever. Most teams retain records for the request retry window plus a safety margin (commonly 24 to 72 hours).</li>\n<li><strong>Stable content hash, not the default object hash code.</strong> The request hash detects key reuse with a different body, so a client that reuses an idempotency key with a different payload receives <code>IdempotencyKeyReusedException</code> rather than silently getting the wrong result. Canonicalise field ordering, locale, and null handling before hashing.</li>\n<li><strong>Bound the in-flight window explicitly.</strong> The genuinely hard case is when the processor succeeded but the store write failed. Production-grade implementations either run the side-effect and the store write in the same transaction (when the processor and store share a database) or use the transaction outbox pattern to bridge them. The poll-with-deadline in <code>GetCompletedResultAsync</code> handles the duplicate-arrives-mid-flight case; the transactional boundary handles everything else.</li>\n</ul>\n<h2>3. Observability is not optional</h2>\n<p>Without observability, teams operate blind. As systems grow, the price of guessing rises faster than the price of seeing.</p>\n<p>At build time, observability is a design property. The decisions made before the system reaches production are what determine whether it can be operated at all. The dashboards, alerts, and incident practices covered in Part 2 of this series rely on instrumentation choices made here.</p>\n<p>The build-time work that pays off in production:</p>\n<ul>\n<li>Request identifiers propagated through every service hop, every queue, every async boundary, so a single user action can be traced end to end</li>\n<li>Structured logging with a consistent schema (event name, correlation id, tenant, severity) rather than free-form strings</li>\n<li>Metrics emitted at the boundaries that matter (every external call, every queue read or write, every database operation), not only at the entry point</li>\n<li>Tracing libraries integrated at the framework or middleware layer so coverage is automatic, not opt-in</li>\n<li>Schemas designed so business signals (orders, sessions, transactions) and system signals (CPU, latency, errors) share the same identifiers and can be correlated later</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: a single request id flowing through every service hop, every queue, every async boundary, propagated automatically at the framework layer rather than per-call. Add one structured logging schema across services (event name, correlation id, tenant, severity), so that a single query joins business events with system events. The investment is hours of upfront framework wiring. The return is that production diagnosis stops being archaeology. Cross-service questions become single dashboards; postmortems shrink from days to hours; and the dashboards in Part 2 actually work because the data underneath is shaped to support them.</p>\n<h2>4. Delivery practices set the ceiling</h2>\n<p>Scaling teams requires scaling delivery. Small inefficiencies in pipelines, environments, and release coordination compound into measurable drag.</p>\n<p>Delivery maturity that pays off at scale:</p>\n<ul>\n<li>Pipelines as code, reviewed and versioned like application code</li>\n<li>Parallel deployments across services and regions where dependencies allow</li>\n<li>Infrastructure as code with shared modules, not hand-managed environments</li>\n<li>Automated quality gates: tests, security scans, dependency checks</li>\n<li>Trunk-based development (developers commit to a single shared branch many times a day) with short-lived feature branches and progressive delivery. <strong>Important caveat:</strong> trunk-based works only when test automation and feature flags are already in place. Adopting it before those foundations exist tends to amplify production incidents rather than reduce them.</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: pipelines run in parallel where dependencies allow, infrastructure provisioning is templated rather than per-environment, and quality gates run automatically rather than as discretionary steps. Sequential deployment of a multi-service platform across three environments takes hours; parallelised deployment of the same change takes minutes. The payback is not only release speed. It is the compounding cost reduction of every wait state for every engineer on every release. Teams that treat pipelines as a product feature, not an afterthought, ship more confidently and recover from bad changes faster because the rollback path was exercised, not invented during an incident.</p>\n<blockquote>\n<p><em>Slow pipelines are not a tooling problem. They are a design problem.</em></p>\n</blockquote>\n<h2>5. Cost discipline is engineering work</h2>\n<p>Cloud platforms can become expensive quickly when cost is treated as someone else's problem. Cost is a property of the design, not a quarterly review.</p>\n<p>The teams that get this right treat cost the same way they treat performance:</p>\n<ul>\n<li>Elastic compute and storage tiers chosen per workload pattern</li>\n<li>Non-production environments with automated scale-down windows (the easiest savings to leave on the table)</li>\n<li>Tagging discipline so cost can be attributed to a service, a feature, a tenant</li>\n<li>Egress and data-tier choices, not compute, dominate cloud bills past a certain scale. Right-size storage tiers (hot vs cool vs archive), eliminate cross-region chatter, and watch egress on the data plane more closely than compute on the request path.</li>\n<li>Budgets and usage alerts wired into the same channels as reliability alerts</li>\n<li>Cost reviews built into design discussions, not deferred to FinOps (Financial Operations: the practice of managing cloud spend as an engineering concern)</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: non-production environments scale down automatically outside business hours, storage tiers match access patterns (hot, cool, archive), and tagging is enforced so every dollar can be attributed to a service or feature. Cost reviews happen at design time, not after the bill arrives. The biggest savings come from data plane decisions, not compute: cross-region egress, oversized storage tiers, and forgotten test environments dominate cloud bills past a certain scale. Treat cost as a first-class non-functional requirement, alongside latency and availability, and the discipline compounds in every design discussion that follows.</p>\n<h2>A scenario that ties it together</h2>\n<img />\n<p><em>Figure 2. A reference architecture that puts the disciplines into one shape. The request path is decoupled, the data layer is purpose-fit, identity is brokered by managed identity throughout, private endpoints isolate the data tier from public networks, and observability runs as a first-class lane.</em></p>\n<blockquote>\n<p>Picture a multi-tenant platform at a growth inflection. Onboarding a new tenant takes weeks because tenant-specific behaviour is hard-coded across services. Every release carries risk because there is no way to roll out a change to one tenant without affecting the rest. Incidents linger because logs and metrics live in different tools and nobody can correlate them in production.</p>\n<p>Do not start with a rewrite. Start with the smallest set of changes that unlocks the next year of growth: extract configuration out of code, introduce tenant-aware feature flags, wire a unified observability view into the existing services, and parallelise the pipelines. None of these are architectural revolutions. They are design choices applied with discipline, in the order the disciplines compound.</p>\n<p>Eighteen months in, onboarding a tenant takes hours instead of weeks. Releases move from monthly events to weekly increments. Incidents are caught earlier and resolved faster. The platform did not get bigger. It got more capable. The five disciplines did the work; the team made the choice to apply them.</p>\n</blockquote>\n<h2>What teams get wrong</h2>\n<p>The common pattern is <strong>architecting for the system you have, not the system you are growing into.</strong> It looks like progress because the current sprint ships. Pillars get postponed because they feel like overhead.</p>\n<p>The cost surfaces later. Each shortcut becomes a constraint. The constraints compound, and three releases later the team is debating a rewrite.</p>\n<p>The fix is not premature abstraction. It is small, deliberate investments in flexibility, resilience, observability, delivery, and cost from day one. The discipline is to make these investments before they are urgent.</p>\n<h2>Where to start when you cannot do everything at once</h2>\n<p>Five disciplines is a wall, and real teams cannot fund all five at once. The right order depends on whether the platform is being built fresh or already running.</p>\n<p>For a system <strong>already in production and already in pain</strong>, the SRE community's <a href=\"https://sre.google/sre-book/part-III-practices/\" target=\"_blank\">hierarchy of reliability needs</a> gives the most defensible starting order: <em>monitoring and observability first</em> (you cannot fix what you cannot see), <em>then incident response</em> (close the bleeding cleanly), <em>then resilience patterns</em> (idempotency, retries, decoupling) so the bleeding has fewer reasons to start, <em>then flexibility and delivery</em> so safe change can travel at speed. Cost discipline runs alongside throughout, never as the headline.</p>\n<p>For a system <strong>being built fresh</strong>, the order in this post (flexibility, resilience, observability, delivery, cost) reflects the <a href=\"https://learn.microsoft.com/azure/well-architected/\" target=\"_blank\">Azure Well-Architected Framework's</a> emphasis on designing for change, failure, and visibility before scaling teams or workloads. Both orders are defensible. What is not defensible is leaving any of the five for later.</p>\n<p><strong>The most concrete starter from this post: request id propagation.</strong> A single correlation identifier travelling through every service hop, every queue, every async boundary, costs hours up front and pays back every time someone has to debug production for the rest of the platform's life. It is the smallest unit of the observability discipline and the foundation that the dashboards, traces, and incident response in Part 2 all depend on.</p>\n<h2>The shift</h2>\n<p>The most important transformation in scaling a platform is not technical. It is mindset.</p>\n<p>The shift is from <strong>project thinking to platform thinking</strong>:</p>\n<ul>\n<li>Build reusable capabilities, not one-off solutions</li>\n<li>Design systems for long-term evolution, not the next release</li>\n<li>Enable other teams, not just deliver for one team</li>\n</ul>\n<p>Tools change. Cloud services evolve. The architectural fashions of this year will not be the architectural fashions of the next. What persists is the discipline behind the choices. Scalable systems are not built by tools. They are built by teams that treat design as continuous work. The same discipline shows up again in Part 2 (operating these systems) and Part 3 (using AI to augment that work). The tools change. The disciplines do not.</p>\n<hr />\n<p><strong>Want to discuss?</strong> What single design choice has paid the most dividends in the platforms you run? Drop a comment with patterns you have seen in your environment. Every reply gets read.</p>\n<p><strong>Next in this series:</strong> <em>Running Cloud Native Platforms: Why Day 2 Decides Everything.</em> Building is half the journey. The next post looks at what it takes to operate these platforms once they are in production.</p>\n<!--\n  Taxonomy:\n    Primary product: Azure\n    Secondary: .NET, GitHub\n    Tags: Cloud Architecture, Platform Engineering, Microservices, Reliability, FinOps\n\n  Visuals embedded:\n    1. assets/diagram-1-pillar-map.png  (source: assets/diagram-1-pillar-map.mmd, Mermaid)\n    2. assets/diagram-2-reference-architecture.png (source: assets/diagram-2-reference-architecture.py, matplotlib)\n\n  Re-render command:\n    & \"$env:USERPROFILE\\.agents\\skills\\technical-blog-writer\\tools\\render-visuals.ps1\" `\n        -ArticleFolder <part-1-build folder> -Force\n    python <part-1-build folder>\\assets\\diagram-2-reference-architecture.py\n-->"
  "682c5b60a27a66c2d1d8d143de8d57da":
    "id": "682c5b60a27a66c2d1d8d143de8d57da"
    "title": "Cloud Native Platforms: Run"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/cloud-native-platforms-run/ba-p/4520188"
    "published": "2026-05-22 07:41:09"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Audience:</strong> SREs (Site Reliability Engineers), platform engineers, engineering managers running production systems</p>\n<p><strong>Reading time:</strong> 8 minutes</p>\n<p><strong>Series:</strong> Cloud Native Platforms. Build, Run, Evolve. This is Part 2 of 3.</p>\n<hr />\n<p>Most systems are designed thoughtfully.</p>\n<p>Most operations are inherited reactively.</p>\n<p>The systems that survive are not the ones built with the most care. They are the ones operated with the most discipline. Production has a way of revealing every shortcut taken during design and every assumption left unverified.</p>\n<p>This post is about what it takes to operate a platform once the build is done.</p>\n<h2>How they are run, not how they are built</h2>\n<p>Systems are not defined by how they are built. They are defined by how they are run.</p>\n<p>A well-designed system that is operated reactively will fail in production. A modestly designed system that is operated with discipline will outperform it. Five operational disciplines decide which side of that line a platform lives on. Each one is engineering work, not a checklist for someone else to handle.</p>\n<img />\n<p><em>Figure 1. The incident lifecycle as a state machine. The states are not optional steps. They are the contract between the team and the system.</em></p>\n<h2>1. Observability is the backbone of reliability</h2>\n<p>Without observability, every operation becomes a guess. As systems grow, the cost of guessing rises faster than the cost of seeing.</p>\n<p>Part 1 of this series argued that observability is a design property: instrumentation contracts, request id propagation, structured logging schemas. Production is where those design choices either pay off or do not. Strong observability in production is a contract that lets any engineer answer three questions in minutes: what failed, why it failed, and what the impact was. The shape of that contract matters more than the tool that implements it. (This three-question framing is community-popularised through the SRE community and writers such as Charity Majors. See <a href=\"https://www.honeycomb.io/what-is-observability\" target=\"_blank\">Honeycomb's <em>What is Observability</em></a> for the canonical articulation of the three-pillars and question framing; the substance is older than the framing.)</p>\n<ul>\n<li>Dashboards organised around user journeys, not infrastructure components</li>\n<li>Service level indicators (SLIs: the specific measurements you care about, e.g., success rate, p99 latency) chosen from the user's perspective, not the database's</li>\n<li>Alerts that page only on burn-rate against an SLO (Service Level Objective: the target value of an SLI, e.g., 99.9% of requests complete in under 800ms over a rolling month) using a multi-window strategy. A short window catches fast burns; a long window catches slow drifts. This is what makes SLOs operational rather than decorative.</li>\n<li>Sampling and retention tuned for cost, but never for blind spots</li>\n<li>The distinction between MTTA (mean time to acknowledge: how fast someone notices) and MTTR (mean time to restore: how fast service returns) tracked separately. Conflating them hides whether the team's bottleneck is detection, response, or fix.</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: rebuild the operational view around two or three user journeys (sign-in, place order, view history) rather than per-component charts. Tie alerts to error budget burn rather than raw threshold crossings. Track MTTA and MTTR separately so the team's actual bottleneck (detection, response, or fix) is visible. The investment is rethinking what to measure, not buying a new tool. The return is that incidents stop being discovered by customer complaints first. Teams that make this shift typically find their existing telemetry was sufficient; only the questions being asked of it were wrong.</p>\n<blockquote>\n<p><em>If a dashboard cannot answer \"what is the user experiencing right now\", it is not an observability dashboard. It is decoration.</em></p>\n</blockquote>\n<h2>2. Alerts are signals, not notifications</h2>\n<p>More alerts do not mean better monitoring. In practice, the opposite is true. Once alerts outpace the team's ability to act, important signals start getting missed.</p>\n<p>Effective alerting works to a small set of rules:</p>\n<ul>\n<li>Severity that maps to action, not to technical category</li>\n<li>Ownership baked in, never inferred at runtime</li>\n<li>Thresholds tied to user impact, not raw metric values</li>\n<li>Noise treated as a defect, with a regular review cadence</li>\n<li>Suppression and grouping for known multi-alert patterns</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: audit every alert against one test, \"what action would I take in the next five minutes if this fires now?\" Demote alerts with no answer to dashboards. Remove alerts where the answer is the same as another alert's. Group related alerts so one incident produces one page, not twelve. Most teams discover their alert volume drops by an order of magnitude after a thorough audit, and the alerts that remain start getting trusted again. Trust is the precondition for every other operational practice. Without it, on-call rotations decay into noise filtering and the real signals get missed.</p>\n<img />\n<p><em>Figure 2. From raw events to pages, in approximate orders of magnitude. The numbers vary by team and workload; what does not vary is that each stage needs to remove one to two orders of magnitude of noise. Teams that page on raw events end up with on-call rotations nobody trusts.</em></p>\n<h2>3. Incident response is a practiced muscle</h2>\n<p>Failures are inevitable. Unstructured response is not.</p>\n<p>The teams that recover quickly do not improvise during incidents. They follow a structure that has been practiced when nothing was on fire. The structure is intentionally simple, because incident time is the worst time to negotiate roles.</p>\n<ul>\n<li>Clear roles: incident lead, communications lead, scribe, subject matter expert (the RACI model, Responsible-Accountable-Consulted-Informed, adapted for incident response)</li>\n<li>Defined escalation paths with clear handoff criteria. Escalation means re-paging to a higher tier or specialist, not returning to detection. The lifecycle diagram in Figure 1 makes the distinction explicit.</li>\n<li>Runbooks for the top failure modes, kept short enough to actually be read</li>\n<li>Status communication on a fixed cadence, even when there is nothing new to say. Customer comms and internal comms are tracked separately.</li>\n<li>Blameless postmortems (focus on the system that allowed the failure, not the person who pushed the button) that produce action items the team actually completes</li>\n<li>Game days: scheduled exercises that simulate failure modes (region outage, dependency unavailability, traffic spike) under controlled conditions, so gaps in runbooks are found before incidents do</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: name the incident lead and the comms lead before the first message goes out. Write runbooks short enough to be scannable at 3 AM. Run blameless postmortems with action items that actually get tracked to completion. Schedule game days quarterly so the runbooks are exercised before real incidents. Teams that operate with this structure do not have more engineers; they have engineers who are not single points of failure during recovery. The deepest experts stay the deepest experts, but the platform stops depending on whether they happen to be online.</p>\n<h3>Implementation note</h3>\n<p>A short, well-structured runbook outperforms a long, exhaustive one. The goal during an incident is not to think. It is to act on a procedure that has been thought through in calmer times.</p>\n\n# Runbook header pattern (keep it scannable in incident time)\ntitle: High latency on order API\nslo_protected:                  # this runbook protects two SLOs\n  - order-completion-success\n  - order-completion-latency\nseverity:                       # derived from burn rate, not declared\n  fast_burn: P1                 # 14.4x budget burn over 1 hour =&gt; page now\n  slow_burn: P2                 # 6x budget burn over 6 hours =&gt; investigate\nowner: payments-team\nindicators:                     # triggers for evaluation, not severity\n  - p99 (99th-percentile) latency exceeds the SLO target for 5 min\n  - error rate exceeds the SLO target for 3 min on order-completion\nfirst_actions:\n  - Open the order-journey dashboard. Confirm impact in business terms.\n  - Check Service Bus queue depth and dead-letter rate (the most common\n    cause of API latency under load is downstream backpressure)\n  - Verify Cosmos DB RU/s saturation and partition hotspots\n  - Inspect the most recent deployment for behavioural changes\nescalate_if:\n  - Latency does not recover in 15 min\n  - Error rate exceeds 5% (fast burn against the SLO)\n  - Customer reports arrive before our own signals do\nrollback_path:\n  - Feature flag \"new-order-pipeline\" can be disabled per-tenant\n  - Last known good deployment id is in the release tracker\nnote_on_scaling:\n  # CPU is rarely the cause of latency in this service. Scale only after\n  # confirming the bottleneck is compute, not a downstream dependency or\n  # queue depth. Adding capacity to a saturated downstream amplifies the\n  # incident; it does not resolve it.\n\n<p>The general principle behind that last note travels beyond this runbook: scale-out is the right remediation for compute saturation, not for downstream saturation. When latency rises because a database, queue, or external dependency is saturated, adding capacity in front of the bottleneck moves more requests into the bottleneck and makes the incident worse. This is one of the most common operational mistakes when the dashboard shows red and the on-call instinct says \"add more\".</p>\n<h2>4. Release confidence is engineered</h2>\n<p>Releases get harder as systems grow. The platforms that ship confidently at scale have engineered the path, not learned to fear it.</p>\n<p>The patterns that change the math:</p>\n<ul>\n<li>Feature flags that allow change without deploy</li>\n<li>Canary deployments (releasing the new version to a small slice of traffic first, watching error budget burn before continuing) that surface problems on a small slice</li>\n<li>Gradual rollouts with automated rollback triggers</li>\n<li>Database migrations split from application releases</li>\n<li>Release coordination that scales with services, not with team size</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: every change ships behind a feature flag, canary deployments take a small slice of traffic first, and rollback is a one-click step in the pipeline rather than a procedure to be invented during an incident. The cost is the discipline of building rollback paths and exercising them. The return is releases that stop being events. Issues that previously triggered full rollbacks get isolated to a slice and rolled back automatically before they reach most users. The willingness to ship smaller, more frequent changes follows directly from the confidence that bad changes can be undone fast.</p>\n<blockquote>\n<p><em>Big releases feel safe because they are rare. They are actually risky because every change rides together.</em></p>\n</blockquote>\n<h2>5. Reliability is continuous, not a milestone</h2>\n<p>Reliability is not achieved through tools alone. It requires continuous refinement, feedback-driven improvement, and a budget that the team can spend on operational work without negotiating each time.</p>\n<p>The disciplines that keep systems reliable over years are codified well in the SRE-book framing of service level objectives and error budgets (the canonical reference is the <a href=\"https://sre.google/sre-book/service-level-objectives/\" target=\"_blank\">Google SRE Book chapter on Service Level Objectives</a>, with the operational follow-up in the <a href=\"https://sre.google/workbook/alerting-on-slos/\" target=\"_blank\">SRE Workbook chapter on alerting on SLOs</a>). The names matter less than the practice they enable.</p>\n<ul>\n<li><strong>SLOs</strong> chosen from the user's perspective, with two or three per service rather than ten. More SLOs means none of them shape behaviour.</li>\n<li><strong>Error budgets</strong>: the inverse of the SLO, expressing how much unreliability the team is willing to spend in a window. Used up early in the month means slow down on releases. Healthy means feature work keeps moving.</li>\n<li><strong>Multi-window burn-rate alerting</strong> turns SLOs from dashboards into pages: short window catches catastrophic failures, long window catches slow drift. Without burn-rate alerting, SLOs are observation, not operation. (The pattern is documented in the <a href=\"https://sre.google/workbook/alerting-on-slos/\" target=\"_blank\">SRE Workbook</a>.)</li>\n<li>Reliability work has its own backlog, prioritised against features. Not a wishlist after every incident.</li>\n<li>Regular game days that exercise failure modes (region failover, dependency outage, traffic spike) before they happen for real</li>\n<li>Capacity planning informed by data, not by anxiety</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: define two or three SLOs per service, expressed from the user's perspective. Compute the error budget weekly. When the budget is healthy, ship feature work. When the budget is burning fast, slow down and fix the cause. The conversation about which incidents matter and which can wait becomes possible because there is a shared number to point at. Reliability becomes a quantified property of the platform, not an opinion debated at every retrospective. Teams that adopt this discipline stop having the recurring \"how reliable do we need to be?\" argument and start having data-grounded trade-off discussions instead.</p>\n<h2>A scenario that ties it together</h2>\n<blockquote>\n<p>A platform was launching a new region. The build had gone well. Day 1 was clean. Two weeks in, latency started creeping up during peak hours. Alerts fired on raw thresholds, but no one could tell which ones to trust. Incident calls turned into long debugging sessions because three different teams owned overlapping pieces of the request path.</p>\n<p>The team did not start by buying a new tool. They started by treating operations as engineering work. The dashboard was redesigned around the user journey. Alerts were audited and most were demoted or removed. Roles for incident response were written down. A short runbook covered the top failure modes. Releases were broken into canary slices behind feature flags.</p>\n<p>None of this was new. It was discipline applied consistently to work that was previously assumed to be someone else's. The next region launch took half the effort, and the team's mean time to restore on the failures that did happen was measurably lower.</p>\n</blockquote>\n<h2>What teams get wrong</h2>\n<p>The common pattern is <strong>treating Day 2 as the cost of Day 1.</strong> Teams design beautifully, ship fast, then quietly absorb the operational debt. Dashboards proliferate. Alerts grow louder. Postmortems pile up.</p>\n<p>The fix is not more dashboards. It is treating operations as engineering work with the same rigour as feature delivery. Operability is a property the system either has or does not. It is not earned by adding monitoring. It is earned by designing for visibility and operating with discipline.</p>\n<h2>Where to start</h2>\n<p><strong>The most concrete starter from this post: an alert audit.</strong> List every alert that fires in the next week and apply a single test to each one: \"what action would I take in the next five minutes?\" Demote the alerts that have no answer. Remove the alerts where the answer is the same as another alert's. The audit takes a morning. The result usually halves alert volume and lifts trust on what remains, which is the precondition for every other operational practice in this post.</p>\n<h2>The shift</h2>\n<p>The most important shift in maturity is not technical. It is in stance.</p>\n<p>The shift is from <strong>shipping software to operating systems</strong>:</p>\n<ul>\n<li>Operations is not a phase that follows engineering. It is engineering.</li>\n<li>Reliability is not a milestone reached. It is a discipline practiced.</li>\n<li>Incidents are not interruptions to the work. They are the work.</li>\n</ul>\n<p>The teams that internalise this shift run platforms that are smaller, calmer, and more trusted. They do not have fewer incidents because their systems are more advanced. They have fewer incidents because their operational discipline is more consistent. Part 3 of this series argues that the same discipline applies again, in a different domain: the practices that make platforms operable are the practices that make AI useful in delivery.</p>\n<hr />\n<p><strong>Want to discuss?</strong> What is the one operational practice your team adopted that changed how you sleep at night? Drop a comment with patterns you have seen in your environment. Every reply gets read.</p>\n<p><strong>Previously in this series:</strong> <em>Building Cloud Native Platforms That Scale: Patterns That Actually Work.</em> The first post covered the design choices that make scale possible.</p>\n<p><strong>Next in this series:</strong> <em>AI-First Platform Engineering: From Copilot to Agentic Delivery.</em> Cloud helped us scale infrastructure. The next post looks at how AI is now changing how we build and run platforms.</p>\n<!--\n  Taxonomy:\n    Primary product: Azure\n    Secondary: Azure Monitor, Application Insights\n    Tags: Site Reliability Engineering, Observability, Incident Management, DevOps, Platform Engineering\n\n  Visuals embedded:\n    1. assets/diagram-1-incident-lifecycle.png  (source: assets/diagram-1-incident-lifecycle.mmd, Mermaid)\n    2. assets/diagram-2-alert-funnel.png        (source: assets/diagram-2-alert-funnel.py, matplotlib)\n-->"
  "4a92a4a05529ffdaeca5948237072b7a":
    "id": "4a92a4a05529ffdaeca5948237072b7a"
    "title": "Cloud Native Platforms: Evolve"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/cloud-native-platforms-evolve/ba-p/4520195"
    "published": "2026-05-22 07:40:33"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Audience:</strong> Engineering leaders, platform architects, senior developers exploring how to operationalise AI in their teams</p>\n<p><strong>Reading time:</strong> 8 minutes</p>\n<p><strong>Series:</strong> Cloud Native Platforms. Build, Run, Evolve. This is Part 3 of 3.</p>\n<hr />\n<p>Cloud helped us scale infrastructure.</p>\n<p>AI is starting to do the same thing for the work around the code: the planning, the testing, the release communication, the incident triage, the writing that surrounds writing software.</p>\n<p>The conversation about AI in software has narrowed too quickly to \"Copilot in the editor\". The bigger story is happening across the lifecycle. Planning, design, development, testing, release, and operations are all being augmented at once. The platforms that adopt AI well are not the ones with the most usage. They are the ones with the clearest discipline around how it is used.</p>\n<p>This post is about that discipline.</p>\n<h2>AI is changing how we engineer, not how we type</h2>\n<p>AI is not changing how we write code. It is changing how we engineer software.</p>\n<p>Code generation is the surface. Underneath it, AI is reshaping the unit of leverage. The question is no longer how fast a developer can type. It is how well a workflow can be expressed as a reusable engineering asset. Six disciplines determine whether AI moves the needle on outcomes or just adds another tool to the stack.</p>\n<img />\n<p><em>Figure 1. AI across the SDLC. Each phase has clear AI assist points and clear human-owned validations. The boundary is not negotiable. It is the design.</em></p>\n<h2>1. From assistance to augmentation</h2>\n<p>Early AI tools focused on assisting individual developers. Code suggestions. Autocomplete. Quick refactors. The value was real but bounded by the editor.</p>\n<p>The shift now is into structured workflows that span the lifecycle. The unit of leverage is no longer a single suggestion. It is a sequence of actions executed reliably across phases. (\"Agentic\" later in this post means a system that makes its own next-step decisions inside guardrails. A workflow follows a fixed sequence; an agent chooses the path.)</p>\n<ul>\n<li>Code generation has become baseline, not differentiator</li>\n<li>Workflow generation is where the largest gains live</li>\n<li>Multi-step assistance with explicit human checkpoints</li>\n<li>Context that travels across tools, not just within one</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: start with the single highest-volume writing task on the team (commit messages, code review comments, release notes, postmortem first drafts) and turn the AI assist for that task into a shared workflow rather than each individual's private trick. The cost is one engineer's afternoon documenting the workflow and the eval set. The return is that every engineer on the team inherits the work, and the task that used to consume an engineer's morning every two weeks becomes a background step in the release process. Workflow generation, not faster typing, is where the gains compound across a team.</p>\n<blockquote>\n<p><em>Code suggestions help one developer. Reusable workflows help the next ten.</em></p>\n</blockquote>\n<h2>2. AI across the SDLC, with guardrails</h2>\n<p>AI now has a useful role at every phase of delivery. The role is different at each phase, and the guardrails are different too.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Phase</th><th>What AI helps with</th><th>What humans must validate</th></tr><tr><td>Plan</td><td>Breaking down requirements, drafting acceptance criteria</td><td>Domain context, business priorities, customer impact</td></tr><tr><td>Build</td><td>Code generation, refactoring, scaffolding</td><td>Architectural fit, security boundaries, performance</td></tr><tr><td>Test</td><td>Test case generation, edge case discovery</td><td>Coverage of business-critical paths, regulatory cases</td></tr><tr><td>Release</td><td>Release notes, changelog summaries, communication drafts</td><td>Accuracy, tone, customer-facing claims</td></tr><tr><td>Operate</td><td>Log triage, incident summaries, runbook drafts</td><td>Root cause attribution, action item ownership</td></tr></tbody><colgroup><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /><col style=\"width: 33.33%;\" /></colgroup></table></div>\n<p>The guardrails are not optional decoration. They are the design.</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: stage AI assists for release communication (changelog drafting, customer-facing release notes, internal release announcements) and require a human review before anything goes out. The draft arrives consistently, faster than a human could produce, and easier to compare across releases. The reviewer is not eliminated; the reviewer is moved from author to editor, which is where their judgment actually matters. Teams that adopt this pattern stop missing release-note deadlines and stop publishing inconsistent communication across products.</p>\n<h2>3. From prompts to reusable assets</h2>\n<p>Many teams begin with prompt experimentation. Individuals find techniques that work for their tasks. The result is a patchwork of personal practices that do not survive a team change.</p>\n<p>The compounding value comes when prompts mature into reusable engineering assets.</p>\n<img />\n<p><em>Figure 2. The maturity model from prompts to agents. The value compounds at the workflow stage and accelerates at the agent stage. The disciplines that make agents safe are the same ones that made workflows reliable.</em></p>\n<p>The maturity stages, in order of leverage:</p>\n<ul>\n<li><strong>Prompts</strong>: ad-hoc, individual, hard to share</li>\n<li><strong>Templates</strong>: parameterised prompts versioned with the project</li>\n<li><strong>Workflows</strong>: multi-step sequences with clear inputs, outputs, checkpoints</li>\n<li><strong>Agents</strong>: autonomous task chains operating within explicit guardrails</li>\n</ul>\n<p>The diagram is a maturity ladder, not a graduation. In practice teams operate at all four stages simultaneously for different tasks. A senior engineer may use a one-off prompt to explore a refactor, run a versioned template for commit messages, hand off to a workflow for release notes, and trigger an agent for routine PR triage, all in the same hour. The point of the ladder is not to leave earlier stages behind. It is to know which stage a given task belongs to and to invest accordingly.</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: pick the three prompts your team uses every week, codify them as parameterised templates in the same repository as the application code, and treat them as engineering artefacts (reviewed, versioned, owned). New engineers inherit the team's accumulated practice instead of building their own from scratch. Quality becomes consistent because the variance between individuals shrinks. Investment pays back in weeks, not quarters, and the maturity ladder keeps producing returns as the team moves from templates to workflows to agents.</p>\n<h2>4. Agentic delivery, with guardrails that survive a security review</h2>\n<p>The next stage is agentic. AI executes sequences of tasks within a defined scope. The risk is not that the agent will fail. It is that the system around the agent will not catch the failure, and that the failure modes are different in kind from traditional automation. Agents are non-deterministic, they can be manipulated through their inputs, and their actions can have side effects in systems the team does not own.</p>\n<p>Five guardrails make agentic delivery safe. The first four are necessary. The fifth is what carries the agent through a security review at a regulated enterprise.</p>\n<ul>\n<li><strong>Identity and scope</strong>: the agent runs as a managed identity (or scoped service principal) with the smallest set of permissions that lets it do its job. Permissions are expressed as allowlists, not denylists. Tools fetched at runtime are subject to the same identity boundary as the agent itself.</li>\n<li><strong>Input quarantine</strong>: anything the agent reads from a user-controlled source (work item bodies, PR descriptions, customer tickets) is treated as untrusted text. The agent does not execute instructions found in fetched content, and tool calls are validated against an output schema before execution. This is the prompt-injection mitigation, and it is the most common gap in agentic systems shipped today.</li>\n<li><strong>Cost and blast-radius caps</strong>: every run has a maximum token budget, a maximum number of tool calls, and a maximum spend. Exceeding any cap aborts the run cleanly. Without caps, scoped credentials are not enough to bound the damage.</li>\n<li><strong>Evaluations and traceability</strong>: agents are evaluated against a fixed test set before deployment, and on every prompt or model change. Every action is logged with inputs, outputs, the model and prompt versions used, and the reasoning trace where the model exposes one. Logs are redacted for secrets and personally identifiable information at write time.</li>\n<li><strong>Reversibility taxonomy</strong>: actions are categorised by reversibility, not asserted to be reversible in general. A draft write to a private store is reversible. A post to a customer-facing channel is not reversible (deletion does not unsend). A database update may be reversible by a compensating transaction or not at all. Irreversible actions require human approval at the boundary, before they happen, not after. The agent is allowed to draft and stage. The human is the only one who is allowed to make the move that cannot be undone.</li>\n</ul>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: start with one low-risk agent (release-notes drafter, PR triage assistant) running on read-only inputs, write-only-to-drafts permissions, and a hard cost cap per run. Require explicit human approval at the irreversible step. Wire up an evaluation set on day one, and rerun it on every prompt or model change. Treat regressions as failures, not warnings. The first agent the team ships is rarely the most valuable; it is the rehearsal that establishes the controls every later agent inherits. Teams that skip this rehearsal end up with an agent in production that no one feels safe extending.</p>\n<h3>Implementation note</h3>\n<p>An agent without a reversibility taxonomy and a regression eval set is a liability. The discipline is the same one that made workflows reliable: scoped identity, idempotency, traceability, and a clear boundary between machine action and human decision. The YAML below is illustrative, not a runtime contract; it is meant to show the shape of the controls a real agent definition would carry, not the syntax of any specific platform.</p>\n# Agent run definition (illustrative; not a specific platform's syntax)\nname: release-notes-drafter\ntrigger: pre-release\nidentity:\n  type: managed-identity\n  scope: tenant=&lt;tenant-id&gt; resource=release-tools/&lt;app-id&gt;\npermissions:\n  allow:\n    - read: work-items in milestone (filter: state=Done)\n    - read: pull-requests in milestone (filter: merged)\n    - write: drafts/release-notes/${run-id}\n  # Production channels are NOT in the allowlist. The agent cannot post.\nlimits:\n  max_tokens_per_run: 80000\n  max_tool_calls_per_run: 20\n  max_runtime_seconds: 300\n  max_cost_usd: 0.40\n  on_exceeded: abort_with_partial_artifact\ninput_handling:\n  treat_fetched_content_as: untrusted\n  # Indirect prompt injection is mitigated by the layered discipline below,\n  # not by a single feature flag. Each item is a separate control.\n  enforce_instruction_hierarchy: true\n  validate_tool_args_against_schema: true\n  validate_outputs_against_schema: true\nsteps:\n  - fetch: completed work items in milestone\n  - draft: release notes from items\n  - validate: required fields present\n  - request-review:\n      from: release-manager\n      idempotency_key: ${milestone-id}-${draft-hash}\n  - on-approval:\n      action: post-to-internal-channel\n      reversibility: not-reversible\n      requires: explicit-human-click  # the agent does NOT click this\naudit:\n  log_inputs: true\n  log_outputs: true\n  redact:\n    - secrets\n    # Pattern-based: handles structured PII like emails, phones, IDs.\n    - pii_patterns: [email, phone, national-id, payment-card, ip-address]\n    # Entity-based: required for unstructured PII like names. Pattern alone\n    # cannot redact a customer name without an entity-recognition step.\n    - pii_entities: ner-based  # names, locations, organisations\n  retain: 365_days  # tune to your audit policy, not to the demo\nevaluation:\n  test_set: tests/release-notes/eval-v3.jsonl\n  on_prompt_change: rerun\n  on_model_change: rerun\n  fail_threshold: 5_percent_regression\n<h2>5. Where AI still needs human judgment</h2>\n<p>AI has clear boundaries. The boundaries are not embarrassing. They are the design.</p>\n<p>What must stay human-owned:</p>\n<ul>\n<li>Architectural trade-offs and design decisions</li>\n<li>Security validation and threat modelling</li>\n<li>Correctness for business-critical and regulatory paths</li>\n<li>Domain context that has not been written down</li>\n<li>Accountability for outcomes, not just outputs</li>\n</ul>\n<p>The goal is collaboration, not replacement. The teams that get the most value from AI are not the ones with the most automation. They are the ones with the clearest sense of where automation ends and judgment begins.</p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: name the human-owned items explicitly in the team's working agreement (architecture, security, regulatory correctness, accountability) and audit every AI workflow against that list. When a workflow asks the AI to make a decision in any of those categories, redesign it so the AI prepares the analysis and a human makes the call. Most teams over-trust AI for one of these areas in their first six months and learn the hard way. Naming the boundary up front prevents the lesson from being paid in production. The clarity is the value; the model behind the workflow is interchangeable.</p>\n<h2>6. Responsible AI is engineering work</h2>\n<p>The first five disciplines decide whether AI moves the needle. The sixth decides whether the platform can defend the choices it makes with AI. Responsible AI is the engineering practice of building systems whose AI behaviour is fair, transparent, accountable, and safe by design, not by audit after the fact. Treating it as a compliance checkbox at the end of the project is how teams end up shipping AI workflows that fail security review, embarrass the company, or harm users.</p>\n<p>Six controls turn responsible AI from a policy into engineering work. These map directly onto the practices Microsoft and the broader industry have converged on, but the names matter less than the practice they enable.</p>\n<ul>\n<li><strong>Fairness in inputs and outputs.</strong> The training data, eval set, and prompts are reviewed for systematic bias against any group the system serves. The eval set covers under-represented cases by design, not by accident, and regressions on those cases fail the build.</li>\n<li><strong>Transparency to end users.</strong> When a user sees AI-generated content, they are told. When a decision is AI-assisted, the path from input to output is explainable in plain language, not just in a model card buried in documentation.</li>\n<li><strong>Content safety filters.</strong> Inputs and outputs pass through safety classifiers (prompt injection, prohibited content, jailbreak patterns) before reaching the model and before reaching the user. Filtering decisions are logged and reviewable.</li>\n<li><strong>Accountability ownership.</strong> Every AI workflow has a named owner who is accountable for its outcomes, not just its uptime. The owner has the authority to pause or roll back the workflow when harm is detected.</li>\n<li><strong>Data minimisation and residency.</strong> The AI sees only the data it needs to do the task. Personally identifiable information and customer data are scoped, redacted, and kept inside the boundary the customer agreed to. Cross-tenant leakage is treated as a P1 incident, not a feature request.</li>\n<li><strong>Harm evaluation alongside quality evaluation.</strong> The eval set measures harm potential (toxicity, hallucination on factual queries, leakage of confidential context) with the same rigour as it measures correctness. Both must pass for a release to ship.</li>\n</ul>\n<img />\n<p><em>Figure 3. Responsible AI as a set of engineering controls around the AI workflow. The six controls fall into four categories: data discipline (fairness, data minimisation), model discipline (content safety, harm evaluation), deployment discipline (transparency to users), and governance (accountability ownership). All six are necessary; none is sufficient on its own.</em></p>\n<p><strong>In practice</strong></p>\n<p>The pattern that works: write the responsible AI plan before the first agent ships, not after the first incident. Pick one workflow that touches user data or generates customer-facing content, and use it as the reference implementation: fairness review on the eval set, content safety filters wrapping the model call, transparency annotation in the UI, redaction of identifying details in logs, harm evals running alongside quality evals on every change, and a named owner with explicit pause authority. The first such workflow takes longer to ship than the unconstrained version. Every workflow after it inherits the controls and ships faster than it would have without them. Teams that defer responsible AI to a future quarter end up retrofitting it under pressure, which is the most expensive way to do it.</p>\n<h2>A scenario that ties it together</h2>\n<blockquote>\n<p>Picture a platform team several months into using Copilot. Adoption is high. Productivity dashboards show gains. But defect rates are not improving and lead time is flat. Leadership asks the obvious question: is AI actually helping, or just feeling like help?</p>\n<p>The answer is not to stop using AI. It is to change how AI is measured. Move adoption metrics to the background. Move outcome metrics to the front: defect escape rate, lead time for change, change failure rate, mean time to recovery. In parallel, promote the individual prompts that have proved themselves to shared templates, and the templates to versioned workflows. Retrofit responsible AI controls onto the workflows that shipped first: content safety filters, harm evaluations alongside quality evaluations, transparency annotations on customer-facing output, and a named owner for each workflow.</p>\n<p>Six months later, the picture is different. Defect rate improves on the parts of the codebase where reusable workflows were introduced. Onboarding for new engineers is visibly faster. Release notes are consistent across teams. The shift is from celebrating use to tracking outcomes, and once the team measures what matters, the tooling decisions start making themselves.</p>\n</blockquote>\n<h2>What teams get wrong</h2>\n<p>The common pattern is <strong>measuring AI by usage, not by outcome</strong>. Adoption metrics tell you who tried Copilot. They do not tell you whether defects dropped, lead time improved, or release notes got better.</p>\n<p>The fix is not less AI. It is better measurement. The four metrics named in the scenario above (defect escape rate, lead time for change, change failure rate, mean time to recovery) come from the <a href=\"https://dora.dev/\" rel=\"noopener\" target=\"_blank\">DORA research on software delivery performance</a> and have become a useful default. Two warnings travel with them. First, attribution is hard: an AI workflow rolled out alongside a test refactor and a CI pipeline change cannot claim credit cleanly. Second, baselines matter more than headlines: a single quarter's improvement is not a trend, and a single team's gain is not the platform's gain. Outcome measurement done well needs a baseline window, an attribution discipline, and a kill criterion for workflows that are not paying back. Done poorly, it is just adoption metrics with better names.</p>\n<p>There is also the question of cost. AI usage carries a per-run token bill, an evaluation bill on every change, and (for agents) a cost cap that limits damage when something goes wrong. None of these are large compared to the engineering time saved when the workflow works. All of them are visible enough that a finance-aware reader will ask. Track them.</p>\n<h2>Where to start</h2>\n<p><strong>The most concrete starter from this post: promote one personal prompt to a shared template.</strong> Pick the prompt that gets used most often (commit messages, code reviews, release notes, debugging assist), move it from someone's notes into the repository where the team versions everything else, and watch what changes when the next person on the team runs it. That is the smallest unit of the workflow shift this post argues for, and it is the step where prompts stop being individual practice and start becoming engineering assets.</p>\n<h2>The shift</h2>\n<p>The shift is from <strong>building systems to building smarter systems</strong>:</p>\n<ul>\n<li>AI does not replace engineers. It changes what an engineer's leverage looks like.</li>\n<li>The unit of value is the workflow, not the suggestion.</li>\n<li>The discipline that made platforms operable is the same discipline that makes AI useful.</li>\n<li>Responsible AI is not a compliance step. It is the sixth engineering discipline that lets the other five compound safely.</li>\n</ul>\n<p>The series ends here, but the arc is consistent across all three posts. The disciplines that make platforms scale are the same disciplines that make AI useful. Build with discipline. Run with discipline. Evolve with discipline. The tools change. The disciplines do not.</p>\n<hr />\n<p><strong>Want to discuss?</strong> Where has AI moved the needle most in your delivery, and where has it disappointed you? Drop a comment with patterns you have seen in your environment. Every reply gets read.</p>\n<p><strong>Previously in this series:</strong></p>\n<ul>\n<li><em>Building Cloud Native Platforms That Scale: Patterns That Actually Work</em>. Part 1 covered the design choices that make scale possible.</li>\n<li><em>Running Cloud Native Platforms: Why Day 2 Decides Everything</em>. Part 2 covered the operational disciplines that decide production outcomes.</li>\n</ul>\n<p>This is the third and final post in the series.</p>\n<!--\n  Taxonomy:\n    Primary product: GitHub Copilot, Azure\n    Secondary: Microsoft 365 Copilot, AI Foundry\n    Tags: AI Engineering, GitHub Copilot, Agentic AI, Developer Productivity, Platform Engineering\n\n  Visuals embedded:\n    1. assets/diagram-1-sdlc-with-ai.png  (source: assets/diagram-1-sdlc-with-ai.mmd, Mermaid)\n    2. assets/diagram-2-maturity-model.png (source: assets/diagram-2-maturity-model.mmd, Mermaid)\n-->"
  "c28b96057a9e939370391deed2fb3281":
    "id": "c28b96057a9e939370391deed2fb3281"
    "title": "WAR, Azure Advisor, and Us (Azure Arch Diagram Builder): Three Ways to Score an Azure Architecture"
    "link": "https://techcommunity.microsoft.com/t5/azure-architecture-blog/war-azure-advisor-and-us-azure-arch-diagram-builder-three-ways/ba-p/4521611"
    "published": "2026-05-22 03:06:15"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Author:</strong> Arturo Quiroga, Azure AI services Engineer - Senior Partner Solutions Architect — Microsoft</p>\n<hr />\n<p>A few days ago I published <a href=\"https://techcommunity.microsoft.com/blog-draft-azure-architecture-blog.md\" target=\"_blank\"><em>From Prompt to Production: Building Azure Architecture Diagrams with AI</em></a>, introducing the open-source <a href=\"https://aka.ms/diagram-builder\" target=\"_blank\">Azure Architecture Diagram Builder</a>. One feature got more follow-up questions than any other: the <strong>Well-Architected Framework (WAF) validation</strong>. Architects from partners and customers — many of whom already use Azure Advisor and the Well-Architected Review — wanted to know exactly what scoring algorithm we use, how it compares to Microsoft's official tools, and whether they should be using all three.</p>\n<p>This post is that answer. It's a deep dive into how design-time WAF validation works, how Microsoft's two official WAF assessment algorithms work, and where each fits in the architecture lifecycle.</p>\n<blockquote>\n<p><strong>TL;DR.</strong> Microsoft ships two WAF assessment vehicles — the <strong>Well-Architected Review</strong> (questionnaire, scored from human answers) and the <strong>Azure Advisor score</strong> (healthy-resources-÷-applicable-resources weighted per subcategory, with Defender Secure Score for Security and cost-weighted math for Cost). Both require either a human filling in a form or live Azure telemetry. Our app runs <strong>at design time on a diagram</strong>, before anything is deployed, using a hybrid pipeline: a deterministic rule pre-scan followed by an LLM refinement pass. Same five WAF pillars, different lifecycle stage. Complementary, not competitive.</p>\n</blockquote>\n<hr />\n<h2 id=\"why-design-time-validation-matters\">Why design-time validation matters</h2>\n<p>Every cost overrun, reliability gap, and security incident I've ever debugged was cheaper to fix on a whiteboard than in production. Yet most WAF tooling assumes the architecture already exists — either because there are deployed resources to scan (Advisor) or because someone has built enough of it to answer 60 specific questions about it (WAR).</p>\n<p>That leaves a gap. <strong>Between \"rough sketch\" and \"deployed resource group\" there is no algorithmic WAF feedback loop.</strong> That's the gap the Diagram Builder fills.</p>\n<hr />\n<h2 id=\"microsofts-two-official-waf-assessment-algorithms\">Microsoft's two official WAF assessment algorithms</h2>\n<p>Before describing our approach, it's worth being precise about what Microsoft already ships, because the term \"WAF assessment algorithm\" can mean either of two very different things.</p>\n<h3 id=\"1-azure-well-architected-review-war--questionnaire-based\">1. Azure Well-Architected Review (WAR) — questionnaire-based</h3>\n<p>The <a href=\"https://learn.microsoft.com/assessments/azure-architecture-review/\" target=\"_blank\">Well-Architected Review</a> is a free self-assessment hosted on Microsoft Learn.</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Aspect</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Detail</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Input</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Human answers to ~60 questions mapped to the WAF pillar checklists</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Workload variants</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Core WAR, plus AI/ML, IoT, SAP on Azure, Azure Stack Hub, SaaS, Mission Critical</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Scoring</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Derived from the answers — each \"no\" or unanswered question subtracts from the pillar score</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Output</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Per-pillar maturity score + prioritized recommendations + optional Advisor integration</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Improvement tracking</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">\"Milestones\" (point-in-time snapshots)</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>When to use</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Periodic deep reviews; greenfield design baselining; brownfield audits</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>WAR is human-driven. The algorithm is essentially <em>\"how many of the recommended practices have you confirmed you do?\"</em> — which is exactly the right algorithm when the assessor is the workload team itself.</p>\n<h3 id=\"2-azure-advisor-score--telemetry-based\">2. Azure Advisor Score — telemetry-based</h3>\n<p>The <a href=\"https://learn.microsoft.com/azure/advisor/advisor-score#calculation-of-advisor-score\" target=\"_blank\">Advisor score</a> is the closest thing Microsoft ships to a real, deterministic WAF <em>algorithm</em>. It runs continuously over your deployed Azure resources.</p>\n<p>The math:</p>\n<img />\n<p>Pillar-specific overrides:</p>\n<ul>\n<li><strong>Security</strong> uses Microsoft Defender for Cloud's <strong>Secure Score</strong> model.</li>\n<li><strong>Cost</strong> weights by retail $ cost of healthy resources, plus age-of-recommendation weighting; postponed/dismissed items are removed from the denominator.</li>\n<li><strong>Reliability / Performance / Operational Excellence</strong> use the healthy-resources ratio above.</li>\n</ul>\n<p>Key terms:</p>\n<ul>\n<li><em>Healthy resource</em> — a deployed resource with no open Advisor recommendation against it for that pillar.</li>\n<li><em>Total applicable</em> — resources Advisor was able to evaluate (excludes dismissed/snoozed).</li>\n</ul>\n<p>Advisor is the right tool once you're in production. It cannot help you before deployment, because there is nothing to count as \"healthy\" or \"applicable.\"</p>\n<hr />\n<h2 id=\"the-missing-stage-design-time\">The missing stage: design time</h2>\n<p>Here's the lifecycle, with each tool's domain shaded:</p>\n<pre class=\"mermaid\">&nbsp;</pre>\n<pre class=\"mermaid\">&nbsp;</pre>\n<img />\n<p>&nbsp;</p>\n<pre class=\"mermaid\"><code><br /><br /></code><strong>Design / Diagram</strong> — <em>Diagram Builder validation</em> runs here.</pre>\n<ul>\n<li><strong>Operate / Observe</strong> — <em>Azure Advisor</em> runs here continuously.</li>\n<li><strong>Periodic Review</strong> — <em>WAR</em> runs here, typically quarterly or at major milestones.</li>\n</ul>\n<p><strong>These three stages are sequential and complementary. Our app does not replace Advisor or WAR — it adds a feedback loop earlier in the lifecycle, where corrections are cheapest.</strong></p>\n<hr />\n<h2 id=\"how-design-time-validation-works-in-the-diagram-builder\">How design-time validation works in the Azure Architecture Diagram Builder</h2>\n<p>The validator is a <strong>two-phase hybrid pipeline</strong>: deterministic local rules first, then LLM refinement. The full source lives in three files:</p>\n<ul>\n<li><a href=\"https://techcommunity.microsoft.com/../src/services/architectureValidator.ts\" target=\"_blank\"><code>src/services/architectureValidator.ts</code></a> — orchestrator and prompt</li>\n<li><a href=\"https://techcommunity.microsoft.com/../src/services/wafPatternDetector.ts\" target=\"_blank\"><code>src/services/wafPatternDetector.ts</code></a> — topology + service rule engine</li>\n<li><a href=\"https://techcommunity.microsoft.com/../src/data/wafRules.ts\" target=\"_blank\"><code>src/data/wafRules.ts</code></a> — the rule knowledge base</li>\n</ul>\n<pre class=\"mermaid\">&nbsp;</pre>\n<img />\n<pre class=\"mermaid\">&nbsp;</pre>\n<p>&nbsp;</p>\n<pre class=\"mermaid\">&nbsp;</pre>\n<h3 id=\"phase-1--deterministic-rule-pre-scan-1-ms-no-llm\">Phase 1 — Deterministic rule pre-scan (~1 ms, no LLM)</h3>\n<p>When you click <strong>Validate Architecture</strong>, the validator runs a fully client-side rule engine against the diagram's services, connections, and groups. There are two kinds of rules:</p>\n<h4 id=\"architecture-pattern-rules\">Architecture-pattern rules</h4>\n<p><strong>These fire when a topology anti-pattern is detected:</strong></p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Pattern</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Detection trigger</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>single-region</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No global LB (Traffic Manager / Front Door) with ≥3 services</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>single-database</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Exactly one database service, no replication signal</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>no-cache</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Compute + database present, no Redis/CDN</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>no-monitoring</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No Azure Monitor / App Insights / Log Analytics</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>no-identity</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No Microsoft Entra ID</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>no-waf</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Public web tier without WAF / Front Door / App Gateway</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>direct-db-access</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">An edge from a frontend service directly into a database</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>no-key-vault</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">4+ services and no Key Vault</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>no-backup</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Database present, no Azure Backup / Recovery Services</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><code>no-api-gateway</code></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">2+ compute services and no APIM / App Gateway / Front Door</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h4 id=\"service-specific-rules\">Service-specific rules</h4>\n<p><strong>Every service in the in the generated Azure Architecture diagram is matched against&nbsp;<code>SERVICE_SPECIFIC_RULES</code> by normalized type — App Service, Functions, AKS, Cosmos DB, SQL Database, Storage, Key Vault, and 22 more.</strong></p>\n<h4 id=\"the-knowledge-base-at-a-glance\">The knowledge base at a glance</h4>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Metric</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Count</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Total rules</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>73</strong></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Architecture-pattern rules</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>10</strong></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Service-specific rules</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>63</strong></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Distinct Azure services covered</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>29</strong></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Rules tagged <em>Reliability</em></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">18</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Rules tagged <em>Security</em></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">34</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Rules tagged <em>Cost Optimization</em></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">5</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Rules tagged <em>Operational Excellence</em></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">7</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Rules tagged <em>Performance Efficiency</em></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">9</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h4 id=\"the-preliminary-score\">The preliminary score</h4>\n<p>Each finding has a severity, and severity drives a fixed point deduction from a starting score of 100:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Severity</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Deduction</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #b91c1c; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">critical</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">−12</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #c2410c; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">high</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">−7</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #a16207; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">medium</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">−3</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #15803d; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">low</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">−1</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>Result is floored at 10 (so even a deliberately bad architecture scores at least 10) and ceilinged at 95 (no findings ≠ perfect — there's always something the model might still catch). This is the <strong>deterministic baseline</strong> before the LLM ever sees the architecture, and it's what makes the pipeline reproducible.</p>\n<h3 id=\"phase-2--llm-contextual-refinement\">Phase 2 — LLM contextual refinement</h3>\n<p><strong>The pre-scan output, the topology, and the optional natural-language description are folded into a focused prompt sent to one of seven Azure OpenAI models (GPT-5.1 through 5.4, GPT-5.x Codex variants, DeepSeek V3.2 Speciale, Grok 4.1 Fast). The system prompt gives the model explicit scoring guardrails:</strong></p>\n<blockquote>\n<ul>\n<li>Score based on what IS present, not what COULD be added.</li>\n<li>A well-connected architecture with appropriate services should score 60–80.</li>\n<li>Score below 50 only for critical gaps (no auth, no monitoring, single points of failure).</li>\n<li>Findings are improvement suggestions, not reasons to penalize the score severely.</li>\n</ul>\n</blockquote>\n<p>The model returns strict JSON:</p>\n<pre class=\"jsonc\"><code>{\n  \"overallScore\": 0-100,\n  \"summary\": \"2–3 sentence assessment\",\n  \"pillars\": [\n    {\n      \"pillar\": \"Reliability | Security | Cost Optimization | Operational Excellence | Performance Efficiency\",\n      \"score\": 0-100,\n      \"findings\": [\n        {\n          \"severity\": \"critical | high | medium | low\",\n          \"category\": \"...\",\n          \"issue\": \"...\",\n          \"recommendation\": \"...\",\n          \"resources\": [\"service-name-1\", \"service-name-2\"],\n          \"source\": \"rule-based | ai-analysis\"\n        }\n      ]\n    }\n  ],\n  \"quickWins\": [ /* same shape as findings */ ]\n}</code></pre>\n<p>Two things to call out:</p>\n<ol type=\"1\">\n<li><strong>Every finding is tagged <code>rule-based</code> or <code>ai-analysis</code>.</strong> That tag is the credibility lever. You can always see what the deterministic engine produced versus what the model contributed on top. If you don't trust the AI layer, you can ignore it entirely — the rule layer still stands.</li>\n<li><strong>The LLM is given pattern hints, not the entire rule catalog.</strong> The prompt stays small and focused, which is roughly 3–5× faster and cheaper than asking the LLM to do everything from scratch.</li>\n</ol>\n<h3 id=\"what-the-user-sees\">What the user sees</h3>\n<p>On every run the modal reports:</p>\n<ul>\n<li><strong>Overall WAF score</strong> (0–100)</li>\n<li><strong>Per-pillar score</strong> × 5 (0–100 each)</li>\n<li><strong>Severity breakdown</strong> — counts of critical / high / medium / low across all findings</li>\n<li><strong>Quick wins</strong> — high-impact, low-effort items the model surfaces separately</li>\n<li><strong>Hybrid metadata</strong> — local findings count, patterns detected, KB rules used, preliminary score, local elapsed ms</li>\n<li><strong>AI metrics</strong> — model used, reasoning effort, prompt/completion/total tokens, elapsed time</li>\n<li><strong>App Insights telemetry</strong> — an <code>Architecture_Validated</code> event with model, overall score, finding count, elapsed time</li>\n</ul>\n<hr />\n<h2 id=\"worked-example\">Worked example</h2>\n<p>Take this prompt, which I've used in demos with partners:</p>\n<blockquote>\n<p><em>\"A multi-region web application: Azure Front Door in front of two App Service instances in West US 2 and East US 2, both reading from an Azure SQL Database with geo-replication, with Application Insights for telemetry. No Entra ID, no Key Vault.\"</em></p>\n</blockquote>\n<p>After generation, <strong>Validate Architecture</strong> runs:</p>\n<p><strong>Phase 1 — pre-scan (deterministic), ~1 ms</strong></p>\n<ul>\n<li>Patterns detected: <code>no-identity</code>, <code>no-key-vault</code></li>\n<li>Findings produced: 8 (1 critical, 1 high, 3 medium, 3 low)</li>\n<li>Preliminary score: <strong>100 − 12 − 7 − (3×3) − (1×3) = 69</strong></li>\n</ul>\n<p><strong>Phase 2 — LLM refinement, ~6–9 s depending on model</strong></p>\n<p>The model accepts the two pattern hints, validates them in context, and adds three more findings of its own:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Finding</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Source</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Pillar</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Severity</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No Microsoft Entra ID for authentication</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #1e3a8a; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">rule-based</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Security</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #b91c1c; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">critical</span></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No Key Vault for secret management</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #1e3a8a; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">rule-based</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Security</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #c2410c; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">high</span></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">App Service slots not used for safe deploys</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #6b21a8; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">ai-analysis</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Operational Excellence</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #a16207; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">medium</span></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">SQL DB geo-replication present but RTO/RPO not documented</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #6b21a8; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">ai-analysis</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Reliability</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #a16207; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">medium</span></td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No CDN for static assets behind Front Door</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #6b21a8; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">ai-analysis</span></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Performance Efficiency</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><span style=\"display: inline-block; padding: 2px 8px; border-radius: 10px; color: #15803d; font-weight: 600; font-size: 12px; font-family: 'Segoe UI',Arial,sans-serif;\">low</span></td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<p>Final scores returned by the model:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Pillar</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Score</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Reliability</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">78</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Security</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">52</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Cost Optimization</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">80</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Operational Excellence</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">70</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Performance Efficiency</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">75</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>Overall</strong></td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\"><strong>71</strong></td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<p>The Security score is the lowest because two of the highest-severity findings landed there — exactly what a human reviewer would flag first.</p>\n<hr />\n<h2 id=\"multi-model-comparison\">Multi-model comparison</h2>\n<p>Because the deterministic floor is identical across runs, the <strong>Validation Comparison</strong> view becomes a fair shootout of what each LLM adds on top of the same baseline. The same diagram is scored by all seven models, and the UI surfaces:</p>\n<ul>\n<li>Overall score per model</li>\n<li>Per-pillar score per model</li>\n<li>Severity-count deltas</li>\n<li>Number of <code>ai-analysis</code> findings each model contributed</li>\n<li>Quick wins each model identified</li>\n</ul>\n<p>This is genuinely useful for two reasons. First, it shows that LLM scores vary — typically by ±5–10 points on the same architecture — which is exactly why we publish the <code>rule-based</code> vs <code>ai-analysis</code> tag. Second, it lets architects pick the model whose review style matches their own.</p>\n<hr />\n<h2 id=\"how-we-align-with-microsofts-algorithms\">How we align with Microsoft's algorithms</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Alignment point</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">What it means</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Same five pillars</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Identical names and scope to the official WAF</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Same source material</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Rules derived from WAF docs and Azure Architecture Center service guides</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Severity-graded findings</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Map conceptually to Advisor's high/medium/low impact recommendations</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Per-pillar + overall scoring</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Mirrors WAR/Advisor output shape, so the results feel familiar</td></tr></tbody><colgroup><col style=\"width: 50.00%;\" /><col style=\"width: 50.00%;\" /></colgroup></table></div>\n<h2 id=\"where-we-deliberately-differ--and-why\">Where we deliberately differ — and why</h2>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" class=\"lia-border-color-custom-d6dee6 lia-border-style-solid\" style=\"width: 100%; border-width: 1px;\"><thead><tr><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Concern</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Microsoft</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Diagram Builder</th><th class=\"lia-border-color-custom-0078d4 lia-border-style-solid\" style=\"border-width: 1px; padding: 10px 12px;\">Why we differ</th></tr></thead><tbody><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Needs deployed resources</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Advisor: yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No — works on a diagram</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">We're a <em>design-time</em> tool; the architecture doesn't exist yet</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Needs human Q&amp;A</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">WAR: yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No — derived from the diagram</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">One-click validation inside the design flow</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Healthy/Applicable ratio</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Advisor: yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No resource-health signal exists pre-deployment</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Subcategory fixed weights</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Advisor: yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No explicit weights</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Severity is the de-facto weight (12/7/3/1)</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Defender Secure Score for Security</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Advisor: yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Defender requires deployed resources</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Cost-weighted scoring</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Advisor: yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">No (separate Cost Estimation feature)</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Cost is a separate pipeline in our app</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">AI/LLM refinement</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Neither</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Catches context-specific issues a static catalog misses, and explains findings in natural language</td></tr><tr><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Multi-model comparison</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Neither</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Yes</td><td class=\"lia-border-color-custom-d6dee6 lia-vertical-align-top lia-border-style-solid\" style=\"border-width: 1px; padding: 8px 12px;\">Lets architects see scoring variance across models</td></tr></tbody><colgroup><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /><col style=\"width: 25.00%;\" /></colgroup></table></div>\n<hr />\n<h2 id=\"honest-limitations\">Honest limitations</h2>\n<p>I'd rather you hear these from me than discover them in production:</p>\n<ul>\n<li><strong>LLM scores drift.</strong> ±5–10 points across models on the same diagram is normal. Treat the score as directional, the findings as actionable. The <code>rule-based</code> tag is your anchor.</li>\n<li><strong>No live telemetry.</strong> We can't know if your App Service is actually using availability zones — only that you have App Service in the diagram. Advisor will tell you the truth post-deployment.</li>\n<li><strong>Generic ruleset.</strong> No specialized workload branches yet (AI/ML, IoT, SAP, SaaS). WAR has those.</li>\n<li><strong>No milestone tracking.</strong> Each validation run is independent. Compare runs manually using the Validation Comparison view.</li>\n<li><strong>Rule coverage is finite.</strong> 29 services and 73 rules is a strong start but not exhaustive — the LLM layer exists in part to compensate for that gap.</li>\n</ul>\n<hr />\n<h2 id=\"how-to-use-all-three-together\">How to use all three together</h2>\n<p><strong>A lifecycle that actually works:</strong></p>\n<ol type=\"1\">\n<li><strong>Design</strong> — <strong>Use the <a href=\"https://aka.ms/diagram-builder\" target=\"_blank\">Diagram Builder</a> to sketch the architecture and validate at design time. </strong>Iterate until the per-pillar scores look reasonable and the critical/high findings are addressed.</li>\n<li><strong>Deploy</strong> — <strong>Generate Bicep from the diagram, deploy, </strong>and let Azure Advisor start scoring real resources.</li>\n<li><strong>Operate</strong> — <strong>Use Azure Advisor continuously</strong>. Use Defender Secure Score for security posture.</li>\n<li><strong>Periodic review</strong> — <strong>Run a Core WAR every quarter</strong> or at major milestones to capture the things only humans know (business context, tradeoffs, planned debt).</li>\n</ol>\n<p><strong>None of these three replace the others. They cover different stages of the same loop.</strong></p>\n<hr />\n<h2 id=\"whats-next\">What's next</h2>\n<p>A few things on the roadmap I'd love feedback on:</p>\n<ul>\n<li><strong>Milestone tracking</strong> so design-time scores can be compared over time the way WAR milestones work.</li>\n<li><strong>Workload-specific rulesets</strong> mirroring WAR's branches — starting with AI/ML.</li>\n<li><strong>Direct Advisor handoff</strong> — once a diagram is deployed, surface the corresponding Advisor recommendations in the same UI to close the loop.</li>\n</ul>\n<hr />\n<h2 id=\"try-it-fork-it-tell-me-where-its-wrong\">Try it, fork it, tell me where it's wrong</h2>\n<ul>\n<li><strong>Live app:</strong> <a href=\"https://aka.ms/diagram-builder\" target=\"_blank\">https://aka.ms/diagram-builder</a></li>\n<li><strong>Source:</strong> <a href=\"https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder\" target=\"_blank\">github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder</a></li>\n</ul>\n<p>Useful references:</p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/azure/well-architected/pillars\" target=\"_blank\">Azure Well-Architected Framework pillars</a></li>\n<li><a href=\"https://learn.microsoft.com/assessments/azure-architecture-review/\" target=\"_blank\">Azure Well-Architected Review tool</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/advisor/advisor-score#calculation-of-advisor-score\" target=\"_blank\">Azure Advisor score — calculation</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/advisor/advisor-assessments#create-azure-advisor-waf-assessments\" target=\"_blank\">Use Azure WAF assessments (Advisor)</a></li>\n<li><a href=\"https://learn.microsoft.com/azure/well-architected/design-guides/implementing-recommendations\" target=\"_blank\">Complete an Azure Well-Architected Review assessment</a></li>\n</ul>\n<p><strong>If you're a partner or customer architect who's already living in Advisor and WAR, I'd genuinely value your reaction — does the design-time stage feel like a real gap to you, or are you already covering it some other way? Open an issue on the repo or reply on LinkedIn.</strong></p>\n<p><em>Posted on the Azure Architecture Blog · Comments and issues welcome on the <a href=\"https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder\" target=\"_blank\">repo</a>.</em></p>"
