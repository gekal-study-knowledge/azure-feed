  "db2a99ec002ad2c2d4bcb99995f27ae1":
    "id": "db2a99ec002ad2c2d4bcb99995f27ae1"
    "title": "Building AI Guardian Extension: AI Detection and Enterprise AI Security"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/building-ai-guardian-extension-ai-detection-and-enterprise-ai/ba-p/4521125"
    "published": "2026-05-19 20:41:31"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<h2><strong>Introduction</strong></h2>\n<p>Generative AI tools such as <strong>ChatGPT, GitHub Copilot, and Google Gemini</strong> are rapidly becoming part of everyday enterprise workflows. Teams use them for code generation, documentation, analysis, support automation, and productivity enhancement.</p>\n<p>However, this accelerated adoption has also created a significant governance and security challenge: <strong>Shadow AI</strong>.</p>\n<p>Shadow AI refers to the <strong>unauthorized, unmanaged, or unmonitored use of AI tools inside an organization</strong>. Employees may unknowingly paste sensitive enterprise information into external AI platforms, exposing:</p>\n<ul>\n<li>API keys</li>\n<li>Source code</li>\n<li>Customer data</li>\n<li>Credentials</li>\n<li>Internal business documents</li>\n</ul>\n<p>At the same time, enterprise AI usage is increasingly exposed to:</p>\n<ul>\n<li>Prompt injection attacks</li>\n<li>Malicious API manipulation</li>\n<li>Unsafe model outputs</li>\n<li>Compliance violations</li>\n</ul>\n<p>Security and compliance teams currently lack centralized visibility and governance over enterprise AI usage.&nbsp;</p>\n<p>Existing tools are fragmented and do not provide unified protection across the complete AI attack surface including Data, Prompt/API, and Model layers.</p>\n<p><strong>Organizations require an intelligent, autonomous platform capable of&nbsp;</strong></p>\n<p>detecting Shadow AI usage,<br />preventing sensitive data leakage,<br />securing AI interactions,<br />enforcing governance policies,<br />and maintaining compliance in real time.</p>\n<p><strong>Proposed Solution:&nbsp;</strong></p>\n<p>AI Guardian is an intelligent security and governance platform designed to secure enterprise AI adoption and mitigate Shadow AI risks.</p>\n<p><strong>1) The platform continuously monitors AI interactions across enterprise environments and provides autonomous protection across multiple AI attack surfaces.</strong><br /><br />Core Capabilities<br />Shadow AI Detection<br />Detects unauthorized AI tool usage<br />Monitors risky AI interactions<br />Identifies sensitive data exposure<br />Multi-Layer AI Security<br />Data Layer Protection<br />PII detection<br />API key and credential scanning<br />Confidential data leakage prevention<br />Prompt/API Layer Protection<br />Prompt injection detection<br />Malicious prompt analysis<br />API abuse detection<br />Model Layer Protection<br />Unsafe response monitoring<br />AI Compliance Copilot<br />Generates governance reports<br />Recommends remediation actions<br /><br /><strong>2.AI Guardian Extension Automatically performs:</strong><br />prompt blocking,<br />redaction,<br />SOC alerting,<br />incident creation,<br />and compliance logging.</p>\n<p><strong>3.AI Guardian Extension Business Value:</strong></p>\n<p>This AI Guardian delivers measurable business value by enabling secure and governed enterprise AI adoption.<br /><strong>4.Key Business Benefits</strong><br />1. Prevents Sensitive Data Leakage<br />2. Enables Safe Enterprise AI Adoption<br />3. Reduces Compliance Risks and helps align enterprise AI usage with:<br />SOC2<br />ISO27001<br />GDPR<br />Internal security policies</p>\n<p><br /><strong>5. Improves Security Visibility and provides centralized visibility into:</strong><br /><br />AI usage patterns<br />risky prompts<br />Shadow AI activity<br />policy violations<br /><br /><strong>6. Strengthens Enterprise AI Security Posture and protects multiple AI attack surfaces including:</strong><br /><br />Data Layer<br />Prompt/API Layer<br />Model Layer</p>\n<p><strong>Customer Involvement</strong></p>\n<p><span>No Customer Involvement added.</span></p>\n<p><strong>Scenario: Employee pastes confidential code into ChatGPT&nbsp;</strong></p>\n<ol>\n<li>User opens ChatGPT in the browser</li>\n<li>AI Guardian Extension detects site access</li>\n<li>User pastes source code containing an API key</li>\n<li>Content script captures prompt text</li>\n<li>Sensitive data detector finds the API key</li>\n<li>Policy engine classifies the action as high risk</li>\n<li>Extension redacts the key and blocks original submission</li>\n<li>User sees a notification explaining the action</li>\n<li>Event is logged to AI Guardian backend</li>\n<li>SOC alert and compliance log are generated if required</li>\n</ol>\n<p>The rise of Shadow AI means enterprises can no longer rely solely on backend monitoring or post-event analysis. Security controls must move closer to the <strong>user interaction point</strong>, where prompts are created and data is shared.</p>\n<p>Building an <strong>AI Guardian Browser Extension</strong> provides that control plane.</p>\n<p>It enables organizations to:</p>\n<ul>\n<li>detect unauthorized AI usage</li>\n<li>inspect prompts in real time</li>\n<li>prevent sensitive data leakage</li>\n<li>block malicious interactions</li>\n<li>enforce governance policies</li>\n<li>generate audit-ready logs</li>\n</ul>\n<p>In a world where AI adoption is accelerating faster than governance, the AI Guardian Extension becomes a practical and scalable way to make enterprise AI usage <strong>secure, visible, and compliant</strong>.</p>\n<p>&nbsp;</p>"
  "6023248f50d319cdf56ce8d16f974656":
    "id": "6023248f50d319cdf56ce8d16f974656"
    "title": "Rundeck – AWS Enterprise Rundeck Integration with Azure Runner"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/rundeck-aws-enterprise-rundeck-integration-with-azure-runner/ba-p/4521080"
    "published": "2026-05-19 19:08:59"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<h2>Architecture Overview</h2>\n<ul>\n<li><strong>Rundeck Server (AWS)</strong> → https://dev.rundeck.xyz.com</li>\n<li><strong>Rundeck Runner (Azure Linux VM)</strong></li>\n<li><strong>Secure Communication</strong> over HTTPS (Port 4432)</li>\n<li>Optional Proxy for enterprise networks</li>\n</ul>\n<p>1.Ensure that network connectivity is established between the Rundeck endpoint (dev.rundeck.xyz.com) and the Azure subnet over port 443.</p>\n<p>2.Request the customer to create a Runner within a new or existing project in the Rundeck portal by providing a suitable name and tags and&nbsp;then proceed to download the corresponding Runner JAR file.</p>\n<p>3.Provision an Azure Linux Virtual Machine and deploy the downloaded Runner JAR using a VM extension or through a CI/CD pipeline integrated with BAMS/Artifactory. Below all prerequisite steps are mentioned which needs to be run on Azure VM to ensure Rundeck runner is ready.</p>\n<p>4.Additionally, make sure all required prerequisites are installed on the Azure Linux VM that will host the Rundeck Runner.</p>\n<p>5.After installation it will establish the connectivity between azure Rundeck runner and Aws Enterprise Rundeck.</p>\n<p>6.We can trigger any Rundeck jobs on Azure virtual machines.</p>\n<img />\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>By deploying the Rundeck Runner on Azure, enterprises can seamlessly bridge AWS-hosted orchestration with Azure-based execution environments. This setup enables robust, scalable, and secure automation across hybrid cloud ecosystems.</p>\n<p><strong>All prerequiste needs to be run on the Azure vm.</strong></p>\n<p><strong>Step 1: Network Connectivity Prerequisites:</strong></p>\n<p>Ensure proper network connectivity between Rundeck and Azure:</p>\n<p>Allow outbound/inbound access: Source: Azure Subnet Destination: dev.rundeck.xyz.com Port: 443 Protocol: HTTP</p>\n<p><strong>Step 2: Create Rundeck Runner</strong></p>\n<p>Login to Rundeck Portal</p>\n<p>Navigate to a project → Runner Management</p>\n<p>Create a new runner:</p>\n<p>Provide Name</p>\n<p>Add Tags</p>\n<p>Download the Runner JAR file</p>\n<p><strong>Step 3: Azure VM setup</strong></p>\n<p>Create a Linux VM (RHEL/CentOS) in Azure.</p>\n<p>Deploy the runner jar via:</p>\n<p>CI/CD pipeline (BAMS/Artifactory)</p>\n<p>VM Extension for automation</p>\n<p><strong>Step 4: Install Prerequisites on Azure VM</strong></p>\n<p>Install Java 11</p>\n<p>sudo bash</p>\n<p>yum install java-11-openjdk.x86_64</p>\n<p>rpm -qa | grep java-11</p>\n<p>java --version</p>\n<p><strong>Step 5: Start the Runner -</strong></p>\n<p>useradd rundeck</p>\n<p><strong>Step 6: Create Rundeck User-</strong></p>\n<p>mkdir /opt/rundeck/</p>\n<p>chown -R rundeck:rundeck /opt/rundeck/</p>\n<p>cp runner-*.jar /opt/rundeck/</p>\n<p>ll /opt/rundeck/</p>\n<p><strong>Step 7: Start the Runner -</strong></p>\n<p><strong>without proxy</strong></p>\n<p>/bin/java -jar /opt/rundeck/runner-&lt;id&gt;.jar</p>\n<p><strong>With proxy:</strong></p>\n<p>/bin/java \\</p>\n<p>-Dmicronaut.http.client.proxy-type=http \\</p>\n<p>-Dmicronaut.http.client.proxy-address=webproxy.lo5.mgmt.services:80 \\</p>\n<p>-jar /opt/rundeck/runner-&lt;id&gt;.jar</p>\n<p><strong>Step 8: Configure Runner as a Service</strong></p>\n<p>vi /etc/systemd/system/runner.service</p>\n<p>Add Configuration</p>\n<p>[Unit]</p>\n<p>Description=Process Automation Runner</p>\n<p>[Service]</p>\n<p>WorkingDirectory=/opt/rundeck/</p>\n<p>Type=simple</p>\n<p>User=rundeck</p>\n<p>Group=rundeck</p>\n<p>ExecStart=/bin/java -jar /opt/rundeck/runner-&lt;id&gt;.jar</p>\n<p>Restart=on-failure</p>\n<p>[Install]</p>\n<p>WantedBy=multi-user.target</p>\n<p>Enable and start service:</p>\n<p>chmod 0640 /etc/systemd/system/runner.service</p>\n<p>systemctl daemon-reload</p>\n<p>systemctl enable runner.service</p>\n<p>systemctl start runner.service</p>\n<p>systemctl status runner.service</p>\n<p><strong>Step 9: Verify Runner Process</strong></p>\n<p>ps aux | grep rundeck</p>\n<p>systemctl status runner.service</p>\n<p><strong>Step 10: Configure Log Rotation</strong></p>\n<p>create configuration:</p>\n<p>vi /etc/logrotate.d/rundeck_runnerd</p>\n<p>/opt/rundeck/runner/logs/operations.log</p>\n<p>{</p>\n<p>&nbsp;daily</p>\n<p>&nbsp;missingok</p>\n<p>&nbsp;&nbsp;&nbsp; rotate 8</p>\n<p>&nbsp; &nbsp; compress</p>\n<p>&nbsp;&nbsp;&nbsp; copytruncate</p>\n<p>&nbsp;&nbsp;&nbsp; maxsize 150M</p>\n<p>&nbsp;&nbsp;&nbsp; create 644 root root</p>\n<p>}</p>\n<p><strong>Step 11: Runner Upgrade Process</strong></p>\n<p>Regenerate credentials:</p>\n<p>curl -k -X POST https://dev.rundeck.xyz.com/api/42/runnerManagement/runner/&lt;runner-id&gt;/regenerateCreds \\</p>\n<p>--header \"Content-Type: application/json\" \\</p>\n<p>--header \"X-Rundeck-Auth-Token: &lt;token&gt;\"</p>\n<p><strong>Step 12: Download Updated runner</strong></p>\n<p>curl -k -X GET https://dev.rundeck.xyz.com/api/41/runnerManagement/download/&lt;downloadTk&gt; \\</p>\n<p>--header \"X-Rundeck-Auth-Token: &lt;token&gt;\" \\</p>\n<p>--output runner-${runner_id}.jar</p>"
  "5116507b1196abec13abd1b41e9a58e8":
    "id": "5116507b1196abec13abd1b41e9a58e8"
    "title": "Building a Terraform Drift Validator for Azure with Live Portal Verification"
    "link": "https://techcommunity.microsoft.com/t5/azure-infrastructure-blog/building-a-terraform-drift-validator-for-azure-with-live-portal/ba-p/4520952"
    "published": "2026-05-19 15:18:13"
    "fetched": "2026-08-27 21:13:49"
    "summary": "<p><strong>Architecture:&nbsp;</strong></p>\n<img />\n<p>This blog describes how to build a practical <strong>Terraform Drift Validator for Azure</strong> that compares <strong>three sources of truth</strong>:</p>\n<ol>\n<li><strong>Excel sheet or design document</strong> containing expected Azure configuration</li>\n<li><strong>Terraform state file</strong> representing IaC-managed deployed intent</li>\n<li><strong>Live Azure configuration</strong>, verified both programmatically and through <strong>Azure Portal step-by-step checks</strong></li>\n</ol>\n<p>The solution can be exposed as a lightweight validation application. Below is the link of agent created for drift validator for infra.</p>\n<p><strong><a class=\"lia-external-url\" href=\"https://ca-aiv-agent.livelyhill-f6d3be20.eastus.azurecontainerapps.io/\" rel=\"noopener\" target=\"_blank\">https://ca-aiv-agent.livelyhill-f6d3be20.eastus.azurecontainerapps.io/</a></strong></p>\n<h2>Key Takeaways</h2>\n<ul>\n<li>Terraform drift detection is valuable but <strong>Terraform alone is not enough</strong> when enterprises also rely on design documents, migration inventories, and operational portal validations.&nbsp;</li>\n<li>Azure attributes such as <strong>SKU, tags, accelerated networking, managed disk type, and zone placement</strong> can all be validated using a mix of Terraform state parsing, Azure APIs/Resource Graph, and portal verification.&nbsp;</li>\n<li><strong>Azure Resource Graph</strong> is especially useful for fast, large-scale live validation because it can query resource properties across subscriptions without calling every resource provider one by one.&nbsp;</li>\n<li><strong>Managed Identity</strong> is the preferred enterprise authentication model for a read-only validator because it removes credential handling and supports token-based access to downstream Azure services.</li>\n<li>Manual <strong>Azure Portal verification with documented steps and screenshot placeholders</strong> makes the solution feel audit-ready, migration-ready, and operationally trustworthy.</li>\n</ul>\n<h2>1. Introduction</h2>\n<p>Terraform drift in Azure happens when what is actually deployed no longer matches what Terraform thinks exists or what the original design intended. In practice, drift appears after portal edits, partial manual changes, external scripts, policy remediation, or emergency operational actions that never get folded back into code. HashiCorp recommends automated drift detection because unmanaged divergence can create operational inconsistency, security exposure, and compliance risk.</p>\n<p>Azure environments make this especially important because infrastructure is often governed by multiple teams: architects define the target design, DevOps teams deploy through Terraform, and operations teams may validate or troubleshoot through Azure Portal. Azure Resource Graph itself exists to support large-scale governance and current-state visibility across subscriptions, which makes it a strong foundation for live verification.&nbsp;</p>\n<p>That is why an enterprise-grade drift validator should not compare only <strong>Terraform vs Azure</strong>. It should compare:</p>\n<ul>\n<li><strong>Design intent</strong> from Excel or architecture documentation</li>\n<li><strong>Terraform state</strong> as the IaC-managed representation</li>\n<li><strong>Azure live configuration</strong> as the real runtime state</li>\n</ul>\n<h2>2. Problem Statement</h2>\n<p>Many organizations still maintain infrastructure specifications in Excel, migration trackers, or design documents. Those documents often contain the details that matter most to governance and operations: VM sizes, storage SKUs, disk performance expectations, tags, zones, and network settings. Terraform state, on the other hand, reflects what Terraform knows about deployed resources. Azure live state reflects what is actually running.</p>\n<p>These three sources diverge for common reasons:</p>\n<ul>\n<li>A VM was resized manually in Azure Portal</li>\n<li>Accelerated networking was expected in design, defined in Terraform, but the actual NIC does not reflect it</li>\n<li>Tags were defined in a workbook but never applied consistently</li>\n<li>Storage or disk settings changed during production troubleshooting</li>\n<li>Zone placement differs from the architecture baseline</li>\n</ul>\n<h2>3. Solution Overview</h2>\n<p>The proposed solution is a <strong>Terraform Drift Validator for Azure with Live Portal Verification</strong>. At a high level, it works like this:</p>\n<ul>\n<li>The user uploads an <strong>Excel sheet</strong> or <strong>design document</strong></li>\n<li>The solution extracts expected resource configuration</li>\n<li>It ingests the <strong>Terraform state file</strong></li>\n<li>It queries <strong>Azure live resources</strong></li>\n<li>It normalizes values across all three sources</li>\n<li>It compares attributes and generates a structured drift report</li>\n<li>It optionally presents portal validation steps for manual verification</li>\n</ul>\n<p>This can run as a <strong>web application, API service, or agent-based validator</strong>, exposed through:</p>\n<p><strong>https://ca-aiv-agent.livelyhill-f6d3be20.eastus.azurecontainerapps.io/</strong></p>\n<h2>4. Supported Validation Parameters</h2>\n<p>A useful validator should support the following checks:</p>\n<ul>\n<li><strong>SKU</strong><br />Validate expected SKU from design against Terraform and live Azure. This is critical for cost and performance.</li>\n<li><strong>IOPS</strong><br />Validate disk performance expectations. Azure documents that some disk types—particularly Ultra Disk and Premium SSD v2—allow direct performance tuning, making IOPS a meaningful validation parameter. <a href=\"https://learn.microsoft.com/en-us/azure/virtual-machines/disks-performance-options\" rel=\"noopener\" target=\"_blank\">[</a></li>\n<li><strong>Accelerated Networking</strong><br />Azure states that accelerated networking improves VM network performance by reducing latency and CPU utilization via SR-IOV on supported VM sizes. This is exactly the kind of feature that is frequently missed or changed during deployments.&nbsp;</li>\n<li><strong>Tags</strong><br />Azure tags are key-value metadata used for governance, organization, and cost management. Azure also warns that tags are stored as plain text and should not contain sensitive data.&nbsp;</li>\n<li><strong>Availability Zones</strong><br />Validate whether resources are placed in the expected zone(s) or zone-resilient configuration.</li>\n<li><strong>Region</strong></li>\n<li><strong>VM Size</strong></li>\n<li><strong>Disk Type</strong></li>\n<li><strong>Resource Group</strong></li>\n<li><strong>NIC and network configuration</strong></li>\n<li><strong>Optional controls</strong> such as NSG expectations, public/private exposure, backup status, or monitoring configuration</li>\n</ul>\n<p>a { text-decoration: none; color: #464feb; } tr th, tr td { border: 1px solid #e6e6e6; } tr th { background-color: #f5f5f5; }</p>\n<h2>7. Workflow</h2>\n<ol>\n<li>User uploads an Excel sheet or design document</li>\n<li>System extracts expected fields such as resource type, name, SKU, IOPS, tags, zones, region, VM size, and network settings</li>\n<li>Terraform state file is parsed into resource objects</li>\n<li>Azure live resources are queried using Resource Graph and targeted API calls</li>\n<li>Attribute names and values are normalized</li>\n<li>Comparison engine calculates:\n<ul>\n<li><strong>Match</strong></li>\n<li><strong>Design vs Terraform drift</strong></li>\n<li><strong>Terraform vs Azure drift</strong></li>\n<li><strong>Design vs Azure drift</strong></li>\n</ul>\n</li>\n<li>Final report is generated with severity and remediation recommendations</li>\n</ol>\n<h2>8. Drift Report Output</h2>\n<p>A report should look like this:</p>\n<div class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"><table border=\"1\" style=\"border-width: 1px;\"><tbody><tr><th>Resource</th><th>Attribute</th><th>Expected</th><th>Terraform</th><th>Azure Live</th><th>Status</th><th>Severity</th></tr><tr><td>vm-prod-01</td><td>VM Size</td><td>Standard_D8s_v5</td><td>Standard_D8s_v5</td><td>Standard_D4s_v5</td><td>Drift</td><td>High</td></tr><tr><td>nic-prod-01</td><td>Accelerated Networking</td><td>Enabled</td><td>Enabled</td><td>Disabled</td><td>Drift</td><td>High</td></tr><tr><td>disk-prod-01</td><td>Disk SKU</td><td>Premium SSD</td><td>Premium_LRS</td><td>StandardSSD_LRS</td><td>Drift</td><td>High</td></tr><tr><td>vm-prod-01</td><td>Tags.Environment</td><td>Production</td><td>Production</td><td>Prod</td><td>Drift</td><td>Medium</td></tr><tr><td>vm-prod-01</td><td>Zone</td><td>1</td><td>1</td></tr></tbody><colgroup><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /><col style=\"width: 14.29%;\" /></colgroup></table></div>\n<p>&nbsp;</p>\n<h2>9. Creating agents for same and uploading entire python code on the chrysalis</h2>\n<p>&nbsp;</p>\n<h2>10. Future Enhancements</h2>\n<p>Next-step enhancements could include:</p>\n<ul>\n<li>Scheduled drift monitoring</li>\n<li>CI/CD integration after deployment</li>\n<li>ServiceNow or Teams notifications</li>\n<li>AI-generated remediation summaries</li>\n<li>Policy-aware scoring</li>\n<li>Compliance dashboards</li>\n<li>FinOps insights tied to SKU variance</li>\n<li>Historical trend tracking of drift across subscriptions</li>\n</ul>"
